<script>
/* ============================================================================
   ROOM CHAT — short messages between the phones
   ----------------------------------------------------------------------------
   For a table that isn't at one table. The messages live on the room, outside
   any game (`chat` in the projection; the `chat` action in applyRoomAction),
   so they survive the hub and every deal. A 💬 button sits on the room screens
   with a badge for what you haven't read; a message that arrives while the
   sheet is closed shows as a toast. The TV never shows it.

   Three things ride on it:
   - Quick reactions: one tap sends a line from `chat_quick`, for mid-round,
     when typing is too slow.
   - Room events: the server writes who joined and left, what started, and who
     hosts now (`sys` and its details `p`), and each phone says them in its own
     language. They never light the badge or pop a toast.
   - Team chat in أسماء الرموز: a message sent `to: 'team'` carries the team,
     and the server projects it to that team only (chatFor). A spymaster in
     play reads it but can't write to it.
   ========================================================================= */

const roomChat = { seen: 0, notified: 0, inRoom: false, to: 'all', code: '', newFrom: 0 };

const roomChatOpen = () => {
  const m = document.getElementById('chat-modal');
  return !!m && !m.classList.contains('hidden');
};

function roomChatTime(at) {
  try { return new Date(at).toLocaleTimeString(appState.lang === 'ar' ? 'ar-EG' : 'en-GB', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
}

/** This phone's side in أسماء الرموز (or its colour's team in شطرنج بالتصويت), or null in any other game. */
function chatTeamOf(state) {
  if (state && state.game === 'votechess' && state.phase !== 'lobby') {
    const k = typeof vcMyTeam === 'function' ? vcMyTeam(state) : -1;
    return k === -1 ? null : { team: k ? 'b' : 'w' };
  }
  if (!state || state.game !== 'codenames') return null;
  const mine = ((state.shared || {}).teams || {})[Room.me];
  return mine && (mine.team === 'red' || mine.team === 'blue') ? mine : null;
}

/** A spymaster mid-game hears the team channel and can't talk into it. */
const chatTeamMuted = (state, mine) => !!mine && mine.role === 'spymaster' && state.phase === 'playing';

const CHAT_TEAM_ICON = { red: '🔴', blue: '🔵', w: '⚪', b: '⚫' };

/* Up to three emoji and nothing else are drawn big, the way a messenger does. */
const CHAT_EMOJI_ONLY = /^(?:\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|\p{Emoji_Modifier})*\s*){1,3}$/u;

/** A room event, in this phone's language. */
function chatEventText(m, t) {
  const p = m.p || {};
  const fill = (key) => (t[key] || '').replace('{name}', p.name || '');
  switch (m.sys) {
    case 'joined': return (p.bot ? '🤖 ' : '👋 ') + fill('chat_sys_joined');
    // «ده أنا» (1272): a seat given back to its person's new phone (room.js claimSeat).
    case 'back':   return '🔁 ' + fill('chat_sys_back');
    case 'left':   return (p.bot ? '🤖 ' : '🚪 ') + fill('chat_sys_left');
    case 'host':   return '👑 ' + fill('chat_sys_host');
    case 'hub':    return '📋 ' + (t.chat_sys_hub || '');
    case 'predicted': return '🔮 ' + (p.names
      ? (t.chat_sys_predicted || '').replace('{names}', p.names)
      : (t.chat_sys_predicted_none || ''));
    // برنامج السهرة (RoomProgram.js): it began, and it ended with its champions.
    case 'programStart': return '🌙 ' + (t.chat_sys_prog_start || '').replace('{n}', String(p.n || ''));
    case 'programEnd': return '👑 ' + (p.names ? (t.chat_sys_prog_end || '').replace('{names}', p.names) : (t.chat_sys_prog_end_none || ''));
    // المهمة السرية (RoomMission.js): switched on, and the evening's file closed with its champions.
    case 'missionOn': return '🕵️ ' + (t.chat_sys_mission_on || '');
    case 'missionEnd': return '📁 ' + (p.names ? (t.chat_sys_mission_end || '').replace('{names}', p.names) : (t.chat_sys_mission_end_none || ''));
    case 'started': {
      const game = (typeof ROOM_HUB_GAMES !== 'undefined' ? ROOM_HUB_GAMES : []).find(g => g.id === p.game);
      const icon = game ? iconText(game.icon) : '🎮';
      return (icon ? icon + ' ' : '') + (t.chat_sys_started || '').replace('{game}', game ? (t[game.key] || game.id) : (p.game || ''));
    }
  }
  return '';
}

/**
 * Draws the open sheet's messages. A room state arrives for every presence
 * flicker too, so the list is only rewritten when it changed, and only jumps
 * to the bottom for a new message when the reader was already near the bottom
 * (or it is their own message, or the sheet has just opened) - not while they
 * have scrolled up to read.
 */
function renderRoomChat(state, opening) {
  const list = document.getElementById('chat-list');
  if (!list) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const msgs = (state && state.chat) || [];
  const last = msgs.length ? msgs[msgs.length - 1] : null;
  const lastId = last ? String(last.id) : '';
  const grew = list.dataset.lastId !== lastId;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  // «جديد» (the ideas of 7 Oct 2026, 1304): a thin line above the first message unread when the
  // sheet opened (roomChat.newFrom), kept while it stays open.
  const newLine = `<div class="chat-new" data-chat-new><span>${escapeHTML(t.chat_new || '')}</span></div>`;
  let html = msgs.length
    ? msgs.map(m => (roomChat.newFrom && m.id === roomChat.newFrom ? newLine : '') + (() => {
        if (m.sys) {
          const text = chatEventText(m, t);
          const game = m.sys === 'started' && ROOM_HUB_GAMES.find(g => g.id === (m.p || {}).game);
          const art = game && isArtIcon(game.icon) ? iconHtml(game.icon) + ' ' : '';
          return text ? `<div class="chat-sys">${art}${escapeHTML(text)}</div>` : '';
        }
        const team = CHAT_TEAM_ICON[m.team] ? m.team : '';
        const big = CHAT_EMOJI_ONLY.test(String(m.text || '').trim());
        return `
          <div class="chat-msg ${m.from === Room.me ? 'is-mine' : ''} ${team ? 'chat-msg--team chat-msg--' + team : ''}">
            <div class="chat-msg__meta">${team ? `<span class="chat-msg__team">${CHAT_TEAM_ICON[team]} ${escapeHTML(t.chat_team_badge || '')}</span> · ` : ''}${escapeHTML(m.name || '')} · <span class="metric">${roomChatTime(m.at)}</span></div>
            <div class="chat-msg__text ${big ? 'chat-msg__text--big' : ''}">${escapeHTML(m.text || '')}</div>
          </div>`;
      })()).join('')
    : roomChatSending.length ? '' : `<div class="empty"><span class="empty__icon" aria-hidden="true">💬</span>${escapeHTML(t.chat_empty || '')}</div>`;
  html += roomChatSendingHtml(t);
  if (list._chatHtml !== html) { list.innerHTML = html; list._chatHtml = html; }
  const line = opening && roomChat.newFrom ? list.querySelector('[data-chat-new]') : null;
  if (line) list.scrollTop += line.getBoundingClientRect().top - list.getBoundingClientRect().top - 8;
  else if (opening || (grew && (nearBottom || (last && last.from === Room.me)))) list.scrollTop = list.scrollHeight;
  list.dataset.lastId = lastId;
  paintChatComposer(state);
}

/** The reactions row, and in أسماء الرموز the everyone / my team switch. */
function paintChatComposer(state) {
  const t = TRANSLATIONS[appState.lang] || {};

  const quick = document.getElementById('chat-quick');
  if (quick && quick.dataset.lang !== appState.lang) {
    quick.dataset.lang = appState.lang;
    quick.innerHTML = String(t.chat_quick || '').split('|').map(q => q.trim()).filter(Boolean).map(q =>
      `<button type="button" class="chat-quick__chip" onclick="sendRoomChat('${jsStringAttr(q)}', this)">${escapeHTML(q)}</button>`).join('');
    if (typeof watchScrollFade === 'function') watchScrollFade(quick);
  }

  const channel = document.getElementById('chat-channel');
  const note = document.getElementById('chat-channel-note');
  const input = document.getElementById('chat-input');
  const mine = chatTeamOf(state);
  const muted = chatTeamMuted(state, mine);
  if (!mine || muted) roomChat.to = 'all';
  if (channel) {
    if (!mine) {
      channel.hidden = true;
      channel.dataset.sig = '';
    } else {
      const sig = [mine.team, muted, roomChat.to, appState.lang].join('|');
      if (channel.dataset.sig !== sig) {
        channel.dataset.sig = sig;
        channel.innerHTML = `
          <button type="button" class="segmented__item ${roomChat.to === 'all' ? 'is-active' : ''}" onclick="setChatChannel('all')">${escapeHTML(t.chat_to_all || '')}</button>
          <button type="button" class="segmented__item ${roomChat.to === 'team' ? 'is-active' : ''}" ${muted ? 'disabled' : ''} onclick="setChatChannel('team')">${CHAT_TEAM_ICON[mine.team]} ${escapeHTML(t.chat_to_team || '')}</button>`;
      }
      channel.hidden = false;
    }
  }
  if (note) {
    note.textContent = muted ? (t.chat_spymaster_note || '') : '';
    note.hidden = !muted;
  }
  if (input) input.placeholder = roomChat.to === 'team' ? (t.chat_ph_team || '') : (t.chat_ph || '');
}

function setChatChannel(to) {
  roomChat.to = to === 'team' ? 'team' : 'all';
  paintChatComposer(Room.state);
  const input = document.getElementById('chat-input');
  if (input) input.focus();
}

/** Runs on every room state: the badge, the open sheet, and a toast for a message that just came in. */
function syncRoomChat(state, opening) {
  const inRoom = !!(state && Room.isIn && !state.youAreScreen);
  document.body.classList.toggle('has-chat', inRoom);
  const msgs = (state && state.chat) || [];
  // Room events are history, not news: they never count as unread or pop up.
  const talk = msgs.filter(m => !m.sys);
  const last = msgs.length ? msgs[msgs.length - 1] : null;
  const lastTalk = talk.length ? talk[talk.length - 1] : null;
  // Out of the room (closed, removed, left): a chat opened from the banner shuts with it.
  if (!inRoom) { if (roomChatOpen()) closeModal('chat-modal'); roomChat.inRoom = false; roomChat.seen = 0; roomChat.notified = 0; roomChat.to = 'all'; roomChat.newFrom = 0; paintRoomChatBanner(0); return; }
  if (!roomChat.inRoom || roomChat.code !== state.code) {
    // Just arrived (or straight on to another room): what is already here is
    // history, not news - and another room's line ids mean nothing here.
    roomChat.inRoom = true;
    roomChat.code = state.code;
    roomChat.to = 'all';
    roomChat.seen = last ? last.id : 0;
    roomChat.notified = roomChat.seen;
  }
  if (roomChatOpen()) {
    // Opened with something unread: the line goes above the first of it (1304).
    if (opening) {
      const first = talk.find(m => m.id > roomChat.seen && m.from !== Room.me);
      roomChat.newFrom = first ? first.id : 0;
    }
    renderRoomChat(state, opening);
    if (last) roomChat.seen = last.id;
  } else if (lastTalk && lastTalk.id > roomChat.notified && lastTalk.from !== Room.me) {
    const team = CHAT_TEAM_ICON[lastTalk.team] ? CHAT_TEAM_ICON[lastTalk.team] + ' ' : '';
    showToast('💬 ' + team + (lastTalk.name || '') + ': ' + String(lastTalk.text || '').slice(0, 80));
    playSound('tick');
  }
  if (last) roomChat.notified = Math.max(roomChat.notified, last.id);
  const unread = talk.filter(m => m.id > roomChat.seen && m.from !== Room.me).length;
  const badge = document.getElementById('chat-fab-badge');
  if (badge) { badge.textContent = unread ? String(unread) : ''; badge.hidden = !unread; }
  paintRoomChatBanner(unread);
}

/* The room's banner carries the unread count too (the ideas of 7 Oct 2026, 1295): «💬 2» beside the
   code while this phone reads the rules or a tool, a tap opening the chat; gone once it is read. */
function paintRoomChatBanner(unread) {
  const chip = document.getElementById('arb-chat');
  if (!chip) return;
  const n = Math.max(0, Number(unread) || 0);
  const num = document.getElementById('arb-chat-n');
  if (num && num.textContent !== String(n)) num.textContent = n ? String(n) : '';
  const t = TRANSLATIONS[appState.lang] || {};
  const label = (t.room_banner_chat || '').replace('{n}', String(n));
  if (chip.getAttribute('aria-label') !== label) { chip.setAttribute('aria-label', label); chip.title = label; }
  if (chip.hidden !== !n) chip.hidden = !n;
}

function openRoomChat() {
  const m = document.getElementById('chat-modal');
  if (!m || !Room.isIn) return;
  m.classList.remove('hidden');
  syncRoomChat(Room.state, true);
  const input = document.getElementById('chat-input');
  if (input) setTimeout(() => input.focus(), 50);
}
function closeRoomChat() {
  closeModal('chat-modal');
  syncRoomChat(Room.state);
}

/* Lines sent and not yet answered (the owner, 8 Oct 2026: a sent line stayed in the field and
   nothing showed until the server): drawn faint at the foot of the list, «…» for their time,
   until the room's own copy arrives; a refused one goes back into the field. */
const roomChatSending = [];
let roomChatSendSeq = 0;
function roomChatSendingHtml(t) {
  const st = Room.state;
  const me = st && (st.players || []).find(p => p.id === Room.me);
  return roomChatSending.map(m => {
    const big = CHAT_EMOJI_ONLY.test(m.text);
    const team = m.team && CHAT_TEAM_ICON[m.team] ? m.team : '';
    return `
      <div class="chat-msg is-mine ${team ? 'chat-msg--team chat-msg--' + team : ''}" aria-busy="true" style="opacity:0.6">
        <div class="chat-msg__meta">${team ? `<span class="chat-msg__team">${CHAT_TEAM_ICON[team]} ${escapeHTML(t.chat_team_badge || '')}</span> · ` : ''}${escapeHTML((me && me.name) || '')} · <span class="metric">…</span></div>
        <div class="chat-msg__text ${big ? 'chat-msg__text--big' : ''}">${escapeHTML(m.text)}</div>
      </div>`;
  }).join('');
}
function roomChatRepaint() {
  if (roomChatOpen() && Room.state) renderRoomChat(Room.state);
}

/** What was typed, or a quick reaction when one is passed; to the team when that channel is chosen. */
async function sendRoomChat(quick, chip) {
  const input = document.getElementById('chat-input');
  const typed = quick === undefined;
  const text = String(typed ? ((input && input.value) || '') : quick).trim();
  if (!text) return;
  const payload = { text: text };
  if (roomChat.to === 'team' && chatTeamOf(Room.state)) payload.to = 'team';
  // The field empties at once (so a second Enter has nothing to send twice) and the line is
  // drawn as sending; a reaction chip presses in until the room has it.
  if (typed && input) { input.value = ''; input.focus(); }
  if (chip) { chip.disabled = true; chip.style.transform = 'scale(0.94)'; chip.style.opacity = '0.6'; }
  const mine = payload.to ? chatTeamOf(Room.state) : null;
  const line = { id: ++roomChatSendSeq, text: text, team: mine ? mine.team : '' };
  roomChatSending.push(line);
  roomChatRepaint();
  const list = document.getElementById('chat-list');
  if (list && roomChatOpen()) list.scrollTop = list.scrollHeight;
  try {
    await Room.act('chat', payload);
    playSound('tick');
  } catch (e) {
    showToast(e.message || '', 'error');
    // The typed line back where it was, unless something new has been typed since.
    if (typed && input && !input.value.trim()) input.value = text;
  } finally {
    const i = roomChatSending.indexOf(line);
    if (i !== -1) roomChatSending.splice(i, 1);
    if (chip) { chip.disabled = false; chip.style.transform = chip.style.opacity = ''; }
    roomChatRepaint();
  }
}

Room.onChange((state) => syncRoomChat(state));
</script>
