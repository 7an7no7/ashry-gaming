  /* --- SECURITY UTILS --- */
  function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
      );
  }

  /* --- AUDIO SYSTEM --- */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'tick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'alarm') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
  }

  function toggleLanguage() {
    appState.lang = appState.lang === 'ar' ? 'en' : 'ar';
    document.documentElement.lang = appState.lang;
    document.documentElement.dir = appState.lang === 'ar' ? 'rtl' : 'ltr';
    applyTranslations();
    saveToLocal();
    playSound('click');
  }

  function applyTranslations() {
    const t = TRANSLATIONS[appState.lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerHTML = t[key];
    });
    
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (t[key]) el.placeholder = t[key];
    });

    document.getElementById('app-title').innerText = t.title;
  }

  /* --- ERROR HANDLING --- */
  function handleServerFailure(error) {
    setSyncing(false);
    console.error("Server Error:", error);
    const msg = appState.lang === 'ar' ? "حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة مرة أخرى." : "Connection error. Please try again.";
    const title = appState.lang === 'ar' ? "خطأ في الاتصال" : "Connection Error";
    showToast(error.message || msg, title);
  }

  const syncEl = document.getElementById('sync-status');
  function setSyncing(isSyncing) {
    if(isSyncing) syncEl.classList.add('syncing');
    else syncEl.classList.remove('syncing');
  }

   /* --- INITIALIZATION --- */
   document.addEventListener('DOMContentLoaded', function() {
     initializeApp();
     registerServiceWorker();
 
     document.body.addEventListener('click', function initWakeLock() {
         if (typeof requestWakeLock === 'function') {
             requestWakeLock(); 
         }
     }, { once: true }); 
 
     // Safety net: Save state whenever the app is hidden or closed
     window.addEventListener('visibilitychange', () => {
         if (document.visibilityState === 'hidden') saveToLocal();
     });
     window.addEventListener('beforeunload', saveToLocal);
   });
  function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        console.log("Service Worker registration attempted (PWA enabled)");
      });
    }
  }

  function initializeApp() {
    setSyncing(true);
    applyTranslations();

    // Function to hide loader with transition
    const hideLoader = () => {
        const loader = document.getElementById('app-loader');
        if(loader && !loader.classList.contains('opacity-0')) {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.classList.add('hidden');
                loader.style.display = 'none';
            }, 500);
        }
    };

    // Use Injected Data immediately if available
    if (window.SERVER_DATA && window.SERVER_DATA.players) {
        allPlayers = window.SERVER_DATA.players;
        SPY_CATEGORIES = window.SERVER_DATA.spyData || {};
        dataLoaded = true;
        setSyncing(false);
        
        // Render UI if needed
        const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
        if (activeSetup) {
            const listContainer = activeSetup.querySelector('[id$="-player-list"]');
            if (listContainer && typeof renderPlayerChecks === 'function') {
                renderPlayerChecks(listContainer.id);
            }
        }
        
        // Hide loader immediately!
        hideLoader();
    } else {
        // Fallback for cases where injection failed or isn't present
        google.script.run
          .withSuccessHandler(data => {
            if (data.players) allPlayers = data.players;
            SPY_CATEGORIES = data.spyData || {};
            dataLoaded = true;
            setSyncing(false);
            hideLoader();
          })
          .getInitialData();
    }

    loadFromLocal();
    
    // Safety timeout to hide loader if script calls take too long
    setTimeout(hideLoader, 2000);
    
    document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
  }

  function reloadApp() {
      initializeApp();
  }

  function saveToLocal() {
    appState.cachedPlayers = allPlayers; 
    localStorage.setItem('gameTrackerState_v1', JSON.stringify(appState));
  }

  function loadFromLocal() {
    const saved = localStorage.getItem('gameTrackerState_v1');
    
    // 👇 FIX: Added 'input-whoami' and 'play-chess' to the safe list
    const validViews = [
        'menu', 
        'setup-screw', 'play-screw', 
        'setup-monkey', 'play-monkey', 
        'setup-imposter', 'imposter-reveal', 'play-imposter', 
        'setup-domino', 'play-domino', 
        'setup-spin', 'play-spin', 
        'setup-universal', 'play-universal', 
        'timers',
        'setup-whoami', 'input-whoami', 'play-whoami', 
        'setup-charades', 'play-charades',
        'setup-describe', 'play-describe',
        'setup-wordle', 'play-wordle',
        'setup-guessnum', 'play-guessnum',
        'setup-justone', 'play-justone',
        'setup-tourney', 'play-tourney',
        'setup-teams', 'results-teams',
        'setup-reaction', 'play-reaction',
        'play-chess'
    ];

    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            
            const deepMerge = (target, source) => {
                for (const key in source) {
                    if (source[key] instanceof Object && !Array.isArray(source[key]) && target[key] instanceof Object) {
                        Object.assign(target[key], deepMerge(target[key], source[key]));
                    } else {
                        target[key] = source[key];
                    }
                }
                return target;
            };
            appState = deepMerge(appState, parsed);
            
            if (appState.cachedPlayers && appState.cachedPlayers.length > 0) {
                allPlayers = appState.cachedPlayers;
                dataLoaded = true; 
            }

            if (!validViews.includes(appState.currentView)) {
                appState.currentView = 'menu';
            }
            if(appState.isDarkMode) document.body.classList.add('dark');
            
            document.documentElement.lang = appState.lang || 'ar';
            document.documentElement.dir = (appState.lang === 'en') ? 'ltr' : 'rtl';
            applyTranslations();
        } catch (e) {
            console.error("Error loading state", e);
            appState.currentView = 'menu';
        }
    } else {
        appState.currentView = 'menu'; 
    }
    restoreView();
  }

  function toggleDarkMode() {
      appState.isDarkMode = !appState.isDarkMode;
      document.body.classList.toggle('dark');
      
      const icon = appState.isDarkMode ? '☀️' : '🌙';
      const headerIcon = document.getElementById('dark-mode-icon');
      const bottomIcon = document.getElementById('bottom-dark-mode-icon');
      
      if (headerIcon) headerIcon.innerText = icon;
      if (bottomIcon) bottomIcon.innerText = icon;
      
      playSound('click');
      saveToLocal();
  }

  function restoreView() {
    document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
    
    const viewEl = document.getElementById('view-' + appState.currentView);
    
    if (viewEl) {
        // --- RESTORE GAME LOGIC ---
        if (appState.currentView === 'play-screw') renderScrewBoard();
        else if (appState.currentView === 'play-monkey') { renderMonkeyBoard(); updateTimerUI(); }
        else if (appState.currentView === 'imposter-reveal') showRevealStep();
        else if (appState.currentView === 'play-imposter') { renderImposterBoard(); isPaused = true; updateImposterTimerUI(); }
        else if (appState.currentView === 'play-domino') renderDominoBoard();
        else if (appState.currentView === 'play-universal') renderUniversalBoard();
        else if (appState.currentView === 'timers') switchTimerMode('general');
        else if (appState.currentView === 'play-tourney' && typeof renderTournamentBracket === 'function') renderTournamentBracket();
        else if (appState.currentView === 'results-teams' && typeof renderTeams === 'function') renderTeams();
        else if (appState.currentView === 'play-spin') {
            document.getElementById('picker-display').innerText = "???";
            document.getElementById('spin-result-box').classList.add('hidden');
            document.getElementById('spin-btn').disabled = false;
        }
        // 👇 FIX: Full-Screen reload protections added here 👇
        else if (appState.currentView === 'play-chess' && typeof updateChessUI === 'function') {
            updateChessUI(); 
        }
        else if (appState.currentView === 'play-reaction') {
            setTimeout(() => setView('setup-reaction'), 50); 
        }
        else if (appState.currentView === 'play-whoami' || appState.currentView === 'input-whoami') {
            setTimeout(() => setView('setup-whoami'), 50); 
        }
        // 👆 END PROTECTIONS 👆
        else if (appState.currentView.startsWith('setup-')) {
            const listId = appState.currentView.replace('setup-', '') + '-player-list';
            if(typeof renderPlayerChecks === 'function') renderPlayerChecks(listId);
            if(appState.currentView === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
            
            if(appState.currentView === 'setup-charades' && typeof renderCharadesDropdown === 'function') {
                renderCharadesDropdown(); 
            }
        }
        
        viewEl.classList.remove('hidden');
    } else {
        const menuEl = document.getElementById('view-menu');
        if (menuEl) {
            menuEl.classList.remove('hidden');
            appState.currentView = 'menu';
        }
    }
  }

  function setView(viewId) {
    appState.currentView = viewId;
    saveToLocal();
    
    document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
    const viewEl = document.getElementById('view-' + viewId);
    if(viewEl) viewEl.classList.remove('hidden');
    
    closeAllModals();
    clearAllIntervals();

    if(viewId.startsWith('setup-')) {
        const listId = viewId.replace('setup-', '') + '-player-list';
        if(typeof renderPlayerChecks === 'function') renderPlayerChecks(listId);
        if(viewId === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
        
        if(viewId === 'setup-charades' && typeof renderCharadesDropdown === 'function') {
            renderCharadesDropdown(); 
        }
    }
    applyTranslations();
  }

  /* --- CORE UI HELPERS --- */
  function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
  }
  function closeModal(id) { 
    const el = document.getElementById(id);
    if(el) el.classList.add('hidden'); 
  }

  function showToast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    let icon = 'ℹ️';
    if(type === 'success') icon = '✅';
    if(type === 'error') icon = '⚠️';
    const iconSpan = document.createElement('span');
    iconSpan.innerText = icon;
    const msgSpan = document.createElement('span');
    msgSpan.innerText = msg;
    el.appendChild(iconSpan);
    el.appendChild(document.createTextNode(' '));
    el.appendChild(msgSpan);
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 400);
    }, 3000);
  }
  
  function addPlayer() {
    const nameInput = document.getElementById('new-player-name');
    const btn = document.getElementById('add-player-btn');
    const textSpan = document.getElementById('add-player-text');
    const spinner = document.getElementById('add-player-spinner');
    
    const name = nameInput.value.trim();
    if(!name) return;
    playSound('click');
    
    // Check for duplicates case-insensitively and ignore trailing spaces
    const normalizedName = name.toLowerCase();
    const isDuplicate = allPlayers.some(p => p.toLowerCase().trim() === normalizedName);
    
    if(isDuplicate) {
        const msg = appState.lang === 'ar' ? "هذا اللاعب مسجل بالفعل" : "Player already exists";
        showToast(msg, appState.lang === 'ar' ? "تنبيه" : "Alert");
        return;
    }
    
    // UI Loading State
    btn.disabled = true;
    textSpan.classList.add('hidden');
    spinner.classList.remove('hidden');
    nameInput.disabled = true;

    google.script.run
      .withSuccessHandler(players => {
        allPlayers = players;
        saveToLocal();
        
        // Reset UI
        btn.disabled = false;
        textSpan.classList.remove('hidden');
        spinner.classList.add('hidden');
        nameInput.disabled = false;
        nameInput.value = '';
        
        // Success Message
        const successMsg = appState.lang === 'ar' ? `تم إضافة ${name} بنجاح!` : `Added ${name} successfully!`;
        showToast(successMsg, appState.lang === 'ar' ? "نجاح" : "Success");

        const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
        if (activeSetup) {
            const list = activeSetup.querySelector('[id$="-player-list"]');
            if(list && typeof renderPlayerChecks === 'function') renderPlayerChecks(list.id);
        }
      })
      .withFailureHandler((error) => {
          // Reset UI on failure
          btn.disabled = false;
          textSpan.classList.remove('hidden');
          spinner.classList.add('hidden');
          nameInput.disabled = false;
          handleServerFailure(error);
      })
      .addGlobalPlayer(name);
  }
