<script>
  /* --- UI HELPERS --- */

/* ==========================================================================
   PLAYER PICKER
   --------------------------------------------------------------------------
   Every setup screen shows the names this phone knows, as chips. Tap one to
   put that person in the round, tap again to take them out. Typing is only
   for someone new.

   The list is local to the device (see PLAYER_LIBRARY_KEY in JS_Core.html) —
   it used to be a shared column in the spreadsheet, which meant one group's
   names showed up for every other group.
   ========================================================================== */

let pickerEditMode = false;

/**
 * The order chips are drawn in, held still between renders.
 *
 * Whoever is playing is floated to the top — with thirty saved names you should
 * not have to hunt for the four people in the round. But it is only recomputed
 * when you arrive at a screen or add someone, never while you are tapping:
 * chips that reshuffle under your finger are worse than chips in a stale order.
 */
let pickerOrder = [];

function renderActiveChips(containerId, resort) {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (!appState.activePlayers) appState.activePlayers = [];
  const t = TRANSLATIONS[appState.lang];
  const active = appState.activePlayers;
  const isOn = (name) => active.some(p => samePlayer(p, name));

  // Anyone loaded from a saved group who is not in the library still belongs on
  // screen, or they would be in the round with no way to see or remove them.
  const pool = allPlayers.slice();
  active.forEach(p => { if (!pool.some(k => samePlayer(k, p))) pool.push(p); });

  if (resort || !pickerOrder.length) {
    pickerOrder = pool.slice().sort((a, b) => (isOn(b) ? 1 : 0) - (isOn(a) ? 1 : 0));
  } else {
    // Keep the order we had, minus anyone deleted, plus anyone new.
    pickerOrder = pickerOrder.filter(n => pool.some(p => samePlayer(p, n)));
    pool.forEach(p => { if (!pickerOrder.some(n => samePlayer(n, p))) pickerOrder.push(p); });
  }
  const known = pickerOrder;

  const head = `
    <div class="picker__head">
      <span class="eyebrow">${escapeHTML(t.picker_saved || '')}</span>
      ${known.length ? `<button type="button" class="picker__edit ${pickerEditMode ? 'is-on' : ''}"
              onclick="togglePickerEdit('${jsStringAttr(containerId)}')">
          ${escapeHTML(pickerEditMode ? (t.done || 'تم') : (t.edit || 'تعديل'))}
        </button>` : ''}
    </div>`;

  if (!known.length) {
    container.innerHTML = head + `
      <div class="picker__empty">${escapeHTML(t.picker_empty || '')}</div>`;
    return;
  }

  const chips = known.map(name => {
    const on = isOn(name);
    if (pickerEditMode) {
      return `<button type="button" class="pick-chip pick-chip--del"
                onclick="deletePlayerFromLibrary('${jsStringAttr(name)}', '${jsStringAttr(containerId)}')">
                <span aria-hidden="true">✕</span>
                <span class="pick-chip__name">${escapeHTML(name)}</span>
              </button>`;
    }
    return `<button type="button" class="pick-chip ${on ? 'is-on' : ''}" aria-pressed="${on}"
              onclick="togglePlayerInRound('${jsStringAttr(name)}', '${jsStringAttr(containerId)}')">
              ${on ? '<span class="pick-chip__tick" aria-hidden="true">✓</span>' : ''}
              <span class="pick-chip__name">${escapeHTML(name)}</span>
            </button>`;
  }).join('');

  const count = active.length
    ? `${escapeHTML(t.picker_in_round || '')} <b>${active.length}</b>`
    : escapeHTML(t.picker_none || '');

  container.innerHTML = head +
    `<div class="picker__chips"><div class="chip-set">${chips}</div></div>` +
    (pickerEditMode ? '' : `<div class="picker__count">${count}</div>`);

  // The fade only belongs there when something is actually cut off.
  const box = container.querySelector('.picker__chips');
  if (box) box.classList.toggle('is-scrollable', box.scrollHeight > box.clientHeight + 1);
}

/** Put someone in this round, or take them out. */
function togglePlayerInRound(name, containerId) {
  if (!appState.activePlayers) appState.activePlayers = [];
  const wasOn = appState.activePlayers.some(p => samePlayer(p, name));

  appState.activePlayers = wasOn
    ? appState.activePlayers.filter(p => !samePlayer(p, name))
    : appState.activePlayers.concat([name]);

  // Hand-picking someone means you are no longer playing "that saved group".
  appState.currentGroup = '';
  saveToLocal();
  renderSavedGroups();
  renderActiveChips(containerId);
  playSound('click');
  haptic('light');
}

function togglePickerEdit(containerId) {
  pickerEditMode = !pickerEditMode;
  renderActiveChips(containerId);
  playSound('click');
}

/** Forget a name on this phone. Saved groups keep theirs. */
function deletePlayerFromLibrary(name, containerId) {
  removeFromPlayerLibrary(name);
  renderActiveChips(containerId);
  playSound('tick');
  haptic('light');
}

/**
 * The "+" next to the name box. Adds to the library and to this round in one
 * step — nobody types a name they don't want to play with.
 */
function addPlayerFromSetup(btn) {
  const parent = btn.parentElement;
  const input = parent.querySelector('input');
  const typed = input.value.trim();
  if (!typed) { input.focus(); return; }

  const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
  const list = activeSetup && activeSetup.querySelector('[id$="-player-list"]');

  // addToPlayerLibrary returns the spelling already stored, so typing "احمد"
  // when "أحمد" is saved reuses the one you have rather than making a twin.
  const name = addToPlayerLibrary(typed);
  const t = TRANSLATIONS[appState.lang];

  if (!appState.activePlayers) appState.activePlayers = [];
  if (appState.activePlayers.some(p => samePlayer(p, name))) {
    showToast(t.player_already || '', 'warn');
  } else {
    appState.activePlayers.push(name);
    appState.currentGroup = '';
  }

  saveToLocal();
  input.value = '';
  pickerEditMode = false;
  // Re-sort so the name you just typed is at the top rather than at the end of
  // a forty-chip list you would have to scroll to find.
  if (list) renderActiveChips(list.id, true);
  renderSavedGroups();
  playSound('click');
  haptic('light');
  input.focus();
}


/* --- REORDER LIST (TAP-TO-SWAP) --- */
  let selectedReorderIndex = null; // Tracks the first tapped player

  function renderReorderList() {
    const list = document.getElementById('reorder-list');
    list.innerHTML = '';
    
    const tapToSwapText = appState.lang === 'ar' ? 'بدّل مع... 🔄' : 'Swap with... 🔄';

    tempReorderList.forEach((p, idx) => {
        const isSelected = selectedReorderIndex === idx;
        
        // We add 'reorder-item' for our custom CSS, and 'selected' if it's clicked
        const baseClasses = "reorder-item flex justify-between items-center p-4 rounded-xl border mb-2 cursor-pointer transition-all duration-200 active:scale-95 shadow-sm select-none ";
        const selectedClass = isSelected ? "selected" : "border-slate-200 dark:border-slate-700";

        list.innerHTML += `
        <div onclick="handleReorderTap(${idx})" class="${baseClasses} ${selectedClass}">
            <div class="flex items-center gap-3">
                <div class="reorder-num">${idx + 1}</div>
                <span class="font-bold text-lg">${escapeHTML(p.name)}</span>
            </div>
            <div class="text-xs font-bold opacity-70">
                ${isSelected ? tapToSwapText : '👆'}
            </div>
        </div>`;
    });
  }
  
  /**
   * Opens the reorder list, always with nothing selected.
   *
   * That reset is the point: the armed row used to survive a Cancel, so the
   * next tap swapped a pair instead of selecting one, silently.
   */
  function openReorderModal(context, items, buttonLabel) {
    selectedReorderIndex = null;
    reorderContext = context;
    tempReorderList = items;
    const btn = document.getElementById('reorder-save-btn');
    if (btn && buttonLabel) btn.innerText = buttonLabel;
    renderReorderList();
    document.getElementById('reorder-modal').classList.remove('hidden');
  }

  function handleReorderTap(index) {
      if (selectedReorderIndex === null) {
          // First tap: Select the player
          selectedReorderIndex = index;
          playSound('click');
          renderReorderList();
      } else if (selectedReorderIndex === index) {
          // Tapped the exact same player: Cancel selection
          selectedReorderIndex = null;
          playSound('click');
          renderReorderList();
      } else {
          // Second tap on a different player: SWAP!
          const temp = tempReorderList[selectedReorderIndex];
          tempReorderList[selectedReorderIndex] = tempReorderList[index];
          tempReorderList[index] = temp;
          
          // Reset selection, play success sound, and re-render
          selectedReorderIndex = null;
          playSound('success'); 
          renderReorderList();
      }
  }
  
  function saveNewOrder() {
      selectedReorderIndex = null; // Clean up memory
      document.getElementById('reorder-modal').classList.add('hidden');
      
      if (reorderContext === 'imposter') {
          finalizeImposterGame(tempReorderList.map(p => p.name));
      } else if (reorderContext === 'domino-teams') {
          finalizeDominoTeams(tempReorderList.map(p => p.name));
      } else {
          appState.monkey.players = [...tempReorderList];
          appState.monkey.turnIndex = 0; 
          renderMonkeyBoard();
          startTimer();
      }
  }

  /* --- SPIN PICKER --- */
  let pickerInterval = null;
  function runStartSpin() {
      const selected = appState.activePlayers || [];
      if(selected.length < 2) {
          const msg = appState.lang === 'ar' ? 'اختر لاعبين على الأقل' : 'Select at least 2 players';
          return showToast(msg, 'warn');
      }
      appState.spin.players = [...selected];
      setView('play-spin');
      wheelRotation = 0;
      renderWheel();
      const display = document.getElementById('picker-display');
      if (display) display.innerText = '???';
      document.getElementById('spin-result-box').classList.add('hidden');
      document.getElementById('spin-btn').disabled = false;
  }

  /* --- RANDOM PICKER (WHEEL) ------------------------------------------------
   * The tool was always described as a wheel of fortune but rendered as "???"
   * and a button. The wheel below is drawn as SVG, and the result is decided up
   * front so the wheel can be spun to land on it — the same trick a real prize
   * wheel animation uses.
   * ---------------------------------------------------------------------- */

  // Segment colours, walked in order so neighbours never share one.
  const WHEEL_COLORS = [
      '#6d28d9', '#0d9488', '#ea580c', '#2563eb',
      '#e11d48', '#059669', '#7c3aed', '#d97706'
  ];

  let wheelRotation = 0;

  /**
   * Paints the wheel as SVG. Angles run clockwise from twelve o'clock, which is
   * where the needle sits, so slice i covers [i*slice, (i+1)*slice).
   */
  function renderWheel() {
      const wheel = document.getElementById('spin-wheel');
      if (!wheel) return;

      const players = appState.spin.players || [];
      if (players.length === 0) { wheel.innerHTML = ''; return; }

      const R = 50;                 // viewBox is 100x100
      const CX = 50, CY = 50;
      const slice = 360 / players.length;
      const textR = R * 0.66;       // how far out the names sit

      // Polar -> cartesian, 0deg at twelve o'clock, going clockwise.
      const pt = (angle, radius) => {
          const rad = (angle - 90) * Math.PI / 180;
          return [CX + radius * Math.cos(rad), CY + radius * Math.sin(rad)];
      };
      const fmt = (n) => n.toFixed(3);

      let svg = '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">';

      players.forEach((name, i) => {
          const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
          const a0 = i * slice;
          const a1 = (i + 1) * slice;

          if (players.length === 1) {
              svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="' + color + '"/>';
          } else {
              const [x0, y0] = pt(a0, R);
              const [x1, y1] = pt(a1, R);
              const largeArc = slice > 180 ? 1 : 0;
              svg += '<path d="M ' + CX + ' ' + CY +
                     ' L ' + fmt(x0) + ' ' + fmt(y0) +
                     ' A ' + R + ' ' + R + ' 0 ' + largeArc + ' 1 ' + fmt(x1) + ' ' + fmt(y1) +
                     ' Z" fill="' + color + '"/>';
          }
      });

      // Labels on top of every slice, so a name can never be hidden by the
      // neighbouring path's edge.
      players.forEach((name, i) => {
          const mid = i * slice + slice / 2;
          const [tx, ty] = pt(mid, textR);
          // Radial text points back at the viewer past the horizontal; turn
          // those the other way up.
          const flip = mid > 90 && mid < 270;
          const rot = flip ? mid + 90 : mid - 90;
          const short = name.length > 11 ? name.slice(0, 10) + '\u2026' : name;

          svg += '<text x="' + fmt(tx) + '" y="' + fmt(ty) + '"' +
                 ' transform="rotate(' + fmt(rot) + ' ' + fmt(tx) + ' ' + fmt(ty) + ')"' +
                 ' text-anchor="middle" dominant-baseline="central"' +
                 ' fill="#fff" font-size="5.4" font-weight="800"' +
                 ' font-family="Cairo, sans-serif"' +
                 ' style="paint-order: stroke; stroke: rgba(0,0,0,.28); stroke-width: 1.1px">' +
                 escapeHTML(short) + '</text>';
      });

      svg += '</svg>';
      wheel.innerHTML = svg;
      wheel.style.transform = 'rotate(' + wheelRotation + 'deg)';
  }

  function pickRandomPlayer() {
      const players = appState.spin.players;
      if (!players || players.length === 0) return;

      const btn = document.getElementById('spin-btn');
      const wheel = document.getElementById('spin-wheel');
      const resultBox = document.getElementById('spin-result-box');
      if (btn) btn.disabled = true;
      if (resultBox) resultBox.classList.add('hidden');

      const winnerIdx = Math.floor(Math.random() * players.length);
      const slice = 360 / players.length;

      // The needle sits at the top (0deg). To bring the winning slice's centre
      // under it, rotate by -(centre) and add whole turns for the spin itself.
      const target = 360 - (winnerIdx * slice + slice / 2);
      const turns = 4 + Math.floor(Math.random() * 2);
      wheelRotation += turns * 360 + ((target - (wheelRotation % 360)) + 360) % 360;

      if (wheel) wheel.style.transform = 'rotate(' + wheelRotation + 'deg)';
      haptic('medium');

      // Tick while it slows down, then settle.
      let ticks = 0;
      if (pickerInterval) clearInterval(pickerInterval);
      pickerInterval = setInterval(() => {
          playSound('tick');
          if (++ticks > 14) { clearInterval(pickerInterval); pickerInterval = null; }
      }, 150);

      const settle = () => {
          if (pickerInterval) { clearInterval(pickerInterval); pickerInterval = null; }
          finalizePickerResult(players[winnerIdx]);
      };
      // Matches the .wheel transition; a timer rather than transitionend so a
      // reduced-motion user (no transition, no event) still gets a result.
      clearTimeout(pickerSettleTimer);
      pickerSettleTimer = setTimeout(settle, prefersReducedMotion() ? 200 : 3700);
  }

  // Leaving mid-spin: no fanfare and confetti later on another screen, and the
  // button is usable again on the way back.
  let pickerSettleTimer = null;
  onLeaveScreen((from) => {
      if (from !== 'play-spin' || !pickerSettleTimer) return;
      clearTimeout(pickerSettleTimer);
      pickerSettleTimer = null;
      const btn = document.getElementById('spin-btn');
      if (btn) btn.disabled = false;
  });

  function finalizePickerResult(winner) {
      const nameEl = document.getElementById('picked-player-name');
      const liveEl = document.getElementById('picker-display');
      const challengeEl = document.getElementById('picked-challenge');
      const btn = document.getElementById('spin-btn');

      if (nameEl) nameEl.innerText = winner;
      if (liveEl) liveEl.innerText = winner;
      if (challengeEl) challengeEl.innerText = '';

      const box = document.getElementById('spin-result-box');
      if (box) box.classList.remove('hidden');
      playSound('success');
      haptic('double');
      if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      if (btn) btn.disabled = false;
  }

  /* --- UNIVERSAL COUNTER --- */
  function addUniversalPlayer() {
      const input = document.getElementById('univ-new-player');
      const name = input.value.trim();
      if(!name) return;
      const chip = document.createElement('div');
      chip.className = "bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2 m-1";
      chip.innerHTML = `<span>${escapeHTML(name)}</span><button onclick="this.parentElement.remove()" class="text-red-500 font-bold ml-1 mr-1">×</button>`;
      document.getElementById('universal-setup-list').appendChild(chip);
      input.value = '';
      input.focus();
  }
  function startUniversal() {
      const chips = document.querySelectorAll('#universal-setup-list > div > span');
      let players = Array.from(chips).map(c => ({ name: c.innerText, score: 0 }));
      
      // Fallback: If no manual chips, use appState.activePlayers
      if (players.length === 0 && appState.activePlayers && appState.activePlayers.length > 0) {
          players = appState.activePlayers.map(name => ({ name: name, score: 0 }));
      }

      if(players.length === 0) {
          const msg = appState.lang === 'ar' ? 'أضف لاعبين أولاً' : 'Add players first';
          return showToast(msg);
      }
      appState.universal.players = players;
      renderUniversalBoard();
      setView('play-universal');
  }
  function renderUniversalBoard() {
      const div = document.getElementById('universal-board');
      div.innerHTML = '';
      appState.universal.players.forEach((p, idx) => {
          div.innerHTML += `
          <div class="status-row">
              <div class="status-row__name w-1/3 truncate">${escapeHTML(p.name)}</div>
              <div class="metric metric--md tx-accent w-1/3 text-center">${p.score}</div>
              <div class="status-row__actions">
                  <button onclick="modUnivScore(${idx}, 1)" class="control-btn" aria-label="+1">+</button>
                  <button onclick="modUnivScore(${idx}, -1)" class="control-btn control-btn--danger" aria-label="-1">−</button>
              </div>
          </div>`;
      });
  }
  function modUnivScore(idx, val) {
      appState.universal.players[idx].score += val;
      renderUniversalBoard();
      saveToLocal();
      playSound(val > 0 ? 'click' : 'tick');
  }

/* --- TIMERS --- */
  function switchTimerMode(mode) {
      const timerUI = document.getElementById('timer-general-ui');
      if(timerUI) timerUI.classList.add('hidden');
      
      // Tab switching is no longer needed for chess since it has its own screen, 
      // but we keep this for the General Timer view safely.
      if(document.getElementById('tab-general')) {
          document.getElementById('tab-general').className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow";
      }
      if(timerUI) timerUI.classList.remove('hidden');
  }

  function adjustGenTimer(mins) {
      const tm = appState.timers.general;
      tm.time += (mins * 60);
      if(tm.time < 0) tm.time = 0;
      updateGenDisplay();

      // A clock's length is fixed when it is created, so adjusting the time while
      // it runs means restarting it from the new value.
      if (tm.running) {
          if (tm.interval) tm.interval.stop();
          tm.interval = null;
          tm.running = false;
          toggleGenTimer();
      }
  }

  function updateGenDisplay() {
      const t = appState.timers.general.time;
      const m = Math.floor(t / 60).toString().padStart(2,'0');
      const s = (t % 60).toString().padStart(2,'0');
      const el = document.getElementById('gen-timer-display');
      if (el) el.innerText = `${m}:${s}`;
  }

  // Coming back to the timer (or a reload onto it) shows its real time and state.
  function paintGenTimer() {
      const tm = appState.timers.general;
      if (tm.running && !tm.interval) tm.running = false;
      updateGenDisplay();
      const btn = document.getElementById('gen-start-btn');
      const t = TRANSLATIONS[appState.lang] || {};
      if (btn) btn.innerText = tm.running ? t.pause_btn : t.start_btn;
  }

  function toggleGenTimer() {
      const tm = appState.timers.general;
      const btn = document.getElementById('gen-start-btn');
      if(tm.running) {
          if (tm.interval) tm.interval.stop();
          tm.interval = null;
          tm.running = false;
          tm.endsAt = null;
          if (btn) btn.innerText = TRANSLATIONS[appState.lang].start_btn;
      } else {
          if(tm.time <= 0) return;
          tm.running = true;
          // The deadline is saved with the app, so a reload (or iOS dropping the page
          // while the phone is locked) doesn't leave the timer silently stopped.
          tm.endsAt = Date.now() + tm.time * 1000;
          saveToLocal();
          if (btn) btn.innerText = TRANSLATIONS[appState.lang].pause_btn;
          // It keeps counting when the screen is left (a timer for a pot on the
          // stove, a break between games), and rings wherever the phone is.
          tm.interval = createClock({
              seconds: tm.time,
              keepRunning: true,
              onTick: (left) => {
                  tm.time = left;
                  updateGenDisplay();
              },
              onEnd: () => {
                  tm.interval = null;
                  tm.time = 0;
                  tm.running = false;
                  tm.endsAt = null;
                  updateGenDisplay();
                  playSound('alarm');
                  haptic('heavy');
                  const b = document.getElementById('gen-start-btn');
                  if (b) b.innerText = TRANSLATIONS[appState.lang].start_btn;
                  if (appState.currentView !== 'timers') {
                      const t = TRANSLATIONS[appState.lang] || {};
                      showToast('⏰ ' + (t.timer_done || 'خلص وقت المؤقت'), 'success');
                  }
              }
          });
      }
  }

  function resetGenTimer() {
      const tm = appState.timers.general;
      if (tm.interval) tm.interval.stop();
      tm.interval = null;
      tm.running = false;
      tm.endsAt = null;
      tm.time = 0;
      updateGenDisplay();
      document.getElementById('gen-start-btn').innerText = TRANSLATIONS[appState.lang].start_btn;
  }

  /** After a reload: a timer that was running goes on with the time really left, or says it finished meanwhile. */
  function restoreGenTimer() {
      const tm = appState.timers.general;
      if (!tm.endsAt || (tm.interval && tm.interval.isRunning && tm.interval.isRunning())) return;
      const left = Math.ceil((tm.endsAt - Date.now()) / 1000);
      tm.running = false;
      tm.interval = null;
      if (left > 0) {
          tm.time = left;
          toggleGenTimer();
      } else {
          tm.endsAt = null;
          tm.time = 0;
          updateGenDisplay();
          const t = TRANSLATIONS[appState.lang] || {};
          showToast('⏰ ' + (t.timer_done || 'خلص وقت المؤقت'), 'success');
      }
  }
  document.addEventListener('DOMContentLoaded', () => { try { restoreGenTimer(); } catch (e) {} });

  /* --- UPGRADED FULL SCREEN CHESS LOGIC --- */
  function exitChessTimer(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      pauseChess();
      setView('menu');
  }

  function configChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      pauseChess();
      const currentMins = Math.floor(appState.timers.chess.initial / 60);
      document.getElementById('chess-config-input').value = currentMins;
      document.getElementById('chess-config-modal').classList.remove('hidden');
      document.getElementById('chess-config-input').select(); 
  }

  function submitChessConfig() {
      const val = document.getElementById('chess-config-input').value;
      if(val && !isNaN(val) && val > 0) {
          const secs = parseInt(val) * 60;
          appState.timers.chess.initial = secs;
          resetChess(); 
          closeModal('chess-config-modal'); 
          playSound('success'); 
      } else {
          const msg = appState.lang === 'ar' ? 'الرجاء إدخال وقت صحيح!' : 'Please enter valid time!';
          showToast(msg);
      }
  }

  function resetChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      const tm = appState.timers.chess;
      stopChessClock();
      tm.active = null;
      tm.time1 = tm.initial;
      tm.time2 = tm.initial;
      tm.ms1 = tm.initial * 1000;
      tm.ms2 = tm.initial * 1000;
      updateChessUI();
      playSound('click');
  }

  function chessClick(player) {
      const tm = appState.timers.chess;
      // A side that has run out ends the game. Tapping used to start a fresh
      // clock seeded with 0 seconds, which fired the alarm again immediately.
      if (tm.time1 <= 0 || tm.time2 <= 0) {
          const over = appState.lang === 'ar' ? 'انتهى الوقت — أعد الضبط' : "Time's up — reset to play again";
          return showToast(over, 'warn');
      }
      if(player === 1) {
          if(tm.active === 1 || tm.active === null) startChessTimer(2);
      } else if (player === 2) {
          if(tm.active === 2 || tm.active === null) startChessTimer(1);
      }
      playSound('click');
  }

  /* Each side's time is kept to the millisecond (ms1, ms2) and charged exactly
     when its turn ends. Whole seconds charged on each tick made a move inside a
     second free and rounded every move in the mover's favour - in blitz that
     is real time. time1/time2 stay the seconds on screen. */
  const chessMs = (tm, side) => {
      const shown = (side === 1 ? tm.time1 : tm.time2) * 1000;
      const kept = side === 1 ? tm.ms1 : tm.ms2;
      // Never more than the seconds on screen: a reload mid-turn saved the ticks but not the charge.
      return typeof kept === 'number' && Math.ceil(kept / 1000) * 1000 <= shown ? kept : shown;
  };

  function stopChessClock() {
      const tm = appState.timers.chess;
      if (tm.interval && (tm.active === 1 || tm.active === 2) && tm.turnAt && typeof tm.turnMs === 'number') {
          // From what the turn started with: the ticks have been lowering time1/time2 meanwhile.
          const left = Math.max(0, tm.turnMs - (Date.now() - tm.turnAt));
          if (tm.active === 1) { tm.ms1 = left; tm.time1 = Math.ceil(left / 1000); }
          else { tm.ms2 = left; tm.time2 = Math.ceil(left / 1000); }
      }
      tm.turnAt = null;
      tm.turnMs = null;
      if (tm.interval) tm.interval.stop();
      tm.interval = null;
  }

  function startChessTimer(activePlayer) {
      const tm = appState.timers.chess;
      stopChessClock();
      tm.active = activePlayer;
      updateChessUI();

      // One clock per turn, seeded with exactly what that player has banked. A
      // chess clock is the case where counting ticks hurt most: a phone that
      // throttled the tab handed back time the player had actually used.
      tm.turnMs = chessMs(tm, activePlayer);
      tm.turnAt = Date.now();
      tm.interval = createClock({
          ms: tm.turnMs,
          onTick: (left) => {
              if (activePlayer === 1) tm.time1 = left; else tm.time2 = left;
              updateChessUI();
          },
          onEnd: () => {
              if (activePlayer === 1) { tm.time1 = 0; tm.ms1 = 0; } else { tm.time2 = 0; tm.ms2 = 0; }
              tm.turnAt = null;
              updateChessUI();
              chessGameOver();
          }
      });
  }

  // Leaving the chess clock pauses it, charging the turn so far (clearAllIntervals
  // would only stop the clock, losing the part of a second the player used).
  if (typeof onLeaveScreen === 'function') {
      onLeaveScreen((from) => { if (from === 'play-chess' && appState.timers.chess.interval) pauseChess(); });
  }

  function pauseChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      stopChessClock();
      appState.timers.chess.active = null;
      updateChessUI();
  }

  function updateChessUI() {
      const tm = appState.timers.chess;
      const fmt = (t) => {
          const m = Math.floor(t / 60).toString().padStart(2,'0');
          const s = (t % 60).toString().padStart(2,'0');
          return `${m}:${s}`;
      };
      
      const time1El = document.getElementById('chess-time-1');
      const time2El = document.getElementById('chess-time-2');
      if(time1El) time1El.innerText = fmt(tm.time1);
      if(time2El) time2El.innerText = fmt(tm.time2);

      // Both halves used to carry data-i18n="players", so switching language
      // relabelled them both "Players" instead of "Player 1" / "Player 2".
      const who = appState.lang === 'ar' ? 'اللاعب' : 'Player';
      const l1 = document.getElementById('chess-label-1');
      const l2 = document.getElementById('chess-label-2');
      if (l1) l1.innerText = who + ' 1';
      if (l2) l2.innerText = who + ' 2';

      const btn1 = document.getElementById('chess-btn-1');
      const btn2 = document.getElementById('chess-btn-2');
      if(!btn1 || !btn2) return;

      // Both halves stay readable: you need to see the opponent's clock, and
      // the old idle styling (slate-600 on slate-900, 60% opacity) was invisible.
      const stateOf = (side) => {
          const left = side === 1 ? tm.time1 : tm.time2;
          if (left <= 0) return 'is-out';
          if (tm.active === side) return 'is-active';
          return 'is-idle';
      };
      btn1.className = 'chess-half ' + stateOf(1);
      btn2.className = 'chess-half chess-half--flip ' + stateOf(2);
  }

  function hardResetApp() {
    const msg = appState.lang === 'ar' ? 'هل أنت متأكد من حذف جميع البيانات والبدء من جديد؟' : 'Are you sure you want to reset all data and start over?';

    showConfirmModal(msg, () => {
        // 1. Stop all running timers - the general timer too, which clearAllIntervals
        // leaves running on purpose (it rings from any screen) and would ring later.
        const gen = appState.timers && appState.timers.general;
        if (gen && gen.interval && gen.interval.stop) gen.interval.stop();
        clearAllIntervals();
        // Only once confirmed: Cancel used to wipe the recent games anyway.
        if (typeof forgetRecent === 'function') forgetRecent();
        // Everything else this phone kept under the app's name - bests, the
        // daily streak, room options, the last name - except how the device
        // itself is set up (motion, screen size, the home-screen install).
        const KEEP = ['ashryMotion', 'ashryUiScale', 'ashryInstallHaveIt', 'ashryInstalledIcon', 'ashryInstallAskedAt', 'ashryIconSnooze', 'ashryPlayedOnce'];
        try {
            Object.keys(localStorage)
                .filter(k => k.indexOf('ashry') === 0 && KEEP.indexOf(k) === -1)
                .forEach(k => localStorage.removeItem(k));
        } catch (e) {}

        // 2. Clear Local Storage. The room session lives under its own key, so
        // without this a "reset everything" still silently rejoined the old room
        // on the next load.
        localStorage.removeItem('gameTrackerState_v1');
        try { if (typeof Room !== 'undefined' && Room.isIn) Room.leave(); } catch (e) {}
        localStorage.removeItem('ashryRoom_v1');
        // The saved names and groups are this phone's too, and "start from
        // scratch" has to mean it.
        localStorage.removeItem(PLAYER_LIBRARY_KEY);
        localStorage.removeItem('ashry_saved_groups');
        if (typeof forgetSeenLists === 'function') forgetSeenLists();

        // 4. Reset Global Variables (Clean Slate)
        allPlayers = []; 
        dataLoaded = false;
        lastSelectedPlayers = [];
        switchData = { monkeyRow: null, targetRow: null, targetCol: null };
        tempReorderList = [];
        
        // 5. Reset App State to Defaults (MATCHES JS_CORE DEFINITION)
        const isDark = appState.isDarkMode;

        appState = {

  /* --- Put it on the home screen ------------------------------------------
     A phone that opens the app in its browser is asked to add it to the home
     screen, with the steps for that phone and that browser - and on Android,
     where Chrome allows it, a real one-tap install button instead of steps.
     Only on a phone (not a tablet, a computer or a TV), never in the
     home-screen copy, never over a game or a room: it waits until the home,
     مع بعض or الأدوات is on screen and the intro has gone - and only once
     this phone has played something (been on a game's play screen and come
     back): a first visit used to get it straight after the intro, before a
     single game, which is the moment it is easiest to dismiss. Once a visit: a
     visit is a page load at least INSTALL_VISIT_GAP_MS after the last ask,
     so a reload mid-evening doesn't ask again, and tomorrow does. "I already
     added it" stops it in this browser for good (a browser can't see the
     home-screen copy by itself); Settings → تثبيت التطبيق always opens it.
     ------------------------------------------------------------------------ */
  const INSTALL_ASKED_KEY = 'ashryInstallAskedAt';
  const INSTALL_HAVE_KEY = 'ashryInstallHaveIt';
  const INSTALL_VISIT_GAP_MS = 30 * 60 * 1000;
  const INSTALL_ROOT_VIEWS = ['menu', 'together', 'tools'];
  const INSTALL_PLAYED_KEY = 'ashryPlayedOnce';
  // Played: left a game's play screen, one phone or a room (not the lobby, not a TV).
  onLeaveScreen((from) => {
      if (!/^play-/.test(from) && !(/^room-/.test(from) && from !== 'room-lobby' && from !== 'room-tv')) return;
      try { localStorage.setItem(INSTALL_PLAYED_KEY, '1'); } catch (e) {}
  });
  let installAskPending = true;     // this page load hasn't asked yet
  let installPromptEvent = null;    // Chrome's install prompt, kept for our own button

  const inStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  /** The phone and browser this is, for the steps; null when it isn't a phone. */
  function installTarget() {
      const ua = navigator.userAgent || '';
      const ipad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const ios = !ipad && /iPhone|iPod/.test(ua);
      const android = /Android/.test(ua) && /Mobile/.test(ua);   // tablets and TVs say no "Mobile"
      if (!ios && !android) return null;
      // The browser inside another app (Instagram, Facebook, TikTok, Google...) can't add anything.
      const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|TikTok|musical_ly|Bytedance|GSA\//.test(ua)
          || (android && /; wv\)/.test(ua));
      let browser;
      if (inApp) browser = 'inapp';
      else if (ios) browser = /CriOS/.test(ua) ? 'chrome' : /FxiOS|EdgiOS|OPiOS|YaBrowser/.test(ua) ? 'other' : 'safari';
      else if (/SamsungBrowser/.test(ua)) browser = 'samsung';
      else if (/Firefox/.test(ua)) browser = 'firefox';
      else if (/Chrome\//.test(ua) && !/EdgA|OPR|YaBrowser|MiuiBrowser|HuaweiBrowser/.test(ua)) browser = 'chrome';
      else browser = 'other';
      return { os: ios ? 'ios' : 'android', browser: browser };
  }

  function installStepsFor(who) {
      if (!who) return ['inst_desktop_1', 'inst_desktop_2'];

  }

  function paintInstallSheet() {
      const t = TRANSLATIONS[appState.lang] || {};
      const who = installTarget();
      const canPrompt = !!installPromptEvent;
      const glyph = (m, name) => (INSTALL_GLYPHS[name]
          ? '<span class="install-key" aria-hidden="true">' + INSTALL_GLYPHS[name] + '</span>'
          : m);
      const list = document.getElementById('install-steps');
      if (list) list.innerHTML = installStepsFor(who).map(k => '<li><span>' + String(t[k] || '').replace(/\{(\w+)\}/g, glyph) + '</span></li>').join('');
      const show = (id, on) => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !on); };
      show('install-how', !canPrompt);
      show('install-now', canPrompt);
      show('install-ok', !canPrompt);
      show('install-later', canPrompt);
      show('install-have', !!who && !canPrompt);   // Chrome only offers its prompt when it isn't installed
  }

  function showInstallHelp() {
      const t = TRANSLATIONS[appState.lang] || {};
      if (inStandalone()) {
          showToast(t.inst_already || '', 'success');
          return;
      }
      paintInstallSheet();
      const el = document.getElementById('install-help-modal');
      if (el) el.classList.remove('hidden');
  }

  /** Asks, if this visit hasn't yet and everything above says it may. */
  function maybeAskInstall() {
      if (!installAskPending) return;
      let have = false;
      let last = 0;
      let played = true;
      try {
          have = localStorage.getItem(INSTALL_HAVE_KEY) === '1';
          last = Number(localStorage.getItem(INSTALL_ASKED_KEY) || 0);
          played = localStorage.getItem(INSTALL_PLAYED_KEY) === '1';
      } catch (e) { /* no storage (private browsing): ask this visit anyway */ }
      if (!installTarget() || inStandalone() || have || Date.now() - last < INSTALL_VISIT_GAP_MS) {
          installAskPending = false;
          return;
      }
      // Not yet: nothing played yet, somewhere else (a game, a room link), the
      // intro still up, or another popup open. The next arrival on the home tries again.
      if (!played) return;
      if (INSTALL_ROOT_VIEWS.indexOf(appState.currentView) === -1) return;
      const loader = document.getElementById('app-loader');
      if (loader && loader.style.display !== 'none' && !loader.classList.contains('hidden')) return;
      if (document.querySelector('.modal-overlay:not(.hidden)')) return;
      installAskPending = false;
      try { localStorage.setItem(INSTALL_ASKED_KEY, String(Date.now())); } catch (e) {}
      showInstallHelp();
  }

  /** From setView (the home, مع بعض, الأدوات) and from the end of the intro. */
  function installAskSoon() {
      if (installAskPending) setTimeout(maybeAskInstall, 900);
  }

  function installHaveIt() {
      const t = TRANSLATIONS[appState.lang] || {};
      try { localStorage.setItem(INSTALL_HAVE_KEY, '1'); } catch (e) {}
      closeModal('install-help-modal');
      showToast(t.inst_have_it_done || '', 'success');
  }

  /** Chrome's own install dialog, from our button. An event can prompt once. */
  async function installNow() {
      const ev = installPromptEvent;
      if (!ev) { paintInstallSheet(); return; }
      installPromptEvent = null;
      try {
          ev.prompt();
          const choice = await ev.userChoice;
          if (choice && choice.outcome === 'accepted') closeModal('install-help-modal');
          else paintInstallSheet();
      } catch (e) {
          paintInstallSheet();
      }
  }

  window.addEventListener('beforeinstallprompt', (e) => {
      // On a phone our sheet replaces Chrome's small bar; elsewhere Chrome keeps its own.
      if (installTarget()) e.preventDefault();
      installPromptEvent = e;
      const el = document.getElementById('install-help-modal');
      if (el && !el.classList.contains('hidden')) paintInstallSheet();
  });
  window.addEventListener('appinstalled', () => {
      const t = TRANSLATIONS[appState.lang] || {};
      installPromptEvent = null;
      closeModal('install-help-modal');
      showToast(t.inst_done || '', 'success');
  });

  /* --- The icon on an iPhone home screen ----------------------------------
     iOS fetches the apple-touch-icon once, when the app is added, and no
     page can add itself again. So when the icon changes, a copy on the home
     screen keeps the old one until it is removed and re-added. This notices
     such a copy - an iPhone, running standalone, whose marker is older than
     the icon this build ships (window.ICON_VERSION, from
     tools/site.config.json) - and shows one banner with the steps. Android
     needs none of this: the versioned icon addresses refresh it by themselves.
     ------------------------------------------------------------------------ */
  const ICON_INSTALLED_KEY = 'ashryInstalledIcon';
  const ICON_SNOOZE_KEY = 'ashryIconSnooze';
  const isIOSDevice = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandaloneApp = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  /** Shows the banner when the installed copy is older than the icon. `force` is for looking at it. */
  function checkIconBanner(force) {
      const current = Number(window.ICON_VERSION || 0);
      if (!force && (!current || !isIOSDevice() || !isStandaloneApp())) return;
      let installed = Number(localStorage.getItem(ICON_INSTALLED_KEY) || 0);
      if (!installed) {
          // No marker yet. A copy that already holds names or a saved game was
          // added before the marker existed, so with the old icon; a fresh
          // install carries the current one.
          const usedBefore = !!(localStorage.getItem('gameTrackerState_v1') || localStorage.getItem(PLAYER_LIBRARY_KEY));
          installed = usedBefore ? 1 : current;
          try { localStorage.setItem(ICON_INSTALLED_KEY, String(installed)); } catch (e) {}
      }
      if (!force && installed >= current) return;
      if (!force && Number(localStorage.getItem(ICON_SNOOZE_KEY) || 0) > Date.now()) return;
      const el = document.getElementById('icon-banner');
      if (el) el.classList.remove('hidden');
  }
  function hideIconBanner() {
      const el = document.getElementById('icon-banner');
      if (el) el.classList.add('hidden');
  }
  /** "Later": a week of quiet. */
  function snoozeIconBanner() {
      try { localStorage.setItem(ICON_SNOOZE_KEY, String(Date.now() + 7 * 24 * 3600 * 1000)); } catch (e) {}
      hideIconBanner();
  }
  /** "Done", or "leave it": either way this copy is not asked again for this icon. */
  function iconBannerDone() {
      try { localStorage.setItem(ICON_INSTALLED_KEY, String(window.ICON_VERSION || 0)); } catch (e) {}
      closeModal('icon-steps-modal');
      hideIconBanner();
  }
  function openIconSteps() {
      const el = document.getElementById('icon-steps-modal');
      if (el) el.classList.remove('hidden');
  }
  const appLink = () => (window.SERVER_DATA && window.SERVER_DATA.webAppUrl) || (location.origin + location.pathname);
  /** From a home-screen copy a _blank link opens in Safari; ?install=1 opens the steps there. */
  function openInSafari() {
      window.open(appLink() + '?install=1', '_blank');
  }
  async function copyAppLink() {
      const t = TRANSLATIONS[appState.lang];
      try {
          await navigator.clipboard.writeText(appLink());
          showToast(t.icon_link_copied || '', 'success');
      } catch (e) {
          showToast(appLink());
      }
  }

  // Auto-hide install button if already standalone
  function checkInstallButton() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const btn = document.getElementById('install-btn-menu');
      if (btn && isStandalone) {
          btn.style.display = 'none';
      }
  }

  window.addEventListener('load', checkInstallButton);

HELP_ENTRIES.forEach(e => {
  const g = typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[e.key] : null;
  if (g) {
    e.icon = g.icon; e.accent = g.accent; e.title = g.title;

/**
 * What this player most likely wants explained.

 * Sitting in a room lobby with a game already chosen, the question is about
 * that game — the lobby itself is self-explanatory once you are looking at it.
 */
function helpContextKey() {
  const view = appState.currentView;
  if (view === 'room-lobby' && typeof Room !== 'undefined' && Room.isIn
      && Room.state && Room.state.game && helpEntry(Room.state.game)) {
    return Room.state.game;
  }
  return HELP_FOR_VIEW[view] || null;
}

/* --- Search --------------------------------------------------------------
   Arabic writes the same word several ways — أ إ آ for ا, ة for ه, ى for ي —
   and diacritics are optional. Matching raw strings means a search for
   "اسماء" misses "أسماء".
   ------------------------------------------------------------------------- */
function helpNormalise(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/[ً-ْٰ]/g, '')      // harakat
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/[ىي]/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ء')
    .replace(/\s+/g, ' ')
    .trim();
}

let helpSearchTerm = '';

function openHelpModal() {
  helpSearchTerm = '';
  const box = document.getElementById('help-search');
  if (box) box.value = '';
  const clear = document.getElementById('help-search-clear');
  if (clear) clear.classList.add('hidden');

  renderHelpContent();
  // Reading the rules mid-round on one phone doesn't cost the turn.
  if (exitGameOf(appState.currentView)) pauseClocksForSheet();
  document.getElementById('help-modal').classList.remove('hidden');
  // Light up the nav item while the sheet is open, the way Home does — it is
  // the only nav button that never showed you it had done anything.
  document.getElementById('nav-help')?.classList.add('is-active');
  playSound('click');
  haptic('light');

  // Always open at the top: the context card is the answer, and the sheet
  // would otherwise still be scrolled to wherever it was left.
  const body = document.getElementById('help-content-area');
  if (body) body.scrollTop = 0;
}

/** Jump from the context card to a related entry and open it. */
function helpJumpTo(key) {
  const card = document.getElementById('help-card-' + key);
  if (!card) return;
  card.open = true;
  card.scrollIntoView({
    behavior: (typeof prefersReducedMotion === 'function' && prefersReducedMotion()) ? 'auto' : 'smooth',
    block: 'center'
  });
  playSound('click');
}

function filterHelp(value) {
  helpSearchTerm = helpNormalise(value);
  const clear = document.getElementById('help-search-clear');
  if (clear) clear.classList.toggle('hidden', !value);
  renderHelpContent();
}

function clearHelpSearch() {
  const box = document.getElementById('help-search');
  if (box) { box.value = ''; box.focus(); }
  filterHelp('');
}

/**
 * The sections of the list: the rooms and the basics first, then a section
 * per kind of game in the order the home uses (CATALOG_GROUPS), then the
 * tools. HELP_ENTRIES stays the registry of what each entry looks like;
 * the catalog says where it sits.
 */
function helpSections() {
  const start = ['rooms', 'tv', 'players', 'settings'].map(helpEntry).filter(Boolean);
  const groups = (typeof CATALOG_GROUPS !== 'undefined' ? CATALOG_GROUPS : []).map(grp => ({
    id: grp.id, icon: grp.icon, title: grp.title,
    entries: (typeof GAME_CATALOG !== 'undefined' ? GAME_CATALOG : []).filter(g => g.group === grp.id).map(g => helpEntry(g.id)).filter(Boolean)
  }));
  const placed = {};
  start.concat(...groups.map(g => g.entries)).forEach(e => { placed[e.key] = true; });
  const rest = HELP_ENTRIES.filter(e => !placed[e.key]);
  return [{ id: 'start', icon: '🚀', title: 'help_sec_start', entries: start }]
    .concat(groups)
    .concat(rest.length ? [{ id: 'more', icon: '📎', title: 'help_sec_more', entries: rest }] : []);
}

/** "👥 3–12 · ⏱ 10 min · 📱📲" for an entry that is a game in the catalog. */
function helpMetaHtml(key, t) {
  const g = (typeof CATALOG_BY_ID !== 'undefined') ? CATALOG_BY_ID[key] : null;
  if (!g || typeof catalogMeta !== 'function') return '';
  return `<span class="help-meta">${catalogMeta(g, t, false)}</span>`;
}

/** The one-line pitch from the catalog, above the rules. */
function helpLeadHtml(key, t) {
  const g = (typeof CATALOG_BY_ID !== 'undefined') ? CATALOG_BY_ID[key] : null;
  const desc = g ? (t[g.desc] || '') : '';
  return desc ? `<p class="help-lead">${escapeHTML(desc)}</p>` : '';
}

function renderHelpContent() {
  const lang = appState.lang;
  const t = TRANSLATIONS[lang];
  const rules = GAME_RULES[lang] || {};
  const searching = !!helpSearchTerm;

  const titleOf = (e) => t[e.title] || e.key;

  /** One accordion row. The accent comes from data-accent on the card. */
  const createItem = (e) => {
    const content = rules[e.key];
    // An entry with no rules written yet is left out entirely rather than
    // rendered as an accordion that opens onto nothing.
    if (!content) return '';
    return `
      <details class="help-game-card" id="help-card-${e.key}" data-accent="${e.accent}">
        <summary>
          <span class="help-game-card__icon" aria-hidden="true">${iconHtml(e.icon)}</span>
          <span class="help-game-card__text">
            <span class="help-game-card__name">${escapeHTML(titleOf(e))}</span>
            ${helpMetaHtml(e.key, t)}
          </span>
          <span class="help-game-card__chev" aria-hidden="true">▾</span>
        </summary>
        <div class="help-game-text" style="padding: 0 var(--sp-3) var(--sp-3)">
          ${helpLeadHtml(e.key, t)}
          ${content}
        </div>
      </details>`;
  };

  // Searching looks inside the rules too, not just the names — people search
  // for the thing they are stuck on ("assassin", "قاتلة"), not the title.
  const matches = (e) => {
    if (!searching) return true;
    const body = String(rules[e.key] || '').replace(/<[^>]+>/g, ' ');
    const g = (typeof CATALOG_BY_ID !== 'undefined') ? CATALOG_BY_ID[e.key] : null;
    const desc = g ? (t[g.desc] || '') : '';
    return helpNormalise(titleOf(e) + ' ' + desc + ' ' + body).indexOf(helpSearchTerm) !== -1;
  };

  let shown = 0;
  const html = helpSections().map(sec => {
    const entries = sec.entries.filter(matches).filter(e => rules[e.key]);
    if (!entries.length) return '';
    shown += entries.length;
    return `
      <section class="section help-section">
        <div class="section__head">
          <span class="section__emoji" aria-hidden="true">${sec.icon}</span>
          <h2 class="section__title">${escapeHTML(t[sec.title] || sec.id)}</h2>
          <span class="section__rule"></span>
          <span class="section__count metric">${entries.length}</span>
        </div>
        ${entries.map(createItem).join('')}
      </section>`;
  }).join('');

  const box = document.getElementById('help-sections');
  if (box) box.innerHTML = html;
  const empty = document.getElementById('help-empty');
  if (empty) empty.classList.toggle('hidden', !(searching && shown === 0));

  // A single hit gets opened for you rather than asking for one more tap.
  if (searching && shown === 1) {
    const only = document.querySelector('#help-content-area .help-game-card');
    if (only) only.open = true;
  }

  renderHelpContext(helpContextKey(), rules, t, searching);
}

/** The card for the screen help was opened from. */
function renderHelpContext(key, rules, t, searching) {
  const slot = document.getElementById('help-context');
  if (!slot) return;

  // While searching, the results are the answer — a card about the screen
  // behind the sheet is just something in the way of them.
  if (searching) { slot.innerHTML = ''; return; }

  const entry = key ? helpEntry(key) : null;

  if (!entry || !rules[entry.key]) {
    // No particular screen — the menu, or a search in progress. On the menu,
    // say what the app is for rather than leaving a gap where the answer goes.
    slot.innerHTML = (appState.currentView === 'menu' || appState.currentView === 'tools') ? `
      <div class="help-hero" data-accent="violet">
        <div class="help-hero__head">
          <span class="help-hero__icon" aria-hidden="true">👋</span>
          <div class="help-hero__meta">
            <div class="help-hero__title">${escapeHTML(t.help_welcome || '')}</div>
          </div>
        </div>
        <div class="help-hero__body">${t.help_intro || ''}</div>
      </div>` : '';
    return;
  }

  const title = t[entry.title] || entry.key;
  // A game that also plays over the room layer gets a way through to how that
  // works, because it is the next thing people ask.
  const jump = (entry.room || entry.roomOnly)
    ? `<button class="help-jump" onclick="helpJumpTo('rooms')">
         <span aria-hidden="true">📱</span>
         <span>${escapeHTML(entry.roomOnly ? (t.help_room_only || '') : (t.help_room_too || ''))}</span>
       </button>`
    : '';

  slot.innerHTML = `
    <div class="help-hero" data-accent="${entry.accent}">
      <div class="help-hero__head">
        <span class="help-hero__icon" aria-hidden="true">${iconHtml(entry.icon)}</span>
        <div class="help-hero__meta">
          <div class="help-hero__eyebrow">${escapeHTML(t.help_here || '')}</div>
          <div class="help-hero__title">${escapeHTML(title)}</div>
          ${helpMetaHtml(entry.key, t)}
        </div>
      </div>
      <div class="help-hero__body">${helpLeadHtml(entry.key, t)}${rules[entry.key]}</div>
      ${jump}
    </div>`;
}


/* --- KEEP SCREEN AWAKE (WAKE LOCK) --- */
let wakeLock = null;

let wakeLockWatching = false;

/* The screen stays on while a game is being played - a passed phone going
   dark mid-round is worse than a battery - and sleeps as usual on the home,
   the tabs and the setup screens. setView calls syncWakeLock on every change. */
const wantsWakeLock = (view) => /^(play-|room-|reveal-|imposter-reveal$|input-|results-)/.test(view || '') && view !== 'room-join';

async function requestWakeLock() {
    if (!('wakeLock' in navigator) || !wantsWakeLock(appState.currentView)) return;
    if (wakeLock && !wakeLock.released) return;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {
        return;   // denied, or the tab isn't visible yet - not worth surfacing
    }

    // Registered once. It used to be added inside requestWakeLock, so every
    // game start stacked another listener on the same event.
    if (wakeLockWatching) return;
    wakeLockWatching = true;
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWakeLock();
    });
}

function syncWakeLock(view) {
    if (wantsWakeLock(view)) { requestWakeLock(); return; }
    if (wakeLock && !wakeLock.released) {
        const lock = wakeLock;
        wakeLock = null;
        lock.release().catch(() => {});
    }
}

/* =========================================
   SMART GROUP MANAGER LOGIC (FIXES ALL BUGS)
   ========================================= */

// 1. Opens the Modal and prepares the data
function saveCurrentGroup() {
    if (!appState.activePlayers || appState.activePlayers.length === 0) {
        showToast(appState.lang === 'ar' ? "أضف لاعباً واحداً على الأقل!" : "Add at least 1 player!", "error");
        return;
    }

    // Populate the update dropdown
    const updateSelect = document.getElementById('update-group-select');
    let groups = readSavedGroups();
    
    updateSelect.innerHTML = `<option value="">${groupPickerLabel()}</option>`;
    Object.keys(groups).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        updateSelect.appendChild(opt);
    });

    document.getElementById('custom-group-name-input').value = "";
    document.getElementById('group-name-modal').classList.remove('hidden');
}

/** The one placeholder both group dropdowns share; it was Arabic-only. */
function groupPickerLabel() {
    return appState.lang === 'ar' ? '-- اختر لتحديث مجموعة --' : '-- Select a group to update --';
}

// 2. Action: Create a Brand New Group
function saveAsNewGroup() {
    const inputEl = document.getElementById('custom-group-name-input');
    const groupName = inputEl.value.trim();
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اكتب اسماً للمجموعة!" : "Enter a group name!", "error");
        return;
    }

    if (appState.activePlayers.length < 2) {
        showToast(appState.lang === 'ar' ? "المجموعة الجديدة تحتاج لاعبين (2) على الأقل!" : "New groups need at least 2 players!", "error");
        return;
    }

    saveDataToGroup(groupName, [...appState.activePlayers]);
}

// 3. Action: Update an Existing Group (Add or Replace)
function updateExistingGroup(mode) {
    const selectEl = document.getElementById('update-group-select');
    const groupName = selectEl.value;

    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة من القائمة لتحديثها!" : "Select a group to update!", "error");
        return;
    }

    let groups = readSavedGroups();
    let currentGroupPlayers = groups[groupName] || [];

    if (mode === 'add') {
        // Merge without duplicates
        const newSet = new Set([...currentGroupPlayers, ...appState.activePlayers]);
        saveDataToGroup(groupName, Array.from(newSet));
        showToast(appState.lang === 'ar' ? `تم تحديث ${groupName}` : `Updated ${groupName}`, "success");
    
    } else if (mode === 'replace') {
        if (appState.activePlayers.length < 2) {
            showToast(appState.lang === 'ar' ? "يجب اختيار لاعبين (2) على الأقل للاستبدال!" : "Select at least 2 players to replace!", "error");
            return;
        }
        saveDataToGroup(groupName, [...appState.activePlayers]);
        showToast(appState.lang === 'ar' ? `تم استبدال مجموعة ${groupName}` : `Replaced ${groupName}`, "success");
    }
}

// Helper: Saves data and cleans up UI
function saveDataToGroup(groupName, playersArray) {
    let groups = readSavedGroups();
    groups[groupName] = playersArray;
    writeSavedGroups(groups);
    
    closeModal('group-name-modal');
    renderSavedGroups(); 
    loadGroup(groupName); // Auto-load it to show the result
    playSound('success');
}

// 4. Loading Logic
function loadGroup(groupName) {
    const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
    if (!activeSetup) return;

    const listContainer = activeSetup.querySelector('[id$="-player-list"]');
    if (!listContainer) return;

    appState.currentGroup = groupName || "";

    if (!groupName || groupName === "") {
        appState.activePlayers = [];
        saveToLocal();
        renderActiveChips(listContainer.id);
        renderSavedGroups(); // Sync other dropdowns
        return; 
    }

    let groups = readSavedGroups();
    const selectedNames = groups[groupName];

    if (selectedNames && selectedNames.length > 0) {
        appState.activePlayers = [...selectedNames];
        saveToLocal();
        renderActiveChips(listContainer.id);
        renderSavedGroups(); // Sync other dropdowns
        playSound('click');
    }
}

// 5. Delete Logic (From Modal)
function deleteGroupFromModal() {
    const select = document.getElementById('update-group-select');
    const groupName = select.value;
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة أولاً!" : "Select a group!", "error");
        return;
    }
    
    const msg = appState.lang === 'ar' ? `هل أنت متأكد من حذف "${groupName}" نهائياً؟` : `Delete "${groupName}"?`;
    
    if (typeof showConfirmModal === 'function') {
        showConfirmModal(msg, () => {
            let groups = readSavedGroups();
            delete groups[groupName];
            writeSavedGroups(groups);
            
            if (appState.currentGroup === groupName) {
                appState.currentGroup = "";
            }
            
            renderSavedGroups(); 
            // Re-populate modal select
            const updateSelect = document.getElementById('update-group-select');
            updateSelect.innerHTML = `<option value="">${groupPickerLabel()}</option>`;
            Object.keys(groups).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                updateSelect.appendChild(opt);
            });
            
            showToast(appState.lang === 'ar' ? "تم الحذف" : "Deleted", "success");
        });
    }
}

/* Saved groups live in this phone's storage. A browser that blocks storage (all
   cookies off, a kiosk, a TV) throws on the read, which stopped every chip tap
   halfway: the list changed but the chips never redrew. */
function readSavedGroups() {
  try {
    const g = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
    return g && typeof g === 'object' && !Array.isArray(g) ? g : {};
  } catch (e) { return {}; }
}
function writeSavedGroups(groups) {
  try { localStorage.setItem('ashry_saved_groups', JSON.stringify(groups)); } catch (e) {}
}

function renderSavedGroups() {
    const selects = document.querySelectorAll('.saved-groups-select');
    if (selects.length === 0) return;

    let groups = readSavedGroups();
    const defaultText = appState.lang === 'ar' ? '-- اختر مجموعة محفوظة --' : '-- Select Saved Group --';
    
    selects.forEach(select => {
        select.innerHTML = `<option value="">${defaultText}</option>`;
        Object.keys(groups).forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.innerText = `${name} (${groups[name].length} ${appState.lang === 'ar' ? 'لاعب' : 'players'})`;
            select.appendChild(option);
        });
        
        // Restore selection
        select.value = appState.currentGroup || "";
    });
}


// The iOS datalist-positioning workaround that used to live here went with the
// datalist itself: saved names are chips you tap now, so nothing autocompletes.
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(renderSavedGroups, 1000);
});


/* ============================================================================
   LEAVING A GAME — the header's back button, on a game screen
   ----------------------------------------------------------------------------
   A table that is bored of a game had to finish the round to pick another one:
   the room's "another game" button only appears once a round is over, and on
   one phone the back arrow silently dropped the round. Both now open this
   sheet, which offers the way out that is actually wanted - another game -
   next to the quieter ones.
   ========================================================================= */

/** The catalog game a screen would abandon if you left it; null for the tools. */
function exitGameOf(viewId) {
  const up = ((typeof VIEW_META !== 'undefined' && VIEW_META[viewId]) || {}).up || '';
  if (up.indexOf('setup-') !== 0 || typeof GAME_CATALOG === 'undefined') return null;
  const g = GAME_CATALOG.find(x => x.setup === up);
  return (g && g.group !== 'tools') ? g : null;
}

/** Whether the back button on this screen asks before leaving (openExitSheet with no tab). */
function exitSheetAsks(view) {
  if (!document.getElementById('exit-modal-body')) return false;
  if ((view || '').indexOf('room-') === 0 && view !== 'room-join') {
    return typeof Room !== 'undefined' && !!Room.isIn && !!Room.state;
  }
  return !!exitGameOf(view || '');
}

const exitSheetRow = (label, onclick, kind) =>
  `<button class="btn ${kind || 'btn--neutral'}" onclick="${onclick}">${escapeHTML(label)}</button>`;

/**
 * Opens the sheet when leaving would end something. Returns false when there is
 * nothing to ask about, and the back button then behaves as it always did.
 */
function openExitSheet(navTarget) {
  const view = (appState.currentView || '');
  const t = TRANSLATIONS[appState.lang] || {};
  const body = document.getElementById('exit-modal-body');
  if (!body) return false;

  const inRoom = view.indexOf('room-') === 0 && view !== 'room-join'
              && typeof Room !== 'undefined' && Room.isIn && Room.state;
  // A bottom tab from a room screen doesn't abandon anything: the room stays
  // open behind the banner. Only a round on one phone needs asking about.
  if (navTarget && inRoom) return false;
  const game = inRoom ? null : exitGameOf(view);
  if (!inRoom && !game) return false;

  if (inRoom) {
    const state = Room.state;
    const playing = state.phase !== 'lobby' && !!state.game;
    const rows = [];
    if (playing && state.youAreHost) rows.push(exitSheetRow(t.exit_room_change || '', 'exitSheetBackToHub()', 'btn--primary btn--lg'));
    if (playing && !state.youAreHost) rows.push(exitSheetRow(t.exit_room_ask || '', 'exitSheetAsk()', 'btn--secondary btn--lg'));
    rows.push(exitSheetRow(t.exit_room_menu || '', "closeModal('exit-modal'); setView('menu')"));
    rows.push(exitSheetRow(t.exit_room_leave || '', "closeModal('exit-modal'); roomLeave()", 'btn--danger-soft'));
    body.innerHTML = `
      <div class="modal-icon" aria-hidden="true">🎲</div>
      <div class="sheet__title">${escapeHTML(t.exit_room_title || '')}</div>
      <p class="sheet__subtitle">${escapeHTML(playing && !state.youAreHost ? (t.exit_room_host_note || '') : (t.exit_room_sub || ''))}</p>
      <div class="btn-stack">${rows.join('')}</div>
      <div class="modal-actions">
        <button class="btn btn--ghost" onclick="closeModal('exit-modal')">${escapeHTML(t.exit_keep || '')}</button>
      </div>`;
  } else {
    const up = (VIEW_META[view] || {}).up || 'menu';
    // From a bottom tab, the first way out is where that tab goes.
    const primary = navTarget && navTarget !== 'menu'
      ? exitSheetRow(t.exit_leave_game || 'اخرج من اللعبة', `closeModal('exit-modal'); navGo('${jsStringAttr(navTarget)}')`, 'btn--primary btn--lg')
      : exitSheetRow(t.exit_pick_another || '', "closeModal('exit-modal'); setView('menu')", 'btn--primary btn--lg');
    body.innerHTML = `
      <div class="modal-icon" aria-hidden="true">${iconHtml(game.icon)}</div>
      <div class="sheet__title">${escapeHTML(t.exit_game_title || '')}</div>
      <p class="sheet__subtitle">${escapeHTML(t.exit_game_sub || '')}</p>
      <div class="btn-stack">
        ${primary}
        ${exitSheetRow(t.exit_settings || '', `closeModal('exit-modal'); setView('${jsStringAttr(up)}')`)}
      </div>
      <div class="modal-actions">
        <button class="btn btn--ghost" onclick="closeModal('exit-modal')">${escapeHTML(t.exit_keep || '')}</button>
      </div>`;
    // The round waits while the table reads this.
    pauseClocksForSheet();
  }
  const modal = document.getElementById('exit-modal');
  if (modal) modal.classList.remove('hidden');
  return true;
}

/** The host ends the round for everyone; the room lands back on its game picker. */
function exitSheetBackToHub() {
  closeModal('exit-modal');
  roomAct('backToHub');
}

/** Not the host: say it in the room chat rather than sit there bored. */
async function exitSheetAsk() {
  closeModal('exit-modal');
  const t = TRANSLATIONS[appState.lang] || {};
  try {
    await Room.act('chat', { text: t.exit_room_ask_msg || '' });
    showToast(t.exit_room_asked || '', 'success');
  } catch (e) {
    showToast(e.message || '', 'error');
  }
}
