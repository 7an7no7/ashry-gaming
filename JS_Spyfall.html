<script>
/* --- SPYFALL (الموقع السري) GAME LOGIC --- */
/* The places (SPYFALL_DB) live in SpyfallPlaces.js, shared with the rooms server. */

/*
   "Play again" deals a new place to the same table and keeps a running score,
   as a room does: caught (and wrong about the place) is a point to everyone
   else; escaped or knew the place is two to each spy. Starting from the setup
   screen starts the score over. The labels follow the app's language; the
   places and jobs follow the games' language.
*/

const spyfallState = {
  players: [],
  location: null,
  spies: [],
  playerRoles: {},
  revealIndex: 0,
  timerSeconds: 480,
  timerClock: null,
  crossedLocations: new Set(),
  scores: {},
  scoreId: 0
};

function setupSpyfall() {
  setView('setup-spyfall');
}

/**
 * Deals a place. From the setup screen: the players picked there, the score
 * starts over. `again` (the result's "play again"): the same table, the score
 * carries on.
 */
function startSpyfallGame(again) {
  const replay = again === true && spyfallState.players.length >= 3;
  const selected = replay ? spyfallState.players.slice() : (appState.activePlayers ? [...appState.activePlayers] : []);
  if (!replay) saveActivePlayers(selected);

  if (selected.length < 3) {
    const msg = appState.lang === 'en' ? "Need at least 3 players!" : "تحتاج إلى 3 لاعبين على الأقل!";
    showToast(msg);
    return;
  }
  if (!replay) { spyfallState.scores = {}; spyfallState.scoreId = Date.now(); }
  selected.forEach(p => { if (typeof spyfallState.scores[p] !== 'number') spyfallState.scores[p] = 0; });

  const lang = contentLang();
  const db = SPYFALL_DB[lang] || SPYFALL_DB.ar;
  const loc = freshPick('spyfall:' + lang, db, 1, { key: l => l.location })[0];
  spyfallState.location = loc;

  // Spies count (default 1, or 2 if selected)
  // Two spies among three to five players leaves too few people who know the
  // place for the questions to catch anyone.
  const askedSpies = parseInt(document.getElementById('spyfall-spies-count')?.value || '1', 10);
  const spyCount = selected.length >= 6 ? Math.min(Math.max(askedSpies, 1), 2) : 1;
  if (askedSpies > spyCount) {
    showToast(appState.lang === 'en' ? 'Two spies need 6+ players — playing with one.' : 'جاسوسين محتاجين 6 لاعبين أو أكتر — هنلعب بجاسوس واحد.');
  }
  const shuffledPlayers = shuffleArray(selected);
  spyfallState.players = shuffledPlayers;
  // Drawn separately from the order the phone is passed in: taking the first names
  // of that same order made the first person handed the phone always the spy.
  spyfallState.spies = shuffleArray(selected).slice(0, spyCount);

  // Assign roles to civilians
  const civilianRoles = shuffleArray(loc.roles);
  spyfallState.playerRoles = {};
  let roleIdx = 0;
  shuffledPlayers.forEach(p => {
    if (spyfallState.spies.includes(p)) {
      spyfallState.playerRoles[p] = { isSpy: true };
    } else {
      const r = civilianRoles[roleIdx % civilianRoles.length];
      roleIdx++;
      spyfallState.playerRoles[p] = { isSpy: false, role: r };
    }
  });

  const durationMin = parseInt(document.getElementById('spyfall-duration')?.value || '8', 10);
  spyfallState.timerSeconds = durationMin * 60;
  spyfallState.revealIndex = 0;
  spyfallState.crossedLocations = new Set();

  closeModal('spyfall-result-modal');
  closeModal('spyfall-spy-guess-modal');
  playSound('click');
  showSpyfallRevealStep();
  setView('reveal-spyfall');
}

function showSpyfallRevealStep() {
  if (spyfallState.revealIndex >= spyfallState.players.length) {
    startSpyfallDiscussion();
    return;
  }

  const playerName = spyfallState.players[spyfallState.revealIndex];
  document.getElementById('spyfall-reveal-name').innerText = playerName;
  revealSpyfallSecret();
  holdCardReset(document.getElementById('spyfall-hold'));
}

/** Fills the back of the hold card. No sound: it would tell the table who the spy is. */
function revealSpyfallSecret() {
  const playerName = spyfallState.players[spyfallState.revealIndex];
  const info = spyfallState.playerRoles[playerName];
  const titleEl = document.getElementById('spyfall-card-title');
  const detailEl = document.getElementById('spyfall-card-detail');
  const t = TRANSLATIONS[appState.lang] || {};

  if (info.isSpy) {
    titleEl.innerText = '🕵️ ' + (t.spy_you_are || '');
    detailEl.innerHTML = `
      <div class="space-y-2">
        <div class="eyebrow tx-danger">${escapeHTML(t.spy_location || '')}: ❓</div>
        <p class="text-sm opacity-90">${escapeHTML(t.spy_you_hint || '')}</p>
      </div>
    `;
  } else {
    titleEl.innerText = '🏢 ' + (t.spy_civilian || 'مواطن في المكان');
    detailEl.innerHTML = `
      <div class="space-y-2">
        <div class="eyebrow">${escapeHTML(t.spy_location || '')}</div>
        <div class="text-2xl font-black tx-warning">${escapeHTML(spyfallState.location.location)}</div>
        <div class="eyebrow">${escapeHTML(t.spy_your_job || '')}</div>
        <div class="text-xl font-bold">${escapeHTML(info.role)}</div>
      </div>
    `;
  }
}

function doneSpyfallRevealStep() {
  spyfallState.revealIndex++;
  showSpyfallRevealStep();
}

function startSpyfallDiscussion() {
  setView('play-spyfall');
  renderSpyfallLocationBoard();
  setSpyfallPauseLabel(false);

  if (spyfallState.timerClock) spyfallState.timerClock.stop();

  let left = spyfallState.timerSeconds;
  updateSpyfallTimerUI(left);

  spyfallState.timerClock = createClock({
    seconds: left,
    onTick: (val) => {
      updateSpyfallTimerUI(val);
      if (val === 60) playSound('tick');
    },
    // Only here: the tick for 0 arrives as well, and opening the vote from
    // both played the alarm and built the list twice.
    onEnd: () => {
      playSound('alarm');
      openSpyfallAccuseModal();
    }
  });
}

function updateSpyfallTimerUI(sec) {
  const el = document.getElementById('spyfall-timer-display');
  if (!el) return;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  el.innerText = `${String(m).padStart(2, '0')}:${s < 10 ? '0' : ''}${s}`;
}

function toggleSpyfallPause() {
  if (spyfallState.timerClock) setSpyfallPauseLabel(spyfallState.timerClock.toggle());
}

function setSpyfallPauseLabel(paused) {
  const btn = document.getElementById('spyfall-pause-btn');
  if (!btn) return;
  const t = TRANSLATIONS[appState.lang] || {};
  // The key moves with the label, or the next applyTranslations would put
  // "pause" back on a clock that is already paused.
  btn.setAttribute('data-i18n', paused ? 'resume_btn' : 'pause_btn');
  btn.textContent = paused ? (t.resume_btn || '') : (t.pause_btn || '');
}

function renderSpyfallLocationBoard() {
  const lang = contentLang();
  const db = SPYFALL_DB[lang] || SPYFALL_DB.ar;
  const list = document.getElementById('spyfall-locations-list');
  if (!list) return;

  list.innerHTML = db.map(item => {
    const crossed = spyfallState.crossedLocations.has(item.location);
    return `
      <button type="button" onclick="toggleSpyfallCrossLocation('${jsStringAttr(item.location)}')"
              class="p-2.5 rounded-xl text-xs font-bold text-center transition-all ${crossed ? 'opacity-30 line-through bg-black/10 dark:bg-white/10' : 'bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 shadow-sm border border-black/5 dark:border-white/5'}">
        ${escapeHTML(item.location)}
      </button>
    `;
  }).join('');
}

function toggleSpyfallCrossLocation(locName) {
  if (spyfallState.crossedLocations.has(locName)) {
    spyfallState.crossedLocations.delete(locName);
  } else {
    spyfallState.crossedLocations.add(locName);
  }
  renderSpyfallLocationBoard();
}

function openSpyfallAccuseModal() {
  const t = TRANSLATIONS[appState.lang] || {};
  const list = document.getElementById('spyfall-accuse-list');
  if (list) {
    list.innerHTML = spyfallState.players.map(p => `
      <button class="ballot-option" onclick="voteSpyfallAccused('${jsStringAttr(p)}')">
        <span class="ballot-option__label">${escapeHTML(p)}</span>
        <span class="badge badge--danger">${escapeHTML(t.spy_badge || 'جاسوس؟')}</span>
      </button>
    `).join('');
  }
  document.getElementById('spyfall-accuse-modal').classList.remove('hidden');
}

const spyfallSpyNames = () => spyfallState.spies.join(appState.lang === 'en' ? ' & ' : ' و ');

function voteSpyfallAccused(player) {
  closeModal('spyfall-accuse-modal');
  if (spyfallState.timerClock) spyfallState.timerClock.stop();
  const isSpy = spyfallState.spies.includes(player);
  const t = TRANSLATIONS[appState.lang] || {};

  if (isSpy) {
    // Spy caught! Spy gets one chance to guess the location!
    playSound('alarm');
    openSpyfallGuessModal(player);
  } else {
    // The table voted out someone who knew the place: the spy gets away.
    playSound('alarm');
    finishSpyfallGame(false, (t.spy_escaped || '').replace('{name}', spyfallSpyNames()), player);
  }
}

function openSpyfallGuessModal(spyName) {
  const lang = contentLang();
  const db = SPYFALL_DB[lang] || SPYFALL_DB.ar;
  const list = document.getElementById('spyfall-spy-guess-grid');
  if (list) {
    list.innerHTML = db.map(item => `
      <button onclick="spySubmitLocationGuess('${jsStringAttr(item.location)}', '${jsStringAttr(spyName)}')"
              class="p-3 rounded-xl bg-black/5 dark:bg-white/5 active:bg-amber-500 active:text-black font-bold text-xs transition-colors text-center">
        ${escapeHTML(item.location)}
      </button>
    `).join('');
  }
  document.getElementById('spyfall-spy-guess-modal').classList.remove('hidden');
}

function spySubmitLocationGuess(locName, spyName) {
  closeModal('spyfall-spy-guess-modal');
  const isCorrect = (locName === spyfallState.location.location);
  const t = TRANSLATIONS[appState.lang] || {};

  if (isCorrect) {
    playSound('alarm');
    finishSpyfallGame(false, (t.spy_stole || '').replace('{name}', spyName));
  } else {
    playSound('success');
    confetti({ particleCount: 150 });
    finishSpyfallGame(true, (t.spy_caught || '').replace('{name}', spyName) + ' · ' + (t.spy_guess_was || '') + ': ' + locName);
  }
}

function finishSpyfallGame(civiliansWon, message, accused) {
  const t = TRANSLATIONS[appState.lang] || {};
  const resultModal = document.getElementById('spyfall-result-modal');
  const titleEl = document.getElementById('spyfall-result-title');
  const detailEl = document.getElementById('spyfall-result-detail');

  // The running score, as a room keeps it.
  if (civiliansWon) spyfallState.players.forEach(p => { if (!spyfallState.spies.includes(p)) spyfallState.scores[p] = (spyfallState.scores[p] || 0) + 1; });
  else spyfallState.spies.forEach(p => { spyfallState.scores[p] = (spyfallState.scores[p] || 0) + 2; });

  if (civiliansWon) {
    titleEl.innerText = '🎉 ' + (t.table_wins || 'الطاولة كسبت!');
    titleEl.className = "sheet__title tx-success";
  } else {
    titleEl.innerText = '🕵️ ' + (t.spy_wins || 'الجاسوس كسب!');
    titleEl.className = "sheet__title tx-danger";
  }

  const board = spyfallState.players.map(p => ({ id: p, name: p, score: spyfallState.scores[p] || 0 }))
    .sort((a, b) => b.score - a.score);
  detailEl.innerHTML = `
    <p class="text-base mb-4 font-semibold">${escapeHTML(message)}</p>
    <div class="p-4 rounded-xl bg-black/5 dark:bg-white/5 space-y-1 text-sm">
      ${accused ? `<div><b>${escapeHTML(t.cham_accused || '')}:</b> ${escapeHTML(accused)}</div>` : ''}
      <div><b>${escapeHTML(t.spy_location || '')}:</b> ${escapeHTML(spyfallState.location.location)}</div>
      <div><b>${escapeHTML(spyfallState.spies.length > 1 ? (t.reveal_spies_were || '') : (t.reveal_spy_was || ''))}</b> ${spyfallState.spies.map(escapeHTML).join(', ')}</div>
    </div>
    <div class="modal-section">${renderScoreboard(board)}</div>
  `;

  partyModalButton('spyfall-result-modal', 'spyfall-result-exit', 'exitSpyfallPlay()', t.exit_settings || '');
  resultModal.classList.remove('hidden');
  if (typeof animateScoreboards === 'function') animateScoreboards({ code: 'spyfall', game: String(spyfallState.scoreId) });
}

/** The result's main button: a new place for the same table, the score carrying on. */
function resetSpyfallPlay() {
  if (spyfallState.timerClock) spyfallState.timerClock.stop();
  closeModal('spyfall-result-modal');
  startSpyfallGame(true);
}

/** Back to the setup screen, for other players or another length. */
function exitSpyfallPlay() {
  if (spyfallState.timerClock) spyfallState.timerClock.stop();
  closeModal('spyfall-result-modal');
  setupSpyfall();
}
</script>
