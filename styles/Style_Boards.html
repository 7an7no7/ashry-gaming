}
.bank-deed__head { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; padding: 1.6cqw 2.4cqw; }
.bank-deed__name { font-family: var(--font-display); font-weight: 800; font-size: 1.3em; line-height: 1.1; }
/* The price on a darker pill under white ink, a lighter one under dark ink (white on a white 40% pill was 3.4:1). */
.bank-deed__price { font-weight: 800; background: rgba(0, 0, 0, 0.22); border-radius: 99px; padding: 0.2em 0.6em; }
.bank-deed__head.is-light .bank-deed__price { background: rgba(255, 255, 255, 0.4); }
.bank-deed__body { padding: 1.4cqw 2.4cqw 1.8cqw; display: flex; flex-direction: column; gap: 0.4cqw; }
.bank-deed__row { display: flex; justify-content: space-between; color: var(--text-2); font-weight: 600; padding: 0.15em 0.4em; border-radius: 6px; }
.bank-deed__row b { color: var(--text); }
.bank-deed__row.is-on { background: var(--accent-soft); color: var(--accent-ink); }
.bank-deed__row.is-on b { color: var(--accent-ink); }
.bank-deed__note, .bank-deed__owner { margin: 0.4em 0 0; font-size: 0.85em; color: var(--text-2); display: flex; align-items: center; gap: 0.4em; }
.bank-dot { width: 0.75em; height: 0.75em; border-radius: 50%; flex: none; }
.bank-card {
  width: min(100%, 70cqw);
  border-radius: 2.4cqw;
  overflow: hidden;
  background: var(--surface-solid);
  box-shadow: 0 0 0 1px var(--border), 0 3px 10px rgba(60, 40, 20, 0.12);
  font-size: clamp(11px, 3.1cqw, 21px);
}
.bank-card__head { display: flex; align-items: center; gap: 0.5em; padding: 1.4cqw 2.4cqw; font-family: var(--font-display); font-weight: 800; color: #ffffff; }
.bank-card--luck .bank-card__head { background: #d99a00; color: #1d1b26; }
.bank-card--court .bank-card__head { background: #2a6f9e; }
.bank-card__head .bank-ic { width: 1.3em; }
.bank-card__text { margin: 0; padding: 2.2cqw 2.6cqw 2.6cqw; font-weight: 700; line-height: 1.45; color: var(--text); }

/* --- the side: the players, the time, the bar, the panels -------------------------- */
.bank-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.bank-layout__side { display: contents; }
.bank-layout__board { width: 100%; max-width: 36rem; margin-inline: auto; }
.bank-layout__side > .bank-over { order: -3; }
.bank-layout__side > .bank-top { order: -2; }
.bank-top { display: flex; flex-direction: column; gap: var(--sp-2); }
.bank-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.bank-strip--n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bank-strip--n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bank-chip { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.bank-chip.is-turn { border-color: transparent; box-shadow: 0 0 0 2px var(--pc); }
.bank-chip.is-out { opacity: 0.45; }
.bank-chip.is-away { opacity: 0.6; }
.bank-chip__tok { width: 1.7rem; height: 1.7rem; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--pc); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45); font-size: 0.95rem; }
.bank-chip__who { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.bank-chip__name { font-size: 0.78rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bank-chip__name small { font-size: 0.7rem; }
.bank-chip__cash { font-size: 0.78rem; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.bank-chip__cash b { color: var(--text); font-weight: 800; }
.bank-time { display: flex; justify-content: center; gap: var(--sp-2); }

.bank-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2) var(--sp-3);
  padding: var(--sp-3);
  border-radius: 20px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  box-shadow: 0 -2px 14px rgba(40, 30, 20, 0.06);
}
.bank-bar.is-mine { border-color: transparent; box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgba(40, 30, 20, 0.1); }
.bank-bar__txt { flex: 1 1 10rem; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bank-bar__t1 { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.1rem; line-height: 1.25; }
.bank-bar__tok { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--pc); font-size: 0.9rem; flex: none; }
.bank-bar__t2 { font-size: 0.8rem; font-weight: 500; color: var(--text-2); }
.bank-bar__btns { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.bank-bar__tools { flex-basis: 100%; display: flex; gap: var(--sp-2); }
.bank-bar__tools .is-on { background: var(--accent-soft); color: var(--accent-ink); }

.bank-offer { font-size: 0.85rem; font-weight: 600; color: var(--text-2); text-align: center; }
.bank-offer.card { display: flex; flex-direction: column; gap: var(--sp-2); text-align: start; color: var(--text); }
.bank-offer__title { margin: 0; font-weight: 800; }
.bank-offer__sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.bank-offer__sides div { display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2); border-radius: 12px; background: var(--surface-2); }
.bank-offer__sides span { font-size: 0.75rem; color: var(--text-2); }
.bank-offer__sides b { font-size: 0.85rem; }
.bank-offer--mine { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); }

.bank-panel { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.bank-panel__title { margin: 0; font-weight: 800; }
.bank-mrow { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 0; border-top: 1px solid var(--hairline); }
.bank-mrow__band { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
.bank-mrow__name { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 0; border: 0; background: none; color: var(--text); font: 700 0.88rem/1.25 var(--font); text-align: start; }
.bank-mrow__name small { font-weight: 500; font-size: 0.72rem; color: var(--text-2); }
.bank-mrow.is-mort .bank-mrow__name { opacity: 0.7; }
.bank-mrow__acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.bank-tto { justify-content: flex-start; }
.bank-tcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.bank-tcol { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2); border-radius: 12px; background: var(--surface-2); }
.bank-tcol__title { margin: 0; font-size: 0.8rem; font-weight: 800; color: var(--text-2); }
.bank-tchips { display: flex; flex-wrap: wrap; gap: 4px; }
.bank-tchip { min-height: 2rem; padding: 2px 8px; border-radius: 10px; border: 1.5px solid var(--gc, var(--border)); background: var(--surface-solid); color: var(--text); font: 700 0.75rem/1.2 var(--font); }
.bank-tchip.is-on { background: var(--gc, var(--accent)); color: #ffffff; }
.bank-tchip.is-mort { border-style: dashed; }
.bank-tcash { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--text-2); }
.bank-tcash input { width: 100%; min-width: 0; height: 2.25rem; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-solid); color: var(--text); font: 700 0.9rem var(--font); }

.bank-log { display: flex; flex-direction: column; gap: 4px; }
.bank-log__line { font-size: 0.8rem; font-weight: 500; color: var(--text-2); line-height: 1.4; }
.bank-log__line.is-latest { color: var(--text); font-weight: 600; }
.bank-over { display: flex; flex-direction: column; gap: var(--sp-3); }
.bank-over__title { margin: 0; text-align: center; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.2rem; }
.bank-over .podium { margin: 0; }

/* --- the setup screen and the room's lobby --------------------------------------- */
.bank-tokpicks { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tap), 1fr)); gap: var(--sp-2); }
.bank-tokpick { width: 100%; min-width: var(--tap); max-width: 3rem; aspect-ratio: 1; justify-self: center; padding: 0; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-solid); font-size: 1.4rem; display: grid; place-items: center; cursor: pointer; }
.bank-tokpick.is-active { box-shadow: 0 0 0 3px var(--surface-solid), 0 0 0 5.5px var(--accent); }
.bank-picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.bank-pick { min-width: 0; min-height: 3.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-solid); color: var(--text); cursor: pointer; }
.bank-pick:disabled { cursor: default; }
.bank-pick.is-taken:not(.is-mine) { opacity: 0.55; }
.bank-pick.is-mine { border-color: transparent; box-shadow: 0 0 0 2.5px var(--accent); }
.bank-pick__icon { font-size: 1.4rem; line-height: 1; }
.bank-pick__who { max-width: 100%; font-size: 0.72rem; font-weight: 700; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --- a phone on its side, and every wide screen: the board takes the height --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .bank-layout { display: grid; grid-template-columns: auto minmax(14rem, 23rem); justify-content: center; align-items: start; gap: var(--sp-4); }
  .bank-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  .bank-layout__board {
    position: sticky;
    top: 0;
    width: min(calc(var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem), 58vw);
    max-width: none;
    margin: 0;
  }
  .bank-strip, .bank-strip--n2, .bank-strip--n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bank-bar { position: static; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-bank, .shell__main > #view-room-bank { max-width: 76rem; }
  .bank-layout { gap: var(--sp-6); grid-template-columns: auto minmax(16rem, 25rem); }
  .bank-layout__board { width: min(calc(var(--app-h, 100vh) - var(--header-h) - 2.5rem), 62vw); }
}

/* --- the TV ------------------------------------------------------------------------- */
.bank--tv { height: 100%; min-height: 0; display: flex; }
.bank--tv .bank-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 30rem); justify-content: center; align-items: center; gap: calc(var(--tv-gap) * 2.5); }
.bank--tv .bank-layout__side { display: flex; flex-direction: column; justify-content: center; gap: var(--tv-gap); min-width: 0; }
.bank--tv .bank-layout__board { position: static; width: min(calc(var(--app-h, 100vh) - 17vmin), 60vw); max-width: none; margin: 0; }
.bank--tv .bank-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tv-gap); }
.bank--tv .bank-chip { padding: 1vmin 1.4vmin; border-radius: var(--tv-r); gap: 1.2vmin; }
.bank--tv .bank-chip__tok { width: 4.6vmin; height: 4.6vmin; font-size: var(--tv-sm); }
.bank--tv .bank-chip__name { font-size: var(--tv-sm); }
.bank--tv .bank-chip__cash { font-size: var(--tv-sm); }
.bank--tv .bank-bar { position: static; padding: 1.4vmin 1.8vmin; border-radius: var(--tv-r); }
.bank--tv .bank-bar__t1 { font-size: var(--tv-md); }
.bank--tv .bank-bar__t2, .bank--tv .bank-log__line, .bank--tv .bank-offer { font-size: var(--tv-sm); }
.bank--tv .bank-over__title { font-size: var(--tv-md); }
@media (orientation: portrait) {
  .bank--tv { height: auto; }
  .bank--tv .bank-layout { grid-template-columns: minmax(0, 1fr); }
  .bank--tv .bank-layout__board { width: min(100%, 62vh); justify-self: center; }
}

@media (prefers-reduced-motion: reduce) {
  .bank-die .die { transition: none; }
  .bank-die.is-rolling .die { animation: none; }
}

/* ==========================================================================
   24. خمّن مين
   JS_GuessWho.html. The owner's option ب «ألبوم ناعم» (29 Sep 2026): white
   cards with a soft face on a pale backdrop and the name under it; a face put
   down fades to grey, shrinks and is crossed out. Cards big enough to read
   their details: 4 or 5 a row on a phone held upright (--gw-cols-n), and a
   face held down opens big (.gw-zoom). The layout is the duels': upright, the board with the question above
   it and the bar of what to do stuck under it; on a phone on its side and
   from 900px the board takes the height (sized off --app-h and the board's
   own --gw-aspect) with the rest in a column beside it.
   ========================================================================== */
.gw { display: flex; flex-direction: column; gap: var(--sp-3); }
.gw-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.gw-layout__side { display: contents; }
.gw-layout__side > .duel-head { order: -4; }
.gw-layout__side > .gw-mine { order: -3; }
.gw-layout__side > .gw-qa { order: -2; }
.gw-layout__board { width: 100%; max-width: 34rem; margin-inline: auto; }
.gw-board { display: grid; grid-template-columns: repeat(var(--gw-cols-n, var(--gw-cols, 6)), minmax(0, 1fr)); gap: 0.375rem; }
.gw-board--small { gap: 0.25rem; }

.gw-card {
  position: relative;
  min-width: 0;
  aspect-ratio: 5 / 6;
  display: flex;
  flex-direction: column;
  padding: 0.1875rem 0.1875rem 0;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  box-shadow: 0 1px 2px rgba(40, 30, 20, 0.07);
  color: var(--text-strong);
  cursor: pointer;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  transition: transform 380ms var(--ease-spring), opacity 320ms var(--ease-out), filter 320ms var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
}
.gw-card:disabled { cursor: default; }
.gw-card__pic { flex: 1 1 auto; min-height: 0; display: block; border-radius: calc(var(--r-sm) - 0.1875rem); overflow: hidden; }
.gw-card__pic svg { display: block; width: 100%; height: 100%; }
.gw-card__name {
  display: block;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.75rem;
  line-height: 1.5;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gw-board--small .gw-card__name { font-size: 0.5625rem; }
.gw-board--small .gw-card { border-radius: var(--r-xs); padding: 0.125rem 0.125rem 0; }
/* Down: grey, smaller, crossed out. The cross comes in a moment after the fade. */
.gw-card::after {
  content: "";
  position: absolute;
  inset: 16% 18% 28%;
  background:
    linear-gradient(45deg, transparent 44%, var(--danger) 44% 56%, transparent 56%),
    linear-gradient(-45deg, transparent 44%, var(--danger) 44% 56%, transparent 56%);
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 240ms var(--ease-out) 140ms, transform 340ms var(--ease-spring) 140ms;
  pointer-events: none;
}
.gw-card.is-down { filter: grayscale(1); opacity: 0.32; transform: scale(0.9); box-shadow: none; }
.gw-card.is-down::after { opacity: 0.85; transform: scale(1); }
.gw-card.is-picked { box-shadow: 0 0 0 3px var(--accent), 0 6px 16px var(--accent-glow); transform: translateY(-2px); }
.gw-card.is-aim { box-shadow: 0 0 0 1.5px var(--accent-border); }
@media (hover: hover) and (pointer: fine) {
  .gw-card:not(:disabled):not(.is-down):hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(40, 30, 20, 0.12); }
}
.gw-card--big { width: 6.5rem; cursor: default; }
.gw-card--big .gw-card__name { font-size: 0.875rem; }

.gw-dot { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 0.8125rem; }
.gw-dot--1 { background: var(--accent); }
.gw-dot--2 { background: #7c3aed; }
/* «فريق ضد فريق»: the two teams' colours (the lobby's sides, the pills, the TV). */
.gw-dot--t0 { background: var(--team-red); }
.gw-dot--t1 { background: var(--team-blue); }
.gw-team-sub { display: flex; flex-direction: column; white-space: normal; overflow-wrap: anywhere; }
.gw-team-sub > bdi { color: var(--text-2); }
.gw-team-pills .duel-pill { border-radius: var(--r-lg); align-items: flex-start; }
.gw-team-pills .duel-pill__mark, .gw-team-pills .duel-pill__score { align-self: center; }
.gw-tv-team--0 { color: var(--team-red-ink); }
.gw-tv-team--1 { color: var(--team-blue-ink); }
.gw-tv__members { font-size: var(--tv-sm); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.gw-mine { display: flex; align-items: center; gap: var(--sp-3); }
.gw-mine__card { width: 4.75rem; flex: none; cursor: zoom-in; -webkit-touch-callout: none; user-select: none; }
.gw-mine__card, .gw-mine__card .gw-card__pic { display: block; }
.gw-mine__card { border-radius: var(--r-xs); overflow: hidden; border: 2px solid var(--accent); background: var(--surface-solid); }
.gw-mine__card .gw-card__pic { aspect-ratio: 90 / 98; }
.gw-mine__card .gw-card__name { font-size: 0.75rem; color: var(--text-strong); }
.gw-mine__text { display: flex; flex-direction: column; min-width: 0; }
.gw-mine__text .field__hint { margin: 0; }

.gw-qa {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  min-height: 2.75rem;
}
.gw-qa__q { font-weight: var(--fw-semi, 600); color: var(--text-strong); }
.gw-qa__a { font-family: var(--font-display); font-weight: 800; padding: 0.0625rem 0.625rem; border-radius: var(--r-full); }
.gw-qa__a.is-yes { background: var(--success-soft); color: var(--success-ink); }
.gw-qa__a.is-no { background: var(--danger-soft); color: var(--danger-ink); }
.gw-qa__a.is-wait { color: var(--text-3); }
.gw-qa__a.is-in { animation: gwPop 460ms var(--ease-spring) both; }
.gw-qa__out { font-size: 0.8125rem; color: var(--text-2); }
.gw-qa--wrong { border-color: var(--danger); }
.gw-qa--empty .gw-qa__q { color: var(--text-3); font-weight: 600; }
@keyframes gwPop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }

.gw-bar {
  position: sticky;
  bottom: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: 0 -2px 14px rgba(40, 30, 20, 0.08);
}
.gw-bar:empty { display: none; }
.gw-bar__say { margin: 0; text-align: center; font-weight: 600; color: var(--text-strong); }
.gw-bar__say--quiet { font-weight: 500; font-size: 0.875rem; color: var(--text-2); }
.gw-bar__row { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.gw-bar__row > .btn { flex: 1 1 0; min-width: max-content; padding-inline: var(--sp-2); white-space: nowrap; }
/* Out loud is the main way to ask and the longest label ("🗣️ Out loud" was cut off at 375 in English): a larger share of the row. */
.gw-bar__row > .btn:first-child { flex-grow: 1.45; }
/* Under the board: a hold opens a face big. */
.gw-hold-hint { margin: var(--sp-2) 0 0; text-align: center; font-size: 0.8125rem; color: var(--text-3); }
.gw-zoom {
  position: fixed; inset: 0; z-index: var(--z-fx-top); display: grid; place-items: center;
  background: rgba(12, 10, 20, 0.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  animation: gwZoomIn 180ms var(--ease-out) both;
}
.gw-card--zoom { width: min(78vw, 22rem, calc(var(--app-h, 100vh) * 0.62)); cursor: default; padding: 0.375rem 0.375rem 0; border-radius: var(--r-lg); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); animation: gwPop 320ms var(--ease-spring) both; }
.gw-card--zoom .gw-card__pic { border-radius: calc(var(--r-lg) - 0.375rem); }
.gw-card--zoom .gw-card__name { font-size: 1.375rem; line-height: 1.8; }
@keyframes gwZoomIn { from { opacity: 0; } }

.gw-history { font-size: 0.875rem; }
.gw-history summary { cursor: pointer; font-weight: 700; color: var(--text-2); padding-block: var(--sp-1); }
.gw-history ul { margin: var(--sp-1) 0 0; padding-inline-start: 1.1rem; display: flex; flex-direction: column; gap: 0.125rem; }

.gw-two { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); }
.gw-two__one { display: flex; flex-direction: column; gap: var(--sp-1); }

.gw-reveal { display: flex; justify-content: center; gap: var(--sp-5); flex-wrap: wrap; }
.gw-reveal__one { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.gw-reveal__who { font-weight: 700; color: var(--text-2); font-size: 0.875rem; }
.gw-reveal.is-turning .gw-reveal__one .gw-card { animation: gwTurn 620ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes gwTurn { 0% { transform: perspective(600px) rotateY(90deg); opacity: 0; } 100% { transform: perspective(600px) rotateY(0); opacity: 1; } }

/* After a guess the faces turn once the drum roll is over (--gw-wait, set by the page). */
.gw-reveal.is-turning .gw-reveal__one .gw-card { animation-delay: calc(var(--at, 0ms) + var(--gw-wait, 0ms)); }


/* The question put to you: big, beside your own secret face. */
.gw-ask-me { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-1); }
.gw-ask-me.is-in { animation: gwPop 460ms var(--ease-spring) both; }
.gw-ask-me__face { width: 6rem; flex: none; }
.gw-ask-me__text { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
.gw-ask-me__q { font-family: var(--font-display); font-weight: 800; font-size: 1.375rem; line-height: 1.25; color: var(--text-strong); overflow-wrap: anywhere; }
.gw-ask-me__btns > .btn { flex: 1 1 0; }

/* The one who was asked, thinking: three dots that breathe. */
.gw-think { display: inline-flex; align-items: center; gap: 0.25rem; }
.gw-dots { display: inline-flex; gap: 3px; margin-inline-start: 2px; }
.gw-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.3; animation: gwDot 1.2s ease-in-out infinite; }
.gw-dots i:nth-child(2) { animation-delay: 0.2s; }
.gw-dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes gwDot { 40% { opacity: 1; transform: translateY(-2px); } }

.gw-typed { display: flex; gap: var(--sp-2); }
.gw-typed .input { flex: 1 1 auto; min-width: 0; width: auto; }
/* The field takes the row; «ابعت» only what its word needs (a .btn is full width by default). */
.gw-typed > .btn { flex: 0 0 auto; width: auto; padding-inline: var(--sp-4); }

/* The moments over the screen: the answer's bubble and the guess's drum roll. */
.gw-over { position: fixed; inset: 0; z-index: var(--z-fx-top); display: grid; place-items: center; pointer-events: none; transition: opacity 320ms var(--ease-out); }
.gw-over.is-out { opacity: 0; }
.gw-over--drama { background: rgba(12, 10, 20, 0.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: auto; }
.gw-bubble {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(3.5rem, 18vmin, 9rem); line-height: 1;
  padding: 0.3em 0.7em 0.35em; border-radius: 999px; color: #fff; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
  animation: gwBubble 1100ms var(--ease-spring) both;
}
.gw-bubble.is-yes { background: var(--success-btn); color: var(--success-on); }
.gw-bubble.is-no { background: var(--danger-btn); color: var(--danger-on); }
.gw-bubble.is-undo { background: var(--warning-btn); color: var(--warning-on); font-size: clamp(1.75rem, 8vmin, 4.5rem); text-align: center; max-width: 90vw; }
@keyframes gwBubble { 0% { transform: scale(0.3); opacity: 0; } 22% { transform: scale(1.12); opacity: 1; } 34% { transform: scale(1); } 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.94); opacity: 0; } }
.gw-drama { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); color: #fff; text-align: center; padding: var(--sp-4); }
.gw-drama__who { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 6vmin, 3.5rem); }
.gw-drama__card { width: clamp(7rem, 26vmin, 14rem); animation: gwDramaShake 2200ms ease-in both; }
@keyframes gwDramaShake { 0%, 100% { transform: none; } 20% { transform: rotate(-2deg) scale(1.02); } 40% { transform: rotate(2deg) scale(1.04); } 60% { transform: rotate(-3deg) scale(1.06); } 80% { transform: rotate(3deg) scale(1.08); } }
.gw-drama__verdict { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.5rem, 12vmin, 6rem); opacity: 0; transform: scale(0.4); }
.gw-over.is-verdict .gw-drama__verdict { opacity: 1; transform: none; animation: gwPop 460ms var(--ease-spring) both; }
.gw-drama__verdict.is-right { color: #4ade80; }
.gw-drama__verdict.is-wrong { color: #f87171; }

@media (min-width: 640px) {
  .gw-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* A phone on its side, and every wide screen: the board takes the height, the rest a column beside it. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .gw-layout { display: grid; grid-template-columns: auto minmax(13rem, 21rem); justify-content: center; gap: var(--sp-4); align-items: start; }
  .gw-board { grid-template-columns: repeat(var(--gw-cols, 6), minmax(0, 1fr)); }
  /* The side column is narrow: out loud takes its own row, typing and guessing share the next. */
  .gw-bar__row { flex-wrap: wrap; }
  .gw-bar__row > .btn:first-child:nth-last-child(3) { flex-basis: 100%; }
  /* The board takes the height here; the hold is in Help and the bar's line. */
  .gw-hold-hint { display: none; }
  .gw-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  .gw-layout__board {
    position: sticky;
    top: 0;
    width: min(calc((var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem) * var(--gw-aspect, 1)), 56vw);
    max-width: none;
    margin: 0;
  }
  .gw-bar { position: static; box-shadow: none; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-guesswho { max-width: 74rem; }
  .gw-layout { gap: var(--sp-6); grid-template-columns: auto minmax(15rem, 23rem); }
  .gw-layout__board { width: min(calc((var(--app-h, 100vh) - var(--header-h) - 2.5rem) * var(--gw-aspect, 1)), 60vw); }
  .gw-card__name { font-size: 0.8125rem; }
}

/* The TV: both boards, the question between them. */
.gw-tv { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 22rem) minmax(0, 1fr); align-items: center; gap: calc(var(--tv-gap) * 2); }
.gw-tv__board { display: flex; flex-direction: column; gap: var(--tv-gap); min-width: 0; width: min(100%, calc((var(--app-h, 100vh) - 24vmin) * var(--gw-aspect, 1))); justify-self: center; }
.gw-tv .gw-board { grid-template-columns: repeat(var(--gw-cols, 6), minmax(0, 1fr)); }
.gw-tv__name { display: flex; justify-content: space-between; align-items: baseline; gap: 1vmin; font-size: var(--tv-md); }
.gw-tv__name i { font-style: normal; font-size: var(--tv-sm); color: var(--text-2); }
.gw-tv__mid { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); min-width: 0; }
.gw-tv__mid > .tv-scale { width: 100%; }
.gw-tv .gw-card__name { font-size: 1.5vmin; }
.gw-qa--tv { justify-content: center; text-align: center; padding: 1.6vmin 2.2vmin; border-radius: var(--tv-r); font-size: var(--tv-md); }
.gw-qa--tv .gw-qa__a { font-size: var(--tv-lg, 5vmin); padding: 0.3vmin 2.4vmin; }
.gw-qa--tv .gw-qa__out { font-size: var(--tv-sm); }
.gw-reveal--tv .gw-card--big { width: 15vmin; }
.gw-reveal--tv .gw-card--big .gw-card__name { font-size: 2vmin; }
.gw-reveal--tv .gw-reveal__who { font-size: var(--tv-sm); }
@media (orientation: portrait) {
  .gw-tv { grid-template-columns: minmax(0, 1fr); }
}

/* ==========================================================================
   25. المشنقة
   JS_Hangman.html. The owner's option ج "نضيف" (22 Sep 2026): the app's own
   card, the gallows in quiet ink and the classic stick man in the game's
   colour, drawn a stroke at a time (pathLength 1, the dash running out);
   the word in tiles like خمن الكلمة's, a tile turning over as its letter is
   found; the keyboard of the app's own keys. The tiles and the keys follow
   the word's alphabet, right to left for Arabic.
   ========================================================================== */
.hm-board { display: flex; flex-direction: column; gap: var(--sp-3); }
.hm-board__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; }
.hm-cat { font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; color: var(--text-strong); }
.hm-lives { font-size: 0.8125rem; font-weight: 700; color: var(--text-2); }
.hm-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-3) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  background: var(--surface-solid);
  box-shadow: 0 1px 3px rgba(40, 30, 20, 0.06);
}
.hm-gallows { display: block; width: min(10.5rem, 46%); height: auto; overflow: visible; }
.hm-gal { fill: none; stroke: var(--text-3); stroke-width: 4; stroke-linecap: round; opacity: 0.65; }
/* The man, look أ «كرتون مسطّح» (the owner, 27 Sep 2026): a flat cartoon - the page's ink for the
   outlines (light in dark mode), the game's colour for the shirt, tokens for the rest. Every move is a
   transform on a group pivoted at its joint (transform-box: view-box puts the origin in the drawing's
   own units). hm-s1..6 on the svg is how many pieces are on; the face parts show by state. Stilled
   under reduced motion at the end of this section. */
:root { --hm-ink: #23213a; --hm-skin: #f6c9a5; --hm-hair: #3b2a1e; --hm-pants: #4b5fb0; --hm-dust: #c9c2dc; }
body.dark { --hm-ink: #16142a; --hm-skin: #f0bf9a; --hm-hair: #2a1d14; --hm-pants: #5b6fc4; --hm-dust: #5a5470; }
.hm-gallows--mini { width: 3.25rem; }
.hm-ink { stroke: var(--hm-ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.hm-skin { fill: var(--hm-skin); }
.hm-hair { fill: var(--hm-hair); }
.hm-shirt { fill: var(--accent); }
.hm-sleeve { fill: none; stroke: var(--hm-ink); stroke-width: 7.5; }
.hm-sleeve--in { stroke: var(--accent); stroke-width: 3.6; }
.is-hanged .hm-sleeve--in { stroke: var(--danger); }
.hm-pants { fill: var(--hm-pants); }
.hm-shoe { fill: var(--hm-ink); }
.hm-eye { fill: var(--hm-ink); }
.hm-eyes-x, .hm-eyes-happy, .hm-brows, .hm-mouth { fill: none; display: none; }
.hm-mouth--grin { fill: #fff; }
.hm-tongue { display: none; fill: var(--danger); }
.hm-drop { display: none; fill: #7fb6ff; }
.hm-face, .hm-fig, .hm-lean, .hm-part, .hm-pop, .hm-eyes, .hm-sweat, .hm-drop, .hm-head, .hm-bub, .hm-rope, .hm-clock { transform-box: view-box; }
.hm-pop { transform-origin: 80px 53px; }
.hm-head .hm-pop { transform-origin: 80px 24px; }
.hm-leg .hm-pop { transform-origin: 80px 78px; }
.hm-pop.hm-ghost { display: none; }
.hm-pop.is-new { animation: hm-pop-in 480ms var(--ease-out) both; }
@keyframes hm-pop-in { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.hm-s1 .hm-mouth--smile { display: block; }
.hm-s2 .hm-mouth--flat { display: block; }
.hm-s3 .hm-mouth--worry, .hm-s3 .hm-brows { display: block; }
.hm-s4 .hm-mouth--o, .hm-s4 .hm-brows, .hm-s5 .hm-mouth--o, .hm-s5 .hm-brows { display: block; }
.hm-s5 .hm-drop { display: block; opacity: 0; }
.hm-s5 .hm-eye { r: 2.3; }
.is-hanged .hm-eyes, .is-hanged .hm-brows, .is-hanged .hm-mouth { display: none; }
.is-hanged .hm-eyes-x, .is-hanged .hm-tongue { display: block; }
.is-hanged .hm-shirt { fill: var(--danger); }
.is-hanged .hm-shoe--r { transform: translate(9px, 20px) rotate(35deg); transform-box: view-box; transform-origin: 88px 102px; }

/* The loops, one per state, only while the man is alive. */
.hm-eyes { transform-origin: 80px 33px; animation: hm-blink 4.2s ease-in-out infinite; }
.hm-s5 .hm-eyes { animation-duration: 1.4s; }
.hm-fig { transform-origin: 80px 24px; }
.hm-s2 .hm-fig, .hm-s3 .hm-fig { animation: hm-sway 3.2s ease-in-out infinite; }
.hm-s4 .hm-fig { animation: hm-sway 1.6s ease-in-out infinite; }
.hm-s5 .hm-fig { animation: hm-wriggle 0.9s ease-in-out infinite; }
.hm-arm { transform-origin: 80px 53px; }
.hm-s3 .hm-arm--r { animation: hm-wave 1.5s ease-in-out infinite; }
.hm-s4 .hm-arm--l, .hm-s5 .hm-arm--l { animation: hm-flap-l 0.55s ease-in-out infinite; }
.hm-s4 .hm-arm--r, .hm-s5 .hm-arm--r { animation: hm-flap-r 0.55s ease-in-out infinite; }
.hm-leg { transform-origin: 80px 78px; }
.hm-s5 .hm-leg--l { animation: hm-kick 0.6s ease-in-out infinite; }
.hm-s5 .hm-leg--r { animation: hm-kick 0.6s ease-in-out infinite reverse; }
.hm-s5 .hm-drop--1 { transform-origin: 67px 29px; animation: hm-sweat-l 1.1s ease-out infinite; }
.hm-s5 .hm-drop--2 { transform-origin: 94px 27px; animation: hm-sweat-r 1.1s ease-out infinite 0.5s; }
.is-hanged .hm-fig { animation: none; transform: rotate(3deg); }
.is-hanged .hm-arm, .is-hanged .hm-leg, .is-hanged .hm-eyes { animation: none; }
.is-hanged .hm-arm--l { transform: rotate(-38deg); }
.is-hanged .hm-arm--r { transform: rotate(38deg); }
.is-hanged .hm-leg--l { transform: rotate(-8deg); }
.is-hanged .hm-leg--r { transform: rotate(6deg); }
.is-hanged.is-dropping .hm-fig { animation: hm-limp 900ms var(--ease-out) forwards; animation-delay: var(--hm-late, 0ms); }
.is-hanged.is-dropping .hm-shoe--r { animation: hm-shoe 1s cubic-bezier(0.3, 0.8, 0.4, 1.4) both; animation-delay: calc(350ms + var(--hm-late, 0ms)); }
.hm-gallows.is-hop .hm-fig { animation: hm-hop 620ms var(--ease-out); animation-delay: var(--hm-late, 0ms); }
@keyframes hm-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.15); } }
@keyframes hm-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes hm-wriggle { 0%, 100% { transform: rotate(-5deg) translateY(0); } 25% { transform: rotate(4deg) translateY(1.5px); } 50% { transform: rotate(-4deg) translateY(-1px); } 75% { transform: rotate(5deg) translateY(1px); } }
@keyframes hm-wave { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-70deg); } 50% { transform: rotate(-95deg); } 70% { transform: rotate(-70deg); } }
@keyframes hm-flap-l { 0%, 100% { transform: rotate(30deg); } 50% { transform: rotate(-60deg); } }
@keyframes hm-flap-r { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(60deg); } }
@keyframes hm-kick { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(22deg); } }
@keyframes hm-sweat-l { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-7px, 9px) scale(1); } }
@keyframes hm-sweat-r { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(7px, 9px) scale(1); } }
@keyframes hm-limp { 0% { transform: rotate(-6deg); } 40% { transform: rotate(7deg); } 70% { transform: rotate(1deg); } 100% { transform: rotate(3deg); } }
@keyframes hm-shoe { 0% { transform: translate(0, 0) rotate(0deg); } 60% { transform: translate(8px, 21px) rotate(50deg); } 80% { transform: translate(9px, 17px) rotate(40deg); } 100% { transform: translate(9px, 20px) rotate(35deg); } }
@keyframes hm-hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-5px) rotate(-2deg); } 65% { transform: translateY(-1px) rotate(2deg); } }

/* The speech bubble: what he says now and then (a line a stage), two seconds every nine, never on the
   TV's small figures, gone once he is hanged, freed or stopped by the clock. */
.hm-bub { opacity: 0; transform-origin: 62px 24px; animation: hm-bub 9s ease-in-out infinite; animation-delay: var(--hm-bub-delay, 0s); }
.hm-bub__box { fill: var(--surface-solid); stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
body.dark .hm-gallows .hm-hair { fill: #4a3626; }
.hm-bub__t { font-family: var(--font); font-size: 8.5px; font-weight: 700; fill: var(--text); }
.hm-s5 .hm-bub { animation-duration: 6s; }
.is-hanged .hm-bub, .is-free .hm-bub, .is-timeup .hm-bub, .hm-board.is-lost .hm-bub, .hm-board.is-won .hm-bub { display: none; }
@keyframes hm-bub { 0%, 60%, 100% { opacity: 0; transform: scale(0.6); } 66%, 88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(0.8); } }

/* Set free (the word solved): the rope snaps, the pieces he never earned pop in so he is whole, he
   drops and lands with a squash, jumps for joy with both fists up, then runs off leaning forward,
   legs striding, arms pumping, dust behind his feet, out of the picture. Once he is gone (a redraw,
   the TV's row, the result) the gallows stays empty with its rope cut. */
.hm-board.is-won .hm-rope, .hm-row.is-won .hm-rope, .hm-res.is-won .hm-rope { transform: scaleY(0.35); }
.hm-rope { transform-origin: 80px 10px; }
.hm-board.is-won .hm-gallows:not(.is-free) .hm-fig, .hm-row.is-won .hm-gallows:not(.is-free) .hm-fig, .hm-res.is-won .hm-fig { opacity: 0; }
.hm-gallows.is-free .hm-rope { animation: hm-rope-snap 320ms var(--ease-out) forwards; animation-delay: calc(150ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free .hm-eyes, .hm-gallows.is-free .hm-brows, .hm-gallows.is-free .hm-mouth, .hm-gallows.is-free .hm-drop, .hm-gallows.is-free .hm-eyes-x, .hm-gallows.is-free .hm-tongue { display: none; }
.hm-gallows.is-free .hm-eyes-happy, .hm-gallows.is-free .hm-mouth--grin { display: block; }
.hm-gallows.is-free .hm-shirt { fill: var(--accent); }
.hm-gallows.is-free .hm-shoe--r { transform: none; }
/* He leaves the way his pieces allow (the owner, 28 Sep 2026). The floor is y 122: the head's
   bottom is 45, the body's 75, the shoes' 105, so he drops 77, 47 or 17 to land. Each escape turns
   about its own point (the head's middle, the body's foot, the standing foot), 3.2 s, forwards. */
.hm-gallows.is-free .hm-fig { animation: hm-esc-hop 3.2s ease-in forwards; animation-delay: calc(200ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free.hm-s1 .hm-fig { transform-origin: 80px 34px; animation-name: hm-esc-roll; }
.hm-gallows.is-free.hm-s2 .hm-fig { transform-origin: 80px 75px; animation-name: hm-esc-log; }
.hm-gallows.is-free.hm-s3 .hm-fig, .hm-gallows.is-free.hm-s4 .hm-fig { transform-origin: 80px 75px; animation-name: hm-esc-crawl; animation-duration: 4s; animation-timing-function: linear; }
.hm-gallows.is-free.hm-s3 .hm-head, .hm-gallows.is-free.hm-s4 .hm-head { transform-origin: 80px 44px; animation: hm-esc-look 0.48s ease-in-out infinite; animation-delay: calc(1160ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free.hm-s3 .hm-brows, .hm-gallows.is-free.hm-s4 .hm-brows { display: block; }
.hm-gallows.is-free.hm-s5 .hm-fig { transform-origin: 72px 105px; animation-name: hm-esc-hop; }
/* The army crawl: an arm reaches ahead (toward the head, which leads), then pulls, and the body inches
   forward on each pull; with two arms they alternate, half a cycle apart. */
.hm-gallows.is-free.hm-s3 .hm-arm--l, .hm-gallows.is-free.hm-s4 .hm-arm--l { animation: hm-esc-pull-l 0.48s ease-in-out infinite; animation-delay: calc(1160ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free.hm-s4 .hm-arm--r { animation: hm-esc-pull-r 0.48s ease-in-out infinite; animation-delay: calc(1400ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free.hm-s5 .hm-leg--l { animation: hm-esc-kick 0.42s ease-in-out infinite; animation-delay: calc(900ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free.hm-s5 .hm-arm--l { animation: hm-flap-l 0.42s ease-in-out infinite reverse; animation-delay: calc(900ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free.hm-s5 .hm-arm--r { animation: hm-flap-r 0.42s ease-in-out infinite reverse; animation-delay: calc(900ms + var(--hm-late, 0ms)); }
.hm-dust__p { fill: var(--hm-dust); opacity: 0; }
.hm-gallows.is-free.hm-s3 .hm-dust__p, .hm-gallows.is-free.hm-s4 .hm-dust__p, .hm-gallows.is-free.hm-s5 .hm-dust__p { animation: hm-esc-dust 0.9s ease-out infinite; animation-delay: calc(1160ms + var(--hm-late, 0ms)); }
.hm-gallows.is-free .hm-dust__p--2 { animation-delay: calc(1300ms + var(--hm-late, 0ms)) !important; }
.hm-gallows.is-free .hm-dust__p--3 { animation-delay: calc(1600ms + var(--hm-late, 0ms)) !important; }
@keyframes hm-rope-snap { to { transform: scaleY(0.35); } }
/* A head alone: drops, bounces once, rolls off spinning. */
@keyframes hm-esc-roll { 0% { transform: translate(0, 0) rotate(0deg); } 22% { transform: translate(0, 77px) rotate(0deg); } 28% { transform: translate(3px, 68px) rotate(40deg); } 34% { transform: translate(7px, 77px) rotate(90deg); } 96% { transform: translate(100px, 77px) rotate(900deg); opacity: 1; } 100% { transform: translate(104px, 77px) rotate(930deg); opacity: 0; } }
/* Head and body: drops, tips over on its foot and slides off like a log. */
@keyframes hm-esc-log { 0% { transform: translate(0, 0) rotate(0deg); } 24% { transform: translate(0, 47px) rotate(0deg); } 30% { transform: translate(0, 45px) rotate(-6deg); } 46% { transform: translate(10px, 47px) rotate(84deg); } 52% { transform: translate(14px, 47px) rotate(78deg); } 96% { transform: translate(104px, 47px) rotate(92deg); opacity: 1; } 100% { transform: translate(108px, 47px) rotate(92deg); opacity: 0; } }
/* Arms, no legs: drops, falls flat with the head leading the way, then six pulls - the body lunges
   forward on each pull (the first half of a 0.48 s cycle) and rests while the arm reaches again,
   the hips lifting a little with every lunge. 4 s. */
@keyframes hm-esc-crawl { 0% { transform: translate(0, 0) rotate(0deg); } 18% { transform: translate(0, 47px) rotate(0deg); } 22% { transform: translate(0, 45px) rotate(20deg); } 29% { transform: translate(2px, 47px) rotate(92deg); }
  35% { transform: translate(14px, 45px) rotate(86deg); } 41% { transform: translate(15px, 47px) rotate(92deg); } 47% { transform: translate(28px, 45px) rotate(86deg); } 53% { transform: translate(29px, 47px) rotate(92deg); }
  59% { transform: translate(43px, 45px) rotate(86deg); } 65% { transform: translate(44px, 47px) rotate(92deg); } 71% { transform: translate(58px, 45px) rotate(86deg); } 77% { transform: translate(59px, 47px) rotate(92deg); }
  83% { transform: translate(74px, 45px) rotate(86deg); } 89% { transform: translate(75px, 47px) rotate(92deg); } 95% { transform: translate(92px, 45px) rotate(86deg); opacity: 1; } 100% { transform: translate(100px, 47px) rotate(90deg); opacity: 0; } }
@keyframes hm-esc-pull-l { 0% { transform: rotate(150deg); } 45% { transform: rotate(40deg); } 100% { transform: rotate(150deg); } }
@keyframes hm-esc-pull-r { 0% { transform: rotate(-150deg); } 45% { transform: rotate(-40deg); } 100% { transform: rotate(-150deg); } }
@keyframes hm-esc-look { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(-16deg); } }
/* One leg: drops, then hops off, higher and quicker as he goes. */
@keyframes hm-esc-hop { 0% { transform: translate(0, 0); } 22% { transform: translate(0, 17px); } 26% { transform: translate(0, 19px) scale(1.06, 0.92); } 30% { transform: translate(0, 17px) scale(1, 1); } 38% { transform: translate(10px, 4px) rotate(6deg); } 46% { transform: translate(20px, 17px); } 54% { transform: translate(32px, 2px) rotate(8deg); } 62% { transform: translate(44px, 17px); } 70% { transform: translate(58px, 0px) rotate(8deg); } 78% { transform: translate(72px, 17px); } 86% { transform: translate(88px, -2px) rotate(10deg); } 96% { transform: translate(104px, 17px); opacity: 1; } 100% { transform: translate(108px, 17px); opacity: 0; } }
@keyframes hm-esc-kick { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(35deg); } }
@keyframes hm-esc-dust { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 25% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-10px, -6px) scale(1.4); } }

/* Time's up on a board still guessing (a room's clock, the host's close): the man freezes where he
   was, grey, a clock over his head; the moment it happens the clock pops and the man jolts once. */
.hm-clock { display: none; transform-origin: 80px 14px; }
.hm-board.is-lost .hm-gallows:not(.is-hanged) .hm-clock, .hm-res.is-lost .hm-gallows:not(.is-hanged) .hm-clock, .hm-row.is-lost .hm-gallows:not(.is-hanged) .hm-clock { display: block; }
.hm-board.is-lost .hm-gallows:not(.is-hanged) .hm-fig, .hm-res.is-lost .hm-gallows:not(.is-hanged) .hm-fig, .hm-row.is-lost .hm-gallows:not(.is-hanged):not(.is-timeup) .hm-fig { animation: none; opacity: 0.55; transform: rotate(-4deg); filter: grayscale(1); }
.hm-board.is-lost .hm-gallows:not(.is-hanged) .hm-part, .hm-res.is-lost .hm-gallows:not(.is-hanged) .hm-part, .hm-row.is-lost .hm-gallows:not(.is-hanged) .hm-part,
.hm-board.is-lost .hm-gallows:not(.is-hanged) .hm-eyes, .hm-res.is-lost .hm-gallows:not(.is-hanged) .hm-eyes, .hm-row.is-lost .hm-gallows:not(.is-hanged) .hm-eyes { animation: none; }
.hm-board.is-lost .hm-gallows:not(.is-hanged) .hm-mouth, .hm-res.is-lost .hm-gallows:not(.is-hanged) .hm-mouth, .hm-row.is-lost .hm-gallows:not(.is-hanged) .hm-mouth { display: none; }
.hm-board.is-lost .hm-gallows:not(.is-hanged) .hm-mouth--o, .hm-res.is-lost .hm-gallows:not(.is-hanged) .hm-mouth--o, .hm-row.is-lost .hm-gallows:not(.is-hanged) .hm-mouth--o { display: block; }
.hm-gallows.is-timeup .hm-fig { animation: hm-jolt 600ms var(--ease-out) forwards; animation-delay: var(--hm-late, 0ms); filter: grayscale(1); }
.hm-gallows.is-timeup .hm-clock { animation: hm-clock-pop 700ms var(--ease-out) both; animation-delay: var(--hm-late, 0ms); }
@keyframes hm-clock-pop { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.35) rotate(10deg); } 100% { transform: scale(1) rotate(0deg); } }
@keyframes hm-jolt { 0% { transform: rotate(6deg) translateY(-3px); opacity: 1; } 50% { transform: rotate(-8deg) translateY(1px); } 100% { transform: rotate(-4deg); opacity: 0.55; } }

/* A word stays on one line, its tiles shrinking rather than splitting it; a name of two or three
   words wraps only between them, with a wider gap there than between two letters. */
.hm-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.1rem; width: 100%; }
.hm-tiles__word { display: flex; flex-wrap: nowrap; justify-content: center; gap: 0.375rem; min-width: 0; max-width: 100%; }
.hm-tiles.is-long .hm-tiles__word { gap: 0.25rem; }
.hm-tile {
  flex: 0 1 auto;
  width: 2.375rem;
  min-width: 1.25rem;
  height: 2.75rem;
  display: grid;
  place-items: center;
  border: 2px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.375rem;
  line-height: 1;
  color: var(--text-strong);
}
.hm-tiles.is-long .hm-tile { width: 1.875rem; height: 2.375rem; font-size: 1.125rem; }
.hm-tile.is-open { background: var(--accent-soft); border-color: var(--accent); }
.hm-tile.is-new { animation: hmTile 440ms var(--ease-out) both; }
.hm-tile.is-lost { background: var(--danger-soft); border-color: var(--danger); color: var(--danger-ink); }
@keyframes hmTile { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.hm-wrong { margin: 0; min-height: 1.5rem; font-weight: 800; color: var(--danger-ink); word-spacing: 0.35em; text-align: center; }

.hm-keys { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.3125rem; }
.hm-keys .key { height: 2.875rem; font-size: 1.125rem; }
.hm-keys .key:disabled { cursor: default; }
.hm-keys .key--absent { opacity: 0.55; }
.hm-whole { display: flex; gap: var(--sp-2); }
.hm-whole input { flex: 1 1 auto; min-width: 0; }

.hm-tally { display: flex; gap: var(--sp-2); }
.hm-tally__one { flex: 1 1 0; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); padding: 0.375rem 0.875rem; border: 1px solid var(--border); border-radius: var(--r-full); background: var(--surface); font-weight: 700; color: var(--text-strong); }
.hm-tally__one > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-tally__one b { color: var(--accent-ink); }
.hm-tally__one.is-writer > span::before { content: "✍️ "; }

.hm-write-card { display: flex; flex-direction: column; gap: var(--sp-2); }
.hm-write { display: flex; flex-direction: column; gap: var(--sp-2); }
.hm-write__row { display: flex; gap: var(--sp-2); }
.hm-write__row input { flex: 1 1 auto; min-width: 0; font-size: 1.125rem; }
/* A secret typed as dots: the letters are invisible and .secret-field__dots draws
   one dot a letter over them. Not -webkit-text-security: Safari takes such a field
   for a password and offers to save it when the game is left. */
.secret-field { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
.secret-field input { flex: 1 1 auto; min-width: 0; font-size: 1.125rem; }
.secret-field input.is-hidden { color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--text); }
.secret-field input.is-hidden::placeholder { color: var(--text-3); -webkit-text-fill-color: var(--text-3); }
.secret-field__dots {
  position: absolute; inset-block: 0; inset-inline: calc(var(--sp-4) + 1.5px);
  display: flex; align-items: center; overflow: hidden; white-space: nowrap;
  pointer-events: none; font-size: 1.125rem; font-weight: 800; letter-spacing: 0.12em; color: var(--text);
}
.secret-field input:not(.is-hidden) + .secret-field__dots { display: none; }
.hm-write__err:empty { display: none; }
/* The writing step on one phone (paintHangman, 1 Oct 2026): من أنا؟'s writing
   layout (.wa-write, the poster), the fields under their labels, and a short
   «جاهزة» in the bar with what comes after as a small line over it. */
.hm-write-card--local { gap: 0; margin-block-start: var(--sp-3); }
.hm-write-card--local .hm-write__away { margin: 0 0 var(--sp-3); text-align: center; }
.hm-write-card--local .hm-write { gap: var(--sp-2); }
.hm-write-card--local .hm-write > .field__label { margin: 0; }
.hm-write-card--local .hm-write__label { margin-block-start: var(--sp-2); }
.hm-write-card--local .hm-write .field__hint { margin: 0; }
.hm-write-actions__then { margin: 0 0 var(--sp-2); text-align: center; }
/* A phone on its side: «جاهزة» and its line side by side, so the bar stays one line. */
@media (orientation: landscape) and (max-height: 500px) {
  .hm-write-actions { display: flex; align-items: center; gap: var(--sp-3); position: static; margin: 0; padding: 0; background: none; }
  .hm-write-actions > .btn { flex: 1 1 0; min-width: 0; }
  .hm-write-actions__then { flex: 1 1 0; min-width: 0; margin: 0; text-align: start; }
}
.hm-hint { font-size: 0.875rem; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: var(--r-full); padding: 0.125rem 0.625rem; }
.hm-board__who { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; min-width: 0; }
.hm-end { text-align: center; display: flex; flex-direction: column; gap: var(--sp-2); align-items: stretch; }
.hm-end__word { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; color: var(--text-strong); }
.hm-wait { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.hm-wait__icon { font-size: 2.5rem; }
.hm-mine-word { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); text-align: center; }

.hm-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: var(--sp-2); }
.hm-row { display: flex; flex-direction: column; align-items: center; gap: 0.125rem; padding: var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); text-align: center; }
.hm-row.is-me { box-shadow: 0 0 0 2px var(--accent-border); }
.hm-row.is-won { border-color: var(--success); }
.hm-row.is-lost { opacity: 0.6; }
.hm-row__who { font-weight: 800; color: var(--text-strong); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-row__prog, .hm-row__st { font-size: 0.75rem; color: var(--text-2); }

.hm-result { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); text-align: center; }
.hm-results { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 0.25rem; }
.hm-res { display: flex; justify-content: space-between; gap: var(--sp-2); padding: 0.375rem 0.625rem; border-radius: var(--r-sm); background: var(--surface-2); font-weight: 600; }
.hm-res.is-setter { background: var(--accent-soft); }
.hm-res { align-items: center; }
.hm-res__who { flex: 1; min-width: 0; }
.hm-res .hm-gallows--res { width: 2.6rem; flex: 0 0 auto; }
.hm-result--tv .hm-res .hm-gallows--res { width: 7vmin; }
.hm-res.is-rise { animation: hm-res-rise 420ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes hm-res-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.hm-room { display: flex; flex-direction: column; gap: var(--sp-3); }
.hm-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.hm-layout__board { width: 100%; max-width: 32rem; margin-inline: auto; }
.hm-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
#hangman-stage { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 32rem; margin-inline: auto; }

/* A phone on its side, and every wide screen: the drawing and the word on one side, the keys on the
   other, so the whole board is on the screen without scrolling (the play area gets the space). */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .hm-board {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "head head" "stage keys" "stage life" "stage whole";
    grid-template-rows: auto auto auto 1fr;
    align-items: start;
    column-gap: var(--sp-4);
  }
  .hm-board__head { grid-area: head; }
  .hm-stage { grid-area: stage; }
  .hm-keys { grid-area: keys; }
  .hm-whole { grid-area: whole; }
  .hm-life { grid-area: life; }
  #hangman-stage, .hm-layout__board { max-width: 58rem; }
}
/* Beside the board only where there is room for both; a phone on its side has the others under it. */
@media (min-width: 900px) and (min-height: 501px) {
  .hm-layout { display: grid; grid-template-columns: minmax(0, 52rem) minmax(11rem, 16rem); justify-content: center; gap: var(--sp-4); align-items: start; }
  .hm-layout__board { max-width: none; margin: 0; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .hm-stage { padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); }
  .hm-gallows { width: 5.75rem; }
  .hm-stage .hme-svg { width: 10rem; }
  .hm-tile { width: 2rem; height: 2.375rem; font-size: 1.125rem; }
  .hm-keys .key { height: 2.375rem; font-size: 1rem; }
  .hm-board { row-gap: var(--sp-2); }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-hangman { max-width: 64rem; }
  .hm-gallows { width: min(13rem, 40%); }
  .hm-stage .hme-svg { width: min(22rem, 72%); }
  .hm-tile { width: 2.75rem; height: 3.125rem; font-size: 1.5rem; }
}

/* The TV: the kind of word and its blanks on top, everyone's man under it. */
.hm-tv__head { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); }
.hm-tv { align-content: start; }
.hm-tv .hm-tile { width: 8.5vmin; height: 10vmin; font-size: 5.4vmin; border-radius: var(--tv-r); }
.hm-rows--tv { grid-template-columns: repeat(auto-fill, minmax(22vmin, 27vmin)); justify-content: center; gap: var(--tv-gap); }
.hm-rows--tv .hm-row { padding: 1.4vmin; border-radius: var(--tv-r); }
.hm-rows--tv .hm-gallows--mini { width: 14vmin; }
.hm-rows--tv .hm-row__who { font-size: var(--tv-sm); }
.hm-rows--tv .hm-row__prog, .hm-rows--tv .hm-row__st { font-size: 1.8vmin; }
.hm-result--tv { font-size: var(--tv-sm); width: min(100%, 46rem); margin-inline: auto; padding: 3vmin; gap: 2.4vmin; }
.hm-result--tv .hm-res { padding: 1vmin 1.6vmin; border-radius: var(--tv-r); }
.hm-result--tv .hm-tile { width: 6.4vmin; height: 7.4vmin; font-size: 3.8vmin; }
.hm-tv-result { width: min(100%, 60rem); margin-inline: auto; }

/* The next round (the owner, 2 Oct 2026). The levels: at Easy a hand is a miss of its own (hidden
   until then, popping in like a piece). The lifelines under the keys, a greyed key struck out. The
   writer's hints as pills, a lock for each still to come. The streak's 🔥 beside a name. */
.hm-nohand .hm-hand { display: none; }
.hm-hand { transform-box: fill-box; transform-origin: center; }
.hm-hand.is-new { animation: hm-pop-in 480ms var(--ease-out) both; }
.hm-keys .hm-key--off { text-decoration: line-through; opacity: 0.3; }
.hm-life { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.hm-life__btn { gap: var(--sp-1); min-width: 0; line-height: 1.2; }
.hm-life__cost { font-size: 0.75rem; color: var(--danger-ink); direction: ltr; unicode-bidi: isolate; }
.hm-life__btn:disabled { opacity: 0.45; }
/* On a narrow phone the icons go, so «شيل ٣ حروف غلط» stays on one line in its half. */
@media (max-width: 400px) { .hm-life__ico { display: none; } }
.hm-hints { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.hm-hint--locked { background: var(--surface-2); color: var(--text-3); font-weight: 600; }
.hm-hint.is-new { animation: hm-hint-in 480ms var(--ease-out) both; }
@keyframes hm-hint-in { from { opacity: 0; transform: translateY(-4px) scale(0.9); } to { opacity: 1; transform: none; } }
.hm-fire { display: inline-flex; align-items: center; gap: 0.0625rem; margin-inline: 0.25rem; font-size: 0.8125rem; font-weight: 800; color: var(--accent-ink); white-space: nowrap; }
.hm-captain { font-size: 0.8125rem; font-weight: 700; color: var(--text-2); }
.hm-say { margin: 0; text-align: center; }
.hm-result__hints { margin: 0; font-size: 0.8125rem; color: var(--text-2); }
.hm-res__life { font-size: 0.75rem; color: var(--danger-ink); margin-inline-start: 0.25rem; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.hm-end__pts { margin: 0; font-weight: 800; color: var(--accent-ink); }
.hm-more-hints > summary { cursor: pointer; display: flex; align-items: center; gap: var(--sp-1); min-height: 2.75rem; font-size: 0.875rem; font-weight: 700; color: var(--accent-ink); list-style: none; }
.hm-more-hints > summary::-webkit-details-marker { display: none; }
.hm-more-hints > summary::after { content: "▾"; transition: transform var(--dur-2) var(--ease-out); }
.hm-more-hints[open] > summary::after { transform: rotate(180deg); }
.hm-more-hints__body { display: flex; flex-direction: column; gap: var(--sp-2); }

/* The endings (JS_HangmanEnd.html): the sheet's drawing at the board's place, wider than the gallows
   (props come in from the sides), every joint moved by its script; the small men show the last frame. */
.hme-svg { display: block; width: min(20rem, 92%); height: auto; overflow: hidden; }
.hme-svg .hm-sleeve { stroke-linecap: round; }
.hme-nofill { fill: none; }
.hme-floor { fill: none; stroke: var(--text-3); stroke-width: 1.5; opacity: 0.25; stroke-dasharray: 3 5; }
.hme-ink-s { stroke: var(--hm-ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.hme-ink-t { stroke: var(--hm-ink); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; }
.hme-bub-box { fill: var(--surface-solid); stroke: var(--text); stroke-width: 1.4; stroke-linejoin: round; }
.hme-bub-t { font-family: var(--font); font-size: 8.5px; font-weight: 700; fill: var(--text); }
.hme-fx-t { font-family: var(--font-display); font-size: 7px; font-weight: 800; fill: #23213a; }
.hme-tiny-t { font-family: var(--font); font-size: 4.6px; font-weight: 700; }
.hme-svg--mini { width: 5.5rem; max-width: 100%; }
.hme-svg--res { width: 4.25rem; flex: 0 0 auto; }
.hm-result--tv .hme-svg--res { width: 12vmin; }
.hm-rows--tv .hme-svg--mini { width: 24vmin; }
.hme-svg.hme-pop { animation: hm-pop-in 520ms var(--ease-out) both; animation-delay: var(--hm-late, 0ms); }

/* The team way: the two teams on top, the one guessing lit; the TV's one big board. */
.hm-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.hm-team { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }
.hm-team.is-up { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-border); }
.hm-team__top { display: flex; align-items: center; gap: var(--sp-1); min-width: 0; }
.hm-team__name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
.hm-team--0 .hm-team__name, .hm-side--0 .vc-side__head { color: var(--team-red-ink); }
.hm-team--1 .hm-team__name, .hm-side--1 .vc-side__head { color: var(--team-blue-ink); }
.hm-team__pts { font-size: 1.25rem; color: var(--text-strong); }
.hm-team__who { min-height: 1.1em; font-size: 0.75rem; font-weight: 700; color: var(--text-2); }
.hm-team__members { font-size: 0.75rem; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-final { display: flex; flex-direction: column; gap: var(--sp-3); text-align: center; }
.hm-teams--tv { gap: var(--tv-gap); }
.hm-teams--tv .hm-team { padding: 1.4vmin 2vmin; border-radius: var(--tv-r); }
.hm-teams--tv .hm-team__name { font-size: var(--tv-sm); }
.hm-teams--tv .hm-team__pts { font-size: var(--tv-md); }
.hm-teams--tv .hm-team__who, .hm-teams--tv .hm-team__members { font-size: 1.8vmin; }
.hm-tv__board { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--tv-gap); }
.hm-tv__board .hm-gallows { width: 28vmin; }
.hm-tv__board .hme-svg { width: 48vmin; }
.hm-tv__board .hm-wrong { font-size: var(--tv-sm); }
.hm-tv__board .hm-hint { font-size: var(--tv-sm); }

@media (prefers-reduced-motion: reduce) {
  .gw-card, .gw-card::after { transition: none; }
  .hme-svg.hme-pop, .hm-hand.is-new, .hm-hint.is-new { animation: none !important; }
  .hm-fig, .hm-lean, .hm-head, .hm-part, .hm-pop, .hm-eyes, .hm-drop, .hm-shoe, .hm-shoe--r, .hm-rope, .hm-clock, .hm-bub, .hm-dust__p, .hm-res.is-rise { animation: none !important; }
  .hm-bub { opacity: 1; }
  .hm-face { transition: none; }
  .hm-s5 .hm-drop { opacity: 1; }
  .gw-qa__a.is-in, .gw-reveal.is-turning .gw-reveal__one .gw-card, .hm-tile.is-new, .gw-ask-me.is-in, .gw-dots i, .gw-bubble, .gw-drama__card, .gw-zoom, .gw-card--zoom { animation: none; }
}

/* ==========================================================================
   29. ميني جولف
   --------------------------------------------------------------------------
   JS_MiniGolf.html. The course is a 3D canvas that takes the whole view at
   every size (the play area gets the space); what the player needs to read
   sits over it as a compact strip of chips at the top, a line at the foot,
   the players' chips, and a card between holes and at the end. The chips are
   frosted ink over the sky and the grass, the same in both themes: they sit
   on the course, not on the page.
   ========================================================================== */
#view-play-minigolf:not(.hidden), #view-room-minigolf:not(.hidden) { display: flex; flex-direction: column; min-height: 0; }
#view-play-minigolf > .mg-host, #view-room-minigolf > .mg-screen { flex: 1 1 auto; min-height: 0; align-self: stretch; width: 100%; }
.mg-host { display: flex; flex-direction: column; min-height: 0; }
.mg-screen { flex: 1 1 auto; display: flex; min-height: 0; gap: var(--sp-3); width: 100%; }
.mg-stage {
  --mg-ink: rgba(22, 18, 32, 0.66);
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 15rem;
  border-radius: var(--r-2xl);
  overflow: hidden;
  background: linear-gradient(#bfe3f2, #9fcf8f);
  box-shadow: var(--sh-3);
  isolation: isolate;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.mg-canvas-host { position: absolute; inset: 0; }
.mg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.mg-msg {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: var(--sp-3); padding: var(--sp-6);
  text-align: center; color: #1d2a1f; font-weight: var(--fw-semi); font-size: var(--fs-body, 1rem);
}
.mg-msg p { margin: 0; }
.mg-msg.hidden { display: none; }

/* --- the strip at the top --- */
.mg-hud {
  position: absolute; top: var(--sp-2); inset-inline: var(--sp-2);
  display: flex; justify-content: center; pointer-events: none; z-index: 2;
}
.mg-hud__row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.375rem; }
.mg-chip {
  display: inline-flex; align-items: center; gap: 0.3rem;
  min-height: 1.875rem; padding: 0.2rem 0.7rem;
  border-radius: var(--r-full);
  background: var(--mg-ink);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  color: #fff; font-size: 0.8125rem; font-weight: var(--fw-semi); line-height: 1.2;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  white-space: nowrap;
}
.mg-chip b { font-family: var(--font-display); font-weight: var(--fw-bold); }
.mg-chip__name { font-weight: var(--fw-med); opacity: 0.85; }
.mg-chip--strokes { background: rgba(255, 255, 255, 0.92); color: #1d1a2b; }
.mg-chip--turn { background: #ffd23f; color: #2b2300; }
.mg-chip--clock { font-variant-numeric: tabular-nums; }
.mg-chip--clock.is-low { background: #d62839; }
.mg-chip--par { direction: ltr; }
/* the final stroke a hole allows (par + 3): said, in red, before it is played */
.mg-chip--last { background: #d62839; color: #fff; animation: mgLastPulse 1.2s ease-in-out infinite; }
@keyframes mgLastPulse { 50% { transform: scale(1.06); } }

/* --- the line at the foot, the players' chips, the host's buttons --- */
.mg-hint {
  position: absolute; bottom: var(--sp-3); left: 50%;
  max-width: calc(100% - 1.5rem);
  padding: 0.3rem 0.95rem; border-radius: var(--r-full);
  background: var(--mg-ink); color: #fff;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-weight: var(--fw-bold); font-size: 0.875rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none; z-index: 2;
  opacity: 0; transform: translate(-50%, 6px);
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
.mg-hint.is-on { opacity: 1; transform: translate(-50%, 0); }
.mg-hint:empty { visibility: hidden; }
.mg-players {
  position: absolute; bottom: calc(var(--sp-3) + 2.4rem); inset-inline: var(--sp-2);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem; pointer-events: none; z-index: 2;
}
.mg-players:empty { display: none; }
.mg-pchip {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.15rem 0.55rem; border-radius: var(--r-full);
  background: rgba(22, 18, 32, 0.55); color: #fff; font-size: 0.75rem; font-weight: var(--fw-med);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  max-width: 9rem;
}
.mg-pchip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mg-pchip b { font-family: var(--font-display); }
.mg-pchip.is-me { background: rgba(255, 255, 255, 0.9); color: #1d1a2b; }
.mg-pchip.is-up { outline: 2px solid #ffd23f; }
.mg-pchip.is-away { opacity: 0.55; }
.mg-dot { width: 0.7rem; height: 0.7rem; flex: none; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.35); }
.mg-hostrow { position: absolute; top: calc(var(--sp-2) + 2.25rem); inset-inline-end: var(--sp-2); z-index: 3; }
.mg-hostrow .room-host-row { margin-top: 0 !important; }
.mg-hostrow:empty { display: none; }
/* A phone with no course drawn putts with a button (mgRoomPlain), above the host's row. */
.mg-plain { display: flex; justify-content: flex-end; margin-bottom: var(--sp-2); }

/* --- the banner: a word for how a hole went --- */
.mg-banner {
  position: absolute; inset-inline: 0; top: 34%;
  display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
  pointer-events: none; z-index: 3;
  opacity: 0; transform: scale(0.6);
  transition: opacity 250ms var(--ease-out), transform 350ms var(--ease-spring);
}
.mg-banner.is-on { opacity: 1; transform: scale(1); }
.mg-banner__text {
  font-family: var(--font-display); font-weight: var(--fw-black);
  font-size: clamp(2rem, 9vmin, 4.2rem); line-height: 1.1; color: #fff; text-align: center;
  text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 2px 0 rgba(0, 0, 0, 0.25);
  padding-inline: var(--sp-4);
}
.mg-banner small { color: #fff; font-weight: var(--fw-bold); font-size: 1rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
.mg-banner--ace .mg-banner__text { color: #ffd23f; font-size: clamp(2.4rem, 11vmin, 5rem); }
.mg-banner--good .mg-banner__text { color: #b8ff9f; }
.mg-banner--water .mg-banner__text { color: #bfe6ff; font-size: clamp(1.6rem, 7vmin, 3rem); }
.mg-banner--picked .mg-banner__text { font-size: clamp(1.4rem, 6vmin, 2.6rem); }

/* --- a new hole's card: flies in, rests, and flies up to the strip --- */
.mg-namecard {
  position: absolute; top: 30%; left: 50%;
  display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
  padding: var(--sp-4) var(--sp-6);
  border-radius: var(--r-2xl);
  background: rgba(255, 255, 255, 0.94); color: #1d1a2b;
  box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.45);
  pointer-events: none; z-index: 4;
  opacity: 0; transform: translate(-50%, 0) scale(0.7);
  min-width: 12rem;
}
.mg-namecard.is-on { animation: mg-namecard 2.2s var(--ease-out) both; }
@keyframes mg-namecard {
  0%   { opacity: 0; transform: translate(-50%, 30px) scale(0.7) rotate(-4deg); }
  16%  { opacity: 1; transform: translate(-50%, 0) scale(1.04) rotate(1deg); }
  24%  { transform: translate(-50%, 0) scale(1) rotate(0); }
  70%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -180%) scale(0.45); }
}
.mg-namecard__n { font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.9rem; line-height: 1; color: var(--accent-ink); }
.mg-namecard__n small { font-size: 0.55em; opacity: 0.6; margin-inline-start: 0.15em; }
.mg-namecard__name { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: 1.25rem; }
.mg-namecard__par { font-size: 0.8rem; font-weight: var(--fw-semi); color: #5b566f; }

/* --- the card between holes, and the end --- */
.mg-panel {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: var(--sp-3);
  background: rgba(10, 20, 14, 0.28);
  overflow-y: auto;
  touch-action: pan-y;
  animation: mg-fade var(--dur-3) var(--ease-out) both;
}
.mg-panel.hidden { display: none; }
@keyframes mg-fade { from { opacity: 0; } to { opacity: 1; } }
.mg-panel__card {
  width: min(100%, 30rem); margin: auto;
  display: flex; flex-direction: column; gap: var(--sp-3);
  animation: mg-rise var(--dur-4) var(--ease-spring) both;
}
.mg-panel__card--over { width: min(100%, 36rem); }
@keyframes mg-rise { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
.mg-panel__word { margin: 0; font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.75rem; line-height: 1.15; color: var(--accent-ink); text-align: center; }
.mg-panel .btn-stack { margin: 0; }
.mg-results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.mg-res { display: flex; align-items: center; gap: var(--sp-2); padding: 0.35rem 0.6rem; border-radius: var(--r-md); background: var(--surface-2); }
.mg-res.is-me { outline: 2px solid var(--accent); }
.mg-res__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--fw-semi); }
.mg-res__word { color: var(--text-2); font-size: 0.8125rem; font-weight: var(--fw-med); }
.mg-res b { font-family: var(--font-display); font-size: 1.1rem; min-width: 1.5rem; text-align: center; }
.mg-next { text-align: center; margin: 0; }
/* «ماتش بلاي» (7 Oct 2026): who took the hole, and everyone's points so far. */
.mg-res__pt { padding: 0 0.45rem; border-radius: var(--r-full); background: var(--success-btn); color: var(--success-on); font-size: 0.8125rem; font-weight: 800; }
.mg-match { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); }
.mg-match__title { flex-basis: 100%; font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--text-2); }
.mg-match__who { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.875rem; font-weight: var(--fw-semi); }
.mg-match__who.is-me { color: var(--accent-ink); }
.mg-match__who b { font-family: var(--font-display); font-size: 1.05rem; }
.mg-match--tv { background: var(--surface-solid, #fff); box-shadow: var(--sh-2); }
.mg-match--tv .mg-match__title { font-size: var(--tv-xs); }
.mg-match--tv .mg-match__who { font-size: var(--tv-sm); }
.mg-chip--pts { background: rgba(255, 255, 255, 0.92); color: #1d1a2b; }
/* The pull's power (7 Oct 2026): the % beside the ball, in the arrow's colour. */
.mg-power {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 2;
  padding: 0.1rem 0.45rem;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.94);
  color: var(--mg-power-c, #1d1a2b);
  border: 2px solid var(--mg-power-c, #1d1a2b);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.875rem;
  line-height: 1.2;
  pointer-events: none;
  opacity: 0;
  white-space: nowrap;
  direction: ltr;
}
.mg-power.is-on { opacity: 1; }

/* the scorecard: holes across, a row a player; it scrolls sideways when it must */
.mg-card { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--border); }
.mg-card table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; }
/* eighteen holes: the first nine, then the rest with the total */
.mg-card table + table { border-top: 2px solid var(--border); }
.mg-card.mg-card--two table { font-size: 0.75rem; }
.mg-card.mg-card--two th, .mg-card.mg-card--two td { padding: 0.3rem 0.12rem; }
.mg-card.mg-card--two .mg-card__who { max-width: 5.5rem; }
.mg-card--two .mg-card__c.is-ace { border-radius: 0.5rem; }
.mg-card th, .mg-card td { padding: 0.3rem 0.35rem; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mg-card thead th { color: var(--text-3); font-weight: var(--fw-semi); background: var(--surface-2); }
.mg-card__par td, .mg-card__par th { color: var(--text-2); font-size: 0.75rem; background: var(--surface-2); }
.mg-card tbody tr + tr { border-top: 1px solid var(--hairline); }
.mg-card tbody tr.is-me { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.mg-card__who { text-align: start !important; width: 99%; max-width: 8rem; overflow: hidden; text-overflow: ellipsis; font-weight: var(--fw-semi); }

/* --- a phone on its side and every wide screen: the course still takes it all --- */

}

  .mg-players { inset-inline-start: var(--sp-3); inset-inline-end: auto; bottom: var(--sp-3); flex-direction: column; align-items: flex-start; }

}

/* --- the TV: the course big, every player and the scorecard beside it --- */
.mg-tv { display: flex; min-height: 0; }
.mg-screen--tv { flex: 1 1 auto; gap: var(--tv-gap); }
.mg-screen--tv .mg-stage { border-radius: var(--tv-r); min-height: 0; }

.mg-screen--tv .mg-hostrow { top: auto; bottom: var(--tv-gap); inset-inline-end: var(--tv-gap); }
.mg-side {
  flex: 0 0 clamp(16rem, 30vw, 34rem); min-width: 0; min-height: 0;
  display: flex; flex-direction: column; gap: var(--tv-gap); overflow-y: auto;
}
.mg-side__players { display: flex; flex-direction: column; gap: calc(var(--tv-gap) * 0.6); }
.mg-side .mg-pchip { max-width: none; font-size: var(--tv-sm); padding: 0.35em 0.9em; background: var(--surface-solid, #fff); color: var(--text); box-shadow: var(--sh-2); }
.mg-side .mg-pchip b { margin-inline-start: auto; font-size: 1.2em; }
.mg-side .mg-pchip.is-up { outline: 3px solid #ffd23f; }

.mg-side .mg-card table { font-size: var(--tv-sm); }
.mg-side .mg-card th, .mg-side .mg-card td { padding: 0.45em 0.5em; }
.mg-side .mg-card__par td, .mg-side .mg-card__par th { font-size: var(--tv-xs); }
.mg-side .mg-card__tot b { font-size: 1.15em; }
.mg-side .mg-card__tot small { font-size: 0.7em; }
.mg-side .mg-card__who { max-width: 12em; }
.mg-side .mg-card--two th, .mg-side .mg-card--two td { padding: 0.35em 0.18em; }

@media (orientation: portrait) {

}

@media (prefers-reduced-motion: reduce) {
  .mg-namecard.is-on { animation: none; opacity: 1; transform: translate(-50%, 0); }
  .mg-banner, .mg-hint { transition: none; }

}

/* ==========================================================================
   27. حرب السفن
   JS_Battleship.html: the one-phone game against the phone, the room phones
   and the TV. The sea itself is a WebGL canvas (three.js), laid over a
   gradient of the same sea so the stage is never an empty box while it
   loads; where WebGL can't draw it is the flat board (.bs-flat). The screen
   is the duels' (section 18): the pills, the status, the line; the stage
   takes the space, the rest is a compact column beside it on a phone held
   sideways and on anything wide, and under it upright. The two sides'
   colours are the pills' too: the first seat (or you) blue, the other orange.
   ========================================================================== */
.bs-game { --duel-c1: #3b82f6; --duel-c2: #f97316; }
.bs-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.bs-layout__side { display: contents; }
/* Upright: who plays on top, then the sea, then what to do, then the rest. */
.bs-head { order: -2; }
.bs-layout__stage { order: -1; min-width: 0; }
.bs-bar { order: 0; }
.bs-side { order: 1; display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.bs-head .duel-status { margin-top: var(--sp-2); }

.bs-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.02;
  min-height: 17rem;
  max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 17rem);
  border-radius: var(--r-xl);
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, #cfe6f7 0%, #7fb2d8 38%, #1b5f8c 72%, #0f4668 100%);
  box-shadow: var(--sh-3), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
  isolation: isolate;
}
:where(body.dark) .bs-stage { background: radial-gradient(120% 90% at 50% 0%, #2a3658 0%, #16294a 40%, #0b2239 75%, #071828 100%); box-shadow: var(--sh-3), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.bs-view {
  position: absolute;
  inset: 0;
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* Dragging a ship must not scroll the page. */
.bs-view.is-placing { touch-action: none; cursor: grab; }
.bs-view.is-firing { cursor: crosshair; }
.bs-canvas { display: block; width: 100%; height: 100%; }

/* The name over each sea, placed by the renderer at its far edge. */
.bs-label {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  pointer-events: none;
  max-width: 60%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0.125rem 0.625rem;
  margin-top: -0.25rem;
  border-radius: var(--r-full);
  background: color-mix(in srgb, var(--bs-c, #3b82f6) 85%, #0b1220);
  color: #fff;
  font-size: var(--fs-xs);
