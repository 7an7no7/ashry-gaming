/* --- the clock and the cues -------------------------------------------------------------- */

function skrStopClock() {
  if (skrLocal.clock) skrLocal.clock.stop();
  skrLocal.clock = null;
  skrLocal.clockKey = null;
}

/** Draws the turn clock; the server passes the turn when it runs out. */
function skrTickClock(s) {
  const endsAt = s && (s.phase === 'play' || s.phase === 'thiefGuess' || s.phase === 'memorize') ? s.endsAt : null;
  const paint = () => {
    const left = endsAt ? Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)) : 0;
    document.querySelectorAll('[data-skr-clock]').forEach(el => {
      el.textContent = '⏱️ ' + left;
      el.classList.toggle('badge--danger', left <= 10);
      el.classList.toggle('badge--accent', left > 10);
    });
    // The memorising look's big numbers (over your two cards, and on the TV).
    document.querySelectorAll('[data-skr-count]').forEach(el => {
      if (el.textContent !== String(left)) {
        el.textContent = left;
        if (el.animate && !motionOff()) el.animate([{ transform: 'scale(1.35)', opacity: 0.6 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, easing: 'ease-out' });
      }
    });
    return left;
  };
  if (!endsAt) { skrStopClock(); return; }
  paint();
  if (skrLocal.clockKey === endsAt && skrLocal.clock) return;
  skrStopClock();
  skrLocal.clockKey = endsAt;
  skrLocal.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)),
    onTick: () => {
      const left = paint();
      const st = Room.state;
      const ss = st && st.game === 'screw' ? st.shared || {} : null;
      // The last seconds tick on the TV and on the phone the clock is waiting for: the player up, or a vote not cast.
      const mine = ss && (ss.phase === 'thiefGuess' ? skrInGame(st) && skrVoted(st).indexOf(Room.me) === -1
        : ss.phase === 'memorize' ? skrInGame(st) && (ss.ready || []).indexOf(Room.me) === -1
        : ss.turn && ss.turn.stage === 'boom' ? skrBoomWaits(st, Room.me)
        : !!ss.turn && ss.turn.pid === Room.me);
      if (left > 0 && left <= 5 && ss && ss.endsAt === endsAt && (st.youAreScreen || mine)) playSound('tick');
    },
    onEnd: () => { skrLocal.clock = null; paint(); }
  });
}

/** A buzz when the turn comes to this phone, or the thief vote opens on it (not on a reload). */
function skrTurnCue(state) {
  const s = state.shared || {};
  const mine = (s.phase === 'play' && !!s.turn && s.turn.pid === Room.me && s.turn.stage !== 'boom')
    || skrBoomWaits(state, Room.me)
    || (s.phase === 'thiefGuess' && skrInGame(state) && skrVoted(state).indexOf(Room.me) === -1);
  const was = skrLocal.turnMine;
  skrLocal.turnMine = mine;
  if (mine && !was && skrFx.watched === state.code) { playSound('tick'); haptic('medium'); }
  skrHandInView(state);
}

/**
 * On a phone the bar at the foot of the screen sat over your own cards just
 * when they mattered: the two to memorise, or the slot to play. Once per
 * moment (the deal, each turn of yours), the page scrolls so the hand is
 * whole above the bar - never past the top of the hand.
 */
function skrHandInView(state) {
  const s = state.shared || {};
  const wants = (s.phase === 'memorize' && (s.ready || []).indexOf(Room.me) === -1)
    || (s.phase === 'play' && !!s.turn && s.turn.pid === Room.me && s.turn.stage !== 'boom')
    || skrBoomWaits(state, Room.me);
  const key = wants ? [state.code, s.dealId, s.phase, s.turnSeq].join('|') : '';
  if (!wants || skrLocal.handInView === key) return;
  skrLocal.handInView = key;
  requestAnimationFrame(() => {
    const main = document.getElementById('shell-main');
    const root = document.getElementById('view-room-screw');
    const hand = root && root.querySelector('.skr-mine');
    const bar = root && root.querySelector('.skr-actbar');
    if (!main || !hand || !bar || appState.currentView !== 'room-screw') return;
    const h = hand.getBoundingClientRect();
    const b = bar.getBoundingClientRect();
    const top = main.getBoundingClientRect().top;
    const over = h.bottom + 8 - b.top;
    if (over <= 0) return;
    const by = Math.min(over, Math.max(0, h.top - top - 8));
    if (by > 0) main.scrollBy({ top: by, behavior: motionOff() ? 'auto' : 'smooth' });
  });
}

onRoomClocksReset(() => {
  skrStopClock();
  skrLocal.pick = null;
  skrLocal.seenClosed = '';
  skrFxCancel();
});

/* --- the flights ------------------------------------------------------------------------ */

/*
   Every move has its own motion, drawn over the table between exact places
   (data-skr-at: a slot, a hand, the deck, the pile, the card in hand). It is
   all Web Animations of transform and opacity on ghosts laid over the page
   (.skr-ghost, .skr-sign, .skr-ring, .skr-spark, .skr-band, .skr-sweep),
   removed when they finish and by a timer if they never do. A table redraw
   waits for the flights (skrFx.busyUntil). Ordinary moves stay under half a
   second, the special cards take up to about 1.2s, and everything is bigger
   on the TV. With motion off nothing flies: the slots a move touched still
   glow for a moment with their sign (skrFlash).
*/

const SKR_FLASH_MS = 3000;

function skrFxCancel() {
  skrFx.timers.forEach(clearTimeout);
  skrFx.timers = [];
  skrFx.held.forEach(el => { el._skrHolds = 0; el.classList.remove('skr-hold'); });
  skrFx.held.clear();
  skrFx.busyUntil = 0;
  skrFx.flash = {};
  clearTimeout(skrFx.flashTimer);
  skrFx.lastTurn = null;
}

/** Where every card, hand, the deck and the pile are, before a redraw takes them away. */
function skrSnapshot(root) {
  const rects = {};
  if (root && root.getClientRects().length) {
    root.querySelectorAll('[data-skr-at]').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.width) rects[el.getAttribute('data-skr-at')] = { left: r.left, top: r.top, width: r.width, height: r.height };
    });
  }
  skrFx.rects = rects;
}

function skrEl(root, key) {
  if (!root || !key) return null;
  const q = typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(key) : String(key).replace(/"/g, '\\"');
  return root.querySelector('[data-skr-at="' + q + '"]');
}

function skrSeatEl(root, pid) {
  if (!root || !pid) return null;
  const q = typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(pid) : String(pid).replace(/"/g, '\\"');
  return root.querySelector('[data-skr-seat="' + q + '"]');
}

/** A live element's place, or where it was before the redraw (a matched card's slot is gone). */
function skrRect(root, key) {
  if (key && typeof key === 'object') return key;
  const el = skrEl(root, key);
  if (el) {
    const r = el.getBoundingClientRect();
    if (r.width) return r;
  }
  return skrFx.rects[key] || null;
}

/** A seat's place: its hand, or its name when the hand is empty. */
function skrSeatRect(root, pid) {
  const hand = skrRect(root, 'hand:' + pid);
  if (hand && hand.width) return hand;
  const seat = skrSeatEl(root, pid);
  return seat ? seat.getBoundingClientRect() : null;
}

/** The middle of the table: the deck and the pile. */
function skrCenterRect(root) {
  const el = root && root.querySelector('.skr-center');
  return el ? el.getBoundingClientRect() : null;
}

const skrMid = (r) => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
const skrIsTv = (root) => !!(root && root.id === 'view-room-tv');

function skrHold(root, key) {
  const el = skrEl(root, key);
  if (!el) return;
  el._skrHolds = (el._skrHolds || 0) + 1;
  el.classList.add('skr-hold');
  skrFx.held.add(el);
}

function skrRelease(root, key) {
  const el = skrEl(root, key);
  if (!el || !el._skrHolds) return;
  el._skrHolds--;
  if (el._skrHolds) return;
  el.classList.remove('skr-hold');
  skrFx.held.delete(el);
  el.classList.remove('skr-landed');
  void el.offsetWidth;
  el.classList.add('skr-landed');
  setTimeout(() => el.classList.remove('skr-landed'), 420);
}

/** A fixed layer over the page at `rect`, in the table's colour (under <body> it is outside the screen's). */
function skrLayer(root, rect, cls, html) {
  const el = document.createElement('div');
  el.className = cls;
  const tinted = root && root.closest ? root.closest('[data-accent]') : null;
  if (tinted) el.setAttribute('data-accent', tinted.getAttribute('data-accent'));
  if (rect) el.style.cssText = 'left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;height:' + rect.height + 'px;--skr-w:' + rect.width + 'px';
  if (skrIsTv(root)) el.classList.add('is-tv');
  if (html) el.innerHTML = html;
  document.body.appendChild(el);
  return el;
}

/** Runs an animation on el, then `done` - on finish, or by a timer if it never finishes. */
function skrAnimate(el, frames, timing, done) {
  let over = false;
  const end = () => { if (over) return; over = true; if (done) done(); };
  const t = Object.assign({ fill: 'both' }, timing);
  const anim = el.animate(frames, t);
  anim.onfinish = end;
  setTimeout(end, (t.duration || 0) + (t.delay || 0) + 700);
  return anim;
}

const skrCanMove = () => !motionOff() && !!(document.body && document.body.animate);

/**
 * A card from one place to another: `from` a key or a rect, `to` a key; face
 * (a card id, or null for the back); flip 'up' turns it face up on the way,
 * 'down' face down. `hold` is released when it lands, or by a timer.
 * opts: duration, arc (px the path bows up at its middle), spin (deg), delay.
 */
function skrFly(root, from, toKey, face, flip, hold, opts) {
  const o = opts || {};
  const release = () => (hold || []).forEach(k => skrRelease(root, k));
  const a = skrRect(root, from);
  const toEl = typeof toKey === 'object' ? null : skrEl(root, toKey);
  const b = typeof toKey === 'object' ? toKey : toEl ? toEl.getBoundingClientRect() : skrFx.rects[toKey];
  if (!a || !b || !b.width || !a.width || !skrCanMove()) { release(); return; }
  // The ghost keeps the look of the card it leaves (a small one stays a numeral or an icon while it grows).
  const fly = { size: 'fly', full: a.width >= SKR_FULL_PX };
  const first = flip === 'up' ? skrCardHtml(null, fly) : skrCardHtml(face, fly);
  const second = flip === 'up' ? skrCardHtml(face, fly) : flip === 'down' ? skrCardHtml(null, fly) : '';
  const ghost = skrLayer(root, a, 'skr-ghost', '<div class="skr-ghost__flip"><div class="skr-ghost__face">' + first + '</div>' +
    (second ? '<div class="skr-ghost__face skr-ghost__face--b">' + second + '</div>' : '') + '</div>');
  const dx = b.left + b.width / 2 - (a.left + a.width / 2);
  const dy = b.top + b.height / 2 - (a.top + a.height / 2);
  const scale = b.width / a.width;
  const duration = o.duration || SKR_FLY_MS;
  const timing = { duration: duration, delay: o.delay || 0, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' };
  const arc = (o.arc || 0) * (skrIsTv(root) ? 1.8 : 1);
  const spin = o.spin || 0;
  const frames = [{ transform: 'translate(0px, 0px) scale(1) rotate(0deg)' }];
  if (arc || spin) frames.push({ transform: 'translate(' + dx / 2 + 'px, ' + (dy / 2 - arc) + 'px) scale(' + ((1 + scale) / 2 * 1.08) + ') rotate(' + spin / 2 + 'deg)', offset: 0.5 });
  frames.push({ transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ') rotate(' + spin + 'deg)' });
  if (second) {
    const flipper = ghost.firstElementChild;
    flipper.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)', offset: 0.5 }, { transform: 'scaleX(1)' }], Object.assign({ fill: 'both' }, timing));
    flipper.children[0].animate([{ opacity: 1 }, { opacity: 1, offset: 0.5 }, { opacity: 0, offset: 0.501 }, { opacity: 0 }], Object.assign({ fill: 'both' }, timing));
    flipper.children[1].animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1, offset: 0.501 }, { opacity: 1 }], Object.assign({ fill: 'both' }, timing));
  }
  skrAnimate(ghost, frames, timing, () => { ghost.remove(); release(); });
}

/**
 * A card turning over where it lies, over its slot: face up (and back down
 * after `back` ms, when set), with an optional lift and tilt while it is up.
 * The slot's own card is hidden meanwhile.
 */
function skrTurnOver(root, key, face, opts) {
  const o = opts || {};
  const r = skrRect(root, key);
  if (!r || !r.width || !skrCanMove()) return;
  const live = skrEl(root, key);
  if (live) skrHold(root, key);
  // `down`: from the face to the back (the memorised cards turning over at the end of the look).
  const fly = { size: 'fly', full: r.width >= SKR_FULL_PX };
  const firstFace = skrCardHtml(o.down ? face : null, fly);
  const secondFace = skrCardHtml(o.down ? null : face, fly);
  const ghost = skrLayer(root, r, 'skr-ghost', '<div class="skr-ghost__shake"><div class="skr-ghost__flip"><div class="skr-ghost__face">' + firstFace +
    '</div><div class="skr-ghost__face skr-ghost__face--b">' + secondFace + '</div></div></div>');
  const turn = 240;
  const hold = o.back || 0;
  const total = turn + hold + (hold ? turn : 0);
  const at = (ms) => Math.min(1, ms / total);
  const lift = (o.lift || 0) * (skrIsTv(root) ? 1.8 : 1);
  const tilt = o.tilt || 0;
  const flipper = ghost.firstElementChild.firstElementChild;
  const timing = { duration: total, delay: o.delay || 0, easing: 'linear' };
  if (o.shake && hold) {
    const d = 7 * (skrIsTv(root) ? 1.8 : 1);
    ghost.firstElementChild.animate([
      { transform: 'none' }, { transform: 'none', offset: at(turn) },
      { transform: 'translateX(' + -d + 'px)', offset: at(turn + hold * 0.2) }, { transform: 'translateX(' + d + 'px)', offset: at(turn + hold * 0.45) },
      { transform: 'translateX(' + -d / 2 + 'px)', offset: at(turn + hold * 0.7) }, { transform: 'none', offset: at(turn + hold) }, { transform: 'none' }
    ], Object.assign({ fill: 'both' }, timing));
  }
  const flipFrames = [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)', offset: at(turn / 2) }, { transform: 'scaleX(1)', offset: at(turn) }];
  const aFrames = [{ opacity: 1 }, { opacity: 1, offset: at(turn / 2) }, { opacity: 0, offset: at(turn / 2 + 1) }];
  const bFrames = [{ opacity: 0 }, { opacity: 0, offset: at(turn / 2) }, { opacity: 1, offset: at(turn / 2 + 1) }];
  if (hold) {
    flipFrames.push({ transform: 'scaleX(1)', offset: at(turn + hold) }, { transform: 'scaleX(0)', offset: at(turn + hold + turn / 2) }, { transform: 'scaleX(1)' });
    aFrames.push({ opacity: 0, offset: at(turn + hold + turn / 2) }, { opacity: 1, offset: at(turn + hold + turn / 2 + 1) }, { opacity: 1 });
    bFrames.push({ opacity: 1, offset: at(turn + hold + turn / 2) }, { opacity: 0, offset: at(turn + hold + turn / 2 + 1) }, { opacity: 0 });
  } else {
    flipFrames.push({ transform: 'scaleX(1)' });
    aFrames.push({ opacity: 0 });
    bFrames.push({ opacity: 1 });
  }
  flipper.animate(flipFrames, Object.assign({ fill: 'both' }, timing));
  flipper.children[0].animate(aFrames, Object.assign({ fill: 'both' }, timing));
  flipper.children[1].animate(bFrames, Object.assign({ fill: 'both' }, timing));
  const up = 'translateY(' + (-lift) + 'px) rotate(' + tilt + 'deg) scale(' + (lift ? 1.08 : 1) + ')';
  const frames = hold
    ? [{ transform: 'none' }, { transform: up, offset: at(turn) }, { transform: up, offset: at(turn + hold) }, { transform: 'none' }]
    : [{ transform: 'none' }, { transform: up, offset: 0.6 }, { transform: 'none' }];
  skrAnimate(ghost, frames, Object.assign({}, timing, { easing: 'ease-in-out' }), () => {
    ghost.remove();
    if (live) skrRelease(root, key);
  });
}

/** A card lifting where it lies, and settling back (tilted toward its owner for a peek). */
function skrLift(root, key, opts) {
  const o = opts || {};
  const el = skrEl(root, key);
  if (!el || !skrCanMove()) return;
  const lift = (o.lift || 10) * (skrIsTv(root) ? 1.8 : 1);
  const up = 'translateY(' + (-lift) + 'px) rotate(' + (o.tilt || 0) + 'deg) scale(1.1)';
  el.animate([{ transform: 'none' }, { transform: up, offset: 0.3 }, { transform: up, offset: 0.7 }, { transform: 'none' }],
    { duration: o.duration || 520, delay: o.delay || 0, easing: 'ease-in-out' });
}

/** A sign that rises over a place and fades: 👁️ over a looked-at slot, 📣 over a hand. */
function skrPop(root, key, text, big, delay) {
  const r = typeof key === 'object' ? key : skrRect(root, key);
  if (!r || !r.width || !skrCanMove()) return;
  const el = skrLayer(root, null, 'skr-pop' + (big ? ' skr-pop--big' : ''));
  el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top = (r.top + r.height / 2) + 'px';
  skrAnimate(el, [
    { transform: 'translate(-50%, -50%) scale(0.4)', opacity: 0 },
    { transform: 'translate(-50%, -85%) scale(1.15)', opacity: 1, offset: 0.25 },
    { transform: 'translate(-50%, -95%) scale(1)', opacity: 1, offset: 0.72 },
    { transform: 'translate(-50%, -125%) scale(0.9)', opacity: 0 }
  ], { duration: 1200, delay: delay || 0, easing: 'ease-out' }, () => el.remove());
}

/**
 * An emoji travelling from one place to another (a 🔍 to the card it spies
 * on, a 🏓 bouncing to the skipped seat, a cannonball, a pin, a bag of
 * money): its path bows up `arc` px, `bounces` times.
 */
function skrToss(root, from, to, emoji, opts) {
  const o = opts || {};
  const a = typeof from === 'object' ? from : skrRect(root, from);
  const b = typeof to === 'object' ? to : skrRect(root, to);
  if (!a || !b || !a.width || !b.width || !skrCanMove()) return;
  const el = skrLayer(root, null, 'skr-sign' + (o.big ? ' skr-sign--big' : ''));
  el.textContent = emoji;
  const p = skrMid(a);
  const q = skrMid(b);
  el.style.left = p.x + 'px';
  el.style.top = p.y + 'px';
  const tv = skrIsTv(root) ? 1.8 : 1;
  const arc = (o.arc === undefined ? 50 : o.arc) * tv;
  const bounces = Math.max(1, o.bounces || 1);
  const steps = 8 * bounces;
  const frames = [];
  for (let k = 0; k <= steps; k++) {
    const f = k / steps;
    const hop = Math.abs(Math.sin(Math.PI * f * bounces)) * arc * (bounces > 1 ? 1 - f * 0.45 : 1);
    const x = (q.x - p.x) * f;
    const y = (q.y - p.y) * f - hop;
    frames.push({ transform: 'translate(-50%, -50%) translate(' + x + 'px, ' + y + 'px) rotate(' + ((o.spin || 0) * f) + 'deg) scale(' + (k === steps ? 1.25 : 1) + ')', opacity: k === 0 ? 0.2 : 1 });
  }
  skrAnimate(el, frames, { duration: o.duration || 520, delay: o.delay || 0, easing: 'linear' }, () => {
    if (o.stay) {
      el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, delay: o.stay, fill: 'both' }).onfinish = () => el.remove();
      setTimeout(() => el.remove(), o.stay + 900);
    } else {
      el.remove();
    }
  });
}

/** A ring spreading out from a place and fading: a shout, a shockwave, a flash. */
function skrRing(root, where, opts) {
  const o = opts || {};
  const r = typeof where === 'object' ? where : skrRect(root, where);
  if (!r || !r.width || !skrCanMove()) return;
  const size = Math.max(r.width, r.height) * (o.size || 1);
  const c = skrMid(r);
  const el = skrLayer(root, { left: c.x - size / 2, top: c.y - size / 2, width: size, height: size }, 'skr-ring' + (o.tone ? ' skr-ring--' + o.tone : ''));
  skrAnimate(el, [
    { transform: 'scale(0.2)', opacity: 0.95 },
    { transform: 'scale(' + (o.scale || 2.2) + ')', opacity: 0 }
  ], { duration: o.duration || 620, delay: o.delay || 0, easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' }, () => el.remove());
}

/** A handful of sparks bursting out of a place (a right throw, بصرة, بوم). */
function skrSparks(root, where, opts) {
  const o = opts || {};
  const r = typeof where === 'object' ? where : skrRect(root, where);
  if (!r || !r.width || !skrCanMove()) return;
  const c = skrMid(r);
  const n = o.count || 8;
  const reach = Math.max(r.width, r.height) * (o.reach || 0.9);
  for (let i = 0; i < n; i++) {
    const el = skrLayer(root, null, 'skr-spark' + (o.tone ? ' skr-spark--' + o.tone : ''));
    el.textContent = o.glyph || '✦';
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    const ang = (Math.PI * 2 * i) / n + (i % 2 ? 0.3 : 0);
    const d = reach * (0.7 + (i % 3) * 0.15);
    skrAnimate(el, [
      { transform: 'translate(-50%, -50%) scale(0.3)', opacity: 1 },
      { transform: 'translate(-50%, -50%) translate(' + Math.cos(ang) * d + 'px, ' + Math.sin(ang) * d + 'px) scale(1)', opacity: 0 }
    ], { duration: 520, delay: o.delay || 0, easing: 'cubic-bezier(0.1, 0.7, 0.3, 1)' }, () => el.remove());
  }
}

/** A word stamped onto a place: "+25", "×2". */
function skrStamp(root, where, text, opts) {
  const o = opts || {};
  const r = typeof where === 'object' ? where : skrRect(root, where);
  if (!r || !r.width || !skrCanMove()) return;
  const el = skrLayer(root, null, 'skr-stamp' + (o.tone ? ' skr-stamp--' + o.tone : ''));
  el.textContent = text;
  const c = skrMid(r);
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  skrAnimate(el, [
    { transform: 'translate(-50%, -50%) scale(2.6) rotate(-8deg)', opacity: 0 },
    { transform: 'translate(-50%, -50%) scale(1) rotate(-8deg)', opacity: 1, offset: 0.2 },
    { transform: 'translate(-50%, -50%) scale(1) rotate(-8deg)', opacity: 1, offset: 0.8 },
    { transform: 'translate(-50%, -60%) scale(0.95) rotate(-8deg)', opacity: 0 }
  ], { duration: o.duration || 1100, delay: o.delay || 0, easing: 'ease-out' }, () => el.remove());
}

/** A band across the table for a moment: "الورق خلص: آخر لفة". */
function skrBand(root, text, opts) {
  const o = opts || {};
  const r = root && root.getBoundingClientRect ? root.getBoundingClientRect() : null;
  if (!r || !r.width || !skrCanMove()) return;
  const vh = window.innerHeight || r.height;
  const top = Math.max(r.top, 0);
  const bottom = Math.min(r.bottom, vh);
  const mid = top + (bottom - top) * 0.42;
  const el = skrLayer(root, null, 'skr-band' + (o.tone ? ' skr-band--' + o.tone : ''));
  el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top = mid + 'px';
  el.style.maxWidth = (r.width - 16) + 'px';
  skrAnimate(el, [
    { transform: 'translate(-50%, -50%) scaleX(0.2)', opacity: 0 },
    { transform: 'translate(-50%, -50%) scaleX(1.04)', opacity: 1, offset: 0.14 },
    { transform: 'translate(-50%, -50%) scaleX(1)', opacity: 1, offset: 0.2 },
    { transform: 'translate(-50%, -50%) scaleX(1)', opacity: 1, offset: 0.85 },
    { transform: 'translate(-50%, -50%) scaleX(1)', opacity: 0 }
  ], { duration: o.duration || 1500, delay: o.delay || 0, easing: 'ease-out' }, () => el.remove());
}

/** A soft light sweeping across a place: the lantern of المسحراتي, the shimmer of a protected hand, the vote's spotlight. */
function skrSweep(root, where, opts) {
  const o = opts || {};
  const r = typeof where === 'object' ? where : skrRect(root, where);
  if (!r || !r.width || !skrCanMove()) return;
  const el = skrLayer(root, r, 'skr-sweep' + (o.tone ? ' skr-sweep--' + o.tone : ''));
  skrAnimate(el, [
    { transform: 'translateX(-60%)', opacity: 0 },
    { transform: 'translateX(-20%)', opacity: 1, offset: 0.3 },
    { transform: 'translateX(40%)', opacity: 1, offset: 0.7 },
    { transform: 'translateX(70%)', opacity: 0 }
  ], { duration: o.duration || 700, delay: o.delay || 0, easing: 'ease-in-out' }, () => el.remove());
}

/** Something on the table pulsing (a drum beat on the whole table, a shout from a seat). */
function skrPulse(el, opts) {
  const o = opts || {};
  if (!el || !el.animate || !skrCanMove()) return;
  const s = o.scale || 1.03;
  const frames = [{ transform: 'none' }];
  const times = o.times || 1;
  for (let i = 0; i < times; i++) {
    frames.push({ transform: 'scale(' + s + ')', offset: (i + 0.35) / times });
    frames.push({ transform: 'none', offset: (i + 1) / times });
  }
  el.animate(frames, { duration: (o.duration || 300) * times, delay: o.delay || 0, easing: 'ease-out' });
}

/** A light shake of something (a wrong throw, the whole table under the scream). */
function skrShakeEl(el, opts) {
  const o = opts || {};
  if (!el || !el.animate || !skrCanMove()) return;
  const d = o.distance || 7;
  el.animate([
    { transform: 'translateX(0px)' }, { transform: 'translateX(' + -d + 'px)', offset: 0.2 }, { transform: 'translateX(' + d + 'px)', offset: 0.45 },
    { transform: 'translateX(' + -d / 2 + 'px)', offset: 0.7 }, { transform: 'translateX(0px)' }
  ], { duration: o.duration || 460, delay: o.delay || 0, easing: 'ease-in-out' });
}

function skrShake(root, key, delay) { skrShakeEl(skrEl(root, key), { delay: delay }); }

/** A seat greyed for a moment (a turn lost to بينج, a pass). */
function skrDim(root, pid, opts) {
  const el = skrSeatEl(root, pid);
  if (!el || !el.animate || !skrCanMove()) return;
  el.animate([{ opacity: 1 }, { opacity: 0.35, offset: 0.2 }, { opacity: 0.35, offset: 0.8 }, { opacity: 1 }],
    { duration: (opts && opts.duration) || 900, delay: (opts && opts.delay) || 0, easing: 'ease-in-out' });
}

/** A card turning face up where it lies, from its edge (the cannon's hand). */
function skrFlipIn(root, key, delay) {
  const el = skrEl(root, key);
  if (!el || !el.animate || !skrCanMove()) return;
  el.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 300, delay: delay || 0, easing: 'ease-out', fill: 'backwards' });
}

/** A new slot growing at the end of a hand (a penalty card, a gift). */
function skrGrow(root, key, delay) {
  const el = skrEl(root, key);
  const slot = el && el.closest ? el.closest('.skr-slot') : null;
  if (!slot || !slot.animate || !skrCanMove()) return;
  slot.animate([{ transform: 'scale(0.3)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 280, delay: delay || 0, easing: 'cubic-bezier(0.2, 1.3, 0.4, 1)', fill: 'backwards' });
}

/** على كيفك: the four powers flick past like a wheel and land on the chosen one. */
function skrWheel(root, where, icons, chosen, delay) {
  const r = typeof where === 'object' ? where : skrRect(root, where);
  if (!r || !r.width || !skrCanMove() || !icons.length) return;
  const el = skrLayer(root, null, 'skr-pop skr-pop--big skr-wheel');
  const c = skrMid(r);
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  el.style.opacity = '0';
  const turns = [];
  let t = delay || 0;
  const n = icons.length * 2 + Math.max(0, icons.indexOf(chosen));
  for (let i = 0; i <= n; i++) {
    const icon = i === n ? chosen : icons[i % icons.length];
    turns.push([t, icon, i === n]);
    t += 45 + i * 6;
  }
  turns.forEach(([ms, icon, last]) => skrFx.timers.push(setTimeout(() => {
    el.style.opacity = '1';
    el.textContent = icon;
    el.animate(last
      ? [{ transform: 'translate(-50%, -50%) scale(0.7)' }, { transform: 'translate(-50%, -50%) scale(1.3)', offset: 0.5 }, { transform: 'translate(-50%, -50%) scale(1)' }]
      : [{ transform: 'translate(-50%, -20%) scale(0.85)', opacity: 0.4 }, { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 }],
      { duration: last ? 320 : 80, fill: 'both' });
  }, ms)));
  const end = t + 520;
  skrFx.timers.push(setTimeout(() => el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'both' }).onfinish = () => el.remove(), end));
  setTimeout(() => el.remove(), end + 900);
}

/** The pile's cards gathering, riffling in two halves and settling as the new deck. */
function skrRiffle(root, fromKey, toKey, delay) {
  const a = skrRect(root, fromKey);
  const b = skrRect(root, toKey);
  if (!a || !b || !a.width || !b.width || !skrCanMove()) return;
  const n = 8;
  const tv = skrIsTv(root) ? 1.8 : 1;
  for (let i = 0; i < n; i++) {
    const ghost = skrLayer(root, a, 'skr-ghost', skrCardHtml(null, { size: 'fly', full: a.width >= SKR_FULL_PX }));
    const side = i % 2 ? 1 : -1;
    const dx = b.left + b.width / 2 - (a.left + a.width / 2);
    const dy = b.top + b.height / 2 - (a.top + a.height / 2);
    const s = b.width / a.width;
    skrAnimate(ghost, [
      { transform: 'translate(0px, 0px) rotate(0deg)', opacity: 0 },
      { transform: 'translate(' + side * 22 * tv + 'px, ' + (-4 * i) + 'px) rotate(' + side * 12 + 'deg)', opacity: 1, offset: 0.35 },
      { transform: 'translate(' + (dx / 2) + 'px, ' + (dy / 2 - 10 * tv) + 'px) rotate(' + side * 4 + 'deg) scale(' + (1 + s) / 2 + ')', opacity: 1, offset: 0.7 },
      { transform: 'translate(' + dx + 'px, ' + dy + 'px) rotate(0deg) scale(' + s + ')', opacity: 1 }
    ], { duration: 700, delay: (delay || 0) + (i % 2 ? 35 : 0) + Math.floor(i / 2) * 40, easing: 'ease-in-out' }, () => ghost.remove());
  }
}

/** الخشاف: four cards fanning out of the deck toward the card in hand, and gathering there. */
function skrFan(root, delay) {
  const a = skrRect(root, 'deck');
  const b = skrRect(root, 'held');
  if (!a || !b || !a.width || !b.width || !skrCanMove()) return;
  const tv = skrIsTv(root) ? 1.8 : 1;
  const dx = b.left + b.width / 2 - (a.left + a.width / 2);
  const dy = b.top + b.height / 2 - (a.top + a.height / 2);
  [-21, -7, 7, 21].forEach((deg, i) => {
    const ghost = skrLayer(root, a, 'skr-ghost', skrCardHtml(null, { size: 'fly', full: a.width >= SKR_FULL_PX }));
    const spread = (i - 1.5) * 16 * tv;
    skrAnimate(ghost, [
      { transform: 'translate(0px, 0px) rotate(0deg)' },
      { transform: 'translate(' + (dx * 0.6 + spread) + 'px, ' + (dy * 0.6 - 26 * tv) + 'px) rotate(' + deg + 'deg)', offset: 0.45 },
      { transform: 'translate(' + (dx * 0.6 + spread) + 'px, ' + (dy * 0.6 - 26 * tv) + 'px) rotate(' + deg + 'deg)', offset: 0.75 },
      { transform: 'translate(' + dx + 'px, ' + dy + 'px) rotate(0deg) scale(' + b.width / a.width + ')' }
    ], { duration: 1000, delay: (delay || 0) + i * 50, easing: 'ease-in-out' }, () => ghost.remove());
  });
}

/** الخشاف chosen: one card lifts in hand, the other three slide back under the deck. */
function skrFanBack(root, delay) {
  if (!skrCanMove()) return;
  skrLift(root, 'held', { lift: 12, delay: delay });
  for (let i = 0; i < 3; i++) skrFly(root, 'held', 'deck', null, null, null, { duration: 420, delay: (delay || 0) + 80 + i * 70, arc: 10 });
}

/** A few pieces of confetti over one seat (a hand that ran out). */
function skrSeatConfetti(root, pid) {
  const r = skrSeatRect(root, pid);
  if (!r || !r.width || !skrCanMove() || typeof confetti !== 'function') return;
  const w = window.innerWidth || 1;
  const h = window.innerHeight || 1;
  try { confetti({ particleCount: 60, spread: 70, startVelocity: 28, origin: { x: (r.left + r.width / 2) / w, y: (r.top + r.height / 2) / h } }); } catch (e) {}
}

/* --- the sounds of the table ---------------------------------------------------- */

/** A short sound for a move, never one that depends on a hidden card. */
function skrSound(name) {
  if (document.hidden) return;
  if (typeof playFx === 'function' && typeof FX !== 'undefined' && FX[name]) playFx(name);
  else if (name === 'skrThump' || name === 'skrDrum') playSound('alarm');
}

/* --- the glow a move leaves for a moment -------------------------------------------- */

function skrFlashOf(key) {
  const f = skrFx.flash[key];
  return f && f.until > Date.now() && f.from <= Date.now() ? f : null;
}

/** A glowing element's attributes: its key (so it can be taken off in place), and its animation carried on from where it was when a redraw drew it again. */
function skrFlashAttrs(key, f) {
  return ` data-skr-flash-key="${escapeHTML(key)}" style="--skr-flash-at:${-Math.max(0, Date.now() - f.from)}ms"`;
}

function skrFlashBadge(f) {
  return f && f.text ? `<span class="skr-flash" data-skr-flash>${escapeHTML(f.text)}</span>` : '';
}

/** Marks a slot ('slot:id'), a seat ('seat:pid') or the pile to glow with a sign, from `at` ms. */
function skrFlash(key, text, at) {
  if (!key) return;
  const from = Date.now() + Math.max(0, at || 0);
  skrFx.flash[key] = { text: text || '', from: from, until: from + SKR_FLASH_MS };
}

/** Puts the glows that have started on the table in place, and takes off the ones that are over. */
function skrFlashPaint(root) {
  if (!root) return;
  const now = Date.now();
  root.querySelectorAll('.is-flash').forEach(el => {
    const key = el.getAttribute('data-skr-flash-key');
    const f = key && skrFx.flash[key];
    if (key && (!f || f.until <= now)) {
      el.classList.remove('is-flash');
      el.style.removeProperty('--skr-flash-at');
      el.querySelectorAll(':scope > [data-skr-flash], :scope > .skr-pile > [data-skr-flash]').forEach(b => b.remove());
    }
  });
  Object.keys(skrFx.flash).forEach(key => {
    const f = skrFx.flash[key];
    if (f.until <= now) { delete skrFx.flash[key]; return; }
    if (f.from > now) return;
    let el = null;
    let badgeIn = null;
    if (key.indexOf('slot:') === 0) {
      const card = skrEl(root, key);
      el = card && card.closest ? card.closest('.skr-slot') : null;
      badgeIn = el;
    } else if (key.indexOf('seat:') === 0) {
      el = skrSeatEl(root, key.slice(5));
    } else if (key === 'pile') {
      const pile = skrEl(root, 'pile');
      el = pile && pile.closest ? pile.closest('.skr-zone') : null;
      badgeIn = pile ? pile.parentElement : null;
    }
    if (!el) return;
    el.setAttribute('data-skr-flash-key', key);
    if (!el.classList.contains('is-flash')) {
      el.classList.add('is-flash');
      el.style.setProperty('--skr-flash-at', (-(now - f.from)) + 'ms');
      if (f.text && badgeIn && !badgeIn.querySelector(':scope > [data-skr-flash]')) badgeIn.insertAdjacentHTML('beforeend', skrFlashBadge(f));
    }
  });
  clearTimeout(skrFx.flashTimer);
  const next = Object.keys(skrFx.flash).map(k => skrFx.flash[k]).reduce((m, f) => Math.min(m, f.from > now ? f.from : f.until), Infinity);
  if (next !== Infinity) {
    skrFx.flashTimer = setTimeout(() => {
      const st = Room.state;
      if (!st || st.game !== 'screw') return;
      skrFlashPaint(document.getElementById(st.youAreScreen ? 'view-room-tv' : 'view-room-screw'));
    }, Math.max(30, next - now + 20));
  }
}

/** The places a move touched, with the sign each glows with. */
function skrFlashItems(state, e) {
  const name = (pid) => skrName(state, pid);
  const slot = (id) => 'slot:' + id;
  const seat = (pid) => 'seat:' + pid;
  const out = [];
  if (e.pid) out.push([seat(e.pid), '']);
  switch (e.type) {
    case 'keep': out.push([slot(e.slot), '🆕']); break;
    case 'takePile': out.push([slot(e.slot), '⬆️ ' + skrCardLabel(e.card)]); break;
    case 'match': case 'pong':
      if (e.ok) out.push(['pile', e.type === 'pong' ? '🎾' : '🎯']);
      else out.push([slot(e.slot), '❌']);
      break;
    case 'basra': out.push(e.ok === false ? [slot(e.slot), '❌'] : ['pile', '🗑️']); break;
    case 'penalty': out.push([slot(e.slot), '➕']); break;
    case 'peekOwn': case 'spyOther': out.push([slot(e.slot), '👁️ ' + name(e.pid)]); break;
    case 'allAround':
      (e.picks || []).forEach(p => p && out.push([slot(p.slot), '👁️ ' + name(e.pid)]));
      (e.own || []).forEach(id => out.push([slot(id), '👁️ ' + name(e.pid)]));
      break;
    case 'blindSwap': out.push([slot(e.slot), '🔄'], [slot(e.slot2), '🔄']); break;
    case 'seeSwap':
      if (e.swapped && e.slot2) out.push([slot(e.slot), '🔄 👁️ ' + name(e.pid)], [slot(e.slot2), '🔄']);
      else out.push([slot(e.slot), '👁️ ' + name(e.pid)]);
      break;
    case 'give': out.push([slot(e.slot2), '🎁'], [seat(e.target), '']); break;
    case 'boomThrow': out.push(['pile', '💥']); break;
    case 'scream': Object.keys(e.counts || {}).forEach(pid => { if (pid !== e.pid) out.push([seat(pid), '']); }); break;
    case 'cannon': case 'ping': if (e.target) out.push([seat(e.target), '']); break;
    case 'discard': out.push(['pile', '']); break;
  }
  return out;
}

/** Glows for a list of moves with no flights (motion off): each at once. */
function skrFlashEvents(root, state, list) {
  list.forEach(e => skrFlashItems(state, e).forEach(([key, text]) => skrFlash(key, text, 0)));
  skrFlashPaint(root);
}

/* --- which moves to show ---------------------------------------------------------- */

const skrAddsToPile = (e) => ['discard', 'takePile', 'ping', 'wakeUp', 'boomThrow'].indexOf(e.type) !== -1 || (e.type === 'keep' && !!e.card) ||
  ((e.type === 'match' || e.type === 'pong' || e.type === 'basra') && e.ok !== false);

/** The pile's top right after event idx of the batch: the current top, stepped back past the cards put on it later. */
function skrPileAt(state, list, idx) {
  const pile = (state.shared || {}).pile || [];
  const later = list.slice(idx + 1).filter(skrAddsToPile).length;
  return pile[pile.length - 1 - later] || null;
}

/**
 * The events this device hasn't shown. A new deal seen by a page that was
 * already watching this room plays from the deal; a reload, a late joiner or
 * a phone that was on another screen starts from the end of the list.
 */
function skrEventsToPlay(state) {
  const s = state.shared || {};
  const events = s.events || [];
  const maxSeq = events.reduce((m, e) => Math.max(m, Number(e && e.seq) || 0), 0);
  const key = state.code + '|' + (s.dealId || '');
  if (skrFx.deal !== key) {
    const fresh = skrFx.watched === state.code;
    skrFx.deal = key;
    let from = maxSeq;
    if (fresh) {
      const deal = skrDealEvents(events)[0];
      if (deal && deal.type === 'deal') from = (Number(deal.seq) || 0) - 1;
    }
    skrFx.lastSeq = from;
  }
  const current = skrDealEvents(events);
  const out = current.filter(e => e && (Number(e.seq) || 0) > skrFx.lastSeq);
  skrFx.lastSeq = Math.max(skrFx.lastSeq, maxSeq);
  return out;
}

/** Just back from a locked screen or another app: what was missed is not played again (the latest move and the log say it). */
const skrWokeRecently = () => Date.now() - skrFx.wokeAt < 2500;
document.addEventListener('visibilitychange', () => { if (!document.hidden) skrFx.wokeAt = Date.now(); });

/** One sound for a batch: the loudest thing that happened. The same on every phone. */
function skrEventSounds(evs) {
  if (document.hidden) return;
  const has = (fn) => evs.some(fn);
  if (has(e => e.type === 'boomThrow')) { playSound('bomb'); skrSound('skrThump'); return; }
  if (has(e => e.type === 'scream')) return;   // its riffle sounds as the cards are shuffled (skrPlay)
  if (has(e => e.type === 'cannon')) { skrSound('skrThump'); return; }
  if (has(e => e.type === 'wakeUp')) { skrSound('skrDrum'); return; }
  if (has(e => e.type === 'reshuffle')) skrSound('skrRiffle');
  const bad = has(e => e.type === 'screw' || e.type === 'lastLap' || e.type === 'boom' || ((e.type === 'match' || e.type === 'pong') && !e.ok) || (e.type === 'basra' && e.ok === false));
  const good = has(e => ((e.type === 'match' || e.type === 'pong') && e.ok) || e.type === 'reveal' || e.type === 'finish');
  if (bad) playSound('alarm');
  else if (good) playSound('success');
  else if (has(e => ['draw', 'keep', 'discard', 'takePile', 'give', 'blindSwap', 'seeSwap', 'penalty', 'basra', 'deal', 'khoshaf'].indexOf(e.type) !== -1)) skrSound('skrFlick');
}

/** After a frame is drawn: the sounds, flights and glows for the events it brought. */
/**
 * A seat's cards stay in one row while they fit. When they don't, they stack
 * in two even rows - 2 over 2, 3 over 3 - and an odd card sits beside them,
 * centred (the owner's layout: a card dropping alone under three looked
 * broken). A hand too long even for that takes three rows.
 */
function skrStackHands(root) {
  if (!root || !root.getClientRects().length) return;
  root.querySelectorAll('.skr-seat .skr-slots').forEach(box => {
    box.classList.remove('is-stacked', 'is-odd');
    box.style.removeProperty('--skr-stack-cols');
    const kids = Array.from(box.children).filter(k => k.classList.contains('skr-slot'));
    const n = kids.length;
    if (n < 3) return;
    const gap = parseFloat(getComputedStyle(box).columnGap) || 0;
    const widths = kids.map(k => k.getBoundingClientRect().width);
    const room = box.clientWidth + 0.5;
    if (widths.reduce((a, b) => a + b, 0) + gap * (n - 1) <= room) return;
    const slot = Math.max.apply(null, widths);
    const fits = (cols) => cols * slot + gap * (cols - 1) <= room;
    let cols = Math.floor(n / 2);
    const odd = n % 2 === 1;
    if (fits(cols + (odd ? 1 : 0))) {
      box.classList.add('is-stacked');
      if (odd) box.classList.add('is-odd');
    } else {
      cols = Math.ceil(n / 3);
      box.classList.add('is-stacked');
    }
    box.style.setProperty('--skr-stack-cols', cols);
  });
}

// Turning the phone or resizing the window changes what fits.
let skrStackTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(skrStackTimer);
  skrStackTimer = setTimeout(() => {
    skrStackHands(document.getElementById('view-room-screw'));
    skrStackHands(document.getElementById('view-room-tv'));
  }, 120);
});

function skrAfterDraw(root, state) {
  skrStackHands(root);
  const s = state.shared || {};
  const evs = skrEventsToPlay(state);
  const turnWas = skrFx.lastTurn;
  const turn = s.phase === 'play' && s.turn ? { pid: s.turn.pid, stage: s.turn.stage } : null;
  skrFx.lastTurn = turn;
  skrFlashPaint(root);
  if (document.hidden || skrWokeRecently() || !root.getClientRects().length) return;
  // الخشاف chosen (no event says it): three cards back under the deck.
  if (turnWas && turnWas.stage === 'khoshaf' && !(turn && turn.pid === turnWas.pid && turn.stage === 'khoshaf') && s.phase === 'play') skrFanBack(root, 0);
  if (!evs.length) return;
  skrEventSounds(evs);
  if (s.phase === 'reveal' || s.phase === 'gameover' || evs.length > 10) return;
  if (!skrCanMove()) { skrFlashEvents(root, state, evs); return; }
  const delay = skrFx.prevPhase === 'lobby' ? 1000 : 0;   // the room's start splash first
  skrPlay(root, state, evs, delay);
}

/**
 * The round ends on the table it was played on: the moves that ended it (a
 * throw that emptied a hand, المسحراتي, the vote's close) play over the table
 * that is still on screen, and the reveal replaces it once they have. True
 * while they play.
 */
function skrPlayEnding(root, state) {
  const s = state.shared || {};
  if (!root || !root._skrTable || (s.phase !== 'reveal' && s.phase !== 'gameover')) return false;
  if (document.hidden || skrWokeRecently() || !skrCanMove() || !root.getClientRects().length) return false;
  const evs = skrEventsToPlay(state).filter(e => e.type !== 'reveal');
  if (!evs.length || evs.length > 10) return false;
  skrEventSounds(evs);
  skrPlay(root, state, evs, 0);
  return skrFx.busyUntil > Date.now();
}

/* --- each move, choreographed -------------------------------------------------------- */

function skrPlay(root, state, list, delay) {
  const s = state.shared || {};
  const you = state.you || {};
  const tv = skrIsTv(root);
  const steps = [];
  const at = (ms, fn) => steps.push([ms, fn]);
  let t = delay || 0;
  const hold = (key) => skrHold(root, key);
  const slotKey = (slot) => 'slot:' + slot;
  const flashAt = (e, ms) => skrFlashItems(state, e).forEach(([key, text]) => skrFlash(key, text, ms));
  const seen = (slot) => (Array.isArray(you.seen) ? you.seen.find(x => x && x.slot === slot) : null);
  const mineSeen = (e) => e.pid === Room.me && !state.youAreScreen;
  const upOf = (slotId) => {
    const hands = s.hands || {};
    for (const pid of Object.keys(hands)) { const h = (hands[pid] || []).find(x => x.id === slotId); if (h) return h.up || null; }
    return null;
  };
  const tableEl = root.querySelector('.skr-layout, .skr-tv') || root;
  list.forEach((e, idx) => {
    const A = e.pid;
    const handA = 'hand:' + A;
    const start = t;
    switch (e.type) {
      case 'deal': {
        // A quick riffle on the deck, then the cards round the table one seat after another, slot by slot; the first pile card flips up.
        at(t, () => skrRiffle(root, 'deck', 'deck', 0));
        t += 420;
        const order = skrOrder(state);
        const hands = s.hands || {};
        const most = order.reduce((m, pid) => Math.max(m, (hands[pid] || []).length), 0);
        const count = order.reduce((m, pid) => m + (hands[pid] || []).length, 0) || 1;
        const gap = Math.max(18, Math.min(60, Math.floor(1300 / count)));
        let k = 0;
        for (let i = 0; i < most; i++) {
          order.forEach(pid => {
            const h = (hands[pid] || [])[i];
            if (!h) return;
            const key = slotKey(h.id);
            hold(key);
            at(t + k * gap, () => skrFly(root, 'deck', key, null, null, [key], { duration: 360, arc: 14 }));
            k++;
          });
        }
        t += k * gap + 360;
        const top = skrPileAt(state, list, idx);
        if (top) { hold('pile'); at(t, () => skrFly(root, 'deck', 'pile', top, 'up', ['pile'], { duration: 380, arc: 20 })); t += 400; }
        break;
      }
      case 'reshuffle':
        at(t, () => { skrRiffle(root, 'pile', 'deck', 0); skrPop(root, 'deck', '🔀', true, 500); });
        t += 900;
        break;
      case 'draw': {
        // The top card lifts off the deck to the card in hand; the drawer sees it turn face up.
        hold('held');
        const face = A === Room.me && !state.youAreScreen && you.drawn && idx === list.length - 1 ? you.drawn : null;
        at(t, () => skrFly(root, 'deck', 'held', face, face ? 'up' : null, ['held'], { duration: 400, arc: 24 }));
        t += 440;
        break;
      }
      case 'khoshaf':
        at(t, () => { skrFan(root, 0); skrPop(root, 'deck', '🥣', true, 0); });
        t += 1050;
        break;
      case 'keep': {
        const key = slotKey(e.slot);
        hold(key);
        if (e.card) hold('pile');
        at(t, () => {
          skrFly(root, 'held', key, null, null, [key], { duration: 420, arc: 16 });
          if (e.card) skrFly(root, key, 'pile', e.card, 'up', ['pile'], { duration: 440, arc: 26, delay: 60 });
        });
        t += 500;
        break;
      }
      case 'discard':
        hold('pile');
        at(t, () => skrFly(root, 'held', 'pile', e.card || skrPileAt(state, list, idx), A === Room.me && !state.youAreScreen ? null : 'up', ['pile'], { duration: 420, arc: 22, spin: 8 }));
        t += 460;
        break;
      case 'takePile': {
        const key = slotKey(e.slot);
        const old = skrPileAt(state, list, idx);
        hold(key); if (old) hold('pile');
        at(t, () => {
          skrFly(root, 'pile', key, e.card, 'down', [key], { duration: 440, arc: 20 });
          if (old) skrFly(root, key, 'pile', old, 'up', ['pile'], { duration: 440, arc: -14, delay: 40 });
        });
        t += 500;
        break;
      }
      case 'match': case 'pong': case 'basra': {
        const key = slotKey(e.slot);
        if (e.type === 'pong') {
          // The ball goes back to whoever pinged.
          const from = list.slice(0, idx).reverse().find(x => x.type === 'ping');
          const pinger = (from && from.pid) || (s.turn && s.turn.pingFrom) || null;
          at(t, () => (pinger ? skrToss(root, handA, 'hand:' + pinger, '🎾', { arc: 40, bounces: 2, duration: 560 }) : skrPop(root, handA, '🎾', true)));
          t += 300;
        }
        const card = e.card || (e.type === 'pong' ? 'pong' : null);
        if (e.ok !== false) {
          // Right: turns face up where it lies, then snaps onto the pile with a burst.
          hold('pile');
          at(t, () => skrTurnOver(root, key, card || skrPileAt(state, list, idx), { lift: 6 }));
          at(t + 240, () => skrFly(root, key, 'pile', card || skrPileAt(state, list, idx), null, ['pile'], { duration: 300, arc: e.type === 'basra' ? 46 : 18 }));
          at(t + 520, () => skrSparks(root, 'pile', { count: e.type === 'basra' ? 10 : 7 }));
          t += 600;
        } else {
          // Wrong (or بصرة refused): turns face up for everyone, shakes, and turns back down in its place.
          at(t, () => {
            if (card) skrTurnOver(root, key, card, { back: 520, shake: true });
            else skrShake(root, key, 0);
          });
          t += 1020;
        }
        break;
      }
      case 'penalty': {
        const key = slotKey(e.slot);
        hold(key);
        at(t, () => { skrGrow(root, key, 0); skrFly(root, 'deck', key, null, null, [key], { duration: 420, arc: 20 }); });
        t += 460;
        break;
      }
      case 'screw':
        at(t, () => {
          skrRing(root, skrSeatRect(root, A), { tone: 'danger', scale: 1.8 });
          skrPop(root, handA, '📣', true);
          skrPulse(skrSeatEl(root, A), { scale: 1.04, times: 2, duration: 260 });
          skrProtected(s).concat(skrProtected(s).indexOf(A) === -1 ? [A] : []).forEach((pid, i) => skrSweep(root, skrSeatRect(root, pid), { tone: 'lock', delay: 380 + i * 90 }));
          skrBand(root, skrT('skr_band_screw', '📣 سكرو! آخر لفة', '📣 Screw! Last lap'), { tone: 'danger', delay: 250 });
        });
        t += 1150;
        break;
      case 'wakeUp': {
        // Drum beats (the table pulses twice), a lantern sweeps, every hand turns face up in a wave.
        hold('pile');
        at(t, () => { skrFly(root, 'held', 'pile', 'mesaharaty', 'up', ['pile'], { duration: 360, arc: 22 }); skrPop(root, handA, '🥁', true); });
        at(t + 120, () => skrPulse(tableEl, { scale: 1.015, times: 2, duration: 260 }));
        at(t + 420, () => skrSweep(root, tableEl.getBoundingClientRect(), { tone: 'lantern', duration: 760 }));
        const slots = root.querySelectorAll('[data-skr-at^="slot:"]');
        let w = 0;
        slots.forEach(el => {
          const key = el.getAttribute('data-skr-at');
          const face = upOf(key.slice(5));
          if (!face) return;
          const ms = t + 560 + Math.min(600, w * 35);
          at(ms, () => skrTurnOver(root, key, face, {}));
          w++;
        });
        t += 560 + Math.min(600, w * 35) + 260;
        break;
      }
      case 'asYouLike': {
        const icons = (typeof SKREW_AS_YOU_LIKE !== 'undefined' ? SKREW_AS_YOU_LIKE : []).map(p => skrPowerInfo(p).icon || '🃏');
        at(t, () => skrWheel(root, skrSeatRect(root, A), icons, skrPowerInfo(e.as).icon || '🃏', 0));
        t += 700;
        break;
      }
      case 'skip': case 'pass':
        at(t, () => { skrPop(root, handA, '⏭️', true); skrDim(root, A, { duration: 700 }); });
        t += 420;
        break;
      case 'ping':
        // The card to the pile, then the ball bounces across to the seat that loses its turn.
        hold('pile');
        at(t, () => skrFly(root, 'held', 'pile', 'ping', 'up', ['pile'], { duration: 320, arc: 18 }));
        if (e.target) {
          at(t + 300, () => skrToss(root, handA, 'hand:' + e.target, '🏓', { arc: 46, bounces: 3, duration: 640 }));
          at(t + 900, () => { skrDim(root, e.target, { duration: 800 }); skrPop(root, 'hand:' + e.target, '⏭️', true); });
          t += 1150;
        } else {
          t += 360;
        }
        break;
      case 'peekOwn': {
        // The card lifts, tilted toward its owner; the owner sees its face for a moment.
        const key = slotKey(e.slot);
        const look = mineSeen(e) ? seen(e.slot) : null;
        at(t, () => {
          if (look && look.card) skrTurnOver(root, key, look.card, { back: 600, lift: 10, tilt: -6 });
          else { skrLift(root, key, { lift: 10, tilt: -8, duration: 700 }); skrPop(root, key, '👁️'); }
        });
        t += look ? 1120 : 720;
        break;
      }
      case 'spyOther': {
        // A 🔍 sweeps from the spy's seat to the card, which lifts; the spy sees its face.
        const key = slotKey(e.slot);
        const look = mineSeen(e) ? seen(e.slot) : null;
        at(t, () => skrToss(root, skrSeatRect(root, A), key, '🔍', { arc: 30, duration: 360 }));
        at(t + 340, () => {
          if (look && look.card) skrTurnOver(root, key, look.card, { back: 560, lift: 10 });
          else { skrLift(root, key, { lift: 10, duration: 620 }); skrPop(root, key, '👁️'); }
        });
        t += look ? 1400 : 1000;
        break;
      }
      case 'allAround': {
        // The eye hops from seat to seat, card by card.
        const slots = (e.picks || []).map(p => p && p.slot).concat(e.own || []).filter(Boolean);
        const hop = slots.length ? Math.max(120, Math.min(260, Math.floor(1000 / slots.length))) : 0;
        let from = skrSeatRect(root, A);
        slots.forEach((slot, i) => {
          const key = slotKey(slot);
          const prev = from;
          at(t + i * hop, () => {
            skrToss(root, prev, key, '👁️', { arc: 22, duration: hop });
            const look = mineSeen(e) ? seen(slot) : null;
            if (look && look.card) skrTurnOver(root, key, look.card, { back: 380, lift: 8, delay: hop - 40 });
            else skrLift(root, key, { lift: 8, duration: 420, delay: hop - 40 });
          });
          from = skrRect(root, key) || from;
        });
        t += slots.length * hop + 360;
        break;
      }
      case 'blindSwap': case 'seeSwap': {
        const one = slotKey(e.slot);
        if (e.type === 'seeSwap') {
          const look = mineSeen(e) ? seen(e.slot) : null;
          at(t, () => skrToss(root, skrSeatRect(root, A), one, '🕵️', { arc: 30, duration: 340 }));
          at(t + 320, () => {
            if (look && look.card) skrTurnOver(root, one, look.card, { back: 420, lift: 10 });
            else skrLift(root, one, { lift: 10, duration: 520 });
          });
          t += 860;
        }
        if (e.type === 'blindSwap' || (e.swapped && e.slot2)) {
          // The two cards rise, arc past each other and land, with a swirl between them.
          const two = slotKey(e.slot2);
          hold(one); hold(two);
          at(t, () => {
            skrFly(root, one, two, null, null, [two], { duration: 560, arc: 44, spin: 180 });
            skrFly(root, two, one, null, null, [one], { duration: 560, arc: -44, spin: -180 });
            const a = skrRect(root, one);
            const b = skrRect(root, two);
            if (a && b) {
              const mid = { left: (a.left + b.left) / 2, top: (a.top + b.top) / 2, width: a.width, height: a.height };
              skrPop(root, mid, '🔄', true, 120);
            }
          });
          t += 620;
        }
        break;
      }
      case 'give': {
        const to = slotKey(e.slot2);
        hold(to);
        at(t, () => {
          skrGrow(root, to, 0);
          skrFly(root, slotKey(e.slot), to, null, null, [to], { duration: 520, arc: 40 });
          skrPop(root, 'hand:' + e.target, '🎁', true, 420);
        });
        t += 600;
        break;
      }
      case 'boom':
        // بوم played: a bang from the player's seat and a band - every other player now picks a card of their own.
        at(t, () => {
          skrPop(root, skrSeatRect(root, A), '💣', true);
          skrRing(root, skrSeatRect(root, A), { tone: 'danger', scale: 2, duration: 520 });
          skrPulse(tableEl, { scale: 1.012, duration: 300 });
          skrBand(root, '💣 ' + skrT('skr_band_boom', 'بوم! كل واحد يرمي كارت من كروته', 'Boom! Everyone throws one of their own cards'), { tone: 'danger', delay: 150 });
        });
        t += 700;
        break;
      case 'boomThrow': {
        // The cards thrown by بوم, one after another in seat order: a 💣 drops onto the card, 💥 on
        // the seat, and the card flies up and lands face up on the pile. A red screw or the thief
        // thrown this way is a lucky escape.
        const key = slotKey(e.slot);
        const throws = list.filter(x => x.type === 'boomThrow');
        const gap = Math.max(170, Math.min(420, Math.floor(2200 / Math.max(1, throws.length))));
        const r = skrRect(root, key);
        hold('pile');
        if (r) {
          const above = { left: r.left, top: r.top - r.height * 1.8, width: r.width, height: r.height };
          at(t, () => skrToss(root, above, key, '💣', { arc: 0, duration: 240 }));
        }
        at(t + 230, () => {
          skrRing(root, skrSeatRect(root, A), { tone: 'danger', scale: 1.5, duration: 380 });
          skrPop(root, skrSeatRect(root, A), '💥', true);
          skrShakeEl(skrSeatEl(root, A), { distance: 4 });
        });
        at(t + 260, () => skrFly(root, key, 'pile', e.card || skrPileAt(state, list, idx), 'up', ['pile'], { duration: 440, arc: 50, spin: 180 }));
        if (e.card === 'red25' || e.card === 'thief') at(t + 720, () => skrPop(root, skrSeatRect(root, A), '😅 ' + skrT('skr_boom_lucky', 'نجاة', 'Lucky escape')));
        t += gap;
        if (throws[throws.length - 1] === e) t += Math.max(0, 760 - gap);
        break;
      }
      case 'cannon': {
        // A cannonball arcs to the target's seat, a flash, and the hand turns face up (and stays).
        at(t, () => skrToss(root, skrSeatRect(root, A), skrSeatRect(root, e.target), '⚫', { arc: 80, duration: 560, big: true }));
        at(t + 540, () => { skrRing(root, skrSeatRect(root, e.target), { tone: 'danger', scale: 1.6, duration: 460 }); skrPop(root, 'hand:' + e.target, '💥', true); });
        const hand = (s.hands || {})[e.target] || [];
        hand.forEach((h, i) => at(t + 620, () => skrFlipIn(root, slotKey(h.id), i * 70)));
        t += 700 + hand.length * 70;
        break;
      }
      case 'scream': {
        // صرخة أوسكار: a shockwave from the middle; every unprotected hand's cards fly into it, are
        // riffled there and dealt back out face down, as many as each had. Protected hands stay
        // put, shimmering. The redraw already shows the new hands: their slots stay hidden until dealt.
        const center = skrCenterRect(root);
        const mid = skrRect(root, 'deck') || center;
        const guarded = skrProtected(s);
        const counts = e.counts && typeof e.counts === 'object' ? e.counts : null;
        const seats = (counts ? skrOrder(state).filter(pid => Object.prototype.hasOwnProperty.call(counts, pid)) : skrOrder(state)).filter(pid => guarded.indexOf(pid) === -1);
        const hands = seats.map(pid => ((s.hands || {})[pid] || []).map(h => slotKey(h.id)));
        const cards = [].concat.apply([], hands);
        const dealt = [];
        const most = hands.reduce((m, h) => Math.max(m, h.length), 0);
        for (let k = 0; k < most; k++) hands.forEach(h => { if (h[k]) dealt.push(h[k]); });
        cards.forEach(key => hold(key));
        at(t, () => {
          skrRing(root, center, { tone: 'accent', scale: 3.2, duration: 700 });
          skrPop(root, center || handA, '😱', true);
          skrShakeEl(tableEl, { distance: 5, duration: 420 });
        });
        guarded.forEach((pid, i) => at(t + 200 + i * 80, () => skrSweep(root, skrSeatRect(root, pid), { tone: 'lock' })));
        const gather = cards.length ? Math.max(4, Math.min(25, Math.floor(250 / cards.length))) : 0;
        at(t + 120, () => cards.forEach((key, i) => { const from = skrRect(root, key); if (from && mid) skrFly(root, from, mid, null, null, null, { duration: 340, arc: 18, delay: i * gather }); }));
        const riffleAt = t + 120 + cards.length * gather + 240;
        if (mid) at(riffleAt, () => { skrRiffle(root, mid, mid, 0); skrSound('skrRiffle'); });
        const dealAt = riffleAt + 450;
        const dealGap = dealt.length ? Math.max(6, Math.min(30, Math.floor(350 / dealt.length))) : 0;
        at(dealAt, () => dealt.forEach((key, i) => skrFly(root, mid, key, null, null, [key], { duration: 320, arc: 14, delay: i * dealGap })));
        t = dealAt + dealt.length * dealGap + 360;
        break;
      }
      case 'lastLap':
        at(t, () => {
          skrRing(root, 'deck', { tone: 'danger', scale: 2.4 });
          skrPop(root, 'deck', '💀', true);
          skrBand(root, '💀 ' + skrT('skr_band_last_lap', 'الورق خلص: آخر لفة', 'The deck is empty: last lap'), { tone: 'danger', delay: 200 });
        });
        t += 1100;
        break;
      case 'finish':
        at(t, () => {
          skrSparks(root, skrSeatRect(root, A), { count: 12, glyph: '✦', reach: 0.8 });
          skrPop(root, handA, '🏁', true);
          skrSeatConfetti(root, A);
          skrBand(root, '🏁 ' + skrT('skr_band_round_over', 'الجولة خلصت', 'The round is over'), { tone: 'success', delay: 300 });
        });
        t += 1200;
        break;
      case 'thiefVote':
        at(t, () => { skrPop(root, skrSeatRect(root, A), '✓'); skrPulse(skrSeatEl(root, A), { scale: 1.03 }); });
        t += 160;
        break;
      case 'accuse': {
        // Each vote flies as a pin to the seat it pointed at; then the handcuffs, or the stolen score.
        const r = s.results || {};
        const th = r.thief || {};
        const votes = th.votes || {};
        const center = skrCenterRect(root);
        const voters = Object.keys(votes);
        voters.forEach((voter, i) => {
          const target = votes[voter];
          at(t + i * 60, () => skrToss(root, skrSeatRect(root, voter), target ? skrSeatRect(root, target) : center, '📍', { arc: 36, duration: 460, stay: 500 }));
        });
        t += Math.min(700, voters.length * 60) + 480;
        if (th.holder && th.caught) {
          at(t, () => { skrPop(root, skrSeatRect(root, th.holder), '🚔', true); skrStamp(root, skrSeatRect(root, th.holder), '+25', { tone: 'danger', delay: 200 }); });
          t += 900;
        } else if (th.holder && th.stole) {
          const victims = (th.victims || []).map(key => (SKR_TEAM_KEYS.indexOf(key) !== -1 && Array.isArray(s.teams) ? (s.teams[SKR_TEAM_KEYS.indexOf(key)] || []) : [key])).reduce((a, b) => a.concat(b), []);
          victims.forEach((pid, i) => {
            at(t + i * 90, () => skrToss(root, skrSeatRect(root, pid), skrSeatRect(root, th.holder), '💰', { arc: 50, duration: 520 }));
            at(t + i * 90 + 300, () => skrStamp(root, skrSeatRect(root, pid), '+25', { tone: 'danger' }));
          });
          at(t + 520, () => skrPop(root, skrSeatRect(root, th.holder), '🦹', true));
          t += 900 + victims.length * 90;
        } else {
          at(t, () => skrPop(root, th.holder ? skrSeatRect(root, th.holder) : center, th.holder ? '🦹' : '🙅', true));
          t += 700;
        }
        break;
      }
    }
    // What the move touched glows once it has landed.
    flashAt(e, Math.max(start, t - 160));
    at(Math.max(start, t - 150), () => skrFlashPaint(root));
  });
  steps.forEach(([ms, fn]) => skrFx.timers.push(setTimeout(() => {
    try { fn(); } catch (err) { console.warn('skrew flight', err); }
  }, ms)));
  // Nothing held stays hidden: a flight that never ran still lands its card.
  const total = t + 60;
  skrFx.timers.push(setTimeout(() => {
    skrFx.held.forEach(el => { el._skrHolds = 0; el.classList.remove('skr-hold'); });
    skrFx.held.clear();
  }, total + SKR_FLY_MS + 900));
  skrFx.busyUntil = Math.max(skrFx.busyUntil, Date.now() + total);
}

/**
 * The reveal's own moments once the hands have turned: a ×2 stamp slams onto
 * a doubled caller, and a life jacket's ring glows while a line links it to
 * the card it copies (its value changing to that card's).
 */
function skrRevealMoments(root) {
  const box = root && root.querySelector('[data-skr-count-at]');
  if (!box || !skrCanMove()) return;
  const at = Number(box.getAttribute('data-skr-count-at')) || 0;
  skrFx.timers.push(setTimeout(() => {
    box.querySelectorAll('[data-skr-double]').forEach(el => skrStamp(root, el.getBoundingClientRect(), '×2', { tone: 'danger' }));
    box.querySelectorAll('[data-skr-copy]').forEach(el => {
      const row = el.closest('.skr-rrow__cards');
      const target = row && row.querySelector('[data-skr-card="' + el.getAttribute('data-skr-copy') + '"]');
      const a = el.getBoundingClientRect();
      skrRing(root, a, { tone: 'success', scale: 1.5, duration: 700 });
      if (!target) return;
      const b = target.getBoundingClientRect();
      const p = skrMid(a);
      const q = skrMid(b);
      const len = Math.hypot(q.x - p.x, q.y - p.y);
      const line = skrLayer(root, { left: p.x, top: p.y - 1.5, width: len, height: 3 }, 'skr-link');
      line.style.transform = 'rotate(' + Math.atan2(q.y - p.y, q.x - p.x) + 'rad)';
      skrAnimate(line, [
        { transform: 'rotate(' + Math.atan2(q.y - p.y, q.x - p.x) + 'rad) scaleX(0)', opacity: 1 },
        { transform: 'rotate(' + Math.atan2(q.y - p.y, q.x - p.x) + 'rad) scaleX(1)', opacity: 1, offset: 0.4 },
        { transform: 'rotate(' + Math.atan2(q.y - p.y, q.x - p.x) + 'rad) scaleX(1)', opacity: 0 }
      ], { duration: 1200, easing: 'ease-out' }, () => line.remove());
    });
  }, at + 150));
}

/** A frame waiting for a flight to land draws itself once it has. */
function skrDeferRedraw() {
  if (skrFx.redrawTimer) return;
  skrFx.redrawTimer = setTimeout(() => {
    skrFx.redrawTimer = null;
    const st = Room.state;
    if (!st || st.game !== 'screw' || st.phase === 'lobby') return;
    if (st.youAreScreen ? appState.currentView === 'room-tv' : onRoomView()) routeRoomState(st);
  }, Math.max(40, skrFx.busyUntil - Date.now() + 40));
}

// After the room has drawn this state: a device that wasn't showing the table
// (another screen, a spectator) counts the events as seen, so coming back
// replays nothing; and this page has now watched the room.
Room.onChange((state) => {
  if (!state) { skrFx.watched = ''; skrFx.prevPhase = ''; return; }
  if (state.game === 'screw' && state.phase !== 'lobby') {
    const showing = state.youAreScreen ? appState.currentView === 'room-tv' : (onRoomView() && state.inGame !== false);
    if (!showing) skrEventsToPlay(state);
  }
  skrFx.watched = state.code;
  skrFx.prevPhase = state.phase;
});

/* --- the TV -------------------------------------------------------------------------------- */

/** The running totals as a row of chips, lowest first, with this round's points. */
function skrTvChips(state) {
  const s = state.shared || {};
  const rows = skrStandings(state);
  if (!rows.length) return '';
  const round = (s.results && s.results.round) || {};
  const winners = s.phase === 'gameover' && Array.isArray(s.winners) ? s.winners : null;
  const top = (r) => (winners ? winners.indexOf(r.id) !== -1 : r.score === rows[0].score);
  const teams = skrTeamScoresLine(state);
  return `<div class="tv-strip-inline">${teams ? `<span class="tv-chip">${escapeHTML(teams)}</span>` : ''}${rows.map(r => `<span class="tv-chip ${top(r) ? 'is-done' : ''}">${top(r) ? '👑 ' : ''}${skrTeamDot(s, r.id)}${escapeHTML(r.name || '')} <b class="tv-chip__score">${r.score}</b>${typeof round[r.id] === 'number' ? ` <small><bdi dir="ltr">${skrSigned(round[r.id])}</bdi></small>` : ''}</span>`).join('')}</div>`;
}

function skrTvTable(state, t) {
  const s = state.shared || {};
  const order = skrOrder(state);
  const half = Math.ceil(order.length / 2);
  // Round the table: down the first side, up the other.
  const left = order.slice(0, half);
  const right = order.slice(half).reverse();
  const help = skrHelp(state);
  const ctx = { marks: help ? skrMarks(state) : {}, pick: null, faces: {}, size: 'md', tv: true, help: help };
  const seat = (pid) => skrSeatHtml(state, pid, ctx);
  const pad = order.length % 2 ? '<div class="skr-seat skr-seat--pad" aria-hidden="true"></div>' : '';
  const w = skrTurnWords(state);
  let title = w.title;
  let note = w.hint;
  let count = '';
  if (s.phase === 'memorize') {
    title = '🧠 ' + skrT('skr_tv_memorize', 'كل واحد يحفظ الكارتين اللي تحت', 'Everyone memorises their bottom two cards');
    note = skrT('skr_ready_count', 'جاهزين {n}/{m}', 'Ready {n}/{m}', { n: (s.ready || []).length, m: order.length });
    // A timed look: a big countdown the whole room can read.
    if (s.endsAt) count = `<div class="skr-tv__count metric" data-skr-count>${Math.max(0, Math.ceil((s.endsAt - Date.now()) / 1000))}</div>`;
  } else if (s.phase === 'thiefGuess') {
    title = '🦹 ' + skrT('skr_thief_q', 'مين معاه الحرامي؟', 'Who holds the thief?');
    note = skrRoundEndWords(state);
  }
  let host = '';
  if (state.youAreHost && s.phase === 'memorize') host = tvBtn('▶️ ' + skrT('skr_begin_round', 'ابدأ الجولة', 'Start the round'), "skrAct(this, 'beginRound')");
  if (state.youAreHost && s.phase === 'thiefGuess') host = tvBtn('🔒 ' + ((t || {}).vote_close || skrT('skr_vote_close', 'اقفل التصويت', 'Close the vote')), "skrAct(this, 'closeThiefVote')");
  const boom = s.phase === 'play' && s.turn && s.turn.stage === 'boom' ? (s.boom || {}) : null;
  if (state.youAreHost && boom) host = tvBtn('⏭️ ' + skrT('skr_boom_close', 'كمّل من غير الباقي', 'Go on without the rest'), `skrAct(this, '${SKR_BOOM_CLOSE}')`, 'ghost');
  const boomers = !boom ? '' : `<div class="tv-strip-inline">${skrOrder(state).filter(pid => (boom.waiting || []).concat(boom.picked || []).indexOf(pid) !== -1).map(pid => {
      const done = (boom.picked || []).indexOf(pid) !== -1;
      return `<span class="tv-chip ${done ? 'is-done' : ''}">${done ? '💣✓' : '⏳'} ${escapeHTML(skrName(state, pid, true))}</span>`;
    }).join('')}</div>`;
  // The vote on the TV: who has voted, by name - every phone votes, the screen never does.
  const voted = skrVoted(state);
  const voters = s.phase !== 'thiefGuess' ? '' : `<div class="tv-note">${escapeHTML(skrT('skr_voted_count', 'صوّتوا {n}/{m}', 'Voted {n}/{m}', { n: voted.filter(pid => order.indexOf(pid) !== -1).length, m: order.length }))}</div>
       <div class="tv-strip-inline">${order.map(pid => `<span class="tv-chip ${voted.indexOf(pid) !== -1 ? 'is-done' : ''}">${voted.indexOf(pid) !== -1 ? '✓' : '⏳'} ${escapeHTML(skrName(state, pid, true))}</span>`).join('')}</div>`;
  const rows = Math.max(1, half);
  return `<div class="skr-tv ${s.phase === 'thiefGuess' ? 'is-voting' : ''} ${order.length > 8 ? 'skr-tv--many' : ''}" style="--rows:${rows}">
      <div class="skr-tv__side">${left.map(seat).join('')}</div>
      <div class="skr-tv__mid">
        ${skrHeadHtml(state)}
        <div class="skr-tv__turn">${escapeHTML(title)}</div>
        ${note ? `<div class="tv-note">${escapeHTML(note)}</div>` : ''}
        ${count}
        ${voters}${boomers}
        ${skrLatestHtml(state, true)}
        ${skrCenterHtml(state, true)}
        <div class="tv-actions">${host}<span data-skr-host class="skr-tv__host"></span></div>
        ${skrLogHtml(state, skrLogCount(state, true))}
      </div>
      <div class="skr-tv__side">${pad}${right.map(seat).join('')}</div>
    </div>`;
}

TV_GAMES.screw = {
  sig(state) {
    const cur = skrServerSig(state);
    const view = document.getElementById('view-room-tv');
    if (skrFx.tvSig && cur !== skrFx.tvSig) {
      // A flight is landing: keep this frame until it has. A round that has just
      // ended plays its last moves on the table before the reveal.
      if (skrFx.busyUntil > Date.now()) { skrDeferRedraw(); return skrFx.tvSig; }
      if (view && skrPlayEnding(view, state)) { skrFx.tvEnding = true; skrDeferRedraw(); return skrFx.tvSig; }
    }
    return cur;
  },
  frame(state, t) {
    const view = document.getElementById('view-room-tv');
    skrRememberSlots(state);
    skrSnapshot(view);
    const s = state.shared || {};
    const ending = skrFx.tvEnding && skrFx.busyUntil > Date.now() && (s.phase === 'reveal' || s.phase === 'gameover');
    if (ending) {
      // The room's phase moved on, so the screen redraws now: the table as it was, until the last moves have played.
      if (view) view._skrTable = true;
      return skrTvTable(Object.assign({}, state, { shared: Object.assign({}, s, { hands: skrFx.tvHands || s.hands, phase: 'play', turn: null }) }), t);
    }
    skrFx.tvEnding = false;
    skrFx.tvSig = skrServerSig(state);
    const host = (html) => (state.youAreHost ? `<div class="tv-actions">${html}</div>` : '');
    if (view) view._skrTable = s.phase === 'memorize' || s.phase === 'play' || s.phase === 'thiefGuess';
    if (s.phase === 'gameover') {
      return `<div class="skr-tvover">
          <div class="skr-tvover__cards">${s.results ? skrRevealHtml(state, { tv: true }) : ''}</div>
          <div class="skr-tvover__side">
            <div class="tv-title tv-center-text">🏆 ${escapeHTML(skrWinnersLine(state))}</div>
            <div class="tv-note">${escapeHTML(skrT('skr_lowest_wins', 'الأقل نقط يكسب', 'Lowest score wins'))}</div>
            <div class="tv-scale">${skrPodiumHtml(state)}</div>
            ${skrTvChips(state)}
            ${host(tvBtn(t.play_again || 'لعبة جديدة', "skrAct(this, 'playAgain')") + tvBtn(t.room_another_game || 'لعبة أخرى', "roomAct('backToHub')", 'ghost'))}
          </div>
        </div>`;
    }
    if (s.phase === 'reveal') {
      return `<div class="skr-tvres">
          <div class="tv-title tv-center-text">🃏 ${escapeHTML(skrT('skr_reveal_title', 'كشف الكروت', 'The reveal'))} · ${escapeHTML(skrT('skr_round_of', 'جولة {n}/{m}', 'Round {n}/{m}', { n: s.round, m: s.rounds }))}</div>
          ${skrRevealHtml(state, { tv: true })}
          ${skrTvChips(state)}
          ${host(tvBtn(t.next_round || 'الجولة التالية', `skrAct(this, 'nextRound', { round: ${Number(s.round) || 0} })`))}
        </div>`;
    }
    skrFx.tvHands = s.hands;
    return skrTvTable(state, t);
  },
  after(state, rebuilt) {
    const view = document.getElementById('view-room-tv');
    const s = state.shared || {};
    skrTickClock(s);
    skrRefreshInPlace(view, state, true);
    if (skrFx.tvSig !== skrServerSig(state)) { skrDeferRedraw(); return; }
    if (!rebuilt || !view) return;
    skrAfterDraw(view, state);
    skrRevealCount(view);
    skrRevealMoments(view);
    if (s.phase === 'gameover' && typeof confetti === 'function' && motionFirst('skr-tv-over|' + state.code + '|' + (s.dealId || '') + '|' + JSON.stringify(s.scores || {}))) {
      afterReveal(view, () => confetti({ particleCount: 220, spread: 110, origin: { y: 0.6 } }));
    }
  }
};
