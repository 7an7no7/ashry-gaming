<script>
/* ============================================================================
   سودوكو — SUDOKU
   ----------------------------------------------------------------------------
   A 9×9 grid made in Sudoku.js (shared with the rooms server, which deals a
   race's grid): a full grid filled at random, then numbers taken away as
   long as the puzzle still has exactly one solution and the level's grade
   (sudokuGrade): easy is singles only (40 numbers), medium needs a pair or a
   pointing step (30), hard a triple, an X-wing or an XY-wing (about 27);
   none ever needs a guess. The daily one is built from soloDaySeed, so every phone
   gets the same puzzle that day.

   A number that isn't the solution's shows red and counts a mistake; notes
   (✏️) are small candidates in a cell and clear themselves when the number
   is placed in that row, column or box. A finished row, column or box ripples.
   Everything is in appState.sudoku, so a reload comes back to the same board.

   In سباق ألغاز (RACE_UI.sudoku, JS_RoomRace.html) the same grid and pad play
   the room's puzzle, easy only (the owner): the solution stays on the server,
   so a race marks a conflict red (the same number twice in a row, column or
   box, sudokuConflicts) instead of a mistake, counts no mistakes, has no
   hint, and sends the grid after every change (`move { cells }`) for the
   server to count and to say when it is solved.
   ========================================================================= */

let sudokuTimer = null;

function sudokuState() {
  const race = soloRaceState('sudoku');
  if (race) return race;
  if (!appState.sudoku) {
    appState.sudoku = { level: 'easy', daily: '', puzzle: '', solution: '', cells: '', notes: [], sel: -1,
                        notesMode: false, mistakes: 0, hints: 0, undo: [], startedAt: 0, pausedAt: 0, elapsed: 0, phase: 'setup' };
  }
  return appState.sudoku;
}

/* --- Setup ---------------------------------------------------------------------- */

function setupSudoku() {
  sudokuStopTimer();
  setView('setup-sudoku');
}

function paintSudokuSetup() {
  const s = sudokuState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#sudoku-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const best = soloBest('sudoku', s.level);
  const bestEl = document.getElementById('sudoku-best');
  if (bestEl) bestEl.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('sudoku-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('sudoku-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('sudoku', 'startSudoku(true)');
  sudokuMakeAhead(s.level);
}

function setSudokuLevel(level) {
  sudokuState().level = level;
  saveToLocal();
  paintSudokuSetup();
  sudokuMakeAhead(level);
}

/* A grid made ahead, while the phone is idle (the review of 1 Oct 2026): a medium or
   hard grid graded by technique can take tens of milliseconds to make (a hard one on a
   slow phone a few hundred), so the next free grid of the level on the setup screen is
   made before Start is tapped. The daily is made from its seed, as always. */
const sudokuAhead = {};
function sudokuMakeAhead(level) {
  if (!level || sudokuAhead[level] || level === 'easy') return;
  const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 300));
  idle(() => { if (!sudokuAhead[level]) sudokuAhead[level] = sudokuMake(level, Math.random); }, { timeout: 3000 });
}

// A grid with numbers or notes in it: a new one asks first (soloConfirmNew).
const sudokuHasWork = (s) => s.cells !== s.puzzle || (s.notes || []).some(Boolean);

function startSudoku(daily, sure) {
  if (!sure && soloConfirmNew('sudoku', sudokuHasWork, () => startSudoku(daily, true))) return;
  if (daily && soloDailyResume('sudoku')) return;
  soloDailySetAside('sudoku');
  soloNewGame('sudoku');
  const s = sudokuState();
  const level = daily ? 'medium' : s.level;
  const made = daily ? sudokuMake(level, soloRandom(soloDaySeed('sudoku'))) : (sudokuAhead[level] || sudokuMake(level, Math.random));
  if (!daily) { delete sudokuAhead[level]; sudokuMakeAhead(level); }
  s.daily = daily ? soloToday() : '';
  s.playLevel = level;
  s.puzzle = made.puzzle.join('');
  s.solution = made.solution.join('');
  s.cells = s.puzzle;
  s.notes = new Array(81).fill(0);
  s.sel = -1;
  s.notesMode = false;
  s.mistakes = 0;
  s.hints = 0;
  s.undo = [];
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.elapsed = 0;
  s.phase = 'play';
  saveToLocal();
  setView('play-sudoku');
  paintSudoku();
  sudokuArmTimer();
}

function continueSudoku() {
  const s = sudokuState();
  if (s.phase !== 'play') return;
  setView('play-sudoku');
  paintSudoku();
  sudokuArmTimer();
}

function sudokuArmTimer() {
  sudokuStopTimer();
  sudokuTimer = soloClock('sdk-time', () => sudokuState().startedAt);
}

function sudokuStopTimer() {
  if (sudokuTimer) sudokuTimer.stop();
  sudokuTimer = null;
}

/* --- The board ------------------------------------------------------------------ */

/** Whether a cell's number is right: against the solution alone, against the grid's own rules in a race. */
function sudokuCellOk(s, i, conflicts) {
  if (s.race) return s.cells[i] !== '0' && !conflicts.has(i);
  return s.cells[i] === s.solution[i];
}

function paintSudoku() {
  const s = sudokuState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('sudoku-stage');
  if (!el || !s.puzzle) return;
  const cells = s.cells;
  const selVal = s.sel >= 0 ? Number(cells[s.sel]) : 0;
  const peers = (i) => s.sel >= 0 && (Math.floor(i / 9) === Math.floor(s.sel / 9) || i % 9 === s.sel % 9 || SUDOKU_BOX[i] === SUDOKU_BOX[s.sel]);
  const conflicts = s.race ? sudokuConflicts(cells) : new Set();
  const placed = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) if (cells[i] !== '0' && sudokuCellOk(s, i, conflicts)) placed[Number(cells[i])]++;

  const bar = soloBarHtml([
    s.daily ? { label: t.daily_title || '', value: '📅' } : { label: t.solo_level || '', value: escapeHTML(t['solo_lvl_' + (s.playLevel || s.level)] || '') },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.elapsed), id: 'sdk-time' },
    s.race ? { label: t.race_unit_cells || '', value: `${Array.from(cells).filter((ch, i) => ch !== '0' && s.puzzle[i] === '0').length}/${Array.from(s.puzzle).filter(ch => ch === '0').length}`, id: 'sdk-filled' }
      : { label: t.sdk_mistakes || '', value: s.mistakes, id: 'sdk-mistakes' }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
    <div class="solo-layout__board">
    <div class="sdk-grid" dir="ltr" id="sdk-grid">
      ${Array.from({ length: 81 }, (_, i) => {
        const v = Number(cells[i]);
        const given = s.puzzle[i] !== '0';
        const wrong = v && !given && (s.race ? conflicts.has(i) : String(v) !== s.solution[i]);
        const cls = ['sdk-cell',
          given ? 'is-given' : '',
          i === s.sel ? 'is-sel' : (peers(i) ? 'is-peer' : ''),
          v && selVal && v === selVal ? 'is-same' : '',
          wrong ? 'is-wrong' : '',
          i % 9 === 2 || i % 9 === 5 ? 'is-box-end' : '',
          Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5 ? 'is-box-bottom' : ''].filter(Boolean).join(' ');
        const notes = !v && s.notes[i]
          ? `<span class="sdk-notes">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<i>${s.notes[i] & (1 << n) ? n : ''}</i>`).join('')}</span>` : '';
        return `<button type="button" class="${cls}" data-i="${i}" onclick="selectSudoku(${i})">${v || notes}</button>`;
      }).join('')}
    </div>
    </div>
    <div class="solo-layout__side">
    ${bar}
    <div class="sdk-pad" dir="ltr">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `
        <button type="button" class="sdk-key" onclick="enterSudoku(${n})" ${placed[n] >= 9 ? 'disabled' : ''}>
          <span>${n}</span><small>${Math.max(0, 9 - placed[n])}</small>
        </button>`).join('')}
    </div>
    <div class="sdk-tools">
      <button type="button" class="btn btn--neutral btn--sm" onclick="undoSudoku()" ${s.undo.length ? '' : 'disabled'}>↶ ${escapeHTML(t.solo_undo || '')}</button>
      <button type="button" class="btn btn--neutral btn--sm" onclick="eraseSudoku()">⌫ ${escapeHTML(t.sdk_erase || '')}</button>
      <button type="button" class="btn btn--sm ${s.notesMode ? 'btn--primary' : 'btn--neutral'}" onclick="toggleSudokuNotes()" aria-pressed="${s.notesMode}">✏️ ${escapeHTML(t.sdk_notes || '')}</button>
      ${s.race ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="hintSudoku()">💡 ${escapeHTML(t.solo_hint || '')}</button>`}
    </div>
    </div>
    </div>
    ${s.race ? '' : `<div class="view-actions play-foot">
      <button class="btn btn--ghost btn--sm btn--auto play-exit" onclick="setupSudoku()">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
}

function selectSudoku(i) {
  const s = sudokuState();
  if (s.phase !== 'play') return;
  s.sel = s.sel === i ? -1 : i;
  paintSudoku();
}

function sudokuPushUndo(i) {
  const s = sudokuState();
  s.undo.push({ i: i, v: s.cells[i], n: s.notes[i] });
  if (s.undo.length > 200) s.undo.shift();
}

function sudokuSetCell(i, v) {
  const s = sudokuState();
  s.cells = s.cells.slice(0, i) + v + s.cells.slice(i + 1);
}

function enterSudoku(n) {
  const s = sudokuState();
  if (s.phase !== 'play' || s.sel < 0 || s.puzzle[s.sel] !== '0') return;
  const i = s.sel;
  if (s.notesMode && s.cells[i] !== '0') return;
  sudokuPushUndo(i);
  if (s.notesMode) {
    s.notes[i] ^= (1 << n);
    saveToLocal();
    paintSudoku();
    return;
  }
  if (s.cells[i] === String(n)) {
    sudokuSetCell(i, '0');
  } else {
    sudokuSetCell(i, String(n));
    s.notes[i] = 0;
    const right = s.race ? !sudokuConflicts(s.cells).has(i) : s.solution[i] === String(n);
    if (!right && !s.race) {
      s.mistakes++;
      // ideas batch: solo - a soft miss, a lighter buzz; the cell shakes and the count pops.
      haptic('medium');
      playSound('miss');
      saveToLocal();
      paintSudoku();
      soloShake(document.querySelector(`#sdk-grid [data-i="${i}"]`));
      if (typeof motionBump === 'function') motionBump(document.getElementById('sdk-mistakes'), 1.35);
      return;
    } else if (right) {
      // The number is settled here: it can't be a candidate for its row, column or box.
      // The pencil marks it clears go on this move's undo step, so undo puts them back.
      const step = s.undo[s.undo.length - 1];
      for (let k = 0; k < 81; k++) {
        if (k !== i && (Math.floor(k / 9) === Math.floor(i / 9) || k % 9 === i % 9 || SUDOKU_BOX[k] === SUDOKU_BOX[i]) && (s.notes[k] & (1 << n))) {
          if (step) (step.peers = step.peers || {})[k] = s.notes[k];
          s.notes[k] &= ~(1 << n);
        }
      }
    } else {
      haptic('heavy');
    }
  }
  saveToLocal();
  paintSudoku();
  if (sudokuCellOk(s, i, s.race ? sudokuConflicts(s.cells) : new Set())) sudokuCelebrateUnits(i);
  sudokuCheck();
}

function eraseSudoku() {
  const s = sudokuState();
  if (s.phase !== 'play' || s.sel < 0 || s.puzzle[s.sel] !== '0') return;
  sudokuPushUndo(s.sel);
  sudokuSetCell(s.sel, '0');
  s.notes[s.sel] = 0;
  saveToLocal();
  paintSudoku();
  sudokuCheck();
}

function undoSudoku() {
  const s = sudokuState();
  const last = s.undo.pop();
  if (!last || s.phase !== 'play') return;
  sudokuSetCell(last.i, last.v);
  s.notes[last.i] = last.n;
  if (last.peers) Object.keys(last.peers).forEach(k => { s.notes[Number(k)] = last.peers[k]; });
  s.sel = last.i;
  saveToLocal();
  paintSudoku();
  sudokuCheck();
}

function toggleSudokuNotes() {
  const s = sudokuState();
  s.notesMode = !s.notesMode;
  saveToLocal();
  paintSudoku();
}

/** The selected cell's number, or the first empty or wrong cell's. A hint is counted. */
function hintSudoku() {
  const s = sudokuState();
  if (s.phase !== 'play' || s.race) return;
  let i = s.sel >= 0 && s.puzzle[s.sel] === '0' && s.cells[s.sel] !== s.solution[s.sel] ? s.sel : -1;
  if (i < 0) for (let k = 0; k < 81; k++) if (s.cells[k] !== s.solution[k]) { i = k; break; }
  if (i < 0) return;
  sudokuPushUndo(i);
  sudokuSetCell(i, s.solution[i]);
  s.notes[i] = 0;
  s.hints++;
  s.sel = i;
  saveToLocal();
  paintSudoku();
  sudokuCelebrateUnits(i);
  sudokuCheck();
}

/** A row, column or box that just came right ripples (in a race: full with no conflict). */
function sudokuCelebrateUnits(i) {
  if (motionOff()) return;
  const s = sudokuState();
  const conflicts = s.race ? sudokuConflicts(s.cells) : new Set();
  const units = [
    Array.from({ length: 9 }, (_, c) => Math.floor(i / 9) * 9 + c),
    Array.from({ length: 9 }, (_, r) => r * 9 + (i % 9)),
    Array.from({ length: 81 }, (_, k) => k).filter(k => SUDOKU_BOX[k] === SUDOKU_BOX[i])
  ];
  const done = units.filter(u => u.every(k => sudokuCellOk(s, k, conflicts)));
  const cells = new Set();
  done.forEach(u => u.forEach(k => cells.add(k)));
  cells.forEach(k => {
    const el = document.querySelector(`#sdk-grid [data-i="${k}"]`);
    if (!el || !el.animate) return;
    const r = Math.floor(k / 9), c = k % 9;
    const dist = Math.abs(r - Math.floor(i / 9)) + Math.abs(c - i % 9);
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.14)', offset: 0.45 }, { transform: 'scale(1)' }],
               { duration: 360, delay: dist * 35, easing: 'ease-out' });
  });
}

/** A solved grid: every cell pops, from the middle out. */
function sudokuCelebrate() {
  if (motionOff()) return 0;
  document.querySelectorAll('#sdk-grid .sdk-cell').forEach(el => {
    const k = Number(el.dataset.i);
    const dist = Math.abs(Math.floor(k / 9) - 4) + Math.abs(k % 9 - 4);
    if (el.animate) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.16)', offset: 0.45 }, { transform: 'scale(1)' }], { duration: 380, delay: dist * 40, easing: 'ease-out' });
  });
  return 800;
}

/** After a change: the race tells the server, the solo game looks for the end. */
function sudokuCheck() {
  const s = sudokuState();
  if (s.phase !== 'play') return;
  if (s.race) { raceMove('sudoku', { cells: s.cells }); return; }
  if (s.cells === s.solution) sudokuFinish();
}

function sudokuFinish() {
  const s = sudokuState();
  const t = TRANSLATIONS[appState.lang];
  sudokuStopTimer();
  s.elapsed = Math.round((Date.now() - s.startedAt) / 1000);
  s.phase = 'done';
  s.sel = -1;
  saveToLocal();
  paintSudoku();
  const level = s.playLevel || s.level;
  const rec = s.hints || s.archive ? { record: false, prev: soloBest('sudoku', level) }
    : soloRecord('sudoku', level, { seconds: s.elapsed }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('sudoku', { seconds: s.elapsed, mistakes: s.mistakes, hints: s.hints }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n#️⃣ ${t.setup_sudoku || ''} ✅ ${soloTime(s.elapsed)}${s.mistakes ? ' · ❌ ' + s.mistakes : ''}${s.hints ? ' · 💡 ' + s.hints : ''}`;
  }
  const lines = [`${escapeHTML(t.sdk_mistakes || '')}: ${s.mistakes}${s.hints ? ` · 💡 ${s.hints}` : ''}`];
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  soloLater('sudoku', motionOff() ? 0 : 500, () => soloResult({
    icon: '#️⃣',
    title: rec.record ? (t.solo_new_best || '') : (t.solo_solved || ''),
    valueText: soloTime(s.elapsed),
    valueLabel: t.solo_time || '',
    lines: lines,
    win: true,
    share: share,
    again: () => startSudoku(false),
    exit: setupSudoku
  }));
}

function restoreSudoku() {
  const s = sudokuState();
  if (!s.puzzle || s.phase !== 'play') return false;
  paintSudoku();
  sudokuArmTimer();
  return true;
}

document.addEventListener('keydown', (e) => {
  const racing = soloRaceKind() === 'sudoku';
  if ((appState.currentView !== 'play-sudoku' && !racing) || soloKeyBlocked(e)) return;
  const s = sudokuState();
  if (s.phase !== 'play') return;
  if (/^[1-9]$/.test(e.key)) { enterSudoku(Number(e.key)); e.preventDefault(); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { eraseSudoku(); e.preventDefault(); return; }
  if (e.key === 'n' || e.key === 'N') { toggleSudokuNotes(); return; }
  const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
  if (moves[e.key]) {
    const next = (s.sel < 0 ? 40 : s.sel) + moves[e.key];
    if (next >= 0 && next < 81 && !(Math.abs(moves[e.key]) === 1 && Math.floor(next / 9) !== Math.floor((s.sel < 0 ? 40 : s.sel) / 9))) {
      s.sel = next;
      paintSudoku();
    }
    e.preventDefault();
  }
});

soloRegister('sudoku', {
  setup: 'setup-sudoku', play: 'play-sudoku', paintSetup: paintSudokuSetup, restore: restoreSudoku,
  state: sudokuState, resume: continueSudoku, repaint: paintSudoku, timed: true, prefs: ['level']
});

/* --- سباق ألغاز: the same grid, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.sudoku = {
  stage: 'sudoku-stage',
  unit: 'race_unit_cells',
  fresh: (pub) => ({ level: 'easy', playLevel: 'easy', daily: '', puzzle: pub.puzzle, solution: '', cells: pub.puzzle, notes: new Array(81).fill(0),
    sel: -1, notesMode: false, mistakes: 0, hints: 0, undo: [], elapsed: 0 }),
  // A reload: the cells the server last took from this phone are the grid.
  sync(s, board) {
    if (board && typeof board.cells === 'string' && board.cells.length === 81 && !sudokuHasWork(s)) s.cells = board.cells;
  },
  paint: () => paintSudoku(),
  finished: (s, won) => (won ? sudokuCelebrate() : 0)
};
</script>
