   ========================================================================= */

const chSqName = (i) => (i >= 0 && i < 64 ? CH_FILES[i & 7] + ((i >> 3) + 1) : '');

/** A translated line, {name} values filled in. */

/** The <symbol>s of both colours, their shading, Black's rims and the shadow, as markup (one hidden <svg> holds them). */
function chPieceSymbols() {
  let defs = ['w', 'b'].map(c => `<linearGradient id="ch2g-${c}" x1="0" y1="0" x2="1" y2="0.45"><stop offset="0" style="stop-color:var(--ch2-${c}-hi)"/><stop offset="0.5" style="stop-color:var(--ch2-${c}-mid)"/><stop offset="1" style="stop-color:var(--ch2-${c}-lo)"/></linearGradient>`).join('') +
    '<radialGradient id="ch2sh"><stop offset="0" stop-color="#000" stop-opacity="0.34"/><stop offset="0.6" stop-color="#000" stop-opacity="0.14"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>';
  let syms = '';
  ['w', 'b'].forEach(c => {
    const fill = `style="fill:url(#ch2g-${c});stroke:none"`;
    const edge = `style="fill:none;stroke:var(--ch2-${c}-edge);stroke-width:1.9;stroke-linejoin:round"`;
    const body = `style="fill:url(#ch2g-${c});stroke:var(--ch2-${c}-edge);stroke-width:1.9;stroke-linejoin:round"`;
    const line = `style="fill:none;stroke:var(--ch2-${c}-line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"`;
    const dot = `style="fill:var(--ch2-${c}-line);stroke:none"`;
    for (let k = 1; k <= 6; k++) {
      syms += `<symbol id="ch2pc-${c}${k}" viewBox="0 0 45 45"><ellipse cx="22.5" cy="42.5" rx="14.5" ry="2.3" fill="url(#ch2sh)"/>` + CH2_SHAPES[k].map(([t, d], j) => {
        const round = t === 'c' || t === 'dc';
        const p = round ? d.split(' ') : null;
        const shape = (st) => (round ? `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" ${st}/>` : `<path d="${d}" ${st}/>`);
        if (t === 'l') return shape(line);
        if (t === 'd' || t === 'dc') return shape(dot);
        if (c === 'w') return shape(body);
        // Black: the fill, a lighter rim inside the outline (the shape clips it), then the outline over it.
        const id = `ch2k-${k}-${j}`;
        defs += `<clipPath id="${id}">${shape('')}</clipPath>`;
        return shape(fill) + shape(`style="fill:none;stroke:var(--ch2-b-rim);stroke-width:3.4" clip-path="url(#${id})"`) + shape(edge);
      }).join('') + '</symbol>';
    }
  });
  return '<defs>' + defs + '</defs>' + syms;
}

/** The symbols in the page, once (before the first piece is drawn). */
function chPieceDefs() {
  if (typeof document === 'undefined' || document.getElementById('ch2-defs')) return;
  const holder = document.createElement('div');
  holder.innerHTML = `<svg id="ch2-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">${chPieceSymbols()}</svg>`;
  (document.body || document.documentElement).appendChild(holder.firstChild);
}

/** A piece drawn: code as on the board (kind, +8 for black). */
function chPieceSvg(code, cls) {
  const kind = code & 7;
  if (!kind) return '';
  chPieceDefs();
  const dark = code >> 3;
  return `<svg class="ch-svg ${dark ? 'is-dark' : 'is-light'} ${cls || ''}" viewBox="0 0 45 45" aria-hidden="true" focusable="false"><use href="#ch2pc-${dark ? 'b' : 'w'}${kind}"/></svg>`;
}

const CH_LETTER_KIND = { p: 1, n: 2, b: 3, r: 4, q: 5, k: 6 };
const CH_FIGURINES = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞' };

/** A move in algebraic notation with the piece as a figurine (♞f3): the same in every language. */
const chFigurine = (san) => String(san || '').replace(/^[KQRBN]/, (m) => CH_FIGURINES[m]).replace(/=([QRBN])/, (x, m) => '=' + CH_FIGURINES[m]);

/** A piece's name in the page's language: الوزير, the queen … */
const chPieceName = (letter) => chT('ch_piece_' + (String(letter || 'p').toLowerCase()));

/* --- sounds: a wooden clack, a heavier knock for a capture, the check ----------- */

function chSound(kind) {
  try {
    if (typeof fxCtx !== 'function' || typeof fxTone !== 'function' || typeof fxNoise !== 'function') return;
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'move' || kind === 'castle') {
      fxNoise('bandpass', 1900, 2.2, [[0, 0], [0.003, 0.22], [0.06, 0.001]], at);
      fxTone('sine', [[0, 520], [0.05, 330]], [[0, 0], [0.004, 0.12], [0.09, 0.001]], at);
      if (kind === 'castle') {
        fxNoise('bandpass', 1700, 2.2, [[0, 0], [0.003, 0.2], [0.06, 0.001]], at + 0.16);
        fxTone('sine', [[0, 480], [0.05, 300]], [[0, 0], [0.004, 0.1], [0.09, 0.001]], at + 0.16);
      }
    } else if (kind === 'capture') {
      fxNoise('lowpass', 1400, 0.9, [[0, 0], [0.003, 0.3], [0.1, 0.001]], at);
      fxTone('triangle', [[0, 300], [0.1, 150]], [[0, 0], [0.004, 0.16], [0.14, 0.001]], at);
    } else if (kind === 'check') {
      fxTone('triangle', [[0, 660], [0.12, 660]], [[0, 0], [0.01, 0.1], [0.14, 0.001]], at);
      fxTone('triangle', [[0, 880], [0.12, 880]], [[0, 0], [0.01, 0.1], [0.16, 0.001]], at + 0.13);
    } else if (kind === 'pick') {
      fxTone('sine', [[0, 880], [0.04, 990]], [[0, 0], [0.004, 0.05], [0.06, 0.001]], at);
    } else if (kind === 'refuse') {
      fxTone('sine', [[0, 220], [0.08, 180]], [[0, 0], [0.01, 0.1], [0.12, 0.001]], at);
    } else if (kind === 'hint') {
      fxTone('sine', [[0, 700], [0.18, 1050]], [[0, 0], [0.02, 0.07], [0.22, 0.001]], at);
    } else if (kind === 'end') {
      // The end of the game: a low chord, the three notes a moment apart.
      [[196, 0], [247, 0.05], [294, 0.1]].forEach(([f, d]) => fxTone('triangle', [[0, f], [0.9, f]], [[0, 0], [0.03, 0.07], [1.1, 0.001]], at + d));
    } else if (kind === 'thud') {
      // A king falling onto the board.
      fxNoise('lowpass', 500, 0.8, [[0, 0], [0.004, 0.34], [0.18, 0.001]], at);
      fxTone('sine', [[0, 120], [0.16, 60]], [[0, 0], [0.006, 0.22], [0.22, 0.001]], at);
    }
  } catch (e) {}
}

/* ============================================================================
   The 3D board
   ========================================================================= */

// The pieces' size against a square, and how tall each kind stands.
const CH_PIECE_SCALE = 1.18;

function chRand(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function chCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}

/** Wood with its grain: a base colour, fine wavy lines that run together (a figure), pores, now and then a knot. */
function chWood(g, x, y, w, h, base, seed, across) {
  const rnd = chRand(seed);
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = base; g.fillRect(x, y, w, h);
  // The plank is lighter in one place and darker in another.
  const lg = across ? g.createLinearGradient(x, y, x, y + h) : g.createLinearGradient(x, y, x + w, y);
  lg.addColorStop(0, `rgba(255,236,205,${0.04 + rnd() * 0.06})`); lg.addColorStop(0.45 + rnd() * 0.2, 'rgba(40,20,5,0.05)'); lg.addColorStop(1, `rgba(255,236,205,${0.03 + rnd() * 0.05})`);
  g.fillStyle = lg; g.fillRect(x, y, w, h);
  const span = across ? h : w, len = across ? w : h;
  // One wave shared by the lines, so they run together like real grain.
  const ph0 = rnd() * 6, f0 = 0.006 + rnd() * 0.012, a0 = 1.5 + rnd() * 5;
  const lines = Math.round(span / 2.1);
  for (let i = 0; i < lines; i++) {
    const off = (i + rnd() * 0.8) * span / lines;
    const dark = rnd() < 0.62;
    g.strokeStyle = dark ? `rgba(45,22,6,${0.035 + rnd() * 0.1})` : `rgba(255,238,212,${0.025 + rnd() * 0.06})`;
    g.lineWidth = 0.35 + rnd() * (rnd() < 0.14 ? 2.6 : 1.1);
    const amp = a0 * (0.6 + rnd() * 0.8), ph = ph0 + rnd() * 0.5;
    g.beginPath();
    for (let k = 0; k <= len; k += 5) {
      const wave = Math.sin(k * f0 + ph) * amp + Math.sin(k * f0 * 3.1 + ph * 2) * amp * 0.22;
      if (across) { if (k === 0) g.moveTo(x + k, y + off + wave); else g.lineTo(x + k, y + off + wave); }
      else { if (k === 0) g.moveTo(x + off + wave, y + k); else g.lineTo(x + off + wave, y + k); }
    }
    g.stroke();
  }
  // A knot: a few rings round a point.
  if (rnd() < 0.16) {
    const kx = x + rnd() * w, ky = y + rnd() * h;
    for (let r = 1; r <= 5; r++) {
      g.strokeStyle = `rgba(45,22,6,${0.05 + 0.02 * (5 - r)})`; g.lineWidth = 0.8;
      g.beginPath();
      if (across) g.ellipse(kx, ky, r * 5.5, r * 2, 0, 0, Math.PI * 2); else g.ellipse(kx, ky, r * 2, r * 5.5, 0, 0, Math.PI * 2);
      g.stroke();
    }
  }
  // Pores: short dark dashes along the grain.
  g.fillStyle = 'rgba(30,14,4,0.07)';
  const pores = Math.round(w * h / 160);
  for (let k = 0; k < pores; k++) {
    const px = x + rnd() * w, py = y + rnd() * h;
    if (across) g.fillRect(px, py, 1.6 + rnd() * 2.4, 0.6); else g.fillRect(px, py, 0.6, 1.6 + rnd() * 2.4);
  }
  g.restore();
}

/** Marble: a pale or grey ground, soft clouds and a few thin veins. */
function chMarble(g, x, y, w, h, base, seed) {
  const rnd = chRand(seed);
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = base; g.fillRect(x, y, w, h);
  for (let k = 0; k < 5; k++) {
    const cx = x + rnd() * w, cy = y + rnd() * h, r = w * (0.3 + rnd() * 0.5);
    const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, rnd() < 0.5 ? 'rgba(255,255,255,0.14)' : 'rgba(60,60,70,0.07)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(x, y, w, h);
  }
  for (let k = 0; k < 3; k++) {
    g.strokeStyle = `rgba(70,72,80,${0.12 + rnd() * 0.18})`;
    g.lineWidth = 0.6 + rnd() * 1.4;
    g.beginPath();
    let px = x + rnd() * w, py = y;
    g.moveTo(px, py);
    while (py < y + h) { px += (rnd() - 0.5) * w * 0.25; py += h * (0.08 + rnd() * 0.12); g.lineTo(px, py); }
    g.stroke();
  }
  g.restore();
}

/** A room of light for the varnish and the lacquer to reflect: a warm ceiling, soft boxes of light, the dark table. */
function chRoomEnv(THREE, pmrem) {
  const W = 1024, H = 512;
  const [c, g] = chCanvas(W, H);
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#fff7ec'); grd.addColorStop(0.35, '#f0e4d3'); grd.addColorStop(0.5, '#a89684'); grd.addColorStop(0.56, '#5b4b3e'); grd.addColorStop(1, '#1c1611');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  // Soft boxes: bright in the middle, fading at the edges, so a highlight slides along a piece.
  const box = (x, y, w, h, a) => {
    const rg = g.createRadialGradient(x + w / 2, y + h / 2, 0, x + w / 2, y + h / 2, Math.max(w, h) / 2);
    rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(0.55, `rgba(255,250,240,${a * 0.6})`); rg.addColorStop(1, 'rgba(255,250,240,0)');
    g.fillStyle = rg; g.fillRect(x, y, w, h);
  };
  box(120, 40, 260, 170, 1); box(560, 30, 330, 150, 0.9); box(900, 120, 124, 150, 0.6); box(0, 150, 110, 110, 0.5);
  // A warm window low on one side for a rim on the pieces.
  box(400, 200, 220, 70, 0.55);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;

}

/** The lathe profiles, [radius, height, sharp] from the base up, smoothed between the sharp corners; and the extras. */
function chPieceParts(THREE) {
  const V = (r, y) => new THREE.Vector2(r, y);
  // A run of points between two sharp corners goes through a spline, so a stem or a head is round, not faceted.
  const smooth = (pts) => {
    const out = [];
    let run = [pts[0]];
    const flush = () => {
      if (run.length < 3) run.forEach((p, k) => { if (k || !out.length) out.push(V(p[0], p[1])); });
      else new THREE.SplineCurve(run.map(p => V(p[0], p[1]))).getPoints((run.length - 1) * 5).forEach((p, k) => { if (k || !out.length) out.push(p); });
    };
    for (let i = 1; i < pts.length; i++) {
      run.push(pts[i]);
      if (pts[i][2] || i === pts.length - 1) { flush(); run = [pts[i]]; }
    }
    return out;
  };
  const S = 1;
  const arc = (cy, ry, rx, a0, a1, n) => {
    const out = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push([Math.max(0.001, Math.cos(a) * rx), cy + Math.sin(a) * ry]); }
    return out;
  };
  const base = (r) => [[0.001, 0, S], [r, 0, S], [r, 0.045, S], [r - 0.02, 0.07], [r - 0.05, 0.09], [r - 0.072, 0.125, S]];
  const lathe = (pts) => new THREE.LatheGeometry(smooth(pts), 64);
  const parts = {};
  parts[1] = { r: 0.29, body: lathe(base(0.29).concat([[0.165, 0.19], [0.125, 0.28], [0.108, 0.345, S], [0.175, 0.36, S], [0.18, 0.377], [0.175, 0.395, S], [0.1, 0.41, S]]).concat(arc(0.51, 0.12, 0.122, -1.2, Math.PI / 2, 14))), h: 0.63 };
  parts[4] = { r: 0.32, body: lathe(base(0.32).concat([[0.235, 0.19], [0.205, 0.3], [0.19, 0.45], [0.2, 0.48, S], [0.245, 0.52, S], [0.245, 0.655, S], [0.175, 0.655, S], [0.175, 0.6, S], [0.001, 0.6, S]])), h: 0.74 };
  parts[3] = { r: 0.31, body: lathe(base(0.31).concat([[0.17, 0.2], [0.125, 0.32], [0.108, 0.43, S], [0.172, 0.45, S], [0.176, 0.465], [0.172, 0.48, S], [0.1, 0.5, S]]).concat(arc(0.64, 0.16, 0.138, -1.25, Math.PI / 2 - 0.3, 16)).concat(arc(0.83, 0.048, 0.048, -Math.PI / 2, Math.PI / 2, 8))), h: 0.88 };
  parts[5] = { r: 0.34, body: lathe(base(0.34).concat([[0.21, 0.2], [0.15, 0.36], [0.125, 0.56], [0.12, 0.62, S], [0.19, 0.64, S], [0.196, 0.655], [0.19, 0.67, S], [0.125, 0.69, S], [0.14, 0.73], [0.2, 0.86, S], [0.12, 0.845, S], [0.06, 0.866], [0.001, 0.875, S]])), h: 0.98 };
  parts[6] = { r: 0.35, body: lathe(base(0.35).concat([[0.215, 0.2], [0.155, 0.38], [0.132, 0.6], [0.13, 0.66, S], [0.2, 0.68, S], [0.206, 0.695], [0.2, 0.71, S], [0.135, 0.73, S], [0.17, 0.81], [0.2, 0.9, S], [0.13, 0.935], [0.06, 0.955], [0.001, 0.96, S]])), h: 1.15 };
  parts[2] = { r: 0.31, body: lathe(base(0.31).concat([[0.205, 0.15, S], [0.232, 0.165, S], [0.232, 0.19, S], [0.001, 0.19, S]])), h: 1.0 };
  // The knight (the coordinator's review, 24 Sep 2026: "a lump, not a horse"): a horse's head and neck
  // drawn as a side profile - chest, throat, jaw, chin, a muzzle, the nose bridge, forehead, poll, the
  // arched crest and the back of the neck - facing +x, extruded and bevelled, then shaped: the slab is
  // pinched towards the muzzle and widened at the neck, so it is a head, not a board.
  const s = new THREE.Shape();
  s.moveTo(-0.215, 0.19);
  s.lineTo(0.185, 0.19);
  s.quadraticCurveTo(0.225, 0.34, 0.165, 0.46);    // chest up to the throat
  s.quadraticCurveTo(0.14, 0.52, 0.22, 0.555);     // the jaw's underside, forward to the chin
  s.quadraticCurveTo(0.33, 0.565, 0.375, 0.61);    // chin to the mouth
  s.quadraticCurveTo(0.41, 0.665, 0.375, 0.715);   // the muzzle's front
  s.quadraticCurveTo(0.27, 0.8, 0.15, 0.895);      // the nose bridge up to the forehead
  s.quadraticCurveTo(0.1, 0.945, 0.065, 0.99);     // forehead to the poll
  s.lineTo(-0.02, 1.0);
  s.quadraticCurveTo(-0.15, 0.985, -0.215, 0.845); // the crest, arched
  s.quadraticCurveTo(-0.285, 0.665, -0.25, 0.45);  // the back of the neck
  s.quadraticCurveTo(-0.215, 0.3, -0.215, 0.19);
  s.closePath();
  const head = new THREE.ExtrudeGeometry(s, { depth: 0.15, bevelEnabled: true, bevelThickness: 0.045, bevelSize: 0.03, bevelSegments: 5, curveSegments: 20 });
  head.translate(0, 0, -0.075);
  // Narrower towards the muzzle, fuller at the jowl and the neck's foot.
  const hp = head.attributes.position;
  for (let k = 0; k < hp.count; k++) {
    const x = hp.getX(k), y = hp.getY(k);
    const muzzle = Math.max(0, Math.min(1, (x - 0.08) / 0.3));
    const foot = Math.max(0, Math.min(1, (0.36 - y) / 0.17));
    hp.setZ(k, hp.getZ(k) * (1 - 0.45 * muzzle) * (1 + 0.18 * foot));
  }
  head.computeVertexNormals();
  parts[2].head = head;
  // The mane: a thin crest standing proud along the back of the neck, its edge in ridges.
  const q = (p0, p1, p2, t) => { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]; };
  const back = [];
  [[[-0.02, 1.0], [-0.15, 0.985], [-0.215, 0.845]], [[-0.215, 0.845], [-0.285, 0.665], [-0.25, 0.45]]].forEach((seg, si) => {
    for (let k = si ? 1 : 0; k <= 8; k++) back.push(q(seg[0], seg[1], seg[2], k / 8));
  });
  const outer = [], inner = [];
  back.forEach((p, k) => {
    const a = back[Math.max(0, k - 1)], b = back[Math.min(back.length - 1, k + 1)];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]);                     // outward: away from the head
    const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const out = k === 0 || k === back.length - 1 ? 0.012 : (k % 2 ? 0.06 : 0.032);
    outer.push([p[0] + nx * out, p[1] + ny * out]);
    inner.push([p[0] - nx * 0.05, p[1] - ny * 0.05]);
  });
  const ms = new THREE.Shape();
  ms.moveTo(outer[0][0], outer[0][1]); outer.slice(1).forEach(p => ms.lineTo(p[0], p[1]));
  inner.reverse().forEach(p => ms.lineTo(p[0], p[1]));
  ms.closePath();
  parts.mane = new THREE.ExtrudeGeometry(ms, { depth: 0.07, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.008, bevelSegments: 2 });
  parts.mane.translate(0, 0, -0.035);
  // The cheek: a flat round swell each side of the jaw.
  parts.cheek = new THREE.SphereGeometry(1, 18, 12);
  parts.ear = new THREE.ConeGeometry(0.032, 0.11, 12);
  parts.eye = new THREE.SphereGeometry(0.024, 12, 10);
  parts.nostril = new THREE.SphereGeometry(0.016, 10, 8);
  parts.merlon = new THREE.BoxGeometry(0.1, 0.085, 0.075);
  parts.cut = new THREE.BoxGeometry(0.012, 0.2, 0.29);
  parts.bead = new THREE.SphereGeometry(0.042, 16, 12);
  parts.band = new THREE.TorusGeometry(0.19, 0.016, 10, 48);
  // The king's cross: one bevelled shape.
  const cs = new THREE.Shape();
  [[-0.035, -0.13], [0.035, -0.13], [0.035, -0.005], [0.1, -0.005], [0.1, 0.065], [0.035, 0.065], [0.035, 0.13], [-0.035, 0.13], [-0.035, 0.065], [-0.1, 0.065], [-0.1, -0.005], [-0.035, -0.005]]
    .forEach((p, k) => (k ? cs.lineTo(p[0], p[1]) : cs.moveTo(p[0], p[1])));
  cs.closePath();
  parts.cross = new THREE.ExtrudeGeometry(cs, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 3 });
  parts.cross.translate(0, 0, -0.025);
  // The green felt under every piece.
  parts.felt = {};
  [1, 2, 3, 4, 5, 6].forEach(k => { parts.felt[k] = new THREE.CylinderGeometry(parts[k].r * 0.94, parts[k].r * 0.94, 0.02, 48); });
  parts.blob = new THREE.PlaneGeometry(1, 1);
  return parts;
}

function chMake3D(THREE, root) {
  // Disposed: the timers a move left behind find nothing to draw on.
  let dead = false;
  const canvas = document.createElement('canvas');
  canvas.className = 'ch-canvas';
  root.insertBefore(canvas, root.firstChild);
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });

  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 2, far: 30 });
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe2c4, 0.42);
  fill.position.set(6, 5, -4);
  scene.add(fill);
  // A light from behind, for a bright edge along the pieces' silhouettes.
  const rim = new THREE.DirectionalLight(0xffffff, 0.35);
  rim.position.set(0, 6, -9);
  scene.add(rim);

  /* --- the board: a bevelled frame with its grain, the squares with theirs, the names inlaid, a varnish --- */
  const BW = 9.9;                               // the board's top, inside the frame's bevel
  const [bc, bg] = chCanvas(1024, 1024);
  const boardTex = new THREE.CanvasTexture(bc);
  boardTex.colorSpace = THREE.SRGBColorSpace;
  boardTex.anisotropy = aniso;
  const [fc, fg] = chCanvas(512, 512);
  const frameTex = new THREE.CanvasTexture(fc);
  frameTex.colorSpace = THREE.SRGBColorSpace;
  frameTex.wrapS = frameTex.wrapT = THREE.RepeatWrapping;
  frameTex.repeat.set(0.2, 0.2);
  frameTex.anisotropy = aniso;
  let boardOrient = '', pal = CH3_STYLES.green;
  function drawBoard(orient) {
    if (boardOrient === orient + '|' + pal.id) return;
    boardOrient = orient + '|' + pal.id;
    const S = 1024, u = S / 10;
    chWood(bg, 0, 0, S, S, pal.frame, 11, true);
    // The frame's inner edge: a shadowed step down to the squares, a thin light inlay round them.
    bg.fillStyle = 'rgba(0,0,0,0.28)';
    bg.fillRect(u - 7, u - 7, 8 * u + 14, 8 * u + 14);
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const light = (r + f) % 2 === 1;
        const x = u + f * u, y = u + (7 - r) * u;
        (pal.marble ? chMarble : chWood)(bg, x, y, u, u, light ? pal.light : pal.dark, 100 + r * 8 + f, (r + f) % 2 === 0);
      }
    }
    bg.strokeStyle = 'rgba(30,15,5,0.55)'; bg.lineWidth = 3;
    bg.strokeRect(u - 1, u - 1, 8 * u + 2, 8 * u + 2);
    bg.strokeStyle = 'rgba(240,215,170,0.5)'; bg.lineWidth = 2.5;
    bg.strokeRect(u - 11, u - 11, 8 * u + 22, 8 * u + 22);
    bg.strokeStyle = 'rgba(20,10,2,0.35)'; bg.lineWidth = 1;
    bg.strokeRect(u - 13, u - 13, 8 * u + 26, 8 * u + 26);
    // The names, inlaid in a light wood, facing whoever sits at the near side.
    bg.font = `700 ${Math.round(u * 0.34)}px system-ui, sans-serif`;
    bg.textAlign = 'center'; bg.textBaseline = 'middle';
    const put = (text, x, y) => {
      bg.save(); bg.translate(x, y); if (orient) bg.rotate(Math.PI);
      bg.fillStyle = 'rgba(0,0,0,0.5)'; bg.fillText(text, 0, 2);
      bg.fillStyle = 'rgba(240,221,184,0.95)'; bg.fillText(text, 0, 0);
      bg.restore();
    };
    for (let i = 0; i < 8; i++) {
      put(CH_FILES[i], u + i * u + u / 2, orient ? u / 2 : S - u / 2);
      put(String(i + 1), orient ? S - u / 2 : u / 2, u + (7 - i) * u + u / 2);
    }
    // A varnish: a faint sheen from one corner.
    const sheen = bg.createLinearGradient(0, 0, S, S);
    sheen.addColorStop(0, 'rgba(255,248,235,0.07)'); sheen.addColorStop(0.5, 'rgba(255,248,235,0)'); sheen.addColorStop(1, 'rgba(0,0,0,0.05)');
    bg.fillStyle = sheen; bg.fillRect(0, 0, S, S);
    boardTex.needsUpdate = true;

    frameTex.needsUpdate = true;
  }
  // The frame: a rounded square extruded downwards with a bevel on its top edge.
  const rounded = (w, r) => {

    sh.moveTo(-h + r, -h); sh.lineTo(h - r, -h); sh.quadraticCurveTo(h, -h, h, -h + r); sh.lineTo(h, h - r); sh.quadraticCurveTo(h, h, h - r, h);
    sh.lineTo(-h + r, h); sh.quadraticCurveTo(-h, h, -h, h - r); sh.lineTo(-h, -h + r); sh.quadraticCurveTo(-h, -h, -h + r, -h);

  const frameGeo = new THREE.ExtrudeGeometry(rounded(BW, 0.2), { depth: 0.33, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 4, curveSegments: 8 });

  const topMat = new THREE.MeshPhysicalMaterial({ map: boardTex, roughness: 0.42, clearcoat: 0.75, clearcoatRoughness: 0.2, envMapIntensity: 0.6 });
  const top = new THREE.Mesh(topGeo, topMat);
  top.rotation.x = -Math.PI / 2;
  top.position.y = 0.002;
  top.receiveShadow = true;
  scene.add(top);
  // A shadow on the table under it all (the stage behind is the page's own ground).
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.3 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.44;

  scene.add(floor);

  // What sits on the squares: the last move, the piece picked up and where it can go, check, danger, arrows.
  const [oc, og] = chCanvas(1024, 1024);
  const overTex = new THREE.CanvasTexture(oc);
  overTex.colorSpace = THREE.SRGBColorSpace;
  overTex.anisotropy = aniso;
  const over = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshBasicMaterial({ map: overTex, transparent: true, depthWrite: false, toneMapped: false, polygonOffset: true, polygonOffsetFactor: -2 }));
  over.rotation.x = -Math.PI / 2;

  over.renderOrder = 2;
  scene.add(over);

  // The pieces.
  const parts = chPieceParts(THREE);
  const mats = [
    { body: new THREE.MeshPhysicalMaterial({ color: 0xf6ead2, roughness: 0.34, clearcoat: 0.65, clearcoatRoughness: 0.16, envMapIntensity: 0.9, sheen: 0.2, sheenColor: new THREE.Color(0xfff2dc) }),
      mark: new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.6 }) },
    { body: new THREE.MeshPhysicalMaterial({ color: 0x2a211c, roughness: 0.28, clearcoat: 0.9, clearcoatRoughness: 0.1, envMapIntensity: 1 }),
      mark: new THREE.MeshStandardMaterial({ color: 0x0d0a08, roughness: 0.55 }) }
  ];

  const dotTex = chDotTexture(THREE);

  // The board's style (the owner's four): the squares' colours, the frame, the pieces' finish.

        m.rotation.y = -a;

      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4;
        add(parts.bead, mats[c].body, Math.cos(a) * 0.19, 0.878, Math.sin(a) * 0.19).userData.body = true;
      }
      const tb = add(parts.bead, mats[c].body, 0, 0.92, 0);
      tb.scale.setScalar(1.4);
      tb.userData.body = true;
    }
    if (kind === 6) {
      const cr = add(parts.cross, mats[c].body, 0, 1.08, 0);
      cr.rotation.y = c ? 0 : Math.PI;
      cr.userData.body = true;
    }
    // Its soft shadow on the board (kept on the board as the piece lifts: see groundBlobs).
    const blob = new THREE.Mesh(parts.blob, blobMat);
    blob.rotation.x = -Math.PI / 2;
    blob.scale.setScalar(P.r * 2.9);
    blob.renderOrder = 1;
    grp.add(blob);
    grp.userData.blob = blob;
    grp.scale.setScalar(CH_PIECE_SCALE);
    grp.userData.code = code;
    return grp;
  }

  // Where a square is in the world: White's first rank at +z, the a-file at -x.
  const sqPos = (i, y) => new THREE.Vector3((i & 7) - 3.5, y || 0, 3.5 - (i >> 3));

  const pieces = new Map();        // square index -> group
  const yard = [[], []];           // pieces taken, as groups, White's lost and Black's lost
  let model = null, modelKey = '', animKey = '', mateKey = '', aspect = 1, orient = 0;
  const tweens = [];
  const fx = new Set();            // the clean-ups of what is in the air (dust, sparkles, pulses)
  let busyUntil = 0;
  let drag = null;

  function removePiece(grp) { if (grp && grp.parent) grp.parent.remove(grp); }

  /** Each piece's shadow stays on the board, smaller and fainter as the piece rises; none beside the board. */
  function groundBlobs() {
    pieces.forEach(grp => {
      const b = grp.userData.blob;
      if (!b) return;
      const up = Math.max(0, grp.position.y);
      b.visible = Math.abs(grp.rotation.x) + Math.abs(grp.rotation.z) < 0.5;
      b.position.y = (0.004 - grp.position.y) / grp.scale.y;
      b.scale.setScalar(parts[grp.userData.code & 7].r * 2.9 * Math.max(0.45, 1 - up * 0.6));
    });
    [0, 1].forEach(side => yard[side].forEach(grp => { if (grp.userData.blob) grp.userData.blob.visible = false; }));
  }

  /** Where the n-th piece a side lost sits beside the board. */
  function yardPos(side, n) {
    // side 0: White's lost pieces, which sit on Black's side of the table.
    const row = Math.floor(n / 8), col = n % 8;
    const along = -3.2 + col * 0.9;
    const out = 5.65 + row * 0.7;
    const wide = aspect >= 1.15;
    let x, z;
    if (wide) { x = side === 0 ? -out : out; z = side === 0 ? along : -along; }
    else { z = side === 0 ? -out : out; x = side === 0 ? -along : along; }
    return new THREE.Vector3(x, 0, z).applyAxisAngle(new THREE.Vector3(0, 1, 0), orient ? Math.PI : 0);
  }

  function placeYard() {
    [0, 1].forEach(side => yard[side].forEach((grp, n) => {
      if (grp.userData.flying) return;
      const p = yardPos(side, n);
      grp.position.set(p.x, -0.43, p.z);
      grp.rotation.set(0, grp.userData.spin || 0, 0);
      grp.scale.setScalar(CH_PIECE_SCALE * 0.62);
    }));
  }

  /** The board as the model says, with no motion: every square's piece, the pieces taken. */
  function snap() {
    const b = model.board;
    for (let i = 0; i < 64; i++) {
      const want = b[i] || 0;
      const have = pieces.get(i);
      if (have && (!want || have.userData.code !== want)) { removePiece(have); pieces.delete(i); }
      if (want && (!pieces.get(i))) {
        const grp = buildPiece(want);
        scene.add(grp);
        pieces.set(i, grp);
      }
      const grp = pieces.get(i);
      if (grp && !(drag && drag.grp === grp)) {
        const p = sqPos(i);
        grp.position.copy(p);
        grp.rotation.set(0, 0, 0);
        grp.scale.setScalar(CH_PIECE_SCALE);
      }
    }
    const lost = model.lost || [[], []];
    [0, 1].forEach(side => {
      const want = lost[side] || [];
      while (yard[side].length > want.length) removePiece(yard[side].pop());
      want.forEach((letter, n) => {
        const code = CH_LETTER_KIND[letter] | (side ? 8 : 0);
        if (!yard[side][n] || yard[side][n].userData.code !== code) {
          if (yard[side][n]) removePiece(yard[side][n]);
          const grp = buildPiece(code);
          grp.userData.spin = (n * 0.7) % 1.2 - 0.6;
          scene.add(grp);
          yard[side][n] = grp;
        }
        yard[side][n].userData.flying = false;
      });
    });
    placeYard();
    markCheck();
    groundBlobs();
  }

  function markCheck() {
    const ck = model && model.check ? chSqIndex(model.check) : -1;
    pieces.forEach((grp, i) => {
      const c = grp.userData.code >> 3;
      const hot = i === ck;
      grp.traverse(m => { if (m.userData.body) m.material = hot ? glowMat[c] : mats[c].body; });
    });
  }

  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeIn = (t) => t * t * t;

  function tween(dur, update, delay, done) {
    const t0 = performance.now() + (delay || 0);
    tweens.push({ t0: t0, dur: dur, update: update, done: done });
    busyUntil = Math.max(busyUntil, Date.now() + (delay || 0) + dur);
    kick();
  }

  /** A puff of particles (dust from a fall, a sparkle round a new piece): soft dots flying out and fading. */
  function puff(at, o) {
    const n = o.n || 18;
    const pos = new Float32Array(n * 3), vel = [];
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, sp = (o.speed || 1) * (0.4 + Math.random() * 0.8);
      vel.push([Math.cos(a) * sp, (o.up || 0.4) * (0.3 + Math.random()), Math.sin(a) * sp]);
      pos[k * 3] = at.x; pos[k * 3 + 1] = at.y + 0.05; pos[k * 3 + 2] = at.z;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ map: dotTex, color: o.color || 0xd8c4a4, size: o.size || 0.32, transparent: true, opacity: o.opacity || 0.75, depthWrite: false, blending: o.glow ? THREE.AdditiveBlending : THREE.NormalBlending, sizeAttenuation: true });
    const pts = new THREE.Points(geo, mat);
    pts.renderOrder = 3;
    scene.add(pts);
    const dur = o.dur || 800;
    let last = 0;
    tween(dur, (k) => {
      const dt = (k - last) * dur / 1000; last = k;
      for (let i = 0; i < n; i++) {
        vel[i][1] -= (o.gravity === undefined ? 1.2 : o.gravity) * dt;
        pos[i * 3] += vel[i][0] * dt; pos[i * 3 + 1] = Math.max(0.02, pos[i * 3 + 1] + vel[i][1] * dt); pos[i * 3 + 2] += vel[i][2] * dt;
        vel[i][0] *= 0.96; vel[i][2] *= 0.96;
      }
      geo.attributes.position.needsUpdate = true;
      mat.opacity = (o.opacity || 0.75) * (1 - easeIn(k));
      mat.size = (o.size || 0.32) * (1 + k * (o.grow === undefined ? 0.8 : o.grow));
    }, o.delay || 0, () => { clean(); });
    const clean = () => { fx.delete(clean); scene.remove(pts); geo.dispose(); mat.dispose(); };
    fx.add(clean);
  }

  /** A move played: the piece lifts, travels in an arc (a knight hops high) and settles with a little bounce;
      a piece taken is knocked over away from the attacker in a puff of dust, then set beside the board;
      a rook moves with its king; a promoted pawn sinks and the new piece rises in a sparkle. */
  function animateMove(a) {
    const from = chSqIndex(a.from), to = chSqIndex(a.to);
    const grp = pieces.get(from);
    if (!grp) return false;
    const capAt = a.captureSq ? chSqIndex(a.captureSq) : (a.capture ? to : -1);
    const victim = capAt >= 0 ? pieces.get(capAt) : null;
    // The castling rook, found before the king takes its square (in 960 the king can land on the rook's).
    let rookMove = null;
    if (a.castle) {
      const [rf, rt] = chCastleRookSquares(a, (i) => { const p = pieces.get(i); return p ? p.userData.code : 0; }, model && model.board);
      if (rf >= 0 && pieces.get(rf)) { rookMove = [pieces.get(rf), rt]; pieces.delete(rf); }
    }
    pieces.delete(from);
    if (victim) pieces.delete(capAt);
    pieces.set(to, grp);
    const start = grp.position.clone();
    const end = sqPos(to);
    const dist = start.distanceTo(end);
    const knight = (grp.userData.code & 7) === 2;
    const lift = knight ? 1.05 : 0.22 + dist * 0.07;
    const dur = Math.min(640, 300 + dist * 48);
    const travel = 0.84;                       // the rest of the time is the landing
    tween(dur, (k) => {
      if (k < travel) {
        const e = ease(k / travel);
        grp.position.lerpVectors(start, end, e);
        grp.position.y = start.y + (end.y - start.y) * e + lift * 4 * e * (1 - e);
        grp.scale.setScalar(CH_PIECE_SCALE);
      } else {
        // Settling: a small squash and a bounce.
        const s = (k - travel) / (1 - travel);
        grp.position.copy(end);
        grp.position.y = 0.035 * Math.sin(s * Math.PI) * (1 - s);
        const sq = 1 - 0.05 * Math.sin(s * Math.PI);
        grp.scale.set(CH_PIECE_SCALE / Math.sqrt(sq), CH_PIECE_SCALE * sq, CH_PIECE_SCALE / Math.sqrt(sq));
      }
    });
    if (victim) {
      // Knocked over, away from the one that took it, sliding a little; dust; then beside the board.
      const side = victim.userData.code >> 3;
      const n = yard[side].length;
      yard[side].push(victim);
      victim.userData.spin = (n * 0.7) % 1.2 - 0.6;
      victim.userData.flying = true;
      const vFrom = victim.position.clone();
      const dir = new THREE.Vector3().subVectors(vFrom, start).setY(0);
      if (dir.lengthSq() < 1e-6) dir.set(0, 0, 1);
      dir.normalize();
      const axis = new THREE.Vector3(dir.z, 0, -dir.x);          // tipping away from the attacker
      const hitAt = dur * travel * 0.82;
      const q0 = new THREE.Quaternion();
      const tipped = new THREE.Quaternion().setFromAxisAngle(axis, 1.45);
      const h = parts[victim.userData.code & 7].h * CH_PIECE_SCALE;
      tween(520, (k) => {
        const e = easeOut(k);
        victim.quaternion.slerpQuaternions(q0, tipped, Math.min(1, k * 1.25));
        const fell = Math.sin(Math.min(1, k * 1.25) * 1.45);
        victim.position.copy(vFrom).addScaledVector(dir, 0.18 + 0.32 * e + fell * 0.05);
        victim.position.y = 0.16 * fell + 0.03 * Math.sin(k * Math.PI);
      }, hitAt);
      puff(vFrom.clone().addScaledVector(dir, 0.15 + h * 0.4), { n: 22, speed: 1.1, up: 0.35, size: 0.34, dur: 900, delay: hitAt + 330, grow: 1.1 });
      const flyAt = hitAt + 820;
      tween(560, (k) => {
        if (k === 0) return;
        const e = easeOut(k);
        const p = yardPos(side, n);
        const from2 = victim.userData.from2 || (victim.userData.from2 = victim.position.clone());
        const qs = victim.userData.q2 || (victim.userData.q2 = victim.quaternion.clone());
        victim.position.lerpVectors(from2, new THREE.Vector3(p.x, -0.43, p.z), e);
        victim.position.y += 1.1 * 4 * e * (1 - e);
        victim.quaternion.slerpQuaternions(qs, new THREE.Quaternion().setFromEuler(new THREE.Euler(0, victim.userData.spin, 0)), e);
        victim.scale.setScalar(CH_PIECE_SCALE * (1 - 0.38 * e));
      }, flyAt, () => { victim.userData.flying = false; victim.userData.from2 = null; victim.userData.q2 = null; });
      camFocus(vFrom, flyAt + 300);
    }
    if (rookMove) {
      // The rook moves with its king: the same moment, a lower arc.
      const [rook, rt] = rookMove;
      {
        pieces.set(rt, rook);
        const rs = rook.position.clone(), re = sqPos(rt);
        tween(dur, (k) => {
          const e = ease(Math.min(1, k / travel));
          rook.position.lerpVectors(rs, re, e);
          rook.position.y = 0.3 * 4 * e * (1 - e);
        });
      }
    }
    if (a.promo) {
      const code = CH_LETTER_KIND[a.promo] | (grp.userData.code & 8);
      tween(260, (k) => { grp.position.y = -0.55 * easeIn(k); grp.scale.setScalar(CH_PIECE_SCALE * (1 - 0.4 * k)); }, dur, () => {
        if (dead || pieces.get(to) !== grp) return;
        const np = buildPiece(code);
        np.position.copy(sqPos(to));
        np.position.y = -0.7;
        scene.add(np);
        removePiece(grp);
        pieces.set(to, np);
        markCheck();
        tween(520, (k) => { const e = easeOut(k); np.position.y = -0.7 * (1 - e) + 0.12 * Math.sin(k * Math.PI); np.scale.setScalar(CH_PIECE_SCALE * (0.7 + 0.3 * e)); });
        puff(sqPos(to, 0.5), { n: 26, speed: 0.7, up: 1.6, gravity: -0.2, size: 0.2, color: 0xffd76a, glow: true, opacity: 0.95, dur: 1000, grow: -0.4 });
      });
    }
    return true;
  }

  /** Mate: the king topples, slowly, lands with a thud; the camera eases towards it. */
  function topple(sqName, loud) {
    const grp = pieces.get(chSqIndex(sqName));
    if (!grp) return;
    const base = grp.position.clone();
    const wait = busyUntil > Date.now() ? busyUntil - Date.now() + 150 : 150;
    const q0 = grp.quaternion.clone();
    // It falls where there is room: towards its own edge of the board, else sideways, else forwards.
    const i0 = chSqIndex(sqName), f0 = i0 & 7, r0 = i0 >> 3, own = (grp.userData.code >> 3) ? 1 : -1;
    const free = (df, dr) => { const f = f0 + df, r = r0 + dr; return f < 0 || f > 7 || r < 0 || r > 7 || !(model && model.board[r * 8 + f]); };
    const way = [[0, own], [1, 0], [-1, 0], [0, -own]].find(([df, dr]) => free(df, dr)) || [0, own];
    const dir = new THREE.Vector3(way[0], 0, -way[1]);
    const down = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(dir.z, 0, -dir.x), 1.5);
    tween(1200, (k) => {
      // Slow at first, as it tips past its balance, then falling.
      const e = k < 0.55 ? 0.18 * (k / 0.55) * (k / 0.55) : 0.18 + 0.82 * easeIn((k - 0.55) / 0.45);
      grp.quaternion.slerpQuaternions(q0, down, e);
      grp.position.x = base.x + dir.x * 0.5 * e;
      grp.position.z = base.z + dir.z * 0.5 * e;
      grp.position.y = base.y + 0.16 * Math.sin(e * 1.5);
    }, wait, () => {
      if (dead) return;
      if (loud) chSound('thud');
      puff(grp.position.clone().addScaledVector(dir, 0.55), { n: 16, speed: 0.8, up: 0.3, size: 0.3, dur: 800 });
      tween(160, (k) => { grp.position.y = base.y + 0.16 * Math.sin(1.5) + 0.04 * Math.sin(k * Math.PI); });
    });
    camFocus(grp.position.clone(), 0, { hold: true, dur: 1300, k: 0.35 });
  }

  /** Check: a red pulse on the board under the king (three rings), and a short shake. */
  const pulseGeo = new THREE.RingGeometry(0.32, 0.5, 48);
  function pulse(sqName) {
    const at = sqPos(chSqIndex(sqName), 0.012);
    const wait = busyUntil > Date.now() ? busyUntil - Date.now() : 0;
    for (let n = 0; n < 3; n++) {
      const mat = new THREE.MeshBasicMaterial({ color: 0xff3020, transparent: true, opacity: 0, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending });
      const ring = new THREE.Mesh(pulseGeo, mat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.copy(at);
      ring.renderOrder = 3;
      scene.add(ring);
      const clean = () => { fx.delete(clean); scene.remove(ring); mat.dispose(); };
      fx.add(clean);
      tween(700, (k) => { ring.scale.setScalar(0.7 + k * 0.8); mat.opacity = 0.9 * Math.sin(k * Math.PI) * (1 - k * 0.4); }, wait + n * 330, clean);
    }
    const grp = pieces.get(chSqIndex(sqName));
    if (!grp) return;
    const bx = sqPos(chSqIndex(sqName)).x;
    tween(480, (k) => { grp.position.x = bx + Math.sin(k * Math.PI * 6) * 0.05 * (1 - k); }, wait);
  }

  let overKey = '';
  function drawOverlay() {
    const m = model || {};
    const keyNow = JSON.stringify([m.last, m.sel, m.targets, m.check, m.marks, m.arrows, m.orient]);
    if (keyNow === overKey) return;
    overKey = keyNow;
    const S = 1024, u = S / 8;
    og.clearRect(0, 0, S, S);
    const at = (name) => { const i = chSqIndex(name); return i < 0 ? null : { x: (i & 7) * u, y: (7 - (i >> 3)) * u }; };
    if (m.last) [m.last.from, m.last.to].forEach(sq => { const p = at(sq); if (p) { og.fillStyle = 'rgba(255, 214, 64, 0.38)'; og.fillRect(p.x, p.y, u, u); } });
    if (m.sel) { const p = at(m.sel); if (p) { og.fillStyle = 'rgba(80, 200, 255, 0.42)'; og.fillRect(p.x, p.y, u, u); } }
    if (m.check) {
      const p = at(m.check);
      if (p) {
        const grd = og.createRadialGradient(p.x + u / 2, p.y + u / 2, 4, p.x + u / 2, p.y + u / 2, u * 0.7);
        grd.addColorStop(0, 'rgba(255,40,20,0.95)'); grd.addColorStop(0.55, 'rgba(255,40,20,0.45)'); grd.addColorStop(1, 'rgba(255,40,20,0)');
        og.fillStyle = grd; og.fillRect(p.x - u * 0.2, p.y - u * 0.2, u * 1.4, u * 1.4);
      }
    }
    (m.marks || []).forEach(mk => {
      const p = at(mk.sq);
      if (!p) return;
      if (mk.kind === 'hq') {
        // The hidden queen (its owner's phone, or everyone's once the game is over): a gold glow and ring.
        const grd = og.createRadialGradient(p.x + u / 2, p.y + u / 2, 4, p.x + u / 2, p.y + u / 2, u * 0.5);
        grd.addColorStop(0, 'rgba(250, 204, 21, 0.55)'); grd.addColorStop(1, 'rgba(250, 204, 21, 0)');
        og.fillStyle = grd; og.fillRect(p.x, p.y, u, u);
        og.strokeStyle = 'rgba(234, 179, 8, 0.98)'; og.lineWidth = 10;
        og.beginPath(); og.arc(p.x + u / 2, p.y + u / 2, u * 0.44, 0, Math.PI * 2); og.stroke();
        return;
      }
      og.strokeStyle = mk.kind === 'mine' ? 'rgba(239, 68, 68, 0.95)' : mk.kind === 'user' ? CH_ANNO_COLOR : 'rgba(34, 197, 94, 0.95)';
      og.lineWidth = mk.kind === 'user' ? 12 : 9;
      og.setLineDash(mk.kind === 'user' ? [] : [16, 10]);
      og.beginPath(); og.arc(p.x + u / 2, p.y + u / 2, u * 0.43, 0, Math.PI * 2); og.stroke();
      og.setLineDash([]);
    });
    (m.targets || []).forEach(tg => {
      const p = at(tg.to);
      if (!p) return;
      og.fillStyle = 'rgba(20, 60, 90, 0.42)';
      if (tg.capture) {
        og.strokeStyle = 'rgba(20, 60, 90, 0.5)'; og.lineWidth = 12;
        og.beginPath(); og.arc(p.x + u / 2, p.y + u / 2, u * 0.42, 0, Math.PI * 2); og.stroke();
      } else {
        og.beginPath(); og.arc(p.x + u / 2, p.y + u / 2, u * 0.16, 0, Math.PI * 2); og.fill();
      }
    });
    (m.arrows || []).forEach(ar => {
      const a = at(ar.from), b = at(ar.to);
      if (!a || !b) return;
      const x0 = a.x + u / 2, y0 = a.y + u / 2, x1 = b.x + u / 2, y1 = b.y + u / 2;
      const ang = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0);
      og.save();
      og.translate(x0, y0); og.rotate(ang);
      og.fillStyle = ar.color || 'rgba(34, 197, 94, 0.85)';
      const w = 22, head = 54, hw = 40;
      og.beginPath();
      og.moveTo(0, -w / 2); og.lineTo(len - head, -w / 2); og.lineTo(len - head, -hw); og.lineTo(len, 0);
      og.lineTo(len - head, hw); og.lineTo(len - head, w / 2); og.lineTo(0, w / 2); og.closePath();
      og.fill();
      og.restore();
    });
    // The labels last, over every arrow: a pill at the head, turned to whoever sits at the near side.
    (m.arrows || []).forEach(ar => {
      const b = at(ar.to);
      if (!ar.label || !b) return;
      const cx = b.x + u / 2, cy = b.y + u / 2, pw = u * 0.86, ph = u * 0.42;
      og.save();
      og.translate(cx, cy);
      if (m.orient) og.rotate(Math.PI);
      og.fillStyle = ar.color || 'rgba(34, 197, 94, 0.9)';
      og.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      og.lineWidth = 3;
      og.beginPath();
      if (og.roundRect) og.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2); else og.rect(-pw / 2, -ph / 2, pw, ph);
      og.fill(); og.stroke();
      og.fillStyle = ar.ink || '#ffffff';
      og.font = '800 ' + Math.round(u * 0.28) + 'px Cairo, "Segoe UI", sans-serif';
      og.textAlign = 'center'; og.textBaseline = 'middle';
      og.fillText(ar.label, 0, 2);
      og.restore();
    });
    overTex.needsUpdate = true;
  }

  /* --- the camera: from your side, at an angle, the board (and what's beside it) filling the view;
         turned and zoomed by the player (two fingers, a right or middle mouse button, the wheel), from
         above at a tap, and back; a small ease towards a capture --- */
  const DEG = Math.PI / 180;
  const view = { az: 0, dEl: 0, zoom: 1, top: 0, focus: new THREE.Vector3(), focusK: 0, focusAmt: 0.18 };
  const camLook = new THREE.Vector3();
  const clampView = () => {
    view.az = Math.max(-70 * DEG, Math.min(70 * DEG, view.az));
    view.dEl = Math.max(-26 * DEG, Math.min(40 * DEG, view.dEl));
    view.zoom = Math.max(0.6, Math.min(1.45, view.zoom));
  };
  function aimCamera() {
    const w = root.clientWidth, h = root.clientHeight;
    if (!w || !h) return;
    aspect = w / h;
    cam.aspect = aspect;
    const tv = !!(model && model.tv);
    const base = (tv ? 46 : aspect >= 1.15 ? 47 : 53) * DEG;
    const el = Math.min(88.5 * DEG, Math.max(22 * DEG, base + view.dEl) * (1 - view.top) + 88.5 * DEG * view.top);
    const az = view.az * (1 - view.top);
    const back = orient ? -1 : 1;
    const wide = aspect >= 1.15;
    // What must be seen: the frame's corners, the tops of the far pieces, the pieces beside the board.
    const pts = [];
    [-5, 5].forEach(x => [-5, 5].forEach(z => pts.push(new THREE.Vector3(x, 0, z))));
    if (view.top < 0.5) [-4, 4].forEach(x => pts.push(new THREE.Vector3(x, 1.4, -3.5 * back)));
    const side = wide ? [[-6.1, -3.3], [-6.1, 3.3], [6.1, -3.3], [6.1, 3.3]] : [[-3.3, -6.1], [3.3, -6.1], [-3.3, 6.1], [3.3, 6.1]];
    side.forEach(([x, z]) => pts.push(new THREE.Vector3(x, 0, z)));
    const look = new THREE.Vector3(0, 0, wide ? 0 : 0.25 * back * (1 - view.top));
    const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el) * back, Math.sin(el), Math.cos(az) * Math.cos(el) * back);
    // Straight down, "up" on the screen is the far side of the board.
    cam.up.set(0, 1, 0);
    if (el > 80 * DEG) cam.up.set(0, 0, -back);
    const fits = (d) => {
      cam.position.copy(look).addScaledVector(dir, d);
      cam.lookAt(look);
      cam.updateMatrixWorld();
      cam.updateProjectionMatrix();
      return pts.every(p => { const q = p.clone().project(cam); return Math.abs(q.x) <= 0.97 && q.y <= 0.95 && q.y >= -0.97; });
    };
    let lo = 5, hi = 80;
    for (let k = 0; k < 24; k++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
    camLook.copy(look).lerp(view.focus, view.focusK * view.focusAmt);
    cam.position.copy(camLook).addScaledVector(dir, hi * view.zoom * (1 - 0.06 * view.focusK));
    cam.lookAt(camLook);
    cam.updateProjectionMatrix();
    placeYard();
  }
  let camTw = 0;
  /** Eases the camera's own values to `to` (az, dEl, zoom, top). */
  function camTo(to, dur) {
    const from = { az: view.az, dEl: view.dEl, zoom: view.zoom, top: view.top };
    const my = ++camTw;
    tween(dur || 420, (k) => {
      if (my !== camTw) return;
      const e = ease(k);
      Object.keys(to).forEach(key => { view[key] = from[key] + (to[key] - from[key]) * e; });
      aimCamera();
    });
  }
  /** A small ease towards a square and back (a capture), or towards it to stay (mate). */
  function camFocus(at, delay, o) {
    if (motionOff()) return;
    const opt = o || {};
    view.focus.copy(at).setY(0);
    view.focusAmt = opt.k || 0.18;
    const k0 = view.focusK;
    tween(opt.dur || 380, (k) => { view.focusK = k0 + (1 - k0) * ease(k); aimCamera(); }, delay || 0, () => {
      if (opt.hold || dead) return;
      tween(650, (k) => { view.focusK = 1 - ease(k); aimCamera(); }, 260);
    });
  }
  const camMoved = () => Math.abs(view.az) > 0.01 || Math.abs(view.dEl) > 0.01 || Math.abs(view.zoom - 1) > 0.01 || view.top > 0.01;

  /* --- picking: the square under a finger --- */
  const ray = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function boardPoint(clientX, clientY, y) {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return null;
    const ndc = new THREE.Vector2(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam);
    const hit = new THREE.Vector3();
    plane.constant = -(y || 0);
    return ray.ray.intersectPlane(plane, hit) ? hit : null;
  }
  function pick(clientX, clientY) {
    // A tall piece stands in front of the square behind it: try the plane at a piece's middle first.
    const tryAt = (y) => {
      const hit = boardPoint(clientX, clientY, y);
      if (!hit) return -1;
      const f = Math.floor(hit.x + 4), r = Math.floor(4 - hit.z);
      return f >= 0 && f < 8 && r >= 0 && r < 8 ? r * 8 + f : -1;
    };
    const mid = view.top > 0.5 ? -1 : tryAt(0.35);
    if (mid >= 0 && pieces.has(mid)) return chSqName(mid);
    return chSqName(tryAt(0));
  }

  /* --- dragging a piece: it lifts and follows the finger --- */
  function dragStart(sq) {
    const grp = pieces.get(chSqIndex(sq));
    if (!grp) return false;
    drag = { sq: sq, grp: grp };
    kick();
    return true;
  }
  function dragMove(clientX, clientY) {
    if (!drag) return;
    const hit = boardPoint(clientX, clientY, 0);
    if (!hit) return;
    drag.grp.position.set(Math.max(-4.3, Math.min(4.3, hit.x)), 0.55, Math.max(-4.3, Math.min(4.3, hit.z)));
    kick();
  }
  function dragEnd(played) {
    if (!drag) return;
    const d = drag;
    drag = null;
    if (played) return;
    // Not played: back to its square.
    const from = d.grp.position.clone(), to = sqPos(chSqIndex(d.sq));
    tween(200, (k) => { const e = easeOut(k); d.grp.position.lerpVectors(from, to, e); });
  }

  function setModel(m) {
    const fresh = !model || m.key !== modelKey;
    const prevOrient = orient;
    model = m;
    orient = m.orient ? 1 : 0;
    applyStyle();
    drawBoard(orient);
    if (fresh) {
      modelKey = m.key;
      animKey = m.anim ? m.anim.key : '';
      mateKey = m.mate ? m.key + '|mate' : '';
      tweens.length = 0;
      [...fx].forEach(f => f());
      view.focusK = 0;
      pieces.forEach(removePiece); pieces.clear();
      yard.forEach(list => { list.forEach(removePiece); list.length = 0; });
      aimCamera();
      snap();
    } else {
      if (prevOrient !== orient) aimCamera();
      let moved = false;
      if (m.anim && m.anim.key !== animKey) {
        animKey = m.anim.key;
        if (!motionOff() && (!m.anim.still)) {
          moved = animateMove(m.anim);
          if (moved) {
            const k = m.anim.capture ? 'capture' : m.anim.castle ? 'castle' : 'move';
            if (m.loud !== false) setTimeout(() => { if (!dead) chSound(k); }, 200);
            if (m.check && m.loud !== false) setTimeout(() => chSound('check'), 420);
            if (m.check) pulse(m.check);
          }
        }
      }
      // Settle on this model once whatever is moving has finished - also when nothing new moved but
      // something still is (a move refused mid-slide: the board goes back to the room's).
      if (!moved && !tweens.length) snap();
      else setTimeout(() => { if (!dead && model === m && !tweens.length && !drag) { snap(); render(); } }, Math.max(0, busyUntil - Date.now() + 30));
      if (!moved) markCheck();
      if (m.mate && mateKey !== m.key + '|mate') {
        mateKey = m.key + '|mate';
        if (!motionOff()) topple(m.mate, m.loud !== false);
        if (m.loud !== false) setTimeout(() => { if (!dead) chSound('end'); }, Math.max(0, busyUntil - Date.now()) + 200);
      }
    }
    drawOverlay();
    kick();
  }

  /* --- the loop: only while something moves --- */
  let raf = 0, running = false, paused = false;
  function render() {
    if (dead) return;
    renderer.render(scene, cam);
  }
  function frame(now) {
    raf = 0;
    if (!root.isConnected || paused) { running = false; return; }
    for (let k = tweens.length - 1; k >= 0; k--) {
      const tw = tweens[k];
      if (now < tw.t0) continue;
      const t = Math.min(1, (now - tw.t0) / tw.dur);
      tw.update(t);
      if (t >= 1) { tweens.splice(k, 1); if (tw.done) tw.done(); }
    }
    groundBlobs();
    render();
    if (tweens.length || drag) { raf = requestAnimationFrame(frame); running = true; }
    else running = false;
  }
  function kick() {
    if (raf || paused || dead) return;
    raf = requestAnimationFrame(frame);
    running = true;
  }

  function resize() {
    const w = root.clientWidth, h = root.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    aimCamera();
    kick();
  }
  const ro = new ResizeObserver(resize);
  ro.observe(root);
  resize();

  /** The player's camera: turn (a drag's pixels), zoom (a factor), from above (a toggle), back to the start. */
  function camera(cmd, a, b) {
    if (cmd === 'orbit') {
      const w = root.clientWidth || 300;
      if (view.top > 0.5) return;
      view.az -= (a / w) * Math.PI * 0.9;
      view.dEl += (b / w) * Math.PI * 0.6;
      clampView(); aimCamera(); kick();
    } else if (cmd === 'zoom') {
      view.zoom *= a;
      clampView(); aimCamera(); kick();
    } else if (cmd === 'top') {
      camTo(view.top > 0.5 ? { top: 0 } : { top: 1, zoom: 1 }, 480);
    } else if (cmd === 'reset') {
      camTo({ az: 0, dEl: 0, zoom: 1, top: 0 }, 480);
    }
  }

  function dispose() {
    dead = true;
    if (raf) cancelAnimationFrame(raf);
    ro.disconnect();
    const seen = new Set();
    scene.traverse(o => {
      if (o.geometry && !seen.has(o.geometry)) { seen.add(o.geometry); o.geometry.dispose(); }
      const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      ms.forEach(mm => { if (!seen.has(mm)) { seen.add(mm); if (mm.map) mm.map.dispose(); mm.dispose(); } });
    });
    Object.keys(parts).forEach(k => {
      const p = parts[k];
      if (p && p.dispose) p.dispose();
      if (p && p.body) { p.body.dispose(); if (p.head) p.head.dispose(); }
    });
    Object.keys(parts.felt || {}).forEach(k => parts.felt[k].dispose());
    [mats[0], mats[1]].forEach(s => { s.body.dispose(); s.mark.dispose(); });
    glowMat.forEach(m => m.dispose());
    [feltMat, blobMat, woodMat, topMat].forEach(m => m.dispose());
    pulseGeo.dispose();
    [boardTex, overTex, frameTex, blobTex, dotTex, env].forEach(t => t.dispose());
    pmrem.dispose();
    renderer.dispose();
    try { renderer.forceContextLoss(); } catch (e) {}
    canvas.remove();
  }

  return {
    kind: '3d',
    setModel: setModel, pick: pick, dragStart: dragStart, dragMove: dragMove, dragEnd: dragEnd,
    /** A small shake of the piece on a square (a premove that can't be played). */
    nudge: (sq) => {
      const grp = pieces.get(chSqIndex(sq));
      if (!grp || motionOff()) return;
      const bx = sqPos(chSqIndex(sq)).x;
      tween(360, (k) => { grp.position.x = bx + Math.sin(k * Math.PI * 5) * 0.06 * (1 - k); });
    },
    resize: resize, dispose: dispose, camera: camera, camMoved: camMoved, camTop: () => view.top > 0.5,
    pause: (p) => { paused = !!p; if (!p) kick(); },
    busyUntil: () => busyUntil,
    /** Where a square's middle is on the page (the promotion picker; the tests tap there). */
    screenOf: (sq) => {
      const r = canvas.getBoundingClientRect();
      const q = sqPos(chSqIndex(sq), 0.2).project(cam);
      return { x: r.left + (q.x * 0.5 + 0.5) * r.width, y: r.top + (-q.y * 0.5 + 0.5) * r.height };
    }
  };
}

/* ============================================================================
   The 2D board (the owner, 24 Sep 2026: "the option to play it normal, same look as in chess.com")
   ----------------------------------------------------------------------------
   Squares as a grid in the style's two colours, the coordinates small in the corners of the edge
   squares (files along the bottom, ranks up the left, in the other square's colour), the last move's
   two squares tinted, the piece picked up tinted, a soft dot on a square it can go to and a ring round
   a piece it can take, a red glow under a king in check, arrows and marks in an SVG layer. The pieces
   are a layer of their own over the squares, each placed with a transform, so a move slides the piece
   (150 ms, Web Animations of transform only), a piece taken fades under the one arriving, a rook comes
   with its king, a promoted piece pops, a dragged piece lifts and follows the finger. The live board
   is built once and updated square by square; the static callers (the position editor, the
   tournament's live cards) draw chFlatBoardHtml as it is. It is also where WebGL can't draw.
   ========================================================================= */

// The board styles (the owner, 24 Sep 2026; «أخضر» the default): the 2D colours are tokens per style
// in Style.html ([data-ch2-style]); the 3D board's are in CH3_STYLES.
const CH2_STYLES = ['green', 'wood', 'blue', 'marble'];

/**
 * This phone's board: { view: '2d' | '3d', style, premove }. 2D until the phone asks for 3D; premoves on
 * until switched off (the owner, 24 Sep 2026: «الحركات المسبقة», against the computer and on your own
 * phone in a room). Remembered on the phone, one place for the setup, the board's ⚙ and the rooms.
 */
function chLook() {
  const o = typeof recallOptions === 'function' ? recallOptions('chessLook', { view: '2d', style: 'green', premove: true }) : { view: '2d', style: 'green', premove: true };
  return { view: o.view === '3d' ? '3d' : '2d', style: CH2_STYLES.indexOf(o.style) === -1 ? 'green' : o.style, premove: o.premove !== false };
}

/** Remembers a change of the look and shows it on the board and the setup screen at once. */
function chLookSet(patch) {
  if (typeof rememberOptions === 'function') rememberOptions('chessLook', patch);
  if (patch && 'premove' in patch) {
    // Switched off: a move already queued goes, and the screen is drawn again (whether a tap queues one).
    if (!patch.premove) { chLocal.pre = null; chLocal.presel = ''; if (typeof chRoomLocal !== 'undefined') { chRoomLocal.pre = null; chRoomLocal.presel = ''; } }
    if (appState.currentView === 'play-shatranj' && appState.shatranj && appState.shatranj.g) chPaint({ still: true });
    else if (appState.currentView === 'room-chess' && typeof chRoomRedraw === 'function') chRoomRedraw(true);
  }
  if (chView.root && chView.root.parentNode && chView.model) chViewShow(chView.root.parentNode, chView.model);
  if (chView.root && !chView.root.querySelector('[data-ch-pop]').hidden) chToolsPop(true, true);
  if (appState.currentView === 'setup-shatranj') paintShatranjSetup();
  if (appState.currentView === 'pos-shatranj' && typeof chPosPaint === 'function') chPosPaint();
}

/** Where a square is drawn: [column, row] from the top left, White or Black at the bottom. */
const ch2Cell = (i, o) => (o ? [7 - (i & 7), i >> 3] : [i & 7, 7 - (i >> 3)]);

/** One square's classes and what is drawn in it (the coordinates, a dot or a ring). */
function ch2SquareParts(m, i, o, extra) {
  const name = chSqName(i);
  const [col, row] = ch2Cell(i, o);
  const cls = ['ch2-sq', ((i >> 3) + (i & 7)) % 2 === 1 ? 'is-l' : 'is-d'];
  if (m.last && (m.last.from === name || m.last.to === name)) cls.push('is-last');
  if (m.sel === name) cls.push('is-sel');
  if (m.check === name) cls.push('is-check');
  let crown = false;
  (m.marks || []).forEach(x => {
    if (x.sq !== name) return;
    if (x.kind === 'hq') { cls.push('is-hq'); crown = true; return; }
    cls.push(x.kind === 'mine' ? 'is-danger' : x.kind === 'user' ? 'is-anno' : 'is-chance');
  });
  if (extra && extra.hover === name) cls.push('is-hover');
  const tg = (m.targets || []).find(x => x.to === name);
  let inner = '';
  if (!m.mini) {
    if (col === 0) inner += `<i class="ch2-co ch2-co--r">${(i >> 3) + 1}</i>`;
    if (row === 7) inner += `<i class="ch2-co ch2-co--f">${CH_FILES[i & 7]}</i>`;
  }
  if (tg) inner += `<b class="${tg.capture ? 'ch2-cap' : 'ch2-dot'}"></b>`;
  // The hidden queen's badge: a small gold crown in the square's corner, over the pawn.
  if (crown) inner += '<i class="ch2-hq" aria-hidden="true">👑</i>';
  return { cls: cls.join(' '), inner: inner };
}

/** The arrows (a hint, the review's better move) as one SVG over the board, 8 × 8 units. */
function ch2ArrowsSvg(m, o) {
  const list = (m.arrows || []).map(a => {
    if (chSqIndex(a.from) < 0 || chSqIndex(a.to) < 0) return '';
    const p = (name) => { const c = ch2Cell(chSqIndex(name), o); return [c[0] + 0.5, c[1] + 0.5]; };
    const [x0, y0] = p(a.from), [x1, y1] = p(a.to);
    const len = Math.hypot(x1 - x0, y1 - y0) || 1;
    const ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    const hx = x1 - ux * 0.42, hy = y1 - uy * 0.42;
    const col = a.color || 'rgba(34,197,94,0.85)';
    // A label at the arrow's head (the best moves' win chance), on a pill of the arrow's colour.
    const label = a.label ? `<g class="ch2-arrow-label"><rect x="${x1 - 0.42}" y="${y1 - 0.2}" width="0.84" height="0.4" rx="0.2" fill="${col}" stroke="rgba(0,0,0,0.35)" stroke-width="0.02"/><text x="${x1}" y="${y1 + 0.01}" fill="${a.ink || '#fff'}" font-size="0.27" font-weight="800" text-anchor="middle" dominant-baseline="middle">${escapeHTML(a.label)}</text></g>` : '';
    return `<line x1="${x0 + ux * 0.2}" y1="${y0 + uy * 0.2}" x2="${hx}" y2="${hy}" stroke="${col}" stroke-width="0.19" stroke-linecap="round"/>` +
      `<polygon points="${x1 - ux * 0.06},${y1 - uy * 0.06} ${hx - uy * 0.3},${hy + ux * 0.3} ${hx + uy * 0.3},${hy - ux * 0.3}" fill="${col}"/>` + label;
  }).join('');
  return list ? `<svg class="ch2-arrows" viewBox="0 0 8 8" aria-hidden="true">${list}</svg>` : '';
}

/** A piece in the pieces' layer, placed on square i. */
const ch2PieceHtml = (code, i, o) => { const c = ch2Cell(i, o); return `<span class="ch2-pc" data-pc="${i}" style="--x:${c[0]};--y:${c[1]}">${chPieceSvg(code)}</span>`; };

/** The board as markup: squares, pieces, marks and arrows. m: the view's model (+ style, mini). */
function chFlatBoardHtml(m) {
  const o = m.orient ? 1 : 0;
  let sqs = '', pcs = '';
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const f = o ? 7 - col : col, r = o ? row : 7 - row;
      const i = r * 8 + f;
      const p = ch2SquareParts(m, i, o);
      sqs += `<span class="${p.cls}" data-sq="${chSqName(i)}" style="--bx:${(i * 37) % 100}%;--by:${(i * 61) % 100}%">${p.inner}</span>`;
    }
  }
  const board = m.board || [];
  for (let i = 0; i < 64; i++) if (board[i]) pcs += ch2PieceHtml(board[i], i, o);
  return `<div class="ch2-board ${m.mini ? 'is-mini' : ''}" data-ch2-style="${escapeHTML(m.style || chLook().style)}" dir="ltr"><div class="ch2-sqs">${sqs}</div><div class="ch2-pcs">${pcs}</div>${ch2ArrowsSvg(m, o)}</div>`;
}

function chMakeFlat(root) {
  const box = document.createElement('div');
  box.className = 'ch-flat';
  root.insertBefore(box, root.firstChild);
  let model = null, layout = '', boardEl = null, layer = null, sqEls = [], sqKey = [], arrowsKey = '';
  let animKey = '', mateKey = '', drag = null, dropped = null, hover = '', busyUntil = 0, dead = false;
  const pcs = new Map();                     // square index -> the piece's element
  const orientOf = () => (model && model.orient ? 1 : 0);
  const moving = () => !motionOff();

  function build(m) {
    box.innerHTML = chFlatBoardHtml(Object.assign({}, m, { board: [], arrows: [], targets: [], marks: [], last: null, sel: '', check: '' }));
    boardEl = box.querySelector('.ch2-board');
    layer = box.querySelector('.ch2-pcs');
    sqEls = []; sqKey = []; arrowsKey = '';
    box.querySelectorAll('.ch2-sq').forEach(el => { sqEls[chSqIndex(el.dataset.sq)] = el; });
    pcs.clear();
  }
  function place(el, i) {
    const c = ch2Cell(i, orientOf());
    el.style.setProperty('--x', c[0]);
    el.style.setProperty('--y', c[1]);
    el.dataset.pc = i;
  }
  function makePiece(code) {
    const el = document.createElement('span');
    el.className = 'ch2-pc';
    el.innerHTML = chPieceSvg(code);
    el._code = code;
    return el;
  }
  const at = (i) => { const c = ch2Cell(i, orientOf()); return `translate(${c[0] * 100}%, ${c[1] * 100}%)`; };
  function slide(el, from, to, dur) {
    if (!el.animate) return;
    el.classList.add('is-moving');
    const a = el.animate([{ transform: at(from) }, { transform: at(to) }], { duration: dur, easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)' });
    a.onfinish = a.oncancel = () => el.classList.remove('is-moving');
    busyUntil = Math.max(busyUntil, Date.now() + dur);
  }
  function pop(el) {
    const svg = el.firstElementChild;
    if (svg && svg.animate) svg.animate([{ transform: 'scale(0.4)', opacity: 0.3 }, { transform: 'scale(1.18)', opacity: 1, offset: 0.65 }, { transform: 'scale(1)' }], { duration: 320, delay: 120, easing: 'ease-out', fill: 'backwards' });
  }
  function shake(el) {
    const svg = el && el.firstElementChild;
    if (svg && svg.animate) svg.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-9%)' }, { transform: 'translateX(8%)' }, { transform: 'translateX(-5%)' }, { transform: 'translateX(0)' }], { duration: 260, delay: 150 });
  }

  /** A move played: the piece slides, the one it took fades under it, a rook follows its king. */
  function playMove(a) {
    const from = chSqIndex(a.from), to = chSqIndex(a.to);
    const el = pcs.get(from);
    if (!el) return;
    const capAt = a.captureSq ? chSqIndex(a.captureSq) : (a.capture ? to : -1);
    const victim = capAt >= 0 ? pcs.get(capAt) : null;
    if (victim && victim !== el) {
      pcs.delete(capAt);
      victim.classList.add('is-taken');
      const fade = victim.animate ? victim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, delay: 70, fill: 'forwards' }) : null;
      if (fade) fade.onfinish = () => victim.remove(); else victim.remove();
    }
    // The castling rook, found before the king takes its square (in 960 the king can land on the rook's).
    let rookMove = null;
    if (a.castle) {
      const [rf, rt] = chCastleRookSquares(a, (i) => { const e = pcs.get(i); return e ? e._code : 0; }, model && model.board);
      if (rf >= 0 && pcs.get(rf)) { rookMove = [pcs.get(rf), rf, rt]; pcs.delete(rf); }
    }
    pcs.delete(from);
    pcs.set(to, el);
    // A piece dropped there by the finger is there already: no slide.
    const wasDropped = (drag && drag.el === el) || (dropped && dropped.from === from && dropped.to === to && Date.now() - dropped.at < 4000);
    dropped = null;
    if (!wasDropped) slide(el, from, to, 150);
    if (rookMove) { const [rook, rf, rt] = rookMove; pcs.set(rt, rook); place(rook, rt); slide(rook, rf, rt, 150); }
    if (!(drag && drag.el === el)) place(el, to);
  }

  /** Every square's piece as the model says, keeping the elements that are already right. */
  function reconcile(m, promoted) {
    const b = m.board;
    const mate = m.mate ? chSqIndex(m.mate) : -1;
    pcs.forEach((el, i) => { if (!b[i]) { if (!(drag && drag.el === el)) el.remove(); pcs.delete(i); } });
    for (let i = 0; i < 64; i++) {
      const want = b[i] || 0;
      if (!want) continue;
      let el = pcs.get(i);
      if (!el) { el = makePiece(want); layer.appendChild(el); pcs.set(i, el); }
      else if (el._code !== want) { el.innerHTML = chPieceSvg(want); el._code = want; if (promoted === i && moving()) pop(el); }
      if (!(drag && drag.el === el)) place(el, i);
      el.classList.toggle('is-mated', i === mate);
    }
  }

  function paintSquares(m) {
    const o = orientOf();
    for (let i = 0; i < 64; i++) {
      const el = sqEls[i];
      if (!el) continue;
      const p = ch2SquareParts(m, i, o, { hover: hover });
      const k = p.cls + '|' + p.inner;
      if (sqKey[i] === k) continue;
      sqKey[i] = k;
      el.className = p.cls;
      el.innerHTML = p.inner;
    }
    const ak = JSON.stringify(m.arrows || []);
    if (ak !== arrowsKey) {
      arrowsKey = ak;
      const old = boardEl.querySelector('.ch2-arrows');
      if (old) old.remove();
      const svg = ch2ArrowsSvg(m, o);
      if (svg) boardEl.insertAdjacentHTML('beforeend', svg);
    }
  }

  function setModel(m) {
    if (dead) return;
    const fresh = !model || model.key !== m.key;
    model = m;
    const style = m.style || chLook().style;
    const lay = m.orient ? 1 : 0;
    if (lay !== layout) { layout = lay; build(m); }
    if (boardEl.getAttribute('data-ch2-style') !== style) boardEl.setAttribute('data-ch2-style', style);
    let promoted = -1;
    if (fresh) { animKey = m.anim ? m.anim.key : ''; mateKey = m.mate ? m.key : ''; }
    else if (m.anim && m.anim.key !== animKey) {
      animKey = m.anim.key;
      if (!m.anim.still) {
        if (m.loud !== false) {
          chSound(m.anim.capture ? 'capture' : m.anim.castle ? 'castle' : 'move');
          if (m.check) setTimeout(() => chSound('check'), 170);
        }
        if (moving()) { playMove(m.anim); if (m.anim.promo) promoted = chSqIndex(m.anim.to); }
      }
    }
    reconcile(m, promoted);
    paintSquares(m);
    if (m.mate && mateKey !== m.key) {
      mateKey = m.key;
      if (m.loud !== false) setTimeout(() => chSound('end'), 380);
    }
  }

  function pick(clientX, clientY) {
    if (!boardEl) return '';
    const r = boardEl.getBoundingClientRect();
    const col = Math.floor((clientX - r.left) / r.width * 8), row = Math.floor((clientY - r.top) / r.height * 8);
    if (col < 0 || col > 7 || row < 0 || row > 7) return '';
    const o = orientOf();
    const f = o ? 7 - col : col, rk = o ? row : 7 - row;
    return chSqName(rk * 8 + f);
  }

  /* --- a piece carried by the finger: lifted, following it, back to its square if not played --- */
  function dragStart(sq) {
    const el = pcs.get(chSqIndex(sq));
    if (!el || !boardEl) return false;
    drag = { sq: sq, el: el };
    el.classList.add('is-drag');
    return true;
  }
  function dragMove(clientX, clientY) {
    if (!drag || !boardEl) return;
    const r = boardEl.getBoundingClientRect();
    const s = r.width / 8;
    const x = Math.max(-s / 2, Math.min(r.width - s / 2, clientX - r.left - s / 2));
    const y = Math.max(-s / 2, Math.min(r.height - s / 2, clientY - r.top - s / 2));
    drag.el.style.transform = `translate(${x}px, ${y}px)`;
    const h = pick(clientX, clientY);
    if (h !== hover) { hover = h; if (model) paintSquares(model); }
  }
  function dragEnd(played, to, refused) {
    if (!drag) return;
    const d = drag;
    drag = null;
    hover = '';
    d.el.classList.remove('is-drag');
    const from = chSqIndex(d.sq);
    const now = d.el.style.transform;
    d.el.style.transform = '';
    const home = [...pcs.entries()].find(([, el]) => el === d.el);
    if (played) {
      // Left where it was dropped; the move itself (now, or when the room answers) doesn't slide it again.
      const ti = chSqIndex(to || '');
      if (ti >= 0 && home && home[0] === from) { place(d.el, ti); dropped = { from: from, to: ti, at: Date.now() }; }
      else if (home) place(d.el, home[0]);
    } else if (home) {
      place(d.el, home[0]);
      if (d.el.animate && moving()) {
        d.el.animate([{ transform: now || at(home[0]) }, { transform: at(home[0]) }], { duration: 150, easing: 'ease-out' });
        if (refused) shake(d.el);
      }
    } else d.el.remove();
    if (model) paintSquares(model);
  }

  return {
    kind: 'flat',
    setModel: setModel, pick: pick,
    nudge: (sq) => { if (moving()) shake(pcs.get(chSqIndex(sq))); },
    dragStart: dragStart, dragMove: dragMove, dragEnd: dragEnd,
    resize: () => {}, pause: () => {},
    dispose: () => { dead = true; box.remove(); },
    busyUntil: () => busyUntil,
    screenOf: (sq) => {
      const el = sqEls[chSqIndex(sq)];
      if (!el) return null;
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
  };
}

/* ============================================================================
   The view: one per page, moved into whichever screen shows a board
   ========================================================================= */

// anno: the arrows and marks drawn on this board by hand (never sent anywhere), cleared when a move is
// played; pen: the ✏️ drawing mode for a finger; draft: the arrow being drawn.
const chView = { root: null, r: null, model: null, loading: false, no3d: false, anno: { key: '', arrows: [], marks: [] }, pen: false, draft: null };

function chViewRoot() {
  if (chView.root) return chView.root;
  const el = document.createElement('div');
  el.className = 'ch-view';
  el.innerHTML = `<div class="ch-loading" aria-hidden="true"><span></span></div><div class="ch-promo" data-ch-promo hidden></div>` +
    `<div class="ch-tools" data-ch-tools></div><div class="ch-lookpop" data-ch-pop hidden></div>`;
  chWireInput(el);
  // A tap anywhere else on the board closes the styles.
  el.addEventListener('pointerdown', (e) => { if (!e.target.closest('[data-ch-pop], [data-ch-tools]')) chToolsPop(false); });
  chView.root = el;
  return el;
}

/** Shows `model` in `host`, making the board the first time: 2D, or 3D where this phone chose it (the TV always). */
function chViewShow(host, model) {
  if (!host) return;
  const root = chViewRoot();
  if (root.parentNode !== host) host.appendChild(root);
  chView.model = model;
  // What was drawn by hand belongs to this position: a move played (or another board) clears it.
  const annoKey = model.key + '|' + (model.anim ? model.anim.key : '');
  if (chView.anno.key !== annoKey) chView.anno = { key: annoKey, arrows: [], marks: [] };
  root.classList.toggle('is-live', !!(model.input && model.input.canMove));
  root.classList.toggle('is-browse', !!model.browse);
  root.classList.toggle('is-pen', chView.pen && !model.tv);
  // A promotion being chosen belongs to a move this board can still make: once it can't (the
  // other side resigned, a flag fell, the review took the board), the picker goes, unchosen.
  const promo = root.querySelector('[data-ch-promo]');
  if (promo && !promo.hidden && !(model.input && model.input.canMove)) { promo.hidden = true; promo.innerHTML = ''; }
  root.classList.toggle('is-tv', !!model.tv);
  root.setAttribute('data-ch2-style', chLook().style);
  const want = chViewWant(model);
  if (!chView.r || (want === 'flat' && chView.r.kind !== 'flat')) chViewMake('flat');
  else chView.r.setModel(chAnnoMerge(model));
  // 3D wanted: the 2D board shows the position while three.js loads (the first time only), then gives way.
  if (want === '3d' && chView.r.kind !== '3d' && !chView.loading) chViewLoad3D();
  chViewTools(root, model);
}

/** Can this device show the 3D board? No WebGL, or three.js that failed to load: 2D only, and no switch. */
const chCan3D = () => !chView.no3d && typeof loadThree === 'function' && typeof threeCanDraw === 'function' && threeCanDraw();

/** The board a screen wants: the TV's is 3D; a phone's its own choice, 2D until it asks (the owner, 24 Sep 2026). */
const chViewWant = (model) => (chCan3D() && ((model && model.tv) || chLook().view === '3d') ? '3d' : 'flat');

/** Replaces the board with a new one of that kind, showing the current model at once (no motion). */
function chViewMake(kind, THREE) {
  const root = chView.root;
  const old = chView.r;
  const r = kind === '3d' ? chMake3D(THREE, root) : chMakeFlat(root);
  chView.r = r;
  if (old) { try { old.dispose(); } catch (e) {} }
  root.classList.toggle('is-flat', kind === 'flat');
  root.classList.toggle('is-3d', kind === '3d');
  if (chView.model) r.setModel(chAnnoMerge(chView.model));
}

/** three.js is asked for only here: when a board wants 3D (never while a phone stays in 2D). */
function chViewLoad3D() {
  const root = chView.root;
  chView.loading = true;
  root.classList.add('is-loading');
  loadThree().then((THREE) => {
    if (chView.root !== root) return;
    chView.loading = false;
    root.classList.remove('is-loading');
    if (chViewWant(chView.model) !== '3d' || (chView.r && chView.r.kind === '3d')) return;
    try { chViewMake('3d', THREE); }
    catch (e) { console.warn('chess 3d', e); chView.no3d = true; chViewMake('flat'); }
    if (chView.model) chViewTools(root, chView.model);
  }).catch(() => {
    // It can't load (offline the first time, a blocked CDN): 2D, silently, and no switch until a reload.
    if (chView.root !== root) return;
    chView.loading = false;
    root.classList.remove('is-loading');
    chView.no3d = true;
    if (chView.model) chViewTools(root, chView.model);
  });
}

/** The switch on the board: 2D ↔ 3D, the game, the piece picked up and the arrows kept (remembered). */
function chViewToggle() {
  chViewSet(chLook().view === '3d' ? '2d' : '3d');
}

/** «2D | 3D»: the board as a flat one or in 3D - on the board and on the setup screen alike. */
function chViewSet(v) {
  chToolsPop(false);
  if (chLook().view !== v) chLookSet({ view: v === '3d' ? '3d' : '2d' });
}

/** The segmented «2D | 3D» (none where 3D can't draw). cls: 'ch-seg' on the board, 'segmented' on the setup. */
function chViewSegHtml() {
  if (!chCan3D()) return '';
  const cur = chLook().view;
  return `<span class="ch-seg" role="group" aria-label="${escapeHTML(chT('ch_view_label'))}">` + ['2d', '3d'].map(v =>
    `<button type="button" class="ch-seg__item ${cur === v ? 'is-active' : ''}" aria-pressed="${cur === v}" onclick="chViewSet('${v}')" title="${escapeHTML(chT(v === '3d' ? 'ch_view_to3d' : 'ch_view_to2d'))}">${v === '3d' ? '3D' : '2D'}</button>`).join('') + '</span>';
}

function chViewDrop() {
  if (chView.r) { try { chView.r.dispose(); } catch (e) {} }
  if (chView.root) chView.root.remove();
  chView.r = null;
  chView.root = null;
  chView.model = null;
  chView.loading = false;
  chView.pen = false;
  chView.draft = null;
}

/* --- arrows and marks drawn by hand (the owner, 24 Sep 2026) ----------------------------------
   On a computer: a right-click drag draws an arrow and a right-click marks a square (in 3D, where a
   right-drag turns the board, with Shift held). On a phone: ✏️ on the board, then a drag draws an
   arrow and a tap marks a square. Green; the same arrow or mark again takes it away. They stay on
   this screen only (a room never hears of them) and go when a move is played. */

const CH_ANNO_COLOR = 'rgba(21, 128, 61, 0.82)';

/** The model with the hand-drawn arrows and marks (and the arrow being drawn) on top of its own. */
function chAnnoMerge(model) {
  const a = chView.anno;
  const d = chView.draft;
  if (!model || (!a.arrows.length && !a.marks.length && !d)) return model;
  return Object.assign({}, model, {
    arrows: (model.arrows || []).concat(a.arrows.map(x => ({ from: x.from, to: x.to, color: CH_ANNO_COLOR })), d ? [{ from: d.from, to: d.to, color: CH_ANNO_COLOR }] : []),
    marks: (model.marks || []).concat(a.marks.map(sq => ({ sq: sq, kind: 'user' })))
  });
}

/** Redraws the board with what is drawn on it now. */
function chAnnoRefresh() {
  if (chView.r && chView.model) chView.r.setModel(chAnnoMerge(chView.model));
  if (chView.root && chView.model) chViewTools(chView.root, chView.model);
}

/** A mark on a square, or an arrow from one to another: added, or taken away if it is there already. */
function chAnnoToggle(from, to) {
  const a = chView.anno;
  if (!from) return;
  if (!to || to === from) {
    const k = a.marks.indexOf(from);
    if (k === -1) a.marks.push(from); else a.marks.splice(k, 1);
  } else {
    const k = a.arrows.findIndex(x => x.from === from && x.to === to);
    if (k === -1) a.arrows.push({ from: from, to: to }); else a.arrows.splice(k, 1);
  }
  if (typeof haptic === 'function') haptic('light');
}

/** ✏️: the drawing mode for a finger (on and off). */
function chPenToggle() {
  chToolsPop(false);
  chView.pen = !chView.pen;
  chView.draft = null;
  if (chView.root) chView.root.classList.toggle('is-pen', chView.pen);
  chAnnoRefresh();
}
