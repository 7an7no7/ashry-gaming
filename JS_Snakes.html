/* --- the second round (the owner, 29 Sep 2026) ---------------------------------------------------
   What a roll can show besides the snake and the ladder, each picked on the server (Snakes.js) so
   every screen plays the same one: a snake's head walked past, the drumroll from 95, a 1, a snake's
   tail square, the sneak up a ladder next door, two on one square, the sixes building up, the cup
   giggling at a bounce, the snakes swaying at a win, a leaver's suitcase. The rest is the board's own
   life, decided on each screen (it belongs to no roll): the pieces' moods, their idle moments, the
   others' reactions, the snakes and the workers now and then, the TV's night. */

const SNK_MOODS = ['mood-happy', 'mood-scared', 'mood-bored'];
const SNK_IDLES = ['idle-tap', 'idle-yawn', 'idle-watch'];
const SNK_REACTS = ['react-gasp', 'react-laugh', 'react-clap'];
const SNK_SIT_AFTER = 25;             // seconds without moving before a waiting piece sits down

/** A piece back to itself: no mood, idle moment, reaction or sitting (home stays home). */
function snkCalm(p) {
  SNK_MOODS.concat(SNK_IDLES, SNK_REACTS, ['is-sat']).forEach(k => p.e.classList.remove(k));
  p.mood = '';
  clearTimeout(p.idleT);
}

/**
 * The faces show the mood, from where each piece stands: scared with a snake's head within a roll
 * ahead, happy with a ladder's foot there, bored 30 squares or more behind the leader. Only while
 * nothing is being played (a move's own faces come first). The cup shines while anyone is on 95-99.
 */
function snkMoods(c) {
  const busy = c.playing || c.building;
  const m = c.map;
  const list = Object.keys(c.players).map(id => c.players[id]).filter(p => !p.hidden);
  let lead = 0, near100 = false;
  list.forEach(p => { if (p.n < 100) lead = Math.max(lead, p.n); if (p.n >= SNAKES_TENSE_FROM && p.n < 100) near100 = true; });
  c.svg.classList.toggle('is-near100', near100);
  list.forEach(p => {
    let mood = '';
    if (!busy && m && p.n > 0 && p.n < 100) {
      if (m.snakes.some(s => s.h > p.n && s.h - p.n <= 6)) mood = 'scared';
      else if (m.ladders.some(l => l.f > p.n && l.f - p.n <= 6)) mood = 'happy';
      else if (lead - p.n >= 30) mood = 'bored';
    }
    if (p.mood === mood) return;
    SNK_MOODS.forEach(k => p.e.classList.remove(k));
    if (mood) p.e.classList.add('mood-' + mood);
    p.mood = mood;
  });
}

/** Whose roll the table is waiting for (they don't idle: they're about to roll). */
const snkUpPid = (c) => (c.lastG && c.lastG.phase === 'play' && c.lastG.turn ? c.lastG.turn.pid : null);

/** The board's own life, a few times a second at rest (snkFrame): moods, sitting, idle moments, the snakes and the workers. */
function snkAmbient(c, t) {
  if (c.building) return;
  if (!c.ambT || t - c.ambT > 1) {
    c.ambT = t;
    if (!c.playing) snkMoods(c);
    // Sitting down after a long wait; up again when it's their turn or they move.
    const up = snkUpPid(c);
    Object.keys(c.players).forEach(id => {
      const p = c.players[id];
      if (p.hidden || p.n >= 100) return;
      if (p.movedAt == null) p.movedAt = t;
      const sit = id !== up && id !== c.currentPid && t - p.movedAt > SNK_SIT_AFTER;
      if (p.e.classList.contains('is-sat') !== sit) p.e.classList.toggle('is-sat', sit);
    });
  }
  if (c.playing) return;
  // Rarer since the owner's review (29 Sep 2026): an idle moment every 7-14 s (was 2.5-6), the board's own every 18-35 s (was 11-23).
  if (!c.nextIdle) c.nextIdle = t + 6;
  if (t > c.nextIdle) { c.nextIdle = t + 7 + Math.random() * 7; snkIdleOnce(c); }
  if (!c.nextLife) c.nextLife = t + 12 + Math.random() * 8;
  if (t > c.nextLife && !c.life) { c.nextLife = t + 18 + Math.random() * 17; snkBoardLife(c); }
}

/** One waiting player taps a foot, yawns, or watches the snakes (never the one about to roll). */
function snkIdleOnce(c) {
  const up = snkUpPid(c);
  const list = Object.keys(c.players).map(id => c.players[id]).filter(p => !p.hidden && p.n < 100 && p.id !== up && !SNK_IDLES.some(k => p.e.classList.contains(k)));
  if (!list.length) return;
  const p = list[Math.floor(Math.random() * list.length)];
  const kinds = p.e.classList.contains('is-sat') ? ['yawn', 'watch'] : ['tap', 'yawn', 'watch', 'tap'];
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  if (kind === 'watch') {
    // Eyes on the nearest snake's head.
    let best = null, bd = 1e9;
    c.snakes.forEach(sn => { const d = Math.hypot((sn.hx || 0) - p.x, (sn.hy || 0) - p.y); if (d < bd) { bd = d; best = sn; } });
    const dx = best ? snkClamp((best.hx - p.x) / 60, -1, 1) * 1.6 : 1.6, dy = best ? snkClamp((best.hy - p.y) / 60, -1, 1) * 1.2 : -1;
    p.e.style.setProperty('--snk-lx', dx.toFixed(2) + 'px');
    p.e.style.setProperty('--snk-ly', dy.toFixed(2) + 'px');
  }
  p.e.classList.add('idle-' + kind);
  clearTimeout(p.idleT);
  p.idleT = setTimeout(() => p.e.classList.remove('idle-' + kind), 2300);
}

/** A tween for the board's own life: it gives way at once to a roll or a building (and puts itself back). */
function snkAmb(c, ms, fn, ez) {
  const g = c.gen;
  if (snkStill()) return Promise.resolve(false);
  c.animating++;
  snkKick();
  return new Promise(res => {
    const t0 = performance.now();
    const step = (now) => {
      if (c.gen !== g || c.playing || c.building || !snkView.root || !snkView.root.isConnected) { c.animating = Math.max(0, c.animating - 1); res(false); return; }
      const r = Math.min(1, (now - t0) / ms);
      fn((ez || snkEase)(r), r);
      if (r < 1 && !document.hidden) requestAnimationFrame(step);
      else { c.animating = Math.max(0, c.animating - 1); res(r >= 1); }
    };
    requestAnimationFrame(step);
  });
}

/** Now and then: a snake yawns, stretches or snaps at a passing butterfly; a worker tightens a rung. */
async function snkBoardLife(c) {
  if (!c.snakes.length) return;
  c.life = true;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const kind = pick(['yawn', 'stretch', 'fly', 'fly', 'worker', 'worker']);
  const sn = pick(c.snakes.filter(s => s.mood !== 'sleep') .concat([])) || c.snakes[0];
  const reset = () => { if (c.animatingSnake !== sn) { sn.jaw = 0; sn.lunge = { x: 0, y: 0, s: 1 }; sn.amp = 2.2; if (sn.mood === 'wow') sn.mood = ''; } };
  try {
    if (kind === 'yawn') sn.yawnAt = c.time;
    else if (kind === 'stretch') {
      await snkAmb(c, 1500, (t, r) => { const k = Math.sin(r * Math.PI); sn.amp = 2.2 + 4 * k; sn.lunge = { x: 0, y: -9 * k, s: 1 + 0.12 * k }; sn.jaw = 0.45 * Math.sin(Math.min(1, r * 1.6) * Math.PI); }, snkLin);
      reset();
    } else if (kind === 'fly') await snkButterflySnap(c, sn, reset);
    else await snkWorkerRung(c, pick(c.ladders));
  } catch (e) { /* the board's life never breaks the game */ }
  c.life = false;
}

async function snkButterflySnap(c, sn, reset) {
  const col = Math.random() < 0.5 ? '#ffd0e6' : '#c9f0a0';
  const f = snkEl('g', {}, c.fx);
  f.innerHTML = `<path class="snk-wing" d="M0 0 C-12 -14 -16 2 0 2 Z" fill="${col}" stroke="${SNK_INK}" stroke-width=".7"/><path class="snk-wing r" d="M0 0 C12 -14 16 2 0 2 Z" fill="${col}" stroke="${SNK_INK}" stroke-width=".7"/><path d="M0 -5 V5" stroke="${SNK_INK}" stroke-width="1.8"/>`;
  const hx = sn.hx, hy = sn.hy - 30, from = hx < 300 ? -20 : 620, to = hx < 300 ? hx + 160 : hx - 160;
  let snapped = false;
  const ok = await snkAmb(c, 2600, (t, r) => {
    const x = snkLerp(from, to, t);
    let y = hy + Math.sin(r * Math.PI * 5) * 8;
    if (snapped) y -= (r - 0.55) * 120;
    snkTR(f, x, y, 0.8, Math.sin(r * 30) * 12);
    const near = Math.abs(x - hx) < 70;
    if (near && !snapped) {
      sn.mood = 'wow';
      const k = snkClamp(1 - Math.abs(x - hx) / 70, 0, 1);
      sn.lunge = { x: (x - hx) * 0.3 * k, y: (y - sn.hy) * 0.45 * k, s: 1 + 0.15 * k };
      sn.jaw = k;
      if (Math.abs(x - hx) < 10) { snapped = true; sn.jaw = 0; }
    } else if (snapped) {
      sn.lunge = { x: sn.lunge.x * 0.9, y: sn.lunge.y * 0.9, s: 1 + (sn.lunge.s - 1) * 0.9 };
    }
  }, snkLin);
  f.remove();
  reset();
  return ok;
}

async function snkWorkerRung(c, l) {
  if (!l) return;
  const w = snkEl('g', {}, c.under);
  w.innerHTML = snkWorkerSvg();
  const hm = w.querySelector('.snk-hammer');
  const at = snkLadPt(l, 0.25 + Math.random() * 0.4), side = at.x < 300 ? 1 : -1, off = at.x + 20 * side, far = side > 0 ? 690 : -90;
  const bob = r => -Math.abs(Math.sin(r * Math.PI * 7)) * 3;
  let ok = await snkAmb(c, 1300, (t, r) => snkTR(w, snkLerp(far, off, t), at.y + 12 + bob(r), 0.9, 0), snkEaseOut);
  for (let k = 0; k < 3 && ok; k++) {
    ok = await snkAmb(c, 220, t => hm.setAttribute('transform', `translate(8 1) rotate(${snkLerp(-70, 25, t)})`), snkEaseIn);
    if (ok) { snkSparkle(c, at.x, at.y); l.inner.setAttribute('transform', 'translate(0 1)'); setTimeout(() => l.inner.removeAttribute('transform'), 70); }
  }
  if (ok) ok = await snkAmb(c, 350, () => {}, snkLin);
  await snkAmb(c, 1200, (t, r) => snkTR(w, snkLerp(off, far, t), at.y + 12 + bob(r), 0.9, 0), snkEaseIn);
  w.remove();
}

/** The TV's night: the light turns slowly over a long game (by the rolls played), stars come out on the frame. */
function snkNight(c, rolls) {
  const k = c.ctx && c.ctx.tv ? snkClamp(((rolls || 0) - 30) / 110, 0, 1) : 0;
  if (c.night === k) return;
  c.night = k;
  c.dusk.style.opacity = (k * 0.32).toFixed(3);
  c.stars.style.opacity = snkClamp((k - 0.35) / 0.5, 0, 1).toFixed(2);
}

/** A tap on a piece says whose it is. */
function snkNameBubble(c, p) {
  const names = (c.ctx && c.ctx.names) || {};
  let name = names[p.id] || '';
  if (p.mine && name !== snkT('xo_you')) name += ' · ' + snkT('xo_you');
  if (!name) return;
  if (p.n >= 100) snkBubble(c, p.x + 64, p.y + 40, name, 1500, true);
  else snkBubble(c, p.x, p.y - 22 * (p.k || 1), name, 1500, true);
}

/** The others see it happen: a gasp, a laugh or a clap each (from the event, so the same on every screen). */
function snkReact(c, e, p, kind) {
  if (c.fast || snkStill()) return;
  const rnd = snakesRng((((c.map && c.map.seed) || 1) ^ Math.imul(Number(e.seq) || 1, 2654435761)) >>> 0);
  const w = kind === 's' ? [0.5, 0.9] : [0.25, 0.4];       // snake: mostly a gasp or a laugh; ladder: mostly a clap
  Object.keys(c.players).forEach(id => {
    const o = c.players[id];
    if (o === p || o.hidden) return;
    const r = rnd();
    const cls = r < w[0] ? 'react-gasp' : r < w[1] ? 'react-laugh' : 'react-clap';
    SNK_IDLES.forEach(k => o.e.classList.remove(k));
    o.e.classList.add(cls);
    setTimeout(() => o.e.classList.remove(cls), 1500);
  });
}

/** A burst of fireworks at (x, y). */
function snkBurst(c, x, y, col) {
  if (c.fast || snkStill()) return;
  const n = 14, t0 = performance.now();
  const parts = [];
  for (let i = 0; i < n; i++) parts.push({ a: i / n * Math.PI * 2, e: snkEl('path', { stroke: col, 'stroke-width': 2.6, 'stroke-linecap': 'round' }, c.fx) });
  (function f(now) {
    const k = snkClamp((now - t0) / 700, 0, 1), d = 6 + 34 * snkEaseOut(k);
    parts.forEach(q => {
      const cx = Math.cos(q.a), cy = Math.sin(q.a);
      q.e.setAttribute('d', `M${(x + cx * d * 0.6).toFixed(1)} ${(y + cy * d * 0.6 + k * 10).toFixed(1)} L${(x + cx * d).toFixed(1)} ${(y + cy * d + k * 10).toFixed(1)}`);
      q.e.setAttribute('opacity', (1 - k).toFixed(2));
    });
    if (k < 1 && c.fx.isConnected) requestAnimationFrame(f); else parts.forEach(q => q.e.remove());
  })(t0);
}

/* --- walking past a snake's head, the drumroll, a 1, the sixes, two on one square ------------------- */

/** A hop onto a square whose snake's head is walked past: a duck under it (a snap above him now and then), or a jump over it. */
async function snkPassHead(c, g, p, sn, v, from, to) {
  const ms = SNAKES_HOP_MS - 10 + (SNAKES_PASS_MS[v] || 400);
  const k0 = p.k || 1;
  if (v === 'jump') {
    // The snake lowers its head into his path; he jumps over it.
    const dx = to.x - sn.hx, dy = to.y - 2 - sn.hy;
    await snkTween(c, g, ms * 0.4, t => { sn.lunge = { x: dx * 0.45 * t, y: dy * 0.7 * t, s: 1 }; snkSetP(p, snkLerp(from.x, (from.x + to.x) / 2, t * 0.3), from.y); }, snkEaseOut);
    if (!snkAlive(c, g)) return false;
    snkFace(p, 'up');
    snkBubble(c, from.x, from.y - 26, snkT('snk_b_hup'), 600);
    snkSound(c, 'snkBoing', p.mine);
    const x1 = p.x;
    const ok = await snkTween(c, g, ms * 0.6, t => {
      snkSetP(p, snkLerp(x1, to.x, t), snkLerp(from.y, to.y, t) - Math.sin(t * Math.PI) * 40, 1, t * 360 * (to.x >= from.x ? 1 : -1));
      sn.lunge = { x: dx * 0.45 * (1 - t), y: dy * 0.7 * (1 - t), s: 1 };
    }, snkLin);
    sn.lunge = { x: 0, y: 0, s: 1 };
    snkFace(p, '');
    return ok;
  }
  // A plain duck is quick and small: no new face, just down and under.
  if (v === 'snap') snkFace(p, 'wide sweat');
  let flinched = false;
  const ok = await snkTween(c, g, ms, (t, r) => {
    const x = snkLerp(from.x, to.x, t), y = snkLerp(from.y, to.y, t) - Math.abs(Math.sin(r * Math.PI * 2)) * 1.5;
    // Ducked low and on tiptoe (anchored at the feet), the snake's eyes on him.
    const sy = 0.86, sx = 1.04;
    p.x = x; p.y = y;
    p.e.setAttribute('transform', `translate(${x.toFixed(1)} ${(y + 18 * k0 * (1 - sy)).toFixed(1)}) rotate(${(Math.sin(r * Math.PI * 2) * 2.5).toFixed(1)}) scale(${(k0 * sx).toFixed(3)} ${(k0 * sy).toFixed(3)})`);
    if (v === 'snap') {
      const k = snkClamp((r - 0.3) / 0.35, 0, 1), b = Math.sin(k * Math.PI);
      sn.jaw = b; sn.mood = 'wow';
      sn.lunge = { x: (x - sn.hx) * 0.55 * b, y: (y - 30 - sn.hy) * 0.65 * b, s: 1 + 0.15 * b };
      if (r > 0.48 && !flinched) { flinched = true; snkFace(p, 'wide gasp sweat'); snkSound(c, 'snkHiss', p.mine); }
    }
  }, snkLin);
  sn.jaw = 0; sn.lunge = { x: 0, y: 0, s: 1 }; if (sn.mood === 'wow') sn.mood = '';
  snkFace(p, '');
  return ok;
}

/** From 95: a drumroll, the snake nearest 100 licks its lips, the cup shines. */
async function snkTense(c, g, p) {
  const top = snakesCellXY(100);
  let sn = null, bd = 1e9;
  c.snakes.forEach(s => { const q = snakesCellXY(s.h), d = Math.hypot(q.x - top.x, q.y - top.y); if (d < bd) { bd = d; sn = s; } });
  snkSound(c, 'snkDrum', p.mine);
  snkFace(p, 'wide sweat');
  snkBubble(c, p.x, p.y - 24, snkT('snk_b_tense'), 800);
  if (sn) { sn.mood = 'lick'; snkBubble(c, sn.hx, sn.hy - 16, snkT('snk_b_yum'), 800); }
  c.svg.classList.add('is-drum');
  const x0 = p.x, y0 = p.y;
  let last = 0;
  await snkTween(c, g, SNAKES_TENSE_MS - 100, (t, r) => {
    snkSetP(p, x0 + Math.sin(r * Math.PI * 18) * 1.3, y0);
    if (sn) sn.jaw = 0.2 + 0.15 * Math.abs(Math.sin(r * Math.PI * 4));
    if (r - last > 0.2) { last = r; snkSparkle(c, top.x + (Math.random() - 0.5) * 30, top.y - 10); }
  }, snkLin);
  c.svg.classList.remove('is-drum');
  if (sn) { sn.mood = ''; sn.jaw = 0; }
  snkSetP(p, x0, y0);
  snkFace(p, '');
}

/** A 1: «بس كده؟», one sad little step. */
async function snkOne(c, g, p) {
  snkFace(p, 'sad fwd');
  snkBubble(c, p.x, p.y - 24, snkT('snk_b_one'), 900);
  const x0 = p.x, y0 = p.y;
  await snkTween(c, g, SNAKES_ONE_MS - 100, (t, r) => snkSetP(p, x0, y0 + Math.sin(r * Math.PI) * 2, 1, Math.sin(r * Math.PI * 2) * 5), snkLin);
  snkFace(p, '');
}

/** The sixes build up: a cheer, a bigger cheer, fireworks on the third. */
async function snkSixes(c, g, p, n) {
  const k = Math.min(3, n || 1), x0 = p.x, y0 = p.y;
  snkSound(c, 'snkSix', p.mine);
  if (k === 1) {
    snkFace(p, 'up');
    snkBubble(c, x0, y0 - 24, snkT('snk_b_six'), 800);
    await snkTween(c, g, SNAKES_SIXES_MS[0] - 300, (t, r) => snkSetP(p, x0, y0 - Math.sin(r * Math.PI) * 12), snkLin);
  } else if (k === 2) {
    snkFace(p, 'up grin');
    snkBubble(c, x0, y0 - 26, snkT('snk_b_six2'), 1000);
    for (let i = 0; i < 6; i++) snkSparkle(c, x0 + (i - 2.5) * 8, y0 - 10);
    await snkTween(c, g, SNAKES_SIXES_MS[1] - 300, (t, r) => snkSetP(p, x0, y0 - Math.sin(r * Math.PI) * 24, 1, t * 360), snkLin);
  } else {
    snkFace(p, 'up grin');
    snkBubble(c, x0, y0 - 26, snkT('snk_b_six3'), 1500);
    const cols = ['#ffd23f', '#ff6fb1', '#35b6e6', '#7cc243'];
    const spots = [[-50, -60], [45, -75], [0, -95], [-20, -40]];
    let fired = 0;
    await snkTween(c, g, SNAKES_SIXES_MS[2] - 300, (t, r) => {
      snkSetP(p, x0, y0 - Math.abs(Math.sin(r * Math.PI * 4)) * 14, 1, Math.sin(r * Math.PI * 4) * 8);
      while (fired < spots.length && r > fired * 0.22) {
        const s = spots[fired++];
        snkBurst(c, snkClamp(x0 + s[0], 30, 570), Math.max(20, y0 + s[1]), cols[fired % cols.length]);
        snkSound(c, 'snkPop', p.mine);
      }
    }, snkLin);
  }
  snkSetP(p, x0, y0);
  snkFace(p, '');
}

/** Two on one square: a high five, a bump, or a little dance together. */
async function snkMeet(c, g, p, m) {
  const o = c.players[m.with];
  if (!o || o.hidden) return;
  snkSettleAll(c);
  snkCalm(o);
  const a = { x: p.x, y: p.y }, b = { x: o.x, y: o.y }, dir = b.x >= a.x ? 1 : -1;
  const both = (fn) => { fn(p, a, 1); fn(o, b, -1); };
  const ms = SNAKES_MEET_MS - 150;
  if (m.v === 'five') {
    both((q) => snkFace(q, 'up grin'));
    snkBubble(c, (a.x + b.x) / 2, a.y - 30, snkT('snk_b_five'), 900);
    await snkTween(c, g, ms * 0.45, t => both((q, s0, sg) => snkSetP(q, s0.x + dir * sg * 5 * t, s0.y - 6 * t, 1, dir * sg * 8 * t)), snkEaseOut);
    snkSound(c, 'snkClap', p.mine);
    for (let i = 0; i < 4; i++) snkSparkle(c, (a.x + b.x) / 2, a.y - 28);
    await snkTween(c, g, ms * 0.55, t => both((q, s0, sg) => snkSetP(q, s0.x + dir * sg * 5 * (1 - t), s0.y - 6 * (1 - t), 1, dir * sg * 8 * (1 - t))), snkEaseIn);
  } else if (m.v === 'bump') {
    both((q) => snkFace(q, 'grin'));
    snkBubble(c, (a.x + b.x) / 2, a.y - 30, snkT('snk_b_bump'), 900);
    await snkTween(c, g, ms * 0.4, t => both((q, s0, sg) => snkSetP(q, s0.x + dir * sg * 7 * t, s0.y, 1, -dir * sg * 14 * t)), snkEaseIn);
    snkSound(c, 'snkBoing', p.mine);
    snkPuff(c, (a.x + b.x) / 2, a.y + 6, 3, '#ffffff', 12);
    await snkTween(c, g, ms * 0.6, (t, r) => both((q, s0, sg) => snkSetP(q, s0.x + dir * sg * 7 * (1 - t), s0.y - Math.sin(r * Math.PI) * 8, 1, -dir * sg * 14 * (1 - t))), snkEaseOut);
  } else {
    both((q) => snkFace(q, 'up grin'));
    snkBubble(c, (a.x + b.x) / 2, a.y - 30, snkT('snk_b_dance'), 1000);
    await snkTween(c, g, ms, (t, r) => both((q, s0) => snkSetP(q, s0.x + Math.sin(r * Math.PI * 4) * 5, s0.y - Math.abs(Math.sin(r * Math.PI * 4)) * 7, 1, Math.sin(r * Math.PI * 4) * 12)), snkLin);
  }
  both((q, s0) => { snkSetP(q, s0.x, s0.y); snkFace(q, ''); });
}

/* --- a snake's tail square: one of four (the server's pick) ------------------------------------------ */

async function snkTickle(c, g, p, sn) {
  snkFace(p, 'grin');
  snkBubble(c, p.x, p.y - 24, snkT('snk_b_tickle'), 1000);
  snkSound(c, 'snkGiggle', p.mine);
  const x0 = p.x, y0 = p.y;
  await snkTween(c, g, SNAKES_TAIL_MS.tickle - 150, (t, r) => {
    sn.tailFlick = 0.35 * Math.sin(r * Math.PI * 12);
    sn.jaw = 0.35 * Math.sin(Math.min(1, r * 1.3) * Math.PI);
    snkSetP(p, x0 + Math.sin(r * Math.PI * 14) * 2, y0 - Math.abs(Math.sin(r * Math.PI * 7)) * 4, 1, Math.sin(r * Math.PI * 12) * 10);
  }, snkLin);
  sn.tailFlick = 0; sn.jaw = 0;
  snkSetP(p, x0, y0);
  snkFace(p, '');
}

async function snkTrip(c, g, p, sn) {
  const x0 = p.x, y0 = p.y, k0 = p.k || 1;
  await snkTween(c, g, 200, (t, r) => { sn.tailFlick = Math.sin(r * Math.PI) * 1.1; }, snkLin);
  snkFace(p, 'gasp');
  snkBubble(c, x0, y0 - 24, snkT('snk_b_trip'), 1000);
  snkSound(c, 'snkBoing', p.mine);
  // Falls flat on his face (about his feet), lies there, gets up and dusts himself off.
  const fall = (a) => p.e.setAttribute('transform', `translate(${x0} ${y0 + 18 * k0}) rotate(${a.toFixed(1)}) translate(0 ${-18 * k0}) scale(${k0})`);
  await snkTween(c, g, 260, t => { sn.tailFlick = 0; fall(-88 * t); }, snkEaseIn);
  snkPuff(c, x0 - 16, y0 + 14, 4, '#e8d8b0', 14);
  await snkWait(c, g, 250);
  snkFace(p, 'sad');
  await snkTween(c, g, 260, t => fall(-88 * (1 - t)), snkEaseOut);
  snkFace(p, 'fwd');
  await snkTween(c, g, 220, (t, r) => { snkSetP(p, x0 + Math.sin(r * Math.PI * 8) * 1.5, y0); if (r > 0.3 && r < 0.36) snkPuff(c, x0, y0 + 4, 2, '#e8d8b0', 8); }, snkLin);
  snkSetP(p, x0, y0);
  snkFace(p, '');
}

async function snkTailPush(c, g, p, sn) {
  const x0 = p.x, y0 = p.y, back = snakesCellXY(Math.max(1, p.n - 1));
  const bx = snkLerp(x0, back.x, 0.75), by = back.y + 12;
  await snkTween(c, g, 200, (t, r) => { sn.tailFlick = -Math.sin(r * Math.PI) * 1.2; }, snkLin);
  snkFace(p, 'gasp');
  snkBubble(c, x0, y0 - 24, snkT('snk_b_push'), 800);
  snkSound(c, 'snkBoing', p.mine);
  await snkTween(c, g, 360, (t, r) => { sn.tailFlick = 0; snkSetP(p, snkLerp(x0, bx, t), snkLerp(y0, by, t) - Math.sin(r * Math.PI) * 10, 1, -t * 20); }, snkEaseOut);
  snkFace(p, 'sad');
  snkBubble(c, p.x, p.y - 24, snkT('snk_b_stomp'), 800);
  // Stomps back to his own square: four heavy steps.
  await snkTween(c, g, SNAKES_TAIL_MS.push - 700, (t, r) => {
    const st = Math.abs(Math.sin(r * Math.PI * 4));
    p.x = snkLerp(bx, x0, t); p.y = snkLerp(by, y0, t);
    p.e.setAttribute('transform', `translate(${p.x.toFixed(1)} ${(p.y - st * 5).toFixed(1)}) scale(${((p.k || 1) * (1 + (1 - st) * 0.08)).toFixed(3)} ${((p.k || 1) * (1 - (1 - st) * 0.1)).toFixed(3)})`);
  }, snkLin);
  snkSetP(p, x0, y0);
  snkFace(p, '');
}

async function snkTailSeat(c, g, p, sn) {
  const x0 = p.x, y0 = p.y;
  const coil = snkEl('g', {}, c.under);
  const d = 'M-13 0 a13 5.5 0 1 0 26 0 a13 5.5 0 1 0 -26 0 M-8.5 -5 a8.5 3.8 0 1 0 17 0 a8.5 3.8 0 1 0 -17 0';
  snkEl('path', { d: d, fill: 'none', stroke: SNK_INK, 'stroke-width': 8 }, coil);
  snkEl('path', { d: d, fill: 'none', stroke: sn.col, 'stroke-width': 5.4 }, coil);
  const cy = y0 + 13;
  await snkTween(c, g, 260, (t, r) => { sn.tailFlick = Math.sin(r * Math.PI) * 0.6; snkTR(coil, x0, cy, snkBackOut(t), 0); }, snkLin);
  sn.tailFlick = 0;
  snkFace(p, 'grin sit');
  snkBubble(c, x0, y0 - 28, snkT('snk_b_seat'), 900);
  await snkTween(c, g, 220, t => snkSetP(p, x0, y0 - 9 * t), snkEaseOut);
  await snkTween(c, g, 400, (t, r) => snkSetP(p, x0, y0 - 9, 1, Math.sin(r * Math.PI * 2) * 7), snkLin);
  snkFace(p, 'up');
  await snkTween(c, g, 260, (t, r) => snkSetP(p, x0, y0 - 9 * (1 - t) - Math.sin(r * Math.PI) * 14), snkLin);
  await snkTween(c, g, 140, t => snkTR(coil, x0, cy, 1 - t, 0), snkEaseIn);
  coil.remove();
  snkSetP(p, x0, y0);
  snkFace(p, '');
}

const SNK_TAIL_ANIM = { tickle: snkTickle, trip: snkTrip, push: snkTailPush, seat: snkTailSeat };

/* --- the sneak: one square beside a ladder's foot ------------------------------------------------- */

/** His own square marked for a moment (a ring of his colour round its edge, never over its number). */
function snkMarkSquare(c, n, col, ms) {
  if (c.fast || snkStill() || !(n > 0 && n < 100)) return;
  const q = snakesCellXY(n);
  const e = snkEl('rect', { x: q.x - SNK_C / 2 + 3, y: q.y - SNK_C / 2 + 3, width: SNK_C - 6, height: SNK_C - 6, rx: 8, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, c.under);
  const t0 = performance.now();
  (function f(now) {
    const k = snkClamp((now - t0) / ms, 0, 1);
    e.setAttribute('opacity', (Math.min(1, k * 6, (1 - k) * 4) * (0.75 + 0.25 * Math.sin(k * Math.PI * 4))).toFixed(2));
    if (k < 1 && e.isConnected) requestAnimationFrame(f); else e.remove();
  })(t0);
}

/*
 * The sneak (the owner's review, 29 Sep 2026): he lands on his own square and stands there a clear
 * beat (it glows round its edge: this is where he is), looks round, tiptoes to the ladder's foot and
 * starts up it fast; the snake nearest to him crawls the whole way over along the board (snkCrawlAt),
 * catches him - a push, or an eat and a spit - and he is back on his own square while it crawls home
 * into its very own shape. Inside SNAKES_SNEAK_MS (push 3.5 s, eat 3.8 s) with about 0.15 s to spare.
 */
async function snkSneak(c, g, p, e) {
  const l = c.ladders.find(x => x.f === e.sneak.f), sn = c.snakes.find(x => x.h === e.sneak.h);
  if (!l || !sn) return;
  p.n = e.walk;
  const home = snkSpot(c, p), foot = snkLadPt(l, 0), q = snkLadPt(l, 0.3);
  p.k = home.k;
  snkSetP(p, home.x, home.y);
  const done = () => {
    sn.crawl = null; sn.amp = 2.2; sn.mood = ''; sn.jaw = 0; sn.bulge = null; sn.lunge = { x: 0, y: 0, s: 1 };
    c.animatingSnake = null;
  };
  // 1. He stands on his own square: everyone sees where he is (0.7 s).
  snkMarkSquare(c, e.walk, p.col, 1150);
  await snkWait(c, g, 700);
  if (!snkAlive(c, g)) return done();
  // 2. Looks round: left, then right (0.5 s).
  snkFace(p, 'wide');
  const eyes = p.e.querySelector('.snk-eW');
  await snkTween(c, g, 500, (t, r) => {
    const lk = Math.sin(r * Math.PI * 2);
    if (eyes) eyes.setAttribute('transform', `translate(${(-lk * 1.6).toFixed(2)} 0)`);
    snkSetP(p, home.x - lk * 2, home.y, 1, -lk * 7);
  }, snkLin);
  if (eyes) eyes.removeAttribute('transform');
  if (!snkAlive(c, g)) return done();
  // 3. The snake nearest to him sets off now, crawling along the board to where he will be.
  // Its way is planned so its body never crosses itself: a wide arc when he is behind its head (snkCrawlPlan).
  const plan = snkCrawlPlan(sn.pts, q, sn.W);
  const target = plan.target;
  sn.crawl = { way: plan.way, d: 0 };
  const D = plan.D;
  const crawlMs = snkClamp(420 + D * 1.6, 600, 950);
  c.animatingSnake = sn;
  sn.mood = 'wow';
  snkSound(c, 'snkHiss', p.mine);
  const out = snkTween(c, g, crawlMs, t => { sn.crawl.d = D * t; }, snkEase);
  // ... while he tiptoes to the ladder's foot and starts up it fast (0.4 + 0.35 s).
  snkFace(p, 'grin');
  snkBubble(c, home.x, home.y - 24, snkT('snk_b_shh'), 800);
  await snkTween(c, g, 400, (t, r) => snkSetP(p, snkLerp(home.x, foot.x, t), snkLerp(home.y, foot.y, t) - Math.abs(Math.sin(r * Math.PI * 4)) * 3, 1, Math.sin(r * Math.PI * 4) * 7), snkLin);
  if (!snkAlive(c, g)) return done();
  snkFace(p, 'up');
  await snkTween(c, g, 350, (t, r) => { const u = snkLadPt(l, 0.3 * t); snkSetP(p, u.x, u.y, 1, Math.sin(r * Math.PI * 4) * 12); }, snkEaseOut);
  await out;
  if (!snkAlive(c, g)) return done();
  // 4. Caught.
  snkFace(p, 'wide sweat');
  snkBubble(c, target.x, target.y - 18, snkT('snk_b_notyou'), 800);
  const back = (ms) => snkTween(c, g, ms, t => { sn.crawl.d = D * (1 - t); }, snkEase);
  p.n = e.walk;
  if (e.sneak.v === 'push') {
    await snkTween(c, g, 200, (t, r) => { const k = Math.sin(r * Math.PI); sn.jaw = 0.6 * k; sn.lunge = { x: (p.x - sn.hx) * 0.4 * k, y: (p.y - sn.hy) * 0.4 * k, s: 1 + 0.15 * k }; }, snkLin);
    sn.jaw = 0; sn.lunge = { x: 0, y: 0, s: 1 };
    if (!snkAlive(c, g)) return done();
    snkFace(p, 'gasp up');
    snkBubble(c, p.x, p.y - 24, snkT('snk_b_ah'), 800);
    snkSound(c, 'snkBoing', p.mine);
    // Knocked back down onto his own square, while the snake crawls home (0.9 s).
    const x1 = p.x, y1 = p.y;
    sn.mood = '';
    await Promise.all([
      snkTween(c, g, 450, t => snkSetP(p, snkLerp(x1, home.x, t), snkLerp(y1, home.y, t) - Math.sin(t * Math.PI) * 30, 1, t * 300), snkLin)
        .then(() => { if (snkAlive(c, g)) { snkSettleAll(c); snkFace(p, 'dizzy'); } }),
      back(900)
    ]);
  } else {
    await snkTween(c, g, 250, t => { sn.jaw = t; sn.lunge = { x: (q.x - sn.hx) * 0.3 * t, y: (q.y - sn.hy) * 0.3 * t, s: 1 + 0.2 * t }; snkSetP(p, snkLerp(q.x, sn.hx + sn.lunge.x, t), snkLerp(q.y, sn.hy + sn.lunge.y + 8, t), 1 - t * 0.9, t * 140); }, snkEaseIn);
    p.e.setAttribute('opacity', 0); p.hidden = true;
    snkSound(c, 'snkGulp', p.mine);
    snkBubble(c, sn.hx, sn.hy - 14, snkT('snk_b_ham'), 700);
    // A chew: the bulge goes a little way down, then back up.
    await snkTween(c, g, 300, (t, r) => { sn.jaw = 1 - t; sn.lunge = { x: sn.lunge.x * (1 - t), y: sn.lunge.y * (1 - t), s: 1 + 0.2 * (1 - t) }; sn.bulge = 14 + Math.sin(r * Math.PI) * 40; }, snkLin);
    sn.bulge = null; sn.jaw = 0; sn.lunge = { x: 0, y: 0, s: 1 };
    if (!snkAlive(c, g)) { p.hidden = false; p.e.setAttribute('opacity', 1); return done(); }
    // Spat back onto his own square, and the snake crawls home (0.9 s).
    p.hidden = false; p.e.setAttribute('opacity', 1);
    const x1 = sn.hx, y1 = sn.hy;
    snkBubble(c, x1, y1 - 14, snkT('snk_b_tuf'), 700);
    snkPuff(c, x1, y1, 4);
    snkSound(c, 'snkBoing', p.mine);
    sn.mood = '';
    await Promise.all([
      snkTween(c, g, 400, t => snkSetP(p, snkLerp(x1, home.x, t), snkLerp(y1, home.y, t) - Math.sin(t * Math.PI) * 40, 0.3 + 0.7 * snkBackOut(Math.min(1, t * 1.3)), (1 - t) * -300), snkLin)
        .then(() => { if (snkAlive(c, g)) { snkSettleAll(c); snkFace(p, 'dizzy'); } }),
      back(900)
    ]);
  }
  done();
  if (!snkAlive(c, g)) return;
  await snkWait(c, g, 150);
  snkFace(p, '');
}

/** A player who leaves picks up a little suitcase and walks off the board. */
async function snkLeave(c, g, p) {
  if (!p || p.hidden) return;
  snkCalm(p);
  snkFace(p, 'sad case');
  snkBubble(c, p.x, p.y - 24, snkT('snk_b_bye'), 1000);
  const x0 = p.x, y0 = p.y, to = x0 < 300 ? -60 : 660;
  await snkTween(c, g, SNAKES_LEAVE_MS - 300, (t, r) => snkSetP(p, snkLerp(x0, to, t), y0 - Math.abs(Math.sin(r * Math.PI * 9)) * 3, 1, Math.sin(r * Math.PI * 9) * 5), snkEaseIn);
}

/* --- the map taken apart and built -------------------------------------------------------- */

async function snkCarry(c, g, l, inward, delay) {
  await snkWait(c, g, delay || 0);
  if (!snkAlive(c, g)) return;
  const w = snkEl('g', {}, c.under);
  w.innerHTML = snkWorkerSvg();
  const hm = w.querySelector('.snk-hammer');
  const mx = (l.a.x + l.b.x) / 2, my = (l.a.y + l.b.y) / 2, far = l.side * 720;
  const bob = r => -Math.abs(Math.sin(r * Math.PI * 8)) * 3;
  if (inward) {
    await snkTween(c, g, 950, (t, r) => { const dx = snkLerp(far, 0, t); l.g.setAttribute('transform', `translate(${dx} ${-10 + bob(r)})`); snkTR(w, mx + dx, my + 18 + bob(r), 1, 0); }, snkEaseOut);
    if (!snkAlive(c, g)) { w.remove(); return; }
    l.g.removeAttribute('transform');
    const fx = l.a.x + 18 * l.side, fy = l.a.y + 10;
    await snkTween(c, g, 220, (t, r) => snkTR(w, snkLerp(mx, fx, t), snkLerp(my + 18, fy, t) + bob(r), 1, 0), snkLin);
    for (let k = 0; k < 2; k++) {
      await snkTween(c, g, 180, t => hm.setAttribute('transform', `translate(8 1) rotate(${snkLerp(-70, 25, t)})`), snkEaseIn);
      l.g.setAttribute('transform', 'translate(0 2)');
      snkSound(c, 'snkKnock', false);
      snkPuff(c, l.a.x, l.a.y + 14, 2, '#e8d8b0', 10);
      await snkWait(c, g, 60);
      l.g.removeAttribute('transform');
    }
    await snkTween(c, g, 600, (t, r) => snkTR(w, snkLerp(fx, fx + l.side * 700, t), fy + bob(r), 1, 0), snkEaseIn);
    w.remove();
  } else {
    await snkTween(c, g, 450, (t, r) => snkTR(w, snkLerp(mx + far * 0.6, mx, t), my + 18 + bob(r), 1, 0), snkEaseOut);
    if (!snkAlive(c, g)) { w.remove(); return; }
    await snkTween(c, g, 750, (t, r) => { const dx = snkLerp(0, far, t); l.g.setAttribute('transform', `translate(${dx} ${-10 + bob(r)})`); snkTR(w, mx + dx, my + 18 + bob(r), 1, 0); }, snkEaseIn);
    w.remove();
  }
}

function snkTileK(tl, k) {
  const tr = `translate(${tl.cx} ${tl.cy}) scale(${Math.max(0.001, k).toFixed(3)}) translate(${-tl.cx} ${-tl.cy})`, op = snkClamp(k * 1.6, 0, 1).toFixed(2);
  [tl.g, tl.num].forEach(e => { e.setAttribute('transform', tr); e.setAttribute('opacity', op); });
}

/** The order the squares arrive in, by the building's variant: a wave from 1, a rain from the top, a spiral in. */
function snkTileOrder(v) {
  if (v === 1) return (i) => 99 - i;
  if (v === 2) return (i) => { const p = snakesCellXY(i + 1); return Math.round(Math.hypot(p.x - 300, p.y - 300) / 4.3); };
  return (i) => i;
}

async function snkTeardown(c, g) {
  Object.keys(c.players).forEach(id => { const p = c.players[id]; if (!p.hidden) snkTween(c, g, 480, t => snkSetP(p, snkLerp(p.x, -40, t * 0.2), p.y - Math.sin(t * Math.PI) * 20, 1 - t, 0), snkEaseIn).then(() => { p.e.setAttribute('opacity', 0); p.hidden = true; }); });
  await snkWait(c, g, 450);
  if (!snkAlive(c, g)) return;
  await Promise.all(c.snakes.map((sn, i) => snkWait(c, g, i * 80).then(() => { sn.dir = -1; sn.amp = 5; return snkTween(c, g, 900, t => { sn.s = snkLerp(0, sn.L, t); }, snkEaseIn); }).then(() => snkTween(c, g, 220, t => { sn.holeK = 1 - t; })))
    .concat(c.ladders.map((l, i) => snkCarry(c, g, l, false, i * 100))));
  if (!snkAlive(c, g)) return;
  await snkTween(c, g, 700, (t, r) => c.tiles.forEach((tl, i) => snkTileK(tl, 1 - snkEaseIn(snkClamp(r * 2.2 - (99 - i) * 0.012, 0, 1)))), snkLin);
}

/** The map built in front of everyone: the squares, the cup, the ladders carried in and hammered, the snakes out of their holes, the pieces walking onto the mat. */
async function snkBuild(c, g, e, m, seats) {
  c.building = true;
  snkKick();
  if (e.teardown && c.built && c.map) await snkTeardown(c, g);
  if (!snkAlive(c, g)) { c.building = false; return; }
  if (!c.map || c.map.seed !== m.seed) snkMountMap(c, m);
  c.built = false;
  const order = snkTileOrder(e.v || 0);
  c.tiles.forEach(tl => snkTileK(tl, 0));
  c.snakes.forEach(sn => { sn.s = sn.L; sn.holeK = 0; sn.dir = 1; sn.amp = 5; sn.bulge = null; sn.jaw = 0; sn.mood = ''; sn.lunge = { x: 0, y: 0, s: 1 }; });
  c.ladders.forEach(l => l.g.setAttribute('transform', `translate(${l.side * 720} 0)`));
  Object.keys(c.players).forEach(id => { const p = c.players[id]; p.n = 0; p.hidden = true; p.e.setAttribute('opacity', 0); snkFace(p, ''); });
  c.trophy.setAttribute('transform', 'scale(0.001)');
  snkSound(c, 'snkBuild', false);
  await snkTween(c, g, 1300, (t, r) => c.tiles.forEach((tl, i) => snkTileK(tl, snkBackOut(snkClamp(r * 2.3 - order(i) * 0.013, 0, 1)))), snkLin);
  if (!snkAlive(c, g)) { c.building = false; return; }
  await snkTween(c, g, 320, t => c.trophy.setAttribute('transform', `scale(${snkBackOut(t).toFixed(3)})`), snkLin);
  c.trophy.removeAttribute('transform');
  await Promise.all(c.ladders.map((l, i) => snkCarry(c, g, l, true, i * 150))
    .concat(c.snakes.map((sn, i) => snkWait(c, g, 250 + i * 170).then(() => snkTween(c, g, 240, t => { sn.holeK = snkBackOut(t); }, snkLin)).then(() => snkTween(c, g, 1200, t => { sn.s = snkLerp(sn.L, 0, t); }, snkEaseOut)).then(() => { sn.amp = 2.2; sn.s = 0; sn.holeK = 1; }))));
  if (!snkAlive(c, g)) { c.building = false; return; }
  const ids = (seats || []).filter(id => c.players[id]);
  for (let i = 0; i < ids.length; i++) {
    const p = c.players[ids[i]];
    p.hidden = false; p.e.setAttribute('opacity', 1); p.n = 0;
    const s = snkSpot(c, p, 0);
    p.k = s.k;
    snkTween(c, g, 520, (t, r) => snkSetP(p, snkLerp(-40, s.x, t), s.y - Math.abs(Math.sin(r * Math.PI * 3)) * 14, 1, 0), snkLin);
    await snkWait(c, g, 110);
  }
  await snkWait(c, g, 520);
  c.building = false;
  c.fast = false;
  if (!snkAlive(c, g)) return;
  c.tiles.forEach(tl => [tl.g, tl.num].forEach(el => { el.removeAttribute('transform'); el.setAttribute('opacity', 1); }));
  snkSettleAll(c);
  c.built = true;
}

/* --- the players on the board --------------------------------------------------------------- */

/** The pieces for these seats and colours: kept when they are the same, made for newcomers, taken off for leavers. */
function snkSyncPlayers(c, g, me, keep) {
  const want = g.seats || [];
  Object.keys(c.players).forEach(id => {
    // A leaver whose suitcase walk is still to play stays until it has played (snkLeave).
    if (want.indexOf(id) === -1 && !(keep && keep[id])) { c.players[id].e.remove(); delete c.players[id]; }
  });
  want.forEach((id, i) => {
    const col = SNK_HEX[g.colors[id]] || '#888';
    let p = c.players[id];
    if (p && p.col !== col) { p.e.remove(); p = null; }
    if (!p) {
      const e = snkEl('g', { class: 'snk-piece' }, c.piecesL);
      e.innerHTML = snkPersonSvg(col);
      p = c.players[id] = { e: e, id: id, col: col, n: 0, x: 0, y: 0, k: 1, hidden: false };
    }
    p.order = i;
    p.mine = !!me && id === me;
    p.e.classList.toggle('is-mine', p.mine);
  });
  // Mine is drawn last, so it stands in front.
  if (me && c.players[me]) c.piecesL.appendChild(c.players[me].e);
}

/** The board set where the game is, with nothing to play. */
function snkSettleTo(c, g) {
  // Nothing is played: a leaver's piece simply goes.
  Object.keys(c.players).forEach(id => { if ((g.seats || []).indexOf(id) === -1) { c.players[id].e.remove(); delete c.players[id]; } });
  c.gen++;
  c.queue = [];
  c.playing = false;
  c.fast = false;
  c.building = false;
  c.animating = 0;
  c.fx.innerHTML = ''; c.under.innerHTML = '';
  c.die.setAttribute('opacity', 0);
  if (g.map && (!c.map || c.map.seed !== g.map.seed)) snkMountMap(c, g.map);
  c.snakes.forEach(sn => { sn.s = 0; sn.holeK = 1; sn.dir = 1; sn.amp = 2.2; sn.bulge = null; sn.jaw = 0; sn.mood = ''; sn.lunge = { x: 0, y: 0, s: 1 }; sn.tailFlick = 0; sn.crawl = null; });
  c.crowd = false; c.life = false; c.animatingSnake = null;
  c.svg.classList.remove('is-drum');
  c.ladders.forEach(l => { l.g.removeAttribute('transform'); l.inner.removeAttribute('transform'); l.glowL.setAttribute('opacity', 0); });
  c.tiles.forEach(tl => [tl.g, tl.num].forEach(el => { el.removeAttribute('transform'); el.setAttribute('opacity', 1); }));
  c.trophy.removeAttribute('transform');
  Object.keys(c.players).forEach(id => { const p = c.players[id]; p.n = (g.pos || {})[id] || 0; p.hidden = false; p.dancing = false; p.e.setAttribute('opacity', 1); snkFace(p, ''); snkCalm(p); });
  snkSettleAll(c);
  c.built = true;
  c.busyUntil = 0;
  snkKick();
}

/* --- playing the events --------------------------------------------------------------------- */

/** How long this screen will be busy playing the events it was given (for "wait before rolling"). */
function snkEventMs(e) {
  if (e.type === 'build') return e.ms || SNAKES_BUILD_MS;
  if (e.type === 'roll') return e.ms || snakesRollMs(e);
  if (e.type === 'left') return e.ms || 0;
  return 0;
}

/** One roll: the die, the walk (bouncing off 100), the snake or ladder, a near miss, a six, a finish. */
async function snkPlayRoll(c, g, e) {
  const p = c.players[e.pid];
  if (!p) return;
  p.hidden = false;
  p.e.setAttribute('opacity', 1);
  p.n = e.from;
  snkCalm(p);
  snkSettleAll(c);
  // The second round: from 95 the drumroll first; the heads walked past on the way; a 1.
  if (e.tense && !await snkTense(c, g, p).then(() => snkAlive(c, g))) return;
  if (!await snkRollDie(c, g, p, e.n)) return;
  const passQ = (e.pass || []).slice();
  if (e.over) { if (!await snkBounceBack(c, g, p, e.walk, passQ)) return; }
  else if (!await snkHopTo(c, g, p, e.walk, passQ)) return;
  if (e.n === 1 && !e.jump && !e.over && !e.place) { await snkOne(c, g, p); if (!snkAlive(c, g)) return; }
  if (e.jump) snkReact(c, e, p, e.jump.k);
  if (e.jump && e.jump.k === 's') {
    const sn = c.snakes.find(s => s.h === e.walk);
    const fn = SNK_SNAKE_ANIM[e.jump.v] || snkSlide;
    if (sn) {
      await snkWait(c, g, 150);
      c.animatingSnake = sn;
      await fn(c, g, p, sn);
      c.animatingSnake = null;
      if (sn) { sn.jaw = 0; sn.mood = ''; sn.lunge = { x: 0, y: 0, s: 1 }; sn.bulge = null; sn.tailFlick = 0; sn.amp = 2.2; }
    }
  } else if (e.jump && e.jump.k === 'l') {
    const l = c.ladders.find(x => x.f === e.walk);
    const fn = SNK_LADDER_ANIM[e.jump.v] || snkClimb;
    if (l) await fn(c, g, p, l);
    if (!snkAlive(c, g)) return;
    p.n = e.to;
    snkSettleAll(c);
    snkFace(p, '');
    const hx = p.x, hy = p.y;
    await snkTween(c, g, 300, t => snkSetP(p, hx, hy - Math.abs(Math.sin(t * Math.PI * 2)) * 10), snkLin);
  } else if (e.tail) {
    const sn = c.snakes.find(s => s.h === e.tail.h) || c.snakes.find(s => s.t === e.walk);
    const fn = SNK_TAIL_ANIM[e.tail.v] || snkTickle;
    if (sn) { c.animatingSnake = sn; await fn(c, g, p, sn); c.animatingSnake = null; sn.tailFlick = 0; sn.jaw = 0; }
  } else if (e.sneak) {
    await snkSneak(c, g, p, e);
  } else if (e.near === 's') {
    const sn = c.snakes.filter(s => Math.abs(s.h - e.walk) === 1)[0];
    if (sn) await snkNearMiss(c, g, p, sn);
  } else if (e.near === 'l') {
    await snkMissedLadder(c, g, p);
  }
  if (!snkAlive(c, g)) return;
  p.n = e.to;
  snkSettleAll(c);
  if (e.meet) { await snkMeet(c, g, p, e.meet); if (!snkAlive(c, g)) return; }
  if (e.place) await snkWinDance(c, g, p, e.place);
  else if (e.n === 6) await snkSixes(c, g, p, e.sixes || 1);
  p.movedAt = c.time;
}

/** Plays the events queued, one after another; the board ends where the game is. */
async function snkRunQueue(c) {
  if (c.playing) return;
  c.playing = true;
  const g = c.gen;
  while (c.queue.length && snkAlive(c, g)) {
    const item = c.queue.shift();
    const e = item.e;
    c.currentPid = e.type === 'roll' ? e.pid : null;
    if (typeof c.onStep === 'function') { try { c.onStep(); } catch (err) {} }
    try {
      if (e.type === 'build') await snkBuild(c, g, e, item.g.map, item.g.seats);
      else if (e.type === 'roll') await snkPlayRoll(c, g, e);
      else if (e.type === 'left') {
        const p = c.players[e.pid];
        // A player who leaves picks up a little suitcase and walks off the board.
        if (p) { p.leaving = true; await snkLeave(c, g, p); p.e.remove(); }
        delete c.players[e.pid];
        snkSettleAll(c);
      }
    } catch (err) { console.error('snakes animation', err); }
    if (!snkAlive(c, g)) return;
    // Shown: the log may tell it now (and whatever came with it: a finish, the end).
    c.shownSeq = Math.max(c.shownSeq || 0, Number(e.seq) || 0);
  }
  if (!snkAlive(c, g)) return;
  c.playing = false;
  c.currentPid = null;
  c.busyUntil = 0;
  c.fast = false;
  // Anything the queue got wrong is put right: the board where the game is.
  const last = c.lastG;
  if (last) {
    Object.keys(c.players).forEach(id => { const p = c.players[id]; const n = (last.pos || {})[id]; if (typeof n === 'number' && n !== p.n) { p.n = n; } });
    snkSettleAll(c);
  }
  if (typeof c.onIdle === 'function') c.onIdle();
}

/**
 * Gives the board a game. ctx: { key (the game's own key), me, loud, fresh (dealt while this
 * screen watched), onIdle }. New events are played once; a new game seen for the first
 * time plays its building only when `fresh`, otherwise the board is simply set.
 */
function snkFeed(g, ctx) {
  const c = snkEnsure();
  c.ctx = ctx;
  snkNight(c, g.rolls);
  c.onIdle = ctx.onIdle;
  c.onStep = ctx.onStep;
  c.lastG = g;
  const keep = {};
  if (c.key === ctx.key) {
    (g.events || []).forEach(e => { if (e && e.type === 'left' && (Number(e.seq) || 0) > c.lastSeq) keep[e.pid] = 1; });
    c.queue.forEach(it => { if (it.e.type === 'left') keep[it.e.pid] = 1; });
  }
  snkSyncPlayers(c, g, ctx.me, keep);
  const events = g.events || [];
  const maxSeq = events.reduce((m, e) => Math.max(m, Number(e && e.seq) || 0), 0);
  const quiet = document.hidden || snkStill() || !snkView.root || !snkView.root.isConnected;
  if (c.key !== ctx.key) {
    c.key = ctx.key;
    const build = events.find(e => e.type === 'build');
    if (ctx.fresh && build && !quiet) {
      c.gen++;
      c.queue = [];
      c.playing = false;
      c.fast = false;
      c.lastSeq = (Number(build.seq) || 0) - 1;
    } else {
      c.lastSeq = maxSeq;
      c.shownSeq = maxSeq;
      snkSettleTo(c, g);
      return 0;
    }
  }
  const fresh = events.filter(e => e && (Number(e.seq) || 0) > c.lastSeq && (e.type === 'build' || e.type === 'roll' || e.type === 'left'));
  c.lastSeq = Math.max(c.lastSeq, maxSeq);
  if (!fresh.length) {
    if (!c.playing) { if (!c.map && g.map) snkSettleTo(c, g); else snkSettleAllTo(c, g); }
    return Math.max(0, c.busyUntil - Date.now());
  }
  if (quiet || fresh.length > 6) {
    c.shownSeq = maxSeq;
    snkSettleTo(c, g);
    return 0;
  }
  let ms = Math.max(0, c.busyUntil - Date.now());
  fresh.forEach(e => { c.queue.push({ e: e, g: g }); ms += snkEventMs(e); });
  c.busyUntil = Date.now() + ms;
  snkRunQueue(c);
  return ms;
}

/** The pieces put where the game says (between plays), without redrawing the map. */
function snkSettleAllTo(c, g) {
  if (c.playing || c.building) return;
  Object.keys(c.players).forEach(id => { const p = c.players[id]; const n = (g.pos || {})[id]; if (typeof n === 'number') p.n = n; p.hidden = false; p.e.setAttribute('opacity', 1); });
  snkSettleAll(c);
}

const snkBusy = () => !!(snkView.c && (snkView.c.playing || snkView.c.building || snkView.c.busyUntil > Date.now()));

/* --- the frame around the board (a phone, a room's phone, the TV) ----------------------------- */

/** The strip of players: their colour, name, square and place. */
function snkStripHtml(k) {
  const g = k.g;
  const up = g.phase === 'play' && g.turn ? g.turn.pid : null;
  const chips = (g.seats || []).map(pid => {
    const col = g.colors[pid];
    const name = k.names[pid] || '…';
    const place = g.places.indexOf(pid);
    const initial = typeof duelInitial === 'function' ? duelInitial(name) : name.charAt(0);
    const sq = g.pos[pid] || 0;
    const away = k.away && k.away[pid];
    return `<div class="snk-chip ${pid === up ? 'is-turn' : ''} ${place !== -1 ? 'is-done' : ''} ${away ? 'is-away' : ''}" style="--pc:${SNK_HEX[col] || '#888'}" data-snk-chip="${escapeHTML(pid)}">
        <span class="snk-chip__av" aria-hidden="true">${place !== -1 ? (['🥇', '🥈', '🥉'][place] || String(place + 1)) : k.bots && k.bots[pid] ? '🤖' : escapeHTML(initial)}</span>
        <span class="snk-chip__who">
          <span class="snk-chip__name">${escapeHTML(name)}${pid === k.me && name !== snkT('xo_you') ? ` <small>· ${escapeHTML(snkT('xo_you'))}</small>` : ''}</span>
          <span class="snk-chip__sq metric">${sq ? escapeHTML(snkT('snk_on_sq', { n: sq })) : escapeHTML(snkT('snk_on_mat'))}</span>
        </span>
      </div>`;
  }).join('');
  return `<div class="snk-strip">${chips}</div>`;
}

/** One event as a line for the log. */
function snkEventText(k, e) {
  const name = (pid) => k.names[pid] || '…';
  switch (e.type) {
    case 'build': return '🏗️ ' + (k.me && e.first === k.me ? snkT('snk_ev_first_you') : snkT('snk_ev_first', { name: name(e.first) }));
    case 'roll': {
      if (e.jump && e.jump.k === 's') return '🐍 ' + snkT('snk_ev_snake', { name: name(e.pid), from: e.walk, to: e.to });
      if (e.jump && e.jump.k === 'l') return '🪜 ' + snkT('snk_ev_ladder', { name: name(e.pid), from: e.walk, to: e.to });
      if (e.over) return '↩️ ' + snkT('snk_ev_bounce', { name: name(e.pid), n: e.to });
      return '🎲 ' + snkT('snk_ev_roll', { name: name(e.pid), n: e.n, to: e.to });
    }
    case 'finish': return (e.place === 1 ? '🏆 ' : '🏁 ') + snkT('snk_ev_finish', { name: name(e.pid), place: snkPlaceWord(e.place) });
    case 'auto': return '⏱️ ' + snkT(e.why === 'host' ? 'snk_ev_host' : 'snk_ev_clock', { name: name(e.pid) });
    case 'left': return snkT('snk_ev_left', { name: e.name || name(e.pid) });
    default: return '';
  }
}

function snkLogHtml(k) {
  // The log follows the board: while a roll is still playing it isn't told yet.
  const c = snkView.c;
  const seen = c && snkBusy() && typeof c.shownSeq === 'number' ? c.shownSeq : Infinity;
  const lines = (k.g.events || []).filter(e => (Number(e.seq) || 0) <= seen).slice().reverse().map(e => snkEventText(k, e)).filter(Boolean).slice(0, 3);
  return lines.map((l, i) => `<div class="snk-log__line ${i === 0 ? 'is-latest' : ''}">${escapeHTML(l)}</div>`).join('');
}

/** What the bar says: whose turn, what to do. */
function snkBarLines(k) {
  const g = k.g;
  const tn = g.turn || {};
  const name = k.names[tn.pid] || '';
  if (g.phase !== 'play') return [snkT('snk_over'), ''];
  if (tn.pid === k.me) return [snkT('snk_your_turn'), tn.sixes ? snkT('snk_again_six') : snkT('snk_roll_hint')];
  return [snkT('snk_turn_of', { name: name }), k.bots && k.bots[tn.pid] ? snkT('snk_thinking', { name: name }) : ''];
}

function snkBarHtml(k) {
  const g = k.g;
  const tn = g.turn || {};
  const canRoll = g.phase === 'play' && tn.pid === k.me && !k.tv;
  const lines = snkBarLines(k);
  const col = SNK_HEX[g.colors[tn.pid]] || 'transparent';
  return `<div class="snk-bar ${canRoll ? 'is-mine' : ''}" data-snk-bar>
      <span class="snk-bar__dot" style="background:${col}" aria-hidden="true"></span>
      <div class="snk-bar__txt">
        <div class="snk-bar__t1">${escapeHTML(lines[0])}</div>
        <div class="snk-bar__t2">${escapeHTML(lines[1] || '')}</div>
      </div>
      ${k.clock ? `<span class="badge badge--accent metric snk-bar__clock" data-snk-clock></span>` : ''}
      ${canRoll ? `<button type="button" class="btn btn--primary btn--auto snk-bar__roll" data-snk-roll onclick="${k.rollJs}" disabled>🎲 ${escapeHTML(snkT('snk_roll'))}</button>` : ''}
    </div>`;
}

/** The places at the end: a podium of the first three. */
function snkPodiumHtml(k) {
  const g = k.g;
  const places = g.places || [];
  if (!places.length) return '';
  const rise = motionFirst(['snk-podium', k.key, places.join(',')].join('|'));
  const top = places.slice(0, 3);
  const medals = ['🥇', '🥈', '🥉'];
  const atOf = (i) => 150 + (top.length - 1 - i) * 520;
  const winMs = atOf(0) + 620;
  return `<div class="podium${rise ? ' podium--rise" data-reveal-ms="' + winMs : ''}">` + top.map((pid, i) =>
    `<div class="podium__place podium__place--${i + 1} podium__place--rank${i + 1}" style="--at:${atOf(i)}ms">
      <div class="podium__who">
        <span class="podium__medal" aria-hidden="true">${medals[i]}</span>
        <span class="podium__name">${escapeHTML(k.names[pid] || '…')}</span>
        <span class="snk-podium__color" style="background:${SNK_HEX[g.colors[pid]] || '#888'}" aria-hidden="true"></span>
      </div>
      <div class="podium__block"><span class="metric">${i + 1}</span></div>
    </div>`).join('') + '</div>' +
    (places.length > 3 ? `<p class="snk-over__rest">${places.slice(3).map((pid, i) => escapeHTML(snkPlaceWord(i + 4) + ': ' + (k.names[pid] || '…'))).join(' · ')}</p>` : '');
}

/**
 * A whole frame: the board's place, the strip, the bar and the log; at the end, the podium
 * and what comes next. k: { g, me, names, bots, away, key, tv, rollJs, over, host, clock, showOver }.
 */
function snkFrameHtml(k) {
  const g = k.g;
  const over = g.phase === 'gameover' && k.showOver;
  return `<div class="snk ${k.tv ? 'snk--tv' : ''} ${over ? 'is-over' : ''}">
      <div class="snk-layout">
        <div class="snk-layout__board"><div class="snk-host" data-snk-host></div></div>
        <div class="snk-layout__side">
          ${over ? `<div class="card card--accent snk-over">
              <p class="snk-over__title">🏁 ${escapeHTML(snkT('snk_over'))}</p>
              ${snkPodiumHtml(k)}
              ${k.over || ''}
            </div>` : ''}
          ${snkStripHtml(k)}
          ${g.phase === 'play' ? snkBarHtml(k) : ''}
          <div class="snk-log" data-snk-log>${snkLogHtml(k)}</div>
          ${k.host || ''}
          ${k.strip || ''}
        </div>
      </div>
    </div>`;
}

/* --- against the phone ------------------------------------------------------------------------- */

let snkBotTimer = null;

function snkState() {
  if (!appState.snakes) appState.snakes = { opp: 1, color: 'r', g: null, names: {}, bots: {}, gameId: '' };
  const s = appState.snakes;
  if ([1, 2, 3, 4, 5].indexOf(Number(s.opp)) === -1) s.opp = 1;
  if (SNAKES_COLORS.indexOf(s.color) === -1) s.color = 'r';
  return s;
}

function setupSnakes() {
  snkStopBot();
  setView('setup-snakes');
  paintSnakesSetup();
}

function paintSnakesSetup() {
  const s = snkState();
  document.querySelectorAll('#snakes-opp .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === String(s.opp)));
  document.querySelectorAll('#snakes-color .snk-swatch').forEach(el => {
    const on = el.dataset.value === s.color;
    el.classList.toggle('is-active', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const cont = document.getElementById('snakes-continue');
  if (cont) cont.classList.toggle('hidden', !(s.g && s.g.phase === 'play'));
}

function setSnakesOption(key, value) {
  const s = snkState();
  if (key === 'opp') s.opp = Number(value);
  else if (key === 'color' && SNAKES_COLORS.indexOf(value) !== -1) s.color = value;
  haptic('light');
  saveToLocal();
  paintSnakesSetup();
}

/** A new game: you in your colour, the phone's players in the others, a new map built. */
function startSnakes() {
  const s = snkState();
  snkStopBot();
  const again = !!(s.g && appState.currentView === 'play-snakes');
  const ids = ['me'];
  for (let k = 1; k <= s.opp; k++) ids.push('b' + k);
  const pool = (ROOM_BOT_NAMES[appState.lang] || ROOM_BOT_NAMES.ar).slice().sort(() => Math.random() - 0.5);
  const names = { me: snkT('xo_you') };
  const bots = {};
  ids.slice(1).forEach((id, k) => { names[id] = pool[k]; bots[id] = 'easy'; });
  const colors = snakesFillColors(ids, { me: s.color });
  const order = ids.slice().sort(() => Math.random() - 0.5);
  const g = snakesNewGame(order, colors, snakesNewSeed(Math.random), Date.now(), { teardown: again });
  s.g = g;
  s.names = names;
  s.bots = bots;
  s.gameId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  saveToLocal();
  if (appState.currentView !== 'play-snakes') setView('play-snakes');
  paintSnakes({ fresh: true });
  if (typeof scrollToAction === 'function') scrollToAction();
}

function snakesContinue() {
  setView('play-snakes');
  paintSnakes({ still: true });
}

function snkLocalRoll() {
  const s = snkState();
  const g = s.g;
  if (!g || g.phase !== 'play' || !g.turn || g.turn.pid !== 'me' || snkBusy()) return;
  haptic('medium');
  snkHintSync(null, false);
  snakesRoll(g, 'me', snakesDie(), Math.random, Date.now());
  saveToLocal();
  paintSnakes();
}

/** A computer player rolls, a beat after the board has shown the last roll. */
function snkLocalNext() {
  snkStopBot();
  const s = snkState();
  const g = s.g;
  if (!g || g.phase !== 'play' || appState.currentView !== 'play-snakes') return;
  const pid = g.turn && g.turn.pid;
  if (!pid || !s.bots[pid] || snkBusy()) return;
  snkBotTimer = setTimeout(() => {
    snkBotTimer = null;
    const gg = snkState().g;
    if (!gg || gg !== g || gg.phase !== 'play' || gg.turn.pid !== pid || appState.currentView !== 'play-snakes' || snkBusy()) return;
    snakesRoll(gg, pid, snakesDie(), Math.random, Date.now());
    saveToLocal();
    paintSnakes();
  }, SNK_BOT_MS[0] + Math.floor(Math.random() * (SNK_BOT_MS[1] - SNK_BOT_MS[0])));
}

function snkStopBot() {
  if (snkBotTimer) clearTimeout(snkBotTimer);
  snkBotTimer = null;
}

function snkLocalCtx() {
  const s = snkState();
  const over = `<div class="btn-stack">
      <button class="btn btn--primary btn--lg" onclick="startSnakes()">${escapeHTML(snkT('snk_again'))}</button>
      <button class="btn btn--ghost btn--sm" onclick="setupSnakes()">${escapeHTML(snkT('exit'))}</button>
    </div>`;
  return {
    g: s.g, me: 'me', names: Object.assign({}, s.names || {}, { me: snkT('xo_you') }), bots: s.bots || {},
    key: 'local|' + s.gameId, tv: false, rollJs: 'snkLocalRoll()', over: over, loud: true
  };
}

/** The roll button, the bar's words and the log follow the board: set when it goes quiet. */
function snkSyncIdle(root, k) {
  if (!root) return;
  const busy = snkBusy();
  const btn = root.querySelector('[data-snk-roll]');
  const ready = !busy && (!k.readyLocal || Date.now() >= k.readyLocal);
  if (btn) btn.disabled = !ready;
  const bar = root.querySelector('[data-snk-bar]');
  if (bar) bar.classList.toggle('is-ready', !!btn && ready);
  const log = root.querySelector('[data-snk-log]');
  if (log) {
    const html = snkLogHtml(k);
    if (log._snk !== html) { log.innerHTML = html; log._snk = html; }
  }
  root.querySelectorAll('[data-snk-chip]').forEach(el => {
    const pid = el.getAttribute('data-snk-chip');
    const p = snkView.c && snkView.c.players[pid];
    const sq = busy && p ? p.n : (k.g.pos || {})[pid] || 0;
    const sqEl = el.querySelector('.snk-chip__sq');
    const txt = sq ? snkT('snk_on_sq', { n: sq }) : snkT('snk_on_mat');
    if (sqEl && sqEl.textContent !== txt) sqEl.textContent = txt;
  });
  const over = root.querySelector('.snk-over');
  if (over) over.classList.toggle('is-waiting', busy);
  const c = snkView.c;
  const playing = busy && c && c.currentPid;
  const up = playing ? c.currentPid : (k.g.phase === 'play' && k.g.turn ? k.g.turn.pid : null);
  root.querySelectorAll('[data-snk-chip]').forEach(el => el.classList.toggle('is-turn', el.getAttribute('data-snk-chip') === up));
  if (bar) {
    const lines = playing ? [up === k.me ? snkT('snk_your_turn') : snkT('snk_turn_of', { name: k.names[up] || '' }), ''] : snkBarLines(k);
    const t1 = bar.querySelector('.snk-bar__t1'), t2 = bar.querySelector('.snk-bar__t2'), dot = bar.querySelector('.snk-bar__dot');
    if (t1 && t1.textContent !== lines[0]) t1.textContent = lines[0];
    if (t2 && t2.textContent !== (lines[1] || '')) t2.textContent = lines[1] || '';
    if (dot) dot.style.background = SNK_HEX[k.g.colors[up]] || 'transparent';
    // Your roll button waits out of sight while someone else's roll is still being shown.
    if (btn) btn.classList.toggle('hidden', !!playing && up !== k.me);
  }
  snkHintSync(k, !k.tv && !!btn && ready && !playing && k.g.phase === 'play' && !!k.g.turn && k.g.turn.pid === k.me);
}

/*
 * Before your roll (ideas batch): a ring pulses round your piece and the six squares a roll could
 * reach are tinted - red where a snake's head is, green where a ladder's foot is, plain otherwise.
 * Looks only; drawn under the ladders, the snakes and the numbers (nothing covers a number), gone
 * the moment the roll starts. The map is on the phone (g.map).
 */
function snkReachOf(g, pid) {
  const from = (g.pos || {})[pid] || 0;
  const out = [];
  for (let d = 1; d <= 6; d++) {
    let t = from + d;
    if (t > 100) t = 200 - t;
    if (t >= 1 && out.indexOf(t) === -1) out.push(t);
  }
  return out;
}

function snkHintSync(k, on) {
  const c = snkView.c;
  if (!c || !c.svg) return;
  const layer = c.svg.querySelector('.snk-hints');
  const key = on && k ? [k.key, k.g.turnSeq, (k.g.pos || {})[k.me] || 0].join('|') : '';
  if (c.hintKey === key && (!c.hintRing || c.hintRing.isConnected)) return;
  c.hintKey = key;
  if (layer) layer.textContent = '';
  if (c.hintRing) { c.hintRing.remove(); c.hintRing = null; }
  if (!key || !layer) return;
  const m = k.g.map || {};
  const heads = (m.snakes || []).map(x => x.h), feet = (m.ladders || []).map(x => x.f);
  snkReachOf(k.g, k.me).forEach(n => {
    const q = snakesCellXY(n);
    const kind = heads.indexOf(n) !== -1 ? 'snake' : feet.indexOf(n) !== -1 ? 'ladder' : 'plain';
    snkEl('rect', { class: 'snk-hint snk-hint--' + kind, x: q.x - SNK_C / 2 + 2.5, y: q.y - SNK_C / 2 + 2.5, width: SNK_C - 5, height: SNK_C - 5, rx: 7 }, layer);
  });
  const p = c.players[k.me];
  if (p && !p.hidden) {
    const kk = p.k || 1;
    c.hintRing = snkEl('ellipse', { class: 'snk-myring', cx: p.x.toFixed(1), cy: (p.y + 17 * kk).toFixed(1), rx: (19 * kk).toFixed(1), ry: (7 * kk).toFixed(1), stroke: p.col || '#fff' }, c.under);
  }
}

function paintSnakes(opts) {
  const o = opts || {};
  const s = snkState();
  const el = document.getElementById('snakes-stage');
  if (!el || !s.g) return;
  const k = snkLocalCtx();
  k.showOver = s.g.phase === 'gameover';
  el.innerHTML = snkFrameHtml(k);
  const c = snkShowIn(el.querySelector('[data-snk-host]'));
  k.onStep = () => snkSyncIdle(el, k);
  k.onIdle = () => {
    snkSyncIdle(el, k);
    const g = snkState().g;
    if (g && g.phase === 'gameover' && typeof duelOnce === 'function' && duelOnce(['snk-end', s.gameId].join('|'))) {
      const won = g.places[0] === 'me';
      afterReveal(el, () => {
        if (won) { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); }
        else if (typeof duelSound === 'function') duelSound('lose');
      });
    }
    if (g && g.phase === 'play' && g.turn && g.turn.pid === 'me' && typeof duelOnce === 'function' && duelOnce(['snk-turn', s.gameId, g.turnSeq].join('|'))) haptic('medium');
    snkLocalNext();
  };
  if (o.still && c.key === k.key) c.key = '';
  snkFeed(s.g, Object.assign({}, k, { fresh: !!o.fresh }));
  if (!snkBusy()) k.onIdle(); else snkSyncIdle(el, k);
}

/** After a reload: the board as it was, and the phone plays on if it was its turn. */
function restoreSnakes() {
  const s = snkState();
  if (!s.g || !Array.isArray(s.g.seats) || !s.g.pos || !s.g.map) return false;
  paintSnakes({ still: true });
  return true;
}

if (typeof soloRegister === 'function') {
  soloRegister('snakes', {
    setup: 'setup-snakes', play: 'play-snakes',
    paintSetup: paintSnakesSetup, restore: restoreSnakes,
    repaint: () => paintSnakes({ still: true })
  });
}

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    const boardViews = ['play-snakes', 'room-snakes', 'room-tv'];
    if (from === 'play-snakes') snkStopBot();
    if (boardViews.indexOf(from) !== -1 && boardViews.indexOf(to) === -1) snkDrop();
    if (to === 'play-snakes') setTimeout(() => { if (snkState().g && !snkBusy()) snkLocalNext(); }, 0);
  });
}

/* --- the sounds: short and quiet, not on the soundboard ------------------------------------- */
if (typeof FX !== 'undefined') {
  Object.assign(FX, {
    snkStep(at) { fxTone('sine', [[0, 700], [0.04, 540]], [[0, 0], [0.003, 0.06], [0.05, 0.001]], at); },
    snkHiss(at) { fxNoise('highpass', 4200, 0.8, [[0, 0], [0.05, 0.08], [0.45, 0.001]], at); },
    snkGulp(at) {
      fxTone('sine', [[0, 260], [0.12, 120]], [[0, 0], [0.01, 0.3], [0.16, 0.001]], at);
      fxTone('sine', [[0, 200], [0.1, 90]], [[0, 0], [0.01, 0.22], [0.14, 0.001]], at + 0.18);
    },
    snkSlide(at) { fxTone('triangle', [[0, 1100], [0.9, 260]], [[0, 0], [0.03, 0.09], [0.95, 0.001]], at); },
    snkAchoo(at) {
      fxNoise('bandpass', 1400, 0.9, [[0, 0], [0.2, 0.05], [0.3, 0.001]], at);
      fxNoise('bandpass', 900, 0.7, [[0, 0], [0.01, 0.25], [0.35, 0.001]], at + 0.32);
