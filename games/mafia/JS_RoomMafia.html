<script>
// How many have tapped tonight: a count only (an older server sent the list).
function mafiaActedCount(s) { return s.actedN != null ? s.actedN : (s.acted || []).length; }
/* ============================================================================
   مافيا — ON SEPARATE PHONES, AND ON THE TV
   ----------------------------------------------------------------------------
   The app narrates. Each phone holds its role on a card you press to see.
   At night every living phone taps a name, whatever its role, so nobody can
   tell who acted: the Mafia pick who leaves (and see each other's picks), the
   Doctor protects, the Detective checks, everyone else marks a suspect. The
   morning says who left, then the discussion clock, then the vote. Rules and
   everything a phone must not know: mafiaAction in RoomGames.js.

   At night a phone glanced at across the table gives nothing away: every
   living phone shows the same heading, the same list (everyone still in) and
   the same buttons. What the role knows - its task, the Mafia's picks, the
   Lawyer's list, the Detective's answers, the Doctor's last save - is only on
   the back of the hold card. A tap the rules refuse for that role (the Mafia
   on one of their own, a second check) simply does nothing, with no message.
   ========================================================================= */

const MAFIA_OPTS_KEY = 'ashryMafiaOpts';
const MAFIA_ICONS = { mafia: '🕴️', citizen: '🧑', doctor: '🩺', detective: '🔍', lawyer: '💼' };
const mafiaLocal = { clock: null, clockKey: null };

function mafiaOpts() {
  // narrate is off until the owner has heard it on a real phone.
  // outSee: the out watch everything, silent (idea 538, on by default).
  const base = { mode: 'classic', revealRoles: false, narrate: false, outSee: true, discuss: 3, night: 45 };
  try {
    const saved = JSON.parse(localStorage.getItem(MAFIA_OPTS_KEY) || 'null') || {};
    if (saved.mode === 'roles' || saved.mode === 'classic') base.mode = saved.mode;
    if (typeof saved.revealRoles === 'boolean') base.revealRoles = saved.revealRoles;
    if (typeof saved.narrate === 'boolean') base.narrate = saved.narrate;
    if (typeof saved.outSee === 'boolean') base.outSee = saved.outSee;
    if ([2, 3, 5].indexOf(saved.discuss) !== -1) base.discuss = saved.discuss;
    if ([30, 45, 60].indexOf(saved.night) !== -1) base.night = saved.night;
  } catch (e) {}
  return base;
}

function setMafiaOpt(key, value) {
  const o = mafiaOpts();
  o[key] = key === 'mode' ? value : (key === 'revealRoles' || key === 'narrate' || key === 'outSee' ? !!value : Number(value));
  try { localStorage.setItem(MAFIA_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

/** Must match mafiaCount and mafiaRoles in RoomGames.js. */
const mafiaCountFor = (n) => (n <= 6 ? 1 : n <= 9 ? 2 : 3);
function mafiaRoleSummary(n, mode, t) {
  const bits = [`${mafiaCountFor(n)} ${MAFIA_ICONS.mafia} ${t.mafia_role_mafia || ''}`];
  if (mode === 'roles') {
    bits.push(`${MAFIA_ICONS.doctor} ${t.mafia_role_doctor || ''}`, `${MAFIA_ICONS.detective} ${t.mafia_role_detective || ''}`);
    if (n >= 6) bits.push(`${MAFIA_ICONS.lawyer} ${t.mafia_role_lawyer || ''}`);
  }
  return bits.join(' · ');
}

const mafiaRoleName = (role, t) => `${MAFIA_ICONS[role] || ''} ${t['mafia_role_' + role] || ''}`;

function mafiaClockText(endsAt) {
  const left = Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000));
  return `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}

function mafiaTickClock(s) {
  const paint = () => {
    const text = s.endsAt ? mafiaClockText(s.endsAt) : '';
    ['mafia-clock', 'tv-mafia-clock'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = text; });
  };
  paint();
  if (!s.endsAt) { mafiaStopClock(); return; }
  if (mafiaLocal.clockKey === s.endsAt && mafiaLocal.clock && mafiaLocal.clock.isRunning()) return;
  mafiaStopClock();
  mafiaLocal.clockKey = s.endsAt;
  mafiaLocal.clock = createClock({ seconds: Math.max(1, Math.ceil((s.endsAt - roomServerNow()) / 1000)), onTick: paint, onEnd: paint });
}

function mafiaStopClock() {
  if (mafiaLocal.clock) mafiaLocal.clock.stop();
  mafiaLocal.clock = null;
  mafiaLocal.clockKey = null;
}
onRoomClocksReset(mafiaStopClock);

/** «+1 دقيقة» with the clock it was pressed on, read at the tap: the server drops the second
    tap of a double tap (its clock already moved), and a later deliberate tap still adds one. */
function mafiaMoreTime() {
  const s = (Room.state && Room.state.shared) || {};
  roomAct('moreTime', { endsAt: s.endsAt });
}

/** The vote's "nobody" option, said in this phone's language. */
function mafiaVoteState(state) {
  const t = TRANSLATIONS[appState.lang];
  const v = state.shared.vote;
  if (!v) return state;
  const label = (o) => (o.id === 'nobody' ? `🤷 ${t.mafia_nobody || ''}` : o.label);
  const vote = Object.assign({}, v, {
    options: (v.options || []).map(o => Object.assign({}, o, { label: label(o) })),
    results: v.results ? v.results.map(r => Object.assign({}, r, { label: label(r) })) : v.results
  });
  return Object.assign({}, state, { shared: Object.assign({}, state.shared, { vote: vote }) });
}

function mafiaNewsHtml(state, t) {
  const s = state.shared;
  const n = s.news;
  if (!n) return '';
  if (n.kind === 'saved') return `<div class="card mafia-news"><div class="metric metric--md">🩺</div><p class="sheet__subtitle">${escapeHTML(t.mafia_news_saved || '')}</p></div>`;
  if (n.kind === 'quiet') return `<div class="card mafia-news"><div class="metric metric--md">😴</div><p class="sheet__subtitle">${escapeHTML(t.mafia_news_quiet || '')}</p></div>`;
  if (n.kind === 'tie' || n.kind === 'nobody') return `<div class="card mafia-news"><div class="metric metric--md">🤝</div><p class="sheet__subtitle">${escapeHTML(n.kind === 'tie' ? (t.mafia_news_tie || '') : (t.mafia_news_nobody || ''))}</p></div>`;
  const cover = spyRevealParts(['mafia', state.code, s.dealId || '', s.night, s.day, n.kind, n.id].join('|'), n.kind === 'voted' ? t.mafia_reveal_voted : t.mafia_reveal_night);
  return `<div class="card mafia-news ${n.role === 'mafia' ? 'is-mafia' : ''} ${cover.cls}" ${cover.attrs}>${cover.cover}
      <div class="metric metric--md">${n.kind === 'voted' ? '🗳️' : '🌅'}</div>
      <p class="sheet__subtitle">${escapeHTML((n.kind === 'voted' ? (t.mafia_out_voted || '') : (t.mafia_out_night || '')).replace('{name}', n.name || ''))}</p>
      <p class="mafia-news__role">${escapeHTML(t.mafia_was || '')}: ${escapeHTML(mafiaRoleName(n.role, t))}</p>
    </div>`;
}

function mafiaPeopleHtml(state, t) {
  const s = state.shared;
  const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
  return `
    <div class="card card--tight">
      <div class="eyebrow">${escapeHTML(t.mafia_still_in || '')} · <span class="metric">${(s.alive || []).length}</span></div>
      <div class="chip-set">${(s.alive || []).map(id => `<span class="chip chip--plain">${escapeHTML(nameOf(id))}</span>`).join('')}</div>
      ${(s.out || []).length ? `
        <div class="eyebrow" style="margin-top: var(--sp-3)">${escapeHTML(t.mafia_out || '')}</div>
        <div class="chip-set">${s.out.map(o => `<span class="chip chip--plain is-away">${MAFIA_ICONS[o.role] || ''} ${escapeHTML(o.name)}</span>`).join('')}</div>` : ''}
    </div>`;
}

/**
 * The role on a card that shows only while pressed. The back is also where
 * the night's private information lives (mafiaSecretHtml); it is refreshed in
 * place (refreshMafiaSecret), so a teammate changing their pick doesn't turn
 * the card over under a finger.
 */
function mafiaRoleCardHtml(state, t) {
  const you = state.you || {};
  if (!you.role) return '';
  return `
    <div class="hold-card mafia-hold" role="button" tabindex="0">
      <div class="hold-card__front">
        <span class="hold-card__icon" aria-hidden="true">👆</span>
        <span class="hold-card__label">${escapeHTML(t.hold_to_reveal || '')}</span>
        <span class="hold-card__hint">${escapeHTML(t.hold_hint || '')}</span>
      </div>
      <div class="hold-card__back" aria-hidden="true" data-mafia-back>${mafiaSecretHtml(state, t)}</div>
    </div>`;
}

const mafiaNameOf = (state, id) => (state.players.find(p => p.id === id) || {}).name || '…';

/** What only this role knows, for the back of the hold card. At night: its task and its night's information. */
function mafiaSecretHtml(state, t) {
  const s = state.shared || {};
  const you = state.you || {};
  const role = you.role;
  if (!role) return '';
  const night = s.phase === 'night' && (s.alive || []).indexOf(Room.me) !== -1;
  const names = (list) => list.map(escapeHTML).join('، ');
  const team = (you.mafia || []).filter(m => m.id !== Room.me).map(m => m.name);
  const lines = [];
  if (role === 'mafia') lines.push(team.length ? `${escapeHTML(t.mafia_your_team || '')}: ${names(team)}` : escapeHTML(t.mafia_alone || ''));
  if (role === 'lawyer') lines.push(`💼 ${escapeHTML(t.mafia_lawyer_knows || '')}: ${names((you.mafia || []).map(m => m.name))}`);
  if (night && role === 'mafia') {
    const picks = (you.picks || []).filter(p => p.byId !== Room.me);
    if (picks.length) lines.push(picks.map(p => `${escapeHTML(p.by)} ← ${escapeHTML(p.name)}`).join(' · '));
  }
  if (night && role === 'doctor' && you.lastSave) {
    const fallback = appState.lang === 'en' ? 'Not {name} again tonight' : 'مش {name} تاني الليلة دي';
    lines.push(`🚫 ${escapeHTML((t.mafia_last_save || fallback).replace('{name}', mafiaNameOf(state, you.lastSave)))}`);
  }
  if (role === 'detective' && (you.checks || []).length) {
    // Tonight's answer first and in words; the nights before as a short list.
    const tonight = night && you.pick ? (you.checks || []).filter(c => c.id === you.pick).slice(-1)[0] : null;
    if (tonight) lines.push(`${tonight.mafia ? '🕴️' : '✅'} ${escapeHTML((tonight.mafia ? (t.mafia_check_yes || '') : (t.mafia_check_no || '')).replace('{name}', tonight.name))}`);
    const before = (you.checks || []).filter(c => c !== tonight);
    if (before.length) lines.push(before.map(c => `${c.mafia ? '🕴️' : '✅'} ${escapeHTML(c.name)}`).join(' · '));
  }
  const task = { mafia: t.mafia_task_mafia, doctor: t.mafia_task_doctor, detective: t.mafia_task_detective }[role] || t.mafia_task_suspect;
  const text = night ? (task || '') : (t['mafia_desc_' + role] || '');
  return `
    <span class="mafia-role__icon" aria-hidden="true">${MAFIA_ICONS[role] || ''}</span>
    <b class="mafia-role__name">${escapeHTML(t['mafia_role_' + role] || '')}</b>
    <span class="mafia-role__desc">${escapeHTML(text)}</span>
    ${lines.map(l => `<span class="mafia-role__extra">${l}</span>`).join('')}`;
}

/* --- the front row (idea 538, 7 Oct 2026) -------------------------------------
   Whoever is out (with the lobby's switch on, the default) sees every role and,
   at night, every pick as it is made. The server sends it in their own slice
   only (mafiaSpectateView); it is refreshed in place, like the hold card, so a
   pick at night is no rebuild. Their phone can't vote, chat or shout. */

/** The box a spectator's view lives in; empty for everyone else. */
function mafiaSpectateBoxHtml(state, t) {
  const you = state.you || {};
  return you.spectate ? `<div data-mafia-spectate>${mafiaSpectateHtml(state, t)}</div>` : '';
}

function mafiaSpectateHtml(state, t) {
  const v = (state.you || {}).spectate;
  if (!v) return '';
  const roles = (v.roles || []).map(r => `<span class="chip chip--plain ${r.alive ? '' : 'is-away'}">${MAFIA_ICONS[r.role] || ''} ${escapeHTML(r.name)}</span>`).join('');
  const n = v.night;
  let picks = '';
  if (n) {
    const rows = [];
    const pair = (p) => `${escapeHTML(p.by)} ← ${escapeHTML(p.name)}`;
    if ((n.mafia || []).length) rows.push(`${MAFIA_ICONS.mafia} ${n.mafia.map(pair).join(' · ')}`);
    if (n.save) rows.push(`${MAFIA_ICONS.doctor} ${escapeHTML(n.save)}`);
    if (n.check) rows.push(`${MAFIA_ICONS.detective} ${escapeHTML(n.check.name)} ${n.check.mafia ? MAFIA_ICONS.mafia : '✅'}`);
    if ((n.suspects || []).length) rows.push(`🤔 ${n.suspects.map(pair).join(' · ')}`);
    picks = `<div class="eyebrow" style="margin-top: var(--sp-3)">🌙 ${escapeHTML(t.mafia_spec_picks || '')}</div>
      ${rows.length ? rows.map(r => `<p class="field__hint" style="margin:0">${r}</p>`).join('') : `<p class="field__hint" style="margin:0">…</p>`}`;
  }
  return `<div class="card card--tight mafia-spectate">
      <div class="eyebrow">👀 ${escapeHTML(t.mafia_spec_roles || '')}</div>
      <div class="chip-set">${roles}</div>
      ${picks}
    </div>`;
}

/** The spectator's view, brought up to date without rebuilding the screen. */
function refreshMafiaSpectate(root, state, t) {
  const box = root && root.querySelector('[data-mafia-spectate]');
  if (!box) return;
  const html = mafiaSpectateHtml(state, t);
  if (box._mafiaHtml !== html) { box.innerHTML = html; box._mafiaHtml = html; }
}

/** Puts the latest private information on the card without rebuilding the screen. */
function refreshMafiaSecret(root, state, t) {
  const back = root && root.querySelector('[data-mafia-back]');
  if (!back) return;
  const html = mafiaSecretHtml(state, t);
  if (back._mafiaHtml !== html) { back.innerHTML = html; back._mafiaHtml = html; }
}

/**
 * The night on a living phone. The same on every one of them: the heading,
 * everyone still in the game (yourself last), the same buttons.
 */
function mafiaNightHtml(state, t) {
  const s = state.shared;
  const you = state.you || {};
  const alive = (s.alive || []).indexOf(Room.me) !== -1;
  if (!alive || !you.role) {
    return `<div class="card mafia-night" style="text-align:center"><div class="metric metric--lg">🌙</div><p class="sheet__subtitle">${escapeHTML(t.mafia_city_sleeps || '')}</p></div>`;
  }
  const targets = (s.alive || []).filter(id => id !== Room.me).concat([Room.me]);
  const heading = t.mafia_night_pick || (appState.lang === 'en' ? 'Tap a name. What it does is on your card.' : 'اختار اسم. اللي بيعمله اختيارك مكتوب في كارتك.');
  const picked = t.mafia_night_picked || (appState.lang === 'en' ? 'Your pick is in.' : 'اختيارك اتسجل.');
  return `
    <div class="card mafia-night">
      <div class="mafia-night__task">🌙 ${escapeHTML(heading)}</div>
      <div class="mafia-targets">
        ${targets.map(id => `<button type="button" class="mafia-target${you.pick === id ? ' is-on' : ''}" onclick="mafiaNightTap('${jsStringAttr(id)}')">
            ${escapeHTML(mafiaNameOf(state, id))}${id === Room.me ? ` <span class="badge">${escapeHTML(t.vote_you || '')}</span>` : ''}</button>`).join('')}
      </div>
      <p class="field__hint" style="text-align:center">${you.pick ? '✓ ' + escapeHTML(picked) : '&nbsp;'}</p>
    </div>`;
}

/**
 * A night tap. What the rules refuse for this role (the Mafia on one of their
 * own, the Detective's second check or themselves, the Doctor's last save) is
 * dropped here without a word: an error on screen would say the role out loud.
 */
function mafiaNightTap(id) {
  const st = Room.state;
  const s = st && st.game === 'mafia' && st.shared;
  if (!s || s.phase !== 'night') return;
  const you = st.you || {};
  const mafiaIds = (you.mafia || []).map(m => m.id);
  if (you.role === 'mafia' && (id === Room.me || mafiaIds.indexOf(id) !== -1)) return;
  if (you.role === 'detective' && (id === Room.me || you.pick)) return;
  if (you.role === 'doctor' && id === you.lastSave) return;
  if (you.pick === id) return;
  // A failure says only that it failed: the server's reason can name the role.
  Room.act('nightPick', { target: id }).catch(() => {
    const t = TRANSLATIONS[appState.lang] || {};
    showToast(t.room_action_failed || (appState.lang === 'en' ? "That didn't go through, try again" : 'ماوصلش، جرّب تاني'), 'error');
  });
}

/**
 * Night falls and morning comes over about a second, on a layer of its own so
 * nothing else on the screen repaints. The layer is kept across rebuilds - the
 * frame is rewritten whenever a vote count changes, and a cross-fade that
 * restarted every time would flicker.
 */
function mafiaSky(root, phase) {
  if (!root) return;
  let sky = root.querySelector('.mafia-sky');
  if (!sky) {
    sky = document.createElement('div');
    sky.className = 'mafia-sky';
    root.insertBefore(sky, root.firstChild);
  }
  const night = phase === 'night' || phase === 'roles';
  const day = phase === 'day' || phase === 'dayResult' || phase === 'voting';
  sky.classList.toggle('mafia-sky--day', day);
  sky.classList.toggle('is-on', night || day);
}

/* --- the narrator --------------------------------------------------------- */
/*
   An option, off by default (the owner, 20 Sep 2026): when it is on, one
   device in the room reads a short line at each change of phase - the town
   falling asleep, the morning news, the vote. The lines are about the room,
   never about a role: this is the one thing the narrator must not do, so the
   only names it ever says are ones already printed on every screen.
*/
const mafiaSaid = { key: '' };

/**
 * Whether this device is the one that speaks. The first big screen online if there is one -
 * it is the table's own voice and nobody is holding it - and otherwise the
 * host's phone. Exactly one device in a room answers true.
 */
function mafiaNarrator(state) {
  if (!state || !state.shared || !state.shared.narrate) return false;
  // The first screen online (by id): with two TVs only one speaks.
  const screens = (state.screens || []).filter(x => x.online).map(x => x.id).sort();
  if (state.youAreScreen) return screens[0] === Room.me;
  return !screens.length && !!state.youAreHost;
}

/** Two sentences into one, without doubling a full stop that is already there. */
function mafiaJoinSaid(a, b) {
  const first = String(a || '').trim();
  const second = String(b || '').trim();
  if (!first) return second;
  if (!second) return first;
  return first + (/[.!?؟。]$/.test(first) ? ' ' : '. ') + second;
}

/** The line for the phase the room has just moved into, or nothing. */
function mafiaNarrationLine(s, t) {
  switch (s.phase) {
    case 'roles':     return t.mafia_say_roles || '';
    case 'night':     return t.mafia_say_night || '';
    case 'day':       return mafiaJoinSaid(mafiaNewsText(s, t), t.mafia_say_day || '');
    case 'voting':    return t.mafia_say_vote || '';
    case 'dayResult': return s.news ? mafiaNewsText(s, t) : '';
    case 'gameover':  return t.mafia_say_over || '';
  }
  return '';
}

/**
 * The room's news as words, taken from the very strings already printed on
 * every screen. It says who left, which everyone can see, and **never the
 * role** - mafia_was and the role name are deliberately not read.
 */
function mafiaNewsText(s, t) {
  const n = s.news || {};
  if (n.kind === 'saved' || n.kind === 'quiet' || n.kind === 'tie' || n.kind === 'nobody') {
    return t['mafia_news_' + n.kind] || '';
  }
  if (n.kind === 'out' || n.kind === 'voted') {
    const line = n.kind === 'voted' ? (t.mafia_out_voted || '') : (t.mafia_out_night || '');
    return n.name ? line.replace('{name}', n.name) : '';
  }
  return '';
}

/**
 * Says the line for this phase, once per phase, on the one device that speaks.
 * A news card lies face down for a beat before it turns over (spyRevealParts),
 * so the line waits for it through afterReveal rather than reading the name
 * out from under the reveal. Returns whether anything was said or scheduled.
 */
function mafiaNarrate(state, t, el) {
  const s = state.shared;
  const key = [state.code, s.dealId || '', s.phase, s.night, s.day, (s.news || {}).kind, (s.news || {}).name].join('|');
  if (mafiaSaid.key === key) return false;
  mafiaSaid.key = key;
  if (!mafiaNarrator(state)) return false;
  const line = mafiaNarrationLine(s, t);
  if (!line) return false;
  if (el && typeof afterReveal === 'function') {
    afterReveal(el, () => speakLine(line, appState.lang));
    return true;
  }
  return speakLine(line, appState.lang);
}

// Leaving the game, or the room, stops whatever is being said and lets the
// next game narrate from its first phase again. onLeaveScreen (JS_Sounds.html)
// covers walking off the screen; this covers the room moving on underneath.
onRoomClocksReset(() => { mafiaSaid.key = ''; speakStop(); });

ROOM_GAMES.mafia = {
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang];
    const n = (state.players || []).length;
    const few = n < 5 ? `<p class="field__hint tx-warning" style="text-align:center">${escapeHTML(t.mafia_need_five || '')}</p>` : '';
    if (!state.youAreHost) return `${few}<p class="field__hint" style="text-align:center">${escapeHTML(t.mafia_lobby_hint || '')}</p>`;
    const o = mafiaOpts();
    const seg = (key, values, labelOf) => `
      <div class="segmented" role="group">
        ${values.map(v => `<button type="button" class="segmented__item ${v === o[key] ? 'is-active' : ''}" onclick="setMafiaOpt('${key}', ${typeof v === 'string' ? `'${v}'` : v})">${labelOf(v)}</button>`).join('')}
      </div>`;
    return `
      <div class="card card--tight">
        <div class="field">
          <label class="field__label">${escapeHTML(t.mafia_mode || '')}</label>
          ${seg('mode', ['classic', 'roles'], v => escapeHTML(t['mafia_mode_' + v] || v))}
          <p class="field__hint">${escapeHTML(o.mode === 'roles' ? (t.mafia_mode_roles_hint || '') : (t.mafia_mode_classic_hint || ''))}</p>
        </div>
        <div class="field">
          <label class="switch-row" for="mafia-reveal">
            <span class="field__label">${escapeHTML(t.mafia_reveal || '')}</span>
            <span class="switch"><input type="checkbox" id="mafia-reveal" role="switch" ${o.revealRoles ? 'checked' : ''} onchange="setMafiaOpt('revealRoles', this.checked)"><span class="switch__track" aria-hidden="true"></span></span>
          </label>
          <p class="field__hint">${escapeHTML(t.mafia_reveal_hint || '')}</p>
        </div>
        <div class="field">

    // picks would be a tell. Those are refreshed in place below.

          ${inGame && alive ? role : ''}
          ${roomMoveOnHtml(state, `<div class="btn-stack"><button class="btn btn--ghost btn--sm" onclick="roomAct('endNight')">${escapeHTML(t.mafia_end_night || '')}</button></div>`)}

        return head + mafiaNewsHtml(state, t) + outNote + `
          <div class="card" style="text-align:center">
            <div class="eyebrow">🗣️ ${escapeHTML(t.mafia_discuss_now || '')}</div>
            <p class="field__hint">${escapeHTML(t.mafia_discuss_hint || '')}</p>
          </div>
          ${mafiaPeopleHtml(state, t)}
          ${inGame && alive ? role : ''}
          ${roomMoveOnHtml(state, `<div class="btn-stack">
              <button class="btn btn--primary btn--lg" onclick="roomAct('startVote')">🗳️ ${escapeHTML(t.mafia_vote_now || '')}</button>

      }
      if (s.phase === 'voting') {
        return head + outNote + `
          <div class="card card--tight">
            <div class="eyebrow">🗳️ ${escapeHTML(t.mafia_who_leaves || '')}</div>
            ${renderBallot(mafiaVoteState(state), { ownLabel: t.vote_you })}

      }
      if (s.phase === 'dayResult') {
        return head + mafiaNewsHtml(state, t) + outNote + `
          <div class="card card--tight">${s.vote && s.vote.results ? renderVoteResults(mafiaVoteState(state)) : ''}</div>
          ${mafiaPeopleHtml(state, t)}

          ${mine ? `<p class="sheet__subtitle">${escapeHTML(iWon ? (t.mafia_you_won || '') : (t.mafia_you_lost || ''))}</p>` : ''}
        </div>
        ${mafiaTaleHtml(state, t, endRev.st.on ? endRev.winAt + 700 : 0, '', endRev.st.at(endRev.winAt + 700, 'pop'))}
        <div class="card card--tight"${endRev.st.end(400)}>

        </div>

  }
};

/* --- the end: every role turns over (ideas batch: rooms) ------------------------------
   The citizens first, then the Doctor, the Detective and the Lawyer, and the Mafia
   last after a drum roll; the winner's card comes once the last one is up, and the
   narrator's line waits for it all (afterReveal reads the data-reveal-ms). */
const MAFIA_END_ORDER = { citizen: 0, doctor: 1, detective: 2, lawyer: 3, mafia: 4 };

function mafiaEndReveal(state, t, tv) {
  const s = state.shared;
  const st = stageReveal(['mafia-end', tv ? 'tv' : 'ph', roomDealKey(state), JSON.stringify(s.scores || {})].join('|'), state);
  // The cards stay in the table's order (a pile sorted by role would tell before it turns);
  // only their moments follow the roles.
  const roles = s.roles || [];
  const when = new Map();
  let at = 300;
  let prev = null;
  roles.slice().sort((a, b) => (MAFIA_END_ORDER[a.role] || 0) - (MAFIA_END_ORDER[b.role] || 0)).forEach(r => {
    if (prev !== null && r.role !== prev) at += r.role === 'mafia' ? 1000 : 300;
    prev = r.role;
    when.set(r, at);
    at += r.role === 'citizen' ? 300 : r.role === 'mafia' ? 700 : 550;
  });
  const rows = roles.map(r => {
    const here = when.get(r);
    return `<div class="mafia-final ${r.alive ? '' : 'is-out'} ${r.role === 'mafia' ? 'is-mafia' : ''}"${st.at(here, 'flip')}>
        ${st.on ? stageCoverHtml('') : ''}
        <span aria-hidden="true">${MAFIA_ICONS[r.role]}</span><b>${escapeHTML(r.name)}</b><span>${escapeHTML(t['mafia_role_' + r.role] || '')}</span></div>`;
  }).join('');
  return { st, rows, winAt: st.on ? at + 300 : 0 };
}

/** The counts and the board, and the drum roll closing in before the first Mafia card. */
function mafiaEndRun(root, state) {
  stageRun(root, state);
  const mafia = root ? [...root.querySelectorAll('.mafia-final.is-mafia[data-rv]')] : [];
  if (!mafia.length) return;
  const at = Math.min(...mafia.map(el => parseFloat(el.style.getPropertyValue('--rv-at')) || 0));
  [1000, 760, 540, 340, 170].forEach(ms => stageSound(state, 'tick', at - ms));
  stageSound(state, 'alarm', at + 250);
}

/** A sound once per moment on this phone: nightfall, the morning's news. */
function mafiaSounds(state) {
  const s = state.shared;
  const key = ['mafia-sound', state.code, s.dealId || '', s.phase, s.night, s.day].join('|');
  if (!motionFirst(key)) return;
  if (s.phase === 'night') playRoomFx('tick');
  if ((s.phase === 'day' || s.phase === 'dayResult') && s.news) playRoomFx(s.news.kind === 'out' || s.news.kind === 'voted' ? 'alarm' : 'success');
}

function mafiaStyleOn() {
  if (document.getElementById('mafia-style')) return;
  const st = document.createElement('style');
  st.id = 'mafia-style';
  st.textContent = MAFIA_CSS;
  document.body.appendChild(st);
  // The motion setting reads every stylesheet: this one came after it looked.
  if (typeof applyMotionPref === 'function') applyMotionPref();

const MAFIA_ST_DAY = ['#d9a066', '#c9775a', '#9fb7c9', '#e3c48a', '#b58b6a', '#cfa0a8', '#a9c08f'];
const MAFIA_ST_NIGHT = ['#3a3157', '#41304f', '#2d3a57', '#433a55', '#3b3148', '#45324f', '#33405a'];
const MAFIA_ST_INK = '#1a1530';
// What this TV has already drawn dark tonight, so only a new tap puts a light out with motion
// (a reload, or a TV coming on mid-night, draws the dark windows as they are).
const mafiaStreetSeen = { key: '', k: 0, door: '' };

/** A small seeded random from a string: the same order on every screen for one night. */
function mafiaStreetRng(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  let x = (h >>> 0) % 2147483646 + 1;
  return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
}

/** The order the windows go dark tonight: a shuffle of the houses, nobody's. */
function mafiaStreetOrder(n, seed) {
  const r = mafiaStreetRng(seed);
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}

/** One house face-on. o: { day, lit, going, open, swing }. */
function mafiaHouseSvg(x, w, h, gy, i, o) {
  const day = o.day, ink = MAFIA_ST_INK;
  const col = (day ? MAFIA_ST_DAY : MAFIA_ST_NIGHT)[i % MAFIA_ST_DAY.length];
  const wy = gy - h + h * 0.22, ww = w * 0.26, wh = h * 0.2;
  const glowCls = 'mafia-st__glow' + (o.going ? ' is-going' : '');
  const glowOp = o.lit || o.going ? 1 : 0;
  const win = (wx) => {
    if (day) return `<rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" rx="${ww / 2}" fill="#9cc4e8" stroke="${ink}" stroke-width="3"/><path d="M${wx + ww / 2} ${wy} v${wh}" stroke="${ink}" stroke-width="2"/><rect x="${wx - 6}" y="${wy + wh}" width="${ww + 12}" height="6" fill="${ink}" opacity=".6"/>`;
    return `<rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" rx="${ww / 2}" fill="#141833" stroke="#0b0c1c" stroke-width="2"/>
      <g class="${glowCls}" opacity="${glowOp}"><rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" rx="${ww / 2}" fill="#ffcf5a" filter="url(#mfStGlow)"/><path d="M${wx + ww / 2} ${wy} v${wh} M${wx} ${wy + wh * 0.55} h${ww}" stroke="#a8692a" stroke-width="2"/></g>`;
  };
  const dw = w * 0.3, dh = Math.min(h * 0.36, 92), dx = x + (w - dw) / 2, dy = gy - dh;
  const arch = `M${dx} ${dy + dw / 2} a${dw / 2} ${dw / 2} 0 0 1 ${dw} 0 v${dh - dw / 2} h${-dw}z`;
  const door = o.open
    ? `<path d="${arch}" fill="#120d22"/>
       <path class="mafia-st__leaf${o.swing ? ' is-swing' : ''}" d="M${dx} ${dy + dw / 2} l${-dw * 0.45} ${-dw * 0.12} v${dh - dw * 0.38} l${dw * 0.45} ${dw * 0.1}z" fill="#8a5a34" stroke="${ink}" stroke-width="3"/>
       <rect x="${dx + dw * 0.1}" y="${gy - 6}" width="${dw * 0.8}" height="6" fill="#c0392b"/>`
    : `<path d="${arch}" fill="${day ? '#7a4a2a' : '#2a1c2a'}" stroke="${ink}" stroke-width="3"/><circle cx="${dx + dw * 0.78}" cy="${dy + dh * 0.62}" r="3" fill="${day ? '#f2c14e' : '#6b5a3a'}"/>`;
  const lamp = day
    ? `<circle cx="${dx + dw / 2}" cy="${dy - 14}" r="5" fill="#d9c7a0"/>`
    : `<circle cx="${dx + dw / 2}" cy="${dy - 14}" r="5" fill="#3a3550"/><g class="${glowCls}" opacity="${glowOp}"><circle cx="${dx + dw / 2}" cy="${dy - 14}" r="34" fill="url(#mfStLamp)"/><circle cx="${dx + dw / 2}" cy="${dy - 14}" r="5" fill="#ffe7a0"/></g>`;
  const mash = i % 3 === 1 ? `<rect x="${x + w * 0.3}" y="${wy + wh + 14}" width="${w * 0.4}" height="${h * 0.14}" fill="${day ? '#8a5a34' : '#2a1d2a'}" stroke="${ink}" stroke-width="3"/><path d="M${x + w * 0.3} ${wy + wh + 14 + h * 0.07} h${w * 0.4} M${x + w * 0.5} ${wy + wh + 14} v${h * 0.14}" stroke="${ink}" stroke-width="2" opacity=".6"/>` : '';
  return `<g>
    <rect x="${x}" y="${gy - h}" width="${w}" height="${h}" fill="${col}" stroke="${ink}" stroke-width="4"/>
    <rect x="${x - 6}" y="${gy - h - 10}" width="${w + 12}" height="14" fill="${col}" stroke="${ink}" stroke-width="4"/>
    ${i % 2 ? `<path d="M${x + w * 0.2} ${gy - h - 10} v-16 h${w * 0.18} v16" fill="${col}" stroke="${ink}" stroke-width="3"/>` : ''}
    ${win(x + w * 0.14)}${win(x + w * 0.6)}${mash}${lamp}${door}</g>`;
}

/**
 * The street as an SVG. houses: how many; dark: the indexes already out; going: the ones
 * going out now (with motion); open: the index whose door stands open (day), or -1.
 */
function mafiaStreetSvg(o) {
  const W = 1280, H = 620, gy = 505, day = !!o.day, n = Math.max(1, o.houses);
  const r = mafiaStreetRng('stars');
  let stars = '';
  if (!day) for (let i = 0; i < 70; i++) stars += `<circle class="${i % 5 ? '' : 'mafia-st__star'}" style="animation-delay:${(r() * 2.6).toFixed(2)}s" cx="${(r() * W).toFixed(0)}" cy="${(r() * 260).toFixed(0)}" r="${(r() * 1.6 + 0.5).toFixed(1)}" fill="#fff" opacity="${(r() * 0.6 + 0.3).toFixed(2)}"/>`;
  const sky = day
    ? `<circle cx="1110" cy="110" r="83" fill="#fff3c4" opacity=".45"/><circle cx="1110" cy="110" r="46" fill="#ffd25a" stroke="#f59e0b" stroke-width="5"/>`
    : `${stars}<circle cx="1120" cy="92" r="40" fill="#ffe9a8"/><circle cx="1138" cy="82" r="36" fill="#0d0f2c"/>`;
  // Behind the houses: a minaret, a dome, a second minaret and two low roofs.
  const by = gy - 110;
  const skyline = `<g fill="${day ? '#e9b98a' : '#1b1640'}" opacity="${day ? 0.75 : 1}">
      <rect x="${W * 0.18}" y="${by - 150}" width="22" height="150"/><path d="M${W * 0.18 - 6} ${by - 150} h34 l-17 -30z"/><circle cx="${W * 0.18 + 11}" cy="${by - 186}" r="6"/>
      <path d="M${W * 0.3} ${by} v-70 a70 70 0 0 1 140 0 v70z"/><circle cx="${W * 0.3 + 70}" cy="${by - 146}" r="7"/>
      <rect x="${W * 0.62}" y="${by - 120}" width="18" height="120"/><path d="M${W * 0.62 - 5} ${by - 120} h28 l-14 -26z"/>
      <rect x="${W * 0.7}" y="${by - 60}" width="160" height="60"/><rect x="${W * 0.05}" y="${by - 50}" width="120" height="50"/></g>`;
  // Every house the same size; a short street stays in the middle rather than growing giant houses.
  const x0 = 120, x1 = W - 110, gap = 16;
  const w = Math.min(200, (x1 - x0 - gap * (n - 1)) / n);

  const h = Math.min(300, Math.max(200, w * 1.6));

  }
  const allOut = o.dark.length >= n;
  const lampX = W - 52;
  const lampPost = day ? `<g transform="translate(${lampX} ${gy})"><rect x="-3" y="-200" width="6" height="200" fill="#6b5a4a"/><circle cx="0" cy="-206" r="7" fill="#d9c7a0"/></g>`
    : `<g transform="translate(${lampX} ${gy})"><rect x="-3" y="-200" width="6" height="200" fill="#2b2745"/><circle cx="0" cy="-206" r="${allOut ? 6 : 10}" fill="#ffe7a0"/><circle class="mafia-st__lamp-glow" cx="0" cy="-206" r="60" fill="url(#mfStLamp)" opacity="${allOut ? 0.25 : 0.7}"/></g>`;
  // The low wall at the start of the street, and the cat sitting on it.
  const wallX = 22, wallW = 82, wallH = 64;
  const catFill = day ? '#3b2f2a' : '#0c0a18';
  const wall = `<rect x="${wallX}" y="${gy - wallH}" width="${wallW}" height="${wallH}" fill="${day ? '#c9a77a' : '#2a2340'}" stroke="${MAFIA_ST_INK}" stroke-width="3"/>
    <path d="M${wallX} ${gy - wallH / 2} h${wallW} M${wallX + wallW / 2} ${gy - wallH} v${wallH / 2}" stroke="${MAFIA_ST_INK}" stroke-width="2" opacity=".5"/>
    <g transform="translate(${wallX + wallW / 2} ${gy - wallH - 8})" fill="${catFill}"><ellipse cx="0" cy="0" rx="14" ry="8"/><circle cx="12" cy="-8" r="6"/><path d="M8 -12 l2 -6 l3 5z M14 -12 l3 -6 l1 6z"/><path class="mafia-st__tail" d="M-14 -2 q-14 -10 -8 -22" stroke="${catFill}" stroke-width="3" fill="none"/></g>`;
  return `<svg class="mafia-st__svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <filter id="mfStGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="mfStNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a22"/><stop offset=".7" stop-color="#1c1543"/><stop offset="1" stop-color="#2a1d52"/></linearGradient>
      <linearGradient id="mfStDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec5ff"/><stop offset=".6" stop-color="#ffd9b0"/><stop offset="1" stop-color="#ffc48a"/></linearGradient>
      <radialGradient id="mfStLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="url(#${day ? 'mfStDawn' : 'mfStNight'})"/>
    ${sky}${skyline}${houses}
    <rect y="${gy}" width="${W}" height="${H - gy}" fill="${day ? '#cdb592' : '#1a1630'}"/>
    <path d="M0 ${gy + 46} H${W}" stroke="${day ? '#b39a76' : '#2a2448'}" stroke-width="6" stroke-dasharray="26 18"/>
    ${wall}${lampPost}
  </svg>`;
}

/** The night on the TV: the street, the clock and the count on top, the host's way on below. */
function mafiaStreetNightHtml(state, t, moveOnHtml) {
  const s = state.shared;
  const n = (s.alive || []).length;
  const k = Math.min(n, mafiaActedCount(s));
  const night = [state.code, s.dealId || '', s.night].join('|');
  const order = mafiaStreetOrder(n, 'mafia-street|' + night);
  // A new night (or a TV that has just come on) draws what is already dark without motion.
  if (mafiaStreetSeen.key !== night) { mafiaStreetSeen.key = night; mafiaStreetSeen.k = k; }
  const from = motionOff() ? k : Math.min(mafiaStreetSeen.k, k);
  mafiaStreetSeen.k = k;
  const dark = order.slice(0, from);
  const going = order.slice(from, k);
  const clock = s.endsAt ? `<div id="tv-mafia-clock" class="mafia-st__clock">${mafiaClockText(s.endsAt)}</div>` : '';
  return `<div class="mafia-st mafia-st--night">
      ${mafiaStreetSvg({ houses: n, dark: dark, going: going, open: -1 })}
      <div class="mafia-st__top">
        <div class="mafia-st__title">🌙 ${escapeHTML(t.mafia_street_sleeps || '')}</div>
        ${clock}
        <span class="mafia-st__pill"><span class="mafia-st__ok">✓</span> <b>${ltrFrac(k, n)}</b> · ${escapeHTML(t.mafia_street_lights || '')}</span>
      </div>
      <div class="mafia-st__foot">${moveOnHtml}</div>
    </div>`;
}

/** The morning on the TV: the same street by day, the door of whoever left open, the news on top. */
function mafiaStreetDayHtml(state, t, peopleHtml, actionsHtml) {
  const s = state.shared;
  const news = s.news || {};
  const roster = s.roster || [];
  const leftId = news.kind === 'out' && news.id ? news.id : '';
  // Last night's street: everyone still in, and whoever the night took, in the table's order.
  const ids = roster.filter(id => (s.alive || []).indexOf(id) !== -1 || id === leftId);
  const open = leftId ? ids.indexOf(leftId) : -1;
  const doorKey = ['mafia-door', state.code, s.dealId || '', s.night, s.day, leftId].join('|');
  const swing = open !== -1 && !motionOff() && motionFirst(doorKey);
  const fresh = motionFirst(['mafia-news-in', state.code, s.dealId || '', s.night, s.day].join('|')) && !motionOff();
  const text = mafiaNewsText(s, t);
  const role = leftId && news.role ? `<i class="mafia-st__late${fresh ? ' is-late' : ''}">${escapeHTML(t.mafia_was || '')}: ${escapeHTML(mafiaRoleName(news.role, t))}</i>` : '';
  const clock = s.endsAt ? `<span id="tv-mafia-clock" class="mafia-st__clockin">${mafiaClockText(s.endsAt)}</span>` : '';
  return `<div class="mafia-st mafia-st--day">
      ${mafiaStreetSvg({ day: true, houses: ids.length || 1, dark: [], going: [], open: open, swing: swing })}
      <div class="mafia-st__top">
        <div class="mafia-st__news${news.role === 'mafia' && leftId ? ' is-mafia' : ''}${fresh ? ' is-in' : ''}"><span class="mafia-st__sun" aria-hidden="true">☀️</span>
          <div>${leftId ? `<small>${escapeHTML(t.mafia_street_morning || '')}</small>` : ''}<b>${escapeHTML(text)}</b>${role}</div></div>
        <span class="mafia-st__pill mafia-st__talk">🗣️ ${escapeHTML(t.mafia_discuss_now || '')} ${clock}</span>
      </div>
      <div class="mafia-st__foot">${peopleHtml}${actionsHtml}</div>
    </div>`;
}

/* --- «حكاية الليالي» (idea 537, look A «صف الوشوش», the owner's pick of 7 Oct 2026) ------
   After the roles have turned over, the game is told again a chapter at a time: everyone's
   face in one row with their role under it, and the night's moves flying between the faces -
   the Mafia's 🎯 from each of them to their pick, the Doctor's ring, the Detective's 🔍 and
   its answer - then the day's vote as a column over each face. The story is the server's
   (shared.story, sent only once the game is over); the chapters on top jump to any of them.
   One player per page (mafiaTale); a redraw carries on where it was, never replays. */
const MAFIA_TALE_COLS = ['#2563eb', '#e5383b', '#16a34a', '#f59e0b', '#7c3aed', '#be123c', '#0ea5a4', '#db2777', '#0891b2', '#65a30d', '#ea580c', '#4f46e5'];
const MAFIA_TALE_MS = 2600;
const mafiaTale = { key: '', beat: 0, timer: null, el: null, ro: null, story: [], beats: [], roles: [] };

/** The beats of a story: a night is the Mafia, then the save and the check when there were any; a day is its vote. */
function mafiaTaleBeats(story) {
  const out = [];
  (story || []).forEach((c, ch) => {
    if (c.k === 'd') { out.push({ ch, kind: 'vote' }); return; }
    out.push({ ch, kind: 'mafia' });
    if (c.save) out.push({ ch, kind: 'save' });
    if (c.check) out.push({ ch, kind: 'check' });
  });
  return out;
}

/** The tale's markup: the chapters, the line, the row of faces (the frame draws it, mafiaTaleRun plays it). */
function mafiaTaleHtml(state, t, startMs, cls, attrs) {
  const s = state.shared;
  const story = s.story || [];
  if (!story.length) return '';
  const roles = s.roles || [];
  const chaps = story.map((c, i) => `${i ? '<i aria-hidden="true">›</i>' : ''}<button type="button" class="mafia-tale__chap" onclick="mafiaTaleGo(${i})">${escapeHTML(((c.k === 'd' ? t.mafia_day_n : t.mafia_night_n) || '').replace('{n}', c.n))}</button>`).join('');
  const faces = roles.map((r, i) => `<div class="mafia-tale__face" data-id="${escapeHTML(r.id)}" style="--c:${MAFIA_TALE_COLS[i % MAFIA_TALE_COLS.length]}">
      <span class="mafia-tale__dot">${escapeHTML(Array.from(String(r.name || '?').trim())[0] || '?')}<i class="mafia-tale__ring" aria-hidden="true"><b>🛡️</b></i></span><span class="mafia-tale__bar"><b></b></span>
      <span class="mafia-tale__role" aria-hidden="true">${MAFIA_ICONS[r.role] || ''}</span>
      <bdi class="mafia-tale__name">${escapeHTML(r.name)}</bdi><small>${escapeHTML(t['mafia_role_' + r.role] || '')}</small>
      <span class="mafia-tale__tags"></span></div>`).join('');
  return `<div class="mafia-tale ${cls || ''}" data-mafia-tale data-tale-at="${Math.round(startMs || 0)}"${attrs || ''}>
      <div class="mafia-tale__head"><span class="mafia-tale__title">📖 ${escapeHTML(t.mafia_tale_title || '')}</span>
        <button type="button" class="mafia-tale__again" onclick="mafiaTaleGo(0)" aria-label="${escapeHTML(t.mafia_tale_replay || '')}" title="${escapeHTML(t.mafia_tale_replay || '')}">↻</button></div>
      <div class="mafia-tale__chaps">${chaps}</div>
      <div class="mafia-tale__line" aria-live="polite"></div>
      <div class="mafia-tale__stage" style="--n:${Math.max(roles.length, 5)}"><svg class="mafia-tale__svg" aria-hidden="true"></svg><div class="mafia-tale__row">${faces}</div></div>
    </div>`;
}

/** Plays the tale in root (after a frame is drawn): a new game from the first beat at its moment, a redraw where it was. */
function mafiaTaleRun(root, state) {
  const el = root && root.querySelector('[data-mafia-tale]:not([data-armed])');
  if (!el) return;
  el.dataset.armed = '1';
  const T = mafiaTale;
  const key = [roomDealKey(state), state.youAreScreen ? 'tv' : 'ph'].join('|');
  T.el = el;
  T.story = state.shared.story || [];
  T.roles = state.shared.roles || [];
  T.beats = mafiaTaleBeats(T.story);
  if (T.ro) T.ro.disconnect();
  T.ro = null;
  if (typeof ResizeObserver === 'function') {
    let w = 0;
    T.ro = new ResizeObserver(() => {
      const nw = el.clientWidth;
      if (!nw || nw === w) return;
      const first = !w;
      w = nw;
      if (!first) mafiaTalePaint(false);
    });
    T.ro.observe(el);
  }
  if (T.key === key) { mafiaTalePaint(false); return; }
  T.key = key;
  T.beat = 0;
  clearTimeout(T.timer);
  mafiaTalePaint(false);
  T.timer = setTimeout(() => { mafiaTalePaint(true); mafiaTaleNext(); }, Number(el.dataset.taleAt) || 0);
}

/** The next beat after a while, until the last. */
function mafiaTaleNext() {
  const T = mafiaTale;
  clearTimeout(T.timer);
  if (T.beat >= T.beats.length - 1) return;
  T.timer = setTimeout(() => {
    if (!T.el || !T.el.isConnected) return;
    T.beat++;
    mafiaTalePaint(true);
    mafiaTaleNext();
  }, MAFIA_TALE_MS);
}

/** A chapter tapped (or ↻): from its first beat, and on from there. */
function mafiaTaleGo(ch) {
  const T = mafiaTale;
  const i = T.beats.findIndex(b => b.ch === ch);
  if (i === -1 || !T.el) return;
  T.beat = i;
  mafiaTalePaint(true);
  mafiaTaleNext();
}

function mafiaTaleStop() {
  clearTimeout(mafiaTale.timer);
  if (mafiaTale.ro) mafiaTale.ro.disconnect();
  mafiaTale.ro = null;
  mafiaTale.key = '';
}
onRoomClocksReset(mafiaTaleStop);

/** Draws the current beat: its chapter so far, the newest move with motion when fresh. */
function mafiaTalePaint(fresh) {
  const T = mafiaTale;
  const el = T.el;
  const b = T.beats[T.beat];
  if (!el || !el.isConnected || !b) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const c = T.story[b.ch];
  const move = fresh && !motionOff();
  const nameOf = (id) => (T.roles.find(r => r.id === id) || {}).name || '…';
  // "{role} ({by}) did … {name}": the brackets go when nobody is known to have done it.
  const fill = (key, by, id) => (t[key] || '').replace(by ? '{by}' : ' ({by})', by ? nameOf(by) : '').replace('{name}', nameOf(id));
  const upTo = T.beats.filter((x, k) => x.ch === b.ch && k <= T.beat).map(x => x.kind);
  const has = (kind) => upTo.indexOf(kind) !== -1;
  el.classList.toggle('is-day', c.k === 'd');
  el.querySelectorAll('.mafia-tale__chap').forEach((ch, i) => {
    ch.classList.toggle('is-on', i === b.ch);
    ch.classList.toggle('is-done', i < b.ch);
  });
  let line = '';
  if (b.kind === 'mafia') {
    const by = (c.kills || []).map(k => k.by).filter((x, i, a) => a.indexOf(x) === i).map(nameOf).join(appState.lang === 'en' ? ' and ' : ' و');
    line = '🌙 ' + ((c.kills || []).length ? (t.mafia_tale_mafia || '').replace('{by}', by).replace('{name}', nameOf(c.target || c.kills[0].to)) : (t.mafia_tale_mafia_none || ''));
  } else if (b.kind === 'save') line = '🩺 ' + fill('mafia_tale_save', c.doc, c.save);
  else if (b.kind === 'check') line = '🔍 ' + fill(c.check.mafia ? 'mafia_tale_check_yes' : 'mafia_tale_check_no', c.check.by, c.check.id);
  else {
    const counts = (c.votes || []).slice().sort((x, y) => y.n - x.n)
      .map(v => (v.id === 'nobody' ? '🤷 ' + (t.mafia_nobody || '') : nameOf(v.id)) + ' ' + v.n).join(appState.lang === 'en' ? ', ' : '، ');
    const verdict = (c.out ? (t.mafia_out_voted || '').replace('{name}', nameOf(c.out)) : (c.tie ? t.mafia_news_tie : t.mafia_news_nobody)) || '';
    line = '🗳️ ' + (counts ? counts + ' · ' : '') + verdict;
  }
  const lineEl = el.querySelector('.mafia-tale__line');
  lineEl.textContent = line;
  if (move) lineEl.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'ease-out' });
  // Who is out: gone before this chapter, or gone in it once its moment has come
  // (the night's with the Doctor's beat when there is one, else with the Mafia's).
  const outShown = c.out && (c.k === 'd' || !c.save || has('save')) ? c.out : null;
  const outBeat = c.k === 'd' ? 'vote' : (c.save ? 'save' : 'mafia');
  const maxVotes = Math.max(1, ...(c.votes || []).map(v => v.n));
  el.querySelectorAll('.mafia-tale__face').forEach(f => {
    const id = f.dataset.id;
    f.classList.toggle('is-out', (c.alive || []).indexOf(id) === -1 || id === outShown);
    const tags = [];
    if (c.k === 'n' && has('save') && id === c.save && c.save === c.target) tags.push(['ok', t.mafia_tale_close, b.kind === 'save']);
    if (id === outShown) tags.push(['bad', t.mafia_tale_out, b.kind === outBeat]);
    if (c.k === 'n' && has('check') && c.check && id === c.check.id) tags.push([c.check.mafia ? 'bad' : 'ok', c.check.mafia ? t.mafia_tale_yes : t.mafia_tale_no, b.kind === 'check']);
    const holder = f.querySelector('.mafia-tale__tags');
    holder.innerHTML = tags.map(([k, txt]) => `<span class="mafia-tale__tag is-${k}">${escapeHTML(txt || '')}</span>`).join('');
    if (move) [...holder.children].forEach((tag, i) => {
      if (tags[i][2]) tag.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 800, easing: 'cubic-bezier(.2,1.4,.4,1)', fill: 'backwards' });
    });
    // The Doctor's ring.
    const ring = f.querySelector('.mafia-tale__ring');
    const ringOn = c.k === 'n' && has('save') && id === c.save;
    ring.classList.toggle('is-on', ringOn);
    if (ringOn && move && b.kind === 'save') ring.animate([{ opacity: 0, transform: 'scale(1.6)' }, { opacity: 1, transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.2,1.3,.4,1)' });
    // The day's column over the face.
    const bar = f.querySelector('.mafia-tale__bar');
    const v = c.k === 'd' ? (c.votes || []).find(x => x.id === id) : null;
    bar.classList.toggle('is-on', !!v);
    bar.style.setProperty('--v', v ? (v.n / maxVotes).toFixed(3) : '0');
    bar.querySelector('b').textContent = v ? v.n : '';
    if (v && move) bar.animate([{ transform: 'translateX(-50%) scaleY(0)' }, { transform: 'translateX(-50%) scaleY(1)' }], { duration: 700, delay: 150, easing: 'cubic-bezier(.2,1.1,.4,1)', fill: 'backwards' });
  });
  mafiaTaleArcs(el, c, b, upTo, move);
}

/** The flights between the faces, drawn over the row: the Mafia's 🎯, the Detective's 🔍. */
function mafiaTaleArcs(el, c, b, upTo, move) {
  const stage = el.querySelector('.mafia-tale__stage');
  const svg = stage.querySelector('.mafia-tale__svg');
  stage.querySelectorAll('.mafia-tale__fly').forEach(x => x.remove());
  svg.innerHTML = '';
  if (c.k !== 'n') return;
  svg.setAttribute('viewBox', `0 0 ${stage.clientWidth} ${stage.clientHeight}`);
  // Measured from the layout (offsets), not the screen: the tale may still be springing in.
  const at = (id) => {
    const f = [...stage.querySelectorAll('.mafia-tale__face')].find(x => x.dataset.id === id);
    const d = f && f.querySelector('.mafia-tale__dot');
    return d ? { x: f.offsetLeft + d.offsetLeft + d.offsetWidth / 2, y: f.offsetTop + d.offsetTop } : null;
  };
  const flights = [];
  if (upTo.indexOf('mafia') !== -1) (c.kills || []).forEach((k, i) => flights.push({ a: k.by, z: k.to, col: '#f87171', dash: '2 10', icon: '🎯', lift: 1 - i * 0.2, fresh: b.kind === 'mafia', delay: i * 180 }));
  if (upTo.indexOf('check') !== -1 && c.check && c.check.by) flights.push({ a: c.check.by, z: c.check.id, col: '#fde047', dash: '12 9', icon: '🔍', lift: 0.7, fresh: b.kind === 'check', delay: 0 });
  let paths = '';
  flights.forEach(fl => {
    const p = at(fl.a), q = at(fl.z);
    if (!p || !q) return;
    const h = Math.min(Math.max(12, p.y - 6), 14 + Math.abs(q.x - p.x) * 0.32) * fl.lift;
    const x1 = p.x, y1 = p.y - 2, x2 = q.x, y2 = q.y - 2, cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - 2 * h;
    fl.pt = (u) => [(1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * cx + u * u * x2, (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * cy + u * u * y2];
    paths += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${fl.col}" stroke-dasharray="${fl.dash}"${fl.fresh && move ? ` class="is-new" style="animation-delay:${fl.delay}ms"` : ''}/>`;
  });
  svg.innerHTML = paths;
  flights.forEach(fl => {
    if (!fl.pt) return;
    const icon = document.createElement('span');
    icon.className = 'mafia-tale__fly';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = fl.icon;
    const spot = (u) => { const [x, y] = fl.pt(u); return `translate(${x.toFixed(1)}px, ${(y - 2).toFixed(1)}px) translate(-50%, -85%)`; };
    icon.style.transform = spot(1);
    stage.appendChild(icon);
    if (fl.fresh && move) {
      const frames = [];
      for (let k = 0; k <= 12; k++) frames.push({ transform: spot(k / 12), opacity: k ? 1 : 0 });
      icon.animate(frames, { duration: 900, delay: fl.delay, easing: 'cubic-bezier(.45,0,.3,1)', fill: 'backwards' });
    }
  });
}

/* --- the TV ------------------------------------------------------------------ */
TV_GAMES.mafia = {
  sig: (state) => {
    const s = state.shared;
    const v = s.vote || {};
    return [s.phase, s.night, s.day, mafiaActedCount(s), (v.voted || []).length, v.phase, (s.alive || []).length, s.endsAt].join('|');
  },
  frame(state, t) {
    const s = state.shared;
    const host = (html) => (state.youAreHost ? `<div class="tv-actions">${html}</div>` : '');
    const moveOn = (html) => roomMoveOnHtml(state, `<div class="tv-actions">${html}</div>`);
    const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
    const clock = s.endsAt ? `<div id="tv-mafia-clock" class="tv-clock">${mafiaClockText(s.endsAt)}</div>` : '';
    const people = `<div class="tv-strip-inline">${(s.alive || []).map(id => `<span class="tv-chip">${escapeHTML(nameOf(id))}</span>`).join('')}${(s.out || []).map(o => `<span class="tv-chip is-away">${MAFIA_ICONS[o.role] || ''} ${escapeHTML(o.name)}</span>`).join('')}</div>`;
    if (s.phase === 'roles') {
      return `<div class="tv-center"><div class="tv-big-icon" aria-hidden="true">🎭</div>
        <div class="tv-title">${escapeHTML(t.mafia_roles_intro || '')}</div>
        <div class="tv-note">${escapeHTML(mafiaRoleSummary((s.roster || []).length, s.mode, t))}</div>
        ${moveOn(tvBtn('🌙 ' + (t.mafia_start_night || ''), "roomAct('startNight')"))}</div>`;
    }
    if (s.phase === 'night') {
      // How many have tapped, never who: the names still waiting would be the roles still deciding.
      // «الحارة بتنام» (539): a window goes dark per tap, in an order that is nobody's.
      return mafiaStreetNightHtml(state, t, moveOn(tvBtn(t.mafia_end_night, "roomAct('endNight')", 'ghost')));
    }
    if (s.phase === 'day') {
      // The morning of the same street: the door of whoever left stands open (539).
      return mafiaStreetDayHtml(state, t, people,
        moveOn(tvBtn('🗳️ ' + (t.mafia_vote_now || ''), "roomAct('startVote')") + (state.youAreHost ? tvBtn('+1 ' + (t.meta_min || ''), 'mafiaMoreTime()', 'ghost') : '')));
    }
    if (s.phase === 'voting') {
      return `<div class="tv-vote"><div class="tv-title tv-center-text">🗳️ ${escapeHTML(t.mafia_who_leaves || '')}</div>${people}${tvVoteProgress(state, t)}</div>`;
    }
    if (s.phase === 'dayResult') {
      // One screen, no scrolling: the count per name as chips, not the phone's bars.
      const results = ((mafiaVoteState(state).shared.vote || {}).results || []).filter(r => r.count > 0).sort((a, b) => b.count - a.count);
      const news = mafiaNewsHtml(state, t);
      // The voted-out player's role turns over on its card first; the counts come after it (ideas batch: rooms).
      const st = stageReveal(['mafia-tv-dr', roomDealKey(state), s.day].join('|'), state);
      const after = news.indexOf('spy-reveal__cover') !== -1 ? SPY_REVEAL_MS + 200 : 300;
      return `<div class="tv-vote"><div class="tv-scale">${news}</div>
        <div class="tv-legend">${results.map((r, k) => `<span class="tv-chip${k === 0 ? ' is-done' : ''}"${st.at(after + k * 220, 'pop')}><b class="metric">${r.count}</b> ${escapeHTML(r.label)}</span>`).join('')}</div>${people}
        ${moveOn(tvBtn('🌙 ' + (t.mafia_next_night || ''), "roomAct('startNight')"))}</div>`;
    }
    const endRev = mafiaEndReveal(state, t, true);
    return `<div class="tv-vote"${endRev.st.end(400)}>
      <div class="tv-title tv-center-text"${endRev.st.at(endRev.winAt, 'pop')}>${s.winner === 'town' ? '🏙️ ' + escapeHTML(t.mafia_town_wins || '') : '🕴️ ' + escapeHTML(t.mafia_mafia_wins || '')}</div>
      <div class="mafia-tv-end${(s.story || []).length ? ' has-tale' : ''}"><div class="mafia-final-grid">${endRev.rows}</div>
      <div class="tv-scale">${endRev.st.board(renderScoreboard(s.board), endRev.winAt + 500)}</div>
      ${mafiaTaleHtml(state, t, endRev.st.on ? endRev.winAt + 2200 : 0, 'mafia-tale--tv', endRev.st.at(endRev.winAt + 2200, 'in'))}</div>
      ${host(tvBtn(t.play_again, "roomAct('playAgain', ROOM_GAMES.mafia.startPayload())") + tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost'))}</div>`;
  },
  after(state, rebuilt) {
    const s = state.shared;
    const view = document.getElementById('view-room-tv');
    if (rebuilt && s.phase === 'gameover') mafiaEndRun(view, state);
    if (s.phase === 'gameover') mafiaTaleRun(view, state);
    if (rebuilt && s.phase === 'dayResult') stageRun(view, state);
    if ((s.phase === 'night' || s.phase === 'day') && s.endsAt) mafiaTickClock(s); else mafiaStopClock();
    // The big screen is the table's own voice, so it is the one that reads.
    mafiaNarrate(state, TRANSLATIONS[appState.lang], document.getElementById('view-room-tv'));
  }
};
</script>
