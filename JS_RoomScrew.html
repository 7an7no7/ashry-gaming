<script>
/* ============================================================================
   سكرو — ON SEPARATE PHONES, AND ON THE TV
   ----------------------------------------------------------------------------
   Every hand lies face down in front of everyone, in numbered slots (a slot
   keeps its id for the round; its number closes up when a card leaves the
   hand), and every move is drawn between exact slots: a
   card flying from the deck to the hand of whoever drew it, from slot 2 to the
   pile, from someone's slot 4 to yours. What only one phone may know (the card
   it drew, the two cards it memorised, a peek) is in `state.you`; the rules
   and every value live on the server (the screw branch of RoomGames.js, and
   SkrewCards.js, which both sides load).

   Every move is seen as it happens and then it is the players' to remember,
   as at a real table: each phone animates the events (`shared.events`) it
   hasn't shown yet, in order (skrPlay), the slots a move touched glow with a
   sign for a few seconds (skrFlash), the latest move is written at the top of
   the table, and the log keeps two more. A reload, a late joiner or a phone
   back from the lock screen starts from what is there without replaying it.
   The memory helper (a lobby option, `settings.memoryHelp`) keeps each slot's
   story instead: how its card came and from which slot, who has looked at it
   and a value known from the pile, from the server's `hands[pid][i].h`.

   A move on the phone is chosen, then confirmed: a tap picks a slot (or a
   player), the sticky bar at the foot of the screen says what will happen, and
   ✓ sends it with the turn it was drawn for (`seq: shared.turnSeq`), so a tap
   that lands after the turn moved on is ignored by the server. Someone else's
   card is two steps in the bar (the player's name, then their cards drawn
   big), so twelve players stay a compact table; the table's slots still work.

   The end of a round with الحرامي in the deck is the table's vote
   (phase thiefGuess): every seated phone points at a player, itself included,
   or at "no thief", and may change it until the vote closes. Who has voted is
   public (`shared.thiefVote.voted`), never what; the votes come with the
   results, and the reveal plays them as vote bars, then turns the thief's card
   over, then the hands.
   ========================================================================= */

const SKR_OPTS_KEY = 'ashryScrewOpts';
const SKR_VOTE_KEY = 'ashryScrewVote';
const SKR_ROUNDS = [3, 5, 7];
const SKR_LAPS = [1, 2, 3];
const SKR_CLOCKS = [0, 30, 60];
const SKR_BASRAS = [4, 2];      // the standard deck has 4, the first print 2
const SKR_MEMO_SECS = [0, 5, 10];  // the look at the start of a round: 0 = until each taps "حفظتهم"
const SKR_ADDONS = ['thief', 'sahib', 'mesaharaty', 'oscar'];
const SKR_BY_VALUE = /^(p7|p8|s9|s10)$/;
const SKR_FLY_MS = 440;
const SKR_STEP_MS = SKR_FLY_MS + 90;
const SKR_FULL_PX = 56;             // from this width a card shows its corners and name band
const SKR_NONE = '__none';          // "no thief" as a vote bar's id
const SKR_BOOM_CLOSE = 'closeBoom';  // the host's way past a phone that doesn't pick its بوم card

/** What only this phone holds: the move being chosen, the look already closed, the clock, its vote. */
const skrLocal = { pick: null, pickKey: '', seenClosed: '', clock: null, clockKey: null, slots: {}, eventNs: {}, slotsKey: '', turnMine: false,
  vote: { key: '', choice: undefined, sent: undefined, open: false } };

/**
 * The flights: which events this device has shown, where things were before a
 * redraw, and the slots, seats and pile still glowing from the latest moves
 * (`flash`: key -> { text, from, until }).
 */
const skrFx = { deal: '', lastSeq: 0, watched: '', prevPhase: '', rects: {}, busyUntil: 0, timers: [], held: new Set(), redrawTimer: null, tvSig: '',
  flash: {}, flashTimer: null, wokeAt: 0, lastTurn: null };

/** A new string: the translation when the lead has added it, else the text written here. */
function skrT(key, ar, en, vars) {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || (appState.lang === 'en' ? en : ar);
  // A value that isn't a plain number is isolated (FSI … PDI): an English name
  // or "+20" inside an Arabic line otherwise takes the colon beside it along
  // ("Adam: +20" drew as "+20 :Adam"). Plain numbers stay as they are, or
  // "{n}/{m}" would read backwards.
  if (vars) Object.keys(vars).forEach(k => {
    const v = vars[k] === undefined || vars[k] === null ? '' : String(vars[k]);
    s = s.split('{' + k + '}').join(v && !/^\d+$/.test(v) ? '⁨' + v + '⁩' : v);
  });
  return s;
}

/* --- the host's options ------------------------------------------------------ */

function skrOpts() {
  const o = { edition: 'classic', groups: ['base'], teams: false, rounds: 5, screwFromLap: 2, turnClock: 0, suddenDeath: false, basraCount: 4, memoryHelp: false, memorizeSecs: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(SKR_OPTS_KEY) || 'null') || {};
    if (saved.edition === 'custom' || SKREW_EDITIONS[saved.edition]) o.edition = saved.edition;
    if (Array.isArray(saved.groups)) o.groups = ['base'].concat(SKR_ADDONS.filter(g => saved.groups.indexOf(g) !== -1));
    if (typeof saved.teams === 'boolean') o.teams = saved.teams;
    if (SKR_ROUNDS.indexOf(saved.rounds) !== -1) o.rounds = saved.rounds;
    if (SKR_LAPS.indexOf(saved.screwFromLap) !== -1) o.screwFromLap = saved.screwFromLap;
    if (SKR_CLOCKS.indexOf(saved.turnClock) !== -1) o.turnClock = saved.turnClock;
    if (typeof saved.suddenDeath === 'boolean') o.suddenDeath = saved.suddenDeath;
    if (typeof saved.memoryHelp === 'boolean') o.memoryHelp = saved.memoryHelp;
    if (SKR_MEMO_SECS.indexOf(saved.memorizeSecs) !== -1) o.memorizeSecs = saved.memorizeSecs;
    if (SKR_BASRAS.indexOf(saved.basraCount) !== -1) o.basraCount = saved.basraCount;
  } catch (e) {}
  return o;
}

/**
 * How many cards a deck of these options holds: 59 for the standard deck with
 * four بصرة, 57 with the first print's two; doubled beyond six players, with one thief all the
 * same. Counted from skrewDeck, so a SkrewCards.js that doesn't take the
 * بصرة count yet still gives the right number.
 */
function skrDeckSize(groups, decks, basraCount) {
  if (typeof skrewDeck !== 'function') return 0;
  const times = Math.max(1, Math.min(2, Number(decks) || 1));
  let cards = [];
  try { cards = skrewDeck(groups, times, { basraCount: basraCount }) || []; } catch (e) { cards = []; }
  const count = (id) => cards.filter(c => c === id).length;
  let size = cards.length;
  const thieves = count('thief');
  if (thieves > 1) size -= thieves - 1;
  const basras = count('basra');
  const want = (SKR_BASRAS.indexOf(basraCount) !== -1 ? basraCount : 4) * times;
  if (basras && basras !== want) size += want - basras;
  return size;
}

function skrGroupsOf(o) {
  if (o.edition === 'custom') return ['base'].concat(SKR_ADDONS.filter(g => o.groups.indexOf(g) !== -1));
  return (SKREW_EDITIONS[o.edition] || SKREW_EDITIONS.classic).groups.slice();
}

const skrTeamsAllowed = (n) => n === 4 || n === 6 || n === 8;

function setSkrOpt(key, value) {
  const o = skrOpts();
  if (key === 'edition') {
    o.edition = value;
    // صاحب صاحبه is a partners' game; the others start as everyone for themselves.
    o.teams = !!(SKREW_EDITIONS[value] && SKREW_EDITIONS[value].teams);
    if (value === 'custom' && o.groups.length < 2) o.groups = ['base'];
  } else if (key === 'group') {
    const on = o.groups.indexOf(value) !== -1;
    o.groups = on ? o.groups.filter(g => g !== value) : o.groups.concat([value]);
  } else if (key === 'teams' || key === 'suddenDeath' || key === 'memoryHelp') {
    o[key] = !!value;
  } else {
    o[key] = Number(value);
  }
  try { localStorage.setItem(SKR_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  // A laptop hosting from the TV draws the options in its own frame.
  const tvEl = document.getElementById('view-room-tv');
  if (tvEl) delete tvEl.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

/* --- the cards --------------------------------------------------------------- */

/** What a card is, for the words about it (skrCardDesign says how it is drawn). */
function skrCardInfo(id) {
  const c = typeof SKREW_CARDS !== 'undefined' ? SKREW_CARDS[id] : null;
  if (!c) return null;
  const name = appState.lang === 'en' ? c.en : c.ar;
  let tone = c.kind === 'number' ? 'number' : 'command';
  if (id === 'plus20' || id === 'red25') tone = 'danger';
  if (id === 'green0') tone = 'success';
  if (id === 'minus1') tone = 'gold';
  const valued = c.kind === 'number' || SKR_BY_VALUE.test(id) || tone !== 'command';
  const big = id === 'plus20' ? '+20' : valued ? String(c.value) : (c.icon || name);
  let small = '';
  if (SKR_BY_VALUE.test(id)) small = (c.icon ? c.icon + ' ' : '') + name;
  else if (id === 'red25' || id === 'green0') small = (c.icon ? c.icon + ' ' : '') + name;
  else if (id === 'minus1') small = c.icon || '';
  else if (!valued) small = name;
  return { id: id, card: c, name: name, tone: tone, big: big, small: small, icon: c.icon || '', value: c.value, power: c.power || null, drawn: c.drawn || null };
}

/*
   The card's look (the owner's pick of 17 Sep 2026, "بلوكات ألوان"): the whole
   face in its type's colour, a big white numeral or line icon, the value in
   the corners and the name on a dark band at the bottom - corners and band only
   on the big cards (your hand, the pile, the card in hand); on the table's
   small cards just the numeral or the icon. No emoji on a card: the icons are
   24×24 line drawings, kept here once (skrIcon) and used wherever a power
   stands for its card.
*/
const SKR_ICONS = {
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>',
  swap: '<path d="M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4"/>',
  basra: '<path d="M12 3v9M8 8.5l4 4 4-4M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/>',
  around: '<path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/><circle cx="12" cy="12" r="2"/>',
  screw: '<path d="M7 3.5h10l-1.5 3h-7z"/><path d="M9.5 6.5v11l2.5 3.5 2.5-3.5v-11"/><path d="M9.5 9.2l5 1.4M9.5 12.2l5 1.4M9.5 15.2l5 1.4"/>',
  mask: '<path d="M3 9.5c2.5-2.5 6-2.8 9-1 3-1.8 6.5-1.5 9 1-.5 4.5-4 6-6.5 4.2-1-.8-1.7-1.2-2.5-1.2s-1.5.4-2.5 1.2C7 15.5 3.5 14 3 9.5z"/><path d="M7.3 10.6h2.2M14.5 10.6h2.2"/>',
  gift: '<rect x="3.5" y="9" width="17" height="11" rx="1.5"/><path d="M3.5 13h17M12 9v11M12 9c-1.2-3-5-4-5-1.4S12 9 12 9zm0 0c1.2-3 5-4 5-1.4S12 9 12 9z"/>',
  eyeswap: '<path d="M2.5 9s2.6-4.5 7.5-4.5S17.5 9 17.5 9 14.9 13.5 10 13.5 2.5 9 2.5 9z"/><circle cx="10" cy="9" r="2"/><path d="M8 19h12M17.5 16.5 20 19l-2.5 2.5"/>',
  paddle: '<circle cx="9" cy="9" r="6"/><path d="M13.3 13.3 20 20"/><circle cx="19" cy="5" r="1.6"/>',
  ball: '<circle cx="12" cy="12" r="8"/><path d="M4.6 9.5c4 1.6 10.8 1.6 14.8 0M4.6 14.5c4-1.6 10.8-1.6 14.8 0"/>',
  star: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  drum: '<ellipse cx="12" cy="9" rx="8" ry="3"/><path d="M4 9v7c0 1.7 3.6 3 8 3s8-1.3 8-3V9M5 3.5l4 4M19 3.5l-4 4"/>',
  cannon: '<path d="M3 13.5 15 8l2.5 4.6-12 5.4z"/><circle cx="7.5" cy="18" r="2.8"/><path d="M19.5 7l2-1.2M20 10h2.3M18.5 4.2l.9-1.7"/>',
  bowl: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 8c0-1.6 1.5-1.6 1.5-3.4M13.5 8c0-1.6 1.5-1.6 1.5-3.4M8 21h8"/>',
  scream: '<circle cx="12" cy="12.5" r="7.5"/><ellipse cx="12" cy="15.5" rx="2" ry="2.8"/><path d="M9 10h.01M15 10h.01M3 5l2 1.5M21 5l-2 1.5M12 1.5V3"/>',
  bomb: '<circle cx="10.5" cy="14" r="6.5"/><path d="M15 9.5l2.5-2.5M18.5 3v2M21 5.5h-2M20.3 3.7l-1.4 1.4"/>',
  ring: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M6 6l3.1 3.1M18 6l-3.1 3.1M6 18l3.1-3.1M18 18l-3.1-3.1"/>'
};

/** One line icon from the set, as inline SVG in the text colour. */
function skrIcon(name, cls) {
  const d = SKR_ICONS[name];
  return d ? `<svg class="skr-icon${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>` : '';
}

/*
   Each card: its colour group (the --skr-c-* tokens in Style.html section 16),
   its icon, and whether the icon is the card's big face (a power card) or a
   small sign in the corner beside its numeral (7-10).
*/
const SKR_DESIGN = {
  n1: ['low'], n2: ['low'], n3: ['low'], n4: ['mid'], n5: ['mid'], n6: ['mid'],
  p7: ['look', 'eye'], p8: ['look', 'eye'], s9: ['look', 'search'], s10: ['look', 'search'],
  swap: ['act', 'swap', true], basra: ['act', 'basra', true], around: ['act', 'around', true],
  plus20: ['bad'], red25: ['bad', 'screw', true], green0: ['good', 'screw', true], minus1: ['good'],
  thief: ['thief', 'mask', true], takeOnly: ['thief', 'gift', true], seeSwap: ['thief', 'eyeswap', true],
  ping: ['sahib', 'paddle', true], pong: ['sahib', 'ball', true], asYouLike: ['sahib', 'star', true],
  mesaharaty: ['mesa', 'drum', true], cannon: ['mesa', 'cannon', true], khoshaf: ['mesa', 'bowl', true],
  scream: ['oscar', 'scream', true], boom: ['oscar', 'bomb', true], lifeJacket: ['oscar', 'ring', true]
};

/** How a card is drawn: colour group, icon, whether the icon is its face, its corner value and its name. */
function skrCardDesign(id) {
  const c = typeof SKREW_CARDS !== 'undefined' ? SKREW_CARDS[id] : null;
  if (!c) return null;
  const d = SKR_DESIGN[id] || [c.kind === 'number' ? 'mid' : 'act', null, false];
  const label = id === 'plus20' ? '+20' : id === 'minus1' ? '−1' : c.copy ? '=' : String(c.value);
  let name = c.kind === 'number' ? '' : appState.lang === 'en' ? c.en : c.ar;
  if (id === 'plus20') name = skrT('skr_card_penalty', 'عقاب', 'Penalty');
  if (id === 'minus1') name = skrT('skr_card_minus1', 'سالب واحد', 'Minus one');
  return { group: d[0], icon: d[1] || null, iconFace: !!(d[2] && d[1]), label: label, name: name };
}

/** A card in words, for the log and the prompts: "5", "9 🔍", "🔄 خد وهات". */
function skrCardLabel(id) {
  const info = skrCardInfo(id);
  if (!info) return '';
  if (info.card.kind === 'number') return String(info.value);
  if (SKR_BY_VALUE.test(id)) return info.value + (info.icon ? ' ' + info.icon : '');
  if (id === 'plus20' || id === 'minus1') return info.big;
  return (info.icon ? info.icon + ' ' : '') + info.name;
}

/**
 * One card, everywhere: a slot, the pile, the TV, a flight. `id` null is the
 * back (violet, dotted, the Ashry mark on the big ones and "A." on the small).
 * `size` is xs, sm, md (the table's: the numeral or icon only), lg, xl (your
 * hand, the pile, the card in hand: with corners and the name band), or fly
 * (a flight's own width, `full` for a big one). `known` (a card id) is the
 * memory helper's value from the pile, a white chip on the back; `value`
 * replaces the corner value (a life jacket's counted value at the reveal).
 */
function skrCardHtml(id, opts) {
  const o = opts || {};
  const size = o.size || 'md';
  const full = size === 'lg' || size === 'xl' || (size === 'fly' && !!o.full);
  const d = id ? skrCardDesign(id) : null;
  if (!d) {
    const known = o.known ? skrCardDesign(o.known) : null;
    const inner = known
      ? `<b class="skr-card__known skr-c--${known.group}">${known.iconFace ? skrIcon(known.icon) : escapeHTML(known.label)}</b>`
      : full ? '<svg class="skr-card__mark" aria-hidden="true"><use href="#ashry-mark"/></svg>'
      : size === 'xs' ? '' : '<b class="skr-card__a">A<i>.</i></b>';
    return `<span class="skr-card skr-card--${size} skr-card--back${full ? ' is-full' : ''}" aria-hidden="true">${inner}</span>`;
  }
  const label = o.value !== undefined && o.value !== null ? String(o.value).replace(/^-/, '−') : d.label;
  const art = d.iconFace
    ? skrIcon(d.icon)
    : `<b class="skr-card__big${Array.from(d.label).length > 2 ? ' skr-card__big--long' : ''}">${escapeHTML(d.label)}</b>`;
  const corners = full
    ? `<span class="skr-card__mini">${escapeHTML(label)}${d.icon && !d.iconFace ? skrIcon(d.icon) : ''}</span><span class="skr-card__mini skr-card__mini--end">${escapeHTML(label)}</span>`
    : '';
  const band = full && d.name ? `<span class="skr-card__name">${escapeHTML(d.name)}</span>` : '';
  return `<span class="skr-card skr-card--${size} skr-card--face skr-c--${d.group}${full ? ' is-full' : ''}${band ? ' has-name' : ''}" role="img" aria-label="${escapeHTML(d.name ? d.name + ' (' + label + ')' : label)}">`
    + `${corners}<span class="skr-card__art">${art}</span>${band}</span>`;
}

const skrEmptyCard = (size) => `<span class="skr-card skr-card--${size || 'md'} skr-card--empty" aria-hidden="true"></span>`;

/** A power in words, from the card that carries it: its emoji (for text), its line icon (for the page) and name. */
function skrPowerInfo(power) {
  const ids = typeof SKREW_CARDS !== 'undefined' ? Object.keys(SKREW_CARDS) : [];
  const id = ids.find(k => SKREW_CARDS[k].power === power) || (ids.indexOf(power) !== -1 ? power : null);
  const c = id ? SKREW_CARDS[id] : null;
  const d = id ? skrCardDesign(id) : null;
  return c ? { id: id, icon: c.icon || '', svg: d && d.icon ? skrIcon(d.icon) : '', group: d ? d.group : 'act', name: appState.lang === 'en' ? c.en : c.ar }
    : { id: null, icon: '', svg: '', group: 'act', name: String(power || '') };
}

/** A power as a small chip in its card's colour, with its line icon: for the bars, instead of an emoji. */
function skrPowerChip(power, iconName) {
  const p = skrPowerInfo(power);
  const svg = iconName ? skrIcon(iconName) : p.svg;
  return `<span class="skr-chip skr-c--${iconName === 'mask' ? 'thief' : p.group}" aria-hidden="true">${svg}</span>`;
}

/** turn.power as a power name, whether the server sent the power or the card. */
function skrPowerOf(value) {
  if (!value) return null;
  const c = typeof SKREW_CARDS !== 'undefined' ? SKREW_CARDS[value] : null;
  return c && c.power ? c.power : value;
}

/* --- who and where ----------------------------------------------------------- */

function skrName(state, pid, plain) {
  if (!pid) return '';
  if (!plain && pid === Room.me && !state.youAreScreen) {
    return (TRANSLATIONS[appState.lang] || {}).vote_you || (appState.lang === 'en' ? 'You' : 'أنت');
  }
  const s = state.shared || {};
  const p = (state.players || []).find(x => x.id === pid) || (s.board || []).find(x => x.id === pid);
  return p && p.name ? p.name : '…';
}

const skrOrder = (state) => ((state.shared || {}).order || []);
const skrInGame = (state) => !state.youAreScreen && skrOrder(state).indexOf(Room.me) !== -1;

function skrTeamOf(s, pid) {
  const teams = s && s.teams;
  if (!Array.isArray(teams)) return -1;
  return teams.findIndex(team => Array.isArray(team) && team.indexOf(pid) !== -1);
}

/** A seat's round avatar: the player's first letter, in the side's colour in teams, else gold. */
function skrAvatarHtml(state, pid) {
  const s = state.shared || {};
  const k = skrTeamOf(s, pid);
  const first = Array.from(String(skrName(state, pid, true) || '').trim())[0] || '?';
  return `<span class="skr-avatar${k === -1 ? '' : ' skr-avatar--' + k}" aria-hidden="true">${escapeHTML(first.toLocaleUpperCase())}</span>`;
}

function skrTeamDot(s, pid) {
  const k = skrTeamOf(s, pid);
  return k === -1 ? '' : `<span class="skr-dot skr-dot--${k}" aria-hidden="true"></span>`;
}

/**
 * Whose hands a سكرو protects from being swapped, given to or fired at, from
 * throwing a card to بوم and from the scream's re-deal: the caller, and in teams the caller's
 * whole side.
 */
function skrProtected(s) {
  if (!s || !s.caller) return [];
  const k = skrTeamOf(s, s.caller);
  return k === -1 ? [s.caller] : (s.teams[k] || []).slice();
}

/**
 * Remembers every slot's number for this deal, so an event about a slot that
 * has gone still reads; and each event's slot numbers as they were when this
 * phone first saw it: a hand closes up when a card leaves it (the server
 * numbers slots by position), and "card 3" in the log must stay the card it was.
 */
function skrRememberSlots(state) {
  const s = state.shared || {};
  const key = state.code + '|' + (s.dealId || '');
  if (skrLocal.slotsKey !== key) { skrLocal.slotsKey = key; skrLocal.slots = {}; skrLocal.eventNs = {}; }
  const hands = s.hands || {};
  Object.keys(hands).forEach(pid => (hands[pid] || []).forEach((h, i) => { skrLocal.slots[h.id] = { pid: pid, n: h.n || i + 1 }; }));
  skrDealEvents(s.events).forEach(e => {
    if (!e || skrLocal.eventNs[e.seq]) return;
    const ns = {};
    const note = (slot) => { if (slot) { const n = skrSlotN(state, slot); if (n !== null) ns[slot] = n; } };
    note(e.slot); note(e.slot2);
    (e.picks || []).forEach(pk => note(pk && pk.slot));
    (e.own || []).forEach(note);
    skrLocal.eventNs[e.seq] = ns;
  });
}

function skrSlotN(state, slot, seq) {
  if (typeof slot === 'number') return slot;
  const kept = seq !== undefined && skrLocal.eventNs && skrLocal.eventNs[seq];
  if (kept && kept[slot] !== undefined) return kept[slot];
  const hands = (state.shared || {}).hands || {};
  for (const pid of Object.keys(hands)) {
    const i = (hands[pid] || []).findIndex(x => x.id === slot);
    if (i !== -1) return hands[pid][i].n || i + 1;
  }
  const mem = skrLocal.slots[slot];
  return mem ? mem.n : null;
}

/** "كارتك ٢", "كارت ٤ بتاع سارة", or just "كارت ٣" when it is the actor's own. */
function skrSlotRef(state, owner, slot, actor, seq) {
  const n = skrSlotN(state, slot, seq);
  const num = n === null || n === undefined ? '' : String(n);
  if (owner && owner === Room.me && !state.youAreScreen) return skrT('skr_slot_yours', 'كارتك {n}', 'your card {n}', { n: num }).trim();
  if (!owner || owner === actor) return skrT('skr_slot', 'كارت {n}', 'card {n}', { n: num }).trim();
  return skrT('skr_slot_of', 'كارت {n} بتاع {name}', "{name}'s card {n}", { n: num, name: skrName(state, owner) }).trim();
}

/** The events of the deal on the table (the list is the last 40, maybe across deals). */
function skrDealEvents(events) {
  const list = events || [];
  let i = -1;
  for (let k = list.length - 1; k >= 0; k--) { if (list[k] && list[k].type === 'deal') { i = k; break; } }
  return i === -1 ? list.slice() : list.slice(i);
}

/**
 * What the last events still say about each slot: 👁️ who looked, 🔄 who it
 * was swapped with, 🎁 who gave it - the memory helper's stand-in for a
 * server that doesn't keep a slot's story (`h`). A move that puts a new card
 * in a slot wipes its marks; a look adds to them.
 */
function skrMarks(state) {
  const s = state.shared || {};
  const marks = {};
  const look = (slot, by) => {
    if (!slot) return;
    const list = marks[slot] = (marks[slot] || []);
    if (!list.some(m => m.k === 'look' && m.by === by)) list.push({ k: 'look', by: by });
  };
  const set = (slot, mark) => { if (slot) marks[slot] = mark ? [mark] : []; };
  skrDealEvents(s.events).forEach(e => {
    switch (e.type) {
      case 'peekOwn': look(e.slot, e.pid); break;
      case 'spyOther': look(e.slot, e.pid); break;
      case 'allAround':
        (e.picks || []).forEach(p => look(p && p.slot, e.pid));
        (e.own || []).forEach(slot => look(slot, e.pid));
        break;
      case 'blindSwap':
        set(e.slot, { k: 'swap', by: e.pid, with: e.target });
        set(e.slot2, { k: 'swap', by: e.pid, with: e.pid });
        break;
      case 'seeSwap':
        if (e.swapped && e.slot2) {
          set(e.slot, { k: 'swap', by: e.pid, with: e.pid });
          set(e.slot2, { k: 'swap', by: e.pid, with: e.target });
        } else {
          look(e.slot, e.pid);
        }
        break;
      case 'give': set(e.slot, null); set(e.slot2, { k: 'give', by: e.pid }); break;
      case 'keep': case 'takePile': case 'match': case 'basra': case 'pong': case 'penalty': case 'boom': case 'boomThrow':
        set(e.slot, null); break;
      case 'scream':
        // Every unprotected hand gathered and dealt again: nobody knows those cards any more.
        Object.keys(marks).forEach(slot => { delete marks[slot]; });
        break;
    }
  });
  return marks;
}

/* --- the memory helper: what the table has seen happen to each card ----------------- */

/**
 * Most of سكرو is remembering what the others replaced and drew, so by default
 * the table keeps nothing: a move is shown as it happens (a flight, the slots
 * glowing for a moment, the latest move written at the top) and then it is the
 * players' to remember. `memoryHelp` (a lobby option, for kids or a casual
 * table) keeps it: every slot's story, each seat's last move, and a value
 * known from the pile written on the card's back.
 */
const skrHelp = (state) => !!(((state.shared || {}).settings || {}).memoryHelp);

const SKR_HOW_ICON = { deck: '🆕', khoshaf: '🆕', pile: '⬆️', swap: '🔄', give: '🎁', penalty: '➕', scream: '😱' };

/** The first move of a turn: counting these after a move says how many turns ago it was. */
const SKR_TURN_STARTS = ['draw', 'takePile', 'match', 'screw', 'pass', 'skip'];

/**
 * A slot's story, as the server keeps it on the slot (`h`: how its card
 * arrived, by whom, from which slot, when, a card known from the pile, who has
 * seen it) - or, from a server without it, what the last events still say.
 */
function skrHistory(state, h, marks) {
  const x = h && h.h && typeof h.h === 'object' ? h.h : null;
  if (x) {
    return {
      how: x.how || 'deal',
      by: x.by || null,
      from: x.from && x.from.pid ? { pid: x.from.pid, slot: x.from.slot || null } : null,
      at: typeof x.at === 'number' ? x.at : null,
      known: x.known || null,
      looks: Array.isArray(x.looks) ? x.looks.filter((p, i, a) => p && a.indexOf(p) === i) : []
    };
  }
  const list = ((marks || {})[h && h.id]) || [];
  const swap = list.find(m => m.k === 'swap');
  const give = list.find(m => m.k === 'give');
  return {
    how: swap ? 'swap' : give ? 'give' : 'deal',
    by: (swap || give || {}).by || null,
    from: swap ? { pid: swap.with, slot: null } : give ? { pid: give.by, slot: null } : null,
    at: null,
    known: null,
    looks: list.filter(m => m.k === 'look').map(m => m.by)
  };
}

/** A slot's story in words: how its card came, and (withLooks) who has seen it. */
function skrHistoryWords(state, hist, withLooks) {
  const out = [];
  const from = hist.from;
  const fromRef = from && from.slot ? skrSlotRef(state, from.pid, from.slot, null) : '';
  switch (hist.how) {
    case 'deck': out.push(skrT('skr_h_deck', '🆕 من الورق', '🆕 From the deck')); break;
    case 'khoshaf': out.push(skrT('skr_h_khoshaf', '🆕 من الخشاف', '🆕 From the Khoshaf')); break;
    case 'pile': out.push(hist.known
      ? skrT('skr_h_pile', '⬆️ {card} من الأرض', '⬆️ {card} from the pile', { card: skrCardLabel(hist.known) })
      : skrT('skr_h_pile_plain', '⬆️ من الأرض', '⬆️ From the pile')); break;
    case 'penalty': out.push(skrT('skr_h_penalty', '➕ كارت عقاب', '➕ A penalty card')); break;
    case 'swap':
      if (fromRef) out.push(skrT('skr_h_swap', '🔄 من {ref}', '🔄 From {ref}', { ref: fromRef }));
      else if (from && from.pid === Room.me && !state.youAreScreen) out.push(skrT('skr_mark_swap_you', '🔄 اتبدّل مع كارت من كروتك', '🔄 Swapped with one of your cards'));
      else out.push(skrT('skr_mark_swap', '🔄 اتبدّل مع {name}', '🔄 Swapped with {name}', { name: skrName(state, (from && from.pid) || hist.by) }));
      break;
    case 'give': out.push(skrT('skr_mark_give', '🎁 جه من {name}', '🎁 Given by {name}', { name: skrName(state, (from && from.pid) || hist.by) })); break;
    case 'scream': out.push(skrT('skr_h_scream_deal', '😱 اتوزّع من جديد بعد الصرخة', '😱 Dealt again after the scream')); break;
  }
  if (hist.known && hist.how !== 'pile') out.push('💡 ' + skrCardLabel(hist.known));
  if (withLooks && hist.looks.length) {
    out.push(skrT('skr_mark_look', '👁️ شافه: {names}', '👁️ Seen by {names}', { names: hist.looks.map(p => skrName(state, p)).join(appState.lang === 'en' ? ', ' : '، ') }));
  }
  return out;
}

/** The corner sign of a slot's story: how its card came, and 👁️ with a count when more than one has looked. */
function skrHistoryIcon(hist) {
  const how = SKR_HOW_ICON[hist.how] || '';
  const looks = hist.looks.length ? '👁️' + (hist.looks.length > 1 ? hist.looks.length : '') : '';
  return how + looks;
}

/** "3 turns ago", counted in turn starts after the move; '' when the events no longer reach back that far. */
function skrTurnsAgo(state, at) {
  if (typeof at !== 'number') return '';
  const events = skrDealEvents((state.shared || {}).events);
  const first = events[0];
  if (!first || (first.type !== 'deal' && (Number(first.seq) || 0) > at)) return '';
  const n = events.filter(e => e && (Number(e.seq) || 0) > at && SKR_TURN_STARTS.indexOf(e.type) !== -1).length;
  if (!n) return skrT('skr_h_now', 'دلوقتي', 'just now');
  if (n === 1) return skrT('skr_h_ago_1', 'من دور واحد', '1 turn ago');
  if (n === 2) return skrT('skr_h_ago_2', 'من دورين', '2 turns ago');
  if (n <= 10) return skrT('skr_h_ago', 'من {n} أدوار', '{n} turns ago', { n: n });
  return skrT('skr_h_ago_many', 'من {n} دور', '{n} turns ago', { n: n });
}

/**
 * A move in a few signs, for the line under a seat's name: "⬆️ 2 من الأرض ←
 * كارت 4", "🔄 كارت 1 ⇄ كارت 3 بتاع Adam". Only numbers and cards between the
 * signs, so the lines need no translation of their own but one.
 */
function skrMoveShort(state, e) {
  const sign = (text, vars) => skrT('', text, text.replace(/←/g, '→'), vars);
  const ref = (owner, slot) => skrSlotRef(state, owner, slot, e.pid, e.seq);
  const card = e.card ? skrCardLabel(e.card) : '';
  switch (e.type) {
    case 'draw': return '🂠';
    case 'keep': return sign('🆕 {x}', { x: ref(e.pid, e.slot) });
    case 'discard': return sign('⬇️ {card}', { card: card });
    case 'takePile': return skrT('skr_seat_take', '⬆️ {card} من الأرض ← {x}', '⬆️ {card} from the pile → {x}', { card: card, x: ref(e.pid, e.slot) });
    case 'match': return e.ok ? sign('🎯 {card} ✓', { card: card }) : sign('❌ {x} ({card})', { x: ref(e.pid, e.slot), card: card });
    case 'penalty': return sign('➕ {x}', { x: ref(e.pid, e.slot) });
    case 'screw': return '📣 ' + skrT('skr_screw', 'سكرو!', 'Screw!');
    case 'peekOwn': return sign('👁️ {x}', { x: ref(e.pid, e.slot) });
    case 'spyOther': return sign('🔍 {x}', { x: ref(e.target, e.slot) });
    case 'blindSwap': return sign('🔄 {x} ⇄ {y}', { x: ref(e.pid, e.slot), y: ref(e.target, e.slot2) });
    case 'basra': return e.ok === false ? sign('🗑️ ❌ {x} ({card})', { x: ref(e.pid, e.slot), card: card }) : sign('🗑️ {card}', { card: card });
    case 'allAround': return '🔁 👁️ ×' + ((e.picks || []).length + (e.own || []).length);
    case 'give': return sign('🎁 {x} ← {b}', { x: ref(e.pid, e.slot), b: skrName(state, e.target) });
    case 'seeSwap': return e.swapped
      ? sign('🕵️ {x} ⇄ {y}', { x: ref(e.target, e.slot), y: ref(e.pid, e.slot2) })
      : sign('🕵️ 👁️ {x}', { x: ref(e.target, e.slot) });
    case 'ping': return sign('🏓 ← {b}', { b: skrName(state, e.target) });
    case 'pong': return e.ok ? '🎾 ✓' : '🎾 ❌';
    case 'wakeUp': return '🥁';
    case 'cannon': return sign('💥 ← {b}', { b: skrName(state, e.target) });
    case 'khoshaf': return '🥣';
    case 'scream': return '😱';
    case 'boom': return '💣';
    case 'boomThrow': return sign('💥 {card}', { card: card });
    case 'pass': case 'skip': return '⏭️';
    case 'finish': return '🏁';
  }
  return '';
}

/** A player's last move this round, in signs ('' when the events no longer hold one). */
function skrLastMove(state, pid) {
  const events = skrDealEvents((state.shared || {}).events);
  for (let i = events.length - 1; i >= 0; i--) {
    const e = events[i];
    if (!e || e.pid !== pid) continue;
    const text = skrMoveShort(state, e);
    if (text) return text;
  }
  return '';
}

/* --- the log ----------------------------------------------------------------- */

/** One event as a line anyone at the table can read. Noun phrases in Arabic: a name doesn't say خرج or خرجت. */
function skrEventText(state, e) {
  if (!e || !e.type) return '';
  const A = skrName(state, e.pid);
  const B = skrName(state, e.target);
  const card = e.card ? skrCardLabel(e.card) : '';
  const ref = (owner, slot) => (slot === undefined || slot === null ? '' : skrSlotRef(state, owner, slot, e.pid, e.seq));
  const T = (key, ar, en, vars) => skrT(key, ar, en, Object.assign({ a: A, b: B, card: card }, vars || {}));
  switch (e.type) {
    case 'deal': return T('skr_log_deal', '🃏 الجولة {n} اتوزّعت', '🃏 Round {n} was dealt', { n: e.round || (state.shared || {}).round || '' });
    case 'reshuffle': return T('skr_log_reshuffle', '🔀 الورق خلص: الأرض اتخلطت ورجعت ورق', '🔀 The deck ran out: the pile was shuffled into a new deck');
    case 'draw': return T('skr_log_draw', '🂠 {a}: سحب من الورق', '🂠 {a} drew from the deck');
    case 'keep': return !e.card
      ? T('skr_log_keep_new', '🔁 {a}: الكارت الجديد بقى {x}', '🔁 {a} kept the new card as {x}', { x: ref(e.pid, e.slot) })
      : T('skr_log_keep', '🔁 {a}: الكارت الجديد مكان {x}، و{card} على الأرض', '🔁 {a} kept the new card as {x}; {card} went on the pile', { x: ref(e.pid, e.slot) });
    case 'discard': return T('skr_log_discard', '⬇️ {a}: {card} على الأرض', '⬇️ {a} threw {card} on the pile');
    case 'takePile': return T('skr_log_take', '⬆️ {a}: {card} من الأرض مكان {x}', '⬆️ {a} took {card} from the pile as {x}', { x: ref(e.pid, e.slot) });
    case 'match': return e.ok
      ? T('skr_log_match_ok', '🎯 {a}: {x} ({card}) زيّ اللي على الأرض ✓', '🎯 {a} matched {x} ({card}) ✓', { x: ref(e.pid, e.slot) })
      : T('skr_log_match_back', '❌ {a}: {x} ({card}) مش زيّه، ورجع مقلوب، وكارت عقاب في خانة جديدة', "❌ {a}: {x} ({card}) didn't match; it went back face down, and a penalty card joined the hand", { x: ref(e.pid, e.slot) });
    case 'penalty': return T('skr_log_penalty', '➕ {a}: كارت عقاب بقى {x}', '➕ {a} took a penalty card as {x}', { x: ref(e.pid, e.slot) });
    case 'screw': return T('skr_log_screw', '📣 {a}: سكرو!', '📣 {a} called Screw!');
    case 'peekOwn': return T('skr_log_peek', '👁️ {a}: بصّة على {x}', '👁️ {a} looked at {x}', { x: ref(e.pid, e.slot) });
    case 'spyOther': return T('skr_log_spy', '🔍 {a}: بصّة على {x}', '🔍 {a} looked at {x}', { x: ref(e.target, e.slot) });
    case 'blindSwap': return T('skr_log_swap', '🔄 {a}: {x} ⇄ {y}', '🔄 {a} swapped {x} ⇄ {y}', { x: ref(e.pid, e.slot), y: ref(e.target, e.slot2) });
    case 'basra': return e.ok === false
      ? T('skr_log_basra_back', '🗑️ {a}: {x} ({card}) مينفعش يترمي، ورجع مقلوب', "🗑️ {a}: {x} ({card}) can't be thrown; it went back face down", { x: ref(e.pid, e.slot) })
      : T('skr_log_basra', '🗑️ {a}: {x} ({card}) على الأرض', '🗑️ {a} threw {x} ({card}) on the pile', { x: ref(e.pid, e.slot) });
    case 'allAround': {
      const refs = (e.picks || []).map(p => ref(p && p.target, p && p.slot)).concat((e.own || []).map(slot => ref(e.pid, slot))).filter(Boolean);
      return T('skr_log_around', '🔁 {a}: بصّة على {x}', '🔁 {a} looked at {x}', { x: refs.join(appState.lang === 'en' ? ', ' : '، ') });
    }
    case 'give': return T('skr_log_give', '🎁 {a}: {x} راح لـ{b}', '🎁 {a} gave {x} to {b}', { x: ref(e.pid, e.slot) });
    case 'seeSwap': return e.swapped
      ? T('skr_log_seeswap', '🕵️ {a}: بصّة على {x} وتبديل مع {y}', '🕵️ {a} looked at {x} and swapped it with {y}', { x: ref(e.target, e.slot), y: ref(e.pid, e.slot2) })
      : T('skr_log_seeleave', '🕵️ {a}: بصّة على {x} من غير تبديل', '🕵️ {a} looked at {x} and left it', { x: ref(e.target, e.slot) });
    case 'asYouLike': {
      const p = skrPowerInfo(e.as);
      return T('skr_log_asyoulike', '🃏 {a}: على كيفك ← {power}', '🃏 {a}: as you like → {power}', { power: (p.icon ? p.icon + ' ' : '') + p.name });
    }
    case 'ping': return T('skr_log_ping', '🏓 {a}: بينج! الدور راح على {b}', '🏓 {a}: Ping! {b} loses a turn');
    case 'pong': return e.ok
      ? T('skr_log_pong_ok', '🎾 {a}: بونج ✓', '🎾 {a}: Pong ✓')
      : e.card
        ? T('skr_log_pong_back', '❌ {a}: {x} ({card}) مش بونج، ورجع مقلوب، وكارت عقاب في خانة جديدة', "❌ {a}: {x} ({card}) wasn't Pong; it went back face down, and a penalty card joined the hand", { x: ref(e.pid, e.slot) })
        : T('skr_log_pong_no', '❌ {a}: {x} مش بونج، وكارت عقاب', "❌ {a}: {x} wasn't Pong, a penalty card", { x: ref(e.pid, e.slot) });
    case 'wakeUp': return T('skr_log_wakeup', '🥁 {a}: المسحراتي! الكروت هتتكشف', '🥁 {a}: El-Mesaharaty! Cards up');
    case 'cannon': return T('skr_log_cannon', '💥 {a}: المدفع على {b}، وكروت {b} مكشوفة للكل', '💥 {a} fired the cannon at {b}: that hand is face up');
    case 'khoshaf': return T('skr_log_khoshaf', '🥣 {a}: الخشاف، 4 كروت من الورق', '🥣 {a}: Khoshaf, four cards from the deck');
    case 'scream': {
      // Every unprotected hand gathered, shuffled and dealt out again face down, as many as each had.
      const n = Object.keys(e.counts || {}).reduce((sum, pid) => sum + (Number(e.counts[pid]) || 0), 0);
      return e.pid
        ? T('skr_log_scream_deal', '😱 {a}: صرخة أوسكار! الكروت اتلمّت واتخلطت واتوزّعت من جديد مقلوبة ({n})', "😱 {a}: Oscar's scream! The cards were gathered, shuffled and dealt out again face down ({n})", { n: n })
        : T('skr_log_scream_deal_all', '😱 صرخة أوسكار: الكروت اتلمّت واتخلطت واتوزّعت من جديد مقلوبة ({n})', "😱 Oscar's scream: the cards were gathered, shuffled and dealt out again face down ({n})", { n: n });
    }
    case 'skip': return T('skr_log_skip', '⏭️ الدور عدّى: {a}', '⏭️ Turn skipped: {a}');
    case 'boom': return T('skr_log_boom_all', '💣 {a}: بوم! كل واحد تاني بيرمي كارت من كروته', '💣 {a}: Boom! Everyone else throws one of their own cards');
    case 'boomPick': return T('skr_log_boom_pick', '💣 اختيار {a} اتسجّل', '💣 {a} picked a card', { a: skrName(state, e.pid, true) });
    case 'boomThrow': return T('skr_log_boom_throw', '💥 {x} ({card}) طار على الأرض', '💥 {x} ({card}) flew onto the pile', { x: skrSlotRef(state, e.pid, e.slot, null, e.seq) });
    // "كروت {a}", "دور {a}": a name reads there, "أنت" doesn't.
    case 'finish': return T('skr_log_finish', '🏁 كروت {a} خلصت: الجولة انتهت', '🏁 {a} is out of cards: the round is over', { a: skrName(state, e.pid, true) });
    case 'lastLap': return T('skr_log_last_lap', '💀 الورق خلص: دور أخير للكل', '💀 The deck is empty: one last turn each');
    case 'pass': return T('skr_log_pass', '⏭️ دور {a} عدّى من غير لعب', '⏭️ {a} passed', { a: skrName(state, e.pid, true) });
    case 'thiefVote': return T('skr_log_vote', '🗳️ صوت {a} اتسجّل', '🗳️ {a} voted', { a: skrName(state, e.pid, true) });
    case 'accuse': {
      if (!e.accused) return T('skr_log_accuse_none', '🦹 اتهام الترابيزة: مفيش حرامي', '🦹 The table accused nobody');
      const who = { b: skrName(state, e.accused) };
      return e.caught
        ? T('skr_log_accuse_ok', '🦹 اتهام الترابيزة: {b} ✓', '🦹 The table accused {b} ✓', who)
        : T('skr_log_accuse_no', '🦹 اتهام الترابيزة: {b} ✗', '🦹 The table accused {b} ✗', who);
    }
    case 'reveal': return T('skr_log_reveal', '🃏 الكروت اتكشفت', '🃏 The cards are revealed');
  }
  return '';
}

/** The moves worth a line: a ready or a vote is one per player, and the screen already says who has. */
const skrMoves = (state) => skrDealEvents((state.shared || {}).events).filter(e => e && e.type !== 'ready' && e.type !== 'thiefVote' && skrEventText(state, e));

/** How many moves the table shows: the last 3 (heard once, as at a real table), more with the memory helper. */
const skrLogCount = (state, tv) => (skrHelp(state) ? (tv ? 6 : 5) : 3);

/**
 * What just happened, at the top of the table: the latest move, replaced by the
 * next. It comes in once (motionFirst); a redraw shows it settled.
 */
function skrLatestHtml(state, tv) {
  const moves = skrMoves(state);
  const e = moves[moves.length - 1];
  if (!e) return '';
  const fresh = motionFirst(['skr-latest', state.code, (state.shared || {}).dealId || '', e.seq, tv ? 'tv' : 'phone'].join('|'));
  return `<div class="skr-latest ${fresh ? 'is-new' : ''}" role="status">${escapeHTML(skrEventText(state, e))}</div>`;
}

/** The log under the table: the moves before the latest one (which is written at the top). */
function skrLogHtml(state, count) {
  const moves = skrMoves(state);
  const lines = moves.slice(-count, -1).reverse().map(e => skrEventText(state, e)).filter(Boolean);
  if (!lines.length) return '';
  return `<div class="skr-logbox">
      <div class="eyebrow">📜 ${escapeHTML(skrT('skr_log_title', 'اللي حصل', 'What happened'))}</div>
      <ol class="skr-log">${lines.map(l => `<li>${escapeHTML(l)}</li>`).join('')}</ol>
    </div>`;
}

/* --- picking a move ------------------------------------------------------------ */

/** A move being chosen. `focus` is the player whose cards the bar shows (picking someone else's card is two steps: the player, then the card). */
const skrNewPick = (kind, extra) => Object.assign({ kind: kind, power: null, as: null, mode: null, count: 0, own: [], other: [], player: null, index: null, focus: null }, extra || {});

/**
 * What a pick still needs. own/other: how many slots of yours / of others
 * ('each' = one of every other player); player: a player; guarded: the
 * caller's protected hand is not a target; mode/as: a choice comes first.
 */
function skrNeed(pick) {
  if (!pick) return {};
  switch (pick.kind) {
    case 'keep': case 'takePile': case 'match': case 'pong': case 'seeSwapDo': case 'boomPick': return { own: 1 };
    case 'khoshaf': return { index: true };
    case 'power': {
      const p = pick.power;
      if (p === 'asYouLike') return { as: true };
      if (p === 'peekOwn' || p === 'basra') return { own: 1 };
      if (p === 'spyOther') return { other: 1 };
      if (p === 'blindSwap') return { own: 1, other: 1, guarded: true };
      if (p === 'seeSwap') return { other: 1, guarded: true };
      if (p === 'boom' || p === 'scream') return { button: true, guarded: true };   // everyone else's move, or the whole table's
      if (p === 'give') return { own: 1, player: true, guarded: true };
      if (p === 'cannon') return { player: true, guarded: true };
      if (p === 'allAround') return pick.mode === 'own' ? { own: pick.count || 2 } : pick.mode === 'others' ? { other: 'each' } : { mode: true };
      return { button: true };   // khoshaf, scream: nothing to pick
    }
  }
  return {};
}

function skrOthersWithCards(state) {
  const s = state.shared || {};
  return skrOrder(state).filter(pid => pid !== Room.me && ((s.hands || {})[pid] || []).length > 0);
}

/**
 * The players a pick can aim at, in seat order from this phone: every other
 * player, with `ok` false for one who can't be picked (the protected caller,
 * or no cards to take one from) - shown greyed rather than left out, so the
 * row of names always reads like the table.
 */
function skrPickTargets(state, pick) {
  const s = state.shared || {};
  const need = skrNeed(pick);
  if (!need.other && !need.player) return [];
  const order = skrOrder(state);
  const at = order.indexOf(Room.me);
  const seats = at === -1 ? order.slice() : order.slice(at + 1).concat(order.slice(0, at));
  return seats.filter(pid => pid !== Room.me).map(pid => {
    const cards = ((s.hands || {})[pid] || []).length;
    const guarded = !!need.guarded && skrProtected(s).indexOf(pid) !== -1;
    return { pid: pid, cards: cards, guarded: guarded, ok: !guarded && (!need.other || cards > 0) };
  });
}

/** Whose cards the bar shows now: the one tapped, else the next player still to pick from (كعب داير), else the only one there is. */
function skrPickFocusOf(state, pick) {
  const need = skrNeed(pick);
  if (!need.other) return null;
  const targets = skrPickTargets(state, pick).filter(x => x.ok);
  if (pick.focus && targets.some(x => x.pid === pick.focus)) return pick.focus;
  if (need.other === 'each') {
    const next = targets.find(x => !pick.other.some(o => o.target === x.pid));
    return next ? next.pid : null;
  }
  if (pick.other.length) return pick.other[0].target;
  return targets.length === 1 ? targets[0].pid : null;
}

/** A name tapped in the bar: that player's cards come up (or, for a pick of a player, that player is picked). */
function skrPickFocus(pid) {
  const state = Room.state;
  const pick = skrLocal.pick;
  if (!state || !pick) return;
  const target = skrPickTargets(state, pick).find(x => x.pid === pid);
  if (!target || !target.ok) return;
  const need = skrNeed(pick);
  if (need.player && !need.other) pick.player = pick.player === pid ? null : pid;
  else pick.focus = pid;
  haptic('light');
  skrRedraw();
}

/** May this slot be tapped for the pick? */
function skrSlotOk(state, pick, owner, slot) {
  if (!pick) return false;
  const need = skrNeed(pick);
  const s = state.shared || {};
  if (owner === Room.me) return !!need.own;
  if (need.guarded && skrProtected(s).indexOf(owner) !== -1) return false;
  if (need.other) return true;
  return !!need.player;                    // a slot picks its player
}

function skrSeatOk(state, pick, pid) {
  const need = skrNeed(pick);
  if (!need.player || pid === Room.me) return false;
  return !(need.guarded && skrProtected(state.shared || {}).indexOf(pid) !== -1);
}

function skrSlotPicked(pick, owner, slot) {
  if (!pick) return false;
  if (owner === Room.me) return pick.own.indexOf(slot) !== -1;
  return pick.other.some(o => o.slot === slot) || (!!pick.player && pick.player === owner && !skrNeed(pick).other);
}

function skrPickReady(state, pick) {
  if (!pick) return false;
  const need = skrNeed(pick);
  if (need.mode || need.as || need.button) return false;
  if (need.index) return pick.index !== null && pick.index !== undefined;
  if (need.own && pick.own.length !== need.own) return false;
  if (need.other === 1 && pick.other.length !== 1) return false;
  if (need.other === 'each') {
    const others = skrOthersWithCards(state);
    if (!others.length || !others.every(pid => pick.other.some(o => o.target === pid))) return false;
  }
  if (need.player && !pick.player) return false;
  return true;
}

/** The action and payload a finished pick sends. */
function skrPickPayload(state, pick) {
  const seq = (state.shared || {}).turnSeq;
  const own = pick.own[0];
  switch (pick.kind) {
    case 'keep': case 'takePile': case 'match': case 'pong': case 'seeSwapDo': case 'boomPick':
      return [pick.kind, { slot: own, seq: seq }];
    case 'khoshaf': return ['khoshafPick', { index: pick.index, seq: seq }];
    case 'power': {
      const p = pick.power;
      const body = { seq: seq };
      if (pick.as) body.as = pick.as;
      if (p === 'peekOwn' || p === 'basra') body.slot = own;
      if (p === 'spyOther' || p === 'seeSwap') { body.target = pick.other[0].target; body.slot = pick.other[0].slot; }
      if (p === 'blindSwap') { body.slot = own; body.target = pick.other[0].target; body.slot2 = pick.other[0].slot; }
      if (p === 'allAround') {
        if (pick.mode === 'own') body.own = pick.own.slice();
        else body.picks = pick.other.map(o => ({ target: o.target, slot: o.slot }));
      }
      if (p === 'give') { body.slot = own; body.target = pick.player; }
      if (p === 'cannon') body.target = pick.player;
      return ['power', body];
    }
  }
  return [null, null];
}

/** What ✓ will do, in words, under the prompt. */
function skrPickSummary(state, pick) {
  const s = state.shared || {};
  const mine = (slot) => skrSlotRef(state, Room.me, slot, null);
  const theirs = (o) => skrSlotRef(state, o.target, o.slot, null);
  const pileTop = (s.pile || [])[(s.pile || []).length - 1];
  const sep = appState.lang === 'en' ? ', ' : '، ';
  switch (pick.kind) {
    case 'keep': return '🔁 ' + mine(pick.own[0]) + ' → ⬇️';
    case 'takePile': return '⬆️ ' + skrCardLabel(pileTop) + ' → ' + mine(pick.own[0]);
    case 'match': return '🎯 ' + mine(pick.own[0]) + ' → ' + skrCardLabel(pileTop);
    case 'pong': return '🎾 ' + mine(pick.own[0]);
    case 'seeSwapDo': return '🔄 ' + mine(pick.own[0]);
    case 'boomPick': return '💣 ' + mine(pick.own[0]) + ' → ⬇️';
    case 'khoshaf': return '🥣 ' + skrCardLabel(((state.you || {}).khoshaf || [])[pick.index]);
    case 'power': {
      const p = pick.power;
      if (p === 'peekOwn') return '👁️ ' + mine(pick.own[0]);
      if (p === 'basra') return '🗑️ ' + mine(pick.own[0]);
      if (p === 'spyOther' || p === 'seeSwap') return '👁️ ' + theirs(pick.other[0]);
      if (p === 'blindSwap') return '🔄 ' + mine(pick.own[0]) + ' ⇄ ' + theirs(pick.other[0]);
      if (p === 'allAround') return '👁️ ' + (pick.mode === 'own' ? pick.own.map(mine) : pick.other.map(theirs)).join(sep);
      if (p === 'give') return '🎁 ' + mine(pick.own[0]) + ' → ' + skrName(state, pick.player);
      if (p === 'cannon') return '💥 ' + skrName(state, pick.player);
    }
  }
  return '';
}

function skrPickPrompt(state, pick) {
  const need = skrNeed(pick);
  switch (pick.kind) {
    case 'keep': return skrT('skr_pick_keep', 'اختار الكارت اللي هيروح مكانه', 'Pick the card it replaces');
    case 'takePile': return skrT('skr_pick_take', 'اختار الكارت اللي هيتبدّل باللي على الأرض', 'Pick the card the pile card replaces');
    case 'match': return skrT('skr_pick_match', 'اختار الكارت اللي زيّ اللي على الأرض', 'Pick the card that matches the pile');
    case 'pong': return skrT('skr_pick_pong', 'اختار كارت البونج من كروتك', 'Pick your Pong card');
    case 'seeSwapDo': return skrT('skr_pick_seeswap', 'اختار كارت من عندك يتبدّل معاه', 'Pick one of yours to swap it with');
    case 'boomPick': return skrT('skr_boom_pick', '💣 بوم! اختار كارت من كروتك يترمي على الأرض', '💣 Boom! Pick one of your cards to throw on the pile');
  }
  const p = pick.power;
  if (p === 'asYouLike') return skrT('skr_power_asyoulike', 'اختار القوة اللي عايزها', 'Pick the power you want');
  if (p === 'allAround' && need.mode) return skrT('skr_power_around', 'كارت من كل واحد، ولا كارتين من عندك؟', 'One card of everyone else, or two of yours?');
  if (p === 'allAround' && pick.mode === 'own') return skrT('skr_power_around_own', 'اختار كارتين من كروتك تشوفهم', 'Pick two of your cards to look at');
  if (p === 'allAround') return skrT('skr_power_around_others', 'اختار كارت واحد من عند كل لاعب', 'Pick one card of every other player');
  const texts = {
    peekOwn: ['skr_power_peek', 'اختار كارت من كروتك تشوفه', 'Pick one of your cards to look at'],
    spyOther: ['skr_power_spy', 'اختار كارت من عند أي حد تشوفه', "Pick anyone else's card to look at"],
    blindSwap: ['skr_power_swap', 'اختار كارت من عندك وكارت من عند حد تاني يتبدّلوا من غير ما حد يشوف', "Pick one of yours and one of someone else's to swap unseen"],
    basra: ['skr_power_basra', 'اختار كارت من كروتك يترمي على الأرض', 'Pick one of your cards to throw on the pile'],
    give: ['skr_power_give', 'اختار كارت من عندك واللاعب اللي هياخده', 'Pick one of your cards and who gets it'],
    seeSwap: ['skr_power_seeswap', 'اختار كارت من عند حد تاني تشوفه، وبعدها تبدّله أو تسيبه', "Pick someone else's card to look at, then swap it or leave it"],
    cannon: ['skr_power_cannon', 'اختار لاعب كروته تتكشف للكل لآخر الجولة', "Pick a player whose hand turns face up until the round ends"],
    boom: ['skr_power_boom_all', 'كل لاعب تاني هيختار كارت من كروته المقلوبة يترمي على الأرض، وبعدها دورك تاني', 'Every other player picks one of their own face-down cards to throw on the pile; then it is your turn again'],
    khoshaf: ['skr_power_khoshaf', 'شوف أول 4 كروت في الورق وخد واحد', 'See the top four cards and take one'],
    scream: ['skr_power_scream_deal', 'الكروت كلها تتلم وتتخلط وتتوزّع تاني مقلوبة، نفس العدد لكل واحد، وبعدها دورك تاني', 'Every hand is gathered, shuffled and dealt out again face down, the same number each; then it is your turn again']
  }[p];
  return texts ? skrT(texts[0], texts[1], texts[2]) : '';
}

/* --- this phone's taps ------------------------------------------------------------ */

function skrRedraw() {
  if (Room.state && Room.state.game === 'screw') routeRoomState(Room.state);
}

/** A game action with the turn it was drawn for. The button locks until the room answers. */
function skrAct(btn, action, extra) {
  const st = Room.state;
  if (!st || st.game !== 'screw') return;
  if (btn && 'disabled' in btn) btn.disabled = true;
  haptic('light');
  roomAct(action, Object.assign({ seq: (st.shared || {}).turnSeq }, extra || {}));
}

/** Something to draw: the deck, or - unless sudden death is on - the pile under its top card. */
function skrCanDraw(s) {
  if ((Number(s.deckCount) || 0) > 0) return true;
  return !((s.settings || {}).suddenDeath) && (s.pile || []).length > 1;
}

function skrCallScrew() {
  const msg = skrT('skr_screw_confirm', 'تقول سكرو؟ كل واحد تاني هيلعب دور أخير، وبعدها الكروت تتكشف.', 'Call Screw? Everyone else gets one last turn, then the cards are revealed.');
  showConfirmModal(msg, () => skrAct(null, 'screw'));
}

function skrStartPick(kind) {
  skrLocal.pick = skrNewPick(kind);
  haptic('light');
  skrRedraw();
}

function skrCancelPick() {
  const pick = skrLocal.pick;
  // A power's own pick goes back a step (the choice of على كيفك / كعب داير) or starts over.
  skrLocal.pick = pick && pick.kind === 'power' && pick.as ? skrNewPick('power', { power: 'asYouLike' }) : null;
  skrRedraw();
}

function skrPickMode(mode) {
  if (!skrLocal.pick) return;
  const st = Room.state;
  const mine = st ? (((st.shared || {}).hands || {})[Room.me] || []).length : 2;
  skrLocal.pick.mode = mode;
  skrLocal.pick.count = Math.max(1, Math.min(2, mine));
  skrLocal.pick.own = [];
  skrLocal.pick.other = [];
  skrRedraw();
}

function skrPickAs(power) {
  if (!skrLocal.pick || (typeof SKREW_AS_YOU_LIKE !== 'undefined' && SKREW_AS_YOU_LIKE.indexOf(power) === -1)) return;
  skrLocal.pick = skrNewPick('power', { power: power, as: power });
  haptic('light');
  skrRedraw();
}

function skrPickIndex(i) {
  const pick = skrLocal.pick;
  if (!pick || pick.kind !== 'khoshaf') return;
  if (pick.index === i) { skrConfirm(); return; }
  pick.index = i;
  haptic('light');
  skrRedraw();
}

/** A slot tapped: part of the move being chosen, or, with nothing to choose, what the table knows about it. */
function skrTapSlot(owner, slot) {
  const state = Room.state;
  if (!state || state.game !== 'screw') return;
  const pick = skrLocal.pick;
  if (!pick || !skrSlotOk(state, pick, owner, slot)) { skrSlotToast(state, owner, slot); return; }
  const need = skrNeed(pick);
  if (owner === Room.me) {
    if (pick.own.indexOf(slot) !== -1) {
      // The chosen card tapped again sends a one-card move.
      if (need.own === 1 && !need.other && !need.player && skrPickReady(state, pick)) { skrConfirm(); return; }
      pick.own = pick.own.filter(x => x !== slot);
    } else {
      pick.own = need.own === 1 ? [slot] : pick.own.concat([slot]).slice(-need.own);
    }
  } else if (need.other) {
    const had = pick.other.findIndex(o => o.slot === slot);
    if (had !== -1) {
      pick.other.splice(had, 1);
      pick.focus = owner;
    } else if (need.other === 'each') {
      pick.other = pick.other.filter(o => o.target !== owner).concat([{ target: owner, slot: slot }]);
      // On to the next player still to pick from, round the table from this one.
      const targets = skrPickTargets(state, pick).filter(x => x.ok).map(x => x.pid);
      const from = targets.indexOf(owner);
      const next = targets.slice(from + 1).concat(targets.slice(0, from)).find(pid => !pick.other.some(o => o.target === pid));
      pick.focus = next || owner;
    } else {
      pick.other = [{ target: owner, slot: slot }];
      pick.focus = owner;
    }
  } else if (need.player) {
    pick.player = pick.player === owner ? null : owner;
  }
  haptic('light');
  skrRedraw();
}

function skrTapSeat(pid) {
  const state = Room.state;
  const pick = skrLocal.pick;
  if (!state || !pick || !skrSeatOk(state, pick, pid)) return;
  pick.player = pick.player === pid ? null : pid;
  haptic('light');
  skrRedraw();
}

/**
 * A slot tapped with nothing to choose: its name - and, with the memory
 * helper, its story: how its card came and from whose card, how many turns
 * ago, and who has looked at it.
 */
function skrSlotToast(state, owner, slot) {
  const ref = skrSlotRef(state, owner, slot, null);
  if (!skrHelp(state)) { showToast(ref); return; }
  const h = (((state.shared || {}).hands || {})[owner] || []).find(x => x.id === slot) || { id: slot };
  const hist = skrHistory(state, h, skrMarks(state));
  const words = skrHistoryWords(state, hist, false);
  const when = hist.how !== 'deal' ? skrTurnsAgo(state, hist.at) : '';
  if (words.length && when) words[0] += ' (' + when + ')';
  if (hist.looks.length) words.push(skrT('skr_mark_look', '👁️ شافه: {names}', '👁️ Seen by {names}', { names: hist.looks.map(p => skrName(state, p)).join(appState.lang === 'en' ? ', ' : '، ') }));
  showToast(ref + ': ' + (words.length ? words.join(' · ') : skrT('skr_mark_none', 'محدش لمسه من ساعة ما اتوزّع', 'Untouched since the deal')));
}

async function skrConfirm() {
  const state = Room.state;
  const pick = skrLocal.pick;
  if (!state || !pick || !skrPickReady(state, pick)) return;
  const [action, payload] = skrPickPayload(state, pick);
  if (!action) return;
  skrLocal.pick = null;
  haptic('medium');
  skrRedraw();
  await roomAct(action, payload);
}

/* --- the table, piece by piece ------------------------------------------------------ */

/** The faces this phone may see in its own hand: the two it memorises. */
function skrMyFaces(state) {
  const s = state.shared || {};
  const you = state.you || {};
  const faces = {};
  if (s.phase === 'memorize' && (s.ready || []).indexOf(Room.me) === -1) {
    (you.memorize || []).forEach(m => { if (m && m.slot) faces[m.slot] = m.card; });
  }
  return faces;
}

/** The two memorised cards turning face down once the look is over (a tap, or the clock), on this phone. */
function skrMemoFlipDown(root, state, was) {
  const now = skrLocal.memoFaces;
  const s = state.shared || {};
  if (!was || !now || was.key !== now.key || !skrCanMove() || document.hidden) return;
  const gone = Object.keys(was.faces || {}).filter(slot => !(now.faces || {})[slot]);
  gone.forEach((slot, i) => skrTurnOver(root, 'slot:' + slot, was.faces[slot], { down: true, lift: 8, delay: (s.phase === 'play' ? 120 : 0) + i * 90 }));
}

/**
 * One slot: its card (face up only when the table may see it, or while its
 * own phone memorises it), its number, and what is happening to it. A move
 * that has just touched it makes it glow with a sign for a few seconds
 * (skrFlash, in both modes). With the memory helper it also keeps its story:
 * a corner sign on the others' cards, words under your own (`ctx.fullMarks`),
 * a value known from the pile written on its back. `ctx.bar`: the same slot
 * drawn again in the action bar, which the flights never aim at.
 */
function skrSlotHtml(state, owner, h, ctx, index) {
  const mine = owner === Room.me && !state.youAreScreen;
  const face = h.up || (mine && ctx.faces[h.id]) || null;
  const pick = ctx.pick;
  const hist = ctx.help ? skrHistory(state, h, ctx.marks) : null;
  const cls = ['skr-slot'];
  if (pick) {
    if (skrSlotPicked(pick, owner, h.id)) cls.push('is-picked');
    else if (skrSlotOk(state, pick, owner, h.id)) cls.push('is-target');
    else cls.push('is-dim');
  }
  if (face) cls.push('is-up');
  if (mine && ctx.faces[h.id]) cls.push('is-memo');
  const st = state.shared || {};
  const looking = st.phase === 'play' && st.turn && st.turn.stage === 'seeSwap' && st.turn.look && st.turn.look.slot === h.id;
  if (looking) cls.push('is-looking');
  const flash = skrFlashOf('slot:' + h.id);
  if (flash) cls.push('is-flash');
  const at = ctx.bar ? '' : ` data-skr-at="slot:${escapeHTML(h.id)}"`;
  const card = `<span class="skr-slot__card"${at}>${skrCardHtml(face, { size: ctx.size, known: hist && !face ? hist.known : null })}</span>`;
  const n = `<span class="skr-slot__n metric">${escapeHTML(String(h.n || (index || 0) + 1))}</span>`;
  let markHtml = '';
  if (hist && ctx.fullMarks) {
    markHtml = skrHistoryWords(state, hist, true).map(w => `<span class="skr-slot__mark">${escapeHTML(w)}</span>`).join('');
  } else if (hist) {
    const icon = skrHistoryIcon(hist);
    if (icon) markHtml = `<span class="skr-slot__badge">${icon}</span>`;
  }
  if (looking) markHtml += '<span class="skr-slot__eye" aria-hidden="true">👁️</span>';
  if (flash) markHtml += skrFlashBadge(flash);
  const style = flash ? skrFlashAttrs('slot:' + h.id, flash) : '';
  if (ctx.tv) return `<span class="${cls.join(' ')}"${style}>${card}${n}${markHtml}</span>`;
  const label = skrSlotRef(state, owner, h.id, null);
  return `<button type="button" class="${cls.join(' ')}"${style} onclick="skrTapSlot('${jsStringAttr(owner)}', '${jsStringAttr(h.id)}')" aria-label="${escapeHTML(label)}">${card}${n}${markHtml}</button>`;
}

/** The little signs beside a name: 📣 the caller (🔒 protected), 💥 face up, ✓ ready, ✋ holding a drawn card, ⏳ a last turn to come, 🏁 out of cards, ✓ voted. */
function skrSeatTags(state, pid) {
  const s = state.shared || {};
  const tags = [];
  if (s.caller === pid) tags.push(`<span title="${escapeHTML(skrT('skr_protected', 'سكرو: الكروت دي محمية', 'Called Screw; the hand is protected'))}">📣🔒</span>`);
  else if (s.caller && skrProtected(s).indexOf(pid) !== -1) tags.push(`<span title="${escapeHTML(skrT('skr_protected_team', 'فريق سكرو: الكروت دي محمية', "On the caller's team; the hand is protected"))}">🔒</span>`);
  if (s.finisher === pid) tags.push('🏁');
  if ((s.exposed || []).indexOf(pid) !== -1) tags.push('💥');
  if (s.phase === 'memorize' && (s.ready || []).indexOf(pid) !== -1) tags.push('✓');
  if (s.phase === 'play' && s.turn && s.turn.pid === pid && s.turn.stage === 'drawn') tags.push('✋');
  if (s.phase === 'play' && s.turn && s.turn.stage === 'boom' && s.boom) {
    if ((s.boom.picked || []).indexOf(pid) !== -1) tags.push('<span class="skr-voted">💣✓</span>');   // waiting: still to pick
    else if ((s.boom.waiting || []).indexOf(pid) !== -1) tags.push('💣⏳');
  }
  if (s.phase === 'play' && (s.finalLeft || []).indexOf(pid) !== -1 && (s.caller || s.lastLap)) tags.push('⏳');
  if (s.phase === 'thiefGuess' && skrVoted(state).indexOf(pid) !== -1) tags.push('<span class="skr-voted">🗳️✓</span>');
  return tags.join(' ');
}

function skrSeatHtml(state, pid, ctx) {
  const s = state.shared || {};
  const hand = (s.hands || {})[pid] || [];
  const p = (state.players || []).find(x => x.id === pid);
  const team = skrTeamOf(s, pid);
  const cls = ['skr-seat'];
  if (s.phase === 'play' && s.turn && s.turn.pid === pid) cls.push('is-turn');
  if (team !== -1) cls.push('skr-team--' + team);
  if (!p || !p.online) cls.push('is-away');
  if (s.caller === pid) cls.push('is-caller');
  if (hand.length > 6) cls.push('skr-seat--many');
  const flash = skrFlashOf('seat:' + pid);
  if (flash) cls.push('is-flash');
  const pick = ctx.pick;
  const seatTarget = pick && skrSeatOk(state, pick, pid);
  if (seatTarget) cls.push(pick.player === pid ? 'is-picked' : 'is-target');
  const last = ctx.help ? skrLastMove(state, pid) : '';
  const lastHtml = last ? `<span class="skr-seat__last">${escapeHTML(last)}</span>` : '';
  // Seat layout أ: the avatar, the name and the signs on one line above the cards (on the TV the last move too).
  const face = `${skrAvatarHtml(state, pid)}<span class="skr-seat__name">${escapeHTML(skrName(state, pid, true))}</span>`;
  const tags = `<span class="skr-seat__tags">${skrSeatTags(state, pid)}</span>`;
  const name = face + tags;
  const who = ctx.tv
    ? `<div class="skr-seat__who">${face}${lastHtml}${tags}</div>`
    : `<div class="skr-seat__head"><button type="button" class="skr-seat__who" onclick="skrTapSeat('${jsStringAttr(pid)}')" ${seatTarget ? '' : 'tabindex="-1"'}>${name}</button>${lastHtml}</div>`;
  const slots = hand.map((h, i) => skrSlotHtml(state, pid, h, ctx, i)).join('') || '<span class="skr-seat__empty">—</span>';
  const style = flash ? skrFlashAttrs('seat:' + pid, flash) : '';
  return `<div class="${cls.join(' ')}"${style} data-skr-seat="${escapeHTML(pid)}">${who}<div class="skr-slots" data-skr-at="hand:${escapeHTML(pid)}">${slots}</div></div>`;
}

/** This phone's own hand, big; with the memory helper, every slot's story written under it. */
function skrMineHtml(state, ctx) {
  const s = state.shared || {};
  const hand = (s.hands || {})[Room.me] || [];
  const cls = ['skr-mine'];
  if (s.phase === 'play' && s.turn && s.turn.pid === Room.me) cls.push('is-turn');
  const team = skrTeamOf(s, Room.me);
  if (team !== -1) cls.push('skr-team--' + team);
  const flash = skrFlashOf('seat:' + Room.me);
  if (flash) cls.push('is-flash');
  const sub = Object.assign({}, ctx, { size: 'lg', fullMarks: true });
  const memo = Object.keys(ctx.faces).length > 0;
  const hint = memo ? `<span class="badge badge--accent">🧠 ${escapeHTML(skrT('skr_memo_badge', 'احفظهم', 'Memorise'))}</span>` : '';
  // A timed look: a ring with the seconds left over your hand, and a bar running down under it.
  const left = memo && s.phase === 'memorize' && s.endsAt ? Math.max(0, s.endsAt - Date.now()) : 0;
  const total = Math.max(1, (Number((s.settings || {}).memorizeSecs) || 0) * 1000);
  const timer = left ? `<div class="skr-memo-timer" aria-hidden="true"><span class="skr-memo-timer__ring"></span><b class="metric" data-skr-count>${Math.ceil(left / 1000)}</b></div>
      <span class="skr-memo-bar" style="animation-duration:${total}ms;animation-delay:${-Math.max(0, total - left)}ms"></span>` : '';
  const style = flash ? skrFlashAttrs('seat:' + Room.me, flash) : '';
  return `<div class="${cls.join(' ')}"${style} data-skr-seat="${escapeHTML(Room.me)}">
      <div class="skr-mine__head"><span class="skr-mine__title">${skrTeamDot(s, Room.me)}🂠 ${escapeHTML(skrT('skr_your_cards', 'كروتك', 'Your cards'))}</span><span class="skr-seat__tags">${skrSeatTags(state, Room.me)}</span>${hint}</div>
      <div class="skr-slots skr-slots--mine" data-skr-at="hand:${escapeHTML(Room.me)}" style="--count:${Math.max(4, hand.length)}">${hand.map((h, i) => skrSlotHtml(state, Room.me, h, sub, i)).join('')}</div>
      ${timer}
    </div>`;
}

/**
 * Picking someone else's card, in the bar: the players as a row of names
 * (the protected caller and an empty hand greyed), then the chosen player's
 * cards drawn big, numbered, to tap. The table's own slots still work as a
 * shortcut. كعب داير walks the names one after another, "3/11".
 */
function skrTargetsHtml(state, pick, ctx) {
  const s = state.shared || {};
  const need = skrNeed(pick);
  const targets = skrPickTargets(state, pick);
  if (!targets.length) return '';
  const focus = skrPickFocusOf(state, pick);
  const each = need.other === 'each';
  const okCount = targets.filter(x => x.ok).length;
  const chips = targets.map(x => {
    const picked = need.other ? pick.other.some(o => o.target === x.pid) : pick.player === x.pid;
    const cls = ['skr-target'];
    if (need.other ? focus === x.pid : picked) cls.push('is-focus');
    if (need.other && picked) cls.push('is-done');
    const sign = x.guarded ? '🔒' : need.other && picked ? '✓' : need.other ? `<small class="metric">${x.cards}</small>` : '';
    return `<button type="button" class="${cls.join(' ')}" ${x.ok ? '' : 'disabled'} aria-pressed="${cls.indexOf('is-focus') !== -1}" onclick="skrPickFocus('${jsStringAttr(x.pid)}')">${skrTeamDot(s, x.pid)}<span class="skr-target__name">${escapeHTML(skrName(state, x.pid, true))}</span>${sign ? `<span class="skr-target__sign">${sign}</span>` : ''}</button>`;
  }).join('');
  const progress = each ? `<span class="badge metric">${pick.other.length}/${okCount}</span>` : '';
  let cards = '';
  if (need.other && focus) {
    const hand = (s.hands || {})[focus] || [];
    const sub = Object.assign({}, ctx, { size: 'md', bar: true, fullMarks: false });
    cards = `<div class="skr-pickrow">
        <span class="skr-pickrow__label">${escapeHTML(skrT('skr_pick_whose', 'كروت {name}', "{name}'s cards", { name: skrName(state, focus, true) }))}</span>
        <div class="skr-pickslots">${hand.map((h, i) => skrSlotHtml(state, focus, h, sub, i)).join('')}</div>
      </div>`;
  }
  return `<div class="skr-pickrow">
      <span class="skr-pickrow__label">${escapeHTML(skrT('skr_pick_who', 'اختار لاعب', 'Pick a player'))} ${progress}</span>
      <div class="skr-targets">${chips}</div>
    </div>${cards}`;
}

/** Your own cards in the bar, when a move picks one of yours and someone else's (خد وهات, خد بس). */
function skrOwnRowHtml(state, pick, ctx) {
  const s = state.shared || {};
  const hand = (s.hands || {})[Room.me] || [];
  const sub = Object.assign({}, ctx, { size: 'sm', bar: true, fullMarks: false });
  return `<div class="skr-pickrow">
      <span class="skr-pickrow__label">🂠 ${escapeHTML(skrT('skr_your_cards', 'كروتك', 'Your cards'))}</span>
      <div class="skr-pickslots skr-pickslots--mine">${hand.map((h, i) => skrSlotHtml(state, Room.me, h, sub, i)).join('')}</div>
    </div>`;
}

/** The deck, the pile and the card in the turn's hand: the middle of the table. */
function skrCenterHtml(state, tv) {
  const s = state.shared || {};
  const you = state.you || {};
  const pile = s.pile || [];
  const top = pile[pile.length - 1];
  const under = pile[pile.length - 2];
  const turn = s.phase === 'play' ? s.turn : null;
  const mineDrawn = !tv && turn && turn.pid === Room.me && turn.stage === 'drawn' && you.drawn;
  const held = turn && turn.stage === 'drawn';
  const heldCard = mineDrawn ? skrCardHtml(you.drawn, { size: 'lg' }) : held ? skrCardHtml(null, { size: 'lg' }) : skrEmptyCard('lg');
  const heldLabel = mineDrawn ? skrT('skr_drawn_label', 'الكارت اللي سحبته', 'The card you drew')
    : held ? '✋ ' + skrName(state, turn.pid) : skrT('skr_held_label', 'في الإيد', 'In hand');
  const pileFlash = skrFlashOf('pile');
  return `<div class="skr-center">
      <div class="skr-zone skr-zone--deck">
        <span class="skr-zone__card" data-skr-at="deck">${skrCardHtml(null, { size: 'md' })}<span class="skr-count metric">${Number(s.deckCount) || 0}</span></span>
        <span class="skr-zone__label">${escapeHTML(skrT('skr_deck', 'الورق', 'Deck'))}</span>
      </div>
      <div class="skr-zone skr-zone--pile ${pileFlash ? 'is-flash' : ''}"${pileFlash ? skrFlashAttrs('pile', pileFlash) : ''}>
        <span class="skr-pile">${under ? `<span class="skr-pile__under">${skrCardHtml(under, { size: 'lg' })}</span>` : ''}<span class="skr-pile__top" data-skr-at="pile">${top ? skrCardHtml(top, { size: 'lg' }) : skrEmptyCard('lg')}</span>${pileFlash ? skrFlashBadge(pileFlash) : ''}</span>
        <span class="skr-zone__label">${escapeHTML(skrT('skr_pile', 'الأرض', 'Pile'))}</span>
      </div>
      <div class="skr-zone skr-zone--held ${mineDrawn ? 'is-mine' : ''}">
        <span class="skr-zone__card" data-skr-at="held">${heldCard}</span>
        <span class="skr-zone__label">${escapeHTML(heldLabel)}</span>
      </div>
    </div>`;
}

function skrEditionName(settings) {
  const ed = settings && SKREW_EDITIONS[settings.edition];
  if (ed) return ed.icon + ' ' + (appState.lang === 'en' ? ed.en : ed.ar);
  return '🧩 ' + skrT('skr_ed_custom', 'مخصص', 'Custom');
}

/** The round, the lap, the version and the clock. */
function skrHeadHtml(state) {
  const s = state.shared || {};
  const settings = s.settings || {};
  const bits = [];
  if (s.round) bits.push(`<span class="badge">${escapeHTML(skrT('skr_round_of', 'جولة {n}/{m}', 'Round {n}/{m}', { n: s.round, m: s.rounds || settings.rounds || '' }))}</span>`);
  if (s.phase === 'play' && s.caller) {
    bits.push(`<span class="badge badge--danger">📣 ${escapeHTML(skrT('skr_final_lap', 'آخر لفة · فاضل {n}', 'Final lap · {n} left', { n: (s.finalLeft || []).length }))}</span>`);
  } else if (s.phase === 'play' && s.lastLap) {
    bits.push(`<span class="badge badge--danger">💀 ${escapeHTML(skrT('skr_last_lap', 'الورق خلص: آخر لفة · فاضل {n}', 'Deck empty: last lap · {n} left', { n: (s.finalLeft || []).length }))}</span>`);
  } else if (s.phase === 'play' && s.lap) {
    bits.push(`<span class="badge">${escapeHTML(skrT('skr_lap', 'لفة {n}', 'Lap {n}', { n: s.lap }))}</span>`);
  }
  bits.push(`<span class="badge">${escapeHTML(skrEditionName(settings))}</span>`);
  if (settings.teams) bits.push(`<span class="badge">🤝</span>`);
  if (settings.suddenDeath) bits.push(`<span class="badge" title="${escapeHTML(skrT('skr_sudden', 'موت مفاجئ', 'Sudden death'))}">💀</span>`);
  if ((s.phase === 'play' || s.phase === 'thiefGuess' || s.phase === 'memorize') && s.endsAt) bits.push(`<span class="badge badge--accent metric" data-skr-clock>⏱️ ${Math.max(0, Math.ceil((s.endsAt - Date.now()) / 1000))}</span>`);
  return `<div class="skr-head">${bits.join('')}</div>`;
}

/** Whose turn it is and what they are doing, for everyone but them. */
function skrTurnWords(state) {
  const s = state.shared || {};
  const turn = s.turn;
  if (s.phase !== 'play' || !turn) return { title: '', hint: '' };
  const name = skrName(state, turn.pid, true);
  if (turn.stage === 'boom') {
    return { title: skrT('skr_boom_from', '💣 بوم من {name}: كل واحد بيرمي كارت', '💣 Boom from {name}: everyone throws a card', { name: name }), hint: skrBoomLine(state) };
  }
  const again = skrTurnAgain(state);
  const title = again === 'boom' ? skrT('skr_after_boom', '💣 بعد بوم: دور {name} تاني', "💣 After Boom: {name}'s turn again", { name: name })
    : again === 'scream' ? skrT('skr_after_scream', '😱 بعد الصرخة: دور {name} تاني', "😱 After the scream: {name}'s turn again", { name: name })
    : skrT('skr_turn_of', 'دور {name}', "{name}'s turn", { name: name });
  let hint = '';
  if (turn.stage === 'choose' && turn.pongOpen) hint = '🏓 ' + skrT('skr_hint_pong', 'بينج! فرصة بونج', 'Ping! A chance for Pong');
  else if (turn.stage === 'drawn') hint = '✋ ' + skrT('skr_hint_drawn', 'كارت مسحوب في الإيد', 'Holding a drawn card');
  else if (turn.stage === 'power') { const p = skrPowerInfo(skrPowerOf(turn.power)); hint = (p.icon + ' ' + p.name).trim(); }
  else if (turn.stage === 'seeSwap') { const p = skrPowerInfo('seeSwap'); hint = (p.icon + ' ' + p.name).trim(); }
  else if (turn.stage === 'khoshaf') { const p = skrPowerInfo('khoshaf'); hint = (p.icon + ' ' + p.name).trim(); }
  return { title: title, hint: hint };
}

/** A look this phone just had (peek, spy, كعب داير, شوف وبدّل): face up here only. */
function skrSeenHtml(state, inSeeSwap) {
  const you = state.you || {};
  const seen = Array.isArray(you.seen) ? you.seen.filter(Boolean) : [];
  if (!seen.length && !inSeeSwap) return '';
  const key = JSON.stringify(seen);
  if (!inSeeSwap && skrLocal.seenClosed === key) return '';
  const items = seen.map(x => `<div class="skr-seen__item">${skrCardHtml(x.card, { size: 'lg' })}<span>${escapeHTML(skrSlotRef(state, x.pid, x.slot, null))}</span></div>`).join('');
  const buttons = inSeeSwap
    ? `<div class="btn-row">
         <button type="button" class="btn btn--primary" onclick="skrStartPick('seeSwapDo')">🔄 ${escapeHTML(skrT('skr_seeswap_do', 'بدّله مع كارت من عندي', 'Swap it with one of mine'))}</button>
         <button type="button" class="btn btn--ghost" onclick="skrAct(this, 'seeSwapDo')">${escapeHTML(skrT('skr_seeswap_leave', 'سيبه مكانه', 'Leave it'))}</button>
       </div>`
    : `<button type="button" class="btn btn--secondary" onclick="skrCloseSeen()">${escapeHTML(skrT('skr_ok', 'تمام', 'Got it'))}</button>`;
  return `<div class="skr-seen">
      <p class="skr-prompt is-mine">👁️ ${escapeHTML(skrT('skr_seen_title', 'اللي شفته', 'What you saw'))}</p>
      ${items ? `<div class="skr-seen__cards">${items}</div>` : ''}
      ${inSeeSwap ? '' : `<p class="skr-hint">${escapeHTML(skrT('skr_seen_hint', 'على موبايلك بس', 'Only on your phone'))}</p>`}
      ${buttons}
    </div>`;
}

function skrCloseSeen() {
  const you = (Room.state && Room.state.you) || {};
  skrLocal.seenClosed = JSON.stringify(Array.isArray(you.seen) ? you.seen.filter(Boolean) : []);
  skrRedraw();
}

/** The move being chosen: the prompt, a first choice where there is one, the players and cards to pick from, what ✓ will do. */
function skrPickBarHtml(state, pick, ctx) {
  const t = TRANSLATIONS[appState.lang] || {};
  const s = state.shared || {};
  const need = skrNeed(pick);
  const powerHead = pick.kind === 'boomPick' ? `<span class="skr-power">${skrPowerChip('boom')}</span>` : pick.kind === 'power'
    ? (() => { const p = skrPowerInfo(pick.power); return `<span class="skr-power">${skrPowerChip(pick.power)}${escapeHTML(p.name)}</span>`; })()
    : '';
  let body = '';
  if (need.as) {
    const list = typeof SKREW_AS_YOU_LIKE !== 'undefined' ? SKREW_AS_YOU_LIKE : [];
    body = `<div class="skr-choices">${list.map(power => { const p = skrPowerInfo(power); return `<button type="button" class="btn btn--secondary" onclick="skrPickAs('${jsStringAttr(power)}')">${skrPowerChip(power)}${escapeHTML(p.name)}</button>`; }).join('')}</div>`;
  } else if (need.mode) {
    body = `<div class="skr-choices">
        <button type="button" class="btn btn--secondary" onclick="skrPickMode('others')">👥 ${escapeHTML(skrT('skr_around_others', 'كارت من كل واحد', 'One of everyone else'))}</button>
        <button type="button" class="btn btn--secondary" onclick="skrPickMode('own')">🂠 ${escapeHTML(skrT('skr_around_own', 'كارتين من عندي', 'Two of mine'))}</button>
      </div>`;
  } else if (need.button && pick.power === 'khoshaf') {
    body = `<button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'power', { })">🥣 ${escapeHTML(skrT('skr_khoshaf_show', 'اكشف 4 كروت', 'Show four cards'))}</button>`;
  } else if (need.button && pick.power === 'boom') {
    body = `<button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'power', { })">💣 ${escapeHTML(skrT('skr_boom_go', 'بوم!', 'Boom!'))}</button>`;
  } else if (need.button && pick.power === 'scream') {
    body = `<button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'power', { })">😱 ${escapeHTML(skrT('skr_scream_go', 'اصرخ!', 'Scream!'))}</button>`;
  } else if (need.button) {
    body = `<button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'power', { })">✓ ${escapeHTML(t.confirm || 'تأكيد')}</button>`;
  } else {
    const ready = skrPickReady(state, pick);
    const summary = ready ? skrPickSummary(state, pick) : '';
    const both = need.own && (need.other || need.player || pick.kind === 'boomPick');
    const rows = (both ? skrOwnRowHtml(state, pick, ctx || {}) : '') + (need.other || need.player ? skrTargetsHtml(state, pick, ctx || {}) : '');
    body = `${rows}${ready && summary ? `<p class="skr-summary">${escapeHTML(summary)}</p>` : ''}
      <div class="btn-row">
        <button type="button" class="btn btn--primary" onclick="skrConfirm()" ${ready ? '' : 'disabled'}>✓ ${escapeHTML(t.confirm || 'تأكيد')}</button>
        <button type="button" class="btn btn--ghost btn--auto" onclick="skrCancelPick()">${escapeHTML(t.cancel || 'إلغاء')}</button>
      </div>`;
  }
  const guardNote = need.guarded && s.caller ? `<p class="skr-hint">🔒 ${escapeHTML(skrProtected(s).length > 1
    ? skrT('skr_guarded_team', 'كروت فريق اللي قال سكرو محمية', "The caller's team is protected")
    : skrT('skr_guarded', 'كروت اللي قال سكرو محمية', "The caller's hand is protected"))}</p>` : '';
  const skip = pick.kind === 'power'
    ? `<button type="button" class="btn btn--ghost btn--sm" onclick="skrAct(this, 'skipPower')">⏭️ ${escapeHTML(skrT('skr_skip_power', 'من غير القوة', 'Skip the power'))}</button>` : '';
  return `<p class="skr-prompt is-mine">${powerHead}${escapeHTML(skrPickPrompt(state, pick))}</p>${body}${guardNote}${skip}`;
}

function skrKhoshafHtml(state, pick) {
  const t = TRANSLATIONS[appState.lang] || {};
