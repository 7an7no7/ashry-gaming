<script>
/* ============================================================================
   2048
   ----------------------------------------------------------------------------
   Swipe (or the arrow keys) and every tile slides as far as it can; two equal
   tiles that meet become one with their sum. A new 2 (sometimes a 4) lands
   after each move that changed the board. Reach 2048 to win, and carry on if
   you like; no move left ends the game.

   The tiles are kept as { id, v, r, c } so the same element slides from its
   old place to its new one (a transform transition, off the main thread); a
   merged pair slides together, the survivor pops with its new value and the
   other goes. One step can be undone. The board is in appState.g2048.
   ========================================================================= */

const G2048_SIZE = 4;
const G2048_SLIDE_MS = 120;
let g2048Busy = false;

function g2048State() {
  if (!appState.g2048) {
    appState.g2048 = { tiles: [], nextId: 1, score: 0, won: false, keepGoing: false, prev: null, phase: 'setup' };
  }
  return appState.g2048;
}

function setup2048() {
  setView('setup-g2048');
}

function paint2048Setup() {
  const s = g2048State();
  const t = TRANSLATIONS[appState.lang];
  const best = soloBest('g2048', '');
  const el = document.getElementById('g2048-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${best.score} · ${best.tile}` : '';
  const cont = document.getElementById('g2048-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
}

function start2048() {
  soloNewGame('g2048');
  const s = g2048State();
  s.tiles = [];
  s.nextId = 1;
  s.score = 0;
  s.won = false;
  s.keepGoing = false;
  s.prev = null;
  s.phase = 'play';
  g2048Spawn(s);
  g2048Spawn(s);
  saveToLocal();
  setView('play-g2048');
  paint2048(true);
}

function continue2048() {
  if (g2048State().phase !== 'play') return;
  setView('play-g2048');
  paint2048(true);
}

function g2048Spawn(s) {
  const taken = new Set(s.tiles.map(x => x.r * G2048_SIZE + x.c));
  const free = [];
  for (let i = 0; i < G2048_SIZE * G2048_SIZE; i++) if (!taken.has(i)) free.push(i);
  if (!free.length) return null;
  const i = free[Math.floor(Math.random() * free.length)];
  const tile = { id: s.nextId++, v: Math.random() < 0.9 ? 2 : 4, r: Math.floor(i / G2048_SIZE), c: i % G2048_SIZE, fresh: true };
  s.tiles.push(tile);
  return tile;
}

/**
 * Slides the board one way. Returns { moved, gained, merges: [{ into, gone }] } and
 * rewrites s.tiles; nothing changes when nothing can move.
 */
function g2048Slide(s, dir) {
  const N = G2048_SIZE;
  const grid = Array.from({ length: N }, () => new Array(N).fill(null));
  s.tiles.forEach(x => { x.fresh = false; x.merged = false; grid[x.r][x.c] = x; });
  const lines = [];
  for (let k = 0; k < N; k++) {
    const cells = [];
    for (let j = 0; j < N; j++) {
      if (dir === 'left') cells.push([k, j]);
      if (dir === 'right') cells.push([k, N - 1 - j]);
      if (dir === 'up') cells.push([j, k]);
      if (dir === 'down') cells.push([N - 1 - j, k]);
    }
    lines.push(cells);
  }
  let moved = false, gained = 0;
  const merges = [];
  const keep = [];
  lines.forEach(cells => {
    const items = cells.map(([r, c]) => grid[r][c]).filter(Boolean);
    let slot = 0;
    for (let n = 0; n < items.length; n++) {
      const a = items[n], b = items[n + 1];
      const [r, c] = cells[slot];
      if (b && b.v === a.v) {
        if (a.r !== r || a.c !== c || b.r !== r || b.c !== c) moved = true;
        a.r = r; a.c = c; b.r = r; b.c = c;
        a.v *= 2; a.merged = true;
        gained += a.v;
        merges.push({ into: a.id, gone: b.id });
        keep.push(a);
        n++;
      } else {
        if (a.r !== r || a.c !== c) moved = true;
        a.r = r; a.c = c;
        keep.push(a);
      }
      slot++;
    }
  });
  if (moved) s.tiles = keep;
  return { moved: moved, gained: gained, merges: merges };
}

function g2048CanMove(s) {
  if (s.tiles.length < G2048_SIZE * G2048_SIZE) return true;
  const at = {};
  s.tiles.forEach(x => { at[x.r + ',' + x.c] = x.v; });
  return s.tiles.some(x => at[(x.r + 1) + ',' + x.c] === x.v || at[x.r + ',' + (x.c + 1)] === x.v);
}

function move2048(dir) {
  const s = g2048State();
  if (s.phase !== 'play' || g2048Busy) return;
  const before = { tiles: JSON.parse(JSON.stringify(s.tiles)), score: s.score, nextId: s.nextId, won: s.won };
  // The slide rewrites tile positions, so keep a copy of where the gone ones were headed.
  const snapshot = s.tiles.map(x => Object.assign({}, x));
  const res = g2048Slide(s, dir);
  if (!res.moved) {
    s.tiles.forEach(x => { x.merged = false; });
    // A board that is already stuck (brought back by a reload) ends on the next try.
    if (!g2048CanMove(s)) { g2048End(false); return; }
    const board = document.getElementById('g2048-board');
    if (board && board.animate && !motionOff()) {
      const push = { left: [-6, 0], right: [6, 0], up: [0, -6], down: [0, 6] }[dir];
      board.animate([{ transform: 'none' }, { transform: `translate(${push[0]}px, ${push[1]}px)` }, { transform: 'none' }], { duration: 160 });
    }
    return;
  }
  s.prev = before;
  s.score += res.gained;
  // The best follows the score as it grows, not only when a game ends. What it
  // was is kept with the move, so taking the move back takes its best back too.
  const best = soloBest('g2048', '');
  if (res.gained && (!best || s.score > best.score)) {
    before.best = best;
    before.raisedBest = true;
    soloRecord('g2048', '', { score: s.score, tile: Math.max.apply(null, s.tiles.map(x => x.v)) }, () => true);
    const bestEl = document.getElementById('g2048-bestv');
    if (bestEl) bestEl.textContent = s.score;
  }
  // Where each consumed tile slides to before it disappears.
  const gone = res.merges.map(m => {
    const survivor = s.tiles.find(x => x.id === m.into);
    const old = snapshot.find(x => x.id === m.gone);
    return Object.assign({}, old, { r: survivor.r, c: survivor.c, gone: true });
  });
  g2048Spawn(s);
  saveToLocal();
  paint2048(false, gone);
  if (res.gained) playSound('click');
  const top = Math.max.apply(null, s.tiles.map(x => x.v));
  // The sheets wait for the slide, and an undo inside that wait cancels them.
  if (top >= 2048 && !s.won) {
    s.won = true;
    saveToLocal();
    soloLater('g2048', 400, () => { if (s.phase === 'play' && s.won && !s.keepGoing) g2048End(true); });
    return;
  }
  if (!g2048CanMove(s)) soloLater('g2048', 400, () => { if (s.phase === 'play' && !g2048CanMove(s)) g2048End(false); });
}

/** A new game throws the board away, so a game with points on it asks first. */
function confirmNew2048() {
  const s = g2048State();
  if (s.phase === 'play' && s.score > 0) showConfirmModal((TRANSLATIONS[appState.lang] || {}).g2048_new_confirm || '', start2048);
  else start2048();
}

function undo2048() {
  const s = g2048State();
  if (!s.prev || s.phase !== 'play') return;
  if (s.prev.raisedBest) {
    soloSetBest('g2048', '', s.prev.best || null);
    const best = soloBest('g2048', '');
    const bestEl = document.getElementById('g2048-bestv');
    if (bestEl) bestEl.textContent = best ? best.score : 0;
  }
  s.tiles = s.prev.tiles;
  s.score = s.prev.score;
  s.nextId = s.prev.nextId;
  s.won = s.prev.won;
  s.prev = null;
  saveToLocal();
  paint2048(true);
}

/* --- Drawing ----------------------------------------------------------------------- */

function paint2048(full, gone) {
  const s = g2048State();
  const t = TRANSLATIONS[appState.lang];
  const stage = document.getElementById('g2048-stage');
  if (!stage) return;
  let board = document.getElementById('g2048-board');
  if (full || !board) {
    const best = soloBest('g2048', '');
    const bar = soloBarHtml([
      { label: t.g2048_score || '', value: s.score, id: 'g2048-score' },
      { label: t.solo_best || '', value: best ? best.score : 0, id: 'g2048-bestv' }
    ]);
  stage.innerHTML = `
      <div class="solo-layout">
      <div class="solo-layout__board">
      <div class="g2048-board" id="g2048-board" dir="ltr">
        ${Array.from({ length: G2048_SIZE * G2048_SIZE }, () => '<div class="g2048-cell"></div>').join('')}
        <div class="g2048-tiles" id="g2048-tiles"></div>
      </div>
      </div>
      <div class="solo-layout__side">
    ${bar}
      <p class="field__hint g2048-hint">${escapeHTML(t.g2048_hint || '')}</p>
      </div>
      </div>
      <div class="view-actions">
        <div class="btn-row">
          <button class="btn btn--neutral btn--sm" id="g2048-undo" onclick="undo2048()" ${s.prev ? '' : 'disabled'}>↶ ${escapeHTML(t.solo_undo || '')}</button>
          <button class="btn btn--neutral btn--sm" onclick="confirmNew2048()">🔄 ${escapeHTML(t.solo_new_game || '')}</button>
          <button class="btn btn--ghost btn--sm" onclick="setup2048()">${escapeHTML(t.exit || '')}</button>
        </div>
      </div>`;
    board = document.getElementById('g2048-board');
    g2048BindSwipe(board);
  }
  const layer = document.getElementById('g2048-tiles');
  if (!layer) return;
  const still = motionOff();
  const existing = {};
  layer.querySelectorAll('.g2048-tile').forEach(el => { existing[el.dataset.id] = el; });
  const place = (el, x) => { el.style.setProperty('--r', x.r); el.style.setProperty('--c', x.c); };

  // The tiles that merged away slide into their partner, then go.
  (gone || []).forEach(x => {
    const el = existing[x.id];
    if (!el) return;
    delete existing[x.id];
    el.classList.add('is-gone');
    place(el, x);
    setTimeout(() => el.remove(), still ? 0 : G2048_SLIDE_MS);
  });

  s.tiles.forEach(x => {
    let el = existing[x.id];
    if (!el) {
      el = document.createElement('div');
      el.className = 'g2048-tile';
      el.dataset.id = x.id;
      layer.appendChild(el);
      place(el, x);
      el.textContent = x.v;
      el.dataset.v = x.v > 2048 ? 'big' : x.v;
      if (!still && !full) {
        el.classList.add('is-new');
        el.style.animationDelay = G2048_SLIDE_MS + 'ms';
      }
    } else {
      delete existing[x.id];
      place(el, x);
      if (x.merged) {
        // The value changes when the pair meets, with a pop.
        const apply = () => {
          el.textContent = x.v;
          el.dataset.v = x.v > 2048 ? 'big' : x.v;
          if (!still) { el.classList.remove('is-merged'); void el.offsetWidth; el.classList.add('is-merged'); }
        };
        if (still) apply(); else setTimeout(apply, G2048_SLIDE_MS);
      }
    }
  });
  Object.values(existing).forEach(el => el.remove());

  const scoreEl = document.getElementById('g2048-score');
  if (scoreEl) scoreEl.textContent = s.score;
  const undo = document.getElementById('g2048-undo');
  if (undo) undo.disabled = !s.prev;
  g2048Busy = !still && !full;
  if (g2048Busy) setTimeout(() => { g2048Busy = false; }, G2048_SLIDE_MS);
}

function g2048BindSwipe(board) {
  let start = null;
  board.addEventListener('pointerdown', (e) => {
    start = { x: e.clientX, y: e.clientY };
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
  });
  const end = (e) => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move2048(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  };
  board.addEventListener('pointerup', end);
  board.addEventListener('pointercancel', () => { start = null; });
}

function g2048End(won) {
  const s = g2048State();
  const t = TRANSLATIONS[appState.lang];
  const top = Math.max.apply(null, s.tiles.map(x => x.v).concat([0]));
  const rec = soloRecord('g2048', '', { score: s.score, tile: top }, (a, b) => a.score > b.score || (a.score === b.score && a.tile > b.tile));
  if (!rec.record && rec.prev && rec.prev.score === s.score) rec.record = true;
  const bestEl = document.getElementById('g2048-bestv');
  if (bestEl && rec.record) bestEl.textContent = s.score;
  if (won) {
    soloResult({
      icon: '🏆', title: t.g2048_won || '', value: s.score, valueLabel: t.g2048_score || '',
      lines: [escapeHTML(t.g2048_keep_hint || '')], win: true, look: false,
      again: () => { s.keepGoing = true; saveToLocal(); }, againLabel: t.g2048_keep_going || '',
      exit: () => { s.phase = 'done'; saveToLocal(); setup2048(); }
    });
    return;
  }
  s.phase = 'done';
  saveToLocal();
  const lines = [`${escapeHTML(t.g2048_top || '')}: <b>${top}</b>`];
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.score}`);
  soloResult({
    icon: '🔷', title: rec.record ? (t.solo_new_best || '') : (t.g2048_over || ''),
    value: s.score, valueLabel: t.g2048_score || '', lines: lines, win: rec.record,
    again: start2048, exit: setup2048
  });
}

function restore2048() {
  const s = g2048State();
  if (s.phase !== 'play' || !s.tiles.length) return false;
  paint2048(true);
  if (!g2048CanMove(s)) soloLater('g2048', 300, () => { if (s.phase === 'play' && !g2048CanMove(s)) g2048End(false); });
  return true;
}

document.addEventListener('keydown', (e) => {
  if (appState.currentView !== 'play-g2048' || soloKeyBlocked(e)) return;
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key];
  if (!dir) return;
  e.preventDefault();
  move2048(dir);
});

soloRegister('g2048', {
  setup: 'setup-g2048', play: 'play-g2048', paintSetup: paint2048Setup, restore: restore2048,
  state: g2048State, resume: continue2048, repaint: () => paint2048(true)
});
</script>
