<script>
/* ============================================================================
   Stockfish for the chess coach and the review (the owner, 4 Oct 2026)
   ----------------------------------------------------------------------------
   The app's own engine (Chess.js) sees four or five moves ahead, so the coach
   now and then called a good move a blunder. The coach's looks - the warning,
   the word after each move, the hint, the best-move arrows - and the review
   after a game ask Stockfish 19 instead: the "lite single-threaded" build of
   Stockfish.js (vendor/stockfish/README.md, GPLv3), 1.8 MB, copied into g/
   beside the games' chunks and kept for offline like one. It runs in a Web
   Worker, so the page never stands still while it thinks (the app's own engine
   ran on the page).

   The computer you play against stays the app's own engine below 1400 (it
   plays like a beginner the way Stockfish can't, and keeps the characters'
   styles); from 1400 - الكابتن, الأستاذ, الجنرال - Stockfish plays, held to
   the rating (chSfPlay). Chess960 is Stockfish's too (its UCI_Chess960,
   chSf960). The one game Stockfish doesn't know stays the app's own:
   الوزير المستخبي (a pawn that is secretly a queen). Anything that
   goes wrong - no Worker, no WebAssembly, the file not loading, no answer in
   time - leaves Stockfish off for the rest of the visit and every look falls
   back to the app's own engine, as before.

   One worker answers one question at a time (a queue). Each question is a
   position (FEN), a count of positions to search (`go nodes`: on one phone the
   same position gives the same answer) and how many lines; the answer has the
   shape chessAnalyse gives (move, san, score for the side to move with a mate
   as CHESS_MATE less its plies, mate, pv, lines), with `sf: true`, so
   chessJudge, the reasons and the review read it unchanged.
   ========================================================================= */

// Positions searched per look: on this PC 120,000 is about depth 14 in 0.15 s, on a phone
// about three times as long. The review asks once for every position of the game.
const CH_SF = { file: 'g/sf19-lite.js', coach: 150000, best: 200000, review: 120000, timeout: 30000 };
const chSf = { w: null, ready: null, failed: false, busy: null, queue: [], onLine: null, memo: new Map(), inflight: new Map(), simd: null };

/** Can Stockfish look at this game? Any chess but الوزير المستخبي, on a phone that runs it. */
function chSfFits(g, hq) {
  return !(chSf.failed || hq || !g || typeof Worker === 'undefined' || typeof WebAssembly !== 'object' || !chSfSimd());
}

/**
 * The build needs WebAssembly SIMD (iOS 16.4+, Chrome 91+); without it the worker aborts quietly and
 * every first look of a visit waited the 30 s timeout. A tiny SIMD module is validated once instead.
 */
function chSfSimd() {
  if (chSf.simd === null) {
    try { chSf.simd = !!WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11])); } catch (e) { chSf.simd = false; }
  }
  return chSf.simd;
}

/** A line saying the engine itself has died (the wasm failed to load or aborted): no answer will come. */
const chSfDead = (line) => line.indexOf('Aborted(') === 0 || line.indexOf('failed to asynchronously prepare wasm') !== -1;

/**
 * Is this a Chess960 position for Stockfish (its UCI_Chess960, castling written as the king
 * taking its own rook)? A castling rook off the a- or h-file, or a king that may castle off
 * the e-file. Our FEN (X-FEN) is read as it is: checked against our own rules, ten 960 games,
 * the same legal moves, castling included (4 Oct 2026).
 */
function chSf960(g) {
  const r = g.rooks || [7, 0, 7, 0];
  if (r[0] !== 7 || r[1] !== 0 || r[2] !== 7 || r[3] !== 0) return true;
  const c = g.castle || 0;
  return !!(((c & 3) && g.board[4] !== 6) || ((c & 12) && g.board[60] !== 14));
}

/** Stockfish off for this visit: the worker gone, every question waiting answered with null (the app's own engine). */
function chSfFail() {
  chSf.failed = true;
  try { if (chSf.w) chSf.w.terminate(); } catch (e) { /* gone already */ }
  chSf.w = null;
  const waiting = (chSf.busy ? [chSf.busy] : []).concat(chSf.queue.splice(0));
  chSf.busy = null;
  waiting.forEach(job => { clearTimeout(job.timer); job.done(null); });
}

/** Starts the worker once: true when it has said readyok. */
function chSfStart() {
  if (chSf.ready) return chSf.ready;
  chSf.ready = new Promise((resolve) => {
    let w;
    try { w = new Worker(CH_SF.file); } catch (e) { chSfFail(); resolve(false); return; }
    chSf.w = w;
    const t = setTimeout(() => { chSf.onLine = null; chSfFail(); resolve(false); }, CH_SF.timeout);
    chSf.onLine = (line) => {
      if (line === 'readyok') { clearTimeout(t); chSf.onLine = null; resolve(true); }
      else if (chSfDead(line)) { clearTimeout(t); chSf.onLine = null; chSfFail(); resolve(false); }
    };
    w.onmessage = (e) => chSfLine(String(e.data));
    w.onerror = () => { clearTimeout(t); chSf.onLine = null; chSfFail(); resolve(false); };
    w.postMessage('uci');
    w.postMessage('setoption name Hash value 16');
    w.postMessage('isready');
  });
  return chSf.ready;
}

/**
 * Stockfish's look at a position, or null when it can't (the caller then asks the
 * app's own engine). opts: { nodes, lines, hq (الوزير المستخبي: never Stockfish) }.
 */
function chSfAnalyse(g, opts) {
  const o = opts || {};
  if (!chSfFits(g, o.hq)) return Promise.resolve(null);
  const lines = Math.max(1, Number(o.lines) || 1);
  // A game over needs no search: the app's own answer (mated, or a draw), at once.
  if (chessStatus(g).over) return Promise.resolve(Object.assign(chessAnalyse(g, { lines: lines }), { sf: true }));
  const fen = chessFen(g);
  const nodes = o.nodes || CH_SF.coach;
  const key = fen + '|' + nodes + '|' + lines;
  if (chSf.memo.has(key)) return Promise.resolve(chSf.memo.get(key));
  // The same position asked again while it is still queued or searched (the coach's look on your turn,
  // then its verdict after a quick move) shares that search instead of queueing a second one.
  if (chSf.inflight.has(key)) return chSf.inflight.get(key);
  const p = chSfStart().then(ok => (!ok ? null : new Promise((done) => {
    chSf.queue.push({ g: chessCloneGame(g), c960: chSf960(g), fen: fen, nodes: nodes, lines: lines, key: key, info: {}, timer: 0, done: done });
    chSfNext();
  })));
  chSf.inflight.set(key, p);
  p.then(() => { if (chSf.inflight.get(key) === p) chSf.inflight.delete(key); });
  return p;
}

/**
 * The computer's move at the top ratings (the owner, 4 Oct 2026: الكابتن, الأستاذ, الجنرال
 * and a chosen rating from CH_SF_PLAY_MIN): Stockfish held to that rating by its own UCI_LimitStrength, thinking
 * `ms`. opts: { elo, ms, hq, start (FEN, '' for the usual start), moves (the game's, UCI) }.
 * A promise of { from, to, promo }, or null (then the app's own engine plays).
 */
const CH_SF_PLAY_MIN = 1400;
function chSfPlay(g, opts) {
  const o = opts || {};
  if (!chSfFits(g, o.hq) || chessStatus(g).over) return Promise.resolve(null);
  const elo = Math.max(1320, Math.min(3190, Math.round(Number(o.elo) || 2000)));
  return chSfStart().then(ok => (!ok ? null : new Promise((done) => {
    // The whole game from its start, so Stockfish knows the positions met before (a repetition is a draw).
    const hist = (o.moves || []).filter(u => /^[a-h][1-8][a-h][1-8][qrbn]?$/.test(u));
    // A Chess960 game is sent as its position only: our record writes castling as the king's own move.
    // A 960 start counts even once both sides' rights are gone (the record still holds its king-takes-rook castles).
    const c960 = chSf960(g) || (!!o.start && chSf960(chessFromFen(o.start)));
    const pos = !c960 && hist.length && hist.length === o.moves.length ? (o.start ? 'fen ' + o.start : 'startpos') + ' moves ' + hist.join(' ') : 'fen ' + chessFen(g);
    chSf.queue.push({ g: chessCloneGame(g), c960: c960, fen: chessFen(g), pos: pos, lines: 1, elo: elo, ms: Math.max(100, Math.round(o.ms || 800)), info: {}, timer: 0, done: done });
    chSfNext();
  })));
}

function chSfNext() {
  if (chSf.busy || !chSf.queue.length || !chSf.w) return;
  const job = chSf.busy = chSf.queue.shift();
  job.timer = setTimeout(chSfFail, CH_SF.timeout);
  // Every question says how strong to be: a move at a rating is held down, an analysis never is.
  chSf.w.postMessage('setoption name UCI_Chess960 value ' + (job.c960 ? 'true' : 'false'));
  chSf.w.postMessage('setoption name UCI_LimitStrength value ' + (job.elo ? 'true' : 'false'));
  if (job.elo) chSf.w.postMessage('setoption name UCI_Elo value ' + job.elo);
  chSf.w.postMessage('setoption name MultiPV value ' + job.lines);
  chSf.w.postMessage('position ' + (job.pos || 'fen ' + job.fen));
  chSf.w.postMessage(job.elo ? 'go movetime ' + job.ms : 'go nodes ' + job.nodes);
}

/** A line from the worker: the start's readyok, a search's progress (the last line of each multipv kept), its bestmove. */
function chSfLine(line) {
  if (chSf.onLine) chSf.onLine(line);
  if (chSfDead(line)) { if (chSf.w) chSfFail(); return; }
  const job = chSf.busy;
  if (!job) return;
  // A position Stockfish refused (an illegal move in it): no bestmove will come, but the engine lives on -
  // this question gets the app's own engine at once and the next one is asked.
  if (line.indexOf('info string CRITICAL ERROR') === 0) {
    clearTimeout(job.timer);
    chSf.busy = null;
    job.done(null);
    chSfNext();
    return;
  }
  if (line.indexOf('info ') === 0 && line.indexOf(' pv ') !== -1 && !/ (lower|upper)bound /.test(line)) {
    const num = (k) => { const m = line.match(new RegExp(' ' + k + ' (-?\\d+)')); return m ? Number(m[1]) : null; };
    const mate = num('score mate'), cp = num('score cp');
    if (mate === null && cp === null) return;
    job.info[num('multipv') || 1] = { depth: num('depth') || 0, mate: mate, cp: cp, pv: line.slice(line.indexOf(' pv ') + 4).trim().split(/\s+/) };
    return;
  }
  if (line.indexOf('bestmove') !== 0) return;
  clearTimeout(job.timer);
  chSf.busy = null;
  let res = null;
  try { res = job.elo ? chSfMove(job, line) : chSfResult(job); } catch (e) { res = null; }
  if (res && !job.elo) {
    if (chSf.memo.size > 200) chSf.memo.delete(chSf.memo.keys().next().value);
    chSf.memo.set(job.key, res);
  }
  job.done(res);
  chSfNext();
}

/** Stockfish's score as the app's: centipawns, or a mate as CHESS_MATE less its plies (+ for the side to move). */
const chSfScore = (x) => (x.mate !== null ? (x.mate > 0 ? CHESS_MATE - (2 * x.mate - 1) : -(CHESS_MATE - 2 * -x.mate)) : x.cp);

/** A line of moves in UCI as the app's moves with their SAN, as far as they are legal. */
function chSfPv(g, ucis, max) {
  const q = chessCloneGame(g);
  const out = [];
  for (let i = 0; i < ucis.length && out.length < (max || 12); i++) {
    const info = chessPlay(q, chessFromUci(ucis[i]));
    if (!info) break;
    // uci keeps a 960 castle as Stockfish wrote it (the king taking its rook): replayed through chessFromUci
    // it castles, where from/to (the king's square) can be read as a plain king step.
    out.push({ from: info.from, to: info.to, promo: info.promo || '', san: info.san, uci: info.uci });
  }
  return out;
}

/** A move to play, from `bestmove e2e4` - only if it is legal here. */
function chSfMove(job, line) {
  const u = (line.split(/\s+/)[1] || '');
  if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(u)) return null;
  const mv = chessFromUci(u);
  const info = chessPlay(chessCloneGame(job.g), mv);
  // As the record writes it: a 960 castle where the king moves one square stays a castle (not a king step).
  return info ? Object.assign(chessFromUci(info.uci), { promo: info.promo || '' }) : null;
}

/** The answer, in chessAnalyse's shape, from what the search said last. */
function chSfResult(job) {
  const top = job.info[1];
  if (!top) return null;
  const pv = chSfPv(job.g, top.pv);
  if (!pv.length) return null;
  const score = chSfScore(top);
  const out = {
    over: false, move: { from: pv[0].from, to: pv[0].to, promo: pv[0].promo, uci: pv[0].uci }, san: pv[0].san,
    score: score, mate: chessMateIn(score), pv: pv, depth: top.depth, sf: true
  };
  if (job.lines > 1) {
    // A search stopped by its count of positions may not have redone every line at its last depth:
    // a line left from a shallower one can name a move another line has now. One line a move, the deepest.
    const byMove = new Map();
    Object.keys(job.info).map(Number).sort((a, b) => a - b).forEach(k => {
      const x = job.info[k];
      const m = chSfPv(job.g, x.pv, 1)[0];
      if (!m) return;
      const u = m.uci || (m.from + m.to + (m.promo || ''));
      const had = byMove.get(u);
      if (had && had.depth >= x.depth) return;
      const sc = chSfScore(x);
      byMove.set(u, { move: { from: m.from, to: m.to, promo: m.promo, uci: m.uci }, from: m.from, to: m.to, promo: m.promo, san: m.san, score: sc, mate: chessMateIn(sc), depth: x.depth, k: k });
    });
    out.lines = [...byMove.values()].sort((a, b) => b.score - a.score || a.k - b.k);
  }
  return out;
}
</script>
