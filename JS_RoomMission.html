<script>
/* ============================================================================
   🕵️ المهمة السرية — the page's side (a chunk of its own, 'mission', with Missions.js)
   ----------------------------------------------------------------------------
   A switch on the room (RoomMission.js), not a game: everything here runs beside
   whatever the room plays, on any screen of the app while the phone is in a room.
   The look is «ملف سري» (the owner's pick, 1 Oct 2026): a cardboard folder stamped
   سري للغاية that opens like a book while it is held, the mission typed out on a
   typewriter, the target's photo clipped in the corner; the buttons are rubber
   stamps; the host's setup a folder with four tabs (the place) and two stamps (the
   company); the TV a cork board - closed files piling up by each photo, a ticker
   when one closes, and at the end the photos joined by red strings.

   The shell (JS_Room.html) loads this chunk as soon as a room's state carries a
   mission, draws the host's door before that, and calls missionSync on every state.
   Nothing secret ever reaches a screen: the server sends a TV the public part only.
   ========================================================================= */

const msn = {
  code: '', feedSeen: null, noSeen: {}, wonSeen: 0, bustSeen: 0, catchSeen: 0,
  asking: null, askQueue: [], askTimer: null, calmRuns: 0,
  mode: '', sig: '', hold: false, typeTimer: null, catchOpen: false, tick: null,
  setup: null, revealShown: '', tvTickerTimer: null, tvRevealKey: '', tvRevealClosed: ''
};
const MISSION_PLACE_ICON = { home: '🏠', cafe: '☕', out: '🚗', any: '💬' };
const MISSION_SEEN_KEY = 'ashryMissionSeen_v1';

function missionT() { return TRANSLATIONS[appState.lang] || {}; }
function missionLang() { return typeof contentLang === 'function' ? contentLang() : appState.lang; }
function missionOn(state) { return !!(state && state.mission && state.mission.on && state.mission.phase === 'on'); }
function missionNameOf(state, id) {
  const p = ((state && state.players) || []).find(x => x.id === id);
  return p ? p.name : (((state && state.mission && state.mission.names) || {})[id] || '');
}
function missionFmt(s, map) { return String(s || '').replace(/\{(\w+)\}/g, (m, k) => (map[k] !== undefined ? map[k] : m)); }
function missionAr(n) { return appState.lang === 'ar' ? String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]) : String(n); }
function missionClockText(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return missionAr(Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'));
}
function missionNow() { return typeof roomServerNow === 'function' ? roomServerNow() : Date.now(); }

/* --- the drawn photo: a face from the name, the same on every phone and the TV ------------- */
function missionFaceSvg(name) {
  let h = 0;
  for (const ch of String(name || '?')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const pick = (list, salt) => list[((h >>> salt) ^ (h * (salt + 7))) % list.length >>> 0];
  const K = '#221f36';
  const skin = pick(['#f2c4a0', '#e0ac85', '#c98c62', '#f5d3b5', '#a8714f'], 1);
  const shirt = pick(['#e5387b', '#2f6fd6', '#1f9d55', '#f59e0b', '#7c3aed', '#0d9488', '#be123c', '#6b7280'], 3);
  const hair = pick(['short', 'long', 'hijab', 'spiky', 'bun', 'curly', 'bald'], 5);
  const hc = hair === 'hijab' ? pick(['#7c3aed', '#1e3a8a', '#0d9488', '#be123c', '#a16207'], 9) : pick(['#2b1d14', '#3b2a20', '#5a3b2a', '#221f36', '#8a5a2b'], 9);
  const glasses = ((h >>> 11) % 4) === 0;
  let s = '<svg viewBox="0 0 80 84" aria-hidden="true" focusable="false">';
  s += `<path d="M8 84 Q8 58 40 58 Q72 58 72 84Z" fill="${shirt}" stroke="${K}" stroke-width="3"/>`;
  if (hair === 'hijab') {
    s += `<path d="M14 42 Q12 10 40 10 Q68 10 66 42 L70 66 Q40 76 10 66Z" fill="${hc}" stroke="${K}" stroke-width="3"/><circle cx="40" cy="38" r="17" fill="${skin}" stroke="${K}" stroke-width="3"/>`;
  } else {
    if (hair === 'long') s += `<path d="M16 36 Q14 10 40 10 Q66 10 64 36 L66 62 H14Z" fill="${hc}" stroke="${K}" stroke-width="3"/>`;
    if (hair === 'bun') s += `<circle cx="40" cy="12" r="9" fill="${hc}" stroke="${K}" stroke-width="3"/>`;
    s += `<circle cx="40" cy="36" r="22" fill="${skin}" stroke="${K}" stroke-width="3"/>`;
    if (hair === 'short') s += `<path d="M18 32 Q19 12 40 12 Q61 12 62 32 Q52 22 40 22 Q28 22 18 32Z" fill="${hc}"/>`;
    if (hair === 'long') s += `<path d="M18 30 Q22 14 40 14 Q58 14 62 30 Q50 20 40 24 Q30 20 18 30Z" fill="${hc}"/>`;
    if (hair === 'bun') s += `<path d="M18 30 Q20 14 40 14 Q60 14 62 30 Q52 22 40 22 Q28 22 18 30Z" fill="${hc}"/>`;
    if (hair === 'spiky') s += `<path d="M18 30 L20 12 L29 20 L35 7 L43 18 L51 7 L55 20 L63 13 L62 31 Q50 22 40 22 Q28 22 18 30Z" fill="${hc}"/>`;
    if (hair === 'curly') s += `<g fill="${hc}"><circle cx="24" cy="22" r="7"/><circle cx="34" cy="15" r="8"/><circle cx="46" cy="15" r="8"/><circle cx="56" cy="22" r="7"/></g>`;
    if (hair === 'bald') s += `<path d="M19 38 Q18 28 23 25 M61 38 Q62 28 57 25" stroke="${hc}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  }
  s += `<circle cx="33" cy="37" r="3" fill="${K}"/><circle cx="47" cy="37" r="3" fill="${K}"/><path d="M33 46 Q40 52 47 46" stroke="${K}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (glasses) s += `<g fill="none" stroke="${K}" stroke-width="2.5"><circle cx="33" cy="37" r="6.5"/><circle cx="47" cy="37" r="6.5"/><path d="M39.5 37h1"/></g>`;
  return s + '</svg>';
}

/* --- the lobby: the host's door, the running card, the closed file ------------------------- */
function missionLobbyHtml(state, tv) {
  const m = state.mission;
  const t = missionT();
  if (!m || (!m.on && m.phase !== 'reveal')) return typeof roomMissionDoorHtml === 'function' ? roomMissionDoorHtml(state, t) : '';
  if (m.phase === 'reveal') {
    const r = m.reveal || {};
    const champs = (r.champs || []).map(id => missionNameOf(state, id)).filter(Boolean);
    return `
      <section class="msn-card msn-card--closed">
        <span class="msn-card__tab">${escapeHTML(t.mission_ended || '')}</span>
        <div class="msn-card__row">
          <span class="msn-card__icon" aria-hidden="true">📁</span>
          <span class="msn-card__text">
            <b>${escapeHTML(t.mission_reveal_title || '')}</b>
            <small>${champs.length ? escapeHTML((t.mission_champ || '') + ': ' + champs.join('، ')) : escapeHTML(t.mission_no_champ || '')}</small>
          </span>
        </div>
        <div class="msn-card__acts">
          ${tv ? '' : `<button type="button" class="msn-stamp msn-stamp--paper" onclick="missionOpenReveal()">${escapeHTML(t.mission_read_story || '')}</button>`}
          ${state.youAreHost ? `<button type="button" class="msn-stamp" onclick="roomAct('missionClose', {})">${escapeHTML(t.mission_close_file || '')}</button>` : ''}
        </div>
      </section>`;
  }
  const me = m.me;
  const mine = me ? (m.score || {})[Room.me] || 0 : 0;
  const place = `${MISSION_PLACE_ICON[m.place] || ''} ${t['mission_place_' + m.place] || ''}`;
  const co = t['mission_co_' + m.co] || '';
  const fresh = me && me.n && Number(localStorage.getItem('ashryMissionN_' + state.code) || 0) !== me.n;
  return `
    <section class="msn-card${m.paused ? ' is-paused' : ''}">
      <span class="msn-card__tab">🕵️ ${escapeHTML(t.mission_title || '')}</span>
      <div class="msn-card__row">
        <span class="msn-card__text">
          <b>${escapeHTML(t.mission_door_on || '')}</b>
          <small>${escapeHTML(place)} · ${escapeHTML(co)}${me ? ' · ' + escapeHTML(missionFmt(t.mission_files_closed || '', { n: missionAr(mine) })) : ''}</small>
        </span>
        ${state.youAreHost ? `<button type="button" class="btn btn--ghost btn--xs btn--auto" onclick="missionOpenSetup()">⚙️ ${escapeHTML(t.mission_settings || '')}</button>` : ''}
      </div>
      ${m.paused ? `<p class="msn-card__note">${escapeHTML(t.mission_paused || '')}</p>` : ''}
      ${me && !tv && !m.paused ? `<button type="button" class="msn-stamp msn-stamp--wide${fresh ? ' is-fresh' : ''}" onclick="missionOpenFile()">${escapeHTML(t.mission_open_file || '')}</button>` : ''}
    </section>`;
}

/* --- the host's setup: a folder, four tabs for the place, two stamps for the company -------- */
function missionSetupDefaults() {
  const st = Room.state;
  const m = st && st.mission;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('ashryMissionSetup_v1') || '{}') || {}; } catch (e) { saved = {}; }
  return {
    place: (m && m.place) || saved.place || 'home',
    co: (m && m.co) || saved.co || 'family',
    swap: m ? m.swap !== false : saved.swap !== false,
    catch: m ? m.catch !== false : saved.catch !== false
  };
}

function missionOpenSetup() {
  const st = Room.state;
  if (!st || !st.youAreHost) return;
  msn.setup = missionSetupDefaults();
  msn.mode = 'setup';
  missionPaintModal(true);
  missionShowModal();
}

function missionSetupHtml(state) {
  const t = missionT();
  const s = msn.setup;
  const on = missionOn(state);
  const pool = missionPool(s.place, s.co);
  const lang = missionLang();
  // Three of the missions that fit, the same three while the sheet stays on this choice.
  const ex = pool.slice().sort((a, b) => ((a + s.place).charCodeAt(1) ^ 7) - ((b + s.place).charCodeAt(1) ^ 7)).slice(0, 3)
    .map(id => `<li>${escapeHTML(missionText(id, lang, lang === 'en' ? 'Mona' : 'منى'))}</li>`).join('');
  const tab = (p) => `<button type="button" class="msn-tabs__tab" role="tab" aria-selected="${s.place === p}" onclick="missionSetPlace('${p}')"><span aria-hidden="true">${MISSION_PLACE_ICON[p]}</span><span>${escapeHTML(t['mission_place_' + p] || p)}</span></button>`;
  const stamp = (c) => `<button type="button" class="msn-co" aria-pressed="${s.co === c}" onclick="missionSetCo('${c}')">${escapeHTML(t['mission_co_' + c] || c)}<small>${escapeHTML(t['mission_co_' + c + '_sub'] || '')}</small></button>`;
  const opt = (k, key) => `
    <label class="switch-row msn-opt">
      <span class="switch-row__label">${escapeHTML(t[key] || '')}</span>
      <span class="switch"><input type="checkbox" ${s[k] ? 'checked' : ''} onchange="missionSetOpt('${k}', this.checked)"><span class="switch__track"></span></span>
    </label>`;
  return `
    <div class="msn-setup">
      <div class="msn-setup__head">
        <span class="msn-setup__icon" aria-hidden="true">🕵️</span>
        <div>
          <div class="sheet__title">${escapeHTML(t.mission_title || '')}</div>
          <p class="sheet__subtitle">${escapeHTML(on ? (t.mission_door_on || '') : (t.mission_door_off || ''))}</p>
        </div>
      </div>
      <div class="msn-dossier">
        <div class="msn-tabs" role="tablist" aria-label="${escapeHTML(t.mission_place || '')}">${['home', 'cafe', 'out', 'any'].map(tab).join('')}</div>
        <div class="msn-dossier__body">
          <div>
            <div class="msn-lbl">${escapeHTML(t.mission_place || '')}</div>
            <div class="msn-place">${escapeHTML(t['mission_place_' + s.place + '_long'] || '')}</div>
          </div>
          <div class="msn-lbl">${escapeHTML(t.mission_company || '')}</div>
          <div class="msn-cos">${stamp('family')}${stamp('friends')}</div>
          <div class="msn-lbl">${escapeHTML(missionFmt(t.mission_examples || '', { n: missionAr(pool.length) }))}</div>
          <ol class="msn-ex">${ex}</ol>
        </div>
      </div>
      <div class="msn-opts">
        ${opt('swap', 'mission_opt_swap')}
        ${opt('catch', 'mission_opt_catch')}
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn--primary btn--lg" onclick="missionSetupGo()">${escapeHTML(on ? (t.mission_save || '') : (t.mission_start || ''))}</button>
        ${on ? `<button type="button" class="btn btn--danger-soft" onclick="missionTurnOff()">${escapeHTML(t.mission_turn_off || '')}</button>` : ''}
        <button type="button" class="btn btn--ghost" onclick="missionCloseModal()">${escapeHTML(t.cancel || '')}</button>
        <button type="button" class="btn btn--ghost btn--sm" onclick="missionHelp()">📘 ${escapeHTML(t.mission_help || '')}</button>
      </div>
    </div>`;
}

function missionSetPlace(p) { if (!msn.setup) return; msn.setup.place = p; missionPaintModal(true); haptic('light'); }
function missionSetCo(c) { if (!msn.setup) return; msn.setup.co = c; missionPaintModal(true); haptic('light'); }
function missionSetOpt(k, v) { if (msn.setup) msn.setup[k] = !!v; }
async function missionSetupGo() {
  const s = msn.setup;
  if (!s) return;
  try { localStorage.setItem('ashryMissionSetup_v1', JSON.stringify(s)); } catch (e) {}
  const wasOn = missionOn(Room.state);
  try {
    await Room.act('missionSet', { on: true, place: s.place, co: s.co, swap: s.swap, catch: s.catch });
    missionCloseModal();
    if (!wasOn) { playSound('success'); haptic('success'); }
  } catch (err) {
    showToast(err.message || '', 'error');
  }
}
function missionTurnOff() {
  const t = missionT();
  missionCloseModal();
  showConfirmModal(t.mission_turn_off_q || '', () => roomAct('missionSet', { on: false }));
}
function missionHelp() {
  missionCloseModal();
  if (typeof openHelpModal === 'function') openHelpModal();
  setTimeout(() => { if (typeof helpJumpTo === 'function') helpJumpTo('mission'); }, 60);
}

/* --- the file: held to open like a book, the mission typed out ------------------------------ */
function missionOpenFile() {
  const st = Room.state;
  if (!missionOn(st) || !st.mission.me) return;
  msn.mode = 'file';
  msn.catchOpen = false;
  missionPaintModal(true);
  missionShowModal();
  haptic('light');
}
/* The 📁 in the header: the file, or the story once the evening's file is closed. */
function missionFabTap() {
  const st = Room.state;
  if (st && st.mission && st.mission.phase === 'reveal') { missionOpenReveal(); return; }
  if (missionOn(st) && st.mission.me && !st.mission.paused) { missionOpenFile(); return; }
  if (st && st.mission && st.mission.paused) showToast(missionT().mission_paused || '');
}

function missionFileSig(state) {
  const m = state.mission || {};
  const me = m.me || {};
  return [state.code, m.phase, m.paused, me.n, me.to, me.waiting, me.swapAt, me.catchAt, (m.score || {})[Room.me] || 0,
    m.swap, m.catch, msn.catchOpen, (state.players || []).map(p => p.id + p.name).join(','), appState.lang].join('|');
}

function missionFileHtml(state) {
  const t = missionT();
  const m = state.mission;
  const me = m.me || {};
  const myName = missionNameOf(state, Room.me);
  const target = missionNameOf(state, me.to);
  const score = (m.score || {})[Room.me] || 0;
  const now = missionNow();
  const swapLeft = me.swapAt ? me.swapAt - now : 0;
  const catchLeft = me.catchAt ? me.catchAt - now : 0;
  const others = state.players.filter(p => !p.bot && p.id !== Room.me);
  const fileNo = missionAr(String(me.n || 0).padStart(3, '0'));
  if (m.paused || !me.m) {
    return `<div class="msn-file-wrap"><p class="msn-paused">${escapeHTML(t.mission_paused || '')}</p>
      <div class="modal-actions"><button type="button" class="btn btn--ghost" onclick="missionCloseModal()">${escapeHTML(t.close || t.cancel || '')}</button></div></div>`;
  }
  return `
    <div class="msn-file-wrap${me.waiting ? ' is-waiting' : ''}">
      <div class="msn-tally"><span>${escapeHTML(missionFmt(t.mission_files_closed || '', { n: '' }))}<b>${missionAr(score)}</b></span>
        <button type="button" class="msn-x" onclick="missionCloseModal()" aria-label="${escapeHTML(t.close || '')}">✕</button></div>
      <div class="msn-file" id="msn-file" tabindex="0" role="button" aria-label="${escapeHTML(t.mission_hold || '')}"
           onpointerdown="missionHoldDown(event)" onpointerup="missionHoldUp()" onpointercancel="missionHoldUp()" onlostpointercapture="missionHoldUp()"
           onkeydown="missionHoldKey(event, true)" onkeyup="missionHoldKey(event, false)" onblur="missionHoldUp()" oncontextmenu="return false">
        <div class="msn-paper">
          <svg class="msn-clip" viewBox="0 0 20 50" aria-hidden="true"><path d="M6 44 V10 a5 5 0 0 1 10 0 V40 a3 3 0 0 1 -6 0 V14" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/></svg>
          <div class="msn-polaroid"><span class="msn-face">${missionFaceSvg(target)}</span><span class="msn-polaroid__cap">${escapeHTML(t.mission_target || '')}</span></div>
          <h4 class="msn-paper__title">${escapeHTML(t.mission_order || '')}</h4>
          <div class="msn-paper__meta">${escapeHTML(missionFmt(t.mission_agent || '', { name: myName, n: fileNo }))}</div>
          <div class="msn-paper__target">${escapeHTML(t.mission_target || '')}:<b><bdi>${escapeHTML(target)}</bdi></b></div>
          <p class="msn-type"><span class="msn-type__lbl">${escapeHTML(t.mission_mission || '')}:</span><span id="msn-type-text"></span><i class="msn-caret" aria-hidden="true"></i></p>
          <div class="msn-paper__sig"><span>${escapeHTML(t.mission_nobody_knows || '')}</span><b>${escapeHTML(t.mission_hq || '')}</b></div>
          <div class="msn-done-stamp" aria-hidden="true">${escapeHTML(t.mission_done_stamp || '')}</div>
          <div class="msn-wait"><span><i aria-hidden="true">✍️</i>${escapeHTML(missionFmt(t.mission_waiting || '', { name: target }))}</span></div>
        </div>
        <div class="msn-cover" aria-hidden="true">
          <span class="msn-cover__tab">${escapeHTML(missionFmt(t.mission_file_no || '', { n: fileNo }))}</span>
          <span class="msn-cover__secret">${escapeHTML(t.mission_secret || '')}</span>
          <span class="msn-cover__who">${escapeHTML(missionFmt(t.mission_to_agent || '', { name: myName }))}</span>
          <svg viewBox="0 0 60 70" aria-hidden="true"><g fill="none" stroke="#8a6b4a" stroke-width="2.5" stroke-linecap="round"><path d="M30 8 C14 8 8 22 8 34 C8 50 14 60 20 64"/><path d="M30 16 C19 16 15 26 15 36 C15 48 20 56 26 62"/><path d="M30 24 C24 24 22 30 22 38 C22 48 26 54 32 60"/><path d="M30 32 C29 40 30 50 38 58"/><path d="M30 8 C46 8 52 22 52 34 C52 44 50 52 46 58"/><path d="M30 16 C41 16 45 26 45 36 C45 44 43 50 40 54"/><path d="M30 24 C36 24 38 30 38 38 C38 44 37 48 35 52"/></g></svg>
          <span class="msn-cover__hint">${escapeHTML(t.mission_hold || '')}</span>
        </div>
      </div>
      <p class="msn-state" aria-live="polite">${escapeHTML(me.waiting ? (t.mission_state_wait || '') : (t.mission_state_ready || ''))}</p>
      <div class="msn-acts">
        ${me.waiting
          ? `<button type="button" class="msn-stamp msn-stamp--paper" onclick="missionCancel()">${escapeHTML(t.mission_take_back || '')}</button>`
          : `<button type="button" class="msn-stamp" onclick="missionDone()">${escapeHTML(t.mission_done_btn || '')}</button>`}
        ${m.swap ? `<button type="button" class="msn-stamp msn-stamp--paper" ${swapLeft > 0 || me.waiting ? 'disabled' : ''} onclick="missionSwap()">${escapeHTML(t.mission_swap_btn || '')}${swapLeft > 0 ? ` <span class="msn-cool" data-until="${me.swapAt}">${escapeHTML(missionFmt(t.mission_swap_wait || '', { t: missionClockText(swapLeft) }))}</span>` : ''}</button>` : ''}
      </div>
      ${m.catch && others.length ? `
        <button type="button" class="msn-catch" onclick="missionCatchToggle()" aria-expanded="${msn.catchOpen}">${escapeHTML(t.mission_catch_q || '')} <b>${escapeHTML(t.mission_catch_btn || '')}</b></button>
        ${msn.catchOpen ? (catchLeft > 0
          ? `<p class="msn-catch-wait"><span class="msn-cool" data-until="${me.catchAt}" data-key="mission_catch_wait">${escapeHTML(missionFmt(t.mission_catch_wait || '', { t: missionClockText(catchLeft) }))}</span></p>`
          : `<div class="msn-catch-row" role="group" aria-label="${escapeHTML(t.mission_catch_pick || '')}">${others.map(p => `<button type="button" class="msn-chip" onclick="missionCatch('${jsStringAttr(p.id)}')"><span class="msn-chip__face">${missionFaceSvg(p.name)}</span><bdi>${escapeHTML(p.name)}</bdi></button>`).join('')}</div>`) : ''}` : ''}
    </div>`;
}

function missionHoldDown(e) {
  const st = Room.state;
  const me = st && st.mission && st.mission.me;
  const file = document.getElementById('msn-file');
  if (!file || !me || !me.m || me.waiting) return;
  if (e && e.pointerId != null) { try { file.setPointerCapture(e.pointerId); } catch (_) {} }
  if (e && e.preventDefault) e.preventDefault();
  if (msn.hold) return;
  msn.hold = true;
  file.classList.add('is-peek');
  haptic('light');
  // The mission types out from the start every time it is opened.
  const out = document.getElementById('msn-type-text');
  const full = missionText(me.m, missionLang(), missionNameOf(st, me.to));
  clearInterval(msn.typeTimer);
  if (!out) return;
  if (typeof motionOff === 'function' && motionOff()) { out.textContent = full; return; }
  const chars = Array.from(full);
  let i = 0;
  out.textContent = '';
  msn.typeTimer = setInterval(() => {
    i++;
    out.textContent = chars.slice(0, i).join('');
    if (i >= chars.length) clearInterval(msn.typeTimer);
  }, 38);
}
function missionHoldUp() {
  if (!msn.hold) return;
  msn.hold = false;
  clearInterval(msn.typeTimer);
  const file = document.getElementById('msn-file');
  if (file) file.classList.remove('is-peek');
  // Cleared once the cover is back over it, so a phone put down shows nothing.
  setTimeout(() => { const out = document.getElementById('msn-type-text'); if (out && !msn.hold) out.textContent = ''; }, 260);
  if (msn.mode === 'file' && Room.state && missionFileSig(Room.state) !== msn.sig) missionPaintModal(false);
}
function missionHoldKey(e, down) {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  if (down) missionHoldDown(null); else missionHoldUp();
}

async function missionDone() {
  const st = Room.state;
  const me = st && st.mission && st.mission.me;
  if (!me) return;
  missionHoldUp();
  try { await Room.act('missionDone', { n: me.n }); haptic('medium'); } catch (err) { showToast(err.message || '', 'error'); }
}
function missionCancel() { roomAct('missionCancel', {}); }
async function missionSwap() {
  const st = Room.state;
  const me = st && st.mission && st.mission.me;
  if (!me) return;
  missionHoldUp();
  try {
    await Room.act('missionSwap', { n: me.n });
    showToast(missionT().mission_toast_swapped || '');
    missionFreshFile();
  } catch (err) { showToast(err.message || '', 'error'); }
}
function missionCatchToggle() { msn.catchOpen = !msn.catchOpen; missionPaintModal(true); }
function missionCatch(id) {
  msn.catchOpen = false;
  roomAct('missionCatch', { who: id });
}

/* A new file slides onto the desk. */
function missionFreshFile() {
  const file = document.getElementById('msn-file');
  if (!file || (typeof motionOff === 'function' && motionOff()) || !file.animate) return;
  file.animate([{ transform: 'translateY(-1.5rem) rotate(-3deg)', opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: 520, easing: 'cubic-bezier(0.3, 1.3, 0.5, 1)' });
}
/* «تمّت ✔» stamped on the file, then the next one. */
function missionStampDone() {
  const wrap = document.querySelector('#mission-modal .msn-file-wrap');
  if (!wrap) return;
  wrap.classList.remove('is-won');
  void wrap.offsetWidth;
  wrap.classList.add('is-won');
  setTimeout(() => { wrap.classList.remove('is-won'); missionFreshFile(); }, 1500);
}

/* --- the modal (the setup, the file, the story) --------------------------------------------- */
function missionShowModal() {
  const m = document.getElementById('mission-modal');
  if (m) m.classList.remove('hidden');
}
function missionCloseModal() {
  missionHoldUp();
  msn.mode = '';
  msn.sig = '';
  closeModal('mission-modal');
}
function missionModalOpen() {
  const m = document.getElementById('mission-modal');
  return !!m && !m.classList.contains('hidden');
}
function missionPaintModal(force) {
  const body = document.getElementById('mission-modal-body');
  const st = Room.state;
  if (!body || !st) return;
  let html = '', sig = '';
  if (msn.mode === 'setup') {
    if (!st.youAreHost) { missionCloseModal(); return; }
    sig = 'setup|' + JSON.stringify(msn.setup) + '|' + missionOn(st) + '|' + appState.lang;
    if (!force && sig === msn.sig) return;
    html = missionSetupHtml(st);
  } else if (msn.mode === 'file') {
    if (!missionOn(st) || !st.mission.me) { missionCloseModal(); return; }
    sig = missionFileSig(st);
    if (!force && sig === msn.sig) return;
    if (msn.hold && !force) return;      // never redrawn under the finger: on release
    html = missionFileHtml(st);
  } else if (msn.mode === 'reveal') {
    if (!st.mission || !st.mission.reveal) { missionCloseModal(); return; }
    sig = 'reveal|' + st.mission.reveal.at + '|' + appState.lang + '|' + st.youAreHost;
    if (!force && sig === msn.sig) return;
    html = missionRevealHtml(st);
  } else return;
  msn.sig = sig;
  body.innerHTML = html;
  body.classList.toggle('msn-sheet--file', msn.mode === 'file');
  if (msn.mode === 'file' && st.mission.me) {
    try { localStorage.setItem('ashryMissionN_' + st.code, String(st.mission.me.n)); } catch (e) {}
  }
  missionTickCools();
}
/* The «غيّرها» and «كشفتك!» waits count down while the file is open. */
function missionTickCools() {
  clearInterval(msn.tick);
  if (!document.querySelector('#mission-modal .msn-cool')) return;
  msn.tick = setInterval(() => {
    const els = document.querySelectorAll('#mission-modal .msn-cool');
    if (!els.length || !missionModalOpen()) { clearInterval(msn.tick); return; }
    const t = missionT();
    let over = false;
    els.forEach(el => {
      const left = Number(el.dataset.until) - missionNow();
      if (left <= 0) over = true;
      el.textContent = missionFmt(t[el.dataset.key || 'mission_swap_wait'] || '', { t: missionClockText(left) });
    });
    if (over && !msn.hold) { clearInterval(msn.tick); missionPaintModal(true); }
  }, 1000);
}

/* --- the target's memo: asked at a calm moment, over whatever is on screen ----------------- */
/* Calm: no text field being typed in, no finger down on the screen, no other popup but the file,
   the page on screen. Two calm looks a beat apart, then a small knock, then the memo. */
let missionPointerDown = false;
document.addEventListener('pointerdown', () => { missionPointerDown = true; }, true);
document.addEventListener('pointerup', () => { missionPointerDown = false; }, true);
document.addEventListener('pointercancel', () => { missionPointerDown = false; }, true);

function missionCalm() {
  if (document.hidden || missionPointerDown || msn.hold) return false;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return false;
  const open = Array.from(document.querySelectorAll('.modal-overlay:not(.hidden)')).filter(el => el.id !== 'mission-modal' && el.id !== 'mission-ask');
  return !open.length;
}

function missionAskPump() {
  clearTimeout(msn.askTimer);
  const st = Room.state;
  const asks = (st && st.mission && st.mission.asks) || [];
  if (msn.asking) {
    const box = document.getElementById('mission-ask');
    // Taken back (or answered elsewhere): the memo goes.
    if (!asks.some(a => a.id === msn.asking.id)) { msn.asking = null; msn.askShown = false; closeModal('mission-ask'); }
    // Put away unanswered (the phone's back, Escape): asked again a little later.
    else if (msn.askShown && box && box.classList.contains('hidden')) { msn.asking = null; msn.askShown = false; msn.askSnooze = Date.now() + 15000; }
    else return;
  }
  if (msn.askSnooze && Date.now() < msn.askSnooze) { msn.askTimer = setTimeout(missionAskPump, msn.askSnooze - Date.now()); return; }
  const next = asks[0];
  if (!next) { msn.calmRuns = 0; return; }
  if (!missionCalm()) { msn.calmRuns = 0; msn.askTimer = setTimeout(missionAskPump, 900); return; }
  msn.calmRuns++;
  if (msn.calmRuns < 2) { msn.askTimer = setTimeout(missionAskPump, 700); return; }
  msn.calmRuns = 0;
  msn.asking = next;
  showToast(missionT().mission_knock || '');
  haptic('medium');
  msn.askTimer = setTimeout(() => {
    const now = Room.state && Room.state.mission && (Room.state.mission.asks || []).find(a => a.id === next.id);
    if (!now || !missionCalm()) { msn.asking = null; msn.askTimer = setTimeout(missionAskPump, 900); return; }
    missionPaintAsk(Room.state, now);
  }, typeof motionOff === 'function' && motionOff() ? 200 : 1300);
}

function missionPaintAsk(state, ask) {
  const t = missionT();
  const body = document.getElementById('mission-ask-body');
  const box = document.getElementById('mission-ask');
  if (!body || !box) return;
  const by = missionNameOf(state, ask.by);
  const myName = missionNameOf(state, Room.me);
  body.innerHTML = `
    <div class="msn-memo__top"><span>${escapeHTML(t.mission_memo || '')}</span><b>${escapeHTML(t.mission_secret_short || '')}</b></div>
    <div class="msn-memo__who"><span class="msn-memo__face">${missionFaceSvg(by)}</span>
      <p class="msn-memo__q">${escapeHTML(missionFmt(t.mission_ask_who || '', { name: by }))}</p></div>
    <p class="msn-memo__deed">${escapeHTML(missionText(ask.m, missionLang(), myName))}</p>
    <p class="msn-memo__ask">${escapeHTML(t.mission_ask_q || '')}</p>
    <div class="msn-memo__btns">
      <button type="button" class="msn-stamp msn-stamp--yes" onclick="missionAnswer(${Number(ask.id)}, true)">${escapeHTML(t.mission_yes || '')}</button>
      <button type="button" class="msn-stamp msn-stamp--paper" onclick="missionAnswer(${Number(ask.id)}, false)">${escapeHTML(t.mission_no || '')}</button>
    </div>`;
  box.classList.remove('hidden');
  msn.askShown = true;
  playSound('tick');
}

async function missionAnswer(id, yes) {
  document.querySelectorAll('#mission-ask .msn-memo__btns button').forEach(b => { b.disabled = true; });
  try {
    await Room.act('missionAnswer', { id: id, yes: !!yes });
    if (yes) playSound('success');
  } catch (err) {
    showToast(err.message || '', 'error');
  }
  msn.asking = null;
  msn.askShown = false;
  closeModal('mission-ask');
  msn.askTimer = setTimeout(missionAskPump, 1500);
}

/* --- the story: who did what to whom, and the best secret agent ---------------------------- */
function missionStoryLines(state) {
  const r = (state.mission && state.mission.reveal) || {};
  const lang = missionLang();
  const name = (id) => missionNameOf(state, id);
  const lines = [];
  (r.story || []).forEach(e => {
    if (e.k === 'done') lines.push({ at: e.at, k: 'done', a: e.by, b: e.to, text: missionDeed(e.m, lang, name(e.by), name(e.to)) });
    else if (e.k === 'catch') lines.push({ at: e.at, k: 'catch', a: e.by, b: e.to, text: missionFmt(missionT().mission_ticker_catch || '', { a: name(e.by), b: name(e.to) }) });
  });
  (r.open || []).forEach(e => lines.push({ at: e.at, k: 'open', a: e.by, b: e.to, text: missionFmt(missionT().mission_open_left || '', { a: name(e.by), text: missionText(e.m, lang, name(e.to)) }) }));
  return lines;
}
function missionTime(at) {
  try { return new Date(at).toLocaleTimeString(appState.lang === 'ar' ? 'ar-EG' : 'en-GB', { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; }
}
function missionChampHtml(state, big) {
  const t = missionT();
  const r = state.mission.reveal || {};
  const champs = r.champs || [];
  if (!champs.length) return `<div class="msn-champ msn-champ--none"><p>${escapeHTML(t.mission_no_champ || '')}</p></div>`;
  const id = champs[0];
  const score = (r.table || []).find(x => x.id === id);
  const n = score ? score.score : 0;
  const never = !((r.caughtBy || {})[id]);
  const names = champs.map(x => missionNameOf(state, x)).join(' · ');
  return `
    <div class="msn-champ${big ? ' msn-champ--tv' : ''}">
      <div class="msn-pola msn-pola--big"><span class="msn-face">${missionFaceSvg(missionNameOf(state, id))}</span><b><bdi>${escapeHTML(missionNameOf(state, id))}</bdi></b></div>
      <div class="msn-champ__text">
        <h3>${escapeHTML(t.mission_champ || '')}</h3>
        <h2><bdi>${escapeHTML(names)}</bdi></h2>
        <p>${escapeHTML(missionFmt(t.mission_champ_line || '', { n: missionAr(n) }))}${never ? ' · ' + escapeHTML(t.mission_champ_never || '') : ''}</p>
        <span class="msn-champ__stamp">${escapeHTML(t.mission_champ_stamp || '')}</span>
      </div>
    </div>`;
}
function missionRevealHtml(state) {
  const t = missionT();
  const r = state.mission.reveal || {};
  const lines = missionStoryLines(state);
  const table = (r.table || []).filter(x => x.score > 0 || state.players.some(p => p.id === x.id));
  return `
    <div class="msn-reveal">
      <div class="msn-reveal__head"><span class="msn-reveal__pin" aria-hidden="true"></span><div class="sheet__title">${escapeHTML(t.mission_reveal_title || '')}</div>
        <button type="button" class="msn-x" onclick="missionCloseModal()" aria-label="${escapeHTML(t.close || '')}">✕</button></div>
      ${missionChampHtml(state, false)}
      <ol class="msn-story">${lines.map((l, i) => `
        <li class="msn-story__line msn-story__line--${l.k}" style="--i:${i}">
          <span class="msn-story__faces"><span class="msn-face">${missionFaceSvg(missionNameOf(state, l.a))}</span><span class="msn-story__arrow" aria-hidden="true">${appState.lang === 'ar' ? '←' : '→'}</span><span class="msn-face">${missionFaceSvg(missionNameOf(state, l.b))}</span></span>
          <span class="msn-story__text">${escapeHTML(l.text)}</span>
          ${l.k === 'open' ? '' : `<time class="msn-story__time">${escapeHTML(missionTime(l.at))}</time>`}
        </li>`).join('')}</ol>
      <div class="msn-table">${table.map(x => `<span class="msn-table__row"><bdi>${escapeHTML(missionNameOf(state, x.id))}</bdi><b>${missionAr(x.score)}</b></span>`).join('')}</div>
      <div class="modal-actions">
        ${state.youAreHost ? `<button type="button" class="btn btn--primary btn--lg" onclick="missionCloseModal(); roomAct('missionClose', {})">${escapeHTML(t.mission_close_file || '')}</button>` : `<p class="sheet__subtitle">${escapeHTML(t.mission_reveal_wait || '')}</p>`}
        <button type="button" class="btn btn--ghost" onclick="missionCloseModal()">${escapeHTML(t.close || '')}</button>
      </div>
    </div>`;
}
function missionOpenReveal() {
  const st = Room.state;
  if (!st || !st.mission || !st.mission.reveal) return;
  msn.mode = 'reveal';
  missionPaintModal(true);
  missionShowModal();
  const champ = document.querySelector('#mission-modal .msn-champ');
  if (champ && typeof afterReveal === 'function' && typeof motionFirst === 'function' && motionFirst('msn-reveal|' + st.code + '|' + st.mission.reveal.at)) {
    afterReveal(champ, () => { if (typeof confetti === 'function' && (st.mission.reveal.champs || []).length) confetti({ particleCount: 90, spread: 70, origin: { y: 0.35 } }); });
  }
}

/* --- on every state ------------------------------------------------------------------------ */
function missionSync(state) {
  const inRoom = !!(state && Room.isIn);
  const m = inRoom ? state.mission : null;
  const t = missionT();
  const person = inRoom && !state.youAreScreen && state.players.some(p => p.id === Room.me && !p.bot);
  document.body.classList.toggle('has-mission', !!(person && m && (m.on || m.phase === 'reveal')));
  if (!inRoom || !m || state.code !== msn.code) {
    // A new room (or none): what is already there is history, not news.
    msn.code = inRoom ? state.code : '';
    msn.feedSeen = m ? (m.feed || []).reduce((x, e) => Math.max(x, e.seq), 0) : 0;
    msn.noSeen = {}; msn.wonSeen = m && m.me ? m.me.won || 0 : 0;
    msn.bustSeen = m && m.me ? m.me.busted || 0 : 0;
    msn.catchSeen = m && m.me && m.me.caught ? m.me.caught.seq : 0;
    if (m && m.me && m.me.no) msn.noSeen[m.me.n] = m.me.no;
    if (!inRoom || !m) {
      if (missionModalOpen()) missionCloseModal();
      if (msn.asking) { msn.asking = null; closeModal('mission-ask'); }
      missionTvClear();
      return;
    }
  }
  if (state.youAreScreen) { missionTvSync(state); return; }
  missionTvClear();

  // The header's 📁: a dot while a memo waits on you or a new file hasn't been opened.
  const badge = document.getElementById('mission-fab-badge');
  if (badge) {
    const me = m.me;
    const freshFile = me && me.n && Number(localStorage.getItem('ashryMissionN_' + state.code) || 0) !== me.n;
    const dot = (m.asks || []).length || (missionOn(state) && freshFile && !m.paused);
    badge.hidden = !dot;
    badge.textContent = dot ? '•' : '';
  }

  const me = m.me;
  if (me) {
    // My memo answered: yes - a point and a new file; no - keep at it.
    if (me.won && me.won !== msn.wonSeen) {
      msn.wonSeen = me.won;
      const last = (m.feed || []).slice().reverse().find(e => e.k === 'done' && e.by === Room.me);
      showToast(missionFmt(t.mission_toast_won || '', { name: last ? missionNameOf(state, last.to) : '' }));
      playSound('success'); haptic('success');
      if (msn.mode === 'file') missionStampDone();
    }
    if (me.no && msn.noSeen[me.n] !== me.no) {
      msn.noSeen[me.n] = me.no;
      showToast(missionFmt(t.mission_toast_no || '', { name: missionNameOf(state, me.to) }));
    }
    if (me.busted && me.busted !== msn.bustSeen) {
      msn.bustSeen = me.busted;
      const last = (m.feed || []).slice().reverse().find(e => e.k === 'catch' && e.to === Room.me);
      showToast(missionFmt(t.mission_toast_busted || '', { name: last ? missionNameOf(state, last.by) : '' }));
      haptic('medium');
    }
    if (me.caught && me.caught.seq !== msn.catchSeen) {
      msn.catchSeen = me.caught.seq;
      showToast(missionFmt(me.caught.ok ? (t.mission_toast_caught_ok || '') : (t.mission_toast_caught_no || ''), { name: missionNameOf(state, me.caught.who) }), me.caught.ok ? 'info' : 'info');
      if (me.caught.ok) { playSound('success'); haptic('success'); }
    }
  }
  // Someone else's file closed: a line for the table (the doer and the target already know).
  const feed = m.feed || [];
  const top = feed.reduce((x, e) => Math.max(x, e.seq), 0);
  if (msn.feedSeen === null) msn.feedSeen = top;
  feed.filter(e => e.seq > msn.feedSeen).forEach(e => {
    if (e.by === Room.me || e.to === Room.me) return;
    const lang = missionLang();
    const text = e.k === 'done'
      ? '🕵️ ' + (t.mission_ticker_done || '') + ' ' + missionDeed(e.m, lang, missionNameOf(state, e.by), missionNameOf(state, e.to))
      : '🕵️ ' + missionFmt(t.mission_ticker_catch || '', { a: missionNameOf(state, e.by), b: missionNameOf(state, e.to) });
    showToast(text);
  });
  msn.feedSeen = Math.max(msn.feedSeen, top);

  if (missionModalOpen()) missionPaintModal(false);
  missionAskPump();

  // The evening's file closed: the story opens by itself once, at a calm moment.
  if (m.phase === 'reveal' && m.reveal) {
    const key = state.code + '|' + m.reveal.at;
    let seen = '';
    try { seen = localStorage.getItem(MISSION_SEEN_KEY) || ''; } catch (e) {}
    if (seen !== key && msn.revealShown !== key && missionCalm() && !msn.asking) {
      msn.revealShown = key;
      try { localStorage.setItem(MISSION_SEEN_KEY, key); } catch (e) {}
      if (msn.mode !== 'setup') missionOpenReveal();
    }
  }
}

/* --- the TV: the cork board, the ticker, the strings ---------------------------------------- */
function missionTvSig(state) {
  const m = state && state.mission;
  if (!m) return '';
  return [m.on, m.phase, m.paused, JSON.stringify(m.score || {}), m.reveal ? m.reveal.at : 0].join('|');
}
/* In the TV lobby (a TV that isn't the host): the photos, a pile of closed files under each. */
function missionTvBoardHtml(state) {
  const t = missionT();
  const m = state.mission;
  const people = state.players.filter(p => !p.bot);
  const rows = people.map(p => ({ id: p.id, name: p.name, n: (m.score || {})[p.id] || 0 })).sort((a, b) => b.n - a.n);
  return `
    <div class="msn-cork msn-cork--board">
      <div class="msn-cork__title"><span class="msn-pin" aria-hidden="true"></span>${escapeHTML(t.mission_board_title || '')}</div>
      ${m.paused ? `<p class="msn-cork__note">${escapeHTML(t.mission_paused || '')}</p>` : ''}
      <div class="msn-cork__cols">${rows.map((r, j) => `
        <div class="msn-cork__col${j === 0 && r.n > 0 ? ' is-top' : ''}">
          <b class="msn-cork__n">${missionAr(r.n)}</b>
          <div class="msn-stack">${Array.from({ length: Math.min(r.n, 8) }, (_, k) => `<i style="--i:${j};--k:${k}"></i>`).join('')}</div>
          <div class="msn-pola"><span class="msn-face">${missionFaceSvg(r.name)}</span><b><bdi>${escapeHTML(r.name)}</bdi></b></div>
        </div>`).join('')}</div>
    </div>`;
}

function missionTvClear() {
  ['msn-tv-ticker', 'msn-tv-reveal'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });
  msn.tvRevealKey = '';
}

function missionTvSync(state) {
  const m = state.mission;
  const t = missionT();
  const feed = (m && m.feed) || [];
  const top = feed.reduce((x, e) => Math.max(x, e.seq), 0);
  if (msn.feedSeen === null) msn.feedSeen = top;
  const fresh = feed.filter(e => e.seq > msn.feedSeen);
  msn.feedSeen = Math.max(msn.feedSeen, top);
  if (fresh.length) {
    const e = fresh[fresh.length - 1];
    const lang = missionLang();
    const text = e.k === 'done'
      ? missionDeed(e.m, lang, missionNameOf(state, e.by), missionNameOf(state, e.to)) + ' 😂'
      : missionFmt(t.mission_ticker_catch || '', { a: missionNameOf(state, e.by), b: missionNameOf(state, e.to) });
    let el = document.getElementById('msn-tv-ticker');
    if (!el) { el = document.createElement('div'); el.id = 'msn-tv-ticker'; el.className = 'msn-tv-ticker'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.innerHTML = `<span class="msn-tv-ticker__tab">${escapeHTML(t.mission_ticker_tab || '')}</span>
      <span class="msn-tv-ticker__stamp">${escapeHTML(e.k === 'done' ? (t.mission_done_stamp || '') : '👀')}</span>
      <span class="msn-tv-ticker__face">${missionFaceSvg(missionNameOf(state, e.by))}</span>
      <b class="msn-tv-ticker__text">${escapeHTML(text)}</b>`;
    el.classList.remove('is-on'); void el.offsetWidth; el.classList.add('is-on');
    if (typeof playSound === 'function') playSound(e.k === 'done' ? 'success' : 'ding');
    clearTimeout(msn.tvTickerTimer);
    msn.tvTickerTimer = setTimeout(() => { const x = document.getElementById('msn-tv-ticker'); if (x) x.classList.remove('is-on'); }, 7000);
  }
  // The reveal on the cork board: in the lobby (not over a game being played), until the host closes it.
  const key = m && m.phase === 'reveal' && m.reveal ? state.code + '|' + m.reveal.at : '';
  const show = key && state.phase === 'lobby' && msn.tvRevealClosed !== key;
  const old = document.getElementById('msn-tv-reveal');
  if (!show) { if (old) old.remove(); msn.tvRevealKey = ''; return; }
  if (old && msn.tvRevealKey === key + '|' + state.youAreHost) return;
  if (old) old.remove();
  msn.tvRevealKey = key + '|' + state.youAreHost;
  const el = document.createElement('div');
  el.id = 'msn-tv-reveal';
  el.className = 'msn-tv-reveal' + (typeof motionOff === 'function' && motionOff() ? ' is-still' : '');
  el.innerHTML = missionTvRevealHtml(state);
  document.body.appendChild(el);
  const lines = el.querySelectorAll('.msn-strings line').length;
  const champAt = (typeof motionOff === 'function' && motionOff()) ? 0 : Math.min(12000, 1500 + lines * 800 + 2500);
  setTimeout(() => {
    const box = document.getElementById('msn-tv-reveal');
    if (!box) return;
    box.classList.add('is-champ');
    if (typeof playSound === 'function') playSound('tada');
    if (typeof confetti === 'function' && (m.reveal.champs || []).length) setTimeout(() => confetti({ particleCount: 140, spread: 90, origin: { y: 0.3 } }), 700);
  }, champAt);
}
function missionTvCloseReveal() {
  const st = Room.state;
  if (st && st.youAreHost) { roomAct('missionClose', {}); return; }
}

function missionTvRevealHtml(state) {
  const t = missionT();
  const r = state.mission.reveal || {};
  const ids = [];
  const add = (id) => { if (id && ids.indexOf(id) === -1) ids.push(id); };
  (r.table || []).forEach(x => add(x.id));
  const events = (r.story || []).filter(e => e.k === 'done').slice(-12);
  events.forEach(e => { add(e.by); add(e.to); });
  const n = Math.max(ids.length, 1);
  // The photos round the board, an ellipse leaving the middle for the strings' tags.
  const pos = {};
  ids.forEach((id, i) => {
    const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
    pos[id] = { x: 50 + 38 * Math.cos(a), y: 52 + 33 * Math.sin(a) };
  });
  const lang = missionLang();
  const strings = events.map((e, j) => {
    const a = pos[e.by], b = pos[e.to];
    if (!a || !b) return '';
    return `<line pathLength="1" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="--d:${(j * 0.8).toFixed(1)}s"/>`;
  }).join('');
  const tags = events.map((e, j) => {
    const a = pos[e.by], b = pos[e.to];
    if (!a || !b) return '';
    // Two strings between the same two people: the second tag a little off the middle.
    const off = (j % 3 - 1) * 4;
    return `<div class="msn-tag" style="left:${((a.x + b.x) / 2).toFixed(1)}%;top:${((a.y + b.y) / 2 + off).toFixed(1)}%;--d:${(j * 0.8 + 0.5).toFixed(1)}s">
      <small>${escapeHTML(missionTime(e.at))}</small>${escapeHTML(missionDeed(e.m, lang, missionNameOf(state, e.by), missionNameOf(state, e.to)))}</div>`;
  }).join('');
  const photos = ids.map((id, i) => `<div class="msn-pola msn-pola--pinned" style="left:${pos[id].x.toFixed(1)}%;top:${pos[id].y.toFixed(1)}%;--r:${[-3, 4, -2, 3][i % 4]}deg"><span class="msn-pin" aria-hidden="true"></span><span class="msn-face">${missionFaceSvg(missionNameOf(state, id))}</span><b><bdi>${escapeHTML(missionNameOf(state, id))}</bdi></b></div>`).join('');
  return `
    <div class="msn-cork msn-cork--reveal">
      <svg class="msn-strings" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${strings}</svg>
      ${photos}${tags}
      <div class="msn-cork__corner">${escapeHTML(t.mission_reveal_title || '')}</div>
      <div class="msn-tv-champ">${missionChampHtml(state, true)}</div>
      ${state.youAreHost ? `<div class="msn-tv-reveal__acts">${typeof tvBtn === 'function' ? tvBtn(t.mission_close_file || '', 'missionTvCloseReveal()') : ''}</div>` : ''}
    </div>`;
}

// Whatever came before the chunk: drawn once it is here.
if (typeof Room !== 'undefined' && Room.state) missionSync(Room.state);
</script>
