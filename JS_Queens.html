<script>
/* ============================================================================
   الملكات — QUEENS
   ----------------------------------------------------------------------------
   A square board split into coloured regions. Place one 👑 in every row,
   every column and every colour region, and no two crowns may touch, not even
   corner to corner. A tap marks ✕, a second tap places 👑, a third clears;
   dragging across empty cells marks ✕ as you go, wherever the drag started.
   One step can be taken back (↶); clearing the board and dealing a new one
   over a game in progress both ask first.

   The board is made in Queens.js (shared with the rooms server, which deals a
   race's board): a random placement of crowns that don't touch, one region
   grown from each, then a fix loop until exactly one solution is left. 6×6
   easy, 7×7 medium, 8×8 hard; the daily is 7×7 from the seed. The board is
   in appState.queens.

   In سباق ألغاز (RACE_UI.queens, JS_RoomRace.html) the same board and taps
   play the room's puzzle: the state is the race's (soloRaceState), the stage
   the race screen's (soloStage), every change is sent as `move { marks }`
   and the server says when the crowns are the solution. No hint in a race.
   ========================================================================= */

let queensTimer = null;
let queensDrag = null;

function queensState() {
  const race = soloRaceState('queens');
  if (race) return race;
  if (!appState.queens) {
    appState.queens = { level: 'easy', daily: '', n: 6, regions: [], solution: [], marks: [], undo: null, hints: 0, startedAt: 0, pausedAt: 0, phase: 'setup' };
  }
  return appState.queens;
}

/* --- Setup and play -------------------------------------------------------------- */

function setupQueens() {
  queensStopTimer();
  setView('setup-queens');
}

function paintQueensSetup() {
  const s = queensState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#queens-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const best = soloBest('queens', s.level);
  const el = document.getElementById('queens-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('queens-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('queens-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('queens', 'startQueens(true)');
}

function setQueensLevel(level) {
  queensState().level = level;
  saveToLocal();
  paintQueensSetup();
}

const queensHasWork = (s) => (s.marks || []).some(Boolean);

function startQueens(daily, sure) {
  if (!sure && soloConfirmNew('queens', queensHasWork, () => startQueens(daily, true))) return;
  if (daily && soloDailyResume('queens')) return;
  const s = queensState();
  const level = daily ? 'medium' : s.level;
  let made = queensMake(level, soloRandom(daily ? soloDaySeed('queens') : null));
  // A free board that couldn't be made gets one more go with other dice.
  if (!made && !daily) made = queensMake(level, soloRandom(null));
  if (!made) { showToast((TRANSLATIONS[appState.lang] || {}).solo_make_failed || '', 'error'); return; }
  soloDailySetAside('queens');
  soloNewGame('queens');
  s.daily = daily ? soloToday() : '';
  s.playLevel = level;
  s.n = made.n;
  s.regions = made.regions;
  s.solution = made.solution;
  s.marks = new Array(made.n * made.n).fill(0);   // 0 empty, 1 ✕, 2 👑
  soloUndoClear(s);
  s.hints = 0;
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'play';
  saveToLocal();
  setView('play-queens');
  paintQueens();
  queensArmTimer();
}

function continueQueens() {
  if (queensState().phase !== 'play') return;
  setView('play-queens');
  paintQueens();
  queensArmTimer();
}

function queensArmTimer() {
  queensStopTimer();
  queensTimer = soloClock('queens-time', () => queensState().startedAt);
}

function queensStopTimer() {
  if (queensTimer) queensTimer.stop();
  queensTimer = null;
}

function paintQueens() {
  const s = queensState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('queens-stage');
  if (!el || !s.regions.length) return;
  const n = s.n;
  const bad = queensConflicts(n, s.regions, s.marks);
  const crowns = s.marks.filter(m => m === 2).length;
  const bar = soloBarHtml([
    s.daily ? { label: t.daily_title || '', value: '📅' } : { label: t.solo_level || '', value: `${n}×${n}` },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.seconds), id: 'queens-time' },
    { label: t.queens_placed || '', value: `${crowns}/${n}`, id: 'queens-count' }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="queens-grid" id="queens-grid" dir="ltr" style="--q-n:${n}">
          ${s.regions.map((g, i) => {
            const r = Math.floor(i / n), c = i % n;
            const edge = (rr, cc) => rr < 0 || rr >= n || cc < 0 || cc >= n || s.regions[rr * n + cc] !== g;
            const cls = ['queens-cell', 'q' + g,
              edge(r - 1, c) ? 'bt' : '', edge(r + 1, c) ? 'bb' : '', edge(r, c - 1) ? 'bl' : '', edge(r, c + 1) ? 'br' : '',
              bad.has(i) ? 'is-bad' : ''].filter(Boolean).join(' ');
            const mark = s.marks[i] === 2 ? '👑' : (s.marks[i] === 1 ? '✕' : '');
            return `<button type="button" class="${cls}" data-i="${i}" onpointerdown="queensDown(event, ${i})">${mark}</button>`;
          }).join('')}
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}
        <p class="field__hint" style="text-align:center">${escapeHTML(t.queens_hint || '')}</p>
        <div class="sdk-tools">
          <button type="button" class="btn btn--neutral btn--sm" onclick="undoQueens()" ${soloCanUndo(s) && s.phase === 'play' ? '' : 'disabled'}>↶ ${escapeHTML(t.solo_undo || '')}</button>
          <button type="button" class="btn btn--neutral btn--sm" onclick="clearQueens()">🧹 ${escapeHTML(t.queens_clear || '')}</button>
          ${s.race ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="hintQueens()">💡 ${escapeHTML(t.solo_hint || '')}</button>`}
        </div>
      </div>
    </div>
    ${s.race ? '' : `<div class="view-actions">
      <button class="btn btn--ghost btn--sm" onclick="setupQueens()">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
}

/*
 * A tap cycles ✕ → 👑 → empty. Once the finger reaches another cell it is a
 * drag, which only marks ✕ on the empty cells it crosses (the one it started
 * on too, if that was empty) and never changes a ✕ or a crown.
 */
function queensDown(e, i) {
  const s = queensState();
  if (s.phase !== 'play') return;
  e.preventDefault();
  queensDrag = { start: i, moved: false, painted: new Set([i]), before: s.marks.slice() };
  const grid = document.getElementById('queens-grid');
  const mark = (k) => {
    if (s.marks[k] !== 0) return;
    s.marks[k] = 1;
    const cell = grid && grid.querySelector(`[data-i="${k}"]`);
    if (cell) cell.textContent = '✕';
  };
  const move = (ev) => {
    const cell = soloCellAt(ev.clientX, ev.clientY, '.queens-cell');
    if (!cell || !queensDrag) return;
    const k = Number(cell.dataset.i);
    if (queensDrag.painted.has(k)) return;
    if (!queensDrag.moved) {
      queensDrag.moved = true;
      mark(queensDrag.start);
    }
    queensDrag.painted.add(k);
    mark(k);
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    const d = queensDrag;
    queensDrag = null;
    if (!d || s.phase !== 'play') return;
    if (!d.moved) s.marks[i] = (s.marks[i] + 1) % 3;
    if (s.marks.some((m, k) => m !== d.before[k])) soloUndoPush(s, d.before);
    saveToLocal();
    paintQueens();
    if (!d.moved && s.marks[i] === 2) haptic('light');
    queensCheck();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

/** Empties the board, after asking: it is every mark at once. */
function clearQueens(sure) {
  const s = queensState();
  if (s.phase !== 'play' || !queensHasWork(s)) return;
  if (!sure) {
    const t = TRANSLATIONS[appState.lang] || {};
    showConfirmModal(t.solo_clear_confirm || 'تمسح كل اللي على اللوحة؟', () => clearQueens(true));
    return;
  }
  soloUndoPush(s, s.marks.slice());
  s.marks = s.marks.map(() => 0);
  saveToLocal();
  paintQueens();
  queensCheck();
}

/** Takes back the last change: a tap, a drag, a clear or a hint. */
function undoQueens() {
  const s = queensState();
  if (s.phase !== 'play' || !soloCanUndo(s)) return;
  const back = soloUndoPop(s);
  if (!back) return;
  s.marks = back;
  saveToLocal();
  paintQueens();
  queensCheck();
}

/** Places one right crown (or takes away a wrong one). */
function hintQueens() {
  const s = queensState();
  if (s.phase !== 'play' || s.race) return;
  const n = s.n;
  const before = s.marks.slice();
  const wrong = s.marks.findIndex((m, i) => m === 2 && s.solution[Math.floor(i / n)] !== i % n);
  if (wrong !== -1) { s.marks[wrong] = 0; }
  else {
    const row = s.solution.findIndex((c, r) => s.marks[r * n + c] !== 2);
    if (row === -1) return;
    s.marks[row * n + s.solution[row]] = 2;
  }
  soloUndoPush(s, before);
  s.hints = (s.hints || 0) + 1;
  saveToLocal();
  paintQueens();
  queensCheck();
}

/** The crowns bounce in order, row by row (a solved board). */
function queensCelebrate(s) {
  if (motionOff()) return;
  const n = s.n;
  const crowns = [];
  s.marks.forEach((m, i) => { if (m === 2) crowns.push(i); });
  crowns.sort((a, b) => a - b).forEach((i, k) => {
    const cell = document.querySelector(`#queens-grid [data-i="${i}"]`);
    if (cell && cell.animate) cell.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 380, delay: k * 90, easing: 'ease-out' });
  });
  return n * 90 + 400;
}

function queensCheck() {
  const s = queensState();
  if (s.phase !== 'play') return;
  // A race: the server holds the solution and judges the board (JS_RoomRace.html).
  if (s.race) { raceMove('queens', { marks: s.marks.slice() }); return; }
  const n = s.n;
  if (!queensSolved(n, s.solution, s.marks)) return;
  queensStopTimer();
  s.phase = 'done';
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  soloUndoClear(s);
  saveToLocal();
  paintQueens();
  const t = TRANSLATIONS[appState.lang];
  queensCelebrate(s);
  const level = s.playLevel || s.level;
  const rec = s.hints || s.archive ? { record: false, prev: soloBest('queens', level) }
    : soloRecord('queens', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('queens', { seconds: seconds, hints: s.hints || 0 }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n👑 ${t.setup_queens || ''} ✅ ${soloTime(seconds)}${s.hints ? ' · 💡 ' + s.hints : ''}`;
  }
  const lines = [];
  if (s.hints) lines.push(`💡 ${escapeHTML(t.solo_hint || '')}: ${s.hints}`);
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  soloLater('queens', motionOff() ? 0 : n * 90 + 400, () => soloResult({
    icon: '👑', title: rec.record ? (t.solo_new_best || '') : (t.solo_solved || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, win: true, share: share,
    again: () => startQueens(false), exit: setupQueens
  }));
}

function restoreQueens() {
  const s = queensState();
  if (s.phase !== 'play' || !s.regions.length) return false;
  paintQueens();
  queensArmTimer();
  return true;
}

soloRegister('queens', {
  setup: 'setup-queens', play: 'play-queens', paintSetup: paintQueensSetup, restore: restoreQueens,
  state: queensState, resume: continueQueens, repaint: paintQueens, timed: true, prefs: ['level']
});

/* --- سباق ألغاز: the same board, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.queens = {
  stage: 'queens-stage',
  unit: 'race_unit_crowns',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', n: pub.n, regions: pub.regions.slice(), solution: [],
    marks: new Array(pub.n * pub.n).fill(0), undo: null, hints: 0, seconds: 0 }),
  // A reload: the marks the server last took from this phone are the board.
  sync(s, board) {
    if (board && Array.isArray(board.marks) && board.marks.length === s.marks.length && !queensHasWork(s)) s.marks = board.marks.slice();
  },
  paint: () => paintQueens(),
  finished: (s, won) => (won ? queensCelebrate(s) : 0)
};
</script>
