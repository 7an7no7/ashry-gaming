<script>
/* ============================================================================
   الجاسوس — MULTIPLAYER
   ----------------------------------------------------------------------------
   The same game as the pass-the-phone version, except each player's card lives
   on their own screen. That removes the whole awkward ritual of handing the
   phone around and shielding it while you look.

   Nothing here decides who the spy is — the server does, and it only ever sends
   a player their own role.
   ========================================================================= */

let imposterCardOpen = false;   // has this player flipped their card this round
let imposterCardDeal = null;    // the deal (shared.dealId) that card belongs to

/* The host's choices, remembered on their phone: the lobby is rewritten when
   someone joins (the spy count depends on the table), and a rewrite used to
   put both pickers back on their first option. */
const IMPOSTER_ROOM_OPTS_KEY = 'ashryImposterRoomOpts';
const IMPOSTER_ROOM_LIMITS = [3, 5, 8];   // the server's IMPOSTER_LIMITS

/** «يبدأ الأسئلة: X» - drawn at random each round, the spy as likely as anyone. */
function imposterFirstHtml(state, t) {
  const id = state.shared && state.shared.firstId;
  const p = id && state.players.find(x => x.id === id);
  if (!p) return '';
  return `<p class="field__hint" style="text-align:center">🎤 ${escapeHTML(t.spy_first || '')}: <b>${escapeHTML(p.name)}</b></p>`;
}
function imposterRoomOpts() {
  try { return JSON.parse(localStorage.getItem(IMPOSTER_ROOM_OPTS_KEY) || 'null') || {}; } catch (e) { return {}; }
}
function setImposterRoomOpt(key, value) {
  const o = imposterRoomOpts();
  o[key] = key === 'spies' || key === 'limit' ? Number(value) : (key === 'undercover' ? !!value : String(value));
  try { localStorage.setItem(IMPOSTER_ROOM_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  if (key === 'limit') haptic('light');
  if (key === 'undercover' || key === 'limit') {
    const setup = document.getElementById('room-host-setup');
    if (setup) delete setup.dataset.sig;
    if (Room.state) routeRoomState(Room.state);
  }
}

ROOM_GAMES.imposter = {
  /** Host-only controls shown in the lobby. */
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    // Locked categories are behind a password on the single-device screen and
    // there is no password step here, so they simply aren't offered.
    // «كلماتنا» too, once it has a code: the server deals the family's words by it.
    const cats = packWordPacks().filter(p => p.code).map(p => p.name)
      .concat(Object.keys(spyCategories() || {}).filter(c => c.indexOf('🔒') === -1));
    if (!cats.length) return '';
    const maxSpies = Math.max(1, state.players.length - 2);
    const t = TRANSLATIONS[appState.lang];
    const o = imposterRoomOpts();
    const cat = cats.indexOf(o.category) !== -1 ? o.category : cats[0];
    const spies = Math.max(1, Math.min(maxSpies, Number(o.spies) || 1));
    const undercover = !!o.undercover;
    // The discussion's limit (the review of 1 Oct 2026): off by default; the vote opens by itself.
    const limit = IMPOSTER_ROOM_LIMITS.indexOf(Number(o.limit)) !== -1 ? Number(o.limit) : 0;
    return `
      <div class="card card--tight">
        <div class="field" style="margin-bottom: var(--sp-3)">
          <label class="switch-row" for="room-imp-undercover">
            <span class="field__label">${escapeHTML(t.imp_undercover || '🎭 المختلف')}</span>
            <span class="switch"><input type="checkbox" id="room-imp-undercover" role="switch" ${undercover ? 'checked' : ''} onchange="setImposterRoomOpt('undercover', this.checked)"><span class="switch__track" aria-hidden="true"></span></span>
          </label>
          <p class="field__hint">${escapeHTML(t.imp_undercover_hint || '')}</p>
        </div>
        ${undercover ? '' : `
        <label class="field__label" for="room-imp-category">${t.category || 'المجموعة'}</label>
        <select id="room-imp-category" onchange="setImposterRoomOpt('category', this.value)">
          ${cats.map(c => `<option value="${escapeHTML(c)}" ${c === cat ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
        </select>`}
        <label class="field__label" for="room-imp-spies">${undercover ? (t.imp_und_count || 'عدد المختلفين') : (t.imposter_count || t.spy_room_count || 'عدد الجواسيس')}</label>
        <select id="room-imp-spies" onchange="setImposterRoomOpt('spies', this.value)">
          ${Array.from({ length: maxSpies }, (_, i) =>
            `<option value="${i + 1}" ${i + 1 === spies ? 'selected' : ''}>${i + 1}</option>`).join('')}
        </select>
        <div class="field" style="margin-top: var(--sp-3)">
          <label class="field__label">${escapeHTML(t.imp_limit || '')}</label>
          <div class="segmented" role="group">
            ${[0].concat(IMPOSTER_ROOM_LIMITS).map(v => `<button type="button" class="segmented__item ${v === limit ? 'is-active' : ''}" onclick="setImposterRoomOpt('limit', ${v})">${v ? v : escapeHTML(t.imp_limit_off || '')}</button>`).join('')}
          </div>
          <p class="field__hint">${escapeHTML(t.imp_limit_hint || '')}</p>
        </div>
      </div>`;
  },

  startPayload() {
    const cat = document.getElementById('room-imp-category');
    const spies = document.getElementById('room-imp-spies');
    const under = document.getElementById('room-imp-undercover');
    const o = imposterRoomOpts();
    const category = cat ? cat.value : (o.category || '');
    return {
      category: category,
      // The family's words, by their code (never the phone's copy).
      pack: category && !(under && under.checked) ? packWordsCodeOfCat(category) : '',
      spies: spies ? Number(spies.value) : (Number(o.spies) || 1),
      undercover: under ? under.checked : !!o.undercover,
      // Minutes of discussion before the vote opens by itself (0: none).
      limit: IMPOSTER_ROOM_LIMITS.indexOf(Number(o.limit)) !== -1 ? Number(o.limit) : 0,
      // المختلف's pairs come in the games' language (SPY_PAIRS_EN on the server).
      lang: contentLang()
    };
  },

  render(state) {
    if (appState.currentView !== 'room-imposter') {
      imposterCardOpen = false;
      setView('room-imposter');
    }
    // "Play again" from the result lands on the same screen: a new deal starts face down.
    const deal = state.shared && state.shared.dealId;
    if (deal && imposterCardDeal !== deal) { imposterCardDeal = deal; imposterCardOpen = false; }
    const el = document.getElementById('view-room-imposter');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];

    if (state.phase === 'reveal')  renderImposterReveal(el, state, t);
    else if (state.phase === 'discuss') renderImposterDiscuss(el, state, t);
    else if (state.phase === 'voting')  renderImposterVoting(el, state, t);
    else if (state.phase === 'guess')   renderImposterGuess(el, state, t);
    else if (state.phase === 'result')  renderImposterResult(el, state, t);
    refreshRoomPlayerStrip(el, state);
  }
};

/** Your card, face down until you tap it. */
function renderImposterReveal(el, state, t) {
  const you = state.you || {};
  const undercover = !!(state.shared && state.shared.undercover);
  const isSpy = !undercover && you.role === 'spy';

  const face = imposterCardOpen
    ? (undercover
        ? `<div class="role-card animate-pop">
             <div class="role-card__value">${escapeHTML(you.word || '')}</div>
           </div>`
        // One poster, the same colour for every role (as in الحرباء and
        // الموقع السري): the card stays open until the discussion starts, and
        // a red one, or the spy's big drawing, told the table who it was from
        // across the room. Only the words differ.
        : `<div class="role-card animate-pop">
             <div class="role-card__label">${isSpy ? '🕵️ ' + (t.you_are_spy || 'أنت الجاسوس') : (t.secret_word || 'الكلمة السرية')}</div>
             <div class="role-card__value">${isSpy ? '❓' : escapeHTML(you.word || '')}</div>
             ${isSpy ? `<div class="role-card__hint">${t.spy_hint || 'حاول أن تعرف الكلمة دون أن ينكشف أمرك'}</div>` : ''}
           </div>`)
    : `<button class="role-card role-card--closed" onclick="imposterFlipCard()">
         <div class="role-card__art" aria-hidden="true">${iconHtml('art:imposter')}</div>
         <div class="role-card__label">${t.tap_to_reveal || 'اضغط لكشف دورك'}</div>
       </button>`;

  renderRoomFrame(el, 'reveal|' + imposterCardOpen + '|' + isSpy + '|' + undercover + '|' + state.youAreHost + '|' + state.shared.firstId + '|' + appState.lang, () => `
    <div class="card room-role" style="text-align:center">
      ${state.shared.category ? `<div class="eyebrow">${escapeHTML(state.shared.category)}</div>` : ''}
      ${face}
    </div>
    ${imposterFirstHtml(state, t)}
    ${roomMoveOnHtml(state,
      `<button onclick="roomAct('beginDiscussion')" class="btn btn--primary btn--lg">${t.start_discussion || 'ابدأ النقاش'}</button>`,
      `<div class="waiting-note"><span class="animate-pulse">⏳</span> ${escapeHTML(t.imp_wait_discuss || t.room_wait_host || '')}</div>`)}
    ${renderRoomPlayerStrip(state)}`);
}

function imposterFlipCard() {
  imposterCardOpen = true;
  playSound('success');
  haptic('medium');
  if (Room.state) ROOM_GAMES.imposter.render(Room.state);
}

function renderImposterDiscuss(el, state, t) {
  const undercover = !!(state.shared && state.shared.undercover);
  const endsAt = state.shared.endsAt || 0;
  renderRoomFrame(el, 'discuss|' + state.youAreHost + '|' + undercover + '|' + endsAt + '|' + state.shared.firstId + '|' + appState.lang, () => `
    <div class="card" style="text-align:center">
      <div class="eyebrow">${escapeHTML(endsAt ? (t.imp_time_left || '') : (t.discussion_time || 'وقت النقاش'))}</div>
      <div id="room-imp-timer" class="metric metric--xl metric--accent">${endsAt ? imposterClockText(endsAt) : '00:00'}</div>
      <p class="card__subtitle" style="margin-bottom:0">${escapeHTML(undercover ? (t.imp_und_discuss_hint || '') : (t.imposter_discuss_hint || 'اسألوا بعضكم واكتشفوا الجاسوس'))}</p>
    </div>
    ${imposterFirstHtml(state, t)}
    ${roomMoveOnHtml(state,
      `<div class="btn-stack">
           <button onclick="roomAct('startVote')" class="btn btn--primary btn--lg">${escapeHTML(undercover ? (t.imp_und_start_vote || t.imp_start_vote || '') : (t.imp_start_vote || ''))}</button>
           <button onclick="roomAct('revealResult')" class="btn btn--ghost btn--sm">${escapeHTML(t.imp_reveal_direct || '')}</button>
         </div>`,
      `<div class="waiting-note">${escapeHTML(t.imp_wait_vote || '')}</div>`)}
    ${renderRoomPlayerStrip(state)}`);

  startRoomDiscussClock(state.shared.startedAt, endsAt);
}

/** Everyone accuses someone; the choices stay hidden until the vote closes. */
function renderImposterVoting(el, state, t) {
  stopRoomDiscussClock();
  const v = state.shared.vote || {};
  const undercover = !!(state.shared && state.shared.undercover);
  renderRoomFrame(el, 'voting|' + (v.voted || []).length + '/' + (v.eligible || []).length + '|' + state.youAreHost + '|' + undercover + '|' + appState.lang, () => `
    <div class="card card--tight">
      <div class="eyebrow">${escapeHTML(undercover ? (t.imp_und_accuse || '') : (t.accuse_player || ''))}</div>
      ${renderBallot(state, { ownLabel: t.vote_you })}
    </div>
    ${renderRoomPlayerStrip(state)}`);
}

/** A caught spy picks the word from six; everyone else waits. */
function renderImposterGuess(el, state, t) {
  const s = state.shared;
  const mine = s.guesserId === Room.me;
  const undercover = !!s.undercover;
  renderRoomFrame(el, 'guess|' + s.guesserId + '|' + mine + '|' + state.youAreHost + '|' + undercover + '|' + appState.lang, () => {
    // The vote first, the caught spy's bar rising last; their card stays face down till then.
    const bars = roomSpyVoteBars(state, [s.guesserId], 'phone');
    const cover = spyRevealParts(['imp-guess', roomDealKey(state), s.guesserId].join('|'), t.reveal_spy_was, bars.ms);
    return `
    ${bars.html}
    <div class="card card--accent ${cover.cls}" ${cover.attrs} style="text-align:center; --cover-at:${cover.at}ms">${cover.cover}
      <div class="metric metric--md">${undercover ? '🎭' : '🕵️'} ${escapeHTML(s.guesserName || '')}</div>
      <p class="sheet__subtitle">${escapeHTML(mine ? (undercover ? (t.imp_und_guess_hint || '') : (t.imp_guess_hint || '')) : (undercover ? (t.imp_und_guessing || '') : (t.imp_guessing || '')))}</p>
    </div>
    ${mine
      ? `<div class="btn-stack">${(s.options || []).map(w => `<button class="ballot-option" onclick="roomAct('guess', { word: '${jsStringAttr(w)}' })"><span class="ballot-option__label">${escapeHTML(w)}</span></button>`).join('')}</div>`
      : `<div class="chip-set" style="justify-content:center">${(s.options || []).map(w => `<span class="chip chip--plain"><span class="chip__label">${escapeHTML(w)}</span></span>`).join('')}</div>`}
    ${roomMoveOnHtml(state, `<div class="btn-stack" style="margin-top: var(--sp-3)"><button class="btn btn--ghost btn--sm" onclick="roomAct('skipGuess')">${escapeHTML(t.fa_skip_guess || '')}</button></div>`)}
    ${renderRoomPlayerStrip(state)}`;
  });
}

/** The line that says how the round went. */
function imposterOutcomeLine(s, t) {
  const names = (s.spies || []).join(' · ');
  const under = !!s.undercover;
  if (s.outcome === 'escaped') return (under ? (t.imp_und_escaped || '') : (t.imp_escaped || '')).replace('{name}', names);
  if (s.outcome === 'stole') return (under ? (t.imp_und_stole || '') : (t.imp_stole || '')).replace('{name}', names);
  if (s.outcome === 'caught') return (under ? (t.imp_und_caught || '') : (t.imp_caught || '')).replace('{name}', names);
  // The server keeps the leaver's name (impostorLeftName): they are off the roster by then.
  if (s.impostorLeft) return (t.room_impostor_left || '').replace('{name}', s.impostorLeftName || names);
  return under ? (t.imp_und_revealed || '') : (t.imp_revealed || '');
}

/** Counts up from the shared start time, so every phone shows the same number. */
let roomDiscussClock = null;
let roomDiscussBase = null;
function stopRoomDiscussClock() {
  if (roomDiscussClock) { roomDiscussClock.stop(); countdownClear(); }
  roomDiscussClock = null;
  roomDiscussBase = null;
}
onRoomClocksReset(stopRoomDiscussClock);

/** What is left of a limited discussion, as m:ss. */
function imposterClockText(endsAt) {
  const left = Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000));
  return `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}

/* A limited discussion (the lobby's «حد للنقاش») counts down to the server's
   deadline instead: the vote opens by itself there (roomTimeout), and the
   phone rings as it reaches 0. Without a limit it counts up, as it always did. */
function startRoomDiscussClock(startedAt, endsAt) {
  if (endsAt) {
    const paintLeft = () => {
      const left = Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000));
      const el = document.getElementById('room-imp-timer');
      if (!el) return;
      el.textContent = imposterClockText(endsAt);
      const low = left <= 30;
      if (el.classList.contains('tx-danger') !== low) el.classList.toggle('tx-danger', low);
      countdownUrgency(el, left);
    };
    paintLeft();
    if (roomDiscussClock && roomDiscussBase === 'end' + endsAt && roomDiscussClock.isRunning()) return;
    if (roomDiscussClock) roomDiscussClock.stop();
    roomDiscussBase = 'end' + endsAt;
    roomDiscussClock = createClock({
      seconds: Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000)),
      onTick: paintLeft,
      onEnd: () => {
        paintLeft();
        roomDiscussClock = null;
        // Only if this discussion is still on here: not after the room moved on.
        const st = Room.state;
        if (!st || st.game !== 'imposter' || st.phase !== 'discuss' || !st.shared || st.shared.endsAt !== endsAt) return;
        playSound('alarm');
      }
    });
    return;
  }
  const base = startedAt || roomServerNow();
  // Restarting on every render threw the tick away each poll for no gain; the
  // reading is anchored to the shared start time either way. It is painted
  // first, and kept only while it runs: leaving the room screen stops every
  // clock, and coming back rebuilds the frame at 00:00.
  const paint = () => {
    const el = document.getElementById('room-imp-timer');
    if (!el) return;
    const secs = Math.max(0, Math.floor((roomServerNow() - base) / 1000));
    const m = String(Math.floor(secs / 60)).padStart(2, '0');
    const s = String(secs % 60).padStart(2, '0');
    el.innerText = `${m}:${s}`;
  };
  paint();
  if (roomDiscussClock && roomDiscussBase === base && roomDiscussClock.isRunning()) return;
  if (roomDiscussClock) roomDiscussClock.stop();
  roomDiscussBase = base;
  roomDiscussClock = createClock({ countUp: true, onTick: paint });
}

function renderImposterResult(el, state, t) {
  stopRoomDiscussClock();
  const s = state.shared;
  const spies = s.spies || [];
  const won = s.outcome === 'caught';
  const undercover = !!s.undercover;
  const fresh = renderRoomFrame(el, 'result|' + spies.join(',') + '|' + s.outcome + '|' + state.youAreHost + '|' + undercover + '|' + appState.lang, () => {
    const revealKey = ['imp', roomDealKey(state), spies.join(','), s.outcome, s.secretWord].join('|');
    // The vote as bars first, the spy's own rising last and lit (the review of 1 Oct 2026);
    // the card and the spy himself wait until it has risen.
    const bars = roomSpyVoteBars(state, s.spyIds || [], 'phone');
    const cover = spyRevealParts(revealKey,
                                 undercover ? (spies.length > 1 ? t.reveal_und_were : t.reveal_und_was) : (spies.length > 1 ? t.reveal_spies_were : t.reveal_spy_was), bars.ms);
    const cast = typeof spyCastHtml === 'function' ? spyCastHtml(revealKey, spyCastVerdict(s.outcome), { kind: 'spy', loud: spyCastLoud(state), after: cover.at }) : '';
    return `${bars.html}${cast}
    <div class="card ${won ? 'card--accent' : ''} ${cover.cls}" ${cover.attrs} style="text-align:center; --cover-at:${cover.at}ms">${cover.cover}
      <div class="metric metric--md ${won ? 'tx-success' : (s.outcome === 'revealed' ? '' : 'tx-danger')}" style="margin-bottom: var(--sp-3)">${won ? '🎉' : (undercover ? '🎭' : '🕵️')} ${escapeHTML(imposterOutcomeLine(s, t))}</div>
      ${undercover && s.pairOther ? `
        <div class="metric metric--sm" style="margin-top: var(--sp-2)">
          ${escapeHTML(t.imp_und_result_words || 'الكلمة كانت {word}، والمختلف كانت معاه {other}')
            .replace('{word}', `<strong class="tx-accent">${escapeHTML(s.secretWord || '')}</strong>`)
            .replace('{other}', `<strong class="tx-accent">${escapeHTML(s.pairOther || '')}</strong>`)}
        </div>` : `
        <div class="eyebrow">${t.secret_word || 'الكلمة السرية'}</div>
        <div class="metric metric--md metric--accent">${escapeHTML(s.secretWord || '')}</div>`}
      ${s.accusedName ? `<p class="sheet__subtitle">${escapeHTML(t.cham_accused || '')}: ${escapeHTML(s.accusedName)}${s.guess ? ` · ${escapeHTML(t.spy_guess_was || '')}: ${escapeHTML(s.guess)}` : ''}</p>` : ''}
    </div>
    ${renderScoreboard(s.board)}
    ${state.youAreHost
      ? `<div class="btn-stack">
           <button onclick="roomAct('restart')" class="btn btn--primary btn--lg">${t.play_again || 'لعبة جديدة'}</button>
           <button onclick="roomAct('backToHub')" class="btn btn--ghost">${t.room_another_game || 'لعبة أخرى'}</button>
         </div>`
      : `<div class="waiting-note">${t.room_wait_host}</div>`}`;
  });
  // Only on the round that actually just ended. This used to re-fire every time
  // anyone's presence flickered, which is every few seconds in a real room.
  if (fresh && won) afterReveal(el, () => confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } }));
}

/* --- shared helpers used by every room game ----------------------------- */

/**
 * Rebuilds a room view only when what it shows has actually changed.
 *
 * Every poll re-emits as soon as anyone's presence flips - which is constant in
 * a room full of phones locking and waking - and a blind innerHTML rewrite at
 * that moment throws away whatever the player was in the middle of typing. So
 * each screen declares the signature it really depends on, and presence is
 * refreshed on its own below.
 *
 * Returns true when it rebuilt, for anything that should only fire on a change.
 */
function renderRoomFrame(el, sig, build, keep) {
  // The deal is part of every frame (the owner, 23 Sep 2026: back to the hub,
  // ارسم وخمّن chosen again, and the same word "again and again"). A new deal of
  // the same game starts at round 1 with the same player up, so a screen keyed
  // on the round alone kept the last deal's frame - its word included - while
  // the server had dealt a new one.
  const st = typeof Room !== 'undefined' ? Room.state : null;
  const full = (st ? [st.code, st.game || '', (st.shared && st.shared.dealId) || ''].join('~') + '~' : '') + sig;
  if (el.dataset.sig === full) return false;
  el.dataset.sig = full;
  // `keep` names the moment a field belongs to (a round's writing): rebuilt within
  // the same moment - a new host, the language - what is being typed survives.
  const keepKey = keep ? full.slice(0, full.length - sig.length) + keep : '';
  const kept = keepKey && el.dataset.keep === keepKey ? roomFieldsTake(el) : null;
  el.dataset.keep = keepKey;
  el.innerHTML = build();
  if (kept) roomFieldsPut(kept);
  return true;
}

/** The text fields of a frame, their values, and which had the caret. */
function roomFieldsTake(el) {
  const fields = [...el.querySelectorAll('input[id]:not([type]), input[id][type="text"], textarea[id]')]
    .filter(f => f.value).map(f => ({ id: f.id, value: f.value }));
  const a = document.activeElement;
  const focus = a && a.id && el.contains(a) && 'selectionStart' in a
    ? { id: a.id, start: a.selectionStart, end: a.selectionEnd } : null;
  return { fields: fields, focus: focus };
}

function roomFieldsPut(kept) {
  kept.fields.forEach(f => { const box = document.getElementById(f.id); if (box && !box.value) box.value = f.value; });
  const f = kept.focus && document.getElementById(kept.focus.id);
  if (f) {
    try { f.focus({ preventScroll: true }); f.setSelectionRange(kept.focus.start, kept.focus.end); } catch (e) {}
  }
}

/** Updates just the presence strip, leaving the rest of the view alone. */
function refreshRoomPlayerStrip(el, state) {
  const strip = el.querySelector('[data-room-strip]');
  if (strip) strip.outerHTML = renderRoomPlayerStrip(state);
}

/**
 * A compact who's-here strip, so players can see the room is still alive.
 * The host gets a ✕ on a phone that has gone, to take it out of the room.
 */
function renderRoomPlayerStrip(state) {
  return `
    <div class="chip-set" data-room-strip style="justify-content:center; margin-top: var(--sp-4)">
      ${state.players.map(p => `
        <span class="chip chip--plain ${p.online ? '' : 'is-away'}">
          <span class="presence-dot ${p.online ? 'is-online' : ''}"></span>
          <span class="chip__label">${p.bot ? '<span aria-hidden="true">🤖</span> ' : ''}${typeof roomNameHtml === 'function' ? roomNameHtml(state, p) : escapeHTML(p.name)}</span>
          ${typeof roomKickButton === 'function' ? roomKickButton(state, p) : ''}
        </span>`).join('')}
    </div>`;
}

/** A name's first letter, for the round bubble of a player chip (.talk-person__av). */
function roomInitial(name) {
  return escapeHTML(Array.from(String(name || '').trim())[0] || '?');
}

/**
 * A player as a chip (the talk's .talk-person): the initial in its bubble, the
 * name, and `extra` (a small state badge) after it. `cls` adds .is-first (lit:
 * whose turn it is, the first to buzz) or the game's own modifiers.
 */
function roomPersonChip(name, extra, cls, title) {
  return `<span class="talk-person ${cls || ''}"${title ? ` title="${escapeHTML(title)}"` : ''}><span class="talk-person__av" aria-hidden="true">${roomInitial(name)}</span><span class="talk-person__name">${escapeHTML(name || '')}</span>${extra || ''}</span>`;
}

/**
 * The host's small recovery buttons (skip a quiet phone, close the writing
 * early), as one centred row: [[label, onclick], …]. Labels are escaped here.
 */
function roomHostRow(buttons) {
  const list = (buttons || []).filter(b => b && b[0]);
  if (!list.length) return '';
  return `<div class="chip-set room-host-row" style="justify-content:center; margin-top: var(--sp-3)">${list.map(b =>
    `<button type="button" class="btn btn--${b[2] || 'ghost'} btn--xs btn--auto" onclick="${b[1]}">${escapeHTML(b[0])}</button>`).join('')}</div>`;
}

/** Thin wrapper so inline handlers can fire a room action and surface errors. */
async function roomAct(action, payload) {
  try {
    await Room.act(action, payload || {});
  } catch (err) {
    if (!err.quiet) showToast(err.message || 'تعذر تنفيذ الإجراء', 'error');
  }
}
</script>
