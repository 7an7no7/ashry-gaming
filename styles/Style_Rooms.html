  padding: 0.2rem 0.7rem; font-size: var(--fs-sm); font-weight: 700;
  background: rgba(255, 255, 255, 0.14); color: inherit;
}
.wit-pill--clock { background: var(--pop, #f59e0b); color: var(--pop-on, #1c1200); min-width: 3.2rem; justify-content: center; }
.wit-pill--clock.is-low { animation: wit-throb 0.9s ease-in-out infinite; }
.wit-pill--big { font-size: var(--fs-h1); padding: 0.35rem 1.1rem; }
@keyframes wit-throb { 50% { transform: scale(1.08); } }

.wit-roles { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: center; }
.wit-role {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.75rem;
  border-radius: var(--r-full); background: var(--surface-2); color: var(--text); font-weight: 700; font-size: var(--fs-sm);
}
.wit-role__k { color: var(--text-2); font-weight: 600; }
.wit-role.is-me { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

.wit-msg { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h2); text-align: center; color: var(--text); text-wrap: balance; }
.wit-msg--start { text-align: start; }
.wit-hint { margin: 0; text-align: center; color: var(--text-2); font-size: var(--fs-sm); text-wrap: balance; }
.wit-hint--start { text-align: start; }
/* 🤐 during the vote: the witness keeps quiet (their phone and the TV). */
.wit-hush { display: grid; gap: var(--sp-1); justify-items: center; text-align: center; padding: var(--sp-3) var(--sp-4); border-radius: 14px; background: var(--warning-soft); border: 1px solid var(--warning); color: var(--text); }
.wit-hush b { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h2); }
.wit-hush span { font-size: var(--fs-sm); color: var(--text-2); }
.wit-hints { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
.wit-hints span { border-radius: var(--r-full); padding: 0.2rem 0.7rem; background: var(--wit-manila); color: var(--wit-manila-ink); font-size: var(--fs-sm); font-weight: 700; }
.wit-say { text-align: center; padding: 0.45rem 0.8rem; border-radius: var(--r-md); background: var(--wit-navy-2); color: #ffffff; font-weight: 700; font-size: var(--fs-sm); }
.wit-go { max-width: 22rem; margin-inline: auto; width: 100%; }

/* The case file and its Polaroid */
.wit-folder {
  position: relative; margin: 1.4rem auto 0; width: 100%; max-width: 22rem;
  padding: 1.1rem 1rem 1rem; border-radius: 0.4rem 0.4rem var(--r-xl) var(--r-xl);
  background: var(--wit-manila); color: var(--wit-manila-ink);
  box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.45); text-align: center;
}
.wit-folder__tab {
  position: absolute; top: -1.35rem; inset-inline-end: 1.1rem; padding: 0.15rem 1.1rem;
  border-radius: 0.6rem 0.6rem 0 0; background: var(--wit-manila);
  font-family: var(--font-display); font-weight: 800; font-size: var(--fs-sm);
}
.wit-folder__crime { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-body); text-wrap: balance; }
.wit-polar {
  position: relative; width: 62%; max-width: 13rem; margin: 0.8rem auto 0; padding: 0.55rem 0.55rem 1.6rem;
  background: #ffffff; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.45); transform: rotate(-2deg);
}
.wit-polar__face { aspect-ratio: 90 / 98; background: #e4ebf6; overflow: hidden; }
.wit-polar__face svg, .wit-mug__face svg, .wit-slot__face svg, .wit-clip svg, .wit-flip__front svg { display: block; width: 100%; height: 100%; }
.wit-polar__back {
  position: absolute; inset: 0.55rem 0.55rem 1.6rem; display: grid; place-items: center;
  background: var(--wit-navy); color: #ffffff; font-family: var(--font-display); font-weight: 900; font-size: 3rem;
  opacity: 0; transition: opacity 0.35s ease;
}
.wit-polar.is-back .wit-polar__back { opacity: 1; }
.wit-polar.is-flipping { animation: wit-flip-over 0.6s ease both; }
@keyframes wit-flip-over { 0% { transform: rotate(-2deg) rotateY(0); } 50% { transform: rotate(-2deg) rotateY(90deg); } 100% { transform: rotate(-2deg) rotateY(0); } }

/* The countdown ring */
.wit-ring { position: relative; width: 5rem; height: 5rem; margin: 0.9rem auto 0; }
.wit-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.wit-ring__bg { fill: none; stroke: rgba(30, 42, 68, 0.16); stroke-width: 5; }
.wit-ring__arc { fill: none; stroke: var(--wit-navy); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 0.12s linear; }
.wit-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; color: var(--wit-navy); }
.wit-ring--tv { width: 9vmin; height: 9vmin; }
.wit-ring--tv b { font-size: 4vmin; }

/* The mugshot and its height lines */
.wit-mug {
  position: relative; overflow: hidden; border-radius: var(--r-xl);
  background: linear-gradient(var(--wit-wall-2), var(--wit-wall)); aspect-ratio: 5 / 4; max-height: 38vh; width: 100%; margin-inline: auto;
}
.wit-hl {
  position: absolute; inset-inline: 0; border-top: 1.5px solid var(--wit-line);
  direction: ltr; text-align: left; font-size: 0.625rem; font-weight: 700; color: var(--wit-navy); padding-left: 0.35rem; line-height: 1.2;
}
.wit-mug__face { position: absolute; left: 50%; bottom: 1.9rem; height: calc(100% - 2.6rem); aspect-ratio: 90 / 98; transform: translateX(-50%); }
.wit-mug__plate {
  position: absolute; left: 50%; bottom: 0.45rem; transform: translateX(-50%); max-width: 92%;
  background: var(--wit-navy); color: #ffffff; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xs);
  padding: 0.15rem 0.8rem; border-radius: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wit-mug--small { max-height: 22vh; }
.wit-draw { display: grid; gap: var(--sp-3); }
.wit-side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }

/* The builder */
.wit-builder { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.wit-tabs { display: flex; gap: 0.4rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.15rem; }
.wit-tabs::-webkit-scrollbar { display: none; }
.wit-tab {
  flex: none; font: inherit; font-size: var(--fs-sm); font-weight: 700; min-height: 2.75rem; padding: 0 0.85rem;
  border: 0; border-radius: var(--r-full); background: var(--surface-2); color: var(--text); cursor: pointer; white-space: nowrap;
}
.wit-tab.is-on { background: var(--accent); color: var(--accent-on); }
.wit-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; }
.wit-opt {
  font: inherit; font-size: var(--fs-sm); font-weight: 700; min-height: 2.9rem; padding: 0.3rem;
  border-radius: var(--r-md); border: 2px solid transparent; background: var(--surface-solid); color: var(--text);
  box-shadow: var(--sh-1); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.35rem; text-align: center;
}
.wit-opt.is-on { border-color: var(--accent); background: var(--accent-soft); }
.wit-sw { width: 1.4rem; height: 1.4rem; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.18); }
.wit-foot {
  position: sticky; bottom: calc(-1 * var(--main-pb, 0px)); z-index: 2;
  padding: var(--sp-2) 0 calc(var(--sp-2) + var(--main-pb, 0px)); background: var(--bg);
}

/* The lineup and its wall */
.wit-lineup { position: relative; border-radius: var(--r-xl); overflow: hidden; background: linear-gradient(var(--wit-navy-3), var(--wit-navy-2)); padding: 0.8rem 0.6rem 0.7rem; }
.wit-lineup__wall { position: absolute; inset: 0; pointer-events: none; }
.wit-lineup__wall .wit-hl { border-color: rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.5); }
.wit-lineup__row { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem 0.5rem; }
.wit-slot {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.25rem 0.2rem 0.35rem;
  border: 0; border-radius: var(--r-md); background: transparent; color: #ffffff; font: inherit; min-width: 0;
  transition: opacity 0.5s ease, filter 0.5s ease, transform 0.2s ease;
}
button.wit-slot { cursor: pointer; }
button.wit-slot:active { transform: scale(0.97); }
.wit-slot__face { width: 100%; aspect-ratio: 90 / 98; }
.wit-slot__num {
  min-width: 2.2rem; padding: 0 0.4rem; border-radius: 0.4rem; background: var(--wit-plate); color: var(--wit-navy);
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h3); line-height: 1.6; text-align: center;
}
.wit-slot__name { font-size: var(--fs-xs); color: #d6dcea; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wit-slot.is-mine { background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 0 3px var(--wit-gold); }
.wit-slot.is-mine .wit-slot__num { background: var(--wit-gold); }
.wit-slot--rise { animation: wit-rise 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both; animation-delay: calc(var(--i) * 90ms); }
@keyframes wit-rise { from { transform: translateY(1.8rem); opacity: 0; } }
.wit-lineup.is-reveal .wit-slot.is-not { opacity: 0.42; filter: grayscale(0.8); }
.wit-lineup.is-reveal .wit-slot.is-real { z-index: 1; }
.wit-spot {
  position: absolute; left: 50%; top: -30%; width: 170%; height: 150%; transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(255, 236, 160, 0.55), transparent 64%);
}
.wit-slot__coins { display: flex; flex-wrap: wrap; gap: 0.2rem; justify-content: center; min-height: 1.6rem; }
.wit-coin {
  width: 1.5rem; height: 1.5rem; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--c); color: #ffffff; font-weight: 800; font-size: 0.72rem; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.28);
}
.wit-lineup.is-reveal .wit-slot__coins .wit-coin { animation: wit-drop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both; animation-delay: var(--at); }
@keyframes wit-drop { from { transform: translateY(-3.5rem) scale(0.4); opacity: 0; } }
.wit-coin--flat { width: 1.3rem; height: 1.3rem; animation: none; }
.wit-stamp {
  position: absolute; top: 34%; left: 50%; transform: translateX(-50%) rotate(-10deg); z-index: 2; white-space: nowrap;
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-body); line-height: 1.3; color: var(--wit-stamp-ink);
  padding: 0.05rem 0.5rem; border: 2px solid var(--wit-stamp-ink); border-radius: 0.35rem; background: rgba(255, 250, 238, 0.92);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  pointer-events: none;
}
.wit-stamp--in { animation: wit-stamp 0.4s cubic-bezier(0.3, 1.6, 0.5, 1) both; animation-delay: var(--at); }
@keyframes wit-stamp { from { transform: translateX(-50%) scale(2.4) rotate(-10deg); opacity: 0; } }
.wit-lineup.is-reveal .wit-slot.is-real .wit-spot { animation: wit-fade-in 0.6s ease both; animation-delay: calc(var(--at, 0ms)); }
@keyframes wit-fade-in { from { opacity: 0; } }

/* The vote's head, the sketch beside the real face */
.wit-vote { display: flex; flex-direction: column; gap: var(--sp-3); }
.wit-vote__head { display: flex; gap: var(--sp-3); align-items: center; }
.wit-clip {
  position: relative; background: var(--wit-manila-2); border-radius: 0.6rem; padding: 1rem 0.55rem 0.55rem; aspect-ratio: 90 / 110;
}
.wit-clip::before { content: ""; position: absolute; top: -0.3rem; left: 50%; transform: translateX(-50%); width: 40%; height: 0.9rem; background: #9aa3b5; border-radius: 0.35rem; }
.wit-clip > svg { background: #ffffff; border-radius: 0.2rem; }
.wit-clip--small { width: 5.2rem; flex: none; }
.wit-compare { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); max-width: 24rem; width: 100%; margin-inline: auto; }
.wit-compare__card { display: flex; flex-direction: column; gap: 0.3rem; text-align: center; min-width: 0; }
.wit-compare__card small { color: var(--text-2); font-size: var(--fs-xs); font-weight: 700; }
.wit-flip { position: relative; aspect-ratio: 90 / 110; perspective: 700px; }
.wit-flip__in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.8s ease; }
.wit-flip.is-open .wit-flip__in { transform: rotateY(180deg); }
.wit-flip--turn .wit-flip__in { transition-delay: var(--at); }
.wit-flip--turn.is-open .wit-flip__in { animation: wit-turn 0.8s ease both; animation-delay: var(--at); }
@keyframes wit-turn { from { transform: rotateY(0); } to { transform: rotateY(180deg); } }
.wit-flip__back, .wit-flip__front { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0.6rem; overflow: hidden; }
.wit-flip__back { display: grid; place-items: center; text-align: center; background: var(--wit-manila); color: var(--wit-manila-ink); font-family: var(--font-display); font-weight: 900; font-size: var(--fs-sm); padding: 0.5rem; }
.wit-flip__front { transform: rotateY(180deg); background: #e4ebf6; }

.wit-verdict { text-align: center; }
.wit-verdict__line { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h1); color: var(--text); }
.wit-verdict__pts { color: var(--text-2); font-weight: 700; font-size: var(--fs-sm); }
.wit-gained { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
.wit-gain { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.65rem 0.2rem 0.3rem; border-radius: var(--r-full); background: var(--surface-2); color: var(--text); font-size: var(--fs-sm); font-weight: 700; }
.wit-gain b { color: var(--success-ink, var(--text)); }
.wit-reveal, .wit-over { display: flex; flex-direction: column; gap: var(--sp-3); }
.wit-next { margin-top: var(--sp-2); }

/* A phone on its side, a laptop: the pieces side by side */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  .wit-draw { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); align-items: start; }
  .wit-draw--watch { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
  .wit-draw .wit-mug { max-height: none; aspect-ratio: 5 / 5.2; position: sticky; top: 0; }
  .wit-draw .wit-folder { margin-top: 1.4rem; }
  .wit-lineup__row { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .wit-reveal { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: center; }
  .wit-reveal .wit-lineup { grid-row: span 3; }
  .wit--ready .wit-body, .wit--look .wit-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
  .wit-draw .wit-mug { max-height: calc(var(--app-h, 100dvh) - 12rem); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .wit-folder { max-width: 19rem; padding: 0.8rem 0.8rem 0.7rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 0.6rem; }
  .wit-folder__crime { grid-column: 1 / -1; }
  .wit-polar { width: 100%; max-width: 5.6rem; margin-top: 0.4rem; padding: 0.4rem 0.4rem 1rem; }
  .wit-folder__crime { font-size: var(--fs-sm); }
  .wit-ring { width: 3.8rem; height: 3.8rem; margin-top: 0.5rem; }
  .wit-draw .wit-mug { aspect-ratio: auto; height: calc(var(--app-h, 100dvh) - 8.5rem); min-height: 12rem; }
  .wit-ring b { font-size: 1.5rem; }
  .wit-opts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .wit-mug--small { max-height: 30vh; }
}

/* The TV */
.wit-tv { height: 100%; display: flex; flex-direction: column; gap: 1.6vmin; }
.wit-tv__head {
  display: flex; align-items: center; gap: 2vmin; padding: 1.2vmin 2vmin; border-radius: 1.6vmin;
  background: var(--wit-navy); color: #ffffff; font-size: 2.2vmin;
}
.wit-tv__head b { font-family: var(--font-display); font-size: 2.8vmin; }
.wit-tv__head > span:nth-child(2) { flex: 1; font-weight: 700; }
.wit-tv__head .wit-pill { font-size: 2vmin; }
.wit-tv__stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 3vmin; align-items: center; }
.wit-tv__stage--lineup { grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr); }
.wit-tv__stage--over { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.wit-tv__main, .wit-tv__side { display: flex; flex-direction: column; gap: 2vmin; min-width: 0; justify-content: center; }
.wit-tv .wit-msg { font-size: 3.4vmin; }
.wit-tv .wit-hint { font-size: 2.2vmin; }
.wit-hush--tv { padding: 1.4vmin 2vmin; border-radius: 1.6vmin; }
.wit-hush--tv b { font-size: 3vmin; }
.wit-tv .wit-role { font-size: 2.2vmin; padding: 0.6vmin 1.6vmin; }
.wit-folder--tv { max-width: 44vmin; }
.wit-folder--tv .wit-folder__crime { font-size: 2.4vmin; }
.wit-folder--tv .wit-folder__tab { font-size: 1.9vmin; }
.wit-mug--tv { max-height: 70vmin; height: 70vmin; aspect-ratio: 5 / 4.6; width: auto; }
.wit-mug--tv .wit-hl { font-size: 1.5vmin; }
.wit-mug--tv .wit-mug__plate { font-size: 2vmin; bottom: 1.2vmin; }
.wit-mug--tv .wit-mug__face { bottom: 5.4vmin; height: calc(100% - 7vmin); }
.wit-lineup--tv { padding: 2vmin 1.6vmin 1.4vmin; }
.wit-lineup--tv .wit-lineup__row { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1.4vmin; }
.wit-lineup--tv .wit-slot__num { font-size: 3vmin; min-width: 5vmin; }
.wit-lineup--tv .wit-slot__name { font-size: 1.8vmin; }
.wit-lineup--tv .wit-coin { width: 3.4vmin; height: 3.4vmin; font-size: 1.7vmin; }
.wit-lineup--tv .wit-slot__coins { min-height: 3.6vmin; }
.wit-lineup--tv .wit-hl { font-size: 1.5vmin; }
.wit-lineup--tv .wit-stamp { font-size: 3vmin; border-width: 0.35vmin; }
.wit-tv .wit-compare { max-width: none; }
.wit-tv .wit-compare__card small { font-size: 1.8vmin; }
.wit-tv .wit-flip__back { font-size: 2vmin; }
.wit-tv .wit-verdict__line { font-size: 3.6vmin; }
.wit-tv .wit-verdict__pts, .wit-tv .wit-gain { font-size: 2vmin; }
.wit-tv .wit-coin--flat { width: 2.8vmin; height: 2.8vmin; font-size: 1.4vmin; }

@media (prefers-reduced-motion: reduce) {
  .wit-slot--rise, .wit-stamp--in, .wit-polar.is-flipping, .wit-pill--clock.is-low,
  .wit-lineup.is-reveal .wit-slot__coins .wit-coin, .wit-lineup.is-reveal .wit-slot.is-real .wit-spot, .wit-flip--turn.is-open .wit-flip__in { animation: none; }
  .wit-flip__in, .wit-polar__back, .wit-slot, .wit-ring__arc { transition: none; }
}

/* =====================================================================
   55. الحقوا! (PANIC STATIONS, first سلك مقطوع in rooms, JS_RoomWire.html, 29 Sep 2026): every
   phone a panel, each place its own layout from the owner's picks - the
   microbus's dashboard (an LED order, metal plates), mum's note in the
   kitchen (the order pinned among the controls, a burning fuse), the
   wedding's uncle and DJ mixer (a ring round his face, faders). The places
   keep their own colours in both themes (they are scenes, not the page).
   The TV: each place its scene, the progress and the damage drawn into it.
   ========================================================================= */
.wr {
  --ink: #221f36;
  --k: 1;
  --t: 1; --p: 0; --d: 0;
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; flex-direction: column; gap: 0.25rem;
  border-radius: var(--r-2xl); border: 3px solid #15121f;
  box-shadow: 0 10px 30px rgba(20, 12, 40, 0.25);
  color: var(--pc); background: var(--pbg);
  -webkit-user-select: none; user-select: none;
  padding-block-end: 0.6rem;
}
.wr button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.wr-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.7rem 1rem 0.15rem; font-size: 0.82rem; font-weight: 700; }
.wr-top__place { font-family: var(--font-display); font-size: 0.9rem; text-align: center; flex: 1; min-width: 0; }
.wr-top__clock { font-size: 1rem; }
.wr-top__clock.is-low { color: #ff5f57; }
.wr--kitchen .wr-top__clock.is-low { color: #c21d1d; }
.wr-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; padding: 0.15rem 1rem 0.4rem; font-size: 0.72rem; font-weight: 700; }
.wr-mbar { height: 0.7rem; border-radius: 99px; background: rgba(127, 127, 127, 0.28); overflow: hidden; border: 2px solid var(--ink); margin-top: 0.15rem; }
.wr-mbar i { display: block; height: 100%; transform-origin: right; transition: transform 0.35s var(--ease-out, ease); }
html[dir="ltr"] .wr-mbar i { transform-origin: left; }
.wr-mbar--p i { background: #1f9d55; transform: scaleX(var(--p)); }
.wr-mbar--d i { background: #e5383b; transform: scaleX(var(--d)); }
.wr-watch { margin: 1rem; padding: 1.2rem; text-align: center; font-weight: 700; border-radius: var(--r-xl); background: rgba(0, 0, 0, 0.18); }
/* «المنادي» (7 Oct 2026): a watcher's phone lists every open order, the one about to burn on top. */
.wr-caller { margin: 0.4rem 1rem; display: grid; gap: 0.5rem; }
.wr-caller__head { display: grid; gap: 0.15rem; text-align: center; }
.wr-caller__head b { font-family: var(--font-display); font-size: 1.1rem; }
.wr-caller__head small, .wr-caller__foot { font-size: 0.75rem; font-weight: 700; opacity: 0.8; text-align: center; }
.wr-caller__list { display: grid; gap: 0.45rem; }
.wr-call { position: relative; padding: 0.45rem 0.8rem 1rem; border-radius: var(--r-lg); background: #fff6a8; color: #221f36; border: 2px solid #15121f; font-weight: 800; line-height: 1.3; }
.wr-call small { display: block; font-size: 0.72rem; font-weight: 700; color: #6b6480; }
.wr-call i { position: absolute; inset-inline: 0.8rem; bottom: 0.35rem; height: 0.35rem; border-radius: 99px; background: #e5383b; transform-origin: right; }
html[dir="ltr"] .wr-call i { transform-origin: left; }
.wr-call.is-idle { opacity: 0.6; text-align: center; padding-bottom: 0.45rem; }
.wr-call.is-next { box-shadow: 0 0 0 3px #ffb938; }
.wr-call.is-hurry { animation: wrCallPulse 0.45s ease-in-out infinite alternate; }
@keyframes wrCallPulse { to { transform: scale(1.03); } }

/* The stamp and the red edge: a moment on this phone. */
.wr-stamp { position: absolute; inset-inline: 0; top: 40%; z-index: 5; text-align: center; white-space: pre-line; font-family: var(--font-display); font-weight: 900; font-size: 2.3rem; line-height: 1.2; pointer-events: none; opacity: 0; }
.wr.is-ok .wr-stamp { color: #1f9d55; animation: wrStamp 0.9s both; }
.wr.is-bad .wr-stamp { color: #e5383b; animation: wrStamp 0.9s both; }
.wr.is-lvl .wr-stamp { color: #f59e0b; animation: wrStamp 1.5s both; }
.wr.is-ok .wr-stamp, .wr.is-bad .wr-stamp, .wr.is-lvl .wr-stamp { text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 0 4px 12px rgba(0, 0, 0, 0.35); }
@keyframes wrStamp { 0% { opacity: 0; transform: scale(0.5) rotate(-8deg); } 25% { opacity: 1; transform: scale(1.1) rotate(-6deg); } 75% { opacity: 1; transform: scale(1) rotate(-6deg); } 100% { opacity: 0; transform: scale(1) rotate(-6deg); } }
.wr.is-bad, .wr.is-hurt { animation: wrBuzz 0.4s; }
@keyframes wrBuzz { 0%, 100% { translate: 0; } 20% { translate: -8px; } 40% { translate: 7px; } 60% { translate: -5px; } 80% { translate: 3px; } }
.wr-red { position: absolute; inset: 0; pointer-events: none; z-index: 4; border-radius: inherit; }
.wr.is-bad .wr-red, .wr.is-hurt .wr-red { animation: wrRedIn 0.7s; }
@keyframes wrRedIn { 30% { box-shadow: inset 0 0 60px 14px rgba(229, 56, 59, 0.7); } }

/* --- the controls -------------------------------------------------------------- */
.wr-ctl { position: relative; display: grid; justify-items: center; align-content: center; gap: 0.35rem; padding: 0.5rem 0.25rem; border-radius: 1.1rem; min-width: 0; transition: rotate 0.35s var(--ease-out, ease); }
.wr-ctl__n { font-weight: 700; font-size: 0.8rem; text-align: center; line-height: 1.3; max-width: 100%; overflow-wrap: anywhere; }
.wr-btn {
  width: calc(4.6rem * var(--k)); height: calc(4.6rem * var(--k)); border-radius: 50%; border: 4px solid var(--ink); padding: 0;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), transparent 40%), var(--c, #e5383b);
  box-shadow: 0 7px 0 var(--ink); transition: transform 0.08s, box-shadow 0.08s; touch-action: manipulation;
}
.wr-btn:active, .wr-btn.is-hit { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); }
.wr-sw { width: calc(4.1rem * var(--k)); height: calc(5.6rem * var(--k)); border-radius: 0.9rem; border: 4px solid var(--ink); background: #3a3450; position: relative; padding: 0; transition: background 0.2s; }
.wr-sw__l { position: absolute; left: 50%; bottom: 44%; width: 0.62rem; height: 40%; margin-left: -0.31rem; background: #cfcbe0; border: 3px solid var(--ink); border-radius: 6px; transform-origin: 50% 100%; transform: rotate(35deg); transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1); }
.wr-sw__l::after { content: ""; position: absolute; top: -1rem; left: 50%; width: 1.5rem; height: 1.5rem; margin-left: -0.75rem; border-radius: 50%; background: #e5383b; border: 3px solid var(--ink); }
.wr-sw__b { position: absolute; left: 50%; bottom: 0.6rem; width: 1.9rem; height: 1.1rem; margin-left: -0.95rem; border-radius: 6px; background: var(--ink); }
.wr-sw[aria-pressed="true"] { background: #2f7a52; }
.wr-sw[aria-pressed="true"] .wr-sw__l { transform: rotate(-35deg); }
.wr-sw[aria-pressed="true"] .wr-sw__l::after { background: #3ddc84; }
.wr-dial {
  margin-bottom: 0.7rem; width: calc(5.2rem * var(--k)); height: calc(5.2rem * var(--k)); border-radius: 50%; border: 4px solid var(--ink); position: relative; padding: 0;
  background: conic-gradient(from 200deg, #fff 0 20%, #ffe8a3 20% 40%, #ffc861 40% 60%, #ff9b57 60% 80%, #ff5f57 80% 100%);
}
.wr-dial__knob { position: absolute; inset: 14px; border-radius: 50%; background: #3a3450; border: 3px solid var(--ink); transform: rotate(var(--r, -120deg)); transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1); }
.wr-dial__knob::after { content: ""; position: absolute; top: 2px; left: 50%; width: 6px; height: 1.1rem; margin-left: -3px; border-radius: 3px; background: #ffd166; }
.wr-dial__v { position: absolute; bottom: -0.8rem; left: 50%; translate: -50%; background: var(--ink); color: #fff; font-weight: 900; border-radius: 99px; padding: 0 0.55rem; font-size: 0.85rem; }
.wr-sl { position: relative; touch-action: none; cursor: grab; }
.wr-sl:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; border-radius: 8px; }
.wr-sl[data-o="h"] { width: min(100%, calc(12rem * var(--k))); height: 2.75rem; }
.wr-sl[data-o="v"] { width: 3.4rem; height: calc(10rem * var(--k)); }
.wr-sl__tr { position: absolute; background: var(--ink); border-radius: 99px; }
.wr-sl[data-o="h"] .wr-sl__tr { left: 10px; right: 10px; top: 18px; height: 8px; }
.wr-sl[data-o="v"] .wr-sl__tr { top: 10px; bottom: 10px; left: 23px; width: 8px; }
.wr-sl__th { position: absolute; border: 4px solid var(--ink); background: #ffd166; border-radius: 10px; transition: left 0.1s, bottom 0.1s; }
.wr-sl[data-o="h"] .wr-sl__th { width: 28px; height: 40px; top: 2px; left: calc(var(--f, 0) * (100% - 28px)); }
.wr-sl[data-o="v"] .wr-sl__th { width: 46px; height: 26px; left: 4px; bottom: calc(var(--f, 0) * (100% - 26px)); }
.wr-sl__v { font-size: 0.7rem; font-weight: 700; opacity: 0.8; display: flex; justify-content: space-between; width: min(100%, calc(12rem * var(--k))); padding-inline: 12px; }
.wr-ctl--v .wr-sl__v { flex-direction: column; width: auto; height: auto; gap: 0; padding: 0; align-items: center; position: absolute; inset-inline-end: 0.4rem; top: 2.2rem; bottom: 1rem; justify-content: space-between; }

/* Broken: smoke to wipe, or the whole control turned upside down. */
.wr-smk {
  position: absolute; inset: 0; z-index: 2; border: 0; border-radius: 1.1rem; display: grid; place-items: center;
  background: radial-gradient(circle at 30% 40%, #8d8aa0 0 22%, transparent 23%), radial-gradient(circle at 70% 35%, #a6a3b6 0 26%, transparent 27%), radial-gradient(circle at 50% 70%, #7a7790 0 30%, transparent 31%), rgba(90, 86, 110, 0.9);
  animation: wrSmoke 1.6s ease-in-out infinite alternate;
}
.wr-smk[hidden] { display: none; }
.wr-smk em { font-style: normal; font-weight: 900; color: #fff; background: #221f36; border-radius: 99px; padding: 0.15rem 0.7rem; font-size: 0.85rem; }
.wr-smk.is-wipe { animation: wrWipe 0.25s; }
@keyframes wrSmoke { to { background-position: 6px -4px, -5px 3px, 3px 5px, 0 0; } }
@keyframes wrWipe { 50% { opacity: 0.55; transform: scale(0.96); } }
.wr-ctl.is-flip { rotate: 180deg; }
.wr-ctl.is-done { animation: wrDone 0.6s; }
@keyframes wrDone { 30% { box-shadow: 0 0 0 4px #3ddc84, 0 0 22px 6px rgba(61, 220, 132, 0.6); } }

/* The order's box: a pop when a new order comes. */
.wr-ord { position: relative; }
.wr-ord.is-new .wr-ord__text { animation: wrOrdIn 0.35s var(--ease-out, ease); }
@keyframes wrOrdIn { from { opacity: 0; transform: translateY(6px) scale(0.96); } }
.wr-ord.is-idle .wr-ord__text { opacity: 0.55; }
.wr-ord small { display: block; font-size: 0.72rem; font-weight: 700; }
.wr-ord__text { display: block; font-family: var(--font-display); line-height: 1.35; min-height: 2.7em; }
.wr-ord__who { display: block; font-size: 0.75rem; font-weight: 700; min-height: 1.1rem; }

/* --- «تابلوه الميكروباص»: the LED order over a grid of metal plates ---------------- */
.wr--bus { --pbg: linear-gradient(#3b3552, #221d33); --pc: #f4f0ff; }
.wr-ord--led { margin: 0.25rem 0.9rem 0.6rem; background: #0c0a12; border: 4px solid #000; border-radius: 0.9rem; padding: 0.75rem 0.9rem 0.6rem; box-shadow: inset 0 0 0 2px #3c3552; }
.wr-ord--led small { color: #8f89a8; }
.wr-ord--led .wr-ord__text { color: #ffb938; font-size: 1.45rem; text-shadow: 0 0 10px rgba(255, 185, 56, 0.6); }
.wr-ord--led .wr-ord__who { color: #7ee0a2; }
.wr-drain--seg { height: 0.85rem; margin-top: 0.35rem; background: repeating-linear-gradient(90deg, #221f36 0 12px, #0c0a12 12px 15px); border-radius: 4px; overflow: hidden; direction: ltr; }
.wr-drain--seg i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, #ffb938 0 12px, transparent 12px 15px); transform-origin: left; transform: scaleX(var(--t)); }
.wr--bus.is-hurry .wr-drain--seg i { background: repeating-linear-gradient(90deg, #ff5f57 0 12px, transparent 12px 15px); }
.wr--bus.is-hurry .wr-ord__text { color: #ff7a6b; animation: wrBlink 0.5s steps(2) infinite; }
@keyframes wrBlink { 50% { opacity: 0.55; } }
.wr-pnl { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; padding: 0 0.9rem; align-content: start; }
.wr--bus .wr-ctl { background: linear-gradient(#5a5270, #443d5a); border: 3px solid #15121f; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.15); }
.wr--bus .wr-ctl::before, .wr--bus .wr-ctl::after { content: ""; position: absolute; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #2a2538; }
.wr--bus .wr-ctl::before { right: 8px; } .wr--bus .wr-ctl::after { left: 8px; }
.wr--bus .wr-ctl__n { background: #efe6c8; color: #221f36; border-radius: 4px; padding: 0 0.5rem; font-size: 0.75rem; border: 2px solid #15121f; }
.wr--bus .wr-ctl--h, .wr--kitchen .wr-ctl--h { grid-column: 1 / -1; }

/* --- «ورقة ماما على التلاجة»: the note pinned in the middle, the controls round it --- */
.wr--kitchen {
  --pbg: #fdf1e4; --pc: #221f36;
  background-image: linear-gradient(90deg, rgba(214, 176, 140, 0.25) 2px, transparent 2px), linear-gradient(rgba(214, 176, 140, 0.25) 2px, transparent 2px);
  background-size: 46px 46px; background-color: #fdf1e4;
}
.wr--kitchen .wr-pnl { gap: 0.6rem 0.75rem; padding-top: 0.4rem; }
.wr--kitchen .wr-ctl { background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.wr-ord--note { grid-column: 1 / -1; margin: 0.6rem 0.2rem 0.35rem; background: #fff6a8; border: 3px solid var(--ink); border-radius: 4px 4px 16px 4px; padding: 1rem 1rem 1.25rem; transform: rotate(-1.6deg); box-shadow: 0 6px 0 rgba(34, 31, 54, 0.2); color: #221f36; }
.wr-ord--note::before { content: ""; position: absolute; top: -12px; left: 50%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #e5383b; border: 3px solid var(--ink); }
.wr-ord--note small { color: #7a6a2a; }
.wr-ord--note .wr-ord__text { font-size: 1.5rem; }
.wr-ord--note .wr-ord__who { color: #1f7a43; }
.wr-drain--fuse { position: absolute; inset-inline: 10px; bottom: 6px; height: 8px; border-radius: 9px; background: rgba(34, 31, 54, 0.12); }
.wr-drain--fuse i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #e5383b, #f59e0b); transform-origin: right; transform: scaleX(var(--t)); }
.wr-spark { position: absolute; top: -2px; right: calc(var(--t) * 100% - 6px); width: 12px; height: 12px; border-radius: 50%; background: #ffd166; box-shadow: 0 0 10px 4px #ff9b57; animation: wrSpark 0.18s infinite alternate; }
@keyframes wrSpark { to { transform: scale(1.35); } }
.wr--kitchen.is-hurry .wr-ord--note { animation: wrWob 0.25s infinite alternate; }
@keyframes wrWob { to { transform: rotate(1.2deg); } }

/* --- «عم الفرح والمكسر»: the uncle shouts, the mixer's faders ------------------------ */
.wr--wedding { --pbg: radial-gradient(circle at 50% 0, #4c2f8a, #1b1236 70%); --pc: #fff; }
.wr-ord--uncle { display: grid; grid-template-columns: 5.8rem 1fr; gap: 0.6rem; align-items: center; padding: 0.25rem 0.9rem 0.5rem; }
.wr-face { position: relative; width: 5.8rem; height: 5.8rem; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#ffd166 calc(var(--t) * 360deg), rgba(255, 255, 255, 0.12) 0); }
.wr-face svg { width: 5rem; height: 5rem; }
.wr-face .wr-mad { display: none; }
.wr--wedding.is-hurry .wr-face .wr-mad { display: inline; }
.wr--wedding.is-hurry .wr-face .wr-glad { display: none; }
.wr--wedding.is-hurry .wr-face { background: conic-gradient(#ff5f57 calc(var(--t) * 360deg), rgba(255, 255, 255, 0.12) 0); animation: wrBuzz 0.4s infinite; }
.wr-bub { position: relative; background: #fff; color: #221f36; border: 3px solid var(--ink); border-radius: 18px; padding: 0.6rem 0.75rem; }
.wr-bub::before { content: ""; position: absolute; top: 2rem; inset-inline-start: -12px; border: 10px solid transparent; border-inline-end-color: #221f36; border-inline-start: 0; }
.wr-bub small { color: #6b6480; }
.wr-bub .wr-ord__text { font-size: 1.3rem; }
.wr-bub .wr-ord__who { color: #1f7a43; }
.wr--wedding .wr-pnl { margin: 0.2rem 0.75rem 0; padding: 0.85rem 0.6rem; border-radius: 22px; background: linear-gradient(#2d2350, #1a1433); border: 4px solid #000; grid-template-columns: repeat(4, 1fr); grid-auto-flow: row dense; gap: 0.5rem; }
.wr--wedding .wr-ctl { background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(255, 255, 255, 0.14); grid-column: span 2; }
.wr--wedding .wr-ctl--v { grid-column: span 1; grid-row: span 2; }
.wr--wedding .wr-ctl__n { font-size: 0.75rem; }
.wr--wedding .wr-sl__tr { background: #0b0818; box-shadow: 0 0 0 2px #6d5ba8; }
.wr--wedding .wr-sl__th { background: #cc99ff; }

/* «الكل يهز الموبايل!»: the whole panel waits for the shake. */
.wr-shake { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 1rem; background: rgba(20, 12, 40, 0.72); }
.wr-shake[hidden] { display: none; }
.wr-shake__card { width: min(100%, 20rem); display: grid; justify-items: center; gap: 0.6rem; padding: 1.2rem 1rem; border-radius: var(--r-2xl); background: #fff; color: #221f36; border: 4px solid #221f36; box-shadow: 0 8px 0 #221f36; text-align: center; }
.wr-shake__icon { font-size: 3.2rem; animation: wrShakeIcon 0.3s infinite alternate; }
@keyframes wrShakeIcon { from { rotate: -14deg; } to { rotate: 14deg; } }
.wr-shake__title { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; line-height: 1.3; }
.wr-shake__dots { display: flex; gap: 0.5rem; }
.wr-shake__dots i { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 3px solid #221f36; background: #fff; transition: background 0.15s, transform 0.15s; }
.wr-shake__dots i.is-on { background: #1f9d55; transform: scale(1.15); }
.wr-shake__tap { width: 100%; background: #f59e0b; color: #2a1600; border: 3px solid #221f36; }
.wr-shake__left { font-size: 1.3rem; font-weight: 900; }
.wr-shake.is-done .wr-shake__icon { animation: none; }

/* The end, above the table's bars (the panel goes). */
.wr-over { text-align: center; display: grid; gap: 0.3rem; margin-bottom: var(--sp-3); }
.wr-over__why { font-weight: 800; color: var(--danger-ink, var(--danger)); }
.wr-over__big { font-family: var(--font-display); font-size: 3.4rem; font-weight: 900; line-height: 1.1; color: var(--accent-ink); }
.wr-over__line { font-weight: 700; color: var(--text-2); }
.wr-over__best { font-weight: 700; }
.wr-over--rise { animation: wrRise 0.6s var(--ease-out, ease) both; }
@keyframes wrRise { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
.wr-lobby__places { justify-content: center; }

/* A phone on its side, and any wide screen: the order beside the panel. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  #view-room-wire .wr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "top top" "bars pnl" "ord pnl"; grid-template-rows: auto auto 1fr; align-content: start; align-items: start; column-gap: 0.4rem; }
  #view-room-wire .wr > .wr-pnl { grid-auto-flow: row dense; }
  #view-room-wire .wr-top { grid-area: top; }
  #view-room-wire .wr-bars { grid-area: bars; }
  #view-room-wire .wr > .wr-ord { grid-area: ord; }
  #view-room-wire .wr > .wr-pnl { grid-area: pnl; }
  #view-room-wire .wr-watch, #view-room-wire .wr-caller { grid-column: 1 / -1; }
  #view-room-wire .wr--kitchen { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "bars" "pnl"; }
  #view-room-wire .wr--kitchen .wr-pnl { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #view-room-wire .wr--kitchen .wr-ord--note { grid-column: span 2; grid-row: span 2; align-self: center; }
  #view-room-wire .wr--kitchen .wr-ctl--h { grid-column: span 2; }
}
@media (orientation: landscape) and (max-height: 500px) {
  #view-room-wire .wr { --k: 0.72; }
  .wr-top { padding-top: 0.45rem; }
  .wr-ctl { padding: 0.3rem 0.2rem; gap: 0.2rem; }
  .wr-ord--led .wr-ord__text, .wr-ord--note .wr-ord__text { font-size: 1.2rem; }
  .wr-sl[data-o="h"] { height: 2.4rem; }
  .wr-sl[data-o="v"] { height: calc(8rem * var(--k)); }
  .wr-stamp { font-size: 1.8rem; }
  /* The uncle's column is narrow here: his face over the bubble, a size down. */
  .wr-ord--uncle { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 0.35rem; }
  .wr-face { width: 4.2rem; height: 4.2rem; }
  .wr-face svg { width: 3.6rem; height: 3.6rem; }
  .wr-bub { width: 100%; }
  .wr-ctl--v .wr-sl__v { top: 2.9rem; }
  .wr-bub::before { top: -12px; inset-inline-start: calc(50% - 10px); border: 10px solid transparent; border-bottom-color: #221f36; border-top: 0; }
}
@media (min-width: 900px) {
  #view-room-wire > .wr { max-width: 60rem; margin-inline: auto; }
  #view-room-wire > .wr-over { max-width: 36rem; margin-inline: auto; }
}

/* --- the TV: each place its scene ---------------------------------------------- */
.wr-tv { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; border-radius: var(--tv-r, 18px); border: 0.6vmin solid #15121f; background: #000; container-type: size; font-family: var(--font); }
.wr-scn { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wr-tv__lv { font-family: var(--font-display); font-weight: 900; font-size: 4.2cqh; color: #ffb938; }
.wr-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 3; }
.wr-tv.is-alarm .wr-flash { animation: wrAlarm 0.35s 4 alternate; }
.wr-tv.is-alarm { animation: wrBuzz 0.35s 2; }
@keyframes wrAlarm { to { opacity: 1; } }
.wr-toast { position: absolute; top: 24cqh; left: 50%; translate: -50%; z-index: 4; max-width: 86cqw; text-align: center; background: #221f36; color: #fff; border: 0.5cqh solid #fff; border-radius: 2.6cqh; padding: 1.4cqh 3cqh; font-weight: 800; font-size: 3.4cqh; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.wr-toast.is-on { opacity: 1; }
.wr-tvcard { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 1.6cqh; padding: 4cqh; text-align: center; background: rgba(12, 8, 26, 0.72); color: #fff; }
.wr-tvcard[hidden] { display: none; }
.wr-tvcard.is-in { animation: wrCardIn 0.5s var(--ease-out, ease) both; }
@keyframes wrCardIn { from { opacity: 0; transform: scale(1.06); } }
.wr-tvcard__big { font-family: var(--font-display); font-weight: 900; font-size: 11cqh; line-height: 1.1; color: #ffd166; text-shadow: 0 0.8cqh 0 #221f36; }
.wr-tvcard__line { font-weight: 800; font-size: 4cqh; }
.wr-tvcard .tv-actions { margin-top: 1cqh; }

/* The microbus: the road above is the progress, the engine's heat the damage. */
.wr-bus__body { transform-box: fill-box; transform-origin: 50% 100%; animation: wrIdle 0.5s ease-in-out infinite alternate; }
@keyframes wrIdle { to { transform: translateY(2px); } }
.wr-tv[data-moment="ok"] .wr-bus__body { animation: wrJolt 0.55s var(--ease-out, ease); }
@keyframes wrJolt { 30% { transform: translateX(26px) rotate(-1.5deg); } 70% { transform: translateX(8px); } }
.wr-puff circle { fill: #bdbac8; stroke: #221f36; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: wrPuff 2.4s ease-out infinite; }
.wr-puff circle:nth-child(2) { animation-delay: 0.8s; } .wr-puff circle:nth-child(3) { animation-delay: 1.6s; }
@keyframes wrPuff { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 20% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-30px, -110px) scale(1.6); } }
.wr-tv.is-hot .wr-puff circle { fill: #5c596c; animation-duration: 1.1s; }
.wr-hz { fill: #ffb938; }
.wr-tv.is-alarm .wr-hz, .wr-tv.is-alarm-soon .wr-hz { animation: wrHz 0.3s steps(2) infinite; }
@keyframes wrHz { 50% { fill: #fff; } }
.wr-tv--bus .wr-flash { box-shadow: inset 0 0 0 3cqh #ffb938, inset 0 0 22cqh 4cqh rgba(229, 56, 59, 0.8); }
.wr-hud { position: absolute; top: 0; inset-inline: 0; z-index: 2; display: grid; grid-template-columns: auto 1fr auto auto; gap: 3cqw; align-items: center; padding: 2.4cqh 3cqw; background: rgba(21, 18, 31, 0.86); color: #fff; border-bottom: 0.8cqh solid #000; }
.wr-road { position: relative; height: 6.3cqh; background: #5b5566; border: 0.6cqh solid #000; border-radius: 1.5cqh; direction: ltr; }
.wr-road::before { content: ""; position: absolute; left: 1.5cqh; right: 1.5cqh; top: 2.4cqh; height: 0.8cqh; background: repeating-linear-gradient(90deg, #fff 0 3.3cqh, transparent 3.3cqh 6cqh); }
.wr-road__bus { position: absolute; top: -1.3cqh; left: calc(var(--p) * (100% - 11cqh)); width: 11cqh; transition: left 0.8s cubic-bezier(0.3, 1.4, 0.5, 1); }
.wr-road__goal { position: absolute; right: -1cqh; top: -4.4cqh; font-size: 2.2cqh; font-weight: 700; background: #1f8a4c; border: 0.4cqh solid #000; border-radius: 1cqh; padding: 0 1cqh; white-space: nowrap; }
.wr-gauge { width: 20cqh; text-align: center; font-size: 2cqh; font-weight: 700; line-height: 1.1; }
.wr-gauge svg { width: 20cqh; height: 11.3cqh; display: block; }
.wr-nd { transform-origin: 55px 56px; transform: rotate(calc(-90deg + var(--d) * 180deg)); transition: transform 0.6s cubic-bezier(0.3, 1.6, 0.5, 1); }
.wr-led { font-size: 5.6cqh; font-weight: 700; color: #ff5f57; background: #000; border-radius: 1.5cqh; padding: 0 2.2cqh; text-shadow: 0 0 1.5cqh rgba(255, 95, 87, 0.7); }
.wr-ticker { position: absolute; bottom: 3.3cqh; inset-inline: 3.6cqw; z-index: 2; display: flex; gap: 2.2cqw; align-items: center; background: #0c0a12; border: 0.8cqh solid #000; border-radius: 2.6cqh; padding: 1.8cqh 3cqh; color: #8f89a8; font-size: 3cqh; }
.wr-ticker b { font-family: var(--font-display); font-size: 5.2cqh; color: #ffb938; min-width: 0; }
.wr-tv[data-moment="ok"] .wr-ticker b { color: #7ee0a2; }
.wr-tv[data-moment="bad"] .wr-ticker b { color: #ff5f57; }

/* The kitchen: the scene beside the fridge of every phone's order. */
.wr-tv--kitchen { display: grid; grid-template-columns: minmax(0, 1fr) 27cqw; background: #fdf1e4; }
.wr-tv__scene { position: relative; min-width: 0; }
.wr-tv--kitchen .wr-flash { background: radial-gradient(circle, transparent 40%, rgba(229, 56, 59, 0.65)); }
.wr-tv--kitchen .wr-tv__lv { position: absolute; top: 3cqh; inset-inline-end: 3cqh; color: #b45309; }
.wr-kclock { position: absolute; top: 3.6cqh; left: 50%; translate: -50%; background: #221f36; color: #fff; border-radius: 99px; padding: 0.6cqh 2.6cqh; font-weight: 700; font-size: 2.6cqh; white-space: nowrap; }
.wr-kclock b { color: #ffd166; font-size: 3.4cqh; unicode-bidi: isolate; }
.wr-smokem { position: absolute; top: 3cqh; inset-inline-start: 3cqh; width: 8cqh; height: 36cqh; border: 0.55cqh solid #221f36; border-radius: 4cqh; background: #fff; overflow: hidden; }
.wr-smokem i { position: absolute; inset-inline: 0; bottom: 0; height: calc(var(--d) * 100%); background: linear-gradient(#5c596c, #8d8aa0); transition: height 0.6s; }
.wr-smokel { position: absolute; top: 40cqh; inset-inline-start: 1.5cqh; width: 11cqh; text-align: center; font-size: 2.2cqh; font-weight: 700; color: #221f36; }
.wr-plates { position: absolute; bottom: 3cqh; inset-inline: 3cqh; display: flex; align-items: center; gap: 1.3cqh; background: rgba(255, 255, 255, 0.94); border: 0.55cqh solid #221f36; border-radius: 3cqh; padding: 1.4cqh 2.2cqh; font-weight: 700; color: #221f36; font-size: 2.6cqh; }
.wr-plates__lbl { margin-inline-end: 0.6cqh; }
.wr-plate { width: 6.2cqh; height: 6.2cqh; border-radius: 50%; border: 0.55cqh dashed #b9a88f; flex: none; }
.wr-plate.is-on { border: 0.55cqh solid #221f36; background: radial-gradient(circle, #fff 0 40%, #6ab04c 41% 55%, #fff 56%); }
.wr-plate.is-pop, .wr-blb.is-pop { animation: wrPop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes wrPop { from { transform: scale(0); } }
.wr-flm { transform-box: fill-box; transform-origin: 50% 100%; animation: wrFlame 0.3s infinite alternate; }
@keyframes wrFlame { to { transform: scaleY(0.8) scaleX(1.1); } }
.wr-stm circle { fill: #fff; stroke: #221f36; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: wrPuff 2.8s ease-out infinite; opacity: 0; }
.wr-stm circle:nth-child(2) { animation-delay: 1.4s; }
.wr-tv.is-hot .wr-stm circle { fill: #5c596c; }
.wr-hand { transform-origin: 480px 92px; animation: wrSpin 6s linear infinite; }
@keyframes wrSpin { to { transform: rotate(360deg); } }
.wr-fridge { background: #e6f1fb; border-inline-start: 1.1cqh solid #221f36; padding: 3cqh 2.4cqh; display: flex; flex-direction: column; gap: 2cqh; min-height: 0; overflow: hidden; }
.wr-fridge h4 { margin: 0; font-family: var(--font-display); font-size: 3cqh; color: #221f36; }
.wr-fridge__notes { display: flex; flex-direction: column; gap: 1.8cqh; min-height: 0; }
.wr-note { position: relative; background: #fff6a8; border: 0.55cqh solid #221f36; border-radius: 0.8cqh 0.8cqh 2.2cqh 0.8cqh; padding: 1.2cqh 1.8cqh 2.2cqh; color: #221f36; font-weight: 700; font-size: 2.8cqh; line-height: 1.3; transform: rotate(-1deg); }
.wr-note--b { transform: rotate(1.5deg); background: #cdeefd; }
.wr-note small { display: block; font-size: 2cqh; color: #6b6480; }
.wr-note.is-idle { opacity: 0.55; }
.wr-note i { position: absolute; inset-inline: 1.4cqh; bottom: 0.8cqh; height: 0.9cqh; border-radius: 1cqh; background: #e5383b; transform-origin: right; }
.wr-tv[data-moment="ok"] .wr-kclock { animation: wrPopSm 0.5s; }
@keyframes wrPopSm { 40% { transform: scale(1.08); } }

/* The wedding: the stage, the lanterns coming on, the guests' faces falling. */
.wr-tv--wedding { background: #1b1236; }
.wr-tv--wedding .wr-flash { background: linear-gradient(rgba(229, 56, 59, 0.55), transparent 35%, transparent 65%, rgba(229, 56, 59, 0.55)); }
.wr-tv--wedding .wr-tv__lv { position: absolute; top: 4cqh; inset-inline-start: 4cqh; z-index: 2; color: #ffd166; }
.wr-blb { fill: #4b4270; stroke: #221f36; stroke-width: 3; transition: fill 0.3s; transform-box: fill-box; transform-origin: center; }
.wr-blb.is-on { fill: #ffd166; filter: drop-shadow(0 0 8px #ffd166); }
.wr-clockc { position: absolute; top: 2.6cqh; left: 50%; translate: -50%; z-index: 2; width: 17cqh; height: 17cqh; border-radius: 50%; background: conic-gradient(#ff5f57 calc(var(--c, 1) * 360deg), #3a2f63 0); border: 0.75cqh solid #000; display: grid; place-items: center; }
.wr-clockc b { width: 13cqh; height: 13cqh; border-radius: 50%; background: #1b1236; color: #fff; display: grid; place-items: center; font-size: 3.8cqh; }
.wr-legend { position: absolute; top: 4cqh; inset-inline-end: 4cqh; z-index: 2; max-width: 30cqw; color: #fff; font-weight: 700; font-size: 2.4cqh; text-align: end; }
.wr-crowd { position: absolute; bottom: 0; inset-inline: 0; z-index: 2; display: flex; justify-content: center; gap: 2.6cqh; padding: 1.8cqh 0 2.2cqh; background: linear-gradient(transparent, rgba(0, 0, 0, 0.55)); }
.wr-gst { width: 17cqh; height: 17.8cqh; position: relative; }
.wr-gst svg { width: 100%; height: 100%; }
.wr-gst .wr-sad { display: none; }
.wr-gst.is-on .wr-sad { display: inline; }
.wr-gst.is-on .wr-hap { display: none; }
.wr-gst.is-on.is-pop { animation: wrBuzz 0.5s; }
.wr-gbub { position: absolute; bottom: 24cqh; left: 30%; translate: -50%; z-index: 2; max-width: 52cqw; background: #fff; color: #221f36; border: 0.75cqh solid #221f36; border-radius: 3.7cqh; padding: 1.5cqh 3.3cqh; font-family: var(--font-display); font-weight: 900; font-size: 4.8cqh; text-align: center; }
.wr-gbub::after { content: ""; position: absolute; bottom: -3cqh; left: 50%; margin-left: -2cqh; border: 2.2cqh solid transparent; border-top-color: #221f36; border-bottom: 0; }
.wr-tv[data-moment="ok"] .wr-gbub { background: #b8f0cb; }
.wr-tv[data-moment="bad"] .wr-gbub { background: #ffc2bd; }
.wr-dance { transform-box: fill-box; transform-origin: 50% 100%; }
.wr-tv[data-moment="ok"] .wr-dance, .wr-tv[data-moment="shake"] .wr-dance { animation: wrDance 0.35s 4 alternate; }
@keyframes wrDance { to { transform: rotate(6deg) translateY(-6px); } }
.wr-tv[data-moment="shake"] .wr-scn { animation: wrBuzz 0.3s 4; }
.wr-cone { transform-box: fill-box; transform-origin: center; animation: wrThump 0.5s ease-in-out infinite alternate; }
@keyframes wrThump { to { transform: scale(1.12); } }

@media (prefers-reduced-motion: reduce) {
  .wr, .wr *, .wr-tv, .wr-tv * { animation: none !important; transition: none !important; }
}

/* =========================================================================
   59. المزاد (THE AUCTION in rooms, JS_RoomBox.html, 29 Sep 2026)
   Look أ «استوديو الصندوق»: a TV game-show studio - a violet LED wall, a
   sign in bulbs, two swinging spotlights, podiums with little LED screens, a
   red lacquer box with a gold bow on a lit turntable. The scene is an SVG
   with a canvas over it for the particles, in a 16:9 stage (a phone's close
   crop during the opening); its words are HTML over it, sized in cqw. The
   phone is the studio's violet with gold numbers, one step at a time. The
   scene and the phone keep their own colours in both themes (like a board).
   ========================================================================= */
:root {
  --bx-ink: #2a1600;
  --bx-gold: #ffd35a;
  --bx-gold-2: #f59e0b;
  --bx-pink: #ff5ec4;
  --bx-violet: #5e1bb0;
  --bx-night: #23074a;
  --bx-deep: #0b0219;
  --bx-line: rgba(255, 255, 255, 0.2);
  --bx-chip: rgba(255, 255, 255, 0.08);
}
.bx { display: flex; flex-direction: column; gap: var(--sp-3); }

/* The stage: the scene, the canvas, the words over it */
.bx-stage {
  position: relative; width: 100%; aspect-ratio: var(--bx-ar, 16 / 9); overflow: hidden;
  border-radius: var(--r-xl); background: #08020f; container-type: inline-size;
  box-shadow: 0 0 0 2px rgba(255, 211, 90, 0.35), 0 18px 40px -22px rgba(30, 0, 60, 0.9);
  isolation: isolate;
}
.bx-cam { position: absolute; inset: 0; will-change: transform; }
.bx-svg, .bx-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bx-cv { pointer-events: none; }
.bx-svgtxt { font-family: var(--font-display); }
.bx-sign { font-family: "Baloo Bhaijaan 2", var(--font-display); }
.bx-flash { position: absolute; inset: 0; background: #fffbe6; opacity: 0; pointer-events: none; }
.bx-vign { position: absolute; inset: 0; pointer-events: none; opacity: 0.35; background: radial-gradient(ellipse at 50% 55%, transparent 42%, rgba(0, 0, 0, 0.8)); }
.bx-tag {
  position: absolute; top: 2.8%; inset-inline-end: 2%; padding: 0.35em 1em; border-radius: var(--r-full);
  background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff;
  font-weight: 700; font-size: 1.6cqw; white-space: nowrap;
}
.bx-ban {
  position: absolute; left: 50%; top: 22%; transform: translateX(-50%); max-width: 92%;
  padding: 0.25em 1.1em; border-radius: var(--r-full); text-align: center; text-wrap: balance;
  font-family: var(--font-display); font-weight: 900; font-size: 2.4cqw; line-height: 1.35; color: #ffe9a8;
  background: linear-gradient(#34106a, #12042a); border: 0.25cqw solid var(--bx-gold);
  box-shadow: 0 0 2.6cqw rgba(255, 94, 196, 0.65);
}
.bx-ban:empty { display: none; }
.bx-ban.is-in { animation: bx-ban-in 0.5s cubic-bezier(0.2, 1.5, 0.4, 1); }
@keyframes bx-ban-in { from { transform: translateX(-50%) scale(0.5); opacity: 0; } }
.bx-big {
  position: absolute; left: 0; right: 0; top: 27%; text-align: center; pointer-events: none; opacity: 0; white-space: nowrap;
  font-family: "Baloo Bhaijaan 2", var(--font-display); font-weight: 800; font-size: 10cqw; line-height: 1.1;
  color: var(--bx-gold); text-shadow: 0 0 2.6cqw var(--bx-pink), 0 0.55cqw 0 #8a5a06;
}
.bx-big.is-pop { animation: bx-big-pop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }
.bx-big.is-hold { font-size: 8.5cqw; animation: bx-big-hold 2.6s cubic-bezier(0.2, 1.3, 0.4, 1) forwards; }
.bx-big.is-held { font-size: 8.5cqw; opacity: 1; }
@keyframes bx-big-pop { 0% { transform: scale(0.3); opacity: 0; } 40% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
@keyframes bx-big-hold { 0% { transform: scale(0.2) rotate(-8deg); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 25% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
/* A phone's close crop: the same words, a bigger share of the frame */
.bx-stage--crop .bx-tag { font-size: 3cqw; }
.bx-stage--crop .bx-ban { font-size: 4.2cqw; top: 20%; border-width: 0.45cqw; }
.bx-stage--crop .bx-big { font-size: 17cqw; top: 26%; }
.bx-stage--crop .bx-big.is-hold, .bx-stage--crop .bx-big.is-held { font-size: 14cqw; }

/* The studio's own life */
.bx-bulbs .bl:nth-child(2n) { animation: bx-blink 0.8s steps(2) infinite; }
@keyframes bx-blink { 50% { opacity: 0.25; } }
.bx-cone { transform-box: fill-box; }
.bx-c1 { transform-origin: 5.5% 0%; animation: bx-swing-a 3.6s ease-in-out infinite alternate; }
.bx-c2 { transform-origin: 94.5% 0%; animation: bx-swing-b 4.2s ease-in-out infinite alternate; }
@keyframes bx-swing-a { from { transform: rotate(-9deg); } to { transform: rotate(7deg); } }
@keyframes bx-swing-b { from { transform: rotate(8deg); } to { transform: rotate(-7deg); } }
.bx-twk { transform-box: fill-box; transform-origin: center; animation: bx-twk 1.8s ease-in-out infinite; }
.bx-twk:nth-of-type(2n) { animation-delay: -0.9s; }
@keyframes bx-twk { 0%, 100% { transform: scale(0.2); opacity: 0; } 50% { transform: scale(1); opacity: 1; } }
.bx-rock { transform-box: fill-box; transform-origin: 50% 100%; animation: bx-rock 3.4s ease-in-out infinite; }
.bx-rock.is-show { animation: none; }
@keyframes bx-rock { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg) translateY(-2px); } }
.bx-coinspin, .bx-moth { transform-box: fill-box; transform-origin: center; }
.bx-pod.is-gone { opacity: 0.35; }
.bx-pod--me .bx-pod__name { fill: var(--bx-gold); }

/* The TV */
.bx-tv { height: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; container-type: size; }
.bx-stage--tv { flex: none; width: min(100cqw, calc((100cqh - 9vmin) * 1.7778)); border-radius: 1.6vmin; }
.bx-tv__bar { display: flex; align-items: center; justify-content: center; gap: 2vmin; flex-wrap: wrap; }
.bx-tv .bx-opened { gap: 0.8vmin; }
.bx-tv .bx-ob { width: 5vmin; height: 5vmin; font-size: 2.6vmin; border-radius: 1vmin; }
.bx-tvinfo {
  position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); display: flex; align-items: center; gap: 1.4cqw;
  padding: 0.6cqw 1.8cqw; border-radius: var(--r-full);
  background: rgba(10, 2, 24, 0.72); border: 0.15cqw solid rgba(255, 211, 90, 0.55); color: #ffffff;
  font-size: 1.5cqw; font-weight: 700; text-align: start; max-width: 38%;
}
.bx-tvinfo__clock { font-family: "Baloo Bhaijaan 2", var(--font-display); font-size: 3.4cqw; color: var(--bx-gold); line-height: 1; min-width: 3.2em; text-align: center; }
.bx-tvinfo.is-last .bx-tvinfo__clock, .bx-tvinfo__clock.is-low { color: #ff8fb3; animation: bx-throb 0.9s ease-in-out infinite; }
@keyframes bx-throb { 50% { transform: scale(1.1); } }
.bx-tv--over { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 3vmin; align-items: center; }
.bx-over--tv .bx-over__title { font-size: 5vmin; }

/* The opened boxes, a strip of eight */
.bx-opened { display: flex; justify-content: center; gap: 0.35rem; flex-wrap: wrap; }
.bx-ob {
  width: 2.1rem; height: 2.1rem; border-radius: 0.55rem; display: grid; place-items: center; font-size: 1.05rem;
  background: linear-gradient(#ff5a6e, #a00b24); color: #ffe9a8; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25);
  border: 1.5px solid rgba(255, 211, 90, 0.6);
}
.bx-ob b { font-size: 0.85rem; }
.bx-ob.is-open { background: linear-gradient(#34106a, #12042a); }
.bx-ob.is-cur { box-shadow: 0 0 0 2px var(--bx-gold), 0 0 12px rgba(255, 211, 90, 0.7); }

/* The phone: one step at a time */
.bx-phone {
  position: relative; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-3);
  border-radius: var(--r-xl); color: #ffffff; overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, var(--bx-violet), var(--bx-night) 55%, var(--bx-deep));
  box-shadow: 0 0 0 1px rgba(255, 211, 90, 0.25), var(--sh-2);
}
.bx-phone::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% -12%, rgba(255, 255, 255, 0.2), transparent 50%), radial-gradient(circle, rgba(255, 94, 196, 0.25) 1.6px, transparent 2.2px) 0 0 / 16px 16px;
  -webkit-mask-image: linear-gradient(#000 0, transparent 40%); mask-image: linear-gradient(#000 0, transparent 40%);
}
.bx-phone > * { position: relative; }
.bx-phone .waiting-note { color: rgba(255, 255, 255, 0.85); }
.bx-ptop { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); }
.bx-ptop__n { opacity: 0.85; font-weight: 700; }
.bx-pmon { padding: 0.25rem 0.8rem; border-radius: var(--r-full); background: var(--bx-chip); border: 1px solid var(--bx-line); font-weight: 700; }
.bx-pmon__k { opacity: 0.75; font-weight: 600; }
.bx-pmon b { color: var(--bx-gold); font-size: var(--fs-body); }
.bx-dots { display: flex; gap: 0.4rem; justify-content: center; }
.bx-dots i { width: 1.5rem; height: 0.3rem; border-radius: 0.2rem; background: var(--bx-line); transition: background var(--dur-2); }
.bx-dots i.is-on { background: var(--bx-gold); }
.bx-step { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); text-align: center; animation: bx-step-in 0.35s var(--ease-out) both; }
@keyframes bx-step-in { from { opacity: 0; transform: translateX(-1.5rem); } }
[dir="ltr"] .bx-step { animation-name: bx-step-in-ltr; }
@keyframes bx-step-in-ltr { from { opacity: 0; transform: translateX(1.5rem); } }
.bx-k { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h2); line-height: 1.3; text-wrap: balance; }
.bx-note { margin: 0; font-size: var(--fs-sm); opacity: 0.82; text-wrap: balance; }
.bx-note--zero { color: #ffc6e4; opacity: 1; }

/* The clue: a glossy pink card, held to read */
.hold-card.bx-clue { width: min(100%, 17.5rem); min-height: 18rem; margin-inline: auto; border-radius: 1.75rem; }
.bx-clue .hold-card__front {
  border: 0; border-radius: 1.75rem; color: #ffffff; gap: 0.4rem;
  background: radial-gradient(circle at 30% 20%, #ff7ad0, #b0137a 48%, #3d0a4f);
  box-shadow: 0 0 0 4px var(--bx-gold), 0 0 36px rgba(255, 94, 196, 0.55);
}
.bx-clue .hold-card__front b { font-family: var(--font-display); font-size: var(--fs-h2); }
.bx-clue .hold-card__front small { font-size: var(--fs-sm); opacity: 0.88; }
.bx-clue__art { width: 7rem; height: 7rem; }
.bx-clue__art text { font-family: var(--font-display); }
.bx-clue .hold-card__back {
  align-items: center; text-align: center; padding: var(--sp-5) var(--sp-4); border-radius: 1.75rem; color: #3a1400;
  background: linear-gradient(160deg, #fff7d6, #ffd35a);
  box-shadow: 0 0 0 4px var(--bx-gold), 0 0 36px rgba(255, 94, 196, 0.55);
}
.bx-clue .hold-card__back small { font-size: var(--fs-sm); font-weight: 700; opacity: 0.8; }
.bx-clue .hold-card__back p { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 1.65rem; line-height: 1.45; text-wrap: balance; }
.bx-clue .hold-card__back em { font-style: normal; font-size: var(--fs-xs, 0.78rem); font-weight: 700; padding: 0.2rem 0.75rem; border-radius: var(--r-full); background: rgba(31, 191, 115, 0.2); color: #0d6b3d; }
.bx-clue:focus-visible { outline: 3px solid var(--bx-gold); outline-offset: 4px; }

.bx-talk { display: flex; gap: 0.6rem; align-items: center; justify-content: center; font-size: var(--fs-sm); font-weight: 700; }
.bx-talk__t { color: var(--bx-gold); font-size: var(--fs-h3); }
.bx-talk__t.is-low, .bx-talk.is-last .bx-talk__t { color: #ff8fb3; }
.bx-tbar { display: block; width: min(100%, 14rem); height: 0.35rem; border-radius: 0.2rem; background: var(--bx-line); overflow: hidden; margin-top: calc(var(--sp-2) * -1); }
.bx-tbar > i { display: block; height: 100%; background: var(--bx-gold); transform-origin: right; transition: transform 0.25s linear; }
[dir="ltr"] .bx-tbar > i { transform-origin: left; }
.bx-talk.is-last + .bx-tbar > i { background: #ff8fb3; }

.bx-peek {
  display: flex; flex-direction: column; gap: 0.2rem; width: min(100%, 20rem); padding: 0.6rem 0.9rem; border-radius: var(--r-lg);
  background: linear-gradient(135deg, rgba(255, 211, 90, 0.22), rgba(255, 94, 196, 0.18)); border: 1.5px solid var(--bx-gold);
  font-size: var(--fs-sm); text-align: center;
}
.bx-peek b { color: var(--bx-gold); font-family: var(--font-display); }

/* The bid: one big number */
.bx-bidrow { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-top: var(--sp-2); }
.bx-rb {
  width: 4rem; height: 4rem; border-radius: 50%; border: 2px solid var(--bx-line); background: var(--bx-chip);
  color: #ffffff; font-size: 2.2rem; font-weight: 700; line-height: 1; display: grid; place-items: center; cursor: pointer;
}
.bx-rb:disabled { opacity: 0.35; cursor: default; }
.bx-rb:not(:disabled):active, .bx-qchips button:active, .bx-go:active { transform: scale(0.96); }
.bx-bn { display: flex; flex-direction: column; align-items: center; min-width: 8.5rem; }
.bx-bv {
  font-family: "Baloo Bhaijaan 2", var(--font-display); font-weight: 800; font-size: 4.4rem; line-height: 1.05;
  color: var(--bx-gold); text-shadow: 0 0 22px rgba(255, 211, 90, 0.7), 0 4px 0 #8a5a06;
}
.bx-bv.is-bump { animation: bx-bump 0.22s; }
@keyframes bx-bump { 50% { transform: scale(1.12); } }
.bx-bn span { font-size: var(--fs-sm); opacity: 0.8; }
.bx-qchips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; width: 100%; }
.bx-qchips button {
  min-height: var(--tap, 44px); border-radius: 0.95rem; border: 1px solid var(--bx-line); background: var(--bx-chip);
  color: #ffffff; font: inherit; font-weight: 700; font-size: var(--fs-sm); cursor: pointer; padding: 0 0.25rem;
}
.bx-go {
  width: 100%; min-height: 3.6rem; border: 0; border-radius: 1.35rem; cursor: pointer;
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h3); color: var(--bx-ink);
  background: linear-gradient(#ffe07a, var(--bx-gold-2));
  box-shadow: 0 0 0 3px rgba(255, 211, 90, 0.25), 0 10px 26px rgba(245, 158, 11, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.6);
}
.bx-go:focus-visible, .bx-rb:focus-visible, .bx-qchips button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
.bx-ghost { background: none; border: 0; color: inherit; opacity: 0.8; font: inherit; font-size: var(--fs-sm); cursor: pointer; min-height: var(--tap, 44px); }

/* Waiting */
.bx-coin3 {
  margin-top: var(--sp-3); width: 6.5rem; height: 6.5rem; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 900; font-size: 2.2rem; color: #7a5205;
  background: radial-gradient(circle at 35% 30%, #fff6c8, #f6c343 45%, #c08a12 85%, #7a5205);
  box-shadow: inset 0 0 0 6px rgba(122, 82, 5, 0.35), 0 0 40px rgba(255, 211, 90, 0.45);
  animation: bx-spin-y 1.8s linear infinite;
}
@keyframes bx-spin-y { to { transform: rotateY(360deg); } }
.bx-avs { display: flex; flex-wrap: wrap; gap: 0.45rem; justify-content: center; }
.bx-av {
  position: relative; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--bx-chip); border: 2px solid var(--bx-line); font-weight: 700; font-size: 0.85rem;
  transition: background var(--dur-2), border-color var(--dur-2), color var(--dur-2);
}
.bx-av.is-ok { background: var(--bx-gold); border-color: var(--bx-gold); color: var(--bx-ink); }
.bx-av.is-ok::after {
  content: "✓"; position: absolute; bottom: -0.3rem; inset-inline-start: -0.3rem; width: 1.15rem; height: 1.15rem; border-radius: 50%;
  background: #1fbf73; color: #ffffff; font-size: 0.7rem; display: grid; place-items: center;
}

/* The opening on a phone: the bids, then what it did to you */
.bx-after { transition: opacity var(--dur-3, 0.4s) var(--ease-out), transform var(--dur-3, 0.4s) var(--ease-out); }
.bx-after:not(.is-on) { visibility: hidden; opacity: 0; transform: translateY(0.4rem); }
.bx-bids { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
.bx-bidchip {
  display: inline-flex; gap: 0.35rem; align-items: center; padding: 0.3rem 0.75rem; border-radius: var(--r-full);
  background: linear-gradient(#34106a, #12042a); color: #ffffff; font-size: var(--fs-sm); border: 1px solid rgba(255, 211, 90, 0.35);
}
.bx-bidchip b { color: var(--bx-gold); }
.bx-bidchip.is-win { border-color: var(--bx-gold); box-shadow: 0 0 12px rgba(255, 94, 196, 0.7); }
.bx-mine { display: flex; justify-content: center; }
.bx-mine span {
  font-family: "Baloo Bhaijaan 2", var(--font-display); font-weight: 800; font-size: 2.2rem; padding: 0.1rem 1.2rem;
  border-radius: var(--r-full); background: var(--surface-2);
}
.bx-mine.is-up span { color: #0f8a4f; }
.bx-mine.is-down span { color: #c0263d; }
body.dark .bx-mine.is-up span { color: #7dffb0; }
body.dark .bx-mine.is-down span { color: #ff9a9a; }
.bx-host { display: flex; gap: var(--sp-2); justify-content: center; flex-wrap: wrap; }
.bx-soon { text-align: center; font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); margin-top: var(--sp-1); }
.bx-soon b { color: var(--text); }
.bx-tv .bx-soon { font-size: 2vmin; }
.bx-stage--crop .bx-pods { display: none; }

/* The end */
.bx-over { display: flex; flex-direction: column; gap: var(--sp-3); }
.bx-over__title { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h1); text-align: center; color: var(--text); }
.bx-phone .bx-over__title { color: var(--bx-gold); }
/* The podium and the board's heading sit on the studio's dark panel: light ink. */
.bx-phone .bx-over .podium__name { color: #fff; }
.bx-phone .bx-over .podium__score { color: var(--bx-gold); }
.bx-phone .bx-over .scoreboard .section__title { color: #efe6ff; }
.bx-phone .bx-over .scoreboard .section__rule { background: rgba(255, 255, 255, 0.2); }

/* A phone on its side and bigger screens: the stage beside the steps */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  .bx--talk .bx-phone, .bx--bid .bx-phone { padding: var(--sp-3) var(--sp-4); }
  .bx-step--clue { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); grid-template-areas: "k k" "card talk" "card bar" "card peek" "card note" "card go"; column-gap: var(--sp-4); row-gap: var(--sp-2); align-items: center; text-align: center; }
  .bx-step--clue > .bx-k { grid-area: k; }
  .bx-step--clue > .bx-clue { grid-area: card; }
  .bx-step--clue > .bx-talk { grid-area: talk; }
  .bx-step--clue > .bx-tbar { grid-area: bar; justify-self: center; margin-top: 0; }
  .bx-step--clue > .bx-peek { grid-area: peek; justify-self: center; }
  .bx-step--clue > .bx-note { grid-area: note; }
  .bx-step--clue > .bx-go { grid-area: go; }
  .bx--open .bx-phone { flex-direction: row; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
  .bx--open .bx-stage--crop { width: min(62%, calc((var(--app-h, 100vh) - 9rem) * 1.15)); }
  .bx--open .bx-bids { flex: 1 1 12rem; align-self: center; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .hold-card.bx-clue { min-height: 13rem; }
  .bx-clue .hold-card__back p { font-size: 1.3rem; }
  .bx-bv { font-size: 3.2rem; }
  .bx-rb { width: 3.2rem; height: 3.2rem; font-size: 1.8rem; }
  .bx-step--bid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: var(--sp-4); row-gap: var(--sp-2); align-items: center; }
  .bx-step--bid > .bx-k { grid-column: 1 / -1; }
  .bx-step--bid > .bx-bidrow { grid-row: 2 / span 3; margin: 0; }
  .bx-step--bid > .bx-go, .bx-step--bid > .bx-ghost { grid-column: 1 / -1; }
}
@media (min-width: 900px) {
  .bx--open .bx-stage--crop { width: min(62%, 30rem); }
}

@media (prefers-reduced-motion: reduce) {
  .bx-bulbs .bl, .bx-cone, .bx-twk, .bx-rock, .bx-coin3, .bx-step, .bx-ban.is-in, .bx-bv.is-bump,
  .bx-tvinfo.is-last .bx-tvinfo__clock, .bx-tvinfo__clock.is-low { animation: none; }
  .bx-after, .bx-tbar > i, .bx-dots i, .bx-av { transition: none; }
}

/* =========================================================================
   57. الأوضة المضلمة (THE DARK ROOM in rooms, JS_RoomDark.html, 29 Sep 2026)
   Look ج «العدسة والصدى»: a night stage in both themes (it is the dark the
   game is about). The mover's phone is a black screen with echo arcs and the
   arrows or a joystick; a guide's phone the plan under a lens; the TV the
   house (or the tomb) in 3D or 2D with a pill bar over it. Every size the
   owner checks: an upright phone, a phone on its side, a laptop, the TV.
   ========================================================================= */
:root {
  --dk-night: #0d0b16;
  --dk-night-2: #16131f;
  --dk-line: #2e2742;
  --dk-ink: #efeaf8;
  --dk-ink-2: #a79fbd;
  --dk-echo: #7cd3ff;
  --dk-amber: #ffc450;
  --dk-heart: #ff4d6d;
  --dk-heart-off: #3e3952;
}
.dk {
  display: flex; flex-direction: column; gap: var(--sp-3);
  background: var(--dk-night); color: var(--dk-ink);
  border-radius: var(--r-xl, 1.5rem); padding: var(--sp-3);
  min-height: calc(var(--app-h, 100dvh) - var(--header-h, 3.5rem) - 7.5rem);
  box-shadow: var(--sh-2, 0 8px 24px rgba(0, 0, 0, 0.25));
}
.dk .waiting-note { color: var(--dk-ink-2); background: var(--dk-night-2); }
.dk .room-player-strip, .dk .host-row { color: var(--dk-ink); }
.dk-head { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; justify-content: space-between; }
.dk-lvl { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h3); }
.dk-walker { font-weight: 700; color: var(--dk-ink-2); font-size: var(--fs-sm); }
.dk-hearts { display: inline-flex; gap: 0.3rem; color: var(--dk-heart); }
.dk-hearts svg { width: 1.35rem; height: 1.2rem; display: block; overflow: visible; }
.dk-hearts svg.is-off { color: var(--dk-heart-off); }
.dk-small { margin: 0; text-align: center; font-size: var(--fs-sm); color: var(--dk-ink-2); text-wrap: balance; }

/* The mover: black, the echo, the arrows */
.dk--mover { background: #000; }
.dk-mover { display: flex; flex-direction: column; gap: var(--sp-3); flex: 1; min-height: 0; }
.dk-who { text-align: center; }
.dk-who b { display: block; font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h2); color: #ffffff; }
.dk-who span { font-size: var(--fs-sm); color: var(--dk-ink-2); }
.dk-sonar { position: relative; flex: 1; min-height: 11rem; border-radius: var(--r-lg); overflow: hidden; background: #000; }
.dk-sonar canvas, .dk-map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.dk-fb {
  position: absolute; inset-inline: 0; bottom: 12%; text-align: center; padding: 0 1rem;
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h2); color: #ffffff;
  text-shadow: 0 0 1rem rgba(0, 0, 0, 0.9); opacity: 0; transform: translateY(0.4rem); transition: opacity 0.2s, transform 0.2s; pointer-events: none;
}
.dk-fb.is-on { opacity: 1; transform: none; }
.dk-intro {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-display); font-weight: 900; font-size: 2rem; color: #ffffff;
  text-shadow: 0 0 1.2rem rgba(0, 0, 0, 0.95); opacity: 0; transition: opacity 0.25s;
}
.dk-intro.is-on { opacity: 1; }
.dk-ctrl { display: grid; place-items: center; gap: var(--sp-1); padding-bottom: var(--sp-1); }
.dk-pad { display: grid; grid-template-columns: repeat(3, 4.25rem); grid-template-rows: repeat(3, 4.25rem); gap: 0.45rem; }
.dk-pad button {
  border: 2px solid #3a3450; background: rgba(22, 19, 31, 0.92); color: #ffffff; border-radius: 1.1rem;
  font-size: 1.5rem; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; padding: 0;
  -webkit-user-select: none; user-select: none;
}
.dk-pad button:active { background: #6c3ce0; border-color: #a98bff; transform: scale(0.96); }
.dk-pad button:focus-visible { outline: 3px solid var(--dk-echo); outline-offset: 2px; }
.dk-pad__u { grid-area: 1 / 2; } .dk-pad__l { grid-area: 2 / 1; } .dk-pad__r { grid-area: 2 / 3; } .dk-pad__d { grid-area: 3 / 2; }
.dk-pad__c { grid-area: 2 / 2; border-radius: 50%; border: 2px dashed #2a2538; }
.dk-stick {
  width: 11rem; height: 11rem; border-radius: 50%; position: relative; touch-action: none; cursor: grab;
  background: radial-gradient(circle, rgba(108, 60, 224, 0.18), rgba(20, 16, 30, 0.9) 70%); border: 3px solid #3a3450;
}
.dk-stick i {
  position: absolute; left: 50%; top: 50%; width: 4.5rem; height: 4.5rem; margin: -2.25rem; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #b9a2ff, #6c3ce0 60%, #3d1f94); box-shadow: 0 0 1.2rem rgba(140, 100, 255, 0.55);
  pointer-events: none;
}
.dk-tvnote { margin: 0; text-align: center; font-size: var(--fs-sm); font-weight: 700; color: var(--dk-amber); }

/* A guide: the plan under the lens */
.dk-guide { display: flex; flex-direction: column; gap: var(--sp-2); min-height: 0; }
.dk-gtitle { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h3); text-align: center; }
.dk-map {
  position: relative; width: 100%; aspect-ratio: 16 / 11; max-height: calc(var(--app-h, 100dvh) - 20rem);
  min-height: 12rem; border-radius: var(--r-lg); overflow: hidden; background: #000; touch-action: none; cursor: crosshair;
}
.dk-toast, .dk-banner {
  position: absolute; inset-inline: 8%; bottom: 7%; z-index: 2; text-align: center; border-radius: var(--r-md);
  padding: 0.45rem 0.8rem; font-family: var(--font-display); font-weight: 900; font-size: var(--fs-body);
  background: #ffd54a; color: #241a00; opacity: 0; transform: translateY(0.6rem); transition: opacity 0.25s, transform 0.25s; pointer-events: none;
}
.dk-banner { top: 7%; bottom: auto; transform: translateY(-0.6rem); }
.dk-toast.is-on, .dk-banner.is-on { opacity: 1; transform: none; }
.dk-banner--bad { background: #ff4d6d; color: #ffffff; }
.dk-banner--good { background: #8ef0a0; color: #06260f; }
.dk-banner--info { background: #7cd3ff; color: #03202e; }
.dk-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
.dk-chip {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.7rem; border-radius: var(--r-full);
  border: 2px solid color-mix(in srgb, var(--dk-c) 60%, transparent); background: var(--dk-night-2); color: var(--dk-ink); font-size: var(--fs-sm); font-weight: 700;
}
.dk-chip i { width: 0.75rem; height: 0.75rem; border-radius: 50%; border: 2px dashed var(--dk-c); }
.dk-chip.is-me { background: color-mix(in srgb, var(--dk-c) 22%, var(--dk-night-2)); }
.dk-chip.is-me i { border-style: solid; background: var(--dk-c); }
.dk-chip small { color: var(--dk-ink-2); font-weight: 600; }

/* The end */
.dk--over { justify-content: center; }
.dk-over { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); text-align: center; padding: var(--sp-4) var(--sp-2); }
.dk-over__icon { font-size: 3.5rem; line-height: 1; }
.dk-over h3 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: var(--fs-h1); }
.dk-over__n { margin: 0; font-size: var(--fs-h3); color: var(--dk-ink-2); }
.dk-over__n b { font-size: 3rem; color: var(--dk-amber); display: block; line-height: 1.1; }
.dk-over__best { margin: 0; font-weight: 700; color: var(--dk-ink-2); }
.dk-over .btn-stack { width: min(100%, 22rem); }

/* The lobby */
.dk-lobby .field__hint { text-align: center; }

/* A phone on its side, a laptop: the canvas beside what goes with it */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .dk { min-height: calc(var(--app-h, 100dvh) - var(--header-h, 3.5rem) - 2.5rem); }
  .dk-mover { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr) auto; column-gap: var(--sp-4); }
  .dk-who { grid-column: 1 / -1; }
  .dk-sonar { grid-column: 1; grid-row: 2 / 4; }
  .dk-ctrl { grid-column: 2; grid-row: 2; align-self: center; }
  .dk-tvnote { grid-column: 2; grid-row: 3; }
  .dk-guide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(10rem, 16rem); grid-template-rows: auto auto 1fr; column-gap: var(--sp-3); flex: 1; }
  .dk-gtitle { grid-column: 2; grid-row: 1; text-align: start; }
  .dk-map { grid-column: 1; grid-row: 1 / 4; max-height: none; aspect-ratio: auto; height: 100%; min-height: 12rem; }
  .dk-guide .dk-chips { grid-column: 2; grid-row: 2; justify-content: flex-start; }
  .dk-guide .dk-small { grid-column: 2; grid-row: 3; text-align: start; align-self: start; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .dk { padding: var(--sp-2); gap: var(--sp-2); }
  .dk-who b { font-size: var(--fs-h3); }
  .dk-pad { grid-template-columns: repeat(3, 3.3rem); grid-template-rows: repeat(3, 3.3rem); }
  .dk-stick { width: 8.5rem; height: 8.5rem; }
  .dk-stick i { width: 3.6rem; height: 3.6rem; margin: -1.8rem; }
  .dk-mover .dk-who span { display: none; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .dk-pad { grid-template-columns: repeat(3, 5rem); grid-template-rows: repeat(3, 5rem); }
}

/* The TV */
.tv-stage > .dk-tv { flex: 1 1 auto; min-height: 0; padding: 0; border-radius: 1.4vmin; overflow: hidden; }
.dk-tv__stage { position: relative; flex: 1; min-height: 0; height: 100%; background: #06050b; }
.dk-tv__canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.dk-tv__top, .dk-tv__foot {
  position: absolute; inset-inline: 1.6vmin; z-index: 2; display: flex; align-items: center; gap: 1.2vmin; flex-wrap: wrap; pointer-events: none;
}
.dk-tv__top { top: 1.6vmin; justify-content: space-between; }
.dk-tv__foot { bottom: 1.6vmin; }
.dk-tv__foot > * { pointer-events: auto; }
.dk-pill {
  display: inline-flex; align-items: center; gap: 1vmin; padding: 0.6vmin 1.8vmin; border-radius: var(--r-full);
  background: rgba(10, 8, 20, 0.74); border: 1px solid rgba(255, 255, 255, 0.14); color: #ffffff; font-size: 2.2vmin; font-weight: 700;
}
