<script>
/* ============================================================================
   القنبلة — PASS THE BOMB
   ----------------------------------------------------------------------------
   One phone, passed round the table. A category is on the screen and a fuse
   nobody can see is burning: say something in the category, pass the phone,
   and whoever is holding it when it goes off loses the round. The ticking
   gets faster as the fuse runs down, which is the only warning anyone gets.

   The fuse is a deadline (appState.bomb.endsAt), so a reload mid-round comes
   back with the time it really had left.
   ========================================================================= */

/* The categories and letters (BOMB_PROMPTS, BOMB_LETTERS) live in BombPrompts.js, shared with the rooms server. */


/* How long the fuse burns, in seconds, [shortest, longest]. Nobody sees it. */
const BOMB_FUSES = { short: [15, 30], normal: [25, 55], long: [40, 80] };

let bombTickTimer = null;
let bombClock = null;

function bombState() {
  if (!appState.bomb) appState.bomb = { fuse: 'normal', mode: 'category', prompt: '', endsAt: 0, total: 0, phase: 'idle', rounds: 0 };
  return appState.bomb;
}

function setupBomb() {
  const b = bombState();
  bombStop();
  b.phase = 'idle';
  setView('setup-bomb');
  paintBombSetup();
}

function paintBombSetup() {
  const b = bombState();
  document.querySelectorAll('#bomb-mode .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === b.mode));
  document.querySelectorAll('#bomb-fuse .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === b.fuse));
}

function setBombOption(key, value) {
  bombState()[key] = value;
  saveToLocal();
  paintBombSetup();
}

/** Pulls a category or a letter this phone hasn't dealt lately. */
function bombNextPrompt() {
  const b = bombState();
  const lang = contentLang();
  const wantLetter = b.mode === 'letter' || (b.mode === 'mix' && Math.random() < 0.35);
  if (wantLetter) {
    const letter = freshPick('bomb:letters:' + lang, BOMB_LETTERS[lang], 1)[0];
    return { kind: 'letter', text: letter };
  }
  const pool = BOMB_PROMPTS[lang] || BOMB_PROMPTS.ar;
  return { kind: 'category', text: freshPick('bomb:' + lang, pool, 1)[0] };
}

function startBombRound() {
  const b = bombState();
  const range = BOMB_FUSES[b.fuse] || BOMB_FUSES.normal;
  const seconds = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
  const prompt = bombNextPrompt();
  b.prompt = prompt.text;
  b.kind = prompt.kind;
  b.total = seconds;
  b.endsAt = Date.now() + seconds * 1000;
  b.phase = 'ticking';
  b.rounds = (b.rounds || 0) + 1;
  saveToLocal();
  if (appState.currentView !== 'play-bomb') setView('play-bomb');
  paintBomb();
  bombArm();
}

/** A new category on the same fuse - the table was stuck, not out of time. */
function bombSwapPrompt() {
  const b = bombState();
  if (b.phase !== 'ticking') return;
  const prompt = bombNextPrompt();
  b.prompt = prompt.text;
  b.kind = prompt.kind;
  saveToLocal();
  paintBomb();
  haptic('light');
}

/** The clock that ends the round, and the ticking that gets faster. */
function bombArm() {
  const b = bombState();
  bombStop();
  const left = Math.max(0, Math.ceil((b.endsAt - Date.now()) / 1000));
  if (left <= 0) { bombExplode(); return; }
  bombClock = createClock({ seconds: left, onEnd: () => { bombClock = null; bombExplode(); } });
  bombTick();
}

function bombTick() {
  const b = bombState();
  if (b.phase !== 'ticking') return;
  const total = Math.max(1, b.total * 1000);
  const remaining = Math.max(0, b.endsAt - Date.now());
  const frac = Math.min(1, remaining / total);
  playSound('tick');
  const card = document.getElementById('bomb-card');
  if (card) {
    card.classList.remove('is-tick');
    void card.offsetWidth;
    card.classList.add('is-tick');
    card.classList.toggle('is-urgent', remaining < 8000);
  }
  // A second between ticks at the start, a quarter of one at the end.
  const delay = 250 + 750 * Math.pow(frac, 1.4);
  bombTickTimer = setTimeout(bombTick, delay);
}

function bombStop() {
  if (bombTickTimer) clearTimeout(bombTickTimer);
  bombTickTimer = null;
  if (bombClock) bombClock.stop();
  bombClock = null;
}

function bombExplode() {
  const b = bombState();
  bombStop();
  b.phase = 'boom';
  saveToLocal();
  playSound('alarm');
  haptic('heavy');
  paintBomb();
}

function exitBomb() {
  bombStop();
  bombState().phase = 'idle';
  saveToLocal();
  setView('setup-bomb');
}

function paintBomb() {
  const b = bombState();
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('bomb-stage');
  if (!el) return;
  const kindLabel = b.kind === 'letter' ? (t.bomb_letter_label || '') : (t.bomb_category_label || '');
  if (b.phase === 'boom') {
    el.innerHTML = `
      <div class="bomb-card bomb-card--boom" id="bomb-card">
        <div class="bomb-boom" aria-hidden="true">💥</div>
        <div class="bomb-card__title">${escapeHTML(t.bomb_boom || '')}</div>
        <div class="bomb-card__sub">${escapeHTML(t.bomb_boom_hint || '')}</div>
        <div class="bomb-card__prompt-small">${escapeHTML(kindLabel)}: <b>${escapeHTML(b.prompt)}</b></div>
      </div>
      <div class="view-actions">
        <button class="btn btn--primary btn--lg" onclick="startBombRound()">${escapeHTML(t.bomb_next_round || '')}</button>
        <button class="btn btn--ghost" onclick="exitBomb()">${escapeHTML(t.exit || '')}</button>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="bomb-card" id="bomb-card">
      <div class="bomb-fuse" aria-hidden="true"><span class="bomb-emoji">💣</span></div>
      <div class="eyebrow">${escapeHTML(kindLabel)}</div>
      <div class="bomb-card__prompt ${b.kind === 'letter' ? 'bomb-card__prompt--letter' : ''}">${escapeHTML(b.prompt)}</div>
      <div class="bomb-card__sub">${escapeHTML(b.kind === 'letter' ? (t.bomb_letter_hint || '') : (t.bomb_category_hint || ''))}</div>
    </div>
    <div class="view-actions">
      <button class="btn btn--secondary btn--lg" onclick="bombSwapPrompt()">${escapeHTML(t.bomb_swap || '')}</button>
      <button class="btn btn--ghost" onclick="exitBomb()">${escapeHTML(t.stop || '')}</button>
    </div>`;
}

/** After a reload: carry on if the fuse is still burning. */
function restoreBomb() {
  const b = bombState();
  if (b.phase === 'ticking' && b.endsAt > Date.now()) { paintBomb(); bombArm(); return true; }
  if (b.phase === 'boom') { paintBomb(); return true; }
  return false;
}
</script>
