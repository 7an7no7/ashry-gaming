<script>
  /* --- SCREW GAME LOGIC --- */

  /**
   * The shared end-of-game popup (#winner-modal) for a score keeper: the winner,
   * and the standings behind "full results", rebuilt on every open. Screw and
   * Domino both open it, so nothing here may outlive one opening: the old
   * version rewrote the popup's buttons for good, and Domino's "full results"
   * went on showing the last Screw table. The buttons are left as written in
   * Controller.html.
   *   { name, label, value, rows: [{ name, score }] in finishing order }
   */
  function showScoreWinner(o) {
    const t = TRANSLATIONS[appState.lang] || {};
    const list = document.getElementById('winners-list');
    if (list) {
      list.innerHTML = `<div class="text-3xl mb-2">🥇 ${escapeHTML(o.name)}</div>` +
                       `<div class="text-sm tx-muted font-bold">${escapeHTML(o.label)}: <span class="metric">${o.value}</span></div>`;
    }
    const box = document.getElementById('winner-scores-container');
    if (box) {
      const medals = ['🥇', '🥈', '🥉'];
      box.innerHTML = `<div class="cs-table" role="table">` + (o.rows || []).map((r, i) => `
        <div class="cs-row" role="row" style="--cs-cols:2">
          <span class="cs-row__n">${medals[i] || i + 1}</span>
          <span class="${i === 0 ? 'tx-strong' : ''}">${escapeHTML(r.name)}</span>
          <span class="metric ${i === 0 ? 'tx-success' : ''}">${r.score}</span>
        </div>`).join('') + `</div>`;
      box.classList.add('hidden');
    }
    // A popup closed with the table open left the button saying "hide".
    const toggle = document.getElementById('toggle-results-btn');
    if (toggle) toggle.textContent = t.show_full_results || 'عرض النتائج كاملة';
    const modal = document.getElementById('winner-modal');
    if (modal) modal.classList.remove('hidden');
  }

  /**
   * Starts the Screw game.
   */
  function runStartScrew(playersToUse, roundsToUse) {
    const rounds = roundsToUse || parseInt(document.getElementById('screw-rounds').value) || 5;
    let selected = playersToUse || (appState.activePlayers ? [...appState.activePlayers] : []);
    saveActivePlayers(selected);
    
    if(!selected || selected.length < 1) {
        const msg = appState.lang === 'ar' ? 'اختر لاعبين' : 'Select players';
        return showToast(msg);
    }
    playSound('click');
    
    // Initialize State
    appState.screw.rounds = rounds;
    appState.screw.players = selected.map(name => ({ name: name, scores: [], total: 0 }));
    
    // Reset round to 0
    appState.screw.activeRound = 0;
    
    // Clear previous board
    const board = document.getElementById('screw-score-inputs');
    if(board) board.innerHTML = '';

    renderScrewBoard();
    setView('play-screw');
  }

  /**
   * Handles round switching via dropdown.
   */
  function handleRoundChange(selectElement) {
      saveScrewScores(); 
      appState.screw.activeRound = parseInt(selectElement.value);
      renderScrewBoard();
  }

  /**
   * Renders the game board.
   */
  function renderScrewBoard() {
    const div = document.getElementById('screw-score-inputs');
    if (!div) return;

    if (!appState.screw.players || appState.screw.players.length === 0) {
        setView('setup-screw');
        return;
    }

    if (appState.screw.activeRound === undefined || appState.screw.activeRound === null) {
        appState.screw.activeRound = 0;
    }

    let currentRoundIdx = appState.screw.activeRound;
    if (currentRoundIdx >= appState.screw.rounds) {
        currentRoundIdx = 0;
        appState.screw.activeRound = 0;
    }

    const roundText = appState.lang === 'ar' ? 'جولة' : 'Round';
    const dealerText = appState.lang === 'ar' ? 'الموزع' : 'Dealer';
    const totalText = appState.lang === 'ar' ? 'المجموع' : 'Total';
    const scoreLabel = appState.lang === 'ar' ? 'نقاط' : 'Score';

    const dealerIndex = currentRoundIdx % appState.screw.players.length;
    const dealerNameRaw = appState.screw.players[dealerIndex].name;

    // Round picker + who is dealing.
    let html = '<div class="card card--tight"><div class="round-bar">' +
               '<select id="current-round-select" onchange="handleRoundChange(this)" aria-label="' + roundText + '">';
    for (let i = 1; i <= appState.screw.rounds; i++) {
        const selected = (i - 1) === currentRoundIdx ? ' selected' : '';
        html += '<option value="' + (i - 1) + '"' + selected + '>' + roundText + ' ' + i + '</option>';
    }
    html += '</select>';
    html += '<span class="badge badge--accent">🃏 ' + dealerText + ': ' + escapeHTML(dealerNameRaw) + '</span>';
    html += '</div></div>';

    // Lowest total leads in screw, so sort ascending and crown the top row.
    const sortedPlayers = [...appState.screw.players].sort((a, b) => a.total - b.total);

    sortedPlayers.forEach((p, idx) => {
        if (!p.scores) p.scores = [];
        const currentScore = p.scores[currentRoundIdx] !== undefined ? p.scores[currentRoundIdx] : '';
        const isDealer = (p.name === dealerNameRaw);
        const leading = idx === 0;

        html += `
        <div class="status-row ${leading ? 'status-row--turn' : ''}">
            <div class="status-row__body">
                <div class="status-row__name">
                    ${leading ? '<span aria-hidden="true">👑</span>' : ''}${escapeHTML(p.name)}
                </div>
                <div class="status-row__tags">
                    <span class="badge">${totalText}: ${p.total || 0}</span>
                    ${isDealer ? '<span class="badge badge--accent">🃏 ' + dealerText + '</span>' : ''}
                </div>
            </div>
            <input type="number"
                   inputmode="numeric"
                   data-player="${escapeHTML(p.name)}"
                   class="score-input"
                   aria-label="${scoreLabel} ${escapeHTML(p.name)}"
                   placeholder="-"
                   value="${currentScore}"
                   onchange="saveScrewScores()">
        </div>`;
    });

    div.innerHTML = html;
  }

  /**
   * Saves scores to state.
   */
  function saveScrewScores() {
    const roundIdx = appState.screw.activeRound;
    const inputs = document.querySelectorAll('.score-input');
    
    inputs.forEach(input => {
        const val = input.value;
        const pName = input.getAttribute('data-player');
        const player = appState.screw.players.find(p => p.name === pName);
        
        if(player) {
            if (val !== '' && !isNaN(parseInt(val, 10))) {
                player.scores[roundIdx] = parseInt(val, 10);
            } else {
                delete player.scores[roundIdx];
            }
            player.total = player.scores.reduce((a, b) => (a || 0) + (b || 0), 0);
        }
    });
    saveToLocal();
  }

  /**
   * Submits scores & Checks Game Over.
   */
  function submitScores() {
    saveScrewScores(); 
    playSound('success');
    
    const totalText = appState.lang === 'ar' ? 'المجموع' : 'Total';
    
    if (appState.screw.activeRound >= appState.screw.rounds - 1) {
        // --- GAME OVER ---
        // Sort a copy: mutating the roster would also re-order who deals.
        const standings = [...appState.screw.players].sort((a,b) => a.total - b.total);
        // The popup's own buttons (new game, full results, settings, menu) already
        // do the right thing here; playAgain() knows play-screw.
        showScoreWinner({
            name: standings[0].name,
            label: totalText,
            value: standings[0].total,
            rows: standings.map(p => ({ name: p.name, score: p.total }))
        });
    } else {
        appState.screw.activeRound++;
        renderScrewBoard(); 
    }
  }
</script>
