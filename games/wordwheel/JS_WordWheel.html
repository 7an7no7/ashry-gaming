<script>
/* ============================================================================
   كلمات من حروف — THE LETTER WHEEL
   ----------------------------------------------------------------------------
   A wheel of letters and a small crossword. Drag across the letters (or tap
   them one by one and press ✓) to make a word; a word of the crossword fills
   its cells, any other real word made of these letters is a bonus ⭐.

   The dictionary, the layout and the puzzle maker are WordWheel.js (shared
   with the rooms server, which deals a race's wheel and judges every word):
   the words are the app's own banks in the games' language. A puzzle is a
   base word of 5, 6 or 7 letters, every dictionary word its letters can
   spell, and a crossword laid out from those. The daily is 6 letters from
   the seed. The board is in appState.wordwheel.

   In سباق ألغاز (RACE_UI.wordwheel, JS_RoomRace.html) the same wheel and
   crossword play the room's puzzle: the words stay on the server, so every
   word made is sent (`move { word }`), a grid word comes back and turns its
   cells over, a bonus word is counted, anything else shakes. No hint.

   The owner's picks of 7 Oct 2026: (1171) a word of all the letters - the
   base word - lights a 🏆 and its cells turn gold, and in «بالدور» it scores
   double; (1172) «بالدور» on one phone: two players take turns, every try
   passes the turn (a word already found doesn't), a grid word fills in in its
   finder's colour and scores its letters, and most letters wins once the grid
   is full. s.playWay 'duo' and s.duo = { names, cur, pts, owner: { wi: p } }.
   Third batch: (1174) «خروج» is a 🚪 in the tools row, so the screen fits
   upright; (1175) the word being made is big and centred, flies into its
   cells or the ⭐ (wheelFlyWord) and shakes red when refused (wheelRefuse);
   (1176) the result lists the bonus words found and a few missed.
   ========================================================================= */

let wheelDrag = null;
let wheelTimer = null;
const WHEEL_WAYS = ['solo', 'duo'];

/** 1171: the big word is one of all the letters (the base word, or an anagram of it in the grid). */
const wheelIsBig = (s, p) => !!p && wheelLen(p) === s.letters.length;

/** 1172: a word's points in «بالدور»: its letters, the big word's double. */
const wheelWordPts = (s, p) => wheelLen(p) * (wheelIsBig(s, p) ? 2 : 1);

function wheelState() {
  const race = soloRaceState('wordwheel');
  if (race) return race;
  if (!appState.wordwheel) {
    appState.wordwheel = { level: 'easy', way: 'solo', daily: '', lang: 'ar', letters: [], words: [], bonus: [], found: [], bonusFound: [], shown: [], typed: [], rows: 0, cols: 0, startedAt: 0, pausedAt: 0, phase: 'setup' };
  }
  return appState.wordwheel;
}

/* --- Setup and play ------------------------------------------------------------------ */

function setupWordWheel() {
  if (wheelTimer) wheelTimer.stop();
  wheelTimer = null;
  setView('setup-wordwheel');
}

function paintWordWheelSetup() {
  const s = wheelState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#wordwheel-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const way = WHEEL_WAYS.indexOf(s.way) !== -1 ? s.way : 'solo';
  document.querySelectorAll('#wordwheel-way .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === way));
  const wayHint = document.getElementById('wordwheel-way-hint');
  if (wayHint) wayHint.textContent = t[way === 'duo' ? 'wheel_way_duo_hint' : 'wheel_way_solo_hint'] || '';
  const best = soloBest('wordwheel', s.level);
  const el = document.getElementById('wordwheel-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('wordwheel-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('wordwheel-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('wordwheel', 'startWordWheel(true)');
}

function setWordWheelWay(way) {
  wheelState().way = WHEEL_WAYS.indexOf(way) !== -1 ? way : 'solo';
  saveToLocal();
  paintWordWheelSetup();
}

/** 1172: «بالدور» needs two names: the players sheet, two rows, whoever was in the round first. */
function wheelAskDuo(go) {
  const keep = appState.activePlayers;
  appState.activePlayers = (keep || []).slice(0, 2);
  askPlayers(2, (stored) => go(stored.slice(0, 2)), { max: 2 });
  appState.activePlayers = keep;
}

function setWordWheelLevel(level) {
  wheelState().level = level;
  saveToLocal();
  paintWordWheelSetup();
}

// A wheel with a word found: a new one asks first (soloConfirmNew).
const wheelHasWork = (s) => (s.found || []).length > 0 || (s.bonusFound || []).length > 0;

function startWordWheel(daily, sure, duoNames) {
  if (!sure && soloConfirmNew('wordwheel', wheelHasWork, () => startWordWheel(daily, true))) return;
  if (daily && soloDailyResume('wordwheel')) return;
  const s = wheelState();
  // 1172: «بالدور» (never the daily): the two names first.
  const duo = !daily && s.way === 'duo';
  if (duo && !(Array.isArray(duoNames) && duoNames.length === 2)) { wheelAskDuo((names) => startWordWheel(false, true, names)); return; }
  const level = daily ? 'medium' : s.level;
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  let made = wheelMake(level, lang, soloRandom(daily ? soloDaySeed('wordwheel:' + lang) : null));
  // A free wheel that couldn't be made gets one more go with other dice.
  if (!made && !daily) made = wheelMake(level, lang, soloRandom(null));
  if (!made) { showToast((TRANSLATIONS[appState.lang] || {}).solo_make_failed || '', 'error'); return; }
  soloDailySetAside('wordwheel');
  soloNewGame('wordwheel');
  Object.assign(s, {
    daily: daily ? soloToday() : '', playLevel: level, lang: lang,
    letters: made.letters, words: made.words, bonus: made.bonus, rows: made.rows, cols: made.cols,
    found: [], bonusFound: [], shown: [], typed: [], hints: 0, startedAt: Date.now(), pausedAt: 0, seconds: 0, phase: 'play',
    playWay: duo ? 'duo' : 'solo', bigFound: false,
    duo: duo ? { names: duoNames.map(String), cur: 0, pts: [0, 0], owner: {} } : null
  });
  saveToLocal();
  setView('play-wordwheel');
  paintWordWheel();
  wheelArmTimer();
}

function continueWordWheel() {
  if (wheelState().phase !== 'play') return;
  setView('play-wordwheel');
  paintWordWheel();
  wheelArmTimer();
}

function wheelArmTimer() {
  if (wheelTimer) wheelTimer.stop();
  wheelTimer = soloClock('wheel-time', () => wheelState().startedAt);
}

function wheelCellKey(r, c) { return r + ',' + c; }

/** The letters of a word's cells: the word itself, or (a race, the word still hidden) whatever its crossings gave away. */
const wheelLen = (p) => (p.w ? p.w.length : (p.len || 0));

function paintWordWheel() {
  const s = wheelState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('wordwheel-stage');
  if (!el || !s.words.length) return;
  const cells = {};
  s.words.forEach((p, wi) => {
    for (let k = 0; k < wheelLen(p); k++) {
      const r = p.dir === 'a' ? p.r : p.r + k, c = p.dir === 'a' ? p.c + k : p.c;
      const key = wheelCellKey(r, c);
      cells[key] = cells[key] || { ch: '', r: r, c: c, words: [] };
      if (p.w) cells[key].ch = p.w[k];
      cells[key].words.push(wi);
    }
  });
  const open = (cell) => cell.words.some(wi => s.found.indexOf(wi) !== -1) || s.shown.indexOf(wheelCellKey(cell.r, cell.c)) !== -1;
  // A cell's colour: the big word's gold (1171), else in «بالدور» the colour of whoever found its first word (1172).
  const cellCls = (cell) => {
    const found = s.found.filter(wi => cell.words.indexOf(wi) !== -1);
    if (!found.length) return '';
    if (found.some(wi => wheelIsBig(s, s.words[wi]))) return ' is-big';
    if (s.duo) { const p = s.duo.owner[found[0]]; return p === 0 || p === 1 ? ' is-p' + p : ''; }
    return '';
  };
  const n = s.letters.length;
  const duo = s.duo;
  const bar = duo ? soloBarHtml([
    { label: duo.names[0], value: duo.pts[0], id: 'wheel-p0', cls: 'wheel-duo is-p0' + (duo.cur === 0 && s.phase === 'play' ? ' is-turn' : '') },
    { label: t.wheel_words || '', value: `${s.found.length}/${s.words.length}`, id: 'wheel-count' },
    { label: duo.names[1], value: duo.pts[1], id: 'wheel-p1', cls: 'wheel-duo is-p1' + (duo.cur === 1 && s.phase === 'play' ? ' is-turn' : '') }
  ]) : soloBarHtml([
    { label: t.wheel_words || '', value: `${s.found.length}/${s.words.length}`, id: 'wheel-count' },
    { label: '⭐', value: s.bonusFound.length, id: 'wheel-bonus' },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.seconds), id: 'wheel-time' }
  ].concat(s.bigFound ? [{ label: t.wheel_big || '', value: '🏆', cls: 'wheel-big-stat' }] : []));
  const turnLine = duo && s.phase === 'play'
    ? `<p class="wheel-turn is-p${duo.cur}" id="wheel-turn" role="status">${escapeHTML((t.wheel_duo_turn || '{name}').replace('{name}', duo.names[duo.cur]))}</p>` : '';
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="wheel-grid" id="wheel-grid" dir="${s.lang === 'en' ? 'ltr' : 'rtl'}" style="--ww-cols:${s.cols}; --ww-rows:${s.rows}">
          ${Object.values(cells).map(cell => `
            <div class="wheel-cell${open(cell) ? ' is-open' + cellCls(cell) : ''}" data-key="${wheelCellKey(cell.r, cell.c)}" style="grid-row:${cell.r + 1}; grid-column:${cell.c + 1}">${open(cell) ? escapeHTML(cell.ch) : ''}</div>`).join('')}
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}${turnLine}
        <div class="wheel-typed" id="wheel-typed" dir="${s.lang === 'en' ? 'ltr' : 'rtl'}">${escapeHTML(s.typed.map(i => s.letters[i]).join(''))}</div>
        <div class="wheel-ring" id="wheel-ring">
          <svg class="wheel-lines" id="wheel-lines" viewBox="0 0 100 100" aria-hidden="true"><polyline points="" /></svg>
          ${s.letters.map((ch, i) => {
            const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
            const x = 50 + Math.cos(angle) * 36, y = 50 + Math.sin(angle) * 36;
            return `<button type="button" class="wheel-letter${s.typed.indexOf(i) !== -1 ? ' is-on' : ''}" data-i="${i}" style="left:${x}%; top:${y}%">${escapeHTML(ch)}</button>`;
          }).join('')}
        </div>
        <div class="sdk-tools wheel-tools">
          <button type="button" class="btn btn--neutral btn--sm" onclick="wheelBackspace()" aria-label="${escapeHTML(t.wheel_erase || '')}" title="${escapeHTML(t.wheel_erase || '')}">⌫</button>
          <button type="button" class="btn btn--neutral btn--sm" onclick="shuffleWordWheel()">🔀 ${escapeHTML(t.wheel_shuffle || '')}</button>
          ${s.race || s.duo ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="hintWordWheel()">💡 ${escapeHTML(t.solo_hint || '')}</button>`}
          <button type="button" class="btn btn--primary btn--sm" onclick="wheelSubmit()" aria-label="${escapeHTML(t.wheel_submit || '')}" title="${escapeHTML(t.wheel_submit || '')}" ${s.typed.length >= 2 ? '' : 'disabled'}>✓</button>
          ${s.race ? '' : `<button type="button" class="btn btn--ghost btn--sm wheel-exit" onclick="${s.phase === 'play' ? 'playExit(setupWordWheel)' : 'setupWordWheel()'}" aria-label="${escapeHTML(t.exit || '')}" title="${escapeHTML(t.exit || '')}">🚪</button>`}
        </div>
      </div>
    </div>`;
  wheelBind();
  wheelDrawLine();
}

function wheelBind() {
  const ring = document.getElementById('wheel-ring');
  if (!ring) return;
  ring.addEventListener('pointerdown', (e) => {
    const s = wheelState();
    const btn = e.target.closest('.wheel-letter');
    if (!btn || s.phase !== 'play') return;
    e.preventDefault();
    const i = Number(btn.dataset.i);
    const before = s.typed.length;
    if (s.typed.indexOf(i) === -1) s.typed.push(i);
    wheelDrag = { moved: false, start: before, from: i };
    wheelRefreshTyped();
    const move = (ev) => {
      const over = soloCellAt(ev.clientX, ev.clientY, '.wheel-letter');
      if (!over || !wheelDrag) return;
      const k = Number(over.dataset.i);
      if (k === wheelDrag.from && !wheelDrag.moved) return;
      // A drag is a word of its own: letters tapped before it don't stay in front.
      if (!wheelDrag.moved && wheelDrag.start > 0) {
        s.typed = [wheelDrag.from];
        wheelDrag.start = 0;
        wheelRefreshTyped();
      }
      const pos = s.typed.indexOf(k);
      if (pos === -1) { s.typed.push(k); wheelDrag.moved = true; wheelRefreshTyped(); }
      else if (pos === s.typed.length - 2) { s.typed.pop(); wheelRefreshTyped(); }
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      const d = wheelDrag;
      wheelDrag = null;
      if (d && d.moved && s.typed.length >= 2) wheelSubmit();
      else saveToLocal();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}

function wheelRefreshTyped() {
  const s = wheelState();
  const typed = document.getElementById('wheel-typed');
  if (typed) { typed.classList.remove('is-wrong'); typed.textContent = s.typed.map(i => s.letters[i]).join(''); }
  document.querySelectorAll('#wheel-ring .wheel-letter').forEach(b => b.classList.toggle('is-on', s.typed.indexOf(Number(b.dataset.i)) !== -1));
  const submit = document.querySelector('.wheel-tools .btn--primary');
  if (submit) submit.disabled = s.typed.length < 2;
  wheelDrawLine();
}

function wheelDrawLine() {
  const s = wheelState();
  const line = document.querySelector('#wheel-lines polyline');
  if (!line) return;
  const n = s.letters.length;
  line.setAttribute('points', s.typed.map(i => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    return `${50 + Math.cos(angle) * 36},${50 + Math.sin(angle) * 36}`;
  }).join(' '));
}

function wheelBackspace() {
  const s = wheelState();
  s.typed.pop();
  wheelRefreshTyped();
}

function wheelShake(id) {
  const el = document.getElementById(id);
  if (el && el.animate && !motionOff()) el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 260 });
}

/** A grid word's cells turn over one after another (from `at` ms: the word's flight lands first). */
function wheelFlipWord(s, wi, at) {
  if (motionOff()) return;
  const p = s.words[wi];
  for (let k = 0; k < wheelLen(p); k++) {
    const r = p.dir === 'a' ? p.r : p.r + k, c = p.dir === 'a' ? p.c + k : p.c;
    const cell = document.querySelector(`#wheel-grid [data-key="${wheelCellKey(r, c)}"]`);
    if (cell && cell.animate) cell.animate([{ transform: 'rotateX(90deg)' }, { transform: 'none' }], { duration: 300, delay: (at || 0) + k * 70, easing: 'ease-out', fill: 'backwards' });
  }
}

function wheelSubmit() {
  const s = wheelState();
  const t = TRANSLATIONS[appState.lang];
  if (s.phase !== 'play' || s.typed.length < 2) return;
  const word = s.typed.map(i => s.letters[i]).join('');
  s.typed = [];
  // A race: the words are on the server, which judges the word (JS_RoomRace.html).
  if (s.race) {
    s.lastWord = word;   // its flight or its shake comes with the server's answer (RACE_UI.wordwheel)
    saveToLocal(); paintWordWheel();
    // "Already found" is said once, for this word: the board's `last` stays 'again' through
    // everyone else's moves, so it is read here, after this phone's own answer, not in sync.
    raceMove('wordwheel', { word: word }).then(ok => {
      const b = ok && Room.state && Room.state.you && Room.state.you.board;
      if (b && b.last === 'again') showToast(t.wheel_already || '', 'info');
    });
    return;
  }
  const wi = s.words.findIndex(p => p.w === word);
  // 1175: where the word was made, for its flight into its slot (or the ⭐).
  const typedEl = document.getElementById('wheel-typed');
  const from = typedEl && word ? typedEl.getBoundingClientRect() : null;
  // 1172: whoever's turn it is; every try passes it, except a word already found.
  const duo = s.duo;
  const who = duo ? duo.cur : -1;
  const pass = () => { if (duo) duo.cur = 1 - duo.cur; };
  if (wi !== -1 && s.found.indexOf(wi) === -1) {
    s.found.push(wi);
    const big = wheelIsBig(s, s.words[wi]);
    if (big) s.bigFound = true;
    let pts = 0;
    if (duo) { duo.owner[wi] = who; pts = wheelWordPts(s, s.words[wi]); duo.pts[who] += pts; pass(); }
    saveToLocal();
    playSound('success');
    haptic(big ? 'double' : 'light');
    paintWordWheel();
    const flown = wheelFlyWord(word, from, wheelWordCells(s, wi));
    wheelFlipWord(s, wi, flown);
    if (duo) wheelDuoGain(who, pts, big);
    if (big) wheelBigMoment(s, wi);
    if (s.found.length === s.words.length) wheelFinish();
    return;
  }
  if (s.bonus.indexOf(word) !== -1 && s.bonusFound.indexOf(word) === -1) {
    s.bonusFound.push(word);
    pass();
    saveToLocal();
    playSound('click');
    paintWordWheel();
    const star = document.getElementById('wheel-bonus');
    const flown = wheelFlyWord(word, from, star ? [star] : []);
    if (star) setTimeout(() => soloPop(star.closest('.solo-stat') || star, 1.2), flown);
    showToast(`⭐ ${t.wheel_bonus || ''}: ${word}`, 'success');
    return;
  }
  const again = wi !== -1 || s.bonusFound.indexOf(word) !== -1;
  if (!again) pass();
  saveToLocal();
  paintWordWheel();
  if (again) showToast(t.wheel_already || '', 'info');
  wheelRefuse(word);
  wheelShake('wheel-ring');
}

/** The cells of a grid word, in its order. */
function wheelWordCells(s, wi) {
  const p = s.words[wi];
  const out = [];
  for (let k = 0; k < wheelLen(p); k++) {
    const r = p.dir === 'a' ? p.r : p.r + k, c = p.dir === 'a' ? p.c + k : p.c;
    const cell = document.querySelector(`#wheel-grid [data-key="${wheelCellKey(r, c)}"]`);
    if (cell) out.push(cell);
  }
  return out;
}

/**
 * 1175: a word that counts flies from where it was made into its place - the grid
 * word's cells, or the ⭐ - shrinking as it goes. Returns how long the flight takes (0: none).
 */
function wheelFlyWord(word, from, targets) {
  if (!from || !targets.length || motionOff() || !document.body.animate) return 0;
  const box = targets.map(el => el.getBoundingClientRect()).reduce((a, r) => ({
    l: Math.min(a.l, r.left), t: Math.min(a.t, r.top), r: Math.max(a.r, r.right), b: Math.max(a.b, r.bottom)
  }), { l: Infinity, t: Infinity, r: -Infinity, b: -Infinity });
  const ghost = document.createElement('div');
  ghost.className = 'wheel-fly';
  ghost.textContent = word;
  ghost.dir = 'auto';
  ghost.style.left = (from.left + from.width / 2) + 'px';
  ghost.style.top = (from.top + from.height / 2) + 'px';
  document.body.appendChild(ghost);
  const dx = (box.l + box.r) / 2 - (from.left + from.width / 2);
  const dy = (box.t + box.b) / 2 - (from.top + from.height / 2);
  const ms = 420;
  const a = ghost.animate([
    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
    { transform: 'translate(-50%, -50%) scale(1.12)', opacity: 1, offset: 0.15 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.55)`, opacity: 0.15 }
  ], { duration: ms, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });
  const done = () => { if (ghost.isConnected) ghost.remove(); };
  a.onfinish = done;
  setTimeout(done, ms + 600);
  return ms - 80;
}

/** 1175: a refused word stays up a moment, red, and shakes where the eye is, then clears. */
function wheelRefuse(word) {
  const el = document.getElementById('wheel-typed');
  if (!el || !word) return;
  el.textContent = word;
  el.classList.add('is-wrong');
  wheelShake('wheel-typed');
  setTimeout(() => {
    const now = document.getElementById('wheel-typed');
    if (now !== el || !el.classList.contains('is-wrong')) return;
    el.classList.remove('is-wrong');
    if (!wheelState().typed.length) el.textContent = '';
  }, motionOff() ? 500 : 650);
}

/** 1171: the big word - a 🏆 toast, its gold cells pop after they turn over. */
function wheelBigMoment(s, wi) {
  const t = TRANSLATIONS[appState.lang] || {};
  showToast(`🏆 ${t.wheel_big_found || ''}${s.duo ? ' ×2' : ''}`, 'success');
  if (motionOff()) return;
  const p = s.words[wi];
  for (let k = 0; k < wheelLen(p); k++) {
    const r = p.dir === 'a' ? p.r : p.r + k, c = p.dir === 'a' ? p.c + k : p.c;
    const cell = document.querySelector(`#wheel-grid [data-key="${wheelCellKey(r, c)}"]`);
    if (cell) setTimeout(() => soloPop(cell, 1.25), 300 + k * 70);
  }
}

/** 1172: the points count up on the finder's chip. */
function wheelDuoGain(who, pts, big) {
  const el = document.getElementById('wheel-p' + who);
  if (!el || !pts) return;
  const to = Number(el.textContent) || 0;
  if (typeof countUp === 'function' && !motionOff()) countUp(el, Math.max(0, to - pts), to);
  soloPop(el.closest('.solo-stat'), big ? 1.3 : 1.15);
}

function shuffleWordWheel() {
  const s = wheelState();
  if (s.phase !== 'play') return;
  const before = [...document.querySelectorAll('#wheel-ring .wheel-letter')].map(b => b.getBoundingClientRect());
  const order = soloShuffle(s.letters.map((_, i) => i), Math.random);
  s.letters = order.map(i => s.letters[i]);
  s.typed = [];
  saveToLocal();
  paintWordWheel();
  if (motionOff()) return;
  document.querySelectorAll('#wheel-ring .wheel-letter').forEach((b, k) => {
    const old = before[order[k]];
    const now = b.getBoundingClientRect();
    if (old && b.animate) b.animate([{ transform: `translate(calc(-50% + ${old.left - now.left}px), calc(-50% + ${old.top - now.top}px))` }, { transform: 'translate(-50%, -50%)' }], { duration: 380, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  });
}

function hintWordWheel() {
  const s = wheelState();
  if (s.phase !== 'play' || s.race) return;
  const hidden = [];
  s.words.forEach((p, wi) => {
    if (s.found.indexOf(wi) !== -1) return;
    for (let k = 0; k < p.w.length; k++) {
      const r = p.dir === 'a' ? p.r : p.r + k, c = p.dir === 'a' ? p.c + k : p.c;
      const key = wheelCellKey(r, c);
      if (s.shown.indexOf(key) === -1) hidden.push(key);
    }
  });
  if (!hidden.length) return;
  s.shown.push(soloPick(hidden, Math.random));
  s.hints = (s.hints || 0) + 1;
  saveToLocal();
  paintWordWheel();
}

function wheelFinish() {
  const s = wheelState();
  const t = TRANSLATIONS[appState.lang];
  s.phase = 'done';
  if (wheelTimer) wheelTimer.stop();
  wheelTimer = null;
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  saveToLocal();
  const level = s.playLevel || s.level;
  if (s.duo) { wheelDuoFinish(s, seconds); return; }
  const rec = s.hints || s.archive ? { record: false, prev: soloBest('wordwheel', level) }
    : soloRecord('wordwheel', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('wordwheel', { seconds: seconds, bonus: s.bonusFound.length, hints: s.hints || 0 }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🔡 ${t.setup_wordwheel || ''} ✅ ${soloTime(seconds)}${s.bonusFound.length ? ' · ⭐ ' + s.bonusFound.length : ''}${s.hints ? ' · 💡 ' + s.hints : ''}`;
  }
  const lines = [`⭐ ${escapeHTML(t.wheel_bonus || '')}: ${s.bonusFound.length}/${s.bonus.length}`];
  const words = wheelBonusLines(s, t);
  if (s.bigFound) lines.push(`🏆 ${escapeHTML(t.wheel_big_found || '')}`);
  if (s.hints) lines.push(`💡 ${escapeHTML(t.solo_hint || '')}: ${s.hints}`);
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  // The words go under the count on the sheet, never on a share picture (they'd give the letters away).
  const shareLines = lines.slice();
  lines.splice(1, 0, ...words);
  soloLater('wordwheel', motionOff() ? 0 : 800, () => soloResult({
    icon: '🔡', title: rec.record ? (t.solo_new_best || '') : (t.solo_solved || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, shareLines: shareLines, win: true, share: share,
    again: () => startWordWheel(false), exit: setupWordWheel
  }));
}

const WHEEL_MISSED_SHOWN = 6;

/**
 * 1176: the bonus words on the result - the ones found, and up to six missed (the
 * longest first), so «⭐ 3/12» means something. Lines of the result sheet (HTML).
 */
function wheelBonusLines(s, t) {
  const chips = (list) => list.map(w => `<bdi class="wheel-bonus-word">${escapeHTML(w)}</bdi>`).join('');
  const missed = s.bonus.filter(w => s.bonusFound.indexOf(w) === -1)
    .map((w, i) => ({ w, i })).sort((a, b) => b.w.length - a.w.length || a.i - b.i)
    .slice(0, WHEEL_MISSED_SHOWN).map(x => x.w);
  const out = [];
  if (s.bonusFound.length) out.push(`<span class="wheel-bonus-list is-got"><span>${escapeHTML(t.wheel_bonus_got || '')}:</span> ${chips(s.bonusFound)}</span>`);
  if (missed.length) out.push(`<span class="wheel-bonus-list"><span>${escapeHTML(t.wheel_bonus_missed || '')}:</span> ${chips(missed)}${s.bonus.length - s.bonusFound.length > missed.length ? ' …' : ''}</span>`);
  return out;
}

/** 1172: «بالدور» ends with the grid full: most letters wins (no record; a draw can happen). */
function wheelDuoFinish(s, seconds) {
  const t = TRANSLATIONS[appState.lang] || {};
  const d = s.duo;
  const win = d.pts[0] === d.pts[1] ? -1 : (d.pts[0] > d.pts[1] ? 0 : 1);
  const lines = d.names.map((n, i) => `<span class="wheel-duo-line is-p${i}">${i === win ? '👑 ' : ''}<bdi>${escapeHTML(n)}</bdi>: <b class="metric">${d.pts[i]}</b></span>`);
  lines.push(`⏱️ ${soloTime(seconds)}`);
  const names = d.names.slice();
  soloLater('wordwheel', motionOff() ? 0 : 800, () => soloResult({
    icon: win === -1 ? '🤝' : '👑',
    title: win === -1 ? (t.wheel_duo_draw || '') : (t.wheel_duo_won || '{name}').replace('{name}', d.names[win]),
    valueText: win === -1 ? `${d.pts[0]} - ${d.pts[1]}` : String(d.pts[win]), valueLabel: t.wheel_duo_letters || '',
    lines: lines, win: win !== -1, again: () => startWordWheel(false, true, names), exit: setupWordWheel
  }));
}

function restoreWordWheel() {
  const s = wheelState();
  if (s.phase !== 'play' || !s.words.length) return false;
  s.typed = [];
  paintWordWheel();
  wheelArmTimer();
  return true;
}

soloRegister('wordwheel', {
  setup: 'setup-wordwheel', play: 'play-wordwheel', paintSetup: paintWordWheelSetup, restore: restoreWordWheel,
  state: wheelState, resume: continueWordWheel, repaint: paintWordWheel, timed: true, prefs: ['level', 'way']
});

/* --- سباق ألغاز: the same wheel, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.wordwheel = {
  stage: 'wordwheel-stage',
  unit: 'race_unit_words',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', lang: pub.lang, letters: pub.letters.slice(),
    words: pub.layout.map(l => ({ w: null, len: l.len, r: l.r, c: l.c, dir: l.dir })), bonus: [], rows: pub.rows, cols: pub.cols,
    found: [], bonusFound: [], shown: [], typed: [], hints: 0, seconds: 0 }),
  // The words the server says this phone has made: a grid word turns its cells over, a bonus word is a toast.
  sync(s, board, fx) {
    const b = board || {};
    const t = TRANSLATIONS[appState.lang] || {};
    const fresh = (b.found || []).filter(f => s.found.indexOf(f.wi) === -1);
    fresh.forEach(f => { s.words[f.wi].w = f.w; s.found.push(f.wi); });
    const bonusFresh = (b.bonus || []).filter(w => s.bonusFound.indexOf(w) === -1);
    bonusFresh.forEach(w => s.bonusFound.push(w));
    const typedEl = document.getElementById('wheel-typed');
    const from = typedEl ? typedEl.getBoundingClientRect() : null;
    if (fresh.length || bonusFresh.length) paintWordWheel();
    if (fx && fx.first) return;
    if (fresh.length) {
      // 1175: the word this phone just made flies from where it was made into its cells.
      playSound('success'); haptic('light');
      fresh.forEach(f => wheelFlipWord(s, f.wi, f.w === s.lastWord ? wheelFlyWord(f.w, from, wheelWordCells(s, f.wi)) : 0));
      // 1171: the big word lights its 🏆 on the racer's phone too.
      const big = fresh.find(f => wheelIsBig(s, s.words[f.wi]));
      if (big) { s.bigFound = true; wheelBigMoment(s, big.wi); }
    }
    else if (bonusFresh.length) { playSound('click'); showToast(`⭐ ${t.wheel_bonus || ''}: ${bonusFresh[0]}`, 'success'); }
  },
  snapshot: (s) => s.found.length * 100 + s.bonusFound.length,
  miss: () => { wheelRefuse(wheelState().lastWord || ''); wheelShake('wheel-ring'); },
  paint: () => paintWordWheel(),
  finished: () => 0,
  revealHtml: (r) => (r && r.words ? `<div class="strands-words">${r.words.map(w => `<span class="strands-word is-found">${escapeHTML(w)}</span>`).join('')}</div>` : '')
};
</script>
