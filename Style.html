<style>
/* ============================================================================
   ASHRY GAMING — DESIGN SYSTEM
   ----------------------------------------------------------------------------
   Mobile-first. Everything below is driven by the tokens in section 1, so a
   colour, radius, duration or spacing change happens in exactly one place.

   Per-screen colour comes from `data-accent` on the view element: components
   inside read --accent / --accent-soft / --accent-ink and re-tint themselves,
   which is what gives each game its own identity without one-off CSS.

   Sections
     1  Tokens                 6  Cards, tiles, rows
     2  Base & reset           7  Forms
     3  App shell              8  Sheets, modals, toasts
     4  Motion                 9  Game-specific
     5  Buttons               10  Accessibility
   ========================================================================= */

/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root {
  color-scheme: light;

  /* --- Neutral ramp (slate) --- */
  --n-0:   #ffffff;
  --n-25:  #fcfdfe;
  --n-50:  #f8fafc;
  --n-100: #f1f5f9;
  --n-200: #e2e8f0;
  --n-300: #cbd5e1;
  --n-400: #94a3b8;
  --n-500: #64748b;
  --n-600: #475569;
  --n-700: #334155;
  --n-800: #1e293b;
  --n-900: #0f172a;
  --n-950: #020617;

  /* --- Surfaces --- */
  --bg:            var(--n-100);
  --surface:       rgba(255, 255, 255, 0.92);
  --surface-solid: var(--n-0);
  --surface-2:     var(--n-50);
  --surface-3:     var(--n-100);
  --surface-sunken: var(--n-100);
  --elevated:      var(--n-0);
  --border:        rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.14);
  --hairline:      rgba(15, 23, 42, 0.06);

  /* --- Text --- */
  --text:   var(--n-700);
  /* Not straight off the neutral ramp: n-500 lands at 4.34:1 on the page
     background and n-400 at 2.34:1, so the section titles, ghost-button
     labels and every field hint sat under AA. These are the same hues, dark
     enough to clear it on both the page and a card. */
  --text-2: #51607a;
  --text-3: #5f6e85;
  --text-strong: var(--n-900);

  /* --- Semantic --- */
  --success:      #059669;
  --success-ink:  #047857;
  --success-soft: #ecfdf5;
  --danger:       #e11d48;
  --danger-ink:   #be123c;
  --danger-soft:  #fff1f2;
  --warning:      #d97706;
  --warning-ink:  #b45309;
  --warning-soft: #fffbeb;

  /* Solid semantic buttons: white is not readable on every one of these, and
     which one it is changes between the themes. Same idea as --accent-on. */
  --success-btn:  #047857;   /* darkened; white on #059669 is 3.8:1 */
  --success-on:   #ffffff;
  --danger-btn:   #e11d48;
  --danger-on:    #ffffff;
  --warning-btn:  #b45309;
  --warning-on:   #ffffff;
  --info:         #2563eb;
  --info-soft:    #eff6ff;

  /* --- Default accent (brand violet); overridden by [data-accent] --- */
  --accent:        #6d28d9;
  --accent-hover:  #5b21b6;
  --accent-ink:    #6d28d9;
  --accent-soft:   #f5f3ff;
  --accent-border: #ddd6fe;
  --accent-on:     #ffffff;
  --accent-glow:   rgba(109, 40, 217, 0.28);

  /* --- Type scale --- */
  --font: 'Cairo', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs-display: 2.25rem;   /* 36 — hero numbers */
  --fs-h1:      1.375rem;  /* 22 */
  --fs-h2:      1.125rem;  /* 18 */
  --fs-h3:      1rem;      /* 16 */
  --fs-body:    0.9375rem; /* 15 */
  --fs-sm:      0.8125rem; /* 13 */
  --fs-xs:      0.6875rem; /* 11 */
  --lh-tight: 1.15;
  --lh-snug:  1.35;
  --lh-body:  1.6;

  /* --- Spacing (4px base) --- */
  --sp-1: 4px;  --sp-2: 8px;   --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px;  --sp-7: 32px; --sp-8: 40px; --sp-9: 48px;

  /* --- Radii --- */
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 20px;
  --r-xl: 26px; --r-2xl: 32px; --r-full: 999px;

  /* --- Elevation --- */
  --sh-1: 0 1px 2px rgba(15, 23, 42, 0.05);
  --sh-2: 0 2px 8px -2px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
  --sh-3: 0 8px 24px -8px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.05);
  --sh-4: 0 20px 48px -12px rgba(15, 23, 42, 0.22);
  --sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.7);

  /* --- Motion --- */
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in:     cubic-bezier(0.55, 0, 1, 0.45);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.45, 0.5, 1);
  --dur-1: 120ms;  /* press / hover */
  --dur-2: 200ms;  /* control state */
  --dur-3: 300ms;  /* view + sheet */
  --dur-4: 460ms;  /* celebratory */
  --press-scale: 0.965;

  /* --- Layout --- */
  --shell-max: 520px;
  --header-h: 56px;
  --nav-h: 62px;
  --tap: 44px;               /* minimum touch target */
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}

body.dark {
  color-scheme: dark;

  --bg:            var(--n-900);
  --surface:       rgba(30, 41, 59, 0.92);
  --surface-solid: var(--n-800);
  --surface-2:     #172033;
  --surface-3:     var(--n-700);
  --surface-sunken: var(--n-950);
  --elevated:      #1b2537;
  --border:        rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.18);
  --hairline:      rgba(255, 255, 255, 0.06);

  --text:   #e8eef7;
  --text-2: #a3b1c4;      /* n-400 was 4.04:1 on the segmented track */
  --text-3: #8b98ac;      /* n-500 was 3.07:1 on a dark card */
  --text-strong: #ffffff;

  --success:      #10b981;
  --success-ink:  #6ee7b7;
  --success-soft: rgba(16, 185, 129, 0.14);
  --danger:       #f43f5e;
  --danger-ink:   #fda4af;
  --danger-soft:  rgba(244, 63, 94, 0.15);
  --warning:      #f59e0b;
  --warning-ink:  #fcd34d;
  --warning-soft: rgba(245, 158, 11, 0.15);

  /* Dark semantics are bright by design, so the button text goes dark. */
  --success-btn:  #10b981;
  --success-on:   #032018;
  --danger-btn:   #f43f5e;
  --danger-on:    #2b0410;
  --warning-btn:  #f59e0b;
  --warning-on:   #1c1200;
  --info:         #3b82f6;
  --info-soft:    rgba(59, 130, 246, 0.15);

  --accent:        #8b5cf6;
  --accent-hover:  #a78bfa;
  --accent-ink:    #c4b5fd;
  --accent-soft:   rgba(139, 92, 246, 0.16);
  --accent-border: rgba(139, 92, 246, 0.32);
  --accent-on:     #0b0518;   /* white is only 4.23:1 on this violet */
  --accent-glow:   rgba(139, 92, 246, 0.32);

  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --sh-2: 0 2px 8px -2px rgba(0, 0, 0, 0.5);
  --sh-3: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
  --sh-4: 0 20px 48px -12px rgba(0, 0, 0, 0.7);
  --sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* --- Accent palettes -------------------------------------------------------
   Set data-accent on a view (or any container) and everything inside re-tints.
   -------------------------------------------------------------------------- */
[data-accent="violet"] { --accent:#6d28d9; --accent-hover:#5b21b6; --accent-ink:#6d28d9; --accent-soft:#f5f3ff; --accent-border:#ddd6fe; --accent-glow:rgba(109,40,217,.28); --accent-on:#ffffff; }
[data-accent="indigo"] { --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-border:#c7d2fe; --accent-glow:rgba(79,70,229,.28); --accent-on:#ffffff; }
[data-accent="blue"]   { --accent:#2563eb; --accent-hover:#1d4ed8; --accent-ink:#1d4ed8; --accent-soft:#eff6ff; --accent-border:#bfdbfe; --accent-glow:rgba(37,99,235,.28); --accent-on:#ffffff; }
[data-accent="teal"]   { --accent:#0f766e; --accent-hover:#0c5f59; --accent-ink:#0f766e; --accent-soft:#f0fdfa; --accent-border:#99f6e4; --accent-glow:rgba(13,148,136,.28); --accent-on:#ffffff; }
[data-accent="green"]  { --accent:#047857; --accent-hover:#036347; --accent-ink:#047857; --accent-soft:#ecfdf5; --accent-border:#a7f3d0; --accent-glow:rgba(5,150,105,.28); --accent-on:#ffffff; }
[data-accent="amber"]  { --accent:#d97706; --accent-hover:#b45309; --accent-ink:#b45309; --accent-soft:#fffbeb; --accent-border:#fde68a; --accent-glow:rgba(217,119,6,.30); --accent-on:#1c1200; }
[data-accent="orange"] { --accent:#c2410c; --accent-hover:#9c340a; --accent-ink:#c2410c; --accent-soft:#fff7ed; --accent-border:#fed7aa; --accent-glow:rgba(234,88,12,.30); --accent-on:#ffffff; }
[data-accent="rose"]   { --accent:#e11d48; --accent-hover:#be123c; --accent-ink:#be123c; --accent-soft:#fff1f2; --accent-border:#fecdd3; --accent-glow:rgba(225,29,72,.28); --accent-on:#ffffff; }

body.dark [data-accent="violet"] { --accent:#8b5cf6; --accent-hover:#a78bfa; --accent-ink:#c4b5fd; --accent-soft:rgba(139,92,246,.16); --accent-border:rgba(139,92,246,.32); --accent-glow:rgba(139,92,246,.34); --accent-on:#0b0518; }
body.dark [data-accent="indigo"] { --accent:#6366f1; --accent-hover:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(99,102,241,.16); --accent-border:rgba(99,102,241,.32); --accent-glow:rgba(99,102,241,.34); --accent-on:#05041a; }
body.dark [data-accent="blue"]   { --accent:#3b82f6; --accent-hover:#60a5fa; --accent-ink:#93c5fd; --accent-soft:rgba(59,130,246,.16); --accent-border:rgba(59,130,246,.32); --accent-glow:rgba(59,130,246,.34); --accent-on:#08172e; }
body.dark [data-accent="teal"]   { --accent:#14b8a6; --accent-hover:#2dd4bf; --accent-ink:#5eead4; --accent-soft:rgba(20,184,166,.16); --accent-border:rgba(20,184,166,.32); --accent-glow:rgba(20,184,166,.34); --accent-on:#04201c; }
body.dark [data-accent="green"]  { --accent:#10b981; --accent-hover:#34d399; --accent-ink:#6ee7b7; --accent-soft:rgba(16,185,129,.16); --accent-border:rgba(16,185,129,.32); --accent-glow:rgba(16,185,129,.34); --accent-on:#032018; }
body.dark [data-accent="amber"]  { --accent:#f59e0b; --accent-hover:#fbbf24; --accent-ink:#fcd34d; --accent-soft:rgba(245,158,11,.16); --accent-border:rgba(245,158,11,.32); --accent-glow:rgba(245,158,11,.34); --accent-on:#1c1200; }
body.dark [data-accent="orange"] { --accent:#f97316; --accent-hover:#fb923c; --accent-ink:#fdba74; --accent-soft:rgba(249,115,22,.16); --accent-border:rgba(249,115,22,.32); --accent-glow:rgba(249,115,22,.34); --accent-on:#200d02; }
body.dark [data-accent="rose"]   { --accent:#f43f5e; --accent-hover:#fb7185; --accent-ink:#fda4af; --accent-soft:rgba(244,63,94,.16); --accent-border:rgba(244,63,94,.32); --accent-glow:rgba(244,63,94,.34); --accent-on:#2b0410; }

/* ==========================================================================
   2. BASE & RESET
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  background-color: var(--bg);
  overscroll-behavior: none;
  /* Stops iOS from letting a double-tap zoom the whole app. */
  touch-action: manipulation;
}

/* Two viewport-locked gradient layers that cross-fade. The original design
   animated `background-position` across a 400%-wide gradient, repainting the
   whole viewport every frame for as long as the app was open; animating
   `opacity` on a fixed layer is composited on the GPU instead. Keeping the
   gradients off `body` also avoids `background-attachment: fixed`, which
   repaints on every scroll frame on mobile. */
body::before,
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}
body::before { background: linear-gradient(155deg, #f5f3ff 0%, #eef2ff 38%, #f8fafc 70%, #ecfeff 100%); }
body::after  { background: linear-gradient(155deg, #ecfeff 0%, #f8fafc 34%, #eef2ff 68%, #f5f3ff 100%);
               animation: bgDrift 18s var(--ease-in-out) infinite alternate;
               will-change: opacity; }
body.dark::before { background: linear-gradient(155deg, #131c33 0%, #0f172a 40%, #17123a 72%, #0b1224 100%); }
body.dark::after  { background: linear-gradient(155deg, #0b1224 0%, #17123a 32%, #0f172a 68%, #131c33 100%); }

@keyframes bgDrift { from { opacity: 0; } to { opacity: 1; } }

.hidden { display: none !important; }

h1, h2, h3, h4 { margin: 0; line-height: var(--lh-tight); color: var(--text-strong); font-weight: 800; }
p { margin: 0; }

/* Scrollbars — visible enough to orient, quiet enough to ignore. */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); }

::selection { background: var(--accent); color: var(--accent-on); }

/* ==========================================================================
   3. APP SHELL
   --------------------------------------------------------------------------
   A three-row grid: header / scrolling main / nav. The nav is a grid row
   rather than a fixed overlay, so content can never end up hidden behind it —
   which is what used to clip the Wordle keyboard and the player lists.
   ========================================================================== */
.shell {
  position: relative;
  width: 100%;
  max-width: var(--shell-max);
  margin-inline: auto;
  height: 100vh;
  height: 100dvh;
  /* The window's real height, kept by syncAppHeight in JS_Core.html. iOS goes
     on reporting the old 100dvh for a moment after the phone turns, which left
     a landscape screen laid out at portrait height - half of it off screen,
     with nothing to scroll. */
  height: var(--app-h, 100dvh);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

/* Rows are pinned. The room banner is display:none most of the time, and with
   nothing placed explicitly the main area slid up into the banner's auto row
   and the nav into the 1fr one: a stretched nav on short screens, and on long
   ones a nav pushed off the bottom. */
.shell__header      { grid-row: 1; }
.active-room-banner { grid-row: 2; }
.shell__main        { grid-row: 3; }
.shell__nav         { grid-row: 4; }

/* --- Header --- */
.shell__header {
  display: grid;
  grid-template-columns: var(--tap) 1fr var(--tap);
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--header-h);
  padding: var(--safe-top) var(--sp-3) 0;
  position: relative;
  z-index: 20;
}

.shell__title {
  grid-column: 2;
  text-align: center;
  font-size: var(--fs-h2);
  font-weight: 800;
  color: var(--text-strong);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity var(--dur-2) var(--ease-out);
}

/* The title cross-fades on navigation so it doesn't pop. */
.shell__title.is-swapping { opacity: 0; }

/* --- Active Room Banner --- */
.active-room-banner {
  margin: 0 var(--sp-3) var(--sp-2);
  padding: 8px var(--sp-3);
  background: linear-gradient(135deg, rgba(13, 148, 136, 0.18), rgba(99, 102, 241, 0.16));
  border: 1px solid rgba(20, 184, 166, 0.38);
  box-shadow: 0 4px 16px -2px rgba(13, 148, 136, 0.22);
  border-radius: var(--r-lg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  z-index: 25;
  animation: slideDownFade 0.25s var(--ease-out);
}

@keyframes slideDownFade {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.arb__content {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  cursor: pointer;
  flex: 1;
}

.arb__badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(13, 148, 136, 0.25);
  border: 1px solid rgba(20, 184, 166, 0.45);
  padding: 2px 8px;
  border-radius: var(--r-full);
  flex-shrink: 0;
}

.arb__pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  animation: arbPulse 1.8s infinite;
  flex-shrink: 0;
}

@keyframes arbPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  }
  70% {
    box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
  }
}

.arb__code {
  font-family: var(--font-mono, monospace);
  font-weight: 800;
  letter-spacing: 1.5px;
  font-size: var(--fs-xs);
  color: var(--text-strong);
}

.arb__desc {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.arb__actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.arb__btn {
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  font-size: var(--fs-xs);
  border-radius: var(--r-md);
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.arb__btn--return {
  /* The token pair, not white on teal-600: that was 3.7:1 for 12px text. */
  background: var(--success-btn);
  color: var(--success-on);
  padding: 5px 12px;
  min-height: 36px;
  box-shadow: 0 2px 8px rgba(13, 148, 136, 0.35);
}

.arb__btn--return:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(13, 148, 136, 0.5);
}

.arb__btn--return:active {
  transform: translateY(0);
}

.arb__arrow {
  font-size: 1.1em;
  line-height: 1;
}

.arb__btn--leave {
  background: var(--danger-soft);
  color: var(--danger-ink);
  border: 1px solid var(--danger);
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--r-full);
  font-size: 13px;
}

.arb__btn--leave:hover { filter: brightness(0.95); }

/* --- Main scroll area --- */
.shell__main {
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding: var(--sp-2) var(--sp-4) var(--sp-6);
  scrollbar-gutter: stable;
  /* A column so a view can claim the leftover height when it needs to (see
     .view--fill); short views keep their natural height and don't stretch. */
  display: flex;
  flex-direction: column;
}
.shell__main > [id^="view-"]:not(.hidden) { flex: 1 0 auto; }

/* Opt-in: the view becomes a flex column whose child fills the viewport. Used
   by screens that must fit exactly — a board plus a keyboard, a full-height
   timer — rather than scroll. */
.view--fill { display: flex; flex-direction: column; }
.view--fill > * { flex: 1; min-height: 0; }

/* --- Bottom nav --- */
.shell__nav {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
  min-height: var(--nav-h);
  padding: var(--sp-2) var(--sp-3) calc(var(--sp-2) + var(--safe-bottom));
  background: var(--surface);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-top: 1px solid var(--border);
  z-index: 20;
}

.nav-item {
  flex: 1;
  min-height: var(--tap);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  border: 0;
  border-radius: var(--r-md);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out),
              color var(--dur-2) var(--ease-out),
              transform var(--dur-1) var(--ease-out);
}
.nav-item:active { transform: scale(var(--press-scale)); }
.nav-item.is-active { background: var(--accent-soft); color: var(--accent-ink); }
.nav-icon { font-size: 1.15rem; line-height: 1; }
.nav-label { line-height: 1; }

/* --- Icon button (header actions, compact controls) --- */
.iconbtn {
  width: var(--tap);
  height: var(--tap);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font);
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--sh-1);
  transition: transform var(--dur-1) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              opacity var(--dur-2) var(--ease-out);
}
.iconbtn:active { transform: scale(0.9); }
.iconbtn--plain { background: transparent; border-color: transparent; box-shadow: none; }
.iconbtn[hidden], .iconbtn.is-hidden { visibility: hidden; pointer-events: none; }

/* The back chevron points the way the language reads. */
.iconbtn--back .chev { display: inline-block; font-size: 1.5rem; line-height: 1; margin-top: -3px; }
[dir="rtl"] .iconbtn--back .chev { transform: scaleX(-1); }

/* --- Sync dot --- */
#sync-status {
  position: fixed;
  top: calc(var(--safe-top) + 6px);
  inset-inline-start: 8px;
  width: 7px; height: 7px;
  border-radius: 50%;
  z-index: 60;
  opacity: 0;
  transition: opacity var(--dur-2) var(--ease-out);
}
#sync-status.syncing {
  opacity: 1;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  animation: syncPulse 1.1s var(--ease-in-out) infinite;
}
@keyframes syncPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.6); opacity: 0.45; }
}

/* ==========================================================================
   4. MOTION
   ========================================================================== */

/* --- View transitions -----------------------------------------------------
   Direction-aware: going deeper slides in from the reading-trailing edge,
   going back from the leading edge. JS removes the class on animationend so
   no transform is left behind (a lingering transform would make the view a
   containing block for its position:fixed children).
   -------------------------------------------------------------------------- */
.view-enter {
  animation: viewEnter var(--dur-3) var(--ease-out) both;
}
.view-enter-back { --view-slide: -26px; }
.view-enter-fwd  { --view-slide: 26px; }
[dir="rtl"] .view-enter-back { --view-slide: 26px; }
[dir="rtl"] .view-enter-fwd  { --view-slide: -26px; }

@keyframes viewEnter {
  from { opacity: 0; transform: translate3d(var(--view-slide, 0), 6px, 0) scale(0.985); }
  to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}

/* Children of an entering view rise in sequence — the thing that makes a
   screen feel composed rather than pasted in. */
.view-stagger > * {
  animation: riseIn var(--dur-3) var(--ease-out) both;
}
.view-stagger > *:nth-child(1) { animation-delay: 20ms; }
.view-stagger > *:nth-child(2) { animation-delay: 60ms; }
.view-stagger > *:nth-child(3) { animation-delay: 100ms; }
.view-stagger > *:nth-child(4) { animation-delay: 140ms; }
.view-stagger > *:nth-child(5) { animation-delay: 180ms; }
.view-stagger > *:nth-child(n+6) { animation-delay: 210ms; }

@keyframes riseIn {
  from { opacity: 0; transform: translate3d(0, 10px, 0); }
  to   { opacity: 1; transform: none; }
}

/* --- Press feedback ------------------------------------------------------ */
.pressable {
  cursor: pointer;
  touch-action: manipulation;
  transition: transform var(--dur-1) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out);
}
.pressable:active { transform: scale(var(--press-scale)); }

/* --- Named keyframes reused across games -------------------------------- */
@keyframes pop {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.04); opacity: 1; }
  100% { transform: scale(1); }
}
.animate-pop { animation: pop var(--dur-2) var(--ease-spring) both; }

@keyframes flip {
  0%   { transform: rotateX(0); }
  50%  { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}
.animate-flip { animation: flip var(--dur-4) var(--ease-in-out); }

@keyframes flipFast { from { transform: rotateY(0); } to { transform: rotateY(720deg); } }
.animate-flip-fast { animation: flipFast 0.8s var(--ease-in-out); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px) rotate(-1.5deg); }
  40% { transform: translateX(6px) rotate(1.5deg); }
  60% { transform: translateX(-4px) rotate(-1deg); }
  80% { transform: translateX(3px) rotate(0.5deg); }
}
.animate-shake { animation: shake 0.45s var(--ease-in-out) both; }

@keyframes diceRoll {
  0%   { transform: translateY(0) rotate(0) scale(1); }
  25%  { transform: translateY(-38px) rotate(200deg) scale(1.12); }
  50%  { transform: translateY(-56px) rotate(400deg) scale(1.18); }
  75%  { transform: translateY(-22px) rotate(590deg) scale(1.08); }
  100% { transform: translateY(0) rotate(720deg) scale(1); }
}
.animate-roll { animation: diceRoll 0.65s var(--ease-out) forwards; }

@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.animate-spin-slow { animation: spin 0.55s linear infinite; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.animate-fade-in { animation: fadeIn var(--dur-3) var(--ease-out) both; }

@keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.animate-pulse { animation: pulseSoft 1.8s var(--ease-in-out) infinite; }

/* Theme switching is scoped to this class, which JS adds for the length of
   the cross-fade only. It used to live in the `*` rule, putting a live
   transition on every element in the document including all 36 views. */
body.theme-transition,
body.theme-transition *:not(#app-loader):not(#app-loader *) {
  transition: background-color var(--dur-3) var(--ease-out),
              color var(--dur-3) var(--ease-out),
              border-color var(--dur-3) var(--ease-out) !important;
}

/* ==========================================================================
   5. BUTTONS
   --------------------------------------------------------------------------
   One .btn base, three visual tiers, three sizes. Tier carries importance;
   colour comes from the surrounding accent unless a semantic tier is used.
   ========================================================================== */
.btn {
  --btn-h: 48px;
  position: relative;
  width: 100%;
  min-height: var(--btn-h);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0 var(--sp-5);
  border: 1px solid transparent;
  border-radius: var(--r-md);
  font-family: var(--font);
  font-size: var(--fs-h3);
  font-weight: 800;
  line-height: 1;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition: transform var(--dur-1) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out),
              opacity var(--dur-2) var(--ease-out);
}
.btn:active { transform: scale(var(--press-scale)); }
.btn:disabled, .btn[disabled] { opacity: 0.45; pointer-events: none; }

/* Sizes */
.btn--lg { --btn-h: 54px; font-size: 1.0625rem; }
.btn--sm { --btn-h: 42px; font-size: var(--fs-sm); padding: 0 var(--sp-4); border-radius: var(--r-sm); }
.btn--xs { --btn-h: 40px; min-width: 40px; font-size: var(--fs-xs); padding: 0 var(--sp-3); border-radius: var(--r-sm); }
.btn--auto { width: auto; }

/* Tier 1 — the one action the screen exists for */
.btn--primary {
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 6px 18px -6px var(--accent-glow), var(--sh-inset);
}
.btn--primary:active { box-shadow: 0 2px 8px -4px var(--accent-glow); }

/* Tier 2 — supporting actions, same hue at low weight */
.btn--secondary {
  background: var(--accent-soft);
  color: var(--accent-ink);
  border-color: var(--accent-border);
}

/* Tier 3 — retreat / dismiss */
.btn--ghost {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}
.btn--ghost:active { background: var(--surface-3); }

/* Neutral filled — for controls that aren't the accent action */
.btn--neutral {
  background: var(--surface-solid);
  color: var(--text);
  border-color: var(--border);
  box-shadow: var(--sh-1);
}

/* Semantic tiers */
.btn--success { background: var(--success-btn); color: var(--success-on); box-shadow: 0 6px 18px -6px rgba(5,150,105,.4), var(--sh-inset); }
.btn--danger  { background: var(--danger-btn);  color: var(--danger-on);  box-shadow: 0 6px 18px -6px rgba(225,29,72,.4), var(--sh-inset); }
.btn--warning { background: var(--warning); color: #fff; box-shadow: 0 6px 18px -6px rgba(217,119,6,.4), var(--sh-inset); }
.btn--danger-soft { background: var(--danger-soft); color: var(--danger-ink); border-color: var(--danger); }

/* Icon-only, square */
.btn--icon { width: var(--btn-h); min-width: var(--btn-h); padding: 0; }

/* --- Legacy colour classes ------------------------------------------------
   The old markup picked button colours decoratively (btn-blue, btn-orange…),
   which is why three unrelated actions in a row could end up three different
   colours. Call sites now use the tiers above; these aliases stay as a safety
   net so a class left behind anywhere still renders as a proper button rather
   than as bare text. Colour comes from the screen's accent.
   -------------------------------------------------------------------------- */
.btn-blue, .btn-green, .btn-purple, .btn-orange, .btn-indigo {
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 6px 18px -6px var(--accent-glow), var(--sh-inset);
}
.btn-red {
  background: var(--danger);
  color: #fff;
  box-shadow: 0 6px 18px -6px rgba(225, 29, 72, 0.4), var(--sh-inset);
}
.btn-gray {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}

/* Ripple, painted by JS on pointerdown.
   This has to be a standalone class, not one scoped under .btn: the JS attaches
   ripples to every RIPPLE_TARGETS host (.game-card, .tool-item, .nav-item,
   .setting-row, .key). An unstyled span inside a flex host like .game-card gets
   blockified into a real flex item, takes the width/height the JS sets inline,
   and — with no animation to end — is never cleaned up, so each tap grew the
   tile by ~120px. */
.ripple {
  position: absolute;
  z-index: 0;
  border-radius: 50%;
  transform: scale(0);
  background: currentColor;
  opacity: 0.18;
  pointer-events: none;
  animation: rippleOut 520ms var(--ease-out) forwards;
}
@keyframes rippleOut {
  to { transform: scale(2.4); opacity: 0; }
}

/* Ripple hosts must clip the circle and be a positioning context for it.
   (.btn, .card-like rows and .game-card already set both.) */
.tool-item, .nav-item, .setting-row, .key {
  position: relative;
  overflow: hidden;
}

/* --- Button groups ------------------------------------------------------- */
.btn-row { display: flex; gap: var(--sp-2); }
.btn-row > .btn { flex: 1; }
.btn-stack { display: flex; flex-direction: column; gap: var(--sp-2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }

/* Sticky action bar at the foot of a scrolling view. Replaces the old
   `position: fixed` bars, which were positioned against whichever ancestor
   happened to be transformed. */
.view-actions {
  position: sticky;
  bottom: calc(var(--sp-2) * -1);
  /* No negative inline margin: it made the bar 8px wider than the view, which
     .shell__main then clipped anyway - so it bought nothing and reported as a
     horizontal overflow on every screen that used it. */
  margin: var(--sp-5) 0 0;
  padding: var(--sp-3) 0;
  background: linear-gradient(to top, var(--bg) 42%, transparent);
  z-index: 5;
}

/* ==========================================================================
   6. CARDS, TILES, ROWS
   ========================================================================== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-5);
  margin-bottom: var(--sp-4);
  box-shadow: var(--sh-2), var(--sh-inset);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
}
.card--tight { padding: var(--sp-4); }
.card--flush { padding: 0; overflow: hidden; }
.card--plain { background: var(--surface-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
.card--accent { background: var(--accent-soft); border-color: var(--accent-border); backdrop-filter: none; -webkit-backdrop-filter: none; }
.card > :last-child { margin-bottom: 0; }

/* --- Section heading ---------------------------------------------------- */
.section { margin-bottom: var(--sp-6); }
.section__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: 0 var(--sp-1) var(--sp-3);
}
.section__emoji { font-size: 1.05rem; line-height: 1; }
.section__title {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-2);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
}
.section__rule { flex: 1; height: 1px; background: var(--border); border-radius: var(--r-full); }

/* --- Card title inside a view ------------------------------------------- */
.card__title {
  font-size: var(--fs-h2);
  font-weight: 900;
  color: var(--accent-ink);
  text-align: center;
  margin-bottom: var(--sp-2);
}
.card__title--neutral { color: var(--text-strong); }
.card__title--xl { font-size: var(--fs-h1); }

.card__subtitle {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  margin-bottom: var(--sp-5);
  line-height: var(--lh-snug);
}

/* A quiet label sitting above a block of content. */
.eyebrow {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
html[lang="ar"] .eyebrow { text-transform: none; letter-spacing: normal; font-size: var(--fs-sm); }

/* --- Saved-groups picker ------------------------------------------------ */
.group-picker {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}
.group-picker select {
  flex: 1;
  min-width: 0;
  min-height: 48px;
  font-size: var(--fs-sm);
  background: var(--surface-2);
}
.group-picker .iconbtn { flex: none; width: 48px; height: auto; background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-ink); }

/* --- Game tiles (menu grid) --------------------------------------------- */
.game-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: 1fr;          /* every tile matches the tallest in its row */
  gap: var(--sp-2);
}

.game-card {
  position: relative;
  min-height: 96px;
  padding: var(--sp-4) var(--sp-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
  touch-action: manipulation;
  transition: transform var(--dur-2) var(--ease-spring),
              box-shadow var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out);
}
/* A soft wash of the tile's own accent, so the grid reads as colourful
   without 11 competing solid blocks. */
.game-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-soft);
  opacity: 0.85;
  z-index: 0;
  transition: opacity var(--dur-2) var(--ease-out);
}
.game-card > *:not(.ripple) { position: relative; z-index: 1; }
.game-card:active { transform: scale(0.94); box-shadow: var(--sh-1); border-color: var(--accent-border); }
.game-card:active::after { opacity: 1; }

.game-icon {
  font-size: 1.9rem;
  line-height: 1;
  filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.14));
  transition: transform var(--dur-2) var(--ease-spring);
}
.game-card:active .game-icon { transform: scale(1.12) translateY(-2px); }

.game-title {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-strong);
  line-height: var(--lh-snug);
  overflow-wrap: anywhere;
  text-wrap: balance;
  /* Reserve two lines so single- and double-line labels sit at the same
     height and the icons stay on one baseline across the row. */
  min-height: 2.7em;
  display: flex;
  align-items: center;
}

/* --- Tools list --------------------------------------------------------- */
.tools-list { display: flex; flex-direction: column; gap: var(--sp-2); }

.tool-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 68px;
  padding: var(--sp-3) var(--sp-4);
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  touch-action: manipulation;
  transition: transform var(--dur-2) var(--ease-spring),
              border-color var(--dur-2) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out);
}
.tool-item:active { transform: scale(0.975); border-color: var(--accent-border); box-shadow: var(--sh-2); }

.tool-icon {
  flex: none;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.35rem;
  border-radius: var(--r-sm);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tool-info { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; gap: 2px; }
.tool-name { font-size: var(--fs-h3); font-weight: 800; color: var(--text-strong); line-height: 1.2; }
.tool-desc { font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); line-height: 1.3; }
.tool-chev { margin-inline-start: auto; color: var(--text-3); font-size: 1.25rem; line-height: 1; }
[dir="rtl"] .tool-chev { transform: scaleX(-1); }

/* --- Generic list row --------------------------------------------------- */
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 56px;
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}
.row + .row { margin-top: var(--sp-2); }
.row--interactive { cursor: pointer; touch-action: manipulation; transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out); }
.row--interactive:active { transform: scale(0.985); border-color: var(--accent-border); }
.row--active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 16px -8px var(--accent-glow); }
.row__body { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.row__title { font-size: var(--fs-h3); font-weight: 800; color: var(--text-strong); }
.row__meta { font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); }
.row__trail { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-2); }

/* --- Chips -------------------------------------------------------------- */
.chip-set { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  height: 40px;
  padding-block: 0;
  padding-inline: var(--sp-3) var(--sp-1);
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  border: 1px solid var(--accent-border);
  font-size: var(--fs-sm);
  font-weight: 800;
  max-width: 100%;
}
.chip--plain { background: var(--surface-3); color: var(--text); border-color: var(--border); padding-inline-end: var(--sp-3); }

/* --- Player picker -------------------------------------------------------
   The saved names, as chips you tap to put someone in the round. Typing a
   name is for someone new; everyone you already play with is one tap.
   -------------------------------------------------------------------------- */
.picker__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.picker__head .eyebrow { margin: 0; flex: 1; }
.picker__edit {
  flex: none;
  min-height: 40px;
  /* "تم" / "Done" is short enough that padding alone left it under the 40px
     tap floor the rest of the app holds to. */
  min-width: 56px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-2);
  font-family: var(--font);
  font-size: var(--fs-xs);
  font-weight: 800;
  cursor: pointer;
}
.picker__edit.is-on { background: var(--danger-soft); color: var(--danger-ink); border-color: var(--danger); }

.pick-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 44px;
  padding-inline: var(--sp-4);
  border-radius: var(--r-full);
  border: 1.5px solid var(--border);
  background: var(--surface-solid);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  max-width: 100%;
  transition: transform var(--dur-1) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out),
              color var(--dur-2) var(--ease-out);
}
.pick-chip:active { transform: scale(0.94); }
/* In the round. The tick carries the meaning as well as the colour, so it
   still reads for anyone who cannot separate the two. */
.pick-chip.is-on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
}
.pick-chip__tick { font-size: 0.9em; }
.pick-chip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Dashed, because it makes something rather than selecting something. */
.pick-chip--add {
  border-style: dashed;
  border-color: var(--accent-border);
  color: var(--accent-ink);
  background: transparent;
}

/* Edit mode: every chip becomes a delete. */
.pick-chip--del {
  background: var(--danger-soft);
  border-color: var(--danger);
  color: var(--danger-ink);
}

/* Four rows. Measured against a forty-name library: at this height the Start
   button still sits on the first screen for six of the seven setup screens
   (Imposter has three more fields above it and scrolls either way). Taller and
   the button everyone presses every time drops below the fold. */
.picker__chips {
  max-height: 216px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 2px;
  margin: -2px;
}
/* Only fades when there is actually more below, so a short list looks flat. */
.picker__chips.is-scrollable {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
          mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
}

.picker__count {
  margin-top: var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--text-2);
}
.picker__count b { color: var(--text-strong); }
.picker__empty {
  padding: var(--sp-4);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-md);
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip__remove {
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  opacity: 0.6;
  font-family: var(--font);
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.chip__remove:active { transform: scale(0.85); background: var(--danger-soft); color: var(--danger); opacity: 1; }

/* --- Badge -------------------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 var(--sp-2);
  border-radius: var(--r-full);
  background: var(--surface-3);
  color: var(--text-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  white-space: nowrap;
}
.badge--accent  { background: var(--accent-soft);  color: var(--accent-ink); }
.badge--success { background: var(--success-soft); color: var(--success-ink); }
.badge--danger  { background: var(--danger-soft);  color: var(--danger-ink); }
.badge--warning { background: var(--warning-soft); color: var(--warning-ink); }

/* --- Metrics (scores, timers) ------------------------------------------- */
.metric {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
  font-weight: 900;
  line-height: 1;
  color: var(--text-strong);
  letter-spacing: -0.02em;
}
.metric--xl { font-size: 3.25rem; }
.metric--lg { font-size: var(--fs-display); }
.metric--md { font-size: 1.75rem; }
.metric--accent { color: var(--accent-ink); }

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.stat__label { font-size: var(--fs-xs); font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }

/* --- Play header (whose turn + the clock) ------------------------------- */
.play-head {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}
.play-head__turn { flex: 1; min-width: 0; }
.play-head__name {
  font-size: 1.75rem;
  font-weight: 900;
  line-height: 1.1;
  color: var(--accent-ink);
  overflow-wrap: anywhere;
}
.play-head__clock {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
}
.play-head__clock-actions { display: flex; gap: var(--sp-1); }

/* --- Player status row (monkey board) ----------------------------------- */
.status-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 60px;
  padding: var(--sp-2) var(--sp-4);
  margin-bottom: var(--sp-2);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.status-row--turn {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -10px var(--accent-glow);
}
.status-row--out { opacity: 0.55; }
.status-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.status-row__name {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-h3);
  font-weight: 800;
  color: var(--text-strong);
}
.status-row__actions { flex: none; display: flex; align-items: center; gap: var(--sp-1); }
.status-row__tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); }

/* Round picker + dealer badge above a scoreboard. */
.round-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.round-bar select {
  width: auto;
  flex: none;
  min-height: var(--tap);
  font-size: var(--fs-sm);
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: var(--accent-border);
}
.round-bar .badge { margin-inline-start: auto; }

/* --- Empty state -------------------------------------------------------- */
.empty {
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-lg);
  color: var(--text-3);
  font-size: var(--fs-sm);
  font-weight: 700;
}
.empty__icon { display: block; font-size: 1.6rem; margin-bottom: var(--sp-2); opacity: 0.7; }

/* ==========================================================================
   7. FORMS
   ========================================================================== */
.field { margin-bottom: var(--sp-4); }
.field__label {
  display: block;
  margin: 0 var(--sp-1) var(--sp-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.field__hint { margin: var(--sp-2) var(--sp-1) 0; font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); line-height: 1.4; }

input, select, textarea {
  width: 100%;
  min-height: 48px;
  padding: 0 var(--sp-4);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text);
  font-family: var(--font);
  /* 16px keeps iOS Safari from zooming the page when a field is focused. */
  font-size: 1rem;
  font-weight: 700;
  transition: border-color var(--dur-2) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out),
              background-color var(--dur-2) var(--ease-out);
  -webkit-appearance: none;
  appearance: none;
}
input::placeholder { color: var(--text-3); font-weight: 600; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="number"] { text-align: center; }
input[type="checkbox"] {
  width: 22px; height: 22px;
  min-height: 0;
  padding: 0;
  border-radius: 6px;
  accent-color: var(--accent);
  flex: none;
}

select {
  padding-inline-end: var(--sp-8);
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
                    linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}
[dir="rtl"] select {
  background-position: calc(var(--sp-5) - 3px) calc(50% + 1px), var(--sp-5) calc(50% + 1px);
}
[dir="ltr"] select {
  background-position: calc(100% - var(--sp-5)) calc(50% + 1px), calc(100% - var(--sp-5) + 5px) calc(50% + 1px);
}

/* --- Input + button pair ------------------------------------------------ */
.input-group { display: flex; gap: var(--sp-2); align-items: stretch; }
.input-group > input { flex: 1; min-width: 0; }
.input-group > .btn { width: 48px; min-width: 48px; flex: none; padding: 0; }

/* --- Stepper (numeric ± ) ---------------------------------------------- */
.stepper {
  display: grid;
  grid-template-columns: var(--tap) 1fr var(--tap);
  align-items: center;
  gap: var(--sp-1);
  padding: var(--sp-1);
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.stepper__btn {
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center;
  border: 0;
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  color: var(--accent-ink);
  box-shadow: var(--sh-1);
  font-family: var(--font);
  font-size: 1.25rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}
.stepper__btn:active { transform: scale(0.88); background: var(--accent-soft); }
.stepper__value { text-align: center; font-size: var(--fs-h2); font-weight: 900; font-variant-numeric: tabular-nums; color: var(--text-strong); }

/* --- Segmented control -------------------------------------------------- */
.segmented {
  /* Full width by default: as a centred flex child it would otherwise collapse
     to its content, which is what shrank the dice-count pair to 24px. */
  width: 100%;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.segmented__item {
  flex: 1;
  min-height: 42px;
  display: grid; place-items: center;
  border: 0;
  border-radius: calc(var(--r-md) - 4px);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.segmented__item.is-active { background: var(--surface-solid); color: var(--accent-ink); box-shadow: var(--sh-1); }

/* --- Selectable player rows (checkbox lists) ---------------------------- */
.player-check-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 52px;
  padding: var(--sp-2) var(--sp-4);
  margin-bottom: var(--sp-2);
  background: var(--surface-solid);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.player-check-item:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.player-check-item span { font-weight: 800; color: var(--text-strong); }

/* Toggle switch knob (who-am-I shuffle) */
.dot { transition: transform var(--dur-2) var(--ease-spring); }

/* ==========================================================================
   8. SHEETS, MODALS, TOASTS
   ========================================================================== */
/* Every popup is a centred dialog, on phones too. As a bottom sheet it sat
   under the bottom nav on iPhone; centred it is plainly a question, and the
   overlay's padding keeps it clear of notches and the home indicator. Overlays
   are moved under <body> at start-up (hoistModals in JS_Core.html), so no part
   of the page can trap one or draw over it. */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: max(var(--sp-4), var(--safe-top)) max(var(--sp-4), var(--safe-right))
           max(var(--sp-4), var(--safe-bottom)) max(var(--sp-4), var(--safe-left));
  background: rgba(2, 6, 23, 0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: overlayIn var(--dur-2) var(--ease-out) both;
}
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

#alert-modal { z-index: 200; }
#custom-confirm-modal { z-index: 250; }

/* The dialog. Sheets with a header, a scrolling body and a footer (help,
   settings) keep those pinned and get the wider column; everything else is a
   simple dialog that scrolls as one block. */
.modal-content {
  position: relative;
  width: 100%;
  max-width: 440px;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  padding: 0;
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  box-shadow: var(--sh-4);
  text-align: center;
  overflow: hidden;
  animation: dialogIn var(--dur-3) var(--ease-out) both;
}
.modal-content:has(> .sheet__body) { max-width: var(--shell-max); }
@keyframes dialogIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

.sheet__header {
  flex: none;
  padding: var(--sp-6) var(--sp-5) var(--sp-3);
  border-bottom: 1px solid var(--hairline);
}
.sheet__title { font-size: var(--fs-h1); font-weight: 900; color: var(--text-strong); }
.sheet__subtitle { margin-top: var(--sp-1); font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); line-height: 1.5; }

.sheet__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: var(--sp-4) var(--sp-5);
  text-align: start;
}

.sheet__footer {
  flex: none;
  padding: var(--sp-3) var(--sp-5) var(--sp-4);
  border-top: 1px solid var(--hairline);
  background: var(--elevated);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

/* Simple dialogs: one rhythm for everything inside - icon, title, text,
   fields, lists and buttons are spaced by the gap alone, so no two dialogs
   drift apart the way the old utility margins (mb-4 in one, mb-8 in the
   next) made them. Build a new one from these pieces:
     .modal-icon  .sheet__title  .sheet__subtitle  fields  .modal-list
     .modal-actions (the buttons, main action first). */
.modal-content--simple {
  padding: var(--sp-6) var(--sp-5) var(--sp-5);
  gap: var(--sp-3);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.modal-content--simple > * { margin: 0; }
.modal-content--simple > .modal-actions { margin-top: var(--sp-2); }
.modal-icon { font-size: 2.75rem; line-height: 1.1; }
.modal-actions { display: flex; flex-direction: column; gap: var(--sp-2); }
.modal-list { max-height: min(45dvh, 320px); overflow-y: auto; overscroll-behavior: contain; text-align: start; }
.modal-plate { padding: var(--sp-4); border-radius: var(--r-lg); }
.modal-well { background: var(--surface-3); border: 1px solid var(--border); }
.modal-section { display: flex; flex-direction: column; gap: var(--sp-2); text-align: start; }
.modal-section > * { margin: 0; }
.modal-steps { text-align: start; }
.modal-close { position: absolute; top: var(--sp-2); inset-inline-end: var(--sp-2); }
.modal-divider { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-xs); font-weight: 700; color: var(--text-3); }
.modal-divider::before, .modal-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Fields that hold one big number (points, minutes, a guess). */
.field-big { font-size: 1.5rem; font-weight: 900; text-align: center; }
.field-error { font-size: var(--fs-xs); font-weight: 700; color: var(--danger); }
.field-error:empty { display: none; }
.input-group > select { flex: 1; min-width: 0; }
.input-group > .iconbtn { width: 48px; height: auto; flex: none; }

/* Full-screen tools (chess clock, reaction duel) cover the whole screen: the
   header, room banner and nav step aside while one is showing. On iPhone a
   fixed view inside the scrolling main area is drawn inside it, so hiding them
   is what makes the tool really full screen there. */
body.is-fullscreen-view .shell__header,
body.is-fullscreen-view .active-room-banner,
body.is-fullscreen-view .shell__nav { display: none !important; }

/* --- Settings sheet rows ------------------------------------------------ */
.setting-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: 56px;
  padding: var(--sp-2) var(--sp-3);
  border: 0;
  border-radius: var(--r-md);
  background: transparent;
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-h3);
  font-weight: 800;
  text-align: start;
  cursor: pointer;
  transition: background-color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.setting-row:active { background: var(--surface-3); transform: scale(0.985); }
.setting-row__icon {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  font-size: 1.1rem;
}
.setting-row__value { margin-inline-start: auto; font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); }

/* --- Toast -------------------------------------------------------------- */
.toast {
  position: fixed;
  inset-inline: var(--sp-4);
  bottom: calc(var(--nav-h) + var(--safe-bottom) + var(--sp-3));
  z-index: 400;
  max-width: calc(var(--shell-max) - var(--sp-8));
  margin-inline: auto;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  background: var(--n-900);
  color: #fff;
  font-size: var(--fs-sm);
  font-weight: 700;
  box-shadow: var(--sh-4);
  opacity: 0;
  transform: translateY(14px) scale(0.97);
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-3) var(--ease-spring);
  pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
body.dark .toast { background: var(--n-700); }
.toast.success { background: var(--success); }
.toast.error   { background: var(--danger); }
.toast.info    { background: var(--info); }

/* ==========================================================================
   9. GAME-SPECIFIC
   ========================================================================== */

/* --- Loader ------------------------------------------------------------- */
#app-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-4);
  background: var(--bg);
  transition: opacity var(--dur-4) var(--ease-out);
}

/* --- Screw ------------------------------------------------------------- */
.screw-card {
  background: var(--surface-solid);
  color: var(--text);
  border: 1px solid var(--border) !important;
  border-radius: var(--r-md);
}
.screw-name-text { color: var(--text-strong) !important; font-weight: 800; }
.score-input {
  flex: none;
  width: 76px;
  min-height: var(--tap);
  padding-inline: var(--sp-2);
  font-size: 1.15rem;
  text-align: center;
  background: var(--surface-3) !important;
  color: var(--text) !important;
  border-color: var(--border) !important;
}

/* --- Teams ------------------------------------------------------------- */
.team-card-bg { background: var(--surface-solid) !important; border: 1px solid var(--border) !important; border-radius: var(--r-lg); overflow: hidden; }
.team-text-color { color: var(--text-strong) !important; }
.team-divider { border-bottom: 1px solid var(--hairline) !important; }

/* --- Help / rules ------------------------------------------------------ */
/* --- Help sheet ---------------------------------------------------------
   Three parts: the card for the screen you pressed ❓ from, a search field,
   and the full list. The context card is the point — pressing help during a
   game should answer the question you have, not hand you the manual.
   -------------------------------------------------------------------------- */

/* The card for the screen you came from. Filled in that game's own accent so
   it reads as "this one", not as the first item of the list. */
.help-hero {
  position: relative;
  margin-bottom: var(--sp-4);
  padding: var(--sp-4);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-lg);
}
.help-hero__head {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}
.help-hero__icon {
  flex: none;
  width: 46px; height: 46px;
  display: grid; place-items: center;
  font-size: 1.5rem;
  background: var(--surface-solid);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-md);
}
.help-hero__meta { flex: 1; min-width: 0; }
.help-hero__eyebrow {
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--accent-ink);
  margin-bottom: 2px;
}
.help-hero__title {
  font-size: var(--fs-h2);
  font-weight: 900;
  color: var(--text-strong);
  line-height: 1.2;
}
.help-hero__body { color: var(--text); line-height: var(--lh-body); }
.help-hero__body ol, .help-hero__body ul { margin: 0; padding-inline-start: var(--sp-5); }
.help-hero__body li + li { margin-top: var(--sp-2); }
.help-hero__body b { color: var(--text-strong); }

/* "Also plays on separate phones" and friends — a jump to a related entry. */
.help-jump {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  min-height: 40px;
  padding: 0 var(--sp-3);
  background: var(--surface-solid);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-full);
  color: var(--accent-ink);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
}
.help-jump:active { transform: scale(0.97); }

/* --- Search --- */
.help-search {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: var(--sp-3);
}
.help-search__icon {
  position: absolute;
  inset-inline-start: var(--sp-3);
  font-size: 0.95rem;
  opacity: 0.6;
  pointer-events: none;
}
.help-search input {
  margin: 0;
  padding-inline-start: var(--sp-8);
  padding-inline-end: var(--sp-9);
}
.help-search__clear {
  position: absolute;
  inset-inline-end: 4px;
  /* The app's tap-target floor is 40px and this sits inside a 48px field. */
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 0;
  border-radius: var(--r-full);
  background: var(--surface-3);
  color: var(--text-2);
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
}

/* --- The list --- */
.help-game-card {
  background: var(--surface-solid) !important;
  border: 1px solid var(--border) !important;
  /* A stripe of the game's own accent, so the list is scannable by colour. */
  border-inline-start: 3px solid var(--accent) !important;
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color var(--dur-2) var(--ease-out);
}
.help-game-card + .help-game-card { margin-top: var(--sp-2); }
.help-game-card[open] { border-color: var(--accent-border) !important; }

.help-game-card summary {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 56px;
  padding: var(--sp-2) var(--sp-3);
  cursor: pointer;
  font-weight: 800;
  color: var(--text-strong);
  list-style: none;
}
.help-game-card summary::-webkit-details-marker { display: none; }
.help-game-card summary:active { background: var(--accent-soft); }

.help-game-card__icon {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: var(--r-sm);
  background: var(--accent-soft);
  font-size: 1.1rem;
}
.help-game-card__name { flex: 1; min-width: 0; }
.help-game-card__chev {
  flex: none;
  color: var(--text-3);
  font-size: 0.9rem;
  transition: transform var(--dur-2) var(--ease-out);
}
.help-game-card[open] .help-game-card__chev { transform: rotate(180deg); }

.help-game-text {
  color: var(--text-2) !important;
  line-height: var(--lh-body);
  animation: riseIn var(--dur-2) var(--ease-out) both;
}
.help-game-text ol, .help-game-text ul { margin: 0; padding-inline-start: var(--sp-5); }
.help-game-text li + li { margin-top: var(--sp-1); }
.help-game-text b { color: var(--text); }

/* Search hit inside a title. */
.help-game-card mark {
  background: var(--warning-soft);
  color: var(--text-strong);
  border-radius: 4px;
  padding: 0 2px;
}

.help-empty {
  padding: var(--sp-8) var(--sp-4);
  text-align: center;
  color: var(--text-2);
}
.help-empty__icon { font-size: 2rem; display: block; margin-bottom: var(--sp-2); }

/* --- Imposter / leaderboard -------------------------------------------- */
.imposter-card, .leaderboard-card {
  background: var(--surface-solid);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.imposter-card { padding: var(--sp-2) var(--sp-3); font-weight: 800; }
.leaderboard-card.winner {
  background: var(--warning-soft);
  border-color: var(--warning);
  color: var(--warning-ink);
}
.leaderboard-name, .leaderboard-rank { color: inherit !important; }

/* --- Wordle ------------------------------------------------------------ */

/* The view fills the shell's main row and hands the leftover height to the
   board, so the keyboard is always fully on screen. Previously the layout was
   h-[90vh] inside a page that also had a fixed nav, and the keyboard's bottom
   row (Enter / Backspace) was simply unreachable. */
.wordle-layout {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.wordle-layout__board {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wordle-grid {
  display: grid;
  gap: var(--sp-1);
  /* Sized by height as much as by width. The cells are square, so a short word
     makes them wide, and six rows of wide cells pushed the Enter key off the
     bottom — on a game where you press Enter every turn. Giving the grid the
     board's own aspect ratio lets it take whichever of the two dimensions runs
     out first, so it fits on an SE as readily as on a tall phone. */
  --wordle-cols: 5;
  --wordle-rows: 6;
  aspect-ratio: var(--wordle-cols) / var(--wordle-rows);
  height: 100%;
  width: auto;
  max-height: 100%;
  max-width: min(330px, 82vw);
  margin: auto;
}
.wordle-row { display: grid; gap: var(--sp-1); }
.wordle-cell {
  aspect-ratio: 1;
  width: 100%;
  min-width: 0;
  display: grid;
  place-items: center;
  border-radius: var(--r-xs);
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--text-strong);
  background: var(--surface-3);
  border: 2px solid transparent;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.wordle-cell--empty { background: transparent; border-color: var(--border); }
.wordle-cell--filled { border-color: var(--border-strong); background: var(--surface-solid); }
/* Same -on tokens the solid buttons use: white on the bright dark-mode warning
   is 2.15:1, which made the "right letter, wrong place" tile unreadable. */
.wordle-cell--correct { background: var(--success-btn); border-color: var(--success-btn); color: var(--success-on); }
.wordle-cell--present { background: var(--warning-btn); border-color: var(--warning-btn); color: var(--warning-on); }
.wordle-cell--absent  { background: var(--n-500); border-color: var(--n-500); color: #fff; }
body.dark .wordle-cell--absent { background: var(--n-700); border-color: var(--n-700); color: #cbd5e1; }

/* Keyboard — every key clears the 44px target on a 375px screen because the
   rows scale with the viewport instead of using fixed widths. */
/* The Arabic layout is 12 keys wide. 44px keys would need a 560px screen, so
   the keypad claims the full width back from the main scroller's padding and
   buys its target area in height instead - which is exactly what the phone's
   own keyboard does. */
.keypad {
  display: flex;
  flex-direction: column;
  gap: 5px;
  /* No negative margin. Pulling the scroller's padding back gained 2px of key
     width and cost a clipped first key, because scrollbar-gutter reserves a
     strip on the inline-end side that the margin then ate into. The target
     area comes from the key height instead, which is free. */
}
.keypad__row { display: flex; gap: 3px; justify-content: center; }
.key {
  flex: 1 1 0;
  min-width: 0;
  height: 54px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--r-xs);
  background: var(--surface-3);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}
.key:active { transform: translateY(1px) scale(0.94); background: var(--accent-soft); }
.key--wide { flex: 1.6 1 0; font-size: 1.05rem; }
.key--correct { background: var(--success-btn); color: var(--success-on); }
.key--present { background: var(--warning-btn); color: var(--warning-on); }
/* Clearly spent, without competing with the correct/present states — but still
   readable: dimming this with opacity took the letter to 2.2:1, so you could
   no longer see which letters you had already ruled out. */
.key--absent  { background: var(--surface-sunken); color: var(--text-2); }

/* --- Spin wheel -------------------------------------------------------- */
.wheel-wrap {
  position: relative;
  width: min(280px, 74vw);
  margin: 0 auto var(--sp-5);
  aspect-ratio: 1;
}
.wheel {
  width: 100%; height: 100%;
  overflow: hidden;
  border-radius: 50%;
  border: 5px solid var(--surface-solid);
  box-shadow: 0 12px 32px -10px rgba(15, 23, 42, 0.35), inset 0 0 0 1px var(--border);
  transition: transform 3.6s cubic-bezier(0.16, 1, 0.24, 1);
  will-change: transform;
}
.wheel__hub {
  position: absolute;
  inset-inline-start: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 54px; height: 54px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--surface-solid);
  box-shadow: var(--sh-2), inset 0 0 0 1px var(--border);
  font-size: 1.35rem;
  z-index: 2;
}
/* The SVG fills the disc; the disc itself carries the border and the spin. */
.wheel > svg { display: block; border-radius: 50%; }

.wheel__needle {
  position: absolute;
  top: -6px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-inline: 11px solid transparent;
  border-top: 20px solid var(--accent);
  filter: drop-shadow(0 2px 3px rgba(15, 23, 42, 0.3));
  z-index: 3;
}

/* --- Tournament bracket ------------------------------------------------ */
.tourney-match-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.bracket-btn {
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: var(--sp-1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  background: var(--surface-solid);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.bracket-btn:active { transform: scale(0.98); }
.bracket-btn.winner { background: var(--success-soft); border-color: var(--success); color: var(--success-ink); }
.bracket-btn.loser  { opacity: 0.45; text-decoration: line-through; }

.tourney-player-input {
  min-height: 48px;
  margin-bottom: var(--sp-2);
  text-align: center;
}

/* --- Reorder list ------------------------------------------------------ */
#reorder-list .reorder-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  min-height: 56px;
  padding: var(--sp-2) var(--sp-4);
  margin-bottom: var(--sp-2);
  background: var(--surface-solid);
  color: var(--text);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
#reorder-list .reorder-item:active { transform: scale(0.985); }
#reorder-list .reorder-item.selected {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
/* The name and the hint follow the accent; the number badge is excluded because
   it has a background of its own — recolouring it put light ink on a light
   plate in dark mode (1.85:1). */
#reorder-list .reorder-item.selected span,
#reorder-list .reorder-item.selected div:not(.reorder-num) { color: var(--accent-ink) !important; }

.reorder-num {
  flex: none;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: var(--r-xs);
  background: var(--surface-3);
  color: var(--text-2);
  font-weight: 900;
  font-size: var(--fs-sm);
}
.reorder-item.selected .reorder-num { background: var(--accent); color: var(--accent-on); }

/* --- Misc game bits ---------------------------------------------------- */
.list-row { background: var(--surface-solid); border-bottom: 1px solid var(--hairline); }
.list-row td { color: var(--text); padding: var(--sp-2); }

.control-btn {
  min-height: 42px;
  min-width: 42px;
  padding: 0 var(--sp-3);
  background: var(--surface-solid);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  font-family: var(--font);
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}
.control-btn:active { transform: scale(0.92); background: var(--surface-3); }
.control-btn--danger { color: var(--danger-ink); border-color: var(--danger); background: var(--danger-soft); }

/* The plate the single-device Imposter reveal sits on. It tints red for the
   spy, which is the one moment the app wants to feel like a jolt. */
.reveal-plate {
  padding: var(--sp-8) var(--sp-5);
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.06);
  transition: background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out);
}
.reveal-plate.is-spy { background: var(--danger-soft); border-color: var(--danger); }

/* A chess clock's idle half still has to be readable across a table - the old
   slate-600-on-slate-900 pairing was under 2:1. */
.chess-half {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--surface-sunken);
  color: var(--text);
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.chess-half--flip { transform: rotate(180deg); }
.chess-half.is-active { background: var(--success); color: #fff; box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.28); }
.chess-half.is-idle   { background: var(--surface-2); color: var(--text-2); }
.chess-half.is-out    { background: var(--danger); color: #fff; }

/* --- Multiplayer rooms --------------------------------------------------- */

/* The code is read out across a table, so it's the biggest thing on the screen
   and spaced like a licence plate. Latin glyphs and LTR even in Arabic. */
.room-code {
  direction: ltr;
  unicode-bidi: isolate;
  font-size: 3rem;
  font-weight: 900;
  letter-spacing: 0.22em;
  text-indent: 0.22em;      /* re-centres text that letter-spacing pushed left */
  line-height: 1.1;
  color: var(--accent-ink);
  margin-bottom: var(--sp-4);
}

.room-code-input {
  direction: ltr;
  text-align: center;
  font-size: 1.75rem;
  font-weight: 900;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  text-transform: uppercase;
}

.room-qr {
  width: min(200px, 56vw);
  margin: 0 auto var(--sp-4);
  padding: var(--sp-3);
  background: #fff;         /* scanners want a light quiet zone in either theme */
  border-radius: var(--r-md);
  box-shadow: var(--sh-2);
}
.room-qr svg { display: block; width: 100%; height: auto; }

.presence-dot {
  flex: none;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--border-strong);
  transition: background-color var(--dur-2) var(--ease-out);
}
.presence-dot.is-online {
  background: var(--success);
  box-shadow: 0 0 0 3px var(--success-soft);
}

/* Waiting on other people: show who we're waiting for, quietly. */
.waiting-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: var(--sp-4);
  color: var(--text-2);
  font-size: var(--fs-sm);
  font-weight: 700;
}

/* --- Role card (imposter) ------------------------------------------------
   Face-down until tapped, so a glance over your shoulder shows nothing. */
.role-card {
  width: 100%;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: var(--sp-6) var(--sp-4);
  margin-bottom: var(--sp-4);
  border: 2px solid var(--accent-border);
  border-radius: var(--r-xl);
  background: var(--accent-soft);
  font-family: var(--font);
  text-align: center;
}
.role-card--closed {
  cursor: pointer;
  border-style: dashed;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.role-card--closed:active { transform: scale(0.97); }
.role-card--spy { background: var(--danger-soft); border-color: var(--danger); }
.role-card__value {
  font-size: 2.25rem;
  font-weight: 900;
  line-height: 1.15;
  color: var(--accent-ink);
  overflow-wrap: anywhere;
}
.role-card--spy .role-card__value { color: var(--danger-ink); }
.role-card__label { font-size: var(--fs-sm); font-weight: 800; color: var(--text-2); }
.role-card__hint { font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); max-width: 26ch; }

.chip.is-away { opacity: 0.45; }

/* Hub tile for a game the room doesn't have enough players for yet. */
.game-card.is-disabled { opacity: 0.4; pointer-events: none; }
.game-card__need {
  position: absolute;
  top: 4px;
  inset-inline-end: 6px;
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--text-2);
}

/* The game the host has selected, above its options. */
.chosen-game {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3);
  margin-bottom: var(--sp-3);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-md);
}
.chosen-game__icon { font-size: 1.35rem; }
.chosen-game__name { flex: 1; font-weight: 900; color: var(--accent-ink); }
