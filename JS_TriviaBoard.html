<script>
/* ============================================================================
   دوري المعرفة — THE TEAM BOARD
   ----------------------------------------------------------------------------
   Two teams, one screen, a host. Each round puts five categories on the board
   with a question at 100, 200, 300, 400 and 500 points in each; the higher the
   value, the harder the question. A team picks a card, the host reads it,
   reveals the answer and gives the points to whoever got it right.

   The questions are TRIVIA_BOARD_BANK (JS_TriviaBoardBank.html). Every card is
   dealt through freshPick, so the same question doesn't come back until its
   category and level have been played through.

   Each question can run on a clock (TB_TIMER_CHOICES, 30 seconds unless the
   host picks another, or off). When it runs out the answer shows by itself
   and the host still gives the points.

   The whole game lives in appState.triviaBoard, so a reload puts the board back
   exactly as it was (restoreView in JS_Core.html). That includes an open card:
   `open` holds its deadline (or the seconds left, while paused) rather than a
   count, so it comes back with the time it really had left.

   The last card given out can be taken back (`last`: which card, to whom, for
   how much) while its board is up. A cleared board moves on by itself after a
   beat; that pending step is one timer, so "next round" pressed in the beat
   doesn't move on twice. The setup screen offers to continue a board that
   isn't finished, and asks before a new game throws one away.

   The steal (the owner, 24 Sep 2026; a setup switch, on by default, kept in
   ashryTriviaTeams with the rest): with it on a card has two stages. `first`
   is the team whose turn it is (`open.picker`, taken from `turn`, which moves
   to the other team after every card; the host can switch it on the card).
   The host's ✅ gives them the points, ❌ - or their clock running out -
   moves the card to `steal` with the answer still hidden: the other team gets
   one try on a clock of half the card's time (none when the clock is off),
   ✅ for the full points, ❌ or the clock shows the answer with nobody scoring
   (`open.missed`). «👁️ إظهار الإجابة» in the first stage skips the steal and
   leaves the host today's award buttons. The stage, its length (`secs`) and
   its deadline are in `open`, so a reload comes back in the same stage with
   the time it really had left. Off, a card plays exactly as it always did.
   ========================================================================= */

const TB_LEVELS = [100, 200, 300, 400, 500];
const TB_CATEGORIES_PER_ROUND = 5;
const TB_ADJUST_STEP = 100;
const TB_TEAMS_KEY = 'ashryTriviaTeams';
const TB_TIMER_CHOICES = [15, 20, 30, 45, 60];
const TB_TIMER_DEFAULT = 30;

/** The open card's clock (createClock), or null. */
let tbClock = null;
/** A cleared board's step to the next round, while it waits. */
let tbAdvanceTimer = null;

function cancelTriviaAdvance() {
  clearTimeout(tbAdvanceTimer);
  tbAdvanceTimer = null;
}

// Gone from the board before its beat was up: no round moves on (and no toast) behind another screen.
onLeaveScreen((from) => { if (from === 'play-trivia') cancelTriviaAdvance(); });

function tbText() { return TRANSLATIONS[appState.lang] || {}; }
function tbLang() { return contentLang(); }
function tbCategory(id) { return TRIVIA_BOARD_BANK.find(c => c.id === id); }

/** Opens the trivia setup screen: the team board here, rooms one tap away (the switch opens as it was left). */
function setupTrivia() {
  setView('setup-trivia');
}

/* The setup as the host left it (ashryTriviaTeams): the names, the rounds and
   the clock. Kept whenever one of them changes, not only on Start, and put
   back whenever the screen is painted - a reload or the back button too. */
function tbSavedSetup() {
  try { return JSON.parse(localStorage.getItem(TB_TEAMS_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function tbRecallSetup() {
  const saved = tbSavedSetup();
  const a = document.getElementById('tb-team-a');
  const b = document.getElementById('tb-team-b');
  const rounds = document.getElementById('tb-rounds');
  if (a && document.activeElement !== a) a.value = saved.a || '';
  if (b && document.activeElement !== b) b.value = saved.b || '';
  const n = Number(saved.rounds);
  if (rounds && n >= 1 && n <= 4) rounds.value = String(n);
  // On, at 30 seconds, until the host chooses otherwise; then as they left it.
  const timerOn = document.getElementById('tb-timer-on');
  if (timerOn) timerOn.checked = saved.timerOn !== false;
  setTriviaTimerSeconds(TB_TIMER_CHOICES.indexOf(saved.timerSeconds) !== -1 ? saved.timerSeconds : TB_TIMER_DEFAULT, true);
  syncTriviaTimerField(true);
  // The steal: on until the host turns it off; then as they left it.
  const steal = document.getElementById('tb-steal-on');
  if (steal) steal.checked = saved.steal !== false;
}

/** What the setup screen shows now, as the defaults for next time. */
function tbRememberSetup() {
  const field = (id) => document.getElementById(id) || {};
  const picked = Number((field('tb-timer-seconds').dataset || {}).value);
  try {
    localStorage.setItem(TB_TEAMS_KEY, JSON.stringify({
      a: String(field('tb-team-a').value || '').trim().slice(0, 20),
      b: String(field('tb-team-b').value || '').trim().slice(0, 20),
      rounds: Math.max(1, Math.min(4, Number(field('tb-rounds').value) || 2)),
      timerOn: !!field('tb-timer-on').checked,
      timerSeconds: TB_TIMER_CHOICES.indexOf(picked) !== -1 ? picked : TB_TIMER_DEFAULT,
      steal: !!field('tb-steal-on').checked
    }));
  } catch (e) {}
}

/** A board that isn't finished: the scores, the round, and a way back to it. */
const triviaUnfinished = () => {
  const s = appState.triviaBoard;
  return !!(s && !s.finished && Array.isArray(s.board) && s.board.length);
};
const triviaStarted = () => {
  const s = appState.triviaBoard;
  return triviaUnfinished() && (s.round > 1 || s.teams.some(x => x.score > 0) || s.board.some(col => col.cells.some(x => x.done)));
};

function paintTriviaSetup() {
  tbRecallSetup();
  const panel = document.querySelector('#view-setup-trivia .mode-device-panel');
  let box = document.getElementById('tb-resume');
  if (!box && panel) {
    box = document.createElement('div');
    box.id = 'tb-resume';
    box.className = 'field';
    panel.insertBefore(box, panel.firstChild);
  }
  if (!box) return;
  if (!triviaStarted()) {
    box.classList.add('hidden');
    box.innerHTML = '';
    return;
  }
  const s = appState.triviaBoard;
  const t = tbText();
  box.classList.remove('hidden');
  box.innerHTML = `
    <label class="field__label">⏸️ ${escapeHTML(t.tb_unfinished || 'لعبة لسه ما خلصتش')}</label>
    <div class="tb-scores tb-scores--final">
      <div class="tb-team tb-team--a"><div class="tb-team__name">${escapeHTML(tbTeamName(0))}</div><div class="tb-team__score">${s.teams[0].score}</div></div>
      <div class="tb-round"><span class="eyebrow">${escapeHTML(t.tb_round || '')}</span><span class="tb-round__value">${s.round} / ${s.rounds}</span></div>
      <div class="tb-team tb-team--b"><div class="tb-team__name">${escapeHTML(tbTeamName(1))}</div><div class="tb-team__score">${s.teams[1].score}</div></div>
    </div>
    <button type="button" class="btn btn--secondary" onclick="resumeTriviaBoard()">▶ ${escapeHTML(t.solo_continue || 'كمّل اللعبة')}</button>`;
}

function resumeTriviaBoard() {
  if (!triviaUnfinished()) return;
  setView('play-trivia');
  renderTriviaBoard();
  // An open card comes back with the time it had left, once the screen has settled.
  if (appState.triviaBoard.open) setTimeout(() => { if (appState.currentView === 'play-trivia') showTriviaCell(); }, 0);
}

/** The seconds only show while the timer switch is on. `painting`: put back, not chosen. */
function syncTriviaTimerField(painting) {
  const on = !!(document.getElementById('tb-timer-on') || {}).checked;
  const choices = document.getElementById('tb-timer-choices');
  if (choices) choices.classList.toggle('hidden', !on);
  if (painting !== true) tbRememberSetup();
}

function setTriviaTimerSeconds(seconds, painting) {
  const group = document.getElementById('tb-timer-seconds');
  if (!group) return;
  group.dataset.value = String(seconds);
  group.querySelectorAll('[data-seconds]').forEach(btn => {
    const active = Number(btn.dataset.seconds) === seconds;
    btn.classList.toggle('is-active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  if (painting !== true) tbRememberSetup();
}

function startTriviaBoard() {
  // A board still being played is not thrown away without asking.
  if (triviaStarted()) {
    showConfirmModal(tbText().tb_new_confirm || 'فيه لعبة لسه ما خلصتش. تبدأ لعبة جديدة وتسيبها؟', beginTriviaBoard);
    return;
  }
  beginTriviaBoard();
}

function beginTriviaBoard() {
  const nameA = ((document.getElementById('tb-team-a') || {}).value || '').trim().slice(0, 20);
  const nameB = ((document.getElementById('tb-team-b') || {}).value || '').trim().slice(0, 20);
  const rounds = Math.max(1, Math.min(4, Number((document.getElementById('tb-rounds') || {}).value) || 2));
  const timerOn = !!(document.getElementById('tb-timer-on') || {}).checked;
  const picked = Number(((document.getElementById('tb-timer-seconds') || {}).dataset || {}).value);
  const timerSeconds = TB_TIMER_CHOICES.indexOf(picked) !== -1 ? picked : TB_TIMER_DEFAULT;
  const stealOn = !!(document.getElementById('tb-steal-on') || {}).checked;
  try {
    localStorage.setItem(TB_TEAMS_KEY, JSON.stringify({
      a: nameA, b: nameB, rounds: rounds, timerOn: timerOn, timerSeconds: timerSeconds, steal: stealOn
    }));
  } catch (e) {}

  stopTriviaTimer();
  cancelTriviaAdvance();
  appState.triviaBoard = {
    // An empty name follows the language instead of freezing the default in.
    teams: [{ name: nameA, score: 0 }, { name: nameB, score: 0 }],
    round: 1,
    rounds: rounds,
    // Seconds per question; 0 is no timer.
    timer: timerOn ? timerSeconds : 0,
    // The other team's chance after a miss; `turn` is the team up next (0 or 1).
    steal: stealOn,
    turn: 0,
    board: dealTriviaRound([]),
    open: null,
    last: null,
    finished: false
  };
  saveToLocal();
  setView('play-trivia');
  renderTriviaBoard();
  playSound('success');
}

/** Five categories - different from the last board where the bank allows - with one question per level. */
function dealTriviaRound(previousIds) {
  const fresh = shuffleArray(TRIVIA_BOARD_BANK.filter(c => previousIds.indexOf(c.id) === -1));
  const rest = shuffleArray(TRIVIA_BOARD_BANK.filter(c => previousIds.indexOf(c.id) !== -1));
  const categories = fresh.concat(rest).slice(0, TB_CATEGORIES_PER_ROUND);
  return categories.map(cat => ({
    cat: cat.id,
    cells: TB_LEVELS.map(points => {
      const pool = cat.levels[points];
      // Keyed on the English question: stable, and the same card in either language.
      const pick = freshPick('triviaBoard:' + cat.id + ':' + points, pool, 1, { key: q => q[2] })[0];
      return { points: points, q: pool.indexOf(pick), team: null, done: false };
    })
  }));
}

function tbTeamName(index) {
  const s = appState.triviaBoard;
  const t = tbText();
  const name = s && s.teams[index] && s.teams[index].name;
  return name || (index === 0 ? (t.tb_team_a || 'الفريق الأحمر') : (t.tb_team_b || 'الفريق الأزرق'));
}

function renderTriviaBoard() {
  const s = appState.triviaBoard;
  const root = document.getElementById('tb-root');
  if (!root) return;
  if (!s) { setView('setup-trivia'); return; }
  const t = tbText();
  const lang = tbLang();

  if (s.finished) { root.innerHTML = triviaBoardResults(s, t); return; }

  // With the steal on the board says whose turn it is (the team a card goes to first).
  const up = tbStealOn(s) ? tbTurn(s) : -1;
  const team = (i) => `
    <div class="tb-team tb-team--${i === 0 ? 'a' : 'b'}${up === i ? ' is-turn' : ''}"${up === i ? ` aria-current="true" title="${escapeHTML(t.tb_turn || '')}"` : ''}>
      <div class="tb-team__name">${escapeHTML(tbTeamName(i))}</div>
      <div class="tb-team__score">${s.teams[i].score}</div>
      <div class="tb-team__adjust">
        <button class="iconbtn" onclick="adjustTriviaScore(${i}, -1)" aria-label="−${TB_ADJUST_STEP}">−</button>
        <button class="iconbtn" onclick="adjustTriviaScore(${i}, 1)" aria-label="+${TB_ADJUST_STEP}">+</button>
      </div>
    </div>`;

  const headers = s.board.map(col => {
    const cat = tbCategory(col.cat) || {};
    return `<div class="tb-cat"><span class="tb-cat__icon" aria-hidden="true">${cat.icon || ''}</span>${escapeHTML(cat[lang] || '')}</div>`;
  }).join('');

  let cells = '';
  TB_LEVELS.forEach((points, row) => {
    s.board.forEach((col, c) => {
      const cell = col.cells[row];
      if (cell.done) {
        const dot = cell.team === 0 ? 'a' : (cell.team === 1 ? 'b' : 'none');
        cells += `<button class="tb-cell is-done" disabled aria-label="${points}"><span class="tb-dot tb-dot--${dot}"></span></button>`;
      } else {
        cells += `<button class="tb-cell" onclick="openTriviaCell(${c}, ${row})">${points}</button>`;
      }
    });
  });

  const lastRound = s.round >= s.rounds;
  const canUndo = triviaCanUndo(s);
  // .tb-play stacks on a phone held upright and puts the scores beside the
  // board on its side (Style.html, landscape).
  root.innerHTML = `
    <div class="tb-play">
      <div class="tb-scores">
        ${team(0)}
        <div class="tb-round">
          <span class="eyebrow">${t.tb_round || 'الجولة'}</span>
          <span class="tb-round__value">${s.round} / ${s.rounds}</span>
        </div>
        ${team(1)}
      </div>
      <div class="tb-board">${headers}${cells}</div>
      <div class="btn-stack tb-actions">
        <button class="btn btn--secondary" onclick="nextTriviaRound()">${lastRound ? (t.tb_finish || 'إنهاء اللعبة') : (t.tb_next_round || 'الجولة التالية')}</button>
        ${canUndo ? `<button class="btn btn--ghost btn--sm" onclick="undoTriviaAward()">↶ ${escapeHTML(t.tb_undo_award || 'رجّع آخر سؤال')}</button>` : ''}
      </div>
    </div>`;
}

/* --- one card ------------------------------------------------------------ */

/** The steal is on for this board (a board saved before the switch plays as it did). */
function tbStealOn(s) { return !!(s && s.steal); }
/** The team up next: the one a card goes to first. */
function tbTurn(s) { return s && s.turn === 1 ? 1 : 0; }
/** The open card's points. */
function tbOpenPoints(s) {
  const o = s && s.open;
  const cell = o && s.board[o.c] && s.board[o.c].cells[o.row];
  return cell ? cell.points : 0;
}

function openTriviaCell(c, row) {
  const s = appState.triviaBoard;
  if (!s || !s.board[c] || !s.board[c].cells[row] || s.board[c].cells[row].done) return;
  s.open = {
    c: c,
    row: row,
    revealed: false,
    timeUp: false,
    // The steal's two stages: the team up ('first'), then the other ('steal').
    stage: 'first',
    picker: tbStealOn(s) ? tbTurn(s) : null,
    // This stage's whole length, for the bar: the card's time, then half of it.
    secs: s.timer || 0,
    // A running clock keeps its deadline; a paused one keeps the seconds left.
    endsAt: s.timer ? Date.now() + s.timer * 1000 : null,
    left: null
  };
  saveToLocal();
  showTriviaCell();
  playSound('click');
}

/** Draws the open card: when it is opened, and again after a reload. */
function showTriviaCell() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  const col = o && s.board[o.c];
  const cell = col && col.cells[o.row];
  const cat = col && tbCategory(col.cat);
  const item = cat && cell && (cat.levels[cell.points] || [])[cell.q];
  if (!item || cell.done) {
    if (s) s.open = null;
    return;
  }
  const en = tbLang() === 'en';

  document.getElementById('tb-q-cat').textContent = (cat.icon ? cat.icon + ' ' : '') + (en ? cat.en : cat.ar);
  document.getElementById('tb-q-points').textContent = cell.points;
  document.getElementById('tb-q-text').textContent = en ? item[2] : item[0];
  document.getElementById('tb-q-answer-text').textContent = en ? item[3] : item[1];
  if (o.revealed) paintTriviaAnswer();
  else {
    document.getElementById('tb-q-answer').classList.add('hidden');
    paintTriviaActions();
  }
  document.getElementById('tb-question-modal').classList.remove('hidden');
  startTriviaTimer();
}

/** The host's buttons while the answer is still hidden. */
function paintTriviaActions() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  const box = document.getElementById('tb-q-actions');
  if (!o || !box) return;
  const t = tbText();
  if (!tbStealOn(s)) {
    box.innerHTML = `
      <button class="btn btn--primary btn--lg" onclick="revealTriviaAnswer()">${t.tb_show_answer || 'إظهار الإجابة'}</button>
      <button class="btn btn--ghost" onclick="closeTriviaCell()">${t.tb_back || 'رجوع'}</button>`;
    return;
  }
  const judge = `
    <div class="btn-row">
      <button class="btn btn--success btn--lg" onclick="judgeTriviaCell(true)">✅ ${t.tb_right || 'صح'}</button>
      <button class="btn btn--danger-soft btn--lg" onclick="judgeTriviaCell(false)">❌ ${t.tb_wrong || 'غلط'}</button>
    </div>`;
  if (o.stage === 'steal') {
    const other = 1 - (o.picker === 1 ? 1 : 0);
    // Slides in once; a reload or a redraw shows it settled.
    const fresh = motionFirst('tbsteal|' + s.round + '|' + o.c + '|' + o.row);
    box.innerHTML = `
      <div class="tb-steal tb-steal--${other === 0 ? 'a' : 'b'}${fresh ? ' is-in' : ''}" role="status">
        <span class="tb-steal__title">🔁 ${escapeHTML(t.tb_steal_band || 'فرصة للفريق التاني')}</span>
        <span class="tb-steal__team">${escapeHTML(tbTeamName(other))}</span>
        <span class="tb-steal__pts">${escapeHTML((t.tb_steal_points || '{pts}').replace('{pts}', tbOpenPoints(s)))}</span>
      </div>${judge}`;
    return;
  }
  const p = o.picker === 1 ? 1 : 0;
  const chip = (i) => `<button type="button" class="segmented__item${p === i ? ' is-active' : ''}" aria-pressed="${p === i}" onclick="setTriviaPicker(${i})">${escapeHTML(tbTeamName(i))}</button>`;
  box.innerHTML = `
    <div class="tb-picker">
      <span class="eyebrow">${escapeHTML(t.tb_answering || 'بيجاوب:')}</span>
      <div class="segmented" role="group">${chip(0)}${chip(1)}</div>
    </div>${judge}
    <div class="btn-row">
      <button class="btn btn--ghost" onclick="revealTriviaAnswer()">👁️ ${t.tb_show_answer || 'إظهار الإجابة'}</button>
      <button class="btn btn--ghost" onclick="closeTriviaCell()">${t.tb_back || 'رجوع'}</button>
    </div>`;
}

/** Which team the card went to first - the host can put it right on the card. */
function setTriviaPicker(i) {
  const s = appState.triviaBoard;
  const o = s && s.open;
  if (!o || o.revealed || o.stage !== 'first') return;
  o.picker = i === 1 ? 1 : 0;
  saveToLocal();
  paintTriviaActions();
}

/** The host's ✅ / ❌ with the steal on, in either stage. */
function judgeTriviaCell(right) {
  const s = appState.triviaBoard;
  const o = s && s.open;
  if (!o || o.revealed || !tbStealOn(s)) return;
  const picker = o.picker === 1 ? 1 : 0;
  if (o.stage === 'steal') {
    if (right) awardTriviaCell(1 - picker);
    else missTriviaSteal();
    return;
  }
  if (right) awardTriviaCell(picker);
  else enterTriviaSteal();
}

/** A miss (or the clock) in the first stage: the other team's try, the answer still hidden. */
function enterTriviaSteal() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  if (!o || o.revealed || o.stage !== 'first') return;
  stopTriviaTimer();
  // Half the card's time, rounded up; no clock on the card, none for the steal.
  const secs = s.timer ? Math.max(1, Math.ceil(s.timer / 2)) : 0;
  o.stage = 'steal';
  o.timeUp = false;
  o.secs = secs;
  o.endsAt = secs ? Date.now() + secs * 1000 : null;
  o.left = null;
  saveToLocal();
  playSound('alarm');
  haptic('heavy');
  paintTriviaActions();
  startTriviaTimer();
  // The clock fills up again for the other team: a pop says it restarted.
  const box = document.getElementById('tb-q-timer');
  if (secs && box && !motionOff()) {
    box.classList.remove('is-restart');
    void box.offsetWidth;
    box.classList.add('is-restart');
    setTimeout(() => box.classList.remove('is-restart'), 700);
  }
}

/** The steal missed (❌ or its clock): the answer is shown and nobody scores. */
function missTriviaSteal() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  if (!o || o.revealed || o.stage !== 'steal') return;
  o.missed = true;
  playSound('alarm');
  revealTriviaAnswer();
}

/** The host's button, or the clock running out. */
function revealTriviaAnswer() {
  const s = appState.triviaBoard;
  if (!s || !s.open) return;
  s.open.revealed = true;
  stopTriviaTimer();
  // Shown early, the clock has nothing more to say; run out, it stays up saying so.
  if (!s.open.timeUp) document.getElementById('tb-q-timer').classList.add('hidden');
  saveToLocal();
  paintTriviaAnswer();
}

function paintTriviaAnswer() {
  const t = tbText();
  const s = appState.triviaBoard;
  document.getElementById('tb-q-answer').classList.remove('hidden');
  // The steal missed too: the answer for the table, and no points for anyone.
  if (s && s.open && s.open.missed) {
    document.getElementById('tb-q-actions').innerHTML = `
      <div class="tb-steal tb-steal--none" role="status"><span class="tb-steal__title">${escapeHTML(t.tb_steal_missed || 'محدش خد النقط')}</span></div>
      <button class="btn btn--primary btn--lg" onclick="awardTriviaCell(-1)">${t.next || 'التالي'}</button>`;
    return;
  }
  document.getElementById('tb-q-actions').innerHTML = `
    <div class="eyebrow">${t.tb_points_to || 'النقاط لـ'}</div>
    <div class="btn-row">
      <button class="btn btn--lg tb-award tb-award--a" onclick="awardTriviaCell(0)">${escapeHTML(tbTeamName(0))}</button>
      <button class="btn btn--lg tb-award tb-award--b" onclick="awardTriviaCell(1)">${escapeHTML(tbTeamName(1))}</button>
    </div>
    <button class="btn btn--ghost" onclick="awardTriviaCell(-1)">${t.tb_nobody || 'محدش جاوب'}</button>`;
}

/** Closes the card without playing it - the host opened the wrong one. */
function closeTriviaCell() {
  const s = appState.triviaBoard;
  stopTriviaTimer();
  if (s) {
    s.open = null;
    saveToLocal();
  }
  closeModal('tb-question-modal');
}

function awardTriviaCell(teamIndex) {
  const s = appState.triviaBoard;
  if (!s || !s.open) return;
  stopTriviaTimer();
  const cell = s.board[s.open.c].cells[s.open.row];
  cell.done = true;
  cell.team = teamIndex >= 0 ? teamIndex : null;
  // `turn` is what the undo puts back: the card goes back to the team it was up for.
  s.last = { c: s.open.c, row: s.open.row, team: cell.team, points: teamIndex >= 0 ? cell.points : 0, round: s.round, turn: s.turn };
  // With the steal on the turn passes after every card, whoever scored it.
  if (tbStealOn(s)) s.turn = 1 - (s.open.picker === 1 ? 1 : 0);
  if (teamIndex >= 0) {
    s.teams[teamIndex].score += cell.points;
    playSound('success');
    haptic('medium');
  } else if (!s.open.missed) {
    // (A missed steal has already sounded.)
    playSound('alarm');
  }
  s.open = null;
  closeModal('tb-question-modal');
  saveToLocal();
  renderTriviaBoard();

  // A cleared board moves on by itself, after a beat - once, whichever comes first.
  if (s.board.every(col => col.cells.every(x => x.done))) {
    const round = s.round;
    cancelTriviaAdvance();
    tbAdvanceTimer = setTimeout(() => {
      tbAdvanceTimer = null;
      const now = appState.triviaBoard;
      if (now !== s || now.finished || now.round !== round || appState.currentView !== 'play-trivia') return;
      if (now.board.every(col => col.cells.every(x => x.done))) advanceTriviaBoard();
    }, 700);
  }
}

/** The last card given out on this board, still as it was given. */
function triviaCanUndo(s) {
  const l = s && s.last;
  if (!l || l.round !== s.round || s.finished) return false;
  const cell = s.board[l.c] && s.board[l.c].cells[l.row];
  return !!(cell && cell.done && cell.team === l.team);
}

/** The card goes back on the board, and its points come off the team that got them. */
function undoTriviaAward() {
  const s = appState.triviaBoard;
  if (!triviaCanUndo(s)) return;
  cancelTriviaAdvance();
  const l = s.last;
  const cell = s.board[l.c].cells[l.row];
  cell.done = false;
  cell.team = null;
  if (l.team !== null && s.teams[l.team]) s.teams[l.team].score = Math.max(0, s.teams[l.team].score - l.points);
  if (l.turn === 0 || l.turn === 1) s.turn = l.turn;
  s.last = null;
  saveToLocal();
  renderTriviaBoard();
  playSound('tick');
  haptic('light');
}

function adjustTriviaScore(teamIndex, direction) {
  const s = appState.triviaBoard;
  if (!s) return;
  s.teams[teamIndex].score = Math.max(0, s.teams[teamIndex].score + direction * TB_ADJUST_STEP);
  saveToLocal();
  renderTriviaBoard();
}

/* --- the question clock ---------------------------------------------------- */

/** Starts (or, after a reload, resumes) the open card's clock, if the game has one. */
function startTriviaTimer() {
  stopTriviaTimer();
  const s = appState.triviaBoard;
  const o = s && s.open;
  const box = document.getElementById('tb-q-timer');
  if (!box) return;
  box.classList.remove('is-up', 'is-urgent', 'is-paused');
  // A steal on a card with no clock has no clock either (secs 0).
  if (!o || !s.timer || (o.stage === 'steal' && !o.secs) || (o.revealed && !o.timeUp)) {
    box.classList.add('hidden');
    return;
  }
  box.classList.remove('hidden');
  if (o.timeUp) {
    paintTriviaTimer(0);
    paintTriviaTimerState();
    return;
  }

  const paused = typeof o.left === 'number';
  const left = paused ? o.left : Math.ceil((o.endsAt - Date.now()) / 1000);
  if (!(left > 0)) {
    triviaTimeUp();
    return;
  }
  tbClock = createClock({ seconds: left, onTick: paintTriviaTimer, onEnd: triviaTimeUp });
  if (paused) tbClock.pause();
  paintTriviaTimerState();
}

function stopTriviaTimer() {
  countdownClear();
  if (tbClock) tbClock.stop();
  tbClock = null;
}

function paintTriviaTimer(seconds) {
  const s = appState.triviaBoard;
  if (!s || !s.timer) return;
  const box = document.getElementById('tb-q-timer');
  const value = document.getElementById('tb-q-timer-value');
  const fill = document.getElementById('tb-q-timer-fill');
  if (value) value.textContent = seconds;
  const full = (s.open && s.open.secs) || s.timer;
  if (fill) fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, seconds / full)) + ')';
  const urgent = seconds > 0 && seconds <= 5;
  if (box) box.classList.toggle('is-urgent', urgent);
  countdownUrgency(value, seconds);
  if (urgent && tbClock && tbClock.isRunning()) playSound('tick');
}

/** Paused, running or run out: the icon, the label and the colour. */
function paintTriviaTimerState() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  const box = document.getElementById('tb-q-timer');
  const state = document.getElementById('tb-q-timer-state');
  if (!box || !state) return;
  const t = tbText();
  const up = !!(o && o.timeUp);
  const paused = !up && !!(tbClock && tbClock.isPaused());
  box.classList.toggle('is-up', up);
  box.classList.toggle('is-paused', paused);
  if (up) box.classList.remove('is-urgent');
  box.disabled = up;
  state.textContent = up ? (t.tb_time_up || 'الوقت خلص!') : (paused ? '▶' : '⏸');
  box.setAttribute('aria-label', up ? (t.tb_time_up || '') : (paused ? (t.tb_timer_resume || '') : (t.tb_timer_pause || '')));
}

/** Tapping the clock pauses it - and tapping again carries on. */
function toggleTriviaTimer() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  if (!tbClock || !o || o.revealed) return;
  const paused = tbClock.toggle();
  if (paused) {
    o.left = tbClock.value();
    o.endsAt = null;
  } else {
    o.endsAt = Date.now() + tbClock.value() * 1000;
    o.left = null;
  }
  saveToLocal();
  paintTriviaTimerState();
}

function triviaTimeUp() {
  const s = appState.triviaBoard;
  const o = s && s.open;
  if (!o || o.revealed) return;
  tbClock = null;
  o.timeUp = true;
  paintTriviaTimer(0);
  paintTriviaTimerState();
  if (tbStealOn(s) && o.stage === 'steal') {
    // The steal ran out too: the answer, and nobody scores.
    haptic('heavy');
    missTriviaSteal();
    return;
  }
  if (tbStealOn(s)) {
    // The team up ran out: the other team's try, the answer still hidden.
    o.timeUp = false;
    enterTriviaSteal();
    return;
  }
  playSound('alarm');
  haptic('heavy');
  revealTriviaAnswer();
}

/* --- rounds and the end ---------------------------------------------------- */

/** The button under the board. Unplayed cards are asked about first. */
function nextTriviaRound() {
  const s = appState.triviaBoard;
  if (!s) return;
  const unplayed = s.board.some(col => col.cells.some(x => !x.done));
  if (unplayed) showConfirmModal(tbText().tb_skip_confirm || 'لسه فيه أسئلة ما اتلعبتش. نكمل؟', advanceTriviaBoard);
  else advanceTriviaBoard();
}

function advanceTriviaBoard() {
  const s = appState.triviaBoard;
  cancelTriviaAdvance();
  if (!s || s.finished) return;
  stopTriviaTimer();
  s.open = null;
  s.last = null;
  if (s.round >= s.rounds) {
    s.finished = true;
    saveToLocal();
    renderTriviaBoard();
    if (typeof confetti === 'function') confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
    playSound('success');
    return;
  }
  s.round++;
  s.board = dealTriviaRound(s.board.map(col => col.cat));
  saveToLocal();
  renderTriviaBoard();
  showToast((tbText().tb_round || 'الجولة') + ' ' + s.round, 'info');
}

function triviaBoardResults(s, t) {
  const [a, b] = s.teams;
  const headline = a.score === b.score
    ? (t.tb_draw || 'تعادل!')
    : `🏆 ${escapeHTML(tbTeamName(a.score > b.score ? 0 : 1))} ${t.tb_wins || 'فاز!'}`;
  return `
    <div class="card" style="text-align:center">
      <div class="modal-icon" aria-hidden="true">🏆</div>
      <div class="card__title">${headline}</div>
      <div class="tb-scores tb-scores--final">
        <div class="tb-team tb-team--a"><div class="tb-team__name">${escapeHTML(tbTeamName(0))}</div><div class="tb-team__score">${a.score}</div></div>
        <div class="tb-round"><span class="eyebrow">${t.tb_final || 'النتيجة'}</span></div>
        <div class="tb-team tb-team--b"><div class="tb-team__name">${escapeHTML(tbTeamName(1))}</div><div class="tb-team__score">${b.score}</div></div>
      </div>
      <div class="btn-stack">
        <button class="btn btn--primary btn--lg" onclick="replayTriviaBoard()">${t.play_again || 'لعبة جديدة'}</button>
        <button class="btn btn--ghost" onclick="setupTrivia()">${t.tb_settings || 'تغيير الإعدادات'}</button>
      </div>
    </div>`;
}

/** Same teams, same number of rounds, same clock, fresh board. */
function replayTriviaBoard() {
  const s = appState.triviaBoard;
  if (!s) { setupTrivia(); return; }
  stopTriviaTimer();
  s.teams.forEach(x => { x.score = 0; });
  s.round = 1;
  s.turn = 0;
  s.finished = false;
  s.open = null;
  s.last = null;
  cancelTriviaAdvance();
  s.board = dealTriviaRound([]);
  saveToLocal();
  renderTriviaBoard();
}
</script>
