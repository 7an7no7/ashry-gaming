    const host = (buttons) => (state.youAreHost && buttons.length ? `<div class="tv-actions">${buttons.map(b => tvBtn(b[0], b[1], b[2] || '')).join('')}</div>` : '');
    // The buttons that only move the game on: anyone's once the host is away (the signature carries it).
    const moveOn = (buttons) => (roomCanMoveOn(state) && buttons.length ? `<div class="tv-actions">${buttons.map(b => tvBtn(b[0], b[1], b[2] || '')).join('')}</div>` : '');
    const top = `<div class="tv-top">
        <span class="tv-pill">🪢 ${escapeHTML(hmT('hm_round', { n: s.round, m: s.rounds }))}</span>
        ${s.endsAt && s.phase === 'guessing' ? '<span class="tv-pill" data-hm-clock></span>' : ''}
      </div>`;
    if (s.phase === 'gameover' && !hold) {
      return `<div class="tv-vote" data-accent="orange">
          <div class="tv-title tv-center-text">🏆</div>
          ${teams ? `<div class="tv-scale">${hmTeamFinalHtml(state, true)}</div>` : (renderPodium(state, s.board) || `<div class="tv-scale">${renderScoreboard(s.board)}</div>`)}
          ${host([[t.play_again, "roomAct('playAgain')"], [t.room_another_game, "roomAct('backToHub')", 'ghost']])}
        </div>`;
    }
    if (s.phase === 'result' && !hold) {
      return `<div class="tv-trivia" data-accent="orange">${top}
          ${teams ? hmTeamsBarHtml(state, true) : ''}
          <div class="tv-center hm-tv-result">${hmResultHtml(state, true)}</div>
          ${moveOn([[hmT('hm_next_word'), `roomAct('nextRound', { round: ${Number(s.round) || 0} })`]])}
        </div>`;
    }
    if (s.phase === 'writing') {
      const line = teams ? hmT('hm_team_writing', { name: s.setterName || '', team: hmTeamName(s.gt) }) : hmT('hm_room_writing', { name: s.setterName || '' });
      return `<div class="tv-trivia" data-accent="orange">${top}
          ${teams ? hmTeamsBarHtml(state, true) : ''}
          ${tvWaitStage(state, { who: s.setter, ids: teams ? [] : (s.order || s.roster), line: line,
            note: teams && s.captainName ? '🧢 ' + hmT('hm_captain_is', { name: s.captainName }) : '',
            actions: moveOn(hmHostButtons(state).map(b => [b[0], b[1], 'ghost'])) })}
        </div>`;
    }
    if (teams) {
      // The team's one board, big: the man (his ending plays here), the letters found, the wrong ones.
      const tb = (hold && hold.board) || s.tb || {};
      const fx = hold ? hold.fx : hmRoomFx(state, tb);
      const misses = (tb.miss || []).length;
      const wrong = (tb.miss || []).map(m => (m.length > 1 ? '✗' + m : m)).map(m => (s.alpha === 'en' ? m.toUpperCase() : m)).join(' ');
      hmRoom.tvFx = fx;
      return `<div class="tv-trivia hm-tv hm-tv--team" data-accent="orange">${top}
          ${hmTeamsBarHtml(state, true)}
          <div class="hm-tv__board">
            ${hmManHtml({ misses: misses, max: s.max, state: tb.state, end: tb.end, key: hmEndKey(state, 'team'), play: !!(fx.cheer || (fx.newMiss && tb.state === 'lost')), drawLast: !!fx.newMiss, cls: 'hm-tv__man' })}
            <div class="hm-tv__head">
              <div class="tv-title">${escapeHTML(hmT('hm_word_from', { name: s.setterName || '' }))}</div>
              <div class="tv-note">🧢 ${escapeHTML(hmT('hm_captain_is', { name: s.captainName || '' }))} · ${escapeHTML(hmT('hm_misses_of', { n: misses, m: s.max || HM_MISSES }))}</div>
              ${hmHintsHtml({ hints: (tb.hints && tb.hints.length ? tb.hints : (s.cat ? [s.cat] : [])), hintsN: s.hintsN, state: tb.state, miss: tb.miss || [] })}
              ${hmTilesHtml(tb.pattern || hmBlankPattern(s), s.alpha, { word: tb.state === 'won' && s.result ? s.result.word : '', open: fx.open })}
              <p class="hm-wrong" dir="${s.alpha === 'en' ? 'ltr' : 'rtl'}">${wrong ? escapeHTML(wrong) : '&nbsp;'}</p>
            </div>
          </div>
          ${moveOn(hmHostButtons(state).map(b => [b[0], b[1], 'ghost']))}
        </div>`;
    }
    // The TV's frame is the room's colour; the man and the tiles keep the game's orange.
    return `<div class="tv-trivia hm-tv" data-accent="orange">${top}
        <div class="hm-tv__head">
          <div class="tv-title">${escapeHTML(!s.setter ? (s.cat || '❓ ' + hmT('hm_cat_hidden')) : hmT('hm_word_from', { name: s.setterName || '' }))}</div>
          ${s.setter && s.cat ? `<div class="tv-note">💡 ${escapeHTML(s.cat)}</div>` : ''}
          ${hmTilesHtml(hmBlankPattern(s), s.alpha, {})}
        </div>
        ${hmProgressHtml(state, true)}
        ${moveOn(hmHostButtons(state).map(b => [b[0], b[1], 'ghost']))}
      </div>`;
  },
  after(state, rebuilt) {
    hmTickClock(state);
    // The endings: the team's board plays here; the small men show their last frame.
    const root = document.getElementById('view-room-tv') || document;
    if (rebuilt !== false) {
      hmEndPlay(root);
      hmDrawLast(root);
    }
  }
};
</script>
