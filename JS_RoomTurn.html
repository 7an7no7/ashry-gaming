<script>
/* ============================================================================
   "دورك!" — the room waiting on this phone, said when you come back to it
   ----------------------------------------------------------------------------
   Someone playing from home switches to WhatsApp mid-game. On an iPhone the
   page is frozen and its connection dropped, so nothing tells them their turn
   has come. When the app comes back to the front after a while away, the room
   catches up by itself (Room.refresh in JS_Room.html). Once the server has
   actually been heard from since waking (Room.heardAt - a socket that only
   looks open after sleep proves nothing), `roomTurnOf` says whether the game
   is waiting on this phone, and if so a banner, a sound and a buzz say it; a
   tap on the banner goes back to the room.

   While the page is hidden but still receiving (a laptop tab, Android for a
   while) the title says it instead. Nothing fires while you are looking at
   the screen: at one table that would only be noise.
   ========================================================================= */

const TURN_AWAY_MS = 8000;     // a glance at another app is not being away
const TURN_WAIT_MS = 8000;     // how long to wait for the room to catch up
const TURN_BANNER_MS = 5000;

const roomTurn = { hiddenAt: 0, wakeAt: 0, timer: null, bannerTimer: null, title: '', titled: false };

/**
 * What the game is waiting for this phone to do, as a translation key, or null.
 * Only what is this phone's alone, or an open question it hasn't answered - a
 * shared dial or a host's "next round" is not a turn.
 */
function roomTurnOf(state) {
  if (!state || !state.game || state.phase === 'lobby' || state.youAreScreen || state.inGame === false) return null;
  const me = Room.me;
  if (!me) return null;
  const s = state.shared || {};
  const has = (list) => Array.isArray(list) && list.indexOf(me) !== -1;
  const inRound = !s.roster || has(s.roster);
  // A duels' tournament: the turn in this phone's own match (JS_RoomTournament.html).
  if (s.tour && typeof tourTurnOf === 'function') return tourTurnOf(state);

  // Any open vote this phone hasn't cast, unless every option is its own
  // (the storyteller in صدق ولا كذب). An owner may be hidden, with only this
  // phone's own option named in `you.voteOwn` (isOwnVoteOption).
  const v = s.vote;
  const own = (o) => (typeof isOwnVoteOption === 'function' ? isOwnVoteOption(state, o) : o.ownerId === me);
  if (v && v.phase === 'voting' && has(v.eligible) && !has(v.voted) && (v.options || []).some(o => !own(o))) {
    return 'turn_vote';
  }

  switch (state.game) {
    case 'bomb':
      return s.phase === 'ticking' && s.holderId === me ? 'turn_bomb' : null;
    case 'drawguess':
      return state.phase === 'drawing' && s.drawerId === me && !s.word ? 'turn_draw' : null;
    case 'fakeartist':
      if (s.phase === 'drawing' && s.currentDrawerId === me) return 'turn_draw';
      return s.phase === 'guessing' && s.fakeId === me ? 'turn_guess' : null;
    case 'codenames': {
      const mine = (s.teams || {})[me];
      if (state.phase !== 'playing' || !mine || s.winner || mine.team !== s.turn) return null;
      if (!s.clue) return mine.role === 'spymaster' ? 'turn_clue' : null;
      return mine.role === 'operative' ? 'turn_team_guess' : null;
    }
    case 'wavelength':
      return s.phase === 'clue' && s.psychicId === me ? 'turn_clue' : null;
    case 'justone':
      if (s.phase === 'writing') return me !== s.guesserId && inRound && !has(s.submitted) ? 'turn_write' : null;
      return s.phase === 'guessing' && s.guesserId === me ? 'turn_guess' : null;
    case 'fibbage':
    case 'twotruths':
    case 'herd':
    case 'stop':
      return s.phase === 'writing' && inRound && !has(s.submitted) ? 'turn_write' : null;
    case 'trivia':
      return s.phase === 'answering' && inRound && !has(s.answered) ? 'turn_answer' : null;
    case 'emoji':
    case 'proverbs':
      if (s.solve) return roomSolveTurn(state);   // a written riddle, or the race (JS_RoomSolve.html)
      return s.phase === 'answering' && inRound && !has(s.solved) && (s.retry || !has(s.tried)) ? 'turn_answer' : null;
    case 'fiveseconds':
      return s.phase === 'ready' && s.turnId === me ? 'turn_up' : null;
    case 'monkey':
      return s.phase === 'play' && s.turnId === me ? 'turn_up' : null;
    case 'telephone': {
      const task = state.you && state.you.task;
      if (s.phase !== 'working' || !task || has(s.submitted)) return null;
      return task.kind === 'draw' ? 'turn_draw' : 'turn_write';
    }
    case 'imposter':
      return state.phase === 'guess' && s.guesserId === me ? 'turn_guess' : null;
    case 'spyfall':
      return s.phase === 'guess' && s.guesserId === me ? 'turn_guess' : null;
    case 'chameleon':
      return s.phase === 'guess' && s.chameleonId === me ? 'turn_guess' : null;
    case 'mafia':
      return s.phase === 'night' && has(s.alive) && !has(s.acted) ? 'turn_night' : null;
    case 'mind':
      // In العقل it is always your turn: anyone holding a card may play it.
      return s.phase === 'play' && ((s.held || {})[me] || 0) > 0 ? 'turn_up' : null;
    case 'timeline':
      return s.phase === 'play' && s.turnId === me ? 'turn_up' : null;
    case 'guesswho':
      // Your face to pick, your question or guess, faces to flip, or the other's out-loud question to answer.
      if (!Array.isArray(s.seats) || s.seats.indexOf(me) === -1) return null;
      if (s.phase === 'pick') return s.picked && !s.picked[s.seats.indexOf(me)] ? 'turn_up' : null;
      if (s.phase !== 'play') return null;
      if (s.stage === 'answer') return s.seats[1 - s.turn] === me ? 'turn_up' : null;
      return s.seats[s.turn] === me ? 'turn_up' : null;
    case 'wordle':
    case 'guessnum':
    case 'flags':
      return roomSolveTurn(state);
    case 'hangman':
      // The word to write, or your own board still being guessed.
      if (s.phase === 'writing') return s.setter === me ? 'turn_up' : null;
      return s.phase === 'guessing' && (state.you || {}).state === 'play' ? 'turn_up' : null;
    case 'minigolf':
      // In turns: the player up. All at once: anyone whose ball is still out.
      if (s.phase !== 'play' || !s.balls || !s.balls[me] || s.balls[me].done) return null;
      return !s.settings || s.settings.mode !== 'turns' || s.turn === me ? 'turn_up' : null;
    case 'chess':
      // Your move, or a draw offered to you (RoomChess.js).
      if (!Array.isArray(s.seats) || s.seats.indexOf(me) === -1 || s.phase !== 'play' || !s.chess || s.chess.result) return null;
      // الوزير المستخبي: your pawn to pick before the first move.
      if (s.chess.hq && s.chess.hq.picking) return s.chess.hq.picked[s.seats.indexOf(me)] ? null : 'turn_up';
      if (s.chess.offer && s.seats[s.chess.offer.seat] !== me) return 'turn_up';
      return s.seats[s.chess.g.turn] === me ? 'turn_up' : null;
    case 'votechess': {
      // Your team's vote, not cast yet (RoomVoteChess.js).
      const v = s.vote;
      const team = (s.teams || []).findIndex(t => (t || []).indexOf(me) !== -1);
      return s.phase === 'play' && v && team === v.team && (v.voted || []).indexOf(me) === -1 ? 'turn_vote' : null;
    }
    case 'handbrain': {
      // The Brain to name a piece, or the Hand to move it (RoomHandBrain.js).
      if (s.phase !== 'play' || !s.chess || s.chess.result) return null;
      const team = (s.teams || [])[s.chess.g.turn] || [];
      return team[s.stage === 'name' ? 0 : 1] === me ? 'turn_up' : null;
    }
    case 'bughouse': {
      // Your move on your own board (RoomBughouse.js): seat k plays board k >> 1 with colour k & 1.
      const k = Array.isArray(s.seats) ? s.seats.indexOf(me) : -1;
      if (k === -1 || s.phase !== 'play' || !Array.isArray(s.boards)) return null;
      return s.boards[k >> 1].g.turn === (k & 1) ? 'turn_up' : null;
    }
    case 'chess4':
      // Your colour to move (RoomChess4.js).
      if (!Array.isArray(s.seats) || s.phase !== 'play' || !s.g || s.g.over) return null;
      return s.seats[s.g.turn] === me ? 'turn_up' : null;
    case 'battleship':
      // Your fleet to place, or your shot (RoomBattleship.js).
      if (!Array.isArray(s.seats) || s.seats.indexOf(me) === -1) return null;
      if (s.phase === 'place') return Array.isArray(s.ready) && !s.ready[s.seats.indexOf(me)] ? 'turn_up' : null;
      return s.phase === 'play' && s.seats[s.turn] === me ? 'turn_up' : null;
    case 'bowling':
      // Your ball to throw.
    case 'doubt':
      // The player up: lead a rank, or follow it or pass.
      return s.phase === 'play' && s.turn && s.turn.pid === me ? 'turn_up' : null;
    case 'oldmaid':
      // The one who draws from the next hand.
      return s.phase === 'play' && s.turn && s.turn.pid === me ? 'turn_up' : null;
    case 'connect4':
    case 'dots':
    case 'xo':
      // The duels: only the seat whose move it is (RoomDuels.js).
      return s.phase === 'play' && Array.isArray(s.seats) && s.seats[s.turn] === me ? 'turn_up' : null;
    case 'uno':
      // The player up (a colour to pick, a card to play or a drawn one to decide on).
      return s.phase === 'play' && s.turn && s.turn.pid === me ? 'turn_up' : null;
    case 'bank':
      // Your turn, or an offer waiting on your answer.
      return s.phase === 'play' && ((s.turn && s.turn.pid === me) || (s.offer && s.offer.to === me)) ? 'turn_up' : null;
    case 'ludo':
      // The roll, or the piece to move: whoever holds the turn.
      return s.phase === 'play' && s.turn && s.turn.pid === me ? 'turn_up' : null;
    case 'domino':
      // The tile to play, the draw or the knock: whoever holds the turn.
      return s.phase === 'play' && s.turn === me ? 'turn_up' : null;
    case 'screw':
      if (s.phase === 'memorize') return has(s.order) && !has(s.ready) ? 'turn_memorize' : null;
      // بوم: every other player picks a card of their own, and the player of it waits.
      if (s.phase === 'play' && s.turn && s.turn.stage === 'boom') {
        const boom = s.boom || {};
        return has(boom.waiting) && !has(boom.picked) ? 'turn_boom_pick' : null;
      }
      if (s.phase === 'play') return s.turn && s.turn.pid === me ? 'turn_up' : null;
      // The thief vote: every seated phone, until it has voted.
      return s.phase === 'thiefGuess' && has(s.order) && !has((s.thiefVote || {}).voted) ? 'turn_thief_vote' : null;
  }
  return null;
}

function showTurnBanner(key) {
  const el = document.getElementById('turn-banner');
  if (!el) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const title = document.getElementById('turn-banner-title');
  const sub = document.getElementById('turn-banner-sub');
  if (title) title.textContent = t.turn_title || '';
  if (sub) sub.textContent = t[key] || '';
  el.hidden = false;
  el.classList.remove('is-in');
  void el.offsetWidth;                    // restart the entrance
  el.classList.add('is-in');
  playSound('success');
  haptic('medium');
  clearTimeout(roomTurn.bannerTimer);
  roomTurn.bannerTimer = setTimeout(hideTurnBanner, TURN_BANNER_MS);
}

function hideTurnBanner() {
  clearTimeout(roomTurn.bannerTimer);
  const el = document.getElementById('turn-banner');
  if (el) el.hidden = true;
}

/** The banner takes you to the room if you had wandered off to another screen. */
function turnBannerTap() {
  hideTurnBanner();
  if (typeof onRoomView === 'function' && !onRoomView() && typeof roomReturnToActive === 'function') roomReturnToActive();
}

/** After waking: wait until the server has answered, then say whether it's your turn. */
function checkTurnAfterWake() {
  clearTimeout(roomTurn.timer);
  const tick = () => {
    if (!roomTurn.wakeAt || document.hidden || !Room.isIn) { roomTurn.wakeAt = 0; return; }
    if (Room.heardAt > roomTurn.wakeAt) {
      roomTurn.wakeAt = 0;
      // A beat, so the fresh state is on screen before the banner points at it.
      roomTurn.timer = setTimeout(() => {
        const key = roomTurnOf(Room.state);
        if (key) showTurnBanner(key);
      }, 150);
      return;
    }
    // Never caught up: say nothing rather than something stale.
    if (Date.now() - roomTurn.wakeAt > TURN_WAIT_MS) { roomTurn.wakeAt = 0; return; }
    roomTurn.timer = setTimeout(tick, 250);
  };
  tick();
}

function restoreTurnTitle() {
  if (!roomTurn.titled) return;
  document.title = roomTurn.title;
  roomTurn.titled = false;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    roomTurn.hiddenAt = Date.now();
    return;
  }
  restoreTurnTitle();
  const away = roomTurn.hiddenAt ? Date.now() - roomTurn.hiddenAt : 0;
  roomTurn.hiddenAt = 0;
  if (!Room.isIn || away < TURN_AWAY_MS) return;
  roomTurn.wakeAt = Date.now();
  checkTurnAfterWake();
});

// Hidden but still hearing the room: the tab title carries it.
Room.onChange((state) => {
  if (!document.hidden) return;
  const key = roomTurnOf(state);
  if (key && !roomTurn.titled) {
    const t = TRANSLATIONS[appState.lang] || {};
    roomTurn.title = document.title;
    document.title = '🔔 ' + (t.turn_title || '') + (roomTurn.title ? ' · ' + roomTurn.title : '');
    roomTurn.titled = true;
  } else if (!key) {
    restoreTurnTitle();
  }
});
</script>
