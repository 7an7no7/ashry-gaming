<script>
/* ============================================================================
   الخزنة («صندوق جدّو») — the talking safe game (rooms and the TV), 1 Oct 2026
   ----------------------------------------------------------------------------
   Grandpa's old wooden chest in the attic, locked with up to four brass
   padlocks; the notebook that opens them is in grandpa's hand, torn into pages.
   The server deals the safe, the pages and judges every move (RoomVault.js);
   the locks and the notebook are drawn from Vault.js. A phone draws what it
   holds (state.you: its locks, its pages) and the table's state (shared: who
   holds what, the padlocks open, the mistakes, the candles).

   The look the owner picked (look ب «صندوق جدّو» on the design sheet):
     phone   the chest's wood; one lock at a time shown big, the four padlocks
             on a hasp along the top (a tap on one, a swipe or the arrows move
             between them; after one opens the next comes by itself); the time a
             melting candle, mistakes chalk ✗ marks on the wood. The notebook is
             grandpa's lined page with doodles and tape.
     TV      the attic: the pages hanging on a washing line with each holder's
             name, the chest below with its padlocks, the candle and a chalk
             board; the lid opens with a glow when the safe does. Never a lock's
             look or a page's words (unless the host made the TV the opener).
   Every name here starts with vt / VT_. Style.html section 61 (.vt-*).
   ========================================================================= */
const VT_OPTS_KEY = 'vault';
const VT_OPTS_DEFAULT = { way: 'one', mistakes: 'strikes', win: 'levels', count: 5, opener: 'phone' };
const VT_WAY_ICON = { one: '📱📖', all: '📱📱', teams: '⚔️' };

const vt = {
  gap: Infinity,     // the smallest (receivedAt − serverNow) seen: the server's clock here
  seen: {},          // per deal: the last event seq played
  cur: {},           // per safe: the lock on the stage
  dir: 0,            // the stage's last move (1 next, -1 back) for its slide
  arm: null,         // a wire tapped once: { key, i, w }
  dial: {},          // per safe and lock: the digits on the wheels, [d, d, d]
  page: {},          // per safe: the page shown of several
  tab: 'lock',       // «الكل» on a narrow phone: the lock or the notebook
  loop: 0, el: null, tv: false,
  momentTimer: null, toastTimer: null, autoTimer: null,
  lampAt: 0, tickSec: -1
};

const vtT = () => TRANSLATIONS[appState.lang] || {};
const vtL = () => (typeof contentLang === 'function' && contentLang() === 'en' ? 'en' : 'ar');
const vtK = () => (vtL() === 'en' ? 1 : 0);
const vtFill = (str, vars) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
const vtIso = (s) => '⁨' + s + '⁩';
function vtOpts() { return recallOptions(VT_OPTS_KEY, VT_OPTS_DEFAULT); }
function vtSetOpt(patch) {
  rememberOptions(VT_OPTS_KEY, patch);
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
}
function vtNoteTime(state) {
  if (state && typeof state.serverNow === 'number' && typeof state.receivedAt === 'number') vt.gap = Math.min(vt.gap, state.receivedAt - state.serverNow);
}
const vtNow = () => (isFinite(vt.gap) ? Date.now() - vt.gap : Date.now());
const vtName = (state, id) => ((state.players || []).find((p) => p.id === id) || {}).name || '';
const vtClockText = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const vtLockName = (k) => (VAULT_LOCK_NAMES[k] || ['', ''])[vtK()];
const vtColorName = (c) => (VAULT_COLOR_NAMES[c] || ['', ''])[vtK()];
const vtSafeKey = (state) => roomDealKey(state, ((state.shared || {}).safeNo || 0));
/** A side's candle now (Vault.js numbers; the same sum the server does). */
const vtLeft = (side, now) => (side ? Math.max(0, side.left - Math.max(0, now - side.at) * side.rate) : 0);

/** The one voice: the TV (the first online screen), else the host's phone. */
function vtIsVoice(state) {
  const screens = (state.screens || []).filter((x) => x.online).map((x) => x.id).sort();
  if (state.youAreScreen) return screens[0] === Room.me;
  return !!state.youAreHost && !screens.length;
}

/** This device's side and what it holds: { key, side, h } (h: { locks, pages }), or null. */
function vtMine(state) {
  const s = state.shared || {};
  const me = Room.me;
  const keys = Object.keys(s.sides || {});
  for (let n = 0; n < keys.length; n++) {
    const side = s.sides[keys[n]];
    if (state.youAreScreen && side.opener === 'tv') return { key: keys[n], side, h: { locks: (s.locks || []).map((l) => l.i), pages: [] }, tv: true };
    if (side.holders && side.holders[me]) return { key: keys[n], side, h: side.holders[me] };
  }
  return null;
}
/** The locks this device sees (their looks and progress): its slice, or the screen's when the TV opens. */
const vtMyLocks = (state) => ((state.youAreScreen ? (state.screen || {}).locks : (state.you || {}).locks) || []);
const vtMyPages = (state) => ((state.you || {}).pages || []);

/* --- the words of the notebook (the games' language: contentLang) -------------- */
const VT_WORDS = {
  ar: {
    ord: ['الأول', 'التاني', 'التالت', 'الرابع', 'الخامس', 'السادس'], last: 'الأخير',
    none: 'مفيش ولا سلك {c}', lastIs: 'آخر سلك {c}', firstIs: 'أول سلك {c}', many: 'أكتر من سلك {c}', one: 'سلك {c} واحد بس',
    cutPos: 'اقطع {o}', cutLastOf: 'اقطع آخر سلك {c}', cutFirstOf: 'اقطع أول سلك {c}',
    rule: 'لو {if} ← {do}', otherwise: 'غير كده ← {do}', wiresN: '{n} أسلاك',
    wiresHow: 'عِد الأسلاك من فوق لتحت واقطع واحد بس. أول قاعدة تنطبق هي اللي تمشي عليها.',
    symHow: 'الرموز اللي على القفل كلهم في عمود واحد بس. لاقيه، وقول للي بيفتح يدوس عليهم بترتيبهم من فوق لتحت. ماحدش يعرف أساميهم — وصّفوهم!',
    col: 'عمود {n}',
    dialHow: 'القرص بيوري شكل. كل شكل ليه كود من 3 أرقام، يتلف من الشمال لليمين.',
    lastOdd: 'لو آخر رقم في رقم الصندوق فردي: اقرا الكود بالمقلوب.',
    firstEven: 'لو أول رقم في رقم الصندوق زوجي: اقرا الكود بالمقلوب.',
    sumBig: 'لو مجموع أرقام رقم الصندوق 20 أو أكتر: اقرا الكود بالمقلوب.',
    lightsHow: 'النور بيرمش ألوان ورا بعض وبيعيد. لكل لون دوس الزرار اللي قصاده بنفس الترتيب. الجدول بيتغيّر مع الغلطات — في أي قفل!',
    flash: 'لو رمش', row0: 'مفيش غلطات', row1: 'غلطة واحدة', row2: 'غلطتين أو أكتر', press: 'دوس',
    whyWires: '{n} أسلاك: {rule}', whyNoRule: 'مفيش قاعدة اتطبقت', whyCut: 'كان لازم تقطع السلك {o} ({c})',
    whySym: 'الرموز كلها في {col}، بالترتيب:', whyRev: 'ورقم الصندوق {no} بيقلبه ← {code}', whyRow: 'بـ«{row}»:',
    grandpa: ['جدّو: «بالراحة يا حبيبي، ماتستعجلش»', 'جدّو: «اقرا القاعدة للآخر»', 'جدّو: «اللي يغلط يعيد من الأول»', 'جدّو: «اسأل قبل ما تقطع»']
  },
  en: {
    ord: ['first', 'second', 'third', 'fourth', 'fifth', 'sixth'], last: 'last',
    none: 'there is no {c} wire', lastIs: 'the last wire is {c}', firstIs: 'the first wire is {c}', many: 'there is more than one {c} wire', one: 'there is exactly one {c} wire',
    cutPos: 'cut the {o} wire', cutLastOf: 'cut the last {c} wire', cutFirstOf: 'cut the first {c} wire',
    rule: 'If {if} → {do}', otherwise: 'Otherwise → {do}', wiresN: '{n} wires',
    wiresHow: 'Count the wires from the top and cut one only. The first rule that applies is the one to follow.',
    symHow: 'All the symbols on the lock are in one column only. Find it, and tell the opener to press them in its order, top to bottom. Nobody knows their names - describe them!',
    col: 'Column {n}',
    dialHow: 'The dial shows a shape. Every shape has a 3-number code, turned from left to right.',
    lastOdd: 'If the chest number ends in an odd digit: read the code backwards.',
    firstEven: 'If the chest number starts with an even digit: read the code backwards.',
    sumBig: 'If the chest number\'s digits add up to 20 or more: read the code backwards.',
    lightsHow: 'The lamp flashes colours one after another, again and again. For each colour press the button opposite it, in the same order. The table changes with the mistakes - on any lock!',
    flash: 'If it flashes', row0: 'No mistakes', row1: 'One mistake', row2: 'Two or more', press: 'Press',
    whyWires: '{n} wires: {rule}', whyNoRule: 'No rule applied', whyCut: 'it was the {o} wire ({c})',
    whySym: 'They are all in {col}, in this order:', whyRev: 'and chest number {no} turns it round → {code}', whyRow: 'With «{row}»:',
    grandpa: ['Grandpa: "Easy, son, no rush"', 'Grandpa: "Read the rule to the end"', 'Grandpa: "A mistake starts it over"', 'Grandpa: "Ask before you cut"']
  }
};
const vtW = () => VT_WORDS[vtL()];
const vtChip = (c) => `<span class="vt-cw" style="--wc:${VAULT_COLORS[c] || '#999'}">${escapeHTML(vtColorName(c))}</span>`;

function vtRuleHtml(rule, n) {
  const w = vtW();
  const ordOf = (p) => (p >= n - 1 ? w.last : w.ord[p] || String(p + 1));
  const d = rule.do || {};
  const act = d.t === 'lastOf' ? vtFill(w.cutLastOf, { c: vtChip(d.c) }) : d.t === 'firstOf' ? vtFill(w.cutFirstOf, { c: vtChip(d.c) }) : vtFill(w.cutPos, { o: escapeHTML(ordOf(d.p)) });
  if (!rule.if) return vtFill(w.otherwise, { do: act });
  const key = { none: 'none', last: 'lastIs', first: 'firstIs', many: 'many', one: 'one' }[rule.if.t];
  return vtFill(w.rule, { if: vtFill(w[key], { c: vtChip(rule.if.c) }), do: act });
}

/* --- the drawings --------------------------------------------------------------- */
const vtSymSvg = (id) => `<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="${VAULT_SYMBOLS[id] || ''}"/></svg>`;
const vtShapeSvg = (id, fill) => `<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="${(VAULT_SHAPES[id] || {}).d || ''}" fill="${fill || '#ffd166'}" stroke="#221f36" stroke-width="3" stroke-linejoin="round"/></svg>`;
/** A brass padlock, its shackle up when open. */
function vtPadSvg(open) {
  return `<svg viewBox="0 0 44 56" aria-hidden="true" focusable="false"><g class="vt-shk"${open ? ' transform="translate(0 -7)"' : ''}><path d="M12 26V15a10 10 0 0 1 20 0V${open ? 19 : 26}" fill="none" stroke="#221f36" stroke-width="9" stroke-linecap="round"/><path d="M12 26V15a10 10 0 0 1 20 0V${open ? 19 : 26}" fill="none" stroke="#d7dbe2" stroke-width="4" stroke-linecap="round"/></g><rect x="4" y="24" width="36" height="28" rx="7" fill="${open ? '#7fd99a' : '#d9a441'}" stroke="#221f36" stroke-width="4"/><circle cx="22" cy="35" r="4" fill="#221f36"/><path d="M22 37v7" stroke="#221f36" stroke-width="4" stroke-linecap="round"/></svg>`;
}
function vtCandleHtml(cls) {
  return `<div class="vt-cnd ${cls || ''}" aria-hidden="true"><div class="vt-cnd__h"><i class="vt-cnd__w"><i class="vt-cnd__f"></i></i></div><div class="vt-cnd__s"></div></div>`;
}
const VT_DOODLE = '<svg class="vt-doodle" viewBox="0 0 70 60" aria-hidden="true" focusable="false"><g fill="none" stroke="#2f6fd6" stroke-width="2.5" stroke-linecap="round"><circle cx="20" cy="22" r="12"/><path d="M15 20h1M24 20h1M15 27q5 4 10 0"/><path d="M20 34V50M20 40L10 46M20 40L30 46M20 50L12 58M20 50L28 58"/><path d="M44 30l5-10 5 10-10-6h10z"/></g></svg>';
const VT_CHEST_OPEN = '<svg viewBox="0 0 200 140" aria-hidden="true" focusable="false"><path d="M30 60L40 10H160L170 60Z" fill="#a3602f" stroke="#221f36" stroke-width="5"/><rect x="20" y="60" width="160" height="72" rx="8" fill="#ae6a3c" stroke="#221f36" stroke-width="5"/><g fill="#ffd166" stroke="#221f36" stroke-width="3"><circle cx="60" cy="60" r="12"/><circle cx="84" cy="54" r="12"/><circle cx="110" cy="58" r="12"/><circle cx="136" cy="54" r="12"/><circle cx="98" cy="44" r="12"/></g><rect x="88" y="78" width="24" height="26" rx="5" fill="#d9a441" stroke="#221f36" stroke-width="4"/></svg>';

/* --- a lock, on the stage ------------------------------------------------------- */
function vtLockHtml(state, lock) {
  const t = vtT();
  const s = state.shared || {};
  const key = vtSafeKey(state) + '|' + lock.i;
  if (lock.k === 'wires') {
    const cut = (lock.prog || {}).cut || [];
    const armed = vt.arm && vt.arm.key === key ? vt.arm.w : -1;
    return `<div class="vt-w vt-wires">${lock.look.wires.map((c, w) => {
      const isCut = cut.indexOf(w) !== -1;
      return `<button type="button" class="vt-wire${isCut ? ' is-cut' : ''}${w === armed ? ' is-armed' : ''}" data-vt="cut" data-w="${w}" style="--wc:${VAULT_COLORS[c]}" aria-label="${escapeHTML(vtFill(t.vt_wire_aria, { n: w + 1, c: vtColorName(c) }))}"${isCut ? ' disabled' : ''}>
        <i class="vt-wire__n metric">${w + 1}</i><span class="vt-wire__c"><i></i><i></i></span><em class="vt-wire__x" aria-hidden="true">✂</em></button>`;
    }).join('')}<p class="vt-w__hint">${escapeHTML(armed >= 0 ? t.vt_wire_again : t.vt_wire_hint)}</p></div>`;
  }
  if (lock.k === 'symbols') {
    const pressed = (lock.prog || {}).pressed || [];
    return `<div class="vt-w vt-syms vt-syms--${lock.look.syms.length}">${lock.look.syms.map((id) => {
      const p = pressed.indexOf(id);
      return `<button type="button" class="vt-sym${p !== -1 ? ' is-on' : ''}" data-vt="sym" data-s="${escapeHTML(id)}" aria-label="${escapeHTML(t.vt_sym_aria)}">${vtSymSvg(id)}${p !== -1 ? `<i class="metric">${p + 1}</i>` : ''}</button>`;
    }).join('')}</div>`;
  }
  if (lock.k === 'dial') {
    const dg = vt.dial[key] || (vt.dial[key] = [0, 0, 0]);
    return `<div class="vt-w vt-dial"><div class="vt-shape">${vtShapeSvg(lock.look.shape)}</div>
      <div class="vt-dgs" dir="ltr">${dg.map((d, n) => `<div class="vt-dg"><button type="button" class="vt-dg__b" data-vt="dg" data-n="${n}" data-d="1" aria-label="${escapeHTML(vtFill(t.vt_dial_up, { n: n + 1 }))}">▲</button><b class="metric" data-vt-dg="${n}">${d}</b><button type="button" class="vt-dg__b" data-vt="dg" data-n="${n}" data-d="-1" aria-label="${escapeHTML(vtFill(t.vt_dial_down, { n: n + 1 }))}">▼</button></div>`).join('')}</div>
      <button type="button" class="vt-try" data-vt="try">${escapeHTML(t.vt_try)}</button></div>`;
  }
  const n = (lock.prog || {}).n || 0;
  return `<div class="vt-w vt-lights"><span class="vt-lamp" data-vt-lamp="${escapeHTML(lock.look.seq.join(','))}"></span>
    <div class="vt-ldots">${lock.look.seq.map((c, k) => `<i class="${k < n ? 'is-on' : ''}"></i>`).join('')}</div>
    <div class="vt-lbs">${VAULT_LIGHT_COLORS.map((c) => `<button type="button" class="vt-lb" data-vt="light" data-c="${c}" style="--lc:${VAULT_COLORS[c]}"><span>${escapeHTML(vtColorName(c))}</span></button>`).join('')}</div></div>`;
}

/** The stage: the lock shown big, the arrows, the dots, its padlock open over it. */
function vtStageHtml(state, mine, locks) {
  const t = vtT();
  const s = state.shared || {};
  if (!locks.length) return '';
  const sk = vtSafeKey(state);
  let cur = vt.cur[sk];
  if (!locks.some((l) => l.i === cur)) cur = vt.cur[sk] = (locks.find((l) => !mine.side.open[l.i]) || locks[0]).i;
  const at = locks.findIndex((l) => l.i === cur);
  const lock = locks[at];
  const open = !!mine.side.open[lock.i];
  const many = locks.length > 1;
  const dir = vt.dir; vt.dir = 0;
  return `<div class="vt-stage" data-vt-swipe>
    <div class="vt-tag">${escapeHTML(vtFill(t.vt_lock_of, { n: at + 1, m: locks.length }))} · ${escapeHTML(vtLockName(lock.k))}</div>
    <div class="vt-slide ${dir > 0 ? 'in-n' : dir < 0 ? 'in-p' : ''}" data-vt-i="${lock.i}">${vtLockHtml(state, lock)}</div>
    ${open ? `<div class="vt-opened">${vtPadSvg(true)}<span>${escapeHTML(t.vt_open_lock)}</span></div>` : ''}
    ${many ? `<button type="button" class="vt-arr vt-arr--p" data-vt="pv" aria-label="${escapeHTML(t.vt_prev)}">‹</button><button type="button" class="vt-arr vt-arr--n" data-vt="nx" aria-label="${escapeHTML(t.vt_next)}">›</button>
    <div class="vt-dots">${locks.map((l) => `<i class="${l.i === lock.i ? 'is-on' : mine.side.open[l.i] ? 'is-ok' : ''}"></i>`).join('')}</div>` : ''}
  </div>${!open && s.phase === 'play' && vtKeysOf(state, mine.key) > 0 ? `<button type="button" class="vt-usekey" data-vt="key">🗝️ ${escapeHTML(vtFill(t.vt_key_use, { n: vtKeysOf(state, mine.key) }))}</button>` : ''}`;
}

/** «المفتاح الاحتياطي» (804): the spare keys a side has hanging. */
const vtKeysOf = (state, key) => Number((((state.shared || {}).keys) || {})[key]) || 0;

/* --- the notebook --------------------------------------------------------------- */
function vtPageBody(page, state) {
  const w = vtW();
  const s = state.shared || {};
  if (page.k === 'wires') {
    return `<p class="vt-mi">${escapeHTML(w.wiresHow)}</p>${Object.keys(page.rules).map((n) => `<div class="vt-rb"><b>${escapeHTML(vtFill(w.wiresN, { n }))}</b><ol>${page.rules[n].map((r, k) => `<li><b class="vt-rn metric">${k + 1}</b><span>${vtRuleHtml(r, Number(n))}</span></li>`).join('')}</ol></div>`).join('')}`;
  }
  if (page.k === 'symbols') {
    return `<p class="vt-mi">${escapeHTML(w.symHow)}</p><div class="vt-cols">${page.cols.map((c) => `<div class="vt-col"><b>${escapeHTML(vtFill(w.col, { n: c.n }))}</b>${c.syms.map(vtSymSvg).join('')}</div>`).join('')}</div>`;
  }
  if (page.k === 'dial') {
    return `<p class="vt-mi">${escapeHTML(w.dialHow)}</p><table class="vt-dtab"><tbody>${page.codes.map((x) => `<tr><td>${vtShapeSvg(x.s, '#fff')} ${escapeHTML((VAULT_SHAPES[x.s] || {})[vtL()] || '')}</td><td class="vt-code metric" dir="ltr">${x.c.join(' · ')}</td></tr>`).join('')}</tbody></table>
      <div class="vt-twist">⚠ ${escapeHTML(w[page.twist] || '')}</div>`;
  }
  const mine = vtMine(state);
  const row = vaultLightRowOf(mine ? mine.side.mistakes : 0);
  return `<p class="vt-mi">${escapeHTML(w.lightsHow)}</p><table class="vt-ltab"><thead><tr><th>${escapeHTML(w.flash)}</th>${[w.row0, w.row1, w.row2].map((h, k) => `<th class="${k === row ? 'is-now' : ''}">${escapeHTML(h)}</th>`).join('')}</tr></thead>
    <tbody>${page.colors.map((c, ci) => `<tr><td>${vtChip(c)}</td>${page.rows.map((r, k) => `<td class="${k === row ? 'is-now' : ''}">${vtChip(r[ci])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function vtPageTitle(page) {
  const t = vtT();
  return vtLockName(page.k) + (page.part ? ' ' + vtFill(t.vt_part, { n: page.part }) : '');
}
function vtNotebookHtml(state, mine, pages) {
  const t = vtT();
  if (!pages.length) return '';
  const sk = vtSafeKey(state);
  const at = Math.min(pages.length - 1, vt.page[sk] || 0);
  const page = pages[at];
  const tabs = pages.length > 1 ? `<div class="vt-ptabs" role="tablist">${pages.map((p, n) => `<button type="button" role="tab" class="vt-ptab${n === at ? ' is-on' : ''}" aria-selected="${n === at}" data-vt="pg" data-n="${n}">${escapeHTML(vtPageTitle(p))}</button>`).join('')}</div>` : '';
  const note = vtW().grandpa[(page.k.length + (page.part || 0)) % vtW().grandpa.length];
  return `<div class="vt-book">${tabs}
    <div class="vt-man vt-man--${page.k}" data-vt-page="${escapeHTML(page.u)}"><span class="vt-tape"></span>${VT_DOODLE}
      <span class="vt-man__pg metric">${at + 1}/${pages.length}</span>
      <h3>${escapeHTML(vtPageTitle(page))}</h3>
      <div data-vt-pagebody>${vtPageBody(page, state)}</div>
      <span class="vt-gnote">${escapeHTML(note)}</span></div>
    <p class="vt-others" data-vt-others></p></div>`;
}

/** Who holds what, for the notebook's foot: «الأسلاك مع منى · بيفتح: حسن». */
function vtOthersText(state, mine) {
  const t = vtT();
  if (!mine) return '';
  const side = mine.side;
  const me = Room.me;
  const parts = [];
  if (side.opener === 'tv') parts.push(t.vt_tv_opens);
  else if (side.opener && side.opener !== me) parts.push(vtFill(t.vt_opener_is, { name: vtIso(vtName(state, side.opener)) }));
  Object.keys(side.holders || {}).forEach((id) => {
    if (id === me) return;
    const h = side.holders[id];
    if ((state.shared || {}).way === 'all' && h.locks.length) parts.push(vtFill(t.vt_holds_lock, { name: vtIso(vtName(state, id)), lock: h.locks.map((i) => vtLockName(state.shared.locks[i].k)).join('، ') }));
    if (h.pages.length) parts.push(vtFill(t.vt_holds_page, { name: vtIso(vtName(state, id)), page: h.pages.map((u) => vtLockName(vaultUnitKind(u)) + (vaultUnitPart(u) ? ' ' + vtFill(t.vt_part, { n: vaultUnitPart(u) }) : '')).join('، ') }));
  });
  return parts.join(' · ');
}

/* --- the phone ------------------------------------------------------------------ */
function vtTopHtml(state, mine) {
  const t = vtT();
  const s = state.shared || {};
  const side = mine ? mine.side : (s.sides || {}).x || (s.sides || {}).a;
  const pads = (s.locks || []).map((l) => {
    const open = side && side.open[l.i];
    const holder = s.way === 'all' && side ? Object.keys(side.holders || {}).find((id) => side.holders[id].locks.indexOf(l.i) !== -1) : '';
    const mineLock = mine && mine.h.locks.indexOf(l.i) !== -1;
    const label = holder ? vtName(state, holder) : vtLockName(l.k);
    return `<button type="button" class="vt-pad${open ? ' is-open' : ''}${mineLock ? ' is-mine' : ''}" data-vt="go" data-i="${l.i}" data-vt-pad="${l.i}"${mineLock ? '' : ' tabindex="-1"'} aria-label="${escapeHTML(vtLockName(l.k))}">${vtPadSvg(open)}<span>${escapeHTML(label)}</span></button>`;
  }).join('');
  const team = s.way === 'teams' && mine ? `<div class="vt-ribbon vt-ribbon--${mine.key}" data-vt-ribbon></div>` : '';
  return `<div class="vt-top">
    <div class="vt-cndw" data-vt-side="${mine ? mine.key : (s.sides || {}).a ? 'a' : 'x'}">${vtCandleHtml()}<b class="vt-clock metric" data-vt-clock dir="ltr">0:00</b></div>
    <div class="vt-hasp"><div class="vt-lvl" data-vt-lvl></div>${team}<div class="vt-pads">${pads}</div><div class="vt-keys" data-vt-keys hidden></div></div>
  </div>`;
}

function vtPhoneHtml(state) {
  const t = vtT();
  const s = state.shared || {};
  if (s.phase === 'gameover') return vtOverHtml(state, false) + renderRoomPlayerStrip(state);
  const mine = vtMine(state);
  const locks = vtMyLocks(state);
  const pages = vtMyPages(state);
  let body;
  let role = 'watch';
  if (!mine) {
    body = `<div class="vt-watch">${escapeHTML(t.vt_watching)}</div>`;
  } else if (locks.length && pages.length) {
    role = 'both';
    body = `<div class="vt-bodybox"><div class="vt-seg segmented" role="tablist"><button type="button" class="segmented__item ${vt.tab !== 'page' ? 'is-active' : ''}" data-vt="tab" data-n="lock" aria-pressed="${vt.tab !== 'page'}">🔐 ${escapeHTML(t.vt_tab_lock)}</button><button type="button" class="segmented__item ${vt.tab === 'page' ? 'is-active' : ''}" data-vt="tab" data-n="page" aria-pressed="${vt.tab === 'page'}">📖 ${escapeHTML(t.vt_tab_page)}</button></div>
      <div class="vt-both"><div class="vt-both__lock" data-vt-stagebox></div><div class="vt-both__page" data-vt-bookbox></div></div></div>`;
  } else if (locks.length) {
    role = 'opener';
    body = `<div data-vt-stagebox></div>`;
  } else {
    role = 'reader';
    body = '<div data-vt-bookbox></div>';
  }
  return `<div class="vt vt--${role}${vt.tab === 'page' ? ' is-tab-page' : ''}" data-vt-root>
      ${vtTopHtml(state, mine)}
      ${body}
      <div class="vt-foot"><span class="vt-x" data-vt-x></span><span class="vt-foot__l" data-vt-hint></span><span class="vt-serial" data-vt-serial></span></div>
      <div class="vt-res" data-vt-res hidden></div>
      <div class="vt-stamp" data-vt-stamp aria-live="polite"></div><div class="vt-red"></div>
    </div>
    <div data-vt-host></div>${renderRoomPlayerStrip(state)}`;
}

/** The end: the levels cleared and the room's best, or the set's podium and board. */
function vtOverHtml(state, tv) {
  const t = vtT();
  const s = state.shared || {};
  const rise = motionFirst(['vt-over', roomDealKey(state), tv ? 'tv' : 'ph'].join('|'));
  const host = state.youAreHost
    ? (tv ? `<div class="tv-actions">${tvBtn('▶ ' + t.vt_again, "roomAct('playAgain', {})")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>`
      : `<div class="btn-row" style="margin-top:var(--sp-3)"><button class="btn btn--go" onclick="roomAct('playAgain', {})">▶ ${escapeHTML(t.vt_again)}</button><button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game)}</button></div>`)
    : (tv ? '' : `<div class="waiting-note">${escapeHTML(t.vt_wait_host)}</div>`);
  if (s.settings && s.settings.win === 'set') {
    const why = s.why === 'left' ? t.vt_over_left : t.vt_over_set;
    const board = s.board || [];
    return `<div class="card vt-over ${rise ? 'vt-over--rise' : ''}" data-reveal-ms="${rise ? 900 : 0}">
      <div class="vt-over__chest">${VT_CHEST_OPEN}</div>
      <div class="vt-over__why">${escapeHTML(why)}</div>
      ${renderPodium(state, board)}
      ${tv ? `<div class="tv-scale">${renderScoreboard(board)}</div>` : renderScoreboard(board)}
      ${!tv && typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, board) : ''}
      ${host}</div>`;
  }
  const why = s.why === 'alarm' ? t.vt_lost_alarm : s.why === 'left' ? t.vt_over_left : t.vt_lost_time;
  // «الرفوف» (805): on the phone the shelves stand over the card, the count rising with them.
  return `${tv ? '' : vtShelvesPhoneHtml(state, rise)}<div class="card vt-over ${rise ? 'vt-over--rise' : ''}" data-reveal-ms="${rise ? 900 : 0}">
      <div class="vt-over__why">${escapeHTML(why)}</div>
      <div class="vt-over__big"><span class="metric" data-vt-won data-to="${s.levelsWon || 0}">${rise ? 0 : (s.levelsWon || 0)}</span></div>
      <div class="vt-over__line">${escapeHTML(t.vt_levels_cleared)}</div>
      <div class="vt-over__best">${s.newBest ? '🏆 ' + escapeHTML(t.vt_new_best) + ' · ' : ''}${escapeHTML(vtFill(t.vt_room_best, { n: s.best || 0 }))}</div>
      ${s.why === 'alarm' || s.why === 'time' ? vtExplainHtml(state, tv ? null : vtMine(state), tv) : ''}
      ${host}</div>`;
}

/* --- the room game ---------------------------------------------------------------- */
ROOM_GAMES.vault = {
  lateJoin: true,     // someone who joins mid-game watches, and is dealt in with play again
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = vtT();
    const o = vtOpts();
    const chip = (on, label, click, icon) => `<button type="button" class="chip ${on ? 'is-active' : ''}" aria-pressed="${on}" onclick="${click}">${icon ? `<span aria-hidden="true">${icon}</span> ` : ''}${escapeHTML(label)}</button>`;
    const way = ['one', 'all', 'teams'].map((w) => chip(o.way === w, t['vt_way_' + w], `vtSetOpt({ way: '${w}' })`, VT_WAY_ICON[w])).join('');
    const mis = ['strikes', 'time'].map((m) => chip(o.mistakes === m, t['vt_mis_' + m], `vtSetOpt({ mistakes: '${m}' })`)).join('');
    const teams = o.way === 'teams';
    const win = teams ? `<p class="field__hint">${escapeHTML(t.vt_win_teams_note)}</p>`
      : `<div class="chip-set vt-lobby__row">${chip(o.win === 'levels', t.vt_win_levels, "vtSetOpt({ win: 'levels' })", '♾️')}${chip(o.win === 'set', t.vt_win_set, "vtSetOpt({ win: 'set' })", '🏆')}</div>`;
    const count = teams || o.win === 'set'
      ? `<div class="field"><span class="field__label">${escapeHTML(t.vt_count)}</span><div class="chip-set vt-lobby__row">${VAULT_SET_COUNTS.map((n) => chip(Number(o.count) === n, String(n), `vtSetOpt({ count: ${n} })`)).join('')}</div></div>` : '';
    const screen = (state.screens || []).length > 0;
    const opener = o.way === 'one' && screen
      ? `<div class="field"><span class="field__label">${escapeHTML(t.vt_opener)}</span><div class="chip-set vt-lobby__row">${chip(o.opener !== 'tv', t.vt_opener_phone, "vtSetOpt({ opener: 'phone' })", '📱')}${chip(o.opener === 'tv', t.vt_opener_tv, "vtSetOpt({ opener: 'tv' })", '📺')}</div></div>` : '';
    return `
      <div class="card card--tight vt-lobby">
        <div class="field"><span class="field__label">${escapeHTML(t.vt_way)}</span><div class="chip-set vt-lobby__row">${way}</div>
          <p class="field__hint">${escapeHTML(t['vt_way_' + o.way + '_hint'])}</p></div>
        ${opener}
        <div class="field"><span class="field__label">${escapeHTML(t.vt_mistakes)}</span><div class="chip-set vt-lobby__row">${mis}</div>
          <p class="field__hint">${escapeHTML(o.mistakes === 'time' ? t.vt_mis_time_hint : t.vt_mis_strikes_hint)}</p></div>
        <div class="field"><span class="field__label">${escapeHTML(t.vt_win)}</span>${win}</div>
        ${count}
      </div>`;
  },
  startPayload() { const o = vtOpts(); return { way: o.way, mistakes: o.mistakes, win: o.win, count: Number(o.count) || 5, opener: o.opener }; },
  actionKey(state) {
    // The screen stays put while a safe is played; only a new safe or the end scrolls to the top.
    const s = state.shared || {};
    return [state.code, roomDealKey(state), s.safeNo, s.phase === 'gameover'].join('|');
  },
  render(state) {
    if (appState.currentView !== 'room-vault') setView('room-vault');
    const el = document.getElementById('view-room-vault');
    if (!el) return;
    vtNoteTime(state);
    const s = state.shared || {};
    const mine = vtMine(state);
    const h = mine ? mine.h : { locks: [], pages: [] };
    const sig = ['vt', s.safeNo, s.phase === 'gameover', mine ? mine.key : '-', h.locks.join(','), h.pages.join(','), state.youAreHost, appState.lang, vtL(),
      s.phase === 'gameover' ? JSON.stringify(s.board || []) + s.levelsWon + ':' + s.best + ':' + !!s.newBest + ':' + (s.why || '') : ''].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => vtPhoneHtml(state));
    if (rebuilt) vtWire(el);
    refreshRoomPlayerStrip(el, state);
    vt.el = el; vt.tv = false;
    if (s.phase === 'gameover') {
      if (rebuilt) vtOverMotion(state, el);
      vtEvents(state, el);
      return;
    }
    vtPaint(state, el);
    vtEvents(state, el);
    vtStartLoop();
  }
};

/* --- input: one listener on the frame ------------------------------------------- */
function vtWire(el) {
  const root = el.querySelector('[data-vt-root]');
  if (!root || root.dataset.wired) return;
  root.dataset.wired = '1';
  root.addEventListener('click', (e) => {
    const hit = e.target.closest('[data-vt]');
    if (!hit || !root.contains(hit)) return;
    vtTap(hit);
  });
  // A swipe across the stage moves between the locks.
  let sx = null, sy = null;
  root.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-vt-swipe]') && !e.target.closest('button')) { sx = e.clientX; sy = e.clientY; } else sx = null;
  });
  root.addEventListener('pointerup', (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      // In Arabic the next lock is to the left: a swipe the way you read.
      const rtl = document.documentElement.dir === 'rtl';
      vtMove((dx < 0) !== rtl ? 1 : -1);
    }
  });
}

function vtSend(action, payload) {
  const s = (Room.state && Room.state.shared) || {};
  // `m`: the side's mistakes this phone has seen, so a double tap's second miss isn't counted again.
  const mine = Room.state ? vtMine(Room.state) : null;
  const m = mine && mine.side && typeof mine.side.mistakes === 'number' ? { m: mine.side.mistakes } : {};
  roomAct(action, Object.assign({ safe: s.safeNo }, m, payload));
}

/** The stage moves to another of my locks (d: +1 / -1), or straight to lock i. */
function vtMove(d, i) {
  const st = Room.state;
  if (!st) return;
  const locks = vtMyLocks(st);
  if (locks.length < 2) return;
  const sk = vtSafeKey(st);
  const at = Math.max(0, locks.findIndex((l) => l.i === vt.cur[sk]));
  const to = typeof i === 'number' ? locks.findIndex((l) => l.i === i) : (at + d + locks.length) % locks.length;
  if (to < 0 || to === at) return;
  vt.dir = typeof i === 'number' ? (to > at ? 1 : -1) : d;
  vt.cur[sk] = locks[to].i;
  vt.arm = null;
  clearTimeout(vt.autoTimer);
  vtPaintNow(true);
}

function vtTap(hit) {
  const st = Room.state;
  if (!st) return;
  const s = st.shared || {};
  const act = hit.dataset.vt;
  const sk = vtSafeKey(st);
  if (act === 'nx' || act === 'pv') { haptic('light'); vtMove(act === 'nx' ? 1 : -1); return; }
  if (act === 'go') { vtMove(0, Number(hit.dataset.i)); return; }
  if (act === 'tab') { vt.tab = hit.dataset.n === 'page' ? 'page' : 'lock'; const root = vt.el && vt.el.querySelector('[data-vt-root]'); if (root) root.classList.toggle('is-tab-page', vt.tab === 'page'); hit.parentNode.querySelectorAll('[data-vt="tab"]').forEach((b) => { const on = b === hit; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on); }); return; }
  if (act === 'pg') { vt.page[sk] = Number(hit.dataset.n) || 0; vtPaintNow(false, true); return; }
  if (act === 'key') {
    // «المفتاح الاحتياطي» on the lock on the stage: spent for good, so asked first; sent for this safe.
    const ki = vt.cur[sk];
    if (s.phase !== 'play' || typeof ki !== 'number') return;
    const safe = s.safeNo;
    showConfirmModal(vtFill(vtT().vt_key_confirm, { lock: vtLockName(((s.locks || [])[ki] || {}).k) }), () => roomAct('useKey', { i: ki, safe }), { yes: 'cf_use_key', tone: 'accent', icon: '🔑' });
    return;
  }
  const slide = hit.closest('[data-vt-i]');
  const i = slide ? Number(slide.dataset.vtI) : -1;
  if (i < 0) return;
  if (s.phase !== 'play') { haptic('light'); return; }
  const key = sk + '|' + i;
  if (act === 'cut') {
    const w = Number(hit.dataset.w);
    if (vt.arm && vt.arm.key === key && vt.arm.w === w) {
      vt.arm = null;
      hit.classList.add('is-cut');
      haptic('medium'); vtSnip();
      vtSend('cut', { i, w });
    } else {
      vt.arm = { key, i, w };
      haptic('light');
      vtPaintNow(false);
    }
  } else if (act === 'sym') {
    haptic('light'); vtClick(1.1);
    hit.classList.add('is-hit');
    vtSend('sym', { i, s: hit.dataset.s });
  } else if (act === 'dg') {
    const dg = vt.dial[key] || (vt.dial[key] = [0, 0, 0]);
    const n = Number(hit.dataset.n);
    dg[n] = (dg[n] + Number(hit.dataset.d) + 10) % 10;
    const b = vt.el && vt.el.querySelector(`[data-vt-dg="${n}"]`);
    if (b) b.textContent = dg[n];
    haptic('light'); vtClick(0.7 + n * 0.2);
  } else if (act === 'try') {
    haptic('medium'); vtClick(0.5);
    vtSend('dial', { i, code: (vt.dial[key] || [0, 0, 0]).slice() });
  } else if (act === 'light') {
    haptic('light'); vtClick(1.4);
    vtSend('light', { i, c: hit.dataset.c });
  }
}

/* --- painting --------------------------------------------------------------------- */
function vtPaintNow() {
  const st = Room.state;
  if (!st || !vt.el) return;
  if (vt.tv) { vtTvPaint(st, vt.el); return; }
  vtPaint(st, vt.el);
}

/** Paints a box from its signature, so a state that changes nothing redraws nothing. */
function vtBox(box, sig, html) {
  if (!box || box.dataset.sig === sig) return false;
  box.dataset.sig = sig;
  box.innerHTML = html;
  return true;
}

function vtPaint(state, el) {
  const t = vtT();
  const s = state.shared || {};
  const root = el.querySelector('[data-vt-root]');
  if (!root) return;
  const mine = vtMine(state);
  const side = mine ? mine.side : null;
  const locks = vtMyLocks(state);
  // The title: the level, or which safe of the set.
  const lvl = root.querySelector('[data-vt-lvl]');
  if (lvl) {
    const txt = t.vt_title + ' · ' + (s.total ? vtFill(t.vt_safe_of, { n: s.safeNo, m: s.total }) : vtFill(t.vt_level, { n: s.level || 1 }));
    if (lvl.textContent !== txt) lvl.textContent = txt;
  }
  // The padlocks on the hasp: open or shut, mine, the one on the stage.
  const sk = vtSafeKey(state);
  root.querySelectorAll('[data-vt-pad]').forEach((p) => {
    const i = Number(p.dataset.vtPad);
    const open = !!(side && side.open[i]);
    if (p.classList.contains('is-open') !== open) {
      p.classList.toggle('is-open', open);
      const svg = p.querySelector('svg');
      if (svg) svg.outerHTML = vtPadSvg(open);
    }
    p.classList.toggle('is-cur', locks.length > 1 && vt.cur[sk] === i);
  });
  // The spare keys hanging (804).
  const keysBox = root.querySelector('[data-vt-keys]');
  if (keysBox) {
    const n = mine ? vtKeysOf(state, mine.key) : 0;
    const txt = n ? '🗝️ ' + vtFill(t.vt_keys_n, { n }) : '';
    if (keysBox.textContent !== txt) keysBox.textContent = txt;
    keysBox.hidden = !n;
  }
  // The ribbon of «فريقين»: my team, and how far the other one is.
  const rib = root.querySelector('[data-vt-ribbon]');
  if (rib && mine) {
    const other = mine.key === 'a' ? 'b' : 'a';
    const os = (s.sides || {})[other];
    const txt = t['vt_team_' + mine.key] + ' · ' + vtFill(t.vt_other_team, { team: t['vt_team_' + other], n: os ? os.open.filter(Boolean).length : 0, m: (s.locks || []).length });
    if (rib.textContent !== txt) rib.textContent = txt;
  }
  // The stage.
  const stageBox = root.querySelector('[data-vt-stagebox]');
  if (stageBox && mine && locks.length) {
    const cur = vt.cur[sk];
    const lock = locks.find((l) => l.i === cur) || locks[0];
    const armed = vt.arm && vt.arm.key.indexOf(sk + '|') === 0 ? vt.arm.w : -1;
    const sig = [sk, locks.map((l) => l.i + ':' + JSON.stringify(l.prog)).join(';'), side.open.join(','), cur, armed, s.phase === 'play', vtKeysOf(state, mine.key), appState.lang, vtL()].join('|');
    if (vtBox(stageBox, sig, vtStageHtml(state, mine, locks))) vt.lampAt = 0;
  }
  // The notebook's page: the lights' column follows the mistakes.
  const bookBox = root.querySelector('[data-vt-bookbox]');
  const pages = vtMyPages(state);
  if (bookBox && mine && pages.length) {
    const at = Math.min(pages.length - 1, vt.page[sk] || 0);
    vtBox(bookBox, [sk, at, pages.map((p) => p.u).join(','), side.mistakes, appState.lang, vtL()].join('|'), vtNotebookHtml(state, mine, pages));
    const others = root.querySelector('[data-vt-others]');
    const txt = vtOthersText(state, mine);
    if (others && others.textContent !== txt) others.textContent = txt;
  }
  // The foot: chalk ✗ marks (or the seconds burnt), what to do, the chest's number.
  const x = root.querySelector('[data-vt-x]');
  if (x && side) {
    const html = s.settings.mistakes === 'time'
      ? (side.mistakes ? `<i class="is-on">✗</i><b class="metric">${side.mistakes}</b>` : '')
      : [0, 1, 2].map((k) => `<i class="${k < side.strikes ? 'is-on' : ''}">✗</i>`).join('');
    if (x.dataset.h !== html) { x.dataset.h = html; x.innerHTML = html; }
  }
  const hint = root.querySelector('[data-vt-hint]');
  if (hint) {
    let txt = '';
    if (side && s.settings.mistakes !== 'time' && side.strikes) txt = vtFill(t.vt_speed, { x: (1 + VAULT_SPEEDUP * side.strikes).toFixed(2).replace(/0$/, '') });
    else if (side && s.settings.mistakes === 'time') txt = vtFill(t.vt_minus, { s: vaultPenaltyMs(side.mistakes + 1) / 1000 });
    else if (locks.length > 1) txt = t.vt_swipe;
    else if (mine && !locks.length) txt = t.vt_read_out;
    if (hint.textContent !== txt) hint.textContent = txt;
  }
  const serial = root.querySelector('[data-vt-serial]');
  if (serial) {
    const show = locks.length || s.way === 'all';
    // The number held left to right (.metric), as on the TV's chest.
    const html = show && s.serial ? `${escapeHTML(t.vt_chest_no)} <b class="metric">${escapeHTML(s.serial)}</b>` : escapeHTML(mine && !locks.length ? t.vt_ask_chest : '');
    if (serial.dataset.h !== html) { serial.dataset.h = html; serial.innerHTML = html; }
  }
  root.classList.toggle('is-wait', s.phase !== 'play');
  // The result of the safe, over everything: the treasure, or the alarm.
  const res = root.querySelector('[data-vt-res]');
  if (res) {
    const on = s.phase === 'result' || s.phase === 'ready';
    res.hidden = !on;
    res.dataset.phase = s.phase;
    res.classList.toggle('has-why', on && !!(s.result || {}).explain);
    const sig = [s.phase, s.safeNo, JSON.stringify(s.result), JSON.stringify(s.board || []), appState.lang].join('|');
    if (on && vtBox(res, sig, vtResHtml(state, mine, false))) {
      if (s.phase === 'result' && s.board) animateScoreboards(state);
    }
  }
  // The host's buttons: the next safe now, or a phone to take a TV's safe.
  const host = el.querySelector('[data-vt-host]');
  if (host) {
    const key = [s.phase, s.safeNo, state.youAreHost, !!state.hostAway, s.tvOpens].join('|');
    if (host.dataset.key !== key) {
      host.dataset.key = key;
      const rows = [];
      if (s.phase === 'result') rows.push([t.vt_next_now, `roomAct('nextSafe', { safe: ${Number(s.safeNo) || 0} })`, 'secondary']);
      if (s.tvOpens && s.phase !== 'gameover') rows.push([t.vt_take_over, `vtTakeOver(${Number(s.safeNo) || 0})`]);
      host.innerHTML = rows.length ? roomMoveOnHtml(state, roomHostRow(rows)) : '';
    }
  }
  vtFrame();
}

/** «خلّي موبايل يفتح»: asked first (it takes the safe off the TV for good), and sent for the safe it was pressed on. */
function vtTakeOver(safe) {
  const t = vtT();
  showConfirmModal(t.vt_take_over_confirm, () => roomAct('takeOver', { safe: safe }), { yes: 'cf_take_over', tone: 'accent', icon: '📱' });
}

/** The card over the table between two safes (and on the safe's card before the candle). */
function vtResHtml(state, mine, tv) {
  const t = vtT();
  const s = state.shared || {};
  if (s.phase === 'ready') {
    return `<div class="vt-res__card vt-res__card--ready"><b>${escapeHTML(s.total ? vtFill(t.vt_safe_of, { n: s.safeNo, m: s.total }) : vtFill(t.vt_level, { n: s.level || 1 }))} · ${escapeHTML(vtFill(t.vt_n_locks, { n: (s.locks || []).length }))}</b>
      <span class="metric" data-vt-cd></span></div>`;
  }
  const r = s.result || {};
  let title;
  if (s.way === 'teams') title = r.side ? vtFill(t.vt_team_won, { team: t['vt_team_' + r.side] }) : (r.why === 'alarm' ? t.vt_lost_alarm : t.vt_lost_time);
  else title = r.open ? t.vt_opened : (r.why === 'alarm' ? t.vt_lost_alarm : t.vt_lost_time);
  const good = r.open && (!mine || s.way !== 'teams' || r.side === mine.key);

  return `<div class="vt-res__card ${good ? 'is-good' : 'is-bad'}">${r.open ? `<div class="vt-res__chest">${VT_CHEST_OPEN}</div>` : '<div class="vt-res__bell" aria-hidden="true">🚨</div>'}
    <b>${escapeHTML(title)}</b><span class="metric" data-vt-cd></span>${vtExplainHtml(state, mine, tv)}${board}</div>`;
}

/**
 * «ليه كده؟» (the ideas of 7 Oct 2026, 801): once a safe is over, the rule that applied and the
 * right answer for every lock with a mistake on it or left shut (shared.result.explain, built by
 * the server). On the phone that worked those locks (the opener; in «الكل» each lock's holder)
 * and on the TV; a reader's phone has its notebook already.
 */
function vtExplainHtml(state, mine, tv) {
  const s = state.shared || {};
  const ex = (s.result || {}).explain;
  if (!ex) return '';
  const t = vtT();
  let groups;
  if (tv) groups = Object.keys(ex).map((k) => ({ k, list: ex[k] }));
  else {
    if (!mine || !ex[mine.key]) return '';
    const list = ex[mine.key].filter((e) => mine.h.locks.indexOf(e.i) !== -1);
    groups = list.length ? [{ k: mine.key, list }] : [];
  }
  if (!groups.length) return '';
  const head = (g) => (tv && s.way === 'teams' ? `<div class="vt-why__team">${escapeHTML(t['vt_team_' + g.k] || '')}</div>` : '');
  return `<div class="vt-why"><div class="vt-why__t">🧐 ${escapeHTML(t.vt_why_title)}</div>${groups.map((g) => `${head(g)}<ul>${g.list.map((e) => vtExplainItem(state, e)).join('')}</ul>`).join('')}</div>`;
}
function vtExplainItem(state, e) {
  const w = vtW();
  const s = state.shared || {};
  const name = `<span class="vt-why__k">${escapeHTML(vtLockName(e.k))}</span>`;
  let body = '';
  if (e.k === 'wires' && Array.isArray(e.w)) {
    const n = e.w.length;
    const rule = e.r ? vtRuleHtml(e.r, n) : escapeHTML(w.whyNoRule);
    const o = e.a >= n - 1 ? w.last : (w.ord[e.a] || String(e.a + 1));
    body = `<span class="vt-why__row">${e.w.map((c) => vtChip(c)).join(' ')}</span><span>${vtFill(escapeHTML(w.whyWires), { n, rule })}</span><span class="vt-why__a">${vtFill(escapeHTML(w.whyCut), { o: escapeHTML(o), c: vtChip(e.w[e.a]) })}</span>`;
  } else if (e.k === 'symbols' && Array.isArray(e.a)) {
    body = `<span>${escapeHTML(vtFill(w.whySym, { col: e.col > 0 ? vtFill(w.col, { n: e.col }) : '?' }))}</span><span class="vt-why__syms vt-why__a" dir="ltr">${e.a.map(vtSymSvg).join('<i>›</i>')}</span>`;
  } else if (e.k === 'dial' && Array.isArray(e.a)) {
    const sh = VAULT_SHAPES[e.s] || {};
    const code = (x) => `<span class="metric" dir="ltr">${(x || []).join(' · ')}</span>`;
    body = `<span class="vt-why__row"><span class="vt-why__shape">${vtShapeSvg(e.s)}</span>${escapeHTML(sh[vtL()] || '')} = ${code(e.c)}</span>${e.on ? `<span class="vt-why__a">${vtFill(escapeHTML(w.whyRev), { no: `<span class="metric">${escapeHTML(s.serial || '')}</span>`, code: code(e.a) })}</span>` : `<span class="vt-why__a">${code(e.a)}</span>`}`;
  } else if (e.k === 'lights' && Array.isArray(e.a)) {
    const row = [w.row0, w.row1, w.row2][e.row] || w.row0;
    body = `<span>${escapeHTML(vtFill(w.whyRow, { row }))}</span><span class="vt-why__row">${escapeHTML(w.flash)} ${(e.q || []).map((c) => vtChip(c)).join(' ')}</span><span class="vt-why__row vt-why__a">${escapeHTML(w.press)} ${e.a.map((c) => vtChip(c)).join(' ')}</span>`;
  }
  return `<li>${name}${body}</li>`;
}

/** Every frame while the room is on screen: the candles, the clocks, the lamp, the countdowns. */
function vtFrame() {
  const st = Room.state;
  const el = vt.el;
  if (!st || st.game !== 'vault' || !el || !el.isConnected) return false;
  const s = st.shared || {};
  if (s.phase === 'gameover') return false;
  const now = vtNow();
  const t = vtT();
  const mine = vtMine(st);
  // Each candle (a phone shows its side's; the TV each side's).
  el.querySelectorAll('[data-vt-side]').forEach((box) => vtCandlePaint(box, (s.sides || {})[box.dataset.vtSide], now));
  const cd = el.querySelector('[data-vt-cd]');
  if (cd) {
    const at = s.phase === 'ready' ? s.startAt : s.phase === 'result' ? s.nextAt : 0;
    const secs = Math.max(0, Math.ceil(((at || 0) - now) / 1000));
    const txt = !at ? '' : s.phase === 'ready' ? vtFill(t.vt_starts_in, { n: secs }) : (s.settings.win === 'set' && s.safeNo >= s.total ? vtFill(t.vt_end_in, { n: secs }) : vtFill(t.vt_next_in, { n: secs }));
    if (cd.textContent !== txt) cd.textContent = txt;
  }
  // The lights lock: the pattern flashing, again and again.
  el.querySelectorAll('[data-vt-lamp]').forEach((lamp) => {
    const seq = lamp.dataset.vtLamp.split(',');
    const on = 520, off = 260, rest = 1100;
    const period = seq.length * (on + off) + rest;
    if (!vt.lampAt) vt.lampAt = performance.now();
    const p = (performance.now() - vt.lampAt) % period;
    const k = Math.floor(p / (on + off));
    const lit = k < seq.length && p - k * (on + off) < on ? seq[k] : '';
    if (lamp.dataset.lit !== lit) {
      lamp.dataset.lit = lit;
      lamp.classList.toggle('is-on', !!lit);
      if (lit) lamp.style.setProperty('--lc', VAULT_COLORS[lit]);
    }
  });
  vtVoiceTick(st, s, now, mine);
  return true;
}

/** A candle: its wax (--tf) and its clock, hurrying under 30 s, flickering faster after a strike. */
function vtCandlePaint(box, side, now) {
  if (!side) return;
  const left = vtLeft(side, now);
  const tf = Math.max(0, Math.min(1, left / Math.max(1, side.ms || left || 1)));
  const v = tf.toFixed(3);
  if (box.dataset.tf !== v) { box.dataset.tf = v; box.style.setProperty('--tf', v); }
  const txt = vtClockText(left);
  box.querySelectorAll('[data-vt-clock]').forEach((c) => { if (c.textContent !== txt) c.textContent = txt; });
  box.classList.toggle('is-hurry', !side.done && left < 30000);
  box.dataset.str = String(Math.min(2, side.strikes || 0));
}

function vtStartLoop() {
  if (vt.loop) return;
  const step = () => {
    vt.loop = 0;
    if (!vtFrame()) return;
    vt.loop = requestAnimationFrame(step);
  };
  vt.loop = requestAnimationFrame(step);
}
function vtStopAll() {
  if (vt.loop) cancelAnimationFrame(vt.loop);
  vt.loop = 0;
  vt.el = null;
  vt.arm = null;
  clearTimeout(vt.momentTimer);
  clearTimeout(vt.toastTimer);
  clearTimeout(vt.autoTimer);
  // The shelves (805) left mid-run: everything goes to where it ends.
  if (vt.shelfTimers && vt.shelfTimers.length) {
    vt.shelfTimers.forEach((x) => clearTimeout(x));
    vt.shelfTimers = [];
    document.querySelectorAll('[data-vt-shv].is-run').forEach(vtShelvesSettle);
  }
}
onLeaveScreen((from) => { if (from === 'room-vault' || (from === 'room-tv' && vt.tv)) vtStopAll(); });
onRoomClocksReset(() => { if (vt.el) vtStopAll(); });

/* --- the moments: events played once per device ---------------------------------- */
function vtEvents(state, el) {
  const s = state.shared || {};
  const key = roomDealKey(state);
  const evs = s.events || [];
  const last = evs.length ? evs[evs.length - 1].seq : 0;
  if (!(key in vt.seen)) { vt.seen = {}; vt.seen[key] = last; return; }   // a reload or a late join replays nothing
  const from = vt.seen[key];
  vt.seen[key] = last;
  const now = vtNow();
  const fresh = evs.filter((e) => e.seq > from && now - (e.at || 0) < 4000);
  if (!fresh.length) return;
  const voice = vtIsVoice(state);
  const mine = vtMine(state);
  const t = vtT();
  fresh.forEach((e) => {
    const ours = !!mine && (!e.side || e.side === mine.key);
    if (voice) vtSound(e.type === 'key' ? 'key' : e.type === 'open' ? 'open' : e.type === 'mistake' ? 'mistake' : e.type === 'step' ? 'tick' : e.type === 'safeOpen' ? 'won' : e.type === 'safeLost' || (e.type === 'lost' && e.why === 'alarm') ? 'alarm' : e.type === 'safe' ? 'safe' : '');
    if (vt.tv) { vtTvMoment(state, el, e); return; }
    if (e.type === 'open' && ours) {
      vtStamp(el, 'ok', vtFill(t.vt_lock_opened, { lock: vtLockName(e.k) }));
      vtPadJust(el, e.i);
      if (e.by === Room.me) { haptic('medium'); vtAutoNext(e.i); }
    } else if (e.type === 'mistake' && ours) {
      vtStamp(el, 'bad', s.settings.mistakes === 'time' ? vtFill(t.vt_minus15, { s: e.pen || 15 }) : vtFill(t.vt_mistake_n, { n: (s.sides[e.side] || {}).strikes || e.n }));
      if (e.by === Room.me) haptic('heavy');
    } else if (e.type === 'lost' && ours) {
      vtStamp(el, 'bad', e.why === 'alarm' ? t.vt_lost_alarm : t.vt_lost_time);
      haptic('heavy');
    } else if (e.type === 'safeOpen') {
      const won = !mine || s.way !== 'teams' || e.side === mine.key;
      vtStamp(el, won ? 'lvl' : 'bad', won ? t.vt_opened : vtFill(t.vt_team_won, { team: t['vt_team_' + e.side] }));
      if (won) { haptic('medium'); vtConfetti(el, state); }
    } else if (e.type === 'key' && ours) {
      vtStamp(el, 'lvl', t.vt_key_won);
      haptic('medium');
    } else if (e.type === 'keyUsed' && ours) {
      vtStamp(el, 'ok', vtFill(t.vt_key_used, { lock: vtLockName(e.k) }));
    } else if (e.type === 'safe') {
      vtStamp(el, 'lvl', s.total ? vtFill(t.vt_safe_of, { n: e.n, m: s.total }) : vtFill(t.vt_level, { n: e.n }));
    }
  });
}

function vtStamp(el, kind, text) {
  const root = el.querySelector('[data-vt-root]');
  const st = el.querySelector('[data-vt-stamp]');
  if (!root || !st) return;
  st.textContent = text;
  root.classList.remove('is-ok', 'is-bad', 'is-lvl');
  if (motionOff()) return;
  void root.offsetWidth;
  root.classList.add('is-' + kind);
  clearTimeout(vt.momentTimer);
  vt.momentTimer = setTimeout(() => root.classList.remove('is-ok', 'is-bad', 'is-lvl'), kind === 'lvl' ? 1600 : 1000);
}

/** The padlock of a lock just opened shakes its shackle loose. */
function vtPadJust(el, i) {
  const pad = el.querySelector(`[data-vt-pad="${i}"]`);
  if (!pad || motionOff()) return;
  pad.classList.remove('is-just'); void pad.offsetWidth; pad.classList.add('is-just');
}

/** After my lock opens, the next lock still shut comes onto the stage by itself. */
function vtAutoNext(i) {
  clearTimeout(vt.autoTimer);
  vt.autoTimer = setTimeout(() => {
    const st = Room.state;
    if (!st || st.game !== 'vault') return;
    const mine = vtMine(st);
    const sk = vtSafeKey(st);
    if (!mine || vt.cur[sk] !== i) return;
    const locks = vtMyLocks(st);
    const at = locks.findIndex((l) => l.i === i);
    for (let d = 1; d < locks.length; d++) {
      const l = locks[(at + d) % locks.length];
      if (!mine.side.open[l.i]) { vtMove(0, l.i); return; }
    }
  }, 900);
}

function vtConfetti(el, state) {
  // The TV is the one place confetti flies when there is one; with no TV every phone gets its own.
  if (!vt.tv && typeof roomHasScreen === 'function' && roomHasScreen()) return;
  const box = el.querySelector('[data-vt-root], [data-vt-tv]') || el;

}

function vtOverMotion(state, el) {
  const s = state.shared || {};
  const set = s.settings && s.settings.win === 'set';
  const n = el.querySelector('[data-vt-won]');
  const card = el.querySelector('.vt-over, [data-vt-shv]');
  const rise = !!card && (card.classList.contains('vt-over--rise') || card.classList.contains('is-run'));
  // An endless game's end: the count rises with the chests landing on the shelves (805), not by itself.
  if (!set) vtShelvesRun(state, el);
  else if (n && rise) countUp(n, 0, Number(n.dataset.to) || 0);
  animateScoreboards(state);
  const good = set ? (s.board || []).some((r) => r.score > 0) : s.newBest && (s.levelsWon || 0) > 0;
  if (card && good && rise) afterReveal(set ? card : el, () => { if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); });
}

/** Where the run stands: the safes opened, the room's best (the ribbon's place), the line on top. */
function vtShelfFacts(state) {
  const t = vtT();
  const s = state.shared || {};
  const won = Math.max(0, Number(s.levelsWon) || 0);
  const best = Math.max(won, Number(s.best) || 0);
  const at = Number(s.safeNo) || won + 1;
  const bits = [];
  if (s.why === 'alarm') bits.push('🚨 ' + vtFill(t.vt_shelf_alarm_at, { n: at }));
  else if (s.why === 'time') bits.push('🕯️ ' + vtFill(t.vt_shelf_time_at, { n: at }));
  else if (s.why === 'left') bits.push(t.vt_over_left);
  if (s.newBest && won > 0) bits.push('🏆 ' + t.vt_new_best);
  else if (best > won) bits.push(vtFill(t.vt_shelf_short, { n: best - won }));
  else if (won > 0) bits.push(t.vt_shelf_tie);
  return { won, best, newBest: !!(s.newBest && won > 0), line: bits.join(' · ') };
}

/** The shelves: a place for every safe up to the best (and two more), eight a shelf. */
function vtShelvesHtml(state, rise, tv) {
  const t = vtT();
  const f = vtShelfFacts(state);
  const last = Math.max(f.won, f.best);
  const rows = Math.max(1, Math.ceil(last / VT_SHELF), tv ? 2 : 1);
  const upTo = Math.min(rows * VT_SHELF, Math.max(last + 2, VT_SHELF));
  const ribbon = (i) => `<div class="vt-shv__rib${i <= f.won ? ' is-on-chest' : ''}"><span class="vt-shv__ros">${i}</span><span class="vt-shv__tails"></span><span class="vt-shv__ribtxt">${escapeHTML(f.newBest && i === f.won ? t.vt_shelf_new : t.vt_shelf_best)}</span></div>`;
  let shelves = '';
  for (let r = 0; r < rows; r++) {
    let places = '';
    for (let c = 1; c <= VT_SHELF; c++) {
      const i = r * VT_SHELF + c;
      let inner = '';
      if (i <= f.won) inner = `<div class="vt-shv__chest${rise ? ' is-wait' : ''}">${VT_CHEST_OPEN}<span class="vt-shv__tag">${i}</span></div>`;
      else if (i <= upTo) inner = `<div class="vt-shv__slot${i === f.best ? ' is-best' : ''}"></div>`;
      if (f.best && i === f.best) inner += ribbon(i);
      places += `<div class="vt-shv__place">${inner}</div>`;
    }
    shelves += `<div class="vt-shelf">${places}</div>`;
  }
  const label = f.won + ' ' + t.vt_levels_cleared + (f.best ? ' · ' + vtFill(t.vt_room_best, { n: f.best }) : '');
  return `<div class="vt-shv__shelves" style="--rows:${rows}" role="img" aria-label="${escapeHTML(label)}">${shelves}</div>`;
}

/** The phone: the shelves in the attic, over the end card. */
function vtShelvesPhoneHtml(state, rise) {
  const f = vtShelfFacts(state);
  return `<div class="vt-shv vt-shv--ph ${rise ? 'is-run' : 'is-done'}" data-vt-shv data-reveal-ms="${rise ? vtShelfMs(f.won) : 0}">${vtAtticSvg()}
    <div class="vt-shv__pill">${escapeHTML(f.line)}</div>
    <div class="vt-shv__wall">${vtShelvesHtml(state, rise, false)}</div></div>`;
}

/** The TV: the attic wall with the shelves; beside them the count, «ليه كده؟» and the host's buttons. */
function vtShelvesTvHtml(state) {
  const t = vtT();
  const s = state.shared || {};
  const f = vtShelfFacts(state);
  const rise = motionFirst(['vt-over', roomDealKey(state), 'tv'].join('|'));
  const host = state.youAreHost ? `<div class="tv-actions">${tvBtn('▶ ' + t.vt_again, "roomAct('playAgain', {})")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>` : '';
  const why = s.why === 'alarm' || s.why === 'time' ? vtExplainHtml(state, null, true) : '';
  return `<div class="vt-tv vt-tv--over vt-tv--shelves" data-vt-tv>${vtAtticSvg()}
    <div class="vt-shv ${rise ? 'is-run' : 'is-done'}" data-vt-shv data-reveal-ms="${rise ? vtShelfMs(f.won) : 0}">

        ${why}${host}
      </div>
    </div></div>`;
}

/** How long the chests take to come down: a beat each, a long run in about three seconds. */
const vtShelfStep = (n) => Math.max(110, Math.min(420, Math.round(2800 / Math.max(1, n))));
const vtShelfMs = (n) => (n ? 500 + n * vtShelfStep(n) + 450 : 400);

/** Everything where it ends: every chest on its place, the count, the ribbon's words and the line. */
function vtShelvesSettle(box) {
  if (!box) return;
  box.querySelectorAll('.vt-shv__chest.is-wait').forEach((c) => c.classList.remove('is-wait'));
  const root = box.closest('#view-room-vault, #view-room-tv') || box;
  root.querySelectorAll('[data-vt-won]').forEach((n) => { n.textContent = n.dataset.to || '0'; });
  box.classList.remove('is-run');
  box.classList.add('is-done');
}

/** The run comes down: chest by chest in order, each landing raising the count. True while it plays. */
function vtShelvesRun(state, el) {
  (vt.shelfTimers || []).forEach((x) => clearTimeout(x));
  vt.shelfTimers = [];
  const box = el && el.querySelector('[data-vt-shv]');
  if (!box || !box.classList.contains('is-run')) return false;
  const chests = Array.from(box.querySelectorAll('.vt-shv__chest.is-wait'));
  if (!chests.length || motionOff() || !document.body.animate) { vtShelvesSettle(box); return false; }
  const counts = Array.from(el.querySelectorAll('[data-vt-won]'));
  const step = vtShelfStep(chests.length);
  const voice = vtIsVoice(state);
  const later = (ms, fn) => vt.shelfTimers.push(setTimeout(() => { try { fn(); } catch (e) { console.warn('vault shelves', e); } }, ms));
  chests.forEach((c, k) => {
    const at = 500 + k * step;
    later(at, () => {
      c.classList.remove('is-wait');
      c.animate([
        { transform: 'translateY(-160%) rotate(-10deg)', opacity: 0 },
        { opacity: 1, offset: 0.25 },
        { transform: 'translateY(8%) rotate(1.5deg)', offset: 0.78 },
        { transform: 'none', opacity: 1 }
      ], { duration: 460, easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)' });
    });
    later(at + 360, () => {
      counts.forEach((n) => { n.textContent = String(k + 1); });
      if (voice) vtSound('shelf');
    });
  });
  later(vtShelfMs(chests.length), () => vtShelvesSettle(box));
  return true;
}

/* --- the sounds: an opener's own clicks, and the voice's moments ------------------ */
function vtClick(pitch) {
  try { fxTone('triangle', [[0, 300 * (pitch || 1)]], [[0, 0.07], [0.05, 0.001]], fxCtx().currentTime + 0.005); } catch (e) {}
}
function vtSnip() {
  try { const at = fxCtx().currentTime + 0.005; fxNoise('highpass', 3000, 1, [[0, 0.35], [0.06, 0.001]], at); fxTone('square', [[0, 1800], [0.05, 900]], [[0, 0.06], [0.06, 0.001]], at); } catch (e) {}
}
function vtSound(kind) {
  if (!kind) return;
  try {
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'open') {
      // A padlock's clunk and a little chime.
      fxNoise('lowpass', 700, 2, [[0, 0.4], [0.08, 0.001]], at);
      fxTone('sine', [[0, 660], [0.1, 990]], [[0, 0.16], [0.3, 0.001]], at + 0.08);
    } else if (kind === 'mistake') {
      fxTone('sawtooth', [[0, 180], [0.35, 110]], [[0, 0.22], [0.4, 0.001]], at);
      fxTone('square', [[0, 140]], [[0, 0.0001], [0.02, 0.14], [0.3, 0.001]], at);
    } else if (kind === 'tick') {
      fxTone('triangle', [[0, 1100]], [[0, 0.1], [0.05, 0.001]], at);
    } else if (kind === 'alarm') {
      for (let k = 0; k < 4; k++) {
        fxTone('square', [[0, 920]], [[0, 0.0001], [0.01, 0.2], [0.16, 0.18], [0.18, 0.0001]], at + k * 0.36);
        fxTone('square', [[0, 690]], [[0, 0.0001], [0.01, 0.2], [0.14, 0.18], [0.16, 0.0001]], at + k * 0.36 + 0.18);
      }
    } else if (kind === 'safe') {
      fxTone('triangle', [[0, 330], [0.2, 440]], [[0, 0.14], [0.3, 0.001]], at);
    } else if (kind === 'key') {
      // A brass key jingling onto the line.
      for (let k = 0; k < 3; k++) fxTone('triangle', [[0, 1320 + k * 220]], [[0, 0.12], [0.18, 0.001]], at + k * 0.09);
    } else if (kind === 'shelf') {
      // A chest set down on a wooden shelf (805).
      fxNoise('lowpass', 520, 1, [[0, 0.28], [0.07, 0.001]], at);
      fxTone('sine', [[0, 150], [0.08, 90]], [[0, 0.16], [0.12, 0.001]], at);
    } else if (kind === 'won') playFx('tada');
  } catch (e) {}
}
/** On the voice: the last ten seconds of a candle tick. */
function vtVoiceTick(st, s, now, mine) {
  if (s.phase !== 'play' || !vtIsVoice(st)) return;
  const sides = Object.keys(s.sides || {}).map((k) => s.sides[k]).filter((x) => !x.done);
  if (!sides.length) return;
  const left = Math.ceil(Math.min.apply(null, sides.map((x) => vtLeft(x, now))) / 1000);
  if (left <= 10 && left > 0 && left !== vt.tickSec) { vt.tickSec = left; vtSound('tick'); }
}

/** The washing line: a page for everyone, their name and what they hold - never what it says. */
function vtLineHtml(state) {

TV_GAMES.vault = {
  sig(state) {
    const s = state.shared || {};

      state.youAreHost, appState.lang, vtL(), s.phase === 'gameover' ? JSON.stringify(s.board || []) + s.levelsWon + ':' + s.best + ':' + !!s.newBest + ':' + (s.why || '') : ''].join('|');
  },

function vtTvPaint(state, el) {
  const t = vtT();
  const s = state.shared || {};
  const tv = el.querySelector('[data-vt-tv]');
  if (!tv) return;
  const lvl = el.querySelector('[data-vt-lvl]');
  if (lvl) {
    const txt = t.vt_title + ' · ' + (s.total ? vtFill(t.vt_safe_of, { n: s.safeNo, m: s.total }) : vtFill(t.vt_level, { n: s.level || 1 }));
    if (lvl.textContent !== txt) lvl.textContent = txt;
  }
  // Each side's padlocks and chalk marks.
  Object.keys(s.sides || {}).forEach((key) => {
    const side = s.sides[key];
    tv.querySelectorAll(`[data-vt-tpad^="${key}:"]`).forEach((p) => {
      const i = Number(p.dataset.vtTpad.split(':')[1]);
      const open = !!side.open[i];
      if (p.classList.contains('is-open') !== open) {
        p.classList.toggle('is-open', open);
        const svg = p.querySelector('svg');
        if (svg) svg.outerHTML = vtPadSvg(open);
        if (open && !motionOff()) { p.classList.remove('is-just'); void p.offsetWidth; p.classList.add('is-just'); }
      }
    });
    const tx = tv.querySelector(`[data-vt-tx="${key}"]`);
    if (tx) {
      const html = s.settings.mistakes === 'time'
        ? `<span>${escapeHTML(t.vt_tv_mistakes)}</span><b class="metric">${side.mistakes}</b>${side.done ? '' : `<span>· ${escapeHTML(vtFill(t.vt_tv_next_pen, { s: vaultPenaltyMs(side.mistakes + 1) / 1000 }))}</span>`}`
        : `<span>${escapeHTML(t.vt_tv_mistakes)}</span>${[0, 1, 2].map((k) => `<i class="${k < side.strikes ? 'is-on' : ''}">${k < side.strikes ? '✗' : '○'}</i>`).join('')}`;
      if (tx.dataset.h !== html) { tx.dataset.h = html; tx.innerHTML = html; }
    }
    const rib = tv.querySelector(`[data-vt-trib="${key}"]`);
    if (rib) {
      const txt = t['vt_team_' + key] + ' · ' + side.open.filter(Boolean).length + '/' + (s.locks || []).length + (side.done === 'lost' ? ' · 🚨' : '');
      if (rib.textContent !== txt) rib.textContent = txt;
    }
    const chest = tv.querySelector(`[data-vt-chest="${key}"]`);
    if (chest) chest.classList.toggle('is-open', side.done === 'open');
  });
  // The TV that opens: its stage, as a phone's.
  if (s.tvOpens) vtPaint(state, el);
  // The card over the attic: the safe coming, its result.
  const card = tv.querySelector('[data-vt-tvcard]');
  if (card) {
    let html = '';
    if (s.phase === 'ready' || s.phase === 'result') {
      html = vtResHtml(state, null, true) + (s.phase === 'result' ? roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.vt_next_now, `roomAct('nextSafe', { safe: ${Number(s.safeNo) || 0} })`, 'secondary')}</div>`) : '');
      if (s.phase === 'result' && s.board) html += `<div class="tv-scale vt-tvcard__board">${renderScoreboard(s.board)}</div>`;
    }
    const key = [s.phase, s.safeNo, JSON.stringify(s.result), JSON.stringify(s.board || []), state.youAreHost, !!state.hostAway, appState.lang].join('|');
    if (card.dataset.key !== key) {
      card.dataset.key = key;
      card.innerHTML = html;
      card.hidden = !html;
      card.classList.toggle('is-late', s.phase === 'result' && !!(s.result || {}).open);
      card.classList.toggle('is-board', s.phase === 'result' && !!s.board);
      if (html && !motionOff()) { card.classList.remove('is-in'); void card.offsetWidth; card.classList.add('is-in'); }
      if (s.phase === 'result' && s.board) animateScoreboards(state);
    }
  }
  tv.classList.toggle('is-wait', s.phase !== 'play');
  vtFrame();
}

/** A moment on the TV: the lid opens with its glow, the alarm flashes, a toast says what happened. */
function vtTvMoment(state, el, e) {
  const tv = el.querySelector('[data-vt-tv]');
  if (!tv) return;
  const t = vtT();
  const s = state.shared || {};
  let msg = '';
  const who = e.by ? vtName(state, e.by) : '';
  if (e.type === 'open') msg = vtFill(who ? t.vt_tv_opened : t.vt_tv_opened_tv, { name: vtIso(who), lock: vtLockName(e.k) });
  else if (e.type === 'key') msg = t.vt_key_won;
  else if (e.type === 'keyUsed') msg = vtFill(t.vt_key_used, { lock: vtLockName(e.k) });
  else if (e.type === 'mistake') msg = vtFill(t.vt_tv_mistake, { lock: vtLockName(e.k) }) + (s.settings.mistakes === 'time' ? ' · −' + (e.pen || 15) : '');
  else if (e.type === 'lost') msg = (s.way === 'teams' ? t['vt_team_' + e.side] + ': ' : '') + (e.why === 'alarm' ? t.vt_lost_alarm : t.vt_lost_time);
  if (s.way === 'teams' && e.side && (e.type === 'open' || e.type === 'mistake' || e.type === 'key' || e.type === 'keyUsed')) msg = t['vt_team_' + e.side] + ': ' + msg;
  if (!motionOff()) {
    if (e.type === 'mistake' || e.type === 'safeLost' || (e.type === 'lost' && e.why === 'alarm')) { tv.classList.remove('is-alarm'); void tv.offsetWidth; tv.classList.add('is-alarm'); }
    if (e.type === 'safeOpen') {
      const chest = tv.querySelector(`[data-vt-chest="${e.side || 'x'}"]`);
      if (chest) { chest.classList.remove('is-lid'); void chest.offsetWidth; chest.classList.add('is-lid'); }
      tv.dataset.moment = 'door';
      clearTimeout(vt.momentTimer);
      vt.momentTimer = setTimeout(() => { delete tv.dataset.moment; }, 3000);
    }
  }
  if (e.type === 'safeOpen') vtConfetti(el, state);
  // The TV that opens the safe moves on to its next lock by itself, as a phone does.
  if (e.type === 'open' && s.tvOpens) { vtPadJust(el, e.i); vtAutoNext(e.i); }
  if (msg) {
    const toast = tv.querySelector('[data-vt-toast]');
    if (toast) {
      toast.textContent = msg;
      toast.classList.add('is-on');
      clearTimeout(vt.toastTimer);
      vt.toastTimer = setTimeout(() => toast.classList.remove('is-on'), 2800);
    }
  }
}
</script>
