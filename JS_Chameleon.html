/** Fills the category list in the current language, keeping whatever was picked. */
function renderChameleonCategories() {
  const catSelect = document.getElementById('chameleon-cat-select');
  if (!catSelect) return;
  const previous = catSelect.value;
  const lang = appState.lang === 'en' ? 'en' : 'ar';
  const db = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  catSelect.innerHTML = '';
  const optRandom = document.createElement('option');
  optRandom.value = 'random';
  optRandom.innerText = lang === 'en' ? '🎲 Random Category' : '🎲 فئة عشوائية';
  catSelect.appendChild(optRandom);
  db.forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.innerText = item.category;
    catSelect.appendChild(opt);
  });
  // Both languages list the categories in the same order, so the pick survives
  // a language switch as well as "play again".
  if (previous && [...catSelect.options].some(o => o.value === previous)) catSelect.value = previous;
}

// setView fills the list on the way in, so a reload or the back button gets it too.
function setupChameleon() {
  setView('setup-chameleon');
}

function startChameleonGame() {
  const selected = appState.activePlayers ? [...appState.activePlayers] : [];
  saveActivePlayers(selected);

  if (selected.length < 3) {
    const msg = appState.lang === 'en' ? "Need at least 3 players!" : "تحتاج إلى 3 لاعبين على الأقل!";
    showToast(msg);
    return;
  }

  const lang = appState.lang === 'en' ? 'en' : 'ar';
  const db = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  const catSelect = document.getElementById('chameleon-cat-select');
  let chosen = null;
  if (!catSelect || catSelect.value === 'random') {
    chosen = db[Math.floor(Math.random() * db.length)];
  } else {
    const idx = parseInt(catSelect.value, 10);
    chosen = db[idx] || db[0];
  }

  chameleonState.category = chosen.category;
  chameleonState.words = [...chosen.words];

  // Coordinates: 0..3 for row (A-D) and 0..3 for col (1-4)
  chameleonState.rowIdx = Math.floor(Math.random() * 4);
  chameleonState.colIdx = Math.floor(Math.random() * 4);
  chameleonState.secretCoord = ROW_LETTERS[chameleonState.rowIdx] + (chameleonState.colIdx + 1);
  chameleonState.secretWord = chameleonState.words[chameleonState.rowIdx * 4 + chameleonState.colIdx];

  // Pick random chameleon
  const shuffledPlayers = shuffleArray(selected);
  chameleonState.players = shuffledPlayers;
  chameleonState.chameleonPlayer = shuffledPlayers[Math.floor(Math.random() * shuffledPlayers.length)];
  chameleonState.revealIndex = 0;

  playSound('click');
  showChameleonRevealStep();
  setView('reveal-chameleon');
}

function showChameleonRevealStep() {
  if (chameleonState.revealIndex >= chameleonState.players.length) {
    startChameleonTablePlay();
    return;
  }

  const playerName = chameleonState.players[chameleonState.revealIndex];
  document.getElementById('chameleon-reveal-name').innerText = playerName;
  document.getElementById('chameleon-step-pass').classList.remove('hidden');
  document.getElementById('chameleon-step-card').classList.add('hidden');
}

function revealChameleonSecret() {
  const playerName = chameleonState.players[chameleonState.revealIndex];
  const isChameleon = (playerName === chameleonState.chameleonPlayer);
  const cardTitle = document.getElementById('chameleon-card-role');
  const cardDetail = document.getElementById('chameleon-card-detail');
  const lang = appState.lang === 'en' ? 'en' : 'ar';

  if (isChameleon) {
    playSound('alarm');
    cardTitle.innerText = lang === 'en' ? "🦎 YOU ARE THE CHAMELEON!" : "🦎 أنت الحرباء!";
    cardDetail.innerHTML = `<p class="text-sm font-semibold opacity-90">${lang === 'en' ? "You don't know the secret word! Listen closely to others, say a fitting clue, and don't get caught!" : "أنت لا تعرف الكلمة السرية! استمع بذكاء للآخرين، قل كلمة مناسبة للموضوع ولا تجعلهم يشكون فيك!"}</p>`;
  } else {
    playSound('success');
    cardTitle.innerText = lang === 'en' ? "🕵️ CIVILIAN" : "🕵️ مواطن عادي";
    cardDetail.innerHTML = `
      <div class="space-y-2">
        <div class="text-xs uppercase tracking-wider opacity-75">${lang === 'en' ? "Coordinates & Secret Word" : "الإحداثيات والكلمة السرية"}</div>
        <div class="text-2xl font-black tx-warning tracking-widest">${chameleonState.secretCoord}</div>
        <div class="text-3xl font-black">${escapeHTML(chameleonState.secretWord)}</div>
      </div>
    `;
  }

  document.getElementById('chameleon-step-pass').classList.add('hidden');
  document.getElementById('chameleon-step-card').classList.remove('hidden');
}

function doneChameleonRevealStep() {
  chameleonState.revealIndex++;
  showChameleonRevealStep();
}

function startChameleonTablePlay() {
  setView('play-chameleon');
  renderChameleonGrid();

  document.getElementById('chameleon-play-category').innerText = chameleonState.category;

  // Turn order: First player speaks first
  const turnsList = document.getElementById('chameleon-turn-order');
  if (turnsList) {
    turnsList.innerHTML = chameleonState.players.map((p, idx) => `
      <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold ${idx === 0 ? 'bg-amber-500 text-black shadow' : 'bg-black/10 dark:bg-white/10'}">
        <span>${idx + 1}.</span>
        <span>${escapeHTML(p)}</span>
      </div>
    `).join('');
  }
}

function renderChameleonGrid(interactive) {
  const gridEl = document.getElementById('chameleon-4x4-grid');
  if (!gridEl) return;

  let html = `
    <div class="grid grid-cols-5 gap-1.5 text-center font-bold text-sm">
      <div class="p-2"></div>
      <div class="p-2 tx-warning">1</div>
      <div class="p-2 tx-warning">2</div>
      <div class="p-2 tx-warning">3</div>
      <div class="p-2 tx-warning">4</div>
  `;

  for (let r = 0; r < 4; r++) {
    const rowLetter = ROW_LETTERS[r];
    html += `<div class="p-2 flex items-center justify-center tx-warning">${rowLetter}</div>`;
    for (let c = 0; c < 4; c++) {
      const idx = r * 4 + c;
      const word = chameleonState.words[idx];
      if (interactive) {
        html += `
          <button type="button" onclick="chameleonGuessWord('${jsStringAttr(word)}')"
                  class="p-2 rounded-lg bg-black/10 dark:bg-white/10 active:bg-amber-500 active:text-black font-semibold text-xs transition-colors flex items-center justify-center min-h-[52px]">
            ${escapeHTML(word)}
          </button>
        `;
      } else {
        html += `
          <div class="p-2 rounded-lg bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 font-semibold text-xs flex items-center justify-center min-h-[52px]">
            ${escapeHTML(word)}
          </div>
        `;
      }
    }
  }

  html += `</div>`;
  gridEl.innerHTML = html;
}

function openChameleonAccuseModal() {
  const lang = appState.lang === 'en' ? 'en' : 'ar';
  const list = document.getElementById('chameleon-accuse-list');
  if (list) {
    list.innerHTML = chameleonState.players.map(p => `
      <button class="ballot-option" onclick="voteChameleonAccused('${jsStringAttr(p)}')">
        <span class="ballot-option__label">${escapeHTML(p)}</span>
        <span class="badge badge--danger">${lang === 'en' ? 'Accuse' : 'اتهام'}</span>
      </button>
    `).join('');
  }
  document.getElementById('chameleon-accuse-modal').classList.remove('hidden');
}

function voteChameleonAccused(player) {
  closeModal('chameleon-accuse-modal');
  chameleonState.accusedPlayer = player;
  const isCorrectCatch = (player === chameleonState.chameleonPlayer);

  if (isCorrectCatch) {
    // Chameleon was caught! But they get one last guess!
    playSound('alarm');
    openChameleonGuessPhase();
  } else {
    // Wrong accusation! Chameleon wins automatically!
    playSound('alarm');
    finishChameleonGame(false, false);
  }
}

function openChameleonGuessPhase() {
  const lang = appState.lang === 'en' ? 'en' : 'ar';
  document.getElementById('chameleon-guess-instruction').innerText = lang === 'en'
    ? `${chameleonState.chameleonPlayer} is the Chameleon and was caught! But they can steal the win by guessing the secret word:`
    : `تم كشف الحرباء (${chameleonState.chameleonPlayer})! لكن لديه فرصة أخيرة لسرقة الفوز بتخمين الكلمة السرية:`;

  renderChameleonGrid(true); // make tiles clickable
  document.getElementById('chameleon-play-actions').classList.add('hidden');
  document.getElementById('chameleon-guess-box').classList.remove('hidden');
}

function chameleonGuessWord(word) {
  const isCorrectWord = (word === chameleonState.secretWord);
  finishChameleonGame(true, isCorrectWord);
}

function finishChameleonGame(wasCaught, chameleonGuessedWord) {
  const lang = appState.lang === 'en' ? 'en' : 'ar';
  const resultModal = document.getElementById('chameleon-result-modal');
  const titleEl = document.getElementById('chameleon-result-title');
  const detailEl = document.getElementById('chameleon-result-detail');

  let chameleonWon = false;
  let summary = "";

  if (!wasCaught) {
    // Civilians voted wrong person
    chameleonWon = true;
    summary = lang === 'en'
      ? `The civilians accused ${chameleonState.accusedPlayer}, but ${chameleonState.chameleonPlayer} was the Chameleon!`
      : `اتهم اللاعبون ${chameleonState.accusedPlayer}، بينما الحرباء الحقيقية كانت ${chameleonState.chameleonPlayer}!`;
  } else if (chameleonGuessedWord) {
    // Caught, but correctly guessed word
    chameleonWon = true;
    summary = lang === 'en'
      ? `${chameleonState.chameleonPlayer} was caught, but correctly guessed the secret word ("${chameleonState.secretWord}") and stole the win!`
      : `تم كشف ${chameleonState.chameleonPlayer}، ولكنه خمن الكلمة السرية بنجاح ("${chameleonState.secretWord}") وسرق الفوز!`;
  } else {
    // Caught and failed guess
    chameleonWon = false;
    summary = lang === 'en'
      ? `The civilians caught ${chameleonState.chameleonPlayer}, and the Chameleon failed to guess the secret word ("${chameleonState.secretWord}")!`
      : `نجح اللاعبون في كشف ${chameleonState.chameleonPlayer}، وفشلت الحرباء في تخمين الكلمة السرية ("${chameleonState.secretWord}")!`;
  }

  if (chameleonWon) {
    playSound('alarm');
    titleEl.innerText = lang === 'en' ? "🦎 THE CHAMELEON WINS!" : "🦎 الحرباء تفوز!";
    titleEl.className = "text-3xl font-black tx-warning mb-2";
  } else {
    playSound('success');
    confetti({ particleCount: 150 });
    titleEl.innerText = lang === 'en' ? "🎉 CIVILIANS WIN!" : "🎉 فوز اللاعبين!";
    titleEl.className = "text-3xl font-black tx-success mb-2";
  }

  detailEl.innerHTML = `
    <p class="text-base mb-4">${escapeHTML(summary)}</p>
    <div class="p-4 rounded-xl bg-black/5 dark:bg-white/5 space-y-1 text-sm">
      <div><b>${lang === 'en' ? 'Secret Word:' : 'الكلمة السرية:'}</b> ${escapeHTML(chameleonState.secretWord)} (${chameleonState.secretCoord})</div>
      <div><b>${lang === 'en' ? 'Chameleon:' : 'الحرباء:'}</b> ${escapeHTML(chameleonState.chameleonPlayer)}</div>
    </div>
  `;

  resultModal.classList.remove('hidden');
}

function resetChameleonPlay() {
  closeModal('chameleon-result-modal');
  document.getElementById('chameleon-guess-box').classList.add('hidden');
  document.getElementById('chameleon-play-actions').classList.remove('hidden');
  setupChameleon();
}
</script>
