<script>
  /* --- UI HELPERS --- */

/* ==========================================================================
   PLAYER PICKER
   --------------------------------------------------------------------------
   Every setup screen shows the names this phone knows, as chips. Tap one to
   put that person in the round, tap again to take them out. Typing is only
   for someone new.

   The list is local to the device (see PLAYER_LIBRARY_KEY in JS_Core.html) —
   it used to be a shared column in the spreadsheet, which meant one group's
   names showed up for every other group.
   ========================================================================== */

let pickerEditMode = false;

/**
 * The order chips are drawn in, held still between renders.
 *
 * Whoever is playing is floated to the top — with thirty saved names you should
 * not have to hunt for the four people in the round. But it is only recomputed
 * when you arrive at a screen or add someone, never while you are tapping:
 * chips that reshuffle under your finger are worse than chips in a stale order.
 */
let pickerOrder = [];
// The names just put in the round: their chips pop in once (P14, 26 Sep 2026).
let pickerJustAdded = [];

function renderActiveChips(containerId, resort) {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (!appState.activePlayers) appState.activePlayers = [];
  // مولد الفرق says under its count how the ticked players split.
  if (containerId === 'teams-player-list' && typeof paintTeamsSplit === 'function') paintTeamsSplit();
  const t = TRANSLATIONS[appState.lang];
  const active = appState.activePlayers;
  const isOn = (name) => active.some(p => samePlayer(p, name));

  // Anyone loaded from a saved group who is not in the library still belongs on
  // screen, or they would be in the round with no way to see or remove them.
  const pool = allPlayers.slice();
  active.forEach(p => { if (!pool.some(k => samePlayer(k, p))) pool.push(p); });

  if (resort || !pickerOrder.length) {
    pickerOrder = pool.slice().sort((a, b) => (isOn(b) ? 1 : 0) - (isOn(a) ? 1 : 0));
  } else {
    // Keep the order we had, minus anyone deleted, plus anyone new.
    pickerOrder = pickerOrder.filter(n => pool.some(p => samePlayer(p, n)));
    pool.forEach(p => { if (!pickerOrder.some(n => samePlayer(n, p))) pickerOrder.push(p); });
  }
  const known = pickerOrder;

  // «↕ رتّب»: the order of play is the order they were put in; it is changed
  // only when someone asks (the owner, 26 Sep 2026 - it used to pop up at every
  // start of الجاسوس and of a domino game of teams).
  const head = `
    <div class="picker__head">
      <span class="eyebrow">${escapeHTML(t.picker_saved || '')}</span>
      ${active.length >= 2 && !pickerEditMode ? `<button type="button" class="picker__edit picker__order"
              onclick="openActiveOrder('${jsStringAttr(containerId)}')">↕ ${escapeHTML(t.picker_order || '')}</button>` : ''}
      ${known.length ? `<button type="button" class="picker__edit ${pickerEditMode ? 'is-on' : ''}"
              onclick="togglePickerEdit('${jsStringAttr(containerId)}')">
          ${escapeHTML(pickerEditMode ? (t.done || 'تم') : (t.edit || 'تعديل'))}
        </button>` : ''}
    </div>`;

  if (!known.length) {
    container.innerHTML = head + `
      <div class="picker__empty">${escapeHTML(t.picker_empty || '')}</div>`;
    return;
  }

  const chips = known.map(name => {
    const on = isOn(name);
    if (pickerEditMode) {
      return `<button type="button" class="pick-chip pick-chip--del"
                onclick="deletePlayerFromLibrary('${jsStringAttr(name)}', '${jsStringAttr(containerId)}')">
                <span aria-hidden="true">✕</span>
                <span class="pick-chip__name">${escapeHTML(name)}</span>
              </button>`;
    }
    const pop = on && pickerJustAdded.some(n => samePlayer(n, name)) && !motionOff();
    return `<button type="button" class="pick-chip ${on ? 'is-on' : ''} ${pop ? 'pick-chip--pop' : ''}" aria-pressed="${on}"
              onclick="togglePlayerInRound('${jsStringAttr(name)}', '${jsStringAttr(containerId)}')">
              ${on ? '<span class="pick-chip__tick" aria-hidden="true">✓</span>' : ''}
              <span class="pick-chip__name">${escapeHTML(name)}</span>
            </button>`;
  }).join('');

  const count = active.length
    ? `${escapeHTML(t.picker_in_round || '')} <b>${active.length}</b>`
    : escapeHTML(t.picker_none || '');

  container.innerHTML = head +
    `<div class="picker__chips"><div class="chip-set">${chips}</div></div>` +
    (pickerEditMode ? '' : `<div class="picker__count">${count}</div>`);
  pickerJustAdded = [];

  // The fade only belongs there when something is actually cut off.
  const box = container.querySelector('.picker__chips');
  if (box) box.classList.toggle('is-scrollable', box.scrollHeight > box.clientHeight + 1);
}

/** Put someone in this round, or take them out. */
function togglePlayerInRound(name, containerId) {
  if (!appState.activePlayers) appState.activePlayers = [];
  const wasOn = appState.activePlayers.some(p => samePlayer(p, name));

  appState.activePlayers = wasOn
    ? appState.activePlayers.filter(p => !samePlayer(p, name))
    : appState.activePlayers.concat([name]);

  // Hand-picking someone means you are no longer playing "that saved group".
  appState.currentGroup = '';
  saveToLocal();
  renderSavedGroups();
  if (!wasOn) pickerJustAdded = [name];
  renderActiveChips(containerId);
  playSound('click');
  haptic('light');
}

function togglePickerEdit(containerId) {
  pickerEditMode = !pickerEditMode;
  renderActiveChips(containerId);
  playSound('click');
}

/** Forget a name on this phone. Saved groups keep theirs. */
function deletePlayerFromLibrary(name, containerId) {
  removeFromPlayerLibrary(name);
  renderActiveChips(containerId);
  playSound('tick');
  haptic('light');
}

/**
 * The "+" next to the name box. Adds to the library and to this round in one
 * step — nobody types a name they don't want to play with.
 */
function addPlayerFromSetup(btn) {
  const parent = btn.parentElement;
  const input = parent.querySelector('input');
  const typed = input.value.trim();
  if (!typed) { input.focus(); return; }

  const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
  const list = activeSetup && activeSetup.querySelector('[id$="-player-list"]');

  // addToPlayerLibrary returns the spelling already stored, so typing "احمد"
  // when "أحمد" is saved reuses the one you have rather than making a twin.
  const name = addToPlayerLibrary(typed);
  const t = TRANSLATIONS[appState.lang];

  if (!appState.activePlayers) appState.activePlayers = [];
  if (appState.activePlayers.some(p => samePlayer(p, name))) {
    showToast(t.player_already || '', 'warn');
  } else {
    appState.activePlayers.push(name);
    appState.currentGroup = '';
    pickerJustAdded = [name];
  }

  saveToLocal();
  input.value = '';
  pickerEditMode = false;
  // Re-sort so the name you just typed is at the top rather than at the end of
  // a forty-chip list you would have to scroll to find.
  if (list) renderActiveChips(list.id, true);
  renderSavedGroups();
  playSound('click');
  haptic('light');
  input.focus();
}


/* ==========================================================================
   «مين بيلعب؟» (the owner, 26 Sep 2026)
   --------------------------------------------------------------------------
   A game that needs names and hasn't enough used to say so in a toast that
   went away, and the name field was 450px down the screen. Now Start opens
   this centred sheet: a field for each player it needs, filled in with who
   is in the round and then the names this phone knows (latest first), the
   other saved names as chips to add in one tap, «+ لاعب», and one big «يلا»
   that puts them in the picker and starts. `then` is the game's own start.
   ========================================================================== */
const playersSheet = { min: 0, max: 0, then: null };

/** One wording everywhere for "not enough players" (the minimum, or a range). */
function playersNeedText(min, max) {
  const t = TRANSLATIONS[appState.lang] || {};
  if (max && max !== min) return (t.players_need_range || '').replace('{min}', min).replace('{max}', max);
  return (t.players_need || '').replace('{n}', min);
}

function askPlayers(min, then, opts) {
  opts = opts || {};
  const modal = document.getElementById('players-modal');
  if (!modal) { showToast(playersNeedText(min, opts.max), 'error'); return true; }
  playersSheet.min = min;
  playersSheet.max = opts.max || 0;
  playersSheet.then = then;
  // Who is in the round first, then the names this phone knows, newest first.
  const names = (appState.activePlayers || []).slice();
  const known = (typeof allPlayers !== 'undefined' ? allPlayers : []).slice().reverse();
  for (const n of known) {
    if (names.length >= min) break;
    if (!names.some(x => samePlayer(x, n))) names.push(n);
  }
  while (names.length < min) names.push('');
  const need = document.getElementById('players-sheet-need');
  if (need) { need.textContent = playersNeedText(min, opts.max); need.classList.remove('is-error'); }
  playersSheetPaint(names, true);
  modal.classList.remove('hidden');
  haptic('light');
  // The first empty field, ready to type in (a phone's keyboard comes up with it).
  setTimeout(() => {
    const empty = [...modal.querySelectorAll('.players-sheet__row input')].find(i => !i.value);
    if (empty) empty.focus();
  }, 320);
  return true;
}

function playersSheetNames() {
  return [...document.querySelectorAll('#players-sheet-fields input')].map(i => i.value);
}

function playersSheetPaint(names, fresh) {
  const box = document.getElementById('players-sheet-fields');
  if (!box) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const pop = fresh && !(typeof motionOff === 'function' && motionOff());
  box.innerHTML = names.map((n, i) => `
    <div class="players-sheet__row ${pop ? 'is-popping' : ''}" style="--i:${i}">
      <span class="players-sheet__n metric" aria-hidden="true">${i + 1}</span>
      <input type="text" maxlength="24" autocomplete="off" enterkeyhint="${i === names.length - 1 ? 'go' : 'next'}"
             value="${escapeHTML(n)}" placeholder="${escapeHTML((t.players_sheet_ph || '').replace('{n}', i + 1))}"
             aria-label="${escapeHTML((t.players_sheet_ph || '').replace('{n}', i + 1))}"
             oninput="playersSheetChips()" onkeydown="playersSheetKey(event, ${i})">
      <button type="button" class="iconbtn iconbtn--plain" aria-label="${escapeHTML((t.players_remove || '') + ' ' + (i + 1))}"
              onclick="playersSheetRemove(${i})">✕</button>
    </div>`).join('');
  const add = document.getElementById('players-sheet-add');
  if (add) add.classList.toggle('hidden', !!(playersSheet.max && names.length >= playersSheet.max));
  playersSheetChips();
}

/** The saved names not in a field yet, as chips: one tap puts one in. */
function playersSheetChips() {
  const box = document.getElementById('players-sheet-chips');
  if (!box) return;
  const inFields = playersSheetNames().filter(n => n.trim());
  const rest = (typeof allPlayers !== 'undefined' ? allPlayers : []).slice().reverse()
    .filter(n => !inFields.some(x => samePlayer(x, n))).slice(0, 24);
  box.innerHTML = rest.map(n => `<button type="button" class="pick-chip" onclick="playersSheetPick('${jsStringAttr(n)}')">
      <span class="pick-chip__name">${escapeHTML(n)}</span></button>`).join('');
  box.classList.toggle('hidden', !rest.length);
}

function playersSheetPick(name) {
  const inputs = [...document.querySelectorAll('#players-sheet-fields input')];
  const empty = inputs.find(i => !i.value.trim());
  if (empty) {
    empty.value = name;
    const row = empty.closest('.players-sheet__row');
    if (row && !(typeof motionOff === 'function' && motionOff()) && row.animate) {
      row.animate([{ transform: 'scale(0.96)' }, { transform: 'scale(1.03)' }, { transform: 'none' }], { duration: 240, easing: 'ease-out' });
    }
    playersSheetChips();
  } else {
    if (playersSheet.max && inputs.length >= playersSheet.max) return;
    playersSheetPaint(playersSheetNames().concat([name]));
    const rows = document.querySelectorAll('#players-sheet-fields .players-sheet__row');
    const last = rows[rows.length - 1];
    if (last) last.classList.add('is-popping');
  }
  haptic('light');
}

function playersSheetAddField() {
  const names = playersSheetNames();
  if (playersSheet.max && names.length >= playersSheet.max) return;
  playersSheetPaint(names.concat(['']));
  const rows = document.querySelectorAll('#players-sheet-fields .players-sheet__row');
  const last = rows[rows.length - 1];
  if (last) { last.classList.add('is-popping'); const i = last.querySelector('input'); if (i) i.focus(); }
  haptic('light');
}

function playersSheetRemove(i) {
  const names = playersSheetNames();
  if (names.length > playersSheet.min) names.splice(i, 1);
  else names[i] = '';
  playersSheetPaint(names);
}

function playersSheetKey(e, i) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const inputs = [...document.querySelectorAll('#players-sheet-fields input')];
  const next = inputs.slice(i + 1).find(x => !x.value.trim()) || inputs.find(x => !x.value.trim());
  if (next) next.focus(); else playersSheetGo();
}

function playersSheetGo() {
  const t = TRANSLATIONS[appState.lang] || {};
  const typed = playersSheetNames().map(n => n.trim()).filter(Boolean);
  const names = [];
  typed.forEach(n => { if (!names.some(x => samePlayer(x, n))) names.push(n); });
  if (names.length < playersSheet.min) {
    // What is missing, shaken where it is.
    const need = document.getElementById('players-sheet-need');
    if (need) { need.textContent = playersNeedText(playersSheet.min, playersSheet.max); need.classList.add('is-error'); }
    const empty = [...document.querySelectorAll('#players-sheet-fields input')].find(i => !i.value.trim());
    blockStartAt(empty || need, '');
    return;
  }
  if (playersSheet.max && names.length > playersSheet.max) {
    showToast(playersNeedText(playersSheet.min, playersSheet.max), 'error');
    return;
  }
  const stored = names.map(n => addToPlayerLibrary(n));
  appState.activePlayers = stored;
  appState.currentGroup = '';
  saveToLocal();
  const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
  const list = activeSetup && activeSetup.querySelector('[id$="-player-list"]');
  if (list) { pickerJustAdded = stored.slice(); renderActiveChips(list.id, true); }
  if (typeof renderSavedGroups === 'function') renderSavedGroups();
  closeModal('players-modal');
  const then = playersSheet.then;
  playersSheet.then = null;
  if (then) then(stored);
}

/**
 * A Start that can't go yet points at what is missing: the screen scrolls to
 * it, it shakes, and a field takes the focus. `msg`, if any, is said too.
 */
function blockStartAt(el, msg) {
  if (msg) showToast(msg, 'error');
  playSound('alarm');
  if (!el) return;
  // An option folded under «خيارات أكتر» opens first, or the shake would be out of sight.
  const fold = el.closest && el.closest('details.setup-more');
  if (fold && !fold.open) fold.open = true;
  const main = document.getElementById('shell-main');
  if (main && main.contains(el)) {
    const r = el.getBoundingClientRect(), m = main.getBoundingClientRect();
    if (r.top < m.top + 60 || r.bottom > m.bottom - 90) {
      main.scrollTo({ top: Math.max(0, main.scrollTop + r.top - m.top - m.height / 3), behavior: motionOff() ? 'auto' : 'smooth' });
    }
  }
  if (!motionOff()) {
    el.classList.remove('animate-shake');
    void el.offsetWidth;
    el.classList.add('animate-shake');
    setTimeout(() => el.classList.remove('animate-shake'), 600);
  }
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') setTimeout(() => el.focus(), 120);
  haptic('double');
}

/* «خيارات أكتر ▾» on a long setup (شطرنج, بنك الحظ; the owner, 26 Sep 2026):
   the choices that change the game most stay in view, the rest fold with a
   line saying what they are set to, read off the controls themselves. Every
   option is still there, one tap away. */
function setupMoreSummarise(root) {
  (root || document).querySelectorAll('.setup-more').forEach(box => {
    const body = box.querySelector('.setup-more__body');
    const out = box.querySelector('.setup-more__sum');
    if (!body || !out) return;
    const bits = [];
    body.querySelectorAll('.segmented').forEach(seg => {
      if (seg.closest('.hidden')) return;
      const on = seg.querySelector('.segmented__item.is-active');
      if (on) bits.push(on.textContent.trim().replace(/\s+/g, ' '));
    });
    body.querySelectorAll('.chip-set .chip.is-active, .chip-set .is-active').forEach(c => {
      if (!c.closest('.hidden') && !c.classList.contains('segmented__item')) bits.push(c.textContent.trim().replace(/\s+/g, ' '));
    });
    // A counter says its name and number («عدد الجولات 2»): a bare number says nothing.
    body.querySelectorAll('.stepper-row').forEach(row => {
      if (row.closest('.hidden')) return;
      const label = row.querySelector('.field__label');
      const value = row.querySelector('.stepper__value');
      if (label && value && value.value !== '') bits.push(label.textContent.trim().replace(/\s+/g, ' ') + ' ' + value.value);
    });
    body.querySelectorAll('label.switch-row').forEach(row => {
      if (row.closest('.hidden')) return;
      const input = row.querySelector('input[type=checkbox]');
      const label = row.querySelector('span');
      if (input && input.checked && label) bits.push(label.textContent.trim().replace(/\s+/g, ' '));
    });
    const text = [...new Set(bits.filter(Boolean))].slice(0, 5).join(' · ');
    if (out.textContent !== text) out.textContent = text;
  });
}

function setupMoreToggled(el) {
  if (el.open && !motionOff()) {
    const body = el.querySelector('.setup-more__body');
    if (body && body.animate) body.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

['click', 'change'].forEach(type => document.addEventListener(type, (e) => {
  const view = e.target && e.target.closest && e.target.closest('[id^="view-setup-"]');
  if (view && view.querySelector('.setup-more')) setTimeout(() => setupMoreSummarise(view), 0);
}));

/* --- REORDER LIST (TAP-TO-SWAP) --- */
  let selectedReorderIndex = null; // Tracks the first tapped player

  function renderReorderList() {
    const list = document.getElementById('reorder-list');
    list.innerHTML = '';
    
    const tapToSwapText = appState.lang === 'ar' ? 'بدّل مع... 🔄' : 'Swap with... 🔄';

    tempReorderList.forEach((p, idx) => {
        const isSelected = selectedReorderIndex === idx;
        
        // We add 'reorder-item' for our custom CSS, and 'selected' if it's clicked
        const baseClasses = "reorder-item flex justify-between items-center p-4 rounded-xl border mb-2 cursor-pointer transition-all duration-200 active:scale-95 shadow-sm select-none ";
        const selectedClass = isSelected ? "selected" : "border-slate-200 dark:border-slate-700";

        list.innerHTML += `
        <div onclick="handleReorderTap(${idx})" class="${baseClasses} ${selectedClass}">
            <div class="flex items-center gap-3">
                <div class="reorder-num">${idx + 1}</div>
                <span class="font-bold text-lg">${escapeHTML(p.name)}</span>
            </div>
            <div class="text-xs font-bold opacity-70">
                ${isSelected ? tapToSwapText : '👆'}
            </div>
        </div>`;
    });
  }
  
  /**
   * Opens the reorder list, always with nothing selected.
   *
   * That reset is the point: the armed row used to survive a Cancel, so the
   * next tap swapped a pair instead of selecting one, silently.
   */
  function openReorderModal(context, items, buttonLabel) {
    selectedReorderIndex = null;
    reorderContext = context;
    tempReorderList = items;
    const btn = document.getElementById('reorder-save-btn');
    if (btn && buttonLabel) btn.innerText = buttonLabel;
    renderReorderList();
    document.getElementById('reorder-modal').classList.remove('hidden');
  }

  /** «↕ رتّب» in a picker: the players in the round, in the order they play. */
  let activeOrderList = '';
  function openActiveOrder(containerId) {
    activeOrderList = containerId || '';
    const t = TRANSLATIONS[appState.lang] || {};
    openReorderModal('active-order', (appState.activePlayers || []).map(name => ({ name: name })), t.reorder_save);
  }

  function handleReorderTap(index) {
      if (selectedReorderIndex === null) {
          // First tap: Select the player
          selectedReorderIndex = index;
          playSound('click');
          renderReorderList();
      } else if (selectedReorderIndex === index) {
          // Tapped the exact same player: Cancel selection
          selectedReorderIndex = null;
          playSound('click');
          renderReorderList();
      } else {
          // Second tap on a different player: SWAP!
          const temp = tempReorderList[selectedReorderIndex];
          tempReorderList[selectedReorderIndex] = tempReorderList[index];
          tempReorderList[index] = temp;
          
          // Reset selection, play success sound, and re-render
          selectedReorderIndex = null;
          playSound('success'); 
          renderReorderList();
      }
  }
  
  function saveNewOrder() {
      selectedReorderIndex = null; // Clean up memory
      closeModal('reorder-modal');
      
      if (reorderContext === 'active-order') {
          // «↕ رتّب» on a setup screen: the order the round is played in.
          appState.activePlayers = tempReorderList.map(p => p.name);
          saveToLocal();
          if (activeOrderList) renderActiveChips(activeOrderList);
          // Ordered from domino's "which way?" question: back to it, teams redrawn.
          if (typeof dominoOrderReturn !== 'undefined' && dominoOrderReturn) {
              dominoOrderReturn = false;
              paintDominoTeamsLine();
              const m = document.getElementById('domino-mode-modal');
              if (m) m.classList.remove('hidden');
          }
      } else if (reorderContext === 'imposter') {
          finalizeImposterGame(tempReorderList.map(p => p.name));
      } else if (reorderContext === 'domino-teams') {
          finalizeDominoTeams(tempReorderList.map(p => p.name));
      } else {
          appState.monkey.players = [...tempReorderList];
          appState.monkey.turnIndex = 0; 
          renderMonkeyBoard();
          startTimer();
      }
  }

  /* --- SPIN PICKER --- */
  let pickerInterval = null;
  function runStartSpin() {
      const selected = appState.activePlayers || [];
      if (selected.length < 2) return askPlayers(2, () => runStartSpin());
      appState.spin.players = [...selected];
      setView('play-spin');
      wheelRotation = 0;
      renderWheel();
      const display = document.getElementById('picker-display');
      if (display) display.innerText = '???';
      document.getElementById('spin-result-box').classList.add('hidden');
      document.getElementById('spin-btn').disabled = false;
  }

  /* --- RANDOM PICKER (WHEEL) ------------------------------------------------
   * The tool was always described as a wheel of fortune but rendered as "???"
   * and a button. The wheel below is drawn as SVG, and the result is decided up
   * front so the wheel can be spun to land on it — the same trick a real prize
   * wheel animation uses.
   * ---------------------------------------------------------------------- */

  // Segment colours, walked in order so neighbours never share one.
  const WHEEL_COLORS = [
      '#6d28d9', '#0d9488', '#ea580c', '#2563eb',
      '#e11d48', '#059669', '#7c3aed', '#d97706'
  ];

  let wheelRotation = 0;

  /**
   * Paints the wheel as SVG. Angles run clockwise from twelve o'clock, which is
   * where the needle sits, so slice i covers [i*slice, (i+1)*slice).
   */
  function renderWheel() {
      const wheel = document.getElementById('spin-wheel');
      if (!wheel) return;

      const players = appState.spin.players || [];
      if (players.length === 0) { wheel.innerHTML = ''; return; }

      const R = 50;                 // viewBox is 100x100
      const CX = 50, CY = 50;
      const slice = 360 / players.length;
      const textR = R * 0.62;       // how far out the names sit: between the hub and the rim
      // The names are at least 14px on screen however small the wheel is drawn
      // (they were ~11px, turned, on a phone), and a long one is cut with an
      // ellipsis to the room its slice has between the hub and the rim.
      const px = wheel.clientWidth || 280;
      const fontSize = Math.max(5.4, 14 * 100 / px);
      const maxChars = Math.max(3, Math.floor(34 / (fontSize * 0.6)));

      // Polar -> cartesian, 0deg at twelve o'clock, going clockwise.
      const pt = (angle, radius) => {
          const rad = (angle - 90) * Math.PI / 180;
          return [CX + radius * Math.cos(rad), CY + radius * Math.sin(rad)];
      };
      const fmt = (n) => n.toFixed(3);

      let svg = '<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">';

      players.forEach((name, i) => {
          const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
          const a0 = i * slice;
          const a1 = (i + 1) * slice;

          if (players.length === 1) {
              svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="' + color + '"/>';
          } else {
              const [x0, y0] = pt(a0, R);
              const [x1, y1] = pt(a1, R);
              const largeArc = slice > 180 ? 1 : 0;
              svg += '<path d="M ' + CX + ' ' + CY +
                     ' L ' + fmt(x0) + ' ' + fmt(y0) +
                     ' A ' + R + ' ' + R + ' 0 ' + largeArc + ' 1 ' + fmt(x1) + ' ' + fmt(y1) +
                     ' Z" fill="' + color + '"/>';
          }
      });

      // Labels on top of every slice, so a name can never be hidden by the
      // neighbouring path's edge.
      players.forEach((name, i) => {
          const mid = i * slice + slice / 2;
          const [tx, ty] = pt(mid, textR);
          // Radial text points back at the viewer past the horizontal; turn
          // those the other way up.
          const flip = mid > 90 && mid < 270;
          const rot = flip ? mid + 90 : mid - 90;
          const chars = Array.from(name);
          const short = chars.length > maxChars ? chars.slice(0, maxChars - 1).join('') + '\u2026' : name;

          svg += '<text x="' + fmt(tx) + '" y="' + fmt(ty) + '"' +
                 ' transform="rotate(' + fmt(rot) + ' ' + fmt(tx) + ' ' + fmt(ty) + ')"' +
                 ' text-anchor="middle" dominant-baseline="central"' +
                 ' fill="#fff" font-size="' + fmt(fontSize) + '" font-weight="800"' +
                 ' style="font-family: var(--font); paint-order: stroke; stroke: rgba(0,0,0,.28); stroke-width: 1.1px">' +
                 escapeHTML(short) + '</text>';
      });

      svg += '</svg>';
      wheel.innerHTML = svg;
      wheel.style.transform = 'rotate(' + wheelRotation + 'deg)';
  }

  function pickRandomPlayer() {
      const players = appState.spin.players;
      if (!players || players.length === 0) return;

      const btn = document.getElementById('spin-btn');
      const wheel = document.getElementById('spin-wheel');
      const resultBox = document.getElementById('spin-result-box');
      if (btn) btn.disabled = true;
      if (resultBox) resultBox.classList.add('hidden');

      const winnerIdx = Math.floor(Math.random() * players.length);
      const slice = 360 / players.length;

      // The needle sits at the top (0deg). To bring the winning slice's centre
      // under it, rotate by -(centre) and add whole turns for the spin itself.
      const target = 360 - (winnerIdx * slice + slice / 2);
      const turns = 4 + Math.floor(Math.random() * 2);
      wheelRotation += turns * 360 + ((target - (wheelRotation % 360)) + 360) % 360;

      if (wheel) wheel.style.transform = 'rotate(' + wheelRotation + 'deg)';
      haptic('medium');

      // Tick while it slows down, then settle.
      let ticks = 0;
      if (pickerInterval) clearInterval(pickerInterval);
      pickerInterval = setInterval(() => {
          playSound('tick');
          if (++ticks > 14) { clearInterval(pickerInterval); pickerInterval = null; }
      }, 150);

      const settle = () => {
          if (pickerInterval) { clearInterval(pickerInterval); pickerInterval = null; }
          finalizePickerResult(players[winnerIdx]);
      };
      // The .wheel transition is 3.6 s of a steep ease-out: it looks stopped by about
      // 2.8 s, so the name comes then. A timer rather than transitionend so a
      // reduced-motion user (no transition, no event) still gets a result.
      clearTimeout(pickerSettleTimer);
      // 3700 -> 2800 (the owner, 8 Oct 2026: felt slow)
      pickerSettleTimer = setTimeout(settle, prefersReducedMotion() ? 200 : 2800);
  }

  // Leaving mid-spin: no fanfare and confetti later on another screen, and the
  // button is usable again on the way back.
  let pickerSettleTimer = null;
  onLeaveScreen((from) => {
      if (from !== 'play-spin' || !pickerSettleTimer) return;
      clearTimeout(pickerSettleTimer);
      pickerSettleTimer = null;
      const btn = document.getElementById('spin-btn');
      if (btn) btn.disabled = false;
  });

  function finalizePickerResult(winner) {
      const nameEl = document.getElementById('picked-player-name');
      const liveEl = document.getElementById('picker-display');
      const challengeEl = document.getElementById('picked-challenge');
      const btn = document.getElementById('spin-btn');

      if (nameEl) nameEl.innerText = winner;
      if (liveEl) liveEl.innerText = winner;
      if (challengeEl) challengeEl.innerText = '';

      if (box) box.classList.remove('hidden');
      playSound('success');
      haptic('double');

     «مين بيلعب؟» asks for them first (its dealing lives in JS_Teams.html). */

  /* --- UNIVERSAL COUNTER --- */
  function startUniversal() {
      const chips = document.querySelectorAll('#universal-setup-list > div > span');
      let players = Array.from(chips).map(c => ({ name: c.innerText, score: 0 }));
      
      // Fallback: If no manual chips, use appState.activePlayers
      if (players.length === 0 && appState.activePlayers && appState.activePlayers.length > 0) {
          players = appState.activePlayers.map(name => ({ name: name, score: 0 }));
      }

      if (players.length === 0) return askPlayers(1, () => startUniversal());
      // A new counter: the last one's «رجّع النقط» is not on offer.
      if (univUndo) { clearTimeout(univUndo.timer); univUndo = null; }
      appState.universal.players = players;
      renderUniversalBoard();
      setView('play-universal');
  }
  /*
   * ideas batch: solo - the counter is sorted by score (ties keep their
   * order), the leader crowned. A row is kept, not rebuilt, so a held + goes on
   * repeating (holdRepeat below); the rows slide into their new order
   * (motionRowsSwap) - not while a button is held, then once it lets go.
   */
  function univOrder() {
      const ps = appState.universal.players;
      return ps.map((p, i) => i).sort((a, b) => (ps[b].score - ps[a].score) || (a - b));
  }
  function renderUniversalBoard() {
      const div = document.getElementById('universal-board');
      if (!div) return;
      const ps = appState.universal.players;
      // The place (a 👑 for a lone leader), the name, a quiet −, the score and a big +
      // at the row's end: + is what the table presses all evening.
      const rowHtml = (p, idx) => `
          <div class="univ-row" data-univ-row="${idx}">
              <span class="univ-rank" aria-hidden="true"><span class="univ-crown">👑</span><span class="univ-place metric"></span></span>
              <span class="univ-name">${escapeHTML(p.name)}</span>
              <button onclick="modUnivScore(${idx}, -1)" class="univ-minus" aria-label="${escapeHTML(p.name)} −1" data-hold-repeat>−</button>
              <span class="univ-score metric" data-univ-score="${idx}">${p.score}</span>
              <button onclick="modUnivScore(${idx}, 1)" class="univ-plus" aria-label="${escapeHTML(p.name)} +1" data-hold-repeat>+</button>
          </div>`;
      const rows = Array.from(div.querySelectorAll('.univ-row'));
      const names = rows.map(r => r.querySelector('.univ-name').textContent);
      if (rows.length !== ps.length || rows.some((r, k) => !ps[Number(r.dataset.univRow)] || names[k] !== ps[Number(r.dataset.univRow)].name)) {
          div.innerHTML = univOrder().map(i => rowHtml(ps[i], i)).join('');
      } else {
          ps.forEach((p, i) => {
              const sc = div.querySelector('[data-univ-score="' + i + '"]');
              if (sc && sc.textContent !== String(p.score)) sc.textContent = p.score;
          });
          if (!holdRepeatActive) {
              const want = univOrder();
              const now = Array.from(div.querySelectorAll('.univ-row')).map(r => Number(r.dataset.univRow));
              if (want.join() !== now.join()) {
                  motionRowsSwap(div, () => want.forEach(i => div.appendChild(div.querySelector('[data-univ-row="' + i + '"]'))));
              }
          }
      }
      // The leader wears the crown: only one, once someone is ahead of the rest.
      const top = Math.max.apply(null, ps.map(p => p.score));
      const leaders = ps.filter(p => p.score === top).length;
      div.querySelectorAll('.univ-row').forEach(r => {
          const p = ps[Number(r.dataset.univRow)];
          r.classList.toggle('is-leader', ps.length > 1 && leaders === 1 && p.score === top);
          // A place is one more than how many are ahead, so a tie shares it.
          const place = r.querySelector('.univ-place');
          const n = String(ps.filter(q => q.score > p.score).length + 1);
          if (place && place.textContent !== n) place.textContent = n;
      });
      paintUnivReset();
  }

  /*
   * «صفّر الكل» sets every score to 0 at once, and for a few seconds the same
   * button offers them back («↶ رجّع النقط»): an undo, not an "are you sure?".
   */
  const UNIV_UNDO_MS = 6000;
  let univUndo = null;   // { scores, until, timer }
  function univResetTap() {
      const ps = appState.universal.players || [];
      if (univUndo && Date.now() < univUndo.until) {
          univUndo.scores.forEach((s, i) => { if (ps[i]) ps[i].score = s; });
          clearTimeout(univUndo.timer);
          univUndo = null;
          haptic('light');
      } else {
          if (!ps.some(p => p.score)) return;
          univUndo = { scores: ps.map(p => p.score), until: Date.now() + UNIV_UNDO_MS };
          univUndo.timer = setTimeout(() => { univUndo = null; paintUnivReset(); }, UNIV_UNDO_MS);
          ps.forEach(p => { p.score = 0; });
          haptic('medium');
      }
      saveToLocal();
      renderUniversalBoard();
  }
  function paintUnivReset() {
      const btn = document.getElementById('univ-reset-btn');
      if (!btn) return;
      const t = TRANSLATIONS[appState.lang] || {};
      const undo = !!(univUndo && Date.now() < univUndo.until);
      const key = undo ? 'univ_undo_reset' : 'univ_reset_all';
      if (btn.getAttribute('data-i18n') !== key) {
          btn.setAttribute('data-i18n', key);
          btn.textContent = t[key] || '';
      }
      btn.disabled = !undo && !(appState.universal.players || []).some(p => p.score);
  }

  /*
   * ideas batch: solo - hold to repeat, for every stepper: the setup steppers
   * (.stepper__btn -> stepField), the card score keepers (.cs-step__btn -> csStep)
   * and anything marked data-hold-repeat (the counter's + and -). A tap is still
   * one step (the button's own click). Held for HOLD_REPEAT_DELAY it repeats,
   * faster and faster; letting go, a cancel, the page hiding, or the button going
   * away or being disabled stops it, and the click that ends a hold is swallowed
   * so it doesn't add one more.
   */
  const HOLD_REPEAT_SEL = '.stepper__btn, .cs-step__btn, [data-hold-repeat]';
  const HOLD_REPEAT_DELAY = 420;
  let holdRepeatActive = null;   // { el, timer, fired, pid }
  let holdRepeatSwallowUntil = 0;
  let holdRepeatSwallowEl = null;
  function holdRepeatStop(released) {
      const h = holdRepeatActive;
      if (!h) return;
      clearTimeout(h.timer);
      holdRepeatActive = null;
      try { h.el.releasePointerCapture(h.pid); } catch (e) {}
      if (h.fired) {
          // The click the browser sends after a held button is let go was already counted.
          if (released) { holdRepeatSwallowUntil = Date.now() + 600; holdRepeatSwallowEl = h.el; }
          h.el.dispatchEvent(new CustomEvent('hold-repeat-end', { bubbles: true }));
      }
  }
  function holdRepeatStep() {
      const h = holdRepeatActive;
      if (!h) return;
      if (!h.el.isConnected || h.el.disabled) { holdRepeatStop(false); return; }
      h.fired++;
      h.el.click();                                   // the button's own action, one step
      const gap = Math.max(45, Math.round(170 * Math.pow(0.86, h.fired)));
      h.timer = setTimeout(holdRepeatStep, gap);
  }
  if (typeof document !== 'undefined') {
      document.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          holdRepeatSwallowUntil = 0;            // a new press: the last hold's click is not coming
          const el = e.target && e.target.closest && e.target.closest(HOLD_REPEAT_SEL);
          if (!el || el.disabled) return;
          holdRepeatStop(false);
          holdRepeatActive = { el: el, fired: 0, pid: e.pointerId, timer: setTimeout(holdRepeatStep, HOLD_REPEAT_DELAY) };
          try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }, true);
      ['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, (e) => {
          if (holdRepeatActive && e.pointerId === holdRepeatActive.pid) holdRepeatStop(ev === 'pointerup');
      }, true));
      // A finger that slides well off the button (the capture keeps its events) lets go of it.
      document.addEventListener('pointermove', (e) => {
          const h = holdRepeatActive;
          if (!h || e.pointerId !== h.pid) return;
          const r = h.el.getBoundingClientRect();
          if (e.clientX < r.left - 24 || e.clientX > r.right + 24 || e.clientY < r.top - 24 || e.clientY > r.bottom + 24) holdRepeatStop(false);
      }, true);
      document.addEventListener('visibilitychange', () => holdRepeatStop(false));
      window.addEventListener('blur', () => holdRepeatStop(false));
      document.addEventListener('click', (e) => {
          if (Date.now() < holdRepeatSwallowUntil && e.isTrusted && holdRepeatSwallowEl && e.target && e.target.closest
              && e.target.closest(HOLD_REPEAT_SEL) === holdRepeatSwallowEl) {
              holdRepeatSwallowUntil = 0;
              e.stopPropagation();
              e.preventDefault();
          }
      }, true);
      // The counter re-sorts once a held button lets go.
      document.addEventListener('hold-repeat-end', (e) => {
          if (e.target.closest && e.target.closest('#universal-board')) renderUniversalBoard();
      });
  }
  function modUnivScore(idx, val) {
      appState.universal.players[idx].score += val;
      renderUniversalBoard();
      // The number just changed pops (JS_Motion.html section 13).
      if (typeof motionBump === 'function') motionBump(document.querySelector('[data-univ-score="' + idx + '"]'), 1.25);
      saveToLocal();
      playSound(val > 0 ? 'click' : 'tick');
  }

/* --- TIMERS --- */
  function switchTimerMode(mode) {
      const timerUI = document.getElementById('timer-general-ui');
      if(timerUI) timerUI.classList.add('hidden');
      
      // Tab switching is no longer needed for chess since it has its own screen, 
      // but we keep this for the General Timer view safely.
      if(document.getElementById('tab-general')) {
          document.getElementById('tab-general').className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow";
      }
      if(timerUI) timerUI.classList.remove('hidden');
  }

  function adjustGenTimer(mins) {
      const tm = appState.timers.general;
      tm.time += (mins * 60);
      if(tm.time < 0) tm.time = 0;
      // ideas batch: solo - the ring measures against the length set, or the longest the time has been since.
      if (!tm.running || tm.time > (tm.total || 0)) tm.total = tm.time;
      updateGenDisplay();
      if (typeof motionBump === 'function') motionBump(document.getElementById('gen-timer-display'), 1.08);

      // A clock's length is fixed when it is created, so adjusting the time while
      // it runs means restarting it from the new value.
      if (tm.running) {
          if (tm.interval) tm.interval.stop();
          tm.interval = null;
          tm.running = false;
          toggleGenTimer();
      }
  }

  function updateGenDisplay() {
      const t = appState.timers.general.time;
      const m = Math.floor(t / 60).toString().padStart(2,'0');
      const s = (t % 60).toString().padStart(2,'0');
      const el = document.getElementById('gen-timer-display');
      if (el) el.innerText = `${m}:${s}`;
      // ideas batch: solo - the ring drains with the time left.
      const ring = document.getElementById('gtm-ring-fill');
      if (ring) {
          const total = appState.timers.general.total || 0;
          const f = total > 0 ? Math.max(0, Math.min(1, t / total)) : 0;
          ring.style.strokeDashoffset = String(1 - f);
          const dial = document.getElementById('gtm-dial');
          if (dial) {
              dial.classList.toggle('is-running', !!appState.timers.general.running);
              dial.classList.toggle('is-low', !!appState.timers.general.running && t <= 10 && t > 0);
          }
      }
      if (typeof timerPillSync === 'function') timerPillSync();   // the pill under the header (1232)
      genTimerBtnKey();
  }

  /* The start button's text is the script's (ابدأ / إيقاف), and its data-i18n
     key has to say the same: applyTranslations (every setView) rewrote a running
     timer's «إيقاف» back to «ابدأ» whenever its screen was opened (found with 1236). */
  function genTimerBtnKey() {
      const b = document.getElementById('gen-start-btn');
      if (!b) return;
      const key = appState.timers.general.running ? 'pause_btn' : 'start_btn';
      if (b.getAttribute('data-i18n') !== key) b.setAttribute('data-i18n', key);
  }

  /** ideas batch: solo - a preset starts the timer at once at that length (whatever was running). */
  function genTimerPreset(seconds) {
      const tm = appState.timers.general;
      if (tm.interval) tm.interval.stop();
      tm.interval = null;
      tm.running = false;
      tm.endsAt = null;
      tm.time = seconds;
      tm.total = seconds;
      updateGenDisplay();
      if (typeof motionBump === 'function') motionBump(document.getElementById('gtm-dial'), 1.05);
      toggleGenTimer();
  }

  // Coming back to the timer (or a reload onto it) shows its real time and state.
  function paintGenTimer() {
      const tm = appState.timers.general;
      if (tm.running && !tm.interval) tm.running = false;
      updateGenDisplay();
      const btn = document.getElementById('gen-start-btn');
      const t = TRANSLATIONS[appState.lang] || {};
      if (btn) btn.innerText = tm.running ? t.pause_btn : t.start_btn;
  }

  function toggleGenTimer() {
      const tm = appState.timers.general;
      const btn = document.getElementById('gen-start-btn');
      if(tm.running) {
          if (tm.interval) tm.interval.stop();
          tm.interval = null;
          tm.running = false;
          tm.endsAt = null;
          if (btn) btn.innerText = TRANSLATIONS[appState.lang].start_btn;
      } else {
          if(tm.time <= 0) return;
          if (!tm.total || tm.total < tm.time) tm.total = tm.time;
          tm.running = true;
          // The deadline is saved with the app, so a reload (or iOS dropping the page
          // while the phone is locked) doesn't leave the timer silently stopped.
          tm.endsAt = Date.now() + tm.time * 1000;
          saveToLocal();
          if (btn) btn.innerText = TRANSLATIONS[appState.lang].pause_btn;
          // It keeps counting when the screen is left (a timer for a pot on the
          // stove, a break between games), and rings wherever the phone is.
          tm.interval = createClock({
              seconds: tm.time,
              keepRunning: true,
              onTick: (left) => {
                  tm.time = left;
                  updateGenDisplay();
              },
              onEnd: () => {
                  tm.interval = null;
                  tm.time = 0;
                  tm.running = false;
                  tm.endsAt = null;
                  updateGenDisplay();
                  // The timer's alarm is the tool itself: it sounds unless sound is fully off (audit 7 Oct 2026, H3).
                  playSound('alarm', false, true);
                  haptic('heavy');
                  const b = document.getElementById('gen-start-btn');
                  if (b) b.innerText = TRANSLATIONS[appState.lang].start_btn;
                  syncWakeLock(appState.currentView);
                  if (appState.currentView !== 'timers') {
                      const t = TRANSLATIONS[appState.lang] || {};
                      showToast('⏰ ' + (t.timer_done || 'خلص وقت المؤقت'), 'success');
                  }
              }
          });
      }
      syncWakeLock(appState.currentView);   // the screen stays on while it runs (1231)
      if (typeof timerPillSync === 'function') timerPillSync();
      genTimerBtnKey();
  }

  function resetGenTimer() {
      const tm = appState.timers.general;
      if (tm.interval) tm.interval.stop();
      tm.interval = null;
      tm.running = false;
      tm.endsAt = null;
      tm.time = 0;
      tm.total = 0;
      updateGenDisplay();
      document.getElementById('gen-start-btn').innerText = TRANSLATIONS[appState.lang].start_btn;
      syncWakeLock(appState.currentView);
  }

  /** After a reload: a timer that was running goes on with the time really left, or says it finished meanwhile. */
  function restoreGenTimer() {
      const tm = appState.timers.general;
      if (!tm.endsAt || (tm.interval && tm.interval.isRunning && tm.interval.isRunning())) return;
      const left = Math.ceil((tm.endsAt - Date.now()) / 1000);
      tm.running = false;
      tm.interval = null;
      if (left > 0) {
          tm.time = left;
          toggleGenTimer();
      } else {
          tm.endsAt = null;
          tm.time = 0;
          updateGenDisplay();
          const t = TRANSLATIONS[appState.lang] || {};
          showToast('⏰ ' + (t.timer_done || 'خلص وقت المؤقت'), 'success');
      }
  }
  document.addEventListener('DOMContentLoaded', () => { try { restoreGenTimer(); } catch (e) {} });

  /* --- UPGRADED FULL SCREEN CHESS LOGIC --- */
  function exitChessTimer(event) {

      pauseChess();
      setView('menu');
  }

  function configChess(event) {

      const tm = appState.timers.chess;
      stopChessClock();
      tm.active = null;
      tm.time1 = tm.initial;
      tm.time2 = tm.initial;

  function chessClick(player) {
      const tm = appState.timers.chess;
      // A side that has run out ends the game. Tapping used to start a fresh
      // clock seeded with 0 seconds, which fired the alarm again immediately.
      if (tm.time1 <= 0 || tm.time2 <= 0) {
          const over = appState.lang === 'ar' ? 'انتهى الوقت — أعد الضبط' : "Time's up — reset to play again";
          return showToast(over, 'warn');
      }
      if(player === 1) {
          if(tm.active === 1 || tm.active === null) startChessTimer(2);
      } else if (player === 2) {
          if(tm.active === 2 || tm.active === null) startChessTimer(1);
      }
      playSound('click');
  }

  /* Each side's time is kept to the millisecond (ms1, ms2) and charged exactly
     when its turn ends. Whole seconds charged on each tick made a move inside a
     second free and rounded every move in the mover's favour - in blitz that
     is real time. time1/time2 stay the seconds on screen. */
  const chessMs = (tm, side) => {
      const shown = (side === 1 ? tm.time1 : tm.time2) * 1000;
      const kept = side === 1 ? tm.ms1 : tm.ms2;
      // Never more than the seconds on screen: a reload mid-turn saved the ticks but not the charge.
      return typeof kept === 'number' && Math.ceil(kept / 1000) * 1000 <= shown ? kept : shown;
  };

  function stopChessClock() {
      const tm = appState.timers.chess;
      if (tm.interval && (tm.active === 1 || tm.active === 2) && tm.turnAt && typeof tm.turnMs === 'number') {
          // From what the turn started with: the ticks have been lowering time1/time2 meanwhile.
          const left = Math.max(0, tm.turnMs - (Date.now() - tm.turnAt));
          if (tm.active === 1) { tm.ms1 = left; tm.time1 = Math.ceil(left / 1000); }
          else { tm.ms2 = left; tm.time2 = Math.ceil(left / 1000); }
      }
      tm.turnAt = null;
      tm.turnMs = null;
      if (tm.interval) tm.interval.stop();
      tm.interval = null;
  }

  function startChessTimer(activePlayer) {
      const tm = appState.timers.chess;
      stopChessClock();
      tm.active = activePlayer;
      updateChessUI();

      // One clock per turn, seeded with exactly what that player has banked. A
      // chess clock is the case where counting ticks hurt most: a phone that
      // throttled the tab handed back time the player had actually used.
      tm.turnMs = chessMs(tm, activePlayer);
      tm.turnAt = Date.now();
      tm.interval = createClock({
          ms: tm.turnMs,
          onTick: (left) => {
              if (activePlayer === 1) tm.time1 = left; else tm.time2 = left;
              updateChessUI();
          },
          onEnd: () => {
              if (activePlayer === 1) { tm.time1 = 0; tm.ms1 = 0; } else { tm.time2 = 0; tm.ms2 = 0; }
              tm.turnAt = null;
              updateChessUI();
              chessGameOver();
          }
      });
  }

  // Leaving the chess clock pauses it, charging the turn so far (clearAllIntervals
  // would only stop the clock, losing the part of a second the player used).
  if (typeof onLeaveScreen === 'function') {
      onLeaveScreen((from) => { if (from === 'play-chess' && appState.timers.chess.interval) pauseChess(); });
  }

  function pauseChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      stopChessClock();
      appState.timers.chess.active = null;
      updateChessUI();
  }

  function updateChessUI() {
      const tm = appState.timers.chess;
      const fmt = (t) => {
          const m = Math.floor(t / 60).toString().padStart(2,'0');
          const s = (t % 60).toString().padStart(2,'0');
          return `${m}:${s}`;
      };
      
      const time1El = document.getElementById('chess-time-1');
      const time2El = document.getElementById('chess-time-2');
      if(time1El) time1El.innerText = fmt(tm.time1);
      if(time2El) time2El.innerText = fmt(tm.time2);

      // Both halves used to carry data-i18n="players", so switching language
      // relabelled them both "Players" instead of "Player 1" / "Player 2".
      const who = appState.lang === 'ar' ? 'اللاعب' : 'Player';
      const l1 = document.getElementById('chess-label-1');
      const l2 = document.getElementById('chess-label-2');
      if (l1) l1.innerText = who + ' 1';
      if (l2) l2.innerText = who + ' 2';

      const btn1 = document.getElementById('chess-btn-1');
      const btn2 = document.getElementById('chess-btn-2');
      if(!btn1 || !btn2) return;

      // Both halves stay readable: you need to see the opponent's clock, and
      // the old idle styling (slate-600 on slate-900, 60% opacity) was invisible.
      const stateOf = (side) => {
          const left = side === 1 ? tm.time1 : tm.time2;
          if (left <= 0) return 'is-out';
          if (tm.active === side) return 'is-active';
          return 'is-idle';
      };
      btn1.className = 'chess-half ' + stateOf(1);
      btn2.className = 'chess-half chess-half--flip ' + stateOf(2);
  }

  function hardResetApp() {
    const msg = appState.lang === 'ar' ? 'متأكد إنك عايز تمسح كل البيانات وتبدأ من الأول؟' : 'Are you sure you want to reset all data and start over?';

        // is: its leave hooks run (chains no clock covers, sensors) and the
        // screen-on lock is let go. After the reset currentView is already 'menu'.
        if (appState.currentView !== 'menu') setView('menu');
        // 1. Stop all running timers - the general timer too, which clearAllIntervals
        // leaves running on purpose (it rings from any screen) and would ring later.
        const gen = appState.timers && appState.timers.general;
        if (gen && gen.interval && gen.interval.stop) gen.interval.stop();
        clearAllIntervals();
        // Only once confirmed: Cancel used to wipe the recent games anyway.
        if (typeof forgetRecent === 'function') forgetRecent();
        // Everything else this phone kept under the app's name - bests, the
        // daily streak, room options, the last name - except how the device
        // itself is set up (motion, screen size, the home-screen install).
        const KEEP = ['ashryMotion', 'ashryUiScale', 'ashryInstallHaveIt', 'ashryInstalledIcon', 'ashryInstallAskedAt', 'ashryIconSnooze', 'ashryPlayedOnce', 'ashryPersistAsked'];
        try {
            Object.keys(localStorage)
                .filter(k => k.indexOf('ashry') === 0 && KEEP.indexOf(k) === -1)
                .forEach(k => localStorage.removeItem(k));
        } catch (e) {}

        // 2. Clear Local Storage. The room session lives under its own key, so
        // without this a "reset everything" still silently rejoined the old room
        // on the next load.
        // Each in its own try: a browser that blocks storage throws here, and
        // the reset below (and closing the confirm) must still happen.
        const drop = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
        drop('gameTrackerState_v1');
        try { if (typeof Room !== 'undefined' && Room.isIn) Room.leave(); } catch (e) {}
        drop('ashryRoom_v1');
        // The saved names and groups are this phone's too, and "start from
        // scratch" has to mean it.
        drop(PLAYER_LIBRARY_KEY);
        drop('ashry_saved_groups');
        if (typeof forgetSeenLists === 'function') forgetSeenLists();

        // 4. Reset Global Variables (Clean Slate)
        allPlayers = []; 
        dataLoaded = false;
        lastSelectedPlayers = [];
        switchData = { monkeyRow: null, targetRow: null, targetCol: null };
        tempReorderList = [];

  /* --- Put it on the home screen ------------------------------------------
     A phone that opens the app in its browser is asked to add it to the home
     screen, with the steps for that phone and that browser - and on Android,
     where Chrome allows it, a real one-tap install button instead of steps.
     Only on a phone (not a tablet, a computer or a TV), never in the
     home-screen copy, never over a game or a room: it waits until the home,
     مع بعض or الأدوات is on screen and the intro has gone - and only once
     this phone has played something (been on a game's play screen and come
     back): a first visit used to get it straight after the intro, before a
     single game, which is the moment it is easiest to dismiss. Once a visit: a
     visit is a page load at least INSTALL_VISIT_GAP_MS after the last ask,
     so a reload mid-evening doesn't ask again, and tomorrow does. "I already
     added it" stops it in this browser for good (a browser can't see the
     home-screen copy by itself); Settings → تثبيت التطبيق always opens it.
     ------------------------------------------------------------------------ */
  const INSTALL_ASKED_KEY = 'ashryInstallAskedAt';
  const INSTALL_HAVE_KEY = 'ashryInstallHaveIt';
  const INSTALL_VISIT_GAP_MS = 30 * 60 * 1000;
  const INSTALL_ROOT_VIEWS = ['menu', 'together', 'tools'];
  const INSTALL_PLAYED_KEY = 'ashryPlayedOnce';
  // Played: left a game's play screen, one phone or a room (not the lobby, not a TV).
  onLeaveScreen((from) => {
      if (!/^play-/.test(from) && !(/^room-/.test(from) && from !== 'room-lobby' && from !== 'room-tv')) return;
      try { localStorage.setItem(INSTALL_PLAYED_KEY, '1'); } catch (e) {}
      // After the first game, ask the browser to keep this phone's data (the owner's
      // pick 1260; keepDataAsk in JS_Core.html asks once, whatever else asked first).
      keepDataAsk();
  });
  let installAskPending = true;     // this page load hasn't asked yet
  let installPromptEvent = null;    // Chrome's install prompt, kept for our own button

  const inStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  /** The phone and browser this is, for the steps; null when it isn't a phone. */
  function installTarget() {
      const ua = navigator.userAgent || '';
      const ipad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const ios = !ipad && /iPhone|iPod/.test(ua);
      const android = /Android/.test(ua) && /Mobile/.test(ua);   // tablets and TVs say no "Mobile"
      if (!ios && !android) return null;
      // The browser inside another app (Instagram, Facebook, TikTok, Google...) can't add anything.
      const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|TikTok|musical_ly|Bytedance|GSA\//.test(ua)
          || (android && /; wv\)/.test(ua));
      let browser;
      if (inApp) browser = 'inapp';
      else if (ios) browser = /CriOS/.test(ua) ? 'chrome' : /FxiOS|EdgiOS|OPiOS|YaBrowser/.test(ua) ? 'other' : 'safari';
      else if (/SamsungBrowser/.test(ua)) browser = 'samsung';
      else if (/Firefox/.test(ua)) browser = 'firefox';
      else if (/Chrome\//.test(ua) && !/EdgA|OPR|YaBrowser|MiuiBrowser|HuaweiBrowser/.test(ua)) browser = 'chrome';
      else browser = 'other';
      return { os: ios ? 'ios' : 'android', browser: browser };
  }

  /* Inside another app's browser (the owner's pick 1264, 7 Oct 2026): names, groups and the
     dealt-words memory live in this browser's storage, which Instagram's or Facebook's own
     browser may throw away, so a slim bar under the header says so on every screen - once a
     visit, ✕ closes it until the next one; a tap on its words opens the steps (the install
     sheet's «افتحه في المتصفح» ones). From the end of the intro (introDone, JS_Core.html). */
  const INAPP_BAR_KEY = 'ashryInappBarClosed';
  function inappBarCheck() {
      const who = installTarget();
      if (!who || who.browser !== 'inapp') return;
      try { if (sessionStorage.getItem(INAPP_BAR_KEY)) return; } catch (e) {}
      const el = document.getElementById('inapp-bar');
      if (el) el.classList.remove('hidden');
  }
  function inappBarClose() {
      try { sessionStorage.setItem(INAPP_BAR_KEY, '1'); } catch (e) {}
      const el = document.getElementById('inapp-bar');
      if (el) el.classList.add('hidden');
  }

  const INSTALL_GLYPHS = {
      share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M7 10H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>',
      add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
      more: '⋯',
      dots: '⋮',
      menu: '☰'
  };

  /** The translation keys of the steps, in order, for this phone and browser. */
  function installStepsFor(who) {
      if (!who) return ['inst_desktop_1', 'inst_desktop_2'];
      if (who.browser === 'inapp') {
          return ['inst_inapp_1', who.os === 'ios' ? 'inst_inapp_2_ios' : 'inst_inapp_2_android', 'inst_inapp_3'];
      }
      if (who.os === 'ios') {
          const first = who.browser === 'safari' ? 'inst_ios_safari_1' : who.browser === 'chrome' ? 'inst_ios_chrome_1' : 'inst_ios_other_1';
          return [first, 'inst_ios_2', 'inst_ios_3'];
      }
      if (who.browser === 'samsung') return ['inst_samsung_1', 'inst_samsung_2', 'inst_android_3'];
      if (who.browser === 'firefox') return ['inst_android_1', 'inst_firefox_2', 'inst_android_3'];
      return ['inst_android_1', 'inst_android_2', 'inst_android_3'];
  }

  function paintInstallSheet() {
      const t = TRANSLATIONS[appState.lang] || {};
      const who = installTarget();
      const canPrompt = !!installPromptEvent;
      const glyph = (m, name) => (INSTALL_GLYPHS[name]
          ? '<span class="install-key" aria-hidden="true">' + INSTALL_GLYPHS[name] + '</span>'
          : m);
      const list = document.getElementById('install-steps');
      if (list) list.innerHTML = installStepsFor(who).map(k => '<li><span>' + String(t[k] || '').replace(/\{(\w+)\}/g, glyph) + '</span></li>').join('');
      const show = (id, on) => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !on); };
      show('install-how', !canPrompt);
      show('install-now', canPrompt);
      show('install-ok', !canPrompt);
      show('install-later', canPrompt);
      show('install-have', !!who && !canPrompt);   // Chrome only offers its prompt when it isn't installed
      // An iPhone (any browser there is Safari underneath): a site's data is cleared after
      // 7 days without a visit, the home-screen copy's never (the owner's pick 1260).
      show('install-perk-keep', !!who && who.os === 'ios');
  }

  function showInstallHelp() {
      const t = TRANSLATIONS[appState.lang] || {};
      if (inStandalone()) {
          showToast(t.inst_already || '', 'success');
          return;
      }
      paintInstallSheet();
      const el = document.getElementById('install-help-modal');
      if (el) el.classList.remove('hidden');
  }

  /** Asks, if this visit hasn't yet and everything above says it may. */
  function maybeAskInstall() {
      if (!installAskPending) return;
      let have = false;
      let last = 0;
      let played = true;
      try {
          have = localStorage.getItem(INSTALL_HAVE_KEY) === '1';
          last = Number(localStorage.getItem(INSTALL_ASKED_KEY) || 0);
          played = localStorage.getItem(INSTALL_PLAYED_KEY) === '1';
      } catch (e) { /* no storage (private browsing): ask this visit anyway */ }
      if (!installTarget() || inStandalone() || have || Date.now() - last < INSTALL_VISIT_GAP_MS) {
          installAskPending = false;
          return;
      }
      // Not yet: nothing played yet, somewhere else (a game, a room link), the
      // intro still up, or another popup open. The next arrival on the home tries again.
      if (!played) return;
      if (INSTALL_ROOT_VIEWS.indexOf(appState.currentView) === -1) return;
      const loader = document.getElementById('app-loader');
      if (loader && loader.style.display !== 'none' && !loader.classList.contains('hidden')) return;
      if (document.querySelector('.modal-overlay:not(.hidden)')) return;
      installAskPending = false;
      try { localStorage.setItem(INSTALL_ASKED_KEY, String(Date.now())); } catch (e) {}
      showInstallHelp();
  }

  /** From setView (the home, مع بعض, الأدوات) and from the end of the intro. */
  function installAskSoon() {
      if (installAskPending) setTimeout(maybeAskInstall, 900);
  }

  function installHaveIt() {
      const t = TRANSLATIONS[appState.lang] || {};
      try { localStorage.setItem(INSTALL_HAVE_KEY, '1'); } catch (e) {}
      closeModal('install-help-modal');
      showToast(t.inst_have_it_done || '', 'success');
  }

  /** Chrome's own install dialog, from our button. An event can prompt once. */
  async function installNow() {
      const ev = installPromptEvent;
      if (!ev) { paintInstallSheet(); return; }
      installPromptEvent = null;
      try {
          ev.prompt();
          const choice = await ev.userChoice;
          if (choice && choice.outcome === 'accepted') closeModal('install-help-modal');
          else paintInstallSheet();
      } catch (e) {
          paintInstallSheet();
      }
  }

  window.addEventListener('beforeinstallprompt', (e) => {
      // On a phone our sheet replaces Chrome's small bar; elsewhere Chrome keeps its own.
      if (installTarget()) e.preventDefault();
      installPromptEvent = e;
      const el = document.getElementById('install-help-modal');
      if (el && !el.classList.contains('hidden')) paintInstallSheet();
  });
  window.addEventListener('appinstalled', () => {
      const t = TRANSLATIONS[appState.lang] || {};
      installPromptEvent = null;
      closeModal('install-help-modal');
      showToast(t.inst_done || '', 'success');
  });

  /* --- The icon on an iPhone home screen ----------------------------------
     iOS fetches the apple-touch-icon once, when the app is added, and no
     page can add itself again. So when the icon changes, a copy on the home
     screen keeps the old one until it is removed and re-added. This notices
     such a copy - an iPhone, running standalone, whose marker is older than
     the icon this build ships (window.ICON_VERSION, from
     tools/site.config.json) - and shows one banner with the steps. Android
     needs none of this: the versioned icon addresses refresh it by themselves.
     ------------------------------------------------------------------------ */
  const ICON_INSTALLED_KEY = 'ashryInstalledIcon';
  const ICON_SNOOZE_KEY = 'ashryIconSnooze';
  const isIOSDevice = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandaloneApp = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  /** Shows the banner when the installed copy is older than the icon. `force` is for looking at it. */
  function checkIconBanner(force) {
      const current = Number(window.ICON_VERSION || 0);
      if (!force && (!current || !isIOSDevice() || !isStandaloneApp())) return;
      // Runs while the app starts: storage that is blocked must not stop it.
      const read = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
      let installed = Number(read(ICON_INSTALLED_KEY) || 0);
      if (!installed) {
          // No marker yet. A copy that already holds names or a saved game was
          // added before the marker existed, so with the old icon; a fresh
          // install carries the current one.
          const usedBefore = !!(read('gameTrackerState_v1') || read(PLAYER_LIBRARY_KEY));
          installed = usedBefore ? 1 : current;
          try { localStorage.setItem(ICON_INSTALLED_KEY, String(installed)); } catch (e) {}
      }
      if (!force && installed >= current) return;
      if (!force && Number(read(ICON_SNOOZE_KEY) || 0) > Date.now()) return;
      const el = document.getElementById('icon-banner');
      if (el) el.classList.remove('hidden');
  }
  function hideIconBanner() {
      const el = document.getElementById('icon-banner');
      if (el) el.classList.add('hidden');
  }
  /** "Later": a week of quiet. */
  function snoozeIconBanner() {
      try { localStorage.setItem(ICON_SNOOZE_KEY, String(Date.now() + 7 * 24 * 3600 * 1000)); } catch (e) {}
      hideIconBanner();
  }
  /** "Done", or "leave it": either way this copy is not asked again for this icon. */
  function iconBannerDone() {
      try { localStorage.setItem(ICON_INSTALLED_KEY, String(window.ICON_VERSION || 0)); } catch (e) {}
      closeModal('icon-steps-modal');
      hideIconBanner();
  }
  function openIconSteps() {
      const el = document.getElementById('icon-steps-modal');
      if (el) el.classList.remove('hidden');
  }
  const appLink = () => (window.SERVER_DATA && window.SERVER_DATA.webAppUrl) || (location.origin + location.pathname);
  /** From a home-screen copy a _blank link opens in Safari; ?install=1 opens the steps there. */
  function openInSafari() {
      window.open(appLink() + '?install=1', '_blank');
  }
  async function copyAppLink() {
      const t = TRANSLATIONS[appState.lang];
      try {
          await navigator.clipboard.writeText(appLink());
          showToast(t.icon_link_copied || '', 'success');
      } catch (e) {
          showToast(appLink());
      }
  }

  // Auto-hide install button if already standalone
  function checkInstallButton() {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const btn = document.getElementById('install-btn-menu');
      if (btn && isStandalone) {
          btn.style.display = 'none';
      }
  }

  window.addEventListener('load', checkInstallButton);
