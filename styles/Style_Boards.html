  font-weight: var(--fw-bold);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  transition: opacity var(--dur-2) var(--ease-out);
}
.bs-label.is-off, .bs-view.is-flat .bs-label, .bs-view.is-loading .bs-label { opacity: 0; }

/* See the other sea for a moment: a small glass pill in the corner. */
.bs-peek {
  position: absolute;
  top: var(--sp-2);
  inset-inline-end: var(--sp-2);
  z-index: 3;
  min-height: 2.5rem;
  padding: 0 var(--sp-3);
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: var(--r-full);
  background: rgba(8, 24, 40, 0.55);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  color: #fff;
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  cursor: pointer;
}
.bs-peek:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* The result of a shot, big over the sea for a moment. */
.bs-toast {
  position: absolute;
  inset-inline: var(--sp-3);
  top: 42%;
  z-index: 4;
  pointer-events: none;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 7vmin, 2.6rem);
  font-weight: var(--fw-black);
  color: #fff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), 0 4px 18px rgba(0, 0, 0, 0.45);
  opacity: 0;
  transform: translateY(0.5rem) scale(0.9);
  transition: opacity 220ms var(--ease-out), transform 320ms var(--ease-spring);
}
.bs-toast.is-on { opacity: 1; transform: none; }
.bs-toast.is-hit { color: #ffd2a8; }
.bs-toast.is-sunk { color: #ffb4a0; }
.bs-toast.is-miss { color: #e3f4ff; }
.bs-toast.is-note { font-family: inherit; font-size: var(--fs-body); font-weight: var(--fw-bold); top: auto; bottom: var(--sp-3); }
.bs-toast.is-note span, .bs-toast.is-note { text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }

/* While three.js arrives: the sea's own gradient with a slow shimmer. */
.bs-loading { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity var(--dur-3) var(--ease-out); }
.bs-view.is-loading .bs-loading { opacity: 1; }
.bs-loading span {
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.22) 50%, transparent 70%);
  background-size: 250% 100%;
  animation: bsShimmer 1.6s linear infinite;
}
@keyframes bsShimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* --- The flat sea: where WebGL can't draw, and the small map beside the big one --- */
.bs-flat { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: var(--sp-4); padding: var(--sp-3); }
.bs-flat .bs-fsea { height: 100%; max-width: 100%; }
.bs-flat.is-both .bs-fsea { height: auto; width: calc(50% - var(--sp-2)); }
/* The corner pill sits over the letters of a flat board: the board steps down under it. */
.bs-view.is-flat:has(.bs-peek:not([hidden])) .bs-flat { padding-top: 3.25rem; }
.bs-fsea {
  display: grid;
  grid-template-columns: 1.25rem minmax(0, 1fr);
  grid-template-rows: 1.25rem minmax(0, 1fr);
  aspect-ratio: 1;
  color: #fff;
  font-weight: var(--fw-bold);
}
.bs-fsea__cols, .bs-fsea__rows { display: grid; font-size: var(--fs-xs); text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.bs-fsea__cols { grid-area: 1 / 2; grid-template-columns: repeat(10, minmax(0, 1fr)); align-items: end; }
.bs-fsea__rows { grid-area: 2 / 1; grid-template-rows: repeat(10, minmax(0, 1fr)); align-items: center; }
.bs-fsea__field {
  grid-area: 2 / 2;
  position: relative;
  display: grid;
  grid-template: repeat(10, minmax(0, 1fr)) / repeat(10, minmax(0, 1fr));
  aspect-ratio: 1;
  border: 2px solid var(--bs-c, #3b82f6);
  border-radius: var(--r-sm);
  overflow: hidden;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.22) 0 1px, transparent 1px 10%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.22) 0 1px, transparent 1px 10%),
    linear-gradient(160deg, #2c7fb8, #135a8a 60%, #0d4a73);
}
.bs-fc { position: relative; }
.bs-fc.is-clear { background: rgba(4, 22, 40, 0.3); }
.bs-fc.is-clear::after { content: ''; position: absolute; inset: 44%; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
.bs-fc.is-miss::after { content: ''; position: absolute; inset: 26%; border-radius: 50%; border: 2px solid #fff; }
.bs-fc.is-hit::after, .bs-fc.is-sunk::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffd27a, #ff6a2b 55%, #c2261a); box-shadow: 0 0 8px 2px rgba(255, 110, 40, 0.7); z-index: 2; }
.bs-fc.is-sunk { background: rgba(140, 25, 20, 0.45); }
.bs-fc.is-sunk::after { background: #3a1410; box-shadow: none; inset: 34%; }
.bs-fc.is-aim { box-shadow: inset 0 0 0 3px #ffe27a; background: rgba(255, 226, 122, 0.25); z-index: 3; }
.bs-fc.is-new::after { animation: bsPop 480ms var(--ease-spring) both; }
@keyframes bsPop { 0% { transform: scale(0.2); opacity: 0; } 60% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); } }
.bs-fship {
  position: absolute;
  z-index: 1;
  left: calc(var(--x) * 10%);
  top: calc(var(--y) * 10%);
  width: calc(var(--len) * 10%);
  height: 10%;
  pointer-events: none;
}
.bs-fship.is-v { width: 10%; height: calc(var(--len) * 10%); }
.bs-fship::before {
  content: '';
  position: absolute;
  inset: 16% 3%;
  border-radius: 999px 40% 40% 999px;
  background: linear-gradient(180deg, #c7d0da, #7d8a98 55%, #5d6875);
  box-shadow: inset 0 0 0 2px var(--bs-c, #3b82f6), 0 2px 4px rgba(0, 0, 0, 0.35);
}
.bs-fship.is-v::before { inset: 3% 16%; border-radius: 999px 999px 40% 40%; background: linear-gradient(90deg, #c7d0da, #7d8a98 55%, #5d6875); }
.bs-fship.is-sunk::before { background: linear-gradient(180deg, #5b3a33, #2e1c18); box-shadow: inset 0 0 0 2px #ff8a6a; }
.bs-fship.is-ghost::before { background: transparent; box-shadow: none; border: 2px dashed #34d399; }
.bs-fship.is-ghost.is-bad::before { border-color: #ef4444; }
.bs-fsea--mini { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); width: min(100%, 9.5rem); }
.bs-fsea--mini .bs-fsea__field { grid-area: 1 / 1; border-width: 1.5px; border-radius: var(--r-xs); }
.bs-fsea--mini .bs-fc.is-miss::after { border-width: 1px; }
.bs-fsea--mini .bs-fc.is-hit::after { box-shadow: none; }

.bs-mini { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.bs-mini__label { font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--text-3); }
.bs-fleets { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-solid); }
.bs-fleet { display: flex; flex-direction: column; align-items: stretch; gap: 0.2rem; min-width: 0; }
.bs-fleet__who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-sm); font-weight: var(--fw-semi); color: var(--text-2); }
.bs-fleet__ships { display: flex; flex-wrap: wrap; gap: 0.3rem; direction: ltr; }
.bs-fleet__ship { display: inline-flex; gap: 1px; }
.bs-fleet__ship i { display: block; width: 0.55rem; height: 0.55rem; border-radius: 2px; background: var(--bs-c, #3b82f6); }
.bs-fleet__ship.is-sunk i { background: var(--danger, #d64545); opacity: 0.35; }
.bs-mark {
  display: inline-grid;
  place-items: center;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 50%;
  background: var(--bs-c);
  color: #fff;
  font-size: 0.95rem;
  line-height: 1;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
}
.bs-bar { display: flex; flex-direction: column; gap: var(--sp-2); }
.bs-bar:empty { display: none; }
.bs-bar__say { margin: 0; text-align: center; font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--text-2); }
.bs-bar .btn-row { display: flex; gap: var(--sp-2); }
.bs-bar .btn-row > .btn { flex: 1; }
.bs-bar .bs-fire { font-family: var(--font-display); }
.bs-tally { margin: 0; text-align: center; font-size: var(--fs-sm); color: var(--text-2); }

/* «الرادار» (2 Oct 2026): an area swept on a flat sea (its count where this screen may know it),
   the area aimed at, and the sweep - a beam turning over it (transform and opacity only). */
.bs-fradar {
  position: absolute;
  z-index: 3;
  left: calc(var(--x) * 10%);
  top: calc(var(--y) * 10%);
  width: 30%;
  height: 30%;
  display: grid;
  place-items: center;
  border: 2px dashed #6ee7b7;
  border-radius: var(--r-xs);
  background: rgba(52, 211, 153, 0.12);
  pointer-events: none;
}
.bs-fradar b {
  display: grid;
  place-items: center;
  width: 42%;
  aspect-ratio: 1;
  border: 2px solid #6ee7b7;
  border-radius: 50%;
  background: rgba(4, 47, 36, 0.86);
  color: #ecfdf5;
  font-size: clamp(0.75rem, 3.6vmin, 1.4rem);
  font-weight: var(--fw-black);
  line-height: 1;
}
.bs-fradar.is-aim { border-style: solid; border-width: 3px; background: rgba(52, 211, 153, 0.22); animation: bsRadarAim 1.2s ease-in-out infinite; }
.bs-fradar.is-sweep { overflow: hidden; border-style: solid; animation: bsRadarFrame 1.5s ease-out both; }
.bs-fradar.is-sweep i {
  position: absolute;
  inset: -25%;
  border-radius: 50%;
  background: conic-gradient(from 90deg, rgba(209, 250, 229, 0.95) 0deg, rgba(52, 211, 153, 0.55) 6deg, rgba(52, 211, 153, 0) 110deg, transparent 360deg);
  animation: bsRadarTurn 0.75s linear 2 both;
}
@keyframes bsRadarTurn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes bsRadarFrame { 0% { opacity: 0; transform: scale(0.9); } 15% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0.4; } }
@keyframes bsRadarAim { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.bs-fsea--mini .bs-fradar { border-width: 1px; }
.bs-fsea--mini .bs-fradar b { width: 60%; border-width: 1px; font-size: 0.625rem; }
.bs-toast.is-radar { top: auto; bottom: 8%; color: #a7f3d0; }
.bs-bar .bs-radar-btn, .bs-bar > .btn--ghost { align-self: center; }
.bs-radar-log { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-solid); }
.bs-radar-log__title { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-2); }
.bs-radar-log ul { display: flex; flex-direction: column; gap: 0.15rem; margin: 0; padding: 0; list-style: none; }
.bs-radar-log__row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); min-width: 0; font-size: var(--fs-sm); }
.bs-radar-log__who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.bs-radar-log__who::before { content: ''; display: inline-block; width: 0.55rem; height: 0.55rem; margin-inline-end: 0.35rem; border-radius: 50%; background: var(--bs-c); }
.bs-radar-log__what { flex: none; font-weight: var(--fw-semi); color: var(--text); }
.bs-radar-log__row.is-unused .bs-radar-log__what { font-weight: var(--fw-med); color: var(--text-3); }

/* --- A phone on its side, and every wide screen: the sea takes the height, the rest a column beside it --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .bs-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12.5rem, 19rem); gap: var(--sp-4); align-items: start; }
  .bs-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  .bs-layout__stage { position: sticky; top: 0; }
  .bs-stage { aspect-ratio: auto; height: calc(var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem); max-height: none; min-height: 0; }
  .bs-fleets { padding: var(--sp-2); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .bs-layout { grid-template-columns: minmax(0, 1fr) minmax(11rem, 13rem); gap: var(--sp-3); }
  .bs-head .duel-status { margin-top: var(--sp-1); font-size: var(--fs-sm); }
  .bs-bar__say { font-size: var(--fs-xs); }
  .bs-fsea--mini { width: min(100%, 7rem); }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-battleship, .shell__main > #view-room-battleship { max-width: 84rem; }
  .bs-layout { gap: var(--sp-5, 1.25rem); grid-template-columns: minmax(0, 1fr) minmax(15rem, 21rem); }
  .bs-label { font-size: var(--fs-sm); }
}

/* --- The TV: both seas side by side across the stage, the players and the line beside them --- */
.bs-tv { --duel-c1: #3b82f6; --duel-c2: #f97316; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 26rem); gap: calc(var(--tv-gap) * 2); align-items: center; }
.bs-tv__stage { min-width: 0; }
.bs-stage--tv { aspect-ratio: auto; height: calc(var(--app-h, 100vh) - 17vmin); max-height: none; min-height: 0; border-radius: var(--tv-r); }
.bs-tv__side { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--tv-gap); }
.bs-tv__side > .tv-scale { width: 100%; }
.bs-tv .bs-label { font-size: clamp(0.8rem, 2vmin, 1.6rem); padding: 0.2em 0.8em; }
.bs-tv .bs-toast { font-size: clamp(2rem, 7vmin, 5rem); }
@media (orientation: portrait) {
  .bs-tv { grid-template-columns: minmax(0, 1fr); }
  .bs-stage--tv { height: 60vh; }
}

@media (prefers-reduced-motion: reduce) {
  .bs-toast, .bs-label { transition: none; }
  .bs-fc.is-new::after, .bs-loading span { animation: none; }
  .bs-fradar.is-aim, .bs-fradar.is-sweep, .bs-fradar.is-sweep i { animation: none; }
}

/* ==========================================================================
   28. بولينج
   JS_Bowling.html. The lane is a WebGL canvas (three.js) and gets the screen
   at every size; over it, the score sheet of whoever is bowling (a compact
   strip across the top), the word after a ball, and the hint. The sheet over
   the lane is always light-on-dark: it sits on the hall, not on the page.
   Below the lane (a phone upright) or beside it (a phone on its side, a
   laptop, the TV) everyone's sheet, in the page's own colours.
   ========================================================================== */
.bowl-solo { display: flex; flex-direction: column; min-height: 0; }
#view-play-bowling > #bowling-stage { display: flex; flex-direction: column; }
.bowl-stage {
  --bowl-ink: #fff8ee;
  position: relative;
  flex: 1 1 auto;
  min-height: 18rem;
  border-radius: var(--r-2xl);
  overflow: hidden;
  background: radial-gradient(120% 80% at 50% 30%, #2a1a12 0%, #120c09 60%, #0b0706 100%);
  isolation: isolate;
  box-shadow: 0 10px 30px rgba(20, 12, 6, 0.28);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.bowl-canvas-box { position: absolute; inset: 0; }
.bowl-canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
/* Only the lane you are about to throw on takes the finger; otherwise the page scrolls as usual. */
.bowl-canvas.is-live { touch-action: none; cursor: grab; }
.bowl-canvas.is-live:active { cursor: grabbing; }

.bowl-hud {
  position: absolute;
  inset-inline: 0;
  top: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  padding: 0.5rem 0.5rem 0;
  pointer-events: none;
  color: var(--bowl-ink);
}
.bowl-hud__row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding-inline: 0.125rem; }
.bowl-hud__who {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
  font-size: 0.8125rem;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
}
.bowl-hud__clock { flex: 0 0 auto; }
.bowl-hud__clock[hidden] { display: none; }
.bowl-stage .bowl-fr__sum { color: var(--bowl-ink); }

/* The sheet: a box a frame, the balls on top, the running total under them. Left to right in every
   language, like the card on a real lane. */
.bowl-sheet {
  display: grid;
  grid-template-columns: repeat(var(--bowl-n, 5), minmax(0, 1fr)) minmax(2.5rem, 1.25fr);
  gap: 3px;
}
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr--last { grid-column: span 1; }
.bowl-fr {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  border-radius: 8px;
  background: rgba(14, 9, 7, 0.93);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--bowl-ink);
  overflow: hidden;
}
.bowl-fr.is-cur { border-color: #ffcf8a; box-shadow: inset 0 0 0 1px #ffcf8a; }
.bowl-fr__n { font-size: 0.6875rem; line-height: 1; padding-top: 2px; text-align: center; opacity: 0.7; font-weight: 700; } /* 11px, was 9px (the UI pass of 4 Oct 2026) */
.bowl-fr__balls { display: flex; justify-content: center; gap: 1px; min-height: 1rem; padding-inline: 1px; }
.bowl-fr__ball {
  flex: 1 1 0;
  min-width: 0;
  max-width: 1.1rem;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.75rem;
  line-height: 1.25;
}
.bowl-fr__ball.is-x { color: #ffcf8a; }
.bowl-fr__ball.is-sp { color: #c4b5fd; }
.bowl-fr__sum { text-align: center; font-weight: 800; font-size: 0.875rem; line-height: 1.25; min-height: 1.15rem; padding-bottom: 1px; }
.bowl-fr--tot { justify-content: center; }
.bowl-fr__sum--tot { font-family: var(--font-display); font-size: 1.125rem; }
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr__ball { font-size: 0.625rem; }
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr__sum { font-size: 0.6875rem; }
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr__n { display: none; }

/* The word after a ball: سترايك in gold with the pins flying out, سبير in the violet, a count plain. */
.bowl-banner {
  position: absolute;
  inset-inline: 0;
  top: 36%;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  text-align: center;
  pointer-events: none;
  color: #fff;
  opacity: 0;
  transform: scale(0.6);
}
.bowl-banner.is-on { animation: bowlBanner 1500ms var(--ease-spring) both; }
.bowl-banner.is-strike.is-on { animation-duration: 2100ms; }
.bowl-banner__main {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.6rem, 13vmin, 5.5rem);
  line-height: 1;
  text-shadow: 0 4px 22px rgba(0, 0, 0, 0.6);
}
.bowl-banner.is-strike .bowl-banner__main {
  background: linear-gradient(180deg, #fff5d6 0%, #ffcf6a 55%, #f59e0b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255, 170, 60, 0.55));
}
.bowl-banner.is-spare .bowl-banner__main { color: #ddd6fe; text-shadow: 0 0 24px rgba(167, 139, 250, 0.8), 0 4px 18px rgba(0, 0, 0, 0.6); }
.bowl-banner.is-miss .bowl-banner__main { font-size: clamp(2rem, 9vmin, 4rem); color: #e7dccd; }
.bowl-banner__sub { font-weight: 700; font-size: 0.9375rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); color: #f3e8d6; }
.bowl-banner__pins { position: relative; width: 0; height: 0; }
.bowl-banner__pins i {
  position: absolute;
  inset-inline-start: 0;
  top: -3rem;
  width: 0.7rem;
  height: 1.8rem;
  border-radius: 45% 45% 40% 40% / 30% 30% 60% 60%;
  background: linear-gradient(180deg, #fff 0 38%, #d7261e 38% 44%, #fff 44% 50%, #d7261e 50% 55%, #fff 55%);
  opacity: 0;
}
.bowl-banner.is-strike.is-on .bowl-banner__pins i { animation: bowlPinFly 1300ms var(--ease-out) both; }
.bowl-banner__pins i:nth-child(1)  { --dx: -9rem;  --dy: -5rem; --r: -220deg; animation-delay: 60ms; }
.bowl-banner__pins i:nth-child(2)  { --dx: 8rem;   --dy: -6rem; --r: 260deg;  animation-delay: 90ms; }
.bowl-banner__pins i:nth-child(3)  { --dx: -5rem;  --dy: -8rem; --r: -160deg; animation-delay: 30ms; }
.bowl-banner__pins i:nth-child(4)  { --dx: 5rem;   --dy: -8.5rem; --r: 200deg; animation-delay: 110ms; }
.bowl-banner__pins i:nth-child(5)  { --dx: -11rem; --dy: -1rem; --r: -300deg; animation-delay: 140ms; }
.bowl-banner__pins i:nth-child(6)  { --dx: 11rem;  --dy: -2rem; --r: 320deg;  animation-delay: 70ms; }
.bowl-banner__pins i:nth-child(7)  { --dx: -2rem;  --dy: -10rem; --r: 120deg; animation-delay: 20ms; }
.bowl-banner__pins i:nth-child(8)  { --dx: 2.5rem; --dy: -9.5rem; --r: -140deg; animation-delay: 130ms; }
.bowl-banner__pins i:nth-child(9)  { --dx: -7rem;  --dy: 3rem; --r: -250deg;  animation-delay: 170ms; }
.bowl-banner__pins i:nth-child(10) { --dx: 7rem;   --dy: 2.5rem; --r: 240deg; animation-delay: 150ms; }
@keyframes bowlBanner {
  0% { opacity: 0; transform: scale(0.55); }
  16% { opacity: 1; transform: scale(1.08); }
  26% { transform: scale(1); }
  82% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.96) translateY(-0.5rem); }
}
@keyframes bowlPinFly {
  0% { opacity: 0; transform: translate(0, 0) rotate(0); }
  12% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
}

.bowl-hint {
  position: absolute;
  inset-inline: 0;
  bottom: 0.875rem;
  z-index: 2;
  display: flex;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 240ms var(--ease-out);
}
.bowl-hint.is-on { opacity: 1; }
.bowl-hint::before { content: none; }
.bowl-hint {
  font-weight: 800;
  font-size: 0.9375rem;
  color: #fff;
  text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
}
.bowl-hint.is-on { animation: bowlHint 1800ms ease-in-out infinite; }
@keyframes bowlHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* The first throw's demo hand (7 Oct 2026, bowlDemoShow): at the ball, pulling back and swinging
   forward in a loop, with one line, until the first touch. It never takes a touch itself. */
.bowl-demo {
  position: absolute;
  inset-inline: 0;
  bottom: 0.75rem;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  pointer-events: none;
}
.bowl-demo[hidden] { display: none; }
.bowl-demo__track { position: relative; width: 3rem; height: 9rem; }
.bowl-demo__hand { position: absolute; left: 0.35rem; top: 2.9rem; width: 2.6rem; height: auto; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); }
.bowl-demo__ball { position: absolute; left: 0.85rem; top: 2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6ea8ff, #1e4fb0 70%); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
.bowl-demo__line { padding: var(--sp-1) var(--sp-3); border-radius: var(--r-full); background: rgba(14, 9, 7, 0.78); color: #fff; font-weight: 800; font-size: 0.9375rem; white-space: nowrap; }

/* «دورك يا منى! 🎳» (7 Oct 2026, bowlCallUp): slides in over the lane on the thrower's phone, and away. */
.bowl-callup {
  position: absolute;
  inset-inline: 0;
  top: 22%;
  z-index: 3;
  display: flex;
  justify-content: center;
  padding-inline: var(--sp-4);
  pointer-events: none;
}
.bowl-callup:empty { display: none; }
.bowl-callup__card {
  max-width: 100%;
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r-xl);
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: var(--sh-3);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-h2);
  line-height: 1.3;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bowl-msg {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  padding: var(--sp-6);
  text-align: center;
  color: var(--bowl-ink);
  font-weight: 700;
}
.bowl-msg[hidden] { display: none; }
.bowl-msg p { margin: 0; max-width: 20rem; line-height: 1.6; }
.bowl-msg__icon, .bowl-msg__spin { font-size: 3rem; }
.bowl-msg__spin { animation: bowlSpin 1.4s linear infinite; }
@keyframes bowlSpin { to { transform: rotate(360deg); } }

.bowl-over-slot { position: absolute; inset-inline: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: var(--sp-3); pointer-events: none; }
.bowl-over-slot:empty { display: none; }
.bowl-over { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--sp-4); width: min(100%, 22rem); text-align: center; }
.bowl-over__score { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--accent-ink); }
.bowl-over .btn-row { width: 100%; }

/* A room on a phone: the lane first, everyone's sheet under it. */
.bowl-room { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 0; }
.bowl-room > .bowl-stage {
  flex: 0 0 auto;
  height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--nav-h) - var(--safe-top) - var(--safe-bottom) - 3.5rem);
  min-height: 18rem;
}
.bowl-room__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.bowl-room--over { gap: var(--sp-4); }
.bowl-watching { text-align: center; margin: 0; }
.bowl-list { min-width: 0; }
.bowl-rows { display: flex; flex-direction: column; gap: var(--sp-2); }
.bowl-row {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.bowl-row.is-up { border-color: var(--accent-border); box-shadow: 0 0 0 2px var(--accent-soft); }
.bowl-row.is-away { opacity: 0.6; }
.bowl-row__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
.bowl-row__name { font-weight: 800; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bowl-row.is-me .bowl-row__name { color: var(--accent-ink); }
.bowl-row__tot { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--text-strong); }
.bowl-sheet--compact .bowl-fr { background: var(--surface-2); border-color: var(--border); color: var(--text-strong); border-radius: 6px; }
.bowl-sheet--compact .bowl-fr.is-cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.bowl-sheet--compact .bowl-fr__ball.is-x { color: var(--warning-ink, #b45309); }
.bowl-sheet--compact .bowl-fr__ball.is-sp { color: var(--accent-ink); }
.bowl-sheet--compact .bowl-fr--tot { display: none; }
.bowl-sheet--compact { grid-template-columns: repeat(var(--bowl-n, 5), minmax(0, 1fr)); }

/* A phone on its side, and every wide screen: the lane takes the height, the sheets beside it. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .bowl-room:not(.bowl-room--over) {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(13rem, 19rem);
    align-items: start;
    gap: var(--sp-3);
  }
  .bowl-room:not(.bowl-room--over) > .bowl-stage {
    position: sticky;
    top: 0;
    height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem);
    min-height: 16rem;
  }
}
@media (orientation: landscape) and (max-height: 500px) {
  .bowl-stage { min-height: 15rem; border-radius: var(--r-xl); }
  #view-play-bowling .bowl-stage { height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 1.75rem); flex: 0 0 auto; }
  .bowl-room:not(.bowl-room--over) { grid-template-columns: minmax(0, 1fr) minmax(8.5rem, 10.5rem); gap: var(--sp-2); }
  .bowl-room:not(.bowl-room--over) > .bowl-stage { height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 1.75rem); min-height: 14rem; }
  /* Beside a lane on a phone's side there is room for names and totals; the sheet itself is over the lane. */
  .bowl-room__side .bowl-sheet--compact { display: none; }
  .bowl-room__side .bowl-row { padding: 0.375rem 0.625rem; }
  .bowl-room__side .bowl-row__tot { font-size: 1.0625rem; }
  .bowl-room__side .chip-set { margin-top: var(--sp-1) !important; }
  .bowl-banner { top: 30%; }
  .bowl-hud__sheet { max-width: 34rem; margin-inline: auto; width: 100%; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-bowling, .shell__main > #view-room-bowling { max-width: 76rem; }
  .bowl-room:not(.bowl-room--over) { grid-template-columns: minmax(0, 1fr) minmax(15rem, 22rem); gap: var(--sp-4); }
  .bowl-hud__sheet { width: min(100%, 38rem); margin-inline: auto; }
  .bowl-fr__ball { font-size: 0.875rem; }
  .bowl-fr__sum { font-size: 1rem; }
  .bowl-hud__who { font-size: 0.9375rem; }
  .bowl-room--over { max-width: 44rem; margin-inline: auto; width: 100%; }
}

/* The TV: the lane big, everyone's sheet beside it, readable from the sofa. */
.bowl-tv {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 31%);
  gap: var(--tv-gap);
}
.bowl-tv > .bowl-stage { min-height: 0; height: 100%; border-radius: var(--tv-r); }
.bowl-tv__side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--tv-gap); }
.bowl-stage--tv .bowl-hud { padding: 1.2vmin 1.2vmin 0; gap: 0.8vmin; }
.bowl-stage--tv .bowl-hud__sheet { width: min(100%, 110vmin); margin-inline: auto; }
.bowl-stage--tv .bowl-sheet { gap: 0.5vmin; grid-template-columns: repeat(var(--bowl-n, 5), minmax(0, 1fr)) minmax(8vmin, 1.25fr); }
.bowl-stage--tv .bowl-fr { border-radius: 1vmin; }
.bowl-stage--tv .bowl-fr__n { font-size: 1.5vmin; display: block; }
.bowl-stage--tv .bowl-fr__balls { min-height: 3.2vmin; }
.bowl-stage--tv .bowl-fr__ball { font-size: 2.6vmin; max-width: 3.6vmin; }
.bowl-stage--tv .bowl-fr__sum { font-size: 2.9vmin; min-height: 3.6vmin; }
.bowl-stage--tv .bowl-fr__sum--tot { font-size: 3.6vmin; }
.bowl-stage--tv .bowl-hud__who { font-size: var(--tv-sm); }
.bowl-stage--tv .bowl-hint { font-size: var(--tv-md); bottom: 2.4vmin; }
.bowl-stage--tv .bowl-banner__main { font-size: 15vmin; }
.bowl-stage--tv .bowl-banner__sub { font-size: var(--tv-md); }
.bowl-list--tv .bowl-rows { gap: calc(var(--tv-gap) * 0.7); }
.bowl-list--tv .bowl-row { padding: 1.1vmin 1.4vmin; border-radius: var(--tv-r); gap: 0.8vmin; }
.bowl-list--tv .bowl-row__name { font-size: var(--tv-sm); }
.bowl-list--tv .bowl-row__tot { font-size: var(--tv-md); }
.bowl-list--tv .bowl-sheet { gap: 0.4vmin; }
.bowl-list--tv .bowl-fr__balls { min-height: 2.4vmin; }
.bowl-list--tv .bowl-fr__ball { font-size: 1.9vmin; max-width: 2.6vmin; }
.bowl-list--tv .bowl-fr__sum { font-size: 1.9vmin; min-height: 2.5vmin; }
.bowl-list--tv .bowl-fr__n { display: none; }
.bowl-tv-over { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); min-height: 0; overflow-y: auto; }
.bowl-tv-over .bowl-list--tv { width: min(100%, 110vmin); }
.bowl-tv-over .podium { zoom: 1.35; }

@media (prefers-reduced-motion: reduce) {
  .bowl-banner.is-on { animation: none; opacity: 1; transform: none; }
  .bowl-banner__pins { display: none; }
  .bowl-hint.is-on { animation: none; }
  .bowl-msg__spin { animation: none; }
}

/* ==========================================================================
   26. كدّاب · الشايب: THE PLAYING CARDS
   JS_Cards.html (the card, the back, الشايب, a hand's row, the flights),
   JS_RoomDoubt.html and JS_RoomOldMaid.html. The owner's option ب "بلوكات"
   for both (23 Sep 2026), the family of أونو's and سكرو's cards: a card is a
   colour block (--pc-red for hearts and diamonds, --pc-ink for spades and
   clubs, the same in both themes), a big Baloo numeral, its index top left
   and the suit bottom right, a soft shine; the back the violet dotted one
   with "A."; الشايب deep violet in a gold frame. A card is a physical thing,
   laid out left to right in every language. Sized by --pc-w (the height is
   1.42 times it); the default is on :where(.pc-card), so any context that
   sizes a card wins.
   ========================================================================== */
:root {
  --pc-red: #e5383b;
  --pc-ink: #23213a;
  --pc-om-1: #5b21b6;
  --pc-om-2: #2e1065;
  --pc-gold: #fbbf24;
  --pc-back-1: #7c3aed;
  --pc-back-2: #4c1d95;
  --pc-amber: #f5c451;
  --pc-call: #c81e3a;        /* كدّاب!: a red white text reads on in both themes */
  --pc-true: #15803d;
}
:where(.pc-card) { --pc-w: 3.3rem; }
.pc-card {
  position: relative;
  flex: none;
  display: inline-block;
  width: var(--pc-w);
  height: calc(var(--pc-w) * 1.42);
  border-radius: calc(var(--pc-w) * 0.12);
  color: #fff;
  font-family: 'Baloo Bhaijaan 2', 'Cairo', var(--font);
  font-weight: 800;
  line-height: 1;
  direction: ltr;
  vertical-align: top;
  overflow: hidden;
  container-type: inline-size;
  -webkit-user-select: none;
  user-select: none;
}
.pc-card--xs { --pc-w: 1.05rem; }
.pc-card--sm { --pc-w: 2.15rem; }
.pc-card--md { --pc-w: 3.3rem; }
.pc-card--lg { --pc-w: 4.6rem; }
.pc-card--xl { --pc-w: 6.4rem; }
.pc-card--fly { --pc-w: inherit; width: 100%; height: 100%; }
.pc-red { --c: var(--pc-red); }
.pc-black { --c: var(--pc-ink); }
.pc-card--face {
  background: var(--c);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 78%, white), var(--c) 58%, color-mix(in srgb, var(--c) 82%, black));
  box-shadow: 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.22) calc(var(--pc-w) * -0.12) rgba(15, 12, 24, 0.55);
}
.pc-black.pc-card--face { background: linear-gradient(160deg, #3d3a58, var(--pc-ink) 58%, #121022); }
/* On the dark ground an ink card had no edge: a faint rim draws it. */
body.dark .pc-black.pc-card--face { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.22) calc(var(--pc-w) * -0.12) rgba(0, 0, 0, 0.7); }
.pc-card--face::after {
  content: '';
  position: absolute;
  inset-block-start: -30%;
  right: -40%;
  width: 90%;
  height: 70%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  pointer-events: none;
}
.pc-card__corner {
  position: absolute;
  z-index: 2;
  top: calc(var(--pc-w) * 0.06);
  left: calc(var(--pc-w) * 0.07);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--pc-w) * 0.015);
  font-size: calc(var(--pc-w) * 0.21);
  letter-spacing: -0.03em;
}
.pc-card__cs { display: block; width: calc(var(--pc-w) * 0.16); height: calc(var(--pc-w) * 0.16); fill: currentColor; }
.pc-card__big {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  padding-top: calc(var(--pc-w) * 0.04);
  font-size: calc(var(--pc-w) * 0.58);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
.pc-card__big--10 { font-size: calc(var(--pc-w) * 0.44); letter-spacing: -0.05em; }
.pc-card__suit {
  position: absolute;
  z-index: 1;
  right: calc(var(--pc-w) * 0.07);
  bottom: calc(var(--pc-w) * 0.07);
  width: calc(var(--pc-w) * 0.25);
  height: calc(var(--pc-w) * 0.25);
  fill: currentColor;
  opacity: 0.92;
}
/* A small card is its numeral and its suit. */
@container (max-width: 42px) {
  .pc-card__corner { display: none; }
  .pc-card__big { padding-top: 0; padding-bottom: 18%; }
  .pc-card__suit { width: 36%; height: 36%; right: 32%; bottom: 7%; }
}
/* The back: violet, dotted, "A." with its amber full stop. */
.pc-card--back {
  display: inline-grid;
  place-items: center;
  background: linear-gradient(160deg, var(--pc-back-1), var(--pc-back-2));
  box-shadow: 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.2) calc(var(--pc-w) * -0.12) rgba(46, 16, 101, 0.6);
}
.pc-card--back::before {
  content: '';
  position: absolute;
  inset: calc(var(--pc-w) * 0.06);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: calc(var(--pc-w) * 0.08);
  background-image: radial-gradient(rgba(255, 255, 255, 0.18) 1.2px, transparent 1.4px);
  background-size: 8px 8px;
  pointer-events: none;
}
.pc-card__a { position: relative; z-index: 1; color: #fff; font-size: calc(var(--pc-w) * 0.34); line-height: 1; }
.pc-card__a i { color: var(--pc-amber); font-style: normal; }
@container (max-width: 22px) {
  .pc-card__a { display: none; }
  .pc-card--back::before { inset: 2px; border-radius: 2px; }
}
/* الشايب: deep violet, a gold frame, the old man, the band. */
.pc-card--om {
  background: radial-gradient(120% 90% at 50% 30%, var(--pc-om-1), var(--pc-om-2));
  box-shadow: 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.22) calc(var(--pc-w) * -0.12) rgba(46, 16, 101, 0.7);
}
.pc-om__frame { position: absolute; inset: 4%; border: 1.5px solid var(--pc-gold); border-radius: calc(var(--pc-w) * 0.08); pointer-events: none; }
.pc-om__pic { position: absolute; inset: 9% 8% 21% 8%; display: block; }
.pc-om__art { display: block; width: 100%; height: 100%; }
.pc-om__band {
  position: absolute;
  inset: auto 4% 4% 4%;
  height: 17%;
  display: grid;
  place-items: center;
  border-top: 1px solid color-mix(in srgb, var(--pc-gold) 55%, transparent);
  color: var(--pc-gold);
  font-family: 'Cairo', var(--font);
  font-size: calc(var(--pc-w) * 0.15);
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}
@container (max-width: 42px) {
  .pc-om__band { display: none; }
  .pc-om__pic { inset: 10% 6%; }
}

/* A hand from across the table: a few backs fanned out. */
.pc-fan { position: relative; display: block; width: max(1.05rem, calc(1.05rem + (var(--of, 1) - 1) * 0.42rem)); height: calc(1.05rem * 1.42); }
.pc-fan__card { position: absolute; top: 0; left: calc(var(--k) * 0.42rem); transform: rotate(calc((var(--k) - (var(--of) - 1) / 2) * 7deg)); transform-origin: 50% 110%; }
/* A row of cards that overlaps to fit (pcFitRows). */
.pc-row { --pc-gap-natural: 4; min-width: 0; display: flex; justify-content: center; }
/* :not(:first-child) outweighs a card button's own margin: 0. */
.pc-row > :not(:first-child) { margin-left: var(--pc-gap, 0.25rem); }

/* The lobby: a fan of five cards over the options. */
.pc-lobby__cards { display: flex; justify-content: center; gap: 4px; margin: var(--sp-1) 0 var(--sp-2); }
.pc-lobby__cards .pc-card:nth-child(1) { transform: rotate(-12deg) translateY(4px); }
.pc-lobby__cards .pc-card:nth-child(2) { transform: rotate(-6deg); }
.pc-lobby__cards .pc-card:nth-child(4) { transform: rotate(6deg); }
.pc-lobby__cards .pc-card:nth-child(5) { transform: rotate(12deg) translateY(4px); }

/* --- Flights, signs, stamps --- */
.pc-ghost { position: fixed; left: 0; top: 0; z-index: var(--z-fx-ghost); pointer-events: none; transform-origin: center; will-change: transform; }
.pc-ghost__flip { position: relative; width: 100%; height: 100%; will-change: transform; }
.pc-ghost__face { position: absolute; inset: 0; }
.pc-ghost__face--b { opacity: 0; }
.pc-ghost .pc-card { box-shadow: var(--sh-3); }
.pc-hold { visibility: hidden; }
.pc-landed > .pc-card, .pc-landed.pc-card { animation: pc-land 380ms cubic-bezier(0.2, 1.4, 0.35, 1); }
@keyframes pc-land { 0% { transform: scale(0.9); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.pc-pop {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-pop);
  padding: 0.1em 0.5em;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-3);
  color: var(--text-strong);
  font-size: 1.15rem;
  font-weight: 900;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
}
.pc-pop--big { background: transparent; box-shadow: none; font-size: 2.1rem; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.pc-ring { position: fixed; z-index: var(--z-fx-ghost); border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.pc-ring--danger { border-color: var(--pc-call); border-width: 5px; }
.pc-ring--success { border-color: var(--success); border-width: 4px; }
.pc-ring--gold { border-color: var(--pc-gold); border-width: 5px; }
.pc-stamp {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-stamp);
  padding: 0.05em 0.45em 0.12em;
  border: 4px solid currentColor;
  border-radius: 0.35em;
  background: color-mix(in srgb, var(--surface-solid) 80%, transparent);
  color: var(--pc-call);
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  pointer-events: none;
}
.pc-stamp--success { color: var(--pc-true); }
body.dark .pc-stamp--success { color: #4ade80; }
body.dark .pc-stamp--danger, body.dark .pc-stamp { color: #fb7185; }
.pc-shout {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-top);
  padding: 0.12em 0.6em 0.2em;
  border-radius: var(--r-full);
  background: var(--pc-call);
  box-shadow: 0 10px 26px -8px rgba(200, 30, 58, 0.7);
  color: #fff;
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  pointer-events: none;
}
.pc-reveal { position: fixed; z-index: var(--z-fx-pop); display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.pc-reveal .pc-flip { width: var(--pc-w); height: calc(var(--pc-w) * 1.42); }
.pc-reveal .pc-card { box-shadow: var(--sh-3); }
.pc-flip { position: relative; display: inline-block; flex: none; }
.pc-flip__face { display: block; width: 100%; height: 100%; }
.pc-flip__back { position: absolute; inset: 0; }
.is-revealing .pc-flip__back { animation: pc-flip-back 420ms linear both; animation-delay: var(--at, 0ms); }
.is-revealing .pc-flip__face { animation: pc-flip-face 420ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes pc-flip-back { 0% { transform: scaleX(1); } 45% { transform: scaleX(0); } 100% { transform: scaleX(0); visibility: hidden; } }
@keyframes pc-flip-face { 0%, 45% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.pc-pop.is-tv { font-size: 4.6vmin; }
.pc-pop--big.is-tv { font-size: 8vmin; }
.pc-ring.is-tv { border-width: 0.7vmin; }
.pc-stamp.is-tv { font-size: 8vmin; border-width: 0.8vmin; }
.pc-shout.is-tv { font-size: 7vmin; }
.pc-podium { margin-bottom: var(--sp-3); }

/* --- The pieces both tables share: the head, the latest move, the seats, the bar --- */
.db-head, .om-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1); margin-bottom: var(--sp-2); }
.db-latest, .om-latest {
  margin: 0 0 var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
}
.db-latest.is-lie { background: var(--danger-soft); color: var(--danger-ink); }
.db-latest.is-true { background: var(--success-soft); color: var(--success-ink); }
.db-latest.is-new, .om-latest.is-new { animation: pc-latest-in 380ms var(--ease-out) both; }
@keyframes pc-latest-in { from { opacity: 0; transform: translateY(-0.4rem) scale(0.98); } }
.db-log, .om-log { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); padding: 0; list-style: none; }
.db-log li, .om-log li { padding: 0.35rem 0.7rem; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.db-opps, .om-opps {
  display: flex;
  gap: 6px;
  margin: 0 0 var(--sp-2);
  padding: 3px 2px 6px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.db-opps::-webkit-scrollbar, .om-opps::-webkit-scrollbar { display: none; }
.db-opps > :first-child, .om-opps > :first-child { margin-inline-start: auto; }
.db-opps > :last-child, .om-opps > :last-child { margin-inline-end: auto; }
.db-seat, .om-seat {
  position: relative;
  flex: none;
  min-width: 0;
  max-width: 11.5rem;
  min-height: 2.6rem;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px var(--sp-2) 3px 4px;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.db-avatar, .om-avatar {
  flex: none;
  width: 1.45rem;
  height: 1.45rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--pc-amber);
  color: #3b2a05;
  font-size: 0.75rem;
  font-weight: 900;
  line-height: 1;
}
.db-seat__who, .om-seat__who { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 4px; }
.db-seat__name, .om-seat__name { min-width: 0; max-width: 5rem; overflow: hidden; color: var(--text-strong); font-size: var(--fs-sm); font-weight: 800; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.db-seat__hand, .om-seat__hand { position: relative; flex: none; display: block; padding-inline-end: 0.55rem; }
.db-seat__n, .om-seat__n {
  position: absolute;
  z-index: 2;
  inset-block-end: -0.3rem;
  inset-inline-end: -0.2rem;
  min-width: 1.3rem;
  padding: 0.05rem 0.3rem;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: 0 0 0 1px var(--border), var(--sh-1);
  color: var(--text-strong);
  font-size: 0.8125rem;
  font-weight: 900;
  line-height: 1.25;
  text-align: center;
}
.db-seat.is-turn, .om-seat.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -10px var(--accent-glow); }
.db-seat.is-last { border-style: dashed; border-color: var(--pc-call); }
.om-seat.is-from { border-style: dashed; border-color: var(--accent); }
.db-seat.is-away, .om-seat.is-away { opacity: 0.6; }
.db-seat.is-out, .om-seat.is-out { background: var(--success-soft); border-color: transparent; }
.om-seat.is-loser { background: var(--warning-soft); border-color: var(--warning); }
.db-tag, .om-tag {
  flex: none;
  display: inline-block;
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 0.6875rem;
  font-weight: 900;
  line-height: 1.4;
  white-space: nowrap;
}
.db-tag--out, .om-tag--out { background: transparent; color: var(--success-ink); font-size: 0.8125rem; padding: 0; }
.db-tag--hot { background: var(--pc-call); color: #fff; }
.db-tag--play { background: var(--accent-soft); color: var(--accent-ink); }
.om-tag--turn { background: var(--accent); color: var(--accent-on); }
.om-tag--loser { background: transparent; padding: 0; font-size: 1rem; }
.db-note, .om-note { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-2) var(--sp-3); text-align: center; }
.db-prompt { margin: 0; color: var(--text-strong); font-size: var(--fs-h3); font-weight: 900; line-height: 1.35; text-align: center; }
.db-prompt.is-mine { color: var(--accent-ink); }
.db-hint, .om-hint { margin: 0; color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; line-height: 1.4; text-align: center; }
.db-actbar, .om-actbar {
  position: sticky;
  bottom: var(--sp-2);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-4);
  max-height: calc(var(--app-h, 100dvh) - 10rem);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.db-mine, .om-mine {
  position: relative;
  margin-bottom: var(--sp-3);
  padding: var(--sp-2) var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
}
.db-mine.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 28px -14px var(--accent-glow); }
.db-mine__head, .om-mine__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-2); }
.db-mine__title, .om-mine__title { color: var(--text-strong); font-size: var(--fs-sm); font-weight: 900; }
.db-mine__n, .om-mine__n { color: var(--accent-ink); font-size: 1rem; }

/* --- كدّاب: the table --- */
.db-layout, .om-layout { display: grid; grid-template-columns: minmax(0, 1fr); }
.db-layout { grid-template-areas: "center" "mine" "act" "log"; }
.db-layout > *, .om-layout > * { min-width: 0; }
.db-layout__center { grid-area: center; }
.db-layout__mine { grid-area: mine; }
.db-layout__act { grid-area: act; }
.db-layout__log { grid-area: log; }
.db-table {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3) var(--sp-3) var(--sp-3);
  border-radius: var(--r-xl);
  background: var(--accent-soft);
}
.db-bubble {
  max-width: 100%;
  padding: 0.35rem 0.9rem;
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
  box-shadow: var(--sh-1);
}
.db-bubble b { font-family: var(--font-display); font-weight: 800; }
.db-bubble.is-open { background: var(--accent); color: var(--accent-on); font-size: 1.05rem; box-shadow: 0 8px 18px -10px var(--accent-glow); }
.db-bubble.is-quiet { background: transparent; box-shadow: none; color: var(--accent-ink); }
.db-pilezone { display: flex; align-items: center; justify-content: center; gap: var(--sp-5); }
.db-pile { position: relative; display: block; width: var(--pc-w, 3.3rem); height: calc(var(--pc-w, 3.3rem) * 1.42); --pc-w: 3.3rem; }
.db-pile .pc-card { --pc-w: 3.3rem; }
.db-pile__card { position: absolute; inset: 0; transform: translate(calc(var(--k) * 2px), calc(var(--k) * -2px)) rotate(var(--tilt, 0deg)); }
.db-pile__empty { position: absolute; inset: 0; border: 2px dashed var(--accent-border, var(--border-strong, var(--border))); border-radius: calc(var(--pc-w, 3.3rem) * 0.12); background: color-mix(in srgb, var(--surface-solid) 45%, transparent); }
.db-pileinfo { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
.db-pile__n { color: var(--text-2); font-size: var(--fs-sm); font-weight: 800; }
.db-pile__n b { color: var(--text-strong); font-size: 1.35rem; }
.db-rank { display: inline-flex; align-items: baseline; gap: 6px; padding: 0.2rem 0.7rem; border-radius: var(--r-full); background: var(--surface-solid); box-shadow: var(--sh-1); }
.db-rank__label { color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.db-rank b { color: var(--accent-ink); font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; }
.db-rank.is-open b { color: var(--text-3); font-size: var(--fs-sm); }
.db-plays { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.db-play { padding: 1px 8px; border-radius: var(--r-full); background: color-mix(in srgb, var(--surface-solid) 70%, transparent); color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.db-play.is-top { background: var(--surface-solid); color: var(--text-strong); box-shadow: 0 0 0 1px var(--accent-border); }
/* A call turned over, until the next play. */
.db-called { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.db-called__cards { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px 6px; }
.db-called__stamp {
  position: absolute;
  top: 100%;
  left: 50%;
  padding: 0 0.4em 0.08em;
  border: 3px solid currentColor;
  border-radius: 0.35em;
  background: color-mix(in srgb, var(--surface-solid) 78%, transparent);
  color: var(--pc-call);
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  /* On the cards' lower edge, not over their faces: the table has to read them. */
  transform: translate(-50%, -70%) rotate(-8deg);
  box-shadow: var(--sh-1);
}
.db-called__cards { margin-bottom: 0.7rem; }
.db-called .pc-card { --pc-w: 2.9rem; }
.db-called.is-true .db-called__stamp { color: var(--pc-true); }
body.dark .db-called__stamp { color: #fb7185; }
body.dark .db-called.is-true .db-called__stamp { color: #4ade80; }
.db-called__line { margin: 0; color: var(--text-strong); font-size: var(--fs-sm); font-weight: 800; text-align: center; }
/* كدّاب!: big, red, for everyone but the one who played. */
.db-callbox { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); }
.db-callbtn {
  width: 100%;
  min-height: 3.6rem;
  border: 0;
  border-radius: var(--r-xl);
  background: linear-gradient(160deg, #ef4458, var(--pc-call) 70%);
  box-shadow: 0 5px 0 #8e1226, 0 12px 24px -10px rgba(200, 30, 58, 0.7);
  color: #fff;
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
.db-callbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #8e1226, 0 6px 14px -8px rgba(200, 30, 58, 0.7); }
.db-callbtn:disabled { opacity: 0.6; }
.db-callbtn { position: relative; overflow: hidden; }
/* The computer player up next moves when this runs out (shared.callEnds). */
.db-callbar { position: absolute; inset-inline: 0.9rem; bottom: 0.45rem; height: 0.3rem; border-radius: var(--r-full); background: rgba(255, 255, 255, 0.28); overflow: hidden; pointer-events: none; }
.db-callbar > i { position: absolute; inset: 0; border-radius: inherit; background: #fff; transform-origin: left center; animation: db-callbar linear forwards; }
@keyframes db-callbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.db-hint__bot { color: var(--danger-ink); font-weight: 900; }
.db-callbox.is-hot .db-callbtn { animation: db-call-pulse 0.8s ease-in-out infinite alternate; }
@keyframes db-call-pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
/* Your hand. */
.db-hand { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-3); padding-top: 1rem; }
.db-hand__row { --pc-gap-natural: 4; }
.db-hand__empty { color: var(--text-3); text-align: center; }
.db-hand .pc-card { --pc-w: 3.2rem; }
.db-hcard, .om-hcard {
  position: relative;
  flex: none;
  display: block;
  line-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: calc(var(--pc-w, 3.2rem) * 0.12);
  background: transparent;
  cursor: pointer;
  transition: transform var(--dur-2) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.db-hcard.is-sel { z-index: 2; transform: translateY(-0.9rem); }
.db-hcard.is-sel .pc-card { box-shadow: 0 0 0 3px var(--accent), 0 10px 22px -8px var(--accent-glow); }
.db-hand .db-hcard.is-sent { translate: 0 -0.4rem; }
.db-hcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.db-ranks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.db-rankchip {
  min-height: 2.6rem;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--text-strong);
  font-family: 'Baloo Bhaijaan 2', var(--font);
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
}
.db-rankchip.is-on { border-color: transparent; background: var(--accent); color: var(--accent-on); box-shadow: 0 6px 14px -8px var(--accent-glow); }
.db-rankchip { position: relative; }
.db-rankchip.is-held { border-color: var(--accent-border, var(--accent)); background: var(--accent-soft); }
.db-rankchip.is-held.is-on { background: var(--accent); }
/* How many of that rank you hold: the chip picks them all. */
.db-rankchip__n { position: absolute; top: -0.4rem; right: -0.3rem; min-width: 1.1rem; height: 1.1rem; padding: 0 0.25rem; border-radius: var(--r-full); background: var(--pop, #f59e0b); color: var(--pop-on, #1c1917); font-family: var(--font); font-size: 0.7rem; font-weight: 900; line-height: 1.1rem; box-shadow: var(--sh-1); }
.db-havebtn { align-self: center; min-height: 2.6rem; padding: 0.3rem 1rem; border: 1.5px dashed var(--accent); border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-ink); font-size: var(--fs-sm); font-weight: 900; cursor: pointer; }
.db-hint--have { color: var(--warning-ink, var(--text-2)); font-weight: 800; }
.db-actrow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--sp-2); }
.db-actrow .btn { padding-inline: var(--sp-2); }
/* The end. */
.db-won, .om-over { margin-bottom: var(--sp-3); text-align: center; }
.db-won__icon { font-size: 2.6rem; line-height: 1.1; }
.db-won .card__title { overflow-wrap: anywhere; }
.db-places { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); padding: 0; list-style: none; }
.db-places li { display: flex; align-items: center; gap: var(--sp-2); padding: 0.35rem 0.8rem; border-radius: var(--r-md); background: var(--surface-solid); border: 1px solid var(--border); }
.db-places__n { min-width: 1.6rem; color: var(--accent-ink); font-weight: 900; text-align: center; }
.db-places__name { font-weight: 800; color: var(--text-strong); overflow-wrap: anywhere; }

/* --- الشايب: the draw, the pairs, your hand --- */
.om-layout { grid-template-areas: "draw" "mine" "act" "mid" "log"; }
.om-layout__draw { grid-area: draw; }
.om-layout__mid { grid-area: mid; }
.om-layout__mine { grid-area: mine; }
.om-layout__act { grid-area: act; }
.om-layout__log { grid-area: log; }
.om-draw {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3) var(--sp-2) var(--sp-3);
  border-radius: var(--r-xl);
  background: var(--accent-soft);
}
.om-draw.is-mine { box-shadow: 0 0 0 2px var(--accent); }
.om-draw.is-victim { align-items: center; background: var(--warning-soft); }
.om-draw__title { margin: 0; color: var(--text-strong); font-size: var(--fs-h3); font-weight: 900; line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
.om-draw.is-mine .om-draw__title { color: var(--accent-ink); }
.om-backs { padding-top: 1.2rem; }
.om-backs .pc-card { --pc-w: 3.4rem; }
.om-back {
  position: relative;
  flex: none;
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  line-height: 0;
  background: transparent;
  border-radius: calc(var(--pc-w, 3.4rem) * 0.12);
  cursor: pointer;
  transition: transform 220ms cubic-bezier(0.3, 1.4, 0.4, 1);
  -webkit-tap-highlight-color: transparent;
}
span.om-back { cursor: default; }
.om-back.is-lifted { z-index: 2; transform: translateY(-1.1rem) rotate(-3deg); }
.om-back.is-lifted .pc-card { box-shadow: 0 0 0 3px var(--pc-gold), 0 14px 24px -8px rgba(180, 120, 0, 0.55); }
.om-back.is-sent { transform: translateY(-1.6rem) scale(1.04); }
.om-back:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
/* An upright phone and a hand of seven or more: rows of whole cards, each one easy to tap. */
.om-backs.is-wrap { flex-wrap: wrap; justify-content: center; gap: 0.7rem 6px; padding-top: 1.2rem; }
.om-backs.is-wrap .pc-card { --pc-w: 2.9rem; }
/* One tap shuffles your own hand (drag mode). */
.om-mixbtn { margin-inline-start: auto; min-height: 2.25rem; padding: 0.2rem 0.8rem; border: 1px solid var(--accent-border); border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-ink); font-size: var(--fs-xs); font-weight: 900; cursor: pointer; }
/* الشايب changes hands: a moment on the two phones it concerns, over your hand. */
.om-moment {
  position: fixed;
  z-index: var(--z-fx, 9000);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  width: min(17rem, calc(100vw - 2rem));
  padding: 0.9rem 1.2rem;
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: 0 0 0 2px var(--pc-gold), 0 18px 40px -12px rgba(46, 16, 101, 0.55);
  text-align: center;
  transform: translate(-50%, -50%);
  cursor: pointer;
}
.om-moment--got { background: linear-gradient(160deg, var(--pc-om-1), var(--pc-om-2)); color: #fff; }
.om-moment__card .pc-card { --pc-w: 4.6rem; }
.om-moment__title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; line-height: 1.25; }
.om-moment--gave .om-moment__title { color: var(--success-ink); font-size: 1.1rem; }
.om-moment__hint { font-size: var(--fs-xs); font-weight: 700; opacity: 0.85; }
.om-moment.is-moving { animation: om-moment-in 360ms cubic-bezier(0.3, 1.5, 0.5, 1) both; }
.om-moment--got.is-moving .om-moment__card { animation: om-moment-laugh 0.34s ease-in-out 0.4s 5 alternate; }
@keyframes om-moment-in { from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes om-moment-laugh { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-4px); } }
.om-mid { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-2); border: 1px dashed var(--border-strong, var(--border)); border-radius: var(--r-xl); }
.om-mid__pairs { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; min-height: 3.1rem; }
.om-mid__empty { align-self: center; color: var(--text-3); font-size: var(--fs-sm); font-weight: 700; }
.om-pair { display: inline-flex; transform: rotate(var(--tilt, 0deg)); }
.om-pair > .pc-card + .pc-card { margin-left: calc(var(--pc-w) * -0.55); }
.om-mid__label { margin: 0; color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.om-hand { padding-top: 1.1rem; }
.om-hand .pc-card { --pc-w: 3.2rem; }
.om-hand.is-draggable { touch-action: pan-y; }
.om-hand.is-draggable .om-hcard { cursor: grab; }
.om-hcard.is-aimed { z-index: 2; transform: translateY(-0.9rem); }
.om-hcard.is-aimed .pc-card { box-shadow: 0 0 0 3px var(--pc-gold), 0 12px 22px -8px rgba(180, 120, 0, 0.55); }
.om-hcard.is-dragging { z-index: 5; transition: none; cursor: grabbing; }
.om-hcard.is-dragging .pc-card { box-shadow: 0 16px 28px -8px rgba(0, 0, 0, 0.5); }
.om-mine.is-victim { border-color: var(--pc-gold); box-shadow: 0 0 0 1px var(--pc-gold), var(--sh-2); }
.om-mine.is-empty { text-align: center; }
.om-mine__safe { margin: 0; padding: var(--sp-2); color: var(--success-ink); font-size: var(--fs-h3); font-weight: 900; }
.om-mine__hint { width: 100%; color: var(--text-3); font-size: var(--fs-xs); font-weight: 700; text-align: center; }
.om-sub { margin: 0 0 var(--sp-2); color: var(--text-2); font-size: var(--fs-sm); font-weight: 800; text-align: center; }
.om-reveal { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.om-reveal__cards { display: flex; justify-content: center; gap: 6px; }
.om-reveal .pc-card { --pc-w: 6rem; }
.om-reveal__who { margin: 0; color: var(--text-strong); font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.om-tally { margin-bottom: var(--sp-3); }

/* --- A phone on its side: the table beside your hand and the bar --- */
@media (orientation: landscape) and (max-height: 500px) {
  .db-layout { grid-template-columns: minmax(0, 0.72fr) minmax(0, 1.28fr); grid-template-areas: "center mine" "center act" "log act"; column-gap: var(--sp-3); align-items: start; }
  .om-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "draw mine" "mid act" "log act"; column-gap: var(--sp-3); align-items: start; }
  .db-head, .om-head { margin-bottom: var(--sp-1); }
  .db-latest, .om-latest { margin-bottom: var(--sp-1); padding-block: var(--sp-1); }
  .db-opps, .om-opps { margin-bottom: var(--sp-1); padding-block: 2px 4px; }
  .db-seat, .om-seat { min-height: 2.3rem; padding-block: 2px; }
  .db-table { gap: var(--sp-1); margin-bottom: var(--sp-2); padding: var(--sp-2); }
  .db-callbtn { min-height: 2.9rem; font-size: 1.5rem; }
  .db-mine, .om-mine { margin-bottom: var(--sp-2); padding: var(--sp-1) var(--sp-2) var(--sp-2); }
  .db-hand { gap: var(--sp-2); padding-top: 0.8rem; }
  .db-hand .pc-card, .om-hand .pc-card { --pc-w: 2.7rem; }
  .db-hcard.is-sel { transform: translateY(-0.6rem); }
  .db-actbar, .om-actbar { gap: var(--sp-1); padding: var(--sp-2); max-height: calc(var(--app-h, 100dvh) - 4rem); }
  .db-actbar .db-prompt { font-size: var(--fs-sm); line-height: 1.3; }
  .db-actbar .btn, .om-actbar .btn { min-height: 2.5rem; font-size: var(--fs-sm); }
  /* Two rows (7 + 6): thirteen across left each chip 22px wide. */
  .db-rankchip { min-height: 2.5rem; font-size: 1rem; }
  .db-ranks { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .om-draw { gap: var(--sp-1); margin-bottom: var(--sp-2); padding: var(--sp-2); }
  .om-draw__title { font-size: var(--fs-sm); }
  .om-backs .pc-card { --pc-w: 2.9rem; }
  .om-mid { margin-bottom: var(--sp-2); }
  .db-log, .om-log { display: none; }
}
/* --- A laptop, a big screen as a player's own: the table across the width, cards sized by the height --- */
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-doubt, .shell__main > #view-room-oldmaid { max-width: 78rem; }
  .db-opps, .om-opps { flex-wrap: wrap; justify-content: center; overflow: visible; }
  .db-opps > :first-child, .db-opps > :last-child, .om-opps > :first-child, .om-opps > :last-child { margin-inline: 0; }
  .db-seat, .om-seat { max-width: 15rem; }
  .db-seat__name, .om-seat__name { max-width: 8rem; }
  .db-layout { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); grid-template-areas: "center center" "mine act" "log act"; column-gap: var(--sp-5); align-items: start; }
  .om-layout { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); grid-template-areas: "draw draw" "mine mid" "act mid" "log mid"; column-gap: var(--sp-5); align-items: start; }
  .db-table { padding: var(--sp-5) var(--sp-5) var(--sp-4); gap: var(--sp-3); }
  .db-pile, .db-pile .pc-card { --pc-w: clamp(6rem, 15vh, 11rem); }
  .db-pilezone { gap: clamp(2rem, 6vw, 5rem); }
  .db-bubble.is-open { font-size: 1.4rem; padding: 0.5rem 1.2rem; }
  .db-called .pc-card { --pc-w: clamp(3rem, 7vh, 5rem); }
  .db-hand .pc-card, .om-hand .pc-card { --pc-w: clamp(4rem, 10vh, 7rem); }
  .db-hcard.is-sel { transform: translateY(-1.1rem); }
  .db-hand { padding-top: 1.3rem; }
  .db-mine, .om-mine { margin-bottom: 0; }
  .db-actbar, .om-actbar { position: static; margin-bottom: 0; }
  .om-backs .pc-card { --pc-w: clamp(4.5rem, 12vh, 8rem); }
  .om-draw { padding: var(--sp-4); }
  .om-backs { padding-top: 1.6rem; }
  .om-mid .pc-card { --pc-w: clamp(2.4rem, 5.5vh, 3.6rem); }
  .om-reveal .pc-card { --pc-w: clamp(7rem, 22vh, 11rem); }
}

/* --- The TV: the seats a ring along the top and back along the bottom, the table in the middle --- */
.db-tv, .om-tv { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--tv-gap); --pc-fan: 3.6vmin; }
.db-tv__ring, .om-tv__ring { min-width: 0; display: flex; justify-content: center; gap: var(--tv-gap); }
.db-tv .db-seat, .om-tv .om-seat { flex: 0 1 auto; max-width: 30vw; min-height: 0; gap: 1.2vmin; padding: 0.8vmin 2vmin 0.8vmin 0.8vmin; border-width: 0.2vmin; }
.db-tv .db-avatar, .om-tv .om-avatar { width: 5vmin; height: 5vmin; font-size: 2.4vmin; }
.db-tv .db-seat__name, .om-tv .om-seat__name { max-width: 18vw; font-size: var(--tv-sm); }
.db-tv .db-seat__hand, .om-tv .om-seat__hand { display: flex; align-items: center; gap: 1.4vmin; margin: 0; padding: 0; }
.db-tv .db-seat__n, .om-tv .om-seat__n { position: static; min-width: 3.6vmin; padding: 0; background: none; box-shadow: none; font-size: var(--tv-md); line-height: 1; }
.db-tv .db-tag, .om-tv .om-tag { padding: 0.2vmin 1vmin; font-size: var(--tv-xs); }
.db-tv .pc-fan, .om-tv .pc-fan { width: max(var(--pc-fan), calc(var(--pc-fan) + (var(--of, 1) - 1) * var(--pc-fan) * 0.42)); height: calc(var(--pc-fan) * 1.42); }
.db-tv .pc-fan__card, .om-tv .pc-fan__card { left: calc(var(--k) * var(--pc-fan) * 0.42); }
.db-tv .pc-fan .pc-card, .om-tv .pc-fan .pc-card { --pc-w: var(--pc-fan); }
.db-tv__mid, .om-tv__mid { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: calc(var(--tv-gap) * 1.5); align-items: stretch; }
.db-tv__info, .om-tv__info { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: var(--tv-gap); overflow: hidden; text-align: center; }
.db-tv__table, .om-tv__table { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--tv-gap); }
.db-tv .db-head, .om-tv .om-head { margin: 0; }
.db-tv .badge, .om-tv .badge, .db-tvres .badge, .om-tvres .badge { height: auto; padding: 0.25em 0.7em; font-size: var(--tv-xs); }
.db-tv__turn { color: var(--text-strong); font-size: var(--tv-lg); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
.db-tv__call { color: var(--danger-ink); font-size: var(--tv-sm); font-weight: 900; }
.db-tv__call .db-callbar { position: relative; display: block; inset: auto; width: 60%; height: 0.8vmin; margin: 1vmin auto 0; background: color-mix(in srgb, var(--danger-ink) 22%, transparent); }
.db-tv__call .db-callbar > i { background: var(--danger-ink); }
.db-tv .db-latest, .om-tv .om-latest { margin: 0; padding: 0.8vmin 1.6vmin; border-radius: var(--tv-r); font-size: var(--tv-sm); }
.db-tv .db-log, .om-tv .om-log { margin: 0; }
.db-tv .db-log li, .om-tv .om-log li { padding: 0.5vmin 1vmin; font-size: var(--tv-xs); }
.db-tv .tv-actions, .om-tv .tv-actions { margin: 0; }
.db-tv .tv-actions:not(:has(.btn)), .om-tv .tv-actions:not(:has(.btn)) { display: none; }
.db-tv__host:empty, .om-tv__host:empty { display: none; }
.db-tv .db-table { flex: 1; min-height: 0; justify-content: center; margin: 0; gap: 2.4vmin; padding: 3vmin; border-radius: var(--tv-r); }
.db-tv .db-pile, .db-tv .db-pile .pc-card { --pc-w: min(24vmin, 15vw); }
.db-tv .db-pilezone { gap: 6vmin; }
.db-tv .db-bubble { font-size: var(--tv-md); padding: 1vmin 2.4vmin; border-radius: var(--tv-r); }
.db-tv .db-bubble.is-open { font-size: var(--tv-lg); }
.db-tv .db-pile__n { font-size: var(--tv-sm); }
.db-tv .db-pile__n b { font-size: var(--tv-lg); }
.db-tv .db-rank { padding: 0.6vmin 1.8vmin; }
.db-tv .db-rank__label { font-size: var(--tv-xs); }
.db-tv .db-rank b { font-size: var(--tv-md); }
.db-tv .db-play { font-size: var(--tv-xs); padding: 0.3vmin 1.2vmin; }
.db-tv .db-called .pc-card { --pc-w: 9vmin; }
.db-tv .db-called__stamp { font-size: 5vmin; border-width: 0.6vmin; }
.db-tv .db-called__line { font-size: var(--tv-sm); }
.db-tv--many { --pc-fan: 3vmin; }
.db-tv--many .db-seat { gap: 0.8vmin; padding: 0.6vmin 1.4vmin 0.6vmin 0.6vmin; }
.db-tv--many .db-avatar { width: 4vmin; height: 4vmin; font-size: 2vmin; }
.db-tv--many .db-seat__name { max-width: 11vw; }
.db-tv--many .db-seat__n { min-width: 3vmin; font-size: var(--tv-sm); }
.om-tv .om-draw { flex: 1.3; min-height: 0; justify-content: center; margin: 0; padding: 2.4vmin; border-radius: var(--tv-r); }
.om-tv .om-draw__title { font-size: var(--tv-md); }
.om-tv .om-backs { padding-top: 3vmin; }
.om-tv .om-backs .pc-card { --pc-w: min(12vmin, 7vw); }
.om-tv .om-mid { flex: 1; min-height: 0; justify-content: center; margin: 0; padding: 1.6vmin; border-radius: var(--tv-r); }
.om-tv .om-mid .pc-card { --pc-w: 6vmin; }
.om-tv .om-mid__label { font-size: var(--tv-xs); }
.db-tvres { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--tv-gap); }
.db-tvres > .tv-scale { width: min(100%, 60vmin); }
.om-tvres { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: calc(var(--tv-gap) * 2); }
.om-tvres__loser, .om-tvres__side { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); }
.om-tvres__side > .tv-scale { width: 100%; }
.om-tvres .om-reveal .pc-card { --pc-w: 26vmin; }
.om-tvres .om-reveal__who { font-size: var(--tv-lg); }
@media (orientation: portrait) {
  .db-tv, .om-tv { height: auto; }
  .db-tv__ring, .om-tv__ring { flex-wrap: wrap; }
  .db-tv__mid, .om-tv__mid, .om-tvres { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .pc-landed > .pc-card, .pc-landed.pc-card, .db-latest.is-new, .om-latest.is-new, .is-revealing .pc-flip__face, .db-callbox.is-hot .db-callbtn { animation: none; }
  .is-revealing .pc-flip__back { display: none; }
  .db-hcard, .om-hcard, .om-back, .db-seat, .om-seat, .db-callbtn { transition: none; }
}

/* ==========================================================================
   26b. كدّاب · الشايب: THE STAGE - look ج «المسرح», the owner's pick of
   29 Sep 2026 from a design sheet of three (a game show): the players a small
   scoreboard of tiles (a name, the count lit up, what they're doing), the
   claim - or whose draw it is - a big headline under a spotlight, the pile on
   a lit floor, «كدّاب!» a round red buzzer with «باص» and «ارمي» beside it,
   your hand a fan at the foot, the pairs out on a shelf. On a laptop and the
   TV the scoreboard is a column on one side and «على الهوا» (the log) on the
   other. The stage is dark in both themes: .pc-stage sets the page's tokens
   again inside it, so every piece built on them (badges, hints, the log,
   the room strip) reads right on it. The cards are section 26's, unchanged.
   ========================================================================== */
.pc-stage {
  --stg-1: #2a2150;
  --stg-2: #151126;
  --stg-3: #0b0913;
  --stg-line: #332b55;
  --stg-gold: #fbbf24;
  --stg-red: #ef4444;
  --text: #f3f0ff;
  --text-strong: #ffffff;
  --text-2: #cfc6ee;
  --text-3: #a79fcb;
  --surface: rgba(255, 255, 255, 0.06);
  --surface-solid: #1d1733;
  --surface-2: rgba(255, 255, 255, 0.07);
  --surface-3: rgba(255, 255, 255, 0.1);
  --border: var(--stg-line);
  --border-strong: #4a3f78;
  --accent-soft: rgba(167, 139, 250, 0.16);
  --accent-ink: #c4b5fd;
  --accent-border: #5b4a99;
  --danger-ink: #fca5a5;
  --danger-soft: rgba(239, 68, 68, 0.16);
  --success-ink: #86efac;
  --success-soft: rgba(34, 197, 94, 0.16);
  --warning-ink: #fcd34d;
  --warning-soft: rgba(251, 191, 36, 0.14);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-2) var(--sp-3);
  border-radius: var(--r-xl);
  background: radial-gradient(90% 55% at 50% 30%, var(--stg-1), var(--stg-2) 62%, var(--stg-3));
  color: var(--text);
  box-shadow: 0 18px 40px -22px rgba(11, 9, 19, 0.8);
}
.pc-stage .db-head, .pc-stage .om-head, .pc-stage .db-latest, .pc-stage .om-latest,
.pc-stage .db-opps, .pc-stage .om-opps, .pc-stage .db-table, .pc-stage .om-draw,
.pc-stage .db-mine, .pc-stage .om-mine, .pc-stage .db-actbar, .pc-stage .om-actbar, .pc-stage .om-mid, .pc-stage .db-log, .pc-stage .om-log { margin-bottom: 0; }
.pc-stage__top { display: flex; flex-direction: column; gap: var(--sp-1); }
.pc-stage .db-layout, .pc-stage .om-layout { row-gap: var(--sp-2); }
.pc-stage .db-layout { grid-template-areas: "center" "act" "mine"; }
.pc-stage .om-layout { grid-template-areas: "draw" "act" "mine" "mid"; }
.pc-stage .om-backs.is-wrap { gap: 0.6rem 5px; }
.pc-stage .om-backs.is-wrap .pc-card { --pc-w: 2.55rem; }
.pc-stage [data-room-strip] { margin-top: var(--sp-2) !important; }

/* --- The scoreboard --- */
.pc-stage .pc-rail { gap: 6px; padding: 2px 2px 4px; }
.pc-stage .pc-tile {
  flex: none;
  min-width: 4.8rem;
  max-width: 7.5rem;
  min-height: 0;
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 1px;
  padding: 6px 8px 5px;
  border: 1px solid var(--stg-line);
  border-radius: 12px;
  background: linear-gradient(180deg, #211b38, #171329);
  box-shadow: none;
}
.pc-tile__who { max-width: 100%; display: flex; align-items: center; gap: 4px; }
.pc-stage .pc-tile .db-avatar, .pc-stage .pc-tile .om-avatar { width: 1.15rem; height: 1.15rem; font-size: 0.625rem; }
.pc-stage .pc-tile .db-seat__name, .pc-stage .pc-tile .om-seat__name { max-width: 4.6rem; color: var(--text-2); font-size: 0.75rem; font-weight: 800; }
.pc-tile__led {
  color: var(--stg-gold);
  font-family: 'Baloo Bhaijaan 2', var(--font);
  font-size: 1.55rem;
  font-weight: 800;
  line-height: 1.05;
  text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
}
.pc-tile__st { max-width: 100%; overflow: hidden; color: var(--text-3); font-size: 0.6875rem; font-weight: 800; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.pc-tile__st.is-hot { color: #fca5a5; }
.pc-tile__st.is-turn, .pc-tile__st.is-target { color: var(--stg-gold); }
.pc-tile__st.is-good { color: #86efac; }
.pc-stage .pc-tile.is-turn { border-color: var(--stg-gold); box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.35), 0 0 18px rgba(251, 191, 36, 0.3); }
.pc-stage .pc-tile.is-last, .pc-stage .pc-tile.is-from { border-style: solid; border-color: var(--stg-red); box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35), 0 0 18px rgba(239, 68, 68, 0.35); }
.pc-stage .pc-tile.is-out { background: linear-gradient(180deg, #1c2a26, #131d1a); border-color: #2c4a3e; opacity: 0.75; }
.pc-stage .pc-tile.is-loser { border-color: var(--stg-red); background: linear-gradient(180deg, #3a1722, #22101a); }
.pc-stage .pc-tile.is-away { opacity: 0.55; }

/* --- The spotlight: the headline, the pile on a lit floor --- */
.pc-stage .pc-spot { position: relative; isolation: isolate; overflow: hidden; padding: var(--sp-2) var(--sp-2) var(--sp-3); border-radius: var(--r-xl); background: transparent; box-shadow: none; }
.pc-spot__beam {
  position: absolute;
  z-index: -1;
  inset: 0 6% 0;
  background: linear-gradient(180deg, rgba(255, 236, 180, 0.26), rgba(255, 236, 180, 0.06) 78%, transparent);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
  pointer-events: none;
}
.pc-spot__floor {
  position: absolute;
  z-index: -1;
  left: 12%;
  right: 12%;
  bottom: -0.2rem;
  height: 3.4rem;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 230, 160, 0.42), rgba(255, 230, 160, 0.08) 70%, transparent);
  pointer-events: none;
}
.pc-banner { display: grid; justify-items: center; gap: 3px; max-width: 100%; text-align: center; }
.pc-banner small { color: #d9cffc; font-size: var(--fs-sm); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.pc-banner strong {
  color: #fff;
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 9vw, 2.6rem);
  font-weight: 900;
  line-height: 1.2;
  overflow-wrap: anywhere;
  text-shadow: 0 0 22px rgba(167, 139, 250, 0.8), 0 2px 0 rgba(0, 0, 0, 0.4);
}
.pc-banner.is-quiet strong { font-size: 1.5rem; }
.pc-banner__rule { width: min(12rem, 55%); height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--stg-gold), transparent); }
.pc-banner.is-open strong { animation: pc-banner-in 420ms cubic-bezier(0.3, 1.4, 0.5, 1) both; }
@keyframes pc-banner-in { from { opacity: 0; transform: scale(0.8); } }
.om-draw.pc-spot .pc-banner strong { font-size: clamp(1.5rem, 7vw, 2rem); }
.pc-stage .db-table { gap: var(--sp-2); }
.pc-stage .db-pilezone { position: relative; isolation: isolate; min-height: 7rem; padding-block: var(--sp-2) var(--sp-3); }
.pc-stage .db-pile, .pc-stage .db-pile .pc-card { --pc-w: 4.3rem; }
.pc-stage .db-pileinfo { flex-direction: row; align-items: center; justify-content: center; gap: var(--sp-2); }
.pc-stage .db-pile__n { color: #fde68a; }
.pc-stage .db-pile__n b { color: #fde68a; }
.pc-stage .db-rank { background: rgba(255, 255, 255, 0.08); box-shadow: none; }
.pc-stage .db-rank b { color: #fff; }
.pc-stage .db-play { background: rgba(255, 255, 255, 0.07); color: #e7e1ff; }
.pc-stage .db-play.is-top { background: rgba(255, 255, 255, 0.14); color: #fff; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2); }
.pc-stage .db-called__line { color: #fff; }
.pc-stage .db-pile__empty { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.04); }

/* --- The controls: the buzzer between «باص» and «ارمي» --- */
.pc-stage .db-actbar, .pc-stage .om-actbar {
  position: static;
  max-height: none;
  overflow: visible;
  padding: var(--sp-2) var(--sp-2) var(--sp-3);
  border: 1px solid var(--stg-line);
  background: rgba(255, 255, 255, 0.04);
  box-shadow: none;
}
.pc-stage .db-actbar.is-mine, .pc-stage .om-actbar { border-color: rgba(251, 191, 36, 0.45); }
.pc-stage .db-actbar.is-call { border-color: rgba(239, 68, 68, 0.5); }
.db-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--sp-2); }
.db-controls.no-buzz { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.db-controls.is-solo { grid-template-columns: auto; justify-content: center; }
.pc-stage .db-callbtn {
  width: 6.4rem;
  height: 6.4rem;
  min-height: 0;
  padding: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, #fca5a5, #ef4444 35%, #b91c1c 70%, #7f1d1d);
