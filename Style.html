.hm-board { display: flex; flex-direction: column; gap: var(--sp-3); }
.hm-board__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; }
.hm-cat { font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; color: var(--text-strong); }
.hm-lives { font-size: 0.8125rem; font-weight: 700; color: var(--text-2); }
.hm-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-3) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  background: var(--surface-solid);
  box-shadow: 0 1px 3px rgba(40, 30, 20, 0.06);
}
.hm-gallows { display: block; width: min(10.5rem, 46%); height: auto; overflow: visible; }
.hm-gal { fill: none; stroke: var(--text-3); stroke-width: 4; stroke-linecap: round; opacity: 0.65; }
.hm-man { fill: none; stroke: var(--accent); stroke-width: 4.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 520ms var(--ease-out); }
.hm-man.is-on { stroke-dashoffset: 0; }
.hm-board.is-lost .hm-man { stroke: var(--danger); }
.hm-gallows--mini { width: 3.25rem; }
.hm-gallows--mini .hm-man { transition: none; }

/* A word stays on one line, its tiles shrinking rather than splitting it; a name of two or three
   words wraps only between them, with a wider gap there than between two letters. */
.hm-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.1rem; width: 100%; }
.hm-tiles__word { display: flex; flex-wrap: nowrap; justify-content: center; gap: 0.375rem; min-width: 0; max-width: 100%; }
.hm-tiles.is-long .hm-tiles__word { gap: 0.25rem; }
.hm-tile {
  flex: 0 1 auto;
  width: 2.375rem;
  min-width: 1.25rem;
  height: 2.75rem;
  display: grid;
  place-items: center;
  border: 2px solid var(--border-strong);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.375rem;
  line-height: 1;
  color: var(--text-strong);
}
.hm-tiles.is-long .hm-tile { width: 1.875rem; height: 2.375rem; font-size: 1.125rem; }
.hm-tile.is-open { background: var(--accent-soft); border-color: var(--accent); }
.hm-tile.is-new { animation: hmTile 440ms var(--ease-out) both; }
.hm-tile.is-lost { background: var(--danger-soft); border-color: var(--danger); color: var(--danger-ink); }
@keyframes hmTile { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.hm-wrong { margin: 0; min-height: 1.5rem; font-weight: 800; color: var(--danger-ink); word-spacing: 0.35em; text-align: center; }

.hm-keys { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.3125rem; }
.hm-keys .key { height: 2.875rem; font-size: 1.125rem; }
.hm-keys .key:disabled { cursor: default; }
.hm-keys .key--absent { opacity: 0.55; }
.hm-whole { display: flex; gap: var(--sp-2); }
.hm-whole input { flex: 1 1 auto; min-width: 0; }

.hm-tally { display: flex; gap: var(--sp-2); }
.hm-tally__one { flex: 1 1 0; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); padding: 0.375rem 0.875rem; border: 1px solid var(--border); border-radius: var(--r-full); background: var(--surface); font-weight: 700; color: var(--text-strong); }
.hm-tally__one > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-tally__one b { color: var(--accent-ink); }

.hm-write-card { display: flex; flex-direction: column; gap: var(--sp-2); }
.hm-write { display: flex; flex-direction: column; gap: var(--sp-2); }
.hm-write__row { display: flex; gap: var(--sp-2); }
.hm-write__row input { flex: 1 1 auto; min-width: 0; font-size: 1.125rem; }
.hm-write__row input.is-hidden { -webkit-text-security: disc; text-security: disc; }
.hm-write__err:empty { display: none; }
.hm-hint { font-size: 0.875rem; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: var(--r-full); padding: 0.125rem 0.625rem; }
.hm-board__who { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; min-width: 0; }
.hm-end { text-align: center; display: flex; flex-direction: column; gap: var(--sp-2); align-items: stretch; }
.hm-end__word { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; color: var(--text-strong); }
.hm-wait { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.hm-wait__icon { font-size: 2.5rem; }
.hm-mine-word { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); text-align: center; }

.hm-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: var(--sp-2); }
.hm-row { display: flex; flex-direction: column; align-items: center; gap: 0.125rem; padding: var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); text-align: center; }
.hm-row.is-me { box-shadow: 0 0 0 2px var(--accent-border); }
.hm-row.is-won { border-color: var(--success); }
.hm-row.is-lost { opacity: 0.6; }
.hm-row__who { font-weight: 800; color: var(--text-strong); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hm-row__prog, .hm-row__st { font-size: 0.75rem; color: var(--text-2); }

.hm-result { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); text-align: center; }
.hm-results { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 0.25rem; }
.hm-res { display: flex; justify-content: space-between; gap: var(--sp-2); padding: 0.375rem 0.625rem; border-radius: var(--r-sm); background: var(--surface-2); font-weight: 600; }
.hm-res.is-setter { background: var(--accent-soft); }
.hm-room { display: flex; flex-direction: column; gap: var(--sp-3); }
.hm-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.hm-layout__board { width: 100%; max-width: 32rem; margin-inline: auto; }
.hm-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
#hangman-stage { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 32rem; margin-inline: auto; }

/* A phone on its side, and every wide screen: the drawing and the word on one side, the keys on the
   other, so the whole board is on the screen without scrolling (the play area gets the space). */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .hm-board {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "head head" "stage keys" "stage whole";
    grid-template-rows: auto auto 1fr;
    align-items: start;
    column-gap: var(--sp-4);
  }
  .hm-board__head { grid-area: head; }
  .hm-stage { grid-area: stage; }
  .hm-keys { grid-area: keys; }
  .hm-whole { grid-area: whole; }
  #hangman-stage, .hm-layout__board { max-width: 58rem; }
}
/* Beside the board only where there is room for both; a phone on its side has the others under it. */
@media (min-width: 900px) and (min-height: 501px) {
  .hm-layout { display: grid; grid-template-columns: minmax(0, 52rem) minmax(11rem, 16rem); justify-content: center; gap: var(--sp-4); align-items: start; }
  .hm-layout__board { max-width: none; margin: 0; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .hm-stage { padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); }
  .hm-gallows { width: 5.75rem; }
  .hm-tile { width: 2rem; height: 2.375rem; font-size: 1.125rem; }
  .hm-keys .key { height: 2.375rem; font-size: 1rem; }
  .hm-board { row-gap: var(--sp-2); }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-hangman { max-width: 64rem; }
  .hm-gallows { width: min(13rem, 40%); }
  .hm-tile { width: 2.75rem; height: 3.125rem; font-size: 1.5rem; }
}

/* The TV: the kind of word and its blanks on top, everyone's man under it. */
.hm-tv__head { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); }
.hm-tv { align-content: start; }
.hm-tv .hm-tile { width: 8.5vmin; height: 10vmin; font-size: 5.4vmin; border-radius: var(--tv-r); }
.hm-rows--tv { grid-template-columns: repeat(auto-fill, minmax(22vmin, 27vmin)); justify-content: center; gap: var(--tv-gap); }
.hm-rows--tv .hm-row { padding: 1.4vmin; border-radius: var(--tv-r); }
.hm-rows--tv .hm-gallows--mini { width: 14vmin; }
.hm-rows--tv .hm-row__who { font-size: var(--tv-sm); }
.hm-rows--tv .hm-row__prog, .hm-rows--tv .hm-row__st { font-size: 1.8vmin; }
.hm-result--tv { font-size: var(--tv-sm); width: min(100%, 46rem); margin-inline: auto; padding: 3vmin; gap: 2.4vmin; }
.hm-result--tv .hm-res { padding: 1vmin 1.6vmin; border-radius: var(--tv-r); }
.hm-result--tv .hm-tile { width: 6.4vmin; height: 7.4vmin; font-size: 3.8vmin; }
.hm-tv-result { width: min(100%, 60rem); margin-inline: auto; }

@media (prefers-reduced-motion: reduce) {
  .gw-card, .gw-card::after, .hm-man { transition: none; }
  .gw-qa__a.is-in, .gw-reveal.is-turning .gw-reveal__one .gw-card, .hm-tile.is-new, .gw-ask-me.is-in, .gw-dots i, .gw-bubble, .gw-drama__card { animation: none; }
}

/* ==========================================================================
   29. ميني جولف
   --------------------------------------------------------------------------
   JS_MiniGolf.html. The course is a 3D canvas that takes the whole view at
   every size (the play area gets the space); what the player needs to read
   sits over it as a compact strip of chips at the top, a line at the foot,
   the players' chips, and a card between holes and at the end. The chips are
   frosted ink over the sky and the grass, the same in both themes: they sit
   on the course, not on the page.
   ========================================================================== */
#view-play-minigolf:not(.hidden), #view-room-minigolf:not(.hidden) { display: flex; flex-direction: column; min-height: 0; }
#view-play-minigolf > .mg-host, #view-room-minigolf > .mg-screen { flex: 1 1 auto; min-height: 0; align-self: stretch; width: 100%; }
.mg-host { display: flex; flex-direction: column; min-height: 0; }
.mg-screen { flex: 1 1 auto; display: flex; min-height: 0; gap: var(--sp-3); width: 100%; }
.mg-stage {
  --mg-ink: rgba(22, 18, 32, 0.66);
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 15rem;
  border-radius: var(--r-2xl);
  overflow: hidden;
  background: linear-gradient(#bfe3f2, #9fcf8f);
  box-shadow: var(--sh-3);
  isolation: isolate;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.mg-canvas-host { position: absolute; inset: 0; }
.mg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.mg-msg {
  position: absolute; inset: 0; display: grid; place-items: center; padding: var(--sp-6);
  text-align: center; color: #1d2a1f; font-weight: var(--fw-semi); font-size: var(--fs-body, 1rem);
}
.mg-msg.hidden { display: none; }

/* --- the strip at the top --- */
.mg-hud {
  position: absolute; top: var(--sp-2); inset-inline: var(--sp-2);
  display: flex; justify-content: center; pointer-events: none; z-index: 2;
}
.mg-hud__row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.375rem; }
.mg-chip {
  display: inline-flex; align-items: center; gap: 0.3rem;
  min-height: 1.875rem; padding: 0.2rem 0.7rem;
  border-radius: var(--r-full);
  background: var(--mg-ink);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  color: #fff; font-size: 0.8125rem; font-weight: var(--fw-semi); line-height: 1.2;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  white-space: nowrap;
}
.mg-chip b { font-family: var(--font-display); font-weight: var(--fw-bold); }
.mg-chip__name { font-weight: var(--fw-med); opacity: 0.85; }
.mg-chip--strokes { background: rgba(255, 255, 255, 0.92); color: #1d1a2b; }
.mg-chip--turn { background: #ffd23f; color: #2b2300; }
.mg-chip--clock { font-variant-numeric: tabular-nums; }
.mg-chip--clock.is-low { background: #d62839; }
.mg-chip--par { direction: ltr; }
/* the final stroke a hole allows (par + 3): said, in red, before it is played */
.mg-chip--last { background: #d62839; color: #fff; animation: mgLastPulse 1.2s ease-in-out infinite; }
@keyframes mgLastPulse { 50% { transform: scale(1.06); } }

/* --- the line at the foot, the players' chips, the host's buttons --- */
.mg-hint {
  position: absolute; bottom: var(--sp-3); left: 50%;
  max-width: calc(100% - 1.5rem);
  padding: 0.3rem 0.95rem; border-radius: var(--r-full);
  background: var(--mg-ink); color: #fff;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-weight: var(--fw-bold); font-size: 0.875rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none; z-index: 2;
  opacity: 0; transform: translate(-50%, 6px);
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}
.mg-hint.is-on { opacity: 1; transform: translate(-50%, 0); }
.mg-hint:empty { visibility: hidden; }
.mg-players {
  position: absolute; bottom: calc(var(--sp-3) + 2.4rem); inset-inline: var(--sp-2);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem; pointer-events: none; z-index: 2;
}
.mg-players:empty { display: none; }
.mg-pchip {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.15rem 0.55rem; border-radius: var(--r-full);
  background: rgba(22, 18, 32, 0.55); color: #fff; font-size: 0.75rem; font-weight: var(--fw-med);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  max-width: 9rem;
}
.mg-pchip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mg-pchip b { font-family: var(--font-display); }
.mg-pchip.is-me { background: rgba(255, 255, 255, 0.9); color: #1d1a2b; }
.mg-pchip.is-up { outline: 2px solid #ffd23f; }
.mg-pchip.is-away { opacity: 0.55; }
.mg-dot { width: 0.7rem; height: 0.7rem; flex: none; border-radius: 50%; background: var(--c, #fff); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.35); }
.mg-hostrow { position: absolute; top: calc(var(--sp-2) + 2.25rem); inset-inline-end: var(--sp-2); z-index: 3; }
.mg-hostrow .room-host-row { margin-top: 0 !important; }
.mg-hostrow:empty { display: none; }

/* --- the banner: a word for how a hole went --- */
.mg-banner {
  position: absolute; inset-inline: 0; top: 34%;
  display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
  pointer-events: none; z-index: 3;
  opacity: 0; transform: scale(0.6);
  transition: opacity 250ms var(--ease-out), transform 350ms var(--ease-spring);
}
.mg-banner.is-on { opacity: 1; transform: scale(1); }
.mg-banner__text {
  font-family: var(--font-display); font-weight: var(--fw-black);
  font-size: clamp(2rem, 9vmin, 4.2rem); line-height: 1.1; color: #fff; text-align: center;
  text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 2px 0 rgba(0, 0, 0, 0.25);
  padding-inline: var(--sp-4);
}
.mg-banner small { color: #fff; font-weight: var(--fw-bold); font-size: 1rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
.mg-banner--ace .mg-banner__text { color: #ffd23f; font-size: clamp(2.4rem, 11vmin, 5rem); }
.mg-banner--good .mg-banner__text { color: #b8ff9f; }
.mg-banner--water .mg-banner__text { color: #bfe6ff; font-size: clamp(1.6rem, 7vmin, 3rem); }
.mg-banner--picked .mg-banner__text { font-size: clamp(1.4rem, 6vmin, 2.6rem); }

/* --- a new hole's card: flies in, rests, and flies up to the strip --- */
.mg-namecard {
  position: absolute; top: 30%; left: 50%;
  display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
  padding: var(--sp-4) var(--sp-6);
  border-radius: var(--r-2xl);
  background: rgba(255, 255, 255, 0.94); color: #1d1a2b;
  box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.45);
  pointer-events: none; z-index: 4;
  opacity: 0; transform: translate(-50%, 0) scale(0.7);
  min-width: 12rem;
}
.mg-namecard.is-on { animation: mg-namecard 2.2s var(--ease-out) both; }
@keyframes mg-namecard {
  0%   { opacity: 0; transform: translate(-50%, 30px) scale(0.7) rotate(-4deg); }
  16%  { opacity: 1; transform: translate(-50%, 0) scale(1.04) rotate(1deg); }
  24%  { transform: translate(-50%, 0) scale(1) rotate(0); }
  70%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -180%) scale(0.45); }
}
.mg-namecard__n { font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.9rem; line-height: 1; color: var(--accent-ink); }
.mg-namecard__n small { font-size: 0.55em; opacity: 0.6; margin-inline-start: 0.15em; }
.mg-namecard__name { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: 1.25rem; }
.mg-namecard__par { font-size: 0.8rem; font-weight: var(--fw-semi); color: #5b566f; }

/* --- the card between holes, and the end --- */
.mg-panel {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: var(--sp-3);
  background: rgba(10, 20, 14, 0.28);
  overflow-y: auto;
  touch-action: pan-y;
  animation: mg-fade var(--dur-3) var(--ease-out) both;
}
.mg-panel.hidden { display: none; }
@keyframes mg-fade { from { opacity: 0; } to { opacity: 1; } }
.mg-panel__card {
  width: min(100%, 30rem); margin: auto;

  animation: mg-rise var(--dur-4) var(--ease-spring) both;
}
.mg-panel__card--over { width: min(100%, 36rem); }
@keyframes mg-rise { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: none; } }
.mg-panel__word { margin: 0; font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.75rem; line-height: 1.15; color: var(--accent-ink); text-align: center; }
.mg-panel .btn-stack { margin: 0; }
.mg-results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.mg-res { display: flex; align-items: center; gap: var(--sp-2); padding: 0.35rem 0.6rem; border-radius: var(--r-md); background: var(--surface-2); }
.mg-res.is-me { outline: 2px solid var(--accent); }

.mg-res b { font-family: var(--font-display); font-size: 1.1rem; min-width: 1.5rem; text-align: center; }

/* the scorecard: holes across, a row a player; it scrolls sideways when it must */
.mg-card { overflow-x: auto; border-radius: var(--r-md); border: 1px solid var(--border); }
.mg-card table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; }
/* eighteen holes: the first nine, then the rest with the total */
.mg-card table + table { border-top: 2px solid var(--border); }
.mg-card.mg-card--two table { font-size: 0.75rem; }
.mg-card.mg-card--two th, .mg-card.mg-card--two td { padding: 0.3rem 0.12rem; }
.mg-card.mg-card--two .mg-card__who { max-width: 5.5rem; }
.mg-card--two .mg-card__c.is-ace { border-radius: 0.5rem; }
.mg-card th, .mg-card td { padding: 0.3rem 0.35rem; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mg-card thead th { color: var(--text-3); font-weight: var(--fw-semi); background: var(--surface-2); }
.mg-card__par td, .mg-card__par th { color: var(--text-2); font-size: 0.75rem; background: var(--surface-2); }
.mg-card tbody tr + tr { border-top: 1px solid var(--hairline); }
.mg-card tbody tr.is-me { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.mg-card__who { text-align: start !important; width: 99%; max-width: 8rem; overflow: hidden; text-overflow: ellipsis; font-weight: var(--fw-semi); }
.mg-card__who .mg-dot { display: inline-block; vertical-align: -0.1em; margin-inline-end: 0.3rem; }
.mg-card__c { font-weight: var(--fw-semi); }
.mg-card__c.is-under { color: var(--success); }
.mg-card__c.is-over { color: var(--danger); }
.mg-card__c.is-ace { color: #fff; background: var(--success-btn); border-radius: 50%; }
.mg-card__tot { font-weight: var(--fw-bold); }
.mg-card__tot b { font-family: var(--font-display); font-size: 1rem; }

.bs-game { --duel-c1: #3b82f6; --duel-c2: #f97316; }

.bs-fc { position: relative; }

/* ==========================================================================
   28. بولينج
   JS_Bowling.html. The lane is a WebGL canvas (three.js) and gets the screen
   at every size; over it, the score sheet of whoever is bowling (a compact
   strip across the top), the word after a ball, and the hint. The sheet over
   the lane is always light-on-dark: it sits on the hall, not on the page.

.bowl-solo { display: flex; flex-direction: column; min-height: 0; }

  -webkit-touch-callout: none;

.bowl-fr__ball.is-sp { color: #c4b5fd; }
.bowl-fr__sum { text-align: center; font-weight: 800; font-size: 0.875rem; line-height: 1.25; min-height: 1.15rem; padding-bottom: 1px; }
.bowl-fr--tot { justify-content: center; }
.bowl-fr__sum--tot { font-family: var(--font-display); font-size: 1.125rem; }
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr__ball { font-size: 0.625rem; }
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr__sum { font-size: 0.6875rem; }
.bowl-sheet[style*="--bowl-n:10"] .bowl-fr__n { display: none; }

/* The word after a ball: سترايك in gold with the pins flying out, سبير in the violet, a count plain. */
.bowl-banner {
  position: absolute;
  inset-inline: 0;
  top: 36%;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  text-align: center;
  pointer-events: none;
  color: #fff;
  opacity: 0;
  transform: scale(0.6);
}
.bowl-banner.is-on { animation: bowlBanner 1500ms var(--ease-spring) both; }
.bowl-banner.is-strike.is-on { animation-duration: 2100ms; }
.bowl-banner__main {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.6rem, 13vmin, 5.5rem);
  line-height: 1;
  text-shadow: 0 4px 22px rgba(0, 0, 0, 0.6);
}
.bowl-banner.is-strike .bowl-banner__main {
  background: linear-gradient(180deg, #fff5d6 0%, #ffcf6a 55%, #f59e0b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 18px rgba(255, 170, 60, 0.55));
}
.bowl-banner.is-spare .bowl-banner__main { color: #ddd6fe; text-shadow: 0 0 24px rgba(167, 139, 250, 0.8), 0 4px 18px rgba(0, 0, 0, 0.6); }
.bowl-banner.is-miss .bowl-banner__main { font-size: clamp(2rem, 9vmin, 4rem); color: #e7dccd; }
.bowl-banner__sub { font-weight: 700; font-size: 0.9375rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); color: #f3e8d6; }
.bowl-banner__pins { position: relative; width: 0; height: 0; }
.bowl-banner__pins i {
  position: absolute;
  inset-inline-start: 0;
  top: -3rem;
  width: 0.7rem;
  height: 1.8rem;
  border-radius: 45% 45% 40% 40% / 30% 30% 60% 60%;
  background: linear-gradient(180deg, #fff 0 38%, #d7261e 38% 44%, #fff 44% 50%, #d7261e 50% 55%, #fff 55%);
  opacity: 0;
}
.bowl-banner.is-strike.is-on .bowl-banner__pins i { animation: bowlPinFly 1300ms var(--ease-out) both; }
.bowl-banner__pins i:nth-child(1)  { --dx: -9rem;  --dy: -5rem; --r: -220deg; animation-delay: 60ms; }
.bowl-banner__pins i:nth-child(2)  { --dx: 8rem;   --dy: -6rem; --r: 260deg;  animation-delay: 90ms; }
.bowl-banner__pins i:nth-child(3)  { --dx: -5rem;  --dy: -8rem; --r: -160deg; animation-delay: 30ms; }
.bowl-banner__pins i:nth-child(4)  { --dx: 5rem;   --dy: -8.5rem; --r: 200deg; animation-delay: 110ms; }
.bowl-banner__pins i:nth-child(5)  { --dx: -11rem; --dy: -1rem; --r: -300deg; animation-delay: 140ms; }
.bowl-banner__pins i:nth-child(6)  { --dx: 11rem;  --dy: -2rem; --r: 320deg;  animation-delay: 70ms; }
.bowl-banner__pins i:nth-child(7)  { --dx: -2rem;  --dy: -10rem; --r: 120deg; animation-delay: 20ms; }
.bowl-banner__pins i:nth-child(8)  { --dx: 2.5rem; --dy: -9.5rem; --r: -140deg; animation-delay: 130ms; }
.bowl-banner__pins i:nth-child(9)  { --dx: -7rem;  --dy: 3rem; --r: -250deg;  animation-delay: 170ms; }
.bowl-banner__pins i:nth-child(10) { --dx: 7rem;   --dy: 2.5rem; --r: 240deg; animation-delay: 150ms; }
@keyframes bowlBanner {
  0% { opacity: 0; transform: scale(0.55); }
  16% { opacity: 1; transform: scale(1.08); }
  26% { transform: scale(1); }
  82% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.96) translateY(-0.5rem); }
}
@keyframes bowlPinFly {
  0% { opacity: 0; transform: translate(0, 0) rotate(0); }
  12% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
}

.bowl-hint {
  position: absolute;
  inset-inline: 0;
  bottom: 0.875rem;
  z-index: 2;
  display: flex;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 240ms var(--ease-out);
}
.bowl-hint.is-on { opacity: 1; }
.bowl-hint::before { content: none; }
.bowl-hint {
  font-weight: 800;
  font-size: 0.9375rem;
  color: #fff;
  text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
}
.bowl-hint.is-on { animation: bowlHint 1800ms ease-in-out infinite; }
@keyframes bowlHint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.bowl-msg {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  padding: var(--sp-6);
  text-align: center;
  color: var(--bowl-ink);
  font-weight: 700;
}
.bowl-msg[hidden] { display: none; }
.bowl-msg p { margin: 0; max-width: 20rem; line-height: 1.6; }
.bowl-msg__icon, .bowl-msg__spin { font-size: 3rem; }
.bowl-msg__spin { animation: bowlSpin 1.4s linear infinite; }
@keyframes bowlSpin { to { transform: rotate(360deg); } }

.bowl-over-slot { position: absolute; inset-inline: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: var(--sp-3); pointer-events: none; }
.bowl-over-slot:empty { display: none; }
.bowl-over { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--sp-4); width: min(100%, 22rem); text-align: center; }
.bowl-over__score { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--accent-ink); }
.bowl-over .btn-row { width: 100%; }

/* A room on a phone: the lane first, everyone's sheet under it. */
.bowl-room { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 0; }
.bowl-room > .bowl-stage {
  flex: 0 0 auto;
  height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--nav-h) - var(--safe-top) - var(--safe-bottom) - 3.5rem);
  min-height: 18rem;
}
.bowl-room__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.bowl-room--over { gap: var(--sp-4); }
.bowl-watching { text-align: center; margin: 0; }
.bowl-list { min-width: 0; }
.bowl-rows { display: flex; flex-direction: column; gap: var(--sp-2); }
.bowl-row {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.bowl-row.is-up { border-color: var(--accent-border); box-shadow: 0 0 0 2px var(--accent-soft); }
.bowl-row.is-away { opacity: 0.6; }
.bowl-row__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); }
.bowl-row__name { font-weight: 800; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bowl-row.is-me .bowl-row__name { color: var(--accent-ink); }
.bowl-row__tot { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--text-strong); }
.bowl-sheet--compact .bowl-fr { background: var(--surface-2); border-color: var(--border); color: var(--text-strong); border-radius: 6px; }
.bowl-sheet--compact .bowl-fr.is-cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.bowl-sheet--compact .bowl-fr__ball.is-x { color: var(--warning-ink, #b45309); }
.bowl-sheet--compact .bowl-fr__ball.is-sp { color: var(--accent-ink); }
.bowl-sheet--compact .bowl-fr--tot { display: none; }
.bowl-sheet--compact { grid-template-columns: repeat(var(--bowl-n, 5), minmax(0, 1fr)); }

/* A phone on its side, and every wide screen: the lane takes the height, the sheets beside it. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .bowl-room:not(.bowl-room--over) {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(13rem, 19rem);
    align-items: start;
    gap: var(--sp-3);
  }
  .bowl-room:not(.bowl-room--over) > .bowl-stage {
    position: sticky;
    top: 0;
    height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem);
    min-height: 16rem;
  }
}
@media (orientation: landscape) and (max-height: 500px) {
  .bowl-stage { min-height: 15rem; border-radius: var(--r-xl); }
  #view-play-bowling .bowl-stage { height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 1.75rem); flex: 0 0 auto; }
  .bowl-room:not(.bowl-room--over) { grid-template-columns: minmax(0, 1fr) minmax(8.5rem, 10.5rem); gap: var(--sp-2); }
  .bowl-room:not(.bowl-room--over) > .bowl-stage { height: calc(var(--app-h, 100dvh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 1.75rem); min-height: 14rem; }
  /* Beside a lane on a phone's side there is room for names and totals; the sheet itself is over the lane. */
  .bowl-room__side .bowl-sheet--compact { display: none; }
  .bowl-room__side .bowl-row { padding: 0.375rem 0.625rem; }
  .bowl-room__side .bowl-row__tot { font-size: 1.0625rem; }
  .bowl-room__side .chip-set { margin-top: var(--sp-1) !important; }
  .bowl-banner { top: 30%; }
  .bowl-hud__sheet { max-width: 34rem; margin-inline: auto; width: 100%; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-bowling, .shell__main > #view-room-bowling { max-width: 76rem; }
  .bowl-room:not(.bowl-room--over) { grid-template-columns: minmax(0, 1fr) minmax(15rem, 22rem); gap: var(--sp-4); }
  .bowl-hud__sheet { width: min(100%, 38rem); margin-inline: auto; }
  .bowl-fr__ball { font-size: 0.875rem; }
  .bowl-fr__sum { font-size: 1rem; }
  .bowl-hud__who { font-size: 0.9375rem; }
  .bowl-room--over { max-width: 44rem; margin-inline: auto; width: 100%; }
}

/* The TV: the lane big, everyone's sheet beside it, readable from the sofa. */
.bowl-tv {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 31%);
  gap: var(--tv-gap);
}
.bowl-tv > .bowl-stage { min-height: 0; height: 100%; border-radius: var(--tv-r); }
.bowl-tv__side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--tv-gap); }
.bowl-stage--tv .bowl-hud { padding: 1.2vmin 1.2vmin 0; gap: 0.8vmin; }
.bowl-stage--tv .bowl-hud__sheet { width: min(100%, 110vmin); margin-inline: auto; }
.bowl-stage--tv .bowl-sheet { gap: 0.5vmin; grid-template-columns: repeat(var(--bowl-n, 5), minmax(0, 1fr)) minmax(8vmin, 1.25fr); }
.bowl-stage--tv .bowl-fr { border-radius: 1vmin; }
.bowl-stage--tv .bowl-fr__n { font-size: 1.5vmin; display: block; }
.bowl-stage--tv .bowl-fr__balls { min-height: 3.2vmin; }
.bowl-stage--tv .bowl-fr__ball { font-size: 2.6vmin; max-width: 3.6vmin; }
.bowl-stage--tv .bowl-fr__sum { font-size: 2.9vmin; min-height: 3.6vmin; }
.bowl-stage--tv .bowl-fr__sum--tot { font-size: 3.6vmin; }
.bowl-stage--tv .bowl-hud__who { font-size: var(--tv-sm); }
.bowl-stage--tv .bowl-hint { font-size: var(--tv-md); bottom: 2.4vmin; }
.bowl-stage--tv .bowl-banner__main { font-size: 15vmin; }
.bowl-stage--tv .bowl-banner__sub { font-size: var(--tv-md); }
.bowl-list--tv .bowl-rows { gap: calc(var(--tv-gap) * 0.7); }
.bowl-list--tv .bowl-row { padding: 1.1vmin 1.4vmin; border-radius: var(--tv-r); gap: 0.8vmin; }
.bowl-list--tv .bowl-row__name { font-size: var(--tv-sm); }
.bowl-list--tv .bowl-row__tot { font-size: var(--tv-md); }
.bowl-list--tv .bowl-sheet { gap: 0.4vmin; }
.bowl-list--tv .bowl-fr__balls { min-height: 2.4vmin; }
.bowl-list--tv .bowl-fr__ball { font-size: 1.9vmin; max-width: 2.6vmin; }
.bowl-list--tv .bowl-fr__sum { font-size: 1.9vmin; min-height: 2.5vmin; }
.bowl-list--tv .bowl-fr__n { display: none; }
.bowl-tv-over { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); min-height: 0; overflow-y: auto; }
.bowl-tv-over .bowl-list--tv { width: min(100%, 110vmin); }
.bowl-tv-over .podium { zoom: 1.35; }

@media (prefers-reduced-motion: reduce) {
  .bowl-banner.is-on { animation: none; opacity: 1; transform: none; }
  .bowl-banner__pins { display: none; }
  .bowl-hint.is-on { animation: none; }
  .bowl-msg__spin { animation: none; }
}

/* ==========================================================================
   26. كدّاب · الشايب: THE PLAYING CARDS
   JS_Cards.html (the card, the back, الشايب, a hand's row, the flights),
   JS_RoomDoubt.html and JS_RoomOldMaid.html. The owner's option ب "بلوكات"
   for both (23 Sep 2026), the family of أونو's and سكرو's cards: a card is a
   colour block (--pc-red for hearts and diamonds, --pc-ink for spades and
   clubs, the same in both themes), a big Baloo numeral, its index top left
   and the suit bottom right, a soft shine; the back the violet dotted one
   with "A."; الشايب deep violet in a gold frame. A card is a physical thing,
   laid out left to right in every language. Sized by --pc-w (the height is
   1.42 times it); the default is on :where(.pc-card), so any context that
   sizes a card wins.
   ========================================================================== */
:root {
  --pc-red: #e5383b;
  --pc-ink: #23213a;
  --pc-om-1: #5b21b6;
  --pc-om-2: #2e1065;
  --pc-gold: #fbbf24;
  --pc-back-1: #7c3aed;
  --pc-back-2: #4c1d95;
  --pc-amber: #f5c451;
  --pc-call: #c81e3a;        /* كدّاب!: a red white text reads on in both themes */
  --pc-true: #15803d;
}
:where(.pc-card) { --pc-w: 3.3rem; }
.pc-card {
  position: relative;
  flex: none;
  display: inline-block;
  width: var(--pc-w);
  height: calc(var(--pc-w) * 1.42);
  border-radius: calc(var(--pc-w) * 0.12);
  color: #fff;
  font-family: 'Baloo Bhaijaan 2', 'Cairo', var(--font);
  font-weight: 800;
  line-height: 1;
  direction: ltr;
  vertical-align: top;
  overflow: hidden;
  container-type: inline-size;
  -webkit-user-select: none;
  user-select: none;
}
.pc-card--xs { --pc-w: 1.05rem; }
.pc-card--sm { --pc-w: 2.15rem; }
.pc-card--md { --pc-w: 3.3rem; }
.pc-card--lg { --pc-w: 4.6rem; }
.pc-card--xl { --pc-w: 6.4rem; }
.pc-card--fly { --pc-w: inherit; width: 100%; height: 100%; }
.pc-red { --c: var(--pc-red); }
.pc-black { --c: var(--pc-ink); }
.pc-card--face {
  background: var(--c);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 78%, white), var(--c) 58%, color-mix(in srgb, var(--c) 82%, black));
  box-shadow: 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.22) calc(var(--pc-w) * -0.12) rgba(15, 12, 24, 0.55);
}
.pc-black.pc-card--face { background: linear-gradient(160deg, #3d3a58, var(--pc-ink) 58%, #121022); }
/* On the dark ground an ink card had no edge: a faint rim draws it. */
body.dark .pc-black.pc-card--face { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.22) calc(var(--pc-w) * -0.12) rgba(0, 0, 0, 0.7); }
.pc-card--face::after {
  content: '';
  position: absolute;
  inset-block-start: -30%;
  right: -40%;
  width: 90%;
  height: 70%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  pointer-events: none;
}
.pc-card__corner {
  position: absolute;
  z-index: 2;
  top: calc(var(--pc-w) * 0.06);
  left: calc(var(--pc-w) * 0.07);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--pc-w) * 0.015);
  font-size: calc(var(--pc-w) * 0.21);
  letter-spacing: -0.03em;
}
.pc-card__cs { display: block; width: calc(var(--pc-w) * 0.16); height: calc(var(--pc-w) * 0.16); fill: currentColor; }
.pc-card__big {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  padding-top: calc(var(--pc-w) * 0.04);
  font-size: calc(var(--pc-w) * 0.58);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
.pc-card__big--10 { font-size: calc(var(--pc-w) * 0.44); letter-spacing: -0.05em; }
.pc-card__suit {
  position: absolute;
  z-index: 1;
  right: calc(var(--pc-w) * 0.07);
  bottom: calc(var(--pc-w) * 0.07);
  width: calc(var(--pc-w) * 0.25);
  height: calc(var(--pc-w) * 0.25);
  fill: currentColor;
  opacity: 0.92;
}
/* A small card is its numeral and its suit. */
@container (max-width: 42px) {
  .pc-card__corner { display: none; }
  .pc-card__big { padding-top: 0; padding-bottom: 18%; }
  .pc-card__suit { width: 36%; height: 36%; right: 32%; bottom: 7%; }
}
/* The back: violet, dotted, "A." with its amber full stop. */
.pc-card--back {
  display: inline-grid;
  place-items: center;
  background: linear-gradient(160deg, var(--pc-back-1), var(--pc-back-2));
  box-shadow: 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.2) calc(var(--pc-w) * -0.12) rgba(46, 16, 101, 0.6);
}
.pc-card--back::before {
  content: '';
  position: absolute;
  inset: calc(var(--pc-w) * 0.06);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: calc(var(--pc-w) * 0.08);
  background-image: radial-gradient(rgba(255, 255, 255, 0.18) 1.2px, transparent 1.4px);
  background-size: 8px 8px;
  pointer-events: none;
}
.pc-card__a { position: relative; z-index: 1; color: #fff; font-size: calc(var(--pc-w) * 0.34); line-height: 1; }
.pc-card__a i { color: var(--pc-amber); font-style: normal; }
@container (max-width: 22px) {
  .pc-card__a { display: none; }
  .pc-card--back::before { inset: 2px; border-radius: 2px; }
}
/* الشايب: deep violet, a gold frame, the old man, the band. */
.pc-card--om {
  background: radial-gradient(120% 90% at 50% 30%, var(--pc-om-1), var(--pc-om-2));
  box-shadow: 0 calc(var(--pc-w) * 0.08) calc(var(--pc-w) * 0.22) calc(var(--pc-w) * -0.12) rgba(46, 16, 101, 0.7);
}
.pc-om__frame { position: absolute; inset: 4%; border: 1.5px solid var(--pc-gold); border-radius: calc(var(--pc-w) * 0.08); pointer-events: none; }
.pc-om__pic { position: absolute; inset: 9% 8% 21% 8%; display: block; }
.pc-om__art { display: block; width: 100%; height: 100%; }
.pc-om__band {
  position: absolute;
  inset: auto 4% 4% 4%;
  height: 17%;
  display: grid;
  place-items: center;
  border-top: 1px solid color-mix(in srgb, var(--pc-gold) 55%, transparent);
  color: var(--pc-gold);
  font-family: 'Cairo', var(--font);
  font-size: calc(var(--pc-w) * 0.15);
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}
@container (max-width: 42px) {
  .pc-om__band { display: none; }
  .pc-om__pic { inset: 10% 6%; }
}

/* A hand from across the table: a few backs fanned out. */
.pc-fan { position: relative; display: block; width: max(1.05rem, calc(1.05rem + (var(--of, 1) - 1) * 0.42rem)); height: calc(1.05rem * 1.42); }
.pc-fan__card { position: absolute; top: 0; left: calc(var(--k) * 0.42rem); transform: rotate(calc((var(--k) - (var(--of) - 1) / 2) * 7deg)); transform-origin: 50% 110%; }
/* A row of cards that overlaps to fit (pcFitRows). */
.pc-row { --pc-gap-natural: 4; min-width: 0; display: flex; justify-content: center; }
/* :not(:first-child) outweighs a card button's own margin: 0. */
.pc-row > :not(:first-child) { margin-left: var(--pc-gap, 0.25rem); }

/* The lobby: a fan of five cards over the options. */
.pc-lobby__cards { display: flex; justify-content: center; gap: 4px; margin: var(--sp-1) 0 var(--sp-2); }
.pc-lobby__cards .pc-card:nth-child(1) { transform: rotate(-12deg) translateY(4px); }
.pc-lobby__cards .pc-card:nth-child(2) { transform: rotate(-6deg); }
.pc-lobby__cards .pc-card:nth-child(4) { transform: rotate(6deg); }
.pc-lobby__cards .pc-card:nth-child(5) { transform: rotate(12deg) translateY(4px); }

/* --- Flights, signs, stamps --- */
.pc-ghost { position: fixed; left: 0; top: 0; z-index: var(--z-fx-ghost); pointer-events: none; transform-origin: center; will-change: transform; }
.pc-ghost__flip { position: relative; width: 100%; height: 100%; will-change: transform; }
.pc-ghost__face { position: absolute; inset: 0; }
.pc-ghost__face--b { opacity: 0; }
.pc-ghost .pc-card { box-shadow: var(--sh-3); }
.pc-hold { visibility: hidden; }
.pc-landed > .pc-card, .pc-landed.pc-card { animation: pc-land 380ms cubic-bezier(0.2, 1.4, 0.35, 1); }
@keyframes pc-land { 0% { transform: scale(0.9); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.pc-pop {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-pop);
  padding: 0.1em 0.5em;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-3);
  color: var(--text-strong);
  font-size: 1.15rem;
  font-weight: 900;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
}
.pc-pop--big { background: transparent; box-shadow: none; font-size: 2.1rem; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.pc-ring { position: fixed; z-index: var(--z-fx-ghost); border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.pc-ring--danger { border-color: var(--pc-call); border-width: 5px; }
.pc-ring--success { border-color: var(--success); border-width: 4px; }
.pc-ring--gold { border-color: var(--pc-gold); border-width: 5px; }
.pc-stamp {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-stamp);
  padding: 0.05em 0.45em 0.12em;
  border: 4px solid currentColor;
  border-radius: 0.35em;
  background: color-mix(in srgb, var(--surface-solid) 80%, transparent);
  color: var(--pc-call);
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  pointer-events: none;
}
.pc-stamp--success { color: var(--pc-true); }
body.dark .pc-stamp--success { color: #4ade80; }
body.dark .pc-stamp--danger, body.dark .pc-stamp { color: #fb7185; }
.pc-shout {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-top);
  padding: 0.12em 0.6em 0.2em;
  border-radius: var(--r-full);
  background: var(--pc-call);
  box-shadow: 0 10px 26px -8px rgba(200, 30, 58, 0.7);
  color: #fff;
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  pointer-events: none;
}
.pc-reveal { position: fixed; z-index: var(--z-fx-pop); display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.pc-reveal .pc-flip { width: var(--pc-w); height: calc(var(--pc-w) * 1.42); }
.pc-reveal .pc-card { box-shadow: var(--sh-3); }
.pc-flip { position: relative; display: inline-block; flex: none; }
.pc-flip__face { display: block; width: 100%; height: 100%; }
.pc-flip__back { position: absolute; inset: 0; }
.is-revealing .pc-flip__back { animation: pc-flip-back 420ms linear both; animation-delay: var(--at, 0ms); }
.is-revealing .pc-flip__face { animation: pc-flip-face 420ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes pc-flip-back { 0% { transform: scaleX(1); } 45% { transform: scaleX(0); } 100% { transform: scaleX(0); visibility: hidden; } }
@keyframes pc-flip-face { 0%, 45% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.pc-pop.is-tv { font-size: 4.6vmin; }
.pc-pop--big.is-tv { font-size: 8vmin; }
.pc-ring.is-tv { border-width: 0.7vmin; }
.pc-stamp.is-tv { font-size: 8vmin; border-width: 0.8vmin; }
.pc-shout.is-tv { font-size: 7vmin; }
.pc-podium { margin-bottom: var(--sp-3); }

/* --- The pieces both tables share: the head, the latest move, the seats, the bar --- */
.db-head, .om-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1); margin-bottom: var(--sp-2); }
.db-latest, .om-latest {
  margin: 0 0 var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
}
.db-latest.is-lie { background: var(--danger-soft); color: var(--danger-ink); }
.db-latest.is-true { background: var(--success-soft); color: var(--success-ink); }
.db-latest.is-new, .om-latest.is-new { animation: pc-latest-in 380ms var(--ease-out) both; }
@keyframes pc-latest-in { from { opacity: 0; transform: translateY(-0.4rem) scale(0.98); } }
.db-log, .om-log { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); padding: 0; list-style: none; }
.db-log li, .om-log li { padding: 0.35rem 0.7rem; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.db-opps, .om-opps {
  display: flex;
  gap: 6px;
  margin: 0 0 var(--sp-2);
  padding: 3px 2px 6px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.db-opps::-webkit-scrollbar, .om-opps::-webkit-scrollbar { display: none; }
.db-opps > :first-child, .om-opps > :first-child { margin-inline-start: auto; }
.db-opps > :last-child, .om-opps > :last-child { margin-inline-end: auto; }
.db-seat, .om-seat {
  position: relative;
  flex: none;
  min-width: 0;
  max-width: 11.5rem;
  min-height: 2.6rem;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px var(--sp-2) 3px 4px;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.db-avatar, .om-avatar {
  flex: none;
  width: 1.45rem;
  height: 1.45rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--pc-amber);
  color: #3b2a05;
  font-size: 0.75rem;
  font-weight: 900;
  line-height: 1;
}
.db-seat__who, .om-seat__who { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 4px; }
.db-seat__name, .om-seat__name { min-width: 0; max-width: 5rem; overflow: hidden; color: var(--text-strong); font-size: var(--fs-sm); font-weight: 800; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.db-seat__hand, .om-seat__hand { position: relative; flex: none; display: block; padding-inline-end: 0.55rem; }
.db-seat__n, .om-seat__n {
  position: absolute;
  z-index: 2;
  inset-block-end: -0.3rem;
  inset-inline-end: -0.2rem;
  min-width: 1.3rem;
  padding: 0.05rem 0.3rem;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: 0 0 0 1px var(--border), var(--sh-1);
  color: var(--text-strong);
  font-size: 0.8125rem;
  font-weight: 900;
  line-height: 1.25;
  text-align: center;
}
.db-seat.is-turn, .om-seat.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -10px var(--accent-glow); }
.db-seat.is-last { border-style: dashed; border-color: var(--pc-call); }
.om-seat.is-from { border-style: dashed; border-color: var(--accent); }
.db-seat.is-away, .om-seat.is-away { opacity: 0.6; }
.db-seat.is-out, .om-seat.is-out { background: var(--success-soft); border-color: transparent; }
.om-seat.is-loser { background: var(--warning-soft); border-color: var(--warning); }
.db-tag, .om-tag {
  flex: none;
  display: inline-block;
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 0.6875rem;
  font-weight: 900;
  line-height: 1.4;
  white-space: nowrap;
}
.db-tag--out, .om-tag--out { background: transparent; color: var(--success-ink); font-size: 0.8125rem; padding: 0; }
.db-tag--hot { background: var(--pc-call); color: #fff; }
.db-tag--play { background: var(--accent-soft); color: var(--accent-ink); }
.om-tag--turn { background: var(--accent); color: var(--accent-on); }
.om-tag--loser { background: transparent; padding: 0; font-size: 1rem; }
.db-note, .om-note { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-2) var(--sp-3); text-align: center; }
.db-prompt { margin: 0; color: var(--text-strong); font-size: var(--fs-h3); font-weight: 900; line-height: 1.35; text-align: center; }
.db-prompt.is-mine { color: var(--accent-ink); }
.db-hint, .om-hint { margin: 0; color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; line-height: 1.4; text-align: center; }
.db-actbar, .om-actbar {
  position: sticky;
  bottom: var(--sp-2);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-4);
  max-height: calc(var(--app-h, 100dvh) - 10rem);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.db-mine, .om-mine {
  position: relative;
  margin-bottom: var(--sp-3);
  padding: var(--sp-2) var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
}
.db-mine.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 28px -14px var(--accent-glow); }
.db-mine__head, .om-mine__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-2); }
.db-mine__title, .om-mine__title { color: var(--text-strong); font-size: var(--fs-sm); font-weight: 900; }
.db-mine__n, .om-mine__n { color: var(--accent-ink); font-size: 1rem; }

/* --- كدّاب: the table --- */
.db-layout, .om-layout { display: grid; grid-template-columns: minmax(0, 1fr); }
.db-layout { grid-template-areas: "center" "mine" "act" "log"; }
.db-layout > *, .om-layout > * { min-width: 0; }
.db-layout__center { grid-area: center; }
.db-layout__mine { grid-area: mine; }
.db-layout__act { grid-area: act; }
.db-layout__log { grid-area: log; }
.db-table {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3) var(--sp-3) var(--sp-3);
  border-radius: var(--r-xl);
  background: var(--accent-soft);
}
.db-bubble {
  max-width: 100%;
  padding: 0.35rem 0.9rem;
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
  box-shadow: var(--sh-1);
}
.db-bubble b { font-family: var(--font-display); font-weight: 800; }
.db-bubble.is-open { background: var(--accent); color: var(--accent-on); font-size: 1.05rem; box-shadow: 0 8px 18px -10px var(--accent-glow); }
.db-bubble.is-quiet { background: transparent; box-shadow: none; color: var(--accent-ink); }
.db-pilezone { display: flex; align-items: center; justify-content: center; gap: var(--sp-5); }
.db-pile { position: relative; display: block; width: var(--pc-w, 3.3rem); height: calc(var(--pc-w, 3.3rem) * 1.42); --pc-w: 3.3rem; }
.db-pile .pc-card { --pc-w: 3.3rem; }
.db-pile__card { position: absolute; inset: 0; transform: translate(calc(var(--k) * 2px), calc(var(--k) * -2px)) rotate(var(--tilt, 0deg)); }
.db-pile__empty { position: absolute; inset: 0; opacity: 0.18; filter: grayscale(1); }
.db-pileinfo { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
.db-pile__n { color: var(--text-2); font-size: var(--fs-sm); font-weight: 800; }
.db-pile__n b { color: var(--text-strong); font-size: 1.35rem; }
.db-rank { display: inline-flex; align-items: baseline; gap: 6px; padding: 0.2rem 0.7rem; border-radius: var(--r-full); background: var(--surface-solid); box-shadow: var(--sh-1); }
.db-rank__label { color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.db-rank b { color: var(--accent-ink); font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; }
.db-rank.is-open b { color: var(--text-3); font-size: var(--fs-sm); }
.db-plays { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.db-play { padding: 1px 8px; border-radius: var(--r-full); background: color-mix(in srgb, var(--surface-solid) 70%, transparent); color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.db-play.is-top { background: var(--surface-solid); color: var(--text-strong); box-shadow: 0 0 0 1px var(--accent-border); }
/* A call turned over, until the next play. */
.db-called { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.db-called__cards { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px 6px; }
.db-called__stamp {
  position: absolute;
  top: 50%;
  left: 50%;
  padding: 0 0.4em 0.08em;
  border: 3px solid currentColor;
  border-radius: 0.35em;
  background: color-mix(in srgb, var(--surface-solid) 78%, transparent);
  color: var(--pc-call);
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  transform: translate(-50%, -50%) rotate(-12deg);
}
.db-called.is-true .db-called__stamp { color: var(--pc-true); }
body.dark .db-called__stamp { color: #fb7185; }
body.dark .db-called.is-true .db-called__stamp { color: #4ade80; }
.db-called__line { margin: 0; color: var(--text-strong); font-size: var(--fs-sm); font-weight: 800; text-align: center; }
/* كدّاب!: big, red, for everyone but the one who played. */
.db-callbox { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); }
.db-callbtn {
  width: 100%;
  min-height: 3.6rem;
  border: 0;
  border-radius: var(--r-xl);
  background: linear-gradient(160deg, #ef4458, var(--pc-call) 70%);
  box-shadow: 0 5px 0 #8e1226, 0 12px 24px -10px rgba(200, 30, 58, 0.7);
  color: #fff;
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
.db-callbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #8e1226, 0 6px 14px -8px rgba(200, 30, 58, 0.7); }
.db-callbtn:disabled { opacity: 0.6; }
.db-callbox.is-hot .db-callbtn { animation: db-call-pulse 0.8s ease-in-out infinite alternate; }
@keyframes db-call-pulse { from { transform: scale(1); } to { transform: scale(1.03); } }
/* Your hand. */
.db-hand { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-3); padding-top: 1rem; }
.db-hand__row { --pc-gap-natural: 4; }
.db-hand__empty { color: var(--text-3); text-align: center; }
.db-hand .pc-card { --pc-w: 3.2rem; }
.db-hcard, .om-hcard {
  position: relative;
  flex: none;
  display: block;
  line-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: calc(var(--pc-w, 3.2rem) * 0.12);
  background: transparent;
  cursor: pointer;
  transition: transform var(--dur-2) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.db-hcard.is-sel { transform: translateY(-0.9rem); }
.db-hcard.is-sel .pc-card { box-shadow: 0 0 0 3px var(--accent), 0 10px 22px -8px var(--accent-glow); }
.db-hand .db-hcard.is-sent { translate: 0 -0.4rem; }
.db-hcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.db-ranks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.db-rankchip {
  min-height: 2.6rem;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--text-strong);
  font-family: 'Baloo Bhaijaan 2', var(--font);
  font-size: 1.15rem;
  font-weight: 800;
  cursor: pointer;
}
.db-rankchip.is-on { border-color: transparent; background: var(--accent); color: var(--accent-on); box-shadow: 0 6px 14px -8px var(--accent-glow); }
.db-actrow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--sp-2); }
.db-actrow .btn { padding-inline: var(--sp-2); }
/* The end. */
.db-won, .om-over { margin-bottom: var(--sp-3); text-align: center; }
.db-won__icon { font-size: 2.6rem; line-height: 1.1; }
.db-won .card__title { overflow-wrap: anywhere; }
.db-places { display: flex; flex-direction: column; gap: 4px; margin: 0 0 var(--sp-3); padding: 0; list-style: none; }
.db-places li { display: flex; align-items: center; gap: var(--sp-2); padding: 0.35rem 0.8rem; border-radius: var(--r-md); background: var(--surface-solid); border: 1px solid var(--border); }
.db-places__n { min-width: 1.6rem; color: var(--accent-ink); font-weight: 900; text-align: center; }
.db-places__name { font-weight: 800; color: var(--text-strong); overflow-wrap: anywhere; }

/* --- الشايب: the draw, the pairs, your hand --- */
.om-layout { grid-template-areas: "draw" "mine" "act" "mid" "log"; }
.om-layout__draw { grid-area: draw; }
.om-layout__mid { grid-area: mid; }
.om-layout__mine { grid-area: mine; }
.om-layout__act { grid-area: act; }
.om-layout__log { grid-area: log; }
.om-draw {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3) var(--sp-2) var(--sp-3);
  border-radius: var(--r-xl);
  background: var(--accent-soft);
}
.om-draw.is-mine { box-shadow: 0 0 0 2px var(--accent); }
.om-draw.is-victim { align-items: center; background: var(--warning-soft); }
.om-draw__title { margin: 0; color: var(--text-strong); font-size: var(--fs-h3); font-weight: 900; line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
.om-draw.is-mine .om-draw__title { color: var(--accent-ink); }
.om-backs { padding-top: 1.2rem; }
.om-backs .pc-card { --pc-w: 3.4rem; }
.om-back {
  position: relative;
  flex: none;
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  line-height: 0;
  background: transparent;
  border-radius: calc(var(--pc-w, 3.4rem) * 0.12);
  cursor: pointer;
  transition: transform 220ms cubic-bezier(0.3, 1.4, 0.4, 1);
  -webkit-tap-highlight-color: transparent;
}
span.om-back { cursor: default; }
.om-back.is-lifted { z-index: 2; transform: translateY(-1.1rem) rotate(-3deg); }
.om-back.is-lifted .pc-card { box-shadow: 0 0 0 3px var(--pc-gold), 0 14px 24px -8px rgba(180, 120, 0, 0.55); }
.om-back.is-sent { transform: translateY(-1.6rem) scale(1.04); }
.om-back:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.om-mid { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-2); border: 1px dashed var(--border-strong, var(--border)); border-radius: var(--r-xl); }
.om-mid__pairs { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; min-height: 3.1rem; }
.om-mid__empty { align-self: center; color: var(--text-3); font-size: var(--fs-sm); font-weight: 700; }
.om-pair { display: inline-flex; transform: rotate(var(--tilt, 0deg)); }
.om-pair > .pc-card + .pc-card { margin-left: calc(var(--pc-w) * -0.55); }

.db-tv__info, .om-tv__info { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: var(--tv-gap); overflow: hidden; text-align: center; }

.db-tv .badge, .om-tv .badge, .db-tvres .badge, .om-tvres .badge { height: auto; padding: 0.25em 0.7em; font-size: var(--tv-xs); }

.db-tv .db-table { flex: 1; min-height: 0; justify-content: center; margin: 0; gap: 2.4vmin; padding: 3vmin; border-radius: var(--tv-r); }

.db-tv .db-pile__n { font-size: var(--tv-sm); }
