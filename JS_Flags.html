<script>
/* ============================================================================
   خمّن الدولة — A COUNTRY FROM ITS FLAG, OR FROM HOW FAR YOU ARE
   ----------------------------------------------------------------------------
   Two ways to play. From the flag (6 guesses): the flag is shown, and a
   wrong guess says how far that country is from the answer and in which
   direction. By distance (8 guesses): nothing is shown at all, only the
   distance and the direction after each guess, like finding a place on a
   globe. A hint appears after a few misses: the continent, then the first
   letter. A third way, «جولة حول العالم» (a flag and four names, three
   hearts), is JS_FlagsTour.html: playMode 'tour' hands this file's paint,
   start and restore to it.

   The countries (COUNTRIES, with each one's place, continent and tier) are
   Countries.js, shared with the rooms server since a room plays this game
   too (JS_RoomSolve.html). Easy asks tier 1, hard any; the daily asks tiers
   1-2. FLAG_ALIASES lets a guess be typed the way people say it.

   A flag emoji is two "regional indicator" letters, which Windows draws as
   letters - "EG" would give the answer away. flagsEnsureFont checks whether
   this device draws flags and, if not, loads the Twemoji country flags font
   (pinned on jsDelivr, cached by the service worker) for .flag-emoji.
   appState.flags holds the game.
   ========================================================================= */

// COUNTRIES, FLAG_ALIASES, FLAG_MODES, flagEmoji, flagCountry, flagName and the distances are Countries.js,
// shared with the rooms server.

const FLAG_FONT_URL = 'https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.10/dist/TwemojiCountryFlags.woff2';
const FLAG_ARROWS = ['⬆️', '↗️', '➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️'];
let flagsFontAsked = false;

function flagsState() {
  if (!appState.flags) {
    appState.flags = { mode: 'flag', level: 'easy', daily: '', lang: 'ar', answer: '', guesses: [], phase: 'setup' };
  }
  return appState.flags;
}

/* --- Flags that draw as letters --------------------------------------------------------- */

function flagsDrawnAsEmoji(text) {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 1;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.textBaseline = 'top';
    ctx.font = '100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Android Emoji",sans-serif';
    ctx.scale(0.01, 0.01);
    const paint = (colour) => { ctx.clearRect(0, 0, 100, 100); ctx.fillStyle = colour; ctx.fillText(text, 0, 0); return ctx.getImageData(0, 0, 1, 1).data.join(','); };
    const white = paint('#fff'), black = paint('#000');
    return white === black && !black.startsWith('0,0,0,');
  } catch (e) {
    return true;
  }
}

/** Loads the flag font where the device can't draw flags. Resolves true once flags will show. */
function flagsEnsureFont() {
  if (flagsFontAsked) return flagsFontAsked;
  if (flagsDrawnAsEmoji('\u{1F60A}') && !flagsDrawnAsEmoji('\u{1F1EA}\u{1F1EC}')) {
    const style = document.createElement('style');
    style.textContent = `@font-face { font-family: "Twemoji Country Flags"; unicode-range: U+1F1E6-1F1FF; src: url('${FLAG_FONT_URL}') format('woff2'); font-display: block; }`;
    document.head.appendChild(style);
    flagsFontAsked = document.fonts && document.fonts.load
      ? document.fonts.load('1em "Twemoji Country Flags"', '\u{1F1EA}\u{1F1EC}').then(list => list.length > 0).catch(() => false)
      : Promise.resolve(false);
  } else {
    flagsFontAsked = Promise.resolve(true);
  }
  return flagsFontAsked;
}

/* --- Setup ------------------------------------------------------------------------------------ */

function setupFlags() {
  setView('setup-flags');
}

function paintFlagsSetup() {
  const s = flagsState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#flags-mode .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.mode));
  document.querySelectorAll('#flags-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  // «جولة حول العالم» (JS_FlagsTour.html) has no level: its stages are the tiers, and its best is a run.
  const tour = s.mode === 'tour';
  const levelField = document.getElementById('flags-level-field');
  if (levelField) levelField.classList.toggle('hidden', tour);
  const tourHint = document.getElementById('flags-tour-hint');
  if (tourHint) { tourHint.classList.toggle('hidden', !tour); tourHint.textContent = tour ? fltT().hint : ''; }
  const tourBest = document.getElementById('flags-tour-best');
  if (tourBest) { tourBest.classList.toggle('hidden', !tour); tourBest.textContent = tour && typeof flagTourBestText === 'function' ? flagTourBestText() : ''; }
  const best = soloBest('flags', s.mode + ':' + s.level);
  const el = document.getElementById('flags-best');
  if (el) el.textContent = best && !tour ? `${t.solo_best || ''}: ${best.guesses} ${t.flags_tries || ''}` : '';
  const cont = document.getElementById('flags-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('flags-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('flags', 'startFlags(true)');
  flagsEnsureFont();
}

function setFlagsMode(mode) {
  flagsState().mode = FLAG_MODES[mode] || mode === 'tour' ? mode : 'flag';
  saveToLocal();
  paintFlagsSetup();
}

function setFlagsLevel(level) {
  flagsState().level = level === 'hard' ? 'hard' : 'easy';
  saveToLocal();
  paintFlagsSetup();
}

// A game with a guess made: a new one asks first (soloConfirmNew).
const flagsHasWork = (s) => (s.guesses || []).length > 0
  || !!(s.playMode === 'tour' && s.tour && (s.tour.score > 0 || s.tour.hearts < FLAG_TOUR_HEARTS));

function startFlags(daily, sure) {
  if (!daily && flagsState().mode === 'tour') { startFlagTour(sure); return; }
  if (!sure && soloConfirmNew('flags', flagsHasWork, () => startFlags(daily, true))) return;
  if (daily && soloDailyResume('flags')) return;
  soloDailySetAside('flags');
  soloNewGame('flags');
  const s = flagsState();
  const mode = daily ? 'flag' : s.mode;
  const level = daily ? 'daily' : s.level;
  const pool = COUNTRIES.filter(c => level === 'easy' ? c.tier === 1 : (level === 'daily' ? c.tier <= 2 : true));
  const answer = daily
    ? soloDailyCycle('flags', pool)[0]
    : freshPick('flags:' + level, pool, 1, { key: c => c.code })[0];
  Object.assign(s, {
    daily: daily ? soloToday() : '', playMode: mode, playLevel: level, lang: contentLang() === 'en' ? 'en' : 'ar',
    answer: answer.code, guesses: [], query: '', phase: 'play', startedAt: Date.now()
  });
  saveToLocal();
  setView('play-flags');
  paintFlags();
  flagsEnsureFont();
}

function continueFlags() {
  if (flagsState().phase !== 'play') return;
  setView('play-flags');
  paintFlags();
}

/* --- Play ----------------------------------------------------------------------------------------- */

// The continent (it glows on the map, JS_FlagsMap.html, with its chip) after 3 misses from the flag, 4 by distance.
const flagsContAt = (s) => (s.playMode === 'flag' ? 3 : 4);

function flagsHints(s, t) {
  const target = flagCountry(s.answer);
  const misses = s.guesses.length;
  const hints = [];
  const letterAt = s.playMode === 'flag' ? 5 : 6;
  if (misses >= letterAt) hints.push(`🔤 ${escapeHTML(flagName(target, s.lang).replace(/^ال/, '').charAt(0))}…`);
  return hints;
}

/**
 * The game as one card: the level and the guesses left as two chips, the flag
 * (or the compass, by distance), the question and its hints, then the field
 * «اسم الدولة» with «خمّن» (it guesses the first suggestion, as Enter does) and
 * the suggestions under it, and the guesses on the map (JS_FlagsMap.html). «خروج»
 * (and «العب تاني» once it is over) in the bar at the foot.
 */
function paintFlags(freshIndex) {
  const s = flagsState();
  if (s.playMode === 'tour') { paintFlagTour(); return; }
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('flags-stage');
  const target = flagCountry(s.answer);
  if (!el || !target) return;
  const max = FLAG_MODES[s.playMode].guesses;
  const over = s.phase !== 'play';
  const hints = over ? [] : flagsHints(s, t);
  const showFlag = s.playMode === 'flag' || over;
  // A past day from the archive is dealt at the daily's level, which has no
  // name of its own: its 📅 badge below says what it is, so no empty «المستوى».
  const levelName = t['solo_lvl_' + s.playLevel];
  const levelChip = s.daily
    ? `<span class="chip chip--plain play-chip">📅 <b>${escapeHTML(t.daily_title || '')}</b></span>`
    : levelName ? `<span class="chip chip--plain play-chip">${escapeHTML(t.solo_level || '')} <b>${escapeHTML(levelName)}</b></span>` : '';
  const archive = s.archive ? `<span class="badge badge--warning">📅 ${escapeHTML(t.daily_archive_badge || '')} ${escapeHTML(s.archive)}</span>` : '';
  // The map (the owner's look ج): each guess a pin and a callout, the continent glowing from the
  // hint's turn, and at the end the answer's gold pin; a reload draws it all again, still.
  const contAt = flagsContAt(s);
  const glow = over || s.guesses.length >= contAt ? target.cont : '';
  const fresh = typeof freshIndex === 'number' ? freshIndex : -1;
  const map = fmapHtml({ pins: fmapGuessPins(s.guesses, { answer: s.answer, over: over, fresh: fresh, lang: s.lang }), calls: true, glow: glow, anim: fresh >= 0 && !motionOff() })
    + fmapSumHtml(s.guesses, s.answer, s.lang);
  const contChip = !over && glow ? fmapHintHtml(glow, fresh === contAt - 1) : '';
  el.innerHTML = `
    <div class="flg">
      <div class="card flg-card">
        <div class="flg-head">
          ${levelChip}${archive}
          <span class="chip chip--plain play-chip">${escapeHTML(t.flags_left || '')} <b class="metric" id="flags-left">${max - s.guesses.length}</b></span>
        </div>
        <div class="flg-target${over ? ' is-over' : ''}">
          ${showFlag ? `<span class="flag-emoji flg-target__flag" id="flags-flag">${flagEmoji(s.answer)}</span>` : `<span class="flg-target__flag" aria-hidden="true">🧭</span>`}
          <span class="flg-target__ask">${over ? `<b>${escapeHTML(flagName(target, s.lang))}</b>` : escapeHTML(s.playMode === 'flag' ? (t.flags_ask_flag || '') : (t.flags_ask_far || ''))}</span>
          ${contChip}${hints.length ? `<span class="flags-hints">${hints.join(' · ')}</span>` : ''}
        </div>
        ${over ? '' : `
          <div class="flg-entry">
            <label class="field__label" for="flags-query">${escapeHTML(t.flags_name_label || '')}</label>
            <div class="gn-entry">
              <input type="text" id="flags-query" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
                dir="auto" placeholder="${escapeHTML(t.flags_name_label || '')}" aria-controls="flags-suggest" value="${escapeHTML(s.query || '')}"
                oninput="flagsSuggest(this.value)" onkeydown="flagsKey(event)">
              <button type="button" class="btn btn--primary btn--auto gn-entry__go" onclick="flagsPickFirst()">${escapeHTML(t.gn_guess_btn || '')}</button>
            </div>
            <div class="flags-suggest" id="flags-suggest" onkeydown="flagsKey(event)"></div>
          </div>`}
        <div class="flg-guesses fmap-card" id="flags-guesses" aria-label="${escapeHTML(t.gn_your_guesses || '')}">${map}</div>
      </div>
      <div class="view-actions talk__actions flg-actions">
        ${over ? `<button type="button" class="btn btn--primary btn--lg" onclick="startFlags(false)">${escapeHTML(t.play_again || '')}</button>` : ''}
        <div class="talk__pair">
          <button class="btn btn--ghost btn--sm" onclick="setupFlags()">${escapeHTML(t.exit || '')}</button>
        </div>
      </div>
    </div>`;
  if (!over) flagsSuggest(s.query || '', true);
  fmapMount(el);
  if (fresh >= 0) fmapCountKm(el);
}

function flagsMatches(query) {
  const s = flagsState();
  const q = foldWord(query);
  if (!q) return [];
  const taken = new Set(s.guesses.map(g => g.code));
  const scored = [];
  COUNTRIES.forEach(c => {
    if (taken.has(c.code)) return;
    const names = [c.ar, c.en].concat((FLAG_ALIASES[c.code] || '').split('|').filter(Boolean)).map(foldWord);
    let score = 0;
    names.forEach(n => {
      if (n === q) score = Math.max(score, 3);
      else if (n.indexOf(q) === 0) score = Math.max(score, 2);
      else if (q.length >= 2 && n.indexOf(q) !== -1) score = Math.max(score, 1);
    });
    if (score) scored.push({ c: c, score: score });
  });
  return scored.sort((a, b) => b.score - a.score || a.c.tier - b.c.tier || flagName(a.c, s.lang).localeCompare(flagName(b.c, s.lang))).slice(0, 6).map(x => x.c);
}

function flagsSuggest(query, keep) {
  const s = flagsState();
  s.query = query;
  const box = document.getElementById('flags-suggest');
  if (!box) return;
  const list = flagsMatches(query);
  box.innerHTML = list.map(c => `
    <button type="button" class="flags-chip" onclick="guessFlags('${c.code}')">
      <span class="flag-emoji" aria-hidden="true">${s.playMode === 'flag' ? '' : flagEmoji(c.code)}</span>${escapeHTML(flagName(c, s.lang))}</button>`).join('')
    || (query && foldWord(query) ? `<span class="field__hint">${escapeHTML((TRANSLATIONS[appState.lang] || {}).flags_none || '')}</span>` : '');
  if (!keep) saveToLocal();
}

/* The keyboard: Enter in the field guesses the first suggestion; the arrows walk from the
   field into the suggestions and along them (each is a button, so Enter picks it), and up
   from the first goes back to the field. */
function flagsKey(e) {
  const input = document.getElementById('flags-query');
  const chips = [...document.querySelectorAll('#flags-suggest .flags-chip')];
  const at = chips.indexOf(document.activeElement);
  if (e.key === 'Enter' && e.target === input) { e.preventDefault(); flagsPickFirst(); return; }
  const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  if (!step || !chips.length) return;
  e.preventDefault();
  const next = at === -1 ? (step > 0 ? 0 : -1) : at + step;
  if (next < 0) { if (input) input.focus(); return; }
  chips[Math.min(next, chips.length - 1)].focus();
}

function flagsPickFirst() {
  const first = flagsMatches(flagsState().query || '')[0];
  if (first) guessFlags(first.code);
}

function guessFlags(code) {
  const s = flagsState();
  const t = TRANSLATIONS[appState.lang];
  const guess = flagCountry(code), target = flagCountry(s.answer);
  if (s.phase !== 'play' || !guess || s.guesses.some(g => g.code === code)) return;
  const km = flagsDistance(guess, target);
  s.guesses.push({ code: code, km: km, deg: flagsBearing(guess, target), p: code === s.answer ? 100 : flagsProximity(km) });
  s.query = '';
  const won = code === s.answer;
  const lost = !won && s.guesses.length >= FLAG_MODES[s.playMode].guesses;
  if (won || lost) s.phase = 'done';
  saveToLocal();
  haptic(won ? 'light' : 'medium');
  playSound(won ? 'success' : (lost ? 'miss' : 'click'));
  paintFlags(s.guesses.length - 1);
  const input = document.getElementById('flags-query');
  if (input && !won && !lost && window.matchMedia && window.matchMedia('(pointer: fine)').matches) input.focus();
  if (won || lost) flagsFinish(won);
}

function flagsFinish(won) {
  const s = flagsState();
  const t = TRANSLATIONS[appState.lang];
  // Read now: the sheet opens later, and a new game may have replaced these by then.
  const answer = s.answer;
  const target = flagCountry(answer);
  const max = FLAG_MODES[s.playMode].guesses;
  const tries = s.guesses.length;
  const key = s.playMode + ':' + s.playLevel;
  const rec = won && !s.daily && !s.archive ? soloRecord('flags', key, { guesses: tries }, (a, b) => a.guesses < b.guesses) : { record: false, prev: soloBest('flags', key) };
  const squares = (p) => {
    const full = Math.floor(p / 20);
    const half = p % 20 >= 10 && full < 5 ? 1 : 0;
    return '🟩'.repeat(full) + '🟨'.repeat(half) + '⬜'.repeat(5 - full - half);
  };
  const lines = s.guesses.map(g => g.code === s.answer ? `${squares(100)} 🎉` : `${squares(g.p)} ${FLAG_ARROWS[Math.round(g.deg / 45) % 8]}`);
  let share = '';
  if (s.daily) {
    soloMarkDaily('flags', { won: won, guesses: tries }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🌍 ${t.setup_flags || ''} ${won ? tries : 'X'}/${max}\n${lines.join('\n')}`;
  }
  const detail = [`<span class="flag-emoji">${flagEmoji(answer)}</span> ${escapeHTML(flagName(target, s.lang))}`];
  if (rec.prev && !rec.record && won) detail.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.guesses}`);
  // The share picture: no country and no flag for a daily (🌍), and never the sheet's markup as its icon.
  const shareLines = s.daily ? detail.slice(1) : detail;
  const shareIcon = s.daily ? '🌍' : flagEmoji(answer);
  const flag = document.getElementById('flags-flag');
  if (flag && flag.animate && !motionOff()) flag.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25) rotate(-6deg)' }, { transform: 'none' }], { duration: 600, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  soloLater('flags', motionOff() ? 0 : 900, () => soloResult({
    icon: `<span class="flag-emoji">${flagEmoji(answer)}</span>`,
    title: won ? (rec.record ? (t.solo_new_best || '') : (t.flags_won || '')) : (t.flags_lost || ''),
    valueText: won ? `${tries}/${max}` : `X/${max}`, valueLabel: t.flags_tries || '', lines: detail, shareLines: shareLines, shareIcon: shareIcon, win: won, share: share,
    again: () => startFlags(false), exit: setupFlags
  }));
}

function restoreFlags() {
  const s = flagsState();
  if (s.playMode === 'tour') return restoreFlagTour();
  if (!s.answer || (s.phase !== 'play' && s.phase !== 'done')) return false;
  paintFlags();
  flagsEnsureFont();
  return true;
}

soloRegister('flags', {
  setup: 'setup-flags', play: 'play-flags', paintSetup: paintFlagsSetup, restore: restoreFlags,
  state: flagsState, resume: continueFlags, repaint: () => paintFlags(), prefs: ['mode', 'level']
});

/* Flags also come up outside this game (the emoji riddles, the streak, دوري المعرفة's
   Egypt column), and Windows draws each as two letters. The font's unicode-range is only
   the regional letters, and --font names it after Cairo, so it is asked for once at start-up
   and every flag in the app draws. */
if (typeof document !== 'undefined') {
  const flagsFont = () => { try { flagsEnsureFont(); } catch (e) {} };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', flagsFont); else flagsFont();
}
</script>
