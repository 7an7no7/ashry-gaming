/** A ball on the lane: this phone's own (played as the finger lifts) or anyone's from the server. */
function bowlRoomPlay(state, last, own) {
  const stage = bowlRoom.root && bowlRoom.root.querySelector('[data-bowl-stage]');
  bowlRoom.busy = true;
  bowlRoom.playing = { seq: last.seq || 0, pid: last.pid };
  bowlGfx.loud = bowlRoom.tv || !roomHasScreen() || last.pid === Room.me;
  bowlGfxInput(false);
  bowlRoomPaint(state);
  const key = bowlRoom.key;
  bowlGfxThrow(last.before, last.shot).then(sim => {
    if (!sim || key !== bowlRoom.key) return;
    if (own) return bowlRoomOwnLanded(sim);
    bowlRoomLanded(last);
  });
}

/** This phone's own ball has settled: wait for the server's word on it, then carry on as for anyone's. */
function bowlRoomOwnLanded(sim) {
  const key = bowlRoom.key;
  const mine = bowlRoom.mine;
  const check = () => {
    if (key !== bowlRoom.key || bowlRoom.mine !== mine) return true;
    const st = Room.state;
    const s = bowlShared(st);
    const last = s.last;
    if (last && last.pid === Room.me && last.seq > bowlRoom.shownSeq && mine && s.throwSeq >= last.seq) {
      bowlRoom.mine = null;
      // The clock or the host threw for this phone a moment before the finger did: show that ball instead.
      if (JSON.stringify(bowlCleanShot(mine.shot)) !== JSON.stringify(last.shot) || s.throwSeq > last.seq) {
        bowlRoom.busy = false;
        bowlRoom.playing = null;
        bowlRoomNext();
        return true;
      }
      bowlRoomLanded(last);
      return true;
    }
    return false;
  };
  if (check()) return;
  let tries = 0;
  const wait = () => {
    if (check()) return;
    if (++tries > 40) {
      // No answer (refused, or lost): show where the game really is.
      bowlRoom.mine = null;
      bowlRoom.busy = false;
      bowlRoom.playing = null;
      bowlRoom.shownSeq = bowlShared(Room.state).throwSeq || 0;
      bowlRoomNext();
      return;
    }
    setTimeout(wait, 150);
  };
  setTimeout(wait, 150);
}

/** The pins have fallen: the verdict, the sheet moves on, the lane is set for the next ball. */
function bowlRoomLanded(last) {
  const state = Room.state;
  if (!state) return;
  const key = bowlRoom.key;
  const stage = bowlRoom.root && bowlRoom.root.querySelector('[data-bowl-stage]');
  bowlRoom.shownSeq = last.seq;
  bowlRoom.playing = null;
  if (!bowlRoom.cardsAt[last.seq]) { bowlRoom.cardsAt[last.seq] = bowlClone(bowlShared(state).cards); bowlRoom.turnAt[last.seq] = bowlClone(bowlShared(state).turn); }
  bowlRoomPaint(state);
  const up = (last.before || []).filter(Boolean).length;
  const who = last.pid === Room.me && !state.youAreScreen ? '' : last.name;
  const sub = [who, last.auto ? bowlT('bowl_auto') : ''].filter(Boolean).join(' · ');
  bowlBanner(stage, last.kind, last.down, up, sub);
  bowlCelebrate(stage, last.kind, bowlGfx.loud);
  const turn = bowlRoom.turnAt[last.seq];
  const cards = bowlRoom.cardsAt[last.seq] || {};
  if (!turn || !turn.pid || !cards[turn.pid]) {
    // That was the last ball of the game: its word, then the frame redraws as the result.
    setTimeout(() => {
      if (key !== bowlRoom.key) return;
      bowlRoom.busy = false;
      const st = Room.state;
      if (st && st.game === 'bowling') routeRoomState(st);
    }, last.kind === 'strike' ? 2000 : 1500);
    return;
  }
  const next = cards[turn.pid].standing;
  const fresh = next.every(Boolean);
  bowlGfxSet(next, { fresh, hold: last.kind === 'strike' ? 1100 : 700 }).then(() => {
    if (key !== bowlRoom.key) return;
    bowlRoom.busy = false;
    bowlRoomNext();
  });
}

/** A swipe on this phone, on its own turn: played at once, sent to the server. */
function bowlRoomShot(shot) {
  const state = Room.state;
  if (!state || state.game !== 'bowling' || bowlRoom.busy || !bowlRoomMyTurn(state)) return;
  const s = bowlShared(state);
  const before = ((s.cards || {})[Room.me] || {}).standing;
  if (!before) return;
  bowlRoom.mine = { turnSeq: s.turnSeq, at: Date.now(), shot: shot };
  bowlRoomPlay(state, { seq: (s.throwSeq || 0) + 1, pid: Room.me, before: before.slice(), shot: shot }, true);
  Promise.resolve(roomAct('throw', Object.assign({ seq: s.turnSeq }, shot)));
}

/** No 3D on this phone: a plain ball down the middle, so the game never waits on it. */
function bowlRoomPlain() {
  const state = Room.state;
  if (!state || !bowlRoomMyTurn(state)) return;
  roomAct('throw', Object.assign({ seq: bowlShared(state).turnSeq }, bowlGentleShot()));
}

function bowlRoomSkip() {
  const s = bowlShared(Room.state);
  roomAct('skipTurn', { seq: s.turnSeq });
}

/** The host's way past a phone that went quiet: gone, or holding the turn 40 seconds after the lane was set. */
function bowlHostButtons(state) {
  const s = bowlShared(state);
  if (!state.youAreHost || s.phase !== 'play' || !s.turn || !s.turn.pid) return [];
  const p = (state.players || []).find(x => x.id === s.turn.pid);
  const key = state.code + '|' + s.turnSeq;
  if (bowlRoom.hostKey !== key) {
    bowlRoom.hostKey = key;
    bowlRoom.turnSince = Math.max(Date.now(), s.readyAt || 0);
    clearTimeout(bowlRoom.hostTimer);
    bowlRoom.hostTimer = setTimeout(() => { const st = Room.state; if (st && st.game === 'bowling') bowlRoomHost(st); }, Math.max(0, bowlRoom.turnSince + 40500 - Date.now()));
  }
  const quiet = !p || !p.online || Date.now() - bowlRoom.turnSince > 40000;
  if (!quiet || s.turn.pid === Room.me) return [];
  return [['⏭️ ' + bowlT('bowl_play_for', { name: p ? p.name : '' }), 'bowlRoomSkip()']];
}

function bowlRoomHost(state) {
  const root = bowlRoom.root;
  const box = root && root.querySelector('[data-bowl-host]');
  if (!box) return;
  const buttons = bowlHostButtons(state);
  const html = bowlRoom.tv ? buttons.map(b => tvBtn(b[0], b[1], 'ghost')).join('') : roomHostRow(buttons);
  if (box._html !== html) { box.innerHTML = html; box._html = html; }
}

function bowlStopClock() {
  if (bowlRoom.clock) bowlRoom.clock.stop();
  bowlRoom.clock = null;
  bowlRoom.clockKey = null;
}

/** The turn clock: counted from when the lane is set again; the server throws for the player when it runs out. */
function bowlTickClock(state) {
  const s = bowlShared(state);
  const endsAt = s.phase === 'play' ? s.endsAt : null;
  const secs = (s.settings || {}).clock || 0;
  const paint = () => {
    const left = endsAt ? Math.max(0, Math.min(secs, Math.ceil((endsAt - Date.now()) / 1000))) : 0;
    document.querySelectorAll('[data-bowl-clock]').forEach(el => {
      el.hidden = !endsAt;
      el.textContent = '⏱️ ' + left;
      el.classList.toggle('badge--danger', left <= 5);
      el.classList.toggle('badge--accent', left > 5);
    });
    return left;
  };
  if (!endsAt) { paint(); bowlStopClock(); return; }
  paint();
  if (bowlRoom.clockKey === endsAt && bowlRoom.clock) return;
  bowlStopClock();
  bowlRoom.clockKey = endsAt;
  bowlRoom.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)),
    onTick: () => {
      const left = paint();
      const st = Room.state;
      if (left > 0 && left <= 5 && st && st.game === 'bowling' && bowlShared(st).endsAt === endsAt && (st.youAreScreen || bowlRoomMyTurn(st))) playSound('tick');
    },
    onEnd: () => { bowlRoom.clock = null; paint(); }
  });
}

/**
 * The result takes the screen once the last ball has been seen: while it is still rolling
 * here (or about to be replayed) the lane stays.
 */
function bowlRoomOver(state) {
  const s = bowlShared(state);
  bowlRoomRemember(state);
  return s.phase === 'gameover' && !bowlRoom.busy && bowlRoom.shownSeq >= (s.throwSeq || 0);
}

/** Everything the frame itself shows (the rest is painted in place). */
function bowlRoomSig(state) {
  const s = bowlShared(state);
  const over = bowlRoomOver(state);
  return [s.dealId || '', over ? 'over' : 'lane', state.youAreHost, appState.lang, Room.me,
    (s.order || []).join(','), (state.players || []).map(p => p.id + ':' + p.name).join(','),
    over ? JSON.stringify(s.board || []) : ''].join('|');
}

/** The end of a game: the podium, everyone's sheet, and the host's way on. */
function bowlOverHtml(state, tv) {
  const s = bowlShared(state);
  const podium = renderPodium(state, s.board);
  const sheets = bowlRoomListHtml(state, s.cards || {}, null);
  const t = TRANSLATIONS[appState.lang] || {};
  if (tv) {
    return `<div class="bowl-tv-over" data-accent="violet">
        <div class="tv-title tv-center-text">🏆 ${escapeHTML(bowlT('bowl_over_title'))}</div>
        ${podium || `<div class="tv-scale">${renderScoreboard(s.board)}</div>`}
        <div class="bowl-list bowl-list--tv">${sheets}</div>
        ${state.youAreHost ? `<div class="tv-actions">${tvBtn(t.play_again, "roomAct('playAgain')")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>` : ''}
      </div>`;
  }
  return `<div class="bowl-room bowl-room--over">
      ${podium || renderScoreboard(s.board)}
      <div class="bowl-list">${sheets}</div>
      ${state.youAreHost
        ? `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('playAgain')">${escapeHTML(bowlT('play_again'))}</button>
           <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(bowlT('room_another_game'))}</button></div>`
        : `<div class="waiting-note">${escapeHTML(bowlT('room_wait_host'))}</div>`}
      ${typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, s.board) : ''}
      ${renderRoomPlayerStrip(state)}
    </div>`;
}

function bowlPlayHtml(state, tv) {
  const s = bowlShared(state);
  const watching = !tv && !(s.cards || {})[Room.me];
  if (tv) {
    return `<div class="bowl-tv" data-accent="violet">
        ${bowlStageHtml({ tv: true })}
        <div class="bowl-tv__side">
          <div class="bowl-list bowl-list--tv" data-bowl-list></div>
          <div class="tv-actions" data-bowl-host></div>
        </div>
      </div>`;
  }
  return `<div class="bowl-room">
      ${bowlStageHtml()}
      <div class="bowl-room__side">
        ${watching ? `<p class="field__hint bowl-watching">${escapeHTML(bowlT('bowl_watching'))}</p>` : ''}
        <div class="bowl-list" data-bowl-list></div>
        <div data-bowl-host></div>
        ${renderRoomPlayerStrip(state)}
      </div>
    </div>`;
}

/** After a frame is (re)drawn, or a new state: the lane into it, and on with the balls. */
function bowlRoomAfter(state, root, tv, rebuilt) {
  bowlRoom.root = root;
  bowlRoom.tv = !!tv;
  bowlRoomRemember(state);
  bowlTickClock(state);
  if (bowlRoomOver(state)) {
    bowlGfxCancel();
    return;
  }
  bowlRoomHost(state);
  const stage = root.querySelector('[data-bowl-stage]');
  if (!stage) return;
  if (rebuilt || !bowlGfx.canvas || bowlGfx.canvas.parentNode !== stage.querySelector('[data-bowl-canvas]')) {
    bowlGfxMount(stage, () => { const st = Room.state; if (st) bowlRoomAfter(st, root, tv, true); }).then(ok => {
      if (Room.state && bowlRoom.root === root) {
        if (ok) { bowlRoom.idleKey = ''; bowlRoomNext(); } else bowlRoomPaint(Room.state);
      }
    });
    bowlRoomPaint(state);
    return;
  }
  if (!bowlRoom.busy) bowlRoomNext();
  else bowlRoomPaint(state);
}

ROOM_GAMES.bowling = {
  // Someone who joins in the middle watches the lane, and bowls the next game.
  lateJoin: true,

  // A ball is not a new step to scroll to; the end of the game is drawn from the top.
  actionKey(state) {
    const s = bowlShared(state);
    return s.phase === 'gameover' ? [state.code, s.dealId, s.phase].join('|') : '';
  },

  lobbyOptions(state) {
    const o = bowlOpts();
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(bowlT('bowl_lobby_hint'))}</p>`;
    const seg = (label, key, values, current, hint) => `<div class="field">
        <label class="field__label">${escapeHTML(label)}</label>
        <div class="segmented" role="group">${values.map(v => `<button type="button" class="segmented__item ${String(v[0]) === String(current) ? 'is-active' : ''}" onclick="bowlRoomOptsSet('${key}', ${v[0]})">${escapeHTML(v[1])}</button>`).join('')}</div>
        ${hint ? `<p class="field__hint">${escapeHTML(hint)}</p>` : ''}
      </div>`;
    return `<div class="card card--tight">
        ${seg(bowlT('bowl_frames'), 'frames', BOWL_FRAME_OPTIONS.map(n => [n, String(n)]), o.frames)}
        <div class="field">
          <label class="switch-row" for="bowl-room-guide">
            <span class="field__label">${escapeHTML(bowlT('bowl_guide'))}</span>
            <span class="switch"><input type="checkbox" id="bowl-room-guide" role="switch" ${o.guide ? 'checked' : ''} onchange="bowlRoomOptsSet('guide', this.checked)"><span class="switch__track" aria-hidden="true"></span></span>
          </label>
          <p class="field__hint">${escapeHTML(bowlT('bowl_guide_hint'))}</p>
        </div>
        ${seg('⏱️ ' + bowlT('bowl_clock'), 'clock', BOWL_CLOCK_OPTIONS.map(v => [v, v ? v + '″' : bowlT('gw_clock_off')]), o.clock, bowlT('bowl_clock_hint'))}
      </div>`;
  },

  startPayload() {
    const o = bowlOpts();
    return { frames: o.frames, guide: o.guide, clock: o.clock };
  },

  render(state) {
    if (appState.currentView !== 'room-bowling') setView('room-bowling');
    const el = document.getElementById('view-room-bowling');
    if (!el) return;
    const s = bowlShared(state);
    if (!s.settings || !s.cards) return;
    const over = bowlRoomOver(state);
    const rebuilt = renderRoomFrame(el, bowlRoomSig(state), () => (over ? bowlOverHtml(state, false) : bowlPlayHtml(state, false)));
    refreshRoomPlayerStrip(el, state);
    bowlRoomAfter(state, el, false, rebuilt);
    if (rebuilt && over && typeof duelOnce === 'function' && duelOnce(['bowl-over', state.code, s.dealId].join('|')) && (s.winners || []).indexOf(Room.me) !== -1) {
      afterReveal(el, () => { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 85 }); });
    }
  }
};

onRoomClocksReset(() => {
  bowlStopClock();
  clearTimeout(bowlRoom.hostTimer);
  const st = Room.state;
  // Out of bowling (the hub, another game, the room gone): the lane's memory goes with it.
  if (!st || st.game !== 'bowling' || st.phase === 'lobby') {
    bowlRoom.key = '';
    bowlRoom.root = null;
    bowlRoom.busy = false;
    if (appState.currentView !== 'play-bowling') bowlGfxDispose();
  }
});

TV_GAMES.bowling = {
  sig: (state) => bowlRoomSig(state),
  frame(state, t) {
    const s = bowlShared(state);
    if (!s.settings || !s.cards) return tvLookAtPhones(t);
    return bowlRoomOver(state) ? bowlOverHtml(state, true) : bowlPlayHtml(state, true);
  },
  after(state, rebuilt) {
    const view = document.getElementById('view-room-tv');
    if (!view) return;
    bowlRoomAfter(state, view, true, rebuilt);
    const s = bowlShared(state);
    if (rebuilt && bowlRoomOver(state) && typeof duelOnce === 'function' && duelOnce(['bowl-tv-over', state.code, s.dealId].join('|'))) {
      afterReveal(view, () => { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 160, spread: 90 }); });
    }
  }
};

/* --- leaving: the lane is thrown away with the screen that showed it ---------------------- */

onLeaveScreen((from, to) => {
  const lane = (v) => v === 'play-bowling' || v === 'room-bowling' || v === 'room-tv';
  if (!lane(from) || lane(to)) return;
  bowlSolo.gen++;
  bowlSolo.busy = false;
  bowlSolo.shown = null;
  bowlStopClock();
  bowlRoom.root = null;
  bowlRoom.busy = false;
  bowlRoom.key = '';
  bowlGfxDispose();
});

onLanguageChange((view) => {
  if (view === 'play-bowling') { const st = bowlSoloStage(); if (st) { const sh = st.querySelector('[data-bowl-sheet]'); if (sh) sh._html = ''; } bowlSoloHud(); }
});

document.addEventListener('visibilitychange', () => {
  // Back on the page: a room screen catches up with any ball it missed.
  if (!document.hidden && bowlRoom.root && Room.state && Room.state.game === 'bowling' && !bowlRoom.busy) bowlRoomNext();
});
</script>
