  if (laserHurt(s).indexOf(Room.me) !== -1) return { text: L.laser_v_hurt + ' ' + Math.max(0, ((s.hearts || {})[Room.me] || 1) - 1), cls: 'hurt' };

function laserPracticeLine(state) {
  const s = state.shared || {}, L = laserT();

  const kills = s.roundKills || [];
  const who = (ids) => ids.filter((id, i, a) => a.indexOf(id) === i).map(id => `<b style="color:${laserColour(s, id)}">${escapeHTML(laserName(state, id))}</b>`).join(appState.lang === 'en' ? ', ' : '، ');
  const by = kills.filter(k => k.to === Room.me).map(k => k.from), mine = kills.filter(k => k.from === Room.me).map(k => k.to);

/** Runs the screen's arena: the clock while hiding, the reveal's frames, the spot under a finger. */

    const got = !tv && !standing ? laserGotMe(state) : null;

      const cur = Room.state || state;
      const you = cur.you || {};

      const rays = standing && lsr.use && held === 'double' ? [{ a: me.a }, { a: laserAngle(me.a + 180) }]

        : standing && lsr.use && held === 'wide' ? [{ a: me.a, wide: true }] : null;

      });

      const introU = s.introUntil ? lsrClamp01(1 - (s.introUntil - roomServerNow()) / (LSR_INTRO_S * 1000)) : 1;
      const left = Math.max(0, ((s.endsAt || 0) - roomServerNow()) / 1000), total = (s.hideMs || 15000) / 1000;
      laserDraw(cv, Object.assign({}, AD, {
        k: s.k, t: null, now: nowS, people, bounce: !!(s.opts && s.opts.bounce), pickups: s.pickups || [],
        myMine: ghost ? me.mine : null, old: got ? got.old : null,
        intro: motionOff() ? 1 : introU, introName: L.laser_map + ' ' + laserMapName(L, s.map),
        radar: watching ? nowS : null,

        slam: tv && introU >= 1 ? { text: s.practice ? L.laser_practice : (L.round || '') + ' ' + s.round, u: (roomServerNow() - ((s.endsAt || 0) - (s.hideMs || 15000))) / 1600 } : null
      }));

 * transform on the canvas, no three.js) while the guns charge, and lays it flat again as they
 * fire, so the hits land on a flat board. Transform only; flat with motion off.

function laserTvTilt(cv, t, T) {

    const down = lsrEase(lsrSeg(t, T.fire - 0.12, T.fire + 0.28));
    const u = up * (1 - down);
    if (u > 0.002) v = `perspective(1400px) rotateX(${(28 * u).toFixed(2)}deg) scale(${(1 - 0.06 * u).toFixed(3)})`;
  }
  if (cv.style.transform !== v) cv.style.transform = v;
}

/** The ghosts in the room: everyone of the game who is out and still here (FX 12). */
const activeLaserGhosts = (state, s) => {
  const here = new Set((state.players || []).map(p => p.id));
  return (s.roster || []).filter(id => here.has(id) && (s.alive || []).indexOf(id) === -1);
};

/** UX 2: the aim handle at the end of a short line (and the second beam's, in its own colour). */
const LSR_HANDLE = 0.24;
function laserDrawHandles(cv, s, me, second) {
  const ctx = cv.getContext('2d'), r = cv.getBoundingClientRect(), f = lsrFrame(r.width, r.height, s.k);
  const one = (a, col) => {
    const x = f.cx + me.x * f.s, y = f.cy + me.y * f.s, rad = a * Math.PI / 180, d = LSR_HANDLE * f.s;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + Math.cos(rad) * LASER_BODY * f.s * 1.2, y + Math.sin(rad) * LASER_BODY * f.s * 1.2); ctx.lineTo(x + Math.cos(rad) * d, y + Math.sin(rad) * d); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + Math.cos(rad) * d, y + Math.sin(rad) * d, Math.max(7, f.s * 0.035), 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
  };
  one(me.a, laserColour(s, Room.me));
  if (second) one(me.a2, LASER_PK_COL.second);
}

/** A touch moves this phone's spot: drag your body to move it, drag the aim handle (or the second
    beam's) to turn, touch anywhere else to stand there and drag on to aim (UX 2). A ghost's touch
    puts its mine. Nothing moves once ready (UX 7) or while the map draws itself. */
function laserWire(cv, s, paint, ghost) {
  cv.dataset.wired = '1';
  let down = null;
  const toUnit = (e) => {
    const r = cv.getBoundingClientRect();
    const f = lsrFrame(r.width, r.height, s.k);
    return { x: (e.clientX - r.left - f.cx) / f.s, y: (e.clientY - r.top - f.cy) / f.s, px: e.clientX, py: e.clientY };
  };
  const locked = () => {
    const st = (Room.state && Room.state.shared) || {};
    return !!(Room.state && Room.state.you && Room.state.you.ready) || (st.introUntil && st.introUntil > roomServerNow());
  };
  if (ghost) {
    const put = (e) => {
      const u = toUnit(e), p = laserClampMap(s.map || 'hex', s.k, u.x, u.y);
      lsr.mine = { x: p.x, y: p.y };
      paint();
    };
    cv.addEventListener('pointerdown', (e) => {
      if (locked()) return;
      down = true; put(e); haptic('light');
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    cv.addEventListener('pointermove', (e) => { if (down) put(e); });
    const up = () => {
      if (!down) return;
      down = null;
      if (lsr.mine) roomAct('mine', { round: laserRound(), x: lsr.mine.x, y: lsr.mine.y });
    };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    return;
  }
  const A = () => laserArenaOf((Room.state && Room.state.shared) || s);
  const fit = (x, y) => {
    const p = laserFit(A(), x, y);
    // UX 14: pulled back inside, the wall flashes there and the phone buzzes once.
    if (Math.hypot(p.x - x, p.y - y) > 0.03 && (!lsr.flash || performance.now() - lsr.flash.at > 500)) { lsr.flash = { x, y, at: performance.now() }; haptic('light'); }
    return p;
  };
  const handleAt = (a) => ({ x: lsr.x + Math.cos(a * Math.PI / 180) * LSR_HANDLE, y: lsr.y + Math.sin(a * Math.PI / 180) * LSR_HANDLE });
  cv.addEventListener('pointerdown', (e) => {
    if (locked()) return;
    const p = toUnit(e);
    lsr.touched = true;
    const held = ((Room.state && Room.state.shared && Room.state.shared.held) || {})[Room.me];
    const h1 = handleAt(lsr.a), h2 = handleAt(lsr.a2), grab = 0.07;
    if (lsr.use && held === 'second' && Math.hypot(p.x - h2.x, p.y - h2.y) < grab) down = { mode: 'aim2', px: p.px, py: p.py };
    else if (Math.hypot(p.x - h1.x, p.y - h1.y) < grab) down = { mode: 'aim', px: p.px, py: p.py };
    else if (Math.hypot(p.x - lsr.x, p.y - lsr.y) < LASER_BODY * 1.4) down = { mode: 'move', dx: lsr.x - p.x, dy: lsr.y - p.y, px: p.px, py: p.py };
    else {
      const c = fit(p.x, p.y);
      lsr.x = c.x; lsr.y = c.y;
      haptic('light');
      down = { mode: 'aim', px: p.px, py: p.py };
    }
    paint();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!down) return;
    const p = toUnit(e);
    if (down.mode === 'move') {
      const c = fit(p.x + down.dx, p.y + down.dy);
      lsr.x = c.x; lsr.y = c.y;
    } else {
      if (Math.hypot(p.px - down.px, p.py - down.py) < 6 && Math.hypot(p.x - lsr.x, p.y - lsr.y) < LASER_BODY) return;
      const a = laserAngle(Math.atan2(p.y - lsr.y, p.x - lsr.x) * 180 / Math.PI);
      if (down.mode === 'aim2') lsr.a2 = a; else lsr.a = a;
    }
    paint();
    laserSendPlace(false);
  });
  const up = () => { if (!down) return; down = null; laserSendPlace(true); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
}

/* --- the best shot, replayed slowly before the podium (look أ, the owner's pick) ------------ */
const LSR_REPLAY_S = 7;
/** Is there a replay to show, and has this screen not shown it yet for this game? */
const laserReplayDue = (state) => {
  const s = state.shared || {};
  return !!(((s.best && s.best.n >= 2) || (s.winners || []).length) && !motionOff() && !lsr.replayed.has(roomDealKey(state, 'replay')));
};
const LSR_WAVE_S = 2;
/** How long the end's show runs: the winner's wave (FX 16), then the best shot when it hit two or more. */
const lsrEndShowS = (state) => { const s = state.shared || {}; return LSR_WAVE_S + (s.best && s.best.n >= 2 ? LSR_REPLAY_S : 0); };
/** The first time this page sees a game (a reload, a latecomer, a TV coming on): a game already over
    is not replayed and cheered again. */
function laserFirstSight(state) {
  const key = roomDealKey(state, 'laser-seen');
  if (lsr.seen.has(key)) return;
  lsr.seen.add(key);
  // Back mid-hiding (a reload, a late join): this round's card has been and gone already.
  const s0 = state.shared || {};
  if (s0.phase === 'hide' && s0.round >= 1) motionFirst(roomDealKey(state, 'laser-card' + s0.round));
  if (s0.phase !== 'gameover') return;
  lsr.replayed.add(roomDealKey(state, 'replay'));
  motionFirst(roomDealKey(state, 'laser-confetti'));
}
function laserReplayDone(state) {
  lsr.replayed.add(roomDealKey(state, 'replay'));
  clearTimeout(lsr.replayTimer);
  laserStop();
  const el = document.getElementById(Room.state && Room.state.youAreScreen ? 'view-room-tv' : 'view-room-laser');
  if (el) delete el.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
}
function laserReplaySkip() { if (Room.state) laserReplayDone(Room.state); }
/** Plays the best shot on the canvas: the bars, the beam crawling at a quarter speed, each one it
    hits going out as it passes, then the line under it. */
function laserRunReplay(state, el) {
  laserStop();
  const s = state.shared || {}, b = s.best && s.best.n >= 2 ? s.best : null, L = laserT();
  const cv = el.querySelector('[data-laser-arena]');
  if (!cv) return;
  if (!b) {
    // No shot worth a replay: the winner's wave alone.
    const w0 = performance.now();
    const wave = () => { const t = (performance.now() - w0) / 1000; laserDrawWave(cv, state, t); if (t < LSR_WAVE_S) lsr.raf = requestAnimationFrame(wave); };
    wave();
    return;
  }
  const people = b.people.map(p => { const name = laserName(state, p.id); return { id: p.id, x: p.x, y: p.y, a: p.a, shield: p.shield, col: laserColour(s, p.id), label: name, letter: Array.from(name)[0] || '' }; });
  const shooter = people.find(p => p.id === b.shooter);
  const segs = b.segs, lens = segs.map(g => Math.hypot(g[2] - g[0], g[3] - g[1])), total = lens.reduce((a, c) => a + c, 0);
  const alongOf = (q) => {
    let acc = 0, best = Infinity, at = 0;
    segs.forEach((g, i) => { const dx = (g[2] - g[0]) / (lens[i] || 1), dy = (g[3] - g[1]) / (lens[i] || 1), a = (q.x - g[0]) * dx + (q.y - g[1]) * dy, perp = Math.abs((q.x - g[0]) * dy - (q.y - g[1]) * dx); if (a > 0 && a < lens[i] + 0.1 && perp < best) { best = perp; at = acc + a; } acc += lens[i]; });
    return at;
  };
  const hitAt = {}; b.victims.forEach(id => { const q = people.find(p => p.id === id); if (q) hitAt[id] = alongOf(q); });
  const line = `${laserName(state, b.shooter)} ${L.laser_replay_hit} ${b.n} ${L.laser_replay_one} · ${L.round || ''} ${b.round}`;
  const t0 = performance.now() + LSR_WAVE_S * 1000;
  const frame = () => {
    const t = (performance.now() - t0) / 1000;
    if (t < 0) { laserDrawWave(cv, state, t + LSR_WAVE_S); lsr.raf = requestAnimationFrame(frame); return; }
    const head = total * lsrEase(lsrSeg(t, 0.8, 3.8));
    laserDraw(cv, { map: b.map, k: b.k, t: null, pillars: b.pillars, turret: b.turret || null, turretAim: false, fallen: s.opts && s.opts.pieces ? b.fallen : null, people: people.filter(p => !(hitAt[p.id] !== undefined && head > hitAt[p.id] + 0.02)).map(p => Object.assign({}, p, { a: p.a })), beams: [] });
    const ctx = cv.getContext('2d'), r = cv.getBoundingClientRect(), f = lsrFrame(r.width, r.height, b.k);
    const X = (x) => f.cx + x * f.s, Y = (y) => f.cy + y * f.s;
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.55)'; const bar = r.height * 0.08 * lsrEase(lsrSeg(t, 0, 0.5)); ctx.fillRect(0, 0, r.width, bar); ctx.fillRect(0, r.height - bar, r.width, bar); ctx.restore();
    lsrPill(ctx, L.laser_replay, r.width / 2, Math.max(16, r.height * 0.06), Math.max(11, f.s * 0.045), '#ffd64d', r.width);
    if (head > 0 && shooter) {
      ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = shooter.col; ctx.lineWidth = f.s * 0.03 * (b.wide ? 2 : 1); ctx.shadowColor = shooter.col; ctx.shadowBlur = f.s * 0.12;
      ctx.globalAlpha = 1 - lsrSeg(t, 5.6, 6.6);
      lsrPath(ctx, segs, f.s, f.cx, f.cy, head / total); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = f.s * 0.009; ctx.shadowBlur = 0; ctx.stroke();
      ctx.restore();
    }
    b.victims.forEach(id => {
      if (!(head > hitAt[id] + 0.02)) return;
      const q = people.find(p => p.id === id); if (!q) return;
      const x = X(q.x), y = Y(q.y), rr = LASER_BODY * f.s, u = lsrClamp01((head - hitAt[id]) / 0.25);
      lsrBurst(ctx, x, y, rr, u, q.col, 10);
      ctx.save(); ctx.fillStyle = '#3a3f55'; ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.fill(); ctx.fillStyle = '#9aa0b8'; ctx.font = `700 ${rr * 1.05}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✕', x, y); ctx.restore();
      lsrPill(ctx, q.label, x, y + rr * 2.1, Math.max(10, rr * 0.72), 'rgba(154,160,184,.6)', r.width);
    });
    if (t > 3.9) { ctx.save(); ctx.globalAlpha = lsrSeg(t, 3.9, 4.3); lsrPill(ctx, line, r.width / 2, r.height - Math.max(22, r.height * 0.13), Math.max(12, f.s * 0.05), '#ffd64d', r.width); ctx.restore(); }
    if (t < 3.8 && t > 0.8) { ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = `700 ${Math.max(10, f.s * 0.04)}px sans-serif`; ctx.textAlign = 'left'; try { ctx.direction = 'ltr'; } catch (e) {} ctx.fillText('×¼', 12, r.height - 12); ctx.restore(); }
    if (t < LSR_REPLAY_S) lsr.raf = requestAnimationFrame(frame);
  };
  frame();
  if (!motionFirst(roomDealKey(state, 'replay-sound'))) return;
  setTimeout(() => laserZap('fire'), 800);
}

/** FX 16: the floor lights up in the winner's colour (a team's, in teams), a wave spreading out from
    where they stood in the last round, and their name. */
function laserDrawWave(cv, state, t) {
  const s = state.shared || {}, L = laserT();
  const winners = (s.winners || []).map(id => {
    const shot = (s.shots || []).find(p => p.id === id) || { x: 0, y: 0, a: 270 };
    const name = laserName(state, id);
    return { id, x: shot.x, y: shot.y, a: shot.a, col: laserColour(s, id), label: name, letter: Array.from(name)[0] || '' };
  });
  laserDraw(cv, { map: s.map, k: s.k, t: null, now: t, pillars: s.pillars || [], turret: s.turret || null, turretAim: false, fallen: s.opts && s.opts.pieces ? (s.fallen || []) : null, people: winners, beams: [] });
  if (!winners.length) return;
  const ctx = cv.getContext('2d'), r = cv.getBoundingClientRect(), f = lsrFrame(r.width, r.height, s.k);
  const col = winners[0].col, front = lsrEase(lsrSeg(t, 0.1, 1.6)) * 2.2, tr = f.s * 0.09;
  ctx.save(); lsrMapPath(ctx, s.map || 'hex', f.cx, f.cy, f.s, s.k); ctx.clip('evenodd'); ctx.fillStyle = col;
  for (let q = -14; q <= 14; q++) for (let rr = -14; rr <= 14; rr++) {
    const ux = 0.09 * 1.5 * q, uy = 0.09 * Math.sqrt(3) * (rr + q / 2);
    if (Math.abs(ux) > 1.1 || Math.abs(uy) > 1.1) continue;
    const dist = Math.min(...winners.map(w => Math.hypot(w.x - ux, w.y - uy)));
    const a = Math.max(0, 1 - Math.abs(dist - front) / 0.22) * 0.55 + (dist < front ? 0.12 : 0);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a * (1 - lsrSeg(t, 1.6, 2)); lsrHex(ctx, f.cx + ux * f.s, f.cy + uy * f.s, tr * 0.9); ctx.fill();
  }
  ctx.restore();
  const title = s.teams && s.winnerTeam !== null && s.winnerTeam !== undefined ? L.laser_team_won + ': ' + laserTeamName(L, s.winnerTeam) : '🏆 ' + laserNames(state, s.winners);
  ctx.save(); ctx.globalAlpha = lsrSeg(t, 0.3, 0.7) * (1 - lsrSeg(t, 1.7, 2)); lsrPill(ctx, title, r.width / 2, Math.max(18, r.height * 0.08), Math.max(13, f.s * 0.06), col, r.width); ctx.restore();
}

        <details class="lobby-opts" ${open ? 'open' : ''} data-r="${open ? 1 : 0}" ontoggle="lobbyOptsToggled(this, 'laser-more')">
          <summary class="lobby-opts__head">
            <span class="lobby-opts__title">⚙️ ${escapeHTML(t.laser_more)}</span>
            <span class="lobby-opts__sum"></span>
            <span class="lobby-opts__chev" aria-hidden="true">▾</span>
          </summary>
          <div class="lobby-opts__body">
            ${seg(t.laser_hearts_label, [[1, '1'], [2, '2'], [3, '3']], Number(o.hearts) || 1, v => `setLaserOpt('hearts', ${v})`)}
            ${seg(t.laser_time_label, [[10, '10″'], [15, '15″'], [20, '20″']], Number(o.time) || 15, v => `setLaserOpt('time', ${v})`)}
            <p class="field__hint">${escapeHTML(t.laser_time_hint)}</p>
            ${sw('pickups')}
            ${sw('ghosts')}
            ${o.ghosts ? sw('swap') : ''}
            ${sw('pillars')}
            ${o.pillars ? sw('mirrors') : ''}
            ${sw('turret')}
            ${sw('pieces')}
            ${sw('bounce')}
            ${sw('block')}
            ${teams ? sw('sight') : ''}
          </div>
        </details>
        ${hint}
      </div>`;
  },
  startPayload() {
    const o = laserOpts(), out = { teams: Number(o.teams) || 0, hearts: Number(o.hearts) || 1, time: Number(o.time) || 15 };
    LASER_SWITCHES.forEach(k => { out[k] = !!o[k]; });
    return out;
  },
  actionKey(state) {
    const s = state.shared || {};
    return [state.code, roomDealKey(state), s.phase, s.round].join('|');
  },

  render(state) {
    if (appState.currentView !== 'room-laser') setView('room-laser');
    const el = document.getElementById('view-room-laser');
    if (!el) return;
    const t = laserT();
    const s = state.shared || {};

    laserFirstSight(state);
    if (s.phase === 'gameover') {
      // The best shot first (look أ), then the podium.
      if (laserReplayDue(state)) {
        const fresh = renderRoomFrame(el, ['laser-replay', roomDealKey(state), appState.lang].join('|'), () => `
          <div class="laser laser--play">
            <div class="laser-stage"><canvas class="laser-arena" data-laser-arena aria-label="${escapeHTML(t.laser_replay)}"></canvas></div>
            <div class="laser-actions"><button class="btn btn--ghost btn--sm" onclick="laserReplaySkip()">${escapeHTML(t.laser_skip)}</button></div>
          </div>`);
        if (fresh) {
          laserRunReplay(state, el);
          clearTimeout(lsr.replayTimer);
          lsr.replayTimer = setTimeout(() => laserReplayDone(state), lsrEndShowS(state) * 1000);
        }
        return;
      }
      const fresh = renderRoomFrame(el, ['laser-over', state.youAreHost, appState.lang].join('|'), () => `
        <div class="laser">
          <div class="card" style="text-align:center;width:100%">
            <div class="card__title">${laserOverTitle(s, t)}</div>
            ${renderPodium(state, s.board) || ''}
            ${laserAwardsHtml(state, s, t)}
            <details class="laser-all"><summary>${escapeHTML(t.laser_all_rank)}</summary>${laserRowsHtml(state, s, t)}</details>
          </div>
          ${state.youAreHost
            ? `<div class="laser-actions">
                 <button class="btn btn--primary btn--lg" onclick="roomAct('playAgain')">${escapeHTML(t.play_again || '')}</button>
                 <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button>
               </div>`
            : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
        </div>
        ${renderRoomPlayerStrip(state)}`);
      if (fresh && (s.winners || []).indexOf(Room.me) !== -1 && motionFirst(roomDealKey(state, 'laser-confetti'))) afterReveal(el, () => { if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70 }); });
      refreshRoomPlayerStrip(el, state);
      laserStop();
      return;
    }

    if (s.phase === 'teams') {
      const mine = s.teams && s.teams[Room.me] !== undefined ? s.teams[Room.me] : null;
      renderRoomFrame(el, ['laser-teams', JSON.stringify(s.teams), state.youAreHost, state.hostAway, !!s.practice, appState.lang].join('|'), () => `
        <div class="laser">
          <div class="card" style="width:100%">
            <div class="card__title">${escapeHTML(t.laser_teams_title)}</div>
            ${mine !== null ? `<p class="laser-hint">${escapeHTML(t.laser_your_team)}: <b>${escapeHTML(laserTeamName(t, mine))}</b></p>` : ''}
            ${laserTeamsHtml(state, s, t)}
            ${s.practice ? `<p class="laser-hint">🎯 ${escapeHTML(t.laser_pr_first)}</p>` : ''}
          </div>
          <div class="laser-actions">
            ${state.youAreHost ? `<button class="btn btn--secondary" onclick="roomAct('shuffle')">${escapeHTML(t.laser_shuffle)}</button>` : ''}
            ${state.youAreHost && s.practice ? laserSkipBtnHtml(s, t) : ''}
            ${roomMoveOnHtml(state, `<button class="btn btn--primary btn--lg" onclick="roomAct('go')">${escapeHTML(t.laser_go)}</button>`, `<div class="waiting-note">${escapeHTML(t.laser_teams_wait)}</div>`)}
          </div>
        </div>
        ${renderRoomPlayerStrip(state)}`);
      refreshRoomPlayerStrip(el, state);
      laserStop();
      return;
    }

    const you = state.you || {};
    const inGame = (s.roster || []).indexOf(Room.me) !== -1;
    const standing = (s.alive || []).indexOf(Room.me) !== -1;
    const ghost = !standing && !!you.ghost;
    const ready = !!you.ready;
    const shieldOn = !!you.shield;
    const shieldUsed = !!(s.shieldUsed || {})[Room.me];
    const held = standing ? (s.held || {})[Room.me] : null;
    const useOn = !!you.use;
    const mineSet = !!you.mine;
    const hearts = (s.hearts || {})[Room.me] || 0;
    const team = s.teams && s.teams[Room.me] !== undefined ? s.teams[Room.me] : null;
    const got = !standing && s.phase === 'hide' ? laserGotMe(state) : null;
    const heartsChip = standing ? laserHeartsChip(s, Room.me) : '';
    const bar = `<div class="laser-bar">
        ${s.practice ? `<span class="laser-chip">🎯 ${escapeHTML(t.laser_practice)}</span>` : `<span class="laser-chip">${escapeHTML(t.round || '')} <span class="metric">${s.round || 1}</span></span>`}
        ${team !== null ? `<span class="laser-chip" style="--laser-c:${LASER_TEAM_COLOURS[team]}"><span class="laser-chip__dot"></span>${escapeHTML(laserTeamName(t, team))}</span>` : ''}
        ${heartsChip ? `<span class="laser-chip" title="${escapeHTML(t.laser_hearts_left)}">${heartsChip}</span>` : ''}
        ${s.phase === 'hide' ? `<span class="laser-chip laser-clock" data-laser-clock>${laserClockText(s)}</span>` : `<span class="laser-chip"><span class="metric">${(s.alive || []).length}</span> ${escapeHTML(t.laser_left)}</span>`}
      </div>`;
    // Who holds a pickup, beside their name, for everyone (the spec: on the TV and the phones).
    const holders = s.phase === 'hide' ? (s.alive || []).filter(id => (s.held || {})[id]).map(id => `<span class="laser-chip laser-chip--sm" style="--laser-c:${laserColour(s, id)}"><span class="laser-chip__dot"></span>${escapeHTML(laserName(state, id))}${laserHeldChip(s, id, t)}</span>`).join('') : '';
    const verdict = s.phase === 'reveal' ? laserVerdict(state) : null;
    const overlays = (s.phase === 'hide' && standing && ready ? `<div class="laser-dim"><span class="laser-lock">${escapeHTML(t.laser_ready_lock)}</span></div>` : '')
      + (verdict ? `<div class="laser-over-wrap"><div class="laser-verdict laser-verdict--${verdict.cls}" data-laser-verdict hidden>${escapeHTML(verdict.text)}</div></div>` : '')
      + laserRoundCard(state, t);
    const stage = `<div class="laser-stage"><canvas class="laser-arena ${s.phase === 'hide' && (standing || ghost) && !ready ? 'is-mine' : ''}" data-laser-arena aria-label="${escapeHTML(t.setup_laser)}"></canvas><div class="laser-cap" data-laser-cap></div>${overlays}</div>`;
    const gotLine = got ? `<p class="laser-hint laser-gotyou">${escapeHTML(t.laser_got_you)} ${got.kills.map(k => `<b style="color:${laserColour(s, k.from)}">${k.by === 'mine' ? '💣 ' : '⚡ '}${escapeHTML(laserName(state, k.from))}</b>`).join(' · ')}</p>` : '';
    // UX 11: who hit whom under the arena: this round's once the beams land, last round's while hiding.
    const kills = s.phase === 'reveal' ? s.roundKills : s.lastKills;
    const feed = (kills || []).length ? `<div class="laser-feed laser-feed--phone" data-laser-feed ${s.phase === 'reveal' ? 'hidden' : ''}>${laserFeedHtml(state, kills)}</div>` : '';
    // The practice round (866): a line saying nothing counts, the host's «نبدأ علطول», and at the reveal
    // this phone's own line (what would have happened to it).
    const practiceNote = s.practice && (s.phase === 'hide' || s.phase === 'reveal')
      ? `<p class="laser-hint">🎯 <b>${escapeHTML(t.laser_pr_hint)}</b></p>${state.youAreHost && s.phase === 'hide' ? `<div class="laser-actions">${laserSkipBtnHtml(s, t)}</div>` : ''}` : '';
    const prLine = s.practice && s.phase === 'reveal' ? laserPracticeLine(state) : '';
    const practiceMine = prLine ? `<p class="laser-hint laser-gotyou" data-laser-mine hidden>${prLine}</p>` : '';
    let below = '';
    if (s.phase === 'hide' && standing) {
      const shieldBtn = shieldUsed
        ? `<span class="laser-chip">${escapeHTML(t.laser_shield_used)}</span>`
        : `<button type="button" class="btn btn--sm btn--auto ${shieldOn ? 'btn--warning' : 'btn--secondary'}" aria-pressed="${shieldOn}" onclick="laserShield(${!shieldOn})" ${ready ? 'disabled' : ''}>${escapeHTML(shieldOn ? t.laser_shield_on : t.laser_shield)}</button>`;
      const useBtn = held ? `<button type="button" class="btn btn--sm btn--auto laser-use ${useOn ? 'is-on' : ''}" style="--laser-c:${LASER_PK_COL[held]}" aria-pressed="${useOn}" onclick="laserUse(${!useOn})" ${ready ? 'disabled' : ''}>${escapeHTML((useOn ? t.laser_using : t.laser_use) + ' ' + laserPkName(t, held))}</button>` : '';
      const hint = ready ? t.laser_ready_wait : (useOn && held === 'second' ? t.laser_pk_hint_second : shieldOn ? t.laser_shield_on_hint : (s.cracked || []).length ? t.laser_hide_hint + ' · ' + t.laser_floor_cracked : t.laser_hide_hint)
        + (!ready && s.turret ? ' · ' + t.laser_turret_hint : '');
      // 871: this phone stood still two rounds and was moved; it says so, kindly.
      const movedLine = (s.moved || []).indexOf(Room.me) !== -1 ? `<p class="laser-hint laser-moved">🫥 <b>${escapeHTML(t.laser_moved_you)}</b></p>` : '';
      below = `${movedLine}${feed}<p class="laser-hint">${escapeHTML(hint)}</p>
        <div class="laser-tools" dir="ltr">
          <button type="button" class="btn btn--neutral btn--sm btn--auto laser-turn" aria-label="${escapeHTML(t.laser_turn_l)}" title="${escapeHTML(t.laser_turn_l)}" onclick="laserNudge(-3)" ${shieldOn || ready ? 'disabled' : ''}>⟲</button>
          ${shieldBtn}
          <button type="button" class="btn btn--neutral btn--sm btn--auto laser-turn" aria-label="${escapeHTML(t.laser_turn_r)}" title="${escapeHTML(t.laser_turn_r)}" onclick="laserNudge(3)" ${shieldOn || ready ? 'disabled' : ''}>⟳</button>
        </div>
        ${useBtn ? `<div class="laser-tools">${useBtn}</div>` : ''}
        <div class="laser-actions">${ready
          ? `<button class="btn btn--ghost" onclick="laserReady(false)">${escapeHTML(t.laser_unready)}</button>`
          : `<button class="btn btn--primary btn--lg laser-ready" data-laser-ready onclick="laserReady(true)">${escapeHTML(t.laser_ready)}</button>`}</div>${practiceNote}`;
    } else if (s.phase === 'hide' && ghost) {
      below = `${gotLine}<p class="laser-hint">${escapeHTML(mineSet ? t.laser_ghost_set : t.laser_ghost_hint)}</p>
        ${mineSet ? `<div class="laser-actions"><button class="btn btn--ghost btn--sm" onclick="laserMineClear()">${escapeHTML(t.laser_mine_clear)}</button></div>` : ''}`;
    } else if (s.phase === 'hide') {
      // UX 13: whoever watches (out with no ghosts, or in next game) sees who is hiding.
      below = `${gotLine}<div class="laser-watchers">${laserHidingNames(state, s, t)}</div><p class="laser-hint">${escapeHTML(inGame ? t.laser_out_watch : t.laser_watch)}</p>${practiceNote}`;
    } else if (s.phase === 'reveal') {
      below = practiceMine + (s.practice ? '' : feed) + practiceNote + roomMoveOnHtml(state, `<div class="laser-actions"><button class="btn btn--ghost btn--sm" onclick="roomAct('next', { round: ${Number(s.round) || 0} })">${escapeHTML(t.laser_next)}</button></div>`);
    }
    const fresh = renderRoomFrame(el, ['laser-play', s.phase, s.round, standing, ghost, ready, shieldOn, shieldUsed, held, useOn, mineSet, hearts, team,
      (s.alive || []).join(','), JSON.stringify(s.held || {}),
      // The hiding frame never shows the host's buttons: a host going quiet must not rebuild the canvas under a drag.
      s.phase === 'hide' ? '' : state.youAreHost + '/' + state.hostAway, appState.lang,
      // The practice's skip button is the host's alone (it changes only on a handover).
      s.practice ? 'pr/' + state.youAreHost : ''].join('|'), () => `
      <div class="laser laser--play">${bar}${holders ? `<div class="laser-watchers">${holders}</div>` : ''}${stage}${below}</div>
      ${renderRoomPlayerStrip(state)}`);
    refreshRoomPlayerStrip(el, state);
    if (fresh || !lsr.raf && !lsr.ticker) laserRun(state, el, false);
    else if (s.phase === 'hide' && lsr.paint) lsr.paint();
  }
};

TV_GAMES.laser = {
  sig: (state) => {
    const s = state.shared || {};
    laserFirstSight(state);
    const replay = s.phase === 'gameover' && laserReplayDue(state);
    return ['laser', roomDealKey(state), s.phase, s.round, !!s.practice, replay, JSON.stringify(s.teams || null), (s.alive || []).join(','), JSON.stringify(s.hearts || {}), JSON.stringify(s.held || {}), state.youAreHost, state.hostAway, appState.lang].join('|');
  },
  frame(state) {
    const s = state.shared || {};
    const t = laserT();
    if (s.phase === 'gameover') {
      if (laserReplayDue(state)) {
        return `
          <div class="laser-tv">
            <div class="laser-stage"><canvas class="laser-arena" data-laser-arena aria-label="${escapeHTML(t.laser_replay)}"></canvas></div>
            <div class="laser-tv__side"><div class="laser-tv__title">${escapeHTML(t.laser_replay)}</div>${state.youAreHost ? `<div class="tv-actions">${tvBtn(t.laser_skip, 'laserReplaySkip()', 'ghost')}</div>` : ''}</div>
          </div>`;
      }
      return `
        <div class="tv-vote">
          <div class="tv-title tv-center-text">${laserOverTitle(s, t)}</div>
          ${renderPodium(state, s.board)}
          <div class="tv-scale">${laserAwardsHtml(state, s, t)}${laserRowsHtml(state, s, t)}</div>
          ${state.youAreHost ? `<div class="tv-actions">${tvBtn(t.play_again, "roomAct('playAgain')")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>` : ''}
        </div>`;
    }
    if (s.phase === 'teams') {
      return `
        <div class="tv-center">
          <div class="tv-title">${escapeHTML(t.laser_teams_title)}</div>
          <div class="laser-tv__teams">${laserTeamsHtml(state, s, t)}</div>
          ${s.practice ? `<div class="laser-tv__sub">🎯 ${escapeHTML(t.laser_pr_first)}</div>` : ''}
          ${roomMoveOnHtml(state, `<div class="tv-actions">${state.youAreHost ? tvBtn(t.laser_shuffle, "roomAct('shuffle')", 'secondary') : ''}${state.youAreHost && s.practice ? tvBtn(t.laser_pr_skip, `roomAct('skipPractice', { round: ${Number(s.round) || 0} })`, 'ghost') : ''}${tvBtn(t.laser_go, "roomAct('go')")}</div>`)}
        </div>`;
    }
    const alive = new Set(s.alive || []);
    const ghosts = s.opts && s.opts.ghosts;
    const hiding = s.phase === 'hide';
    const names = (s.roster || []).map(id => `<span class="laser-chip ${alive.has(id) ? '' : 'is-out'}" style="--laser-c:${laserColour(s, id)}"><span class="laser-chip__dot"></span>${!alive.has(id) && ghosts ? '👻 ' : ''}<span class="laser-chip__name">${escapeHTML(laserName(state, id))}</span>${alive.has(id) ? laserHeartsChip(s, id) + laserHeldChip(s, id, t) : ''}${alive.has(id) && hiding ? `<span class="laser-chip__note">${escapeHTML(t.laser_hiding)}</span>` : ''}</span>`).join('');
    // Who hit whom: last round's while hiding; this round's once the beams have landed.
    const kills = s.phase === 'reveal' ? s.roundKills : s.lastKills;
    const feed = (kills || []).length ? `<div class="laser-feed" data-laser-feed ${s.phase === 'reveal' ? 'hidden' : ''}><div class="laser-feed__title">${escapeHTML(t.laser_feed_title)}</div>${laserFeedHtml(state, kills)}</div>` : '';
    return `
      <div class="laser-tv">
        <div class="laser-stage"><canvas class="laser-arena" data-laser-arena></canvas><div class="laser-cap" data-laser-cap></div>${hiding ? `<div class="laser-tv__clock" data-laser-clock>${laserClockText(s)}</div>` : ''}</div>
        <div class="laser-tv__side">
          <div class="laser-tv__title">${s.practice ? '🎯 ' + escapeHTML(t.laser_practice) : `${escapeHTML(t.round || '')} <span class="metric">${s.round || 1}</span>`} · ${escapeHTML(laserMapName(t, s.map))}</div>
          ${hiding ? `<div class="laser-tv__sub">${escapeHTML(t.laser_tv_hide)}</div>` : ''}
          ${hiding && (s.moved || []).length ? `<div class="laser-tv__sub laser-moved">🫥 ${escapeHTML((t.laser_moved_tv || '').replace('{names}', laserNames(state, s.moved)))}</div>` : ''}
          ${s.practice ? `<div class="laser-tv__sub">${escapeHTML(t.laser_pr_hint)}</div>` : ''}
          ${s.turret && hiding ? `<div class="laser-tv__sub" style="color:${LSR_TURRET_COL}">${escapeHTML(t.laser_turret_tv)}</div>` : ''}
          ${s.practice && hiding && state.youAreHost ? `<div class="tv-actions">${tvBtn(t.laser_pr_skip, `roomAct('skipPractice', { round: ${Number(s.round) || 0} })`, 'ghost')}</div>` : ''}
          <div class="laser-tv__names">${names}</div>
          ${feed}
          ${s.phase === 'reveal' ? roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.laser_next, `roomAct('next', { round: ${Number(s.round) || 0} })`, 'ghost')}</div>`) : ''}
        </div>
      </div>`;
  },
  after(state, rebuilt) {
    const el = document.getElementById('view-room-tv');
    const s = state.shared || {};
    if (!el) return;
    if (s.phase === 'gameover' && laserReplayDue(state)) {
      const key = roomDealKey(state, 'replay-run');
      // Again on a new canvas (a rebuild) or after the screen was left; not on every state.
      if (rebuilt || lsr.replayKey !== key || !lsr.raf) {
        lsr.replayKey = key;
        laserRunReplay(state, el);
        clearTimeout(lsr.replayTimer);
        lsr.replayTimer = setTimeout(() => laserReplayDone(state), lsrEndShowS(state) * 1000);
      }
      return;
    }
    // Every aim a phone sends is a state: running the arena again on each one would restart the radar
    // and the pulses from 0. Only a new canvas, a new step, or nothing running.
    if (s.phase === 'hide' || s.phase === 'reveal') {
      const key = roomDealKey(state, s.phase + s.round + '|' + (s.alive || []).join(','));
      if (rebuilt || lsr.tvRun !== key || (!lsr.raf && !lsr.ticker)) { lsr.tvRun = key; laserRun(state, el, true); }
    } else { lsr.tvRun = ''; laserStop(); }
  }
};
</script>
