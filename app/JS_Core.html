<script>
  /* --- ERRORS ON PLAYERS' PHONES ---
     An error nobody sees on a guest's phone is an error the owner never hears of. The
     published page sends each one to the rooms server (POST /err, kept by the "errors"
     log; npm run errors in tools/ reads it): this build's id, the screen, a short
     message and where in the page - never a name, a room code or anything typed (the
     server blanks quoted text that isn't code). Each error once a page load, ten at
     most, never offline, never from a browser extension or another site's script, and
     not the noise every page gets (a cross-origin "Script error.", the ResizeObserver
     loop, a network hiccup). The preview sends nothing unless window.ASHRY_ERR_REPORT
     is set. Its own script, ES5, so an error in the big script below can't stop it. */
  (function () {
    var sent = {}, count = 0, MAX = 10;
    var NOISE = /ResizeObserver loop|^Script error\.?$|Failed to fetch|Load failed|NetworkError|The (network|Internet) connection|AbortError|The operation was aborted|Network request failed|Importing a module script failed|__lzOnce_/i;
    var FOREIGN = /(chrome|moz|safari|safari-web)-extension:|webkit-masked-url:|^about:|^blob:/;
    function page(u) { try { return new URL(u, location.href).origin === location.origin; } catch (e) { return false; } }
    // The first frame of our own page in a stack: "fn@index:1234:56".
    function frameOf(stack, file, line, col) {
      var lines = String(stack || '').split('\n');
      for (var i = 0; i < lines.length; i++) {
        var m = /(?:at\s+([^\s(]+)\s+\()?((?:https?:)[^\s()]+?):(\d+):(\d+)\)?\s*$/.exec(lines[i])
          || /^\s*([^@\s]*)@((?:https?:)[^\s]+?):(\d+):(\d+)\s*$/.exec(lines[i]);
        if (m && page(m[2])) {
          var p = new URL(m[2], location.href).pathname.split('/').pop() || 'index';
          return (m[1] ? m[1].replace(/^Object\.|^async\s+/, '') + '@' : '') + p + ':' + m[3] + ':' + m[4];
        }
      }
      if (file && page(file)) return (new URL(file, location.href).pathname.split('/').pop() || 'index') + ':' + (line || 0) + ':' + (col || 0);
      return '';
    }
    function report(msg, stack, file, line, col) {
      try {
        if (!(window.STATIC_SITE || window.ASHRY_ERR_REPORT) || !window.ROOMS_URL || !navigator.sendBeacon) return;
        if (navigator.onLine === false || count >= MAX) return;
        msg = String(msg || '').replace(/\s+/g, ' ').trim();
        if (!msg || NOISE.test(msg)) return;
        if (FOREIGN.test(String(file || '')) || FOREIGN.test(String(stack || ''))) return;
        var f = frameOf(stack, file, line, col);
        if (!f) return;   // not our page's code: another site's script, an extension, the browser
        var view = '';
        try { view = String((typeof appState !== 'undefined' && appState && appState.currentView) || ''); } catch (e) {}
        var b = String(window.BUILD_ID || '');
        var key = b + '|' + msg + '|' + f + '|' + view;
        if (sent[key]) return;
        sent[key] = 1;
        count++;
        navigator.sendBeacon(String(window.ROOMS_URL).replace(/\/+$/, '') + '/err',
          JSON.stringify({ b: b, m: msg.slice(0, 300), f: f, v: view }));
      } catch (e) { /* a report never throws */ }
    }
    window.addEventListener('error', function (e) {
      if (!e || e.target && e.target !== window) return;   // a missing image or script is not an error of ours
      var err = e.error;
      report((err && err.message) || e.message, err && err.stack, e.filename, e.lineno, e.colno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (!r) return;
      report(r.message || (typeof r === 'string' ? r : ''), r.stack, '', 0, 0);
    });
  })();
</script>
<script>
  /* --- SECURITY UTILS --- */
  function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
      );
  }

  /**
   * Escapes a value for use as a single-quoted JS string inside an inline
   * handler attribute, e.g. onclick="fn('${jsStringAttr(name)}')".
   *
   * escapeHTML is the wrong tool here: it turns ' into &#39;, and the HTML parser
   * decodes that back to a bare ' before the JS is ever compiled — so a player
   * called O'Brien produced fn('O'Brien'), a syntax error that left the button
   * silently dead. Backslash-escaping has to happen first (the HTML parser leaves
   * backslashes alone, so JS receives them), then the characters that would end
   * the attribute get entity-encoded.
   */
  function jsStringAttr(value) {
      return String(value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r?\n/g, '\\n')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
  }

  /* --- AUDIO SYSTEM --- */
  // A browser without Web Audio (or with it turned off) gets a silent stand-in:
  // creating it unguarded threw here and stopped this whole script - the app.
  const audioMake = () => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) return new Ctx();
    } catch (e) {}
    return null;
  };
  // `let`, not `const`: a context iOS won't wake is replaced (see wakeAudio), and
  // every sound in the app reads this binding (or fxCtx()) each time it plays.
  let audioCtx = audioMake() || (() => {
    const node = () => ({ connect() {}, disconnect() {}, start() {}, stop() {}, frequency: { setValueAtTime() {}, exponentialRampToValueAtTime() {}, linearRampToValueAtTime() {} }, gain: { setValueAtTime() {}, exponentialRampToValueAtTime() {}, linearRampToValueAtTime() {} } });
    return { stub: true, state: 'closed', currentTime: 0, destination: {}, resume() { return Promise.resolve(); }, createOscillator: node, createGain: node, createBiquadFilter: node, createBufferSource: node, createBuffer: () => ({ getChannelData: () => new Float32Array(1) }), createDynamicsCompressor: node, sampleRate: 44100 };
  })();
  let lastClickAt = 0;
  let lastTapClickAt = 0;

  /**
   * `fromTap` marks the click the delegated pointerdown handler plays for
   * every control. A handler that still clicks for itself runs on the click
   * event, 100-200ms after that pointerdown - which used to sound like a
   * double click on every such button - so a handler's click is dropped for
   * half a second after a tap's, and taps only collapse among themselves.
   */
  // The bomb alternates a higher and a lower knock: tick, tock.
  let bombTock = false;

  // iOS and Chrome keep the audio asleep until a touch, and put it back to sleep
  // when the phone locks or a call comes in ('suspended' or 'interrupted'). Any
  // touch or key wakes it again; a sound that arrives from the room without one
  // (the bomb landing on this phone) can't.
  //
  // On an iPhone that isn't always enough (the owner, 23 Sep 2026: "most of the
  // times when I join a room I don't hear the game, I must refresh"): joining
  // usually comes from another app that had the sound (the camera that read the
  // QR, WhatsApp), and opening a room goes out to the share sheet, and iOS leaves
  // the page's context 'interrupted' - or 'running' on paper and silent - where
  // resume() inside a tap no longer brings it back. A refresh made a new context,
  // which is why it helped. So a tap also plays a one-sample silent buffer (what
  // really opens iOS's output), and a context that is 'interrupted', or that a
  // tap already failed to wake, is thrown away and made again inside the tap,
  // where a new one always starts.
  let audioStuck = false, audioRemadeAt = 0, audioCheckAt = 0;
  const audioUnlock = (ctx) => {
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) {}
  };
  const wakeAudio = (e) => {
    if (audioCtx.stub) return;
    const inTap = !!(e && e.type);
    const now = Date.now();
    if (inTap && (audioCtx.state === 'interrupted' || audioCtx.state === 'closed' || audioStuck) && now - audioRemadeAt > 1500) {
      const fresh = audioMake();
      if (fresh) {
        try { if (audioCtx.state !== 'closed') audioCtx.close(); } catch (err) {}
        audioCtx = fresh;
        audioRemadeAt = now;
        audioStuck = false;
      }
    }
    if (audioCtx.state !== 'running' && audioCtx.state !== 'closed') {
      try { const p = audioCtx.resume(); if (p && p.catch) p.catch(() => {}); } catch (err) {}
    }
    if (!inTap) return;
    audioUnlock(audioCtx);
    // A moment later: still not running, or 'running' with its clock standing still
    // (no sound is really coming out), and the next tap makes a new one.
    if (now - audioCheckAt < 1000) return;
    audioCheckAt = now;
    const ctx = audioCtx, t0 = ctx.currentTime;
    setTimeout(() => {
      if (ctx !== audioCtx || document.hidden) return;
      if (ctx.state !== 'running' || ctx.currentTime - t0 < 0.1) audioStuck = true;
    }, 350);
  };
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wakeAudio(); });
  // The page coming back from the app switcher or a share sheet on iOS
  // (pageshow from the back-forward cache) is a return from away too.
  window.addEventListener('pageshow', () => wakeAudio());

  function playSound(type, fromTap, ownSound) {
    // Settings → الصوت: «الهزة بس» and «مقفول» play no effects (soundPref, below).
    // `ownSound`: a tool whose sound is the point (the general timer's alarm) is silenced
    // only by «مقفول» (the owner, audit 7 Oct 2026, H3).
    if (soundPref() === 'off' || (soundPref() !== 'on' && !ownSound)) return;
    if (type === 'click') {
      const now = Date.now();
      if (fromTap) {
        if (now - lastTapClickAt < 70) return;
        lastTapClickAt = now;
      } else if (now - lastTapClickAt < 500 || now - lastClickAt < 70) {
        return;
      }
      lastClickAt = now;
    }
    wakeAudio();
    // A suspended context has a frozen clock: ticks scheduled now would all play
    // at once, loudly, on the first touch. Repeating ticks are simply skipped
    // until sound is awake again.
    if ((type === 'bomb' || type === 'tick') && audioCtx.state !== 'running') return;
    if (type === 'bomb') {
        // A wooden knock loud enough to hear across a table: a pitched body and a click on top.
        bombTock = !bombTock;
        const at = audioCtx.currentTime;
        const body = audioCtx.createOscillator();
        const bodyGain = audioCtx.createGain();
        body.type = 'sine';
        body.frequency.setValueAtTime(bombTock ? 1250 : 930, at);
        body.frequency.exponentialRampToValueAtTime(bombTock ? 720 : 540, at + 0.07);
        bodyGain.gain.setValueAtTime(0.0001, at);
        bodyGain.gain.exponentialRampToValueAtTime(0.55, at + 0.004);
        bodyGain.gain.exponentialRampToValueAtTime(0.001, at + 0.1);
        body.connect(bodyGain); bodyGain.connect(audioCtx.destination);
        body.start(at); body.stop(at + 0.11);
        const click = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        click.type = 'square';
        click.frequency.setValueAtTime(2600, at);
        clickGain.gain.setValueAtTime(0.12, at);
        clickGain.gain.exponentialRampToValueAtTime(0.001, at + 0.015);
        click.connect(clickGain); clickGain.connect(audioCtx.destination);
        click.start(at); click.stop(at + 0.02);
        return;
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'pop') {
        // A face landing on the TV's stage (the owner, 3 Oct 2026): a short, soft
        // rising bubble, quieter than a tap.
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.16, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now); osc.stop(now + 0.17);
    } else if (type === 'tick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'alarm') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'miss') {
        // ideas batch: solo - a soft falling sigh for a wrong answer or a lost
        // board (the duels' 'lose'); the alarm is kept for real timers.
        osc.type = 'sine';
        osc.frequency.setValueAtTime(392, now);
        osc.frequency.exponentialRampToValueAtTime(247, now + 0.36);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.13, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        osc.start(now); osc.stop(now + 0.45);
    } else if (type === 'thud') {
        // ideas batch: solo - a soft low knock: "not yet" (a word too short).
        osc.type = 'sine';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.12);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.26, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now); osc.stop(now + 0.18);
    } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
  }

  /* --- TACTILE FEEDBACK ------------------------------------------------------
   * Two channels, both cheap and both optional: a short vibration where the
   * device supports it, and a ripple that starts at the finger. Between them a
   * tap feels acknowledged before any state has changed.
   * ------------------------------------------------------------------------ */

  const HAPTIC_PATTERNS = { light: 8, medium: 14, heavy: 22, double: [12, 40, 12] };
  const prefersReducedMotion = () => reducedMotion();

  /* --- Motion: the device's setting, unless this device's owner chose ----------
     Every animation in the app stands still when the device asks for reduced
     motion. Windows asks for it whenever its "Animation effects" switch is off,
     which it is on many PCs, so the owner saw no motion on a computer that
     plays everything else fine. Settings → الحركة: تلقائي follows the device,
     شغّالة plays it anyway, مقفولة stops it anyway. For "on", the stylesheets'
     reduced-motion blocks are lifted out (and put back for "auto"); for "off",
     their rules are added again without the media condition. */
  const MOTION_PREFS = ['auto', 'on', 'off'];
  const MOTION_KEY = 'ashryMotion';
  let motionMoved = [];

  function motionPref() {
    try {
      const v = localStorage.getItem(MOTION_KEY);
      return MOTION_PREFS.indexOf(v) !== -1 ? v : 'auto';
    } catch (e) { return 'auto'; }
  }

  function reducedMotion() {
    const pref = motionPref();
    if (pref === 'on') return false;
    if (pref === 'off') return true;
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function applyMotionPref() {
    const pref = motionPref();
    // Back to how the page was written.
    motionMoved.forEach(m => { try { m.sheet.insertRule(m.text, m.sheet.cssRules.length); } catch (e) {} });
    motionMoved = [];
    const off = document.getElementById('motion-off-style');
    if (off) off.remove();
    if (pref === 'auto') return;
    // Two kinds of block: "reduce" stills things, "no-preference" adds motion.
    const reduce = [], allow = [];
    Array.from(document.styleSheets).forEach(sheet => {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { return; }
      for (let i = rules.length - 1; i >= 0; i--) {
        const r = rules[i];
        const text = (r.media && (r.conditionText || r.media.mediaText)) || '';
        if (/prefers-reduced-motion:\s*reduce/.test(text)) reduce.push({ sheet: sheet, index: i, rule: r });
        else if (/prefers-reduced-motion:\s*no-preference/.test(text)) allow.push({ sheet: sheet, index: i, rule: r });
      }
    });
    // "On" lifts out what stills and applies what moves; "off" the other way round.
    const lift = pref === 'on' ? reduce : allow;
    const apply = pref === 'on' ? allow : reduce;
    lift.sort((a, b) => b.index - a.index).forEach(b => {
      motionMoved.push({ sheet: b.sheet, text: b.rule.cssText });
      try { b.sheet.deleteRule(b.index); } catch (e) {}
    });
    const style = document.createElement('style');
    style.id = 'motion-off-style';
    style.textContent = apply.map(b => Array.from(b.rule.cssRules).map(r => r.cssText).join(' ')).join(' ');
    // At the end of <body>, after the app's own stylesheets (they are in <body> too):
    // in <head> every copied rule without !important lost to the base rule of the
    // same weight, so «مقفولة» hid what the device's reduced motion keeps on screen.
    (document.body || document.head).appendChild(style);
  }

  function cycleMotionPref() {
    const next = MOTION_PREFS[(MOTION_PREFS.indexOf(motionPref()) + 1) % MOTION_PREFS.length];
    try { localStorage.setItem(MOTION_KEY, next); } catch (e) {}
    applyMotionPref();
    updateSettingsLabels();
  }

  /* --- Sound: Settings → الصوت (the owner's pick 1239, 7 Oct 2026) ---------------
     شغّال: everything; الهزة بس: no taps, dings or fanfares, the buzz stays (a quiet
     table, a late night); مقفول: neither. Read by playSound, playFx and haptic - the
     effects. A game whose sound is the game itself plays whatever this says: دندنها's
     clips, the chairs' music and the zaffa (their own players, not these three), and the
     soundboard, which is pressed to make a sound. Kept per device, so a TV keeps its own. */
  const SOUND_PREFS = ['on', 'buzz', 'off'];
  const SOUND_KEY = 'ashrySound';
  function soundPref() {
    try {
      const v = localStorage.getItem(SOUND_KEY);
      return SOUND_PREFS.indexOf(v) !== -1 ? v : 'on';
    } catch (e) { return 'on'; }
  }
  function cycleSoundPref() {
    const next = SOUND_PREFS[(SOUND_PREFS.indexOf(soundPref()) + 1) % SOUND_PREFS.length];
    try { localStorage.setItem(SOUND_KEY, next); } catch (e) {}
    updateSettingsLabels();
    // What it sounds like now: a buzz for «الهزة بس», a click for «شغّال».
    if (next === 'on') playSound('success');
    else if (next === 'buzz') haptic('double');
  }

  /** Vibrates if the device and browser allow it. iOS Safari has no vibrate. */
  function haptic(kind = 'light') {
      if (!navigator.vibrate || prefersReducedMotion() || soundPref() === 'off') return;
      try { navigator.vibrate(HAPTIC_PATTERNS[kind] || HAPTIC_PATTERNS.light); } catch (e) {}
  }

  /* Every host listed here must be `position: relative; overflow: hidden` in
     Style.html, or the ripple escapes its box. See the ".ripple" rule there. */
  const RIPPLE_TARGETS = '.btn, .game-card, .tool-item, .row--interactive, .setting-row, .nav-item, .key';

  document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
      if (!host || host.disabled || prefersReducedMotion()) return;

      const rect = host.getBoundingClientRect();
      // One circle big enough to cover the element from wherever it started.
      const size = Math.max(rect.width, rect.height) * 1.1;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';

      // The ripple is absolutely positioned, so the host has to be a stacking
      // context for it; .btn and the tiles already are.
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      host.appendChild(ripple);

      // animationend is the normal path, but never the only one: if the
      // animation doesn't run the node would stay in the DOM forever, and in a
      // flex host that means it keeps taking up space.
      const drop = () => ripple.remove();
      ripple.addEventListener('animationend', drop);
      setTimeout(drop, 800);
  }, { passive: true });

  /* Every tap on a control gets a click and a nudge from here, so individual
     handlers don't each have to remember playSound('click'). They still raise
     the meaningful sounds themselves — success, alarm, tick.
     A finger's click waits for it to lift: a scroll that starts on a card or a
     button (most of the home) is a cancelled pointer, and used to click and
     buzz on every swipe. A mouse clicks on press. */
  let tapFeedbackHost = null;
  document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
      tapFeedbackHost = null;
      if (!host || host.disabled) return;
      if (e.pointerType === 'touch') { tapFeedbackHost = host; return; }
      playSound('click', true);
      haptic('light');
  }, { passive: true });
  document.addEventListener('pointerup', () => {
      const host = tapFeedbackHost;
      tapFeedbackHost = null;
      if (!host || host.disabled) return;
      playSound('click', true);
      haptic('light');
  }, { passive: true });
  document.addEventListener('pointercancel', () => { tapFeedbackHost = null; }, { passive: true });

  /**
   * Fisher-Yates shuffle into a new array. Every "random order" in the app goes
   * through this: sort(() => Math.random() - 0.5) is biased towards the start.
   */
  function shuffleArray(arr) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /* --- NO-REPEAT MEMORY --- */

  // Most word games picked at random, or forgot what they had shown the moment a
  // new round began, so the same cards came back within a couple of games however
  // long the list was. This remembers, per phone and per list, what has been
  // dealt; a list only starts over once all of it has been seen.
  const SEEN_KEY = 'ashrySeen_v1';
  let seenLists = null;

  function readSeenLists() {
    if (seenLists) return seenLists;
    try { seenLists = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }
    catch (e) { seenLists = {}; }
    return seenLists;
  }

  /** "Reset everything" has to mean this too. */
  function forgetSeenLists() {
    seenLists = {};
    try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  }

  /* --- FIRST-PLAY CARD STORAGE ---
     The first time a phone opens a game's setup or has it chosen in a room,
     a 3-step card introduces it. Once dismissed or opened into rules, that game
     is marked seen in localStorage['ashryFirstPlay_v1']. */
  const FIRST_PLAY_KEY = 'ashryFirstPlay_v1';

  function readFirstPlay() {
    try {
      const raw = localStorage.getItem(FIRST_PLAY_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function firstPlaySeen(key) {
    if (!key) return true;
    return readFirstPlay().indexOf(key) !== -1;
  }

  function firstPlayMarkSeen(key) {
    if (!key) return;
    const list = readFirstPlay();
    if (list.indexOf(key) === -1) {
      list.push(key);
      try {
        localStorage.setItem(FIRST_PLAY_KEY, JSON.stringify(list));
      } catch (e) {}
    }
  }

  /**
   * Deals `count` items from `pool` that this phone has not had from `listId`.
   *
   *   key    how an item is identified (default: the string itself, or its JSON)
   *   avoid  keys to leave out this time only - the cards already up in the
   *          current round - without counting them as dealt
   *
   * Several pools can share one list (Who Am I's categories): starting over only
   * forgets the items of the pool being dealt from.
   */
  function freshPick(listId, pool, count, options) {
    const opts = options || {};
    const keyOf = opts.key || (x => typeof x === 'string' ? x : JSON.stringify(x));
    const avoid = new Set(opts.avoid || []);
    const candidates = (pool || []).filter(x => !avoid.has(keyOf(x)));
    const want = Math.max(0, Math.min(count === undefined ? 1 : count, candidates.length));
    if (!want) return [];

    const lists = readSeenLists();
    const dealt = new Set(lists[listId] || []);
    const unseen = candidates.filter(x => !dealt.has(keyOf(x)));
    let picks;

    if (unseen.length >= want) {
      picks = shuffleArray(unseen).slice(0, want);
      picks.forEach(x => dealt.add(keyOf(x)));
    } else {
      // The list has run out: deal what is left of it, then start it over for
      // the rest. The refill comes from what was dealt longest ago (the stored
      // list is in dealing order), and everything dealt now opens the new cycle -
      // marking only the refill let the last of the old cycle come straight back.
      const leftKeys = new Set(unseen.map(keyOf));
      const age = new Map((lists[listId] || []).map((k, i) => [k, i]));
      const older = candidates.filter(x => !leftKeys.has(keyOf(x)))
        .sort((a, b) => (age.has(keyOf(a)) ? age.get(keyOf(a)) : -1) - (age.has(keyOf(b)) ? age.get(keyOf(b)) : -1));
      const need = want - unseen.length;
      const refill = shuffleArray(older.slice(0, Math.max(need, Math.ceil(older.length / 2)))).slice(0, need);
      picks = shuffleArray(unseen).concat(refill);
      pool.forEach(x => dealt.delete(keyOf(x)));
      // The cards already up this round (avoid) were dealt from this pool too:
      // they open the new cycle with the picks, or they come straight back.
      pool.forEach(x => { if (avoid.has(keyOf(x))) dealt.add(keyOf(x)); });
      picks.forEach(x => dealt.add(keyOf(x)));
    }

    lists[listId] = [...dealt];
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(lists)); } catch (e) {}
    return picks;
  }

  /* --- REMEMBERED CHOICES ---
     A game's options open the way they were last left on this phone: what the
     table picked is the default next time, and a change is kept the moment it
     is made, not when the game starts. Most games keep theirs in their own
     slice of appState (saved with the rest) or under a key of their own; these
     are for choices that live nowhere else - a module variable, a plain field -
     all under one key, which "delete all data" clears with the rest.

       recallOptions('chooser', { mode: 'one' })    the saved object over the defaults
       rememberOptions('chooser', { mode: 'two' })  merged into what is saved

     A setup field marked data-remember (a stepper, a switch, a range, a hidden
     time field, a category list) is kept by its id whenever it changes, and
     put back by paintSetupOptions before the screen's painter runs; a list
     filled in JS calls recallField itself once its options exist. Only
     choices: never mark a secret word, a number to guess or a name typed for
     one round. */
  const OPTIONS_KEY = 'ashryOptions_v1';

  const isPlainObject = (v) => !!v && typeof v === 'object' && !Array.isArray(v);

  function readOptionsStore() {
    try {
      const all = JSON.parse(localStorage.getItem(OPTIONS_KEY) || '{}');
      return isPlainObject(all) ? all : {};
    } catch (e) { return {}; }
  }

  function recallOptions(key, defaults) {
    const saved = readOptionsStore()[key];
    if (isPlainObject(defaults)) return Object.assign({}, defaults, isPlainObject(saved) ? saved : {});
    return saved === undefined ? defaults : saved;
  }

  function rememberOptions(key, value) {
    const all = readOptionsStore();
    all[key] = isPlainObject(value) && isPlainObject(all[key]) ? Object.assign({}, all[key], value) : value;
    try { localStorage.setItem(OPTIONS_KEY, JSON.stringify(all)); } catch (e) {}
    return all[key];
  }

  function rememberField(el) {
    if (!el || !el.id) return;
    if (el.type === 'checkbox') { rememberOptions('fields', { [el.id]: !!el.checked }); return; }
    const value = String(el.value == null ? '' : el.value);
    // An emptied number box is a field being retyped, not a choice.
    if (value.trim() === '' && (el.type === 'number' || el.tagName === 'SELECT')) return;
    rememberOptions('fields', { [el.id]: value });
  }

  /** Puts one field back as it was last left; false when there is nothing to put back. */
  function recallField(el) {
    if (!el || !el.id) return false;
    setupDefaultSnapshot(el);
    if (el === document.activeElement) return false;
    const saved = recallOptions('fields', {});
    if (!(el.id in saved)) return false;
    const v = saved[el.id];
    if (el.type === 'checkbox') { el.checked = !!v; return true; }
    let text = String(v);
    if (el.tagName === 'SELECT') {
      if (![...el.options].some(o => o.value === text)) return false;
    } else if (el.type === 'number') {
      let n = Number(text);
      if (text.trim() === '' || !isFinite(n)) return false;
      const min = el.dataset.min !== undefined ? Number(el.dataset.min) : (el.min !== '' ? Number(el.min) : NaN);
      const max = el.dataset.max !== undefined ? Number(el.dataset.max) : (el.max !== '' ? Number(el.max) : NaN);
      if (isFinite(min)) n = Math.max(min, n);
      if (isFinite(max)) n = Math.min(max, n);
      text = String(n);
    }
    el.value = text;
    return true;
  }

  /* What a field shows before anything remembered is put back is the game's own
     default (1220, «رجّع الأصلي»): kept on the field the first time it is recalled,
     before the recall. A list filled in JS is still empty then, so an empty
     default of a <select> is taken again once its options exist. */
  function setupDefaultSnapshot(el) {
    const have = el.dataset.def !== undefined;
    if (have && !(el.tagName === 'SELECT' && el.dataset.def === '')) return;
    el.dataset.def = el.type === 'checkbox' ? (el.checked ? '1' : '') : String(el.value == null ? '' : el.value);
  }

  function recallFields(root) {
    if (root) root.querySelectorAll('[data-remember]').forEach(recallField);
  }

    if (el && el.matches && el.matches('[data-remember]')) rememberField(el);
  }));

  /* --- CLOCKS --- */

  // Every live clock, so clearAllIntervals() can stop them and so they can all be
  // re-read when the tab comes back to the foreground.
  const activeClocks = new Set();

  /**
   * A pausable clock anchored to Date.now().
   *
   * Every timer in the app used to sit on setInterval(..., 1000) and decrement a
   * counter. That drifts, and on mobile it does worse than drift: browsers
   * throttle or suspend timers in backgrounded tabs, so locking the screen or
   * switching apps mid-round quietly froze the clock and it resumed as if no time
   * had passed. Reading elapsed time from the clock instead of counting ticks
   * keeps it honest, and each tick is scheduled at the next whole-second boundary
   * rather than 1000ms after the last one, so the display cannot slide.
   *
   *   seconds  countdown length (ignored when countUp is set)
   *   countUp  count up from zero instead of down (imposter's discussion timer)
   *   onTick   called with the whole-second value whenever it changes
   *   onEnd    called once when a countdown reaches zero
   */
  function createClock(options) {
      const countUp = !!options.countUp;
      // `ms` for a countdown that must keep its fraction of a second (the chess clock).
      const totalMs = options.ms != null
          ? Math.max(0, Math.round(options.ms))
          : Math.max(0, Math.round(options.seconds || 0)) * 1000;
      const onTick = options.onTick || function() {};
      const onEnd = options.onEnd || function() {};

      let elapsedBefore = 0;        // ms banked from previous (pre-pause) runs
      let startedAt = Date.now();   // when the current run began
      let timeoutId = null;
      let paused = false;
      let finished = false;
      let lastValue = null;

      const elapsedMs = () =>
          elapsedBefore + ((paused || finished) ? 0 : Date.now() - startedAt);

      const value = () => countUp
          ? Math.floor(elapsedMs() / 1000)
          : Math.max(0, Math.ceil((totalMs - elapsedMs()) / 1000));

      const emit = () => {
          const v = value();
          if (v !== lastValue) {
              lastValue = v;
              onTick(v);
          }
      };

      const cancel = () => {
          if (timeoutId) clearTimeout(timeoutId);
          timeoutId = null;
      };

      // Aim at the next whole-second boundary of the elapsed time, so a late
      // wake-up is absorbed instead of accumulating.
      const schedule = () => {
          cancel();
          timeoutId = setTimeout(step, Math.max(25, 1000 - (elapsedMs() % 1000)));
      };

      function step() {
          timeoutId = null;
          if (paused || finished) return;
          emit();
          if (!countUp && elapsedMs() >= totalMs) {
              finished = true;
              activeClocks.delete(clock);
              onEnd();
              return;
          }
          schedule();
      }

      const clock = {
          /** Re-read the clock right now (used when the tab regains focus). */
          sync() {
              // step() only forgets the pending timer's id, so cancel it first -
              // otherwise every wake from the lock screen left one more chain running.
              if (!paused && !finished) { cancel(); step(); }
              return clock;
          },
          pause() {
              if (paused || finished) return clock;
              elapsedBefore = elapsedMs();
              paused = true;
              cancel();
              return clock;
          },
          resume() {
              if (!paused || finished) return clock;
              paused = false;
              startedAt = Date.now();
              emit();
              schedule();
              return clock;
          },
          /** Pause or resume; returns true if the clock is now paused. */
          toggle() {
              if (paused) clock.resume(); else clock.pause();
              return paused;
          },
          stop() {
              finished = true;
              cancel();
              activeClocks.delete(clock);
              return clock;
          },
          isPaused: () => paused,
          isRunning: () => !paused && !finished,
          value: value,
          // A clock that goes on when its screen is left (the general timer).
          keepRunning: !!options.keepRunning
      };

      activeClocks.add(clock);
      emit();
      schedule();
      return clock;
  }

  /** Stops every running clock, except one asked to keep running. */
  function stopAllClocks() {
      [...activeClocks].forEach(c => { if (!c.keepRunning) c.stop(); });
  }

  /* A sheet over a game on one phone (leave this game?, the rules) stops the
     game's clocks while it is read, and "carry on" starts them again. A room's
     clocks belong to the server, so they are left alone. */
  let sheetPausedClocks = [];
  let sheetPausedSolo = null;   // the solo board's state a sheet paused
  function pauseClocksForSheet() {
      const view = String(appState.currentView || '');
      // The bomb's fuse is a secret: stopping it on a popup would tell the table.
      if (view.indexOf('room-') === 0 || view === 'play-bomb') return;
      [...activeClocks].forEach(c => {
          if (c.keepRunning || !c.isRunning()) return;
          c.pause();
          sheetPausedClocks.push(c);
      });
      // A timed solo board counts its time from `startedAt`, not from the
      // ticker: stop that too, or the minutes spent reading land in the result.
      const g = typeof soloGameOnScreen === 'function' ? soloGameOnScreen() : null;
      // الذاكرة counts from `startedAt` the same way, without being a registered solo game.
      const mem = !g && view === 'play-memory' && typeof memoryState === 'function' ? memoryState() : null;
      if (((g && g.timed && g.state) || mem) && !sheetPausedSolo) {
          const s = mem || g.state();
          if (s && s.phase === 'play' && !s.pausedAt && typeof soloPause === 'function') { soloPause(s); sheetPausedSolo = s; }
      }
  }
  function resumeClocksAfterSheet() {
      const clocks = sheetPausedClocks;
      sheetPausedClocks = [];
      const s = sheetPausedSolo;
      sheetPausedSolo = null;
      // Only while its board is still on screen: a sheet that led away (another
      // game, the setup) leaves it paused, as leaving the board always does.
      const g = s && typeof soloGameOnScreen === 'function' ? soloGameOnScreen() : null;
      if (g && g.state && g.state() === s) {
          soloResume(s);
          if (typeof soloClockRefresh === 'function') soloClockRefresh();
      } else if (s && appState.currentView === 'play-memory' && typeof memoryState === 'function' && memoryState() === s) {
          soloResume(s);
      }
      clocks.forEach(c => { if (activeClocks.has(c)) c.resume(); });
  }

  // A backgrounded tab may not have been able to fire its pending tick, so
  // re-read every clock the moment we are visible again.
  document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
          [...activeClocks].forEach(c => c.sync());
      }
  });

  const PLAYER_LIBRARY_KEY = 'ashryPlayers_v1';

   * lists (SPY_WORDS_EN, SPY_PAIRS_EN in SpyWords.js) when contentLang() is

  function spyCategories() {

  }
  function spyPairs() {

  /** Case- and spelling-insensitive, so أحمد and احمد are the same person. */
  function samePlayer(a, b) {
    const fold = (x) => String(x || '').trim().toLowerCase()
      .replace(/[\u064b-\u0652\u0670]/g, '')
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
      .replace(/\u0629/g, '\u0647')
      .replace(/[\u0649\u064a]/g, '\u064a')
      .replace(/\s+/g, ' ');
    return fold(a) === fold(b);
  }

   * The spellings of one word, folded: أسد and اسد, مكتبة and مكتبه, مصطفى and
   * مصطفي, diacritics, the tatweel, punctuation, spaces, and a leading "ال" or
   * "the". It is normaliseClue (app/Common.js), the very function the rooms
   * server judges with, so a phone refuses the same Codenames clue the server
   * would, and the one-phone Just One removes the same duplicate clues a room does.
   */
  function foldWord(text) { return normaliseClue(text); }

   * way round. 'auto' follows the app. Every bank lookup, freshPick key and
   * room start payload goes through this, never through appState.lang.
   */
  function contentLang() {
    const g = appState.gameLang;
    if (g === 'ar' || g === 'en') return g;
    return appState.lang === 'en' ? 'en' : 'ar';

  function addToPlayerLibrary(rawName) {

    syncChrome(appState.currentView);

    // catalog in this language (JS_Catalog.html).

  /** The marked text of `root` (the page, or a game's screens as they come in) in the app's language. */
  function translateIn(root) {
    const t = TRANSLATIONS[appState.lang];
    const all = (sel) => {
      const list = Array.from(root.querySelectorAll(sel));
      if (root !== document && root.matches && root.matches(sel)) list.unshift(root);
      return list;
    };

    all('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] && el.innerHTML !== t[key]) el.innerHTML = t[key];
    });

    all('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (!t[key]) return;
      if (el.placeholder !== t[key]) el.placeholder = t[key];
      // A field with no label of its own is named by its placeholder for a screen reader
      // (the placeholder goes as soon as something is typed). One with a <label> keeps it.

   * sit inside <main> in Controller.html, and on iPhone a position:fixed element
   * inside that scrolling area is drawn inside it: the header and the bottom nav
   * covered the popup and its buttons. Moved under <body> once at start-up,
   * every popup covers the whole screen. A game's own popup that comes with its
   * chunk (7 Oct 2026) has a comment in its place, <!--[lz-pop:id]-->: the
   * comment moves with the others, so the popup comes in where it always was

    for (let n = walk.nextNode(); n; n = walk.nextNode()) found.push(n);

   * JS_Lazy.html; the owner's B1, 7 Oct 2026): what the start-up does to the
   * page's markup is done to them, so they are what they were when the page
   * carried them all. Markup that comes before the start-up (lzBootWrite) is
   * the start-up's.

  /* A popup shuts the page behind it (the owner's pick C3, 7 Oct 2026, in place of
     the 30 Sep call of no focus trap): while one is open the shell is `inert`, so
     Tab on a laptop hosting a room stays in the popup and VoiceOver reads only it;
     of popups stacked (a confirm over Settings) only the top one is live. Focus
     goes to the popup when it opens and back to what opened it when the last one
     closes. Worked out from the page each time, never kept: a stale `inert` would
     leave the whole app dead to taps, so closeModal and closeAllModals run it too. */
  let modalOpener = null;
  function syncModalInert() {
    const shell = document.querySelector('.shell');
    if (!shell) return;
    const open = [...document.querySelectorAll('.modal-overlay:not(.hidden)')];
    const top = open.length ? topModal() : null;
    if (top && !shell.inert) {
      const a = document.activeElement;
      modalOpener = a && a !== document.body && !top.contains(a) ? a : null;
    }
    shell.inert = !!top;
    open.forEach(o => { o.inert = o !== top; });
    document.querySelectorAll('.modal-overlay.hidden').forEach(o => { if (o.inert) o.inert = false; });
    if (top) {
      if (!top.contains(document.activeElement)) {
        const content = top.querySelector('.modal-content') || top;
        if (!content.hasAttribute('tabindex')) content.setAttribute('tabindex', '-1');
        try { content.focus({ preventScroll: true }); } catch (e) {}
      }
    } else if (modalOpener) {
      const back = modalOpener;
      modalOpener = null;
      if (back.isConnected && back.offsetParent !== null && (document.activeElement === document.body || !document.activeElement)) {
        try { back.focus({ preventScroll: true }); } catch (e) {}
      }
    }
  }

  /** A popup is named by its title: some are filled in when they open (the exit sheet),
      so this runs again every time one opens. */
  let modalTitleSeq = 0;
  function labelModal(overlay) {
    const content = overlay.querySelector('.modal-content');
    const title = content && content.querySelector('.sheet__title, h2, h3');
    if (!title) return;

  /* Escape closes the popup on top, exactly as the phone's back does (edgeBack: each

     key press never leaves a screen. */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    if (!closeTopModal()) return;
    e.preventDefault();
  });

  /** The popup drawn on top: an alert or a confirm sits above a sheet whatever its place in
      the page (--z-alert, --z-confirm), then the later in the page. */
  function topModal() {
    const open = [...document.querySelectorAll('.modal-overlay:not(.hidden)')];
    if (!open.length) return null;
    const z = (el) => parseInt(getComputedStyle(el).zIndex, 10) || 0;
    return open.reduce((a, b) => (z(b) >= z(a) ? b : a));

      phone's back and the edge swipe all go through here. */

    if (top.id) closeModal(top.id); else { modalExitGhost(top); top.classList.add('hidden'); }

  }

  /* Moved under <body>, a popup no longer sits inside its game's screen, so it
     lost the game's colour and every result, exit and confirm sheet came up
     violet. It takes the colour of the screen it opens over, unless the popup
     sets one of its own (data-accent in the markup). */
  function tintModal(overlay) {
    const content = overlay.querySelector('.modal-content');
    if (!content) return;
    if (content.hasAttribute('data-accent') && !content.hasAttribute('data-accent-auto')) return;
    const meta = VIEW_META[appState.currentView] || {};
    if (meta.accent) {
      content.setAttribute('data-accent', meta.accent);
      content.setAttribute('data-accent-auto', '');
    } else if (content.hasAttribute('data-accent-auto')) {
      content.removeAttribute('data-accent');
      content.removeAttribute('data-accent-auto');
    }
  }

  const syncEl = document.getElementById('sync-status');
  function setSyncing(isSyncing) {

    else syncEl.classList.remove('syncing');
  }

   /* --- INITIALIZATION --- */
   document.addEventListener('DOMContentLoaded', function() {
     // From here a game's screens that come with its chunk are adopted as they come.
     markupStarted = true;
     hoistModals();
     // A throw in start-up must not cost the service worker and the rooms (a ?room= link).
     try { initializeApp(); } catch (e) { console.error('init', e); }
     registerServiceWorker();

     if (typeof initRooms === 'function') initRooms();
     // A «الشلة» link (?crew=CODE, /s/CODE): the crew's page and its join sheet.
     if (typeof initCrews === 'function') initCrews();

     document.body.addEventListener('click', function initWakeLock() {
         if (typeof requestWakeLock === 'function') {
             requestWakeLock(); 
         }
     }, { once: true });

     });

  function registerServiceWorker() {

    // never runs against a cached copy. docs/sw.js keeps an offline copy of the
    // app; tools/build-site.mjs writes it.
    if (!window.STATIC_SITE || !('serviceWorker' in navigator)) return;
    const hadController = !!navigator.serviceWorker.controller;
    // A new build taking over while Settings is open: its version row says so at once.
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      const m = document.getElementById('settings-modal');
      if (m && !m.classList.contains('hidden')) paintAppVersion();
    });
    const reg = navigator.serviceWorker.register('sw.js').catch(() => null);
    // The app opens from the copy on the phone (docs/sw.js), so a new build is found by
    // asking for sw.js again. The browser does that when the app is opened; an iPhone
    // home-screen copy can sit in the background for days, so ask on coming back too
    // (at most every 10 minutes).
    let askedAt = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || Date.now() - askedAt < 600000) return;
      askedAt = Date.now();
      reg.then(r => r && r.update()).catch(() => {});
    });

    // load before the worker is in charge, so it never saw them, and offline the
    // app lost its fonts. Once a worker controls the page, ask for them again
    // through it so it keeps them: a few requests, almost always answered from
    // the browser's own cache, well after the app has started.
    const warm = () => setTimeout(() => {
      try {
        const pinned = /^https:\/\/(cdn\.jsdelivr\.net|fonts\.googleapis\.com|fonts\.gstatic\.com)\//;
        performance.getEntriesByType('resource').map(e => e.name).filter(u => pinned.test(u))
          .forEach(u => fetch(u, { mode: 'cors', credentials: 'omit' }).catch(() => {}));
        // Baloo is loaded only when a card game opens (ensureBalooFont), so a phone
        // may never have asked for it: keep its stylesheet and its files too.
        fetch(BALOO_URL, { mode: 'cors', credentials: 'omit' }).then(r => r.text()).then(css => {
          (css.match(/https:\/\/fonts\.gstatic\.com\/[^)\s'"]+/g) || [])
            .forEach(u => fetch(u, { mode: 'cors', credentials: 'omit' }).catch(() => {}));

    if (hadController) warm();
    else navigator.serviceWorker.addEventListener('controllerchange', warm, { once: true });

    // once, with a tap to load it - an iPhone home-screen copy can stay open for
    // days and has no reload button. Not on a first visit, when there was no
    // worker before and nothing is out of date.
    let told = false;
    let controlled = hadController;
    navigator.serviceWorker.addEventListener('controllerchange', async () => {
      // Settings → تحديث البيانات asked for the new build: it is here, so switch now -
      // unless a game or a room has been opened since, when the note below says so.
      if (appUpdateAsked) { if (appUpdateForced || appUpdateSafeView()) { reloadApp(); return; } controlled = true; }
      // A first visit's first worker taking over is not news - but from then on the
      // page is controlled, and a later build taking over is.
      if (!controlled) { controlled = true; return; }
      if (told) return;
      // A first visit, or a page that already is the new build (a phone that had no
      // copy yet went to the network), is not news: only a page older than the worker is.
      try {
        const res = await fetch('sw.js', { cache: 'no-store' });
        const m = /const CACHE = 'ashry-(\d+)'/.exec(await res.text());
        if (m && window.BUILD_ID && m[1] === window.BUILD_ID) return;
      } catch (e) { return; }   // offline: nothing new can be loaded anyway
      if (told) return;
      told = true;
      // The new build is already on the phone, so switching is a fraction of a second.
      // It happens by itself when nothing is lost: under the intro, or on the home,
      // مع بعض or الأدوات with no room open, no popup, no field being typed in and no
      // tap for a few seconds - or when the app goes to the background. In a game or
      // a room the note below says so, and a tap switches.
      if (appUpdateQuiet()) { reloadApp(); return; }
      appUpdateWatch();
      const t = TRANSLATIONS[appState.lang] || {};
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'toast info toast--action';
      el.textContent = '✨ ' + (t.update_ready || 'فيه نسخة جديدة من التطبيق - اضغط للتحديث');

      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 15000);
    });

  /* --- a new build, switched to when nothing is lost (registerServiceWorker) --- */
  let lastTapAt = 0;

  document.addEventListener('keydown', () => { lastTapAt = Date.now(); }, true);

  // Screens a reload loses nothing on: the three tabs and the setup screens (their
  // choices are saved as they change) - never a game being played or a room.
  function appUpdateSafeView() {
    const v = appState.currentView || '';
    if (typeof Room !== 'undefined' && Room.state) return false;
    return ['menu', 'together', 'tools'].indexOf(v) !== -1 || v.indexOf('setup-') === 0;
  }

  function appUpdateQuiet() {
    // Still on the intro: nothing is on screen yet - unless the page was opened to
    // join a room or to install (the build has taken ?room= / ?install=1 off the
    // address, so a reload would lose them), or a room is already open.
    if (typeof intro !== 'undefined' && intro.state !== 'done') {
      const pending = (window.SERVER_DATA && (window.SERVER_DATA.room || window.SERVER_DATA.crew)) || window.OPEN_INSTALL
        || (typeof Room !== 'undefined' && (Room.state || Room.isIn));
      return !pending;
    }
    // While someone is on a setup screen, choosing: only when the app goes to the background.
    if (!appUpdateSafeView() || (appState.currentView || '').indexOf('setup-') === 0) return false;
    if (document.querySelector('.modal-overlay:not(.hidden)')) return false;
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return false;
    return Date.now() - lastTapAt > 4000;
  }

  // Waiting for a quiet moment: every few seconds, and when the app goes to the background.
  function appUpdateWatch() {
    if (appUpdateWatch.on) return;   // one watch, however many paths ask for it
    appUpdateWatch.on = true;
    const tick = setInterval(() => { if (appUpdateQuiet()) { clearInterval(tick); reloadApp(); } }, 3000);
    // Gone to the background on a screen that loses nothing: back to the new build.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && appUpdateSafeView()) { clearInterval(tick); reloadApp(); }
    });
  }

  function saveActivePlayers(selectedArray) {
    if (selectedArray && selectedArray.length > 0) {
        appState.activePlayers = selectedArray;
        saveToLocal();
    }
}

  /* --- The intro ---------------------------------------------------------------
     The page opens on the brand mark (#app-loader, drawn by the critical CSS in
     Controller.html before any script runs). Once the app is ready, and no
     sooner than INTRO_MIN_MS after the intro went up, the mark flies into its
     place in the home header while the ground fades and the home rises in under
     it. It only flies when the app opens on the home screen: a reload that lands
     in a game or a room, a join link, a phone set to reduce motion, a hidden
     tab, or a tap on the intro all get a quick fade instead. Every step runs on
     a timer - an animation event is never the only path (see GEMINI.md). */
  const INTRO_MIN_MS = 1300;
  const INTRO_FLIGHT_MS = 800;
  const intro = { state: 'waiting', skip: false, timers: [], flight: null };

  function introLater(fn, ms) { intro.timers.push(setTimeout(fn, ms)); }

  /** Takes the intro away once the app is ready: a flight home when it can, a fade when it can't. */
  function introExit() {
    if (intro.state !== 'waiting') return;
    const loader = document.getElementById('app-loader');
    if (!loader) { intro.state = 'done'; return; }
    intro.state = 'leaving';
    // The slow-load scene (Controller.html), if one is up, fades before the flight.
    const sceneMs = introSceneEnd();
    const reduce = reducedMotion();
    const onHome = appState.currentView === 'menu'
      && !(window.SERVER_DATA && (window.SERVER_DATA.room || window.SERVER_DATA.crew))
      && !window.OPEN_INSTALL && !/[?&]install=1/.test(location.search);
    if (intro.skip || reduce || !onHome || document.hidden) {
      introFade(intro.skip ? 150 : 350);
      return;
    }
    const shown = (window.performance ? performance.now() : 0) - (window.INTRO_T0 || 0);
    introLater(introFly, Math.max(sceneMs, INTRO_MIN_MS - shown));
  }

  /** Stops the slow-load scene: its timers go at once; returns how long it takes to fade. */
  function introSceneEnd() {
    return typeof window.introSceneStop === 'function' ? window.introSceneStop() : 0;
  }

  function introFly() {
    if (intro.state !== 'leaving') return;
    const loader = document.getElementById('app-loader');
    const mark = loader && loader.querySelector('.mark--loader');
    const target = document.querySelector('#app-title .mark--title');
    const landing = target ? target.getBoundingClientRect() : null;
    // Somewhere else by now (a room link resumed), or nowhere to land: just fade.
    if (!mark || !landing || !landing.width || appState.currentView !== 'menu' || typeof mark.animate !== 'function') {
      introFade(350);
      return;
    }
    mark.style.animation = 'none';
    // The centre from the screen; the size from the style, because the entrance
    // may still be scaling the mark (a slow phone, a tab that wasn't painting)
    // and a scale taken from a shrunken rect lands it too big.
    const from = mark.getBoundingClientRect();
    const size = parseFloat(getComputedStyle(mark).width) || from.width;
    const dx = (landing.left + landing.width / 2) - (from.left + from.width / 2);
    const dy = (landing.top + landing.height / 2) - (from.top + from.height / 2);
    document.body.classList.add('intro-flying');
    loader.classList.add('is-flying');
    intro.flight = mark.animate(
      [{ transform: 'none' }, { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + (landing.width / size) + ')' }],
      { duration: INTRO_FLIGHT_MS, easing: 'cubic-bezier(0.7, 0, 0.2, 1)', fill: 'forwards' }
    );
    introLater(() => document.body.classList.add('intro-reveal'), 320);
    introLater(() => introDone(loader), INTRO_FLIGHT_MS - 10);
  }

  function introFade(ms) {
    const loader = document.getElementById('app-loader');
    intro.state = 'leaving';
    introSceneEnd();
    document.body.classList.remove('intro-flying');
    if (!loader) { intro.state = 'done'; return; }
    loader.style.transition = 'opacity ' + ms + 'ms ease-out';
    loader.style.opacity = '0';
    introLater(() => introDone(loader), ms);
  }

  function introDone(loader) {
    intro.state = 'done';
    introSceneEnd();
    if (loader) {
      loader.style.display = 'none';
      loader.classList.add('hidden');
    }
    document.body.classList.remove('intro-flying');
    if (intro.flight) {
      try { intro.flight.cancel(); } catch (e) {}
      intro.flight = null;
    }
    // The home's rise has finished by then; take the class off so a later visit doesn't replay it.
    setTimeout(() => document.body.classList.remove('intro-reveal'), 900);
    // A phone's browser is asked to put the app on the home screen (JS_Utils.html).
    if (typeof installAskSoon === 'function') installAskSoon();
    // The quiet notes of a start (the owner's picks of 7 Oct 2026, third batch): what a new
    // build brought, the bigger size on a TV, the bar inside another app's browser.
    setTimeout(() => {
      try { appUpdateNews(); } catch (e) {}
      try { uiScaleOfferTv(); } catch (e) {}
      if (typeof inappBarCheck === 'function') inappBarCheck();
    }, 1200);
  }

  /** A tap on the intro: straight into the app, as soon as it is ready. */
  function skipIntro() {
    if (intro.state === 'done') return;
    introSceneEnd();
    if (intro.state === 'waiting') { intro.skip = true; return; }
    intro.timers.forEach(clearTimeout);
    intro.timers = [];
    introFade(150);
  }

  function initializeApp() {

    setSyncing(true);
    stickySetupStarts();

    document.querySelectorAll('[data-art-icon]').forEach(el => { el.innerHTML = iconHtml('art:' + el.getAttribute('data-art-icon')); });
    applyTranslations();

    const shellMain = document.getElementById('shell-main');
    const shellEl = document.querySelector('.shell');
    if (shellMain && shellEl) {

      }, { passive: true });

    loadPlayerLibrary();

    if (window.SERVER_DATA && window.SERVER_DATA.spyData) {
