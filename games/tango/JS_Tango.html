<script>
/* ============================================================================
   شمس وقمر — TANGO
   ----------------------------------------------------------------------------
   A 6×6 grid of ☀️ and 🌙. Every row and column holds three of each, never
   three of the same side by side, and the signs between cells hold: = means
   the two are the same, × means they differ. A tap cycles ☀️ → 🌙 → empty.
   One step can be taken back (↶); clearing the board and dealing a new one
   over a game in progress both ask first.

   The grid is made in Tango.js (shared with the rooms server, which deals a
   race's grid): a full valid grid, then the fewest clues that leave one
   solution. The daily comes from the seed. The board is in appState.tango.

   In سباق ألغاز (RACE_UI.tango, JS_RoomRace.html) the same grid and taps play
   the room's puzzle: the state is the race's (soloRaceState), the stage the
   race screen's (soloStage), every change is sent as `move { cells }` and
   the server says when the grid is the solution. No hint in a race.
   ========================================================================= */

let tangoTimer = null;

function tangoState() {
  const race = soloRaceState('tango');
  if (race) return race;
  if (!appState.tango) {
    appState.tango = { level: 'easy', daily: '', solution: [], givens: [], signs: [], cells: [], undo: null, hints: 0, startedAt: 0, pausedAt: 0, phase: 'setup' };
  }
  return appState.tango;
}

/* --- Setup and play --------------------------------------------------------------- */

function setupTango() {
  tangoStopTimer();
  setView('setup-tango');
}

function paintTangoSetup() {
  const s = tangoState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#tango-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const best = soloBest('tango', s.level);
  const el = document.getElementById('tango-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('tango-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('tango-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('tango', 'startTango(true)');
  const runBest = soloBest('tango', TANGO_RUN_KEY);
  const runEl = document.getElementById('tango-run-best');
  if (runEl) runEl.textContent = runBest ? `${t.solo_best || ''}: ${runBest.count} ${t.tango_run_unit || ''}` : '';
}

function setTangoLevel(level) {
  tangoState().level = level;
  saveToLocal();
  paintTangoSetup();
}

const tangoHasWork = (s) => (s.cells || []).some((v, i) => v !== (s.givens || [])[i]);

function startTango(daily, sure) {
  if (!sure && soloConfirmNew('tango', tangoHasWork, () => startTango(daily, true))) return;
  if (daily && soloDailyResume('tango')) return;
  soloDailySetAside('tango');
  soloNewGame('tango');
  const s = tangoState();
  const level = daily ? 'medium' : s.level;
  const made = tangoMake(level, soloRandom(daily ? soloDaySeed('tango') : null));
  s.daily = daily ? soloToday() : '';
  s.run = null;
  s.playLevel = level;
  tangoDeal(s, made);
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'play';
  saveToLocal();
  setView('play-tango');
  paintTango();
  tangoArmTimer();
}

/** A made grid onto the board: its solution, givens and signs, nothing marked yet. */
function tangoDeal(s, made) {
  s.solution = made.solution;
  s.givens = made.givens;
  s.signs = made.signs;
  s.cells = made.givens.slice();
  soloUndoClear(s);
  s.hints = 0;
}

/*
 * 1142 (the owner's picks, 7 Oct 2026): «تحدي التلات دقايق» - as many easy
 * boards as you can in three minutes of play, a count and a best (soloRecord
 * 'tango:run3', the most boards). One clock for the whole run: s.startedAt is
 * the run's start, moved forward while the board is away like every solo clock
 * (timed), so the minutes are minutes of play. A solved board pops and the next
 * is dealt at once (into the state at once, drawn a beat later; taps wait for
 * it, tangoRunHold). No hint in a run. When the time is up the board stops and
 * the result counts the boards up. s.run = { count } while a run is on.
 */
const TANGO_RUN_S = 180;
const TANGO_RUN_KEY = 'run3';
let tangoRunHold = 0;

function startTangoRun(sure) {
  if (!sure && soloConfirmNew('tango', tangoHasWork, () => startTangoRun(true))) return;
  soloDailySetAside('tango');
  soloNewGame('tango');
  const s = tangoState();
  s.daily = '';
  s.playLevel = 'easy';
  s.run = { count: 0 };
  tangoDeal(s, tangoMake('easy', soloRandom(null)));
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'play';
  tangoRunHold = 0;
  saveToLocal();
  setView('play-tango');
  paintTango();
  tangoArmTimer();
}

/** Seconds of the run still to play. */
function tangoRunLeft(s) {
  return Math.max(0, TANGO_RUN_S - (Date.now() - s.startedAt) / 1000);
}

/** A board solved in a run: counted, and the next one dealt. */
function tangoRunNext(s) {
  s.run.count += 1;
  const solved = document.querySelectorAll('#tango-grid .tango-cell');
  tangoDeal(s, tangoMake('easy', soloRandom(null)));
  saveToLocal();
  playSound('success');
  haptic('light');
  const wait = motionOff() ? 0 : 450;
  tangoRunHold = Date.now() + wait;
  if (wait) solved.forEach(cell => { if (cell.animate) cell.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: 360, delay: (Math.floor(Number(cell.dataset.i) / TANGO_N) + Number(cell.dataset.i) % TANGO_N) * 18, easing: 'ease-out' }); });
  soloLater('tango', wait, () => {
    tangoRunHold = 0;
    paintTango();
    if (typeof motionBump === 'function') motionBump(document.getElementById('tango-run-count'), 1.35);
  });
}

/** The three minutes are up: the board stops and the result counts the boards. */
function tangoRunEnd() {
  const s = tangoState();
  if (!s.run || s.phase !== 'play') return;
  tangoStopTimer();
  s.phase = 'done';
  s.seconds = TANGO_RUN_S;
  soloUndoClear(s);
  saveToLocal();
  paintTango();
  const t = TRANSLATIONS[appState.lang] || {};
  const count = s.run.count;
  const rec = count > 0 ? soloRecord('tango', TANGO_RUN_KEY, { count: count }, (a, b) => a.count > b.count) : { record: false, prev: soloBest('tango', TANGO_RUN_KEY) };
  const lines = [];
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.count} ${escapeHTML(t.tango_run_unit || '')}`);
  playSound('alarm');
  soloLater('tango', motionOff() ? 0 : 500, () => soloResult({
    icon: '⏱️', title: rec.record ? (t.solo_new_best || '') : (t.tango_run_done || ''), record: rec.record,
    value: count, valueLabel: t.tango_run_label || '', lines: lines, win: count > 0,
    again: () => startTangoRun(), againLabel: '⏱️ ' + (t.play_again || ''), exit: setupTango
  }));
}

function continueTango() {
  if (tangoState().phase !== 'play') return;
  setView('play-tango');
  paintTango();
  tangoArmTimer();
}

function tangoArmTimer() {
  tangoStopTimer();
  const s = tangoState();
  if (s.run && !s.race) {
    // A run counts down its three minutes, and ends the run at nought.
    const paint = () => {
      const x = tangoState();
      if (!x.run) return;
      const left = tangoRunLeft(x);
      const el = document.getElementById('tango-time');
      if (el) el.textContent = soloTime(Math.ceil(left));
      if (left <= 0 && x.phase === 'play' && appState.currentView === 'play-tango') tangoRunEnd();
    };
    soloClockPainters['tango-time'] = paint;
    tangoTimer = createClock({ countUp: true, onTick: paint });
    paint();
    return;
  }
  tangoTimer = soloClock('tango-time', () => tangoState().startedAt);
}

function tangoStopTimer() {
  if (tangoTimer) tangoTimer.stop();
  tangoTimer = null;
}

function paintTango() {
  const s = tangoState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('tango-stage');
  if (!el || !s.givens.length) return;
  const N = TANGO_N;
  const bad = tangoProblems(s.cells, s.signs);
  const signAt = {};
  s.signs.forEach(x => { signAt[x.a + '-' + x.b] = x.same ? '=' : '×'; });
  const run = s.run && !s.race;
  const bar = soloBarHtml(run ? [
    { label: t.tango_run_title || '', value: '⏱️' },
    { label: t.tango_run_left || '', value: soloTime(s.phase === 'play' ? Math.ceil(tangoRunLeft(s)) : 0), id: 'tango-time' },
    { label: t.tango_run_label || '', value: s.run.count, id: 'tango-run-count' }
  ] : [
    s.daily ? { label: t.daily_title || '', value: '📅' } : { label: t.solo_level || '', value: escapeHTML(t['solo_lvl_' + (s.playLevel || s.level)] || '') },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.seconds), id: 'tango-time' }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="tango-grid" id="tango-grid" dir="ltr">
          ${s.cells.map((v, i) => {
            const right = i % N < N - 1 ? signAt[i + '-' + (i + 1)] : '';
            const down = i + N < N * N ? signAt[i + '-' + (i + N)] : '';
            const cls = ['tango-cell', s.givens[i] ? 'is-given' : '', bad.has(i) ? 'is-bad' : ''].filter(Boolean).join(' ');
            return `<button type="button" class="${cls}" data-i="${i}" onclick="tapTango(${i})">
                      <span class="tango-mark">${v === 1 ? '☀️' : v === 2 ? '🌙' : ''}</span>
                      ${right ? `<i class="tango-sign tango-sign--right">${right}</i>` : ''}
                      ${down ? `<i class="tango-sign tango-sign--down">${down}</i>` : ''}
                    </button>`;
          }).join('')}
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}
        <p class="field__hint" style="text-align:center">${escapeHTML(t.tango_hint || '')}</p>
        <div class="sdk-tools">
          <button type="button" class="btn btn--neutral btn--sm" id="tango-undo" onclick="undoTango()" ${soloCanUndo(s) && s.phase === 'play' ? '' : 'disabled'}>↶ ${escapeHTML(t.solo_undo || '')}</button>
          <button type="button" class="btn btn--neutral btn--sm" onclick="clearTango()">🧹 ${escapeHTML(t.queens_clear || '')}</button>
          ${s.race || run ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="hintTango()">💡 ${escapeHTML(t.solo_hint || '')}</button>`}
        </div>
      </div>
    </div>
    ${s.race ? '' : `<div class="view-actions play-foot">
      <button class="btn btn--ghost btn--sm btn--auto play-exit" onclick="${s.phase === 'play' ? 'playExit(setupTango)' : 'setupTango()'}">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
}

function tapTango(i) {
  const s = tangoState();
  if (s.phase !== 'play' || s.givens[i] || Date.now() < tangoRunHold) return;
  soloUndoPush(s, s.cells.slice());
  s.cells[i] = (s.cells[i] + 1) % 3;
  saveToLocal();
  tangoPaintCell(i);
  tangoCheck();
}

/**
 * ideas batch: solo - a tap redraws only its cell (the mark pops) and the
 * red outline of the cells breaking a rule, not the whole grid.
 */
function tangoPaintCell(i) {
  const s = tangoState();
  const grid = document.getElementById('tango-grid');
  const cell = grid && grid.querySelector(`[data-i="${i}"]`);
  if (!cell) { paintTango(); return; }
  const v = s.cells[i];
  const mark = cell.querySelector('.tango-mark');
  if (mark) {
    mark.textContent = v === 1 ? '☀️' : v === 2 ? '🌙' : '';
    if (v) soloPop(mark, 1.25);
  }
  const bad = tangoProblems(s.cells, s.signs);
  grid.querySelectorAll('.tango-cell').forEach(c => c.classList.toggle('is-bad', bad.has(Number(c.dataset.i))));
  const undo = document.getElementById('tango-undo');
  if (undo) undo.disabled = !(soloCanUndo(s) && s.phase === 'play');
}

/** Back to the givens, after asking: it is every mark at once. */
function clearTango(sure) {
  const s = tangoState();
  if (s.phase !== 'play' || !tangoHasWork(s)) return;
  if (!sure) {
    const t = TRANSLATIONS[appState.lang] || {};
    showConfirmModal(t.solo_clear_confirm || 'تمسح كل اللي على اللوحة؟', () => clearTango(true));
    return;
  }
  soloUndoPush(s, s.cells.slice());
  s.cells = s.givens.slice();
  saveToLocal();
  paintTango();
  tangoCheck();
}

/** Takes back the last change: a tap, a clear or a hint. */
function undoTango() {
  const s = tangoState();
  if (s.phase !== 'play' || !soloCanUndo(s)) return;
  const back = soloUndoPop(s);
  if (!back) return;
  s.cells = back;
  saveToLocal();
  paintTango();
  tangoCheck();
}

function hintTango() {
  const s = tangoState();
  if (s.phase !== 'play' || s.race || s.run) return;
  let i = s.cells.findIndex((v, k) => v && v !== s.solution[k]);
  if (i === -1) i = s.cells.findIndex(v => !v);
  if (i === -1) return;
  soloUndoPush(s, s.cells.slice());
  s.cells[i] = s.solution[i];
  s.hints = (s.hints || 0) + 1;
  saveToLocal();
  paintTango();
  tangoCheck();
}

/** A solved grid: every cell turns over, corner to corner. */
function tangoCelebrate() {
  if (motionOff()) return 0;
  document.querySelectorAll('#tango-grid .tango-cell').forEach(cell => {
    const i = Number(cell.dataset.i);
    if (cell.animate) cell.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(180deg)' }, { transform: 'rotateY(360deg)' }],
      { duration: 520, delay: (Math.floor(i / TANGO_N) + i % TANGO_N) * 45, easing: 'ease-in-out' });
  });
  return 1000;
}

/*
 * 1140 (the owner's picks, 7 Oct 2026): a solved board turns into a little sky
 * before the result - the suns rise from the bottom row and glow, then the
 * moons dim to night, each in its own cell (a .tango-sky layer under the mark:
 * a warm glow or a night sky, fading in; the mark rises or dims). Transform and
 * opacity only; nothing with motion off. Returns how long it plays.
 */
function tangoSky(cells) {
  if (motionOff()) return 0;
  const grid = document.getElementById('tango-grid');
  if (!grid) return 0;
  const N = TANGO_N;
  grid.querySelectorAll('.tango-cell').forEach(cell => {
    const i = Number(cell.dataset.i);
    const r = Math.floor(i / N), c = i % N;
    const sun = cells[i] === 1;
    const mark = cell.querySelector('.tango-mark');
    const sky = document.createElement('span');
    sky.className = 'tango-sky ' + (sun ? 'tango-sky--day' : 'tango-sky--night');
    sky.setAttribute('aria-hidden', 'true');
    cell.insertBefore(sky, cell.firstChild);
    if (!sky.animate) return;
    if (sun) {
      const d = (N - 1 - r) * 110 + c * 25;
      sky.animate([{ opacity: 0, transform: 'scale(0.4)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 560, delay: d, easing: 'ease-out', fill: 'both' });
      if (mark && mark.animate) mark.animate([{ transform: 'translateY(35%) scale(0.85)' }, { transform: 'translateY(-12%) scale(1.22)', offset: 0.6 }, { transform: 'translateY(0) scale(1.12)' }],
        { duration: 640, delay: d, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
    } else {
      const d = 820 + (r + c) * 45;
      sky.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 620, delay: d, easing: 'ease-in-out', fill: 'both' });
      if (mark && mark.animate) mark.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0.62, transform: 'scale(0.9)' }], { duration: 620, delay: d, easing: 'ease-in-out', fill: 'both' });
    }
  });
  return 1950;
}

function tangoCheck() {
  const s = tangoState();
  if (s.phase !== 'play') return;
  // A race: the server holds the solution and judges the grid (JS_RoomRace.html).
  if (s.race) { raceMove('tango', { cells: s.cells.slice() }); return; }
  if (s.cells.some((v, i) => v !== s.solution[i])) return;
  if (s.run) { tangoRunNext(s); return; }
  tangoStopTimer();
  s.phase = 'done';
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  soloUndoClear(s);
  saveToLocal();
  paintTango();
  const t = TRANSLATIONS[appState.lang];
  const skyMs = tangoSky(s.cells);
  const level = s.playLevel || s.level;
  const rec = s.hints || s.archive ? { record: false, prev: soloBest('tango', level) }
    : soloRecord('tango', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('tango', { seconds: seconds, hints: s.hints || 0 }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n☀️ ${t.setup_tango || ''} ✅ ${soloTime(seconds)}${s.hints ? ' · 💡 ' + s.hints : ''}`;
  }
  const lines = [];
  if (s.hints) lines.push(`💡 ${escapeHTML(t.solo_hint || '')}: ${s.hints}`);
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  soloLater('tango', motionOff() ? 0 : skyMs + 250, () => soloResult({
    icon: '☀️', title: rec.record ? (t.solo_new_best || '') : (t.solo_solved || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, win: true, share: share,
    again: () => startTango(false), exit: setupTango
  }));
}

function restoreTango() {
  const s = tangoState();
  if (s.phase !== 'play' || !s.solution.length) return false;
  paintTango();
  tangoArmTimer();
  return true;
}

soloRegister('tango', {
  setup: 'setup-tango', play: 'play-tango', paintSetup: paintTangoSetup, restore: restoreTango,
  state: tangoState, resume: continueTango, repaint: paintTango, timed: true, prefs: ['level']
});

/* --- سباق ألغاز: the same grid, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.tango = {
  stage: 'tango-stage',
  unit: 'race_unit_cells',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', solution: [], givens: pub.givens.slice(), signs: pub.signs.slice(),
    cells: pub.givens.slice(), undo: null, hints: 0, seconds: 0 }),
  // A reload: the cells the server last took from this phone are the grid.
  sync(s, board) {
    if (board && Array.isArray(board.cells) && board.cells.length === s.cells.length && !tangoHasWork(s)) s.cells = board.cells.slice();
  },
  paint: () => paintTango(),
  finished: (s, won) => (won ? tangoCelebrate() : 0)
};
</script>
