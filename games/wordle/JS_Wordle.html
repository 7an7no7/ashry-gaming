<script>
/* --- WORDLE GAME LOGIC --- */

// The word lists and the keypad (WORDLE_DB, WORDLE_LAYOUTS) are WordleWords.js, shared with the rooms server.

/** The language of the word on the board (a game saved before this was kept follows the games' language). */
function wordleLang() {
    const lang = (appState.wordle && appState.wordle.lang) || contentLang();
    return lang === 'ar' ? 'ar' : 'en';
}

function setupWordle() {
    setView('setup-wordle');
}

/**
 * A new board of `length` letters, or today's puzzle (`daily`): 5 letters in
 * the games' language, the same word on every phone on the date (dealt from
 * the same list with soloRng(soloDaySeed('wordle'))), 6 tries, played once.
 * Started again while it's under way, it goes back to that board.
 */
// A board with a word tried: a new one asks first (soloConfirmNew).
const wordleHasWork = (w) => (w.guesses || []).length > 0;

function startWordleGame(length, daily, sure) {
    if (!sure && soloConfirmNew('wordle', wordleHasWork, () => startWordleGame(length, daily, true))) return;
    if (daily && soloDailyResume('wordle')) return;
    // Played once: today's, once finished, is never dealt again (a past day from the archive may be).
    if (daily && !soloArchiveDay && soloDailyResult('wordle')) { setupWordle(); return; }
    if (daily) length = WORDLE_DAILY_LEN;
    const lang = contentLang();
    const db = WORDLE_DB[lang][length];

    if(!db || db.length === 0) {
        showToast("No words found for this length!", "Error");
        return;
    }
    // Today's daily in progress is kept aside, never lost, when another board is dealt.
    soloDailySetAside('wordle');
    soloNewGame('wordle');

    // The keypad types the word, so it follows the language the word was
    // dealt in, not whatever the games' language is changed to later.
    appState.wordle.lang = lang;
    appState.wordle.wordLength = length;
    // Rule: Increase tries to 7 if length > 6
    appState.wordle.maxTries = length > 6 ? 7 : 6;

    const picked = daily
        ? soloDailyCycle('wordle', wordleDailyPool(db, lang))[0]
        : freshPick('wordle:' + lang + ':' + length, db, 1)[0];
    // The Arabic keypad has a single alef, so a word spelled with أ, إ or آ
    // could never be typed and the game could not be won. It is played with
    // the plain letter, and the real spelling is shown at the end.
    appState.wordle.displayWord = picked;
    appState.wordle.targetWord = foldWordleWord(picked).toUpperCase();
    appState.wordle.currentGuess = "";
    appState.wordle.guesses = [];
    appState.wordle.status = "playing";
    // What the dailies read (JS_Solo.html): a board in play, and whose day it is.
    appState.wordle.phase = 'play';
    appState.wordle.daily = daily ? soloToday() : '';
    appState.wordle.friend = false;
    delete appState.wordle.archive;

    wordleUnsure = '';
    renderWordleBoard();
    renderKeyboard();
    saveToLocal();
    setView('play-wordle');
    wordleWarmDictionary();
}

const WORDLE_DAILY_LEN = 5;

/*
 * 1099 (the owner's picks, 7 Oct 2026): «اكتبها لصاحبك» - the room's "one sets,
 * everyone solves" on one phone, for two on a sofa. One writes a word of 5 to 8
 * letters as dots (a .secret-field, an eye to check it), hands the phone over,
 * and the other guesses it on the usual board. The keypad is the word's own
 * alphabet (an English word under the Arabic app gets the English keypad). No
 * dictionary, as in the room: a word the keypad can type is a word to guess.
 * Not dealt, not a daily, no list memory; `friend` marks the board (its badge,
 * and «اكتب واحدة تانية» for again).
 */
function wordleFriendOpen() {
    const form = document.getElementById('wordle-friend-form');
    const btn = document.getElementById('wordle-friend-open');
    if (!form) return;
    form.classList.remove('hidden');
    if (btn) btn.classList.add('hidden');
    wordleFriendHint('');
    const input = document.getElementById('wordle-friend-input');
    if (input) { input.classList.add('is-hidden'); try { input.focus({ preventScroll: false }); } catch (e) {} }
}

/** Back to the plain button (the setup painted again, a board started). */
function wordleFriendClose() {
    const form = document.getElementById('wordle-friend-form');
    const btn = document.getElementById('wordle-friend-open');
    const input = document.getElementById('wordle-friend-input');
    if (input) { input.value = ''; input.classList.add('is-hidden'); }
    wordleFriendDots();
    if (form) form.classList.add('hidden');
    if (btn) btn.classList.remove('hidden');
}

function wordleFriendDots() {
    const input = document.getElementById('wordle-friend-input');
    const dots = input && input.parentNode.querySelector('.secret-field__dots');
    if (dots) dots.textContent = '•'.repeat(Array.from(input.value || '').length);
    if (input && input.value) wordleFriendHint('');
}

function wordleFriendEye() {
    const input = document.getElementById('wordle-friend-input');
    if (!input) return;
    input.classList.toggle('is-hidden');
    input.focus();
}

/** The line under the field: the rule, or what's wrong with the word. */
function wordleFriendHint(err) {
    const el = document.getElementById('wordle-friend-hint');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang] || {};
    el.textContent = err ? (t[err] || '') : (t.wordle_friend_hint || '');
    el.classList.toggle('tx-danger', !!err);
}

/** The word as the keypad types it (marks and tatweel off, أ إ آ ٱ as ا, capitals), and its keypad: { word, lang } or { err }. */
function wordleFriendWord(text) {
    const w = foldWordleWord(String(text || '').normalize('NFC').replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/ٱ/g, 'ا'))
        .replace(/\s+/g, '').toUpperCase();
    if (!w) return { err: 'wordle_friend_empty' };
    const chars = Array.from(w);
    const lang = ['ar', 'en'].find(l => chars.every(c => WORDLE_LAYOUTS[l].join('').indexOf(c) !== -1));
    if (!lang) return { err: 'wordle_friend_bad_letters' };
    if (chars.length < 5 || chars.length > 8) return { err: 'wordle_friend_bad_len' };
    return { word: w, lang: lang };
}

function wordleFriendStart(sure) {
    const input = document.getElementById('wordle-friend-input');
    const typed = input ? input.value.trim() : '';
    const got = wordleFriendWord(typed);
    if (got.err) { wordleFriendHint(got.err); playSound('thud'); if (input) soloShake(input.parentNode); return; }
    if (!sure && soloConfirmNew('wordle', wordleHasWork, () => wordleFriendStart(true))) return;
    soloDailySetAside('wordle');
    soloNewGame('wordle');
    const s = appState.wordle;
    s.lang = got.lang;
    s.wordLength = Array.from(got.word).length;
    s.maxTries = s.wordLength > 6 ? 7 : 6;
    s.displayWord = typed;
    s.targetWord = got.word;
    s.currentGuess = '';
    s.guesses = [];
    s.status = 'playing';
    s.phase = 'play';
    s.daily = '';
    s.friend = true;
    delete s.archive;
    wordleUnsure = '';
    wordleFriendClose();
    haptic('medium');
    renderWordleBoard();
    renderKeyboard();
    saveToLocal();
    setView('play-wordle');
}

/*
 * The daily's list: the 5-letter words a family spells one way (wordleDailySafe,
 * WordleWords.js; the review of 1 Oct 2026). From WORDLE_SAFE_FROM on - the days
 * before keep the whole list, so a word already dealt (1 and 2 Oct, a day in the
 * archive) stays the word it was.
 */
const WORDLE_SAFE_FROM = '2026-10-03';

function wordleDailyPool(db, lang) {
    const day = soloArchiveDay || soloToday();
    if (day < WORDLE_SAFE_FROM || typeof wordleDailySafe !== 'function') return db;
    const safe = db.filter(w => wordleDailySafe(w, lang));
    return safe.length ? safe : db;
}

/*
 * The soft dictionary (the review of 1 Oct 2026): a guess no word list of the app
 * knows shakes once with «مش في قاموسنا — دوس تاني لو متأكد», and Enter again on
 * the same word sends it - so five random letters don't fish for free, and a real
 * word our lists lack still plays. The words are the word wheel's banks whole
 * (wheelBankWords, WordWheel.js: Chameleon, Stop, Monkey, the spy words,
 * Connections, Describe It, Charades, Who Am I) with its everyday words
 * (WHEEL_BONUS_WORDS) and every Wordle length. They live in the word wheel's chunk,
 * which is fetched in the background when a board opens; until it is here every
 * word is let through.
 */
const WORDLE_DICT = {};
let wordleUnsure = '';

/** One spelling for a lookup: one alef, ة as ه, ى as ي, ؤ as و, ئ as ي, upper case. */
function wordleDictKey(w) {
    return foldWordleWord(w).replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
        .replace(/[\u064B-\u0652\u0640]/g, '').toUpperCase();
}

/** The known words in `lang`, or null while the word wheel's chunk isn't loaded. */
function wordleDictionary(lang) {
    if (WORDLE_DICT[lang]) return WORDLE_DICT[lang];
    if (typeof wheelBankWords !== 'function') {
        if (typeof lzEnsure === 'function') lzEnsure(['wordwheel']).catch(() => {});
        return null;
    }
    const set = new Set();
    const add = (w) => String(w || '').split(/[\s\-]+/).forEach(p => { if (p) set.add(wordleDictKey(p)); });
    wheelBankWords(lang).forEach(add);
    if (typeof WHEEL_BONUS_WORDS !== 'undefined') (WHEEL_BONUS_WORDS[lang] || []).forEach(add);
    Object.values(WORDLE_DB[lang] || {}).forEach(list => list.forEach(add));
    WORDLE_DICT[lang] = set;
    return set;
}

/** Fetch the dictionary's chunk early, so the first guess can already be checked. */
function wordleWarmDictionary() {
    wordleDictionary(wordleLang());
}

/** Whether a guess is a word we know (or one we can't check yet): plurals and "ال" count. */
function wordleKnownWord(guess) {
    // A friend's word may be a name or dialect our lists lack: their guesses aren't
    // held to the lists either (1099).
    if (appState.wordle.friend) return true;
    return wordleKnownIn(guess, wordleLang(), appState.wordle.targetWord);
}

/**
 * The same check for any word in `lang` ('ar' / 'en'): a room's set word and its
 * solvers' guesses ask it too (svWordleKnown, 1102). `target` (may be '') always counts.
 */
function wordleKnownIn(guess, lang, target) {
    const dict = wordleDictionary(lang);
    if (!dict) return true;
    const k = wordleDictKey(guess);
    if ((target && k === wordleDictKey(target)) || dict.has(k)) return true;
    if (lang === 'en') return (/S$/.test(k) && dict.has(k.slice(0, -1))) || (/ES$/.test(k) && dict.has(k.slice(0, -2)));
    const stems = [];
    if (k.indexOf('ال') === 0) stems.push(k.slice(2));
    stems.slice().concat([k]).forEach(s => {
        if (/(ات|ين|ون)$/.test(s)) stems.push(s.slice(0, -2), s.slice(0, -2) + 'ه');
        if (/ه$/.test(s)) stems.push(s.slice(0, -1));
    });
    return stems.some(s => s.length >= 2 && dict.has(s));
}

/** Back to the board in play (a daily set aside and brought back). */
function continueWordle() {
    renderWordleBoard();
    renderKeyboard();
    setView('play-wordle');
    wordleWarmDictionary();
}

/** The setup screen's daily line: play today's word, carry on with it, or that it's done. */
function paintWordleSetup() {
    const el = document.getElementById('wordle-daily');
    if (el) el.innerHTML = soloDailyButtonHtml('wordle', 'startWordleGame(5, true)');
    wordleFriendHint('');
}

/** "📅 تحدي اليوم" (or the archive's day) over a daily's board. */
function paintWordleBadge() {
    const el = document.getElementById('wordle-daily-badge');
    if (!el) return;
    const s = appState.wordle;
    const t = TRANSLATIONS[appState.lang] || {};
    const html = s.archive
        ? `<span class="badge badge--warning">📅 ${escapeHTML(t.daily_archive_badge || '')} ${escapeHTML(s.archive)}</span>`
        : (s.daily ? `<span class="badge">📅 ${escapeHTML(t.daily_title || '')}</span>`
            : (s.friend ? `<span class="badge">✍️ ${escapeHTML(t.wordle_friend_badge || '')}</span>` : ''));
    el.innerHTML = html;
    el.classList.toggle('hidden', !html);
}

/**
 * The board. opts.reveal: the index of the row just sent - its tiles are drawn
 * with their letters only and turned over one after another (wordleReveal),
 * each taking its colour at the halfway point; every other finished row is
 * drawn settled. opts.pop: the index of the letter just typed, which pops -
 * only that one (ideas batch: solo).
 */
function renderWordleBoard(opts) {
    opts = opts || {};
    const container = document.getElementById('wordle-grid');
    const len = appState.wordle.wordLength;
    const cell = (cls, char, extra) => `<div class="wordle-cell ${cls}"${extra || ''}>${char || ''}</div>`;
    const rows = [];
    const revealing = typeof opts.reveal === 'number' && !motionOff();

    // Completed guesses
    appState.wordle.guesses.forEach((guess, r) => {
        const result = checkGuess(guess);
        let cells = '';
        for (let i = 0; i < len; i++) {
            cells += (revealing && r === opts.reveal)
                ? cell('wordle-cell--filled', guess[i], ` data-res="${result[i]}"`)
                : cell('wordle-cell--' + result[i], guess[i]);
        }
        rows.push(cells);
    });

    // The row being typed
    if (appState.wordle.status === 'playing') {
        let cells = '';
        for (let i = 0; i < len; i++) {
            const char = appState.wordle.currentGuess[i];
            cells += char
                ? cell('wordle-cell--filled' + (opts.pop === i ? ' animate-pop' : ''), char)
                : cell('wordle-cell--empty');
        }
        rows.push(cells);
    }

    // Rows still to come
    const rowsLeft = appState.wordle.maxTries - appState.wordle.guesses.length -
                     (appState.wordle.status === 'playing' ? 1 : 0);
    for (let r = 0; r < rowsLeft; r++) {
        rows.push(cell('wordle-cell--empty').repeat(len));
    }

    // Real rows rather than one long grid, so each row can size independently
    // and the board stays square at any word length.
    container.style.gridTemplateColumns = '';
    // The stylesheet caps the board by height as well as width, and needs the
    // shape to do it — an 8-letter board gets a seventh row.
    container.style.setProperty('--wordle-cols', len);
    container.style.setProperty('--wordle-rows', appState.wordle.maxTries);
    // The word's own direction, not the page's: an English word under the
    // Arabic interface (Settings → لغة الألعاب) read backwards, as the room board doesn't.
    container.dir = wordleLang() === 'ar' ? 'rtl' : 'ltr';
    container.innerHTML = rows.map(cells =>
        `<div class="wordle-row" style="grid-template-columns: repeat(${len}, 1fr)">${cells}</div>`
    ).join('');
    paintWordleBadge();
    if (revealing) wordleReveal(opts.reveal, !!opts.win);
}

// ideas batch: solo - the reveal's timing: a tile every 250ms, each 460ms to turn.
const WORDLE_FLIP_GAP = 250;
const WORDLE_FLIP_MS = 460;
let wordleRevealUntil = 0;     // typing waits while a row turns over

/** How long the row just sent takes to turn over (and, on a win, to bounce). */
function wordleRevealMs(win) {
    if (motionOff()) return 0;
    const len = appState.wordle.wordLength || 5;
    return (len - 1) * WORDLE_FLIP_GAP + WORDLE_FLIP_MS + (win ? (len - 1) * 90 + 420 : 0);
}

/**
 * Row `r` turns over tile by tile: each tile folds to edge-on, takes its colour
 * (set by a timer too, so it lands even where the animation is cut short), and
 * unfolds. The keyboard's colours follow once the last tile is down; a winning
 * row then bounces tile by tile.
 */
function wordleReveal(r, win) {
    const row = document.querySelectorAll('#wordle-grid .wordle-row')[r];
    if (!row) { renderKeyboard(); return; }
    const tiles = Array.from(row.querySelectorAll('.wordle-cell'));
    const epoch = row;          // a redraw replaces the row: its timers then do nothing
    wordleRevealUntil = Date.now() + wordleRevealMs(win);
    tiles.forEach((tile, i) => {
        const at = i * WORDLE_FLIP_GAP;
        if (tile.animate) {
            tile.animate([
                { transform: 'rotateX(0deg)' },
                { transform: 'rotateX(90deg)', offset: 0.5 },
                { transform: 'rotateX(0deg)' }
            ], { duration: WORDLE_FLIP_MS, delay: at, easing: 'ease-in-out' });
        }
        setTimeout(() => {
            if (!epoch.isConnected) return;
            tile.classList.remove('wordle-cell--filled');
            tile.classList.add('wordle-cell--' + (tile.dataset.res || 'absent'));
        }, at + WORDLE_FLIP_MS / 2);
    });
    const landed = (tiles.length - 1) * WORDLE_FLIP_GAP + WORDLE_FLIP_MS;
    setTimeout(() => {
        renderKeyboard();
        if (!win || !epoch.isConnected) return;
        tiles.forEach((tile, i) => {
            if (!tile.animate) return;
            tile.animate([
                { translate: '0 0' }, { translate: '0 -34%', offset: 0.4 }, { translate: '0 4%', offset: 0.75 }, { translate: '0 0' }
            ], { duration: 420, delay: i * 90, easing: 'ease-out' });
        });
    }, landed);
}

function renderKeyboard() {
    const kbContainer = document.getElementById('wordle-keyboard');

    const layout = WORDLE_LAYOUTS[wordleLang()];
    const keyState = getKeyboardState();

    const keyClass = (char) => {
        const status = keyState[char];
        return status ? ' key--' + status : '';
    };

    // Enter and Backspace get their own row: on the widest Arabic row (12 keys)
    // squeezing them in alongside dropped every key well under a 44px target.
    const rows = layout.map(row =>
        `<div class="keypad__row">` +
        row.split('').map(char =>
            `<button class="key${keyClass(char)}" onclick="handleWordleKey('${char}')">${char}</button>`
        ).join('') +
        `</div>`
    );

    const enterLabel = appState.lang === 'ar' ? 'تحقق' : 'Enter';
    rows.push(
        `<div class="keypad__row">` +
        `<button class="key key--wide" onclick="handleWordleKey('BACK')" aria-label="Backspace">⌫</button>` +
        `<button class="key key--wide" onclick="handleWordleKey('ENTER')">${enterLabel}</button>` +
        `</div>`
    );

    kbContainer.className = 'keypad';
    // Q on the left for English and ض on the right for Arabic, whatever the page's direction.
    kbContainer.dir = wordleLang() === 'ar' ? 'rtl' : 'ltr';
    kbContainer.innerHTML = rows.join('');
}

/** One alef for all its hamza forms - the keypad only has the plain one. */
function foldWordleWord(word) {
    return String(word).replace(/[أإآ]/g, 'ا');
}

/**
 * The row being typed, redrawn in place while the row above still turns over: a whole
 * redraw would replace the turning row and cut its flip (the owner, 8 Oct 2026: keys
 * typed during the flip used to be dropped). `pop` as in renderWordleBoard.
 */
function wordlePaintTypingRow(pop) {
    const row = document.querySelectorAll('#wordle-grid .wordle-row')[appState.wordle.guesses.length];
    if (!row) { renderWordleBoard({ pop: pop }); return; }
    let html = '';
    for (let i = 0; i < appState.wordle.wordLength; i++) {
        const char = appState.wordle.currentGuess[i];
        html += char
            ? `<div class="wordle-cell wordle-cell--filled${pop === i ? ' animate-pop' : ''}">${char}</div>`
            : '<div class="wordle-cell wordle-cell--empty"></div>';
    }
    row.innerHTML = html;
}

function handleWordleKey(key) {
    if(appState.wordle.status !== 'playing') return;
    // The last row still turning over: letters go into the next row at once (drawn in
    // place, so the flip goes on); only Enter waits for the row to land.
    const turning = Date.now() < wordleRevealUntil;

    if(key === 'ENTER') {
        if (turning) return;
        submitWordleGuess();
    } else if(key === 'BACK') {
        if(appState.wordle.currentGuess.length > 0) {
            appState.wordle.currentGuess = appState.wordle.currentGuess.slice(0, -1);
            if (turning) wordlePaintTypingRow(); else renderWordleBoard();
        }
    } else {
        if(appState.wordle.currentGuess.length < appState.wordle.wordLength) {
            appState.wordle.currentGuess += foldWordleWord(key);
            const pop = appState.wordle.currentGuess.length - 1;
            if (turning) wordlePaintTypingRow(pop); else renderWordleBoard({ pop: pop });
        }
    }
}

/** The row being typed shakes: the feedback every word game gives. */
function wordleShakeRow() {
    // `animate-shake` is the one Connections already uses. Removed on a timer
    // as well, so a second short word shakes again (an animation that is
    // suppressed fires no animationend at all).
    const row = document.querySelectorAll('#wordle-grid .wordle-row')[appState.wordle.guesses.length];
    if (row && typeof motionOff === 'function' && !motionOff()) {
        row.classList.remove('animate-shake');
        void row.offsetWidth;                       // restart it mid-shake
        row.classList.add('animate-shake');
        setTimeout(() => row.classList.remove('animate-shake'), 600);
    }
}

function submitWordleGuess() {
    if(appState.wordle.currentGuess.length === appState.wordle.wordLength
        && wordleUnsure !== appState.wordle.currentGuess && !wordleKnownWord(appState.wordle.currentGuess)) {
        // Once: the same word sent again goes through (a real word our lists lack).
        wordleUnsure = appState.wordle.currentGuess;
        playSound('thud');
        const t = TRANSLATIONS[appState.lang] || {};
        showToast(t.wordle_not_in_dict || '');
        wordleShakeRow();
        return;
    }
    wordleUnsure = '';
    if(appState.wordle.currentGuess.length !== appState.wordle.wordLength) {
        playSound('thud');
        const t = TRANSLATIONS[appState.lang] || {};
        showToast(t.wordle_too_short || '');
        wordleShakeRow();
        return;
    }

    appState.wordle.guesses.push(appState.wordle.currentGuess);
    
    // Check Win/Loss
    if(appState.wordle.currentGuess === appState.wordle.targetWord) {
        appState.wordle.status = "won";
        appState.wordle.phase = 'done';
        appState.wordle.currentGuess = "";   // don't leave a half-row in state
        wordleResultSoon(true);
    } else if(appState.wordle.guesses.length >= appState.wordle.maxTries) {
        appState.wordle.status = "lost";
        appState.wordle.phase = 'done';
        appState.wordle.currentGuess = "";
        wordleResultSoon(false);
    } else {
        playSound('click');
        appState.wordle.currentGuess = "";
    }

    // Only the row just sent turns over; the keyboard's colours wait for its
    // last tile (wordleReveal draws them then, or at once with motion off).
    const won = appState.wordle.status === 'won';
    renderWordleBoard({ reveal: appState.wordle.guesses.length - 1, win: won });
    if (motionOff()) renderKeyboard();
    saveToLocal();
}

function checkGuess(guess) {
    let result = Array(appState.wordle.wordLength).fill('absent');
    let targetArr = appState.wordle.targetWord.split('');
    let guessArr = guess.split('');

    // 1. Check Greens (Correct position)
    for(let i=0; i<appState.wordle.wordLength; i++) {
        if(guessArr[i] === targetArr[i]) {
            result[i] = 'correct';
            targetArr[i] = null; // Mark as used
            guessArr[i] = null;
        }
    }

    // 2. Check Yellows (Wrong position)
    for(let i=0; i<appState.wordle.wordLength; i++) {
        if(guessArr[i] !== null) { // Skip already matched
            const idx = targetArr.indexOf(guessArr[i]);
            if(idx !== -1) {
                result[i] = 'present';
                targetArr[idx] = null; // Mark used
            }
        }
    }
    return result;
}

function getKeyboardState() {
    let state = {};
    appState.wordle.guesses.forEach(guess => {
        const result = checkGuess(guess);
        for(let i=0; i<guess.length; i++) {
            const char = guess[i];
            const status = result[i];
            
            // Priority: correct > present > absent > unused
            if(state[char] === 'correct') continue;
            if(status === 'correct') state[char] = 'correct';
            else if(status === 'present' && state[char] !== 'correct') state[char] = 'present';
            else if(status === 'absent' && !state[char]) state[char] = 'absent';
        }
    });
    return state;
}

/**
 * The result a second after the last row, once it has turned over: only for
 * the game that ended, and only on its board (soloLater: a new game dealt in
 * that second has its own word). A daily's result is kept at once, so a
 * reload in that second can't lose it or play it again.
 */
function wordleResultSoon(win) {
    const s = appState.wordle;
    const word = s.displayWord || s.targetWord;
    const tries = s.guesses.length;
    const max = s.maxTries;
    const rows = s.guesses.map(g => checkGuess(g));
    const t = TRANSLATIONS[appState.lang] || {};
    let share = '';
    if (s.daily) {
        soloMarkDaily('wordle', { won: win, tries: tries, max: max }, s.daily);
        share = wordleShareText(t, s.daily, win, tries, max, rows, s.lang);
    }
    soloLater('wordle', motionOff() ? 0 : wordleRevealMs(win) + 450, () => soloResult({
        icon: win ? '🟩' : '🟨',
        title: win ? (t.wordle_won || '') : (t.wordle_lost || ''),
        value: win ? tries : undefined,
        valueText: win ? '' : `X/${max}`,
        valueLabel: (t.wordle_tries_of || '').replace('{max}', max),
        lines: [`${escapeHTML(t.wordle_word_was || '')} <b class="tx-accent">${escapeHTML(String(word || ''))}</b>`],
        shareLines: [],   // the picture never says the word
        win: win, share: share,
        again: s.friend ? () => { setupWordle(); wordleFriendOpen(); } : () => startWordleGame(s.wordLength || 5, false),
        againLabel: s.friend ? '✍️ ' + (t.wordle_friend_again || '') : undefined,
        exit: setupWordle
    }));
}

/**
 * A daily's result for WhatsApp, Wordle's way: the tries, then a row of
 * 🟩🟨⬛ a guess - the colours only, never the letters. An Arabic row starts
 * with a right-to-left mark, so its first square (the word's first letter)
 * sits on the right, as it does on the board.
 */
function wordleShareText(t, day, win, tries, max, rows, lang) {
    const sq = { correct: '🟩', present: '🟨', absent: '⬛' };
    const lead = lang === 'ar' ? '\u200F' : '';
    const grid = rows.map(r => lead + r.map(x => sq[x] || '⬛').join('')).join('\n');
    return `${soloShareHeader(t, day)}\n🟩 ${t.setup_wordle || ''} ${win ? tries : 'X'}/${max}\n${grid}`;
}

/** A reload on the board: drawn as it was left. */
function restoreWordle() {
    const s = appState.wordle;
    if (!s || !s.targetWord) return false;
    renderWordleBoard();
    renderKeyboard();
    setTimeout(wordleWarmDictionary, 0);     // after start-up: the dictionary's chunk in the background
    return true;
}

/**
 * A computer's keyboard types too: the letters of the word's language (an
 * Arabic key's hamza forms fold to the keypad's alef, and the لا key gives
 * both letters), Backspace and Enter. Not while typing in a field or with a
 * popup open.
 */
function wordleKeyFromKeyboard(e) {
    if (appState.currentView !== 'play-wordle' || appState.wordle.status !== 'playing') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (document.querySelector('.modal-overlay:not(.hidden)')) return;
    if (e.key === 'Enter') { e.preventDefault(); handleWordleKey('ENTER'); return; }
    if (e.key === 'Backspace') { e.preventDefault(); handleWordleKey('BACK'); return; }
    // One character, or the Arabic لا key; never a named key such as "Tab".
    if (!e.key || !(e.key.length === 1 || /^ل[اأإآ]$/.test(e.key))) return;
    const keys = WORDLE_LAYOUTS[wordleLang()].join('');
    const chars = foldWordleWord(wordleLang() === 'en' ? e.key.toUpperCase() : e.key).split('');
    if (!chars.every(ch => keys.indexOf(ch) !== -1)) return;
    e.preventDefault();
    chars.forEach(ch => handleWordleKey(ch));
}

// The content check loads this file in Node, where there is no page.
if (typeof document !== 'undefined') {
    document.addEventListener('keydown', wordleKeyFromKeyboard);
}
if (typeof onLanguageChange === 'function') {
    onLanguageChange(view => { if (view === 'play-wordle') { renderKeyboard(); paintWordleBadge(); } });
}
// A friend's word half typed doesn't wait in the setup for whoever opens it next (1099).
if (typeof onLeaveScreen === 'function') {
    onLeaveScreen((from) => { if (from === 'setup-wordle') wordleFriendClose(); });
}
// JS_Solo.html loads after this file: it registers the game once it is there.
if (typeof window !== 'undefined') {
    (window.SOLO_LATE = window.SOLO_LATE || []).push(() => soloRegister('wordle', {
        setup: 'setup-wordle', play: 'play-wordle', paintSetup: paintWordleSetup, restore: restoreWordle,
        state: () => appState.wordle, resume: continueWordle, repaint: () => { renderWordleBoard(); renderKeyboard(); }
    }));
}
</script>
