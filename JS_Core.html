<script>
  /* --- SECURITY UTILS --- */
  function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
      );
  }

  /**
   * Escapes a value for use as a single-quoted JS string inside an inline
   * handler attribute, e.g. onclick="fn('${jsStringAttr(name)}')".
   *
   * escapeHTML is the wrong tool here: it turns ' into &#39;, and the HTML parser
   * decodes that back to a bare ' before the JS is ever compiled — so a player
   * called O'Brien produced fn('O'Brien'), a syntax error that left the button
   * silently dead. Backslash-escaping has to happen first (the HTML parser leaves
   * backslashes alone, so JS receives them), then the characters that would end
   * the attribute get entity-encoded.
   */
  function jsStringAttr(value) {
      return String(value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r?\n/g, '\\n')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
  }

  /* --- AUDIO SYSTEM --- */
  // A browser without Web Audio (or with it turned off) gets a silent stand-in:
  // creating it unguarded threw here and stopped this whole script - the app.
  const audioMake = () => {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) return new Ctx();
    } catch (e) {}
    return null;
  };
  // `let`, not `const`: a context iOS won't wake is replaced (see wakeAudio), and
  // every sound in the app reads this binding (or fxCtx()) each time it plays.
  let audioCtx = audioMake() || (() => {
    const node = () => ({ connect() {}, disconnect() {}, start() {}, stop() {}, frequency: { setValueAtTime() {}, exponentialRampToValueAtTime() {}, linearRampToValueAtTime() {} }, gain: { setValueAtTime() {}, exponentialRampToValueAtTime() {}, linearRampToValueAtTime() {} } });
    return { stub: true, state: 'closed', currentTime: 0, destination: {}, resume() { return Promise.resolve(); }, createOscillator: node, createGain: node, createBiquadFilter: node, createBufferSource: node, createBuffer: () => ({ getChannelData: () => new Float32Array(1) }), createDynamicsCompressor: node, sampleRate: 44100 };
  })();
  let lastClickAt = 0;
  let lastTapClickAt = 0;

  /**
   * `fromTap` marks the click the delegated pointerdown handler plays for
   * every control. A handler that still clicks for itself runs on the click
   * event, 100-200ms after that pointerdown - which used to sound like a
   * double click on every such button - so a handler's click is dropped for
   * half a second after a tap's, and taps only collapse among themselves.
   */
  // The bomb alternates a higher and a lower knock: tick, tock.
  let bombTock = false;

  // iOS and Chrome keep the audio asleep until a touch, and put it back to sleep
  // when the phone locks or a call comes in ('suspended' or 'interrupted'). Any
  // touch or key wakes it again; a sound that arrives from the room without one
  // (the bomb landing on this phone) can't.
  //
  // On an iPhone that isn't always enough (the owner, 23 Sep 2026: "most of the
  // times when I join a room I don't hear the game, I must refresh"): joining
  // usually comes from another app that had the sound (the camera that read the
  // QR, WhatsApp), and opening a room goes out to the share sheet, and iOS leaves
  // the page's context 'interrupted' - or 'running' on paper and silent - where
  // resume() inside a tap no longer brings it back. A refresh made a new context,
  // which is why it helped. So a tap also plays a one-sample silent buffer (what
  // really opens iOS's output), and a context that is 'interrupted', or that a
  // tap already failed to wake, is thrown away and made again inside the tap,
  // where a new one always starts.
  let audioStuck = false, audioRemadeAt = 0, audioCheckAt = 0;
  const audioUnlock = (ctx) => {
    try {
      const src = ctx.createBufferSource();
      src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate || 22050);
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) {}
  };
  const wakeAudio = (e) => {
    if (audioCtx.stub) return;
    const inTap = !!(e && e.type);
    const now = Date.now();
    if (inTap && (audioCtx.state === 'interrupted' || audioCtx.state === 'closed' || audioStuck) && now - audioRemadeAt > 1500) {
      const fresh = audioMake();
      if (fresh) {
        try { if (audioCtx.state !== 'closed') audioCtx.close(); } catch (err) {}
        audioCtx = fresh;
        audioRemadeAt = now;
        audioStuck = false;
      }
    }
    if (audioCtx.state !== 'running' && audioCtx.state !== 'closed') {
      try { const p = audioCtx.resume(); if (p && p.catch) p.catch(() => {}); } catch (err) {}
    }
    if (!inTap) return;
    audioUnlock(audioCtx);
    // A moment later: still not running, or 'running' with its clock standing still
    // (no sound is really coming out), and the next tap makes a new one.
    if (now - audioCheckAt < 1000) return;
    audioCheckAt = now;
    const ctx = audioCtx, t0 = ctx.currentTime;
    setTimeout(() => {
      if (ctx !== audioCtx || document.hidden) return;
      if (ctx.state !== 'running' || ctx.currentTime - t0 < 0.1) audioStuck = true;
    }, 350);
  };
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, wakeAudio, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wakeAudio(); });
  // The page coming back from the app switcher or a share sheet on iOS
  // (pageshow from the back-forward cache) is a return from away too.
  window.addEventListener('pageshow', () => wakeAudio());

  function playSound(type, fromTap) {
    if (type === 'click') {
      const now = Date.now();
      if (fromTap) {
        if (now - lastTapClickAt < 70) return;
        lastTapClickAt = now;
      } else if (now - lastTapClickAt < 500 || now - lastClickAt < 70) {
        return;
      }
      lastClickAt = now;
    }
    wakeAudio();
    // A suspended context has a frozen clock: ticks scheduled now would all play
    // at once, loudly, on the first touch. Repeating ticks are simply skipped
    // until sound is awake again.
    if ((type === 'bomb' || type === 'tick') && audioCtx.state !== 'running') return;
    if (type === 'bomb') {
        // A wooden knock loud enough to hear across a table: a pitched body and a click on top.
        bombTock = !bombTock;
        const at = audioCtx.currentTime;
        const body = audioCtx.createOscillator();
        const bodyGain = audioCtx.createGain();
        body.type = 'sine';
        body.frequency.setValueAtTime(bombTock ? 1250 : 930, at);
        body.frequency.exponentialRampToValueAtTime(bombTock ? 720 : 540, at + 0.07);
        bodyGain.gain.setValueAtTime(0.0001, at);
        bodyGain.gain.exponentialRampToValueAtTime(0.55, at + 0.004);
        bodyGain.gain.exponentialRampToValueAtTime(0.001, at + 0.1);
        body.connect(bodyGain); bodyGain.connect(audioCtx.destination);
        body.start(at); body.stop(at + 0.11);
        const click = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        click.type = 'square';
        click.frequency.setValueAtTime(2600, at);
        clickGain.gain.setValueAtTime(0.12, at);
        clickGain.gain.exponentialRampToValueAtTime(0.001, at + 0.015);
        click.connect(clickGain); clickGain.connect(audioCtx.destination);
        click.start(at); click.stop(at + 0.02);
        return;
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'tick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'alarm') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
  }

  /* --- TACTILE FEEDBACK ------------------------------------------------------
   * Two channels, both cheap and both optional: a short vibration where the
   * device supports it, and a ripple that starts at the finger. Between them a
   * tap feels acknowledged before any state has changed.
   * ------------------------------------------------------------------------ */

  const HAPTIC_PATTERNS = { light: 8, medium: 14, heavy: 22, double: [12, 40, 12] };
  const prefersReducedMotion = () => reducedMotion();

  /* --- Motion: the device's setting, unless this device's owner chose ----------
     Every animation in the app stands still when the device asks for reduced
     motion. Windows asks for it whenever its "Animation effects" switch is off,
     which it is on many PCs, so the owner saw no motion on a computer that
     plays everything else fine. Settings → الحركة: تلقائي follows the device,
     شغّالة plays it anyway, مقفولة stops it anyway. For "on", the stylesheets'
     reduced-motion blocks are lifted out (and put back for "auto"); for "off",
     their rules are added again without the media condition. */
  const MOTION_PREFS = ['auto', 'on', 'off'];
  const MOTION_KEY = 'ashryMotion';
  let motionMoved = [];

  function motionPref() {
    try {
      const v = localStorage.getItem(MOTION_KEY);
      return MOTION_PREFS.indexOf(v) !== -1 ? v : 'auto';
    } catch (e) { return 'auto'; }
  }

  function reducedMotion() {
    const pref = motionPref();
    if (pref === 'on') return false;
    if (pref === 'off') return true;
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function applyMotionPref() {
    const pref = motionPref();
    // Back to how the page was written.
    motionMoved.forEach(m => { try { m.sheet.insertRule(m.text, m.sheet.cssRules.length); } catch (e) {} });
    motionMoved = [];
    const off = document.getElementById('motion-off-style');
    if (off) off.remove();
    if (pref === 'auto') return;
    // Two kinds of block: "reduce" stills things, "no-preference" adds motion.
    const reduce = [], allow = [];
    Array.from(document.styleSheets).forEach(sheet => {
      let rules;
      try { rules = sheet.cssRules; } catch (e) { return; }
      for (let i = rules.length - 1; i >= 0; i--) {
        const r = rules[i];
        const text = (r.media && (r.conditionText || r.media.mediaText)) || '';
        if (/prefers-reduced-motion:\s*reduce/.test(text)) reduce.push({ sheet: sheet, index: i, rule: r });
        else if (/prefers-reduced-motion:\s*no-preference/.test(text)) allow.push({ sheet: sheet, index: i, rule: r });
      }
    });
    // "On" lifts out what stills and applies what moves; "off" the other way round.
    const lift = pref === 'on' ? reduce : allow;
    const apply = pref === 'on' ? allow : reduce;
    lift.sort((a, b) => b.index - a.index).forEach(b => {
      motionMoved.push({ sheet: b.sheet, text: b.rule.cssText });
      try { b.sheet.deleteRule(b.index); } catch (e) {}
    });
    const style = document.createElement('style');
    style.id = 'motion-off-style';
    style.textContent = apply.map(b => Array.from(b.rule.cssRules).map(r => r.cssText).join(' ')).join(' ');
    document.head.appendChild(style);
  }

  function cycleMotionPref() {
    const next = MOTION_PREFS[(MOTION_PREFS.indexOf(motionPref()) + 1) % MOTION_PREFS.length];
    try { localStorage.setItem(MOTION_KEY, next); } catch (e) {}
    applyMotionPref();
    updateSettingsLabels();
  }

  /** Vibrates if the device and browser allow it. iOS Safari has no vibrate. */
  function haptic(kind = 'light') {
      if (!navigator.vibrate || prefersReducedMotion()) return;
      try { navigator.vibrate(HAPTIC_PATTERNS[kind] || HAPTIC_PATTERNS.light); } catch (e) {}
  }

  /* Every host listed here must be `position: relative; overflow: hidden` in
     Style.html, or the ripple escapes its box. See the ".ripple" rule there. */
  const RIPPLE_TARGETS = '.btn, .game-card, .tool-item, .row--interactive, .setting-row, .nav-item, .key';

  document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
      if (!host || host.disabled || prefersReducedMotion()) return;

      const rect = host.getBoundingClientRect();
      // One circle big enough to cover the element from wherever it started.
      const size = Math.max(rect.width, rect.height) * 1.1;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';

      // The ripple is absolutely positioned, so the host has to be a stacking
      // context for it; .btn and the tiles already are.
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      host.appendChild(ripple);

      // animationend is the normal path, but never the only one: if the
      // animation doesn't run the node would stay in the DOM forever, and in a
      // flex host that means it keeps taking up space.
      const drop = () => ripple.remove();
      ripple.addEventListener('animationend', drop);
      setTimeout(drop, 800);
  }, { passive: true });

  /* Every tap on a control gets a click and a nudge from here, so individual
     handlers don't each have to remember playSound('click'). They still raise
     the meaningful sounds themselves — success, alarm, tick.
     A finger's click waits for it to lift: a scroll that starts on a card or a
     button (most of the home) is a cancelled pointer, and used to click and
     buzz on every swipe. A mouse clicks on press. */
  let tapFeedbackHost = null;
  document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
      tapFeedbackHost = null;
      if (!host || host.disabled) return;
      if (e.pointerType === 'touch') { tapFeedbackHost = host; return; }
      playSound('click', true);
      haptic('light');
  }, { passive: true });
  document.addEventListener('pointerup', () => {
      const host = tapFeedbackHost;
      tapFeedbackHost = null;
      if (!host || host.disabled) return;
      playSound('click', true);
      haptic('light');
  }, { passive: true });
  document.addEventListener('pointercancel', () => { tapFeedbackHost = null; }, { passive: true });

  /**
   * Fisher-Yates shuffle into a new array. Every "random order" in the app goes
   * through this: sort(() => Math.random() - 0.5) is biased towards the start.
   */
  function shuffleArray(arr) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /* --- NO-REPEAT MEMORY --- */

  // Most word games picked at random, or forgot what they had shown the moment a
  // new round began, so the same cards came back within a couple of games however
  // long the list was. This remembers, per phone and per list, what has been
  // dealt; a list only starts over once all of it has been seen.
  const SEEN_KEY = 'ashrySeen_v1';
  let seenLists = null;

  function readSeenLists() {
    if (seenLists) return seenLists;
    try { seenLists = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }
    catch (e) { seenLists = {}; }
    return seenLists;
  }

  /** "Reset everything" has to mean this too. */
  function forgetSeenLists() {
    seenLists = {};
    try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  }

  /* --- FIRST-PLAY CARD STORAGE ---
     The first time a phone opens a game's setup or has it chosen in a room,
     a 3-step card introduces it. Once dismissed or opened into rules, that game
     is marked seen in localStorage['ashryFirstPlay_v1']. */
  const FIRST_PLAY_KEY = 'ashryFirstPlay_v1';

  function readFirstPlay() {
    try {
      const raw = localStorage.getItem(FIRST_PLAY_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function firstPlaySeen(key) {
    if (!key) return true;
    return readFirstPlay().indexOf(key) !== -1;
  }

  function firstPlayMarkSeen(key) {
    if (!key) return;
    const list = readFirstPlay();
    if (list.indexOf(key) === -1) {
      list.push(key);
      try {
        localStorage.setItem(FIRST_PLAY_KEY, JSON.stringify(list));
      } catch (e) {}
    }
  }

  function forgetFirstPlay() {
    try { localStorage.removeItem(FIRST_PLAY_KEY); } catch (e) {}
  }

  /**
   * Deals `count` items from `pool` that this phone has not had from `listId`.
   *
   *   key    how an item is identified (default: the string itself, or its JSON)
   *   avoid  keys to leave out this time only - the cards already up in the
   *          current round - without counting them as dealt
   *
   * Several pools can share one list (Who Am I's categories): starting over only
   * forgets the items of the pool being dealt from.
   */
  function freshPick(listId, pool, count, options) {
    const opts = options || {};
    const keyOf = opts.key || (x => typeof x === 'string' ? x : JSON.stringify(x));
    const avoid = new Set(opts.avoid || []);
    const candidates = (pool || []).filter(x => !avoid.has(keyOf(x)));
    const want = Math.max(0, Math.min(count === undefined ? 1 : count, candidates.length));
    if (!want) return [];

    const lists = readSeenLists();
    const dealt = new Set(lists[listId] || []);
    const unseen = candidates.filter(x => !dealt.has(keyOf(x)));
    let picks;

    if (unseen.length >= want) {
      picks = shuffleArray(unseen).slice(0, want);
      picks.forEach(x => dealt.add(keyOf(x)));
    } else {
      // The list has run out: deal what is left of it, then start it over for
      // the rest. The refill comes from what was dealt longest ago (the stored
      // list is in dealing order), and everything dealt now opens the new cycle -
      // marking only the refill let the last of the old cycle come straight back.
      const leftKeys = new Set(unseen.map(keyOf));
      const age = new Map((lists[listId] || []).map((k, i) => [k, i]));
      const older = candidates.filter(x => !leftKeys.has(keyOf(x)))
        .sort((a, b) => (age.has(keyOf(a)) ? age.get(keyOf(a)) : -1) - (age.has(keyOf(b)) ? age.get(keyOf(b)) : -1));
      const need = want - unseen.length;
      const refill = shuffleArray(older.slice(0, Math.max(need, Math.ceil(older.length / 2)))).slice(0, need);
      picks = shuffleArray(unseen).concat(refill);
      pool.forEach(x => dealt.delete(keyOf(x)));
      picks.forEach(x => dealt.add(keyOf(x)));
    }

    lists[listId] = [...dealt];
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(lists)); } catch (e) {}
    return picks;
  }

  /* --- REMEMBERED CHOICES ---
     A game's options open the way they were last left on this phone: what the
     table picked is the default next time, and a change is kept the moment it
     is made, not when the game starts. Most games keep theirs in their own
     slice of appState (saved with the rest) or under a key of their own; these
     are for choices that live nowhere else - a module variable, a plain field -
     all under one key, which "delete all data" clears with the rest.

       recallOptions('chooser', { mode: 'one' })    the saved object over the defaults
       rememberOptions('chooser', { mode: 'two' })  merged into what is saved

     A setup field marked data-remember (a stepper, a switch, a range, a hidden
     time field, a category list) is kept by its id whenever it changes, and
     put back by paintSetupOptions before the screen's painter runs; a list
     filled in JS calls recallField itself once its options exist. Only
     choices: never mark a secret word, a number to guess or a name typed for
     one round. */
  const OPTIONS_KEY = 'ashryOptions_v1';

  const isPlainObject = (v) => !!v && typeof v === 'object' && !Array.isArray(v);

  function readOptionsStore() {
    try {
      const all = JSON.parse(localStorage.getItem(OPTIONS_KEY) || '{}');
      return isPlainObject(all) ? all : {};
    } catch (e) { return {}; }
  }

  function recallOptions(key, defaults) {
    const saved = readOptionsStore()[key];
    if (isPlainObject(defaults)) return Object.assign({}, defaults, isPlainObject(saved) ? saved : {});
    return saved === undefined ? defaults : saved;
  }

  function rememberOptions(key, value) {
    const all = readOptionsStore();
    all[key] = isPlainObject(value) && isPlainObject(all[key]) ? Object.assign({}, all[key], value) : value;
    try { localStorage.setItem(OPTIONS_KEY, JSON.stringify(all)); } catch (e) {}
    return all[key];
  }

  function rememberField(el) {
    if (!el || !el.id) return;
    if (el.type === 'checkbox') { rememberOptions('fields', { [el.id]: !!el.checked }); return; }
    const value = String(el.value == null ? '' : el.value);
    // An emptied number box is a field being retyped, not a choice.
    if (value.trim() === '' && (el.type === 'number' || el.tagName === 'SELECT')) return;
    rememberOptions('fields', { [el.id]: value });
  }

  /** Puts one field back as it was last left; false when there is nothing to put back. */
  function recallField(el) {
    if (!el || !el.id || el === document.activeElement) return false;
    const saved = recallOptions('fields', {});
    if (!(el.id in saved)) return false;
    const v = saved[el.id];
    if (el.type === 'checkbox') { el.checked = !!v; return true; }
    let text = String(v);
    if (el.tagName === 'SELECT') {
      if (![...el.options].some(o => o.value === text)) return false;
    } else if (el.type === 'number') {
      let n = Number(text);
      if (text.trim() === '' || !isFinite(n)) return false;
      const min = el.dataset.min !== undefined ? Number(el.dataset.min) : (el.min !== '' ? Number(el.min) : NaN);
      const max = el.dataset.max !== undefined ? Number(el.dataset.max) : (el.max !== '' ? Number(el.max) : NaN);
      if (isFinite(min)) n = Math.max(min, n);
      if (isFinite(max)) n = Math.min(max, n);
      text = String(n);
    }
    el.value = text;
    return true;
  }

  function recallFields(root) {
    if (root) root.querySelectorAll('[data-remember]').forEach(recallField);
  }

  // Typing, a stepper (stepField fires both events), a switch or a list: kept as it changes.
  ['input', 'change'].forEach(type => document.addEventListener(type, (e) => {
    const el = e.target;
    if (el && el.matches && el.matches('[data-remember]')) rememberField(el);
  }));

  /* --- CLOCKS --- */

  // Every live clock, so clearAllIntervals() can stop them and so they can all be
  // re-read when the tab comes back to the foreground.
  const activeClocks = new Set();

  /**
   * A pausable clock anchored to Date.now().
   *
   * Every timer in the app used to sit on setInterval(..., 1000) and decrement a
   * counter. That drifts, and on mobile it does worse than drift: browsers
   * throttle or suspend timers in backgrounded tabs, so locking the screen or
   * switching apps mid-round quietly froze the clock and it resumed as if no time
   * had passed. Reading elapsed time from the clock instead of counting ticks
   * keeps it honest, and each tick is scheduled at the next whole-second boundary
   * rather than 1000ms after the last one, so the display cannot slide.
   *
   *   seconds  countdown length (ignored when countUp is set)
   *   countUp  count up from zero instead of down (imposter's discussion timer)
   *   onTick   called with the whole-second value whenever it changes
   *   onEnd    called once when a countdown reaches zero
   */
  function createClock(options) {
      const countUp = !!options.countUp;
      // `ms` for a countdown that must keep its fraction of a second (the chess clock).
      const totalMs = options.ms != null
          ? Math.max(0, Math.round(options.ms))
          : Math.max(0, Math.round(options.seconds || 0)) * 1000;
      const onTick = options.onTick || function() {};
      const onEnd = options.onEnd || function() {};

      let elapsedBefore = 0;        // ms banked from previous (pre-pause) runs
      let startedAt = Date.now();   // when the current run began
      let timeoutId = null;
      let paused = false;
      let finished = false;
      let lastValue = null;

      const elapsedMs = () =>
          elapsedBefore + ((paused || finished) ? 0 : Date.now() - startedAt);

      const value = () => countUp
          ? Math.floor(elapsedMs() / 1000)
          : Math.max(0, Math.ceil((totalMs - elapsedMs()) / 1000));

      const emit = () => {
          const v = value();
          if (v !== lastValue) {
              lastValue = v;
              onTick(v);
          }
      };

      const cancel = () => {
          if (timeoutId) clearTimeout(timeoutId);
          timeoutId = null;
      };

      // Aim at the next whole-second boundary of the elapsed time, so a late
      // wake-up is absorbed instead of accumulating.
      const schedule = () => {
          cancel();
          timeoutId = setTimeout(step, Math.max(25, 1000 - (elapsedMs() % 1000)));
      };

      function step() {
          timeoutId = null;
          if (paused || finished) return;
          emit();
          if (!countUp && elapsedMs() >= totalMs) {
              finished = true;
              activeClocks.delete(clock);
              onEnd();
              return;
          }
          schedule();
      }

      const clock = {
          /** Re-read the clock right now (used when the tab regains focus). */
          sync() {
              // step() only forgets the pending timer's id, so cancel it first -
              // otherwise every wake from the lock screen left one more chain running.
              if (!paused && !finished) { cancel(); step(); }
              return clock;
          },
          pause() {
              if (paused || finished) return clock;
              elapsedBefore = elapsedMs();
              paused = true;
              cancel();
              return clock;
          },
          resume() {
              if (!paused || finished) return clock;
              paused = false;
              startedAt = Date.now();
              emit();
              schedule();
              return clock;
          },
          /** Pause or resume; returns true if the clock is now paused. */
          toggle() {
              if (paused) clock.resume(); else clock.pause();
              return paused;
          },
          stop() {
              finished = true;
              cancel();
              activeClocks.delete(clock);
              return clock;
          },
          isPaused: () => paused,
          isRunning: () => !paused && !finished,
          value: value,
          // A clock that goes on when its screen is left (the general timer).
          keepRunning: !!options.keepRunning
      };

      activeClocks.add(clock);
      emit();
      schedule();
      return clock;
  }

  /** Stops every running clock, except one asked to keep running. */
  function stopAllClocks() {
      [...activeClocks].forEach(c => { if (!c.keepRunning) c.stop(); });
  }

  /* A sheet over a game on one phone (leave this game?, the rules) stops the
     game's clocks while it is read, and "carry on" starts them again. A room's
     clocks belong to the server, so they are left alone. */
  let sheetPausedClocks = [];
  function pauseClocksForSheet() {
      const view = String(appState.currentView || '');
      // The bomb's fuse is a secret: stopping it on a popup would tell the table.
      if (view.indexOf('room-') === 0 || view === 'play-bomb') return;
      [...activeClocks].forEach(c => {
          if (c.keepRunning || !c.isRunning()) return;
          c.pause();
          sheetPausedClocks.push(c);
      });
  }
  function resumeClocksAfterSheet() {
      const clocks = sheetPausedClocks;
      sheetPausedClocks = [];
      clocks.forEach(c => { if (activeClocks.has(c)) c.resume(); });
  }

  // A backgrounded tab may not have been able to fire its pending tick, so
  // re-read every clock the moment we are visible again.
  document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
          [...activeClocks].forEach(c => c.sync());
      }
  });

  /**
   * The names this phone knows. Local, and local only.
   *
   * This used to be a column in the `اللاعبين` sheet — one list shared by every
   * device that ever opened the app, so playing once with your family put their
   * names in front of your friends the next time they opened it. It also meant
   * every new name waited on a spreadsheet write before the + button came back.
   */
  const PLAYER_LIBRARY_KEY = 'ashryPlayers_v1';
  let allPlayers = [];

  /** Case- and spelling-insensitive, so أحمد and احمد are the same person. */
  function samePlayer(a, b) {
    const fold = (x) => String(x || '').trim().toLowerCase()
      .replace(/[\u064b-\u0652\u0670]/g, '')
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
      .replace(/\u0629/g, '\u0647')
      .replace(/[\u0649\u064a]/g, '\u064a')
      .replace(/\s+/g, ' ');
    return fold(a) === fold(b);
  }

  /**
   * The spellings of one word, folded: أسد and اسد, مكتبة and مكتبه, مصطفى and
   * مصطفي, diacritics, the tatweel, punctuation, spaces, and a leading "ال" or
   * "the". Mirrors normaliseClue in RoomGames.js - keep the two identical - so a
   * phone refuses the same Codenames clue the server would, and the one-phone
   * Just One removes the same duplicate clues a room does.
   */
  /**
   * The language the games' content comes in. Settings → "لغة الألعاب" can pin
   * it to Arabic or English regardless of the app's own language, for a table
   * that reads the app in English but plays with Arabic words - or the other
   * way round. 'auto' follows the app. Every bank lookup, freshPick key and
   * room start payload goes through this, never through appState.lang.
   */
  function contentLang() {
    const g = appState.gameLang;
    if (g === 'ar' || g === 'en') return g;
    return appState.lang === 'en' ? 'en' : 'ar';
  }

  function cycleGameLang() {
    const order = ['auto', 'ar', 'en'];
    const cur = order.indexOf(appState.gameLang) === -1 ? 0 : order.indexOf(appState.gameLang);
    appState.gameLang = order[(cur + 1) % order.length];
    saveToLocal();
    updateSettingsLabels();
    runLanguageHooks();
    haptic('light');
  }

  function foldWord(text) {
    let out = String(text || '').toLowerCase()
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/[ىی]/g, 'ي')
      .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ک/g, 'ك')
      .replace(/[^\p{L}\p{N} ]/gu, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    if (out.indexOf('the ') === 0) out = out.slice(4);
    for (let i = 0; i < 2 && out.length > 3 && out.indexOf('ال') === 0; i++) out = out.slice(2);
    return out.replace(/\s+/g, '');
  }

  function loadPlayerLibrary() {
    try {
      const raw = localStorage.getItem(PLAYER_LIBRARY_KEY);
      allPlayers = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(allPlayers)) allPlayers = [];
    } catch (e) { allPlayers = []; }
    return allPlayers;
  }

  function savePlayerLibrary() {
    try { localStorage.setItem(PLAYER_LIBRARY_KEY, JSON.stringify(allPlayers)); } catch (e) {}
  }

  /** Returns the stored spelling, so a second "احمد" reuses the first "أحمد". */
  function addToPlayerLibrary(rawName) {
    const name = String(rawName || '').trim().slice(0, 24);
    if (!name) return '';
    const existing = allPlayers.find(p => samePlayer(p, name));
    if (existing) return existing;
    allPlayers.push(name);
    savePlayerLibrary();
    return name;
  }

  function removeFromPlayerLibrary(name) {
    allPlayers = allPlayers.filter(p => !samePlayer(p, name));
    savePlayerLibrary();
    // Someone deleted from the library shouldn't stay selected for the round.
    if (appState.activePlayers) {
      appState.activePlayers = appState.activePlayers.filter(p => !samePlayer(p, name));
      saveToLocal();
    }
  }

     sensor, a wake lock - is stopped by the game itself, from here:
       onLeaveScreen((from, to) => { if (from === 'play-bomb') bombStop(); });
     setView runs every hook whenever the screen changes. */
  const LEAVE_HOOKS = [];
  function onLeaveScreen(fn) { LEAVE_HOOKS.push(fn); }
  function runLeaveHooks(from, to) {
      LEAVE_HOOKS.forEach(fn => { try { fn(from, to); } catch (e) { console.warn('leave hook', e); } });
  }

  /* Screens drawn in JS carry their own text, so a language change (the app's,
     or the games' language in Settings) asks each game to draw again:
       onLanguageChange(view => { if (view === 'play-sudoku') renderSudoku(); });
     paintSetupOptions runs first, so setup lists are rebuilt there. */
  const LANG_HOOKS = [];
  function onLanguageChange(fn) { LANG_HOOKS.push(fn); }
  function runLanguageHooks() {
      const view = appState.currentView;
      if (typeof paintSetupOptions === 'function') { try { paintSetupOptions(view); } catch (e) { console.warn('setup painter', e); } }
      LANG_HOOKS.forEach(fn => { try { fn(view); } catch (e) { console.warn('language hook', e); } });
  }

  function clearAllIntervals() {
      // Every countdown and clock in the app now runs through createClock, so one
      // call covers monkey, imposter, charades, describe, who-am-I, the general

      stopAllClocks();

      // ...then drop the handles, so nothing is left holding a stopped clock.
      if (typeof stopTimer === 'function') stopTimer();
      if (typeof stopImposterTimer === 'function') stopImposterTimer();
      dropTimerHandles();

  function toggleLanguage() {
    appState.lang = appState.lang === 'ar' ? 'en' : 'ar';
    applyTranslations();
    // Screens drawn in JS carry their own text; redraw the ones on show.
    if (appState.currentView === 'play-trivia' && typeof renderTriviaBoard === 'function') renderTriviaBoard();
    if (appState.currentView === 'setup-connections' && typeof paintConnectLevel === 'function') paintConnectLevel();
    runLanguageHooks();
    // A room screen only redraws when the room changes, so it kept the old
    // language until the next move. Drop its signatures and draw it now.
    if ((appState.currentView || '').indexOf('room-') === 0 && typeof Room !== 'undefined' && Room.state) {
      const view = document.getElementById('view-' + appState.currentView);
      if (view) delete view.dataset.sig;
      const setup = document.getElementById('room-host-setup');
      if (setup) delete setup.dataset.sig;
      routeRoomState(Room.state);
    }
    saveToLocal();
    playSound('click');
    haptic('light');

  function applyTranslations() {
    const t = TRANSLATIONS[appState.lang];

    // Direction belongs here, not only in toggleLanguage: every logical
    // property in the stylesheet and the `html[lang="ar"]` typography rules
    // key off these two attributes, so anything that changes the language
    // without going through the toggle would leave the app mirrored.
    // Only when they change: setting either on <html>, even to the value it
    // already has, restyles the whole document, and this runs on every
    // setView - on the home that was most of the time a back tap took.
    const root = document.documentElement;
    const dir = appState.lang === 'en' ? 'ltr' : 'rtl';
    if (root.getAttribute('lang') !== appState.lang) root.lang = appState.lang;
    if (root.getAttribute('dir') !== dir) root.dir = dir;

    // Rewritten only where the text differs (a label code changed is still reset).
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] && el.innerHTML !== t[key]) el.innerHTML = t[key];
    });
    
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (t[key]) el.placeholder = t[key];
    });
    // An icon button says what it does in its tooltip and to a screen reader.
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      const key = el.getAttribute('data-i18n-title');
      if (t[key]) { el.title = t[key]; el.setAttribute('aria-label', t[key]); }
    });

    // The header shows the current screen's name, not the app name, so it is
    // owned by syncChrome rather than by the generic [data-i18n] sweep.
    syncChrome(appState.currentView);
    updateSettingsLabels();

    // The home screen and the hero on a setup screen are drawn from the
    // catalog in this language (JS_Catalog.html).
    if (typeof renderCatalogViews === 'function' && homeRenderedLang !== appState.lang) renderCatalogViews();
    if (typeof syncGameHero === 'function') syncGameHero(appState.currentView);
  }
  let homeRenderedLang = null;

  /**
   * Popups belong to the page, not to the screen they are written next to. Most
   * sit inside <main> in Controller.html, and on iPhone a position:fixed element
   * inside that scrolling area is drawn inside it: the header and the bottom nav
   * covered the popup and its buttons. Moved under <body> once at start-up,
   * every popup covers the whole screen.
   */
  function hoistModals() {
    const tintOnOpen = new MutationObserver(records => {
      records.forEach(r => {
        const overlay = r.target;
        if (!overlay.classList.contains('hidden')) tintModal(overlay);
      });
      navSoon();   // back closes an open popup (an entry of its own)
    });
    document.querySelectorAll('.modal-overlay').forEach(el => {
      if (el.parentElement !== document.body) document.body.appendChild(el);
      tintOnOpen.observe(el, { attributes: true, attributeFilter: ['class'] });
    });
  }

  /* Moved under <body>, a popup no longer sits inside its game's screen, so it
     lost the game's colour and every result, exit and confirm sheet came up
     violet. It takes the colour of the screen it opens over, unless the popup
     sets one of its own (data-accent in the markup). */
  function tintModal(overlay) {
    const content = overlay.querySelector('.modal-content');
    if (!content) return;
    if (content.hasAttribute('data-accent') && !content.hasAttribute('data-accent-auto')) return;
    const meta = VIEW_META[appState.currentView] || {};
    if (meta.accent) {
      content.setAttribute('data-accent', meta.accent);
      content.setAttribute('data-accent-auto', '');
    } else if (content.hasAttribute('data-accent-auto')) {
      content.removeAttribute('data-accent');
      content.removeAttribute('data-accent-auto');
    }
  }

  function registerServiceWorker() {
    // The published site only: the local preview sets no STATIC_SITE, so testing
    // never runs against a cached copy. docs/sw.js keeps an offline copy of the
    // app; tools/build-site.mjs writes it.
    if (!window.STATIC_SITE || !('serviceWorker' in navigator)) return;
    const hadController = !!navigator.serviceWorker.controller;
    // A new build taking over while Settings is open: its version row says so at once.
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      const m = document.getElementById('settings-modal');
      if (m && !m.classList.contains('hidden')) paintAppVersion();
    });
    const reg = navigator.serviceWorker.register('sw.js').catch(() => null);
    // The app opens from the copy on the phone (docs/sw.js), so a new build is found by
    // asking for sw.js again. The browser does that when the app is opened; an iPhone
    // home-screen copy can sit in the background for days, so ask on coming back too
    // (at most every 10 minutes).
    let askedAt = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || Date.now() - askedAt < 600000) return;
      askedAt = Date.now();
      reg.then(r => r && r.update()).catch(() => {});
    });
    // The fonts, confetti and the QR come from outside. On a first visit they
    // load before the worker is in charge, so it never saw them, and offline the
    // app lost its fonts. Once a worker controls the page, ask for them again
    // through it so it keeps them: a few requests, almost always answered from
    // the browser's own cache, well after the app has started.
    const warm = () => setTimeout(() => {
      try {
        const pinned = /^https:\/\/(cdn\.jsdelivr\.net|fonts\.googleapis\.com|fonts\.gstatic\.com)\//;
        performance.getEntriesByType('resource').map(e => e.name).filter(u => pinned.test(u))
          .forEach(u => fetch(u, { mode: 'cors', credentials: 'omit' }).catch(() => {}));
      } catch (e) {}
    }, 5000);
    if (hadController) warm();
    else navigator.serviceWorker.addEventListener('controllerchange', warm, { once: true });
    // A new build's worker takes over an open page (skipWaiting + claim). Say so
    // once, with a tap to load it - an iPhone home-screen copy can stay open for
    // days and has no reload button. Not on a first visit, when there was no
    // worker before and nothing is out of date.
    let told = false;
    navigator.serviceWorker.addEventListener('controllerchange', async () => {
      // Settings → تحديث البيانات asked for the new build: it is here, so switch now.
      if (appUpdateAsked) { reloadApp(); return; }
      if (!hadController || told) return;
      // A first visit, or a page that already is the new build (a phone that had no
      // copy yet went to the network), is not news: only a page older than the worker is.
      try {
        const res = await fetch('sw.js', { cache: 'no-store' });
        const m = /const CACHE = 'ashry-(\d+)'/.exec(await res.text());
        if (m && window.BUILD_ID && m[1] === window.BUILD_ID) return;
      } catch (e) { return; }   // offline: nothing new can be loaded anyway
      if (told) return;
      told = true;
      // The new build is already on the phone, so switching is a fraction of a second.
      // It happens by itself when nothing is lost: under the intro, or on the home,
      // مع بعض or الأدوات with no room open, no popup, no field being typed in and no
      // tap for a few seconds - or when the app goes to the background. In a game or
      // a room the note below says so, and a tap switches.
      if (appUpdateQuiet()) { reloadApp(); return; }
      appUpdateWatch();
      const t = TRANSLATIONS[appState.lang] || {};
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'toast info toast--action';
      el.textContent = '✨ ' + (t.update_ready || 'فيه نسخة جديدة من التطبيق - اضغط للتحديث');
      el.onclick = () => reloadApp();
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 15000);
    });
  }

  /* --- a new build, switched to when nothing is lost (registerServiceWorker) --- */
  let lastTapAt = 0;
  document.addEventListener('pointerdown', () => { lastTapAt = Date.now(); }, true);
  document.addEventListener('keydown', () => { lastTapAt = Date.now(); }, true);

  // Screens a reload loses nothing on: the three tabs and the setup screens (their
  // choices are saved as they change) - never a game being played or a room.
  function appUpdateSafeView() {
    const v = appState.currentView || '';
    if (typeof Room !== 'undefined' && Room.state) return false;
    return ['menu', 'together', 'tools'].indexOf(v) !== -1 || v.indexOf('setup-') === 0;
  }

  function appUpdateQuiet() {
    // Still on the intro: nothing is on screen yet.
    if (typeof intro !== 'undefined' && intro.state !== 'done') return true;
    // While someone is on a setup screen, choosing: only when the app goes to the background.
    if (!appUpdateSafeView() || (appState.currentView || '').indexOf('setup-') === 0) return false;
    if (document.querySelector('.modal-overlay:not(.hidden)')) return false;
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return false;
    return Date.now() - lastTapAt > 4000;
  }

  // Waiting for a quiet moment: every few seconds, and when the app goes to the background.
  function appUpdateWatch() {
    const tick = setInterval(() => { if (appUpdateQuiet()) { clearInterval(tick); reloadApp(); } }, 3000);
    // Gone to the background on a screen that loses nothing: back to the new build.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && appUpdateSafeView()) { clearInterval(tick); reloadApp(); }
    });
  }

  function saveActivePlayers(selectedArray) {
    if (selectedArray && selectedArray.length > 0) {
        appState.activePlayers = selectedArray;
        saveToLocal();
    }
}

  /* --- The intro ---------------------------------------------------------------
     The page opens on the brand mark (#app-loader, drawn by the critical CSS in
     Controller.html before any script runs). Once the app is ready, and no
     sooner than INTRO_MIN_MS after the intro went up, the mark flies into its
     place in the home header while the ground fades and the home rises in under
     it. It only flies when the app opens on the home screen: a reload that lands
     in a game or a room, a join link, a phone set to reduce motion, a hidden
     tab, or a tap on the intro all get a quick fade instead. Every step runs on
     a timer - an animation event is never the only path (see GEMINI.md). */
  const INTRO_MIN_MS = 1300;
  const INTRO_FLIGHT_MS = 800;
  const intro = { state: 'waiting', skip: false, timers: [], flight: null };

  function introLater(fn, ms) { intro.timers.push(setTimeout(fn, ms)); }

  /** Takes the intro away once the app is ready: a flight home when it can, a fade when it can't. */
  function introExit() {
    if (intro.state !== 'waiting') return;
    const loader = document.getElementById('app-loader');
    if (!loader) { intro.state = 'done'; return; }
    intro.state = 'leaving';
    const reduce = reducedMotion();
    const onHome = appState.currentView === 'menu'
      && !(window.SERVER_DATA && window.SERVER_DATA.room)
      && !window.OPEN_INSTALL && !/[?&]install=1/.test(location.search);
    if (intro.skip || reduce || !onHome || document.hidden) {
      introFade(intro.skip ? 150 : 350);
      return;
    }
    const shown = (window.performance ? performance.now() : 0) - (window.INTRO_T0 || 0);
    introLater(introFly, Math.max(0, INTRO_MIN_MS - shown));
  }

  function introFly() {
    if (intro.state !== 'leaving') return;
    const loader = document.getElementById('app-loader');
    const mark = loader && loader.querySelector('.mark--loader');
    const target = document.querySelector('#app-title .mark--title');
    const landing = target ? target.getBoundingClientRect() : null;
    // Somewhere else by now (a room link resumed), or nowhere to land: just fade.
    if (!mark || !landing || !landing.width || appState.currentView !== 'menu' || typeof mark.animate !== 'function') {
      introFade(350);
      return;
    }
    mark.style.animation = 'none';
    // The centre from the screen; the size from the style, because the entrance
    // may still be scaling the mark (a slow phone, a tab that wasn't painting)
    // and a scale taken from a shrunken rect lands it too big.
    const from = mark.getBoundingClientRect();
    const size = parseFloat(getComputedStyle(mark).width) || from.width;
    const dx = (landing.left + landing.width / 2) - (from.left + from.width / 2);
    const dy = (landing.top + landing.height / 2) - (from.top + from.height / 2);
    document.body.classList.add('intro-flying');
    loader.classList.add('is-flying');
    intro.flight = mark.animate(
      [{ transform: 'none' }, { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + (landing.width / size) + ')' }],
      { duration: INTRO_FLIGHT_MS, easing: 'cubic-bezier(0.7, 0, 0.2, 1)', fill: 'forwards' }
    );
    introLater(() => document.body.classList.add('intro-reveal'), 320);
    introLater(() => introDone(loader), INTRO_FLIGHT_MS - 10);
  }

  function introFade(ms) {
    const loader = document.getElementById('app-loader');
    intro.state = 'leaving';
    document.body.classList.remove('intro-flying');
    if (!loader) { intro.state = 'done'; return; }
    loader.style.transition = 'opacity ' + ms + 'ms ease-out';
    loader.style.opacity = '0';
    introLater(() => introDone(loader), ms);
  }

  function introDone(loader) {
    intro.state = 'done';
    if (loader) {
      loader.style.display = 'none';
      loader.classList.add('hidden');
    }
    document.body.classList.remove('intro-flying');
    if (intro.flight) {
      try { intro.flight.cancel(); } catch (e) {}
      intro.flight = null;
    }
    // The home's rise has finished by then; take the class off so a later visit doesn't replay it.
    setTimeout(() => document.body.classList.remove('intro-reveal'), 900);
    // A phone's browser is asked to put the app on the home screen (JS_Utils.html).
    if (typeof installAskSoon === 'function') installAskSoon();
  }

  /** A tap on the intro: straight into the app, as soon as it is ready. */
  function skipIntro() {
    if (intro.state === 'done') return;
    if (intro.state === 'waiting') { intro.skip = true; return; }
    intro.timers.forEach(clearTimeout);
    intro.timers = [];
    introFade(150);
  }

  function initializeApp() {
    // A browser the page can't run in shows its own note (the gate in Controller.html).
    if (window.ASHRY_UNSUPPORTED) return;
    // If anything below throws, the intro still goes.
    setTimeout(() => { if (intro.state === 'waiting') introFade(350); }, 3000);
    setSyncing(true);
    stickySetupStarts();
    // Markup that shows a drawn icon says which (a sheet's title); fill them in once.
    document.querySelectorAll('[data-art-icon]').forEach(el => { el.innerHTML = iconHtml('art:' + el.getAttribute('data-art-icon')); });
    applyTranslations();
    if (typeof renderHome === 'function') renderHome();

    // The header gains its frosted hairline once the page has scrolled under it.
    if (typeof syncFxButton === 'function') syncFxButton(appState.currentView);
    const shellMain = document.getElementById('shell-main');
    const shellEl = document.querySelector('.shell');
    if (shellMain && shellEl) {
      let scrolled = false;
      shellMain.addEventListener('scroll', () => {
        const on = shellMain.scrollTop > 4;
        if (on !== scrolled) { scrolled = on; shellEl.classList.toggle('is-scrolled', on); }
      }, { passive: true });
    }

    // Names are local, and the spy words arrive with the page (SpyWords.js).
    loadPlayerLibrary();

    if (window.SERVER_DATA && window.SERVER_DATA.spyData) {
        SPY_CATEGORIES = window.SERVER_DATA.spyData || {};
        dataLoaded = true;
        setSyncing(false);
        
        // Render UI if needed
        const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
        if (activeSetup) {
            const listContainer = activeSetup.querySelector('[id$="-player-list"]');
            if (listContainer && typeof renderActiveChips === 'function') {
                renderActiveChips(listContainer.id);
            }
        }

    } else {
        // The build always puts the spy words in the page; carry on without them.
        SPY_CATEGORIES = {};
        dataLoaded = true;
        setSyncing(false);
    }

    loadFromLocal();
    // The history gets one entry per screen from the home to the one restored.
    navInit(appState.currentView);
    // The saved screen is known now, so the intro can decide how to leave.
    introExit();

    // An iPhone copy on the home screen with an older icon (JS_Utils.html).
    if (typeof checkIconBanner === 'function') checkIconBanner();
    // The "open in Safari" link from that banner lands on the install steps.
    if ((window.OPEN_INSTALL || /[?&]install=1/.test(location.search)) && typeof showInstallHelp === 'function') {
        setTimeout(showInstallHelp, 700);
    }

    
    document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
  }

  /* Settings → تحديث البيانات. A real reload: the service worker fetches the
     network first, so this is how a home-screen copy (which has no reload
     button) picks up a new build. Re-running initializeApp loaded nothing new. */
  /**
   * Settings → تحديث البيانات. The app opens from the copy on the phone, so a plain reload
   * would show that copy again: ask for sw.js first, and if a newer build is being
   * installed, the page switches the moment its worker takes over (controllerchange above).
   */
  let appUpdateAsked = false;
  async function updateApp() {
    const sw = window.STATIC_SITE && navigator.serviceWorker;
    const reg = sw ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
    if (!reg) { reloadApp(); return; }
    appUpdateAsked = true;
    try { await reg.update(); } catch (e) {}
    if (!reg.installing && !reg.waiting) { reloadApp(); return; }
    const t = TRANSLATIONS[appState.lang] || {};
    if (typeof showToast === 'function') showToast(t.update_downloading || 'بنزّل النسخة الجديدة…', 'info');
    // A download that never ends (the network went) still gets a reload.
    setTimeout(reloadApp, 120000);
  }

  /* --- Settings → الإصدار: when this copy was published, and whether it is the latest --- */
  let appVersionState = '';

  // BUILD_ID is the build's time in UTC, YYYYMMDDHHMMSS (tools/build-site.mjs).
  function appBuildDate() {
    const id = String(window.BUILD_ID || '');
    if (!/^\d{14}$/.test(id)) return null;
    return new Date(Date.UTC(+id.slice(0, 4), +id.slice(4, 6) - 1, +id.slice(6, 8), +id.slice(8, 10), +id.slice(10, 12), +id.slice(12, 14)));
  }

  // A date and a time, never a version number (the owner's rule: no "v12").
  function appVersionLabel() {
    const d = appBuildDate();
    if (!d) return '';
    try {
      return d.toLocaleString(appState.lang === 'en' ? 'en-GB' : 'ar-EG', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true });
    } catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
  }

  /**
   * Asks the server for sw.js (a couple of KB, quick however slow the page itself would be):
   * its stamp is the newest build. Newer than this page and already on the phone (its cache
   * is there): ready, a tap switches. Newer and not yet here: it is being fetched now.
   */
  async function paintAppVersion() {
    const val = document.getElementById('settings-version-value');
    const st = document.getElementById('settings-version-status');
    if (!val || !st) return;
    const t = TRANSLATIONS[appState.lang] || {};
    const set = (k) => { appVersionState = k; st.textContent = t['ver_' + k] || ''; };
    val.textContent = appVersionLabel();
    if (!window.STATIC_SITE || !window.BUILD_ID) { set('preview'); return; }
    set('checking');
    let latest = null;
    try {
      const res = await fetch('sw.js', { cache: 'no-store' });
      const m = /const CACHE = 'ashry-(\d+)'/.exec(await res.text());
      latest = m && m[1];
    } catch (e) { latest = null; }
    if (!latest) { set('offline'); return; }
    if (latest <= String(window.BUILD_ID)) { set('latest'); return; }
    let here = false;
    try { here = (await caches.keys()).indexOf('ashry-' + latest) !== -1; } catch (e) {}
    if (here) { set('ready'); return; }
    set('downloading');
    try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) reg.update(); } catch (e) {}
  }

  function appVersionTap() {
    if (appVersionState === 'ready') { reloadApp(); return; }
    // Being fetched: a tap asks for it to open as soon as it has arrived.
    if (appVersionState === 'downloading') {
      updateApp();
      const st = document.getElementById('settings-version-status');
      const t = TRANSLATIONS[appState.lang] || {};
      if (st) st.textContent = t.update_downloading || '';
      return;
    }
    paintAppVersion();
  }

  function reloadApp() {
      try { saveToLocal(); } catch (e) {}
      location.reload();
  }

  // Clock handles and timeout ids are parked on appState, but they mean nothing
  // outside the current page: dropping them keeps a revived save from handing back
  // something that merely looks like a live clock.
  const OMIT_FROM_SAVE = ['interval', 'timeoutId'];

  function saveToLocal() {
    // Private browsing or a full storage throws here; setView calls this on
    // every screen change, so a throw would stop the app from moving at all.
    try {
      localStorage.setItem('gameTrackerState_v1', JSON.stringify(appState,
        (key, value) => OMIT_FROM_SAVE.includes(key) ? undefined : value));
    } catch (e) { /* nothing to save to: play on */ }
  }

  /**
   * Clears every timer handle parked on appState, and the flags that go with them.
   *
   * Called when leaving a view and again after loading a saved state - a save from
   * an older version holds setInterval ids (plain numbers) where a clock handle is
   * now expected, and either would pass a truthiness check and then blow up on
   * .stop().
   */
  function dropTimerHandles() {
    appState.charades.interval = null;
    appState.describe.interval = null;
    appState.whoami.interval = null;
    appState.whoami.isPaused = false;
    const general = appState.timers.general;
    if (!(general.interval && general.interval.keepRunning && general.interval.isRunning())) {
        general.interval = null;
        general.running = false;
    }
    appState.timers.chess.interval = null;
    appState.timers.chess.active = null;
    appState.reaction.timeoutId = null;
  }

  function loadFromLocal() {
    // A browser that blocks storage (a TV's, a locked-down kiosk) throws here;
    // the app starts fresh rather than not at all.
    let saved = null;
    try { saved = localStorage.getItem('gameTrackerState_v1'); } catch (e) { saved = null; }

    // 👇 FIX: Added 'input-whoami' and 'play-chess' to the safe list
    const validViews = [
        'menu', 'together', 'tools',
        'setup-chameleon', 'reveal-chameleon', 'play-chameleon', 'setup-spyfall', 'reveal-spyfall', 'play-spyfall', 'setup-timesup', 'play-timesup',
        'setup-screw', 'play-screw', 
        'setup-monkey', 'play-monkey', 
        'setup-imposter', 'imposter-reveal', 'play-imposter', 
        'setup-domino', 'play-domino', 
        'setup-spin', 'play-spin', 
        'setup-universal', 'play-universal', 
        'timers',
        'setup-whoami', 'input-whoami', 'play-whoami', 'tool-dice', 'setup-codenames',
        'setup-charades', 'play-charades',
        'setup-describe', 'play-describe',
        'setup-wordle', 'play-wordle',
        'setup-guessnum', 'play-guessnum',
        'setup-justone', 'play-justone',
        'setup-tourney', 'play-tourney',
        'setup-teams', 'results-teams',
        'setup-reaction', 'play-reaction',
        'setup-trivia', 'play-trivia',
        'setup-connections', 'play-connections',
        'setup-bomb', 'play-bomb',
        'setup-emoji', 'play-emoji', 'setup-proverbs', 'play-proverbs', 'setup-fiveseconds', 'play-fiveseconds',
        'room-twotruths', 'room-emoji', 'room-proverbs', 'room-fiveseconds', 'room-telephone', 'room-monkey', 'room-herd', 'room-mafia', 'room-mind', 'room-timeline', 'room-uno', 'room-domino',
        'room-connect4', 'room-dots', 'room-xo', 'room-battleship', 'room-chess', 'room-ludo', 'room-bank', 'room-guesswho', 'room-hangman', 'room-bowling', 'room-doubt', 'room-oldmaid', 'room-minigolf', 'room-chess4',
        // One sets, everyone solves (JS_RoomSolve.html).
        'room-wordle', 'room-guessnum', 'room-flags',
        'setup-stop', 'play-stop',
        'setup-memory', 'play-memory',
        'setup-xo', 'play-xo',
        'play-chooser',
        'play-chess',
        'setup-daily-archive',
        'setup-stats'
    ];

    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            
            const deepMerge = (target, source) => {
                for (const key in source) {
                    if (source[key] instanceof Object && !Array.isArray(source[key]) && target[key] instanceof Object) {
                        Object.assign(target[key], deepMerge(target[key], source[key]));
                    } else {
                        target[key] = source[key];
                    }
                }
                return target;
            };
            appState = deepMerge(appState, parsed);
            dropTimerHandles();

            // cachedPlayers was a copy of the shared sheet list; the library
            // is its own store now and is loaded by initializeApp.
            delete appState.cachedPlayers;
            // الترتيب الأعمى was removed (the owner, 17 Sep 2026); drop its saved board.
            delete appState.blindrank;

            // Room screens come back too: initRooms() redraws them once the session
            // resumes, and restoreView() sends the player to the menu if it can't.
            // Left out, a reload mid-game always landed on the menu.
            if (!validViews.includes(appState.currentView) && String(appState.currentView || '').indexOf('room-') !== 0
                && !(typeof soloViews === 'function' && soloViews().includes(appState.currentView))) {
                appState.currentView = 'menu';
            }
            if(appState.isDarkMode) document.body.classList.add('dark');
            
            document.documentElement.lang = appState.lang || 'ar';
            document.documentElement.dir = (appState.lang === 'en') ? 'ltr' : 'rtl';
            applyTranslations();
        } catch (e) {
            console.error("Error loading state", e);
            appState.currentView = 'menu';
        }
    } else {
        appState.currentView = 'menu'; 
        // A phone opening the app for the first time starts in its own theme.
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            appState.isDarkMode = true;
            document.body.classList.add('dark');
        }
    }
    syncThemeColor();
    restoreView();
  }

  /* The browser's bar (and an installed app's status bar) takes the page's own
     background, in either theme, instead of a fixed indigo. */
  function syncThemeColor() {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      // Read once the theme's colour fade (350ms) has finished.
      setTimeout(() => {
          const bg = getComputedStyle(document.body).backgroundColor;
          if (bg && bg !== 'rgba(0, 0, 0, 0)') meta.setAttribute('content', bg);
      }, 400);
  }

  // Held so a rapid double-toggle doesn't strip .theme-transition mid-fade.
  let themeTransitionTimer = null;

  function toggleDarkMode() {
      appState.isDarkMode = !appState.isDarkMode;

      // Colour transitions are scoped to this class rather than living in the
      // global `*` rule, so they only apply while the theme is switching.
      document.body.classList.add('theme-transition');
      clearTimeout(themeTransitionTimer);
      themeTransitionTimer = setTimeout(() => {
          document.body.classList.remove('theme-transition');
      }, 350);

      document.body.classList.toggle('dark');
      syncThemeColor();

      const icon = appState.isDarkMode ? '☀️' : '🌙';
      const headerIcon = document.getElementById('dark-mode-icon');
      const bottomIcon = document.getElementById('bottom-dark-mode-icon');
      
      if (headerIcon) headerIcon.innerText = icon;
      if (bottomIcon) bottomIcon.innerText = icon;
      
      updateSettingsLabels();
      playSound('click');
      haptic('light');
      saveToLocal();
  }

  /* A save from an older build, or a bug in one game's redraw, must not leave a
     blank screen (and on a full-screen view, no header or nav to get out
     with): a restore that throws lands on that game's setup screen instead. */
  function restoreView() {
    try {
        restoreSavedView();
    } catch (e) {
        console.error('restore failed', appState.currentView, e);
        const up = (VIEW_META[appState.currentView] || {}).up || '';
        document.body.classList.remove('is-fullscreen-view', 'is-tv-view');
        setView(up.indexOf('setup-') === 0 ? up : 'menu');
    }
  }

  function restoreSavedView() {
    document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
    // setView sets these, but a reload restores the screen without it: the
    // chess clock came back with the header and nav, and the big screen as a
    // 520px phone column.
    document.body.classList.toggle('is-fullscreen-view', FULLSCREEN_VIEWS.indexOf(appState.currentView) !== -1);
    document.body.classList.toggle('is-tv-view', appState.currentView === 'room-tv');
    // A room screen restored after a reload is not reached through setView.
    if (typeof syncFxButton === 'function') syncFxButton(appState.currentView);
    
    const viewEl = document.getElementById('view-' + appState.currentView);
    
    if (viewEl) {
        // --- RESTORE GAME LOGIC ---
        if (appState.currentView === 'together' && typeof renderTogether === 'function') renderTogether();
        else if (appState.currentView === 'tools' && typeof renderTools === 'function') renderTools();
        else if (appState.currentView === 'play-screw') renderScrewBoard();
        else if (appState.currentView === 'play-monkey') { renderMonkeyBoard(); updateTimerUI(); }
        else if (appState.currentView === 'imposter-reveal') showRevealStep();
        else if (appState.currentView === 'play-imposter') { renderImposterBoard(); isPaused = true; updateImposterTimerUI(); }
        else if (appState.currentView === 'play-domino') {
            if ((appState.domino.players || []).length) renderDominoBoard();
            else setTimeout(() => setView('setup-domino'), 50);
        }
        else if (appState.currentView === 'play-universal') {
            if ((appState.universal.players || []).length) renderUniversalBoard();
            else setTimeout(() => setView('setup-universal'), 50);
        }
        else if (appState.currentView === 'timers') { switchTimerMode('general'); if (typeof paintGenTimer === 'function') paintGenTimer(); }
        else if (appState.currentView === 'tool-dice' && typeof paintDiceTool === 'function') paintDiceTool();
        // The bracket lives entirely in appState, so it redraws exactly. (The
        // old call named a function that does not exist, and the typeof guard
        // meant it failed silently and showed an empty bracket.)
        else if (appState.currentView === 'play-tourney') {
            if ((appState.tourney.matches || []).length && typeof renderBracket === 'function') renderBracket();
            else setTimeout(() => setView('setup-tourney'), 50);
        }
        // paintTeams, not renderTeams: the latter re-rolls, re-navigates and
        // re-fires confetti, and called with no argument it threw outright.
        else if (appState.currentView === 'results-teams') {
            if ((appState.teams.result || []).length && typeof paintTeams === 'function') paintTeams(appState.teams.result);
            else setTimeout(() => setView('setup-teams'), 50);
        }
        else if (appState.currentView === 'play-spin') {
            const pickerDisplay = document.getElementById('picker-display');
            if(pickerDisplay) pickerDisplay.innerText = "???";
            const spinResultBox = document.getElementById('spin-result-box');
            if(spinResultBox) spinResultBox.classList.add('hidden');
            const spinBtn = document.getElementById('spin-btn');
            if(spinBtn) spinBtn.disabled = false;
        }
        // 👇 FIX: Full-Screen reload protections added here 👇
        else if (appState.currentView === 'play-chess' && typeof updateChessUI === 'function') {
            updateChessUI(); 
        }
        else if (appState.currentView === 'play-reaction') {
            setTimeout(() => setView('setup-reaction'), 50); 
        }
        else if (appState.currentView === 'play-whoami' || appState.currentView === 'input-whoami') {
            setTimeout(() => setView('setup-whoami'), 50);
        }
        // Fully restorable: the whole game is in appState, it just needs drawing.
        else if (appState.currentView === 'play-wordle' && typeof renderWordleBoard === 'function') {
            renderWordleBoard();
            renderKeyboard();
        }
        else if (appState.currentView === 'play-guessnum' && typeof renderGuessNumHistory === 'function') {
            renderGuessNumHistory();
        }
        // Room screens are drawn by the server's next projection. If the saved
        // session cannot be resumed there is nothing to draw, so don't strand
        // the player on a blank view - initRooms() decides which it is.
        else if (appState.currentView.indexOf('room-') === 0) {
            const restored = appState.currentView;
            setTimeout(() => {
                // Only if nothing has moved on meanwhile. A join link opens
                // room-join during this wait, and bouncing then threw the join
                // screen away; room-join itself needs no session to stay on.
                if (restored === 'room-join' || appState.currentView !== restored) return;
                if (typeof Room === 'undefined' || !Room.isIn) setView('menu');
            }, 1500);
        }
        else if (appState.currentView === 'play-connections') {
            // The puzzle lives in a module variable, not appState, so a reload
            // has nothing to draw — start a fresh one rather than show a blank grid.
            setTimeout(() => setupConnections(), 50);
        }
        // The team board is all in appState: draw it as it was left.
        else if (appState.currentView === 'play-trivia' && typeof renderTriviaBoard === 'function') {
            renderTriviaBoard();
            // A card that was open comes back with the time it had left. Not
            // straight away: initializeApp closes every overlay once this has
            // run, and a ?room= link may have moved the screen on meanwhile.
            if (appState.triviaBoard && appState.triviaBoard.open && typeof showTriviaCell === 'function') {
                setTimeout(() => { if (appState.currentView === 'play-trivia') showTriviaCell(); }, 0);
            }
        }
        // Timer-driven: the time left was never persisted, so resuming would be
        // a lie. Send them back to setup and say so rather than showing a dead
        // card and a frozen clock.
        else if (appState.currentView === 'play-charades') {
            setTimeout(() => { setView('setup-charades'); toastRoundLost(); }, 50);
        }
        else if (appState.currentView === 'play-describe') {
            setTimeout(() => { setView('setup-describe'); toastRoundLost(); }, 50);
        }
        else if (appState.currentView === 'play-justone') {
            setTimeout(() => { setView('setup-justone'); toastRoundLost(); }, 50);
        }
        // The pass-the-phone deals live in module variables, not appState, so a
        // reload has no deal to show - and the reveal screens hold the secrets.
        else if (/^(reveal|play)-(chameleon|spyfall)$/.test(appState.currentView) || appState.currentView === 'play-timesup') {
            const game = appState.currentView.split('-')[1];
            setTimeout(() => { setView('setup-' + game); toastRoundLost(); }, 50);
        }
        // Each of these keeps its whole game in appState, with any deadline
        // as a timestamp, so its restore function redraws it as it was; it
        // says no when there was nothing to come back to.
        else if (appState.currentView === 'play-emoji') {
            if (typeof restoreEmoji !== 'function' || !restoreEmoji()) setTimeout(() => setView('setup-emoji'), 50);
        }
        else if (appState.currentView === 'play-proverbs') {
            if (typeof restoreProverbs !== 'function' || !restoreProverbs()) setTimeout(() => setView('setup-proverbs'), 50);
        }
        else if (appState.currentView === 'play-fiveseconds') {
            if (typeof restoreFiveSeconds !== 'function' || !restoreFiveSeconds()) setTimeout(() => setView('setup-fiveseconds'), 50);
        }
        else if (appState.currentView === 'play-bomb') {
            if (typeof restoreBomb !== 'function' || !restoreBomb()) setTimeout(() => setView('setup-bomb'), 50);
        }
        else if (appState.currentView === 'play-stop') {
            if (typeof restoreStop !== 'function' || !restoreStop()) setTimeout(() => setView('setup-stop'), 50);
        }
        else if (appState.currentView === 'play-memory') {
            if (typeof restoreMemory !== 'function' || !restoreMemory()) setTimeout(() => setView('setup-memory'), 50);
        }
        else if (appState.currentView === 'play-xo') {
            if (typeof restoreXO !== 'function' || !restoreXO()) setTimeout(() => setView('setup-xo'), 50);
        }
        // No game to keep: the chooser just needs its stage wired up again.
        // The solo games register their own boards (JS_Solo.html).
        else if (typeof soloRestoreView === 'function' && soloRestoreView(appState.currentView)) { /* redrawn */ }
        else if (appState.currentView === 'play-chooser') {
            setTimeout(() => { if (typeof openChooser === 'function') openChooser(); }, 0);
        }
        else if (appState.currentView === 'setup-daily-archive' && typeof renderDailyArchive === 'function') {
            renderDailyArchive();
        }
        else if (appState.currentView === 'setup-stats' && typeof renderStats === 'function') {
            renderStats();
        }
        // 👆 END PROTECTIONS 👆
        else if (appState.currentView.startsWith('setup-')) {
            const listId = appState.currentView.replace('setup-', '') + '-player-list';
            if(typeof renderActiveChips === 'function') renderActiveChips(listId, true);
            paintSetupOptions(appState.currentView);
            if(appState.currentView === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
            if(appState.currentView === 'setup-chameleon' && typeof renderChameleonCategories === 'function') renderChameleonCategories();
            
            if(appState.currentView === 'setup-charades' && typeof renderCharadesDropdown === 'function') {
                renderCharadesDropdown(); 
            }
        }
        
        const meta = VIEW_META[appState.currentView];
        if (meta && meta.accent) viewEl.setAttribute('data-accent', meta.accent);
        viewEl.classList.remove('hidden');
        syncChrome(appState.currentView);
    } else {
        const menuEl = document.getElementById('view-menu');
        if (menuEl) {
            menuEl.classList.remove('hidden');
            appState.currentView = 'menu';
            syncChrome('menu');
        }
    }
  }

  // Depth is what makes the slide directional: deeper = forward, shallower = back.
  function viewDepth(viewId) {
    let depth = 0;
    let cursor = viewId;
    while (cursor && VIEW_META[cursor] && VIEW_META[cursor].up && depth < 8) {
      cursor = VIEW_META[cursor].up;
      depth++;
    }
    return depth;
  }

  let titleSwapTimer = null;
  let pendingTitle = '';

  /** Header title, back button and nav state for the view now on screen. */
  function syncChrome(viewId) {
    const meta = VIEW_META[viewId] || {};
    const t = TRANSLATIONS[appState.lang];
    const titleEl = document.getElementById('app-title');
    const backEl = document.getElementById('nav-back');
    const homeEl = document.getElementById('nav-home');

    if (titleEl) {
      const text = (meta.title && t[meta.title]) || t.title;
      const textEl = document.getElementById('app-title-text') || titleEl;
      // The brand mark sits beside the name on the home screen only.
      titleEl.classList.toggle('shell__title--brand', viewId === 'menu');
      // textContent, not innerText: innerText forces a layout mid-setView.
      if (textEl.textContent !== text) {
        // Cross-fade rather than snapping the text. One timer, so navigating
        // twice in quick succession can't land the writes out of order.
        pendingTitle = text;
        titleEl.classList.add('is-swapping');
        clearTimeout(titleSwapTimer);
        titleSwapTimer = setTimeout(() => {
          textEl.textContent = pendingTitle;
          titleEl.classList.remove('is-swapping');
        }, 110);
      }
    }
    if (backEl) backEl.classList.toggle('is-hidden', !meta.up);
    const tab = navTabFor(viewId);
    ['home', 'together', 'tools'].forEach(name => {
      const el = document.getElementById('nav-' + name);
      if (el) el.classList.toggle('is-active', name === tab);
    });
    // The screen's own icon beside its name; the home shows the mark instead.
    const iconEl = document.getElementById('app-title-icon');
    const icon = viewId === 'menu' ? '' : screenIcon(viewId);
    if (iconEl && iconEl._icon !== icon) { iconEl._icon = icon; iconEl.innerHTML = iconHtml(icon); }
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
  }

  /** Which bottom tab a screen sits under: the rooms, the tools, or the games. */
  function navTabFor(viewId) {
    const id = String(viewId || '');
    if (id === 'together' || id.indexOf('room-') === 0 || id === 'setup-codenames') return 'together';
    if (id === 'tools') return 'tools';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[id] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry && entry.group === 'tools' ? 'tools' : 'home';
  }

  /** The emoji for a screen, from its help entry - every screen has one. */
  function screenIcon(viewId) {
    if (viewId === 'together') return '📲';
    if (viewId === 'tools') return '🛠️';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[viewId] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry ? entry.icon : '';
  }

   * colours and no ids, so a page can hold it any number of times. Anything that
