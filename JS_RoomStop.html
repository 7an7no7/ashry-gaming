<script>
/* ============================================================================
   أتوبيس كومبليت — ON SEPARATE PHONES
   ----------------------------------------------------------------------------
   The letter is on every phone, each player types an answer per category,
   and the first to press وقف closes the round for the table. The server then
   compares the answers (RoomGames.js: 10 unique, 5 shared, 0 blank or wrong
   initial) and the host corrects any cell before the points are banked.

   The one thing to get right here: a phone that has not submitted yet must
   send what it has typed the moment the round closes, before its screen is
   redrawn - the inputs are gone once the frame is rebuilt.

   وقف waits for a full sheet: every box a word starting with the letter
   (stopAnswerFits in StopWords.js, the server's own rule), each box going green
   as it fills, and the count of what's left under the button. The review marks
   what the dictionary didn't know (❓, 0 until the host taps it) apart from
   what it did (✓).
   ========================================================================= */

const stopRoom = {
  sentFor: '', clock: null, clockKey: null, fired: false, letterKey: '',
  draft: { key: '', answers: {} }   // what this phone typed this round, kept outside the screen
};

/** The round a sheet belongs to: the deal id when the server sends one, so a restarted game never matches an old round. */
const stopRoundKey = (state) => roomDealKey(state, state && state.shared ? state.shared.round : '');

/** The answer boxes on screen for this round only: a hidden screen can still hold last round's. */
function stopRoomInputs(key) {
  const form = document.querySelector('#view-room-stop .stop-room-form');
  return form && form.dataset.key === key ? [...form.querySelectorAll('.stop-room-input')] : [];
}
const STOP_ROOM_OPTS_KEY = 'ashryStopRoomOpts';

/** The host's options, remembered on this phone between evenings. */
function stopRoomOpts() {
  const base = { cats: STOP_DEFAULT_CATS.slice(), timer: 90, rounds: 5 };
  try {
    const saved = JSON.parse(localStorage.getItem(STOP_ROOM_OPTS_KEY) || 'null');
    if (saved && Array.isArray(saved.cats) && saved.cats.length >= 2) base.cats = saved.cats;
    if (saved && [60, 90, 120, 0].indexOf(saved.timer) !== -1) base.timer = saved.timer;
    if (saved && [3, 5, 7, 10].indexOf(saved.rounds) !== -1) base.rounds = saved.rounds;
  } catch (e) {}
  return base;
}

function setStopRoomOpt(key, value) {
  const o = stopRoomOpts();
  if (key === 'cat') {
    const on = o.cats.indexOf(value) !== -1;
    if (on && o.cats.length <= 2) { showToast(TRANSLATIONS[appState.lang].stop_min_cats || '', 'warn'); return; }
    o.cats = on ? o.cats.filter(c => c !== value) : STOP_CATEGORIES.map(c => c.id).filter(c => c === value || o.cats.indexOf(c) !== -1);
  } else {
    o[key] = Number(value);
  }
  try { localStorage.setItem(STOP_ROOM_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  // The lobby only rewrites its options when they change; make it.
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

ROOM_GAMES.stop = {
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang];
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(t.stop_room_hint || '')}</p>`;
    const o = stopRoomOpts();
    const seg = (id, values, current, labelOf) => `
      <div class="segmented" role="group">
        ${values.map(v => `<button type="button" class="segmented__item ${v === current ? 'is-active' : ''}"
            onclick="setStopRoomOpt('${id}', ${v})">${labelOf(v)}</button>`).join('')}
      </div>`;
    return `
      <div class="card card--tight">
        <div class="field">
          <label class="field__label">${escapeHTML(t.stop_cats_label || '')}</label>
          <div class="chip-set">
            ${STOP_CATEGORIES.map(c => `
              <button type="button" class="opt-chip ${o.cats.indexOf(c.id) !== -1 ? 'is-active' : ''}"
                      onclick="setStopRoomOpt('cat', '${c.id}')"><span aria-hidden="true">${c.icon}</span>${escapeHTML(stopCatLabel(c.id))}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label class="field__label">${escapeHTML(t.stop_timer_label || '')}</label>
          ${seg('timer', [60, 90, 120, 0], o.timer, v => v === 0 ? escapeHTML(t.stop_no_timer || '') : v)}
        </div>
        <div class="field">
          <label class="field__label">${escapeHTML(t.stop_rounds_label || '')}</label>
          ${seg('rounds', [3, 5, 7, 10], o.rounds, v => v)}
        </div>
        <p class="field__hint" style="text-align:center">${escapeHTML(t.stop_room_hint || '')}</p>
      </div>`;
  },

  startPayload() {
    const o = stopRoomOpts();
    return { cats: o.cats, timer: o.timer, rounds: o.rounds, lang: VOTE_LANG() };
  },

  render(state) {
    if (appState.currentView !== 'room-stop') setView('room-stop');
    const el = document.getElementById('view-room-stop');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const roundKey = stopRoundKey(state);
    const inRound = (s.roster || []).indexOf(Room.me) !== -1;
    const iSubmitted = (s.submitted || []).indexOf(Room.me) !== -1;

    // The round closing under this phone is sent by the listener below, from
    // what was typed (stopRoom.draft), even when this screen isn't showing.

    const sig = ['stop', s.phase, s.round, s.letter, iSubmitted, state.youAreHost, appState.lang,
                 iSubmitted || s.phase !== 'writing' ? (s.submitted || []).length : '',
                 s.phase === 'review' ? JSON.stringify(s.roundTotals) + JSON.stringify(s.results) : '',
                 s.phase === 'done' ? JSON.stringify(s.board) : ''].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => stopRoomFrame(state, t, inRound, iSubmitted));
    if (rebuilt && s.phase === 'done' && typeof confetti === 'function') afterReveal(el, () => confetti({ particleCount: 160, spread: 80 }));
    // A new letter spins in, with a cue when it lands, so a table looking at its papers looks up.
    if (s.phase === 'writing' && stopRoom.letterKey !== roundKey) {
      stopRoom.letterKey = roundKey;
      spinLetter(el.querySelector('.stop-letter'), s.letter, stopLetterPool(s.letter), () => { playRoomFx('success'); haptic('light'); });
    }
    refreshRoomPlayerStrip(el, state);

    if (s.phase === 'writing' && s.endsAt) startStopRoomClock(s); else stopStopRoomClock();
    if (rebuilt && s.phase === 'writing' && !iSubmitted) {
      // A rebuild mid-round (a new host, the language) puts back what was typed.
      if (stopRoom.draft.key === roundKey) {
        el.querySelectorAll('.stop-room-input').forEach(inp => {
          const v = stopRoom.draft.answers[inp.dataset.cat];
          if (v) inp.value = v;
        });
      }
      stopRoomTyped();
      const first = el.querySelector('.stop-room-input');
      if (first && window.innerWidth >= 900) first.focus();
    }
  }
};

function stopRoomFrame(state, t, inRound, iSubmitted) {
  const s = state.shared;
  const present = state.players.map(p => p.id);
  const expected = (s.roster || []).filter(id => present.indexOf(id) !== -1).length;
  const done = (s.submitted || []).filter(id => present.indexOf(id) !== -1).length;
  const nameOf = (id) => { const p = state.players.find(x => x.id === id); return p ? p.name : '…'; };
  const head = `
    <div class="play-head">
      <span class="badge">${escapeHTML(t.round || '')} <span class="metric">${s.round}</span> / <span class="metric">${s.rounds}</span></span>
      ${s.phase === 'writing' && s.endsAt ? `<span id="stop-room-timer" class="badge badge--accent metric">${Math.max(0, Math.ceil((s.endsAt - Date.now()) / 1000))}</span>` : ''}
      ${s.phase === 'writing' && !s.endsAt ? `<span class="badge">${escapeHTML(t.stop_no_timer || '')}</span>` : ''}
    </div>`;
  const letterCard = (hint) => `
    <div class="stop-letter-card">
      <div class="eyebrow">${escapeHTML(t.stop_letter || '')}</div>
      <div class="stop-letter">${escapeHTML(s.letter)}</div>
      ${hint ? `<p class="field__hint">${escapeHTML(hint)}</p>` : ''}
    </div>`;

  if (s.phase === 'writing' || s.phase === 'collecting') {
    if (!inRound) return head + letterCard('') + `<div class="waiting-note">${escapeHTML(t.vote_spectating || '')}</div>` + renderRoomPlayerStrip(state);
    if (s.phase === 'collecting' || iSubmitted) {
      return head + letterCard('') + `
        <div class="card" style="text-align:center">
          ${s.phase === 'collecting'
            ? `<div class="waiting-note"><span class="animate-pulse">⏳</span> ${escapeHTML(t.stop_room_collecting || '')}</div>
               ${s.stopperName ? `<p class="field__hint">✋ ${escapeHTML(s.stopperName)} ${escapeHTML(t.stop_room_stopped_by || '')}</p>` : ''}`
            : `<div class="waiting-note"><span class="animate-pulse">✍️</span> ${escapeHTML(t.waiting_others || '')} (${done}/${expected})</div>`}
        </div>` + renderRoomPlayerStrip(state);
    }
    return head + letterCard(t.stop_room_write_hint || '') + `
      <div class="card card--tight stop-room-form" data-key="${escapeHTML(stopRoundKey(state))}">
        ${s.cats.map((c, i) => `
          <div class="field stop-field">
            <label class="field__label" for="stop-in-${c}">${escapeHTML(stopCatLabel(c))}</label>
            <input type="text" id="stop-in-${c}" class="stop-room-input" data-cat="${c}" maxlength="30" autocomplete="off"
                   autocapitalize="off" spellcheck="false" enterkeyhint="${i === s.cats.length - 1 ? 'done' : 'next'}"
                   oninput="stopRoomTyped()" onkeydown="stopRoomKey(event, ${i})">
          </div>`).join('')}
        <button type="button" id="stop-room-stop" class="btn btn--danger btn--lg is-locked" aria-disabled="true" onclick="submitStopRoom(true)">${escapeHTML(t.stop_stop_btn || '')}</button>
        <p id="stop-room-gate" class="field__hint" style="text-align:center">${escapeHTML(t.stop_room_stop_hint || '')}</p>
      </div>` + renderRoomPlayerStrip(state);
  }

  if (s.phase === 'review') {
    const last = s.round >= s.rounds;
    return head + `
      <div class="card card--tight">
        <div class="card__title">${escapeHTML(t.stop_scoring || '')} · <span class="metric">${escapeHTML(s.letter)}</span></div>
        ${s.stopperName ? `<p class="card__subtitle">✋ ${escapeHTML(s.stopperName)} ${escapeHTML(t.stop_room_stopped_by || '')}</p>` : ''}
        <p class="field__hint" style="text-align:center">${escapeHTML(state.youAreHost ? (t.stop_room_adjust_hint || '') : (t.stop_room_review_hint || ''))}</p>
        ${stopUnknownCount(s) ? `<p class="field__hint stop-check-hint">❓ ${escapeHTML((state.youAreHost ? t.stop_room_check_host : t.stop_room_check_wait) || '')}</p>` : ''}
        ${stopReviewTable(state, t, state.youAreHost)}
      </div>
      ${s.round > 1 ? renderScoreboard(s.board) : ''}
      ${state.youAreHost
        ? `<div class="btn-stack">
             <button class="btn btn--primary btn--lg" onclick="roomAct('nextRound')">${escapeHTML(last ? (t.stop_finish || '') : (t.stop_next_letter || ''))}</button>
           </div>`
        : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
      ${renderRoomPlayerStrip(state)}`;
  }

  // done
  const board = s.board || [];
  const best = board.length ? board[0].score : 0;
  const champs = board.filter(p => best > 0 && p.score === best).map(p => escapeHTML(p.name));
  return `
    <div class="card card--accent" style="text-align:center">
      <div class="eyebrow">${escapeHTML(t.stop_finish || '')}</div>
      ${renderPodium(state, board) || `<div class="metric metric--md metric--accent">🏆 ${champs.join(' · ') || '—'}</div>`}
    </div>
    ${renderScoreboard(board)}
    ${state.youAreHost
      ? `<div class="btn-stack">
           <button class="btn btn--primary btn--lg" onclick="roomAct('playAgain')">${escapeHTML(t.play_again || '')}</button>
           <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button>
         </div>`
      : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
    ${renderRoomPlayerStrip(state)}`;
}

/** The scored round as a table; the host's cells are buttons that cycle 10 → 5 → 0. */
function stopReviewTable(state, t, canAdjust) {
  const s = state.shared;
  const roster = (s.roster || []).filter(id => s.results && s.results[id]);
  const nameOf = (id) => { const p = state.players.find(x => x.id === id); return p ? p.name : '…'; };
  const cell = (pid, c) => {
    const r = s.results[pid][c];
    const cls = r.pts === 10 ? 'is-10' : r.pts === 5 ? 'is-5' : '';
    // ✓ the dictionary knew it (or two players wrote it); ❓ it didn't, and the host hasn't decided.
    const check = r.ok && r.word === 'unknown' && !r.manual;
    const mark = check ? '❓' : (r.ok && (r.word === 'known' || r.word === 'shared') ? '✓' : '');
    const inner = `<span class="stop-ans ${r.ok ? '' : 'is-bad'}">${escapeHTML(r.text || '—')}</span>`
      + `<span class="stop-cell-foot">${mark ? `<span class="stop-mark ${check ? 'is-check' : 'is-ok'}" aria-hidden="true">${mark}</span>` : ''}<span class="stop-pts ${cls}">${r.pts}</span></span>`;
    const state2 = (r.manual ? ' is-manual' : '') + (check ? ' is-check' : '');
    return canAdjust
      ? `<button type="button" class="stop-rcell${state2}" onclick="adjustStopRoom('${jsStringAttr(pid)}', '${c}', ${r.pts})">${inner}</button>`
      : `<div class="stop-rcell${state2}">${inner}</div>`;
  };
  return `
    <div class="stop-table-wrap">
      <table class="stop-table">
        <thead><tr>
          <th class="stop-th stop-th--name">${escapeHTML(t.players || '')}</th>
          ${s.cats.map(c => `<th class="stop-th">${escapeHTML(stopCatLabel(c))}</th>`).join('')}
          <th class="stop-th">Σ</th>
        </tr></thead>
        <tbody>
          ${roster.map(pid => `
            <tr class="${pid === Room.me ? 'is-me' : ''}">
              <td class="stop-td stop-td--name">${escapeHTML(nameOf(pid))}</td>
              ${s.cats.map(c => `<td class="stop-td">${cell(pid, c)}</td>`).join('')}
              <td class="stop-td"><b class="metric">${s.roundTotals[pid] || 0}</b></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="stop-legend">
      <span><span class="stop-dot is-10"></span> 10 ${escapeHTML(t.stop_pts_unique || '')}</span>
      <span><span class="stop-dot is-5"></span> 5 ${escapeHTML(t.stop_pts_shared || '')}</span>
      <span><span class="stop-dot"></span> 0 ${escapeHTML(t.stop_pts_none || '')}</span>
      <span><span class="stop-mark is-check">❓</span> ${escapeHTML(t.stop_pts_check || '')}</span>
    </div>`;
}

/** How many answers the dictionary didn't know and the host hasn't decided on. */
function stopUnknownCount(s) {
  let n = 0;
  Object.values(s.results || {}).forEach(row => Object.values(row || {}).forEach(r => {
    if (r && r.ok && r.word === 'unknown' && !r.manual) n++;
  }));
  return n;
}

/**
 * Paints each box as it fills (green: a word on the letter; red: a word that
 * isn't) and unlocks وقف once every box is green. Returns how many are left.
 */
function stopRoomTyped() {
  const s = Room.state && Room.state.shared;
  if (!s) return 0;
  const t = TRANSLATIONS[appState.lang];
  const letter = foldStopAnswer(s.letter, s.lang);
  let left = 0;
  let firstLeft = null;
  const key = stopRoundKey(Room.state);
  if (stopRoom.draft.key !== key) stopRoom.draft = { key: key, answers: {} };
  stopRoomInputs(key).forEach(inp => {
    stopRoom.draft.answers[inp.dataset.cat] = inp.value;
    const fits = stopAnswerFits(inp.value, s.lang, s.letter);
    const f = foldStopAnswer(inp.value, s.lang, letter);
    // Still typing the article ("ا", "ال", "الم") is not a mistake yet.
    const typingArticle = s.lang === 'ar' && /^ال?.?$/.test(f) && f.indexOf('ا') === 0 && letter !== 'ا';
    const field = inp.closest('.field');
    if (field) {
      field.classList.toggle('is-ok', fits);
      field.classList.toggle('is-bad', !fits && f.length >= 1 && f.charAt(0) !== letter && !typingArticle);
    }
    if (!fits) { left++; if (!firstLeft) firstLeft = inp; }
  });
  const btn = document.getElementById('stop-room-stop');
  if (btn) {
    btn.classList.toggle('is-locked', left > 0);
    btn.setAttribute('aria-disabled', String(left > 0));
  }
  const gate = document.getElementById('stop-room-gate');
  if (gate) {
    gate.textContent = left > 0
      ? (t[left === 1 ? 'stop_room_left_1' : left === 2 ? 'stop_room_left_2' : 'stop_room_left'] || '').replace('{n}', left).replace('{letter}', s.letter)
      : (t.stop_room_stop_hint || '');
    gate.classList.toggle('is-ready', left === 0);
  }
  stopRoom.firstLeft = firstLeft;
  return left;
}

/** Enter moves down the list; on the last box it is وقف. */
function stopRoomKey(event, index) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const inputs = [...document.querySelectorAll('#view-room-stop .stop-room-input')];
  if (index < inputs.length - 1) inputs[index + 1].focus();
  else submitStopRoom(true);
}

/** Sends what is typed; with `stop`, closes the round for everyone. */
function submitStopRoom(stop) {
  const s = Room.state && Room.state.shared;
  if (!s || Room.state.game !== 'stop' || (s.phase !== 'writing' && s.phase !== 'collecting')) return;
  const roundKey = stopRoundKey(Room.state);
  if (stopRoom.sentFor === roundKey) return;
  // وقف needs a full sheet; the clock and someone else's وقف send whatever is there.
  if (stop && s.phase === 'writing' && stopRoomTyped() > 0) {
    const t = TRANSLATIONS[appState.lang];
    showToast((t.stop_room_fill_all || '').replace('{letter}', s.letter), 'error');
    haptic('heavy');
    if (stopRoom.firstLeft) stopRoom.firstLeft.focus();
    return;
  }
  // The boxes when they are on screen, else what was typed into them before
  // the round closed (the screen may be rebuilt, or not showing at all).
  const answers = stopRoom.draft.key === roundKey ? Object.assign({}, stopRoom.draft.answers) : {};
  stopRoomInputs(roundKey).forEach(inp => { answers[inp.dataset.cat] = inp.value; });
  stopRoom.sentFor = roundKey;
  if (stop) { playRoomFx('alarm'); haptic('medium'); }
  const payload = { answers: answers, stop: !!stop };
  if (typeof s.round === 'number') payload.round = s.round;
  Room.act('submit', payload).catch(err => {
    stopRoom.sentFor = '';
    showToast(err.message || 'تعذر الإرسال', 'error');
  });
}

/** The host taps a cell: 10 → 5 → 0 → 10. */
function adjustStopRoom(pid, cat, current) {
  const next = current === 10 ? 5 : current === 5 ? 0 : 10;
  haptic('light');
  roomAct('adjust', { playerId: pid, cat: cat, pts: next });
}

function paintStopRoomTimer(endsAt) {
  const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  const el = document.getElementById('stop-room-timer');
  if (el) { el.textContent = left; el.classList.toggle('badge--danger', left <= 10); el.classList.toggle('badge--accent', left > 10); }
  const big = document.getElementById('tv-stop-timer');
  if (big) { big.textContent = left; big.classList.toggle('is-low', left <= 10); }
  return left;
}

function startStopRoomClock(s) {
  paintStopRoomTimer(s.endsAt);
  if (stopRoom.clockKey === s.endsAt && (stopRoom.clock ? stopRoom.clock.isRunning() : stopRoom.fired)) return;
  stopStopRoomClock();
  stopRoom.clockKey = s.endsAt;
  const endsAt = s.endsAt;
  stopRoom.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)),
    onTick: () => { const left = paintStopRoomTimer(endsAt); if (left > 0 && left <= 5) playRoomFx('tick'); },
    onEnd: () => {
      stopRoom.clock = null;
      stopRoom.fired = true;
      const st = Room.state;
      if (!st || st.game !== 'stop' || st.shared.phase !== 'writing' || st.shared.endsAt !== endsAt) return;
      // Everyone sends their sheet as the clock hits zero; the host also closes
      // the round, and the server does the same a moment later regardless.
      if ((st.shared.roster || []).indexOf(Room.me) !== -1 && (st.shared.submitted || []).indexOf(Room.me) === -1) submitStopRoom(false);
      if (Room.isHost) setTimeout(() => Room.act('timeUp').catch(() => {}), 300);
    }
  });
}

function stopStopRoomClock() {
  if (stopRoom.clock) stopRoom.clock.stop();
  stopRoom.clock = null;
  stopRoom.clockKey = null;
  stopRoom.fired = false;
}
onRoomClocksReset(stopStopRoomClock);

// Someone pressed وقف, or the clock ran out: this phone sends its sheet now,
// wherever its player is looking - the menu, the rules, the chat.
Room.onChange((state) => {
  const s = state && state.game === 'stop' && state.shared;
  if (!s || s.phase !== 'collecting') return;
  if ((s.roster || []).indexOf(Room.me) === -1 || (s.submitted || []).indexOf(Room.me) !== -1) return;
  if (stopRoom.sentFor === stopRoundKey(state)) return;
  submitStopRoom(false);
});
</script>
