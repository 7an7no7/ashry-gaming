<script>
/* ============================================================================
   TEAM RELAY — two teams take turns with one phone
   ----------------------------------------------------------------------------
   بدون كلام and أوصف لي were one timed round for one player. Team mode wraps
   that round: the phone names whose team is up, the round runs as it always
   did, the words guessed are that team's points, and the phone is handed to
   the other team. After the chosen number of turns each, a final board.

   The relay lives in the game's own slice of appState (`store.relay`), so
   the tally survives a trip to the menu. A round in progress does not (it
   never did): a reload lands on the setup screen.

   A match left unfinished is neither carried on nor thrown away without a
   word: the setup screen shows it with a "continue" button (paintRelaySetup
   with a resume function), and Start in team mode asks before starting a new
   one (relayBegin), which takes the names and turns the setup shows now. A
   single-player round leaves the match alone: the relay only drives a round
   while team mode is on (relayPlaying).
   ========================================================================= */

/**
 * "3 / 5" held left to right. With spaces round the slash, an Arabic line
 * lays the two numbers out right to left and shows "5 / 3" (the numbers are
 * separate runs; only a bare "3/5" stays together). Used by the party games'
 * turn and round counters.
 */
/** A strip of small pill chips over a play screen: a word, then its number. */
function playChipsHtml(items) {
  return '<div class="play-chips">' + items.map((it) =>
    '<span class="chip ' + (it.plain ? 'chip--plain ' : '') + 'play-chip">' + (it.label ? '<span>' + escapeHTML(it.label) + '</span> ' : '') +
    '<b class="metric">' + it.value + '</b></span>').join('') + '</div>';
}

function ltrFrac(a, b) { return String.fromCharCode(0x2066) + a + ' / ' + b + String.fromCharCode(0x2069); }

function relayStart(store, names, turns) {
  store.relay = { names: [names[0], names[1]], turns: turns, i: 0, scores: [0, 0], last: null, phase: 'handover' };
  if (typeof saveToLocal === 'function') saveToLocal();
}

const relayActive = (store) => !!(store && store.relay && store.relay.phase !== 'done');
const relayTeam = (store) => store.relay.i % 2;
/** A match with a turn played and turns still to play. */
const relayInProgress = (store) => relayActive(store) && store.relay.i > 0;
/** The relay drives this round: team mode is on and its match isn't over. */
const relayPlaying = (store) => relayOptsOf(store).mode === 'teams' && relayActive(store);

/** Team mode's Start: `fresh` at once, or after asking when a match is still going. */
function relayBegin(store, t, fresh) {
  if (!relayInProgress(store)) { fresh(); return; }
  showConfirmModal((t || {}).relay_new_confirm || 'فيه مباراة لسه ما خلصتش. تبدأ مباراة جديدة بالأسماء دي وتسيبها؟', fresh);
}

/** The card between turns: whose turn, hand the phone over, the score so far. */
function relayHandoverHtml(store, t, startFn) {
  const r = store.relay;
  const team = relayTeam(store);
  const turnNo = Math.floor(r.i / 2) + 1;
  return `
    <div class="relay">
      ${relayScoresHtml(store, team)}
      <div class="relay__pass">
        <div class="eyebrow">${escapeHTML(t.relay_turn_of || '')} · ${ltrFrac(turnNo, r.turns)}</div>
        <div class="relay__team relay__team--${team}">${escapeHTML(r.names[team])}</div>
        <p class="field__hint">📱 ${escapeHTML(t.relay_pass_to || '')}</p>
      </div>
      <button type="button" class="btn btn--primary btn--go btn--lg" onclick="${startFn}">${escapeHTML(t.relay_start_turn || '')}</button>
    </div>`;
}

/** After a turn: what this team scored, whose turn is next, and the button that starts it. */
function relayTurnDone(store, points) {
  const r = store.relay;
  const team = relayTeam(store);
  r.scores[team] += points;
  r.last = { team: team, points: points };
  r.i += 1;
  r.phase = r.i >= r.turns * 2 ? 'done' : 'handover';
  if (typeof saveToLocal === 'function') saveToLocal();
  return r.phase;
}

function relaySummaryHtml(store, t, nextFn, exitFn) {
  const r = store.relay;
  const last = r.last || { team: 0, points: 0 };
  if (r.phase === 'done') {
    const [a, b] = r.scores;
    const title = a === b ? (t.relay_tie || '') : `🏆 ${r.names[a > b ? 0 : 1]}`;
    return `
      <div class="relay">
        <div class="relay__result">
          <div class="eyebrow">${escapeHTML(t.relay_final || '')}</div>
          <div class="metric metric--md metric--accent">${escapeHTML(title)}</div>
        </div>
        ${relayScoresHtml(store, -1)}
        <button type="button" class="btn btn--primary btn--go btn--lg" onclick="${nextFn}">${escapeHTML(t.play_again || '')}</button>
        <button type="button" class="btn btn--ghost" onclick="${exitFn}">${escapeHTML(t.exit || '')}</button>
      </div>`;
  }
  const team = relayTeam(store);
  const turnNo = Math.floor(r.i / 2) + 1;
  return `
    <div class="relay">
      <div class="relay__result relay__result--last">
        <div class="eyebrow">${escapeHTML(t.relay_turn_done || '')} · ${escapeHTML(r.names[last.team])}</div>
        <div class="metric metric--md tx-success">+${last.points}</div>
      </div>
      ${relayScoresHtml(store, team)}
      <div class="relay__pass">
        <div class="eyebrow">${escapeHTML(t.relay_turn_of || '')} · ${ltrFrac(turnNo, r.turns)}</div>
        <div class="relay__team relay__team--${team}">${escapeHTML(r.names[team])}</div>
        <p class="field__hint">📱 ${escapeHTML(t.relay_pass_to || '')}</p>
      </div>
      <button type="button" class="btn btn--primary btn--go btn--lg" onclick="${nextFn}">${escapeHTML(t.relay_start_turn || '')}</button>
      <button type="button" class="btn btn--ghost btn--sm" onclick="${exitFn}">${escapeHTML(t.exit || '')}</button>
    </div>`;
}

function relayScoresHtml(store, activeTeam) {
  const r = store.relay;
  return `
    <div class="relay__scores">
      ${[0, 1].map(i => `
        <div class="relay__score relay__score--${i} ${activeTeam === i ? 'is-turn' : ''}">
          <span class="relay__score-name">${escapeHTML(r.names[i])}</span>
          <b class="metric">${r.scores[i]}</b>
        </div>`).join('')}
    </div>`;
}

/* --- the switch on a setup screen ------------------------------------------- */

/** Options saved per game: mode ('single' | 'teams'), the two names, turns each. */
function relayOptsOf(store) {
  if (!store.teamOpts) store.teamOpts = { mode: 'single', names: ['', ''], turns: 3 };
  return store.teamOpts;
}

function relayNames(store, t) {
  const o = relayOptsOf(store);
  return [o.names[0] || t.tb_team_a || 'A', o.names[1] || t.tb_team_b || 'B'];
}

/**
 * Paints the mode switch, the team fields and the turns picker for a game
 * prefix; with `resumeFn`, also the unfinished match and its "continue"
 * button, at the end of the team options.
 */
function paintRelaySetup(prefix, store, resumeFn) {
  const o = relayOptsOf(store);
  document.querySelectorAll(`#${prefix}-mode .segmented__item`).forEach(b => b.classList.toggle('is-active', b.dataset.value === o.mode));
  const box = document.getElementById(`${prefix}-team-opts`);
  if (box) box.classList.toggle('hidden', o.mode !== 'teams');
  const a = document.getElementById(`${prefix}-team-a`), b = document.getElementById(`${prefix}-team-b`);
  if (a && document.activeElement !== a) a.value = o.names[0] || '';
  if (b && document.activeElement !== b) b.value = o.names[1] || '';
  document.querySelectorAll(`#${prefix}-turns .segmented__item`).forEach(el => el.classList.toggle('is-active', Number(el.dataset.value) === o.turns));
  if (resumeFn && box) paintRelayResume(prefix, store, resumeFn, box);
}

function paintRelayResume(prefix, store, resumeFn, box) {
  let resume = document.getElementById(`${prefix}-relay-resume`);
  if (!resume) {
    resume = document.createElement('div');
    resume.id = `${prefix}-relay-resume`;
    resume.className = 'field';
    box.appendChild(resume);
  }
  if (!relayInProgress(store)) {
    resume.classList.add('hidden');
    resume.innerHTML = '';
    return;
  }
  const t = TRANSLATIONS[appState.lang] || {};
  const r = store.relay;
  resume.classList.remove('hidden');
  resume.innerHTML = `
    <label class="field__label">⏸️ ${escapeHTML(t.relay_unfinished || 'مباراة لسه ما خلصتش')} · ${ltrFrac(Math.floor(r.i / 2) + 1, r.turns)}</label>
    <div class="relay">
      ${relayScoresHtml(store, relayTeam(store))}
      <button type="button" class="btn btn--secondary" onclick="${resumeFn}">▶ ${escapeHTML(t.solo_continue || '')}</button>
    </div>`;
}

function setRelayMode(prefix, store, mode) {
  relayOptsOf(store).mode = mode;
  saveToLocal();
  paintRelaySetup(prefix, store);
  haptic('light');
}
function setRelayTurns(prefix, store, turns) {
  relayOptsOf(store).turns = Number(turns);
  saveToLocal();
  paintRelaySetup(prefix, store);
}
function setRelayName(store, index, value) {
  relayOptsOf(store).names[index] = String(value || '').trim().slice(0, 20);
  saveToLocal();
}

/* --- ideas batch: party1 - a turn's 3-2-1 and its list of cards ------------
   بدون كلام and أوصف لي borrowed على راسك's rhythm (JS_HeadsUp.html): the
   clock waits for a 3-2-1 on the card, and at the end of a turn every card of
   it is listed, a tap flipping its verdict (right / skipped) with the score
   following. `cards` is [{ w, ok }], built from the turn's `judged` stack.
   ------------------------------------------------------------------------- */

let ptCountTimer = null;

/**
 * The 3-2-1 over the card: `host` is the playing box (it gets `is-counting`,
 * which hides the word and holds the buttons), `view` the screen it runs on.
 * It waits under Help or the exit sheet, as the clock would, and simply stops
 * when the screen is left. `onGo` deals the first card and starts the clock.
 */
function partyCountdown(view, host, onGo) {
  partyCountdownStop();
  if (!host) { onGo(); return; }
  host.classList.add('is-counting');
  const el = host.querySelector('.pt-count');
  let n = 3;
  const tick = () => {
    ptCountTimer = null;
    if (appState.currentView !== view || !host.classList.contains('is-counting')) return;
    if (document.querySelector('.modal-overlay:not(.hidden)')) { ptCountTimer = setTimeout(tick, 300); return; }
    if (n > 0) {
      if (el) {
        el.textContent = n;
        if (el.animate && !motionOff()) el.animate([{ transform: 'scale(1.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
      }
      playSound('tick');
      haptic('light');
      n--;
      ptCountTimer = setTimeout(tick, 900);
    } else {
      host.classList.remove('is-counting');
      playSound('success');
      onGo();
    }
  };
  tick();
}

function partyCountdownStop(host) {
  clearTimeout(ptCountTimer);
  ptCountTimer = null;
  document.querySelectorAll('.is-counting').forEach((el) => { if (!host || el === host) el.classList.remove('is-counting'); });
}

/** The turn's cards as tappable chips; `toggleFn` is the name of the game's toggle. */
function partyTurnListHtml(cards, t, toggleFn) {
  if (!cards.length) return `<p class="field__hint">${escapeHTML(t.pt_none || '')}</p>`;
  return `<p class="field__hint">${escapeHTML(t.pt_fix_hint || '')}</p>
    <div class="pt-cards">${cards.map((c, i) => partyTurnChipHtml(c, i, toggleFn)).join('')}</div>`;
}

function partyTurnChipHtml(c, i, toggleFn) {
  return `<button type="button" class="pt-chip${c.ok ? ' is-right' : ''}" data-pt="${i}" onclick="${toggleFn}(${i})" aria-pressed="${c.ok ? 'true' : 'false'}">` +
    `<span aria-hidden="true">${c.ok ? '✓' : '⏭'}</span> ${escapeHTML(c.w)}</button>`;
}

/** Flips one card's verdict in `sum` and repaints its chip and the score (`scoreId`). */
function partyTurnToggle(sum, i, toggleFn, scoreId) {
  if (!sum || !sum.cards[i]) return 0;
  const c = sum.cards[i];
  c.ok = !c.ok;
  const got = sum.cards.filter(x => x.ok).length;
  document.querySelectorAll(`[data-pt="${i}"]`).forEach((chip) => {
    chip.outerHTML = partyTurnChipHtml(c, i, toggleFn);
  });
  const score = document.getElementById(scoreId);
  if (score) { score.textContent = got; if (typeof motionBump === 'function') motionBump(score); }
  playSound(c.ok ? 'success' : 'click');
  haptic('light');
  return got;
}

/**
 * The end of a turn: the score, the list, then either the game's own buttons
 * (one player) or «احسب النقط» that banks it for the team (the relay).
 */
function partyTurnSummaryHtml(store, t, o) {
  const sum = store.sum;
  const got = sum.cards.filter(x => x.ok).length;
  const team = sum.relay && store.relay ? `<div class="eyebrow">${escapeHTML(t.relay_turn_done || '')} · ${escapeHTML(store.relay.names[relayTeam(store)])}</div>` : `<h2 class="card__title card__title--neutral">${escapeHTML(t.timeout_title || '')}</h2>`;
  const buttons = sum.relay
    ? `<button type="button" class="btn btn--primary btn--go btn--lg" onclick="${o.bankFn}">${escapeHTML(t.pt_save_turn || '')}</button>`
    : `<button type="button" class="btn btn--primary btn--go btn--lg" onclick="${o.againFn}">${escapeHTML(t.play_again || '')}</button>
       <button type="button" class="btn btn--ghost" onclick="${o.exitFn}">${escapeHTML(t[o.exitKey] || '')}</button>`;
  return `
    <div class="relay pt-sum">
      ${team}
      <div class="relay__result">
        <div class="eyebrow">${escapeHTML(t.correct_words || '')}</div>
        <div class="metric metric--xl tx-success" id="${o.scoreId}">${got}</div>
      </div>
      ${partyTurnListHtml(sum.cards, t, o.toggleFn)}
      ${buttons}
    </div>`;
}
</script>
