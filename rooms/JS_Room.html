    ${roomLobbySumHtml(state)}
    ${firstPlay}
    ${game && game.lobbyTop ? game.lobbyTop(state, false) : ''}
    ${bots}
    ${lobbyOptionsFold(state, options, t)}
    ${(game && game.lobbySeats) ? game.lobbySeats(state) : ''}`;
}

/* The host's options for the chosen game, folded under «⚙️ إعدادات اللعبة
   (محفوظة) ▾» with a line of what is chosen (the owner, 26 Sep 2026): they are
   remembered on the host's phone anyway, and every option above the Start was
   scrolled past before every game. Open by default only the first time this
   phone hosts the game; the games whose options are where the table is seated
   (sides, seats, colours) are never folded. Nothing is removed: a tap opens it. */
const LOBBY_OPTS_UNFOLDED = { codenames: 1, domino: 1, ludo: 1, snakes: 1, chess4: 1, handbrain: 1, votechess: 1, bank: 1 };
const lobbyOptsOpen = {};

function lobbyOptionsFold(state, options, t) {
  const g = ROOM_GAMES[state.game];
  if (!options || !state.youAreHost || LOBBY_OPTS_UNFOLDED[state.game] || (g && g.lobbyUnfolded && g.lobbyUnfolded(state))) return options;
  const seen = recallOptions('lobbyOptsSeen', {});
  const open = lobbyOptsOpen[state.game] !== undefined ? lobbyOptsOpen[state.game] : !seen[state.game];
  return `
    <details class="lobby-opts" ${open ? 'open' : ''} data-r="${open ? 1 : 0}" ontoggle="lobbyOptsToggled(this, '${jsStringAttr(state.game)}')">
      <summary class="lobby-opts__head">
        <span class="lobby-opts__title">⚙️ ${escapeHTML(t.room_opts_title || '')}</span>
        <span class="lobby-opts__sum"></span>
        <span class="lobby-opts__chev" aria-hidden="true">▾</span>
      </summary>
      <div class="lobby-opts__body">${options}</div>
    </details>`;
}

/* «⚙️ خيارات أكتر» inside a game's options (the owner's pick 1C, done for the lobbies on 8 Oct 2026, as
   الليزر had it): the options most tables change stay in view, the house rules fold with a line of what
   is on. Remembered per game for this page (lobbyOptsOpen[key]); summarised by lobbyOptsSummarise. */
function lobbyMoreHtml(key, inner) {
  if (!inner || !String(inner).trim()) return '';
  const t = TRANSLATIONS[appState.lang] || {};
  const open = !!lobbyOptsOpen[key];
  return `<details class="lobby-opts lobby-opts--more" ${open ? 'open' : ''} data-r="${open ? 1 : 0}" ontoggle="lobbyOptsToggled(this, '${jsStringAttr(key)}')">
      <summary class="lobby-opts__head">
        <span class="lobby-opts__title">⚙️ ${escapeHTML(t.setup_more || '')}</span>
        <span class="lobby-opts__sum"></span>
        <span class="lobby-opts__chev" aria-hidden="true">▾</span>
      </summary>
      <div class="lobby-opts__body">${inner}</div>
    </details>`;
}

function lobbyOptsToggled(el, game) {
  // A details drawn open fires its toggle too: only a tap on it is a choice.
  const now = el.open ? '1' : '0';
  if (el.dataset.r === now) return;
  el.dataset.r = now;
  lobbyOptsOpen[game] = !!el.open;
  if (el.open && typeof motionOff === 'function' && !motionOff()) {
    const body = el.querySelector('.lobby-opts__body');
    if (body && body.animate) body.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

/** The folded options' one line: what is picked in them, read off the controls themselves. */
function lobbyOptsSummarise(root) {
  (root || document).querySelectorAll('.lobby-opts').forEach(box => {
    const body = box.querySelector('.lobby-opts__body');
    const out = box.querySelector('.lobby-opts__sum');
    if (!body || !out) return;
    const bits = [];
    body.querySelectorAll('.segmented').forEach(seg => {
      const on = seg.querySelector('.segmented__item.is-active');
      if (on) bits.push(on.textContent.trim().replace(/\s+/g, ' '));
    });
    body.querySelectorAll('select').forEach(sel => {
      const o = sel.options[sel.selectedIndex];
      if (o) bits.push(o.textContent.trim().replace(/\s+/g, ' '));
    });
    body.querySelectorAll('.filter-chip.is-active, .chip.is-active, [data-sum-pick].is-active').forEach(c => bits.push(c.textContent.trim().replace(/\s+/g, ' ')));
    body.querySelectorAll('label.switch-row').forEach(row => {
      const input = row.querySelector('input[type=checkbox]');
      const label = row.querySelector('.switch-row__label, span');
      if (input && input.checked && label) bits.push(label.textContent.trim().replace(/\s+/g, ' '));
    });
    const text = bits.filter(Boolean).slice(0, 4).join(' · ');
    if (out.textContent !== text) out.textContent = text;
  });
}

/* Players see the host's choices (the ideas of 7 Oct 2026, 1283): the host's phone sends its folded
   line («٣ جولات · ٤٥ ثانية · سهل») to the room (room action lobbySum { game, text }, kept on the room
   for that game, state.lobbySum), and every other phone shows it read-only under the chosen game's
   card, so nobody asks «كام جولة؟». The line is in the host's language, as the host wrote it; a game
   whose options are never folded (sides, seats) sends none. */
const roomLobbySum = { sent: '', timer: 0 };
function roomLobbySumShare(state, root) {
  // Back in the hub: the next game chosen (the same one again too) starts with no line on the room.
  if (!state || !state.game) { roomLobbySum.sent = ''; return; }
  if (!state.youAreHost || state.youAreScreen || state.phase !== 'lobby') return;
  const out = root && root.querySelector('.lobby-opts:not(.lobby-opts--more) > summary .lobby-opts__sum');
  const text = out ? out.textContent.trim().slice(0, 120) : '';
  const key = state.code + '|' + state.game + '|' + text;
  if ((state.lobbySum || '') === text) { roomLobbySum.sent = key; return; }
  if (roomLobbySum.sent === key) return;
  clearTimeout(roomLobbySum.timer);
  const game = state.game;
  // A beat, so a host stepping through a list sends where they stopped, not every stop.
  roomLobbySum.timer = setTimeout(() => {
    const st = Room.state;
    if (!st || !st.youAreHost || st.phase !== 'lobby' || st.game !== game) return;
    roomLobbySum.sent = key;
    Room.act('lobbySum', { game: game, text: text }).catch(() => { roomLobbySum.sent = ''; });
  }, 500);
}
function roomLobbySumHtml(state) {
  const text = !state.youAreHost && state.phase === 'lobby' ? String(state.lobbySum || '') : '';
  return text ? `<p class="lobby-sum"><span aria-hidden="true">⚙️</span> <bdi>${escapeHTML(text)}</bdi></p>` : '';
}

/** The chunks a room needs: its game's, and every puzzle of a race's line-up (سباق ألغاز, «خماسي السهرة»). */
function roomChunksOf(state) {
  const ids = lzChunksOfRoom(state.game).slice();
  const s = state.shared || {};
  ((s.settings && s.settings.lineup) || s.lineup || []).forEach(g => lzChunksOfRoom(g).forEach(c => { if (ids.indexOf(c) === -1) ids.push(c); }));
  return ids;
}

/** A chunk the route waited for has come: draw the room only if this device didn't go elsewhere
    while it loaded (a screen always draws; a phone still on the screen it asked from - a room
    screen, or the home it pressed «ارجع للغرفة» on - goes on; one that went home meanwhile stays). */
let roomRouteFrom = null;
function roomRouteAgain() {
  const st = Room.state;
  if (st && (st.youAreScreen || onRoomView() || appState.currentView === roomRouteFrom)) routeRoomState(st);
}

/** Draws whatever the room is doing now: its lobby, a spectator note, or the game. */
function routeRoomState(state) {
  if (state && state.code && !state.youAreScreen) rememberLastRoom(state.code);
  // A game dealt in the room counts as played on this phone (the home's poster, D1).
  if (typeof markRoomPlayed === 'function') markRoomPlayed(state);
  roomRouteFrom = appState.currentView;
  if (state && state.game && typeof lzWait === 'function' &&
      lzWait(roomChunksOf(state), roomRouteAgain, 'route')) {
    roomLobbyEarly(state);
    return;
  }
  // برنامج السهرة (JS_RoomProgram.html, a chunk of its own): its code before anything of it is drawn.
  if (state && state.program && typeof lzWait === 'function' &&
      lzWait(['program'], roomRouteAgain, 'route-prog')) return;
  if (state && state.program && typeof progPaintPill === 'function') progPaintPill(state);
  // A big screen draws every phase itself (JS_RoomTv.html).
  if (state.youAreScreen) {
    renderRoomTv(state);
    return;
  }
  // This device was the big screen a moment ago. Its frame uses the same
  // element ids as the phone screens, so it goes before they are drawn.
  if (typeof clearRoomTvView === 'function') clearRoomTvView();
  // Between two games of the night's program, and its finale: the program's own screen.
  if (typeof progInterlude === 'function' && progInterlude(state)) {
    progRender(state);
    return;
  }
  if (state.phase === 'lobby') {
    if (appState.currentView !== 'room-lobby') setView('room-lobby');
    renderRoomLobby(state);
    return;
  }
  // Joined after this round was dealt: watch, don't break the game. A game
  // whose latecomers simply join the line (the duels: winner stays on) draws
  // them itself.
  if (state.inGame === false && !(ROOM_GAMES[state.game] && ROOM_GAMES[state.game].lateJoin)) {
    renderRoomSpectator(state);
    return;
  }
  const game = ROOM_GAMES[state.game];
  if (game && game.render) {
    game.render(state);
    roomScrollToAction(state, game);
  }
}

let roomActionSeen = null;

/**
 * Each new step of a room game is drawn from the top of the screen. A phone
 * is scrolled down to the answer box, its hand or the last button it pressed
 * when the round closes, and the podium, the reveal and the next card are all
 * drawn at the top; nobody should have to swipe up to find out what happened
 * (the owner, 17 Sep 2026). The key is the phase and whatever names the step
 * inside it (the round, the player up, the deal); a presence tick or an
 * answer count changing is not a step. A game whose own screen manages its
 * scrolling (سكرو keeps your hand above the action bar) gives its own
 * `actionKey(state)` on its ROOM_GAMES entry: '' means leave it alone.
 */
function roomActionKey(state) {
  const s = state.shared || {};
  const plain = (v) => (v == null || typeof v === 'object') ? '' : String(v);
  // The voting games keep their phase on the room (state.phase) and the vote's own
  // (shared.vote.phase: open, closed - the results are drawn when it closes); most others in shared.phase.
  return [state.code, state.game, state.phase, s.dealId, s.phase, s.vote && s.vote.phase, s.results ? 'results' : '',
    s.round, s.step, s.turnId, s.subjectId, s.holderId, s.drawerId, s.turn, s.current, s.index].map(plain).join('|');
}

function roomScrollToAction(state, game) {
  const key = game && game.actionKey ? game.actionKey(state) : roomActionKey(state);
  if (key === roomActionSeen) return;
  const fresh = roomActionSeen === null;      // the screen was just opened: setView starts it at the top
  roomActionSeen = key;
  if (fresh || !key || typeof scrollToAction !== 'function') return;
  scrollToAction();
}

/**
 * A room with a big screen has one voice: the TV's. A cue every phone would
 * play at the same moment (a tick, a fanfare, the letter landing) is the TV's
 * job — eight phones playing it 200ms apart is an echo, and the table mutes
 * them. Anything personal (your turn, your answer, your buzz) still sounds on
 * the phone that it belongs to.
 */
function roomHasScreen() {
  const s = Room.state;
  return !!(s && !s.youAreScreen && (s.screens || []).some(x => x.online));
}

function playRoomFx(name) {
  if (roomHasScreen()) return;
  playSound(name);
}

// The join screen is not in the room: someone typing another room's code isn't pulled back to this one.
const onRoomView = () => { const v = appState.currentView || ''; return v.indexOf('room-') === 0 && v !== 'room-join'; };

let roomStageSeen = '';
let roomClockStageSeen = '';

/**
 * The single place the room state reaches the UI.
 *
 * Someone who has stepped out of the room screens - to the menu, a timer, the
 * rules - is left where they are. Drawing the room would call setView and drag
 * them straight back, which is what every poll used to do. The banner keeps
 * them in touch; only a game actually starting is worth a nudge.
 */
Room.onChange((state) => {
  // First, before anything is drawn: the clocks of a deal the room has left.
  const clockStage = roomClockStage(state);
  if (clockStage !== roomClockStageSeen) {
    roomClockStageSeen = clockStage;
    stopRoomClocks();
  }
  updateRoomBanner();
  paintRoomHostAway(state);
  // The program's result pause, for the games' own «العب تاني» buttons drawn without a helper (styles).
  document.body.classList.toggle('prog-result', !!(state && state.program && state.program.phase === 'result'));
  if (!state) { roomStageSeen = ''; roomActionSeen = null; return; }

  const stage = state.phase + '|' + (state.game || '');
  const moved = roomStageSeen !== '' && roomStageSeen !== stage;
  const wasInGame = roomStageSeen !== '' && roomStageSeen.indexOf('lobby|') !== 0;
  const prevGame = roomStageSeen.split('|')[1] || '';
  roomStageSeen = stage;

  if (!onRoomView()) {
    // Only a game dealt from the lobby: many games change phase inside a round
    // (night and day, reveal and vote), which used to buzz with this every time.
    if (moved && state.phase !== 'lobby' && !wasInGame && appState.currentView !== 'room-join') {
      const t = TRANSLATIONS[appState.lang] || {};
      showToast(t.room_started_away || 'اللعبة بدأت في الغرفة');
      haptic('light');
    }
    return;
  }
  // A game was just dealt from the lobby: the same moment on every phone.
  if (moved && state.phase !== 'lobby' && !wasInGame && typeof playRoomGameStart === 'function') playRoomGameStart(state);
  // The host took the room back to the hub (or on to another game) while this
  // phone was mid-round: say so, or the screen changing under them looks like a
  // fault. Not for "play again", which several games do through the lobby.
  if (moved && state.phase === 'lobby' && wasInGame && (!state.game || state.game !== prevGame) && !state.youAreHost && !state.program) {
    const t = TRANSLATIONS[appState.lang] || {};
    showToast(t.room_game_ended || '');
  }
  routeRoomState(state);
});

/** The banner's "return": back to whatever the room is doing now. */
function roomReturnToActive() {
  const state = Room.state;
  if (!Room.isIn || !state) return;
  // The hidden view still holds the frame from when they left. Drop its
  // signature so it is rebuilt from the current state rather than trusted.
  // «خماسي السهرة» draws each round on the screen of that round's puzzle, not the room's game.
  if (state.phase !== 'lobby' && state.game) {
    const ids = [state.game];
    const solve = state.shared && state.shared.race && state.shared.solve;
    if (solve && ids.indexOf(solve) === -1) ids.push(solve);
    ids.forEach((id) => {
      const view = document.getElementById('view-room-' + id);
      if (view) delete view.dataset.sig;
    });
  }
  const fromBanner = !onRoomView();
  if (fromBanner) roomBannerFold();
  routeRoomState(state);
  if (fromBanner) roomEnterForward();
  updateRoomBanner();
}

/* «كبّر الكود على الشاشة» (the ideas of 7 Oct 2026, 1287): the host's phone, mid-game, asks the
   big screen to show its corner QR big for TV_QR_BIG_MS (room action tvQr; JS_RoomTv.html grows it). */
function roomTvQrAsk() {
  const t = TRANSLATIONS[appState.lang] || {};
  roomAct('tvQr');
  showToast(t.room_tv_qr_done || '', 'success');
}
/** A screen of this room is on (a TV to ask): the host's way to it shows only then. */
function roomHasScreenOn(state) {
  return !!state && (state.screens || []).some(sc => sc.online);
}

/** The strip under the header while you are in a room but looking at something else. */
/** «غرفتك» in the bar (syncNavRoom): back to the room, or on its own screens to the top of it. */
function roomNavTap() {
  if (onRoomView()) {
    const main = document.querySelector('.shell__main');
    if (main) main.scrollTo({ top: 0, behavior: motionOff() ? 'auto' : 'smooth' });
    return;
  }
  roomReturnToActive();
}

function updateRoomBanner() {
  // The raised button follows the room too: «غرفتك» while this phone is in one.
  if (typeof syncNavRoom === 'function' && typeof appState !== 'undefined') syncNavRoom(appState.currentView);
  const banner = document.getElementById('active-room-banner');
  if (!banner) return;
  const session = Room.session;
  if (!session || onRoomView()) {
    banner.classList.add('hidden');
    return;
  }

  const t = TRANSLATIONS[appState.lang] || {};
  const s = Room.state;
  const appeared = banner.classList.contains('hidden');
  banner.classList.remove('hidden');
  banner.setAttribute('aria-label', t.active_room_label || '');

  const codeEl = document.getElementById('arb-code');
  if (codeEl) codeEl.textContent = session.code || '';

  let desc;
  if (!s || s.phase === 'lobby' || !s.game) {
    desc = (t.room_in_lobby || '') + ' \u2022 \ud83d\udc65 ' + ((s && s.players) ? s.players.length : 1);
  } else {
    const entry = ROOM_HUB_GAMES.find(g => g.id === s.game);
    const name = entry ? (iconText(entry.icon) ? iconText(entry.icon) + ' ' : '') + (t[entry.key] || entry.id) : s.game;
    // Where the game is (1298): «بيلعبوا الجاسوس · جولة ٣/٥» or «· النتيجة ظهرت».
    desc = t.room_banner_playing ? t.room_banner_playing.replace('{game}', name) : (t.room_playing_status || '') + ': ' + name;
    const where = roomBannerWhere(s, t);
    if (where) desc += ' · ' + where;
  }
  // «دورك!» (the ideas of 7 Oct 2026, 1215 = 1294): the game waits on this phone while it is
  // on another screen of the app - the banner turns the pop colour, says what to do, and buzzes
  // once for that moment; a tap goes back (arb__content).
  const turn = s && typeof roomTurnOf === 'function' ? roomTurnOf(s) : null;
  if (turn) desc = '\ud83d\udd14 ' + (t.turn_title || '') + (t[turn] ? ' \u00b7 ' + t[turn] : '');
  banner.classList.toggle('is-turn', !!turn);
  roomBannerTurnCue(banner, s, turn, appeared);
  const descEl = document.getElementById('arb-desc');
  if (descEl) descEl.textContent = desc;

  const back = banner.querySelector('.arb__btn--return');
  if (back) back.title = t.room_return || '';
  const leave = banner.querySelector('.arb__btn--leave');
  if (leave) {
    leave.title = t.room_leave || '';
    leave.setAttribute('aria-label', leave.title);
  }
}

/* Where the game is, for the banner (the ideas of 7 Oct 2026, 1298): the round out of how many when
   the game says (shared.round, and rounds / totalRounds / settings.rounds), and «النتيجة ظهرت» once a
   round's result or the game's end is on the screens - so someone reading the rules knows whether
   to hurry back. Nothing when the game keeps no rounds. */
const ROOM_BANNER_RESULT_PHASES = { result: 1, results: 1, reveal: 1, revealed: 1, scores: 1, roundEnd: 1, roundOver: 1 };
function roomBannerWhere(state, t) {
  const sh = state.shared || {};
  const bits = [];
  const round = Math.floor(Number(sh.round) || 0);
  if (round >= 1 && !sh.tour) {
    const total = Math.floor(Number(sh.rounds || sh.totalRounds || (sh.settings && sh.settings.rounds)) || 0);
    const n = total >= round && typeof ltrFrac === 'function' ? ltrFrac(round, total) : String(round);
    if (t.room_banner_round) bits.push(t.room_banner_round.replace('{n}', n));
  }
  const over = typeof roomGameIsOver === 'function' && roomGameIsOver(state);
  if ((over || ROOM_BANNER_RESULT_PHASES[sh.phase] || ROOM_BANNER_RESULT_PHASES[state.phase]) && t.room_banner_result) bits.push(t.room_banner_result);
  return bits.join(' · ');
}

/* «عودة» slides the room in (the ideas of 7 Oct 2026, 1299): the banner folds up where it stood (a
   ghost of it, scaled to nothing from its top, transform and opacity only) while the room's screen
   enters the way a step forward does (view-enter-fwd), whatever the depth of the screen left. */
function roomBannerFold() {
  const banner = document.getElementById('active-room-banner');
  if (!banner || banner.classList.contains('hidden') || motionOff()) return;
  const r = banner.getBoundingClientRect();
  if (!r.height || !banner.animate) return;
  const ghost = banner.cloneNode(true);
  ghost.removeAttribute('id');
  ghost.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  ghost.querySelectorAll('[onclick]').forEach(el => el.removeAttribute('onclick'));
  ghost.setAttribute('aria-hidden', 'true');
  ghost.classList.add('arb-ghost');
  ghost.style.top = r.top + 'px';
  ghost.style.left = r.left + 'px';
  ghost.style.width = r.width + 'px';
  ghost.style.height = r.height + 'px';
  document.body.appendChild(ghost);
  const done = () => ghost.remove();
  const a = ghost.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-0.4rem) scaleY(0.3)' }],
    { duration: 240, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' });
  a.onfinish = done;
  setTimeout(done, 400);
}
function roomEnterForward() {
  const view = document.getElementById('view-' + appState.currentView);
  if (view && view.classList.contains('view-enter-back')) view.classList.replace('view-enter-back', 'view-enter-fwd');
}

/* The banner's «دورك!»: one buzz per moment (this deal, this game, this kind of turn), never
   for a turn that was already there when this phone stepped off the room's screen. */
const roomBannerTurn = { key: '' };
function roomBannerTurnCue(banner, state, turn, appeared) {
  if (!turn || !state) { roomBannerTurn.key = ''; return; }
  const key = [state.code, (state.shared && state.shared.dealId) || '', state.game || '', turn].join('|');
  if (roomBannerTurn.key === key) return;
  roomBannerTurn.key = key;
  if (appeared || document.hidden) return;
  haptic('medium');
  if (!motionOff() && banner.animate) {
    banner.animate([{ transform: 'scale(0.97)' }, { transform: 'scale(1.025)' }, { transform: 'none' }],
      { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1.3)' });
  }
}

/**
 * Shown to someone who joined mid-round. They're already in the room and will
 * be dealt into the next game — this just keeps them from seeing a half-built
 * screen for a game they aren't holding cards in.
 */
function renderRoomSpectator(state) {
  if (appState.currentView !== 'room-lobby') setView('room-lobby');
  const t = TRANSLATIONS[appState.lang];
  const setup = document.getElementById('room-host-setup');
  const startBtn = document.getElementById('room-start-btn');
  const waitNote = document.getElementById('room-wait-note');

  // Lobby first: it rewrites the same nodes, so writing the spectator note
  // before it meant the note was replaced by the game picker straight away and
  // a mid-round joiner never saw why they were waiting. It leaves the setup
  // panel to the note below.
  renderRoomLobby(state, { spectator: true });

  if (startBtn) startBtn.classList.add('hidden');
  if (waitNote) waitNote.classList.add('hidden');
  if (setup) {
    const html = roomSpectatorCardHtml(state, t);
    if (setup.dataset.sig !== html) { setup.innerHTML = html; setup.dataset.sig = html; }
  }
}

/* A mid-round joiner's note is a small live card (the ideas of 7 Oct 2026, 1307): the game, the
   round when it counts them, and the top of its board when it keeps one - redrawn as it moves. */
function roomSpectatorCardHtml(state, t) {
  const s = state.shared || {};
  const entry = ROOM_HUB_GAMES.find(g => g.id === state.game);
  const round = Number(s.round) > 0 ? `<span class="badge">${escapeHTML(t.round || '')} <span class="metric">${Number(s.round)}${Number(s.rounds) > 0 ? '/' + Number(s.rounds) : ''}</span></span>` : '';
  const board = (Array.isArray(s.board) ? s.board : []).filter(r => r && r.name && r.score !== undefined).slice(0, 3);
  const medals = ['🥇', '🥈', '🥉'];
  const rows = board.length ? `<div class="room-spec__board">${board.map((r, i) => `
        <span class="room-spec__row"><span aria-hidden="true">${medals[i]}</span> <bdi>${escapeHTML(r.name)}</bdi> <b class="metric">${escapeHTML(String(r.score))}</b></span>`).join('')}</div>` : '';
  return `
    <div class="card room-spec" data-accent="${entry && entry.accent ? entry.accent : 'violet'}">
      <div class="room-spec__head">
        <span class="room-spec__icon" aria-hidden="true">${entry ? iconHtml(entry.icon) : '🎮'}</span>
        <span class="room-spec__name">${escapeHTML(entry ? (t[entry.key] || entry.id) : (state.game || ''))}</span>
        ${round}
      </div>
      ${rows}
      <p class="room-spec__note"><span class="room-spec__live" aria-hidden="true"></span> ${escapeHTML(t.room_spectating || '')}</p>
    </div>`;
}

/**
 * Asks for the player's name in a sheet rather than window.prompt(), which is
 * blocked in some embedded contexts — including the one this app is served in.
 */
let nameModalResolve = null;

function promptForName() {
  return new Promise(resolve => {
    nameModalResolve = resolve;
    const input = document.getElementById('name-modal-input');
    const modal = document.getElementById('name-modal');
    if (!input || !modal) { resolve(''); return; }

    input.value = roomName.get();
    // «اعمل وشك» (1282): the face maker under the name, from the chunk 'faces'.
    if (typeof lzEnsure === 'function') lzEnsure(['faces']).then(() => { if (typeof facePickerPaint === 'function' && !modal.classList.contains('hidden')) facePickerPaint(); }, () => {});
    modal.classList.remove('hidden');
    setTimeout(() => { input.focus(); input.select(); }, 320);
  });
}

function submitNameModal() {
  const input = document.getElementById('name-modal-input');
  const value = (input.value || '').trim().slice(0, 24);
  if (!value) { showToast(TRANSLATIONS[appState.lang].name_needed || 'اكتب اسمك', 'error'); return; }
  // The face the maker ends on is kept with the name (null: the maker never showed, nothing changes).
  const face = typeof facePickerTake === 'function' ? facePickerTake() : null;
  if (face !== null) roomFace.set(face);
  closeModal('name-modal');
  const done = nameModalResolve;
  nameModalResolve = null;
  if (done) done(value);
}

/** Settings → your name: change the name rooms use without joining one. */
async function changeSavedName() {
  closeModal('settings-modal');
  const name = await promptForName();
  if (!name) return;
  roomName.set(name);
  showToast((TRANSLATIONS[appState.lang] || {}).name_saved || 'تم حفظ الاسم', 'success');
}

function cancelNameModal() {
  closeModal('name-modal');
  const done = nameModalResolve;
  nameModalResolve = null;
  if (done) done('');
}

/* --- boot ---------------------------------------------------------------- */

/**
 * On load: honour a scanned ?room= link first, otherwise silently rejoin
 * whatever room this device was last in.
 */
async function initRooms() {
  const injected = (window.SERVER_DATA && window.SERVER_DATA.room) || '';
  if (injected) {
    // Nothing is resumed yet on load, so Room.isIn is still false here: read
    // the saved session itself.
    const code = extractRoomCode(injected);
    const saved = Room.saved;
    if (saved && saved.code === code) {
      // The link to the room this phone is already in: straight back into it.
      const resumed = await Room.resume();
      if (resumed && Room.state) { routeRoomState(Room.state); updateRoomBanner(); return; }
      // Kept but not reached yet (no network): the banner is the way back.
      if (Room.isIn) { updateRoomBanner(); return; }
    } else if (saved) {
      // A different room: leave the old one properly, so it doesn't keep a
      // seat (and a host) for a phone that has moved on. The saved session is
      // forgotten at once; the request itself needn't hold up the join screen.
      Room.leaveSaved();
    }
    roomFromLink = extractRoomCode(injected);
    roomOpenJoin(injected);
    return;
  }
  const resumed = await Room.resume();
  // Reloaded on a room screen: draw it. Anywhere else, stay put - the banner
  // is the way back.
  if (resumed && Room.state && onRoomView()) routeRoomState(Room.state);
  updateRoomBanner();
}

/**
 * The host's "move on" button waits 40 seconds for a phone that is there but
 * quiet, and with no clock nothing is pushed meanwhile: so when a wait starts
 * (`local.since`), a redraw is set for when it ends. The TV's frame is rebuilt
 * only on a new signature, so its signature is dropped first. Shared by
 * المشنقة, the solve rooms and خمّن مين; cleared with the room's clocks.
 */
function roomQuietRedraw(local, game) {
  clearTimeout(local.quietTimer);
  local.quietTimer = setTimeout(() => {
    const st = typeof Room !== 'undefined' ? Room.state : null;
    if (!st || st.game !== game || !roomCanMoveOn(st)) return;
    if (st.youAreScreen) {
      if (appState.currentView !== 'room-tv') return;
      const tv = document.getElementById('view-room-tv');
      if (tv) delete tv.dataset.sig;
    } else if (!onRoomView()) return;
    routeRoomState(st);
  }, 40500);
}
function roomQuietStop(local) { clearTimeout(local.quietTimer); local.quietTimer = null; }
</script>
