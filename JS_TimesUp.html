const timesUpState = {
  deck: [],
  currentRoundDeck: [],
  round: 1, // 1: Any words, 2: One word, 3: Pantomime/Charades
  scores: { 1: 0, 2: 0 },
  teams: { 1: [], 2: [] },
  activeTeam: 1,
  activePlayerIndex: { 1: 0, 2: 0 },
  turnTimerSeconds: 40,
  turnClock: null,
  currentCard: "",
  turnProcessing: false
};

function setupTimesUp() {
  setView('setup-timesup');
}

function startTimesUpGame() {
  const selected = appState.activePlayers ? [...appState.activePlayers] : [];
  saveActivePlayers(selected);

  if (selected.length < 4) {
    const msg = appState.lang === 'en' ? "Need at least 4 players (2 vs 2)!" : "تحتاج إلى 4 لاعبين على الأقل (2 ضد 2)!";
    showToast(msg);
    return;
  }

  // Shuffle and split into 2 teams
  const shuffled = shuffleArray(selected);
  timesUpState.teams[1] = [];
  timesUpState.teams[2] = [];
  shuffled.forEach((p, idx) => {
    timesUpState.teams[(idx % 2) + 1].push(p);
  });

  const lang = appState.lang === 'en' ? 'en' : 'ar';
  // A repeat would put the same card in the deck twice - a free point.
  const db = [...new Set(TIMESUP_DB[lang] || TIMESUP_DB.ar)];
  const deckSize = parseInt(document.getElementById('timesup-deck-size')?.value || '35', 10);
  timesUpState.turnTimerSeconds = parseInt(document.getElementById('timesup-turn-timer')?.value || '40', 10);

  // Pick unique deck
  timesUpState.deck = shuffleArray(db).slice(0, Math.min(deckSize, db.length));
  timesUpState.currentRoundDeck = [...timesUpState.deck];
  timesUpState.round = 1;
  timesUpState.scores = { 1: 0, 2: 0 };
  timesUpState.activeTeam = 1;
  timesUpState.activePlayerIndex = { 1: 0, 2: 0 };
  timesUpState.turnProcessing = false;

  playSound('click');
  startTimesUpRound(1);
}

function startTimesUpRound(roundNum, carrySeconds) {
  timesUpState.round = roundNum;
  timesUpState.currentRoundDeck = shuffleArray([...timesUpState.deck]);
  timesUpState.carrySeconds = carrySeconds || 0;
  // No confirm dialog between rounds: cancelling it left the last card on
  // screen with no clock and no way on. The ready card names the round instead.
  setView('play-timesup');
  prepareTimesUpTurn();
}

function prepareTimesUpTurn() {
  timesUpState.turnProcessing = false;
  const team = timesUpState.activeTeam;
  const playerList = timesUpState.teams[team];
  const pIdx = timesUpState.activePlayerIndex[team] % playerList.length;
  const activeClueGiver = playerList[pIdx];

  const lang = appState.lang === 'en' ? 'en' : 'ar';
  document.getElementById('timesup-round-badge').innerText = `${lang === 'en' ? 'Round' : 'جولة'} ${timesUpState.round}/3`;
  document.getElementById('timesup-team-turn-name').innerText = `${lang === 'en' ? 'Team' : 'فريق'} ${team} (${activeClueGiver})`;
  document.getElementById('timesup-cards-left').innerText = timesUpState.currentRoundDeck.length;

  // Update scores
  document.getElementById('timesup-score-team1').innerText = timesUpState.scores[1];
  document.getElementById('timesup-score-team2').innerText = timesUpState.scores[2];

  // Show "Ready to start turn" overlay
  document.getElementById('timesup-turn-ready-card').classList.remove('hidden');
  document.getElementById('timesup-turn-live-card').classList.add('hidden');
  document.getElementById('timesup-ready-player-name').innerText = activeClueGiver;

  const rule = document.getElementById('timesup-round-rule');
  if (rule) {
    const t = TRANSLATIONS[appState.lang] || {};
    const carry = timesUpState.carrySeconds;
    rule.textContent = ([t.timesup_r1, t.timesup_r2, t.timesup_r3][timesUpState.round - 1] || '')
      + (carry ? ' · ⏱️ ' + (t.timesup_carry || '').replace('{n}', carry) : '');
  }
}

function beginTimesUpLiveTurn() {
  document.getElementById('timesup-turn-ready-card').classList.add('hidden');
  document.getElementById('timesup-turn-live-card').classList.remove('hidden');

  drawNextTimesUpCard();

  let left = timesUpState.carrySeconds || timesUpState.turnTimerSeconds;
  timesUpState.carrySeconds = 0;
  updateTimesUpClockUI(left);

  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  timesUpState.turnClock = createClock({
    seconds: left,
    onTick: (val) => {
      updateTimesUpClockUI(val);
      if (val <= 5 && val > 0) playSound('tick');
      if (val === 0) {
        playSound('alarm');
        endTimesUpTurn(true);
      }
    },
    onEnd: () => {
      endTimesUpTurn(true);
    }
  });
}

function updateTimesUpClockUI(sec) {
  const el = document.getElementById('timesup-clock-display');
  if (el) el.innerText = sec;
}

function drawNextTimesUpCard() {
  if (timesUpState.currentRoundDeck.length === 0) {
    // Round ended mid-turn!
    endTimesUpRound();
    return;
  }
  timesUpState.currentCard = timesUpState.currentRoundDeck[0];
  const cardEl = document.getElementById('timesup-word-display');
  if (cardEl) {
    cardEl.innerText = timesUpState.currentCard;
  }
  document.getElementById('timesup-cards-left').innerText = timesUpState.currentRoundDeck.length;
}

function timesUpAction(action) {
  if (timesUpState.turnProcessing) return;
  if (!timesUpState.currentCard) return;

  if (action === 'correct') {
    timesUpState.turnProcessing = true;
    playSound('success');
    timesUpState.scores[timesUpState.activeTeam]++;
    document.getElementById(`timesup-score-team${timesUpState.activeTeam}`).innerText = timesUpState.scores[timesUpState.activeTeam];

    // Remove from current round deck
    timesUpState.currentRoundDeck.shift();

    if (timesUpState.currentRoundDeck.length === 0) {
      endTimesUpRound();
      return;
    }

    drawNextTimesUpCard();
    setTimeout(() => { timesUpState.turnProcessing = false; }, 200);
  } else if (action === 'pass') {
    playSound('click');
    // Rotate card to back of deck
    const passed = timesUpState.currentRoundDeck.shift();
    timesUpState.currentRoundDeck.push(passed);
    drawNextTimesUpCard();
  }
}

function endTimesUpTurn(timeRanOut) {
  if (timesUpState.turnClock) timesUpState.turnClock.stop();

  // Rotate player and switch team
  timesUpState.activePlayerIndex[timesUpState.activeTeam]++;
  timesUpState.activeTeam = (timesUpState.activeTeam === 1) ? 2 : 1;

  if (timesUpState.currentRoundDeck.length > 0) {
    prepareTimesUpTurn();
  }
}

function endTimesUpRound() {
  // Read the clock before stopping it: whoever emptied the deck keeps their time.
  const left = timesUpState.turnClock ? timesUpState.turnClock.value() : 0;
  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  timesUpState.turnClock = null;
  playSound('success');

  if (timesUpState.round >= 3) {
    finishTimesUpGrandFinale();
    return;
  }

  confetti({ particleCount: 100 });
  const t = TRANSLATIONS[appState.lang] || {};
  showToast((t.timesup_round_done || '').replace('{n}', timesUpState.round), 'success');

  // The rule: the clue giver who cleared the deck carries straight on into the
  // next round with the time they had left. With next to none left, it is
  // simply the other team's turn.
  if (left < 3) {
    timesUpState.activePlayerIndex[timesUpState.activeTeam]++;
    timesUpState.activeTeam = timesUpState.activeTeam === 1 ? 2 : 1;
  }
  startTimesUpRound(timesUpState.round + 1, left >= 3 ? left : 0);
}

function finishTimesUpGrandFinale() {
  const lang = appState.lang === 'en' ? 'en' : 'ar';
  const modal = document.getElementById('timesup-result-modal');
  const titleEl = document.getElementById('timesup-result-title');
  const detailEl = document.getElementById('timesup-result-detail');

  const score1 = timesUpState.scores[1];
  const score2 = timesUpState.scores[2];

  let winnerText = "";
  if (score1 > score2) {
    winnerText = lang === 'en' ? "🏆 TEAM 1 WINS!" : "🏆 فوز الفريق 1!";
    titleEl.className = "text-3xl font-black tx-accent mb-2";
  } else if (score2 > score1) {
    winnerText = lang === 'en' ? "🏆 TEAM 2 WINS!" : "🏆 فوز الفريق 2!";
    titleEl.className = "text-3xl font-black tx-warning mb-2";
  } else {
    winnerText = lang === 'en' ? "🤝 IT'S A TIE!" : "🤝 تعادل رائع!";
    titleEl.className = "text-3xl font-black tx-success mb-2";
  }

  titleEl.innerText = winnerText;
  confetti({ particleCount: 200, spread: 90 });

  detailEl.innerHTML = `
    <div class="grid grid-cols-2 gap-3 my-4">
      <div class="p-4 rounded-xl bg-blue-500/10 border border-blue-500/30 text-center">
        <div class="text-xs uppercase font-bold tx-accent">${lang === 'en' ? 'Team 1' : 'فريق 1'}</div>
        <div class="text-3xl font-black my-1">${score1}</div>
        <div class="text-xs opacity-75">${timesUpState.teams[1].map(escapeHTML).join(', ')}</div>
      </div>
      <div class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-center">
        <div class="text-xs uppercase font-bold tx-warning">${lang === 'en' ? 'Team 2' : 'فريق 2'}</div>
        <div class="text-3xl font-black my-1">${score2}</div>
        <div class="text-xs opacity-75">${timesUpState.teams[2].map(escapeHTML).join(', ')}</div>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
}

function resetTimesUpPlay() {
  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  closeModal('timesup-result-modal');
  setupTimesUp();
}
</script>
