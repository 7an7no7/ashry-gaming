// --- 1. RENDER FUNCTION (Safe to call anytime) ---
function renderCharadesDropdown() {
    const catSelect = document.getElementById('charades-cat-select');
    if(!catSelect) return;
    
    catSelect.innerHTML = ''; 
    const db = CHARADES_DB[contentLang()];
    if (db) {
        Object.keys(db).forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.innerText = key;
            catSelect.appendChild(option);
        });
    }
}

// --- 2. SETUP FUNCTION (Triggered by Button) ---
function setupCharades() {
    renderCharadesDropdown(); // Fill data
    setView('setup-charades'); // Change screen
}

function startCharades(time) {
    const catSelect = document.getElementById('charades-cat-select');
    const catKey = catSelect ? catSelect.value : null;
    
    if (appState.charades.currentCategory.length > 0 && time) {
         // Replay mode
    } else if (catKey && CHARADES_DB[contentLang()][catKey]) {
        appState.charades.currentCategory = [...CHARADES_DB[contentLang()][catKey]];
    } else {
        appState.charades.currentCategory = ["Error: No Category"];
    }

    if(time) appState.charades.timer = time;
    else appState.charades.timer = parseInt(document.getElementById('charades-timer-input').value);

    // From the setup screen in team mode: a fresh relay, and the handover
    // card before the first turn (JS_TeamRelay.html). A replay (`time` set)
    // in single mode is just another round.
    if (!time) {
        const o = relayOptsOf(appState.charades);
        if (o.mode === 'teams') {
            relayStart(appState.charades, relayNames(appState.charades, TRANSLATIONS[appState.lang]), o.turns);
            setView('play-charades');
            charadesShowRelay();
            return;
        }
        appState.charades.relay = null;
    }
    charadesRunTurn();
}

/** One timed round, for one player or for the team whose turn it is. */
function charadesRunTurn() {
    appState.charades.score = 0;
    appState.charades.history = [];

    document.getElementById('charades-ui-playing').classList.remove('hidden');
    document.getElementById('charades-ui-result').classList.add('hidden');
    document.getElementById('charades-ui-relay').classList.add('hidden');

    if (appState.currentView !== 'play-charades') setView('play-charades');
    nextCharadesCard();
    
    document.getElementById('charades-timer').innerText = appState.charades.timer;
    if (appState.charades.interval) appState.charades.interval.stop();

    appState.charades.interval = createClock({
        seconds: appState.charades.timer,
        onTick: (left) => {
            const timerEl = document.getElementById('charades-timer');
            if (timerEl) timerEl.innerText = left;
        },
        onEnd: () => {
            appState.charades.interval = null;
            finishCharadesGame();
        }
    });
}

function startCharadesGame(time) {
    // "Play again" after a team match starts the match over from the setup.
    if (relayOptsOf(appState.charades).mode === 'teams' && appState.charades.relay && appState.charades.relay.phase === 'done') { startCharades(); return; }
    startCharades(time);
}

/** The card between team turns: whose turn, hand the phone over. */
function charadesShowRelay() {
    const t = TRANSLATIONS[appState.lang];
    document.getElementById('charades-ui-playing').classList.add('hidden');
    document.getElementById('charades-ui-result').classList.add('hidden');
    const box = document.getElementById('charades-ui-relay');
    box.classList.remove('hidden');
    box.innerHTML = relayHandoverHtml(appState.charades, t, 'charadesRunTurn()');
}

function paintCharadesSetup() {
    paintRelaySetup('charades', appState.charades);
}

function nextCharadesCard(action) {
    // What this card was judged as, so it can be taken back: a tap lands on the
    // wrong button often enough under a clock, and the round is scored on it.
    const shown = appState.charades.history[appState.charades.history.length - 1];
    if (shown) {
        appState.charades.judged = appState.charades.judged || [];
        appState.charades.judged.push({ word: shown, action: action });
    }
    if (action === 'correct') {
        appState.charades.score++;
        playSound('success');
    } else if (action === 'pass') {
        playSound('click');
    }

    const words = appState.charades.currentCategory;
    // Every card in the category has already been up this round.
    if (appState.charades.history.length >= words.length) {
        finishCharadesGame();
        return;
    }

    // Remembered across games on this phone, so a new round doesn't open with
    // the cards the last one just used.
    const word = freshPick('charades:' + contentLang(), words, 1, { avoid: appState.charades.history })[0];
    
    appState.charades.history.push(word);
    
    const cardTitle = document.getElementById('charades-word');
    if(cardTitle) {
        if (appState.charades.flipTimer) clearTimeout(appState.charades.flipTimer);
        if (appState.charades.classTimer) clearTimeout(appState.charades.classTimer);
        const cardParent = cardTitle.parentElement;
        cardParent.classList.remove('animate-flip');
        void cardParent.offsetWidth;
        cardParent.classList.add('animate-flip');
        appState.charades.classTimer = setTimeout(() => cardParent.classList.remove('animate-flip'), 500);
        appState.charades.flipTimer = setTimeout(() => { cardTitle.innerText = word; }, 250);
    }
}

/** Puts the last card back: its point, and the word, exactly as they were. */
function undoCharadesCard() {
    const judged = appState.charades.judged || [];
    const last = judged.pop();
    const t = TRANSLATIONS[appState.lang] || {};
    if (!last) { showToast(t.undo_nothing || '', 'info'); return; }
    if (last.action === 'correct') appState.charades.score = Math.max(0, appState.charades.score - 1);
    // The card on screen was never judged; it goes back to the deck.
    const hist = appState.charades.history;
    if (hist.length && hist[hist.length - 1] !== last.word) hist.pop();
    const el = document.getElementById('charades-word');
    if (el) el.innerText = last.word;
    playSound('tick');
    haptic('light');
    showToast(t.undo_done || '', 'success');
}

function finishCharadesGame() {
    if (appState.charades.flipTimer) clearTimeout(appState.charades.flipTimer);
    if (appState.charades.classTimer) clearTimeout(appState.charades.classTimer);
    if (appState.charades.interval) appState.charades.interval.stop();
    appState.charades.interval = null;
    
    playSound('alarm');
    confetti({ particleCount: 200, spread: 100 });

    document.getElementById('charades-ui-playing').classList.add('hidden');

    // Team mode: bank the turn, then the next handover or the final board.
    if (relayActive(appState.charades)) {
        const t = TRANSLATIONS[appState.lang];
        const phase = relayTurnDone(appState.charades, appState.charades.score);
        const box = document.getElementById('charades-ui-relay');
        box.classList.remove('hidden');
        box.innerHTML = relaySummaryHtml(appState.charades, t,
            phase === 'done' ? 'startCharades()' : 'charadesRunTurn()', "setView('setup-charades')");
        return;
    }

    document.getElementById('charades-final-score').innerText = appState.charades.score;
    document.getElementById('charades-ui-result').classList.remove('hidden');
}
</script>
