/* ============================================================================
   خمّن مين — GUESS WHO on the phones and the TV
   ----------------------------------------------------------------------------

   a pale backdrop, white cards with the name under the face; a face put down

   The table moments (the owner, 23 Sep 2026): while the other decides, the
   asker sees them thinking; the answer lands as a big أيوه / لأ bubble with
   a sound on both phones, the watchers' and the TV; a guess is a

   turn only after it (gwMoments).

   Motion: the answer pops, the pills' ring slides, the winner's phone and
   the TV cheer, and at the end both secret faces turn over (gwRevealHtml).
   ========================================================================= */

const GW_SKIN = ['#f7d7bc', '#e9b98e', '#c68d61', '#8a5636'];

const GW_COLOUR_HEX = ['#e11d48', '#2563eb', '#16a34a', '#eab308', '#7c3aed', '#f97316', '#ec4899', '#6b7280'];
// The backdrops: soft and pale, none close enough to a clothes colour to be taken for one.
const GW_BACK = ['#e2f4f0', '#ece7f8', '#fbe9e4', '#f6efdc', '#e4ebf6', '#eef3e1'];

/** Mixes two #rrggbb colours: t 0 is `a`, 1 is `b`. */
function gwMix(a, b, t) {
  const x = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const y = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');

const gwColour = (i) => GW_COLOUR_HEX[Number(i)] || GW_COLOUR_HEX[1];
const gwHas = (v) => v !== null && v !== undefined && v !== false;
let gwUid = 0;

/**
 * One face, look ب «ألبوم ناعم» (the owner, 29 Sep 2026): no outlines, a soft light on the face and the

 * earrings, freckles and a mole you can count, wide stripes and dots), and the picture is cropped to

 */

  const cap = gwHas(x.cap) ? gwColour(x.cap) : (x.hat ? GW_COLOUR_HEX[1] : null);
  const scarf = gwHas(x.scarf) ? gwColour(x.scarf) : null;

    `<linearGradient id="${u}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${gwMix(hair, '#ffffff', 0.18)}"/><stop offset="1" stop-color="${gwMix(hair, '#000000', 0.2)}"/></linearGradient>`,

  let shirtFill = shirt;
  if (x.pattern === 'stripes') {

  }

  if (!hijab && style === 'ponytail') o.push(`<path d="M64 34 C87 33 91 63 80 82 C80 65 74 51 64 46Z" fill="${H}"/><circle cx="67" cy="36" r="3.6" fill="${GW_COLOUR_HEX[6]}"/>`);

  if (!hijab && style === 'curly') {

    if (x.g === 'f') o.push(`<circle cx="25" cy="54" r="7.5" fill="${H}"/><circle cx="75" cy="54" r="7.5" fill="${H}"/>`);
  }
  // The shoulders: the neck, the top and what is worn on it.
  o.push(`<rect x="43" y="64" width="14" height="28" rx="5" fill="${skinD}"/>`);
  if (top === 'hoodie') o.push(`<path d="M27 95 C29 79 71 79 73 95 C64 89 36 89 27 95Z" fill="${gwMix(shirt, '#000000', 0.25)}"/>`);
  o.push(`<path d="M11 111 C12 97 30 89 50 89 C70 89 88 97 89 111Z" fill="${shirtFill}"/>`);
  if (top === 'collar') {
    o.push(`<path d="M43 89 L50 99 L57 89Z" fill="${skinD}"/><path d="M39 88 L50 99 L42.5 104Z" fill="#ffffff"/><path d="M61 88 L50 99 L57.5 104Z" fill="#ffffff"/>`);
    if (!x.tie) o.push(`<circle cx="50" cy="106.5" r="1.6" fill="#1f2430"/>`);
  }
  if (top === 'tee') o.push(`<path d="M40.5 89.5 Q50 98 59.5 89.5" fill="none" stroke="${gwMix(shirt, '#000000', 0.32)}" stroke-width="2.4"/>`);
  if (top === 'hoodie') o.push(`<path d="M45.5 93 L44.5 106 M54.5 93 L55.5 106" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="44.5" cy="107" r="2" fill="#fff"/><circle cx="55.5" cy="107" r="2" fill="#fff"/>`);
  if (x.tie === 'tie') o.push(`<path d="M47.4 99 L52.6 99 L54 102 L52.4 111 L47.6 111 L46 102Z" fill="#dc2626"/><path d="M47 96.6 L53 96.6 L52.4 101 L47.6 101Z" fill="#991b1b"/>`);
  if (x.tie === 'bow') o.push(`<path d="M50 99 L39.5 93.5 L39.5 104.5Z" fill="#7c3aed"/><path d="M50 99 L60.5 93.5 L60.5 104.5Z" fill="#7c3aed"/><circle cx="50" cy="99" r="2.8" fill="#5b21b6"/>`);
  if (x.necklace) o.push(`<path d="M39.5 89 Q50 102 60.5 89" fill="none" stroke="#d99a16" stroke-width="2.2"/><circle cx="50" cy="97" r="3.6" fill="#f5c542"/><circle cx="49" cy="96" r="1.1" fill="#fff" opacity=".8"/>`);
  if (scarf) o.push(`<path d="M32 83 C40 94 60 94 68 83 L69 90.5 C60 102 40 102 31 90.5Z" fill="${scarf}"/><path d="M55 93 L62.5 111 L53.5 111 L50.5 96Z" fill="${gwMix(scarf, '#000000', 0.2)}"/>`);
  if (!hijab && style === 'braids') {
    [[33, -1], [67, 1]].forEach(([cx, d]) => {
      for (let k = 0; k < 5; k++) o.push(`<ellipse cx="${cx + d * k * 0.4}" cy="${66 + k * 6.3}" rx="4.8" ry="4" fill="${H}"/>`);

    });
  }
  // A hijab drapes over the shoulders, round the head, and covers the hair and the ears.

  if (hijab) o.push(`<path d="M50 18 C27 18 21 38 22 56 C23 70 23 80 27 88 C35 97 65 97 73 88 C77 80 77 70 78 56 C79 38 73 18 50 18Z" fill="${hijab}"/>`);
  // The head.
  if (!hijab) {
    o.push(`<ellipse cx="29.5" cy="52" rx="5" ry="6" fill="${S}"/><ellipse cx="70.5" cy="52" rx="5" ry="6" fill="${S}"/>`);
    if (x.ear) o.push(`<circle cx="29" cy="61.5" r="3.6" fill="#f5b400"/><circle cx="71" cy="61.5" r="3.6" fill="#f5b400"/><circle cx="28.2" cy="60.6" r="1.1" fill="#fff" opacity=".8"/><circle cx="70.2" cy="60.6" r="1.1" fill="#fff" opacity=".8"/>`);
  }
  // The head's shadow on the neck, under the head so it never marks the chin.
  if (!hijab) o.push(`<ellipse cx="50" cy="73" rx="9" ry="4" fill="rgba(80,40,20,.2)"/>`);
  o.push(`<ellipse cx="50" cy="50" rx="20.5" ry="23.5" fill="${S}"/>`);
  if (x.wrinkles) o.push(`<path d="M40.5 33 q9.5 -2.4 19 0 M42.5 36.6 q7.5 -1.8 15 0 M31.2 46 l3.8 1.6 M31.5 50.4 l3.6 -.7 M68.8 46 l-3.8 1.6 M68.5 50.4 l-3.6 -.7" fill="none" stroke="${skinD}" stroke-width="1.6" stroke-linecap="round"/>`);
  if (x.rosy) o.push(`<ellipse cx="35.5" cy="58" rx="5" ry="3.2" fill="#fb7185" opacity=".6"/><ellipse cx="64.5" cy="58" rx="5" ry="3.2" fill="#fb7185" opacity=".6"/>`);
  if (x.freckles) [[34.6, 55], [37.8, 57.6], [34, 59], [39.2, 54.4], [65.4, 55], [62.2, 57.6], [66, 59], [60.8, 54.4]].forEach(([a, b]) => o.push(`<circle cx="${a}" cy="${b}" r="1.25" fill="${gwMix(skin, '#6b3410', 0.55)}"/>`));
  if (x.mole) o.push(`<circle cx="61.5" cy="64" r="1.8" fill="#3b2418"/>`);
  if (x.beard) o.push(`<path d="M29 48 C29 71 38 78 50 78 C62 78 71 71 71 48 C68 61 62 67 50 67 C38 67 32 61 29 48Z" fill="${H}"/>`);
  // The hair in front, or the hijab's frame round the face.
  if (hijab) {
    o.push(`<path d="M29 47 C30 30 40 25 50 25 C60 25 70 30 71 47 C66 36 58 31 50 31 C42 31 34 36 29 47Z" fill="${gwMix(hijab, '#000000', 0.14)}"/>`);
    o.push(`<path d="M29.5 57 C30.5 72 40 79 50 79 C60 79 69.5 72 70.5 57 C72 76 63 86 50 86 C37 86 28 76 29.5 57Z" fill="${hijab}"/>`);
  } else {
    if (style === 'short' || style === 'bun' || style === 'ponytail') o.push(`<path d="M29 44 C28 26 38 21 50 21 C62 21 72 26 71 44 C66 34 58 30 50 30 C42 30 34 34 29 44Z" fill="${H}"/>`);
    if (style === 'spiky') o.push(`<path d="M29 44 L28 30 L34 33 L36 21 L42 28 L47 16 L52 27 L58 17 L61 28 L68 22 L67 32 L72 30 L71 44 C66 34 58 31 50 31 C42 31 34 34 29 44Z" fill="${H}"/>`);
    if (style === 'long') o.push(`<path d="M29 48 C27 26 38 20 50 20 C62 20 73 26 71 48 C68 36 62 30 50 29 C40 30 32 36 29 48Z" fill="${H}"/>`);

  }
  if (cap) o.push(`<path d="M28.5 40 C28 22 38 16.5 50 16.5 C62 16.5 72 22 71.5 40Z" fill="${cap}"/><path d="M48 38 C60 37 82 38 88 42 C81 45 62 43.2 48 42Z" fill="${gwMix(cap, '#000000', 0.22)}"/><circle cx="50" cy="17.5" r="2.4" fill="${gwMix(cap, '#000000', 0.22)}"/>`);
  if (x.phones) o.push(`<path d="M25.5 50 C23 15 77 15 74.5 50" fill="none" stroke="#1f2937" stroke-width="4.4" stroke-linecap="round"/><rect x="20.5" y="42.5" width="9.5" height="18" rx="3.8" fill="#1f2937"/><rect x="70" y="42.5" width="9.5" height="18" rx="3.8" fill="#1f2937"/><rect x="22" y="45" width="3" height="13" rx="1.5" fill="#ef4444"/><rect x="75" y="45" width="3" height="13" rx="1.5" fill="#ef4444"/>`);

  const brow = x.hair === 'grey' ? '#8f8a82' : (hijab || style === 'bald' ? GW_HAIR_COL.black : hair);
  o.push(`<path d="M35.5 39.5 q5.5 -3.2 11 0 M53.5 39.5 q5.5 -3.2 11 0" stroke="${brow}" stroke-width="${x.brows === 'thick' ? 4.4 : 2.2}" fill="none" stroke-linecap="round"/>`);
  if (!x.sun) {
    const ey = GW_EYE_COL[x.eyes] || GW_EYE_COL.brown;
    [41, 59].forEach(cx => {
      o.push(`<ellipse cx="${cx}" cy="48" rx="4.6" ry="4.3" fill="#fff"/><circle cx="${cx}" cy="48.3" r="3.1" fill="${ey}"/><circle cx="${cx}" cy="48.3" r="1.3" fill="#1b1b24"/><circle cx="${cx + 1.1}" cy="47.1" r=".9" fill="#fff"/>`);
      if (x.g === 'f') o.push(`<path d="M${cx - 4.8} 46.2 q4.8 -3.6 9.6 0" fill="none" stroke="#1b1b24" stroke-width="1.3"/>`);
    });
  }
  if (x.glasses) o.push(`<g fill="rgba(255,255,255,.2)" stroke="#1f2430" stroke-width="2.4"><rect x="32.8" y="42.3" width="15.8" height="11.4" rx="4.6"/><rect x="51.4" y="42.3" width="15.8" height="11.4" rx="4.6"/></g><path d="M48.6 47 h2.8" stroke="#1f2430" stroke-width="2.4"/>`);
  if (x.sun) o.push(`<path d="M32 43 h16.5 v5 c0 5 -3 7.5 -8 7.5 c-5 0 -8.5 -2.5 -8.5 -7.5Z M51.5 43 h16.5 v5 c0 5 -3.5 7.5 -8.5 7.5 c-5 0 -8 -2.5 -8 -7.5Z" fill="#111827"/><path d="M48.5 45 h3" stroke="#111827" stroke-width="2.4"/><path d="M35 46.2 l4.4 -1.8 M54.5 46.2 l4.4 -1.8" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-linecap="round"/>`);
  o.push(`<path d="M50 50 q-2.6 6 .6 7" stroke="rgba(0,0,0,.3)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`);
  if (x.mous) o.push(`<path d="M39.5 60.5 C43 55 48 56.5 50 57.6 C52 56.5 57 55 60.5 60.5 C56 59 53 59.8 50 60 C47 59.8 44 59 39.5 60.5Z" fill="${H}"/>`);
  const my = x.mous ? 1 : 0;
  if (mouth === 'smile') o.push(`<path d="M42.5 ${61.5 + my} Q50 ${68 + my} 57.5 ${61.5 + my}" stroke="#8a3b2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>`);
  if (mouth === 'serious') o.push(`<path d="M44.5 ${64 + my} L55.5 ${64 + my}" stroke="#8a3b2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>`);
  if (mouth === 'laugh') o.push(`<path d="M41 ${60 + my} Q50 ${75 + my} 59 ${60 + my}Z" fill="#7f1d1d"/><path d="M42.6 ${60.5 + my} L57.4 ${60.5 + my} L56.6 ${63.2 + my} L43.4 ${63.2 + my}Z" fill="#fff"/><ellipse cx="50" cy="${68.2 + my}" rx="4.2" ry="2.3" fill="#f87171"/>`);
  // Cropped to the head and shoulders, so the details are as big as the card allows.
  return `<svg viewBox="5 12 90 98" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false"><defs>${defs.join('')}</defs>${o.join('')}</svg>`;
}

// panel: null | 'typed' | 'guess'; guess / pick: the face chosen before the confirm;
// down: what each board last showed down, so a redraw knows which faces are newly down.
const gwLocal = { panel: null, guess: null, pick: null, down: {}, turnKey: '', turnSince: 0, clock: null, clockKey: null, typed: '', drama: null };

const gwT = (key, vars) => {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || key;
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
};
const gwFaceName = (x) => gwName(x, appState.lang);
// The number of the log's newest entry (the log keeps only its last few; a room saved before logSeq counts its length).
const gwLogSeq = (s) => (typeof s.logSeq === 'number' ? s.logSeq : (s.log || []).length);


/** A face as a card: its picture on its backdrop and its name. */
function gwCardInner(x) {
  return `<span class="gw-card__pic">${gwFaceSvg(x, GW_BACK[(Number(x.name) || 0) % GW_BACK.length])}</span><span class="gw-card__name">${escapeHTML(gwFaceName(x))}</span>`;
}

/**
 * A board: every face, the ones in `down` put down. `fall` holds the faces
 * that went down since this phone last drew the board - they are drawn up and
 * fall in gwFall once on screen. o: { tap, picked, guessing, small, fall }.
 */
function gwBoardHtml(s, down, o) {
  const opt = o || {};
  const d = down || [];
  const fall = opt.fall || [];
  const cols = gwCols(s.faces.length);
  const colsNarrow = gwColsNarrow(s.faces.length);
  const cards = s.faces.map((x, i) => {
    const isDown = d.indexOf(i) !== -1;
    const cls = ['gw-card',
      isDown && fall.indexOf(i) === -1 ? 'is-down' : '',
      opt.picked === i ? 'is-picked' : '',
      opt.guessing && !isDown ? 'is-aim' : ''].join(' ');
    // Not a player's board (watching, the TV): a tap does nothing, a hold still zooms.
    const attrs = opt.tap ? `type="button" data-gw-face="${i}"` : `type="button" tabindex="-1" data-gw-zoom="${i}"`;
    return `<button ${attrs} class="${cls}" aria-label="${escapeHTML(gwFaceName(x))}${isDown ? ' ✕' : ''}">${gwCardInner(x)}</button>`;
  }).join('');
  return `<div class="gw-board ${opt.small ? 'gw-board--small' : ''}" style="--gw-cols:${cols};--gw-cols-n:${colsNarrow}">${cards}</div>`;
}

/** Where the board takes the screen's height (a phone on its side, a laptop, the TV): 4 faces wide for 16, 6 for 24 and 30. */
const gwCols = (n) => (Number(n) === 16 ? 4 : 6);
/**
 * A phone held upright: 4 wide for 16 and 24, 5 for 30, so a card is 65-85px and its details can be
 * read (the owner, 29 Sep 2026). The board is taller than the screen then, and scrolls under the bar.
 */
const gwColsNarrow = (n) => (Number(n) === 30 ? 5 : 4);

/** A board's width over its height (a card is 5 wide by 6 tall), for sizing it off the screen's height. */
const gwAspect = (n) => {
  const cols = gwCols(n);
  const rows = Math.ceil(Number(n) / cols);
  return ((cols * 5) / (rows * 6)).toFixed(3);
};

/* --- a face held down opens big: every detail, to ask about it or answer ------ */

const gwHold = { timer: null, x: 0, y: 0, open: false, until: 0 };

/** The face at `i` on the board, big over the screen, until the finger lifts. */
function gwZoomOpen(i) {
  const state = duelRoomState();
  const s = state && state.shared;
  const x = s && s.faces && s.faces[i];
  if (!x) return;
  gwZoomClose();
  const el = document.createElement('div');
  el.className = 'gw-zoom';
  el.innerHTML = `<span class="gw-card gw-card--zoom">${gwCardInner(x)}</span>`;
  el.addEventListener('click', gwZoomClose);
  document.body.appendChild(el);
  gwHold.open = true;
  haptic('light');
}

function gwZoomClose() {
  document.querySelectorAll('.gw-zoom').forEach(z => z.remove());
  if (gwHold.open) gwHold.until = Date.now() + 450;
  gwHold.open = false;
}

/** Wires the hold on a screen: 380 ms on a face without moving opens it, lifting closes it, and the tap it ends in doesn't count. */
function gwWireHold(root) {
  if (!root || root._gwHold) return;
  root._gwHold = true;
  const stop = () => { clearTimeout(gwHold.timer); gwHold.timer = null; };
  root.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('[data-gw-face], [data-gw-zoom]');
    if (!card || !root.contains(card)) return;
    stop();
    gwHold.x = e.clientX; gwHold.y = e.clientY;
    const i = Number(card.getAttribute('data-gw-face') !== null ? card.getAttribute('data-gw-face') : card.getAttribute('data-gw-zoom'));
    gwHold.timer = setTimeout(() => { gwHold.timer = null; gwZoomOpen(i); }, 380);
  });
  root.addEventListener('pointermove', (e) => {
    if (gwHold.timer && Math.hypot(e.clientX - gwHold.x, e.clientY - gwHold.y) > 10) stop();
  });
  const end = () => { stop(); if (gwHold.open) gwZoomClose(); };
  root.addEventListener('pointerup', end);
  root.addEventListener('pointercancel', end);
  // A long press on a phone opens its own menu over a picture; not here.
  root.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-gw-face], [data-gw-zoom]')) e.preventDefault(); });
  document.addEventListener('pointerup', () => { if (gwHold.open) gwZoomClose(); });
}

/** The faces newly down on a board since this phone last drew it (none the first time, or after a new deal). */
function gwNewlyDown(key, down) {
  const was = gwLocal.down[key];
  gwLocal.down[key] = (down || []).slice();
  if (!was || typeof motionOff !== 'function' || motionOff()) return [];
  return (down || []).filter(i => was.indexOf(i) === -1);
}

/** The faces a question ruled out fall one after another, once they are on screen. */
function gwFall(root, fall) {
  if (!root || !fall.length) return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fall.forEach((i, n) => {
      const card = root.children[i];
      if (!card) return;
      setTimeout(() => card.classList.add('is-down'), Math.min(n, 14) * 55);
    });
  }));
}

/** The last question and its answer, or what the table is waiting for. */
function gwQaHtml(state, tv) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const q = s.q;
  const last = (s.log || [])[(s.log || []).length - 1];
  const pending = s.stage === 'answer' && q;
  // The last thing that happened: a wrong guess or a turn that passed, unless a question is waiting.
  if (!pending && last && last.kind === 'guess') {
    return `<div class="gw-qa gw-qa--wrong ${tv ? 'gw-qa--tv' : ''}">
        <span class="gw-qa__q">${escapeHTML(gwT('gw_guessed_wrong', { name: duelIso(names[last.seat] || ''), face: gwFaceName(s.faces[last.face]) }))}</span>
      </div>`;
  }
  if (!pending && last && last.kind === 'skip') {
    const said = last.stage === 'answer' ? 'gw_skipped_answer' : last.stage === 'flip' ? 'gw_skipped_flip' : 'gw_skipped';
    return `<div class="gw-qa ${tv ? 'gw-qa--tv' : ''}"><span class="gw-qa__q">${escapeHTML(gwT(said, { name: duelIso(names[last.seat] || '') }))}</span></div>`;
  }
  if (!q) return `<div class="gw-qa gw-qa--empty ${tv ? 'gw-qa--tv' : ''}"><span class="gw-qa__q">${escapeHTML(gwT('gw_first_q'))}</span></div>`;
  if (q.kind === 'guess') return `<div class="gw-qa gw-qa--empty ${tv ? 'gw-qa--tv' : ''}"><span class="gw-qa__q">${escapeHTML(gwT('gw_first_q'))}</span></div>`;
  const asker = duelIso(names[q.seat] || '');
  const text = q.kind === 'typed' ? gwT('gw_asked_list', { name: asker, q: q.text || '' }) : gwT('gw_asked_loud', { name: asker });
  const answered = typeof q.answer === 'boolean';
  const pop = answered && motionFirst(['gw-qa', roomDealKey(state), s.round, gwLogSeq(s), q.seat].join('|'));
  const thinking = `<span class="gw-qa__a is-wait gw-think">💭 ${escapeHTML(gwT('gw_thinking', { name: duelIso(names[1 - q.seat] || '') }))}<span class="gw-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>`;
  const ans = answered
    ? `<span class="gw-qa__a ${q.answer ? 'is-yes' : 'is-no'} ${pop ? 'is-in' : ''}">${escapeHTML(q.answer ? gwT('gw_yes') : gwT('gw_no'))}</span>` : thinking;
  return `<div class="gw-qa ${tv ? 'gw-qa--tv' : ''}"><span class="gw-qa__q" dir="auto">${escapeHTML(text)}</span>${ans}</div>`;
}

/** Every question so far, newest first: what the table has learnt about each face. */
function gwHistoryHtml(state) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const rows = (s.log || []).slice().reverse().filter(e => e.kind === 'loud' || e.kind === 'typed').map(e => {
    const q = e.kind === 'typed' ? '✍️ ' + (e.text || '') : '🗣️ ' + gwT('gw_loud_log');
    return `<li><b>${escapeHTML(names[e.seat] || '')}</b> ${escapeHTML(q)} <span class="${e.answer ? 'tx-success' : 'tx-danger'}">${escapeHTML(e.answer ? gwT('gw_yes') : gwT('gw_no'))}</span></li>`;
  }).join('');
  if (!rows) return '';
  return `<details class="gw-history"><summary>${escapeHTML(gwT('gw_history'))}</summary><ul>${rows}</ul></details>`;
}

/** The two pills: the seats, the wins in the room, and how many faces each has left up. */
function gwPills(state) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const scores = s.scores || {};
  const pill = (i) => ({
    name: names[i],
    score: scores[s.seats[i]] || 0,
    mark: `<span class="gw-dot gw-dot--${i + 1}">${escapeHTML(duelInitial(names[i]))}</span>`,
    sub: escapeHTML((s.seats[i] === Room.me && !state.youAreScreen ? gwT('xo_you') + ' · ' : '') +
      gwT('gw_left', { n: gwUp(s.faces, s.down[i]).length }))
  });
  return duelPillsHtml({ players: [pill(0), pill(1)], turn: s.phase === 'play' ? s.turn : -1, draws: null });
}

/** "Your face": the one the other player is looking for. */
function gwMineHtml(state, seat) {
  const s = state.shared;
  const face = (state.you || {}).face;
  if (typeof face !== 'number' || !s.faces[face]) return '';
  const other = duelRoomNames(state)[1 - seat] || '';
  return `<div class="gw-mine">
      <span class="gw-mine__card" data-gw-zoom="${face}">${gwCardInner(s.faces[face])}</span>
      <span class="gw-mine__text"><span class="eyebrow">${escapeHTML(gwT('gw_your_face'))}</span>
        <span class="field__hint">${escapeHTML(gwT('gw_your_face_hint', { name: duelIso(other) }))}</span></span>
    </div>`;
}

/** Both secret faces, turned over, once the game is over. */
function gwRevealHtml(state, tv) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const rev = s.reveal || [];
  const turn = motionFirst(['gw-reveal', roomDealKey(state), s.round].join('|'));
  // After a guess the faces turn once the drum roll has had its moment.
  const wait = turn && gwLocal.drama && gwLocal.drama.round === s.round ? Math.max(0, gwLocal.drama.until - Date.now()) : 0;
  return `<div class="gw-reveal ${tv ? 'gw-reveal--tv' : ''} ${turn ? 'is-turning' : ''}" ${turn ? `data-reveal-ms="${900 + wait}" style="--gw-wait:${wait}ms"` : ''}>
      ${[0, 1].map(i => typeof rev[i] === 'number' && s.faces[rev[i]] ? `
        <div class="gw-reveal__one" style="--at:${i * 260}ms">
          <span class="gw-card gw-card--big">${gwCardInner(s.faces[rev[i]])}</span>
          <span class="gw-reveal__who">${escapeHTML(gwT('gw_face_was', { name: names[i] || '' }))}</span>
        </div>` : '').join('')}
    </div>`;
}

/** The line under the pills: whose turn, or how the game ended. */
function gwStatus(state) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const seat = (s.seats || []).indexOf(Room.me);
  if (s.phase === 'over') {
    const r = s.result || {};
    if (r.reason === 'wrong') return '🏆 ' + gwT('duel_won', { name: duelIso(r.winnerName || '') }) + ' · ' + gwT('gw_won_wrong', { name: duelIso(r.loserName || '') });
    if (r.reason === 'guess') return gwT('gw_won_guess', { name: duelIso(r.winnerName || '') });
    return duelRoomResultLine(state, TRANSLATIONS[appState.lang] || {});
  }
  if (s.phase === 'pick') return gwT('gw_pick_all');
  if (seat === s.turn && !state.youAreScreen) {
    if (s.stage === 'answer') return gwT('gw_wait_answer', { name: duelIso(names[1 - seat] || '') });
    if (s.stage === 'flip') return gwT('gw_flip_title');
    return gwUp(s.faces, s.down[seat]).length === 1 ? gwT('gw_last_one') : gwT('gw_your_turn');
  }
  if (s.stage === 'answer' && seat === 1 - s.turn && !state.youAreScreen) return gwT('gw_q_from', { name: duelIso(names[s.turn] || '') });
  return gwT('gw_turn_of', { name: duelIso(names[s.turn] || '') });
}

/** What this phone can do now, in the bar under the board. */
function gwBarHtml(state, seat) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const seq = Number(s.turnSeq) || 0;
  const other = names[1 - seat] || '';
  if (s.phase === 'pick') {
    if (s.picked && s.picked[seat]) return `<p class="gw-bar__say">${escapeHTML(gwT('gw_pick_wait', { name: duelIso(other) }))}</p>`;
    const chosen = typeof gwLocal.pick === 'number' ? s.faces[gwLocal.pick] : null;
    return `<p class="gw-bar__say">${escapeHTML(gwT('gw_pick_title', { name: duelIso(other) }))}</p>
      ${chosen ? `<button type="button" class="btn btn--primary btn--lg" onclick="gwSendPick()">${escapeHTML(gwT('gw_pick_confirm', { name: gwFaceName(chosen) }))}</button>` : ''}`;
  }
  if (s.phase !== 'play') return '';
  const mine = s.turn === seat;
  if (!mine) {
    if (s.stage === 'answer') return gwAnswerCardHtml(state, seat);
    return `<p class="gw-bar__say gw-bar__say--quiet">${escapeHTML(gwT('gw_flip_any'))}</p>`;
  }
  if (s.stage === 'answer') {
    return `<p class="gw-bar__say gw-think">💭 ${escapeHTML(gwT('gw_thinking', { name: duelIso(other) }))}<span class="gw-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>`;
  }
  if (s.stage === 'flip') {
    return `<p class="gw-bar__say">${escapeHTML(gwT('gw_flip_now'))}</p>
      <button type="button" class="btn btn--primary btn--lg" onclick="duelAct('done', { seq: ${seq} })">${escapeHTML(gwT('gw_done'))}</button>`;
  }
  if (gwLocal.panel === 'typed') {
    return `<p class="gw-bar__say">${escapeHTML(gwT('gw_typed_title', { name: duelIso(other) }))}</p>
      <form class="gw-typed" onsubmit="event.preventDefault(); gwSendTyped(this)">
        <input class="input" name="q" maxlength="80" autocomplete="off" enterkeyhint="send" dir="auto"
          placeholder="${escapeHTML(gwT('gw_typed_ph'))}" value="${escapeHTML(gwLocal.typed || '')}" oninput="gwLocal.typed = this.value">
        <button type="submit" class="btn btn--primary btn--auto">${escapeHTML(gwT('gw_typed_send'))}</button>
      </form>
      <button type="button" class="btn btn--ghost btn--sm" onclick="gwPanel(null)">${escapeHTML(gwT('gw_back'))}</button>`;
  }
  if (gwLocal.panel === 'guess') {
    const chosen = typeof gwLocal.guess === 'number' ? s.faces[gwLocal.guess] : null;
    const warn = s.settings.wrong === 'turn' ? gwT('gw_guess_warn_turn') : gwT('gw_guess_warn_lose');
    return chosen
      ? `<p class="gw-bar__say"><b>${escapeHTML(gwT('gw_guess_sure', { name: gwFaceName(chosen) }))}</b> ${escapeHTML(warn)}</p>
         <div class="btn-row">
           <button type="button" class="btn btn--primary btn--lg" onclick="gwSendGuess()">${escapeHTML(gwT('gw_guess_confirm', { name: gwFaceName(chosen) }))}</button>
           <button type="button" class="btn btn--ghost" onclick="gwPanel(null)">${escapeHTML(gwT('gw_back'))}</button>
         </div>`
      : `<p class="gw-bar__say">🎯 ${escapeHTML(gwT('gw_guess_pick'))}</p>
         <button type="button" class="btn btn--ghost btn--sm" onclick="gwPanel(null)">${escapeHTML(gwT('gw_back'))}</button>`;
  }
  // No list (the owner, 29 Sep 2026): you think of the question. Out loud first - it is a party game.
  return `<p class="gw-bar__say gw-bar__say--quiet">${escapeHTML(gwT('gw_ask_hint'))}</p>
    <div class="gw-bar__row">
      <button type="button" class="btn btn--primary" onclick="duelAct('loud', { seq: ${seq} })">${escapeHTML(gwT('gw_loud'))}</button>
      <button type="button" class="btn btn--secondary" onclick="gwPanel('typed')">${escapeHTML(gwT('gw_typed'))}</button>
      <button type="button" class="btn btn--secondary" onclick="gwPanel('guess')">${escapeHTML(gwT('gw_guess'))}</button>
    </div>`;
}

/** The question put to this phone, big, beside its own secret face, with yes and no. */
function gwAnswerCardHtml(state, seat) {
  const s = state.shared;
  const q = s.q || {};
  const names = duelRoomNames(state);
  const face = (state.you || {}).face;
  const text = q.kind === 'typed' ? (q.text || '') : gwT('gw_loud_asked');
  // Your own face, big enough to check before you answer; hold it to see it bigger still.
  const card = typeof face === 'number' && s.faces[face] ? `<span class="gw-ask-me__face gw-mine__card" data-gw-zoom="${face}">${gwCardInner(s.faces[face])}</span>` : '';
  return `<div class="gw-ask-me ${motionFirst(['gw-askme', roomDealKey(state), s.round, s.turnSeq].join('|')) ? 'is-in' : ''}">
      ${card}
      <div class="gw-ask-me__text">
        <span class="eyebrow">${escapeHTML(gwT('gw_q_from', { name: duelIso(names[s.turn] || '') }))}</span>
        <span class="gw-ask-me__q" dir="auto">${escapeHTML(text)}</span>
      </div>
    </div>
    <div class="btn-row gw-ask-me__btns">
      <button type="button" class="btn btn--success btn--lg" onclick="gwSendAnswer(true)">${escapeHTML(gwT('gw_yes'))}</button>
      <button type="button" class="btn btn--danger btn--lg" onclick="gwSendAnswer(false)">${escapeHTML(gwT('gw_no'))}</button>
    </div>`;
}

/** Yes or no, as the player says: the phone doesn't know the question, so it doesn't judge the answer. */
function gwSendAnswer(yes) {
  const state = duelRoomState();
  if (!state || state.game !== 'guesswho') return;
  haptic('medium');
  duelAct('answer', { yes: yes, seq: state.shared.turnSeq });
}

function gwSendTyped(form) {
  const s = (duelRoomState() || {}).shared || {};
  const input = form.querySelector('input[name="q"]');
  const text = String(input ? input.value : '').replace(/\s+/g, ' ').trim();
  if (!text) { if (input) input.focus(); return; }
  gwLocal.typed = '';
  gwLocal.panel = null;
  haptic('light');
  duelAct('typed', { text: text, seq: s.turnSeq });
}

/* --- the table's moments: the answer bubble and the guess's drum roll ------------- */

function gwSound(kind) {
  try {
    if (typeof fxCtx !== 'function' || typeof fxTone !== 'function') return;
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'yes') {
      fxTone('triangle', [[0, 523]], [[0, 0], [0.01, 0.22], [0.14, 0.001]], at);
      fxTone('triangle', [[0, 784]], [[0, 0], [0.01, 0.22], [0.2, 0.001]], at + 0.12);
    } else if (kind === 'no') {
      fxTone('triangle', [[0, 392], [0.2, 300]], [[0, 0], [0.01, 0.22], [0.22, 0.001]], at);
      fxTone('triangle', [[0, 262], [0.2, 200]], [[0, 0], [0.01, 0.2], [0.26, 0.001]], at + 0.16);
    } else if (kind === 'roll') {
      // A snare roll that swells: short noise taps, closer and louder.
      for (let i = 0; i < 26; i++) {
        const t = at + i * 0.075 - i * i * 0.0006;
        const v = 0.03 + i * 0.004;
        fxNoise('bandpass', 1800, 0.9, [[0, 0], [0.004, v], [0.05, 0.001]], t);
      }
    } else if (kind === 'hit') {
      fxTone('sine', [[0, 140], [0.3, 60]], [[0, 0], [0.008, 0.4], [0.35, 0.001]], at);
      fxNoise('lowpass', 2400, 0.7, [[0, 0], [0.004, 0.16], [0.25, 0.001]], at);
    }
  } catch (e) {}
}

/** A layer over the screen for a moment: gone by itself, whatever happens underneath. */
function gwOverlay(html, cls, ms) {
  const el = document.createElement('div');
  el.className = 'gw-over ' + (cls || '');
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('is-out'), ms);
  setTimeout(() => el.remove(), ms + 400);
  return el;
}

/**
 * The newest thing in the log, played once per phone: an answer pops as a
 * big bubble; a guess gets the drum roll, then right or wrong. `loud`: this
 * screen plays the sound (the TV when there is one, else the two playing).
 */
const gwMomentSeen = {};
function gwMoments(state, loud) {
  const s = state.shared || {};
  const seq = gwLogSeq(s);
  // The first sight of a game on this page (a reload, a late join, the TV coming on) plays nothing:
  // the last answer or the whole drum roll came back with its sound. Seen on every render, a game's
  // own first state included, so its first answer still plays when it comes.
  const gameKey = [roomDealKey(state), s.tourMid || '', s.round].join('|');
  if (gwMomentSeen[gameKey] === undefined) {
    gwMomentSeen[gameKey] = seq;
    // Its cheer and its secret faces turning, if it is already over.
    duelRoomFirstSight(state, ['gw', roomDealKey(state), s.round].join('|'),
      { motion: [s.phase === 'over' && ['gw-reveal', roomDealKey(state), s.round].join('|')] });
    return;
  }
  if (seq <= gwMomentSeen[gameKey]) return;
  gwMomentSeen[gameKey] = seq;
  const log = s.log || [];
  const last = log[log.length - 1];
  if (!last || s.phase === 'pick') return;
  const key = ['gw-moment', roomDealKey(state), s.round, seq].join('|');
  if (!duelOnce(key)) return;
  const quiet = typeof motionOff === 'function' && motionOff();
  const names = duelRoomNames(state);
  if (last.kind === 'loud' || last.kind === 'typed') {
    if (loud) gwSound(last.answer ? 'yes' : 'no');
    if (quiet) return;
    gwOverlay(`<span class="gw-bubble ${last.answer ? 'is-yes' : 'is-no'}">${escapeHTML(last.answer ? gwT('gw_yes') : gwT('gw_no'))}</span>`, 'gw-over--bubble', 1100);
    return;
  }
  if (last.kind === 'guess') {
    const face = s.faces[last.face];
    if (!face) return;
    gwLocal.drama = { round: s.round, until: Date.now() + (quiet ? 0 : 2400) };
    if (quiet) { if (loud) gwSound('hit'); return; }
    if (loud) gwSound('roll');
    const el = gwOverlay(`<div class="gw-drama">
        <span class="gw-drama__who">${escapeHTML(gwT('gw_guess_is', { name: duelIso(names[last.seat] || ''), face: gwFaceName(face) }))}</span>
        <span class="gw-card gw-card--big gw-drama__card">${gwCardInner(face)}</span>
        <span class="gw-drama__verdict ${last.right ? 'is-right' : 'is-wrong'}">${escapeHTML(last.right ? gwT('gw_guess_right') : gwT('gw_guess_wrong'))}</span>
      </div>`, 'gw-over--drama', 3300);
    setTimeout(() => { el.classList.add('is-verdict'); if (loud) gwSound('hit'); }, 2200);
  }
}

function gwRedraw() {
  const el = document.getElementById('view-room-guesswho');
  if (el) delete el.dataset.sig;
  if (Room.state && Room.state.game === 'guesswho') routeRoomState(Room.state);
}

function gwPanel(p) {
  gwLocal.panel = p;
  gwLocal.guess = null;
  haptic('light');
  gwRedraw();
}

function gwSendGuess() {
  const s = (duelRoomState() || {}).shared || {};
  const face = gwLocal.guess;
  gwLocal.panel = null;
  gwLocal.guess = null;
  if (typeof face !== 'number') return;
  haptic('medium');
  duelAct('guess', { face: face, seq: s.turnSeq });
}

function gwSendPick() {
  const face = gwLocal.pick;
  gwLocal.pick = null;
  if (typeof face !== 'number') return;
  haptic('medium');
  duelAct('pick', { face: face });
}

/** A tap on a face: choosing one to guess or to hide, or putting it down (or back up) by hand. */
function gwTapFace(card) {
  const state = duelRoomState();
  if (!state || state.game !== 'guesswho') return;
  const s = state.shared;
  const seat = (s.seats || []).indexOf(Room.me);
  if (seat === -1 || state.youAreScreen) return;
  const i = Number(card.getAttribute('data-gw-face'));
  if (Date.now() < gwHold.until) return;
  if (s.phase === 'pick') {
    if (s.picked && s.picked[seat]) return;
    gwLocal.pick = i;
    haptic('light');
    gwRedraw();
    return;
  }
  if (s.phase !== 'play') return;
  // What the screen shows, not the server's last word: a quick second tap on a
  // face just put down lifts it back before the room has answered the first.
  const isDown = card.classList.contains('is-down');
  if (gwLocal.panel === 'guess' && s.turn === seat && s.stage === 'ask') {
    if (isDown) return;
    gwLocal.guess = i;
    haptic('light');
    gwRedraw();
    return;
  }
  // By hand: drawn at once, and the room's board confirms it (already known here, so it doesn't fall again).
  card.classList.toggle('is-down', !isDown);
  const key = [state.code, s.dealId, seat].join('|');
  const known = (gwLocal.down[key] || s.down[seat]).filter(x => x !== i);
  gwLocal.down[key] = isDown ? known : known.concat([i]);
  haptic('light');
  duelAct('flip', { face: i, down: !isDown });
}

/* --- the lobby: the host's choices, remembered on their phone ----------------- */

const gwRoomOpts = () => recallOptions('guesswhoRoom', { size: 24, pick: 'random', wrong: 'lose', turnClock: 0 });

function setGwRoomOpt(key, value) {
  rememberOptions('guesswhoRoom', { [key]: value });
  duelLobbyRedraw();
}

function gwLobbySeg(label, key, values, current, hint) {
  return `<div class="field">
      <label class="field__label">${escapeHTML(label)}</label>
      <div class="segmented" role="group">
        ${values.map(v => `<button type="button" class="segmented__item ${String(v[0]) === String(current) ? 'is-active' : ''}" onclick="setGwRoomOpt('${key}', ${typeof v[0] === 'string' ? `'${v[0]}'` : v[0]})">${escapeHTML(v[1])}</button>`).join('')}
      </div>
      ${hint ? `<p class="field__hint">${escapeHTML(hint)}</p>` : ''}
    </div>`;
}

/* --- the phone's clock and the host's skip --------------------------------------- */

function gwStopClock() {
  if (gwLocal.clock) gwLocal.clock.stop();
  gwLocal.clock = null;
  gwLocal.clockKey = null;
}

function gwTickClock(state) {
  const s = state.shared || {};
  const endsAt = s.phase === 'play' || s.phase === 'pick' ? s.endsAt : null;
  const paint = () => {
    const left = endsAt ? Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000)) : 0;
    document.querySelectorAll('[data-gw-clock]').forEach(el => {
      el.textContent = '⏱️ ' + left;
      el.classList.toggle('badge--danger', left <= 5);
    });
    return left;
  };
  if (!endsAt) { gwStopClock(); return; }
  paint();
  if (gwLocal.clockKey === endsAt && gwLocal.clock && gwLocal.clock.isRunning()) return;
  gwStopClock();
  gwLocal.clockKey = endsAt;
  gwLocal.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000)),
    onTick: () => {
      const left = paint();
      const st = duelRoomState();
      const seats = (st && st.shared.seats) || [];
      // Picking, the clock is everyone's who hasn't picked yet; playing, the one up's.
      const mine = st && st.game === 'guesswho' && (st.shared.phase === 'pick'
        ? seats.indexOf(Room.me) !== -1 && !(st.shared.picked || [])[seats.indexOf(Room.me)]
        : seats[st.shared.turn] === Room.me);
      if (left > 0 && left <= 5 && (st && (st.youAreScreen || mine))) playSound('tick');
    },
    onEnd: () => { gwLocal.clock = null; paint(); }
  });
}

/** The host's way on for a phone that went quiet: after 40 seconds on one turn, or at once for one that's away. */
function gwHostRow(state, tv) {
  const s = state.shared || {};
  if (!roomCanMoveOn(state) || (s.phase !== 'play' && s.phase !== 'pick')) return '';
  const key = [state.code, s.round, s.turnSeq].join('|');
  if (gwLocal.turnKey !== key) {
    gwLocal.turnKey = key; gwLocal.turnSince = Date.now();
    // The 40 s come round with nothing pushed: a redraw for them (roomQuietRedraw, JS_Room.html).
    roomQuietRedraw(gwLocal, 'guesswho');
  }
  const waitingOn = s.phase === 'pick' ? (s.seats || []).filter((id, k) => !s.picked[k])
    : [s.stage === 'answer' ? s.seats[1 - s.turn] : s.seats[s.turn]];
  const quiet = waitingOn.some(id => {
    const p = (state.players || []).find(x => x.id === id);
    return p && !p.bot && id !== Room.me && (!p.online || Date.now() - gwLocal.turnSince > 40000);
  });
  if (!quiet) return '';
  const label = '⏭️ ' + gwT('gw_play_for');
  const press = `duelAct('skipTurn', { seq: ${Number(s.turnSeq) || 0} })`;
  return tv ? `<div class="tv-actions">${tvBtn(label, press, 'ghost')}</div>` : roomHostRow([[label, press]]);
}

/** Everything the server said that this phone shows; presence is refreshed in place. */
function gwSig(state) {
  const s = state.shared || {};
  return [s.dealId || '', s.round, s.phase, s.turn, s.stage, s.turnSeq, JSON.stringify(s.down || []), (s.log || []).length,
    JSON.stringify(s.q || null), JSON.stringify(s.picked || null), JSON.stringify(s.line || []), s.champ, JSON.stringify(s.scores || {}),
    (state.players || []).map(p => p.id + ':' + p.name + ':' + (p.bot || '')).join(','), s.endsAt || '',
    JSON.stringify(state.you || null), state.youAreHost, appState.lang].join('|');
}

ROOM_GAMES.guesswho = {
  // No computer players (the owner, 29 Sep 2026): they could only ask from a list.
  // Someone who joins mid-game joins the line and watches (routeRoomState).
  lateJoin: true,

  lobbyOptions(state) {
    const o = gwRoomOpts();
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(gwT('gw_lobby_hint'))}</p>`;
    return `<div class="card card--tight">
        ${gwLobbySeg(gwT('gw_lobby_size'), 'size', GW_SIZES.map(n => [n, String(n)]), o.size)}
        ${gwLobbySeg(gwT('gw_lobby_pick'), 'pick', [['random', gwT('gw_pick_random')], ['choose', gwT('gw_pick_choose')]], o.pick)}
        ${gwLobbySeg(gwT('gw_lobby_wrong'), 'wrong', [['lose', gwT('gw_wrong_lose')], ['turn', gwT('gw_wrong_turn')]], o.wrong)}
        ${gwLobbySeg('⏱️ ' + gwT('gw_lobby_clock'), 'turnClock', GW_CLOCKS.map(v => [v, v ? v + '″' : gwT('gw_clock_off')]), o.turnClock)}
        ${typeof tourModeOf === 'function' && tourModeOf(state.game) === 'tour' && tourCanStart(state) ? '' : `<p class="field__hint" style="text-align:center">${escapeHTML(gwT('gw_lobby_hint'))}</p>`}
      </div>`;
  },
  startPayload() {
    const o = gwRoomOpts();
    return { size: o.size, pick: o.pick, wrong: o.wrong, turnClock: o.turnClock };
  },

  render(state) {
    if (appState.currentView !== 'room-guesswho') setView('room-guesswho');
    const el = document.getElementById('view-room-guesswho');
    if (!el) return;
    const s = state.shared;
    if (!s || !Array.isArray(s.faces)) return;
    const seat = state.youAreScreen ? -1 : (s.seats || []).indexOf(Room.me);
    // A choice half made belongs to its own turn.
    const turnKey = [state.code, s.round, s.turnSeq].join('|');
    if (gwLocal.forTurn !== turnKey) { gwLocal.forTurn = turnKey; gwLocal.panel = null; gwLocal.guess = null; }
    if (s.phase !== 'pick') gwLocal.pick = null;
    const boardKey = (i) => [state.code, s.dealId, i].join('|');
    const t = TRANSLATIONS[appState.lang] || {};
    const sig = gwSig(state) + '#' + gwLocal.panel + '#' + gwLocal.guess + '#' + gwLocal.pick;
    // The answer bubble and the guess's drum roll, before the frame: the reveal under it waits for the roll.
    gwMoments(state, duelRoomLoud(state));
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#view-room-guesswho .gw-typed');
    let falls = [];
    const rebuilt = renderRoomFrame(el, sig, () => {
      const clock = s.endsAt && (s.phase === 'play' || s.phase === 'pick') ? `<span class="badge badge--accent" data-gw-clock></span>` : '';
      const head = `<div class="duel-head">${gwPills(state)}
          <p class="duel-status ${s.phase === 'over' ? 'is-done' : ''} ${seat === s.turn && s.phase === 'play' ? 'is-mine' : ''}">${escapeHTML(gwStatus(state))} ${clock}</p></div>`;
      if (s.phase === 'over') {
        return `<div class="gw">${head}
            ${gwRevealHtml(state)}
            ${duelRoomOverHtml(state, t)}
            ${duelRoomLineHtml(state, t)}
            ${(state.players || []).length > 2 ? renderScoreboard(s.board) : ''}
            ${roomShareBtnHtml(state, s.board)}
            ${renderRoomPlayerStrip(state)}
          </div>`;
      }
      if (seat !== -1) {
        const myDown = s.phase === 'pick' ? [] : s.down[seat];
        const fall = s.phase === 'play' ? gwNewlyDown(boardKey(seat), myDown) : [];
        falls = [{ sel: '.gw-board', fall: fall }];
        return `<div class="gw gw--seated">
            <div class="gw-layout">
              <div class="gw-layout__board" style="--gw-aspect:${gwAspect(s.faces.length)}">
                ${gwBoardHtml(s, myDown, { tap: true, fall: fall, picked: s.phase === 'pick' ? gwLocal.pick : gwLocal.guess, guessing: gwLocal.panel === 'guess' })}
                <p class="gw-hold-hint">🔍 ${escapeHTML(gwT('gw_hold_hint'))}</p>
              </div>
              <div class="gw-layout__side">
                ${head}
                ${s.phase === 'play' ? gwMineHtml(state, seat) + gwQaHtml(state) : ''}
                <div class="gw-bar">${gwBarHtml(state, seat)}</div>
                <div data-gw-host></div>
                ${gwHistoryHtml(state)}
                ${duelRoomLineHtml(state, t)}
                ${renderRoomPlayerStrip(state)}
              </div>
            </div>
          </div>`;
      }
      // Watching: both boards, and the question between them.
      const f0 = s.phase === 'play' ? gwNewlyDown(boardKey(0), s.down[0]) : [];
      const f1 = s.phase === 'play' ? gwNewlyDown(boardKey(1), s.down[1]) : [];
      falls = [{ sel: '[data-gw-seat="0"] .gw-board', fall: f0 }, { sel: '[data-gw-seat="1"] .gw-board', fall: f1 }];
      const names = duelRoomNames(state);
      return `<div class="gw gw--watch">${head}
          ${s.phase === 'play' ? gwQaHtml(state) : `<div class="waiting-note">${escapeHTML(gwT('gw_pick_all'))}</div>`}
          ${duelRoomWatchNote(state, t)}
          <div class="gw-two">
            ${[0, 1].map(i => `<div class="gw-two__one" data-gw-seat="${i}"><div class="eyebrow">${escapeHTML(gwT('gw_board_of', { name: names[i] || '' }))}</div>
              ${gwBoardHtml(s, s.phase === 'play' ? s.down[i] : [], { small: true, fall: i ? f1 : f0 })}</div>`).join('')}
          </div>
          <div data-gw-host></div>
          ${gwHistoryHtml(state)}
          ${duelRoomLineHtml(state, t)}
          ${renderRoomPlayerStrip(state)}
        </div>`;
    });
    refreshRoomPlayerStrip(el, state);
    // A question half typed keeps its place when the board is redrawn under it.
    if (rebuilt && typing && gwLocal.panel === 'typed') {
      const input = el.querySelector('.gw-typed input');
      if (input) { input.focus(); try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {} }
    }
    const host = el.querySelector('[data-gw-host]');
    if (host) { const html = gwHostRow(state); if (host._html !== html) { host.innerHTML = html; host._html = html; } }
    gwTickClock(state);
    if (!rebuilt) return;
    falls.forEach(f => gwFall(el.querySelector(f.sel), f.fall));
    gwWireHold(el);
    if (!el._gwWired) {
      el._gwWired = true;
      el.addEventListener('click', (e) => {
        const card = e.target.closest('[data-gw-face]');
        if (card && el.contains(card)) gwTapFace(card);
      });
    }
    duelPillsAfter(el, 'gw|' + state.code, {
      turn: s.phase === 'play' ? s.turn : -1,
      scores: [(s.scores || {})[s.seats[0]] || 0, (s.scores || {})[s.seats[1]] || 0]
    });
    const myTurn = s.phase === 'play' && seat === s.turn && s.stage === 'ask';
    const mustAnswer = s.phase === 'play' && seat === 1 - s.turn && s.stage === 'answer';
    if ((myTurn || mustAnswer) && duelOnce(['gw-turn', state.code, s.turnSeq].join('|'))) { haptic('medium'); playSound('tick'); }
    if (s.phase === 'over') duelRoomCheer(el, state, ['gw', roomDealKey(state), s.round].join('|'));
  },
  // A question is not a new step to scroll to; a new game and the end of one are.
  actionKey: (state) => [state.code, (state.shared || {}).round, (state.shared || {}).phase === 'over' ? 'over' : 'on'].join('|')
};

onRoomClocksReset(() => {
  gwZoomClose();
  gwStopClock();
  roomQuietStop(gwLocal);
  gwLocal.turnKey = '';
  gwLocal.typed = '';
  gwLocal.panel = null;
  gwLocal.guess = null;
  gwLocal.pick = null;
});

/* --- the TV: both boards, the question between them ------------------------------ */

TV_GAMES.guesswho = {
  sig: (state) => gwSig(state),
  frame(state, t) {
    const s = state.shared || {};
    if (!Array.isArray(s.faces)) return tvLookAtPhones(t);
    gwMoments(state, true);
    const names = duelRoomNames(state);
    const key = (i) => ['tv', state.code, s.dealId, i].join('|');
    const f = [0, 1].map(i => (s.phase === 'play' ? gwNewlyDown(key(i), s.down[i]) : []));
    gwLocal.tvFalls = f;
    const board = (i) => `<div class="gw-tv__board" data-gw-seat="${i}">
        <div class="tv-name gw-tv__name"><span>${escapeHTML(names[i] || '')}</span><i>${escapeHTML(gwT('gw_left', { n: gwUp(s.faces, s.down[i]).length }))}</i></div>
        ${gwBoardHtml(s, s.phase === 'play' ? s.down[i] : [], { small: true, fall: f[i] })}
      </div>`;
    const clock = s.endsAt && (s.phase === 'play' || s.phase === 'pick') ? `<span class="tv-pill" data-gw-clock></span>` : '';
    const mid = s.phase === 'over'
      ? `${gwRevealHtml(state, true)}<div class="tv-title tv-center-text">${escapeHTML(gwStatus(state))}</div>${duelRoomOverHtml(state, t, true)}`
      : `<div class="tv-scale">${gwPills(state)}</div>
         <div class="tv-title tv-center-text">${escapeHTML(gwStatus(state))} ${clock}</div>
         ${s.phase === 'play' ? gwQaHtml(state, true) : ''}
         ${gwHostRow(state, true)}`;
    // The TV's frame is the room's colour; the game keeps its own.
    return `<div class="gw-tv" data-accent="teal" style="--gw-aspect:${gwAspect(s.faces.length)}">
        ${board(0)}
        <div class="gw-tv__mid">${mid}<div class="tv-scale">${duelRoomLineHtml(state, t, true)}</div></div>
        ${board(1)}
      </div>`;
  },
  after(state, rebuilt) {
    gwTickClock(state);
    const view = document.getElementById('view-room-tv');
    if (!rebuilt || !view) return;
    const f = gwLocal.tvFalls || [[], []];
    [0, 1].forEach(i => gwFall(view.querySelector('[data-gw-seat="' + i + '"] .gw-board'), f[i]));
    duelPillsAfter(view, 'gwtv|' + state.code, {
      turn: state.shared.phase === 'play' ? state.shared.turn : -1,
      scores: [(state.shared.scores || {})[state.shared.seats[0]] || 0, (state.shared.scores || {})[state.shared.seats[1]] || 0]
    });
    // Keyed on the deal: a new game from the hub starts at round 1 again.
    if (state.shared.phase === 'over') duelRoomCheer(view, state, ['gw', roomDealKey(state), state.shared.round].join('|'));
  }
};
</script>
