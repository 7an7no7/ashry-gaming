<script>
/* ============================================================================
   A RESULT YOU CAN SEND — the share card
   ----------------------------------------------------------------------------
   A result told as text is a wall of characters in WhatsApp. This draws the
   same result as a picture the table actually looks at: the app's violet
   ground, the brand mark, the game's name, up to eight rows of name and score,
   and the link at the foot.

   Nothing here runs until a share button is pressed. The canvas is built,
   used and thrown away inside shareResultCard - a result screen costs nothing
   until somebody wants to send it.

   Three ways out, in order: the phone's share sheet with the picture attached
   (navigator.canShare({ files })), a download where that isn't offered, and
   the plain text through shareOrCopy where neither works - which is exactly
   what the app did before this existed, so nobody loses anything.

   The colours are read off the mark in the page (Logo.html) rather than
   written again here, so the card follows whatever colourway the app ships
   with. Arabic is drawn with ctx.direction = 'rtl'; every browser the app
   supports shapes and joins it on a canvas the same way it does in the DOM.
   ========================================================================== */

const SHARE_CARD = { w: 1080, h: 1920, maxRows: 8, hardMaxRows: 10 };

/**
 * The brand's colours, taken from the mark's own gradient in Logo.html: the
 * three violet stops of the ground, the amber of the full stop, and the ink.
 * Falls back to the deep colourway if the mark is not on the page.
 */
function shareCardColours() {
  const mark = document.getElementById('ashry-mark');
  const stops = mark ? [...mark.querySelectorAll('#ashry-g-m stop')].map(s => s.getAttribute('stop-color')) : [];
  // The full stop after the name. The mark also carries two white circles as
  // light, so the coloured one is the one that isn't the ink.
  const token = mark && [...mark.querySelectorAll('circle[fill^="#"]')]
    .map(c => c.getAttribute('fill'))
    .find(f => f && f.toLowerCase() !== '#ffffff');
  return {
    ground: stops.length === 3 ? stops : ['#6d28d9', '#4c1d95', '#2e1065'],
    token: token || '#fbbf24',
    ink: '#ffffff'
  };
}

/**
 * The mark as an image the canvas can draw. The page holds it as an inline
 * <symbol>, which a canvas cannot use directly, so its contents are wrapped in
 * a standalone <svg> and handed over as a data URL - the gradients and the
 * shadow are defined inside the symbol, so they travel with it, and a data URL
 * leaves the canvas untainted. Resolves to null rather than throwing: a card
 * without the mark is better than no card.
 */
function shareCardMark() {
  return new Promise((resolve) => {
    const symbol = document.getElementById('ashry-mark');
    if (!symbol || !symbol.innerHTML) return resolve(null);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">' +
                symbol.innerHTML + '</svg>';
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

/** A line shortened with an ellipsis until it fits: a long name must not run off the card. */
function shareCardFit(ctx, text, maxWidth) {
  let s = String(text == null ? '' : text);
  if (ctx.measureText(s).width <= maxWidth) return s;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
  return s + '…';
}

/** The plain words of a line that may carry markup (a solo result's lines are HTML). */
function shareCardText(html) {
  // Parsed in an inert document: a room's footer carries players' names, and a div
  // of this page, even never attached, loads an <img> and runs its onerror.
  const doc = new DOMParser().parseFromString(String(html == null ? '' : html), 'text/html');
  return ((doc.body && doc.body.textContent) || '').replace(/\s+/g, ' ').trim();
}

/**
 * Draws the card and resolves with a PNG blob, or null if the browser would
 * not give one up.
 *   o: { title, icon, rows: [{ name, value, unit? } | 'a line'], footer, board, unit }
 * unit (or a row's own): a kind podiumUnitWord counts after each number (JS_Motion.html).
 * Five rows or fewer make the chat-sized 4:5 card (shareCardLayout).
 * board (optional, شطرنج): { board: 64 piece codes, last: { from, to }, orient }
 * - the position drawn big in the middle, the rows under it. A card without it
 * is drawn exactly as it always was.
 */
async function drawShareCard(o) {
  // A game that draws a picture of its own (خمّن الدولة's route, 7 Oct 2026) hands its drawer over.
  if (typeof o.draw === 'function') return o.draw();
  if (o.board && typeof chDrawBoardCanvas === 'function') return drawShareBoardCard(o);
  const c = shareCardColours();
  const rtl = (appState.lang || 'ar') === 'ar';
  const rows = (o.rows || []).slice(0, Math.min(SHARE_CARD.hardMaxRows, o.maxRows || SHARE_CARD.maxRows));
  // The night's card: a row of the evening's games and the date under the champion's line
  // (o.games, o.date; the owner's pick 1268) take some of the plate's room.
  const strip = (o.games || []).filter(Boolean).slice(0, 12);
  // برنامج السهرة's card (1328): each game a { icon, name } with its winner's name under the icon.
  const named = strip.some(x => x && typeof x === 'object' && x.name);
  const extra = strip.length || o.date ? (named ? 220 : 160) : 0;
  // A chat-sized card (the owner's pick 1270, 7 Oct 2026): five rows or fewer make a
  // 1080x1350 (4:5) card, which WhatsApp shows whole in the chat; a longer board, or the
  // night's card with its games and date under the rows, keeps the tall 9:16 one.
  const L = shareCardLayout(rows.length <= 5 && !extra);
  const H = L.h;
  const canvas = document.createElement('canvas');
  canvas.width = SHARE_CARD.w;
  canvas.height = H;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx) return null;

  // The app's own face needs its own font: without this the card is drawn in
  // whatever the canvas defaults to, which is not what the app looks like.
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}

  const font = (weight, px) => { ctx.font = weight + ' ' + px + 'px "IBM Plex Sans Arabic", "Segoe UI", sans-serif'; };
  ctx.direction = rtl ? 'rtl' : 'ltr';
  ctx.textBaseline = 'middle';

  // The ground, corner to corner, and a soft light in the top corner - the
  // same shape as the mark's own highlight.
  const ground = ctx.createLinearGradient(0, 0, SHARE_CARD.w, H);
  ground.addColorStop(0, c.ground[0]);
  ground.addColorStop(0.52, c.ground[1]);
  ground.addColorStop(1, c.ground[2]);
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, SHARE_CARD.w, H);
  const light = ctx.createRadialGradient(240, 200, 0, 240, 200, 900);
  light.addColorStop(0, 'rgba(255,255,255,0.16)');
  light.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = light;
  ctx.fillRect(0, 0, SHARE_CARD.w, H);

  // The rows, on a plate of their own so the names read against the ground.
  // The plate has a fixed room between the title and the mark, so the rows
  // share it: three names are large, ten are smaller, and neither runs off
  // the card. Whatever room they leave is split above and below, so a card
  // with three names is not three names and a field of nothing.
  const plateRoom = L.plateRoom - extra;
  const pad = 96;
  const rowH = Math.min(132, Math.floor((plateRoom - 56) / Math.max(1, rows.length)));
  const rowFont = Math.max(30, Math.min(54, Math.round(rowH * 0.42)));
  const slack = Math.round(Math.max(0, (plateRoom - 56) - rows.length * rowH) / 2);
  const plateTop = L.plateTop + slack;

  const mid = SHARE_CARD.w / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = c.ink;

  // A drawn icon (أونو, الدومينو) is an image; an emoji is text.
  const art = await artIconImage(o.icon, 512);
  if (art) ctx.drawImage(art, mid - L.icon / 2, L.iconY + slack - L.icon / 2, L.icon, L.icon);
  else { font('900', Math.round(L.icon * 0.8)); ctx.fillText(String(o.icon || '🏆'), mid, L.iconY + slack); }

  font('900', L.titleFont);
  ctx.fillText(shareCardFit(ctx, o.title || '', SHARE_CARD.w - 140), mid, L.titleY + slack);
  if (rows.length) {
    const plateH = rows.length * rowH + 56;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(72, plateTop, SHARE_CARD.w - 144, plateH, 48); ctx.fill(); }
    else ctx.fillRect(72, plateTop, SHARE_CARD.w - 144, plateH);

    rows.forEach((row, i) => {
      const y = plateTop + 28 + rowH * i + rowH / 2;
      const name = typeof row === 'string' ? row : (row.name || '');
      const value = typeof row === 'string' ? '' : (row.value == null ? '' : String(row.value));
      if (i) {
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(120, y - rowH / 2, SHARE_CARD.w - 240, 2);
      }
      ctx.fillStyle = c.ink;
      font(i === 0 && value !== '' ? '900' : '700', rowFont);
      ctx.textAlign = rtl ? 'right' : 'left';
      const nameEdge = rtl ? SHARE_CARD.w - pad : pad;
      ctx.fillText(shareCardFit(ctx, name, SHARE_CARD.w - pad * 2 - (value ? 280 : 0)), nameEdge, y);
      if (value !== '') {
        font('900', rowFont + 4);
        ctx.fillStyle = c.token;
        ctx.textAlign = rtl ? 'left' : 'right';
        // A number is drawn left to right, as on the board card: in an Arabic
        // line -12 came out as «12-». A value with words keeps the line's direction.
        const numeric = /^[-+]?[\d.,/:\s]+$/.test(String(value));
        // Its unit after it, smaller (the owner's pick 1269): «١٢ نقطة», «٣ ضربات» - the word
        // on the inner side of the number, in the line's reading order.
        const word = numeric && typeof podiumUnitWord === 'function' ? podiumUnitWord(row.unit !== undefined ? row.unit : o.unit, value) : '';
        let edge = rtl ? pad : SHARE_CARD.w - pad;
        if (word) {
          font('700', Math.round(rowFont * 0.62));
          ctx.fillStyle = 'rgba(255,255,255,0.82)';
          const w = shareCardFit(ctx, word, 150);
          ctx.fillText(w, edge, y + 2);
          edge += (rtl ? 1 : -1) * (ctx.measureText(w).width + 14);
          font('900', rowFont + 4);
          ctx.fillStyle = c.token;
        }
        if (numeric) ctx.direction = 'ltr';
        ctx.fillText(shareCardFit(ctx, value, word ? 150 : 260), edge, y);
        if (numeric) ctx.direction = rtl ? 'rtl' : 'ltr';
      }
    });
  }

  // A line of the game's own (a daily's streak, the date it was played).
  const foot = shareCardText(o.footer);
  if (foot) {
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    font('700', 46);
    ctx.textAlign = 'center';
    // Clamped, so a full plate of ten names does not push this line into the mark.
    ctx.fillText(shareCardFit(ctx, foot, SHARE_CARD.w - 160), mid,
                 Math.min(L.footMax - extra, plateTop + rows.length * rowH + L.footGap));
  }
  if (extra) await drawShareNightStrip(ctx, strip, o.date, Math.min(L.footMax - extra, plateTop + rows.length * rowH + L.footGap) + (foot ? 84 : 0), font);

  // The mark and the link, at the foot.
  const mark = await shareCardMark();
  if (mark) ctx.drawImage(mark, mid - L.mark / 2, H - L.markUp, L.mark, L.mark);
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  font('700', L.linkFont);
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';        // a URL is left-to-right in either language
  ctx.fillText(shareCardFit(ctx, appLink().replace(/^https?:\/\//, ''), SHARE_CARD.w - 120), mid, H - L.linkUp);

  return await new Promise((resolve) => {
    try { canvas.toBlob(resolve, 'image/png'); } catch (e) { resolve(null); }
  });
}

/** Where everything sits on the card: the tall 9:16 one, or the chat-sized 4:5 one (`short`, 1270). */
function shareCardLayout(short) {
  return short
    ? { h: 1350, icon: 170, iconY: 190, titleY: 340, titleFont: 70, plateTop: 420, plateRoom: 600, footGap: 130, footMax: 1070, mark: 120, markUp: 235, linkFont: 36, linkUp: 70 }
    : { h: SHARE_CARD.h, icon: 240, iconY: 330, titleY: 520, titleFont: 78, plateTop: 640, plateRoom: 830, footGap: 150, footMax: 1500, mark: 164, markUp: 330, linkFont: 40, linkUp: 112 };
}

/**
 * The night's card, under the champion's line: the evening's games as their icons in one
 * row («🕵️ 🎨 💣 🃏»), and the day in words («الجمعة ٩ أكتوبر») under it (the owner's
 * pick 1268, 7 Oct 2026). A drawn icon (أونو, الدومينو) is drawn as its picture.
 */
async function drawShareNightStrip(ctx, items, date, y, font) {
  const mid = SHARE_CARD.w / 2;
  // An item is an icon, or { icon, name }: برنامج السهرة's line-up with each game's winner under it (1328).
  const icons = items.map(x => (x && typeof x === 'object' ? x.icon : x));
  const names = items.map(x => (x && typeof x === 'object' ? String(x.name || '') : ''));
  const named = names.some(Boolean);
  if (icons.length) {
    const size = Math.min(named ? 96 : 72, Math.floor((SHARE_CARD.w - 200) / icons.length) - 14);
    const step = named ? Math.min(220, Math.floor((SHARE_CARD.w - 160) / icons.length)) : size + 14;
    const rtl = (appState.lang || 'ar') === 'ar';
    // In the order they were played, from the line's start: right to left in Arabic.
    const x0 = mid + (rtl ? 1 : -1) * (icons.length - 1) * step / 2;
    const arts = await Promise.all(icons.map(i => artIconImage(i, 256)));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    icons.forEach((icon, k) => {
      const x = x0 + (rtl ? -1 : 1) * k * step;
      font('400', size);
      if (arts[k]) ctx.drawImage(arts[k], x - size / 2, y - size / 2, size, size);
      else ctx.fillText(String(icon), x, y);
      if (names[k]) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        font('700', Math.max(22, Math.min(30, Math.round(step / 6))));
        ctx.fillText(shareCardFit(ctx, names[k], step - 12), x, y + size / 2 + 30);
        ctx.fillStyle = '#ffffff';
      }
    });
    y += size / 2 + (named ? 106 : 56);
  }
  if (date) {
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    font('700', 40);
    ctx.textAlign = 'center';
    ctx.fillText(shareCardFit(ctx, date, SHARE_CARD.w - 160), mid, y);
  }
}

/**
 * The card with a board on it: the icon and the title small at the top, the
 * position big (the board as the phone draws it in 2D, its style's colours),
 * up to three rows under it, then the mark and the link.
 */
async function drawShareBoardCard(o) {
  const c = shareCardColours();
  const rtl = (appState.lang || 'ar') === 'ar';
  const canvas = document.createElement('canvas');
  canvas.width = SHARE_CARD.w;
  canvas.height = SHARE_CARD.h;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if (!ctx) return null;
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  const font = (weight, px) => { ctx.font = weight + ' ' + px + 'px "IBM Plex Sans Arabic", "Segoe UI", sans-serif'; };
  ctx.textBaseline = 'middle';
  const ground = ctx.createLinearGradient(0, 0, SHARE_CARD.w, SHARE_CARD.h);
  ground.addColorStop(0, c.ground[0]); ground.addColorStop(0.52, c.ground[1]); ground.addColorStop(1, c.ground[2]);
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, SHARE_CARD.w, SHARE_CARD.h);
  const mid = SHARE_CARD.w / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = c.ink;
  const art = await artIconImage(o.icon, 512);
  if (art) ctx.drawImage(art, mid - 70, 110, 140, 140);
  else { font('900', 120); ctx.fillText(String(o.icon || '🏆'), mid, 180); }
  ctx.direction = rtl ? 'rtl' : 'ltr';
  font('900', 70);
  ctx.fillText(shareCardFit(ctx, o.title || '', SHARE_CARD.w - 140), mid, 318);
  // The board, with a soft frame.
  const size = 900, bx = (SHARE_CARD.w - size) / 2, by = 390;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx - 14, by - 14, size + 28, size + 28, 28); ctx.fill(); }
  else ctx.fillRect(bx - 14, by - 14, size + 28, size + 28);
  await chDrawBoardCanvas(ctx, o.board, bx, by, size);
  // The rows under it: who played, the result, a line of the game's own.
  const rows = (o.rows || []).slice(0, 3);
  const rowH = 84, pad = 110, top = by + size + 44;
  rows.forEach((row, i) => {
    const y = top + rowH * i + rowH / 2;
    const name = typeof row === 'string' ? row : (row.name || '');
    const value = typeof row === 'string' ? '' : (row.value == null ? '' : String(row.value));
    ctx.direction = rtl ? 'rtl' : 'ltr';
    ctx.fillStyle = typeof row === 'string' ? 'rgba(255,255,255,0.86)' : c.ink;
    if (typeof row === 'string') { font('700', 40); ctx.textAlign = 'center'; ctx.fillText(shareCardFit(ctx, name, SHARE_CARD.w - 160), mid, y); return; }
    font('800', 50);
    ctx.textAlign = rtl ? 'right' : 'left';
    ctx.fillText(shareCardFit(ctx, name, SHARE_CARD.w - pad * 2 - 200), rtl ? SHARE_CARD.w - pad : pad, y);
    if (value !== '') {
      font('900', 56);
      ctx.fillStyle = c.token;
      ctx.textAlign = rtl ? 'left' : 'right';
      ctx.direction = 'ltr';
      ctx.fillText(shareCardFit(ctx, value, 200), rtl ? pad : SHARE_CARD.w - pad, y);
    }
  });
  const mark = await shareCardMark();
  if (mark) ctx.drawImage(mark, mid - 60, SHARE_CARD.h - 250, 120, 120);
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  font('700', 36);
  ctx.textAlign = 'center';
  ctx.direction = 'ltr';
  ctx.fillText(shareCardFit(ctx, appLink().replace(/^https?:\/\//, ''), SHARE_CARD.w - 120), mid, SHARE_CARD.h - 80);
  return await new Promise((resolve) => {
    try { canvas.toBlob(resolve, 'image/png'); } catch (e) { resolve(null); }
  });
}

/**
 * Draws the card and sends it, from inside the tap that asked for it.
 *   o: { title, icon, rows, footer, text }   `text` is the plain-words fallback.
 * Returns 'shared', 'downloaded', 'copied' or 'failed' - which is what the
 * tests read, and what tells a caller whether to say anything.
 */
async function shareResultCard(o) {
  const t = TRANSLATIONS[appState.lang] || {};
  const fallback = () => {
    shareOrCopy(appLink(), o.text || o.title || '', t.solo_copied || t.link_copied || '');
    return 'copied';
  };
  let blob = null;
  try { blob = await drawShareCard(o); } catch (e) { blob = null; }
  if (!blob) return fallback();

  const name = 'ashry-' + new Date().toISOString().slice(0, 10) + '.png';
  let file = null;
  try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { file = null; }

  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: o.title || t.title || '', text: o.text || '' });
      return 'shared';
    } catch (err) {
      if (err && err.name === 'AbortError') return 'shared';   // closed the sheet
    }
  }

  // ideas batch: solo - a caller with one «شارك» (the solo result) sends the words instead of a download.
  if (o.textFallback) return fallback();
  // No share sheet for a picture: save it, and say where it went.
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showToast(t.share_card_saved || '', 'success');
    return 'downloaded';
  } catch (e) {
    return fallback();
  }
}

/* --- where a result already is ---------------------------------------------- */

/**
 * The button itself, next to a result. `onclick` is the call that builds the
 * card - the work happens in the tap, never before it.
 */
const shareCardBtnHtml = (onclick, label) =>
  `<button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="${onclick}">📤 ${escapeHTML(label || '')}</button>`;

// The board the button on screen belongs to. Most room games publish theirs as
// shared.board, but زي الكل works one out (herdBoard), so the frame that draws
// the button hands its own board over. Kept with the game it came from, so a
// board left over from the last game is never sent.
let shareRoomBoardMemo = null;

/** The rows a board becomes: a name and a score, the scoreless left out. */
const shareBoardRows = (board) => (board || [])
  .filter(p => p && p.name)
  .map(p => ({ name: p.name, value: Number(p.score) || 0 }));

/**
 * A room game that has just ended: the button, with the board it should send.
 * Nothing at all on a big screen - a TV has no share sheet and nobody is
 * holding it - and nothing when nobody scored, so the button is never there to
 * send an empty card.
 */
function roomShareBtnHtml(state, board) {
  const t = TRANSLATIONS[appState.lang] || {};
  if (!state || state.youAreScreen) return '';
  const rows = shareBoardRows(board || (state.shared && state.shared.board));
  if (!rows.some(r => r.value > 0)) return '';
  shareRoomBoardMemo = { game: state.game, rows: rows };
  return `<div class="btn-row" style="justify-content:center">${shareCardBtnHtml('shareRoomResult()', t.share_card || '')}</div>`;
}

/**
 * The night's card (the improvement plan, Phase 4: end-of-night awards): the
 * room's leaderboard of the night, its champion crowned, how many games the
 * evening played - the picture a family sends to the group chat at the end.
 */
function shareRoomNight() {
  const state = Room && Room.state;
  if (!state) return;
  const t = TRANSLATIONS[appState.lang] || {};
  // Those who left keep their points (the ideas of 7 Oct 2026, 1306): their name says «مشي».
  const rows = (typeof roomNightRows === 'function' ? roomNightRows(state) : [])
    .filter(r => r.score > 0)
    .map(r => ({ name: r.left ? r.name + ' (' + (t.room_night_left || '') + ')' : r.name, value: r.score }));
  if (!rows.length) return;
  const top = rows[0];
  const title = '🌙 ' + (t.room_night_title || '');
  const games = shareNightGamesOf(state.code).map(id => {
    const g = typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[id === 'chess' ? 'shatranj' : id] : null;
    return g && g.icon;
  }).filter((icon, i, all) => icon && all.indexOf(icon) === i);
  // Dated from the night's first game, not the tap: a card shared after midnight is still
  // Friday's night (audit 7 Oct 2026, H1).
  const night = shareNightLoad();
  const date = shareNightDate(new Date(night && night.code === state.code && night.since ? night.since : Date.now()));
  return shareResultCard({
    title: title,
    icon: '🏆',
    rows: rows,
    footer: (t.night_champion || '🏆 {name}').replace('{name}', top.name),
    games: games,
    date: date,
    text: title + ' · ' + date + ' · ' + (t.night_champion || '🏆 {name}').replace('{name}', top.name)
  });
}

/* The evening's games, for the night's card: every game dealt in this room tonight, in the
   order they were first played, kept on this phone (the room keeps no such list: its
   night board is points only). A phone that came in late knows the games since. The night
   is the room's code within 12 hours of its first game (`since`), not the calendar day:
   keyed on the day, a card shared after midnight lost the whole evening (audit 7 Oct 2026, H1). */
const SHARE_NIGHT_GAMES_KEY = 'ashryNightGames_v1';
const SHARE_NIGHT_SPAN_MS = 12 * 60 * 60 * 1000;
function shareNightLoad() {
  try {
    const n = JSON.parse(localStorage.getItem(SHARE_NIGHT_GAMES_KEY) || 'null');
    return n && typeof n === 'object' && Number(n.since) > 0 && Date.now() - Number(n.since) < SHARE_NIGHT_SPAN_MS ? n : null;
  } catch (e) { return null; }
}
function shareNightGamesOf(code) {
  const n = shareNightLoad();
  return n && n.code === code && Array.isArray(n.games) ? n.games : [];
}
function shareNightRemember(state) {
  if (!state || !state.code || !state.game || state.phase === 'lobby' || state.youAreScreen) return;
  const cur = shareNightLoad();
  const games = shareNightGamesOf(state.code);
  if (games.indexOf(state.game) !== -1) return;
  const since = cur && cur.code === state.code ? cur.since : Date.now();
  try {
    localStorage.setItem(SHARE_NIGHT_GAMES_KEY, JSON.stringify({ code: state.code, since: since, games: games.concat(state.game).slice(-30) }));
  } catch (e) {}
}
if (typeof Room !== 'undefined') Room.onChange(shareNightRemember);

/** The day in words: «الجمعة ٩ أكتوبر», "Friday 9 October". */
function shareNightDate(d) {
  try {
    return d.toLocaleDateString(appState.lang === 'en' ? 'en-GB' : 'ar-EG', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/[،,]/g, '').replace(/\s+/g, ' ').trim();
  } catch (e) { return ''; }
}

/** Builds that card from the room as it stands when the button is pressed. */
function shareRoomResult() {
  const state = Room && Room.state;
  if (!state) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const meta = (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID[state.game === 'chess' ? 'shatranj' : state.game]) || null;
  const memo = shareRoomBoardMemo && shareRoomBoardMemo.game === state.game ? shareRoomBoardMemo.rows : null;
  const rows = memo || shareBoardRows(state.shared && state.shared.board);
  if (!rows.length) return;
  const title = (meta && t[meta.title]) || t['setup_' + state.game] || '';
  // The board is best first, so a low-wins game's champion (سكرو, ميني جولف) is row one as it is.
  const top = rows[0];
  // The podium's unit (1269): نقطة, ضربة, مرة… after each number.
  const unit = typeof podiumUnitOf === 'function' ? podiumUnitOf(state) : '';
  const word = top && typeof podiumUnitWord === 'function' ? podiumUnitWord(unit, top.value) : '';
  return shareResultCard({
    title: title,
    icon: (meta && meta.icon) || '🏆',
    rows: rows,
    unit: unit,
    footer: top ? '🏆 ' + top.name : '',
    text: (title ? title + ' · ' : '') + (top ? top.name + ' ' + top.value + (word ? ' ' + word : '') : '')
  });
}
</script>
