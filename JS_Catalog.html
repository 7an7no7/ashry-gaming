/* The three ways of playing, as the badges on a card and the chips in the
   filter row. tv is a room shown on a big screen, so a game that plays in a
   room and has a TV layout carries both. */
const PLAY_MODES = {
  device: { icon: '📱', label: 'mode_badge_device', short: 'mode_short_device' },
  room:   { icon: '📲', label: 'mode_badge_room',   short: 'mode_short_room' },
  tv:     { icon: '📺', label: 'mode_badge_tv',     short: 'mode_short_tv' }
};

const HOME_FILTERS = [
  { id: 'all',    icon: '✨', label: 'flt_all' },
  { id: 'device', icon: '📱', label: 'flt_device' },
  { id: 'room',   icon: '📲', label: 'flt_room' },
  { id: 'tv',     icon: '📺', label: 'flt_tv' },
  { id: 'duo',    icon: '🤝', label: 'flt_duo' },
  { id: 'solo',   icon: '🧘', label: 'flt_solo' }
];

/** Does a catalog entry pass a filter chip? */
function catalogMatchesFilter(g, filter) {
  switch (filter) {
    case 'all':    return true;
    case 'tools':  return g.group === 'tools';
    case 'device': return (g.modes || []).indexOf('device') !== -1;
    case 'room':   return (g.modes || []).indexOf('room') !== -1;
    case 'tv':     return (g.modes || []).indexOf('tv') !== -1;
    case 'duo':    return !!g.players && g.players[0] <= 2 && g.players[1] <= 4;
    case 'solo':   return !!g.players && g.players[0] === 1;
  }
  return true;
}

/* --- Recently played -------------------------------------------------------
   The last few games opened on this phone, newest first. A family that plays
   the same three games most evenings should not scroll for them.
   -------------------------------------------------------------------------- */
const RECENT_KEY = 'ashryRecent_v1';
const RECENT_MAX = 6;

function readRecent() {
  try { return (JSON.parse(localStorage.getItem(RECENT_KEY) || '[]') || []).filter(id => CATALOG_BY_ID[id]); }
  catch (e) { return []; }
}

function rememberRecent(id) {
  const list = [id].concat(readRecent().filter(x => x !== id)).slice(0, RECENT_MAX);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
}

function forgetRecent() {
  try { localStorage.removeItem(RECENT_KEY); } catch (e) {}
}

/** Every card and every recent tile goes through here. */
function catalogOpen(id) {
  const g = CATALOG_BY_ID[id];
  if (!g) return;
  rememberRecent(id);
  g.open();
}

/* --- Pieces shared by the home and the heroes ----------------------------- */

const catalogTitle = (g, t) => t[g.title] || g.id;
const catalogDesc = (g, t) => t[g.desc] || '';

/** "👥 3–12 · ⏱ 10 min" plus the mode badges. */
function catalogMeta(g, t, withModeLabels, withModes) {
  const bits = [];
  if (g.players) {
    const [min, max] = g.players;
    bits.push(`<span class="meta-bit"><span aria-hidden="true">👥</span><span class="metric">${min === max ? min : min + '–' + max}</span></span>`);
  }
  if (g.mins) {
    bits.push(`<span class="meta-bit"><span aria-hidden="true">⏱</span><span class="metric">${g.mins}</span> ${escapeHTML(t.meta_min || '')}</span>`);
  }
  if (withModes !== false) (g.modes || []).forEach(m => {
    const mode = PLAY_MODES[m];
    if (!mode) return;
    bits.push(withModeLabels
      ? `<span class="meta-bit meta-bit--mode"><span aria-hidden="true">${mode.icon}</span>${escapeHTML(t[mode.label] || '')}</span>`
      : `<span class="meta-bit meta-bit--mode" title="${escapeHTML(t[mode.label] || '')}" aria-label="${escapeHTML(t[mode.label] || '')}">${mode.icon}</span>`);
  });
  return bits.join('');
}

/** The mode icons alone, for the corner of a card. */
function catalogModes(g, t) {
  return (g.modes || []).map(m => PLAY_MODES[m]).filter(Boolean)
    .map(mode => `<span title="${escapeHTML(t[mode.label] || '')}" aria-label="${escapeHTML(t[mode.label] || '')}">${mode.icon}</span>`).join('');
}

/* One shape for every card: the icon with the mode icons beside it, the title,
   two lines of description at most, and players and minutes on one line - so
   two cards in a row are always the same height. */
function catalogCard(g, t) {
  return `
    <button type="button" class="gcard" data-accent="${g.accent}" data-game="${g.id}" onclick="catalogOpen('${g.id}')">
      <span class="gcard__top">
        <span class="gcard__icon" aria-hidden="true">${g.icon}</span>
        <span class="gcard__modes">${catalogModes(g, t)}</span>
      </span>
      <span class="gcard__title">${escapeHTML(catalogTitle(g, t))}</span>
      <span class="gcard__desc">${escapeHTML(catalogDesc(g, t))}</span>
      <span class="gcard__meta">${catalogMeta(g, t, false, false)}</span>
    </button>`;
}

function catalogToolRow(g, t) {
  return `
    <button type="button" class="tool-item" data-accent="${g.accent}" data-game="${g.id}" onclick="catalogOpen('${g.id}')">
      <span class="tool-icon" aria-hidden="true">${g.icon}</span>
      <span class="tool-info">
        <span class="tool-name">${escapeHTML(catalogTitle(g, t))}</span>
        <span class="tool-desc">${escapeHTML(catalogDesc(g, t))}</span>
      </span>
      <span class="tool-chev" aria-hidden="true">›</span>
    </button>`;
}

/* --- Two small things every catalog screen does ------------------------------ */

/* The cards rise in sequence the first time a tab is drawn in a session; after
   that a tab comes back still, because a screen that re-animates on every
   return feels slow rather than alive. */
const staggeredViews = new Set();
function settleStagger(view, id) {
  view.classList.toggle('is-settled', staggeredViews.has(id));
  staggeredViews.add(id);
}

/* A horizontal row fades at the edge it can still scroll toward, so a chip cut
   at the screen edge reads as "there is more" rather than as a mistake. */
function watchScrollFade(el) {
  if (!el || el.dataset.fadeWatched) return;
  el.dataset.fadeWatched = '1';
  const update = () => {
    const cs = getComputedStyle(el);
    // The rows bleed into the gutter and snap their first chip to its edge,
    // so "at the start" is anywhere within that padding.
    const pad = (parseFloat(cs.paddingInlineStart) || 0) + 2;
    const max = el.scrollWidth - el.clientWidth;
    const pos = Math.abs(el.scrollLeft);
    el.classList.toggle('is-rtl', cs.direction === 'rtl');
    el.classList.toggle('fade-start', pos > pad);
    el.classList.toggle('fade-end', max > pad && max - pos > pad);
  };
  el.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  requestAnimationFrame(update);
}

        </button>
      </div>
    </section>`;

  const search = `

        <span class="home-search__icon" aria-hidden="true">🔍</span>

  const recentRow = recent.length ? `
    <section class="section" id="home-recent">
      <div class="section__head">
        <span class="section__emoji" aria-hidden="true">🕘</span>
        <h2 class="section__title">${escapeHTML(t.home_recent || '')}</h2>

      </div>
      <div class="recent-row hscroll-fade">
        ${recent.map(id => {
          const g = CATALOG_BY_ID[id];
          return `<button type="button" class="recent-tile" data-accent="${g.accent}" onclick="catalogOpen('${g.id}')">

                    <span class="recent-tile__name">${escapeHTML(catalogTitle(g, t))}</span>

  // The tools have a tab of their own; the home is the games.
  const groups = CATALOG_GROUPS.filter(grp => grp.id !== 'tools').map(grp => {
    const games = GAME_CATALOG.filter(g => g.group === grp.id);
    if (!games.length) return '';
    const body = grp.id === 'tools'
      ? `<div class="tools-list">${games.map(g => catalogToolRow(g, t)).join('')}</div>`
      : `<div class="gcard-grid">${games.map(g => catalogCard(g, t)).join('')}</div>`;
    return `
      <section class="section" data-group="${grp.id}">

function setHomeFilter(id) {
  homeFilter = id;
  document.querySelectorAll('#view-menu .filter-chip').forEach(b => {
    const on = b.dataset.filter === id;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on);
  });
  applyHomeFilter();
  haptic('light');
}

function setHomeSearch(value) {
  homeSearch = value || '';
  applyHomeFilter();
}

/** Hides the cards, rows and sections the chip and the search box rule out. */
function applyHomeFilter() {
  const view = document.getElementById('view-menu');
  if (!view) return;
  const t = TRANSLATIONS[appState.lang];
  const other = TRANSLATIONS[appState.lang === 'ar' ? 'en' : 'ar'];
  const term = helpNormalise(homeSearch);
  const searching = !!term;
  let shown = 0;

  view.querySelectorAll('[data-game]').forEach(el => {
    const g = CATALOG_BY_ID[el.dataset.game];
    if (!g) return;
    let ok = catalogMatchesFilter(g, homeFilter);
    if (ok && searching) {
      const hay = helpNormalise([catalogTitle(g, t), catalogDesc(g, t), catalogTitle(g, other), catalogDesc(g, other)].join(' '));
      ok = hay.indexOf(term) !== -1;
    }
    el.classList.toggle('hidden', !ok);
    if (ok) shown++;
  });

  view.querySelectorAll('section[data-group]').forEach(sec => {
    const any = sec.querySelector('[data-game]:not(.hidden)');
    sec.classList.toggle('hidden', !any);
  });
  // The recent row is a shortcut, not a search result.
  const recent = document.getElementById('home-recent');
  if (recent) recent.classList.toggle('hidden', searching || homeFilter !== 'all');
  const empty = document.getElementById('home-empty');
  if (empty) empty.classList.toggle('hidden', shown > 0);
}

/* --- The hero on a setup screen ---------------------------------------------
   Every setup screen opens with the same card: what the game is in one line,
   how many people, how long, how it can be played, and a way to the rules.
   It is drawn by setView (and again on a language change), so the screens
   themselves carry none of it.
   -------------------------------------------------------------------------- */
function catalogHeroHtml(g, t) {
  const modes = (g.modes || []).map(m => PLAY_MODES[m]).filter(Boolean)
    .map(mode => `<span class="meta-bit meta-bit--mode"><span aria-hidden="true">${mode.icon}</span>${escapeHTML(t[mode.short] || t[mode.label] || '')}</span>`).join('');
  return `
    <span class="game-hero__icon" aria-hidden="true">${g.icon}</span>
    <span class="game-hero__text">
      <span class="game-hero__title">${escapeHTML(catalogTitle(g, t))}</span>
      <span class="game-hero__desc">${escapeHTML(catalogDesc(g, t))}</span>
    </span>
    <button type="button" class="game-hero__rules" onclick="openHelpModal()"
            title="${escapeHTML(t.hero_rules || '')}" aria-label="${escapeHTML(t.hero_rules || '')}">
      <span aria-hidden="true">📘</span>
      <span class="game-hero__rules-label">${escapeHTML(t.hero_rules || '')}</span>
    </button>
    <span class="game-hero__meta">${catalogMeta(g, t, true, false)}${modes}</span>`;
}

function syncGameHero(viewId) {
  const view = document.getElementById('view-' + viewId);
  if (!view) return;
  const g = GAME_CATALOG.find(x => x.setup === viewId);
  let hero = view.querySelector(':scope > .game-hero');
  if (!g) { if (hero) hero.remove(); return; }
  const t = TRANSLATIONS[appState.lang];
  if (!hero) {
    hero = document.createElement('div');
    hero.className = 'game-hero';
    view.insertBefore(hero, view.firstChild);
  }
  hero.innerHTML = catalogHeroHtml(g, t);
}

/* --- The Together tab --------------------------------------------------------
   Playing on separate phones is what sets the app apart, and it was three
   small tiles in a hero. This is its own screen: the three ways in, every
   game a room can play, and how a room works in three lines.
   -------------------------------------------------------------------------- */
function renderTogether() {
  const view = document.getElementById('view-together');
  if (!view) return;
  const t = TRANSLATIONS[appState.lang];
  const games = GAME_CATALOG.filter(g => (g.modes || []).indexOf('room') !== -1);
  view.innerHTML = `
    <div class="tab-hero">
      <span class="tab-hero__icon" aria-hidden="true">📲</span>
      <div>
        <div class="tab-hero__title">${escapeHTML(t.together_title || '')}</div>
        <div class="tab-hero__sub">${escapeHTML(t.together_sub || '')}</div>
      </div>
    </div>
    <div class="together-actions">
      <button type="button" class="btn btn--primary btn--lg" onclick="roomCreateEmpty()">🎮 ${escapeHTML(t.room_open || '')}</button>
      <button type="button" class="btn btn--secondary" onclick="roomOpenJoin('')">📱 ${escapeHTML(t.join_room_menu || '')}</button>
      <button type="button" class="btn btn--neutral" onclick="roomOpenScreen()">📺 ${escapeHTML(t.together_tv || '')}</button>
    </div>
    <section class="section">
      <div class="section__head">
        <span class="section__emoji" aria-hidden="true">🎲</span>
        <h2 class="section__title">${escapeHTML(t.together_games || '')}</h2>
        <span class="section__count metric">${games.length}</span>
        <span class="section__rule"></span>
      </div>
      <div class="gcard-grid">${games.map(g => catalogCard(g, t)).join('')}</div>
    </section>
    <section class="card card--tight">
      <div class="eyebrow">${escapeHTML(t.together_how || '')}</div>
      <div class="together-steps">
        ${[1, 2, 3].map(n => `
          <div class="together-step">
            <span class="together-step__n metric">${n}</span>
            <span>${escapeHTML(t['together_step' + n] || '')}</span>
          </div>`).join('')}
      </div>
      <button type="button" class="btn btn--ghost btn--sm" style="margin-top: var(--sp-3)" onclick="openHelpModal()">📘 ${escapeHTML(t.together_more || '')}</button>
    </section>`;
  settleStagger(view, 'together');
}

/** The Together tab, or the room this phone is already in. */
function goTogether() {
  if (typeof Room !== 'undefined' && Room.isIn && typeof roomReturnToActive === 'function') { roomReturnToActive(); return; }
  setView('together');
}

/* --- The Tools tab --- */
function renderTools() {
  const view = document.getElementById('view-tools');
  if (!view) return;
  const t = TRANSLATIONS[appState.lang];
  const tools = GAME_CATALOG.filter(g => g.group === 'tools');
  view.innerHTML = `
    <div class="tab-hero">
      <span class="tab-hero__icon" aria-hidden="true">🛠️</span>
      <div>
        <div class="tab-hero__title">${escapeHTML(t.nav_tools || '')}</div>
        <div class="tab-hero__sub">${escapeHTML(t.tools_sub || '')}</div>
      </div>
    </div>
    <div class="tools-list">${tools.map(g => catalogToolRow(g, t)).join('')}</div>`;
  settleStagger(view, 'tools');
}

/** Redraws whichever catalog screens are up - after a language change. */
function renderCatalogViews() {
  renderHome();
  if (appState.currentView === 'together') renderTogether();
  if (appState.currentView === 'tools') renderTools();
}

</script>
