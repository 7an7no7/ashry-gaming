<script>
/* --- THE CHAMELEON (الحرباء) GAME LOGIC --- */
/* The boards (CHAMELEON_DB) live in ChameleonWords.js, shared with the rooms server. */

/*
   "Play again" deals again to the same table and keeps a running score, as a
   room does: caught (and wrong about the word) is a point to everyone else;
   escaped or stole the word is two to the chameleon. Starting from the setup
   screen starts the score over. The labels follow the app's language; only
   the board's words follow the games' language.
*/

const chameleonState = {
  players: [],
  category: "",
  words: [],
  rowIdx: 0,
  colIdx: 0,
  secretCoord: "",
  secretWord: "",
  chameleonPlayer: "",
  revealIndex: 0,
  accusedPlayer: "",
  scores: {},
  scoreId: 0
};

const ROW_LETTERS = ["A", "B", "C", "D"];

/** Fills the category list in the current language, keeping whatever was picked. */
function renderChameleonCategories() {
  const catSelect = document.getElementById('chameleon-cat-select');
  if (!catSelect) return;
  const previous = catSelect.value;
  const lang = contentLang();
  const db = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  const t = TRANSLATIONS[appState.lang] || {};
  catSelect.innerHTML = '';
  const optRandom = document.createElement('option');
  optRandom.value = 'random';
  optRandom.innerText = '🎲 ' + (t.cham_random_cat || (appState.lang === 'en' ? 'Random category' : 'فئة عشوائية'));
  catSelect.appendChild(optRandom);
  db.forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.innerText = item.category;
    catSelect.appendChild(opt);
  });
  // Both languages list the categories in the same order, so the pick survives
  // a language switch as well as "play again" - and, kept on this phone
  // (data-remember), a reload and the next evening.
  if (previous && [...catSelect.options].some(o => o.value === previous)) catSelect.value = previous;
  else recallField(catSelect);
}

// setView fills the list on the way in, so a reload or the back button gets it too.
function setupChameleon() {
  setView('setup-chameleon');
}

/**
 * Deals a board. From the setup screen: the players picked there, and the
 * score starts over. `again` (the result's "play again"): the same table,
 * and the score carries on.
 */
function startChameleonGame(again) {
  const replay = again === true && chameleonState.players.length >= 3;
  const selected = replay ? chameleonState.players.slice() : (appState.activePlayers ? [...appState.activePlayers] : []);
  if (!replay) saveActivePlayers(selected);

  if (selected.length < 3) {
    askPlayers(3, () => startChameleonGame());
    return;
  }
  if (!replay) { chameleonState.scores = {}; chameleonState.scoreId = Date.now(); }
  selected.forEach(p => { if (typeof chameleonState.scores[p] !== 'number') chameleonState.scores[p] = 0; });

  const lang = contentLang();
  const db = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  const catSelect = document.getElementById('chameleon-cat-select');
  let chosen = null;
  if (!catSelect || catSelect.value === 'random' || !catSelect.value) {
    chosen = freshPick('chameleon:' + lang, db, 1, { key: c => c.category })[0];
  } else {
    const idx = parseInt(catSelect.value, 10);
    chosen = db[idx] || db[0];
  }

  chameleonState.category = chosen.category;
  chameleonState.words = [...chosen.words];

  // Coordinates: 0..3 for row (A-D) and 0..3 for col (1-4)
  chameleonState.rowIdx = Math.floor(Math.random() * 4);
  chameleonState.colIdx = Math.floor(Math.random() * 4);
  chameleonState.secretCoord = ROW_LETTERS[chameleonState.rowIdx] + (chameleonState.colIdx + 1);
  chameleonState.secretWord = chameleonState.words[chameleonState.rowIdx * 4 + chameleonState.colIdx];

  // Pick random chameleon
  const shuffledPlayers = shuffleArray(selected);
  chameleonState.players = shuffledPlayers;
  chameleonState.chameleonPlayer = shuffledPlayers[Math.floor(Math.random() * shuffledPlayers.length)];
  chameleonState.revealIndex = 0;
  chameleonState.accusedPlayer = '';

  resetChameleonTable();
  playSound('click');
  chameleonSave();
  showChameleonRevealStep();
  setView('reveal-chameleon');
}

/*
   The deal is kept on the phone (the whole board and who holds which role), so a
   reload in the middle comes back to the same card or the same board rather than
   ending a round everyone has already looked at.
*/
const CHAMELEON_SAVE_KEY = 'ashryChameleonDeal_v1';
function chameleonSave() {
  try { localStorage.setItem(CHAMELEON_SAVE_KEY, JSON.stringify(chameleonState)); } catch (e) {}
}
function restoreChameleon(view) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(CHAMELEON_SAVE_KEY) || 'null'); } catch (e) {}
  if (!saved || !Array.isArray(saved.players) || saved.players.length < 3 || !Array.isArray(saved.words) || saved.words.length !== 16) return false;
  Object.assign(chameleonState, saved);
  if (view === 'reveal-chameleon' && chameleonState.revealIndex < chameleonState.players.length) {
    showChameleonRevealStep();
    setView('reveal-chameleon');
  } else {
    startChameleonTablePlay();
  }
  return true;
}

/**
 * The play screen as a new game finds it: no guess box, the accuse bar back.
 * Leaving during the chameleon's last guess used to carry both into the next game.
 */
function resetChameleonTable() {
  const guess = document.getElementById('chameleon-guess-box');
  if (guess) guess.classList.add('hidden');
  const actions = document.getElementById('chameleon-play-actions');
  if (actions) actions.classList.remove('hidden');
  closeModal('chameleon-result-modal');
}

function showChameleonRevealStep() {
  if (chameleonState.revealIndex >= chameleonState.players.length) {
    startChameleonTablePlay();
    return;
  }

  const playerName = chameleonState.players[chameleonState.revealIndex];
  document.getElementById('chameleon-reveal-name').innerText = playerName;
  revealChameleonSecret();
  holdCardReset(document.getElementById('chameleon-hold'));
}

/** Fills the back of the hold card. No sound: it would tell the table who the chameleon is. */
function revealChameleonSecret() {
  const playerName = chameleonState.players[chameleonState.revealIndex];
  const isChameleon = (playerName === chameleonState.chameleonPlayer);
  const cardTitle = document.getElementById('chameleon-card-role');
  const cardDetail = document.getElementById('chameleon-card-detail');
  const t = TRANSLATIONS[appState.lang] || {};

  if (isChameleon) {
    cardTitle.innerText = '🦎 ' + (t.cham_you_are || '');
    cardDetail.innerHTML = `<p class="text-sm font-semibold opacity-90">${escapeHTML(t.cham_you_hint || '')}</p>`;
  } else {
    cardTitle.innerText = '🕵️ ' + (t.cham_civilian || 'مواطن عادي');
    cardDetail.innerHTML = `
      <div class="space-y-2">
        <div class="eyebrow">${escapeHTML(t.cham_coord_word || 'الإحداثيات والكلمة السرية')}</div>
        <div class="text-2xl font-black tx-warning" dir="ltr">${chameleonState.secretCoord}</div>
        <div class="text-3xl font-black">${escapeHTML(chameleonState.secretWord)}</div>
      </div>
    `;
  }
}

function doneChameleonRevealStep() {
  chameleonState.revealIndex++;
  chameleonSave();
  showChameleonRevealStep();
}

function startChameleonTablePlay() {
  resetChameleonTable();
  setView('play-chameleon');
  renderChameleonGrid();

  document.getElementById('chameleon-play-category').innerText = chameleonState.category;

  // Turn order: First player speaks first
  const turnsList = document.getElementById('chameleon-turn-order');
  if (turnsList) {
    turnsList.innerHTML = chameleonState.players.map((p, idx) => `
      <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold ${idx === 0 ? 'bg-amber-500 text-black shadow' : 'bg-black/10 dark:bg-white/10'}">
        <bdi>${idx + 1}.</bdi>
        <span>${escapeHTML(p)}</span>
      </div>
    `).join('');
  }
}

function renderChameleonGrid(interactive) {
  const gridEl = document.getElementById('chameleon-4x4-grid');
  if (!gridEl) return;

  let html = `
    <div class="grid grid-cols-5 gap-1.5 text-center font-bold text-sm">
      <div class="p-2"></div>
      <div class="p-2 tx-warning">1</div>
      <div class="p-2 tx-warning">2</div>
      <div class="p-2 tx-warning">3</div>
      <div class="p-2 tx-warning">4</div>
  `;

  for (let r = 0; r < 4; r++) {
    const rowLetter = ROW_LETTERS[r];
    html += `<div class="p-2 flex items-center justify-center tx-warning">${rowLetter}</div>`;
    for (let c = 0; c < 4; c++) {
      const idx = r * 4 + c;
      const word = chameleonState.words[idx];
      if (interactive) {
        html += `
          <button type="button" onclick="chameleonGuessWord('${jsStringAttr(word)}')"
                  class="p-2 rounded-lg bg-black/10 dark:bg-white/10 active:bg-amber-500 active:text-black font-semibold text-xs transition-colors flex items-center justify-center min-h-[52px]">
            ${escapeHTML(word)}
          </button>
        `;
      } else {
        html += `
          <div class="p-2 rounded-lg bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 font-semibold text-xs flex items-center justify-center min-h-[52px]">
            ${escapeHTML(word)}
          </div>
        `;
      }
    }
  }

  html += `</div>`;
  gridEl.innerHTML = html;
}

function openChameleonAccuseModal() {
  const t = TRANSLATIONS[appState.lang] || {};
  const list = document.getElementById('chameleon-accuse-list');
  if (list) {
    list.innerHTML = chameleonState.players.map(p => `
      <button class="ballot-option" onclick="voteChameleonAccused('${jsStringAttr(p)}')">
        <span class="ballot-option__label">${escapeHTML(p)}</span>
        <span class="badge badge--danger">${escapeHTML(t.accuse_badge || 'اتهام')}</span>
      </button>
    `).join('');
  }
  document.getElementById('chameleon-accuse-modal').classList.remove('hidden');
}

function voteChameleonAccused(player) {
  closeModal('chameleon-accuse-modal');
  chameleonState.accusedPlayer = player;
  const isCorrectCatch = (player === chameleonState.chameleonPlayer);

  if (isCorrectCatch) {
    // Chameleon was caught! But they get one last guess!
    playSound('alarm');
    openChameleonGuessPhase();
  } else {
    // Wrong accusation! Chameleon wins automatically!
    playSound('alarm');
    finishChameleonGame(false, false);
  }
}

function openChameleonGuessPhase() {
  const t = TRANSLATIONS[appState.lang] || {};
  document.getElementById('chameleon-guess-instruction').innerText =
    '🦎 ' + chameleonState.chameleonPlayer + ' · ' + (t.cham_guess_hint || '');

  renderChameleonGrid(true); // make tiles clickable
  document.getElementById('chameleon-play-actions').classList.add('hidden');
  document.getElementById('chameleon-guess-box').classList.remove('hidden');
}

function chameleonGuessWord(word) {
  const isCorrectWord = (word === chameleonState.secretWord);
  finishChameleonGame(true, isCorrectWord);
}

function finishChameleonGame(wasCaught, chameleonGuessedWord) {
  const t = TRANSLATIONS[appState.lang] || {};
  const resultModal = document.getElementById('chameleon-result-modal');
  const titleEl = document.getElementById('chameleon-result-title');
  const detailEl = document.getElementById('chameleon-result-detail');
  const cham = chameleonState.chameleonPlayer;

  let chameleonWon = false;
  let summary = "";

  if (!wasCaught) {
    // The table accused the wrong player.
    chameleonWon = true;
    summary = (t.cham_escaped || '').replace('{name}', cham);
  } else if (chameleonGuessedWord) {
    chameleonWon = true;
    summary = (t.cham_stole || '').replace('{name}', cham);
  } else {
    chameleonWon = false;
    summary = (t.cham_caught || '').replace('{name}', cham);
  }

  // The running score, as a room keeps it.
  if (chameleonWon) chameleonState.scores[cham] = (chameleonState.scores[cham] || 0) + 2;
  else chameleonState.players.forEach(p => { if (p !== cham) chameleonState.scores[p] = (chameleonState.scores[p] || 0) + 1; });

  if (chameleonWon) {
    playSound('alarm');
    titleEl.innerText = '🦎 ' + (t.cham_wins || 'الحرباء كسبت!');
    titleEl.className = "sheet__title tx-warning";
  } else {
    playSound('success');
    confetti({ particleCount: 150 });
    titleEl.innerText = '🎉 ' + (t.table_wins || 'الطاولة كسبت!');
    titleEl.className = "sheet__title tx-success";
  }

  const board = chameleonState.players.map(p => ({ id: p, name: p, score: chameleonState.scores[p] || 0 }))
    .sort((a, b) => b.score - a.score);
  detailEl.innerHTML = `
    <p class="text-base mb-4">${escapeHTML(summary)}</p>
    <div class="p-4 rounded-xl bg-black/5 dark:bg-white/5 space-y-1 text-sm">
      ${!wasCaught ? `<div><b>${escapeHTML(t.cham_accused || '')}:</b> ${escapeHTML(chameleonState.accusedPlayer)}</div>` : ''}
      <div><b>${escapeHTML(t.secret_word || '')}:</b> ${escapeHTML(chameleonState.secretWord)} (<span dir="ltr">${chameleonState.secretCoord}</span>)</div>
      <div><b>${escapeHTML(t.setup_chameleon || '')}:</b> ${escapeHTML(cham)}</div>
    </div>
    <div class="modal-section">${renderScoreboard(board)}</div>
  `;

  partyModalButton('chameleon-result-modal', 'chameleon-result-exit', 'exitChameleonPlay()', t.exit_settings || '');
  resultModal.classList.remove('hidden');
  if (typeof animateScoreboards === 'function') animateScoreboards({ code: 'chameleon', game: String(chameleonState.scoreId) });
}

/** The result's main button: the same table again, the score carrying on. */
function resetChameleonPlay() {
  closeModal('chameleon-result-modal');
  startChameleonGame(true);
}

/** Back to the setup screen, for another category or other players. */
function exitChameleonPlay() {
  closeModal('chameleon-result-modal');
  resetChameleonTable();
  setupChameleon();
}

/**
 * A second, quieter button under a result dialog's main one, added once. The
 * dialogs are written in Controller.html with one button; the markup can hold
 * the button itself (same id), and then this only sets its label.
 */
function partyModalButton(modalId, btnId, onclick, label) {
  let btn = document.getElementById(btnId);
  if (!btn) {
    const actions = document.querySelector('#' + modalId + ' .modal-actions');
    if (!actions) return;
    btn = document.createElement('button');
    btn.id = btnId;
    btn.type = 'button';
    btn.className = 'btn btn--ghost';
    btn.setAttribute('onclick', onclick);
    actions.appendChild(btn);
  }
  if (!btn.hasAttribute('data-i18n')) btn.textContent = label;
}
</script>
