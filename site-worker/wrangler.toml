# The app's second address: the built site (docs/) served as plain files by Cloudflare,
# free and unlimited (requests to static files cost nothing on the free plan). GitHub Pages
# stays the main link; this is the fast copy to share when GitHub is slow (23 Sep 2026:
# GitHub sent the page at 20-80 KB/s, Cloudflare in 1.4 s). No code runs here and nothing
# is stored - rooms stay on ashry-rooms (the ROOMS_URL written into the page).
#
#   cd tools && npm run deploy:site      (after npm run build:site)
name = "ashry-app"
compatibility_date = "2026-09-01"

[assets]
directory = "../docs"
