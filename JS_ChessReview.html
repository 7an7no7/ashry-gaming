<script>
/* ============================================================================
   شطرنج — THE GAMES KEPT ON THE PHONE, AND THE REVIEW
   ----------------------------------------------------------------------------
   The owner's coach (23 Sep 2026): every game gets a review - against the
   computer, two on one phone, and a room's once it is over, on each phone:
   every move rated (brilliant / best / good / inaccuracy / mistake / blunder)
   with the better move and a short why, an accuracy for each player, the
   evaluation as a graph, the game replayed on the board with jumps to the key
   moments, and "try the better move" - from any moment, play the suggested
   line out against the computer.

   The last CH_KEEP games are kept on this phone (localStorage, not appState:
   appState is saved on every screen change and these can be long), each with
   its review once it has been worked out, so opening it again is instant.
   A review is worked out a position at a time (chessReviewStep in Chess.js),
   one per tick with a progress bar, so the page never freezes; each position
   has a ceiling of positions to search, so a game's review comes out the same.
   ========================================================================= */

const CH_GAMES_KEY = 'ashryChessGames_v1';
const CH_KEEP = 20;
const CH_REVIEW_NODES = 20000;

function chLoadGames() {
  try { const list = JSON.parse(localStorage.getItem(CH_GAMES_KEY) || '[]'); return Array.isArray(list) ? list : []; } catch (e) { return []; }
}

function chSaveGames(list) {
  try { localStorage.setItem(CH_GAMES_KEY, JSON.stringify(list.slice(0, CH_KEEP))); }
  catch (e) {
    // Full: drop the kept reviews (they can be worked out again) and try once more.
    try { localStorage.setItem(CH_GAMES_KEY, JSON.stringify(list.slice(0, CH_KEEP).map(g => Object.assign({}, g, { review: null })))); } catch (x) {}
  }
}

/** A finished game kept for the review (newest first). The same game twice (a redraw, a reload) is kept once. */
function chStoreGame(rec) {
  if (!rec || !rec.moves || !rec.moves.length) return null;
  const list = chLoadGames();
  const at = list.findIndex(g => g.key && g.key === rec.key);
  const game = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), at: Date.now(), review: null }, rec);
  if (at !== -1) { game.id = list[at].id; list.splice(at, 1); }
  list.unshift(game);
  chSaveGames(list);
  return game;
}

/** The past games on the setup screen: who played, how it ended, and a way into the review. */
function chPaintHistory() {
  const box = document.getElementById('shatranj-history');
  if (!box) return;
  const list = chLoadGames();
  if (!list.length) { box.innerHTML = ''; box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const fmt = (ts) => { try { return new Date(ts).toLocaleDateString(appState.lang === 'en' ? 'en-GB' : 'ar-EG', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
  box.innerHTML = `<p class="field__label">📊 ${escapeHTML(chT('ch_history'))}</p>
    <div class="ch-hist">${list.slice(0, CH_KEEP).map(g => {
      const res = g.result === 'd' ? '½-½' : g.result === 'w' ? '1-0' : '0-1';
      const acc = g.review && g.review.accuracy ? ` · ${g.review.accuracy.map(a => (a === null ? '-' : Math.round(a) + '%')).join(' / ')}` : '';
      return `<button type="button" class="ch-hist__row" onclick="chOpenReview('${jsStringAttr(g.id)}')">
          <span class="ch-hist__who"><bdi>${escapeHTML(g.names[0] || '')}</bdi> – <bdi>${escapeHTML(g.names[1] || '')}</bdi></span>
          <span class="ch-hist__meta"><b dir="ltr">${res}</b> · ${Math.ceil(g.moves.length / 2)} ${escapeHTML(chT('ch_moves_n'))} · ${escapeHTML(fmt(g.at))}${acc}</span>
          <span class="ch-hist__go" aria-hidden="true">📊</span>
        </button>`;
    }).join('')}</div>`;
}

/* --- sharing a game (the owner, 24 Sep 2026) --------------------------------------------------
   From the end of a game and from the review: a picture of the final position on the app's share
   card, the moves as PGN (the tags a chess site reads, 960's and a set-up position's start
   included), and a short video of the game where the phone can record a canvas (MediaRecorder);
   where it can't, that button isn't there. Nothing is drawn until a button is pressed. */

/** A kept game by its id or its key ('local|…', 'room|…'). */
const chFindRec = (key) => chLoadGames().find(g => g.id === key || g.key === key) || null;

/** Every position of a kept game, from its start: [{ board, last }] (the last move's two squares). */
function chRecordPositions(rec) {
  const g = rec.start ? chessFromFen(rec.start) : chessNew();
  const out = [{ board: g.board.slice(), last: null }];
  (rec.moves || []).forEach(uci => {
    const info = chessPlay(g, chessFromUci(uci));
    if (info) out.push({ board: g.board.slice(), last: { from: info.from, to: info.to } });
  });
  return out;
}

/** The board's colours for a canvas: the style this phone plays with, read off its own tokens. */
function chBoardColours() {
  const el = document.createElement('div');
  el.setAttribute('data-ch2-style', chLook().style);
  el.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
  document.body.appendChild(el);
  const cs = getComputedStyle(el);
  const v = (n, d) => (cs.getPropertyValue(n) || '').trim() || d;
  const out = { light: v('--ch2-light', '#eeeed2'), dark: v('--ch2-dark', '#769656'), last: v('--ch2-last', 'rgba(255, 255, 51, 0.5)'), pieces: {} };
  ['w', 'b'].forEach(c => ['hi', 'mid', 'lo', 'edge', 'line'].forEach(k => { out.pieces[c + '-' + k] = v('--ch2-' + c + '-' + k, c === 'w' ? '#f1e8d6' : '#37332f'); }));
  el.remove();
  return out;
}

const chPieceImgCache = {};

/** The twelve pieces as images a canvas can draw: the page's own drawings, their colours written in. */
function chPieceImages(cols) {
  const key = JSON.stringify(cols.pieces);
  if (chPieceImgCache[key]) return chPieceImgCache[key];
  const defs = chPieceSymbols().replace(/var\(--ch2-([wb]-[a-z]+)\)/g, (m, n) => cols.pieces[n] || '#888888');
  const load = (code) => new Promise((resolve) => {
    const id = 'ch2pc-' + (code >> 3 ? 'b' : 'w') + (code & 7);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 45 45" width="180" height="180">${defs}<use href="#${id}" xlink:href="#${id}"/></svg>`;
    const img = new Image();
    img.onload = () => resolve([code, img]);
    img.onerror = () => resolve([code, null]);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
  chPieceImgCache[key] = Promise.all([1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 13, 14].map(load)).then(list => {
    const m = {};
    list.forEach(([c, img]) => { m[c] = img; });
    return m;
  });
  return chPieceImgCache[key];
}

/** One position on a canvas as the 2D board draws it: squares, the last move, the coordinates, the pieces. */
function chDrawBoardFrame(ctx, imgs, cols, b, x, y, size) {
  const u = size / 8, o = b.orient ? 1 : 0;
  const last = b.last ? [chSqIndex(b.last.from), chSqIndex(b.last.to)] : [];
  ctx.save();
  ctx.direction = 'ltr';
  for (let i = 0; i < 64; i++) {
    const [col, row] = ch2Cell(i, o);
    const px = x + col * u, py = y + row * u;
    const light = ((i >> 3) + (i & 7)) % 2 === 1;
    ctx.fillStyle = light ? cols.light : cols.dark;
    ctx.fillRect(px, py, u + 0.6, u + 0.6);
    if (last.indexOf(i) !== -1) { ctx.fillStyle = cols.last; ctx.fillRect(px, py, u + 0.6, u + 0.6); }
    ctx.fillStyle = light ? cols.dark : cols.light;
    ctx.font = '800 ' + Math.round(u * 0.2) + 'px Cairo, "Segoe UI", sans-serif';
    if (col === 0) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(String((i >> 3) + 1), px + u * 0.06, py + u * 0.05); }
    if (row === 7) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(CH_FILES[i & 7], px + u * 0.95, py + u * 0.97); }
    const code = (b.board || [])[i];
    if (code && imgs[code]) ctx.drawImage(imgs[code], px + u * 0.02, py + u * 0.02, u * 0.96, u * 0.96);
  }
  ctx.restore();
}

/** The share card's board (drawShareCard asks for it by name): b is { board, last, orient }. */
async function chDrawBoardCanvas(ctx, b, x, y, size) {
  const cols = chBoardColours();
  const imgs = await chPieceImages(cols);
  chDrawBoardFrame(ctx, imgs, cols, b, x, y, size);
}

/** The result for each side: ['1', '0'], ['0', '1'] or ['½', '½']. */
const chResultPair = (r) => (r === 'w' ? ['1', '0'] : r === 'b' ? ['0', '1'] : ['½', '½']);

/** A kept game as PGN: Event, Date, White, Black, Result, and Variant / SetUp / FEN where they apply; English SAN. */
function chPgn(rec) {
  const clean = (v) => String(v === undefined || v === null || v === '' ? '?' : v).replace(/["\\\]\[]/g, '');
  const tag = (k, v) => '[' + k + ' "' + clean(v) + '"]';
  const d = new Date(rec.at || Date.now());
  const two = (n) => String(n).padStart(2, '0');
  const res = rec.result === 'w' ? '1-0' : rec.result === 'b' ? '0-1' : rec.result === 'd' ? '1/2-1/2' : '*';
  const names = rec.names || [];
  const start = rec.start && rec.start !== CHESS_START_FEN ? rec.start : '';
  const out = [tag('Event', 'Ashry'), tag('Site', typeof appLink === 'function' ? appLink() : ''), tag('Date', d.getFullYear() + '.' + two(d.getMonth() + 1) + '.' + two(d.getDate())),
    tag('Round', '-'), tag('White', names[0]), tag('Black', names[1]), tag('Result', res)];
  if (rec.variant === '960') out.push(tag('Variant', 'Chess960'));
  // الوزير المستخبي: a revealing move is written as the queen's (a chess site reads the moves as far as it can).
  if (rec.variant === 'hq') out.push(tag('Variant', 'Hidden Queen'));
  if (start) { out.push(tag('SetUp', '1')); out.push(tag('FEN', start)); }
  if (rec.reason === 'time') out.push(tag('Termination', 'time forfeit'));
  const g = start ? chessFromFen(start) : chessNew();
  const words = [];
  (rec.moves || []).forEach((uci, k) => {
    const mover = g.turn, num = g.full || 1;
    const info = chessPlay(g, chessFromUci(uci));
    if (!info) return;
    if (mover === 0) words.push(num + '.');
    else if (k === 0) words.push(num + '...');
    words.push(info.san);
  });
  words.push(res);
  // Lines under 80 characters, as PGN files keep them.
  const lines = [];
  let line = '';
  words.forEach(w => { if (line && (line + ' ' + w).length > 79) { lines.push(line); line = w; } else line = line ? line + ' ' + w : w; });
  if (line) lines.push(line);
  return out.join('\n') + '\n\n' + lines.join('\n') + '\n';
}

/** The video's format, where this phone can record a canvas ('' where it can't: the button isn't shown). */
function chVideoMime() {
  try {
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported || typeof HTMLCanvasElement === 'undefined' || !HTMLCanvasElement.prototype.captureStream) return '';
    return ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  } catch (e) { return ''; }
}

// 0.6 s a move, 20 s at most (longer games show fewer positions, evenly, the last always), the end held.
const CH_VIDEO = { w: 720, h: 900, step: 600, max: 20000, hold: 1600 };

/** Which positions a video of n moves shows: all of them, or evenly fewer so it stays under 20 seconds. */
function chVideoFrames(n) {
  const most = Math.floor(CH_VIDEO.max / CH_VIDEO.step);
  if (n + 1 <= most) return Array.from({ length: n + 1 }, (x, k) => k);
  const out = [];
  for (let k = 0; k < most; k++) { const i = Math.round(k * n / (most - 1)); if (out[out.length - 1] !== i) out.push(i); }
  return out;
}

let chShareBusy = false;

/** Sends a file (the video): the share sheet, else a download. */
async function chShareFile(blob, name, title) {
  let file = null;
  try { file = new File([blob], name, { type: blob.type }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: title }); return 'shared'; }
    catch (err) { if (err && err.name === 'AbortError') return 'shared'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  showToast(chT('share_card_saved') || '', 'success');
  return 'downloaded';
}

/** The game replayed on a canvas and recorded: the names over the board, the result under it. */
async function chShareVideo(rec) {
  const mime = chVideoMime();
  if (!mime) return 'unsupported';
  const cols = chBoardColours();
  const imgs = await chPieceImages(cols);
  const pos = chRecordPositions(rec);
  const frames = chVideoFrames(pos.length - 1);
  const W = CH_VIDEO.w, H = CH_VIDEO.h, top = 90;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const brand = typeof shareCardColours === 'function' ? shareCardColours() : { ground: ['#6d28d9', '#4c1d95', '#2e1065'], token: '#fbbf24', ink: '#ffffff' };
  const names = rec.names || ['', ''];
  const orient = rec.me === 1 ? 1 : 0;
  const pair = chResultPair(rec.result);
  let shown = -1;
  const draw = (k) => {
    shown = k;
    ctx.fillStyle = brand.ground[2];
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'middle';
    ctx.font = '800 32px Cairo, "Segoe UI", sans-serif';
    ctx.fillStyle = brand.ink;
    // The side at the top of the board is named at the top.
    const topSide = orient ? 0 : 1, botSide = 1 - topSide;
    ctx.direction = 'rtl'; ctx.textAlign = 'center';
    ctx.fillText(shareCardFit(ctx, (topSide ? '⚫ ' : '⚪ ') + (names[topSide] || ''), W - 40), W / 2, top / 2);
    chDrawBoardFrame(ctx, imgs, cols, { board: pos[k].board, last: pos[k].last, orient: orient }, 0, top, W);
    ctx.fillStyle = brand.ink;
    ctx.fillText(shareCardFit(ctx, (botSide ? '⚫ ' : '⚪ ') + (names[botSide] || ''), W - 200), W / 2, top + W + (H - top - W) / 2);
    ctx.direction = 'ltr';
    ctx.font = '900 30px Cairo, "Segoe UI", sans-serif';
    ctx.fillStyle = brand.token;
    ctx.textAlign = 'left';
    ctx.fillText(k === pos.length - 1 ? pair[botSide] : Math.ceil(k / 2) + '/' + Math.ceil((pos.length - 1) / 2), 24, top + W + (H - top - W) / 2);
  };
  const stream = canvas.captureStream(30);
  const rc = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 2500000 });
  const chunks = [];
  rc.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((resolve) => { rc.onstop = resolve; });
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  draw(frames[0]);
  rc.start(250);
  // The canvas is painted again every 100 ms so the recorder keeps receiving frames.
  const keep = setInterval(() => draw(shown), 100);
  for (let f = 0; f < frames.length; f++) { draw(frames[f]); await wait(CH_VIDEO.step); }
  await wait(CH_VIDEO.hold);
  clearInterval(keep);
  rc.stop();
  await stopped;
  stream.getTracks().forEach(t => t.stop());
  const type = mime.split(';')[0];
  const blob = new Blob(chunks, { type: type });
  if (!blob.size) return 'failed';
  chShareVideo.last = blob;
  return chShareFile(blob, 'ashry-chess.' + (type === 'video/mp4' ? 'mp4' : 'webm'), chT('setup_shatranj'));
}

/** Sends the moves as text: the share sheet, else copied. */
async function chSharePgn(rec) {
  const text = chPgn(rec);
  if (navigator.share) {
    try { await navigator.share({ title: chT('setup_shatranj'), text: text }); return 'shared'; }
    catch (err) { if (err && err.name === 'AbortError') return 'shared'; }
  }
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const area = document.createElement('textarea');
    area.value = text; area.setAttribute('readonly', ''); area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(area); area.select();
    try { document.execCommand('copy'); } catch (x) {}
    area.remove();
  }
  showToast(chT('ch_pgn_copied'), 'success');
  return 'copied';
}

/** The share card for a kept game: the final position, who played, the result and the accuracy if reviewed. */
function chShareCardData(rec) {
  const pos = chRecordPositions(rec);
  const end = pos[pos.length - 1];
  const names = rec.names || ['', ''];
  const pair = chResultPair(rec.result);
  const acc = rec.review && rec.review.accuracy ? rec.review.accuracy : null;
  const line = chResultLine(rec.result, rec.reason, names) + (acc ? ' · ' + chT('ch_share_acc') + ' ' + acc.map(a => (a === null ? '-' : Math.round(a) + '%')).join(' / ') : '');
  return {
    title: chT('setup_shatranj') + (rec.variant === '960' ? ' 960' : rec.variant === 'hq' ? ' · 👑 ' + chT('ch_var_hq') : ''),
    icon: (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID.shatranj && CATALOG_BY_ID.shatranj.icon) || '♞',
    rows: [{ name: '⚪ ' + (names[0] || ''), value: pair[0] }, { name: '⚫ ' + (names[1] || ''), value: pair[1] }, line],
    board: { board: end.board, last: end.last, orient: rec.me === 1 ? 1 : 0 },
    text: chT('setup_shatranj') + ': ' + (names[0] || '') + ' ' + pair[0] + ' - ' + pair[1] + ' ' + (names[1] || '')
  };
}

/** A share button pressed: 'pic', 'pgn' or 'video', for the game kept under `key`. */
async function chShareGame(kind, key) {
  const rec = chFindRec(key);
  if (!rec || chShareBusy) return;
  chShareBusy = true;
  const btns = document.querySelectorAll('[data-ch-share]');
  btns.forEach(b => { b.disabled = true; });
  const btn = document.querySelector(`[data-ch-share="${kind}"]`);
  const label = btn ? btn.innerHTML : '';
  if (btn && kind !== 'pgn') btn.innerHTML = '⏳ ' + escapeHTML(chT('ch_share_making'));
  try {
    if (kind === 'pgn') await chSharePgn(rec);
    else if (kind === 'video') await chShareVideo(rec);
    else await shareResultCard(chShareCardData(rec));
  } catch (e) { console.warn('chess share', e); }
  chShareBusy = false;
  btns.forEach(b => { b.disabled = false; });
  if (btn) btn.innerHTML = label;
}

/** The three ways to send a kept game, as a row of buttons (the video only where it can be recorded). */
function chShareRowHtml(key) {
  if (!key || !chFindRec(key)) return '';
  const k = jsStringAttr(key);
  const b = (kind, text) => `<button type="button" class="btn btn--secondary btn--sm btn--auto" data-ch-share="${kind}" onclick="chShareGame('${kind}', '${k}')">${text}</button>`;
  return `<div class="ch-share"><p class="ch-share__title">📤 ${escapeHTML(chT('ch_share'))}</p><div class="ch-share__row">` +
    b('pic', '🖼️ ' + escapeHTML(chT('ch_share_pic'))) + b('pgn', '📄 PGN') + (chVideoMime() ? b('video', '🎬 ' + escapeHTML(chT('ch_share_video'))) : '') + '</div></div>';
}

/* --- the review screen ------------------------------------------------------------- */

// rec: the game; rv: the engine's step-by-step review; res: the finished review;
// infos: each move as played (for what was taken); ply: 0 = the start, k = after move k.
const chRv = { id: '', rec: null, rv: null, res: null, infos: [], lost: [], ply: 0, better: false, timer: null, from: '', shown: null };

/** Opens a kept game's review. */
function chOpenReview(id) {
  const rec = chLoadGames().find(g => g.id === id);
  if (!rec) return;
  chReviewShow(rec);
}

/** The review of the game just finished on this phone. */
function chOpenLastReview() {
  const s = chState();
  const rec = chLoadGames().find(g => g.key === 'local|' + s.gameId);
  if (rec) chReviewShow(rec);
}

/** A room's game, reviewed on this phone (kept too, for later). */
function chOpenRoomReview(state) {
  const s = state.shared || {};
  const bd = s.chess;
  if (!bd || !bd.hist || !bd.hist.length) return;
  const names = duelRoomNames(state);
  const r = bd.result || {};
  const seat = state.youAreScreen ? -1 : (s.seats || []).indexOf(Room.me);
  const rec = chStoreGame({ mode: 'room', names: [names[0] || '', names[1] || ''], me: seat, result: r.result || 'd', reason: r.reason || '',
    start: bd.start || '', moves: bd.hist.slice(), key: chRoomGameKey(state), variant: bd.hq ? 'hq' : (s.settings || {}).variant === '960' ? '960' : '' });
  if (rec) chReviewShow(rec);
}

function chReviewShow(rec) {
  chReviewStop();
  chRv.id = rec.id;
  chRv.shown = null;
  chRv.rec = rec;
  chRv.res = rec.review || null;
  chRv.rv = chessReviewBegin(rec);
  chRv.better = false;
  // What each move took, to set the taken pieces beside the board at every step.
  const g = rec.start ? chessFromFen(rec.start) : chessNew();
  chRv.infos = [];
  chRv.lost = [[[], []]];
  const lost = [[], []];
  chRv.rv.moves.forEach(mv => {
    const mover = g.turn;
    const info = chessPlay(g, mv);
    chRv.infos.push(info);
    if (info && info.capture) lost[1 - mover].push(info.capture);
    chRv.lost.push([lost[0].slice(), lost[1].slice()]);
  });
  chRv.ply = chRv.rv.moves.length;
  appState.shatranjReview = { id: rec.id, ply: chRv.ply };
  if (appState.currentView !== 'review-shatranj') setView('review-shatranj');
  chReviewPaint(true);
  if (!chRv.res) chReviewRun();
}

/** Works the review out a position a tick, the progress bar filling, then keeps it with the game. */
function chReviewRun() {
  const rv = chRv.rv;
  const id = chRv.id;
  const step = () => {
    chRv.timer = null;
    if (chRv.id !== id || appState.currentView !== 'review-shatranj') return;
    const t0 = Date.now();
    let done = false;
    // A slice of about 60ms, then the page breathes.
    while (!done && Date.now() - t0 < 60) done = chessReviewStep(rv, { nodes: CH_REVIEW_NODES, ms: 1500 });
    chReviewProgress(rv.i / rv.positions.length);
    if (!done) { chRv.timer = setTimeout(step, 16); return; }
    chRv.res = chessReviewResult(rv);
    const list = chLoadGames();
    const at = list.findIndex(g => g.id === id);
    if (at !== -1) { list[at].review = chRv.res; chSaveGames(list); }
    chReviewPaint(false, true);
  };
  chReviewProgress(0);
  chRv.timer = setTimeout(step, 60);
}

function chReviewStop() {
  if (chRv.timer) clearTimeout(chRv.timer);
  chRv.timer = null;
}

function chReviewProgress(f) {
  const bar = document.querySelector('#review-shatranj-stage [data-ch-progress]');
  if (bar) bar.style.setProperty('--p', Math.round(f * 100) + '%');
  const txt = document.querySelector('#review-shatranj-stage [data-ch-progress-txt]');
  if (txt) txt.textContent = chT('ch_reviewing', { p: Math.round(f * 100) });
}

function chReviewGo(ply) {
  const n = chRv.rv ? chRv.rv.moves.length : 0;
  const p = Math.max(0, Math.min(n, ply));
  if (p === chRv.ply && !chRv.better) return;
  chRv.ply = p;
  chRv.better = false;
  if (appState.shatranjReview) appState.shatranjReview.ply = p;
  haptic('light');
  chReviewPaint();
}

function chReviewBetter() {
  chRv.better = !chRv.better;
  haptic('light');
  chReviewPaint();
}

/** From this moment, against the computer: the better move played for you, then it's the computer's turn. */
function chReviewTry() {
  const k = chRv.ply - 1;
  const res = chRv.res;
  if (!res || k < 0 || !res.moves[k] || !res.moves[k].best) return;
  const before = chRv.rv.positions[k];
  const s = chState();
  const go = () => {
    // Played against the computer; the setup's own choice comes back afterwards (paintShatranjSetup).
    if (!s.practice && s.vs !== 'phone') s.vsBefore = s.vs;
    s.vs = 'phone';
    chNewGame({ fen: chessFen(before), me: before.turn, practice: true, lost: (chRv.lost || [])[k] });
    const st = chState();
    const best = res.moves[k].best;
    chApplyMove(st, { from: best.from, to: best.to, promo: best.promo });
    chPaint();
    chAfterMove();
  };
  // A game left in the middle on this phone isn't replaced without asking.
  // A rated game left in the middle counts as a loss, and says so (chConfirmReplace).
  if (typeof chRatedPending === 'function' && chRatedPending(s)) chConfirmReplace(go);
  else if (s.g && s.phase === 'play' && !s.practice && (s.hist || []).length) showConfirmModal(chT('ch_try_replace'), go);
  else go();
}

function chReviewHtml() {
  return `<div class="ch-game duel ch-review">
      <div class="ch-layout">
        <div class="ch-layout__stage"><div class="ch-stage" data-ch-host></div></div>
        <div class="ch-layout__side">
          <div class="ch-rv-head" data-ch-rvhead></div>
          <div class="ch-rv-nav" dir="ltr">
            <button type="button" class="btn btn--ghost btn--sm" onclick="chReviewGo(0)" aria-label="⏮">⏮</button>
            <button type="button" class="btn btn--secondary btn--sm" onclick="chReviewGo(chRv.ply - 1)" aria-label="◀">◀</button>
            <span class="ch-rv-nav__at metric" data-ch-rvat></span>
            <button type="button" class="btn btn--secondary btn--sm" onclick="chReviewGo(chRv.ply + 1)" aria-label="▶">▶</button>
            <button type="button" class="btn btn--ghost btn--sm" onclick="chReviewGo(99999)" aria-label="⏭">⏭</button>
          </div>
          <div data-ch-rvnote></div>
          <div data-ch-rvbody></div>
        </div>
      </div>
    </div>`;
}

/** The evaluation as a graph: White's share above the line, the current move marked. */
function chGraphHtml(graph, ply, moves) {
  const n = graph.length - 1;
  if (n < 1) return '';
  const W = 300, H = 90;
  const x = (i) => (i / n) * W;
  const y = (v) => H / 2 - (v / 1000) * (H / 2 - 3);
  let path = `M0 ${H} `;
  graph.forEach((v, i) => { path += `L${x(i).toFixed(1)} ${y(v).toFixed(1)} `; });
  path += `L${W} ${H} Z`;
  const dots = (moves || []).map((m, i) => (m.cls === 'blunder' || m.cls === 'mistake' || m.cls === 'brilliant')
    ? `<circle class="ch-graph__dot ch-graph__dot--${m.cls}" cx="${x(i + 1).toFixed(1)}" cy="${y(graph[i + 1]).toFixed(1)}" r="3.4"/>` : '').join('');
  return `<div class="ch-graph" dir="ltr">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" onclick="chGraphClick(event, ${n})" role="img" aria-label="${escapeHTML(chT('ch_graph'))}">
        <rect width="${W}" height="${H}" class="ch-graph__bg"/>
        <path d="${path}" class="ch-graph__white"/>
        <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" class="ch-graph__mid"/>
        <line x1="${x(ply).toFixed(1)}" x2="${x(ply).toFixed(1)}" y1="0" y2="${H}" class="ch-graph__at"/>
        ${dots}
      </svg>
    </div>`;
}

function chGraphClick(ev, n) {
  const r = ev.currentTarget.getBoundingClientRect();
  chReviewGo(Math.round((ev.clientX - r.left) / r.width * n));
}

function chReviewPaint(fresh, justDone) {
  const el = document.getElementById('review-shatranj-stage');
  if (!el || !chRv.rv) return;
  if (!el.querySelector('.ch-review') || el._chLang !== appState.lang || fresh) { el.innerHTML = chReviewHtml(); el._chLang = appState.lang; }
  const rec = chRv.rec, rv = chRv.rv, res = chRv.res;
  const n = rv.moves.length;
  const k = chRv.ply - 1;            // the move just made at this step
  const stepped = typeof chRv.shown === 'number' ? chRv.ply - chRv.shown : 1;
  chRv.shown = chRv.ply;
  const showBefore = chRv.better && k >= 0;
  const pos = rv.positions[showBefore ? k : chRv.ply];
  const info = k >= 0 ? chRv.infos[k] : null;
  const verdict = res && k >= 0 ? res.moves[k] : null;
  const arrows = [];
  if (showBefore && verdict && verdict.best) {
    arrows.push({ from: rv.moves[k].from, to: rv.moves[k].to, color: 'rgba(249, 115, 22, 0.8)' });
    arrows.push({ from: verdict.best.from, to: verdict.best.to, color: 'rgba(34, 197, 94, 0.9)' });
  }
  // The side you played at the bottom (a game you watched, or two on one phone: White).
  const orient = rec.me === 1 ? 1 : 0;
  const model = {
    key: 'review|' + rec.id, board: pos.board, orient: orient, loud: true,
    last: !showBefore && info ? { from: info.from, to: info.to } : null,
    // A move slides only when the step is that move, one forward; stepping back or jumping just shows the position.
    anim: info && !showBefore ? Object.assign({ key: 'rv|' + rec.id + '|' + chRv.ply, still: !!fresh || stepped !== 1 }, info) : { key: 'rv|' + rec.id + '|b' + chRv.ply, still: true },
    check: chessCheckSq(pos), mate: '',
    sel: '', targets: [], marks: [], arrows: arrows,
    lost: chRv.lost[showBefore ? k : chRv.ply] || [[], []],
    input: null
  };
  chViewShow(el.querySelector('[data-ch-host]'), model);
  const names = rec.names || ['', ''];
  const acc = res ? res.accuracy : [null, null];
  const head = `<div class="ch-rv-players">${[0, 1].map(c => `
      <div class="ch-rv-player">
        <span class="ch-mark ${c ? 'is-dark' : 'is-light'}" aria-hidden="true">${chPieceSvg(6 | (c ? 8 : 0))}</span>
        <span class="ch-rv-player__name"><bdi>${escapeHTML(names[c] || '')}</bdi></span>
        <span class="ch-rv-player__acc">${acc[c] === null ? '' : `<b class="metric" data-ch-acc="${c}">${acc[c]}</b><small>%</small>`}</span>
      </div>`).join('')}</div>
    <p class="duel-status is-done">${escapeHTML(chResultLine(rec.result, rec.reason, names))}</p>
    ${rec.rating ? `<p class="ch-rating-result ${rec.rating.delta > 0 ? 'is-up' : rec.rating.delta < 0 ? 'is-down' : ''}">⭐ ${escapeHTML(chT('ch_rating_now', { r: rec.rating.after }))} <b dir="ltr">${chDeltaText(rec.rating.delta)}</b></p>` : ''}
    ${res ? '' : `<div class="ch-progress"><span class="ch-progress__bar" data-ch-progress style="--p:0%"></span></div><p class="field__hint ch-progress__txt" data-ch-progress-txt>${escapeHTML(chT('ch_reviewing', { p: 0 }))}</p>`}`;
  chSetHtml(el, '[data-ch-rvhead]', head);
  const at = el.querySelector('[data-ch-rvat]');
  if (at) at.textContent = chRv.ply + ' / ' + n;
  // The note on the move at this step.
  let note = '';
  if (k < 0) note = `<p class="field__hint">${escapeHTML(chT('ch_rv_start'))}</p>`;
  else if (!verdict) note = `<div class="ch-comment"><span class="ch-comment__head"><b dir="ltr">${Math.floor(k / 2) + 1}${k % 2 ? '…' : '.'} ${escapeHTML(chFigurine(rv.sans[k]))}</b></span></div>`;
  else {
    const why = chReasonsLine(verdict.reasons, 2);
    const worse = verdict.cls !== 'best' && verdict.cls !== 'brilliant';
    note = `<div class="ch-comment ch-comment--${verdict.cls}">
        <span class="ch-comment__head"><b dir="ltr">${Math.floor(k / 2) + 1}${k % 2 ? '…' : '.'} ${escapeHTML(chFigurine(rv.sans[k]))}</b> ${chClassDot(verdict.cls)} ${escapeHTML(chT('ch_cls_' + verdict.cls))}</span>
        ${why ? `<span class="ch-comment__why">${escapeHTML(why)}</span>` : ''}
        ${worse && verdict.best ? `<span class="ch-comment__better">${escapeHTML(chT('ch_better'))} <b dir="ltr">${escapeHTML(chFigurine(verdict.best.san))}</b></span>` : ''}
        ${worse && verdict.best ? `<span class="ch-comment__btns">
            <button type="button" class="btn btn--secondary btn--xs btn--auto" onclick="chReviewBetter()">👁 ${escapeHTML(chRv.better ? chT('ch_rv_back') : chT('ch_rv_show_better'))}</button>
            <button type="button" class="btn btn--primary btn--xs btn--auto" onclick="chReviewTry()">🎯 ${escapeHTML(chT('ch_rv_try'))}</button>
            ${(verdict.cls === 'mistake' || verdict.cls === 'blunder') && typeof chPzFromReview === 'function' ? `<button type="button" class="btn btn--secondary btn--xs btn--auto" onclick="chPzFromReview(${k})">🧩 ${escapeHTML(chT('chpz_try_as_puzzle'))}</button>` : ''}
          </span>` : ''}
      </div>`;
  }
  if (typeof chOpeningMatch === 'function' && !rv.variant && (!rv.start || rv.start === CHESS_START_FEN)) {
    const fullTheory = chOpeningMatch(rv.sans, { start: rv.start, variant: rv.variant });
    if (fullTheory && rv.sans.length >= fullTheory.outOfTheoryPly && k === fullTheory.outOfTheoryPly - 1) {
      note += `<p class="field__hint ch-rv-theory">📖 ${escapeHTML(chT('ch_out_of_theory', { n: fullTheory.outOfTheoryPly }))}</p>`;
    }
  }
  chSetHtml(el, '[data-ch-rvnote]', note);
  // The rest: the key moments, the graph, the counts, the moves.
  let body = '';
  if (res) {
    if (res.key.length) {
      body += `<div class="ch-keys"><p class="field__label">⚡ ${escapeHTML(chT('ch_rv_keys'))}</p><div class="chip-set">${res.key.map(x =>
        `<button type="button" class="chip ch-key ch-key--${x.kind} ${chRv.ply === x.i + 1 ? 'is-active' : ''}" onclick="chReviewGo(${x.i + 1})">${escapeHTML(chT('ch_key_' + x.kind))} · <b dir="ltr">${Math.floor(x.i / 2) + 1}${x.i % 2 ? '…' : '.'} ${escapeHTML(chFigurine(rv.sans[x.i]))}</b></button>`).join('')}</div></div>`;
    }
    body += chGraphHtml(res.graph, chRv.ply, res.moves);
    const kinds = ['brilliant', 'best', 'good', 'inaccuracy', 'mistake', 'blunder'];
    const count = (c, kind) => res.moves.filter(m => m.color === c && m.cls === kind).length;
    body += `<div class="ch-counts"><span></span><span class="ch-counts__who"><bdi>${escapeHTML(names[0])}</bdi></span><span class="ch-counts__who"><bdi>${escapeHTML(names[1])}</bdi></span>${kinds.map(kind =>
      `<span class="ch-counts__k">${chClassDot(kind)} ${escapeHTML(chT('ch_cls_' + kind))}</span><b class="metric">${count(0, kind)}</b><b class="metric">${count(1, kind)}</b>`).join('')}</div>`;
  }
  body += chShareRowHtml(rec.id);
  body += chMovesHtml(rv.sans, { current: chRv.ply - 1, marks: res ? res.moves.map(m => m.cls) : null, onClick: 'chReviewGoMove', start: rv.start, variant: rv.variant });
  body += `<div class="duel-actions"><button type="button" class="btn btn--ghost btn--sm" onclick="chReviewExit()">${escapeHTML(chT('exit'))}</button></div>`;
  chSetHtml(el, '[data-ch-rvbody]', body);
  // The current move kept in sight inside the list (never by scrolling the page away from the board).
  const cur = el.querySelector('.ch-mv.is-current');
  const list = el.querySelector('.ch-moves');
  if (cur && list) {
    const top = cur.offsetTop - list.offsetTop;
    if (top < list.scrollTop || top > list.scrollTop + list.clientHeight - cur.offsetHeight) list.scrollTop = Math.max(0, top - list.clientHeight / 2);
  }
  if (justDone && res && !motionOff()) {
    [0, 1].forEach(c => { const a = el.querySelector(`[data-ch-acc="${c}"]`); if (a && acc[c] !== null && typeof countUp === 'function') countUp(a, 0, Math.round(acc[c])); });
  }
}

const chReviewGoMove = (k) => chReviewGo(k + 1);

function chReviewExit() {
  chReviewStop();
  appState.shatranjReview = null;
  if (typeof Room !== 'undefined' && Room.isIn && Room.state && Room.state.game === 'chess' && typeof roomReturnToActive === 'function') { roomReturnToActive(); return; }
  setupShatranj();
}

/** Arrow keys on a laptop step through the game. */
document.addEventListener('keydown', (e) => {
  if (appState.currentView !== 'review-shatranj' || (typeof soloKeyBlocked === 'function' && soloKeyBlocked(e))) return;
  if (e.key === 'ArrowLeft') { chReviewGo(chRv.ply - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { chReviewGo(chRv.ply + 1); e.preventDefault(); }
});

/** A reload on the review: the same game, the same step (worked out again if it wasn't kept). */
function restoreShatranjReview() {
  const r = appState.shatranjReview;
  if (!r || !r.id) return false;
  const rec = chLoadGames().find(g => g.id === r.id);
  if (!rec) return false;
  chReviewShow(rec);
  if (r.ply !== undefined) chReviewGo(r.ply);
  return true;
}

if (typeof soloRegister === 'function') {
  soloRegister('shatranjReview', { setup: 'setup-shatranj', play: 'review-shatranj', restore: restoreShatranjReview, repaint: () => chReviewPaint(true) });
}

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from) => { if (from === 'review-shatranj') chReviewStop(); });
}
</script>
