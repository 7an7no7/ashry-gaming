<script>
/* ============================================================================
   القنبلة — PASS THE BOMB
   ----------------------------------------------------------------------------
   One phone, passed round the table. A category is on the screen and a fuse
   nobody can see is burning: say something in the category, pass the phone,
   and whoever is holding it when it goes off loses the round. The ticking
   gets faster as the fuse runs down, which is the only warning anyone gets.

   The fuse is a deadline (appState.bomb.endsAt), so a reload mid-round comes
   back with the time it really had left.

   With names picked on the setup screen, the boom asks who was holding it: a
   tap gives that player a strike (the same name again takes it back, another
   name moves it), the strikes are the board, and "end game" puts the table on
   the podium by the rounds each one survived - fewest strikes highest.
   Without names it plays as it always did.

   The tick is a setTimeout chain that no clock covers, so leaving the screen
   stops it (onLeaveScreen below) and a tick for a screen that is gone does
   nothing.
   ========================================================================= */

/* The categories and letters (BOMB_PROMPTS, BOMB_LETTERS) live in BombPrompts.js, shared with the rooms server. */


/* How long the fuse burns, in seconds, [shortest, longest]. Nobody sees it. */
const BOMB_FUSES = { short: [15, 30], normal: [25, 55], long: [40, 80] };

let bombTickTimer = null;
let bombClock = null;

function bombState() {
  if (!appState.bomb) appState.bomb = { fuse: 'normal', mode: 'category', prompt: '', endsAt: 0, total: 0, phase: 'idle', rounds: 0 };
  const b = appState.bomb;
  if (!Array.isArray(b.players)) b.players = [];
  if (!b.strikes || typeof b.strikes !== 'object') b.strikes = {};
  if (typeof b.roundLoser !== 'string') b.roundLoser = '';
  return b;
}

// Left running, the tick went on behind the menu - faster and faster, forever.
onLeaveScreen((from) => { if (from === 'play-bomb') bombStop(); });

function setupBomb() {
  const b = bombState();
  bombStop();
  b.phase = 'idle';
  setView('setup-bomb');
  paintBombSetup();
}

function paintBombSetup() {
  const b = bombState();
  document.querySelectorAll('#bomb-mode .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === b.mode));
  document.querySelectorAll('#bomb-fuse .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === b.fuse));
}

function setBombOption(key, value) {
  bombState()[key] = value;
  saveToLocal();
  paintBombSetup();
}

/** Pulls a category or a letter this phone hasn't dealt lately. */
function bombNextPrompt() {
  const b = bombState();
  const lang = contentLang();
  const wantLetter = b.mode === 'letter' || (b.mode === 'mix' && Math.random() < 0.35);
  if (wantLetter) {
    const letter = freshPick('bomb:letters:' + lang, BOMB_LETTERS[lang], 1)[0];
    return { kind: 'letter', text: letter };
  }
  const pool = BOMB_PROMPTS[lang] || BOMB_PROMPTS.ar;
  return { kind: 'category', text: freshPick('bomb:' + lang, pool, 1)[0] };
}

/**
 * A new game: the names picked on the setup screen (or `players`, for the
 * same table again), nobody with a strike. Fewer than two names plays
 * without a board.
 */
function bombNewGame(players) {
  const b = bombState();
  const picked = players || (document.getElementById('bomb-player-list') ? (appState.activePlayers || []).slice() : []);
  b.players = picked.length >= 2 ? picked : [];
  b.strikes = {};
  b.players.forEach(p => { b.strikes[p] = 0; });
  b.rounds = 0;
  b.roundLoser = '';
  b.startedAt = Date.now();
}

function startBombRound() {
  const b = bombState();
  // The setup screen's button starts a game; the boom screen's the next round.
  if (appState.currentView === 'setup-bomb') bombNewGame();
  b.roundLoser = '';
  const range = BOMB_FUSES[b.fuse] || BOMB_FUSES.normal;
  const seconds = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
  const prompt = bombNextPrompt();
  b.prompt = prompt.text;
  b.kind = prompt.kind;
  b.total = seconds;
  b.endsAt = Date.now() + seconds * 1000;
  b.phase = 'ticking';
  b.rounds = (b.rounds || 0) + 1;
  saveToLocal();
  if (appState.currentView !== 'play-bomb') setView('play-bomb');
  paintBomb();
  bombArm();
}

/** A new category on the same fuse - the table was stuck, not out of time. */
function bombSwapPrompt() {
  const b = bombState();
  if (b.phase !== 'ticking') return;
  const prompt = bombNextPrompt();
  b.prompt = prompt.text;
  b.kind = prompt.kind;
  saveToLocal();
  paintBomb();
  haptic('light');
}

/** The clock that ends the round, and the ticking that gets faster. */
function bombArm() {
  const b = bombState();
  bombStop();
  const left = Math.max(0, Math.ceil((b.endsAt - Date.now()) / 1000));
  if (left <= 0) { bombExplode(); return; }
  bombClock = createClock({ seconds: left, onEnd: () => { bombClock = null; bombExplode(); } });
  bombTick();
}

function bombTick() {
  const b = bombState();
  bombTickTimer = null;
  if (b.phase !== 'ticking' || appState.currentView !== 'play-bomb') return;
  const total = Math.max(1, b.total * 1000);
  const remaining = Math.max(0, b.endsAt - Date.now());
  const frac = Math.min(1, remaining / total);
  playSound('bomb');
  const card = document.getElementById('bomb-card');
  if (card) {
    card.classList.remove('is-tick');
    void card.offsetWidth;
    card.classList.add('is-tick');
    card.classList.toggle('is-urgent', remaining < 8000);
  }
  // A second between ticks at the start, a quarter of one at the end.
  const delay = 250 + 750 * Math.pow(frac, 1.4);
  bombTickTimer = setTimeout(bombTick, delay);
}

function bombStop() {
  if (bombTickTimer) clearTimeout(bombTickTimer);
  bombTickTimer = null;
  if (bombClock) bombClock.stop();
  bombClock = null;
}

function bombExplode() {
  const b = bombState();
  bombStop();
  b.phase = 'boom';
  saveToLocal();
  playSound('alarm');
  haptic('heavy');
  paintBomb();
}

/** Who was holding it: a strike. The same name again takes it back; another name moves it. */
function bombPickLoser(index) {
  const b = bombState();
  const name = b.players[index];
  if (b.phase !== 'boom' || name === undefined) return;
  if (b.roundLoser) b.strikes[b.roundLoser] = Math.max(0, (b.strikes[b.roundLoser] || 0) - 1);
  if (b.roundLoser === name) {
    b.roundLoser = '';
  } else {
    b.roundLoser = name;
    b.strikes[name] = (b.strikes[name] || 0) + 1;
  }
  saveToLocal();
  haptic('light');
  paintBomb();
}

/** Strikes, fewest first. */
function bombStrikesBoard() {
  const b = bombState();
  return b.players.map(p => ({ id: p, name: p, score: b.strikes[p] || 0 }))
    .sort((x, y) => x.score - y.score);
}

function bombStrikesBlock(t) {
  return typeof bombStrikesHtml === 'function' ? bombStrikesHtml({ board: bombStrikesBoard() }, t) : '';
}

function bombEndGame() {
  const b = bombState();
  if (b.phase !== 'boom' || !b.players.length) return;
  bombStop();
  b.phase = 'over';
  saveToLocal();
  paintBomb();
  playSound('success');
  if (typeof confetti === 'function') afterReveal(document.getElementById('bomb-stage'), () => confetti({ particleCount: 140, spread: 90 }));
}

/** The same names again, strikes back to none, a fresh fuse. */
function bombPlayAgain() {
  const b = bombState();
  bombNewGame(b.players.slice());
  startBombRound();
}

function exitBomb() {
  bombStop();
  bombState().phase = 'idle';
  saveToLocal();
  setView('setup-bomb');
}

function paintBomb() {
  const b = bombState();
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('bomb-stage');
  if (!el) return;
  const kindLabel = b.kind === 'letter' ? (t.bomb_letter_label || '') : (t.bomb_category_label || '');
  const scoring = b.players.length >= 2;

  if (b.phase === 'over') {
    if (typeof scrollToAction === 'function') scrollToAction();   // the podium rises at the top
    // The podium ranks by the rounds each one came through, so fewest strikes stands highest.
    const safe = b.players.map(p => ({ name: p, score: Math.max(0, (b.rounds || 0) - (b.strikes[p] || 0)) }))
      .sort((x, y) => y.score - x.score);
    const podium = renderPodium({ code: 'bomb', game: b.startedAt + ':' + b.rounds }, safe);
    el.innerHTML = `
      <div class="card card--accent" style="text-align:center">
        <div class="eyebrow">🛡️ ${escapeHTML(t.bomb_safest || 'مين نجا أكتر؟')}</div>
        ${podium || `<div class="metric metric--md">🏆 ${escapeHTML((safe[0] || {}).name || '')}</div>`}
        <p class="field__hint">${escapeHTML(t.bomb_safest_hint || 'الرقم = الجولات اللي فرقعت فيها القنبلة في إيد غيره')}</p>
      </div>
      ${bombStrikesBlock(t)}
      <div class="btn-stack">
        <button class="btn btn--primary btn--lg" onclick="bombPlayAgain()">${escapeHTML(t.play_again || '')}</button>
        <button class="btn btn--ghost" onclick="exitBomb()">${escapeHTML(t.exit || '')}</button>
      </div>`;
    return;
  }

  if (b.phase === 'boom') {
    const sub = !scoring ? (t.bomb_boom_hint || '')
      : (b.roundLoser ? (t.bomb_room_loser || '').replace('{name}', b.roundLoser) : (t.bomb_room_who || ''));
    const who = scoring ? `
      <div class="card card--tight">
        <div class="eyebrow">💣 ${escapeHTML(t.bomb_room_who || '')}</div>
        <div class="chip-set">
          ${b.players.map((p, i) => {
            const on = p === b.roundLoser;
            return `<button type="button" class="pick-chip ${on ? 'is-on' : ''}" aria-pressed="${on}" onclick="bombPickLoser(${i})">${on ? '<span class="pick-chip__tick" aria-hidden="true">💥</span>' : ''}<span class="pick-chip__name">${escapeHTML(p)}</span></button>`;
          }).join('')}
        </div>
      </div>` : '';
    el.innerHTML = `
      <div class="bomb-card bomb-card--boom" id="bomb-card">
        <div class="bomb-boom" aria-hidden="true">💥</div>
        <div class="bomb-card__title">${escapeHTML(t.bomb_boom || '')}</div>
        <div class="bomb-card__sub">${escapeHTML(sub)}</div>
        <div class="bomb-card__prompt-small">${escapeHTML(kindLabel)}: <b>${escapeHTML(b.prompt)}</b></div>
      </div>
      ${who}
      ${scoring ? bombStrikesBlock(t) : ''}
      <div class="view-actions"><div class="btn-stack">
        <button class="btn btn--primary btn--lg" onclick="startBombRound()">${escapeHTML(t.bomb_next_round || '')}</button>
        <div class="btn-row">
          ${scoring ? `<button class="btn btn--secondary" onclick="bombEndGame()">🏁 ${escapeHTML(t.tb_finish || '')}</button>` : ''}
          <button class="btn btn--ghost" onclick="exitBomb()">${escapeHTML(t.exit || '')}</button>
        </div>
      </div></div>`;
    return;
  }

  el.innerHTML = `
    <div class="bomb-card" id="bomb-card">
      <div class="bomb-fuse" aria-hidden="true"><span class="bomb-emoji">💣</span></div>
      <div class="eyebrow">${escapeHTML(kindLabel)}</div>
      <div class="bomb-card__prompt ${b.kind === 'letter' ? 'bomb-card__prompt--letter' : ''}">${escapeHTML(b.prompt)}</div>
      <div class="bomb-card__sub">${escapeHTML(b.kind === 'letter' ? (t.bomb_letter_hint || '') : (t.bomb_category_hint || ''))}</div>
    </div>
    <div class="view-actions">
      <button class="btn btn--secondary btn--lg" onclick="bombSwapPrompt()">${escapeHTML(t.bomb_swap || '')}</button>
      <button class="btn btn--ghost" onclick="exitBomb()">${escapeHTML(t.stop || '')}</button>
    </div>`;
}

/** After a reload: carry on if the fuse is still burning; if it ran out meanwhile, the boom (whose hands?). */
function restoreBomb() {
  const b = bombState();
  if (b.phase === 'ticking' && b.endsAt > Date.now()) { paintBomb(); bombArm(); return true; }
  if (b.phase === 'ticking') {
    // It went off while the page was away. Dropping to the setup lost the round
    // and the next Start wiped the game's strikes; the table still says whose it was.
    b.phase = 'boom';
    saveToLocal();
    paintBomb();
    return true;
  }
  if (b.phase === 'boom' || (b.phase === 'over' && b.players.length)) { paintBomb(); return true; }
  return false;
}

onLanguageChange((view) => { if (view === 'play-bomb') paintBomb(); });
</script>
