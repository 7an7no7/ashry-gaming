<script>
/* ============================================================================
   MULTIPLAYER CLIENT
   ----------------------------------------------------------------------------
   Talks to the rooms server on Cloudflare (rooms-worker/). Creating and joining
   a room are plain requests. After that every phone keeps one WebSocket open
   to its room, and the room sends each phone what it may see the moment
   anything changes - nobody asks "anything new?" every few seconds.

     - A move goes over the socket, and its answer comes back on it.
     - A dropped connection (lock screen, WiFi to mobile data, a tunnel)
       reconnects by itself, and the room sends the current state on arrival.
     - On a network where WebSockets won't connect at all, the phone falls back
       to asking over plain HTTP every few seconds until one does.

   Games register a renderer with Room.onChange, so this file knows nothing
   about any particular game. The server's address is window.ROOMS_URL, set by
   tools/build-site.mjs (and by build-preview.mjs for local testing).
   ========================================================================= */

const Room = (() => {
  // v2 sessions carry the key the server issued to this phone. v1 sessions
  // were Apps Script rooms, which the new server has never heard of.
  const STORE_KEY = 'ashryRoom_v2';
  const OLD_STORE_KEY = 'ashryRoom_v1';

  const BASE = String(window.ROOMS_URL || '').replace(/\/+$/, '');
  const REQUEST_TIMEOUT = 12000;
  const ACK_TIMEOUT = 10000;
  const CONNECT_TIMEOUT = 8000;
  const HEARTBEAT_MS = 25000;        // a quiet socket is checked this often...
  const PONG_TIMEOUT = 6000;         // ...and replaced if it hasn't answered by then
  const RETRY_DELAYS = [300, 1000, 2000, 4000, 8000];
  const POLL_MS = 2500;              // the HTTP fallback's pace
  const OFFLINE_NOTICE_MS = 2000;    // a drop this short doesn't flash the sync dot

  const DROPPED = { gone: 'انتهت الغرفة', kicked: 'تمت إزالتك من الغرفة' };

  let session = null;      // { code, playerId, key, game }
  let state = null;        // last projection from the server
  let listeners = [];
  let liveListeners = [];
  let lastSignature = '';

  let socket = null;
  let retries = 0;
  let retryTimer = null;
  let connectTimer = null;
  let heartbeatTimer = null;
  let pongTimer = null;
  let offlineTimer = null;
  let pollTimer = null;
  let pollInFlight = false;
  let nextId = 1;
  const pending = new Map();   // ack id -> { resolve, reject, timer }

  /* --- persistence: survive a lock screen or an accidental reload --------- */
  const remember = () => {
    try {
      localStorage.removeItem(OLD_STORE_KEY);
      if (session) localStorage.setItem(STORE_KEY, JSON.stringify(session));
      else localStorage.removeItem(STORE_KEY);
    } catch (e) {}
  };
  const recall = () => {
    try {
      localStorage.removeItem(OLD_STORE_KEY);
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };

  /* --- HTTP: create, join, leave, and the fallback --------------------------- */

  /** POSTs to the rooms server and resolves with its answer ({ ok, ... }). */
  const request = async (path, body) => {
    if (!BASE) throw new Error('لا يوجد اتصال بالخادم');
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(() => { if (controller) controller.abort(); }, REQUEST_TIMEOUT);
    let res;
    try {
      // text/plain keeps this a "simple" request: no CORS preflight round trip.
      res = await fetch(BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(body),
        signal: controller ? controller.signal : undefined
      });
    } catch (err) {
      throw new Error(err && err.name === 'AbortError' ? 'انتهت مهلة الاتصال' : 'تعذر الاتصال بالخادم');
    } finally {
      clearTimeout(timer);
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!data) throw new Error('تعذر الاتصال بالخادم');
    return data;
  };

  /* --- change notification ----------------------------------------------- */
  const signatureOf = (s) => !s ? '' :
      s.version + '|' + s.phase + '|' + s.players.map(p => p.id + (p.online ? '1' : '0')).join(',') +
      '|' + (s.screens || []).map(x => x.id + (x.online ? '1' : '0')).join(',');

  const emit = (force) => {
    const sig = signatureOf(state);
    if (!force && sig === lastSignature) return;
    lastSignature = sig;
    listeners.forEach(fn => { try { fn(state); } catch (e) { console.error('room listener', e); } });
  };

  const handleDropped = (message) => {
    const wasIn = !!session;
    session = null; state = null; lastSignature = '';
    disconnect();
    failPending(message);
    remember();
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
    if (wasIn) {
      showToast(message, 'error');
      emit(true);
      setView('menu');
    }
  };

  /* --- the live connection ------------------------------------------------- */
  const connected = () => !!socket && socket.readyState === 1;

  const send = (msg) => {
    if (!connected()) return false;
    try {
      socket.send(typeof msg === 'string' ? msg : JSON.stringify(msg));
      return true;
    } catch (e) {
      return false;
    }
  };

  const socketUrl = () => BASE.replace(/^http/i, 'ws') + '/ws?code=' + encodeURIComponent(session.code) +
      '&pid=' + encodeURIComponent(session.playerId) + '&key=' + encodeURIComponent(session.key);

  function connect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    if (!session || !BASE || socket) return;
    let ws;
    try { ws = new WebSocket(socketUrl()); } catch (e) { scheduleReconnect(); return; }
    socket = ws;
    clearTimeout(connectTimer);
    connectTimer = setTimeout(() => { if (socket === ws && ws.readyState !== 1) dropSocket(ws); }, CONNECT_TIMEOUT);

    ws.onopen = () => {
      if (socket !== ws) return;
      clearTimeout(connectTimer);
      retries = 0;
      stopPolling();
      clearTimeout(offlineTimer);
      offlineTimer = null;
      setSyncing(false);
      startHeartbeat();
    };
    ws.onmessage = (event) => { if (socket === ws) onMessage(event.data); };
    ws.onclose = () => dropSocket(ws);
    ws.onerror = () => {};     // a close always follows
  }

  /** Forgets a socket that died, fails the moves waiting on it, and tries again. */
  function dropSocket(ws) {
    if (socket !== ws) return;
    socket = null;
    clearTimeout(connectTimer);
    stopHeartbeat();
    try { ws.onopen = ws.onmessage = ws.onclose = null; ws.close(); } catch (e) {}
    failPending('انقطع الاتصال، حاول مرة أخرى');
    if (!session) return;
    if (!offlineTimer) {
      offlineTimer = setTimeout(() => {
        offlineTimer = null;
        if (session && !connected()) setSyncing(true);
      }, OFFLINE_NOTICE_MS);
    }
    scheduleReconnect();
  }

  function scheduleReconnect() {
    if (!session || retryTimer) return;
    // A hidden page waits: coming back to the screen reconnects at once.
    if (document.hidden) return;
    const delay = RETRY_DELAYS[Math.min(retries, RETRY_DELAYS.length - 1)];
    retries++;
    // Missed twice: keep the game moving over HTTP while the socket retries.
    if (retries >= 2) startPolling();
    retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
  }

  function disconnect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    clearTimeout(offlineTimer);
    offlineTimer = null;
    clearTimeout(connectTimer);
    stopPolling();
    stopHeartbeat();
    retries = 0;
    const ws = socket;
    socket = null;
    if (ws) { try { ws.onopen = ws.onmessage = ws.onclose = null; ws.close(1000); } catch (e) {} }
  }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(() => ping(PONG_TIMEOUT), HEARTBEAT_MS);
  }

  function stopHeartbeat() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    clearTimeout(pongTimer);
    pongTimer = null;
  }

  /**
   * Asks for a "pong" (Cloudflare answers it without waking the room). A socket
   * that doesn't answer in time is replaced - after a lock screen a phone can
   * hold a socket that looks open but is long dead.
   */
  function ping(timeout) {
    const ws = socket;
    if (!ws || ws.readyState !== 1 || pongTimer) return;
    if (!send('ping')) { dropSocket(ws); return; }
    pongTimer = setTimeout(() => {
      pongTimer = null;
      dropSocket(ws);
    }, timeout);
  }

  function onMessage(raw) {
    if (raw === 'pong') {
      clearTimeout(pongTimer);
      pongTimer = null;
      return;
    }
    let msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    if (!msg || !session) return;

    if (msg.t === 'state') {
      state = msg.state;
      emit(false);
    } else if (msg.t === 'strokes') {
      applyStrokes(msg);
    } else if (msg.t === 'ack') {
      settleAck(msg);
    } else if (msg.t === 'live') {
      liveListeners.forEach(fn => { try { fn(msg.d); } catch (e) { console.error('room live listener', e); } });
    } else if (msg.t === 'gone') {
      handleDropped(DROPPED.gone);
    } else if (msg.t === 'kicked' || msg.t === 'left') {
      handleDropped(DROPPED.kicked);
    }
  }

  /**
   * New strokes arrive as just the strokes, so a drawing isn't resent to every
   * phone several times a second. They only fit onto the exact version they
   * were cut from; anything else asks the room for a full copy.
   */
  function applyStrokes(patch) {
    const strokes = state && state.shared && state.shared.strokes;
    if (state && state.version === patch.from && Array.isArray(strokes)) {
      patch.add.forEach(st => strokes.push(st));
      state.version = patch.v;
      emit(false);
      return;
    }
    send({ t: 'sync' });
  }

  function settleAck(msg) {
    if (msg.patch) applyStrokes(msg.patch);
    else if (msg.state) { state = msg.state; emit(false); }

    const waiter = pending.get(msg.id);
    if (!waiter) return;
    pending.delete(msg.id);
    clearTimeout(waiter.timer);
    if (msg.ok) { waiter.resolve(state); return; }
    if (msg.gone || msg.kicked) handleDropped(msg.gone ? DROPPED.gone : DROPPED.kicked);
    waiter.reject(new Error(msg.error || 'تعذر تنفيذ الإجراء'));
  }

  function failPending(message) {
    pending.forEach(w => { clearTimeout(w.timer); w.reject(new Error(message)); });
    pending.clear();
  }

  /* --- HTTP fallback, only while the socket can't connect ------------------ */
  function startPolling() {
    if (pollTimer || !session) return;
    const tick = async () => {
      pollTimer = setTimeout(tick, POLL_MS);
      if (!session || connected() || pollInFlight || document.hidden) return;
      pollInFlight = true;
      try {
        const res = await request('/poll', {
          code: session.code, pid: session.playerId, key: session.key, v: state ? state.version : 0
        });
        if (!session || connected()) return;
        if (res.gone) { handleDropped(DROPPED.gone); return; }
        if (res.kicked) { handleDropped(DROPPED.kicked); return; }
        if (res.same && state) {
          state.players.forEach(p => { p.online = res.online.indexOf(p.id) !== -1; });
        } else if (res.state) {
          state = res.state;
        }
        setSyncing(false);
        emit(false);
      } catch (e) {
        // Still offline; the socket and this both keep trying.
      } finally {
        pollInFlight = false;
      }
    };
    pollTimer = setTimeout(tick, 0);
  }

  function stopPolling() {
    clearTimeout(pollTimer);
    pollTimer = null;
  }

  const adoptSession = (res, game) => {
    disconnect();
    session = { code: res.state.code, playerId: res.playerId, key: res.key, game: game };
    state = res.state;
    lastSignature = '';
    remember();
    emit(true);
    connect();
  };

  /* --- public API --------------------------------------------------------- */
  return {
    get state() { return state; },
    get session() { return session; },
    get isIn() { return !!session; },
    get isHost() { return !!(state && state.youAreHost); },
    get isScreen() { return !!(state && state.youAreScreen); },
    get me() { return session ? session.playerId : null; },
    get connected() { return connected(); },

    onChange(fn) { listeners.push(fn); return () => { listeners = listeners.filter(f => f !== fn); }; },

    /** Messages the room relays between phones without keeping (the line being drawn). */
    onLive(fn) { liveListeners.push(fn); return () => { liveListeners = liveListeners.filter(f => f !== fn); }; },
    sendLive(data) { return send({ t: 'live', d: data }); },

    /** `screen`: this device shows the room on a big screen instead of playing in it. */
    async create(name, gameId, screen) {
      const res = await request('/create', { name: name, game: gameId || null, screen: !!screen });
      if (!res.ok) throw new Error(res.error || 'تعذر إنشاء الغرفة');
      adoptSession(res, gameId);
      return res;
    },

    async join(code, name, screen) {
      const res = await request('/join', { code: String(code || '').trim().toUpperCase(), name: name, screen: !!screen });
      if (!res.ok) throw new Error(res.error || 'تعذر الانضمام للغرفة');
      adoptSession(res, res.state.game);
      return res;
    },

    /** Send a move. The server is authoritative: this resolves with the state after it. */
    act(action, payload) {
      if (!session) return Promise.reject(new Error('لست في غرفة'));

      if (connected()) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('انتهت مهلة الاتصال'));
            ping(3000);
          }, ACK_TIMEOUT);
          pending.set(id, { resolve, reject, timer });
          if (!send({ t: 'act', id: id, action: action, payload: payload || {} })) {
            pending.delete(id);
            clearTimeout(timer);
            reject(new Error('انقطع الاتصال، حاول مرة أخرى'));
          }
        });
      }

      // No socket right now: the same move over plain HTTP.
      const { code, playerId, key } = session;
      return request('/act', { code: code, pid: playerId, key: key, action: action, payload: payload || {} })
        .then(res => {
          if (res.gone || res.kicked) {
            handleDropped(res.gone ? DROPPED.gone : DROPPED.kicked);
            throw new Error(res.gone ? DROPPED.gone : DROPPED.kicked);
          }
          if (!res.ok) throw new Error(res.error || 'تعذر تنفيذ الإجراء');
          if (res.state && session) { state = res.state; emit(false); }
          connect();
          return state;
        });
    },

    async leave() {
      if (!session) return;
      const { code, playerId, key } = session;
      session = null; state = null; lastSignature = '';
      disconnect();
      failPending('لست في غرفة');
      remember();
      emit(true);
      if (typeof updateRoomBanner === 'function') updateRoomBanner();
      try { await request('/leave', { code: code, pid: playerId, key: key }); } catch (e) {}
    },

    /** Called on load: silently rejoin the room this device was last in. */
    async resume() {
      const saved = recall();
      if (!saved || !saved.code || !saved.playerId || !saved.key) return false;
      session = saved;
      try {
        const res = await request('/poll', { code: saved.code, pid: saved.playerId, key: saved.key, v: 0 });
        if (session !== saved) return false;
        if (!res.ok || res.gone || res.kicked || !res.state) {
          session = null;
          remember();
          return false;
        }
        state = res.state;
        emit(true);
        connect();
        return true;
      } catch (err) {
        // No connection right now. The room may well still be there, so keep
        // the session and let the socket keep trying; the state arrives with it.
        if (session === saved) connect();
        return false;
      }
    },

    /** Catch up now: the screen woke, the network came back, or something looks stale. */
    refresh() {
      if (!session) return;
      if (connected()) {
        send({ t: 'sync' });
        ping(3000);
      } else if (!socket) {
        connect();
      }
    }
  };
})();

// A phone that wakes up, or gets its network back, catches up at once.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Room.isIn) Room.refresh();
});
window.addEventListener('online', () => { if (Room.isIn) Room.refresh(); });
window.addEventListener('pageshow', (event) => { if (event.persisted && Room.isIn) Room.refresh(); });

/* ==========================================================================
   QR CODE
   --------------------------------------------------------------------------
   Rendered locally from the join URL. If the library fails to load the code is
   simply not drawn — the 4-letter room code is always shown as well and is
   usually the faster way in anyway.
   ========================================================================== */
function renderJoinQR(containerId, url) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  if (!url || typeof qrcode === 'undefined') { el.classList.add('hidden'); return; }
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    el.classList.remove('hidden');
  } catch (err) {
    el.classList.add('hidden');
  }
}

/* ==========================================================================
   LOBBY UI
   --------------------------------------------------------------------------
   Generic: creating a room, joining one, showing who's in and handing off to
   the game once the host starts. Each game supplies its own lobby options and
   its own start payload through ROOM_GAMES.
   ========================================================================== */

/** Registered per game in its own JS_*.html file. */
const ROOM_GAMES = {};

/** Remembering the name means a returning player types it once, ever. */
const roomName = {
  get() { try { return localStorage.getItem('ashryName') || ''; } catch (e) { return ''; } },
  set(v) { try { localStorage.setItem('ashryName', v); } catch (e) {} }
};

let pendingRoomGame = null;   // game id chosen before the room exists

/**
 * The games a room can play. The room itself is just the group — the host picks
 * from these, they play, and it comes back here for the next one.
 */
const ROOM_HUB_GAMES = [

  { id: 'justone',   icon: '🤫',   key: 'setup_justone',   accent: 'rose',   min: 3 },
  { id: 'whoami',    icon: '❓',   key: 'setup_whoami',    accent: 'teal',   min: 2 },
  { id: 'codenames', icon: '🔠',   key: 'setup_codenames', accent: 'indigo', min: 4 },
  { id: 'fibbage',    icon: '🤥',  key: 'setup_fibbage',    accent: 'rose',   min: 3 },
  { id: 'wouldyou',   icon: '⚖️',  key: 'setup_wouldyou',   accent: 'violet', min: 2 },
  { id: 'mostlikely', icon: '👉',  key: 'setup_mostlikely', accent: 'amber',  min: 3 },

/** Create an empty room from the menu — no game chosen yet. */
async function roomCreateEmpty() { return roomCreateFor(null); }

/** Entry point from a game's setup screen: "play on separate phones". */
async function roomCreateFor(gameId) {
  // Always asked, already filled in with the name used last time: one tap to
  // keep it, or type over it and the new one is remembered instead.
  const name = await promptForName();
  if (!name) return;
  roomName.set(name);
  pendingRoomGame = gameId;
  try {
    setSyncing(true);
    await Room.create(name, gameId);
    setSyncing(false);
    setView('room-lobby');
    // The room arrived while another screen was showing, so nothing has drawn it yet.
    if (Room.state) routeRoomState(Room.state);
  } catch (err) {
    setSyncing(false);
    showToast(err.message || 'تعذر إنشاء الغرفة', 'error');
  }
}

/** Opens the join screen, pre-filled if we arrived from a scanned link. */
function roomOpenJoin(prefillCode) {
  const codeEl = document.getElementById('room-join-code');
  const nameEl = document.getElementById('room-join-name');
  if (codeEl) codeEl.value = extractRoomCode(prefillCode);
  if (nameEl) nameEl.value = roomName.get();
  setView('room-join');
  // Send focus to whichever field is still empty.
  setTimeout(() => {
    const target = (codeEl && !codeEl.value) ? codeEl : nameEl;
    if (target) target.focus();
  }, 300);
}

/**
 * The room code in whatever was typed or pasted: a code, or a whole join link
 * someone sent ("…/?room=ABCD"), in any case and with stray spaces.
 */
function extractRoomCode(text) {
  const raw = String(text || '');
  const fromLink = /[?&]room=([A-Za-z0-9]{4,8})/.exec(raw);
  return (fromLink ? fromLink[1] : raw.replace(/[^A-Za-z0-9]/g, '')).toUpperCase().slice(0, 4);
}

/** Keeps the code field down to a clean code while typing or pasting. */
function tidyRoomCodeInput(el) {
  const code = extractRoomCode(el.value);
  if (el.value !== code) el.value = code;
  // Code complete and no name yet: carry on to the name.
  const nameEl = document.getElementById('room-join-name');
  if (code.length === 4 && nameEl && !nameEl.value && document.activeElement === el) nameEl.focus();
}

/**
 * Sends the join link through the phone's share sheet (WhatsApp and the rest),
 * or copies it where there is none - for friends who can't scan the QR code
 * because they aren't in the same place.
 */
async function roomShareLink() {
  const state = Room.state;
  const base = window.SERVER_DATA && window.SERVER_DATA.webAppUrl;
  if (!state || !base) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const url = base + '?room=' + state.code;
  const text = (t.room_share_text || '') + ' ' + state.code;
  if (navigator.share) {
    try {
      await navigator.share({ title: t.title || 'عشرى جيمينج', text: text, url: url });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // closed the share sheet
    }
  }
  const message = text + '\n' + url;
  let copied = false;
  try {
    await navigator.clipboard.writeText(message);
    copied = true;
  } catch (err) {
    // No clipboard API here (an older browser, or an embedded one): the old way.
    const area = document.createElement('textarea');
    area.value = message;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(area);
    area.select();
    try { copied = document.execCommand('copy'); } catch (e) {}
    area.remove();
  }
  if (copied) showToast(t.room_link_copied || 'تم نسخ رابط الغرفة', 'success');
  else showToast(url, 'info');
}

async function roomJoinFromForm() {
  const code = extractRoomCode(document.getElementById('room-join-code').value);
  const name = (document.getElementById('room-join-name').value || '').trim();
  if (code.length < 4) return showToast('اكتب كود الغرفة', 'error');
  if (!name) return showToast('اكتب اسمك', 'error');

  roomName.set(name);
  try {
    setSyncing(true);
    await Room.join(code, name);
    setSyncing(false);
    playSound('success');
    setView('room-lobby');
  } catch (err) {
    setSyncing(false);
    const msg = String(err.message || '');
    showToast(msg.indexOf('ROOM_NOT_FOUND') !== -1 ? 'لا توجد غرفة بهذا الكود' : msg, 'error');
  }
}

async function roomLeave() {
  const msg = appState.lang === 'ar' ? 'هل تريد مغادرة الغرفة؟' : 'Leave this room?';
  showConfirmModal(msg, async () => {
    await Room.leave();
    setView('menu');
  });
}

async function roomStartGame() {
  const game = ROOM_GAMES[Room.state && Room.state.game];
  if (!game) return showToast('لعبة غير مدعومة', 'error');
  try {
    await Room.act('start', game.startPayload ? game.startPayload() : {});
  } catch (err) {
    showToast(err.message || 'تعذر بدء اللعبة', 'error');
  }
}

/* --- rendering ----------------------------------------------------------- */

function renderRoomLobby(state) {
  const codeEl = document.getElementById('room-code-display');
  if (codeEl) codeEl.innerText = state.code;

  const url = (window.SERVER_DATA && window.SERVER_DATA.webAppUrl)
    ? window.SERVER_DATA.webAppUrl + '?room=' + state.code
    : '';
  renderJoinQR('room-qr', url);

  const list = document.getElementById('room-player-list');
  const count = document.getElementById('room-player-count');
  if (count) count.innerText = state.players.length;
  if (list) {
    const hostLabel = appState.lang === 'ar' ? 'المضيف' : 'Host';
    const youLabel = appState.lang === 'ar' ? 'أنت' : 'You';
    list.innerHTML = state.players.map(p => `
      <div class="status-row ${p.online ? '' : 'status-row--out'}">
        <span class="presence-dot ${p.online ? 'is-online' : ''}" aria-hidden="true"></span>
        <div class="status-row__body">
          <div class="status-row__name">${escapeHTML(p.name)}</div>
        </div>
        <div class="status-row__actions">
          ${p.id === Room.me ? `<span class="badge badge--accent">${youLabel}</span>` : ''}
          ${p.id === state.hostId ? `<span class="badge">${hostLabel}</span>` : ''}
        </div>
      </div>`).join('');
  }

  // Big screens in the room, listed under the players: they hold no seat.
  if (list && (state.screens || []).length) {
    const tt = TRANSLATIONS[appState.lang] || {};
    list.insertAdjacentHTML('beforeend', state.screens.map(sc => `
      <div class="status-row ${sc.online ? '' : 'status-row--out'}">
        <span class="presence-dot ${sc.online ? 'is-online' : ''}" aria-hidden="true"></span>
        <div class="status-row__body">
          <div class="status-row__name">📺 ${tt.tv_screen_badge || ''}</div>
        </div>
        <div class="status-row__actions">
          ${sc.id === state.hostId ? `<span class="badge">${appState.lang === 'ar' ? 'المضيف' : 'Host'}</span>` : ''}
        </div>
      </div>`).join(''));
  }

  const startBtn = document.getElementById('room-start-btn');
  const waitNote = document.getElementById('room-wait-note');
  const setup = document.getElementById('room-host-setup');
  const game = ROOM_GAMES[state.game];

  // No game picked yet: the lobby shows the hub instead of a start button.
  const inHub = !state.game;
  if (startBtn) startBtn.classList.toggle('hidden', inHub || !state.youAreHost);
  if (waitNote) waitNote.classList.toggle('hidden', !!state.youAreHost);

  if (setup) {
    const html = inHub
      ? renderRoomHub(state)
      : renderChosenGame(state, game);
    // Only rewrite when it changed, so an open <select> isn't reset by every update.
    if (setup.dataset.sig !== html) { setup.innerHTML = html; setup.dataset.sig = html; }
  }
}

/** The game picker. Everyone sees it; only the host can act on it. */
function renderRoomHub(state) {
  const t = TRANSLATIONS[appState.lang];
  const count = state.players.length;

  if (!state.youAreHost) {
    return `<div class="waiting-note">${t.room_hub_wait || 'المضيف يختار اللعبة…'}</div>`;
  }

  return `
    <div class="section">
      <div class="section__head">
        <h2 class="section__title">${t.room_pick_game || 'اختر لعبة'}</h2>
        <span class="section__rule"></span>
      </div>
      <div class="game-grid">
        ${ROOM_HUB_GAMES.map(g => {
          const enough = count >= g.min;
          return `
            <div class="game-card ${enough ? '' : 'is-disabled'}" data-accent="${g.accent}"
                 ${enough ? `onclick="roomAct('chooseGame', { game: '${g.id}' })"` : ''}>
              <div class="game-icon" aria-hidden="true">${g.icon}</div>
              <div class="game-title">${t[g.key] || g.id}</div>
              ${enough ? '' : `<div class="game-card__need">${g.min}+</div>`}
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

/** Once a game is chosen: its own options, plus a way back to the hub. */
function renderChosenGame(state, game) {
  const t = TRANSLATIONS[appState.lang];
  const entry = ROOM_HUB_GAMES.find(g => g.id === state.game);
  const name = entry ? (t[entry.key] || state.game) : state.game;
  const options = (game && game.lobbyOptions) ? game.lobbyOptions(state) : '';

  return `
    <div class="chosen-game">
      <span class="chosen-game__icon" aria-hidden="true">${entry ? entry.icon : '🎮'}</span>
      <span class="chosen-game__name">${name}</span>
      ${state.youAreHost
        ? `<button class="btn btn--ghost btn--xs btn--auto" onclick="roomAct('backToHub')">${t.room_change_game || 'تغيير'}</button>`
        : ''}
    </div>
    ${options}`;
}

/** Draws whatever the room is doing now: its lobby, a spectator note, or the game. */
function routeRoomState(state) {
  // A big screen draws every phase itself (JS_RoomTv.html).
  if (state.youAreScreen) {
    renderRoomTv(state);
    return;
  }
  // This device was the big screen a moment ago. Its frame uses the same
  // element ids as the phone screens, so it goes before they are drawn.
  if (typeof clearRoomTvView === 'function') clearRoomTvView();
  if (state.phase === 'lobby') {
    if (appState.currentView !== 'room-lobby') setView('room-lobby');
    renderRoomLobby(state);
    return;
  }
  // Joined after this round was dealt: watch, don't break the game.
  if (state.inGame === false) {
    renderRoomSpectator(state);
    return;
  }
  const game = ROOM_GAMES[state.game];
  if (game && game.render) game.render(state);
}

const onRoomView = () => (appState.currentView || '').indexOf('room-') === 0;

let roomStageSeen = '';

/**
 * The single place the room state reaches the UI.
 *
 * Someone who has stepped out of the room screens - to the menu, a timer, the
 * rules - is left where they are. Drawing the room would call setView and drag
 * them straight back, which is what every poll used to do. The banner keeps
 * them in touch; only a game actually starting is worth a nudge.
 */
Room.onChange((state) => {
  updateRoomBanner();
  if (!state) { roomStageSeen = ''; return; }

  const stage = state.phase + '|' + (state.game || '');
  const moved = roomStageSeen !== '' && roomStageSeen !== stage;
  roomStageSeen = stage;

  if (!onRoomView()) {
    if (moved && state.phase !== 'lobby') {
      const t = TRANSLATIONS[appState.lang] || {};
      showToast(t.room_started_away || 'اللعبة بدأت في الغرفة');
      haptic('light');
    }
    return;
  }
  routeRoomState(state);
});

/** The banner's "return": back to whatever the room is doing now. */
function roomReturnToActive() {
  const state = Room.state;
  if (!Room.isIn || !state) return;
  // The hidden view still holds the frame from when they left. Drop its
  // signature so it is rebuilt from the current state rather than trusted.
  if (state.phase !== 'lobby' && state.game) {
    const view = document.getElementById('view-room-' + state.game);
    if (view) delete view.dataset.sig;
  }
  routeRoomState(state);
  updateRoomBanner();
}

/** The strip under the header while you are in a room but looking at something else. */
function updateRoomBanner() {
  const banner = document.getElementById('active-room-banner');
  if (!banner) return;
  const session = Room.session;
  if (!session || onRoomView()) {
    banner.classList.add('hidden');
    return;
  }

  const t = TRANSLATIONS[appState.lang] || {};
  const s = Room.state;
  banner.classList.remove('hidden');
  banner.setAttribute('aria-label', t.active_room_label || '');

  const codeEl = document.getElementById('arb-code');
  if (codeEl) codeEl.textContent = session.code || '';

  let desc;
  if (!s || s.phase === 'lobby' || !s.game) {
    desc = (t.room_in_lobby || '') + ' \u2022 \ud83d\udc65 ' + ((s && s.players) ? s.players.length : 1);
  } else {
    const entry = ROOM_HUB_GAMES.find(g => g.id === s.game);
    desc = (t.room_playing_status || '') + ': ' + (entry ? entry.icon + ' ' + (t[entry.key] || entry.id) : s.game);
  }
  const descEl = document.getElementById('arb-desc');
  if (descEl) descEl.textContent = desc;

  const back = banner.querySelector('.arb__btn--return');
  if (back) back.title = t.room_return || '';
  const leave = banner.querySelector('.arb__btn--leave');
  if (leave) {
    leave.title = t.room_leave || '';
    leave.setAttribute('aria-label', leave.title);
  }
}

/**
 * Shown to someone who joined mid-round. They're already in the room and will
 * be dealt into the next game — this just keeps them from seeing a half-built
 * screen for a game they aren't holding cards in.
 */
function renderRoomSpectator(state) {
  if (appState.currentView !== 'room-lobby') setView('room-lobby');
  const t = TRANSLATIONS[appState.lang];
  const setup = document.getElementById('room-host-setup');
  const startBtn = document.getElementById('room-start-btn');
  const waitNote = document.getElementById('room-wait-note');

  // Lobby first: it rewrites the same nodes, so writing the spectator note
  // before it meant the note was replaced by the game picker straight away and
  // a mid-round joiner never saw why they were waiting.
  renderRoomLobby(state);

  if (startBtn) startBtn.classList.add('hidden');
  if (waitNote) waitNote.classList.add('hidden');
  if (setup) {
    const html = `<div class="waiting-note">
        <span class="animate-pulse">⏳</span> ${t.room_spectating || 'جولة جارية — ستنضم في الجولة القادمة'}
      </div>`;
    if (setup.dataset.sig !== html) { setup.innerHTML = html; setup.dataset.sig = html; }
  }
}

/**
 * Asks for the player's name in a sheet rather than window.prompt(), which is
 * blocked in some embedded contexts — including the one this app is served in.
 */
let nameModalResolve = null;

function promptForName() {
  return new Promise(resolve => {
    nameModalResolve = resolve;
    const input = document.getElementById('name-modal-input');
    const modal = document.getElementById('name-modal');
    if (!input || !modal) { resolve(''); return; }

    input.value = roomName.get();
    modal.classList.remove('hidden');
    setTimeout(() => { input.focus(); input.select(); }, 320);
  });
}

function submitNameModal() {
  const input = document.getElementById('name-modal-input');
  const value = (input.value || '').trim().slice(0, 24);
  if (!value) { showToast(TRANSLATIONS[appState.lang].name_needed || 'اكتب اسمك', 'error'); return; }
  closeModal('name-modal');
  const done = nameModalResolve;
  nameModalResolve = null;
  if (done) done(value);
}

/** Settings → your name: change the name rooms use without joining one. */
async function changeSavedName() {
  closeModal('settings-modal');
  const name = await promptForName();
  if (!name) return;
  roomName.set(name);
  showToast((TRANSLATIONS[appState.lang] || {}).name_saved || 'تم حفظ الاسم', 'success');
}

function cancelNameModal() {
  closeModal('name-modal');
  const done = nameModalResolve;
  nameModalResolve = null;
  if (done) done('');
}

/* --- boot ---------------------------------------------------------------- */

/**
 * On load: honour a scanned ?room= link first, otherwise silently rejoin
 * whatever room this device was last in.
 */
async function initRooms() {
  const injected = (window.SERVER_DATA && window.SERVER_DATA.room) || '';
  if (injected) {
    // Arriving from a QR/link beats any stale session on this device.
    if (Room.isIn) await Room.leave();
    roomOpenJoin(injected);
    return;
  }
  const resumed = await Room.resume();
  // Reloaded on a room screen: draw it. Anywhere else, stay put - the banner
  // is the way back.
  if (resumed && Room.state && onRoomView()) routeRoomState(Room.state);
  updateRoomBanner();
}
</script>
