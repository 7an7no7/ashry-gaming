<script>
/* ============================================================================
   THE SOUNDBOARD — twelve sounds the table can throw in mid-game
   ----------------------------------------------------------------------------
   Every sound is made here with the Web Audio API, on the audio context the
   click sounds already use: nothing is downloaded, so they play at once,
   offline, and never depend on someone else's server (the old board pulled
   mp3s from a meme site). playFx(name) plays one; the sheet
   (openSoundboard) lists them all; a small 🔊 button sits on every play and
   room screen so the host doesn't have to dig for it, and every burst of
   confetti in the app brings a fanfare with it.
   ========================================================================= */

const FX_LIST = [
  { id: 'applause', emoji: '👏', key: 'fx_applause' },
  { id: 'tada',     emoji: '🎉', key: 'fx_tada' },
  { id: 'ding',     emoji: '✅', key: 'fx_ding' },
  { id: 'buzzer',   emoji: '❌', key: 'fx_buzzer' },
  { id: 'drum',     emoji: '🥁', key: 'fx_drum' },
  { id: 'fail',     emoji: '🎺', key: 'fx_fail' },
  { id: 'sad',      emoji: '🎻', key: 'fx_sad' },
  { id: 'crickets', emoji: '🦗', key: 'fx_crickets' },
  { id: 'boo',      emoji: '👎', key: 'fx_boo' },
  { id: 'airhorn',  emoji: '📣', key: 'fx_airhorn' },
  { id: 'siren',    emoji: '🚨', key: 'fx_siren' },
  { id: 'whistle',  emoji: '😗', key: 'fx_whistle' }
];

/* --- the instruments ----------------------------------------------------- */
// Where the sounds go: the app's audio context, or an OfflineAudioContext
// set here to render one to a buffer (how the applause was checked).
let fxRenderTo = null;
function fxCtx() {
  if (fxRenderTo) return fxRenderTo;
  if (audioCtx.state !== 'running' && audioCtx.state !== 'closed') audioCtx.resume();
  return audioCtx;
}

/** A second of white noise, made once and shared by every clap. */
let fxNoiseBuf = null;
function fxNoiseBuffer(ctx) {
  if (fxNoiseBuf && fxNoiseBuf.sampleRate === ctx.sampleRate) return fxNoiseBuf;
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  fxNoiseBuf = buf;
  return buf;
}

/** A tone: type, a frequency ramp [[time, hz], ...], a gain envelope [[time, level], ...]. */
function fxTone(type, freqs, gains, at, detune) {
  const ctx = fxCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  if (detune) osc.detune.value = detune;
  freqs.forEach(([t, hz], i) => (i === 0 ? osc.frequency.setValueAtTime(hz, at + t) : osc.frequency.exponentialRampToValueAtTime(hz, at + t)));
  gains.forEach(([t, lv], i) => (i === 0 ? g.gain.setValueAtTime(lv, at + t) : g.gain.linearRampToValueAtTime(lv, at + t)));
  osc.connect(g); g.connect(ctx.destination);
  const end = Math.max(freqs[freqs.length - 1][0], gains[gains.length - 1][0]);
  osc.start(at); osc.stop(at + end + 0.05);
}

/** A burst of noise through a filter: type, frequency, Q, envelope. */
function fxNoise(filterType, hz, q, gains, at) {
  const ctx = fxCtx();
  const end = gains[gains.length - 1][0];
  const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * (end + 0.05)), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = filterType; f.frequency.value = hz; f.Q.value = q;
  const g = ctx.createGain();
  gains.forEach(([t, lv], i) => (i === 0 ? g.gain.setValueAtTime(lv, at + t) : g.gain.linearRampToValueAtTime(lv, at + t)));
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(at); src.stop(at + end + 0.05);
}

const FX = {
  applause(at) {
    // A room clapping. A hand clap is not one burst of noise but three or four
    // cracks inside 25ms (the palms meet unevenly) with a short room tail, in
    // the band where palms ring (about 1-2 kHz). A crowd is a dozen people,
    // each clapping at their own steady pace with their own pitch and
    // strength, over a soft wash of everyone else, swelling in and fading out.
    const ctx = fxCtx();
    const noise = fxNoiseBuffer(ctx);
    const dur = 2.6;
    const out = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    out.connect(comp); comp.connect(ctx.destination);
    out.gain.setValueAtTime(0.0001, at);
    out.gain.exponentialRampToValueAtTime(1.7, at + 0.35);
    out.gain.setValueAtTime(1.7, at + 1.6);
    out.gain.exponentialRampToValueAtTime(0.0001, at + dur);

    const bed = ctx.createBufferSource();
    bed.buffer = noise; bed.loop = true;
    const bedFilter = ctx.createBiquadFilter();
    bedFilter.type = 'bandpass'; bedFilter.frequency.value = 1400; bedFilter.Q.value = 0.6;
    const bedGain = ctx.createGain();
    bedGain.gain.value = 0.05;
    bed.connect(bedFilter); bedFilter.connect(bedGain); bedGain.connect(out);
    bed.start(at); bed.stop(at + dur);

    const clap = (t, hz, level) => {
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = hz; bp.Q.value = 1.1;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      [0, 0.008, 0.016, 0.024].forEach((d, i) => {
        const peak = level * (1 - i * 0.2);
        g.gain.linearRampToValueAtTime(peak, t + d + 0.0012);
        g.gain.exponentialRampToValueAtTime(peak * 0.15, t + d + 0.007);
      });
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      src.connect(bp); bp.connect(g); g.connect(out);
      src.start(t, Math.random() * 0.8, 0.16);
    };

    for (let p = 0; p < 12; p++) {
      const pace = 0.16 + Math.random() * 0.1;          // 4-6 claps a second
      const hz = 900 + Math.random() * 1300;
      const level = 0.25 + Math.random() * 0.3;
      let t = Math.random() * pace;
      while (t < dur - 0.15) {
        clap(at + t, hz * (0.95 + Math.random() * 0.1), level * (0.75 + Math.random() * 0.5));
        t += pace * (0.85 + Math.random() * 0.3);
      }
    }
  },
  tada(at) {
    [523, 659, 784, 1047].forEach((hz, i) => fxTone('triangle', [[0, hz]], [[0, 0], [0.01, 0.16], [0.28, 0.12], [0.5, 0.001]], at + i * 0.09));
    fxTone('triangle', [[0, 1047]], [[0, 0], [0.02, 0.2], [0.5, 0.15], [1.0, 0.001]], at + 0.36);
    fxNoise('highpass', 6000, 0.7, [[0, 0], [0.02, 0.08], [0.5, 0.001]], at + 0.36);
  },
  ding(at) {
    fxTone('sine', [[0, 880]], [[0, 0], [0.01, 0.2], [0.35, 0.001]], at);
    fxTone('sine', [[0, 1320]], [[0, 0], [0.01, 0.16], [0.5, 0.001]], at + 0.12);
  },
  buzzer(at) {
    fxTone('square', [[0, 130], [0.45, 110]], [[0, 0], [0.01, 0.12], [0.4, 0.12], [0.45, 0.001]], at);
    fxTone('square', [[0, 131], [0.45, 111]], [[0, 0], [0.01, 0.08], [0.4, 0.08], [0.45, 0.001]], at, 12);
  },
  drum(at) {
    // Ba-dum-tss: two kicks, a snare, a cymbal.
    const kick = (t) => fxTone('sine', [[0, 160], [0.14, 45]], [[0, 0], [0.005, 0.5], [0.15, 0.001]], t);
    kick(at); kick(at + 0.2);
    fxNoise('bandpass', 1800, 0.8, [[0, 0], [0.005, 0.35], [0.12, 0.001]], at + 0.42);
    fxTone('triangle', [[0, 220], [0.1, 180]], [[0, 0], [0.005, 0.2], [0.1, 0.001]], at + 0.42);
    fxNoise('highpass', 5000, 0.5, [[0, 0], [0.01, 0.3], [0.9, 0.001]], at + 0.6);
  },
  fail(at) {
    // The sad trombone: four notes sliding down.
    [[0, 311], [0.45, 293], [0.9, 277], [1.35, 261]].forEach(([t, hz], i) => {
      const last = i === 3;
      fxTone('sawtooth', [[0, hz * 1.02], [0.08, hz], [last ? 0.9 : 0.4, last ? hz * 0.85 : hz * 0.99]],
             [[0, 0], [0.03, 0.14], [last ? 0.7 : 0.35, 0.12], [last ? 1.0 : 0.42, 0.001]], at + t);
    });
  },
  sad(at) {
    // A violin sighing: a slow slide down with vibrato.
    const ctx = fxCtx();
    const osc = ctx.createOscillator(), g = ctx.createGain(), vib = ctx.createOscillator(), vg = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, at);
    osc.frequency.exponentialRampToValueAtTime(330, at + 1.6);
    osc.frequency.exponentialRampToValueAtTime(262, at + 2.4);
    vib.frequency.value = 5.5; vg.gain.value = 6;
    vib.connect(vg); vg.connect(osc.frequency);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.14, at + 0.3); g.gain.linearRampToValueAtTime(0.1, at + 2.0); g.gain.linearRampToValueAtTime(0.001, at + 2.6);
    osc.connect(f); f.connect(g); g.connect(ctx.destination);
    vib.start(at); osc.start(at); osc.stop(at + 2.7); vib.stop(at + 2.7);
  },
  crickets(at) {
    for (let i = 0; i < 8; i++) {
      const t = at + i * 0.22 + Math.random() * 0.05;
      for (let k = 0; k < 3; k++) fxTone('sine', [[0, 4200 + Math.random() * 300]], [[0, 0], [0.005, 0.05], [0.03, 0.001]], t + k * 0.04);
    }
  },
  boo(at) {
    for (let i = 0; i < 5; i++) {
      const t = at + i * 0.06;
      fxTone('sawtooth', [[0, 190 - i * 8], [0.7, 120 - i * 6]], [[0, 0], [0.05, 0.05], [0.5, 0.05], [0.75, 0.001]], t, (i - 2) * 25);
    }
    fxNoise('lowpass', 500, 0.5, [[0, 0], [0.1, 0.12], [0.6, 0.08], [0.8, 0.001]], at);
  },
  airhorn(at) {
    [0, 7, -5].forEach(d => fxTone('sawtooth', [[0, 233], [0.05, 220], [0.9, 205]], [[0, 0], [0.02, 0.12], [0.75, 0.12], [0.95, 0.001]], at, d));
    fxTone('square', [[0, 440], [0.9, 410]], [[0, 0], [0.02, 0.04], [0.75, 0.04], [0.95, 0.001]], at);
  },
  siren(at) {
    const ctx = fxCtx();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'square';
    for (let i = 0; i < 4; i++) {
      osc.frequency.setValueAtTime(600, at + i * 0.4);
      osc.frequency.linearRampToValueAtTime(950, at + i * 0.4 + 0.2);
      osc.frequency.linearRampToValueAtTime(600, at + i * 0.4 + 0.4);
    }
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(0.08, at + 0.05); g.gain.setValueAtTime(0.08, at + 1.5); g.gain.linearRampToValueAtTime(0.001, at + 1.6);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(at); osc.stop(at + 1.65);
  },
  whistle(at) {
    fxTone('sine', [[0, 1800], [0.15, 2600], [0.45, 1700]], [[0, 0], [0.02, 0.14], [0.4, 0.12], [0.5, 0.001]], at);
    fxNoise('bandpass', 2200, 6, [[0, 0], [0.02, 0.05], [0.45, 0.001]], at);
  },

  // --- the سكرو table's own, quiet and short (not on the soundboard: FX_LIST doesn't list them) ---
  skrFlick(at) {
    // A card sliding off the deck: a soft swish.
    fxNoise('bandpass', 3200, 1.2, [[0, 0], [0.015, 0.06], [0.09, 0.001]], at);
  },
  skrRiffle(at) {
    // A riffle shuffle: a run of tiny clicks, slowing a little.
    for (let i = 0; i < 12; i++) fxNoise('highpass', 4200, 0.8, [[0, 0], [0.003, 0.05], [0.02, 0.001]], at + i * 0.035 + i * i * 0.0012);
  },
  skrDrum(at) {
    // المسحراتي's two drum beats.
    const beat = (t) => { fxTone('sine', [[0, 150], [0.16, 55]], [[0, 0], [0.006, 0.32], [0.18, 0.001]], t); fxNoise('lowpass', 900, 0.7, [[0, 0], [0.004, 0.1], [0.08, 0.001]], t); };
    beat(at); beat(at + 0.26);
  },
  skrThump(at) {
    // The cannon, بوم: a low thump.
    fxTone('sine', [[0, 110], [0.22, 38]], [[0, 0], [0.008, 0.38], [0.26, 0.001]], at);
    fxNoise('lowpass', 600, 0.6, [[0, 0], [0.01, 0.14], [0.2, 0.001]], at);
  }
};

function playFx(name) {
  const fn = FX[name];
  if (!fn) return;
  try { fn(fxCtx().currentTime + 0.01); } catch (e) {}
}

/* --- the sheet and the button ---------------------------------------------- */
function openSoundboard() {
  const t = TRANSLATIONS[appState.lang];
  const grid = document.getElementById('soundboard-grid');
  if (grid) {
    grid.innerHTML = FX_LIST.map(fx => `
      <button type="button" class="fx-btn" onclick="playFx('${fx.id}')">
        <span class="fx-btn__emoji" aria-hidden="true">${fx.emoji}</span>
        <span class="fx-btn__name">${escapeHTML(t[fx.key] || fx.id)}</span>
      </button>`).join('');
  }
  const title = document.getElementById('soundboard-title');
  if (title) title.textContent = t.sounds || '';
  document.getElementById('soundboard-modal').classList.remove('hidden');
}
function toggleSoundboard() { openSoundboard(); }

/** The 🔊 button: shown on play and room screens (setView toggles body.has-fx). */
function syncFxButton(viewId) {
  const on = /^(play-|room-)/.test(viewId || '') && viewId !== 'room-tv';
  document.body.classList.toggle('has-fx', on);
}

/* --- a voice that reads out loud ------------------------------------------- */
/*
   The narrator مافيا can turn on (JS_RoomMafia.html). Kept here beside the
   other sounds because it is one: a line the room hears, on one device.

   Three things make browser speech awkward, and all three are handled here:
   getVoices() is empty until 'voiceschanged' fires on most browsers, so the
   list is asked for again each time rather than cached at load; iOS will not
   speak unless it has been started inside a tap, so speakPrime() runs on the
   first one and a refusal is swallowed; and nothing at all is said when there
   is no voice for the language - an Arabic line read by an English voice is
   worse than silence.
*/
let speakPrimed = false;

/** Is there a voice this browser can read `lang` with? */
function speakVoiceFor(lang) {
  try {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return null;
    const want = lang === 'en' ? 'en' : 'ar';
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => String(v.lang || '').toLowerCase().indexOf(want) === 0) || null;
  } catch (e) { return null; }
}

/**
 * Says one line, in `lang`, or does nothing at all. Returns whether it spoke,
 * which is what the tests read. Never throws: a browser with no speech, a
 * language with no voice and a refusal all come back false.
 */
function speakLine(text, lang) {
  const line = String(text == null ? '' : text).trim();
  if (!line) return false;
  const voice = speakVoiceFor(lang);
  if (!voice) return false;
  try {
    window.speechSynthesis.cancel();
    const say = new SpeechSynthesisUtterance(line);
    say.voice = voice;
    say.lang = voice.lang;
    say.rate = 0.95;
    window.speechSynthesis.speak(say);
    return true;
  } catch (e) { return false; }
}

/** Anything being said stops: leaving a game, leaving a room, closing the app. */
function speakStop() {
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
}

/**
 * iOS only lets speech start inside a tap. This runs on the first one, says
 * an empty line to unlock it, and is a no-op everywhere else. A refusal is
 * silent - the narrator simply never speaks on that device.
 */
function speakPrime() {
  if (speakPrimed) return;
  speakPrimed = true;
  try {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    const warm = new SpeechSynthesisUtterance('');
    warm.volume = 0;
    window.speechSynthesis.speak(warm);
  } catch (e) {}
}
document.addEventListener('pointerdown', speakPrime, { once: true, capture: true });
document.addEventListener('keydown', speakPrime, { once: true, capture: true });
// The voice list arrives late on most browsers; nothing to do but let it.
try { if (window.speechSynthesis) window.speechSynthesis.addEventListener('voiceschanged', () => {}); } catch (e) {}
onLeaveScreen(() => speakStop());

/* Every burst of confetti in the app brings a fanfare with it. The confetti is
   drawn by a script, so the stylesheet's reduced-motion rules can't still it:
   with motion off (Settings → الحركة, or the device) only the fanfare plays.
   It is drawn above everything, full-screen tools (على راسك, the chess clock)
   included, which otherwise hid it. */
(function () {
  // The page starts with a silent stand-in (Controller.html) while the real
  // confetti loads async. The stand-in is wrapped too (so the fanfare still
  // plays if the CDN never answers), and the real one is wrapped when it lands.
  const wrap = () => {
    if (typeof window.confetti !== 'function' || window.confetti.__fx) return !!(window.confetti && window.confetti.__fx && !window.confetti.__overStub);
    const real = window.confetti;
    const overStub = !!real.__stub;
    // The top layer of the scale in Style.html (--z-confetti), read once it is needed.
    let layer = 0;
    const confettiLayer = () => layer || (layer = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--z-confetti'), 10) || 100050);
    const wrapped = function (opts) {
      if (!(typeof roomHasScreen === 'function' && roomHasScreen())) {
        playFx('tada');
      }
      if (typeof reducedMotion === 'function' && reducedMotion()) return Promise.resolve();
      const args = Array.prototype.slice.call(arguments);
      if (!opts || typeof opts !== 'object') args[0] = {};
      if (args[0].zIndex == null) args[0] = Object.assign({}, args[0], { zIndex: confettiLayer() });
      return real.apply(this, args);
    };
    wrapped.__fx = true;
    wrapped.__overStub = overStub;
    window.confetti = wrapped;
    return !overStub;
  };
  if (!wrap()) window.addEventListener('load', wrap);
})();
</script>
