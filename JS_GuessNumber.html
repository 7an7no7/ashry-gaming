<script>
/* --- GUESS THE NUMBER LOGIC --- */

function setupGuessNumber() {
    setGuessMode('computer'); // Default
    setView('setup-guessnum');
}

function setGuessMode(mode) {
    appState.guessnum.mode = mode;
    
    // UI Tabs Styling
    const btnComp = document.getElementById('btn-mode-comp');
    const btnHuman = document.getElementById('btn-mode-human');
    const divComp = document.getElementById('setup-comp-ui');
    const divHuman = document.getElementById('setup-human-ui');

    const isComputer = (mode === 'computer');
    btnComp.classList.toggle('is-active', isComputer);
    btnHuman.classList.toggle('is-active', !isComputer);
    divComp.classList.toggle('hidden', !isComputer);
    divHuman.classList.toggle('hidden', isComputer);
}

function startGuessNumber() {
    let min, max, target;
    
    if (appState.guessnum.mode === 'computer') {
        // --- COMPUTER MODE ---
        min = parseInt(document.getElementById('gn-min').value);
        max = parseInt(document.getElementById('gn-max').value);

        if (isNaN(min) || isNaN(max) || min >= max) {
            showToast(appState.lang === 'ar' ? "المدى غير صحيح!" : "Invalid Range!");
            return;
        }
        target = Math.floor(Math.random() * (max - min + 1)) + min;
        
        // Show range to player
        document.getElementById('gn-range-display').innerText = `${min} - ${max}`;
    
    } else {
        // --- HUMAN MODE ---
        min = null; max = null;      // the range is the secret here
        const secretInput = document.getElementById('gn-secret');
        target = parseInt(secretInput.value);
        
        if (isNaN(target)) {
            showToast(appState.lang === 'ar' ? "أدخل الرقم السري!" : "Enter Secret Number!");
            return;
        }
        
        // Clear input immediately for security
        secretInput.value = ''; 
        
        // Hide range (it's a secret!)
        document.getElementById('gn-range-display').innerText = "???";
    }

    // Init Game State
    appState.guessnum.target = target;
    appState.guessnum.attempts = 0;
    appState.guessnum.history = [];
    appState.guessnum.status = 'playing';
    appState.guessnum.min = min;
    appState.guessnum.max = max;

    // UI Reset
    document.getElementById('gn-input').value = '';
    document.getElementById('gn-feedback').innerHTML = appState.lang === 'ar' ? 'ابدأ التخمين!' : 'Start Guessing!';
    document.getElementById('gn-history').innerHTML = '';
    document.getElementById('gn-attempts').innerText = '0';

    setView('play-guessnum');
}

function checkNumberGuess() {
    // The round is over; further guesses would keep inflating the attempt
    // count and re-firing the win.
    if (appState.guessnum.status === 'won') return;

    const inputEl = document.getElementById('gn-input');
    const guess = parseInt(inputEl.value);

    if (isNaN(guess)) return;

    appState.guessnum.attempts++;
    document.getElementById('gn-attempts').innerText = appState.guessnum.attempts;
    
    let feedback = "";
    let colorClass = "";
    
    if (guess === appState.guessnum.target) {
        // WIN
        playSound('success');
        confetti({ particleCount: 150, spread: 70 });
        
        const winMsg = appState.lang === 'ar' 
            ? `🎉 صحيح! الرقم هو ${guess}` 
            : `🎉 Correct! Number is ${guess}`;
            
        document.getElementById('gn-feedback').innerHTML = `<span class="tx-success font-black text-2xl">${winMsg}</span>`;
        addToHistory(guess, "✅", "win");
        appState.guessnum.status = 'won';
        inputEl.value = '';
        inputEl.blur();
        saveToLocal();
        return; 
    } 
    else if (guess > appState.guessnum.target) {
        // تخمينك 60 والرقم 50 -> نحتاج رقم "أقل"
        playSound('click');
        // التغيير هنا: بدلاً من "عالي جداً" نقول "أقل"
        feedback = appState.lang === 'ar' ? "أقل! ⬇️" : "Lower! ⬇️";
        colorClass = "tx-danger";
        addToHistory(guess, "⬇️", "high");
    } 
    else {
        // تخمينك 40 والرقم 50 -> نحتاج رقم "أعلى"
        playSound('click');
        // التغيير هنا: بدلاً من "منخفض جداً" نقول "أعلى"
        feedback = appState.lang === 'ar' ? "أعلى! ⬆️" : "Higher! ⬆️";
        colorClass = "text-blue-500";
        addToHistory(guess, "⬆️", "low");
    }

    // Animate Feedback
    const fbEl = document.getElementById('gn-feedback');
    fbEl.className = `text-xl font-bold mb-6 ${colorClass} animate-pop`;
    fbEl.innerText = feedback;
    setTimeout(() => fbEl.classList.remove('animate-pop'), 200);

    inputEl.value = '';
    inputEl.focus();
}

function addToHistory(guess, icon, type) {
    // Record it as well as draw it: this list is what renderGuessNumHistory
    // rebuilds the screen from after a reload.
    if (!appState.guessnum.history) appState.guessnum.history = [];
    appState.guessnum.history.push({ n: appState.guessnum.attempts, guess: guess, icon: icon, type: type });
    drawGuessRow(guess, icon, type, appState.guessnum.attempts);
}

/** Redraws the whole guess list from saved state. */
function renderGuessNumHistory() {
    const container = document.getElementById('gn-history');
    if (container) container.innerHTML = '';
    document.getElementById('gn-attempts').innerText = appState.guessnum.attempts || 0;
    const range = document.getElementById('gn-range-display');
    if (range) {
        range.innerText = (appState.guessnum.mode === 'computer' && appState.guessnum.min != null)
            ? `${appState.guessnum.min} - ${appState.guessnum.max}`
            : '???';
    }
    (appState.guessnum.history || []).forEach(h => drawGuessRow(h.guess, h.icon, h.type, h.n));
}

function drawGuessRow(guess, icon, type, attemptNo) {
    const container = document.getElementById('gn-history');
    const div = document.createElement('div');
    
    let styles = "";
    let textStyle = "";
    
    if (type === 'high') {
        styles = "bg-red-50 border-red-200 dark:bg-red-900 dark:border-red-700";
        textStyle = "text-red-700 dark:text-red-100";
    } else if (type === 'low') {
        styles = "bg-blue-50 border-blue-200 dark:bg-blue-900 dark:border-blue-700";
        textStyle = "text-blue-700 dark:text-blue-100";
    } else if (type === 'win') {
        styles = "bg-green-100 border-green-500 dark:bg-green-900 dark:border-green-500";
        textStyle = "text-green-800 dark:text-green-100";
    }

    div.className = `flex justify-between items-center p-3 rounded-xl border mb-2 ${styles}`;
    
    div.innerHTML = `
        <span class="font-bold tx-muted text-sm">#${attemptNo}</span>
        <span class="font-black text-2xl ${textStyle}">${guess}</span>
        <span class="text-xl">${icon}</span>
    `;
    container.prepend(div);
}
</script>
