async function roomLeave() {
  const t = TRANSLATIONS[appState.lang] || {};
  const s = Room.state;
  // Mid-game it says what happens (the ideas of 7 Oct 2026, 1296): «إنت في نص الجاسوس - دورك هيعدي،
  // ونقط الليلة هتفضل محفوظة», «اخرج» / «خليني». In the lobby, a finished game, a mid-round watcher
  // or a screen, the short one.
  const mid = !!s && !s.youAreScreen && s.phase !== 'lobby' && !!s.game && s.inGame !== false &&
    !(typeof roomGameIsOver === 'function' && roomGameIsOver(s));
  const entry = mid ? ROOM_HUB_GAMES.find(g => g.id === s.game) : null;
  const msg = mid && t.room_leave_mid
    ? t.room_leave_mid.replace('{game}', entry ? (t[entry.key] || entry.id) : s.game)
    : (appState.lang === 'ar' ? 'هتخرج من الغرفة؟' : 'Leave this room?');
  showConfirmModal(msg, () => {
    // Home at once: Room.leave forgets the room on this phone first, then tells the server
    // without being waited for (the owner, 8 Oct 2026: up to 12 s offline before anything moved).
    Room.leave();
    setView('menu');
  }, Object.assign({ yes: 'cf_leave', tone: 'accent', icon: '🚪' }, mid ? { no: 'cf_stay' } : {}));
}

/* Start pressed and its answer not here yet: the button stays pressed in and greyed (the owner,
   8 Oct 2026: Start showed nothing until the splash), and a second tap does nothing. */
let roomStartBusy = false;
function roomStartPress(btn, on) {
  if (!btn) return;
  if (on) {
    btn.setAttribute('aria-busy', 'true');
    btn.style.transform = 'scale(0.94)';
    btn.style.opacity = '0.75';
  } else {
    btn.removeAttribute('aria-busy');
    btn.style.transform = btn.style.opacity = '';
  }
}

async function roomStartGame() {
  const game = ROOM_GAMES[Room.state && Room.state.game];
  if (!game) return showToast(roomErrText('game'), 'error');
  if (roomStartBusy) return;
  // Its options have been set once on this phone: folded from the next lobby on.
  rememberOptions('lobbyOptsSeen', { [Room.state.game]: 1 });
  const btn = document.getElementById('room-start-btn');
  roomStartBusy = true;
  if (btn) btn.disabled = true;
  roomStartPress(btn, true);
  try {
    await Room.act('start', game.startPayload ? game.startPayload() : {});
    roomStartBusy = false;
    roomStartPress(btn, false);
  } catch (err) {
    roomStartBusy = false;
    roomStartPress(btn, false);
    if (btn) btn.disabled = false;
    // The lobby says whether it may go (startBlock, a game's code still coming).
    if (Room.state && appState.currentView === 'room-lobby') renderRoomLobby(Room.state);
    // Too few people in: the line under Start already says how many more, so point at
    // it (a blocked Start's way) rather than a toast. The server still decides: trivia,
    // the emoji riddles and the proverbs start with one.
    // Only while that line is on show: a phone that became the screen keeps the
    // hidden lobby's old count, and a shake there says nothing.
    const needEl = document.getElementById('room-start-need');
    const onLobby = !(Room.state && Room.state.youAreScreen) && appState.currentView === 'room-lobby';
    if (onLobby && needEl && Number(needEl.dataset.short || 0) > 0 && typeof blockStartAt === 'function') blockStartAt(needEl);
    else showToast(err.message || roomErrText('start'), 'error');
  }
}

/* --- rendering ----------------------------------------------------------- */

// Who was already in the lobby, so only someone who joins after that pops in.
const lobbySeen = { code: '', ids: null };

function renderRoomLobby(state, opts) {
  // The host's pick drawn before the server has it (roomPickNow): its card, no options yet.
  const picked = roomPickOver(state);
  if (picked) state = picked;
  lobbySkeleton(false);
  const codeEl = document.getElementById('room-code-display');
  // A new code drops in letter by letter; the same code is left alone.
  if (codeEl && (codeEl.dataset.code !== state.code || codeEl.textContent !== state.code)) {
    codeEl.dataset.code = state.code;
    const chars = String(state.code).split('');
    // --n: how many letters, so each letter's slice of the code's gradient (section 40) lines up.
    codeEl.innerHTML = chars.map((ch, i) => '<span style="--i:' + i + ';--n:' + chars.length + '">' + escapeHTML(ch) + '</span>').join('');
  }
  if (lobbySeen.code !== state.code) { lobbySeen.code = state.code; lobbySeen.ids = null; }
  const joined = lobbySeen.ids ? state.players.filter(p => !lobbySeen.ids.has(p.id)).map(p => p.id) : [];
  lobbySeen.ids = new Set(state.players.map(p => p.id));

  const url = roomInviteUrl(state.code);
  // Encoded once per code, not on every presence tick. The skeleton empties it
  // while a room loads, hence the innerHTML check.
  const qrEl = document.getElementById('room-qr');
  if (!qrEl || qrEl.dataset.url !== url || !qrEl.innerHTML) {
    renderJoinQR('room-qr', url);
    if (qrEl) qrEl.dataset.url = url;
  }

  const list = document.getElementById('room-player-list');
  const count = document.getElementById('room-player-count');
  if (count) count.innerText = state.players.length;
  // The night on each row (1280): its points, 👑 on whoever leads; a rise counts up once drawn.
  // Read from roomNightRows, so a row carries the points of an earlier seat under the same name,
  // as the night table under the list does (audit 7 Oct 2026, R1).
  const nightPts = lobbyNightPoints(state);
  const nightTop = Math.max(0, ...state.players.map(p => Number(nightPts[p.id]) || 0));
  // Whoever stays slides, whoever left fades where they stood (JS_Motion.html section 13).
  const paintLobbyRows = () => {
  if (list) {
    const hostLabel = appState.lang === 'ar' ? 'المضيف' : 'Host';
    const youLabel = appState.lang === 'ar' ? 'أنت' : 'You';
    list.innerHTML = state.players.map(p => p.bot ? roomBotRowHtml(state, p, joined.indexOf(p.id) !== -1) : `
      <div class="status-row lobby-row ${p.online ? '' : 'status-row--out'} ${joined.indexOf(p.id) !== -1 ? 'status-row--new' : ''} ${p.id === state.hostId ? 'is-host' : ''}">
        ${lobbyAvatarHtml(p.name, p.online, null, p)}
        <div class="status-row__body">
          <div class="status-row__name">${roomNameHtml(state, p)}</div>
        </div>
        <div class="status-row__actions">
          ${lobbyNightBadgeHtml(p, nightPts, nightTop)}
          ${p.id === Room.me ? `<span class="badge badge--accent">${youLabel}</span>` : ''}
          ${p.id === state.hostId ? `<span class="badge lobby-row__host"><span aria-hidden="true">👑</span> ${hostLabel}</span>` : ''}
          ${p.online ? '' : `<span class="badge">${escapeHTML((TRANSLATIONS[appState.lang] || {}).room_away || '')}</span>`}
          ${roomKickButton(state, p, 'btn btn--ghost btn--xs btn--auto')}
        </div>
      </div>`).join('');
  }

  // Big screens in the room, listed under the players: they hold no seat.
  if (list && (state.screens || []).length) {
    const tt = TRANSLATIONS[appState.lang] || {};
    list.insertAdjacentHTML('beforeend', state.screens.map(sc => `
      <div class="status-row lobby-row lobby-row--screen ${sc.online ? '' : 'status-row--out'} ${sc.id === state.hostId ? 'is-host' : ''}">
        ${lobbyAvatarHtml('', sc.online, '📺')}
        <div class="status-row__body">
          <div class="status-row__name">${tt.tv_screen_badge || ''}</div>
        </div>
        <div class="status-row__actions">
          ${sc.id === state.hostId ? `<span class="badge lobby-row__host"><span aria-hidden="true">👑</span> ${appState.lang === 'ar' ? 'المضيف' : 'Host'}</span>` : ''}
        </div>
      </div>`).join(''));
  }
  };
  if (list && typeof motionRowsSwap === 'function') motionRowsSwap(list, paintLobbyRows); else paintLobbyRows();
  lobbyNightCount(list, state);

  const startBtn = document.getElementById('room-start-btn');
  const waitNote = document.getElementById('room-wait-note');
  const setup = document.getElementById('room-host-setup');
  // No options from a pick the server hasn't answered: they are drawn from its state.
  const game = picked ? null : ROOM_GAMES[state.game];

  // No game picked yet: the lobby shows the hub instead of a start button.
  const inHub = !state.game;
  if (startBtn) startBtn.classList.toggle('hidden', inHub || !state.youAreHost);
  // One line for a player waiting: «المضيف يختار اللعبة…» (the hub's) until a
  // game is chosen, then «مستنيين المضيف يبدأ اللعبة…» - never both.
  if (waitNote) waitNote.classList.toggle('hidden', !!state.youAreHost || inHub);
  // The QR folds behind «ادعي حد كمان ▾» once two or more people are in, so the
  // game chosen comes first; folded once per room, a tap opens it again. Alone in
  // the room, a phone keeps it behind «📷 وريهم الـ QR» too (the owner's look 2B, 7 Oct
  // 2026: the code card filled a phone's first screen); a laptop shows it in the code
  // bar while alone (look 1B), since a phone can't be held up to its screen anyway.
  const invite = document.getElementById('room-invite');
  if (invite) {
    const many = state.players.filter(p => !p.bot).length >= 2;
    const wide = typeof matchMedia === 'function' && matchMedia('(min-width: 1000px)').matches;
    invite.classList.toggle('is-solo', !many);
    if (!many) {
      delete invite.dataset.folded;
      if (wide) invite.open = true;
      else if (invite.dataset.soloFolded !== state.code) { invite.open = false; invite.dataset.soloFolded = state.code; }
    } else if (invite.dataset.folded !== state.code) { invite.open = false; invite.dataset.folded = state.code; }
  }
  // Under the host's Start: how many more the chosen game needs, if any.
  const needEl = document.getElementById('room-start-need');
  if (needEl) {
    const wasShort = Number(needEl.dataset.short || 0);
    const hub = !inHub && ROOM_HUB_GAMES.find(g => g.id === state.game);
    // The hub's minimum counts people (computer players make up a table later).
    const people = state.players.filter(p => !p.bot).length;
    const short = hub && state.youAreHost ? Math.max(0, (hub.min || 0) - people) : 0;
    const tt = TRANSLATIONS[appState.lang] || {};
    // A game that can't start yet for another reason says why there (startBlock: عربيات التصادم
    // with no big screen online), and its Start is greyed until then; the server refuses it too.
    const block = !short && game && state.youAreHost && typeof game.startBlock === 'function' ? (game.startBlock(state) || '') : '';
    // Greyed too while the game's code (or the server's answer to the pick) is on its way,
    // and while a Start already pressed waits for the server (roomStartGame).
    if (startBtn) startBtn.disabled = !!block || (!inHub && !game) || roomStartBusy;
    needEl.classList.toggle('hidden', !short && !block);
    if (short) needEl.textContent = (tt.room_need_more || '').replace('{n}', String(short));
    else if (block) needEl.textContent = block;
    // Enough are in now: the Start that can go breathes once (JS_Motion.html section 13).
    needEl.dataset.short = String(short);
    if (wasShort > 0 && !short && startBtn && typeof motionNudge === 'function') motionNudge(startBtn);
  }
  // «الشلة»: which crew tonight counts for (JS_CrewCore.html).
  const crewEl = document.getElementById('room-crew');
  // The host in the hub has it in the doors' row over the list instead (1281, roomLobbyDoorsHtml).
  if (crewEl && typeof crewLobbyHtml === 'function') {
    const html = roomLobbyDoorsOn(state) ? '' : crewLobbyHtml(state);
    if (crewEl.dataset.sig !== html) { crewEl.innerHTML = html; crewEl.dataset.sig = html; }
  }
  // 🕵️ المهمة السرية: the host's switch, or the evening's file (JS_RoomMission.html).
  const msnEl = document.getElementById('room-mission');
  if (msnEl) {
    // Switched off, the host's door is a chip in the doors' row while the list is up (1281).
    const msn = state.mission;
    const html = roomLobbyDoorsOn(state) && !(msn && (msn.on || msn.phase === 'reveal')) ? '' : roomMissionSlotHtml(state);
    if (msnEl.dataset.sig !== html) { msnEl.innerHTML = html; msnEl.dataset.sig = html; }
  }
  // «أنت: منى ✏️» on a phone that plays (a screen has no name).
  const meBtn = document.getElementById('room-me');
  const mine = state.players.find(p => p.id === Room.me);
  if (meBtn) {
    meBtn.classList.toggle('hidden', !mine);
    if (mine) {
      const html = roomMeHtml(TRANSLATIONS[appState.lang] || {}, mine.name, mine.face);
      if (meBtn.dataset.sig !== html) { meBtn.innerHTML = html; meBtn.dataset.sig = html; }
    }
  }

  roomLobbyTabsSync(state, !!(opts && opts.spectator));

  // A mid-round joiner's panel is the spectator note (renderRoomSpectator): the hub written here
  // first and the note straight after was two rewrites on every state, the hub flashing between.
  if (setup && !(opts && opts.spectator)) {
    const html = inHub
      ? renderRoomHub(state)
      : renderChosenGame(state, game);
    // Only rewrite when it changed, so an open <select> isn't reset by every update.
    // And never under the host's fingers: someone picking a team rewrites the
    // options, which took the Codenames word box (focus, keyboard) with it.
    if (setup.dataset.sig !== html) {
      if (roomFieldInUse(setup)) {
        setup.dataset.stale = '1';
        watchRoomFieldDone(setup, () => { if (Room.state && appState.currentView === 'room-lobby') routeRoomState(Room.state); });
      } else {
        setup.innerHTML = html;
        setup.dataset.sig = html;
        delete setup.dataset.stale;
        lobbyOptsSummarise(setup);
      }
    }
    if (!picked) roomLobbySumShare(state, setup);
    // An option changed in place (a switch, a list) says so in the folded line too.
    if (!setup.dataset.sumWatched) {
      setup.dataset.sumWatched = '1';
      const later = () => setTimeout(() => { lobbyOptsSummarise(setup); if (Room.state) roomLobbySumShare(Room.state, setup); }, 0);
      setup.addEventListener('change', later);
      setup.addEventListener('click', later);
    }
  }
}

/* The night's points on a lobby row (the ideas of 7 Oct 2026, 1280): a badge once the person has
   any, 👑 for whoever leads (a tie crowns both), 🌙 for the rest. The full table stays under the list. */
const lobbyNightSeen = { code: '', pts: {} };
function lobbyNightBadgeHtml(p, night, top) {
  const n = Number(night[p.id]) || 0;
  if (!n) return '';
  const lead = n === top;
  const label = escapeHTML(((TRANSLATIONS[appState.lang] || {}).room_night_title || '') + ': ' + n);
  return `<span class="badge lobby-row__night${lead ? ' is-lead' : ''}" title="${label}" aria-label="${label}">` +
    `<span aria-hidden="true">${lead ? '👑' : '🌙'}</span> <b class="metric" data-night-pid="${escapeHTML(p.id)}">${n}</b></span>`;
}
/** Each present row's night points, merged as roomNightRows merges them (audit 7 Oct 2026, R1). */
function lobbyNightPoints(state) {
  const pts = {};
  roomNightRows(state).forEach(r => { if (!r.left) pts[r.id] = r.score; });
  return pts;
}
/** After the rows are drawn: a number that rose since this phone last drew it counts up (countUp). */
function lobbyNightCount(list, state) {
  if (lobbyNightSeen.code !== state.code) { lobbyNightSeen.code = state.code; lobbyNightSeen.pts = null; }
  const night = lobbyNightPoints(state);
  const was = lobbyNightSeen.pts;
  lobbyNightSeen.pts = Object.assign({}, night);
  if (!was || !list || motionOff() || typeof countUp !== 'function') return;
  list.querySelectorAll('[data-night-pid]').forEach(el => {
    const id = el.dataset.nightPid;
    const now = Number(night[id]) || 0;
    const before = Number(was[id]) || 0;
    if (now > before) countUp(el, before, now);
  });
}

/* The lobby's two tabs for the host (the owner's look 1B, 3 Oct 2026): «اللاعبين (n)»
   and the game - «اختار لعبة», then «اللعبة: …» once one is picked, and the lobby
   turns to it by itself; «تغيير» goes back to the list there. A room opens on the
   people. Everyone else (and a mid-round joiner) gets no tabs: the people, then
   the game chosen. The tab is this phone's, kept per room code. */
const roomLobbyTabState = { code: '', game: null, tab: 'people' };

function roomLobbyTabsSync(state, spectator) {
  const view = document.getElementById('view-room-lobby');
  const tabs = document.getElementById('room-lobby-tabs');
  const go = document.getElementById('room-go-game');
  if (!view || !tabs) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const host = !!state.youAreHost && !spectator;
  tabs.classList.toggle('hidden', !host);
  if (!host) {
    delete view.dataset.tab;
    if (go) go.classList.add('hidden');
    return;
  }
  const s = roomLobbyTabState;
  const game = state.game || null;
  if (s.code !== state.code) { s.code = state.code; s.game = game; s.tab = game ? 'game' : 'people'; }
  else if (game !== s.game) { s.game = game; if (game) s.tab = 'game'; }
  view.dataset.tab = s.tab;
  const entry = game && ROOM_HUB_GAMES.find(g => g.id === game);
  const label = {
    people: `<span aria-hidden="true">👥</span> ${escapeHTML(t.room_players || '')} <span class="metric">(${state.players.length})</span>`,
    game: entry
      ? `<span aria-hidden="true">${iconHtml(entry.icon)}</span> ${escapeHTML((t.room_tab_game || '{g}').replace('{g}', t[entry.key] || entry.id))}`
      : `<span aria-hidden="true">🎮</span> ${escapeHTML(t.room_pick_game || '')}`
  };
  tabs.querySelectorAll('[data-tab]').forEach(b => {
    const on = b.dataset.tab === s.tab;
    if (b.dataset.sig !== label[b.dataset.tab]) { b.innerHTML = label[b.dataset.tab]; b.dataset.sig = label[b.dataset.tab]; }
    if (b.classList.contains('is-active') !== on) b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', String(on));
  });
  if (go) {
    go.classList.toggle('hidden', s.tab !== 'people' || !!game);
    const html = `<span aria-hidden="true">🎮</span> ${escapeHTML(t.room_pick_game || '')}`;
    if (go.dataset.sig !== html) { go.innerHTML = html; go.dataset.sig = html; }
  }
}

/** A tap on a lobby tab (or the people's «اختار لعبة»). */
function roomLobbyTab(tab) {
  const next = tab === 'game' ? 'game' : 'people';
  if (roomLobbyTabState.tab === next) return;
  roomLobbyTabState.tab = next;
  haptic('light');
  if (Room.state && appState.currentView === 'room-lobby') renderRoomLobby(Room.state);
  if (typeof scrollToAction === 'function') scrollToAction();
}

/* The room's game picker morphs too (the owner, 3 Oct 2026: "the same morph to the
   room game picker"): the poster the host taps grows into the chosen game's card,
   and «تغيير» shrinks that card back into its poster in the list. The pick is a
   round trip to the server; the lobby draws it at once from the catalog (roomPickNow:
   the chosen card, or the list again), so the morph runs straight away instead of
   holding a frozen picture until the answer (the owner, 8 Oct 2026: felt slow), and
   the game's options follow once the server and the game's code are here. Where the
   morph can't run, the pick is drawn the same way without it. */
function roomPickGame(id, el) {
  const act = () => roomPickNow(id);
  if (roomPickMorph(el, act, () => document.querySelector('#room-host-setup .chosen-game'))) return;
  act();
}

/* The pick this phone has drawn before the server has it: `game` (null = back to the list;
   undefined = none waiting). renderRoomLobby draws it over an older state of this room until
   the server's state has the same game, the move is refused, or 4 s pass. */
const roomPickLocal = { game: undefined, code: '', timer: null, seq: 0 };
function roomPickClear() {
  clearTimeout(roomPickLocal.timer);
  roomPickLocal.timer = null;
  roomPickLocal.game = undefined;
  roomPickLocal.code = '';
}
function roomPickRedraw() {
  if (Room.state && appState.currentView === 'room-lobby') routeRoomState(Room.state);
}
/** Sends the pick (a game, or null for «تغيير») and draws it in the lobby at once. */
function roomPickNow(game) {
  const st = Room.state;
  if (!st) return;
  // The game's code on its way now: its options follow the server's answer sooner.
  if (game && typeof lzEnsure === 'function') lzEnsure(lzChunksOfRoom(game)).catch(() => {});
  roomPickClear();
  const seq = ++roomPickLocal.seq;
  roomPickLocal.game = game || null;
  roomPickLocal.code = st.code;
  roomPickLocal.timer = setTimeout(() => { if (roomPickLocal.seq === seq) { roomPickClear(); roomPickRedraw(); } }, 4000);
  const sent = game ? roomAct('chooseGame', { game: game }) : roomAct('backToHub');
  if (appState.currentView === 'room-lobby') renderRoomLobby(st);
  sent.then((ok) => {
    if (roomPickLocal.seq !== seq || roomPickLocal.game === undefined) return;
    roomPickClear();
    // Refused (roomAct said why): the lobby as the server has it.
    if (!ok) roomPickRedraw();
  });
}

/** A state still on the room's choice before this phone's pick: the pick drawn over it. */
function roomPickOver(state) {
  const pick = roomPickLocal;
  if (pick.game === undefined || !state) return null;
  if (state.code !== pick.code || state.phase !== 'lobby' || !state.youAreHost || (state.game || null) === pick.game) {
    roomPickClear();
    return null;
  }
  return Object.assign({}, state, { game: pick.game });
}

/* A game chosen while its code is still on its way (emit and routeRoomState wait for the
   chunk): the lobby draws the chosen game's card from the catalog at once, and only its
   options wait for the code (the owner, 8 Oct 2026: other phones kept the old lobby). */
function roomLobbyEarly(state) {
  if (!state || state.phase !== 'lobby' || state.youAreScreen || state.program) return;
  if (appState.currentView !== 'room-lobby') return;
  try { renderRoomLobby(state); } catch (e) { console.warn('room lobby early', e); }
}

function roomChangeGame(btn) {
  const id = Room.state && Room.state.game;
  const act = () => roomPickNow(null);
  const back = () => {
    const el = id && document.querySelector('#room-host-setup .room-poster[data-game="' + id + '"]');
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.bottom > 0 && r.top < window.innerHeight ? el : null;
  };
  if (roomPickMorph(btn && btn.closest('.chosen-game'), act, back)) return;
  act();
}

/** The morph: `fromEl` (a poster or the chosen card) into whatever `findTarget` finds once `act` has gone. */
function roomPickMorph(fromEl, act, findTarget) {
  if (!fromEl || !fromEl.isConnected || motionOff() || typeof document.startViewTransition !== 'function') return false;
  const iconOf = (el) => el && el.querySelector('.game-icon, .chosen-game__icon');
  const name = (el, n) => { if (el) el.style.viewTransitionName = n; };
  const fromIcon = iconOf(fromEl);
  let target = null;
  let targetIcon = null;
  const done = () => {
    [fromEl, fromIcon, target, targetIcon].forEach((el) => name(el, ''));
    document.documentElement.classList.remove('vt-pick');
  };
  name(fromEl, 'game-card');
  name(fromIcon, 'game-icon');
  document.documentElement.classList.add('vt-pick');
  let vt;
  try {
    vt = document.startViewTransition(async () => {
      name(fromEl, '');
      name(fromIcon, '');
      // The pick is drawn at once (roomPickNow), so nothing waits on the server here.
      act();
      // Normally already drawn; a moment at most otherwise.
      for (let i = 0; i < 15 && !target; i++) {
        target = findTarget();
        if (!target) await new Promise((r) => setTimeout(r, 16));
      }
      if (!target) return;
      targetIcon = iconOf(target);
      name(target, 'game-card');
      name(targetIcon, 'game-icon');
    });
  } catch (e) {
    done();
    return false;
  }
  vt.finished.then(done, done);
  // Never only the transition's end (GEMINI.md, animationend is never the only path).
  setTimeout(done, 5000);
  return true;
}

/** A text box, a word list or an open picker inside `root` has the focus. */
function roomFieldInUse(root) {
  const el = document.activeElement;
  if (!root || !el || !root.contains(el)) return false;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
  return el.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|color)$/i.test(el.type || '');
}

/**
 * Redraws once the field held back above is let go. A short wait, so a tap
 * on a button next to it (which takes the focus first) lands on the button
 * before it is redrawn.
 */
function watchRoomFieldDone(root, redraw) {
  if (root.dataset.watchDone) return;
  root.dataset.watchDone = '1';
  root.addEventListener('focusout', () => {
    setTimeout(() => {
      if (!root.dataset.stale || roomFieldInUse(root)) return;
      delete root.dataset.stale;
      delete root.dataset.sig;
      redraw();
    }, 350);
  });
}

let roomHubLocation = recallOptions('roomHubLocation', 'together');

/* Chess is one tile in the room's list (the owner, 24 Sep 2026): a tap opens its
   room ways, the first of which is the tile itself (1 vs 1). */
const ROOM_HUB_GROUPS = {
  chess: ['chess', 'votechess', 'handbrain', 'bughouse', 'chess4'],
  // سباق ألغاز (the owner, 26 Sep 2026): one tile «سباق ألغاز» opens the ten puzzles, so the list keeps its size.
  race: ["strands","wordwheel","connections","pinpoint","queens","tango","nonogram","mines","streak","sudoku"]
};
/* A family whose tile is not its first game: its own name, icon and colour (chess's tile is chess itself). */
const ROOM_HUB_FAMILIES = { race: { id: 'race', icon: 'art:race', key: 'race_title', accent: 'violet', group: 'brain' } };
let roomHubGroup = '';
const roomHubGroupOf = (id) => Object.keys(ROOM_HUB_GROUPS).find(k => ROOM_HUB_GROUPS[k].indexOf(id) !== -1) || '';

/**
 * The tiles the list shows, each { g, min, open }: with a group open, its games;
 * otherwise every game, a group as its first game with open set (a tap opens the
 * group) and the fewest players any of its games needs.
 */
function roomHubTiles() {
  const byId = (id) => ROOM_HUB_GAMES.find(g => g.id === id);
  if (roomHubGroup && ROOM_HUB_GROUPS[roomHubGroup]) {
    return ROOM_HUB_GROUPS[roomHubGroup].map(byId).filter(Boolean).map(g => ({ g: g, min: g.min, open: '' }));
  }
  return ROOM_HUB_GAMES.filter(g => {
    const k = roomHubGroupOf(g.id);
    return !k || ROOM_HUB_GROUPS[k][0] === g.id;
  }).map(g => {
    const k = roomHubGroupOf(g.id);
    if (!k) return { g: g, min: g.min, open: '' };
    const min = Math.min.apply(null, ROOM_HUB_GROUPS[k].map(id => (byId(id) || { min: 99 }).min));
    return { g: ROOM_HUB_FAMILIES[k] || g, min: min, open: k };
  });
}

/** A tile's name: inside the chess group its first game is '1 vs 1'. */
function roomHubTileName(tile, t) {
  if (!tile.open && roomHubGroup === 'chess' && tile.g.id === 'chess') return t.room_chess_duel || '1 vs 1';
  return t[tile.g.key] || tile.g.id;
}

/** Opens a group of the list (or '' back to every game), on the phone or the TV. */
function roomHubOpen(group) {
  roomHubGroup = group || '';
  haptic('light');
  if (!Room.state) return;
  if (Room.state.youAreScreen && typeof renderRoomTv === 'function') renderRoomTv(Room.state);
  else if (appState.currentView === 'room-lobby') renderRoomLobby(Room.state);
}

/** The head of the list with a group open: the way back to every game. */
function roomHubBackHtml(t, tv) {
  if (!roomHubGroup) return '';
  return `<button type="button" class="btn btn--ghost ${tv ? '' : 'btn--sm'} btn--auto room-hub-back" onclick="roomHubOpen('')">
      <span aria-hidden="true">↩</span> ${escapeHTML(t.room_hub_all || '')}</button>`;
}
if (['together', 'apart'].indexOf(roomHubLocation) === -1) roomHubLocation = 'together';

function setRoomHubLocation(loc) {
  roomHubLocation = loc;
  rememberOptions('roomHubLocation', loc);
  if (Room.state && appState.currentView === 'room-lobby') {
    renderRoomLobby(Room.state);
  }
}

/**
 * The leaderboard of the night: 3/2/1 banked by the server at the end of every
 * game that kept a score (bankNightPoints in RoomGames.js). Everyone sees it,
 * host or not, and it is nothing at all until a game has been played.
 */
function roomNightBoardHtml(state, t) {
  const night = state.night || {};
  if (!Object.keys(night).length) return '';
  const board = roomNightRows(state);
  if (!board.some(r => r.score > 0)) return '';
  return `
    <div class="section">
      <div class="section__head">
        <h2 class="section__title">🌙 ${escapeHTML(t.room_night_title || 'ليلتنا')}</h2>
        <span class="section__rule"></span>
      </div>
      ${renderScoreboard(board)}
      <p class="field__hint room-night__hint">${escapeHTML(t.room_night_hint || '')}</p>
      ${!state.youAreScreen && typeof shareCardBtnHtml === 'function'
        ? `<div class="btn-row room-night__share">${shareCardBtnHtml('shareRoomNight()', t.night_share || t.share_card || '')}</div>` : ''}
      ${typeof crewGuestOfferHtml === 'function' ? crewGuestOfferHtml(state, t) : ''}
    </div>`;
}

/**
 * The night's rows, best first: everyone in the room, and whoever was banked on the night and has
 * left since (state.nightNames, the ideas of 7 Oct 2026, 1306), as { left: true } - drawn greyed
 * with «مشي» on the board, the TV's line and the share card. Someone who left and came back under
 * the same name is one row with both their points.
 */
function roomNightRows(state) {
  const night = (state && state.night) || {};
  const rows = ((state && state.players) || []).map(p => ({ id: p.id, name: p.name, score: Number(night[p.id]) || 0, bot: !!p.bot }));
  const gone = (state && state.nightNames) || {};
  Object.keys(gone).forEach(id => {
    const pts = Number(night[id]) || 0;
    if (!pts || !gone[id]) return;
    // Someone here now first, else an earlier «مشي» row of the same name: one who left twice is one row (audit 7 Oct 2026, R2).
    const back = rows.find(r => !r.bot && !r.left && samePlayer(r.name, gone[id]))
      || rows.find(r => r.left && samePlayer(r.name, gone[id]));
    if (back) back.score += pts;
    else rows.push({ id: id, name: String(gone[id]), score: pts, left: true });
  });
  return rows.sort((a, b) => b.score - a.score);
}

/* «ليالينا» (the improvement plan, Phase 6 - Plato's groups, with no accounts):
   every phone in a room keeps that evening's leaderboard of the night, one
   entry per room and day, updated as the night goes on. أرقامي adds them up by
   name (JS_Daily.html). Kept on the phone only, the last NIGHTS_KEEP nights. */
const NIGHTS_KEY = 'ashryNights_v1';
const NIGHTS_KEEP = 60;

function readNights() {
  try { return JSON.parse(localStorage.getItem(NIGHTS_KEY) || '[]') || []; } catch (e) { return []; }
}

function rememberNight(state) {
  if (!state || state.youAreScreen || !state.night) return;
  // Those who left keep their points here too (1306): ليالينا is the night as it was.
  const board = roomNightRows(state)
    .filter(r => !r.bot && r.score > 0)
    .map(r => ({ name: r.name, score: r.score }));
  if (!board.length) return;
  const d = new Date();
  const day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const list = readNights();
  const same = list.findIndex(n => n.code === state.code && n.day === day);
  const sig = JSON.stringify(board);
  // A night keeps its games (the ideas of 7 Oct 2026, 1311): the room's «لعبناها» list (state.played),
  // else what this phone saw dealt (the share card's memory), for أرقامي's past night.
  const played = Array.isArray(state.played) && state.played.length ? state.played
    : (typeof shareNightGamesOf === 'function' ? shareNightGamesOf(state.code) : []);
  const games = played.filter(g => typeof g === 'string').slice(-30);
  const old = same !== -1 ? list[same] : null;
  if (old && JSON.stringify(old.board) === sig && JSON.stringify(old.games || []) === JSON.stringify(games)) return;
  const entry = { code: state.code, day: day, board: board, games: games };
  if (same !== -1) list[same] = entry; else list.push(entry);
  try { localStorage.setItem(NIGHTS_KEY, JSON.stringify(list.slice(-NIGHTS_KEEP))); } catch (e) {}
}
if (typeof Room !== 'undefined') Room.onChange(rememberNight);

/* The night's table after every game (the ideas of 7 Oct 2026, 1313). Back in the hub from a game
   that banked points, the phones and the TV show the night's table first, for 8 s: the rows rise,
   each person's points count up from before the game with ▲ +N beside them (the program's «لوحة
   المذيع», compact), then it goes and the list is there; a tap skips it. Worked out on each phone
   from the night it saw during the game and the night it sees back in the hub, so nothing new comes
   from the server; a phone that joined or reloaded in the hub has nothing to compare and shows
   nothing. برنامج السهرة has its own table between games, so not while one runs. */
const NIGHT_RECAP_MS = 8000;
const nightRecapMem = { code: '', inGame: false, game: '', night: {} };
function nightRecapWatch(state) {
  if (!state) { nightRecapMem.code = ''; nightRecapClose(); return; }
  const snap = Object.assign({}, state.night || {});
  if (state.code !== nightRecapMem.code) {
    Object.assign(nightRecapMem, { code: state.code, inGame: !!state.game, game: state.game || '', night: snap });
    return;
  }
  if (state.game) {
    // A game chosen or dealt: the table makes way for it.
    if (!nightRecapMem.inGame || nightRecapMem.game !== state.game) nightRecapClose();
    Object.assign(nightRecapMem, { inGame: true, game: state.game, night: snap });
    return;
  }
  const before = nightRecapMem.night;
  const was = nightRecapMem.inGame ? nightRecapMem.game : '';
  Object.assign(nightRecapMem, { inGame: false, game: '', night: snap });
  if (was && !state.program && typeof onRoomView === 'function' && onRoomView()) nightRecapShow(state, before, was);
}
if (typeof Room !== 'undefined') Room.onChange(nightRecapWatch);

function nightRecapShow(state, before, gameId) {
  const night = state.night || {};
  const rows = roomNightRows(state).filter(r => !r.bot || r.score > 0);
  rows.forEach(r => { r.gained = Math.max(0, (Number(night[r.id]) || 0) - (Number(before[r.id]) || 0)); });
  if (!rows.some(r => r.gained > 0)) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const entry = (typeof ROOM_HUB_GAMES !== 'undefined' ? ROOM_HUB_GAMES : []).find(g => g.id === gameId);
  const game = entry ? ((iconText(entry.icon) ? iconText(entry.icon) + ' ' : '') + (t[entry.key] || entry.id)) : '';
  const tv = !!state.youAreScreen;
  const shown = rows.slice(0, tv ? 8 : 10);
  nightRecapClose(true);
  const el = document.createElement('div');
  el.className = 'night-recap' + (tv ? ' night-recap--tv' : '');
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', String(t.room_recap_title || '').replace('{game}', game));
  el.setAttribute('data-accent', (entry && entry.accent) || 'violet');
  el.innerHTML = `
    <div class="night-recap__card">
      <div class="night-recap__title">🌙 ${escapeHTML(String(t.room_recap_title || '').replace('{game}', game))}</div>
      <div class="night-recap__rows">${shown.map((r, i) => {
        const place = 1 + rows.filter(x => x.score > r.score).length;
        const from = r.score - r.gained;
        return `
        <div class="night-recap__row ${place === 1 ? 'is-top' : ''} ${r.left ? 'is-left' : ''}" style="--i:${i}">
          <span class="night-recap__p metric">${place}</span>
          <span class="night-recap__name"><bdi>${escapeHTML(r.name)}</bdi>${place === 1 ? ' <span aria-hidden="true">👑</span>' : ''}</span>
          <b class="night-recap__pts metric" data-from="${from}" data-to="${r.score}">${r.score}</b>
          ${r.gained ? `<span class="night-recap__up metric">▲ +${r.gained}</span>` : '<span class="night-recap__up"></span>'}
        </div>`;
      }).join('')}</div>
      <div class="night-recap__skip">${escapeHTML(t.room_recap_skip || '')}</div>
    </div>`;
  el.addEventListener('click', () => nightRecapClose());
  document.body.appendChild(el);
  if (!motionOff() && typeof countUp === 'function') {
    el.querySelectorAll('.night-recap__pts').forEach((b, i) => {
      const from = Number(b.dataset.from) || 0, to = Number(b.dataset.to) || 0;
      if (from === to) return;
      b.textContent = String(from);
      setTimeout(() => { if (b.isConnected) countUp(b, from, to); }, 450 + i * 90);
    });
  }
  // The room's one voice (the TV, or the host's phone with no TV), as the program's table.
  if ((tv || (state.youAreHost && !roomHasScreen())) && typeof playFx === 'function') playFx('ding');
  el._timer = setTimeout(() => nightRecapClose(), NIGHT_RECAP_MS);
}

function nightRecapClose(now) {
  document.querySelectorAll('.night-recap').forEach(el => {
    clearTimeout(el._timer);
    if (now || motionOff()) { el.remove(); return; }
    if (el.classList.contains('is-leaving')) return;
    el.classList.add('is-leaving');
    setTimeout(() => el.remove(), 320);
  });
}

/* A group opened in one room's list (chess's ways, the puzzle race) is that room's:
   leaving, opening or joining another starts the list from every game. Registered
   before the router below, so the lobby is drawn with it already cleared. */
let roomHubCode = '';
if (typeof Room !== 'undefined') Room.onChange((state) => {
  const code = (state && state.code) || '';
  if (code !== roomHubCode) { roomHubCode = code; roomHubGroup = ''; roomHubSearch = ''; }
});

/* Finding a game by name (the owner, 30 Sep 2026: "a search bar to reach games
   faster instead of scrolling a lot"), in the room's list and in برنامج السهرة's
   picker. Every room game answers to its name in either language and its line,
   a family's games too (chess's ways, the ten puzzles) and to the family's name,
   as the home's search does; a match on the name comes before one on the line. */
let roomHubSearch = '';
function roomGameHits(term) {
  const q = helpNormalise(term).trim();
  if (!q) return [];
  const langs = [TRANSLATIONS.ar, TRANSLATIONS.en];
  const hits = [];
  ROOM_HUB_GAMES.forEach(g => {
    const cat = typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[g.id === 'chess' ? 'shatranj' : g.id] : null;
    // The family's name: its own (the race), or its first game's (chess finds all its ways).
    const k = roomHubGroupOf(g.id);
    const fam = k ? (ROOM_HUB_FAMILIES[k] || ROOM_HUB_GAMES.find(x => x.id === ROOM_HUB_GROUPS[k][0])) : null;
    const names = [], lines = [];
    langs.forEach(t => {
      names.push(t[g.key] || '');
      if (cat) { names.push(t[cat.title] || ''); lines.push(t[cat.desc] || ''); }
      if (fam) names.push(t[fam.key] || '');
    });
    if (helpNormalise(names.join(' ')).indexOf(q) !== -1) hits.push({ g, rank: 0 });
    else if (helpNormalise(lines.join(' ')).indexOf(q) !== -1) hits.push({ g, rank: 1 });
  });
  return hits.sort((a, b) => a.rank - b.rank).map(x => x.g);
}
function roomGameSearchHtml(id, value, handler, t) {
  return `
    <label class="home-search room-search">
      <span class="home-search__icon" aria-hidden="true">🔍</span>
      <input type="search" id="${id}" autocomplete="off" enterkeyhint="search" aria-label="${escapeHTML(t.home_search_ph || '')}"
             placeholder="${escapeHTML(t.home_search_ph || '')}" value="${escapeHTML(value || '')}" oninput="${handler}(this.value)">
    </label>`;
}
/** Tiles under the home's section heads (tvHubGroupOf), in the catalog's order. */
function roomGameSectionsHtml(tiles, grid, t) {
  if (typeof CATALOG_GROUPS === 'undefined' || typeof tvHubGroupOf !== 'function') return grid(tiles);
  const groups = CATALOG_GROUPS.map(gr => ({ gr: gr, tiles: [] }));
  const other = { gr: null, tiles: [] };
  tiles.forEach(x => { (groups.find(y => y.gr.id === tvHubGroupOf(x.g.id)) || other).tiles.push(x); });
  return groups.concat([other]).filter(y => y.tiles.length).map(y => `
    <div class="room-hub-sec">
      ${y.gr ? `<h3 class="room-hub-sec__head"><span aria-hidden="true">${y.gr.icon}</span> ${escapeHTML(t[y.gr.title] || y.gr.id)}</h3>` : ''}
      ${grid(y.tiles)}
    </div>`).join('');
}
function setRoomHubSearch(value) {
  roomHubSearch = String(value || '');
  const el = document.getElementById('room-hub-list');
  if (el && Room.state) el.innerHTML = roomHubListHtml(Room.state, TRANSLATIONS[appState.lang]);
}

/* The host's list (ideas batch: shell): the games this room can start now
   first, «تنفع دلوقتي (N)», and the rest folded under «محتاجين ناس أكتر (N) ▾»,
   under the home's section heads (tvHubGroupOf) once opened. Nothing is taken
   away; a family opened (chess's ways) is one list as before. */
let roomHubMoreOpen = false;

function roomHubPosterHtml(tile, state, t) {
  const count = state.players.length;
  const g = tile.g;
  const off = !tile.open && typeof roomGameIsOff === 'function' && roomGameIsOff(g.id);
  const enough = count >= tile.min && !off;
  const cat = (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID[g.id]) || null;
  const isF2F = !!(cat && cat.faceToFace);
  const showHint = roomHubLocation === 'apart' && isF2F;
  const hint = showHint ? (t.room_hub_facetoface || 'أحسن وانتوا مع بعض') : '';
  // A tile the room can't start yet says how many more it needs, in words.
  const need = !enough ? (t.room_need_more ? t.room_need_more.replace('{n}', String(tile.min - count)) : `${tile.min}+`) : '';
  const badge = off ? gameOffBadge(t) : need ? `<div class="game-card__need">${escapeHTML(need)}</div>` : '';
  const hintEl = hint ? `<div class="game-card__hint">${escapeHTML(hint)}</div>` : '';
  const played = roomPlayedBadgeHtml(roomPlayedCount(state, tile), t);
  return `
            <button type="button" class="game-card room-poster ${enough ? '' : 'is-disabled'} ${off ? 'is-off' : ''} ${tile.open ? 'room-poster--family' : ''}" data-accent="${g.accent}" data-game="${g.id}"
                 ${off ? 'onclick="gameOffToast()" aria-disabled="true"' : enough ? (tile.open ? `onclick="roomHubOpen('${tile.open}')"` : `onclick="roomPickGame('${g.id}', this)"`) : 'aria-disabled="true"'}>
              <span class="game-icon" aria-hidden="true">${iconHtml(g.icon)}</span>
              <span class="game-title">${escapeHTML(roomHubTileName(tile, t))}</span>
              ${hintEl}
              ${badge}
              ${played}
            </button>`;
}

/* «لعبناها» (the ideas of 7 Oct 2026, 1314): how many times tonight a tile's game was dealt (a
   family's tile: all its games), from state.played (RoomGames.js keeps it on the room). */
function roomPlayedCount(state, tile) {
  const played = (state && state.played) || [];
  if (!played.length || !tile || !tile.g) return 0;
  const ids = tile.open && ROOM_HUB_GROUPS[tile.open] ? ROOM_HUB_GROUPS[tile.open] : [tile.g.id];
  return played.filter(id => ids.indexOf(id) !== -1).length;
}
function roomPlayedBadgeHtml(n, t) {
  if (!n) return '';
  const label = escapeHTML(String(t.room_played_n || '').replace('{n}', String(n)));
  return `<span class="room-played" title="${label}" aria-label="${label}">✓${n > 1 ? '<span class="metric">×' + n + '</span>' : ''}</span>`;
}
/** The tile of the last game dealt tonight, among `tiles` (a game of a family is its family's tile). */
function roomPlayedLastTile(state, tiles) {
  const played = (state && state.played) || [];
  const last = played[played.length - 1];
  if (!last) return null;
  const fam = roomHubGroup ? '' : roomHubGroupOf(last);
  return tiles.find(x => (fam && x.open === fam) || (!x.open && x.g.id === last)) || null;
}

function roomHubListHtml(state, t) {
  const grid = (list) => `<div class="game-grid room-posters">${list.map(x => roomHubPosterHtml(x, state, t)).join('')}</div>`;
  if (roomHubSearch.trim() && !roomHubGroup) {
    const hits = roomGameHits(roomHubSearch).map(g => ({ g: g, min: g.min, open: '' }));
    return hits.length ? grid(hits) : `<div class="empty room-search__none">${escapeHTML(t.home_empty || '')}</div>`;
  }
  const tiles = roomHubTiles();
  if (roomHubGroup) return grid(tiles);
  const count = state.players.length;
  let ready = tiles.filter(x => count >= x.min && !(!x.open && typeof roomGameIsOff === 'function' && roomGameIsOff(x.g.id)));
  const rest = tiles.filter(x => ready.indexOf(x) === -1);
  // The last game played tonight sits first, under «تاني؟» (1314), and not again below.
  const lastTile = roomPlayedLastTile(state, ready);
  if (lastTile) ready = ready.filter(x => x !== lastTile);
  const again = lastTile ? `
      <h3 class="room-hub-now room-hub-again"><span aria-hidden="true">🔁</span> ${escapeHTML(t.room_played_again || '')}</h3>
      ${grid([lastTile])}` : '';
  let more = '';
  if (rest.length) {
    // Nothing playable yet (one person, every game needs two): the rest is the list, open.
    const open = roomHubMoreOpen || !ready.length;
    more = `
      <details class="room-hub-more" ${open ? 'open' : ''} data-r="${open ? 1 : 0}" ontoggle="roomHubMoreToggled(this)">
        <summary class="room-hub-more__head">
          <span>${escapeHTML(t.room_hub_more || '')} <span class="room-hub-count metric">(${rest.length})</span></span>
          <span class="room-hub-more__chev" aria-hidden="true">▾</span>
        </summary>
        <div class="room-hub-more__body">${roomGameSectionsHtml(rest, grid, t)}</div>
      </details>`;
  }
  // What can start now, under the same section heads, so a long list reads by kind.
  const now = ready.length ? `
      <h3 class="room-hub-now"><span aria-hidden="true">✅</span> ${escapeHTML(t.room_hub_now || '')} <span class="room-hub-count metric">(${ready.length})</span></h3>
      ${roomGameSectionsHtml(ready, grid, t)}` : '';
  return again + now + more;
}

function roomHubMoreToggled(el) {
  // A details drawn open fires its toggle too: only a tap on it is a choice.
  const now = el.open ? '1' : '0';
  if (el.dataset.r === now) return;
  el.dataset.r = now;
  roomHubMoreOpen = !!el.open;
  haptic('light');
  if (el.open && typeof motionOff === 'function' && !motionOff()) {
    const body = el.querySelector('.room-hub-more__body');
    if (body && body.animate) body.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 240, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

/** The game picker. Everyone sees it; only the host can act on it. */
function renderRoomHub(state) {
  const t = TRANSLATIONS[appState.lang];
  const count = state.players.length;
  const night = roomNightBoardHtml(state, t);

  if (!state.youAreHost) {

  }

  const chips = `
    <div class="filter-row hscroll-fade" role="group">

              onclick="setRoomHubLocation('together')">

      </button>

              onclick="setRoomHubLocation('apart')">

      </button>

  return `
    ${roomLobbyDoorsHtml(state, t)}
    <div class="section">

      ${roomHubGroup ? roomHubBackHtml(t, false) : roomGameSearchHtml('room-hub-search', roomHubSearch, 'setRoomHubSearch', t) + chips}
      <div id="room-hub-list">${roomHubListHtml(state, t)}</div>

}

/* برنامج السهرة's door: the host's card at the top of the room's list. The builder
   itself is the program's chunk (JS_RoomProgram.html), fetched on the tap. */
function roomProgramDoorHtml(state, t) {
  if (!state.youAreHost || roomHubGroup) return '';
  let n = 0;
  try { n = (JSON.parse(localStorage.getItem('ashryProgramDraft_v1') || '[]') || []).length; } catch (e) { n = 0; }
  const sub = n ? String(t.prog_door_last || '').replace('{n}', String(n)) : (t.prog_door_hint || '');

        <span class="prog-door__sub">${escapeHTML(sub)}</span>
      </span>
      <span class="prog-door__chev" aria-hidden="true">›</span>
    </button>`;
}
/* The lobby's three doors as one row (the ideas of 7 Oct 2026, 1281): «🌙 برنامج السهرة»,
   «🕵️ المهمة السرية» and «🎉 الشلة» were three full-width cards over the host's list, and the first
   games sat under the fold of a 375x667 phone. Now they are equal chips in one row over the list
   on the game tab, each opening what it opened. Only while the host is in the hub with no family
   open; the mission once switched on keeps its card (#room-mission), and «الشلة» shows only when
   this phone has a crew (or the room counts for one), as its line did. Elsewhere (a game chosen,
   a guest, the TV) the old doors stay where they were. */
function roomLobbyDoorsOn(state) {
  return !!state && !!state.youAreHost && !state.youAreScreen && !state.game && !roomHubGroup;
}
function roomLobbyDoorsHtml(state, t) {
  if (!roomLobbyDoorsOn(state)) return '';
  const chip = (icon, label, onclick, on) => `
      <button type="button" class="lobby-door${on ? ' is-on' : ''}" onclick="${onclick}"${on ? ' aria-pressed="true"' : ''}>
        <span class="lobby-door__icon" aria-hidden="true">${icon}</span>
        <span class="lobby-door__name">${escapeHTML(label || '')}</span>
      </button>`;
  const doors = [chip('🌙', t.prog_title, 'roomOpenProgram()', false)];
  const m = state.mission;
  if (!(m && (m.on || m.phase === 'reveal'))) doors.push(chip('🕵️', t.mission_title, 'roomOpenMission()', false));
  const crew = state.crew;
  if (typeof crewPickForRoom === 'function' && typeof crewList === 'function' && (crew || crewList().length)) {
    doors.push(chip('🎉', crew ? crew.name : t.crew_title, 'crewPickForRoom()', !!crew));
  }
  return `<div class="lobby-doors" role="group">${doors.join('')}</div>`;
}

/* 🕵️ المهمة السرية: not a game from the list but a switch on the room, running beside every
   game (RoomMission.js). Its page is the chunk 'mission' (JS_RoomMission.html, with Missions.js),
   loaded as soon as a state carries it; before that, the host's door is drawn from here. */
function roomMissionSlotHtml(state, tv) {
  if (!state || (state.youAreScreen && !(tv && state.youAreHost))) return '';
  if (typeof missionLobbyHtml === 'function') return missionLobbyHtml(state, tv);
  const m = state.mission;
  if (m && (m.on || m.phase === 'reveal')) return '';       // the chunk is on its way; drawn when it lands
  return roomMissionDoorHtml(state, TRANSLATIONS[appState.lang] || {});
}
function roomMissionDoorHtml(state, t) {
  if (!state.youAreHost) return '';
  return `
    <button type="button" class="msn-door" onclick="roomOpenMission()" aria-pressed="false">
      <span class="msn-door__icon" aria-hidden="true">🕵️</span>
      <span class="msn-door__text">
        <b>${escapeHTML(t.mission_title || '')}</b>
        <small>${escapeHTML(t.mission_door_off || '')}</small>
      </span>
      <span class="msn-door__toggle" aria-hidden="true"><i></i></span>
    </button>`;
}
function roomOpenMission() {
  if (typeof lzRun === 'function') lzRun('mission', () => missionOpenSetup());
  else if (typeof missionOpenSetup === 'function') missionOpenSetup();
}
/* Every state (on any screen of the app, during any game): the chunk when the room has a mission, then its sync. */
Room.onChange((state) => {
  const m = state && state.mission;
  const wanted = !!(m && (m.on || m.phase === 'reveal'));
  if (wanted && typeof lzWait === 'function' && lzWait(['mission'], () => {
    const st = Room.state;
    if (!st) return;
    if (typeof missionSync === 'function') missionSync(st);
    if (appState.currentView === 'room-lobby' && st.phase === 'lobby' && !st.youAreScreen) renderRoomLobby(st);
    if (st.youAreScreen && typeof renderRoomTv === 'function' && onRoomView()) renderRoomTv(st);
  }, 'mission')) return;
  if (typeof missionSync === 'function') missionSync(state);
});

function roomOpenProgram() {
  if (typeof lzRun === 'function') lzRun('program', () => progOpenBuilder());
  else if (typeof progOpenBuilder === 'function') progOpenBuilder();
}

/** Once a game is chosen: its own options, plus a way back to the hub. A game's `lobbyTop(state)`
    is drawn above the folded options for everyone: what the whole table does there (أونو's teams). */
function renderChosenGame(state, game) {
  const t = TRANSLATIONS[appState.lang];
  const entry = ROOM_HUB_GAMES.find(g => g.id === state.game);
  const name = entry ? (t[entry.key] || state.game) : state.game;
  const options = (game && game.lobbyOptions) ? game.lobbyOptions(state) : '';
  const bots = roomBotControlsHtml(state);

  let firstPlay = '';
  if (!state.youAreScreen) {
    const helpKey = (typeof firstPlayKey === 'function')
      ? firstPlayKey(state.game, true)
      : (((typeof ROOM_HELP_KEY !== 'undefined' && ROOM_HELP_KEY[state.game])
          || (typeof HELP_FOR_VIEW !== 'undefined' && HELP_FOR_VIEW['room-' + state.game])
          || state.game));
    if (typeof firstPlayCardHtml === 'function') {
      firstPlay = firstPlayCardHtml(helpKey, true);

  }

  return `
    <div class="chosen-game" data-accent="${entry && entry.accent ? entry.accent : 'violet'}">

      <span class="chosen-game__name">${name}</span>

        ? `<button class="btn btn--ghost btn--xs btn--auto" onclick="roomChangeGame(this)">${t.room_change_game || 'تغيير'}</button>`
        : ''}
