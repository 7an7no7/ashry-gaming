function setupWhoAmI() {
    const catSelect = document.getElementById('whoami-cat-select');
    catSelect.innerHTML = '';
    
    // 1. Manual Option
    const manualText = appState.lang === 'ar' ? '✍️ إدخال يدوي (Manual)' : '✍️ Manual Input';
    const manualOpt = document.createElement('option');
    manualOpt.value = 'manual';
    manualOpt.innerText = manualText;
    catSelect.appendChild(manualOpt);

    // 2. Random / Mix Option
    const randomText = appState.lang === 'ar' ? '🔀 كوكتيل (مخصص)' : '🔀 Mix (Custom)';
    const randomOpt = document.createElement('option');
    randomOpt.value = 'random';
    randomOpt.innerText = randomText;
    catSelect.appendChild(randomOpt);

    // 3. Database Categories
    const db = WHOAMI_DB[appState.lang];
    if (db) {
        Object.keys(db).forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.innerText = key;
            catSelect.appendChild(option);
        });
    }
    
    handleWhoAmICatChange(); // Initialize view
    setView('setup-whoami');
}

function handleWhoAmICatChange() {
    const select = document.getElementById('whoami-cat-select');
    const manualOptions = document.getElementById('whoami-manual-options');
    const mixOptions = document.getElementById('whoami-mix-options');
    
    // 1. Hide everything first
    manualOptions.classList.add('hidden');
    mixOptions.classList.add('hidden');
    
    // 2. Show based on selection
    if (select.value === 'manual') {
        manualOptions.classList.remove('hidden');
        
        // Update Manual Text
        const labelMain = appState.lang === 'ar' ? '🔀 خلط الأدوار (Shuffle)' : '🔀 Shuffle Roles';
        const labelDesc = appState.lang === 'ar' 
            ? '✅ <b>مفعل:</b> يتم توزيع الكلمات عشوائياً.<br>⬜ <b>غير مفعل:</b> تحتفظ بكلمتك.'
            : '✅ <b>ON:</b> Words are swapped randomly.<br>⬜ <b>OFF:</b> You keep your word.';
        document.getElementById('whoami-shuffle-label').innerText = labelMain;
        document.getElementById('whoami-shuffle-desc').innerHTML = labelDesc;

    } else if (select.value === 'random') {
        mixOptions.classList.remove('hidden');
        renderMixCheckboxes();
    }
}

function adjustWhoAmICount(delta) {
    let input = document.getElementById('whoami-count');
    // An emptied field gives NaN, and NaN survives both clamps - the stepper
    // then wrote "NaN" into the box and startWhoAmI dealt nobody in.
    const current = parseInt(input.value, 10);
    let val = (isFinite(current) ? current : 2) + delta;
    if (!isFinite(val) || val < 2) val = 2;
    if (val > 20) val = 20;
    input.value = val;
    playSound('click');
}

function startWhoAmI() {
    const countEl = document.getElementById('whoami-count');
    let count = parseInt(countEl.value, 10);
    if (!isFinite(count) || count < 2) count = 2;
    if (count > 20) count = 20;
    countEl.value = count;
    const catSelect = document.getElementById('whoami-cat-select');
    const selectedCat = catSelect.value;
    
    appState.whoami.count = count;
    appState.whoami.assignments = [];
    
    let players = appState.activePlayers ? [...appState.activePlayers] : [];
    
    // If fewer players than count, pad with generic names
    if (players.length < count) {
        for(let i=players.length; i<count; i++) {
            players.push(appState.lang === 'ar' ? `اللاعب ${i+1}` : `Player ${i+1}`);
        }
    } else if (players.length > count) {
        // If more players than count, take first N
        players = players.slice(0, count);
    }

    // --- CASE 1: MANUAL ---
    if (selectedCat === 'manual') {
        appState.whoami.manualWords = [];
        appState.whoami.isShuffle = document.getElementById('whoami-shuffle-check').checked;
        appState.whoami.inputIndex = 0;
        appState.whoami.tempPlayers = players; 
        renderManualInputScreen();
        setView('input-whoami');
        return;
    }

    let pool = [];

    // --- CASE 2: RANDOM MIX (CUSTOM) ---
    if (selectedCat === 'random') {
        const db = WHOAMI_DB[appState.lang];
        // Get all checked boxes
        const checkboxes = document.querySelectorAll('.mix-check:checked');
        
        if (checkboxes.length === 0) {
            const msg = appState.lang === 'ar' ? 'يجب اختيار قسم واحد على الأقل!' : 'Select at least one category!';
            showToast(msg, 'error');
            return;
        }

        checkboxes.forEach(box => {
            const key = box.value;
            if (db[key]) pool.push(...db[key]);
        });

    } else {
    // --- CASE 3: SINGLE CATEGORY ---
        // Copied, because the shuffle below sorts in place and would otherwise
        // reorder the shared database array.
        pool = (WHOAMI_DB[appState.lang][selectedCat] || ["Error"]).slice();
    }
    
    // Shuffle and Start
    // Characters this phone hasn't dealt yet come first; one memory is shared by
    // every category, so a mix doesn't bring back what a single category just used.
    let shuffledWords = freshPick('whoami:' + appState.lang, pool, Math.min(count, pool.length));
    
    // Fallback if pool is smaller than players (rare)
    while(shuffledWords.length < count) {
        shuffledWords = shuffledWords.concat(pool);
    }
    
    const selectedWords = shuffledWords.slice(0, count);
    
    for (let i = 0; i < count; i++) {
        appState.whoami.assignments.push({ name: players[i], word: selectedWords[i] });
    }
    
    document.getElementById('whoami-result-ui').classList.add('hidden');
    startRevealPhase();
}

/* ================= MANUAL INPUT LOGIC ================= */

function renderManualInputScreen() {
    const idx = appState.whoami.inputIndex;
    const playerNum = idx + 1;
    const givePhoneText = appState.lang === 'ar' ? 'أعط الهاتف لـ' : 'Give phone to';
    const playerLabel = appState.lang === 'ar' ? `اللاعب ${playerNum}` : `Player ${playerNum}`;
    
    document.getElementById('manual-instruction').innerText = givePhoneText;
    document.getElementById('manual-player-label').innerText = playerLabel;
    
    const input = document.getElementById('manual-whoami-input');
    input.value = '';
    input.placeholder = appState.lang === 'ar' ? 'اكتب الشخصية هنا...' : 'Type character here...';
    input.focus();
}

function submitManualWhoAmI() {
    const input = document.getElementById('manual-whoami-input');
    const val = input.value.trim();
    
    if(!val) {
        showToast(appState.lang === 'ar' ? 'أدخل كلمة أولاً!' : 'Enter a word first!', 'error');
        return;
    }
    
    appState.whoami.manualWords.push(val);
    appState.whoami.inputIndex++;
    
    playSound('click');
    
    if (appState.whoami.inputIndex < appState.whoami.count) {
        renderManualInputScreen();
    } else {
        finalizeManualGame();
    }
}

function finalizeManualGame() {
    const words = [...appState.whoami.manualWords];
    const players = appState.whoami.tempPlayers;

    // FIX 1: Ensure previous results are hidden immediately
    document.getElementById('whoami-result-ui').classList.add('hidden');

    if (appState.whoami.isShuffle) {
        // SCENARIO A: SHUFFLE ON -> Randomize -> Go to Reveal
        words.sort(() => 0.5 - Math.random());
        
        for (let i = 0; i < appState.whoami.count; i++) {
            appState.whoami.assignments.push({ name: players[i], word: words[i] });
        }
        startRevealPhase();
        
    } else {
        // SCENARIO B: SHUFFLE OFF -> Keep Word -> SKIP REVEAL -> Go to Timer
        for (let i = 0; i < appState.whoami.count; i++) {
            appState.whoami.assignments.push({ name: players[i], word: words[i] });
        }
        
        document.getElementById('whoami-pass-container').classList.add('hidden');
        document.getElementById('whoami-timer-ui').classList.remove('hidden');
        setView('play-whoami');
        
        startWhoAmITimer();
    }
}

/* ================= REVEAL & GAMEPLAY ================= */

function startRevealPhase() {
    appState.whoami.currentIndex = 0;
    document.getElementById('whoami-pass-container').classList.remove('hidden');
    document.getElementById('whoami-pass-ui').classList.remove('hidden');
    document.getElementById('whoami-reveal-ui').classList.add('hidden');
    document.getElementById('whoami-timer-ui').classList.add('hidden');
    document.getElementById('whoami-result-ui').classList.add('hidden');
    
    updateWhoAmIPassScreen();
    setView('play-whoami');
}

function updateWhoAmIPassScreen() {
    const currentPlayer = appState.whoami.assignments[appState.whoami.currentIndex];
    document.getElementById('whoami-player-label').innerText = currentPlayer.name; // innerText is safe
    document.getElementById('whoami-pass-ui').classList.remove('hidden');
    document.getElementById('whoami-reveal-ui').classList.add('hidden');
}

function whoAmIReveal() {
    const item = appState.whoami.assignments[appState.whoami.currentIndex];
    
    let displayHtml = escapeHTML(item.word);
    
    if (item.word.includes('|')) {
        const parts = item.word.split('|');
        displayHtml = `
            <div class="flex flex-col items-center">
                <span>${escapeHTML(parts[0])}</span>
                <span class="text-lg text-teal-600 mt-2 font-bold opacity-75">(${escapeHTML(parts[1])})</span>
            </div>
        `;
    }

    document.getElementById('whoami-secret-word').innerHTML = displayHtml;
    
    document.getElementById('whoami-pass-ui').classList.add('hidden');
    document.getElementById('whoami-reveal-ui').classList.remove('hidden');
    playSound('click');
}

function whoAmINext() {
    appState.whoami.currentIndex++;
    
    if (appState.whoami.currentIndex >= appState.whoami.assignments.length) {
        startWhoAmITimer(); 
    } else {
        updateWhoAmIPassScreen();
    }
}

// --- TIMER PHASE ---
function startWhoAmITimer() {
    document.getElementById('whoami-pass-container').classList.add('hidden');
    document.getElementById('whoami-timer-ui').classList.remove('hidden');
    // Who asks whom, if the table asked for it (JS_Director.html).
    if (typeof directorStart === 'function') {
        directorStart(appState.whoami, appState.whoami.assignments.map(a => a.name), directorModeOf('whoami'));
        paintDirector('whoami-director', appState.whoami, 'whoamiDirectorNext()');
    }
    
    appState.whoami.timer = 120; 
    appState.whoami.isPaused = false;
    updateWhoAmITimerDisplay();
    
    if(appState.whoami.interval) appState.whoami.interval.stop();

    appState.whoami.interval = createClock({
        seconds: 120,
        onTick: (left) => {
            appState.whoami.timer = left;
            updateWhoAmITimerDisplay();
        },
        onEnd: () => {
            appState.whoami.interval = null;
            appState.whoami.timer = 0;
            updateWhoAmITimerDisplay();
            playSound('alarm');
        }
    });
}

function whoamiDirectorNext() {
    directorNext(appState.whoami);
    paintDirector('whoami-director', appState.whoami, 'whoamiDirectorNext()');
    haptic('light');
}

function toggleWhoAmITimer() {
    appState.whoami.isPaused = appState.whoami.interval
        ? appState.whoami.interval.toggle()
        : !appState.whoami.isPaused;
    const btn = document.getElementById('whoami-pause-btn');
    if(appState.lang === 'ar') btn.innerText = appState.whoami.isPaused ? "استئناف" : "إيقاف";
    else btn.innerText = appState.whoami.isPaused ? "Resume" : "Pause";
}

function updateWhoAmITimerDisplay() {
    const m = Math.floor(appState.whoami.timer / 60).toString().padStart(2, '0');
    const s = (appState.whoami.timer % 60).toString().padStart(2, '0');
    document.getElementById('whoami-timer-display').innerText = `${m}:${s}`;
}

// --- RESULT PHASE ---
function finishWhoAmIGame() {
    if(appState.whoami.interval) appState.whoami.interval.stop();
    appState.whoami.interval = null;
    
    const listEl = document.getElementById('whoami-final-list');
    listEl.innerHTML = '';
    
    appState.whoami.assignments.forEach((item, index) => {
        let displayWord = escapeHTML(item.word);
        if (item.word.includes('|')) {
            const parts = item.word.split('|');
            displayWord = `${escapeHTML(parts[0])} <span class="text-xs opacity-75">(${escapeHTML(parts[1])})</span>`;
        }

        // FIX 2: Dark Mode Colors (Force slate-800/100 to ensure visibility)
        const isEven = index % 2 === 0;
        const bgClass = isEven ? 'bg-slate-100 dark:bg-slate-800' : 'bg-slate-200 dark:bg-slate-700';
        const textClass = 'text-slate-800 dark:text-slate-100'; 

        listEl.innerHTML += `
            <div class="flex justify-between items-center ${bgClass} p-4 rounded-xl border-r-4 border-teal-500 shadow-sm">
                <span class="font-bold tx-muted">${escapeHTML(item.name)}</span>
                <span class="${textClass} font-black text-xl text-right">${displayWord}</span>
            </div>
        `;
    });

    document.getElementById('whoami-timer-ui').classList.add('hidden');
    document.getElementById('whoami-result-ui').classList.remove('hidden'); 
    document.getElementById('whoami-result-ui').classList.add('flex');
    
    playSound('success');
    confetti({ particleCount: 150, spread: 70 });
}

function renderMixCheckboxes() {
    const container = document.getElementById('whoami-mix-list');
    const db = WHOAMI_DB[appState.lang];
    
    // Don't re-render if already populated to keep selection
    if (container.children.length > 0 && container.dataset.lang === appState.lang) return;
    
    container.innerHTML = '';
    container.dataset.lang = appState.lang;

    Object.keys(db).forEach(key => {
        const div = document.createElement('div');
        // USES NEW .mix-item CLASS
        div.className = "flex items-center p-2 rounded-lg mix-item mb-2";
        div.innerHTML = `
            <input type="checkbox" id="mix-${key}" value="${key}" class="mix-check w-5 h-5 accent-teal-600 cursor-pointer" checked>
            <label for="mix-${key}" class="mx-2 font-bold text-sm cursor-pointer flex-grow select-none">${key}</label>
        `;
        container.appendChild(div);
    });
}

</script>
