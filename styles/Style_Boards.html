  box-shadow: 0 0 0 5px #2a2150, 0 0 0 9px rgba(239, 68, 68, 0.55), 0 0 36px 6px rgba(239, 68, 68, 0.45), inset 0 -7px 0 rgba(0, 0, 0, 0.25);
  font-size: 1.45rem;
}
.pc-stage .db-callbtn:active { transform: translateY(3px) scale(0.97); box-shadow: 0 0 0 5px #2a2150, 0 0 0 9px rgba(239, 68, 68, 0.55), 0 0 22px 4px rgba(239, 68, 68, 0.4), inset 0 -3px 0 rgba(0, 0, 0, 0.25); }
.db-controls.is-solo .db-callbtn { width: 7.6rem; height: 7.6rem; font-size: 1.7rem; }
.db-callbtn.is-hot { animation: db-call-pulse 0.8s ease-in-out infinite alternate; }
.pc-stage .db-callbar { position: relative; inset: auto; display: block; width: min(12rem, 70%); height: 0.35rem; margin: var(--sp-2) auto 0; background: rgba(239, 68, 68, 0.25); }
.pc-stage .db-callbar > i { background: #ef4444; }
.db-callhint { margin-top: 2px; }
.pc-side {
  min-width: 0;
  min-height: 3.1rem;
  padding: 0.35rem 0.7rem;
  border: 0;
  border-radius: var(--r-full);
  font-family: var(--font-display);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.2;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.pc-side--ghost { border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.1); color: #eee8ff; }
.pc-side--amber, .pc-throw { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #3b1d00; box-shadow: 0 8px 18px -10px rgba(245, 158, 11, 0.8); }
.pc-side:disabled, .pc-throw:disabled { opacity: 0.45; cursor: default; }
.pc-throw { width: 100%; border: 0; font-family: var(--font-display); }
.pc-stage .db-rankchip { border-color: var(--stg-line); background: rgba(255, 255, 255, 0.06); color: #fff; }
.pc-stage .db-rankchip.is-held { border-color: rgba(196, 181, 253, 0.6); background: rgba(167, 139, 250, 0.2); }
.pc-stage .db-rankchip.is-on { border-color: transparent; background: var(--stg-gold); color: #3b1d00; }
.pc-stage .db-prompt.is-mine { color: var(--stg-gold); }

/* --- Your hand: a fan at the foot of the stage --- */
.pc-stage .db-mine, .pc-stage .om-mine { border-color: var(--stg-line); background: rgba(255, 255, 255, 0.03); box-shadow: none; }
.pc-stage .db-mine.is-turn { border-color: rgba(251, 191, 36, 0.5); box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.3); }
.pc-stage .om-mine.is-victim { border-color: var(--stg-gold); box-shadow: 0 0 0 1px var(--stg-gold); }
.pc-fanrow { padding-top: 1.5rem; padding-bottom: 0.4rem; }
.pc-fanrow > * { rotate: calc(var(--a, 0) * 1deg); transform-origin: 50% 340%; }
.pc-fanrow > .is-dragging { rotate: 0deg; }
.pc-stage .om-mixbtn { border-color: rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.12); color: #fde68a; }

/* --- الشايب: the hand being drawn from under the light, the pairs on a shelf --- */
.pc-stage .om-draw { gap: var(--sp-2); }
.pc-stage .om-draw.is-victim { align-items: center; background: rgba(251, 191, 36, 0.08); }
.pc-stage .om-draw.is-mine { box-shadow: none; }
.pc-stage .pc-shelf {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--sp-1) var(--sp-2);
  padding: var(--sp-2);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
}
.pc-stage .pc-shelf .om-mid__pairs { min-height: 0; }
.pc-stage .om-mid__label { color: var(--text-2); }

/* --- «على الهوا»: the log --- */
.pc-onair:empty { display: none; }
.pc-onair h4 { margin: 0 0 var(--sp-1); color: var(--stg-gold); font-family: var(--font-display); font-size: var(--fs-sm); font-weight: 800; }
.pc-stage .db-log li, .pc-stage .om-log li { background: rgba(255, 255, 255, 0.05); color: #d7cff3; }

/* --- A phone on its side: the stage beside the controls and the hand --- */
@media (orientation: landscape) and (max-height: 500px) {
  .pc-stage { padding: var(--sp-2); gap: var(--sp-1); }
  .pc-stage .db-layout { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); grid-template-areas: "center mine" "center act"; align-items: start; }
  .pc-stage .om-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "draw act" "draw mine" "mid mine"; }
  .pc-banner strong { font-size: 1.6rem; }
  .pc-stage .db-pilezone { min-height: 5rem; }
  .pc-stage .db-pile, .pc-stage .db-pile .pc-card { --pc-w: 3.3rem; }
  .pc-stage .db-callbtn { width: 4.8rem; height: 4.8rem; font-size: 1.15rem; }
  .db-controls.is-solo .db-callbtn { width: 5.4rem; height: 5.4rem; }
  .pc-side { min-height: 2.6rem; }
  .pc-stage .pc-onair { display: none; }
  /* The height is what a phone on its side lacks: one-line tiles, the head on one line, the buzzer over «باص | ارمي». */
  .pc-stage__top { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; }
  .pc-stage__top .db-latest, .pc-stage__top .om-latest { padding-block: 2px; }
  .pc-stage .pc-tile { grid-template-columns: auto auto; grid-template-areas: "who led"; align-items: center; column-gap: 6px; padding: 3px 8px; }
  .pc-stage .pc-tile .pc-tile__who { grid-area: who; }
  .pc-stage .pc-tile .pc-tile__led { grid-area: led; font-size: 1.15rem; }
  .pc-stage .pc-tile .pc-tile__st { display: none; }
  .pc-banner strong, .om-draw.pc-spot .pc-banner strong { font-size: 1.45rem; }
  .db-controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); grid-template-areas: "buzz buzz" "pass throw"; gap: var(--sp-1) var(--sp-2); }
  .db-controls.is-solo { grid-template-areas: "buzz"; grid-template-columns: auto; }
  .db-controls.no-buzz { grid-template-areas: "pass throw"; }
  .db-controls > .pc-side--ghost { grid-area: pass; }
  .db-controls > .pc-side--amber { grid-area: throw; }
  .db-controls > .db-callbtn { grid-area: buzz; justify-self: center; margin-block: 0.3rem; }
}

/* --- A laptop, a big screen as a player's own: the scoreboard a column on one side, «على الهوا» on the other --- */
@media (min-width: 900px) and (min-height: 501px) {
  .pc-stage { display: grid; grid-template-columns: 13rem minmax(0, 1fr) 14rem; grid-template-areas: "top top top" "rail main air" "strip strip strip"; align-items: start; column-gap: var(--sp-4); padding: var(--sp-4); }
  .pc-stage > .pc-stage__top { grid-area: top; }
  .pc-stage > .pc-rail { grid-area: rail; flex-direction: column; flex-wrap: nowrap; overflow: visible; }
  .pc-stage > .db-layout, .pc-stage > .om-layout { grid-area: main; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); column-gap: var(--sp-3); align-items: start; }
  /* The controls and the hand side by side under the light, so a 720-high screen holds the whole table. */
  .pc-stage .db-layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-areas: "center act" "mine mine"; align-items: center; }
  .pc-stage .om-layout { grid-template-areas: "draw draw" "act mine" "mid mine"; }
  .pc-stage > .pc-onair { grid-area: air; }
  .pc-stage > [data-room-strip] { grid-area: strip; }
  .pc-stage .pc-rail > .pc-tile { max-width: none; width: 100%; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who led" "st led"; justify-items: start; align-items: center; column-gap: var(--sp-2); padding: 8px 12px; }
  .pc-stage .pc-rail .pc-tile__who { grid-area: who; }
  .pc-stage .pc-rail .pc-tile__led { grid-area: led; font-size: 1.9rem; }
  .pc-stage .pc-rail .pc-tile__st { grid-area: st; }
  .pc-stage .pc-tile .db-seat__name, .pc-stage .pc-tile .om-seat__name { max-width: 8rem; font-size: var(--fs-sm); }
  .pc-banner strong { font-size: clamp(2rem, 3.8vw, 3rem); }
  .pc-stage .db-pilezone { min-height: 0; }
  .pc-stage .db-pile, .pc-stage .db-pile .pc-card { --pc-w: clamp(4rem, 9.5vh, 6.4rem); }
  .pc-stage .db-callbtn { width: 6.6rem; height: 6.6rem; font-size: 1.55rem; }
  .db-controls.is-solo .db-callbtn { width: 7.6rem; height: 7.6rem; }
  /* The controls' column is narrow here: the buzzer on top, «باص» and «ارمي» under it. */
  .db-controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); grid-template-areas: "buzz buzz" "pass throw"; }
  .db-controls.is-solo { grid-template-areas: "buzz"; grid-template-columns: auto; }
  .db-controls.no-buzz { grid-template-areas: "pass throw"; }
  .db-controls > .pc-side--ghost { grid-area: pass; }
  .db-controls > .pc-side--amber { grid-area: throw; }
  .db-controls > .db-callbtn { grid-area: buzz; justify-self: center; margin-block: 0.4rem 0.6rem; }
  .pc-stage { grid-template-columns: 12rem minmax(0, 1fr) 12rem; padding: var(--sp-3); row-gap: var(--sp-2); }
  .pc-stage .pc-spot { padding-block: var(--sp-1) var(--sp-2); }
}

/* --- The TV: the scoreboard down one side, the stage in the middle, the turn and «على الهوا» on the other --- */
.db-tv.pc-stage, .om-tv.pc-stage { height: 100%; min-height: 0; display: grid; grid-template-areas: none; align-items: stretch; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 21vw) minmax(0, 1fr) minmax(0, 24vw); gap: calc(var(--tv-gap) * 1.5); padding: 2vmin; border-radius: var(--tv-r); }
.pc-stage.db-tv > *, .pc-stage.om-tv > * { grid-area: auto; }
.db-tv__rail, .om-tv__rail { min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 1vmin; overflow: hidden; }
