<script>
/* ============================================================================
   نونوجرام — NONOGRAM (picture logic)
   ----------------------------------------------------------------------------
   The numbers beside each row and above each column are the runs of filled
   cells in that line, in order: "3 1" is three filled, a gap, then one. Fill
   the cells to reveal a picture. ⬛ fills, ✕ marks a cell you know is empty;
   drag to paint several at once.

   The pictures and the generator are Nonogram.js (shared with the rooms
   server, which deals a race's board): a board is one of NONO_PICTURES or
   random, and only used if it can be finished line by line. 5×5 easy
   (random), 8×8 medium and 10×10 hard (pictures or random); the daily is a
   10×10 picture, going round all of them before one comes back
   (nonoDailyPicture: the order of each round is shuffled from its number, so
   every phone agrees). Clearing the board and dealing a new one over a game
   in progress both ask first. The board is in appState.nonogram.

   In سباق ألغاز (RACE_UI.nonogram, JS_RoomRace.html) the same grid and drag
   play the room's puzzle from its clues alone: the picture stays on the
   server (its name would give it away), every drag is sent as `move { cells }`
   and the server says when the painted cells are the picture. No hint.
   ========================================================================= */

let nonoTimer = null;

function nonoState() {
  const race = soloRaceState('nonogram');
  if (race) return race;
  if (!appState.nonogram) {
    appState.nonogram = { level: 'easy', daily: '', n: 5, solution: [], clues: null, cells: [], pic: null, mode: 'fill', hints: 0, startedAt: 0, pausedAt: 0, phase: 'setup' };
  }
  return appState.nonogram;
}

/**
 * The daily's picture: the pictures go round in an order shuffled from the
 * round's number, so none comes back before all have been, and a round never
 * starts with the picture the last one ended on.
 */
function nonoDailyPicture(pics, day) {
  const count = pics.length;
  const index = soloDayIndex(day);
  const round = Math.floor(index / count);
  const order = (k) => soloShuffle(pics.map((_, i) => i), soloRng(soloHash('ashry-nonogram-round:' + k)));
  const now = order(round);
  const before = order(round - 1);
  if (count > 1 && now[0] === before[count - 1]) now.push(now.shift());
  return pics[now[((index % count) + count) % count]];
}

/* --- Setup and play ---------------------------------------------------------------- */

function setupNonogram() {
  nonoStopTimer();
  setView('setup-nonogram');
}

function paintNonogramSetup() {
  const s = nonoState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#nonogram-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const best = soloBest('nonogram', s.level);
  const el = document.getElementById('nonogram-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('nonogram-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('nonogram-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('nonogram', 'startNonogram(true)');
}

function setNonogramLevel(level) {
  nonoState().level = level;
  saveToLocal();
  paintNonogramSetup();
}

const nonoHasWork = (s) => (s.cells || []).some(Boolean);

function startNonogram(daily, sure) {
  if (!sure && soloConfirmNew('nonogram', nonoHasWork, () => startNonogram(daily, true))) return;
  if (daily && soloDailyResume('nonogram')) return;
  const s = nonoState();
  const level = daily ? 'hard' : s.level;
  const rnd = soloRandom(daily ? soloDaySeed('nonogram') : null);
  let made = nonoMake(level, rnd, daily ? nonoDailyPicture(nonoSolvablePictures(NONO_SIZES[level]), soloToday()) : null);
  // A free board that couldn't be made gets one more go with other dice.
  if (!made && !daily) made = nonoMake(level, soloRandom(null), null);
  if (!made) { showToast((TRANSLATIONS[appState.lang] || {}).solo_make_failed || '', 'error'); return; }
  soloDailySetAside('nonogram');
  soloNewGame('nonogram');
  s.daily = daily ? soloToday() : '';
  s.playLevel = level;
  s.n = made.n;
  s.solution = made.solution;
  s.clues = nonoClues(made.n, made.solution);
  s.pic = made.pic;
  s.cells = new Array(made.n * made.n).fill(0);   // 0 empty, 1 filled, 2 ✕
  s.mode = 'fill';
  soloUndoClear(s);
  s.hints = 0;
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'play';
  saveToLocal();
  setView('play-nonogram');
  paintNonogram();
  nonoArmTimer();
}

function continueNonogram() {
  if (nonoState().phase !== 'play') return;
  setView('play-nonogram');
  paintNonogram();
  nonoArmTimer();
}

function nonoArmTimer() {
  nonoStopTimer();
  nonoTimer = soloClock('nono-time', () => nonoState().startedAt);
}

function nonoStopTimer() {
  if (nonoTimer) nonoTimer.stop();
  nonoTimer = null;
}

/** The board's clues: kept on the state (a race has only these), worked out for a board saved before they were. */
function nonoCluesOf(s) {
  if (!s.clues && s.solution && s.solution.length) s.clues = nonoClues(s.n, s.solution);
  return s.clues;
}

function paintNonogram() {
  const s = nonoState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('nonogram-stage');
  const clues = el ? nonoCluesOf(s) : null;
  if (!el || !clues) return;
  const n = s.n;
  const filled = s.cells.map(v => (v === 1 ? 1 : 0));
  const rowDone = Array.from({ length: n }, (_, r) => nonoRuns(filled.slice(r * n, r * n + n)).join(',') === clues.rows[r].join(','));
  const colDone = Array.from({ length: n }, (_, c) => nonoRuns(Array.from({ length: n }, (_, r) => filled[r * n + c])).join(',') === clues.cols[c].join(','));
  const bar = soloBarHtml([
    s.daily ? { label: t.daily_title || '', value: '📅' } : { label: t.solo_level || '', value: `${n}×${n}` },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.seconds), id: 'nono-time' }
  ]);
  const colHead = clues.cols.map((cl, c) => `<div class="nono-clue nono-clue--col${colDone[c] ? ' is-done' : ''}">${(cl.length ? cl : [0]).map(x => `<span>${x}</span>`).join('')}</div>`).join('');
  const body = Array.from({ length: n }, (_, r) => `
    <div class="nono-clue nono-clue--row${rowDone[r] ? ' is-done' : ''}">${(clues.rows[r].length ? clues.rows[r] : [0]).map(x => `<span>${x}</span>`).join('')}</div>
    ${Array.from({ length: n }, (_, c) => {
      const i = r * n + c;
      const v = s.cells[i];
      const cls = ['nono-cell', v === 1 ? 'is-fill' : '', v === 2 ? 'is-x' : '', c % 5 === 4 && c < n - 1 ? 'is-sep-r' : '', r % 5 === 4 && r < n - 1 ? 'is-sep-b' : ''].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-i="${i}" onpointerdown="nonoDown(event, ${i})">${v === 2 ? '✕' : ''}</button>`;
    }).join('')}`).join('');
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="nono-grid${s.phase === 'done' ? ' is-solved' : ''}" id="nono-grid" dir="ltr" style="--nono-n:${n}">
          <div class="nono-corner"></div>${colHead}${body}
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}
        <div class="segmented nono-mode" role="group">
          <button type="button" class="segmented__item ${s.mode === 'fill' ? 'is-active' : ''}" onclick="setNonoMode('fill')">⬛ ${escapeHTML(t.nono_fill || '')}</button>
          <button type="button" class="segmented__item ${s.mode === 'x' ? 'is-active' : ''}" onclick="setNonoMode('x')">✕ ${escapeHTML(t.nono_cross || '')}</button>
        </div>
        <div class="sdk-tools">
          <button type="button" class="btn btn--neutral btn--sm" id="nono-undo" onclick="undoNonogram()" ${soloCanUndo(s) && s.phase === 'play' ? '' : 'disabled'}>↶ ${escapeHTML(t.solo_undo || '')}</button>
          <button type="button" class="btn btn--neutral btn--sm" onclick="clearNonogram()">🧹 ${escapeHTML(t.queens_clear || '')}</button>
          ${s.race ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="hintNonogram()">💡 ${escapeHTML(t.solo_hint || '')}</button>`}
        </div>
      </div>
    </div>
    ${s.race ? '' : `<div class="view-actions play-foot">
      <button class="btn btn--ghost btn--sm btn--auto play-exit" onclick="setupNonogram()">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
}

function setNonoMode(mode) {
  const s = nonoState();
  s.mode = mode;
  saveToLocal();
  paintNonogram();
}

/* A press sets a cell to the mode's mark (or clears it if it already has it); dragging copies that to every cell crossed. */
let nonoDrag = null;   // the drag painting now ({ end }): one finger at a time

function nonoDown(e, i) {
  const s = nonoState();
  if (s.phase !== 'play') return;
  e.preventDefault();
  // A second finger while one paints is ignored; the drag only listens to its own pointer.
  // A primary pointer can't be a second finger: a drag still set then lost its "up", and goes.
  if (nonoDrag && !e.isPrimary) return;
  if (nonoDrag) nonoDrag.end();
  const pid = e.pointerId;
  const mark = s.mode === 'fill' ? 1 : 2;
  const target = s.cells[i] === mark ? 0 : mark;
  const before = s.cells.slice();   // ideas batch: solo - one undo step per drag
  const painted = new Set();
  const apply = (k) => {
    if (painted.has(k)) return;
    painted.add(k);
    s.cells[k] = target;
    const cell = document.querySelector(`#nono-grid [data-i="${k}"]`);
    if (cell) {
      cell.classList.toggle('is-fill', target === 1);
      cell.classList.toggle('is-x', target === 2);
      cell.textContent = target === 2 ? '✕' : '';
    }
  };
  apply(i);
  const move = (ev) => {
    if (ev.pointerId !== pid) return;
    const cell = soloCellAt(ev.clientX, ev.clientY, '.nono-cell');
    if (cell) apply(Number(cell.dataset.i));
  };
  const up = (ev) => {
    if (ev && ev.pointerId !== pid) return;
    nonoDrag.end();
    if (s.cells.some((v, k) => v !== before[k])) soloUndoPush(s, before);
    saveToLocal();
    paintNonogram();
    nonoCheck();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  nonoDrag = {
    end: () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      nonoDrag = null;
    }
  };
}

/** Empties the board, after asking: it is every mark at once. */
function clearNonogram(sure) {
  const s = nonoState();
  if (s.phase !== 'play' || !nonoHasWork(s)) return;
  if (!sure) {
    const t = TRANSLATIONS[appState.lang] || {};
    showConfirmModal(t.solo_clear_confirm || 'تمسح كل اللي على اللوحة؟', () => clearNonogram(true));
    return;
  }
  soloUndoPush(s, s.cells.slice());
  s.cells = s.cells.map(() => 0);
  saveToLocal();
  paintNonogram();
  nonoCheck();
}

/** ideas batch: solo - takes back the last change: a drag, a clear or a hint, as far back as you like. */
function undoNonogram() {
  const s = nonoState();
  if (s.phase !== 'play' || !soloCanUndo(s)) return;
  const back = soloUndoPop(s);
  if (!back) return;
  s.cells = back;
  saveToLocal();
  paintNonogram();
  nonoCheck();
}

/** Fixes one wrong cell, or fills one missing one. */
function hintNonogram() {
  const s = nonoState();
  if (s.phase !== 'play' || s.race) return;
  const before = s.cells.slice();
  let i = s.cells.findIndex((v, k) => v === 1 && !s.solution[k]);
  if (i !== -1) s.cells[i] = 2;
  else {
    i = s.cells.findIndex((v, k) => v !== 1 && s.solution[k]);
    if (i === -1) return;
    s.cells[i] = 1;
  }
  soloUndoPush(s, before);
  s.hints = (s.hints || 0) + 1;
  saveToLocal();
  paintNonogram();
  nonoCheck();
}

/** A solved board: the picture's cells pop in, corner to corner. */
function nonoCelebrate(s) {
  const grid = document.getElementById('nono-grid');
  if (grid) grid.classList.add('is-solved');
  if (motionOff()) return 0;
  const n = s.n;
  document.querySelectorAll('#nono-grid .nono-cell.is-fill').forEach(cell => {
    const i = Number(cell.dataset.i);
    if (cell.animate) cell.animate([{ transform: 'scale(0.4)', opacity: 0.3 }, { transform: 'scale(1.12)', opacity: 1 }, { transform: 'scale(1)' }],
      { duration: 420, delay: (Math.floor(i / n) + i % n) * 30, easing: 'ease-out', fill: 'backwards' });
  });
  return n * 2 * 30 + 500;
}

function nonoCheck() {
  const s = nonoState();
  if (s.phase !== 'play') return;
  // A race: the server holds the picture and judges the board (JS_RoomRace.html).
  if (s.race) { raceMove('nonogram', { cells: s.cells.slice() }); return; }
  if (s.cells.some((v, i) => (v === 1 ? 1 : 0) !== s.solution[i])) return;
  nonoStopTimer();
  s.phase = 'done';
  s.cells = s.cells.map(v => (v === 1 ? 1 : 0));
  soloUndoClear(s);
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  saveToLocal();
  paintNonogram();
  const t = TRANSLATIONS[appState.lang];
  const n = s.n;
  nonoCelebrate(s);
  const level = s.playLevel || s.level;
  const rec = s.hints || s.archive ? { record: false, prev: soloBest('nonogram', level) }
    : soloRecord('nonogram', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('nonogram', { seconds: seconds, hints: s.hints || 0 }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🖼️ ${t.setup_nonogram || ''} ✅ ${soloTime(seconds)}${s.hints ? ' · 💡 ' + s.hints : ''}`;
  }
  const lines = [];
  if (s.pic) lines.push(`${s.pic.e} <b>${escapeHTML(appState.lang === 'en' ? s.pic.en : s.pic.ar)}</b>`);
  if (s.hints) lines.push(`💡 ${escapeHTML(t.solo_hint || '')}: ${s.hints}`);
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  // A daily's picture never shows what the drawing is.
  const shareLines = s.daily && s.pic ? lines.slice(1) : lines;
  soloLater('nonogram', motionOff() ? 0 : n * 2 * 30 + 500, () => soloResult({
    icon: s.pic ? s.pic.e : '🖼️', title: rec.record ? (t.solo_new_best || '') : (t.solo_solved || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, shareLines: shareLines, shareIcon: s.daily ? '🖼️' : '', win: true, share: share,
    again: () => startNonogram(false), exit: setupNonogram
  }));
}

function restoreNonogram() {
  const s = nonoState();
  if (s.phase !== 'play' || !s.solution.length) return false;
  paintNonogram();
  nonoArmTimer();
  return true;
}

soloRegister('nonogram', {
  setup: 'setup-nonogram', play: 'play-nonogram', paintSetup: paintNonogramSetup, restore: restoreNonogram,
  state: nonoState, resume: continueNonogram, repaint: paintNonogram, timed: true, prefs: ['level', 'mode']
});

/* --- سباق ألغاز: the same grid, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.nonogram = {
  stage: 'nonogram-stage',
  unit: 'race_unit_cells',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', n: pub.n, solution: [], clues: pub.clues, pic: null,
    cells: new Array(pub.n * pub.n).fill(0), mode: 'fill', hints: 0, seconds: 0 }),
  // A reload: the cells the server last took from this phone are the board.
  sync(s, board) {
    if (board && Array.isArray(board.cells) && board.cells.length === s.cells.length && !nonoHasWork(s)) s.cells = board.cells.slice();
  },
  paint: () => paintNonogram(),
  finished: (s, won) => (won ? nonoCelebrate(s) : 0),
  // The picture, once the round is over.
  revealHtml: (r) => (r && r.pic ? `<div class="race-pic"><span class="race-pic__e" aria-hidden="true">${r.pic.e}</span><b>${escapeHTML(appState.lang === 'en' ? r.pic.en : r.pic.ar)}</b></div>` : '')
};
</script>
