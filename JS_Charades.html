// --- 1. RENDER FUNCTION (Safe to call anytime) ---
function renderCharadesDropdown() {
    const catSelect = document.getElementById('charades-cat-select');
    if(!catSelect) return;
    
    catSelect.innerHTML = ''; 
    const db = CHARADES_DB[appState.lang];
    if (db) {
        Object.keys(db).forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.innerText = key;
            catSelect.appendChild(option);
        });
    }
}

// --- 2. SETUP FUNCTION (Triggered by Button) ---
function setupCharades() {
    renderCharadesDropdown(); // Fill data
    setView('setup-charades'); // Change screen
}

function startCharades(time) {
    const catSelect = document.getElementById('charades-cat-select');
    const catKey = catSelect ? catSelect.value : null;
    
    if (appState.charades.currentCategory.length > 0 && time) {
         // Replay mode
    } else if (catKey && CHARADES_DB[appState.lang][catKey]) {
        appState.charades.currentCategory = [...CHARADES_DB[appState.lang][catKey]];
    } else {
        appState.charades.currentCategory = ["Error: No Category"];
    }

    appState.charades.score = 0;
    appState.charades.history = []; 
    
    if(time) appState.charades.timer = time;
    else appState.charades.timer = parseInt(document.getElementById('charades-timer-input').value);

    document.getElementById('charades-ui-playing').classList.remove('hidden');
    document.getElementById('charades-ui-result').classList.add('hidden');
    
    setView('play-charades');
    nextCharadesCard();
    
    document.getElementById('charades-timer').innerText = appState.charades.timer;
    if (appState.charades.interval) appState.charades.interval.stop();

    appState.charades.interval = createClock({
        seconds: appState.charades.timer,
        onTick: (left) => {
            const timerEl = document.getElementById('charades-timer');
            if (timerEl) timerEl.innerText = left;
        },
        onEnd: () => {
            appState.charades.interval = null;
            finishCharadesGame();
        }
    });
}

function startCharadesGame(time) {
    startCharades(time);
}

function nextCharadesCard(action) {
    if (action === 'correct') {
        appState.charades.score++;
        playSound('success');
    } else if (action === 'pass') {
        playSound('click');
    }

    const words = appState.charades.currentCategory;
    // Every card in the category has already been up this round.
    if (appState.charades.history.length >= words.length) {
        finishCharadesGame();
        return;
    }

    // Remembered across games on this phone, so a new round doesn't open with
    // the cards the last one just used.
    const word = freshPick('charades:' + appState.lang, words, 1, { avoid: appState.charades.history })[0];
    
    appState.charades.history.push(word);
    
    const cardTitle = document.getElementById('charades-word');
    if(cardTitle) {
        if (appState.charades.flipTimer) clearTimeout(appState.charades.flipTimer);
        if (appState.charades.classTimer) clearTimeout(appState.charades.classTimer);
        const cardParent = cardTitle.parentElement;
        cardParent.classList.remove('animate-flip');
        void cardParent.offsetWidth;
        cardParent.classList.add('animate-flip');
        appState.charades.classTimer = setTimeout(() => cardParent.classList.remove('animate-flip'), 500);
        appState.charades.flipTimer = setTimeout(() => { cardTitle.innerText = word; }, 250);
    }
}

function finishCharadesGame() {
    if (appState.charades.flipTimer) clearTimeout(appState.charades.flipTimer);
    if (appState.charades.classTimer) clearTimeout(appState.charades.classTimer);
    if (appState.charades.interval) appState.charades.interval.stop();
    appState.charades.interval = null;
    
    playSound('alarm');
    confetti({ particleCount: 200, spread: 100 });

    document.getElementById('charades-final-score').innerText = appState.charades.score;
    
    document.getElementById('charades-ui-playing').classList.add('hidden');
    document.getElementById('charades-ui-result').classList.remove('hidden');
}
