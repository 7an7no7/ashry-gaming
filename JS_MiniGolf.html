/* --- the camera: the whole hole on the screen, turned to fit it -------------------------- */

function mg3Fit() {
  if (!mg3Ready() || !MG3.hole) return;
  const cam = MG3.cam;
  const key = [MG3.holeKey, cam.aspect.toFixed(3), MG3.pad.top, MG3.pad.bottom].join('|');
  if (MG3.fitKey === key) return;
  MG3.fitKey = key;
  const h = MG3.hole, b = mgBounds(h);
  const pts = [];
  h.green.forEach(p => { pts.push([p[0], p[1], 0.4]); });
  [[b.x0 - 0.7, b.y0 - 0.7], [b.x1 + 0.7, b.y0 - 0.7], [b.x0 - 0.7, b.y1 + 0.7], [b.x1 + 0.7, b.y1 + 0.7]].forEach(p => pts.push([p[0], p[1], 0]));
  (h.mills || []).forEach(m => pts.push([m.x, m.y + 0.8, 4.2]));
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const V = MG3.T.Vector3;
  const test = (orient, d) => {
    // Up on the screen is away from the tee (portrait), or the tee on the left (landscape).
    const ux = orient === 'up' ? 0 : -1, uy = orient === 'up' ? 1 : 0;
    const back = d * MG3.tilt;
    cam.position.set(cx - ux * back, d, -(cy - uy * back));
    cam.up.set(0, 1, 0);
    cam.lookAt(cx, 0, -cy);
    cam.updateMatrixWorld();
    const v = new V();
    const top = 1 - MG3.pad.top * 2, bot = -1 + MG3.pad.bottom * 2, side = 1 - MG3.pad.side * 2;
    return pts.every(p => { v.set(p[0], p[2], -p[1]).project(cam); return Math.abs(v.x) < side && v.y < top && v.y > bot; });
  };
  const solve = (orient) => {
    let lo = 4, hi = 200;
    if (!test(orient, hi)) return hi;
    for (let k = 0; k < 28; k++) { const mid = (lo + hi) / 2; if (test(orient, mid)) hi = mid; else lo = mid; }
    return hi;
  };
  const dUp = solve('up'), dSide = solve('side');
  // Turn it only when that shows it clearly bigger.
  MG3.orient = dSide < dUp * 0.86 ? 'side' : 'up';
  const d = MG3.orient === 'up' ? dUp : dSide;
  test(MG3.orient, d);
  cam.near = Math.max(0.1, d * 0.1);
  cam.far = d * 6 + 120;
  cam.updateProjectionMatrix();
  MG3.scene.fog = new MG3.T.Fog(0xbfe3f2, d * 1.4, d * 3.4);
}

/* --- balls ------------------------------------------------------------------------------- */

function mgBallMat(color, ghost) {
  const THREE = MG3.T;
  return new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color), roughness: 0.36, clearcoat: 0.6, clearcoatRoughness: 0.2,
    normalMap: mgTex('dimples', 3, 3, false), normalScale: new THREE.Vector2(0.55, 0.55),
    transparent: !!ghost, opacity: ghost ? 0.42 : 1, depthWrite: !ghost
  });
}

/** A name over a ball: a pill in the ball's colour. */
function mgLabelSprite(text, color) {
  const THREE = MG3.T;
  const [c, g] = mgCanvas(256, 80);
  g.font = "700 40px 'Cairo', 'Baloo Bhaijaan 2', sans-serif";
  const w = Math.min(248, g.measureText(text).width + 44);
  g.fillStyle = 'rgba(20,16,30,.72)';
  const x = (256 - w) / 2;
  g.beginPath();
  if (g.roundRect) g.roundRect(x, 12, w, 56, 28); else g.rect(x, 12, w, 56);
  g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(x + 26, 40, 11, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.direction = MG_ARABIC.test(text) ? 'rtl' : 'ltr';
  g.fillText(text, 128 + 12, 42);
  const tx = new THREE.CanvasTexture(c);
  tx.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, depthTest: false, transparent: true }));
  s.scale.set(2.4, 0.75, 1);
  s.renderOrder = 10;
  return s;
}

/**
 * The balls on the hole: [{ id, at, color, ghost, hidden, label }]. A ball
 * rolling a putt keeps rolling, and so does one another ball's putt is
 * knocking about (drivenBy); one at rest is put where it lies.
 */
function mg3SyncBalls(list) {
  if (!mg3Ready()) return;
  const THREE = MG3.T;
  const want = new Set(list.map(b => b.id));
  MG3.balls.forEach((b, id) => { if (!want.has(id)) { mg3RemoveBall(b); MG3.balls.delete(id); } });
  list.forEach(o => {
    let b = MG3.balls.get(o.id);
    const look = o.color + '|' + (o.ghost ? 1 : 0) + '|' + (o.label || '');
    if (b && b.look !== look && !b.play && !b.drivenBy) { mg3RemoveBall(b); MG3.balls.delete(o.id); b = null; }
    if (!b) {
      const mesh = new THREE.Mesh(MG3.geo.ball, mgBallMat(o.color, o.ghost));
      mesh.castShadow = !o.ghost;
      mesh.renderOrder = o.ghost ? 2 : 3;
      MG3.scene.add(mesh);
      const label = o.label ? mgLabelSprite(o.label, o.color) : null;
      if (label) MG3.scene.add(label);
      b = { id: o.id, mesh, label, look, play: null, drivenBy: null, at: o.at.slice(), want: o.at.slice(), hidden: false, sink: 0 };
      MG3.balls.set(o.id, b);
    }
    b.hiddenWanted = !!o.hidden;
    b.want = o.at.slice();
    if (!b.play && !b.sink && !b.drivenBy) {
      b.at = o.at.slice();
      mg3PlaceBall(b, o.at[0], o.at[1]);
      b.hidden = b.hiddenWanted;
    }
    b.mesh.visible = !b.hidden;
    if (b.label) b.label.visible = !b.hidden;
  });
}
function mg3RemoveBall(b) {
  if (!MG3.scene) return;
  MG3.scene.remove(b.mesh);
  b.mesh.material.dispose();
  if (b.label) { MG3.scene.remove(b.label); b.label.material.map.dispose(); b.label.material.dispose(); }
}
/** A ball at (x, y): on the ground (a ramp, a hill), `dz` above it, or at height `z` when it flies. */
function mg3PlaceBall(b, x, y, dz, z) {
  const h = MG3.hole;
  const g = typeof z === 'number' ? z : (h ? golfHeight(h, x, y) : 0);
  b.mesh.position.set(x, g + GOLF.BALL_R + (dz || 0), -y);
  if (b.label) b.label.position.set(x, g + 1.05, -y);
}

/**
 * Rolls `sim` (golfStart) for ball `id`, already `off` seconds in (a putt
 * replayed from another phone starts where the hole's clock says it is). The
 * balls it may knock (sim.others) move with it. onEnd(sim) when every ball
 * has stopped, sunk or splashed; `returns` is where a wet ball goes back to
 * ({ main: [x, y], <id>: [x, y] }, from the putt's result).
 */
function mg3Play(id, sim, off, opts) {
  const b = MG3.balls.get(id);
  if (!b || !mg3Ready()) return false;
  const o = opts || {};
  const from = o.from || [sim.sx, sim.sy];
  // A roll this screen is still showing, of this ball or of one knocking it, ends at once (a screen that fell behind).
  const settle = (ball) => { if (ball && ball.play) mg3StepBall(ball, performance.now() + 1e7, 0); };
  settle(b);
  if (b.drivenBy) { settle(MG3.balls.get(b.drivenBy)); b.drivenBy = null; }
  (sim.others || []).forEach(ob => { const ball = MG3.balls.get(ob.id); if (ball) { settle(ball); if (ball.drivenBy && ball.drivenBy !== id) settle(MG3.balls.get(ball.drivenBy)); } });
  b.play = {
    sim, start: performance.now(), off: Math.max(0, off || 0), onEnd: o.onEnd || null,
    returns: Object.assign({ main: from }, o.returns || {}), loud: o.loud !== false, seen: {}, flaps: {}, bumped: {}
  };
  b.hidden = false; b.sink = 0;
  b.mesh.visible = true;
  if (b.label) b.label.visible = true;
  (sim.others || []).forEach(ob => {
    const ball = MG3.balls.get(ob.id);
    if (!ball) return;
    ball.drivenBy = id;
    ball.play = null; ball.sink = 0;
    ball.hidden = false; ball.mesh.visible = true;
    if (ball.label) ball.label.visible = true;
    ball.at = [ob.x, ob.y];
    mg3PlaceBall(ball, ob.x, ob.y);
  });
  mg3Start();
  return true;
}
function mg3Rolling(id) {
  if (id) { const b = MG3.balls.get(id); return !!(b && (b.play || b.sink || b.drivenBy)); }
  let any = false;
  MG3.balls.forEach(b => { if (b.play || b.sink || b.drivenBy) any = true; });
  return any;
}
/** Lets go of the balls a putt was knocking about: each back where the table says it lies. */
function mg3Release(id) {
  MG3.balls.forEach(ob => {
    if (ob.drivenBy !== id) return;
    ob.drivenBy = null; ob.sink = 0;
    ob.at = (ob.want || ob.at).slice();
    mg3PlaceBall(ob, ob.at[0], ob.at[1]);
    ob.hidden = !!ob.hiddenWanted;
    ob.mesh.visible = !ob.hidden;
    if (ob.label) ob.label.visible = !ob.hidden;
  });
}
/** Stops a roll where it is (a refused putt), and puts the ball at `at`. */
function mg3StopBall(id, at) {
  const b = MG3.balls.get(id);
  if (!b) return;
  if (b.play) mg3Release(id);
  b.play = null; b.sink = 0;
  if (at) { b.at = at.slice(); mg3PlaceBall(b, at[0], at[1]); }
}

const mgUp = { v: null, ax: null, q: null };
/** Turns a ball as it rolls at (vx, vy) for dt seconds. */
function mg3Roll(ball, vx, vy, dt) {
  const v = Math.hypot(vx, vy);
  if (v < 0.01 || !dt) return;
  const THREE = MG3.T;
  if (!mgUp.v) { mgUp.v = new THREE.Vector3(0, 1, 0); mgUp.ax = new THREE.Vector3(); mgUp.q = new THREE.Quaternion(); }
  mgUp.ax.set(vx, 0, -vy).normalize().cross(mgUp.v).negate();
  mgUp.q.setFromAxisAngle(mgUp.ax, v * dt / GOLF.BALL_R);
  ball.mesh.quaternion.premultiply(mgUp.q);
}

/**
 * One body of a roll on the screen: put where the rules have it, and what
 * happened to it since the last frame played - the sand's puff, the mud's
 * plop, a pad's whoosh, a flight and its landing, a portal, a knock, the cup
 * and the water.
 */
function mg3ShowBody(ball, body, key, p, now, dt) {
  const was = p.seen[key] || (p.seen[key] = { end: null, sand: false, mud: false, ice: false, pad: false, air: false, hits: body.hits, warps: body.warps, jumps: body.jumps, bumps: body.bumps, knocks: body.knocks });
  const loud = p.loud;
  if (was.end === 'cup' || was.end === 'water') return;
  if (body.end === 'cup') {
    was.end = 'cup';
    ball.sink = now;
    mg3PlaceBall(ball, MG3.hole.cup[0], MG3.hole.cup[1]);
    if (loud) mgSound('cup');
    if (MG3.flag) MG3.flag.jump = now;
    mg3Ring(MG3.hole.cup[0], MG3.hole.cup[1], 0xffffff);
    return;
  }
  if (body.end === 'water') {
    was.end = 'water';
    mg3Splash(body.x, body.y);
    if (loud) mgSound('splash');
    ball.hidden = true;
    ball.mesh.visible = false;
    if (ball.label) ball.label.visible = false;
    const back = (p.returns[key] || [body.sx, body.sy]).slice();
    setTimeout(() => {
      // Not if a new putt has taken this ball since.
      if (MG3.balls.get(ball.id) !== ball || (ball.play && ball.play !== p)) return;
      ball.hidden = ball.play || ball.drivenBy ? false : !!ball.hiddenWanted;
      ball.at = back.slice();
      mg3PlaceBall(ball, back[0], back[1]);
      ball.mesh.visible = !ball.hidden;
      if (ball.label) ball.label.visible = !ball.hidden;
      mg3Ring(back[0], back[1], 0x9fd3ff);
    }, 850);
    return;
  }
  // a portal: gone into one ring, out of the other
  if (body.warps > was.warps && body.warp) {
    const pt = (MG3.hole.portals || [])[body.warp.k];
    if (pt) { mg3Ring(pt.x, pt.y, 0xc77dff); mg3Ring(pt.ox, pt.oy, 0xffb347); mg3Particles(pt.ox, pt.oy, 0xffe0a8, 22, 1.2, 2.6, 0.1); }
    if (loud) mgSound('warp');
    ball.pop = now;
  }
  const pop = ball.pop && now - ball.pop < 260 ? (now - ball.pop) / 260 : 1;
  ball.mesh.scale.setScalar(pop < 1 ? 0.3 + 0.7 * pop : 1);
  mg3PlaceBall(ball, body.x, body.y, 0, body.air ? body.z : undefined);
  if (!body.air) mg3Roll(ball, body.vx, body.vy, dt);
  const v = Math.hypot(body.vx, body.vy);
  if (body.sand && !was.sand && loud) { mg3Puff(body.x, body.y); mgSound('sand'); }
  if (body.mud && !was.mud) { mg3Particles(body.x, body.y, 0x5a3a22, 18, 0.8, 1.6, 0.11); if (loud) mgSound('mud'); }
  if (body.ice && !was.ice && loud && v > 1) mgSound('ice');
  if (body.pad && !was.pad && loud) mgSound('whoosh');
  if (body.jumps > was.jumps && loud) mgSound('jump');
  if (was.air && !body.air) { mg3Particles(body.x, body.y, 0x9bd08a, 14, 0.9, 1.4, 0.08); if (loud) mgSound('land'); }
  if (body.knocks > was.knocks && loud) mgSound('knock');
  else if (body.bumps > was.bumps && loud) mgSound('bump');
  else if (body.hits > was.hits && loud && v > 1.2) mgSound('wall');
  Object.assign(was, { sand: body.sand, mud: body.mud, ice: body.ice, pad: body.pad, air: body.air, hits: body.hits, warps: body.warps, jumps: body.jumps, bumps: body.bumps, knocks: body.knocks });
}

function mg3StepBall(b, now, dt) {
  const p = b.play;
  const s = p.sim;
  const target = p.off + (now - p.start) / 1000;
  let n = 0;
  while (s.t < target && !s.done && n < 3600) { golfStep(s); n++; }
  if (!b.sink) mg3ShowBody(b, s, 'main', p, now, dt);
  (s.others || []).forEach(o => {
    const ball = MG3.balls.get(o.id);
    if (ball && ball.drivenBy === b.id && !ball.sink) mg3ShowBody(ball, o, o.id, p, now, dt);
  });
  // A gate swung, a bumper hit: the piece moves (and knocks) on the screen too.
  Object.keys(s.flaps).forEach(k => {
    if (p.flaps[k] === s.flaps[k]) return;
    const first = p.flaps[k] === undefined || s.flaps[k] - p.flaps[k] > 0.4;
    p.flaps[k] = s.flaps[k];
    MG3.movers.forEach(m => { if (m.kind === 'gate' && String(m.k) === k) m.last = s.flaps[k]; });
    if (first && p.loud) mgSound('flap');
  });
  Object.keys(s.bumped).forEach(k => {
    if (p.bumped[k] === s.bumped[k]) return;
    p.bumped[k] = s.bumped[k];
    MG3.movers.forEach(m => { if (m.kind === 'bumper' && String(m.k) === k) m.last = s.bumped[k]; });
  });
  if (!s.done) return;
  const onEnd = p.onEnd;
  b.play = null;
  if (!s.end || s.end === 'rest') b.at = [s.x, s.y];
  // the balls it knocked: settled where the rules left them
  (s.others || []).forEach(o => {
    const ball = MG3.balls.get(o.id);
    if (!ball || ball.drivenBy !== b.id) return;
    ball.drivenBy = null;
    if (o.end === 'rest') ball.at = [o.x, o.y];
    else if (o.end === 'cup' && !ball.sink) { ball.hidden = true; ball.mesh.visible = false; if (ball.label) ball.label.visible = false; }
  });
  if (onEnd) { try { onEnd(s); } catch (e) { console.warn(e); } }
}

/* --- effects ---------------------------------------------------------------------------- */

function mg3Ring(x, y, color) {
  if (!mg3Ready() || reducedMotion()) return;
  const THREE = MG3.T;
  const z = golfHeight(MG3.hole, x, y);
  const m = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, z + 0.03, -y);
  MG3.scene.add(m);
  const t0 = performance.now();
  MG3.fx.push({
    step(now) { const k = (now - t0) / 800; m.scale.setScalar(1 + k * 4); m.material.opacity = Math.max(0, 0.9 * (1 - k)); return k < 1; },
    remove() { MG3.scene && MG3.scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  });
}
function mg3Particles(x, y, color, count, spread, up, size) {
  if (!mg3Ready() || reducedMotion()) return;
  const THREE = MG3.T;
  const z = golfHeight(MG3.hole, x, y);
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3), vel = [];
  for (let i = 0; i < count; i++) {
    pos[i * 3] = x; pos[i * 3 + 1] = z + 0.1; pos[i * 3 + 2] = -y;
    const a = Math.random() * Math.PI * 2, s = spread * (0.4 + Math.random() * 0.6);
    vel.push([Math.cos(a) * s, up * (0.6 + Math.random() * 0.6), Math.sin(a) * s]);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: size || 0.12, transparent: true, opacity: 1, depthWrite: false }));
  MG3.scene.add(pts);
  let last = performance.now();
  const t0 = last;
  MG3.fx.push({
    step(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (let i = 0; i < count; i++) {
        vel[i][1] -= 9 * dt;
        pos[i * 3] += vel[i][0] * dt; pos[i * 3 + 1] = Math.max(z, pos[i * 3 + 1] + vel[i][1] * dt); pos[i * 3 + 2] += vel[i][2] * dt;
      }
      geo.attributes.position.needsUpdate = true;
      const k = (now - t0) / 900;
      pts.material.opacity = Math.max(0, 1 - k);
      return k < 1;
    },
    remove() { MG3.scene && MG3.scene.remove(pts); geo.dispose(); pts.material.dispose(); }
  });
}
function mg3Splash(x, y) { mg3Ring(x, y, 0xffffff); mg3Particles(x, y, 0xcfeaff, 40, 1.6, 4.2, 0.13); }
function mg3Puff(x, y) { mg3Particles(x, y, 0xe8cf9c, 26, 1.1, 1.8, 0.1); }

/* --- the pull: pull back from the ball, and let go ------------------------------------------ */

const MG_FULL_PULL = 7;   // course units of pull for a full-power putt
const mgRay = { ray: null, plane: null, hit: null };
function mg3Ground(e, height) {
  const THREE = MG3.T;
  if (!mgRay.ray) { mgRay.ray = new THREE.Raycaster(); mgRay.plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); mgRay.hit = new THREE.Vector3(); }
  const r = MG3.canvas.getBoundingClientRect();
  mgRay.ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, MG3.cam);
  mgRay.plane.constant = -(height || 0);
  return mgRay.ray.ray.intersectPlane(mgRay.plane, mgRay.hit) ? [mgRay.hit.x, -mgRay.hit.z] : null;
}
function mg3Down(e) {
  const inp = MG3.input;
  if (!inp || !MG3.hole || MG3.pull) return;
  if (!inp.can()) { if (inp.refused) inp.refused(); return; }
  const from = inp.from();
  const z = golfHeight(MG3.hole, from[0], from[1]);
  const g = mg3Ground(e, z);
  if (!g) return;
  MG3.pull = { id: e.pointerId, start: g, now: g, z };
  try { MG3.canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
}
function mg3Move(e) {
  if (!MG3.pull || MG3.pull.id !== e.pointerId) return;
  MG3.pull.now = mg3Ground(e, MG3.pull.z) || MG3.pull.now;
  mg3DrawAim();
}
function mg3Up(e) {
  if (!MG3.pull || MG3.pull.id !== e.pointerId) return;
  MG3.pull.now = mg3Ground(e, MG3.pull.z) || MG3.pull.now;
  const shot = mg3PullShot();
  mg3Cancel();
  if (shot && MG3.input && MG3.input.can()) MG3.input.onShot(shot);
}
function mg3Cancel() {
  MG3.pull = null;
  if (MG3.arrow) MG3.arrow.group.visible = false;
  if (MG3.band) MG3.band.visible = false;
  if (MG3.guide) MG3.guide.visible = false;
}
/** The putt the pull stands for: the direction away from the pull, its strength by how far. Null for a tap. */
function mg3PullShot() {
  const p = MG3.pull;
  if (!p) return null;
  const dx = p.start[0] - p.now[0], dy = p.start[1] - p.now[1];
  const len = Math.hypot(dx, dy);
  if (len < 0.3) return null;
  const k = Math.min(1, len / MG_FULL_PULL);
  return { dx: Math.round(dx / len * 1000), dy: Math.round(dy / len * 1000), power: Math.max(20, Math.round(k * 1000)) };
}
function mg3DrawAim() {
  const s = mg3PullShot();
  const A = MG3.arrow;
  if (!s || !MG3.input) { A.group.visible = false; MG3.band.visible = false; MG3.guide.visible = false; return; }
  const from = MG3.input.from();
  const z = MG3.pull.z + 0.03;
  const k = s.power / 1000;
  const L = 0.7 + k * 3.4;
  A.group.visible = true;
  A.group.position.set(from[0], z, -from[1]);
  A.group.rotation.y = -Math.atan2(s.dx, s.dy);
  A.shaft.scale.y = L;
  A.shaft.position.z = -L / 2 - 0.28;
  A.head.position.z = -L - 0.26;
  A.mat.color.setHSL(0.33 - k * 0.33, 0.9, 0.55);
  // the rubber band, back to where the finger is
  const back = Math.min(MG_FULL_PULL, Math.hypot(MG3.pull.start[0] - MG3.pull.now[0], MG3.pull.start[1] - MG3.pull.now[1]));
  const bx = from[0] - s.dx / 1000 * back, by = from[1] - s.dy / 1000 * back;
  const bp = MG3.band.geometry.attributes.position;
  bp.setXYZ(0, from[0], z, -from[1]); bp.setXYZ(1, bx, z, -by); bp.needsUpdate = true;
  MG3.band.computeLineDistances();
  MG3.band.visible = true;
  // the aim guide: the path the putt would take, dotted
  if (MG3.input.guide && MG3.input.guide()) {
    const others = MG3.input.others ? MG3.input.others() : null;
    const sim = golfStart(MG3.hole, from, Object.assign({ t0: Math.max(0, Math.round(MG3.clock())) }, s), others || undefined);
    const pts = MG3.guidePts;
    const up = () => (sim.air ? sim.z : golfHeight(MG3.hole, sim.x, sim.y)) + 0.06;
    let n = 0, steps = 0;
    while (!sim.done && !(sim.end && sim.end !== 'rest') && steps < 2400 && n < 399) {
      golfStep(sim); steps++;
      if (steps % 9 === 0 && !sim.end) { pts[n * 3] = sim.x; pts[n * 3 + 1] = up(); pts[n * 3 + 2] = -sim.y; n++; }
    }
    pts[n * 3] = sim.x; pts[n * 3 + 1] = up(); pts[n * 3 + 2] = -sim.y; n++;
    MG3.guide.geometry.setDrawRange(0, n);
    MG3.guide.geometry.attributes.position.needsUpdate = true;
    MG3.guide.geometry.computeBoundingSphere();
    MG3.guide.visible = true;
  } else MG3.guide.visible = false;
}

/* --- the loop ------------------------------------------------------------------------------ */

function mg3Loop(now) {
  MG3.raf = 0;
  if (!mg3Ready()) return;
  if (!MG3.canvas.isConnected) {
    // Off the page (another screen drew over it): let go of it after a moment.
    MG3.gone = MG3.gone || now;
    if (now - MG3.gone > 1500) { mg3Dispose(); return; }
    MG3.raf = requestAnimationFrame(mg3Loop);
    return;
  }
  MG3.gone = 0;
  if (document.hidden) return;
  const dt = Math.min(0.05, (now - MG3.last) / 1000);
  MG3.last = now;
  const busy = !!MG3.pull || mg3Rolling() || MG3.fx.length > 0 || MG3.movers.some(m => m.kind === 'mill' || m.kind === 'slider' || m.kind === 'spinner');
  // Nothing moving but the flag and the water: 30 frames a second is plenty.
  const gap = MG3.fpsCap ? 1000 / MG3.fpsCap : (busy ? 0 : 32);
  if (now - MG3.lastDraw < gap) { MG3.raf = requestAnimationFrame(mg3Loop); return; }
  mg3Tick(now, dt);
  mg3Draw();
  MG3.raf = requestAnimationFrame(mg3Loop);
}

function mg3Tick(now, dt) {
  const t = MG3.clock() / 1000;
  MG3.movers.forEach(mv => {
    if (mv.kind === 'mill') mv.hub.rotation.z = golfMillAngle(mv.m, t);
    else if (mv.kind === 'slider') { const c = golfSliderAt(mv.sl, t); mv.g.position.set(c[0], golfHeight(MG3.hole, c[0], c[1]), -c[1]); }
    else if (mv.kind === 'spinner') mv.g.rotation.y = golfSpinnerAngle(mv.sp, t);
    else if (mv.kind === 'deco-wheel') mv.g.rotation.z = -t * (mv.rate || 0.5);
    else if (mv.kind === 'deco-beam') mv.g.rotation.y = t * 0.6;
    // The arrows of a pad, a belt's ribs and rollers, a portal's swirl: always on the move, quietly.
    else if (mv.kind === 'pad') mv.tx.offset.y = -((t * mv.rate) % 1);
    else if (mv.kind === 'belt') { mv.tx.offset.y = -((t * mv.rate) % 1); mv.rollers.forEach(r => { r.rotation.y = -t * mv.spin; }); }
    else if (mv.kind === 'portal') { mv.discs[0].rotation.z = -t * 2.4; mv.discs[1].rotation.z = t * 1.6; }
    // A gate's flap swings open the way through and falls back; a bumper's cap flashes.
    else if (mv.kind === 'gate') {
      const age = t - mv.last;
      const open = age < 0 || age > 1.2 ? 0 : age < 0.12 ? age / 0.12 : 1 - (age - 0.12) / 1.08;
      mv.pivot.rotation.x = -mv.sign * open * open * 1.25;
    } else if (mv.kind === 'bumper') {
      const age = t - mv.last;
      const k = age >= 0 && age < 0.45 ? 1 - age / 0.45 : 0;
      mv.capMat.emissiveIntensity = 0.15 + k * 2.2;
      mv.g.scale.set(1 + k * 0.12, 1, 1 + k * 0.12);
    }
  });
  const calm = reducedMotion();
  const f = MG3.flag;
  if (f) {
    const pa = f.geo.attributes.position;
    if (!calm || !f.still) {
      for (let i = 0; i < pa.count; i++) { const x = f.base[i * 3]; pa.setZ(i, calm ? 0 : Math.sin(t * 5 + x * 4) * 0.08 * (x + 0.55)); }
      pa.needsUpdate = true;
      f.still = calm;
    }
    const j = f.jump ? (now - f.jump) / 700 : 1;
    f.group.position.y = golfHeight(MG3.hole, MG3.hole.cup[0], MG3.hole.cup[1]) + (j < 1 && !calm ? Math.sin(j * Math.PI) * 0.6 : 0);
  }
  MG3.waters.forEach(w => { w.offset.set(t * 0.02, t * 0.013); });
  MG3.bobbers.forEach(bb => { bb.g.position.y = bb.base + Math.sin(t * 1.4 + bb.ph) * 0.03; bb.g.rotation.z = Math.sin(t * 1.1 + bb.ph) * 0.03; });
  MG3.balls.forEach(b => {
    if (b.play) mg3StepBall(b, now, dt);
    if (b.sink) {
      const k = (now - b.sink) / 380;
      const h = MG3.hole;
      mg3PlaceBall(b, h.cup[0], h.cup[1], -Math.min(1, k) * 0.5);
      if (k >= 1) { b.sink = 0; b.hidden = true; b.mesh.visible = false; if (b.label) b.label.visible = false; }
    }
  });
  MG3.fx = MG3.fx.filter(f2 => { const keep = f2.step(now); if (!keep) f2.remove(); return keep; });
  if (MG3.onFrame) MG3.onFrame(now);
}

function mg3Draw(force) {
  if (!mg3Ready() || !MG3.hole) return;
  if (force) mg3Tick(performance.now(), 0);
  MG3.renderer.render(MG3.scene, MG3.cam);
  MG3.lastDraw = performance.now();
}

// Leaving the course's screens lets go of the renderer (and its memory).
onLeaveScreen((from, to) => {
  const golf = (v) => v === 'play-minigolf' || v === 'room-minigolf' || (v === 'room-tv' && Room.state && Room.state.game === 'minigolf');
  if (golf(from) && !golf(to)) {
    mg3Dispose();
    mgSoloStopTimers();
  }
});

/* ==========================================================================
   The screen round the course: the strip at the top, the banners, the name
   card of a new hole, the card between holes. Shared by solo, a room's
   phones and the TV.
   ========================================================================== */

function mgScreenHtml(o) {
  return `<div class="mg-screen ${o.tv ? 'mg-screen--tv' : ''}">
      <div class="mg-stage" data-mg-stage>
        <div class="mg-canvas-host" data-mg-canvas></div>
        <div class="mg-msg" data-mg-msg>${escapeHTML(mgT('mg_loading'))}</div>
        <div class="mg-hud" data-mg-hud></div>
        <div class="mg-namecard" data-mg-namecard aria-live="polite"></div>
        <div class="mg-banner" data-mg-banner aria-live="polite"></div>
        <div class="mg-hint" data-mg-hint></div>
        <div class="mg-players" data-mg-players></div>
        <div class="mg-hostrow" data-mg-host></div>
        <div class="mg-panel hidden" data-mg-panel></div>
      </div>
      ${o.tv ? '<aside class="mg-side" data-mg-side></aside>' : ''}
    </div>`;
}
const mgPart = (root, name) => root && root.querySelector('[data-mg-' + name + ']');
function mgSet(el, html) { if (el && el._mgHtml !== html) { el.innerHTML = html; el._mgHtml = html; } }

/** The 3D course in `root`'s stage, or a plain message when this device can't draw it. */
function mgMountIn(root, onReady) {
  const host = mgPart(root, 'canvas'), msg = mgPart(root, 'msg');
  if (!host) return;
  if (mg3Ready() && MG3.canvas.parentNode === host) { if (msg) msg.classList.add('hidden'); return; }
  if (typeof threeCanDraw === 'function' && !threeCanDraw()) { if (msg) { msg.textContent = mgT('mg_no_3d'); msg.classList.remove('hidden'); } return; }
  if (msg) { msg.textContent = mgT('mg_loading'); msg.classList.remove('hidden'); }
  mg3Mount(host).then(ok => {
    if (!host.isConnected) return;
    if (!ok) { if (msg) { msg.textContent = mgT('mg_no_3d'); msg.classList.remove('hidden'); } return; }
    if (msg) msg.classList.add('hidden');
    if (onReady) onReady();
  });
}

/** «المطلوب 3 · أقصى 6» ("Target 3 · max 6"): what the hole asks for and the most strokes it allows. */
const mgParMax = (h) => mgT('mg_par_max', { n: h.par, m: golfMaxOf(h) });

/** The strip at the top: the hole, its par and most strokes, the strokes; "last stroke" on the final one; `extra` on the end (a clock, whose turn). */
function mgHudHtml(o) {
  const chips = [
    `<span class="mg-chip mg-chip--hole">⛳ <b>${escapeHTML(mgT('mg_hole', { n: o.hole + 1, m: o.holes }))}</b><span class="mg-chip__name">${escapeHTML(mgHoleName(o.h))}</span></span>`,
    `<span class="mg-chip mg-chip--lvl mg-lvl--${o.h.lvl}">${escapeHTML(mgT('mg_level_' + GOLF_LEVELS[o.h.lvl - 1]))}</span>`,
    `<span class="mg-chip">${escapeHTML(mgParMax(o.h))}</span>`
  ];
  if (typeof o.strokes === 'number') chips.push(`<span class="mg-chip mg-chip--strokes">${escapeHTML(mgT('mg_strokes', { n: o.strokes }))}</span>`);
  if (o.last) chips.push(`<span class="mg-chip mg-chip--last">${escapeHTML(mgT('mg_last_stroke'))}</span>`);
  if (typeof o.vsPar === 'number') chips.push(`<span class="mg-chip mg-chip--par">${escapeHTML(mgDelta(o.vsPar))}</span>`);
  if (o.extra) chips.push(o.extra);
  return `<div class="mg-hud__row">${chips.join('')}</div>`;
}

let mgBannerTimer = 0;
function mgBanner(root, text, sub, kind) {
  const el = mgPart(root, 'banner');
  if (!el) return;
  // "+1" and "· 7" held left to right inside an Arabic line, or they read "1+".
  const iso = (x) => escapeHTML(x).replace(/([+−-]?\d+)/g, MG_LRI + '$1' + MG_PDI);
  el.innerHTML = `<span class="mg-banner__text">${iso(text)}</span>${sub ? `<small>${iso(sub)}</small>` : ''}`;
  el.className = 'mg-banner is-on ' + (kind ? 'mg-banner--' + kind : '');
  clearTimeout(mgBannerTimer);
  mgBannerTimer = setTimeout(() => { el.classList.remove('is-on'); }, kind === 'ace' ? 2600 : 1800);
}

/** A new hole's card flies in, rests a beat, and flies up to the strip. Once per hole. */
function mgNameCard(root, hole, h, key) {
  const el = mgPart(root, 'namecard');
  if (!el) return;
  if (!motionFirst(['mg-name', key].join('|'))) return;
  el.innerHTML = `<span class="mg-namecard__n">${escapeHTML(mgT('mg_hole_big', { n: hole + 1 }))}</span>
      <span class="mg-namecard__name">${escapeHTML(mgHoleName(h))}</span>
      <span class="mg-namecard__par"><span class="mg-lvl mg-lvl--${h.lvl}">${escapeHTML(mgT('mg_level_' + GOLF_LEVELS[h.lvl - 1]))}</span> ${escapeHTML(mgParMax(h))}</span>`;
  el.classList.remove('is-on');
  void el.offsetWidth;
  el.classList.add('is-on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('is-on'), 2300);
}

/** A scorecard: every hole of the game so far, what each asks for, each row's strokes and total. `course` is the holes, in order. */
function mgCardHtml(rows, course, o) {
  const opt = o || {};
  const holes = course.length;
  const upto = Math.max(1, opt.upto || holes);
  const cell = (v, i) => {
    if (typeof v !== 'number') return '<td class="mg-card__c">·</td>';
    const d = v - course[i].par;
    return `<td class="mg-card__c ${v === 1 ? 'is-ace' : d < 0 ? 'is-under' : d > 0 ? 'is-over' : ''}">${v}</td>`;
  };
  // Up to nine holes, one table; past nine, two, as on a real card: the first nine
  // with their own sum, then the rest with the total.
  const table = (from, to, last) => {
    const cols = [];
    for (let i = from; i < to; i++) cols.push(i);
    const span = last ? upto : to;
    let par = 0;
    for (let i = last ? 0 : from; i < span; i++) par += course[i].par;
    return `<table>
      <thead><tr><th class="mg-card__who"></th>${cols.map(i => `<th>${i + 1}</th>`).join('')}<th class="mg-card__tot">${last ? 'Σ' : escapeHTML(mgT('mg_out'))}</th></tr>
        <tr class="mg-card__par"><th class="mg-card__who">${escapeHTML(mgT('mg_target_row'))}</th>${cols.map(i => `<td>${course[i].par}</td>`).join('')}<td class="mg-card__tot">${par}</td></tr></thead>
      <tbody>${rows.map(r => {
        let total = 0, played = 0;
        for (let i = last ? 0 : from; i < span; i++) if (typeof r.card[i] === 'number') { total += r.card[i]; played += course[i].par; }
        const counted = last && typeof opt.countHole === 'number' && typeof r.card[opt.countHole] === 'number';
        const tot = last ? `<b data-mg-from="${counted ? total - r.card[opt.countHole] : total}" data-mg-to="${total}">${total}</b><small>${escapeHTML(played ? mgDelta(total - played) : '')}</small>` : `<b>${total}</b>`;
        return `<tr class="${r.me ? 'is-me' : ''}"><th class="mg-card__who"><span class="mg-dot" style="--c:${r.color}"></span><bdi>${escapeHTML(r.name)}</bdi></th>
          ${cols.map(i => cell(r.card[i], i)).join('')}<td class="mg-card__tot">${tot}</td></tr>`;
      }).join('')}</tbody>
    </table>`;
  };
  return upto > 9 ? `<div class="mg-card mg-card--two">${table(0, 9, false) + table(9, upto, true)}</div>` : `<div class="mg-card">${table(0, upto, true)}</div>`;
}

/** A card's totals count up from what they were before the hole just played (once per hole). */
function mgCountTotals(root, key) {
  if (!root || !motionFirst(['mg-count', key].join('|')) || typeof countUp !== 'function') return;
  root.querySelectorAll('[data-mg-from]').forEach(el => {
    const a = Number(el.dataset.mgFrom), b = Number(el.dataset.mgTo);
    if (b > a) countUp(el, a, b);
  });
}

/* ==========================================================================
   SOLO
   ========================================================================== */

function mgSoloState() {
  if (!appState.minigolf) appState.minigolf = { holes: 6, level: 'mix', guide: false, phase: 'none' };
  const s = appState.minigolf;
  if (GOLF_HOLE_COUNTS.indexOf(Number(s.holes)) === -1) s.holes = 6;
  if (GOLF_LEVELS.indexOf(s.level) === -1) s.level = 'mix';
  return s;
}
/** The best is kept for each length and each kind: 'mix:6', 'hard:9'… */
const mgBestKey = (level, holes) => (GOLF_LEVELS.indexOf(level) !== -1 ? level : 'mix') + ':' + holes;
/** The solo game's holes, as objects (a game saved before holes were drawn: the first ones). */
function mgSoloCourse(s) {
  const g = s.game || {};
  if (!Array.isArray(g.course)) g.course = GOLF_HOLES.slice(0, Number(g.holes || s.holes) || 6).map(h => h.id);
  return g.course.map(golfHoleById);
}
const mgSoloLive = (s) => s.phase === 'play' || s.phase === 'holeDone';
const mgSoloTimers = [];
function mgSoloStopTimers() { while (mgSoloTimers.length) clearTimeout(mgSoloTimers.pop()); }

function setupMiniGolf() {
  setView('setup-minigolf');
  paintMiniGolfSetup();
}

function paintMiniGolfSetup() {
  const s = mgSoloState();
  document.querySelectorAll('#mg-holes .segmented__item').forEach(b => b.classList.toggle('is-active', Number(b.dataset.value) === Number(s.holes)));
  document.querySelectorAll('#mg-level .segmented__item').forEach(b => b.classList.toggle('is-active', b.dataset.value === s.level));
  const lh = document.getElementById('mg-level-hint');
  if (lh) lh.textContent = mgT('mg_level_hint_' + s.level);
  const guide = document.getElementById('mg-guide');
  if (guide) guide.checked = !!s.guide;
  const best = soloBest('minigolf', mgBestKey(s.level, s.holes));
  const line = document.getElementById('mg-best');
  const hh = mgHolesText(s.holes) + ' · ' + mgLevelText(s.level);
  if (line) line.textContent = best ? '🏆 ' + mgT('mg_best', { hh, n: best.total, d: mgDelta(best.total - best.par) }) : mgT('mg_no_best', { hh });
  const cont = document.getElementById('minigolf-continue');
  if (cont) cont.classList.toggle('hidden', !mgSoloLive(s));
}

function setMiniGolfOption(key, value) {
  const s = mgSoloState();
  if (key === 'holes' && GOLF_HOLE_COUNTS.indexOf(Number(value)) !== -1) s.holes = Number(value);
  if (key === 'level' && GOLF_LEVELS.indexOf(value) !== -1) s.level = value;
  if (key === 'guide') s.guide = !!value;
  saveToLocal();
  haptic('light');
  paintMiniGolfSetup();
}

function startMiniGolf() {
  const s = mgSoloState();
  soloNewGame('minigolf');
  mgSoloStopTimers();
  // The holes, drawn from the kind chosen; the ones this phone played lately wait until the kind has gone round.
  const course = golfDealCourse(s.holes, s.level, (ids, n, lvl) => freshPick('golf_' + lvl, ids, n));
  Object.assign(s, { phase: 'play', game: { holes: course.length, level: s.level, course, guide: !!s.guide }, hole: 0, n: 0, at: golfHoleById(course[0]).tee.slice(), card: new Array(course.length).fill(null), startedAt: Date.now(), last: null, deal: Date.now().toString(36) });
  saveToLocal();
  setView('play-minigolf');
  mgSoloPaint();
}

function mgContinue() {
  setView('play-minigolf');
  mgSoloPaint();
}

function restoreMiniGolf() {
  const s = mgSoloState();
  if (!mgSoloLive(s) && s.phase !== 'done') return false;
  mgSoloPaint();
  return true;
}

/** The hole's clock in ms (the moving pieces), from when the hole started on this phone. */
const mgSoloClock = () => { const s = mgSoloState(); return Math.min(3600000, Math.max(0, Date.now() - (s.startedAt || Date.now()))); };

function mgSoloRoot() { return document.getElementById('minigolf-stage'); }

function mgSoloPaint() {
  const s = mgSoloState();
  const root = mgSoloRoot();
  if (!root) return;
  if (!root.querySelector('.mg-screen')) root.innerHTML = mgScreenHtml({});
  const g = s.game || { holes: s.holes, guide: s.guide };
  const course = mgSoloCourse(s);
  const hole = Math.min(s.hole || 0, course.length - 1);
  const h = course[hole];
  MG3.pad = { top: 0.1, bottom: 0.05, side: 0.04 };
  const ready = () => {
    if (!mg3Ready()) return;
    MG3.clock = mgSoloClock;
    if (mg3SetHole(h, ['solo', s.deal, hole].join('|')) && s.phase === 'play' && !s.n) mgNameCard(root, hole, h, ['solo', s.deal, hole].join('|'));
    const rolling = mg3Rolling('me');
    mg3SyncBalls([{ id: 'me', at: s.at, color: MG_COLORS[0], hidden: s.phase !== 'play' && !rolling }]);
    MG3.input = {
      can: () => s.phase === 'play' && !mg3Rolling('me') && appState.currentView === 'play-minigolf',
      from: () => s.at,
      guide: () => !!g.guide,
      onShot: mgSoloPutt
    };
  };
  mgMountIn(root, () => { ready(); mgSoloChrome(); });
  ready();
  mgSoloChrome();
}

/** The strip, the hint and (between holes) the card. */
function mgSoloChrome() {
  const s = mgSoloState();
  const root = mgSoloRoot();
  if (!root) return;
  const g = s.game || { holes: s.holes };
  const course = mgSoloCourse(s);
  const hole = s.hole || 0;
  let played = 0, total = 0;
  (s.card || []).forEach((v, i) => { if (typeof v === 'number' && course[i]) { total += v; played += course[i].par; } });
  const max = golfMaxOf(course[hole]);
  mgSet(mgPart(root, 'hud'), mgHudHtml({ hole, h: course[hole], holes: course.length, strokes: s.n || 0, vsPar: played ? total - played : undefined, last: s.phase === 'play' && (s.n || 0) === max - 1 }));
  const hint = mgPart(root, 'hint');
  if (hint) {
    hint.textContent = s.phase === 'play' && !mg3Rolling('me') ? mgT('mg_pull_hint') : '';
    hint.classList.toggle('is-on', !!hint.textContent);
  }
  const panel = mgPart(root, 'panel');
  const showCard = (s.phase === 'holeDone' || s.phase === 'done') && !mg3Rolling('me');
  if (panel) {
    panel.classList.toggle('hidden', !showCard);
    if (showCard) {
      const last = s.card[hole];
      const word = typeof last === 'number' ? (last > max && s.picked ? mgT('mg_picked', { n: max + 1 }) : mgWordOf(last, course[hole].par)) : '';
      const done = s.phase === 'done';
      mgSet(panel, `<div class="mg-panel__card card">
          <p class="eyebrow">${escapeHTML(mgT('mg_hole_big', { n: hole + 1 }))} · ${escapeHTML(mgHoleName(course[hole]))}</p>
          <p class="mg-panel__word">${escapeHTML(word)}</p>
          ${mgCardHtml([{ name: mgT('mg_you'), color: MG_COLORS[0], card: s.card, me: true }], course, { upto: course.length, countHole: hole })}
          <div class="btn-stack">
            ${done
              ? `<button type="button" class="btn btn--primary btn--lg" onclick="mgSoloShowResult()">${escapeHTML(mgT('mg_total'))} 🏁</button>
                 <button type="button" class="btn btn--ghost" onclick="startMiniGolf()">${escapeHTML(mgT('mg_again'))}</button>`
              : `<button type="button" class="btn btn--primary btn--lg" onclick="mgSoloNext()">${escapeHTML(mgT('mg_next_hole'))} ⛳</button>`}
          </div>
        </div>`);
      mgCountTotals(panel, ['solo', s.deal, hole].join('|'));
    }
  }
}

function mgSoloPutt(shot) {
  const s = mgSoloState();
  if (s.phase !== 'play' || mg3Rolling('me')) return;
  const hole = s.hole;
  const course = mgSoloCourse(s);
  const h = course[hole];
  const full = golfCleanShot(Object.assign({}, shot, { t0: Math.round(mgSoloClock()) }));
  const from = s.at.slice();
  const r = golfPutt(h, from, full);
  // The result is known now: kept at once, so a reload mid-roll comes back to where it ends.
  s.n += r.strokes;
  s.at = r.at.slice();
  s.picked = false;
  const max = golfMaxOf(h);
  if (r.end === 'cup') { s.card[hole] = s.n; s.phase = 'holeDone'; }
  else if (s.n >= max) { s.card[hole] = max + 1; s.n = max + 1; s.picked = true; s.phase = 'holeDone'; }
  if (s.phase === 'holeDone' && hole + 1 >= course.length) s.phase = 'done';
  saveToLocal();
  mgSound('putt');
  haptic('medium');
  const root = mgSoloRoot();
  mg3Play('me', golfStart(h, from, full), 0, {
    from, returns: { main: r.at },
    onEnd: (sim) => {
      if (appState.currentView !== 'play-minigolf') return;
      if (sim.end === 'water') mgBanner(root, mgT('mg_water'), '', 'water');
      else if (sim.end === 'cup') {
        const n = s.card[hole];
        mgBanner(root, mgWordOf(n, h.par), mgInN(n), n === 1 ? 'ace' : (n < h.par ? 'good' : ''));
        if (n <= h.par) { playSound('success'); if (n === 1 && typeof playFx === 'function') playFx('applause'); }
        if (n < h.par && typeof confetti === 'function') confetti({ particleCount: n === 1 ? 180 : 90, spread: 80, origin: { y: 0.55 } });
        haptic('double');
      } else if (s.picked) mgBanner(root, mgT('mg_picked', { n: golfMaxOf(h) + 1 }), '', 'picked');
      if (s.phase === 'holeDone' || s.phase === 'done') {
        mgSoloTimers.push(setTimeout(() => {
          if (appState.currentView !== 'play-minigolf') return;
          mgSoloChrome();
          if (s.phase === 'done') mgSoloShowResult();
        }, 1500));
      } else mgSoloChrome();
    }
  });
  mgSoloChrome();
}

function mgSoloNext() {
  const s = mgSoloState();
  if (s.phase !== 'holeDone') return;
  s.hole++;
  s.n = 0;
  s.at = mgSoloCourse(s)[s.hole].tee.slice();
  s.startedAt = Date.now();
  s.phase = 'play';
  s.picked = false;
  saveToLocal();
  haptic('light');
  mgSoloPaint();
}

function mgSoloShowResult() {
  const s = mgSoloState();
  const g = s.game || { holes: s.holes };
  const course = mgSoloCourse(s);
  const total = (s.card || []).reduce((a, v) => a + (Number(v) || 0), 0);
  const par = golfParOf(course);
  const shown = s.resultShown === s.deal;
  const key = mgBestKey(g.level, course.length);
  const hh = mgHolesText(course.length) + ' · ' + mgLevelText(g.level);
  const rec = shown ? { record: false, prev: soloBest('minigolf', key) } : soloRecord('minigolf', key, { total, par, at: Date.now() }, (a, b) => a.total < b.total);
  s.resultShown = s.deal;
  saveToLocal();
  const lines = [escapeHTML(mgT('mg_vs_par', { d: mgDelta(total - par), p: par }))];
  if (rec.record) lines.push('🏆 ' + escapeHTML(mgT('solo_new_best')));
  else if (rec.prev) lines.push(escapeHTML(mgT('mg_best', { hh, n: rec.prev.total, d: mgDelta(rec.prev.total - rec.prev.par) })));
  soloResult({
    icon: '⛳', title: mgT('mg_result_title', { hh: mgHolesText(course.length) }), value: total, valueLabel: mgT('mg_total_label'), lines,
    win: rec.record || total <= par,
    quiet: shown,
    share: mgT('mg_share', { n: total, hh, d: mgDelta(total - par) }) + '\n' + mgCardText(s.card, course.length),
    again: startMiniGolf, againLabel: '⛳ ' + mgT('mg_again'),
    exit: setupMiniGolf
  });
}

/** A round as a line of numbers, for the share text: 2 3 3 | 4 2 3. */
function mgCardText(card, holes) {
  const out = [];
  for (let i = 0; i < holes; i++) out.push(typeof card[i] === 'number' ? String(card[i]) : '·');
  return MG_LRI + out.join(' ') + MG_PDI;
}

if (typeof soloRegister === 'function') {
  soloRegister('minigolf', {
    setup: 'setup-minigolf', play: 'play-minigolf',
    paintSetup: paintMiniGolfSetup, restore: restoreMiniGolf,
    state: () => mgSoloState(),
    repaint: () => { const root = mgSoloRoot(); if (root) { root.innerHTML = ''; mgSoloPaint(); } }
  });
}

/* ==========================================================================
   IN A ROOM, and on the TV
   ========================================================================== */

const mgRoom = {
  key: '', seen: {}, offset: null, pending: null, words: {}, clock: null, clockKey: '',
  since: {}, redraw: 0, hostKey: ''
};
const mgRoomOpts = () => recallOptions('minigolfRoom', { mode: 'together', holes: 6, level: 'mix', guide: false, clock: 0 });
/** The room game's holes, as objects, and the one being played. */
const mgRoomHoles = (s) => mgCourseOf(s.holes, (s.settings || {}).holes);
const mgRoomHole = (s) => mgRoomHoles(s)[s.hole] || GOLF_HOLES[0];
function setMgRoomOpt(key, value) {
  rememberOptions('minigolfRoom', { [key]: value });
  duelLobbyRedraw();
}

/** The server's clock, as this phone's: the smallest gap seen between a change and its arrival. */
function mgRoomSeeStamp(s) {
  if (!s || !s.stamp) return;
  const gap = Date.now() - s.stamp;
  if (mgRoom.offset === null || gap < mgRoom.offset) mgRoom.offset = gap;
}
const mgServerNow = () => Date.now() - (mgRoom.offset || 0);
/** The hole's clock in ms, the same on every phone and the TV (the windmill, the gate, the waterwheel). */
function mgRoomClock() {
  const s = ((Room.state || {}).shared) || {};
  return Math.max(0, Math.min(3600000, mgServerNow() - (s.startedAt || mgServerNow())));
}

const mgRoomColor = (s, pid) => MG_COLORS[Math.max(0, (s.roster || s.order || []).indexOf(pid)) % MG_COLORS.length];
const mgName = (state, pid) => ((state.players || []).find(p => p.id === pid) || {}).name || '';

/** Can this phone putt now: its ball is out, it's its turn, and nothing it waits for is rolling. */
function mgRoomCanPutt(state) {
  const s = state.shared || {};
  if (state.youAreScreen || s.phase !== 'play' || !s.balls) return false;
  const b = s.balls[Room.me];
  if (!b || b.done || mgRoom.pending) return false;
  if (s.settings.mode === 'turns') return s.turn === Room.me && !mg3Rolling();
  return !mg3Rolling(Room.me);
}

/**
 * The balls a putt by `pid` can hit - the very list the server makes
 * (mgOthers in RoomMiniGolf.js): in turns, every ball lying on the course,
 * hit from the tee and not yet in, in the table's order. All at once, none.
 */
function mgRoomOthers(s, pid) {
  if (!s || !s.settings || s.settings.mode !== 'turns') return null;
  return (s.order || []).filter(id => {
    const b = (s.balls || {})[id];
    return id !== pid && b && !b.done && b.n > 0;
  }).map(id => ({ id, at: s.balls[id].at.slice() }));
}
/** Where each wet ball of a putt goes back to, from its result: { main, <id> }. */
function mgReturns(end, at, moved) {
  const out = {};
  if (end === 'water' && at) out.main = at.slice();
  (moved || []).forEach(m => { if (m.end === 'water') out[m.id] = m.at.slice(); });
  return out;
}

function mgRoomPutt(shot) {
  const state = Room.state;
  if (!state || state.game !== 'minigolf' || !mgRoomCanPutt(state)) return;
  const s = state.shared;
  const b = s.balls[Room.me];
  const h = mgRoomHole(s);
  const full = golfCleanShot(Object.assign({}, shot, { t0: Math.round(mgRoomClock()) }));
  const from = b.at.slice();
  const others = mgRoomOthers(s, Room.me);
  // The server will come to the same result from the same numbers; this phone knows it now.
  const r = others ? golfPutt(h, from, full, others) : golfPutt(h, from, full);
  mgRoom.pending = Object.assign({ n: b.n, hole: s.hole, key: state.code + '|' + s.dealId }, full);
  // The ball rolls as the finger lifts; the server's putt, when it comes, is the same roll.
  mgSound('putt');
  haptic('medium');
  mg3Play(Room.me, golfStart(h, from, full, others || undefined), 0, { from, returns: mgReturns(r.end, r.at, r.moved), onEnd: (sim) => mgRoomEnded(Room.me, sim) });
  mgRoomChrome(state, document.getElementById('view-room-minigolf'), false);
  const sentN = b.n;
  Room.act('putt', Object.assign({ hole: s.hole, n: b.n }, full)).then(() => {
    mgRoom.pending = null;
    // A putt the server dropped (the clock putted for us a moment before, say):
    // the roll on this screen never happened, so the ball goes back where the server has it.
    const st = Room.state;
    const sh = st && st.shared && st.shared.shots && st.shared.shots[Room.me];
    const mine = st && st.shared && st.shared.balls && st.shared.balls[Room.me];
    if (mine && (!sh || sh.n - sh.add !== sentN) && mg3Rolling(Room.me)) mg3StopBall(Room.me, mine.at);
  }).catch(err => {
    mgRoom.pending = null;
    const st = Room.state;
    const mine = st && st.shared && st.shared.balls && st.shared.balls[Room.me];
    mg3StopBall(Room.me, mine ? mine.at : from);
    showToast((err && err.message) || '', 'error');
    if (st) routeRoomState(st);
  });
}

/** A ball of this room stopped rolling on this screen: the banner, and whatever waited for it. */
function mgRoomEnded(pid, sim) {
  const state = Room.state;
  if (!state || state.game !== 'minigolf') return;
  const s = state.shared || {};
  const tv = !!state.youAreScreen;
  const root = document.getElementById(tv ? 'view-room-tv' : 'view-room-minigolf');
  const sh = (s.shots || {})[pid];
  const mine = pid === Room.me && !tv;
  const h = mgRoomHole(s);
  if (sim.end === 'water') { if (mine || tv) mgBanner(root, mine ? mgT('mg_water') : mgT('mg_someone', { name: mgName(state, pid), word: mgT('mg_water') }), '', 'water'); }
  else if (sim.end === 'cup' && sh) {
    const n = sh.n;
    const word = mgWordOf(n, h.par);
    if (mine || tv || n <= h.par) mgBanner(root, mine ? word : mgT('mg_someone', { name: mgName(state, pid), word }), mine ? mgInN(n) : '', n === 1 ? 'ace' : (n < h.par ? 'good' : ''));
    if ((mine || tv) && n <= h.par) { playSound('success'); if (n === 1 && typeof playFx === 'function') playFx('applause'); }
    if (mine && n < h.par && typeof confetti === 'function') confetti({ particleCount: n === 1 ? 180 : 90, spread: 80, origin: { y: 0.55 } });
    if (mine) haptic('double');
  } else if (sh && sh.n > golfMaxOf(h) && mine) mgBanner(root, mgT('mg_picked', { n: golfMaxOf(h) + 1 }), '', 'picked');
  // A ball this putt knocked in, or into the water: said on its own phone and the TV.
  (sim.others || []).forEach(o => {
    if (o.end !== 'cup' && o.end !== 'water') return;
    const itsMine = o.id === Room.me && !tv;
    if (!itsMine && !tv) return;
    const who = mgName(state, o.id), by = mgName(state, pid);
    const text = o.end === 'cup' ? (itsMine ? mgT('mg_knocked_in_you', { by }) : mgT('mg_knocked_in', { name: who, by }))
      : (itsMine ? mgT('mg_knocked_wet_you', { by }) : mgT('mg_knocked_wet', { name: who }));
    setTimeout(() => mgBanner(root, text, '', o.end === 'cup' ? 'good' : 'water'), 1900);
    if (o.end === 'cup' && itsMine) { playSound('success'); haptic('double'); }
  });
  // A card or the end may have been waiting for this ball.
  clearTimeout(mgRoom.redraw);
  mgRoom.redraw = setTimeout(() => { if (Room.state && Room.state.game === 'minigolf') routeRoomState(Room.state); }, 1200);
}

/** Each putt on the table that this screen hasn't rolled yet: rolled from where the hole's clock is now. */
function mgRoomReplays(state, tv) {
  const s = state.shared;
  const h = mgRoomHole(s);
  const key = state.code + '|' + s.dealId + '|' + s.hole;
  if (mgRoom.key !== key) { mgRoom.key = key; mgRoom.seen = {}; mgRoom.fresh = true; }
  const first = mgRoom.fresh;
  mgRoom.fresh = false;
  // In the order they were made: a putt that knocked a ball is rolled before that ball's own next one.
  Object.keys(s.shots || {}).map(pid => [pid, s.shots[pid]]).sort((a, b) => ((a[1] || {}).seq || 0) - ((b[1] || {}).seq || 0)).forEach(([pid, sh]) => {
    if (!sh || (mgRoom.seen[pid] || 0) >= sh.seq) return;
    mgRoom.seen[pid] = sh.seq;
    const p = mgRoom.pending;
    if (pid === Room.me && !tv && p && p.n === sh.n - sh.add && p.t0 === sh.t0 && p.dx === sh.dx && p.dy === sh.dy && p.power === sh.power && mg3Rolling(pid)) return;
    const off = (mgRoomClock() - sh.t0) / 1000;
    // Too late to watch (a reload, a phone that slept): every ball is simply where it lies.
    if (first || off * 1000 > sh.dur + 300) { mg3StopBall(pid, ((s.balls || {})[pid] || {}).at || sh.at); return; }
    const loud = pid === Room.me ? !tv : (tv || !roomHasScreen());
    mg3Play(pid, golfStart(h, sh.from, sh, sh.others || undefined), off, { from: sh.from, returns: mgReturns(sh.end, sh.at, sh.moved), loud, onEnd: (sim) => mgRoomEnded(pid, sim) });
  });
}

/** Everything on the course for this state: the hole, the balls, the rolls, the control. */
function mgRoomCourse(state, root, tv) {
  if (!mg3Ready()) return;
  const s = state.shared;
  const h = mgRoomHole(s);
  MG3.clock = mgRoomClock;
  const holeKey = [state.code, s.dealId, s.hole].join('|');
  if (mg3SetHole(h, holeKey)) {
    MG3.balls.forEach(b => mg3RemoveBall(b));
    MG3.balls.clear();
  }
  const turns = s.settings.mode === 'turns';
  const balls = (s.order || []).map(pid => {
    const b = s.balls[pid] || {};
    const me = pid === Room.me && !tv;
    // In turns a ball comes onto the course when it is hit from the tee: till then only the one up waits there.
    const offCourse = turns && !b.n && s.turn !== pid;
    return { id: pid, at: b.at || h.tee, color: mgRoomColor(s, pid), ghost: !tv && !me && !turns, hidden: !!b.done || offCourse, label: me ? '' : mgName(state, pid) };
  });
  mg3SyncBalls(balls);
  mgRoomReplays(state, tv);
  MG3.input = tv ? null : {
    can: () => !!Room.state && mgRoomCanPutt(Room.state) && appState.currentView === 'room-minigolf',
    from: () => { const st = Room.state; const b = st && st.shared.balls[Room.me]; return b ? b.at : h.tee; },
    guide: () => !!((Room.state || {}).shared || {}).settings && !!Room.state.shared.settings.guide,
    others: () => mgRoomOthers((Room.state || {}).shared, Room.me),
    onShot: mgRoomPutt
  };
  MG3.onFrame = null;
}


/** The host's buttons: putt for a phone that went quiet (away, or its ball waiting 30 seconds). */
function mgHostButtons(state) {
  const s = state.shared || {};
  if (!state.youAreHost || s.phase !== 'play') return [];
  const out = [];
  (s.order || []).forEach(pid => {
    const b = s.balls[pid];
    if (!b || b.done || pid === Room.me) return;
    if (s.settings.mode === 'turns' && s.turn !== pid) return;
    const p = (state.players || []).find(x => x.id === pid);
    const waiting = mgServerNow() - (b.restAt || 0);
    if (!p || !p.online || waiting > 30000) out.push(['⛳ ' + mgT('mg_play_for', { name: p ? p.name : '' }), `roomAct('playFor', { target: '${jsStringAttr(pid)}', hole: ${Number(s.hole) || 0}, n: ${Number(b.n) || 0} })`]);
  });
  return out.slice(0, 3);
}

function mgStopClock() {
  if (mgRoom.clock) mgRoom.clock.stop();
  mgRoom.clock = null;
  mgRoom.clockKey = '';
}
/** The putt clock (when the host set one): this phone's ball, or the player up in turns; the TV the player up. */
function mgTickClock(state) {
  const s = state.shared || {};
  let due = null;
  if (s.phase === 'play' && s.settings && s.settings.clock) {
    const pid = s.settings.mode === 'turns' ? s.turn : (state.youAreScreen ? null : Room.me);
    const b = pid && s.balls[pid];
    if (b && !b.done && b.clockAt) due = b.clockAt + (mgRoom.offset || 0);
  }
  const paint = () => {
    const left = due ? Math.max(0, Math.ceil((due - Date.now()) / 1000)) : 0;
    document.querySelectorAll('[data-mg-clock]').forEach(el => {
      el.textContent = '⏱️ ' + left;
      el.classList.toggle('is-low', left <= 5);
    });
    return left;
  };
  if (!due) { mgStopClock(); return; }
  paint();
  if (mgRoom.clockKey === String(due) && mgRoom.clock) return;
  mgStopClock();
  mgRoom.clockKey = String(due);
  mgRoom.clock = createClock({
    seconds: Math.max(0, Math.ceil((due - Date.now()) / 1000)),
    onTick: () => {
      const left = paint();
      const st = Room.state;
      if (left > 0 && left <= 5 && st && st.game === 'minigolf' && mgRoomCanPutt(st)) playSound('tick');
    },
    onEnd: () => { mgRoom.clock = null; paint(); }
  });
}

/** The players' chips over the course: each colour, strokes this hole, and who is up. */
function mgPlayersHtml(state, tv) {
  const s = state.shared;
  const rows = (s.order || []).map(pid => {
    const b = s.balls[pid] || {};
    const p = (state.players || []).find(x => x.id === pid);
    const st = b.done === 'cup' ? '✅' : b.done === 'picked' ? '✋' : '';
    return `<span class="mg-pchip ${s.turn === pid ? 'is-up' : ''} ${pid === Room.me && !tv ? 'is-me' : ''} ${p && !p.online ? 'is-away' : ''}">
        <span class="mg-dot" style="--c:${mgRoomColor(s, pid)}"></span><span class="mg-pchip__name">${escapeHTML(p ? p.name : '')}</span>
        <b class="metric">${Number(b.n) || 0}</b>${st ? `<span aria-hidden="true">${st}</span>` : ''}</span>`;
  });
  return rows.join('');
}

/** The rows of the room's scorecard: everyone playing, lowest total first. */
function mgRoomRows(state, tv) {
  const s = state.shared;
  const ids = (s.board || []).map(r => r.id).filter(id => (s.card || {})[id]);
  (s.order || []).forEach(id => { if (ids.indexOf(id) === -1 && (s.card || {})[id]) ids.push(id); });
  return ids.map(id => ({ id, name: mgName(state, id), color: mgRoomColor(s, id), card: s.card[id] || [], me: id === Room.me && !tv }));
}

/** The podium, lowest total first: renderPodium ranks the highest, so it gets a mirrored board and the real totals are written back. */
function mgPodiumHtml(state) {
  const s = state.shared;
  const rows = (s.board || []).filter(r => (s.order || []).indexOf(r.id) !== -1);
  if (rows.length < 2 || typeof renderPodium !== 'function') return '';
  const worst = Math.max.apply(null, rows.map(r => r.score));
  const html = renderPodium(state, rows.map(r => ({ id: r.id, name: r.name, score: worst - r.score + 1 })));
  if (!html) return '';
  const real = rows.slice(0, 3).map(r => r.score);
  let i = 0;
  return html.replace(/(<span class="podium__score metric">)(-?\d+)(<\/span>)/g, (m, a, n, b) => a + (i < real.length ? real[i++] : n) + b);
}

/** Between two holes: this hole's strokes and the totals, and when the next comes. */
function mgBetweenHtml(state, tv) {
  const s = state.shared;
  const h = mgRoomHole(s);
  const rows = mgRoomRows(state, tv);
  const left = s.nextAt ? Math.max(0, Math.ceil((s.nextAt + (mgRoom.offset || 0) - Date.now()) / 1000)) : 0;
  const words = rows.map(r => {
    const v = r.card[s.hole];
    return `<li class="mg-res ${r.me ? 'is-me' : ''}"><span class="mg-dot" style="--c:${r.color}"></span><span class="mg-res__name">${escapeHTML(r.name)}</span>
        <span class="mg-res__word">${typeof v === 'number' ? escapeHTML(v > golfMaxOf(h) ? mgT('mg_picked', { n: v }) : mgWordOf(v, h.par)) : ''}</span><b class="metric">${typeof v === 'number' ? v : '·'}</b></li>`;
  }).join('');
  return `<div class="mg-panel__card card">
      <p class="eyebrow">${escapeHTML(mgT('mg_hole_big', { n: s.hole + 1 }))} · ${escapeHTML(mgHoleName(h))}</p>
      <ul class="mg-results">${words}</ul>
      ${mgCardHtml(rows, mgRoomHoles(s), { upto: s.hole + 1, countHole: s.hole })}
      <p class="field__hint mg-next" data-mg-next>${escapeHTML(mgT('mg_next_in', { n: left }))}</p>
      ${state.youAreHost ? (tv ? `<div class="tv-actions">${tvBtn(mgT('mg_next_hole') + ' ⏭️', `roomAct('nextHole', { hole: ${Number(s.hole) || 0} })`)}</div>`
        : `<button type="button" class="btn btn--primary" onclick="roomAct('nextHole', { hole: ${Number(s.hole) || 0} })">${escapeHTML(mgT('mg_next_hole'))} ⏭️</button>`) : ''}
    </div>`;
}

function mgOverHtml(state, tv) {
  const s = state.shared;
  const rows = mgRoomRows(state, tv);
  const podium = mgPodiumHtml(state);
  const host = state.youAreHost
    ? (tv ? `<div class="tv-actions">${tvBtn(mgT('play_again'), "roomAct('playAgain')")}${tvBtn(mgT('room_another_game'), "roomAct('backToHub')", 'ghost')}</div>`
      : `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('playAgain')">${escapeHTML(mgT('play_again'))}</button>
         <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(mgT('room_another_game'))}</button></div>`)
    : `<div class="waiting-note">${escapeHTML(mgT('room_wait_host'))}</div>`;
  const w = (s.result || {}).winners || [];
  const line = w.length && rows.length > 1 ? `<p class="mg-panel__word">🏆 ${escapeHTML(w.map(id => mgName(state, id)).join(appState.lang === 'en' ? ', ' : '، '))}</p>` : '';
  return `<div class="mg-panel__card card mg-panel__card--over">
      <p class="eyebrow">${escapeHTML(mgT('mg_result_title', { hh: mgHolesText(mgRoomHoles(s).length) }))}</p>
      ${line}
      ${podium}
      ${mgCardHtml(rows, mgRoomHoles(s), { upto: mgRoomHoles(s).length })}
      ${host}
      ${!tv && typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, (s.board || []).map(r => ({ id: r.id, name: r.name, score: r.score }))) : ''}
    </div>`;
}

/** The strip, the hint, the players, the host's row, the card: updated in place. */
function mgRoomChrome(state, root, tv) {
  if (!root || !state || !state.shared) return;
  const s = state.shared;
  const me = s.balls && s.balls[Room.me];
  const mine = !tv && !!me;
  const clock = s.settings.clock && s.phase === 'play' ? '<span class="mg-chip mg-chip--clock" data-mg-clock></span>' : '';
  const up = s.settings.mode === 'turns' && s.turn ? `<span class="mg-chip mg-chip--turn">${escapeHTML(s.turn === Room.me && !tv ? mgT('mg_your_turn').split('!')[0] + '!' : mgT('mg_turn_of', { name: mgName(state, s.turn) }))}</span>` : '';
  const last = mine && s.phase === 'play' && !me.done && me.n === golfMaxOf(mgRoomHole(s)) - 1;
  mgSet(mgPart(root, 'hud'), mgHudHtml({ hole: s.hole, h: mgRoomHole(s), holes: mgRoomHoles(s).length, strokes: mine ? me.n : undefined, last, extra: up + clock }));
  mgSet(mgPart(root, 'players'), tv ? '' : mgPlayersHtml(state, tv));
  const hint = mgPart(root, 'hint');
  if (hint) {
    let text = '';
    if (s.phase === 'play') {
      if (!tv && !me) text = mgT('mg_watching');
      else if (mine && me.done) text = me.done === 'cup' ? mgT('mg_done_cup') : mgT('mg_done_picked');
      else if (mine && mg3Rolling(Room.me)) text = '';
      else if (mine && s.settings.mode === 'turns') text = s.turn === Room.me ? (mg3Rolling() ? mgT('mg_wait_roll') : mgT('mg_your_turn')) : mgT('mg_turn_of', { name: mgName(state, s.turn) });
      else if (mine) text = mgT('mg_pull_hint');
    }
    hint.textContent = text;
    hint.classList.toggle('is-on', !!text);
  }
  const host = mgPart(root, 'host');
  if (host) {
    const b = mgHostButtons(state);
    mgSet(host, tv ? (b.length ? `<div class="tv-actions">${b.map(x => tvBtn(x[0], x[1], 'ghost')).join('')}</div>` : '') : roomHostRow(b));
  }
  // The card between holes and the end wait for the last roll to land on this screen.
  const panel = mgPart(root, 'panel');
  const settled = !mg3Rolling() || !mg3Ready();
  const show = (s.phase === 'between' || s.phase === 'gameover') && settled;
  if (panel) {
    panel.classList.toggle('hidden', !show);
    if (show) {
      mgSet(panel, s.phase === 'between' ? mgBetweenHtml(state, tv) : mgOverHtml(state, tv));
      if (s.phase === 'between') mgCountTotals(panel, [state.code, s.dealId, s.hole, tv ? 'tv' : 'phone'].join('|'));
    }
    if (show && s.phase === 'gameover' && duelOnce(['mg-over', state.code, s.dealId].join('|'))) {
      const won = ((s.result || {}).winners || []).indexOf(Room.me) !== -1 && !tv;
      afterReveal(panel, () => {
        if (won || tv) { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90 }); }
      });
    }
  }
  const side = mgPart(root, 'side');
  if (side) mgSet(side, `<div class="mg-side__players">${mgPlayersHtml(state, true)}</div>${mgCardHtml(mgRoomRows(state, true), mgRoomHoles(s), { upto: Math.max(1, s.phase === 'play' ? s.hole : s.hole + 1) })}`);
  mgTickClock(state);
}

/** A screen's frame for the room: built once per game, everything else in place. */
function mgRoomRender(state, root, tv) {
  const s = state.shared;
  mgRoomSeeStamp(s);
  const frameKey = [state.code, s.dealId, tv ? 'tv' : 'phone', appState.lang].join('|');
  if (root.dataset.mgFrame !== frameKey || !root.querySelector('.mg-screen')) {
    root.dataset.mgFrame = frameKey;
    root.innerHTML = mgScreenHtml({ tv });
  }
  MG3.pad = tv ? { top: 0.1, bottom: 0.04, side: 0.03 } : { top: 0.12, bottom: 0.12, side: 0.04 };
  mgMountIn(root, () => { const st = Room.state; if (st && st.game === 'minigolf') { mgRoomCourse(st, root, tv); mgRoomChrome(st, root, tv); } });
  if (mg3Ready() && MG3.canvas.parentNode === mgPart(root, 'canvas')) mgRoomCourse(state, root, tv);
  // A new hole's card flies in (once, on every screen that sees it start).
  if (s.phase === 'play') mgNameCard(root, s.hole, mgRoomHole(s), [state.code, s.dealId, s.hole].join('|'));
  mgRoomChrome(state, root, tv);
  // A turn that comes to this phone: a tick and a buzz.
  const upKey = s.settings.mode === 'turns' && s.turn === Room.me && !tv ? [state.code, s.dealId, s.hole, s.shotSeq].join('|') : '';
  if (upKey && mgRoom.upKey !== upKey) { mgRoom.upKey = upKey; if (s.shotSeq) { mgSound('turn'); haptic('medium'); } }
}

ROOM_GAMES.minigolf = {
  // Someone who joins in the middle watches the hole, and plays the next game.
  lateJoin: true,
  // A putt is not a new step to scroll to; there is nothing to scroll on this screen.
  actionKey: () => '',
  lobbyOptions(state) {
    const o = mgRoomOpts();
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(mgT('mg_lobby_hint'))}</p>`;
    const seg = (label, key, values, current, hint) => `<div class="field">
        <label class="field__label">${escapeHTML(label)}</label>
        <div class="segmented" role="group">${values.map(v => `<button type="button" class="segmented__item ${String(v[0]) === String(current) ? 'is-active' : ''}" onclick="setMgRoomOpt('${key}', ${typeof v[0] === 'string' ? `'${v[0]}'` : v[0]})">${escapeHTML(v[1])}</button>`).join('')}</div>
        ${hint ? `<p class="field__hint">${escapeHTML(hint)}</p>` : ''}
      </div>`;
    return `<div class="card card--tight">
        ${seg(mgT('mg_lobby_mode'), 'mode', [['together', mgT('mg_mode_together')], ['turns', mgT('mg_mode_turns')]], o.mode, o.mode === 'turns' ? mgT('mg_mode_turns_hint') : mgT('mg_mode_together_hint'))}
        ${seg(mgT('mg_level_label'), 'level', GOLF_LEVELS.map(v => [v, mgT('mg_level_' + v)]), o.level, mgT('mg_level_hint_' + (GOLF_LEVELS.indexOf(o.level) !== -1 ? o.level : 'mix')))}
        ${seg(mgT('mg_holes_label'), 'holes', GOLF_HOLE_COUNTS.map(n => [n, String(n)]), o.holes)}
        <div class="field">
          <label class="switch-row" for="mg-room-guide">
            <span class="field__label">${escapeHTML(mgT('mg_guide'))}</span>
            <span class="switch"><input type="checkbox" id="mg-room-guide" role="switch" ${o.guide ? 'checked' : ''} onchange="setMgRoomOpt('guide', this.checked)"><span class="switch__track" aria-hidden="true"></span></span>
          </label>
          <p class="field__hint">${escapeHTML(mgT('mg_guide_hint'))}</p>
        </div>
        ${seg('⏱️ ' + mgT('mg_lobby_clock'), 'clock', [0, 20, 40].map(v => [v, v ? v + '″' : mgT('gw_clock_off')]), o.clock, mgT('mg_clock_hint'))}
      </div>`;
  },
  startPayload() {
    const o = mgRoomOpts();
    return { mode: o.mode, holes: o.holes, level: GOLF_LEVELS.indexOf(o.level) !== -1 ? o.level : 'mix', guide: !!o.guide, clock: o.clock };
  },
  render(state) {
    if (appState.currentView !== 'room-minigolf') setView('room-minigolf');
    const el = document.getElementById('view-room-minigolf');
    if (!el) return;
    const s = state.shared;
    if (!s || !s.settings || !s.balls) return;
    mgRoomRender(state, el, false);
  }
};

onRoomClocksReset(() => {
  mgStopClock();
  mgRoom.pending = null;
  clearTimeout(mgRoom.redraw);
});

TV_GAMES.minigolf = {
  // The frame is built once per game (mgRoomRender); everything else changes in place.
  sig: (state) => [(state.shared || {}).dealId || '', state.youAreHost].join('|'),
  frame(state, t) {
    const s = state.shared || {};
    if (!s.settings) return tvLookAtPhones(t);
    return '<div class="mg-tv" data-mg-tv></div>';
  },
  after(state) {
    const view = document.getElementById('view-room-tv');
    const root = view && view.querySelector('[data-mg-tv]');
    if (!root || !state.shared || !state.shared.balls) return;
    mgRoomRender(state, root, true);
  }
};

// The card between holes counts down to the next one on every screen; the
// host's "putt for" shows up for a ball that has waited, without a new state.
let mgTickN = 0;
setInterval(() => {
  const st = Room.state;
  if (!st || st.game !== 'minigolf' || !st.shared || st.phase === 'lobby') return;
  if (st.shared.phase === 'between') {
    const left = Math.max(0, Math.ceil((st.shared.nextAt + (mgRoom.offset || 0) - Date.now()) / 1000));
    document.querySelectorAll('[data-mg-next]').forEach(el => { el.textContent = mgT('mg_next_in', { n: left }); });
  }
  if (st.youAreHost && st.shared.phase === 'play' && ++mgTickN % 10 === 0) {
    const root = document.getElementById(st.youAreScreen ? 'view-room-tv' : 'view-room-minigolf');
    const host = root && mgPart(root, 'host');
    if (host) {
      const b = mgHostButtons(st);
      mgSet(host, st.youAreScreen ? (b.length ? `<div class="tv-actions">${b.map(x => tvBtn(x[0], x[1], 'ghost')).join('')}</div>` : '') : roomHostRow(b));
    }
  }
}, 500);
</script>
