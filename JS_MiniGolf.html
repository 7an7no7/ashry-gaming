<script>
/* ============================================================================
   ميني جولف — MINI GOLF, in real 3D: solo, the room's phones and the TV
   ----------------------------------------------------------------------------
   The holes and every putt are MiniGolf.js (shared with the rooms server,
   whose rules are RoomMiniGolf.js). This file draws them with three.js
   (loadThree, JS_Three.html) and plays them.

   The look the owner approved (23 Sep 2026, look أ «نجيلة» of the lead's
   preview): striped mown grass, wooden rails, a stone border, blue water with
   a stone bank and ripples, sand, a white windmill with a red roof whose
   sails turn and block its tunnel, the cup with a waving flag, trees, bushes
   and flowers on the rough, a sky to light it, soft shadows, the camera above
   at an angle with the whole hole in view. The owner turned down flat
   drawings ("a pixeled game from the 80s"), so the quality is the point.

   - One engine per page (MG3): one WebGL renderer, moved into whichever
     screen shows the course (solo, a room phone, the TV), disposed when the
     course leaves the screen. Pixel ratio at most 2; it draws at 30 frames a
     second when nothing is moving, and not at all while the page is hidden.
   - The control: pull back from the ball like a slingshot and let go. A short
     arrow while pulling shows the direction and the power - it is the
     control, always there. The full path (the aim guide) is a switch, off by
     default.
   - A putt is rolled on the screen by the same golfStep the server runs, so a
     replay on another phone is the same roll. Everything that moves on a hole
     (the windmill, the gate, the waterwheel) reads the hole's clock (MG3.clock).
   - The pieces added on 23 Sep 2026, each drawn in the same look: ice (pale,
     glassy), mud (dark, glossy puddles), speed pads and conveyors (their
     arrows and ribs always moving, quietly at 30 frames a second), portals
     (a turning swirl in a violet ring, out of an amber one), bumpers (a
     striped post whose cap flashes), ramps (a wedge of planks; the ball flies
     off it at the height the rules give) and one-way gates (a flap that swings
     open the way through). Each hole has its own scenery (MG_LOOKS).
   - In a room played in turns the balls knock each other: a roll carries the
     balls it may hit (sim.others), and each of them is moved by that roll
     (drivenBy) until everything has stopped.
   ========================================================================= */

const mgT = (key, vars) => {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || key;
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
};

// A ball's colour, by its player's place at the table. White first: the solo ball.
const MG_COLORS = ['#ffffff', '#ffd23f', '#ff6b9a', '#4fc3f7', '#ff9f43', '#7bed9f', '#b388ff', '#ff5252', '#26c6da', '#c6ff00', '#ffab91', '#a1887f'];

// Bidi marks and the Arabic block, built from char codes: an editor can't decode them into invisible characters.
const MG_LRI = String.fromCharCode(0x2066), MG_PDI = String.fromCharCode(0x2069);
const MG_ARABIC = new RegExp('[' + String.fromCharCode(0x0600) + '-' + String.fromCharCode(0x06FF) + ']');
/** "6 holes" - in Arabic حفر up to ten and حفرة past it, as the language counts. */
const mgHolesText = (n) => mgT(Number(n) > 10 ? 'mg_holes_n11' : 'mg_holes_n', { n });
const mgHoleName = (h) => mgT('mg_h_' + ((h || {}).id || ''));
/** A game's holes as objects, from its ids in order (a game saved before holes were drawn played the first ones). */
const mgCourseOf = (ids, n) => (Array.isArray(ids) ? ids : GOLF_HOLES.slice(0, Number(ids || n) || 6).map(h => h.id)).map(golfHoleById);
/** The kind of a game, as a word: سهل، متوسط، صعب، مكس. */
const mgLevelText = (level) => mgT('mg_level_' + (GOLF_LEVELS.indexOf(level) !== -1 ? level : 'mix'));
/** A score against par for a line of text: "+2", "−1", or "on par"; held left to right in Arabic. */
const mgDelta = (d) => (d === 0 ? mgT('mg_even') : MG_LRI + (d > 0 ? '+' + d : '−' + Math.abs(d)) + MG_PDI);
/** "in 3" under a hole's word: nothing for a hole in one, and Arabic's own word for two. */
const mgInN = (n) => (n === 1 ? '' : n === 2 ? mgT('mg_in_2') : mgT('mg_in_n', { n }));
const mgWordOf = (strokes, par) => {
  const w = golfScoreWord(strokes, par);
  return w === 'more' ? mgT('mg_w_more') : mgT('mg_w_' + w);
};

/* ==========================================================================
   Sounds (made, not downloaded): the putt's tock, a rail's knock, the cup,
   the water and the sand.
   ========================================================================== */
function mgSound(kind) {
  try {
    if (typeof fxCtx !== 'function' || typeof fxTone !== 'function' || typeof fxNoise !== 'function') return;
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'putt') {
      fxTone('sine', [[0, 900], [0.05, 420]], [[0, 0], [0.003, 0.28], [0.09, 0.001]], at);
      fxNoise('bandpass', 3200, 1.2, [[0, 0], [0.002, 0.08], [0.03, 0.001]], at);
    } else if (kind === 'wall') {
      fxTone('triangle', [[0, 260], [0.06, 150]], [[0, 0], [0.003, 0.16], [0.08, 0.001]], at);
    } else if (kind === 'cup') {
      [0, 0.07, 0.13].forEach((d, i) => fxTone('sine', [[0, 700 - i * 120], [0.05, 380 - i * 60]], [[0, 0], [0.003, 0.2 - i * 0.05], [0.07, 0.001]], at + d));
      fxTone('sine', [[0, 180], [0.18, 90]], [[0, 0], [0.01, 0.35], [0.25, 0.001]], at + 0.2);
    } else if (kind === 'splash') {
      fxNoise('lowpass', 1400, 0.7, [[0, 0], [0.01, 0.3], [0.45, 0.001]], at);
      fxNoise('bandpass', 3800, 2, [[0, 0], [0.03, 0.08], [0.3, 0.001]], at + 0.04);
    } else if (kind === 'sand') {
      fxNoise('highpass', 2400, 0.6, [[0, 0], [0.02, 0.05], [0.22, 0.001]], at);
    } else if (kind === 'turn') {
      fxTone('sine', [[0, 660], [0.08, 880]], [[0, 0], [0.01, 0.12], [0.16, 0.001]], at);
    } else if (kind === 'knock') {
      // ball on ball: a hard click
      fxTone('sine', [[0, 2100], [0.03, 1400]], [[0, 0], [0.002, 0.22], [0.05, 0.001]], at);
      fxNoise('highpass', 4200, 1, [[0, 0], [0.001, 0.1], [0.025, 0.001]], at);
    } else if (kind === 'bump') {
      // a bumper's boing
      fxTone('sine', [[0, 320], [0.09, 760], [0.22, 520]], [[0, 0], [0.005, 0.22], [0.26, 0.001]], at);
      fxTone('triangle', [[0, 980], [0.06, 1300]], [[0, 0], [0.004, 0.08], [0.1, 0.001]], at);
    } else if (kind === 'warp') {
      fxTone('sine', [[0, 1100], [0.28, 240]], [[0, 0], [0.02, 0.16], [0.32, 0.001]], at);
      fxTone('sine', [[0, 240], [0.28, 1300]], [[0, 0], [0.02, 0.1], [0.32, 0.001]], at + 0.12);
      fxNoise('bandpass', 2600, 3, [[0, 0], [0.05, 0.05], [0.4, 0.001]], at);
    } else if (kind === 'whoosh') {
      fxNoise('bandpass', 900, 1.4, [[0, 0], [0.06, 0.12], [0.3, 0.001]], at);
      fxTone('sine', [[0, 420], [0.22, 900]], [[0, 0], [0.03, 0.07], [0.25, 0.001]], at);
    } else if (kind === 'mud') {
      fxTone('sine', [[0, 180], [0.08, 90]], [[0, 0], [0.005, 0.22], [0.14, 0.001]], at);
      fxNoise('lowpass', 700, 1, [[0, 0], [0.01, 0.12], [0.2, 0.001]], at);
    } else if (kind === 'jump') {
      fxTone('sine', [[0, 300], [0.2, 720]], [[0, 0], [0.02, 0.12], [0.24, 0.001]], at);
    } else if (kind === 'land') {
      fxTone('sine', [[0, 150], [0.08, 70]], [[0, 0], [0.004, 0.3], [0.14, 0.001]], at);
    } else if (kind === 'flap') {
      fxTone('triangle', [[0, 520], [0.05, 380]], [[0, 0], [0.003, 0.14], [0.09, 0.001]], at);
    } else if (kind === 'ice') {
      fxNoise('highpass', 5200, 0.8, [[0, 0], [0.04, 0.035], [0.5, 0.001]], at);
    }
  } catch (e) {}
}

/* ==========================================================================
   THE ENGINE: one renderer, the hole's scene, the balls, the pull
   ========================================================================== */
const MG3 = {
  T: null, renderer: null, canvas: null, host: null, ro: null, raf: 0, loading: null,
  scene: null, cam: null, sun: null, env: null, tex: {}, geo: {},
  hole: null, holeKey: '', group: null, trash: [],
  movers: [], flag: null, waters: [], bobbers: [],
  balls: new Map(),
  arrow: null, band: null, guide: null, guidePts: null,
  input: null, pull: null, fx: [],
  clock: () => 0,
  last: 0, lastDraw: 0, gone: 0, orient: 'up', fitKey: '',
  pad: { top: 0.16, bottom: 0.05, side: 0.05 },
  tilt: 0.56,             // how far back the camera sits for its height: about 61° looking down
  fpsCap: 0,              // frames a second at most (0: as the screen draws); a test's slow software renderer sets it
  onFrame: null
};

function mg3Ready() { return !!(MG3.renderer && MG3.scene); }

/** Mounts the course in `host` (loading three.js the first time). Resolves true when it can draw. */
function mg3Mount(host) {
  if (!host) return Promise.resolve(false);
  if (typeof threeCanDraw === 'function' && !threeCanDraw()) return Promise.resolve(false);
  if (mg3Ready()) { mg3Attach(host); return Promise.resolve(true); }
  if (!MG3.loading) {
    MG3.loading = loadThree().then(THREE => {
      MG3.T = THREE;
      try { mg3Create(); } catch (e) { console.warn('minigolf 3D', e); mg3Dispose(); return false; }
      return true;
    }).catch(() => false).then(ok => { MG3.loading = null; return ok; });
  }
  return MG3.loading.then(ok => { if (ok) mg3Attach(host); return ok; });
}

function mg3Create() {
  const THREE = MG3.T;
  const canvas = document.createElement('canvas');
  canvas.className = 'mg-canvas';
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  MG3.renderer = renderer;
  MG3.canvas = canvas;
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); mg3Dispose(); });

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3f2);
  MG3.scene = scene;
  // The sky the grass and the water reflect.
  const pmrem = new THREE.PMREMGenerator(renderer);
  const sky = new THREE.Scene();
  const sg = new THREE.SphereGeometry(50, 32, 16);
  const col = [];
  const pos = sg.attributes.position;
  const top = new THREE.Color(0x7fc4ff), hor = new THREE.Color(0xffffff), gnd = new THREE.Color(0x5d8f4a);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 50;
    const c = y > 0 ? top.clone().lerp(hor, Math.pow(1 - y, 2)) : gnd;
    col.push(c.r, c.g, c.b);
  }
  sg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  sky.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  sunBall.position.set(20, 30, 20);
  sky.add(sunBall);
  MG3.env = pmrem.fromScene(sky, 0.035).texture;
  sg.dispose(); sunBall.geometry.dispose();
  pmrem.dispose();
  scene.environment = MG3.env;

  MG3.cam = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
  scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x4d7a3a, 0.85));
  const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  scene.add(sun); scene.add(sun.target);
  MG3.sun = sun;

  // Shared geometry for the balls; the pull's arrow and rubber band; the aim guide.
  MG3.geo.ball = new THREE.SphereGeometry(GOLF.BALL_R, 32, 20);
  const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92, depthWrite: false });
  const arrow = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 1), arrowMat);
  shaft.rotation.x = -Math.PI / 2;
  const headGeo = new THREE.BufferGeometry();
  headGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -0.5, -0.34, 0, 0, 0.34, 0, 0], 3));
  const head = new THREE.Mesh(headGeo, arrowMat);
  arrow.add(shaft); arrow.add(head);
  arrow.visible = false;
  arrow.renderOrder = 5;
  scene.add(arrow);
  MG3.arrow = { group: arrow, shaft, head, mat: arrowMat };
  const bandGeo = new THREE.BufferGeometry();
  bandGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
  const band = new THREE.Line(bandGeo, new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.18, gapSize: 0.14, transparent: true, opacity: 0.75 }));
  band.visible = false;
  scene.add(band);
  MG3.band = band;
  const gpos = new Float32Array(3 * 400);
  const ggeo = new THREE.BufferGeometry();
  ggeo.setAttribute('position', new THREE.BufferAttribute(gpos, 3));
  ggeo.setDrawRange(0, 0);
  const guide = new THREE.Points(ggeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.95, depthWrite: false }));
  guide.visible = false;
  guide.renderOrder = 4;
  scene.add(guide);
  MG3.guide = guide;
  MG3.guidePts = gpos;

  canvas.addEventListener('pointerdown', mg3Down);
  canvas.addEventListener('pointermove', mg3Move);
  canvas.addEventListener('pointerup', mg3Up);
  canvas.addEventListener('pointercancel', mg3Cancel);
  canvas.addEventListener('lostpointercapture', mg3Cancel);
  document.addEventListener('visibilitychange', mg3Wake);
}

/** Moves the canvas into `host` and watches its size. */
function mg3Attach(host) {
  if (MG3.host !== host || MG3.canvas.parentNode !== host) {
    host.appendChild(MG3.canvas);
    MG3.host = host;
    if (MG3.ro) MG3.ro.disconnect();
    MG3.ro = typeof ResizeObserver === 'function' ? new ResizeObserver(() => mg3Resize()) : null;
    if (MG3.ro) MG3.ro.observe(host);
    mg3Resize();
  }
  MG3.gone = 0;
  mg3Start();
}

function mg3Resize() {
  if (!mg3Ready() || !MG3.host) return;
  const r = MG3.host.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  MG3.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  MG3.renderer.setSize(w, h, false);
  MG3.cam.aspect = w / h;
  MG3.cam.updateProjectionMatrix();
  MG3.fitKey = '';
  mg3Fit();
  mg3Draw(true);
}

function mg3Start() {
  if (MG3.raf || !mg3Ready()) return;
  MG3.last = performance.now();
  MG3.raf = requestAnimationFrame(mg3Loop);
}
function mg3Stop() { if (MG3.raf) cancelAnimationFrame(MG3.raf); MG3.raf = 0; }
function mg3Wake() {
  if (!mg3Ready()) return;
  if (document.hidden) mg3Stop(); else mg3Start();
}

/** Everything goes: the scene, the GPU memory, the canvas. The next course builds it again. */
function mg3Dispose() {
  mg3Stop();
  if (MG3.ro) MG3.ro.disconnect();
  MG3.ro = null;
  mg3ClearHole();
  MG3.balls.forEach(b => mg3RemoveBall(b));
  MG3.balls.clear();
  if (MG3.scene) {
    MG3.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
    });
  }
  Object.keys(MG3.tex).forEach(k => { try { MG3.tex[k].dispose(); } catch (e) {} });
  Object.keys(MG3.geo).forEach(k => { try { MG3.geo[k].dispose(); } catch (e) {} });
  if (MG3.env) MG3.env.dispose();
  if (MG3.renderer) {
    MG3.renderer.dispose();
    try { MG3.renderer.forceContextLoss(); } catch (e) {}
  }
  if (MG3.canvas) {
    MG3.canvas.removeEventListener('pointerdown', mg3Down);
    MG3.canvas.removeEventListener('pointermove', mg3Move);
    MG3.canvas.removeEventListener('pointerup', mg3Up);
    MG3.canvas.removeEventListener('pointercancel', mg3Cancel);
    MG3.canvas.removeEventListener('lostpointercapture', mg3Cancel);
    if (MG3.canvas.parentNode) MG3.canvas.parentNode.removeChild(MG3.canvas);
  }
  document.removeEventListener('visibilitychange', mg3Wake);
  Object.assign(MG3, {
    renderer: null, canvas: null, host: null, scene: null, cam: null, sun: null, env: null, tex: {}, geo: {},
    hole: null, holeKey: '', group: null, trash: [], movers: [], flag: null, waters: [], bobbers: [],
    arrow: null, band: null, guide: null, guidePts: null, input: null, pull: null, fx: [], fitKey: '', onFrame: null
  });
}

/* --- textures, made on a canvas once per engine --------------------------------------- */

function mgRnd(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function mgCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

function mgTex(name, rx, ry, srgb) {
  const THREE = MG3.T;
  const key = name + (srgb === false ? ':lin' : '');
  if (!MG3.tex[key]) {
    const c = MG_TEXTURES[name]();
    const tx = new THREE.CanvasTexture(c);
    if (srgb !== false) tx.colorSpace = THREE.SRGBColorSpace;
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.anisotropy = Math.min(8, MG3.renderer.capabilities.getMaxAnisotropy());
    MG3.tex[key] = tx;
  }
  const base = MG3.tex[key];
  if ((rx || 1) === 1 && (ry || 1) === 1) return base;
  const k2 = key + '@' + rx + 'x' + ry;
  if (!MG3.tex[k2]) {
    const tx = base.clone();
    tx.needsUpdate = true;
    tx.repeat.set(rx || 1, ry || 1);
    MG3.tex[k2] = tx;
  }
  return MG3.tex[k2];
}

const MG_TEXTURES = {
  grass() {
    // Mown stripes, the blades as thousands of short strokes.
    const [c, g] = mgCanvas(512, 512), r = mgRnd(11);
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#3f9f58' : '#4cb56a'; g.fillRect(0, i * 64, 512, 64); }
    for (let k = 0; k < 18000; k++) {
      const x = r() * 512, y = r() * 512;
      g.fillStyle = `rgba(${r() < 0.5 ? '18,70,32' : '150,215,125'},${0.07 + r() * 0.14})`;
      g.fillRect(x, y, 1.2, 2.2 + r() * 2.2);
    }
    return c;
  },
  rough() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(21);
    g.fillStyle = '#2f6d3b'; g.fillRect(0, 0, 256, 256);
    for (let k = 0; k < 900; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '25,75,35' : '70,130,65'},0.35)`; g.beginPath(); g.arc(r() * 256, r() * 256, 3 + r() * 9, 0, 7); g.fill(); }
    for (let k = 0; k < 9000; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '15,45,20' : '100,160,85'},${0.12 + r() * 0.2})`; g.fillRect(r() * 256, r() * 256, 1.5, 3 + r() * 3); }
    return c;
  },
  sand() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(5);
    g.fillStyle = '#d9b476'; g.fillRect(0, 0, 256, 256);
    for (let k = 0; k < 14000; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '150,115,65' : '255,245,215'},${0.14 + r() * 0.26})`; g.fillRect(r() * 256, r() * 256, 1.3, 1.3); }
    // raked lines
    g.strokeStyle = 'rgba(150,110,60,.18)'; g.lineWidth = 2;
    for (let y = 8; y < 256; y += 16) { g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 256; x += 16) g.lineTo(x, y + Math.sin(x / 30) * 3); g.stroke(); }
    return c;
  },
  rail() {
    const [c, g] = mgCanvas(512, 64), r = mgRnd(9);
    g.fillStyle = '#a0643a'; g.fillRect(0, 0, 512, 64);
    for (let k = 0; k < 60; k++) {
      g.strokeStyle = `rgba(${60 + r() * 50},30,10,${0.12 + r() * 0.18})`; g.lineWidth = 1 + r() * 1.5;
      const y = r() * 64; g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x / 50 + k) * 2);
      g.stroke();
    }
    g.fillStyle = 'rgba(255,225,180,.2)'; g.fillRect(0, 0, 512, 6);
    return c;
  },
  stone() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(31);
    g.fillStyle = '#b8ad98'; g.fillRect(0, 0, 256, 256);
    // laid stones in courses
    for (let row = 0; row < 8; row++) {
      let x = row % 2 ? -16 : 0;
      while (x < 256) {
        const w = 26 + r() * 30;
        const l = 60 + r() * 14;
        g.fillStyle = `hsl(${38 + r() * 8},${14 + r() * 8}%,${l}%)`;
        g.fillRect(x + 1, row * 32 + 1, w - 2, 30);
        x += w;
      }
    }
    for (let k = 0; k < 5000; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '90,80,65' : '255,250,240'},${0.06 + r() * 0.1})`; g.fillRect(r() * 256, r() * 256, 1.5, 1.5); }
    return c;
  },
  sandstone() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(41);
    for (let row = 0; row < 16; row++) {
      g.fillStyle = `hsl(${36 + r() * 6},${48 + r() * 10}%,${62 + r() * 8}%)`;
      g.fillRect(0, row * 16, 256, 16);
      g.fillStyle = 'rgba(120,85,40,.35)'; g.fillRect(0, row * 16 + 15, 256, 1);
      let x = (row % 2) * 20;
      while (x < 256) { g.fillRect(x, row * 16, 1, 15); x += 30 + r() * 20; }
    }
    for (let k = 0; k < 6000; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '130,95,50' : '255,240,210'},${0.08 + r() * 0.12})`; g.fillRect(r() * 256, r() * 256, 1.3, 1.3); }

/* --- materials and meshes of a hole: everything made here is thrown away with the hole --- */

function mgKeep(o) { MG3.trash.push(o); return o; }
function mgMat(opts) {
  const THREE = MG3.T;
  return mgKeep(opts.physical ? new THREE.MeshPhysicalMaterial(opts.p) : new THREE.MeshStandardMaterial(opts));
}
function mgMesh(geo, mat, cast, receive) {
  const m = new MG3.T.Mesh(mgKeep(geo), mat);
  m.castShadow = cast !== false;
  m.receiveShadow = receive !== false;
  return m;
}
/** A course point (x right, y away from the tee) as a world position. */
function mgW(x, y, up) { return new MG3.T.Vector3(x, up || 0, -y); }
function mgShape(poly) {
  const s = new MG3.T.Shape();
  poly.forEach((p, i) => (i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])));
  return s;
}
/** A flat polygon lying on the course, its texture in course units. */
function mgFlat(shape, mat, y, uvScale) {
  const geo = new MG3.T.ShapeGeometry(shape, 24);
  const uv = geo.attributes.uv, pos = geo.attributes.position;
  const k = uvScale || 8;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / k, pos.getY(i) / k);
  const m = mgMesh(geo, mat, false, true);
  m.rotation.x = -Math.PI / 2;
  m.position.y = y || 0;
  return m;
}

function mg3ClearHole() {
  if (MG3.group && MG3.scene) MG3.scene.remove(MG3.group);
  MG3.trash.forEach(o => { try { o.dispose(); } catch (e) {} });
  MG3.trash = [];
  MG3.group = null;
  MG3.movers = [];
  MG3.flag = null;
  MG3.waters = [];
  MG3.bobbers = [];
  MG3.fx.forEach(f => f.remove && f.remove());
  MG3.fx = [];
  MG3.holeKey = '';
  MG3.hole = null;
}

/** Builds hole `h` (key: this deal of it). Balls keep their meshes; they are re-placed by the caller. */
function mg3SetHole(h, key) {
  if (!mg3Ready() || (MG3.holeKey === key && MG3.hole === h)) return false;
  mg3ClearHole();
  mg3Cancel();
  const THREE = MG3.T;
  const G = new THREE.Group();
  MG3.group = G;
  MG3.hole = h;
  MG3.holeKey = key;
  const b = mgBounds(h);
  const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const look = MG_LOOKS[h.id] || {};

  // The rough, far and wide, and the course raised on a stone plinth.
  const ground = look.ground || (look.snow ? 'snow' : look.desert ? 'sand' : 'rough');
  const rough = mgMesh(new THREE.PlaneGeometry(160, 160), mgMat({ map: mgTex(ground, ground === 'sea' ? 12 : 30, ground === 'sea' ? 12 : 30), roughness: ground === 'sea' ? 0.35 : ground === 'tiles' ? 0.6 : 1 }), false, true);
  // The sky: night over the moon, day everywhere else.
  MG3.scene.background.set(look.night ? 0x0b1026 : 0xbfe3f2);
  rough.rotation.x = -Math.PI / 2;
  rough.position.set(cx, -0.36, -cy);
  G.add(rough);
  const stoneMat = mgMat({ map: mgTex('stone', 1, 1), roughness: 0.9 });
  // Holes where the cup and the bowls go down into it, or its top would cover them.
  const base = mgShape(h.green);
  const cupIn = (h.bowls || []).some(bw => Math.hypot(bw.x - h.cup[0], bw.y - h.cup[1]) < 0.01);
  if (!cupIn) base.holes.push(new THREE.Path().absarc(h.cup[0], h.cup[1], GOLF.CUP_R, 0, Math.PI * 2, true));
  (h.bowls || []).forEach(bw => base.holes.push(new THREE.Path().absarc(bw.x, bw.y, bw.r, 0, Math.PI * 2, true)));
  const plinth = mgMesh(new THREE.ExtrudeGeometry(base, { depth: 0.33, bevelEnabled: false, curveSegments: 24 }), stoneMat, true, true);
  plinth.rotation.x = -Math.PI / 2;
  plinth.position.y = -0.36;
  mgUvWorld(plinth.geometry, 3);
  G.add(plinth);
  mgCurb(G, h, stoneMat);

  // The green: one surface, with a hole for the cup and for each bowl; hills laid over it.
  const grassMat = mgMat({ map: mgTex('grass', 1, 1), roughness: 0.93, envMapIntensity: 0.9 });
  const cupInBowl = (h.bowls || []).some(bw => Math.hypot(bw.x - h.cup[0], bw.y - h.cup[1]) < 0.01);
  const green = mgShape(h.green);
  if (!cupInBowl) green.holes.push(new THREE.Path().absarc(h.cup[0], h.cup[1], GOLF.CUP_R, 0, Math.PI * 2, true));
  (h.bowls || []).forEach(bw => green.holes.push(new THREE.Path().absarc(bw.x, bw.y, bw.r, 0, Math.PI * 2, true)));
  G.add(mgFlat(green, grassMat, 0));
  const hillMat = mgMat({ map: mgTex('grass', 1, 1), roughness: 0.93, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  (h.hills || []).forEach(hl => G.add(mgHillMesh(h, hl, hillMat)));
  (h.bowls || []).forEach(bw => G.add(mgBowlMesh(h, bw, hillMat, cupInBowl)));

  // Sand, water, the bridge's planks.
  const sandMat = mgMat({ map: mgTex('sand', 1, 1), roughness: 1, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
  const rimMat = mgMat({ color: 0xb38a4f, roughness: 1 });
  (h.sand || []).forEach(p => {
    G.add(mgFlat(mgShape(p), sandMat, 0.004, 4));
    const pts = p.map(q => new THREE.Vector3(q[0], 0.012, -q[1]));
    const tube = mgMesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.2), 64, 0.05, 5, true), rimMat, false, true);
    G.add(tube);
  });
  const waterNormal = mgTex('ripple', 1, 1, false);
  const waterMat = mgMat({ physical: true, p: { color: 0x1e7fd6, roughness: 0.05, metalness: 0, normalMap: waterNormal, normalScale: new THREE.Vector2(0.35, 0.35), transparent: true, opacity: 0.94, envMapIntensity: 1.3, polygonOffset: true, polygonOffsetFactor: -5, polygonOffsetUnits: -5 } });
  const bankMat = mgMat({ map: mgTex('stone', 1, 1), roughness: 0.85 });
  (h.water || []).forEach(p => {
    // The water lies over the green (a hole in it would cut the rails' edge); a stone bank round it.
    const w = mgFlat(mgShape(p), waterMat, 0.014, 6);
    w.renderOrder = 1;
    G.add(w);
    MG3.waters.push(waterNormal);
    const mx = p.reduce((a, q) => a + q[0], 0) / p.length, my = p.reduce((a, q) => a + q[1], 0) / p.length;
    const outer = p.map(([x, y]) => [mx + (x - mx) * 1.06 + Math.sign(x - mx) * 0.12, my + (y - my) * 1.06 + Math.sign(y - my) * 0.12]);
    const sh = mgShape(outer); sh.holes.push(new THREE.Path(p.map(([x, y]) => new THREE.Vector2(x, y))));
    const bank = mgMesh(new THREE.ExtrudeGeometry(sh, { depth: 0.1, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.03, bevelSegments: 2 }), bankMat, true, true);
    bank.rotation.x = -Math.PI / 2; bank.position.y = -0.06;
    mgUvWorld(bank.geometry, 2);
    G.add(bank);
  });
  // Ice: pale and glassy, a frosted rim. Mud: dark and wet, glossy puddles.
  if ((h.ice || []).length) {
    const iceMat = mgMat({ physical: true, p: { map: mgTex('ice', 1, 1), color: 0xf2fbff, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.5, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 } });
    const frost = mgMat({ color: 0xffffff, roughness: 0.5 });
    h.ice.forEach(p => {
      G.add(mgFlat(mgShape(p), iceMat, 0.005, 5));
      const pts = p.map(q => new THREE.Vector3(q[0], 0.014, -q[1]));
      G.add(mgMesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.2), 80, 0.06, 5, true), frost, false, true));
    });
  }
  if ((h.mud || []).length) {
    const mudMat = mgMat({ physical: true, p: { map: mgTex('mud', 1, 1), roughness: 0.32, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.25, envMapIntensity: 1.1, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 } });
    const lip = mgMat({ color: 0x3b2516, roughness: 0.9 });
    h.mud.forEach(p => {
      G.add(mgFlat(mgShape(p), mudMat, 0.005, 3));
      const pts = p.map(q => new THREE.Vector3(q[0], 0.012, -q[1]));
      G.add(mgMesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.2), 64, 0.07, 5, true), lip, false, true));
    });
  }
  (h.pads || []).forEach(p => mgPadMesh(G, h, p));
  (h.belts || []).forEach(bl => mgBeltMesh(G, h, bl));
  (h.ramps || []).forEach(rp => mgRampMesh(G, h, rp));
  if (look.planks) {
    const pl = mgFlat(mgShape(look.planks), mgMat({ map: mgTex('plank', 1, 1), roughness: 0.7 }), 0.03, 2.4);
    pl.castShadow = false;
    G.add(pl);
    // its edges: low stone kerbs where the planks meet the water
    const kerbMat = mgMat({ color: 0x9c8c74, roughness: 0.8 });
    (look.kerbs || [[0, 3], [1, 2]]).forEach(([a, c]) => {
      const p = look.planks[a], q = look.planks[c];
      G.add(mgBar(p[0], p[1], q[0], q[1], 0.12, 0.08, kerbMat, 0.02));
    });
  }

  // The cup, deep, with a white rim; the flag waving over it.
  mgCup(G, h, cupInBowl);
  // The tee: a darker mat.
  const tee = mgMesh(new THREE.PlaneGeometry(1.7, 1.2), mgMat({ color: 0x1f5d34, roughness: 1 }), false, true);
  tee.rotation.x = -Math.PI / 2;
  tee.position.copy(mgW(h.tee[0], h.tee[1], golfHeight(h, h.tee[0], h.tee[1]) + 0.006));
  G.add(tee);

  // The rails round the green and inside it.
  const railMat = mgMat({ map: mgTex('rail', 1, 1), roughness: 0.55 });
  const segs = [];
  h.green.forEach((p, i) => { const q = h.green[(i + 1) % h.green.length]; segs.push([p[0], p[1], q[0], q[1]]); });
  (h.walls || []).forEach(w => segs.push(w));
  segs.forEach(s => mgRail(G, h, s, railMat));

  // What stands on it, and what moves.
  (h.blocks || []).forEach(bk => mgBlock(G, h, bk));
  (h.mills || []).forEach(m => mgMill(G, h, m));
  (h.sliders || []).forEach(sl => mgSlider(G, h, sl));
  (h.spinners || []).forEach(sp => mgSpinner(G, h, sp));
  (h.bumpers || []).forEach((bp, k) => mgBumperMesh(G, h, bp, k));
  (h.portals || []).forEach((pt, k) => mgPortalMesh(G, h, pt, k));
  (h.gates || []).forEach((gt, k) => mgGateMesh(G, h, gt, k));

  // The rough's trees, bushes and flowers, and each hole's own touch.
  mgScenery(G, h, look);
  (look.deco || []).forEach(d => { const fn = MG_DECO[d.k]; if (fn) fn(G, h, d); });

  MG3.scene.add(G);
  // The sun's shadows cover the hole.
  const span = Math.max(b.x1 - b.x0, b.y1 - b.y0) / 2 + 6;
  Object.assign(MG3.sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 90 });
  MG3.sun.shadow.camera.updateProjectionMatrix();
  MG3.sun.position.set(cx - 10, 26, -cy + 8);
  MG3.sun.target.position.set(cx, 0, -cy);
  MG3.sun.target.updateMatrixWorld();
  MG3.fitKey = '';
  mg3Fit();
  return true;
}

function mgBounds(h) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  h.green.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
  return { x0, y0, x1, y1 };
}
/** Texture coordinates in world units: a stone face's courses the same size on every side. */
function mgUvWorld(geo, k) {
  const pos = geo.attributes.position, uv = geo.attributes.uv, nor = geo.attributes.normal;
  if (!uv || !nor) return;
  for (let i = 0; i < uv.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = Math.abs(nor.getX(i)), ny = Math.abs(nor.getY(i));
    if (nx > 0.5) uv.setXY(i, y / k, z / k * 2.5); else if (ny > 0.5) uv.setXY(i, x / k, z / k * 2.5); else uv.setXY(i, x / k, y / k);
  }
}
/** A straight bar between two course points (a kerb, a rail piece), lying on the ground at `y`. */
function mgBar(x1, y1, x2, y2, width, height, mat, y) {
  const THREE = MG3.T;
  const len = Math.hypot(x2 - x1, y2 - y1);
  const m = mgMesh(new THREE.BoxGeometry(len + width, height, width), mat);
  m.position.set((x1 + x2) / 2, (y || 0) + height / 2, -(y1 + y2) / 2);
  m.rotation.y = Math.atan2(y2 - y1, x2 - x1);
  return m;
}
/** The stone kerb along the outside of the green, under the rails, with posts at the corners. */
function mgCurb(G, h, mat) {
  const THREE = MG3.T;
  const poly = h.green;
  let area = 0;
  poly.forEach((p, i) => { const q = poly[(i + 1) % poly.length]; area += p[0] * q[1] - q[0] * p[1]; });
  const ccw = area > 0;
  poly.forEach((p, i) => {
    const q = poly[(i + 1) % poly.length];
    const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
    // outward: to the right of the edge when the polygon runs anticlockwise
    const nx = (ccw ? dy : -dy) / L, ny = (ccw ? -dx : dx) / L;
    const o = 0.24;
    G.add(mgBar(p[0] + nx * o, p[1] + ny * o, q[0] + nx * o, q[1] + ny * o, 0.5, 0.44, mat, -0.36));
  });
  // posts at the corners, their tops just under the green so they never show through the rails
  mgInstances(G, new THREE.CylinderGeometry(0.3, 0.33, 0.44, 10), mat, poly.map(p => ({ p: [p[0], -0.26, -p[1]], s: [1, 1, 1] })), true);
}
/** A rail: one piece on the flat, several following the ground over a hill. */
function mgRail(G, h, s, mat) {
  const THREE = MG3.T;
  const [x1, y1, x2, y2] = s;
  const len = Math.hypot(x2 - x1, y2 - y1);
  const hilly = (h.hills || []).length || (h.bowls || []).length || (h.ramps || []).length;
  const n = hilly ? Math.max(1, Math.ceil(len / 0.8)) : 1;
  const T = GOLF.WALL_R * 2, H = 0.42;
  for (let k = 0; k < n; k++) {
    const ax = x1 + (x2 - x1) * k / n, ay = y1 + (y2 - y1) * k / n;
    const bx = x1 + (x2 - x1) * (k + 1) / n, by = y1 + (y2 - y1) * (k + 1) / n;
    const ha = golfHeight(h, ax, ay), hb = golfHeight(h, bx, by);
    const l = Math.hypot(bx - ax, by - ay);
    const geo = new THREE.BoxGeometry(l + (n === 1 ? T : 0.02), H, T);
    const uv = geo.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * (l + T) / 6);
    const m = mgMesh(geo, mat);
    const a = mgW(ax, ay, ha), bb = mgW(bx, by, hb);
    m.position.copy(a).add(bb).multiplyScalar(0.5);
    m.position.y += H / 2;
    const dir = bb.clone().sub(a).normalize();
    m.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir);
    G.add(m);
  }
}
function mgHillMesh(h, hl, mat) {
  const THREE = MG3.T;
  const step = 0.25;
  const nx = Math.max(2, Math.round((hl.x1 - hl.x0) / step)), ny = Math.max(2, Math.round((hl.y1 - hl.y0) / step));
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
    const x = hl.x0 + (hl.x1 - hl.x0) * i / nx, y = hl.y0 + (hl.y1 - hl.y0) * j / ny;
    pos.push(x, golfHeight(h, x, y) + 0.001, -y);
    uv.push(x / 8, y / 8);
  }
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return mgMesh(geo, mat, true, true);
}
function mgBowlMesh(h, bw, mat, cupIn) {
  const THREE = MG3.T;
  const rings = 14, segs = 56, r0 = cupIn ? GOLF.CUP_R : 0.02;
  const pos = [], uv = [], idx = [];
  for (let j = 0; j <= rings; j++) for (let i = 0; i <= segs; i++) {
    const r = r0 + (bw.r - r0) * Math.pow(j / rings, 0.9), a = i / segs * Math.PI * 2;
    const x = bw.x + Math.cos(a) * r, y = bw.y + Math.sin(a) * r;
    pos.push(x, golfHeight(h, x, y) + 0.001, -y);
    uv.push(x / 8, y / 8);
  }
  for (let j = 0; j < rings; j++) for (let i = 0; i < segs; i++) {
    const a = j * (segs + 1) + i, b = a + 1, c = a + segs + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return mgMesh(geo, mat, false, true);
}
function mgCup(G, h, inBowl) {
  const THREE = MG3.T;
  const z = golfHeight(h, h.cup[0], h.cup[1]);
  const at = mgW(h.cup[0], h.cup[1], z);
  const wall = mgMesh(new THREE.CylinderGeometry(GOLF.CUP_R, GOLF.CUP_R, 0.55, 40, 1, true), mgMat({ color: 0x2b2b2b, roughness: 0.9, side: THREE.BackSide }), false, true);
  wall.position.copy(at); wall.position.y -= 0.27;
  G.add(wall);
  const bottom = mgMesh(new THREE.CircleGeometry(GOLF.CUP_R, 32), mgMat({ color: 0x0b0b0b, roughness: 1 }), false, false);
  bottom.rotation.x = -Math.PI / 2; bottom.position.copy(at); bottom.position.y -= 0.54;
  G.add(bottom);
  const rim = mgMesh(new THREE.RingGeometry(GOLF.CUP_R, GOLF.CUP_R + 0.07, 48), mgMat({ color: 0xf5f5f5, roughness: 0.4, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }), false, true);
  rim.rotation.x = -Math.PI / 2; rim.position.copy(at); rim.position.y += 0.004;
  G.add(rim);
  // The flag: a pole and a cloth that waves.
  const flag = new THREE.Group();
  flag.position.copy(at);
  const pole = mgMesh(new THREE.CylinderGeometry(0.035, 0.035, 2.7, 10), mgMat({ color: 0xf2f2f2, roughness: 0.3, metalness: 0.4 }));
  pole.position.y = 1.35 - 0.2;
  flag.add(pole);
  const clothGeo = new THREE.PlaneGeometry(1.1, 0.66, 14, 4);

  cloth.position.set(0.55, 2.2, 0);

  const knob = mgMesh(new THREE.SphereGeometry(0.06, 12, 8), mgMat({ color: 0xffd23f, roughness: 0.3, metalness: 0.5 }));
  knob.position.y = 2.53;
  flag.add(knob);
  G.add(flag);
  MG3.flag = { group: flag, cloth, geo: clothGeo, base: clothGeo.attributes.position.array.slice(), jump: 0 };
}

/* --- what stands on a hole ------------------------------------------------------------------ */

function mgBlock(G, h, bk) {
  const THREE = MG3.T;
  const poly = bk.poly;
  const cx = poly.reduce((a, p) => a + p[0], 0) / poly.length, cy = poly.reduce((a, p) => a + p[1], 0) / poly.length;
  if (MG_BLOCKS[bk.look]) return MG_BLOCKS[bk.look](G, h, bk, mgBlockInfo(poly));
  if (bk.look === 'mill') return;   // the windmill's house is drawn with its sails
  if (bk.look === 'pyramid') {
    const r = Math.max(...poly.map(p => Math.hypot(p[0] - cx, p[1] - cy)));
    const geo = new THREE.ConeGeometry(r, r * 1.15, 4, 6);
    mgUvWorld(geo, 1.4);
    const pyr = mgMesh(geo, mgMat({ map: mgTex('sandstone', 1, 1), roughness: 0.85, flatShading: true }));
    pyr.position.set(cx, r * 1.15 / 2 - 0.02, -cy);
    G.add(pyr);
    const cap = mgMesh(new THREE.ConeGeometry(r * 0.12, r * 0.14, 4), mgMat({ color: 0xe8b64a, roughness: 0.25, metalness: 0.8 }));
    cap.position.set(cx, r * 1.15 - r * 0.07 + 0.01, -cy);
    G.add(cap);
    return;
  }
  if (bk.look === 'tower') {
    const b = { x0: Math.min(...poly.map(p => p[0])), x1: Math.max(...poly.map(p => p[0])), y0: Math.min(...poly.map(p => p[1])), y1: Math.max(...poly.map(p => p[1])) };
    const w = b.x1 - b.x0, d = b.y1 - b.y0, H = 2.6;
    const mat = mgMat({ map: mgTex('sandstone', 1, 1), roughness: 0.9 });
    const geo = new THREE.BoxGeometry(w, H, d);
    mgUvWorld(geo, 2);
    const tw = mgMesh(geo, mat);
    tw.position.set(cx, H / 2, -cy);
    G.add(tw);
    // battlements
    const mer = mgKeep(new THREE.BoxGeometry(0.34, 0.36, 0.34));
    for (let i = 0; i < 4; i++) for (const zz of [b.y0 + 0.17, b.y1 - 0.17]) {
      const m = new THREE.Mesh(mer, mat); m.castShadow = true;
      m.position.set(b.x0 + 0.17 + i * (w - 0.34) / 3, H + 0.18, -zz);
      G.add(m);
    }
    // an arched window
    const win = mgMesh(new THREE.PlaneGeometry(0.4, 0.7), mgMat({ color: 0x3a2a1c, roughness: 1 }), false, false);
    win.position.set(cx, H * 0.62, -b.y0 + 0.001);
    G.add(win);
    return;
  }
  if (bk.look === 'jar') {
    const pts = [[0, 0], [0.34, 0.02], [0.52, 0.3], [0.56, 0.62], [0.44, 0.95], [0.2, 1.12], [0.17, 1.26], [0.24, 1.32], [0.2, 1.36]].map(p => new THREE.Vector2(p[0] * 1.2, p[1] * 1.1));
    const jar = mgMesh(new THREE.LatheGeometry(pts, 28), mgMat({ map: mgTex('clay', 1, 1), roughness: 0.75 }));
    jar.position.set(cx, 0, -cy);
    G.add(jar);
    const base = mgMesh(new THREE.CylinderGeometry(0.62, 0.7, 0.14, 24), mgMat({ color: 0x8d7a60, roughness: 0.9 }));
    base.position.set(cx, 0.07, -cy);
    G.add(base);
    return;
  }
  if (bk.look === 'salt' || bk.look === 'snow') {
    // A lump of white salt crystal, as on Siwa's salt lakes; or a snowy rock on the mountain.
    const r = Math.max(...poly.map(p => Math.hypot(p[0] - cx, p[1] - cy)));
    const geo = new THREE.IcosahedronGeometry(r, 1);
    const pa = geo.attributes.position, rr = mgRnd(Math.round(cx * 97 + cy * 13));
    for (let i = 0; i < pa.count; i++) { const k = 0.82 + rr() * 0.3; pa.setXYZ(i, pa.getX(i) * k, Math.max(-0.1, pa.getY(i) * k * 0.8), pa.getZ(i) * k); }
    geo.computeVertexNormals();
    const rock = mgMesh(geo, mgMat({ physical: true, p: { color: bk.look === 'snow' ? 0xdfe8f0 : 0xf4f7fb, roughness: 0.35, clearcoat: 0.6, flatShading: true, sheen: 0.4 } }));
    rock.position.set(cx, r * 0.45, -cy);
    G.add(rock);
    return;
  }
  if (bk.look === 'stall') {
    // A souq stall: a wooden counter under a striped awning, with pots and lanterns on it.
    const b = { x0: Math.min(...poly.map(p => p[0])), x1: Math.max(...poly.map(p => p[0])), y0: Math.min(...poly.map(p => p[1])), y1: Math.max(...poly.map(p => p[1])) };
    const w = b.x1 - b.x0, d = b.y1 - b.y0;
    const wood = mgMat({ map: mgTex('plank', 1, 1), roughness: 0.65 });
    const counter = mgMesh(new THREE.BoxGeometry(w, 0.7, d), wood);
    counter.position.set(cx, 0.35, -cy);
    G.add(counter);
    const iron = mgMat({ color: 0x3b3b3b, roughness: 0.5, metalness: 0.7 });
    [[b.x0 + 0.08, b.y0 + 0.08], [b.x1 - 0.08, b.y0 + 0.08], [b.x0 + 0.08, b.y1 - 0.08], [b.x1 - 0.08, b.y1 - 0.08]].forEach(([x, y]) => {
      const p = mgMesh(new THREE.CylinderGeometry(0.04, 0.04, 1.7, 6), iron); p.position.set(x, 0.85, -y); G.add(p);
    });
    const awn = mgMesh(new THREE.BoxGeometry(w + 0.4, 0.05, d + 0.4), mgMat({ map: mgTex('awning', 1, 1), roughness: 0.8 }));
    awn.position.set(cx, 1.72, -cy); awn.rotation.x = 0.12;
    G.add(awn);
    const goods = [];
    const cols = [0xe76f51, 0xf4a261, 0xe9c46a, 0x2a9d8f, 0x9b5de5];
    const rr = mgRnd(Math.round(cx * 31 + cy * 7));
    for (let k = 0; k < 6; k++) goods.push({ p: [b.x0 + 0.25 + rr() * (w - 0.5), 0.8, -(b.y0 + 0.25 + rr() * (d - 0.5))], s: [1, 0.8 + rr() * 0.6, 1], c: cols[k % 5] });
    mgInstances(G, new THREE.SphereGeometry(0.16, 10, 8), mgMat({ color: 0xffffff, roughness: 0.6 }), goods, true);
    return;
  }
  if (bk.look === 'obelisk') {
    // An obelisk: a tall tapering pillar with a gold tip.
    const r = Math.max(...poly.map(p => Math.abs(p[0] - cx))) * Math.SQRT2;
    const H = 3.4;
    const geo = new THREE.CylinderGeometry(r * 0.62, r, H, 4, 4);
    mgUvWorld(geo, 1.4);
    const ob = mgMesh(geo, mgMat({ map: mgTex('sandstone', 1, 1), roughness: 0.85, flatShading: true }));
    ob.rotation.y = Math.PI / 4;
    ob.position.set(cx, H / 2, -cy);
    G.add(ob);
    const tip = mgMesh(new THREE.ConeGeometry(r * 0.62, 0.5, 4), mgMat({ color: 0xe8b64a, roughness: 0.25, metalness: 0.8 }));
    tip.rotation.y = Math.PI / 4;
    tip.position.set(cx, H + 0.25, -cy);
    G.add(tip);
    const base = mgMesh(new THREE.BoxGeometry(r * 1.6, 0.2, r * 1.6), mgMat({ map: mgTex('stone', 1, 1), roughness: 0.9 }));
    base.position.set(cx, 0.1, -cy);
    G.add(base);
    return;
  }
  // A rock: a stone planter with a bush and flowers on top.
  const geo = new THREE.ExtrudeGeometry(mgShape(poly), { depth: 0.46, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 2 });
  mgUvWorld(geo, 1.2);
  const planter = mgMesh(geo, mgMat({ map: mgTex('stone', 1, 1), roughness: 0.85 }));
  planter.rotation.x = -Math.PI / 2;
  planter.position.y = 0;
  G.add(planter);
  const r = Math.min(...poly.map(p => Math.hypot(p[0] - cx, p[1] - cy)));
  const soil = mgMesh(new THREE.CircleGeometry(r * 0.8, 20), mgMat({ color: 0x4a3322, roughness: 1 }), false, true);
  soil.rotation.x = -Math.PI / 2; soil.position.set(cx, 0.53, -cy);
  G.add(soil);
  const bush = mgMesh(new THREE.IcosahedronGeometry(r * 0.62, 1), mgMat({ color: 0x3c8f45, roughness: 0.85, flatShading: true }));
  bush.position.set(cx, 0.53 + r * 0.35, -cy); bush.scale.y = 0.8;
  G.add(bush);
  const cols = [0xff6b6b, 0xffd166, 0xf1f1f1, 0xc77dff];
  const rr = mgRnd(Math.round(cx * 100 + cy * 7));
  const fls = [];
  for (let k = 0; k < 10; k++) {
    const a = rr() * Math.PI * 2, d = r * (0.55 + rr() * 0.25);
    fls.push({ p: [cx + Math.cos(a) * d, 0.58, -(cy + Math.sin(a) * d)], s: [1, 1, 1], c: cols[k % 4] });
  }
  mgInstances(G, new THREE.SphereGeometry(0.08, 8, 6), mgMat({ color: 0xffffff, roughness: 0.6 }), fls, false);
}

/**
 * The windmill: a white house with a stone base over the tunnel, a tall
 * tower with a red cap on it, and four lattice sails turning in front of the
 * tunnel's mouth, leaning back a little as a real mill's do (and so the
 * camera above sees them). A sail hanging straight down is angle 0
 * (golfMillShut): then its tip covers the tunnel's mouth.
 */
function mgMill(G, h, m) {
  const THREE = MG3.T;
  const white = mgMat({ color: 0xf5efe4, roughness: 0.75 });
  const stone = mgMat({ map: mgTex('stone', 1, 1), roughness: 0.9 });
  const red = mgMat({ color: 0xc1121f, roughness: 0.45 });
  const dark = mgMat({ color: 0x4a3222, roughness: 0.8 });
  const blocks = (h.blocks || []).filter(b => b.look === 'mill');
  let x0 = m.x - m.half - 2, x1 = m.x + m.half + 2, y0 = m.y, y1 = m.y + 1.6;
  if (blocks.length) {
    x0 = Math.min(...blocks.map(b => Math.min(...b.poly.map(p => p[0]))));
    x1 = Math.max(...blocks.map(b => Math.max(...b.poly.map(p => p[0]))));
    y0 = Math.min(...blocks.map(b => Math.min(...b.poly.map(p => p[1]))));
    y1 = Math.max(...blocks.map(b => Math.max(...b.poly.map(p => p[1]))));
  }
  const depth = y1 - y0, hgt = 1.5, cx = (x0 + x1) / 2, cz = -(y0 + y1) / 2;
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  const tl = m.x - m.half, tr = m.x + m.half;
  [[x0, tl], [tr, x1]].forEach(([a, b]) => {
    if (b - a < 0.01) return;
    const wall = mgMesh(new THREE.BoxGeometry(b - a, hgt, depth), white);
    wall.position.set((a + b) / 2 - cx, hgt / 2, 0);
    g.add(wall);
    const foot = mgMesh(new THREE.BoxGeometry(b - a + 0.06, 0.34, depth + 0.06), stone);
    mgUvWorld(foot.geometry, 1.5);
    foot.position.set((a + b) / 2 - cx, 0.17, 0);
    g.add(foot);
    // a small window each side
    const win = mgMesh(new THREE.PlaneGeometry(0.42, 0.5), mgMat({ color: 0x2f5d8a, roughness: 0.2, metalness: 0.2 }), false, false);
    win.position.set((a + b) / 2 - cx, hgt * 0.62, depth / 2 + 0.003);
    g.add(win);
  });
  const lintel = mgMesh(new THREE.BoxGeometry(tr - tl, hgt - 0.8, depth), white);
  lintel.position.set(m.x - cx, 0.8 + (hgt - 0.8) / 2, 0);
  g.add(lintel);
  const arch = mgMesh(new THREE.TorusGeometry((tr - tl) / 2, 0.07, 6, 16, Math.PI), stone);
  arch.position.set(m.x - cx, 0.8 - (tr - tl) / 2 * 0.05, depth / 2 + 0.02);
  arch.scale.set(1, 0.35, 1);
  g.add(arch);
  [depth / 2 + 0.002, -depth / 2 - 0.002].forEach(z => {
    const door = mgMesh(new THREE.PlaneGeometry(tr - tl, 0.8), mgMat({ color: 0x1c140e, roughness: 1 }), false, false);
    door.position.set(m.x - cx, 0.4, z);
    if (z < 0) door.rotation.y = Math.PI;
    g.add(door);
  });
  // the house's flat roof, a red trim, the tower and its cap
  const roof = mgMesh(new THREE.BoxGeometry(x1 - x0 + 0.2, 0.12, depth + 0.2), red);
  roof.position.set(0, hgt + 0.06, 0);
  g.add(roof);
  const tower = mgMesh(new THREE.CylinderGeometry(0.72, 1.02, 2.6, 8), white);
  tower.position.set(m.x - cx, hgt + 1.3, -0.1);
  g.add(tower);
  const ring = mgMesh(new THREE.CylinderGeometry(0.8, 0.8, 0.14, 8), dark);
  ring.position.set(m.x - cx, hgt + 2.64, -0.1);
  g.add(ring);
  const cap = mgMesh(new THREE.ConeGeometry(0.95, 1.1, 8), red);
  cap.position.set(m.x - cx, hgt + 3.25, -0.1);
  g.add(cap);
  const win2 = mgMesh(new THREE.PlaneGeometry(0.34, 0.46), mgMat({ color: 0x2f5d8a, roughness: 0.2, metalness: 0.2 }), false, false);
  win2.position.set(m.x - cx, hgt + 1.1, -0.1 + 0.9);
  g.add(win2);
  // the sails: on a shaft out of the tower's front, leaning back
  const tilt = new THREE.Group();
  tilt.position.set(m.x - cx, hgt + 2.15, -0.1 + 0.95);
  tilt.rotation.x = -0.32;
  g.add(tilt);
  const hub = new THREE.Group();
  tilt.add(hub);
  const boss = mgMesh(new THREE.CylinderGeometry(0.2, 0.24, 0.34, 16), red);
  boss.rotation.x = Math.PI / 2;
  hub.add(boss);
  const L = hgt + 2.15 - 0.2;
  const sailMat = mgMat({ color: 0xfbf6ec, roughness: 0.6, side: THREE.DoubleSide });
  for (let k = 0; k < m.blades; k++) {
    const arm = new THREE.Group();
    arm.rotation.z = k * Math.PI * 2 / m.blades;
    const spar = mgMesh(new THREE.BoxGeometry(0.1, L, 0.08), dark);
    spar.position.y = -L / 2;
    arm.add(spar);
    const sail = mgMesh(new THREE.BoxGeometry(0.8, L - 0.55, 0.03), sailMat);
    sail.position.set(0.42, -L / 2 - 0.22, 0);
    arm.add(sail);
    const frame = mgMesh(new THREE.BoxGeometry(0.06, L - 0.55, 0.05), dark, false, false);
    frame.position.set(0.84, -L / 2 - 0.22, 0.01);
    arm.add(frame);
    for (let sl = 0; sl < 5; sl++) {
      const bar = mgMesh(new THREE.BoxGeometry(0.86, 0.03, 0.04), dark, false, false);
      bar.position.set(0.42, -0.62 - sl * (L - 0.8) / 4, 0.02);
      arm.add(bar);
    }
    hub.add(arm);
  }
  G.add(g);
  MG3.movers.push({ kind: 'mill', m, hub });
}

/** The gate's door: a studded wooden slab sliding to and fro. */
function mgSlider(G, h, sl) {
  const THREE = MG3.T;
  const g = new THREE.Group();
  const H = 0.95;
  const slab = mgMesh(new THREE.BoxGeometry(sl.axis === 'x' ? sl.len : GOLF.WALL_R * 2, H, sl.axis === 'x' ? GOLF.WALL_R * 2 : sl.len), mgMat({ map: mgTex('plank', 1, 1), roughness: 0.6 }));
  slab.position.y = H / 2;
  g.add(slab);
  const iron = mgMat({ color: 0x3b3b3b, roughness: 0.4, metalness: 0.8 });
  const studs = [];
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) for (const side of [-1, 1]) {
    const along = -sl.len / 2 + 0.25 + i * (sl.len - 0.5) / 4;
    studs.push({ p: sl.axis === 'x' ? [along, 0.3 + j * 0.4, side * (GOLF.WALL_R + 0.01)] : [side * (GOLF.WALL_R + 0.01), 0.3 + j * 0.4, along], s: [1, 1, 1] });
  }
  mgInstances(g, new THREE.SphereGeometry(0.05, 8, 6), iron, studs, false);
  // a track in the ground
  const track = mgMesh(new THREE.BoxGeometry(sl.axis === 'x' ? sl.len + sl.travel * 2 : 0.1, 0.02, sl.axis === 'x' ? 0.1 : sl.len + sl.travel * 2), iron, false, true);
  track.position.set(sl.x, 0.012, -sl.y);
  G.add(track);
  G.add(g);
  MG3.movers.push({ kind: 'slider', sl, g });
}

/** The waterwheel's beam: a post, a hub, and a long wooden beam turning over the green. */
function mgSpinner(G, h, sp) {
  const THREE = MG3.T;
  const wood = mgMat({ map: mgTex('bark', 1, 1), roughness: 0.8 });
  const post = mgMesh(new THREE.CylinderGeometry(0.2, 0.26, 1.3, 14), wood);
  post.position.set(sp.x, 0.65, -sp.y);
  G.add(post);
  const g = new THREE.Group();
  g.position.set(sp.x, 0, -sp.y);
  const beam = mgMesh(new THREE.BoxGeometry(sp.r * 2, 0.34, GOLF.WALL_R * 2), mgMat({ map: mgTex('rail', 1, 1), roughness: 0.6 }));
  beam.position.y = 0.3;
  g.add(beam);
  const gear = mgMesh(new THREE.CylinderGeometry(0.55, 0.55, 0.16, 16), wood);
  gear.position.y = 1.2;
  g.add(gear);
  const teeth = [];
  for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; teeth.push({ p: [Math.cos(a) * 0.6, 1.2, Math.sin(a) * 0.6], s: [1, 1, 1], r: [0, -a, 0] }); }
  mgInstances(g, new THREE.BoxGeometry(0.14, 0.14, 0.2), wood, teeth, true);
  // clay pots hanging off the ends
  const pot = mgKeep(new THREE.SphereGeometry(0.18, 12, 8));
  const clay = mgMat({ map: mgTex('clay', 1, 1), roughness: 0.8 });
  [-1, 1].forEach(s => { const p = new THREE.Mesh(pot, clay); p.castShadow = true; p.position.set(s * (sp.r - 0.2), 0.62, 0); p.scale.y = 1.2; g.add(p); });
  G.add(g);
  MG3.movers.push({ kind: 'spinner', sp, g });
}

/** A group on the course at (x, y), turned so its local +x runs along the course direction (ux, uy). */
function mgAlong(x, y, ux, uy, up) {
  const g = new MG3.T.Group();
  g.position.set(x, up || 0, -y);
  g.rotation.y = Math.atan2(uy, ux);
  return g;
}
/** A texture of its own (its offset moves on its own), thrown away with the hole. */
function mgOwnTex(name, rx, ry) {
  const tx = mgTex(name, 1, 1).clone();
  tx.needsUpdate = true;
  tx.repeat.set(rx, ry);
  return mgKeep(tx);
}

/** A speed pad: a dark plate whose amber arrows run the way it pushes. */
function mgPadMesh(G, h, p) {
  const THREE = MG3.T;
  const u = golfUnit(p.dx, p.dy);
  const g = mgAlong(p.x, p.y, u[0], u[1], golfHeight(h, p.x, p.y) + 0.008);
  const tx = mgOwnTex('chevron', 1, Math.max(1, Math.round(p.l / p.w * 1.5)));
  const plate = mgMesh(new THREE.PlaneGeometry(p.w, p.l), mgMat({ map: tx, emissive: 0xffb703, emissiveMap: tx, emissiveIntensity: 0.55, roughness: 0.45, metalness: 0.2, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }), false, true);
  plate.rotation.x = -Math.PI / 2;
  plate.rotation.z = -Math.PI / 2;     // the texture's up along the group's +x
  g.add(plate);
  // a steel frame round it
  const steel = mgMat({ color: 0x8d99ae, roughness: 0.35, metalness: 0.8 });
  [[0, p.w / 2], [0, -p.w / 2]].forEach(([a, c]) => { const bar = mgMesh(new THREE.BoxGeometry(p.l + 0.1, 0.03, 0.06), steel, false, true); bar.position.set(a, 0.01, c); g.add(bar); });
  [[p.l / 2, 0], [-p.l / 2, 0]].forEach(([a]) => { const bar = mgMesh(new THREE.BoxGeometry(0.06, 0.03, p.w + 0.1), steel, false, true); bar.position.set(a, 0.01, 0); g.add(bar); });
  G.add(g);
  MG3.movers.push({ kind: 'pad', tx, rate: 1.4 });
}

/** A conveyor: a ribbed rubber belt running between two rollers, its arrows moving at its own speed. */
function mgBeltMesh(G, h, bl) {
  const THREE = MG3.T;
  const u = golfUnit(bl.vx, bl.vy);
  const alongY = Math.abs(bl.vy) >= Math.abs(bl.vx);
  const len = alongY ? bl.y1 - bl.y0 : bl.x1 - bl.x0, wid = alongY ? bl.x1 - bl.x0 : bl.y1 - bl.y0;
  const cx = (bl.x0 + bl.x1) / 2, cy = (bl.y0 + bl.y1) / 2;
  const g = mgAlong(cx, cy, u[0], u[1], 0.035);
  const reps = Math.max(1, Math.round(len / wid * 2));
  const tx = mgOwnTex('belt', 1, reps);
  const belt = mgMesh(new THREE.PlaneGeometry(wid, len), mgMat({ map: tx, roughness: 0.75, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }), false, true);
  belt.rotation.x = -Math.PI / 2;
  belt.rotation.z = -Math.PI / 2;
  g.add(belt);
  const steel = mgMat({ color: 0x9aa5b1, roughness: 0.3, metalness: 0.85 });
  const rollers = [];
  [len / 2, -len / 2].forEach(a => {
    const r = mgMesh(new THREE.CylinderGeometry(0.12, 0.12, wid + 0.1, 16), steel);
    r.rotation.x = Math.PI / 2;
    r.position.set(a, -0.05, 0);
    g.add(r);
    rollers.push(r);
  });
  // yellow and black hazard ends
  const hz = mgMat({ color: 0xffc300, roughness: 0.5 });
  [len / 2 + 0.16, -len / 2 - 0.16].forEach(a => { const s = mgMesh(new THREE.BoxGeometry(0.12, 0.02, wid), hz, false, true); s.position.set(a, -0.02, 0); g.add(s); });
  G.add(g);
  const speed = Math.sqrt(bl.vx * bl.vx + bl.vy * bl.vy);
  MG3.movers.push({ kind: 'belt', tx, rate: speed * reps / len, rollers, spin: speed / 0.12 });
}

/** A ramp: a wedge of planks up to a white lip, yellow trim down its sides. */
function mgRampMesh(G, h, rp) {
  const THREE = MG3.T;
  const u = golfUnit(rp.dx, rp.dy);
  const H = GOLF.RAMP_H;
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(rp.len, 0); s.lineTo(rp.len, H); s.lineTo(0, 0.002);
  const geo = new THREE.ExtrudeGeometry(s, { depth: rp.w, bevelEnabled: false });
  geo.translate(0, 0, -rp.w / 2);
  mgUvWorld(geo, 1.1);
  const g = mgAlong(rp.x, rp.y, u[0], u[1], 0);
  g.add(mgMesh(geo, mgMat({ map: mgTex('plank', 1, 1), roughness: 0.6 })));
  const lip = mgMesh(new THREE.BoxGeometry(0.1, 0.06, rp.w), mgMat({ color: 0xffffff, roughness: 0.4 }));
  lip.position.set(rp.len - 0.05, H - 0.02, 0);
  g.add(lip);
  // an arrow painted up the ramp
  const tx = mgOwnTex('chevron', 1, 1);
  const k = H / rp.len;
  const arrow = mgMesh(new THREE.PlaneGeometry(rp.w * 0.45, rp.len * 0.45), mgMat({ map: tx, transparent: true, opacity: 0.85, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }), false, true);
  arrow.rotation.set(-Math.PI / 2, 0, -Math.PI / 2);
  const tilt = new THREE.Group();
  tilt.rotation.z = Math.atan(k);
  tilt.position.set(rp.len * 0.45, rp.len * 0.45 * k + 0.012, 0);
  tilt.add(arrow);
  g.add(tilt);
  G.add(g);
}

/** A bumper: a striped post with a rubber ring and a cap that lights up when it's hit. */
function mgBumperMesh(G, h, bp, k) {
  const THREE = MG3.T;
  const g = new THREE.Group();
  g.position.set(bp.x, 0, -bp.y);
  const post = mgMesh(new THREE.CylinderGeometry(bp.r, bp.r * 1.08, 0.5, 28), mgMat({ map: mgTex('stripes', 1, 1), roughness: 0.45 }));
  post.position.y = 0.25;
  g.add(post);
  const ring = mgMesh(new THREE.TorusGeometry(bp.r + 0.02, 0.07, 10, 36), mgMat({ color: 0x1d1d24, roughness: 0.7 }));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = GOLF.BALL_R;
  g.add(ring);
  const capMat = mgMat({ color: 0xffd23f, emissive: 0xffc300, emissiveIntensity: 0.15, roughness: 0.25, metalness: 0.3 });
  const cap = mgMesh(new THREE.SphereGeometry(bp.r * 0.9, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), capMat);
  cap.position.y = 0.5;
  g.add(cap);
  G.add(g);
  MG3.movers.push({ kind: 'bumper', k, g, capMat, last: -99 });
}

/** A portal: a violet ring with a turning swirl, and an amber ring it comes out of, an arrow on its way. */
function mgPortalMesh(G, h, pt, k) {
  const THREE = MG3.T;
  const R = GOLF.PORTAL_R;
  const swirlTx = mgTex('swirl', 1, 1);
  const make = (x, y, color) => {
    const g = new THREE.Group();
    g.position.set(x, golfHeight(h, x, y) + 0.02, -y);
    const ring = mgMesh(new THREE.TorusGeometry(R, 0.09, 12, 44), mgMat({ color, emissive: color, emissiveIntensity: 0.9, roughness: 0.3, metalness: 0.2 }));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.04;
    g.add(ring);
    const disc = mgMesh(new THREE.CircleGeometry(R * 0.95, 40), mgMat({ map: swirlTx, color, emissive: color, emissiveMap: swirlTx, emissiveIntensity: 0.9, transparent: true, depthWrite: false, roughness: 0.4 }), false, false);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = 0.01;
    g.add(disc);
    const base = mgMesh(new THREE.CylinderGeometry(R + 0.16, R + 0.2, 0.08, 36), mgMat({ map: mgTex('stone', 1, 1), roughness: 0.8 }), false, true);
    base.position.y = -0.02;
    g.add(base);
    G.add(g);
    return disc;
  };
  const inDisc = make(pt.x, pt.y, 0x9b5de5);
  const outDisc = make(pt.ox, pt.oy, 0xff9e00);
  // the way out: an arrow just past the out ring
  const u = golfUnit(pt.dx, pt.dy);
  const ag = mgAlong(pt.ox + u[0] * (R + 0.5), pt.oy + u[1] * (R + 0.5), u[0], u[1], 0.012);
  const arrow = mgMesh(new THREE.PlaneGeometry(0.6, 0.6), mgMat({ map: mgOwnTex('chevron', 1, 1), transparent: true, opacity: 0.9, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }), false, true);
  arrow.rotation.x = -Math.PI / 2;
  arrow.rotation.z = -Math.PI / 2;
  ag.add(arrow);
  G.add(ag);
  MG3.movers.push({ kind: 'portal', k, discs: [inDisc, outDisc] });
}

/** A one-way gate: two posts and a beam, a wooden flap hanging from it that swings open the way through; an arrow on the ground says which way. */
function mgGateMesh(G, h, gt, k) {
  const THREE = MG3.T;
  const ex = gt.x2 - gt.x1, ey = gt.y2 - gt.y1, len = Math.sqrt(ex * ex + ey * ey) || 1;
  const lx = ex / len, ly = ey / len;
  const g = mgAlong((gt.x1 + gt.x2) / 2, (gt.y1 + gt.y2) / 2, lx, ly, 0);
  const iron = mgMat({ color: 0x3b3b3b, roughness: 0.4, metalness: 0.8 });
  const brass = mgMat({ color: 0xd4a017, roughness: 0.3, metalness: 0.7 });
  [len / 2, -len / 2].forEach(a => {
    const post = mgMesh(new THREE.CylinderGeometry(0.09, 0.11, 0.8, 10), iron);
    post.position.set(a, 0.4, 0);
    g.add(post);
    const knob = mgMesh(new THREE.SphereGeometry(0.11, 10, 8), brass);
    knob.position.set(a, 0.84, 0);
    g.add(knob);
  });
  const beam = mgMesh(new THREE.BoxGeometry(len, 0.07, 0.08), iron);
  beam.position.set(0, 0.72, 0);
  g.add(beam);
  const pivot = new THREE.Group();
  pivot.position.y = 0.7;
  const flap = mgMesh(new THREE.BoxGeometry(len - 0.24, 0.6, 0.05), mgMat({ map: mgTex('plank', 1, 1), roughness: 0.6 }));
  flap.position.y = -0.33;
  pivot.add(flap);
  g.add(pivot);
  // which side of the flap is the way out: local +z is course (sin φ, -cos φ)
  const w = golfUnit(gt.dx, gt.dy);
  const sign = (w[0] * ly - w[1] * lx) > 0 ? 1 : -1;     // local +z = course (ly, -lx)
  G.add(g);
  // the arrow on the way in
  const ag = mgAlong((gt.x1 + gt.x2) / 2 - w[0] * 0.7, (gt.y1 + gt.y2) / 2 - w[1] * 0.7, w[0], w[1], 0.012);
  const arrow = mgMesh(new THREE.PlaneGeometry(0.55, Math.min(1, len * 0.4)), mgMat({ map: mgOwnTex('chevron', 1, 1), transparent: true, opacity: 0.9, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }), false, true);
  arrow.rotation.x = -Math.PI / 2;
  arrow.rotation.z = -Math.PI / 2;
  ag.add(arrow);
  G.add(ag);
  MG3.movers.push({ kind: 'gate', k, pivot, sign, last: -99 });
}

/** Trees, bushes and flowers scattered on the rough round the course, never on it. */
function mgScenery(G, h, look) {
  const THREE = MG3.T;
  const b = mgBounds(h);
  const r = mgRnd(h.id.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
  // One draw each for every trunk, every crown and bush, every flower: instanced, not a mesh apiece.
  const leafCols = [0x2f7d3a, 0x3c8f45, 0x276b33, 0x4a9d4f];
  const flowerCols = [0xff6b6b, 0xffd166, 0xf1f1f1, 0xc77dff, 0xff9ff3];
  const trunks = [], crowns = [], flowers = [];
  if (look.ground) return;     // no trees on the sea, the moon, a floor or paving
  const avoid = (look.deco || []).map(d => [d.x, d.y]);
  const near = (x, y) => avoid.some(p => Math.hypot(p[0] - x, p[1] - y) < 2.4);
  // Never on the course, nor near enough its rails for a crown to hang over them (a hole that turns a corner has rough inside its box).
  const edgeGap = (x, y) => {
    let best = Infinity;
    h.green.forEach((p, i) => {
      const q = h.green[(i + 1) % h.green.length], ex = q[0] - p[0], ey = q[1] - p[1], l2 = ex * ex + ey * ey;
      const u = l2 ? Math.max(0, Math.min(1, ((x - p[0]) * ex + (y - p[1]) * ey) / l2)) : 0;
      best = Math.min(best, Math.hypot(x - p[0] - ex * u, y - p[1] - ey * u));
    });
    return best;
  };
  const onCourse = (x, y) => golfInPoly(x, y, h.green) || edgeGap(x, y) < 2.6;
  let placed = 0, tries = 0;
  const want = 50;
  while (placed < want && tries < 900) {
    tries++;
    const x = b.x0 - 12 + r() * (b.x1 - b.x0 + 24), y = b.y0 - 8 + r() * (b.y1 - b.y0 + 20);
    if (onCourse(x, y) || near(x, y)) continue;
    const kind = r();
    const gy = -0.36, z = -y;
    if (kind < 0.36 && !look.desert) {
      const s = 0.85 + r() * 0.6;
      trunks.push({ p: [x, gy + 0.5 * s, z], s: [s, s, s] });
      for (let k = 0; k < 3; k++) {
        const cs = (1.1 - k * 0.2) * s;
        crowns.push({ p: [x + (r() - 0.5) * 0.6 * s, gy + (1.7 + k * 0.7) * s, z + (r() - 0.5) * 0.6 * s], s: [cs, cs, cs], r: [r(), r(), r()], c: leafCols[(k + placed) % 4] });
      }
    } else if (kind < 0.78) {
      crowns.push({ p: [x, gy + 0.12, z], s: [0.6 * (1 + r() * 0.5), 0.6 * (0.65 + r() * 0.2), 0.6 * (1 + r() * 0.5)], r: [0, r() * 3, 0], c: leafCols[Math.floor(r() * 4)] });
    } else {
      for (let k = 0; k < 11; k++) flowers.push({ p: [x + (r() - 0.5) * 1.4, gy + 0.06, z + (r() - 0.5) * 1.4], s: [1, 1, 1], c: flowerCols[Math.floor(r() * 5)] });
    }
    placed++;
  }
  mgInstances(G, new THREE.CylinderGeometry(0.16, 0.24, 1.6, 7), mgMat({ map: mgTex('bark', 1, 1), roughness: 0.9 }), trunks, true);
  mgInstances(G, new THREE.IcosahedronGeometry(1, 1), mgMat({ color: 0xffffff, roughness: 0.85, flatShading: true }), crowns, true);
  mgInstances(G, new THREE.SphereGeometry(0.1, 8, 6), mgMat({ color: 0xffffff, roughness: 0.7 }), flowers, false);
}

/** A palm frond: a strip along +x, rising a little then arching down, narrowing to its tip, folded along the spine. */
function mgFrondGeometry() {
  const THREE = MG3.T;
  const L = 2.5, n = 10, pos = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const x = u * L, y = u * 0.55 - u * u * 1.7;
    const w = 0.42 * Math.sin(Math.PI * Math.min(1, u * 1.15)) + 0.02;
    pos.push(x, y - 0.06, -w, x, y + 0.04, 0, x, y - 0.06, w);
  }
  for (let i = 0; i < n; i++) {
    const a = i * 3;
    idx.push(a, a + 3, a + 1, a + 1, a + 3, a + 4, a + 1, a + 4, a + 2, a + 2, a + 4, a + 5);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/** Many copies of one mesh as one draw: [{ p: [x,y,z], s: [sx,sy,sz], r: [rx,ry,rz], c: colour }]. */
function mgInstances(G, geo, mat, list, cast) {
  if (!list.length) { geo.dispose(); return null; }
  const THREE = MG3.T;
  const m = new THREE.InstancedMesh(mgKeep(geo), mat, list.length);
  const o = new THREE.Object3D(), col = new THREE.Color();
  list.forEach((it, i) => {
    o.position.set(it.p[0], it.p[1], it.p[2]);
    o.rotation.set((it.r || [0, 0, 0])[0], (it.r || [0, 0, 0])[1], (it.r || [0, 0, 0])[2]);
    o.scale.set(it.s[0], it.s[1], it.s[2]);
    o.updateMatrix();
    m.setMatrixAt(i, o.matrix);
    if (it.c !== undefined) m.setColorAt(i, col.set(it.c));
  });
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.castShadow = !!cast;
  m.receiveShadow = true;
  G.add(m);
  return m;
}

/* ==========================================================================
   The sixty holes' own places (23 Sep 2026): the grounds round a course
   (sea, the moon, a tiled floor, paving), the obstacles drawn as what they
   are on their hole (a flagpole, toy blocks, a giraffes' paddock, a Ramadan
   lantern, Qaitbay's keep, the Sphinx, Abu Simbel's colossi…) and the
   scenery round each new hole. Everything repeated is instanced; everything
   is made with the hole and thrown away with it (mgKeep).
   ========================================================================== */

Object.assign(MG_TEXTURES, {
  sea() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(111);
    g.fillStyle = '#2b86c5'; g.fillRect(0, 0, 256, 256);
    for (let k = 0; k < 500; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '20,90,150' : '120,200,240'},0.25)`; g.beginPath(); g.ellipse(r() * 256, r() * 256, 6 + r() * 16, 2 + r() * 4, 0, 0, 7); g.fill(); }
    for (let k = 0; k < 60; k++) { g.fillStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.ellipse(r() * 256, r() * 256, 3 + r() * 4, 1.2, 0, 0, 7); g.fill(); }
    return c;
  },
  moon() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(121);
    g.fillStyle = '#8d8f99'; g.fillRect(0, 0, 256, 256);
    for (let k = 0; k < 3000; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '60,62,70' : '200,202,210'},${0.1 + r() * 0.2})`; g.fillRect(r() * 256, r() * 256, 1.5, 1.5); }
    for (let k = 0; k < 40; k++) {
      const x = r() * 256, y = r() * 256, rad = 4 + r() * 18;
      g.fillStyle = 'rgba(55,57,66,.45)'; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
      g.strokeStyle = 'rgba(220,222,230,.45)'; g.lineWidth = 2; g.beginPath(); g.arc(x - 1, y - 1, rad, 3.6, 5.8); g.stroke();
    }
    return c;
  },
  tiles() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(131);
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) {
      g.fillStyle = (i + j) % 2 ? `hsl(35,20%,${84 + r() * 5}%)` : `hsl(210,18%,${70 + r() * 5}%)`;
      g.fillRect(i * 32, j * 32, 32, 32);
    }
    g.strokeStyle = 'rgba(80,80,90,.35)'; g.lineWidth = 1.5;
    for (let k = 0; k <= 256; k += 32) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k, 256); g.moveTo(0, k); g.lineTo(256, k); g.stroke(); }
    return c;
  },
  paving() {
    const [c, g] = mgCanvas(256, 256), r = mgRnd(141);
    g.fillStyle = '#c9b48f'; g.fillRect(0, 0, 256, 256);
    for (let row = 0; row < 8; row++) {
      let x = row % 2 ? -20 : 0;
      while (x < 256) { const w = 34 + r() * 26; g.fillStyle = `hsl(${34 + r() * 8},${28 + r() * 10}%,${62 + r() * 10}%)`; g.fillRect(x + 1.5, row * 32 + 1.5, w - 3, 29); x += w; }
    }
    return c;
  },
  eflag() {
    // Egypt's flag: red, white with a golden eagle, black.
    const [c, g] = mgCanvas(96, 64);
    g.fillStyle = '#ce1126'; g.fillRect(0, 0, 96, 22);
    g.fillStyle = '#ffffff'; g.fillRect(0, 21, 96, 22);
    g.fillStyle = '#111111'; g.fillRect(0, 42, 96, 22);
    g.fillStyle = '#c09300'; g.beginPath(); g.moveTo(48, 24); g.lineTo(55, 32); g.lineTo(52, 40); g.lineTo(44, 40); g.lineTo(41, 32); g.closePath(); g.fill();
    return c;
  },
  windows() {
    // A wall of windows, for a building seen from the course.
    const [c, g] = mgCanvas(128, 128), r = mgRnd(151);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
      g.fillStyle = r() < 0.25 ? '#ffe7a3' : '#35506b';
      g.fillRect(8 + i * 30, 10 + j * 30, 18, 20);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(8 + i * 30, 30 + j * 30, 18, 3);
    }
    return c;
  },
  spots() {
    // A giraffe's coat.
    const [c, g] = mgCanvas(128, 128), r = mgRnd(161);
    g.fillStyle = '#f2d49b'; g.fillRect(0, 0, 128, 128);
    for (let k = 0; k < 26; k++) { g.fillStyle = '#b86b2a'; g.beginPath(); const x = r() * 128, y = r() * 128; g.moveTo(x, y); for (let s = 0; s < 6; s++) g.lineTo(x + Math.cos(s) * (8 + r() * 5), y + Math.sin(s) * (8 + r() * 5)); g.closePath(); g.fill(); }
    return c;
  },
  eggpaint() {
    // Sham El-Nessim's painted eggs: bands of colour and dots.
    const [c, g] = mgCanvas(128, 128);
    const cols = ['#ff6b9a', '#ffd166', '#06d6a0', '#118ab2', '#9b5de5', '#ff9e00'];
    for (let i = 0; i < 8; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(0, i * 16, 128, 16); }
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 8; i++) for (let k = 0; k < 8; k++) { g.beginPath(); g.arc(8 + k * 16, 8 + i * 16, 2.4, 0, 7); g.fill(); }
    return c;
  },
  books() {
    const [c, g] = mgCanvas(128, 64), r = mgRnd(171);
    g.fillStyle = '#5a3a22'; g.fillRect(0, 0, 128, 64);
    const cols = ['#b23a48', '#2a6f97', '#e9c46a', '#2a9d8f', '#6d597a', '#f4a261'];
    for (let row = 0; row < 2; row++) { let x = 2; while (x < 126) { const w = 4 + r() * 6; g.fillStyle = cols[Math.floor(r() * 6)]; g.fillRect(x, 3 + row * 31, w - 1, 26 - r() * 5); x += w; } }
    return c;
  }
});

/** A mesh put at a course point, `up` above the course's surface (the green is at 0, the rough at -0.36). */
function mgAt(G, m, x, y, up) { m.position.set(x, up || 0, -y); G.add(m); return m; }
/** A block's middle, its box and its radius. */
function mgBlockInfo(poly) {
  const cx = poly.reduce((a, p) => a + p[0], 0) / poly.length, cy = poly.reduce((a, p) => a + p[1], 0) / poly.length;
  const b = { x0: Math.min(...poly.map(p => p[0])), x1: Math.max(...poly.map(p => p[0])), y0: Math.min(...poly.map(p => p[1])), y1: Math.max(...poly.map(p => p[1])) };
  return { cx, cy, b, w: b.x1 - b.x0, d: b.y1 - b.y0, r: Math.max(...poly.map(p => Math.hypot(p[0] - cx, p[1] - cy))), rin: Math.min(...poly.map(p => Math.hypot(p[0] - cx, p[1] - cy))) };
}
function mgBox(G, w, hgt, d, mat, x, y, up) { return mgAt(G, mgMesh(new MG3.T.BoxGeometry(w, hgt, d), mat), x, y, (up || 0) + hgt / 2); }

const MG_BLOCKS = {
  pole(G, h, bk, o) {
    // The school yard's flagpole on a stone base, Egypt's flag at the top.
    const THREE = MG3.T;
    mgAt(G, mgMesh(new THREE.CylinderGeometry(o.rin * 0.95, o.rin, 0.3, 12), mgMat({ map: mgTex('stone', 1, 1), roughness: 0.9 })), o.cx, o.cy, 0.15);
    mgAt(G, mgMesh(new THREE.CylinderGeometry(0.05, 0.06, 3.6, 8), mgMat({ color: 0xdfe3e8, roughness: 0.3, metalness: 0.7 })), o.cx, o.cy, 1.8);
    const flag = mgAt(G, mgMesh(new THREE.PlaneGeometry(1.2, 0.8), mgMat({ map: mgTex('eflag', 1, 1), roughness: 0.7, side: THREE.DoubleSide })), o.cx + 0.62, o.cy, 3.1);
    flag.rotation.y = 0.35;
  },
  bench(G, h, bk, o) {
    const wood = mgMat({ map: mgTex('plank', 1, 1), roughness: 0.7 }), iron = mgMat({ color: 0x2f3b45, roughness: 0.5, metalness: 0.6 });
    const along = o.w >= o.d, L = along ? o.w : o.d, T = along ? o.d : o.w;
    [-0.3, 0, 0.3].forEach(k => mgBox(G, along ? L : T * 0.3, 0.06, along ? T * 0.3 : L, wood, o.cx + (along ? 0 : k * T), o.cy + (along ? k * T : 0), 0.42));
    [-0.4, 0.4].forEach(k => mgBox(G, along ? 0.08 : T, 0.42, along ? T : 0.08, iron, o.cx + (along ? k * L : 0), o.cy + (along ? 0 : k * L), 0));
  },
  cone(G, h, bk, o) {
    // A training cone.
    const THREE = MG3.T;
    mgBox(G, o.rin * 2.1, 0.06, o.rin * 2.1, mgMat({ color: 0xff7a1a, roughness: 0.6 }), o.cx, o.cy, 0);
    mgAt(G, mgMesh(new THREE.ConeGeometry(o.rin * 0.9, 0.95, 20), mgMat({ color: 0xff7a1a, roughness: 0.55 })), o.cx, o.cy, 0.53);
    mgAt(G, mgMesh(new THREE.CylinderGeometry(o.rin * 0.5, o.rin * 0.62, 0.14, 20), mgMat({ color: 0xffffff, roughness: 0.5 })), o.cx, o.cy, 0.5);
  },
  toy(G, h, bk, o) {
    // A toy building block with studs on top, in its own colour.
    const THREE = MG3.T;
    const cols = [0xe63946, 0xffb703, 0x219ebc, 0x2a9d8f, 0x9b5de5];
    const col = cols[Math.abs(Math.round(o.cx * 7 + o.cy * 3)) % cols.length];
    const mat = mgMat({ color: col, roughness: 0.35 });
    mgBox(G, o.w, 0.9, o.d, mat, o.cx, o.cy, 0);
    const studs = [];
    [-0.25, 0.25].forEach(a => [-0.25, 0.25].forEach(b2 => studs.push({ p: [o.cx + a * o.w, 0.97, -(o.cy + b2 * o.d)], s: [1, 1, 1] })));
    mgInstances(G, new THREE.CylinderGeometry(o.w * 0.14, o.w * 0.14, 0.14, 16), mat, studs, true);
  },
  pen(G, h, bk, o) {
    // The giraffes' paddock: a wooden fence round sand, an acacia and two giraffes.
    const THREE = MG3.T;
    const sand = mgFlat(mgShape(bk.poly), mgMat({ map: mgTex('sand', 1, 1), roughness: 1 }), 0.012, 3);
    G.add(sand);
    const wood = mgMat({ map: mgTex('bark', 1, 1), roughness: 0.85 });
    const posts = [], rails = [];
    bk.poly.forEach((p, i) => {
      const q = bk.poly[(i + 1) % bk.poly.length];
      const L = Math.hypot(q[0] - p[0], q[1] - p[1]), n = Math.max(1, Math.round(L / 0.9));
      for (let k = 0; k < n; k++) posts.push({ p: [p[0] + (q[0] - p[0]) * k / n, 0.4, -(p[1] + (q[1] - p[1]) * k / n)], s: [1, 1, 1] });
      [0.3, 0.65].forEach(hy => G.add(mgBar(p[0], p[1], q[0], q[1], 0.08, 0.08, wood, hy)));
    });
    mgInstances(G, new THREE.CylinderGeometry(0.07, 0.08, 0.8, 6), wood, posts, true);
    MG_DECO.acacia(G, h, { x: o.cx + o.w * 0.2, y: o.cy + o.d * 0.25, base: 0 });
    MG_DECO.giraffe(G, h, { x: o.cx - o.w * 0.15, y: o.cy - o.d * 0.1, r: 0.6, base: 0 });
