<script>
/* ============================================================================
   حرب السفن — BATTLESHIP on the phones, the TV, and against the phone
   ----------------------------------------------------------------------------
   The rules are Battleship.js (shared with the rooms server) and, in rooms,
   RoomBattleship.js. This file draws the sea and plays it:

   - The sea (bsView*): one view per page, moved into whichever screen shows a
     sea (the one-phone board, a room phone, the TV), so there is only ever one
     WebGL renderer, and it is thrown away when the last such screen is left
     (onLeaveScreen). With three.js (loadThree in JS_Three.html) it is a real
     3D sea: moving water (two scrolling normal maps under a sky's reflection),
     crafted low-poly ships, a shell arcing over, a splash on a miss, fire and
     smoke on a hit, a ship listing and settling when it sinks. Seen from above
     at an angle; the camera glides to the sea being fired at. Without WebGL -
     or while three.js can't load - the same sea is a clean flat board.
   - Placing (both): drag a ship, tap it to turn it, 🎲 for a random fleet. A
     ship dropped where it touches another goes back where it was.
   - Firing: tap a square to aim (its name shows, "B7"), tap it again or press
     Fire. The shot flies before its result is shown anywhere on the page.

   What each screen shows is a "model" (bsViewModel): two seas side by side
   (side 0 is yours - or the first seat's for anyone watching - side 1 the
   other), which one the camera frames, the fleets that may be drawn (your own;
   a ship once it has sunk; everything once the game is over), and the newest
   shot, which is animated once and only once per phone.

   The owner's look (23 Sep 2026): "like the bowling and golf" - real 3D, not
   the flat drawings they called "a pixeled game from the 80s".
   ========================================================================= */

const BS_SEA_X = 6.6;             // each sea's centre, left and right of the middle
const BS_SIDE_COL = ['#3b82f6', '#f97316'];   // side 0 (you / the first seat), side 1

const bsT = (key, vars) => {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || key;
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
};
const bsShipLabel = (i) => bsShipName(i, appState.lang === 'en' ? 'en' : 'ar');
const bsShipShort = (i) => bsShipName(i, appState.lang === 'en' ? 'en' : 'arShort');
// A square's name inside a translated line keeps its own order ("B7", not "7B").
const bsCoordIso = (cell) => '⁦' + bsCoord(cell) + '⁩';

/**
 * The sea just before its newest shot, worked out from the sea after it and
 * the shot itself: the square back to water, and on a sinking the ship back to
 * hits and the water round it unmarked (unless another sunk ship marked it).
 */
function bsSeaBefore(sea, last) {
  const grid = sea.grid.slice();
  let sunk = (sea.sunk || []).slice();
  if (!last || typeof last.cell !== 'number') return { grid: grid, sunk: sunk };
  if (last.res === 'sunk' && typeof last.ship === 'number') {
    const p = sunk.find(x => x.i === last.ship);
    sunk = sunk.filter(x => x.i !== last.ship);
    if (p) {
      const cells = bsShipCells(p, BS_SHIPS[p.i].len);
      const kept = new Set();
      sunk.forEach(q => bsShipCells(q, BS_SHIPS[q.i].len).forEach(c => { kept.add(c); bsNeighbours(c).forEach(n => kept.add(n)); }));
      cells.forEach(c => {
        grid[c] = BS_HIT;
        bsNeighbours(c).forEach(n => { if (grid[n] === BS_CLEAR && !kept.has(n)) grid[n] = BS_SEA; });
      });
    }
  }
  grid[last.cell] = BS_SEA;
  return { grid: grid, sunk: sunk };
}

/**
 * Seat k's sea as the table may see it now: while the shell of the last shot is
 * still in the air, the sea it falls on is shown as it was before (its ships
 * afloat, its fleet list), so nothing tells the result before the landing.
 */
function bsSeaShown(seas, k, last, flying) {
  return flying && last && typeof last.cell === 'number' && k === 1 - last.seat ? bsSeaBefore(seas[k], last) : seas[k];
}

/** A score as the table may see it: the win the last shot brought counts once its shell has landed. */
function bsScoreShown(score, k, last, flying, over) {
  return flying && over && last && k === last.seat ? Math.max(0, (score || 0) - 1) : (score || 0);
}

/* --- sounds, made like the soundboard's (JS_Sounds.html) -------------------------- */

function bsSound(kind) {
  try {
    if (typeof fxCtx !== 'function' || typeof fxTone !== 'function' || typeof fxNoise !== 'function') return;
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'fire') {
      // The gun: a deep thump and a crack.
      fxTone('sine', [[0, 120], [0.25, 38]], [[0, 0], [0.005, 0.5], [0.3, 0.001]], at);
      fxNoise('lowpass', 1400, 0.7, [[0, 0], [0.004, 0.35], [0.22, 0.001]], at);
    } else if (kind === 'whistle') {
      fxTone('sine', [[0, 1500], [0.8, 520]], [[0, 0], [0.1, 0.05], [0.7, 0.06], [0.85, 0.001]], at);
    } else if (kind === 'splash') {
      fxNoise('lowpass', 900, 0.6, [[0, 0], [0.01, 0.32], [0.5, 0.001]], at);
      fxNoise('bandpass', 2600, 1.2, [[0, 0], [0.03, 0.06], [0.35, 0.001]], at + 0.05);
      for (let i = 0; i < 4; i++) fxTone('sine', [[0, 500 + i * 140], [0.06, 900 + i * 160]], [[0, 0], [0.005, 0.05], [0.07, 0.001]], at + 0.25 + i * 0.07);
    } else if (kind === 'boom') {
      fxTone('sine', [[0, 90], [0.6, 28]], [[0, 0], [0.006, 0.6], [0.7, 0.001]], at);
      fxNoise('lowpass', 2200, 0.6, [[0, 0], [0.004, 0.45], [0.9, 0.001]], at);
      fxNoise('highpass', 3000, 0.7, [[0, 0], [0.002, 0.08], [0.15, 0.001]], at);
    } else if (kind === 'sink') {
      fxNoise('lowpass', 260, 0.8, [[0, 0], [0.2, 0.32], [1.8, 0.001]], at);
      fxTone('sawtooth', [[0, 110], [1.6, 42]], [[0, 0], [0.1, 0.06], [1.7, 0.001]], at);
      for (let i = 0; i < 7; i++) fxTone('sine', [[0, 300 + Math.random() * 400], [0.05, 700 + Math.random() * 500]], [[0, 0], [0.004, 0.05], [0.06, 0.001]], at + 0.5 + i * 0.16);
    } else if (kind === 'place') {
      fxTone('triangle', [[0, 240], [0.08, 150]], [[0, 0], [0.005, 0.18], [0.12, 0.001]], at);
      fxNoise('lowpass', 1200, 0.8, [[0, 0], [0.003, 0.08], [0.05, 0.001]], at);
    } else if (kind === 'turn') {
      fxTone('triangle', [[0, 520], [0.06, 700]], [[0, 0], [0.005, 0.1], [0.09, 0.001]], at);
    } else if (kind === 'refuse') {
      fxTone('square', [[0, 180]], [[0, 0], [0.005, 0.05], [0.08, 0.001]], at);
      fxTone('square', [[0, 150]], [[0, 0], [0.005, 0.05], [0.1, 0.001]], at + 0.11);
    } else if (kind === 'aim') {
      fxTone('sine', [[0, 880]], [[0, 0], [0.004, 0.05], [0.06, 0.001]], at);
    }
  } catch (e) {}
}

/* ============================================================================
   The 3D sea
   ========================================================================= */

/** A seeded source, so textures and the ships' details come out the same every time. */
function bsRand(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function bsCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}

/**
 * A tileable normal map for the water: a height field of sine waves whose
 * directions are whole numbers of waves across the tile, so it repeats with
 * no seam, turned into normals.
 */
function bsWaterNormals(seed, size, waves) {
  const r = bsRand(seed);
  const n = size;
  const hgt = new Float32Array(n * n);
  const list = [];
  for (let k = 0; k < waves; k++) {
    const fx = Math.round((r() - 0.5) * 2 * (2 + k)), fy = Math.round((r() - 0.5) * 2 * (2 + k)) || 1;
    list.push([fx, fy, 1 / (1 + k * 0.55), r() * Math.PI * 2]);
  }
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      let v = 0;
      for (const [fx, fy, a, ph] of list) v += a * Math.sin((fx * x + fy * y) / n * Math.PI * 2 + ph);
      hgt[y * n + x] = v;
    }
  }
  const [c, g] = bsCanvas(n, n);
  const img = g.createImageData(n, n);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const l = hgt[y * n + ((x - 1 + n) % n)], rr = hgt[y * n + ((x + 1) % n)];
      const u = hgt[((y - 1 + n) % n) * n + x], d = hgt[((y + 1) % n) * n + x];
      let nx = (l - rr) * 1.6, ny = (u - d) * 1.6, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      nx /= len; ny /= len; nz /= len;
      const i = (y * n + x) * 4;
      img.data[i] = Math.round((nx * 0.5 + 0.5) * 255);
      img.data[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      img.data[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/** A soft round sprite for the particles: fire and splash (smooth), smoke (a lumpy puff). */
function bsPuffCanvas(lumpy) {
  const [c, g] = bsCanvas(64, 64);
  if (!lumpy) {
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,255,255,0.75)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
    return c;
  }
  const r = bsRand(17);
  for (let k = 0; k < 9; k++) {
    const x = 20 + r() * 24, y = 20 + r() * 24, rad = 10 + r() * 12;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, 'rgba(255,255,255,0.55)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  }
  return c;
}

/** The carrier's flight deck: dark, with its lines and its number. */
function bsCarrierDeck() {
  const [c, g] = bsCanvas(512, 96);
  g.fillStyle = '#3a4048'; g.fillRect(0, 0, 512, 96);
  const r = bsRand(5);
  for (let k = 0; k < 400; k++) { g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '0,0,0'},${0.03 + r() * 0.05})`; g.fillRect(r() * 512, r() * 96, 2 + r() * 8, 1 + r() * 2); }
  g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 3; g.setLineDash([16, 12]);
  g.beginPath(); g.moveTo(24, 48); g.lineTo(488, 48); g.stroke();
  g.setLineDash([]); g.strokeStyle = 'rgba(250,204,21,0.85)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(10, 8); g.lineTo(502, 8); g.moveTo(10, 88); g.lineTo(502, 88); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(120, 20); g.lineTo(330, 70); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.85)'; g.font = '800 40px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.translate(452, 48); g.rotate(Math.PI / 2); g.fillText('07', 0, 0); g.restore();
  return c;
}

/** Foam: white, broken, strongest at the hull's edge - mapped across a hull's outline. */
function bsFoamCanvas() {
  const [c, g] = bsCanvas(256, 64);
  const r = bsRand(29);
  const grd = g.createLinearGradient(0, 0, 0, 64);
  grd.addColorStop(0, 'rgba(255,255,255,0.55)'); grd.addColorStop(0.18, 'rgba(255,255,255,0.12)');
  grd.addColorStop(0.82, 'rgba(255,255,255,0.12)'); grd.addColorStop(1, 'rgba(255,255,255,0.55)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 64);
  for (let k = 0; k < 260; k++) {
    g.fillStyle = `rgba(255,255,255,${0.15 + r() * 0.4})`;
    const y = r() < 0.5 ? r() * 12 : 64 - r() * 12;
    g.beginPath(); g.arc(r() * 256, y, 0.8 + r() * 2.2, 0, 7); g.fill();
  }
  return c;
}

/** A crosshair for the square being aimed at: corner brackets and a soft glow. */
function bsCrossCanvas() {
  const [c, g] = bsCanvas(128, 128);
  g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 9; g.lineCap = 'round';
  const k = 34, a = 12, b = 116;
  [[a, a, 1, 1], [b, a, -1, 1], [a, b, 1, -1], [b, b, -1, -1]].forEach(([x, y, sx, sy]) => {
    g.beginPath(); g.moveTo(x, y + sy * k); g.lineTo(x, y); g.lineTo(x + sx * k, y); g.stroke();
  });
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(14, 14, 100, 100);
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.arc(64, 64, 6, 0, 7); g.fill();
  return c;
}

/** The sky the water reflects, as an environment (a gradient dome and a sun). */
function bsSkyEnv(THREE, pmrem, dark) {
  const s = new THREE.Scene();
  const geo = new THREE.SphereGeometry(50, 32, 16);
  const col = [];
  const pos = geo.attributes.position;
  const top = new THREE.Color(dark ? 0x0b1630 : 0x4d8fd6);
  const hor = new THREE.Color(dark ? 0x3a3552 : 0xe8f2fb);
  const low = new THREE.Color(dark ? 0x05080f : 0x2a5877);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 50;
    const c = y > 0 ? hor.clone().lerp(top, Math.pow(y, 0.6)) : hor.clone().lerp(low, Math.min(1, -y * 3));
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  s.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  if (!dark) {
    const sun = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 8), new THREE.MeshBasicMaterial({ color: 0xf2f6fb }));
    sun.position.set(-30, 26, -24);
    s.add(sun);
  }
  const tex = pmrem.fromScene(s, 0.02).texture;
  s.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  return tex;
}

/* --- the ships ------------------------------------------------------------------- */

/**
 * A hull outline, seen from above: a squared stern with rounded corners, the
 * sides straight, then a pointed bow. u runs along the ship (stern -L/2 to
 * bow +L/2), v across it.
 */
function bsHullShape(THREE, L, b, bow) {
  const s = new THREE.Shape();
  const h = L / 2, r = Math.min(0.08, b * 0.4);
  s.moveTo(-h, -b + r);
  s.quadraticCurveTo(-h, -b, -h + r, -b);
  s.lineTo(h - bow, -b);
  s.quadraticCurveTo(h - bow * 0.2, -b * 0.92, h, 0);
  s.quadraticCurveTo(h - bow * 0.2, b * 0.92, h - bow, b);
  s.lineTo(-h + r, b);
  s.quadraticCurveTo(-h, b, -h, b - r);
  s.closePath();
  return s;
}

/** A hull's size seen from above: its length, half its width, and how long its bow runs. */
function bsHullDims(kind) {
  const L = BS_SHIPS[kind].len - 0.14;
  const b = kind === 0 ? 0.33 : kind === 4 ? 0.26 : kind === 2 ? 0.29 : kind === 3 ? 0.21 : 0.32;
  return { L: L, b: b, bow: Math.min(0.9, L * 0.26) };
}

/** A slab of a shape, `h` tall from y0 up, lying along x. */
function bsSlab(THREE, shape, h, y0, bevel) {
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: h, bevelEnabled: !!bevel, bevelThickness: bevel || 0, bevelSize: bevel || 0, bevelSegments: 1, curveSegments: 6
  });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, y0, 0);
  return geo;
}

/**
 * The materials of one side's ships: steel greys with the side's colour as a
 * stripe and on the turret tops, the red below the waterline (seen as a ship
 * lists), and dark for windows and guns. `charred` is the same set burnt, for
 * a ship that sank.
 */
function bsShipMats(THREE, accent, enemy) {
  const m = (color, rough, metal) => new THREE.MeshStandardMaterial({ color: color, roughness: rough, metalness: metal, flatShading: true });
  const set = {
    hull: m(enemy ? 0x5a6069 : 0x7d8a98, 0.62, 0.25),
    lower: m(0x8f2a26, 0.7, 0.1),
    deck: m(enemy ? 0x7a7f86 : 0x9ea9b4, 0.75, 0.1),
    top: m(enemy ? 0x8a9097 : 0xc3ccd5, 0.55, 0.2),
    dark: m(0x22262d, 0.5, 0.4),
    glass: new THREE.MeshStandardMaterial({ color: 0x1b2a3a, roughness: 0.15, metalness: 0.6 }),
    accent: m(new THREE.Color(accent).getHex(), 0.5, 0.2),
    sub: m(enemy ? 0x2c3038 : 0x323b47, 0.45, 0.35)
  };
  const deckTex = new THREE.CanvasTexture(bsCarrierDeck());
  deckTex.colorSpace = THREE.SRGBColorSpace;
  deckTex.anisotropy = 4;
  set.flight = new THREE.MeshStandardMaterial({ map: deckTex, roughness: 0.85, metalness: 0.05 });
  const burnt = {};
  Object.keys(set).forEach(k => {
    const c = set[k].color.clone().lerp(new THREE.Color(0x1a1512), 0.62);
    burnt[k] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, metalness: 0.05, flatShading: true });
  });
  set.charred = burnt;
  return set;
}

/**
 * One ship, built from simple shapes but crafted: a hull with a flared bow,
 * a deck, and what makes each kind recognisable - the carrier's flight deck,
 * island and parked jets; the battleship's three turrets, tower and funnel;
 * the cruiser's gun and radar mast; the submarine's low hull and sail; the
 * destroyer's single gun. Lies along +x, its middle at the origin, the
 * waterline at y = 0. `kind` is the ship's index in BS_SHIPS.
 */
function bsBuildShip(THREE, kind, mats) {
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z, shadow) => {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x || 0, y || 0, z || 0);
    mesh.castShadow = shadow !== false;
    mesh.receiveShadow = true;
    g.add(mesh);
    return mesh;
  };
  const len = BS_SHIPS[kind].len;
  const L = len - 0.14;
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cyl = (rt, rb, h, seg) => new THREE.CylinderGeometry(rt, rb, h, seg || 10);
  const turret = (x, y, dir, barrels, size) => {
    const s = size || 1;
    const tur = new THREE.Group();
    const base = new THREE.Mesh(cyl(0.13 * s, 0.15 * s, 0.05, 12), mats.top);
    base.castShadow = true;
    tur.add(base);
    const house = new THREE.Mesh(box(0.24 * s, 0.1 * s, 0.22 * s), mats.top);
    house.position.set(0.01 * s, 0.07 * s, 0);
    house.castShadow = true;
    tur.add(house);
    const cap = new THREE.Mesh(box(0.2 * s, 0.02, 0.18 * s), mats.accent);
    cap.position.set(0.01 * s, 0.13 * s, 0);
    tur.add(cap);
    for (let k = 0; k < barrels; k++) {
      const b = new THREE.Mesh(cyl(0.017 * s, 0.02 * s, 0.34 * s, 6), mats.dark);
      b.rotation.z = -Math.PI / 2;
      b.position.set(0.28 * s, 0.075 * s, (k - (barrels - 1) / 2) * 0.06 * s);
      b.castShadow = true;
      tur.add(b);
    }
    tur.position.set(x, y, 0);
    tur.rotation.y = dir;
    g.add(tur);
    return tur;
  };

  if (kind === 3) {
    // The submarine: a long low body, mostly under water, and its sail.
    const body = new THREE.CapsuleGeometry(0.21, L - 0.42, 6, 14);
    body.rotateZ(Math.PI / 2);
    body.scale(1, 0.82, 1);
    add(body, mats.sub, 0, -0.03, 0);
    const deck = box(L * 0.62, 0.03, 0.14);
    add(deck, mats.sub, 0.08, 0.13, 0);
    const sailShape = new THREE.Shape();
    sailShape.moveTo(-0.26, -0.08); sailShape.lineTo(0.16, -0.08);
    sailShape.quadraticCurveTo(0.3, 0, 0.16, 0.08); sailShape.lineTo(-0.26, 0.08);
    sailShape.quadraticCurveTo(-0.34, 0, -0.26, -0.08);
    add(bsSlab(THREE, sailShape, 0.24, 0.12), mats.sub, 0.3, 0, 0);
    add(box(0.05, 0.015, 0.36), mats.sub, 0.36, 0.28, 0);
    add(cyl(0.012, 0.012, 0.16, 6), mats.dark, 0.26, 0.42, 0);
    add(box(0.18, 0.02, 0.26), mats.accent, 0.35, 0.365, 0);
    const fin = new THREE.Shape();
    fin.moveTo(0, 0); fin.lineTo(0.22, 0); fin.lineTo(0.02, 0.2); fin.closePath();
    const finGeo = new THREE.ExtrudeGeometry(fin, { depth: 0.025, bevelEnabled: false });
    finGeo.translate(0, 0, -0.0125);
    add(finGeo, mats.sub, -L / 2 + 0.02, 0.05, 0);
    return g;
  }

  const b = bsHullDims(kind).b;
  const bow = bsHullDims(kind).bow;
  const outline = bsHullShape(THREE, L, b, bow);
  add(bsSlab(THREE, outline, 0.16, -0.2, 0.02), mats.lower, 0, 0, 0);
  add(bsSlab(THREE, bsHullShape(THREE, L, b + 0.012, bow), 0.03, -0.045), mats.dark, 0, 0, 0, false);
  add(bsSlab(THREE, bsHullShape(THREE, L, b + 0.018, bow), 0.15, -0.015, 0.012), mats.hull, 0, 0, 0);
  add(bsSlab(THREE, bsHullShape(THREE, L - 0.06, b - 0.035, bow * 0.95), 0.015, 0.135), mats.deck, 0, 0, 0, false);
  // The side's colour, a stripe along the hull under the deck.

  const col = new Float32Array(max * 4);

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('pcolor', new THREE.BufferAttribute(col, 4).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('psize', new THREE.BufferAttribute(size, 1).setUsage(THREE.DynamicDrawUsage));

    uniforms: { uScale: { value: 400 }, uMap: { value: sprite } },
    vertexShader: `
      attribute vec4 pcolor; attribute float psize; varying vec4 vColor; uniform float uScale;
      void main() { vColor = pcolor; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = psize * uScale / max(0.1, -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `
      varying vec4 vColor; uniform sampler2D uMap;
      void main() { vec4 sp = texture2D(uMap, gl_PointCoord); float a = sp.a * vColor.a; if (a < 0.004) discard;
        gl_FragColor = vec4(vColor.rgb * ${additive ? 'a' : '1.0'}, ${additive ? '1.0' : 'a'}); }`,
    transparent: true,

    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending

    x: new Float32Array(max * 3), v: new Float32Array(max * 3),
    age: new Float32Array(max), life: new Float32Array(max), s0: new Float32Array(max), s1: new Float32Array(max),
    c: new Float32Array(max * 4), kind: new Uint8Array(max), on: new Uint8Array(max)

    const i = P.next;

    P.v[i * 3] = vx; P.v[i * 3 + 1] = vy; P.v[i * 3 + 2] = vz;
    P.c[i * 4] = r; P.c[i * 4 + 1] = g; P.c[i * 4 + 2] = b; P.c[i * 4 + 3] = a;
  };

  // 2 water (thrown up, falls), 3 spark (falls fast), 4 flash (a moment, big).

      const t = P.age[i] / P.life[i];
      if (t >= 1) { P.on[i] = 0; size[i] = 0; continue; }
      live++;

      const vi = i * 3;
      if (k === 2 || k === 3) P.v[vi + 1] -= (k === 3 ? 7 : 9.5) * dt;
      else if (k === 0) { P.v[vi + 1] += 0.6 * dt; P.v[vi] *= 0.97; P.v[vi + 2] *= 0.97; }
      else if (k === 1) { P.v[vi] += 0.12 * dt; P.v[vi] *= 0.99; P.v[vi + 2] *= 0.99; }

    geo.attributes.psize.needsUpdate = true;
