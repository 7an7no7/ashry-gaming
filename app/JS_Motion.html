<script>
/* ============================================================================
   MOTION — the moments that carry something from one place to the next
   ----------------------------------------------------------------------------
   The intro (introExit in JS_Core.html) set the idea: the logo doesn't vanish
   and reappear, it flies to where it lives. The same idea, used where the
   player has just done something (Style.html section 14):
   - a game's icon flies from the card you tapped to the top of its screen;
   - when a room deals a game, every phone and the TV show the game big for a
     moment, and its icon flies into the header;
   - the bottom bar's highlight slides to the tab you picked;
   - a room's code drops in letter by letter, and whoever joins pops in;
   - scores count up, and players slide to their new places on the board;
   - a vote's bars grow one at a time, the winner's last;
   - a round's result card lies face down for a beat ("the spy was…"), then
     turns over;
   - the end of a game puts the top three on a podium that rises 3-2-1;
   - a letter spins in like a slot machine;
   - a pass-the-phone role shows only while a finger holds the card;
   - going back, a game's icon flies home to the card it was opened from.
   A reveal plays once per thing on this phone (motionFirst): a room redraws a
   screen for reasons the table never sees, and a redraw shows it settled.
   Nothing here moves by itself, all of it stays still under reduced motion,
   and every end state is also set by a timer - an animation event is never
   the only path (see GEMINI.md).
   ========================================================================= */

const motionOff = () => reducedMotion() || document.hidden;

/**
 * Where an element will be once the animations it rides on have finished (its
 * screen sliding in, a card rising): they are seeked to their end, measured and
 * put back in the same task, so nothing is drawn in between and no animation
 * event fires.
 */
function restingRect(el) {
  const riding = (document.getAnimations ? document.getAnimations() : []).filter((a) => {
    const t = a.effect && a.effect.target;
    return t && t.contains && t.contains(el);
  });
  const saved = riding.map((a) => [a, a.currentTime]);
  saved.forEach(([a]) => {
    const end = a.effect.getComputedTiming().endTime;
    if (isFinite(end)) a.currentTime = end;
  });
  const rect = el.getBoundingClientRect();
  saved.forEach(([a, time]) => { if (time !== null) a.currentTime = time; });
  return rect;
}

/**
 * Flies an emoji from a rect on screen onto an element, and shows the element
 * with a small pop when it lands. `arc` lifts the path in the middle, in px.
 *
 * The flight is a Web Animation of transform only, so the browser runs it off
 * the main thread and starts its clock on the first frame it actually draws:
 * a screen that is slow to draw (the home, 600 elements) no longer eats the
 * start of the path or stalls it halfway, which a per-frame script did.
 * It aims at where the element comes to rest (restingRect) rather than
 * chasing it. The ghost is drawn at the larger of the two sizes and only ever
 * scaled down, so the emoji stays sharp.
 */
function flyEmoji(emoji, fromRect, fromFontPx, target, opts) {
  const o = opts || {};
  if (!target || !fromRect || !fromFontPx || motionOff() || !document.body.animate) return false;
  const duration = o.duration || 540;
  const to = restingRect(target);
  if (!to.width) return false;
  const toFont = parseFloat(getComputedStyle(target).fontSize) || fromFontPx;
  const big = Math.max(fromFontPx, toFont);

  const ghost = document.createElement('span');
  ghost.className = 'motion-ghost';
  ghost.style.fontSize = big + 'px';
  const glyph = document.createElement('span');
  glyph.className = 'motion-ghost__glyph';
  if (isArtIcon(emoji)) glyph.innerHTML = iconHtml(emoji); else glyph.textContent = emoji;
  ghost.appendChild(glyph);
  document.body.appendChild(ghost);
  const size = ghost.getBoundingClientRect();
  const fromX = fromRect.left + fromRect.width / 2;
  const fromY = fromRect.top + fromRect.height / 2;
  ghost.style.left = (fromX - size.width / 2) + 'px';
  ghost.style.top = (fromY - size.height / 2) + 'px';
  const dx = to.left + to.width / 2 - fromX;
  const dy = to.top + to.height / 2 - fromY;
  target.classList.add('motion-waiting');

  const flight = ghost.animate([
    { transform: 'translate(0px, 0px) scale(' + (fromFontPx / big) + ')' },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + (toFont / big) + ')' }
  ], { duration: duration, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });
  if (o.arc) {
    glyph.animate([
      { transform: 'translateY(0px)', easing: 'ease-out' },
      { transform: 'translateY(' + (-o.arc) + 'px)', offset: 0.5, easing: 'ease-in' },
      { transform: 'translateY(0px)' }
    ], { duration: duration, fill: 'both' });
  }

  let landed = false;
  const land = () => {
    if (landed) return;
    landed = true;
    ghost.remove();
    target.classList.remove('motion-waiting', 'motion-landed');
    void target.offsetWidth;
    target.classList.add('motion-landed');
    setTimeout(() => target.classList.remove('motion-landed'), 520);
  };
  flight.onfinish = land;
  // Timers too, counted from the first drawn frame; and one that holds even
  // if the tab stops drawing before it starts.
  if (flight.ready) flight.ready.then(() => setTimeout(land, duration + 200)).catch(land);
  setTimeout(land, duration + 1500);
  return true;
}

/* --- 1. A card's icon to its game's screen ---------------------------------- */

/**
 * Measures the tapped card's icon before the screen changes, and returns what
 * to call once it has: the icon flies to the new screen's hero, if it has one
 * (a room-only game opens the name sheet instead, and nothing flies).
 */
function catalogIconFlight(g, fromEl) {
  if (!g || !fromEl || motionOff()) return null;
  const icon = fromEl.querySelector('.gcard__icon, .recent-tile__icon, .tool-icon, .start-card__icon');
  if (!icon) return null;
  const from = icon.getBoundingClientRect();
  const fromFont = parseFloat(getComputedStyle(icon).fontSize);
  // A poster or a first-visit card grows into the game's header as its icon
  // flies there (the owner's look 4A, 3 Oct 2026); a recent tile or a tool row
  // is too small to grow from, and only its icon flies.
  const card = fromEl.matches('.gcard, .start-card') ? fromEl.getBoundingClientRect() : null;
  const radius = card ? getComputedStyle(fromEl).borderTopLeftRadius : '';
  return () => {
    const view = document.getElementById('view-' + appState.currentView);
    const target = view && view.querySelector('.game-hero .game-hero__icon');
    if (card) catalogCardGrow(g, card, radius, view && view.querySelector('.game-hero .game-hero__art'));
    if (target) flyEmoji(g.icon, from, fromFont, target, { duration: 560, arc: 28 });
  };
}

/**
 * A tapped poster becomes the game's header (the owner's look 4A, made smoother
 * on 3 Oct 2026): a view transition, so the browser morphs the card - its place,
 * size and corners - into the setup's art band while the old card fades and the
 * band comes in, and the icon glides on its own path with a little settle. The
 * names are on the two cards only for the moment of the change. False where there
 * is no view transition (iOS before 18) or motion is off: the caller then plays
 * the box and the icon's flight (catalogIconFlight).
 */
function catalogGrowOpen(g, fromEl) {
  if (!g || !fromEl || !fromEl.isConnected || motionOff() || typeof document.startViewTransition !== 'function') return false;
  const icon = fromEl.querySelector('.gcard__icon');
  const name = (el, n) => { if (el) el.style.viewTransitionName = n; };
  let art = null;
  let artIcon = null;
  const done = () => {
    [fromEl, icon, art, artIcon].forEach((el) => name(el, ''));
    document.documentElement.classList.remove('vt-grow');
  };
  name(fromEl, 'game-card');
  name(icon, 'game-icon');
  document.documentElement.classList.add('vt-grow');
  let vt;
  try {
    vt = document.startViewTransition(() => {
      name(fromEl, '');
      name(icon, '');
      const before = appState.currentView;
      g.open();
      const view = appState.currentView !== before && document.getElementById('view-' + appState.currentView);
      art = view ? view.querySelector('.game-hero .game-hero__art') : null;
      artIcon = art ? art.querySelector('.game-hero__icon') : null;
      name(art, 'game-card');
      name(artIcon, 'game-icon');
    });
  } catch (e) {
    done();
    return false;
  }
  vt.finished.then(done, done);
  // Never only the transition's end (GEMINI.md, animationend is never the only path).
  setTimeout(done, 2000);
  return true;
}

/**
 * The way back (the owner, 3 Oct 2026: "the same smooth animation when going
 * back"): the setup's art band shrinks back into the card it came from - the
 * poster, the recent tile or the first visit's card it was opened from, wherever
 * it is on screen - its icon gliding home with it, while the home comes forward
 * from behind. The header's arrow and the bar's tabs come here; the phone's own
 * back swipe does not (Safari slides its own picture for it). False where it
 * can't run (no view transition, motion off, no header on the screen being left):
 * the caller then changes the screen as before, with heroHomeFlight's icon.
 */
function catalogShrinkBack(previous, next, run) {
  if (motionOff() || typeof document.startViewTransition !== 'function') return false;
  if (['menu', 'together', 'tools'].indexOf(next) === -1) return false;
  const leaving = document.getElementById('view-' + previous);
  const art = leaving && leaving.querySelector('.game-hero .game-hero__art');
  if (!art || !art.getClientRects().length) return false;
  const g = (typeof GAME_CATALOG !== 'undefined' ? GAME_CATALOG : []).find((x) => x.setup === previous);
  if (!g) return false;
  const artIcon = art.querySelector('.game-hero__icon');
  const name = (el, n) => { if (el) el.style.viewTransitionName = n; };
  let card = null;
  let cardIcon = null;
  const done = () => {
    [art, artIcon, card, cardIcon].forEach((el) => name(el, ''));
    document.documentElement.classList.remove('vt-back');
  };
  name(art, 'game-card');
  name(artIcon, 'game-icon');
  document.documentElement.classList.add('vt-back');
  let vt;
  try {
    vt = document.startViewTransition(() => {
      name(art, '');
      name(artIcon, '');
      run();
      const home = document.getElementById('view-' + appState.currentView);
      if (!home || appState.currentView !== next) return;
      const kind = catalogReturn.id === g.id ? catalogReturn.kind : '';
      const recent = '.recent-tile[data-game="' + g.id + '"]';
      const poster = '.gcard[data-game="' + g.id + '"], .tool-item[data-game="' + g.id + '"]';
      const sels = kind === 'recent' ? [recent, poster]
        : kind === 'start' ? ['.start-card[data-start="' + g.id + '"]', recent, poster]
        : [poster, recent];
      const onScreen = (el) => {
        const r = el.getBoundingClientRect();
        return r.width > 0 && r.bottom > 0 && r.top < window.innerHeight;
      };
      for (const sel of sels) { card = [...home.querySelectorAll(sel)].find(onScreen) || null; if (card) break; }
      cardIcon = card ? card.querySelector('.gcard__icon, .recent-tile__icon, .start-card__icon, .tool-icon') : null;
      name(card, 'game-card');
      name(cardIcon, 'game-icon');
    });
  } catch (e) {
    done();
    return false;
  }
  vt.finished.then(done, done);
  // Never only the transition's end (GEMINI.md, animationend is never the only path).
  setTimeout(done, 2000);
  return true;
}

/** The game's colour, from the card tapped to the header's art band: one box
 *  scaled with transform from the card's place and size to the band's, then
 *  faded, so the band is under it when it goes. */
function catalogCardGrow(g, from, radius, art) {
  if (!art || !from || motionOff() || !document.body.animate) return;
  const to = restingRect(art);
  if (!to.width || !to.height) return;
  const box = document.createElement('div');
  box.className = 'card-grow';
  box.setAttribute('data-accent', g.accent || 'violet');
  box.style.left = to.left + 'px';
  box.style.top = to.top + 'px';
  box.style.width = to.width + 'px';
  box.style.height = to.height + 'px';
  box.style.borderRadius = radius || '20px';
  document.body.appendChild(box);
  const sx = from.width / to.width;
  const sy = from.height / to.height;
  const dx = from.left - to.left;
  const dy = from.top - to.top;
  const grow = box.animate([
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')', opacity: 1 },
    { transform: 'none', opacity: 1, offset: 0.78 },
    { transform: 'none', opacity: 0 }
  ], { duration: 440, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'both' });
  let gone = false;
  const done = () => { if (gone) return; gone = true; box.remove(); };
  grow.onfinish = done;
  // Never only the animation's end (GEMINI.md, animationend is never the only path).
  setTimeout(done, 800);
}

/* --- 2. A room deals a game -------------------------------------------------- */

/** The game, big, on every phone at once; then its icon flies into the header. */
function playRoomGameStart(state) {
  if (!state || !state.game || motionOff()) return;
  const hub = (typeof ROOM_HUB_GAMES !== 'undefined' ? ROOM_HUB_GAMES : []).find((g) => g.id === state.game);
  if (!hub) return;
  const t = TRANSLATIONS[appState.lang] || {};
  document.querySelectorAll('.game-splash').forEach((el) => el.remove());

  const el = document.createElement('div');
  el.className = 'game-splash' + (state.youAreScreen ? ' game-splash--tv' : '');
  el.setAttribute('data-accent', hub.accent || 'violet');
  el.innerHTML =
    '<div class="game-splash__card">' +
      '<span class="game-splash__icon" aria-hidden="true">' + iconHtml(hub.icon) + '</span>' +
      '<span class="game-splash__name">' + escapeHTML(t[hub.key] || '') + '</span>' +
    '</div>';
  document.body.appendChild(el);
  const icon = el.querySelector('.game-splash__icon');

  let leaving = false;
  const leave = (fast) => {
    if (leaving) return;
    leaving = true;
    const target = document.getElementById('app-title-icon');
    const canFly = !fast && target && (target.textContent || target.firstElementChild) && !document.body.classList.contains('is-fullscreen-view')
      && target.getBoundingClientRect().width > 0;
    if (canFly) {
      const from = icon.getBoundingClientRect();
      const fromFont = parseFloat(getComputedStyle(icon).fontSize);
      icon.style.visibility = 'hidden';
      flyEmoji(hub.icon, from, fromFont, target, { duration: 560 });
    }
    el.classList.add('is-leaving');
    setTimeout(() => el.remove(), fast ? 180 : 420);
  };
  el.addEventListener('click', () => leave(true));
  setTimeout(() => leave(false), 950);
}

/* --- 2b. A list rearranges; it does not redraw ------------------------------
   Every catalog in the app filters by toggling .hidden, which is display:none:
   the most-used gesture on the busiest screen - a filter chip on the home -
   was also the only one in the app with no motion at all. Cards vanished,
   sections collapsed and everything below jumped.

   flipGrid reads where the items are, hands the mutation straight through to
   the caller (so the filtering logic is untouched and still the only thing
   that decides what is shown), reads where they ended up, and runs the
   survivors back from their old place to their new one while the newcomers
   fade up. Transform and opacity only, so it is all on the compositor.

   Positions are measured relative to the container, not the viewport: hiding
   half a grid can make the scroller clamp its own scrollTop, and viewport
   coordinates would read that clamp as every card flying hundreds of pixels.
   A card that really did move most of a screen is faded in rather than flown,
   because a ghost crossing the whole page reads as a glitch, not a move. */
const FLIP_ITEMS = '.gcard, .tool-item, .recent-tile, .daily-strip, .section__head';

function flipGrid(root, mutate, opts) {
  if (typeof mutate !== 'function') return;
  if (!root || motionOff()) { mutate(); return; }
  const items = Array.from(root.querySelectorAll((opts && opts.items) || FLIP_ITEMS));
  if (!items.length) { mutate(); return; }

  const read = () => {
    const base = root.getBoundingClientRect();
    const seen = new Map();
    items.forEach((el) => {
      if (el.classList.contains('hidden')) return;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) return;
      // Root-relative for the delta (scroll-proof), viewport-relative to know
      // whether anyone can actually see it move.
      seen.set(el, { x: r.left - base.left, y: r.top - base.top, vy: r.top, vh: r.height });
    });
    return seen;
  };

  const was = read();
  mutate();
  const now = read();

  root.classList.add('is-flipping');
  // A catalog is several screens long: animating all fifty cards would put
  // fifty layers on the compositor to move things nobody is looking at. Only
  // what is within a screen of the fold is worth a frame.
  const vh = window.innerHeight || 800;
  const far = vh * 1.2;
  let entering = 0;
  now.forEach((to, el) => {
    if (to.vy > vh * 1.5 || to.vy + to.vh < -vh * 0.5) return;
    const from = was.get(el);
    if (from) {
      const dx = from.x - to.x, dy = from.y - to.y;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      if (Math.abs(dy) > far) return;
      el.animate(
        [{ transform: 'translate3d(' + dx + 'px, ' + dy + 'px, 0)' }, { transform: 'translate3d(0, 0, 0)' }],
        { duration: 320, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    } else {
      // Newcomers come up in sequence, capped so a jump from one chip to
      // "all" is a wave and not a queue.
      el.animate(
        [{ opacity: 0, transform: 'translate3d(0, 10px, 0) scale(0.97)' },
         { opacity: 1, transform: 'none' }],
        { duration: 260, delay: Math.min(entering++, 7) * 24,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'backwards' });
    }
  });
  setTimeout(() => root.classList.remove('is-flipping'), 420);
}

/* --- 3. The bottom bar's highlight slides ----------------------------------- */

/** Places the highlight under the active tab; CSS slides it there. */
function syncNavPill() {
  const nav = document.querySelector('.shell__nav');
  if (!nav) return;
  const active = nav.querySelector('.nav-item.is-active');
  // A class list write is a mutation even when nothing changes, and the
  // observer that calls this watches class changes: an unconditional add here
  // ran this every frame, forever. Only touch what actually differs.
  if (!active || !active.offsetWidth) {
    if (nav.classList.contains('has-pill-on')) nav.classList.remove('has-pill-on');
    return;
  }
  const set = (name, value) => { if (nav.style.getPropertyValue(name) !== value) nav.style.setProperty(name, value); };
  set('--pill-x', active.offsetLeft + 'px');
  set('--pill-y', active.offsetTop + 'px');
  set('--pill-w', active.offsetWidth + 'px');
  set('--pill-h', active.offsetHeight + 'px');
  set('--pill-r', getComputedStyle(active).borderTopLeftRadius);
  if (!nav.classList.contains('has-pill')) nav.classList.add('has-pill');
  if (!nav.classList.contains('has-pill-on')) nav.classList.add('has-pill-on');
}

/* --- 5. Scores count up; players slide to their new places ------------------ */

// What each player's score and place were the last time a board was drawn in
// this room and game, so the next board can move from there.
const scoreMemo = { key: '', scores: {}, ranks: {} };

function countUp(el, from, to) {
  if (!el) return;
  const duration = 720;
  let t0 = null;
  let done = false;
  el.textContent = from;
  const end = () => {
    if (done) return;
    done = true;
    el.textContent = to;
    el.classList.remove('motion-landed');
    void el.offsetWidth;
    el.classList.add('motion-landed');
    setTimeout(() => el.classList.remove('motion-landed'), 520);
  };
  const step = (now) => {
    if (done) return;
    // The clock starts on the first frame drawn, not when this was called: a
    // board that is slow to draw used to open with the number a third of the
    // way up already.
    if (t0 === null) { t0 = now; setTimeout(end, duration + 250); }
    const k = Math.min(1, (now - t0) / duration);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
    else end();
  };
  setTimeout(() => requestAnimationFrame(step), 180);
  setTimeout(end, duration + 1500);          // a tab that stops drawing still gets the number
}

/** Every scoreboard drawn since the last look: count up what rose, slide who moved. */
function animateScoreboards(state) {
  if (!state || !state.game) return;
  const key = state.code + '|' + state.game;
  if (scoreMemo.key !== key) {
    scoreMemo.key = key;
    scoreMemo.scores = {};
    scoreMemo.ranks = {};
  }
  const still = motionOff();
  document.querySelectorAll('.scoreboard:not([data-seen])').forEach((board) => {
    if (!board.getClientRects().length) return;        // not on screen; its turn comes when it is
    board.dataset.seen = '1';
    const rows = [...board.querySelectorAll('[data-pid]')];
    if (!rows.length) return;
    // Scores that went down mean a new game started: remember, don't animate.
    const reset = rows.some((r) => scoreMemo.scores[r.dataset.pid] > Number(r.dataset.score));
    const step = rows.length > 1 ? rows[1].offsetTop - rows[0].offsetTop : 0;
    rows.forEach((row, i) => {
      const pid = row.dataset.pid;
      const now = Number(row.dataset.score);
      const was = scoreMemo.scores[pid];
      if (still || reset || was === undefined) return;
      if (now > was) countUp(row.querySelector('[data-count]'), was, now);
      const oldRank = scoreMemo.ranks[pid];
      if (oldRank !== undefined && oldRank !== i && step > 0 && row.animate) {
        row.animate(
          [{ transform: 'translateY(' + ((oldRank - i) * step) + 'px)' }, { transform: 'none' }],
          { duration: 680, delay: 160, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' }
        );
      }
    });
    rows.forEach((row, i) => {
      scoreMemo.scores[row.dataset.pid] = Number(row.dataset.score);
      scoreMemo.ranks[row.dataset.pid] = i;
    });
  });
}

/* --- 6. Once per thing, not once per redraw -------------------------------- */

const motionSeen = new Set();

/** True the first time `key` is drawn on this phone with motion on. */
function motionFirst(key) {
  if (motionSeen.has(key)) {
    // Drawn again: it is in use, so it moves to the newest end.
    motionSeen.delete(key);
    motionSeen.add(key);
    return false;
  }
  if (motionOff()) return false;
  // Forget the oldest key only (a Set keeps insertion order): clearing them all
  // would also forget the reveal on screen, and its next redraw would replay it.
  if (motionSeen.size >= 300) motionSeen.delete(motionSeen.values().next().value);
  motionSeen.add(key);
  return true;
}

/**
 * Runs fn once the reveals just drawn into el have had their moment (the card
 * turning over, the winner reaching the top of the podium), so the confetti
 * lands with the answer rather than before it.
 */
function afterReveal(el, fn) {
  const waits = el ? [...el.querySelectorAll('[data-reveal-ms]')].map((x) => Number(x.dataset.revealMs) || 0) : [];
  const wait = Math.max(0, ...waits);
  if (wait) setTimeout(fn, wait); else fn();
}

/* --- 7. Vote results build suspense ------------------------------------------ */

/**
 * When each result row grows, in ms: from the bottom of the list up, the
 * winning row (or the highlighted one) last, after a beat. Empty when this
 * result was already shown on this phone.
 */
function voteRevealTimes(key, rows, isWin, delay) {
  if (!motionFirst(key)) return null;
  const order = rows.filter((r) => !isWin(r)).reverse().concat(rows.filter(isWin));
  const step = order.length > 1 ? Math.min(420, Math.round(1500 / (order.length - 1))) : 0;
  const beat = order.some((r) => !isWin(r)) ? 380 : 0;
  const times = new Map();
  order.forEach((r, k) => times.set(r, (delay || 0) + k * step + (isWin(r) ? beat : 0)));
  times.total = Math.max(0, ...times.values()) + 1000;
  return times;
}

/* --- 8. The spy was… --------------------------------------------------------- */

// The card lies face down for SPY_REVEAL_BEAT_MS, turns over, and is edge-on
// (the cover goes) halfway through the turn. Style.html has the same numbers.
const SPY_REVEAL_BEAT_MS = 1100;
const SPY_REVEAL_MS = 1660;

/**
 * The face-down cover for a round's result card, the first time this round's
 * result is drawn on this phone: `cls` and `attrs` go on the card, `cover`
 * first inside it. All empty afterwards.
 */
function spyRevealParts(key, label, after) {
  if (!motionFirst(key)) return { cls: '', attrs: '', cover: '', ms: 0, at: 0 };
  // `after`: the whole turn waits this long (the vote's bars rise first, roomSpyVoteBars);
  // the caller puts it on the card as --cover-at (Style.html, section 14).
  const at = Math.max(0, Math.round(Number(after) || 0));
  // Three soft ticks while it lies face down: a drumroll the table hears together.
  [0, 380, 760].forEach((ms) => setTimeout(() => { if (!document.hidden) playSound('tick'); }, at + ms));
  // The cover is taken away by its animation; a timer takes it away too, since
  // an animation that never runs (a hidden tab, a stalled compositor) never ends
  // (the design review, 26 Sep 2026: every end state also set by a timer).
  const coverId = 'sr' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  // A card whose turn is held back (سكرو's thief waits for the votes) is still
  // running then: looked at again, up to a few seconds more.
  const sweep = (tries) => {
    document.querySelectorAll('[data-cover-id="' + coverId + '"]').forEach((el) => {
      const busy = !document.hidden && el.getAnimations && el.getAnimations().some((a) => a.playState === 'running' || a.playState === 'pending');
      if (busy && tries > 0) setTimeout(() => sweep(tries - 1), 500);
      else el.remove();
    });
  };
  setTimeout(() => sweep(12), at + SPY_REVEAL_MS + 250);
  return {
    cls: 'spy-reveal',
    attrs: 'data-reveal-ms="' + (at + SPY_REVEAL_MS) + '"',
    cover: '<div class="spy-reveal__cover" data-cover-id="' + coverId + '" aria-hidden="true">' +
             '<span class="spy-reveal__q">?</span>' +
             '<span class="spy-reveal__label">' + escapeHTML(label || '') + '</span>' +
           '</div>',
    ms: at + SPY_REVEAL_MS,
    at: at
  };
}

/* --- 8b. The spy himself ----------------------------------------------------- */

/*
   The living spy (the owner, 27 Sep 2026, the cast of المشنقة's man): a flat
   cartoon in a trench coat, a hat and dark glasses who stands behind the result
   card of الجاسوس, الحرباء, الموقع السري and الفنان المزيف. While the card lies
   face down he peeks over its top edge, peering over his glasses («مش أنا…»);
   as it turns over he steps out and plays the verdict:
     caught  - the handcuffs snap on (a click), the hat falls off, he sulks («يااااه»);
     escaped - a wink and a wave («سلامو عليكو!»), then he tiptoes off the edge of
               the screen (a whoosh), leaving his footprints;
     ask     - one phone's الجاسوس has no vote: he stands there looking innocent and
               the table taps «اتمسك» or «هرب» under him (spcVerdict).
   One drawing, a `kind` for the game: 'spy', 'chameleon' (a chameleon's green coat
   with spots), 'spyfall' (a suitcase), 'fake' (a beret, a brush and paint on the coat).
   A layer on the card: the verdict comes from what the result already says.
   Style.html section «the living spy» has the timelines (SPC_T below, in ms).
*/
const SPC_T = { caught: 4200, escaped: 6600, ask: 2200 };
// When the verdict starts, when the stand-out finishes: a verdict tapped on the
// «ask» figure starts from here (he is already standing).
const SPC_AFTER_STEP = { caught: 1850, escaped: 2180 };
const SPC_SOUND = { caught: [2200, 'spyCuffs'], escaped: [3830, 'spyWhoosh'] };
const spcLive = new Map();

      <g class="spc-fig"><g class="spc-body">

        <path class="spc-coat spc-ink" d="M46 60 Q60 55 74 60 L80 104 Q60 108.5 40 104 Z"/>
        ${spots}
        <path class="spc-belt" d="M42.7 84 H77.3 L77.9 89 H42.1z"/><rect class="spc-buckle spc-ink" x="57" y="83.6" width="6" height="5.8" rx="1"/>

        <g class="spc-cuffs"><circle class="spc-cuff" cx="56" cy="92" r="3.3"/><circle class="spc-cuff" cx="64" cy="92" r="3.3"/><path class="spc-cuff spc-chain" d="M59.3 92 h1.4"/></g>
        <g class="spc-head">
          <circle class="spc-skin spc-ink" cx="60" cy="44" r="12"/>

          <g class="spc-eyes"><circle class="spc-eye" cx="55" cy="41" r="1.5"/><circle class="spc-eye spc-eye--r" cx="65" cy="41" r="1.5"/></g>
          <path class="spc-wink spc-ink" d="M62.6 41.4 Q65 39.4 67.4 41.4"/>
          <path class="spc-brows spc-ink" d="M52 36.5 L58 38.6 M68 36.5 L62 38.6"/>
          <g class="spc-glasses"><rect class="spc-lens spc-ink" x="50" y="40" width="9" height="6" rx="2.5"/><rect class="spc-lens spc-ink" x="61" y="40" width="9" height="6" rx="2.5"/><path class="spc-ink spc-thin" d="M59 42.3 H61 M50 42 L47.6 40.6 M70 42 L72.4 40.6"/><path class="spc-glint" d="M52 41.6 H54.6 M63 41.6 H65.6"/></g>
          <path class="spc-mouth spc-mouth--smirk spc-ink" d="M56 51 Q61 53.6 64.6 50.4"/>

      </g></g>
      ${verdict === 'ask' || verdict === 'caught' || verdict === 'escaped' ? bub('spc-bub--peek', t.spc_bub_peek) : ''}
      ${verdict === 'caught' ? bub('spc-bub--end', t.spc_bub_caught) : verdict === 'escaped' ? bub('spc-bub--end', t.spc_bub_escaped) : ''}

/**
 * The spy behind a result card: put it straight before the card (or above a TV's
 * result line). `key` is the reveal's own key; `verdict` 'caught', 'escaped' or
 * 'ask' (anything else draws nothing). o: { kind, tv, loud (this screen plays
 * the table's sounds; true by default) }. He peeks for as long as the card lies
 * face down (SPY_REVEAL_BEAT_MS), then plays the verdict. The first time a key is drawn he plays it through
 * (motionFirst); drawn again while it plays, it carries on from where it was
 * (--spc-late); afterwards, and with motion off, he is drawn settled.
 */
function spyCastHtml(key, verdict, o) {
  const opt = o || {};
  if (verdict !== 'caught' && verdict !== 'escaped' && verdict !== 'ask') return '';
  const kind = ['chameleon', 'spyfall', 'fake'].indexOf(opt.kind) !== -1 ? opt.kind : 'spy';
  const k = 'spc|' + (opt.tv ? 'tv|' : '') + key;
  const total = SPC_T[verdict];
  // `after`: he waits this long first, with the card he stands behind (spyRevealParts' `after`).
  const after = Math.max(0, Math.round(Number(opt.after) || 0));
  let late = 0, live = false;
  if (motionFirst(k)) {
    spcLive.set(k, Date.now() + after);
    if (spcLive.size > 40) spcLive.delete(spcLive.keys().next().value);
    live = true;
    late = -after;
    const snd = SPC_SOUND[verdict];
    if (snd && opt.loud !== false) spcSoundLater(snd[1], snd[0] + after);
  } else if (spcLive.has(k) && Date.now() - spcLive.get(k) < total && !motionOff()) {
    late = Date.now() - spcLive.get(k);
    live = true;
  }
  return spcWrapHtml(kind, verdict, live, late, opt.tv ? 'spc--tv ' + (opt.cls || '') : (opt.cls || ''), total);
}

function spcWrapHtml(kind, verdict, live, late, extra, total) {
  const t = TRANSLATIONS[appState.lang] || {};
  const cls = ['spc', 'spc--' + kind, 'spc--' + verdict, live ? 'is-live' : 'is-settled', extra || '',
    !live && verdict === 'escaped' ? 'is-gone' : ''].join(' ');
  const ask = verdict === 'ask'
    ? `<div class="spc-ask"><span class="spc-ask__q">${escapeHTML(t.spc_ask || '')}</span>
         <button type="button" class="btn btn--sm btn--auto btn--danger-soft" onclick="spcVerdict(this, 'caught')">${escapeHTML(t.spc_caught_btn || '')}</button>
         <button type="button" class="btn btn--sm btn--auto btn--ghost" onclick="spcVerdict(this, 'escaped')">${escapeHTML(t.spc_escaped_btn || '')}</button></div>`
    : '';
  // A settle timer too, never only the animation (a hidden tab never runs it).
  // A negative `late` is a wait still to come (spyCastHtml's `after`): a positive delay.
  return `<div class="${cls}" data-spc-kind="${kind}" style="--spc-late: ${-Math.round(late)}ms" ${live ? `data-spc-until="${Date.now() - late + total}"` : ''}>
      ${ask}<div class="spc-stage">${spcFigureSvg(kind, verdict)}</div></div>`;
}

/** A room's outcome as the spy plays it: 'revealed' (the host showed it, no vote) and anything else, nothing. */
function spyCastVerdict(outcome) {
  return outcome === 'caught' ? 'caught' : (outcome === 'escaped' || outcome === 'stole') ? 'escaped' : '';
}

/** The room's one voice: the TV plays the spy's sounds where there is one, else every phone. */
function spyCastLoud(state) {
  return !!(state && (state.youAreScreen || typeof roomHasScreen !== 'function' || !roomHasScreen()));
}

/** The table's sound for the spy, once, if the card is still on screen then. */
function spcSoundLater(name, ms) {
  setTimeout(() => {
    if (document.hidden || !document.querySelector('.spc.is-live')) return;
    if (typeof playFx === 'function') playFx(name);
  }, ms);
}

/** One phone's الجاسوس: the table says whether they caught the spy, and he plays it. */
function spcVerdict(btn, verdict) {
  const box = btn && btn.closest('.spc');
  if (!box) return;
  const kind = box.dataset.spcKind || 'spy';
  const late = motionOff() ? 0 : SPC_AFTER_STEP[verdict];
  const html = spcWrapHtml(kind, verdict, !motionOff(), late, '', SPC_T[verdict]);
  box.outerHTML = html;
  if (!motionOff()) {
    const snd = SPC_SOUND[verdict];
    if (snd) spcSoundLater(snd[1], snd[0] - late);
  }
  if (verdict === 'caught') haptic('double'); else haptic('light');
}

// A live figure is marked settled once its time is up (the end state is also the
// animations' `forwards`, so this only matters where they never ran).
setInterval(() => {
  document.querySelectorAll('.spc.is-live[data-spc-until]').forEach((el) => {
    if (Date.now() >= Number(el.dataset.spcUntil)) {
      el.classList.remove('is-live');
      el.classList.add('is-settled');
    }
  });
}, 1000);

/* The spy's two sounds, not on the soundboard: the handcuffs' double click and a whoosh. */
FX.spyCuffs = (at) => {
  fxNoise('highpass', 3800, 1.4, [[0, 0], [0.004, 0.16], [0.03, 0.001]], at);
  fxTone('square', [[0, 2400], [0.02, 1900]], [[0, 0], [0.003, 0.05], [0.03, 0.001]], at);
  fxNoise('highpass', 4200, 1.6, [[0, 0], [0.004, 0.13], [0.03, 0.001]], at + 0.09);
  fxTone('square', [[0, 2600], [0.02, 2100]], [[0, 0], [0.003, 0.04], [0.03, 0.001]], at + 0.09);
};
FX.spyWhoosh = (at) => {
  const ctx = fxCtx();
  const end = 0.55;
  const buf = fxNoiseBuffer(ctx);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(500, at); f.frequency.exponentialRampToValueAtTime(3200, at + end);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(0.22, at + 0.18); g.gain.exponentialRampToValueAtTime(0.0001, at + end);
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(at); src.stop(at + end + 0.05);
};

/* --- 9. The podium ----------------------------------------------------------- */

/**
 * The top three of a finished game's board on a podium, second on one side of
 * the winner and third on the other. The first time it is drawn, third rises,
 * then second, then the winner. Empty with fewer than two players or nobody
 * scoring, and the caller keeps its plain champion line.
 *
 * opts (the owner's picks of 7 Oct 2026, 939 + 1225):
 * - low: the lowest score wins (سكرو, ميني جولف, كونكان): the rows are ranked
 *   lowest first, whatever order they come in, and 0 or below stands on a step
 *   like any other number - the real numbers are printed, no mirrored board;
 * - unit: a word under each number, in small type (the owner's pick 1226, third batch): a
 *   kind from PODIUM_UNITS' words ('pt', 'stroke', 'miss', 'round', 'win', 'loss', 'pound'),
 *   counted for each number («١٢ نقطة», «٣ ضربات», «٢ غلطة»), or a word printed as it is, or
 *   false for none. Left out, the game's own (podiumUnitOf: نقطة unless the game counts
 *   something else);
 * - noScore: the places are the ranking (the bracket), so no number at all.
 *
 * A high-wins board where only one person scored (1230) gets one raised step: the winner,
 * the crown and the confetti (.podium--solo), so a lone win isn't flatter than a three-way one.
 */
// The games whose numbers aren't points; any other is نقطة. Keyed by the room game's id, or a
// one-phone game's podium code ('bomb'). 'none': the number is a place or a mix (الليزر's
// rounds lasted, the solve engine's ranks).
const PODIUM_UNITS = {
  win: ['bank', 'ludo', 'snakes', 'chairs', 'doubt', 'skull', 'bumper', 'connect4', 'dots', 'xo', 'chess', 'bughouse', 'handbrain', 'votechess', 'guesswho', 'battleship'],
  loss: ['oldmaid'], round: ['bomb'], pound: ['box'], none: ['laser', 'solve', 'tourney']
};
function podiumUnitOf(state) {
  const s = state || {};
  if ((s.shared || {}).tournament) return 'pt';   // the duels' tournament: its table is points
  if (s.game === 'minigolf') return ((s.shared || {}).settings || {}).scoring === 'match' ? 'pt' : 'stroke';
  for (const kind in PODIUM_UNITS) {
    if (PODIUM_UNITS[kind].indexOf(s.game) !== -1 || PODIUM_UNITS[kind].indexOf(s.code) !== -1) return kind;
  }
  return 'pt';
}
/** The word for `n` of a unit: Arabic counts 3-10 in the plural («٣ ضربات») and the rest in the singular. */
function podiumUnitWord(unit, n) {
  if (unit === false || unit === 'none' || unit == null || unit === '') return '';
  const forms = (TRANSLATIONS[appState.lang] || {})['unit_' + unit];
  if (!forms) return String(unit);
  const [one, many] = forms.split('|');
  const k = Math.abs(Number(n) || 0);
  return (appState.lang === 'en' ? k === 1 : !(k >= 3 && k <= 10)) ? one : (many || one);
}
function renderPodium(state, board, opts) {
  const o = opts || {};
  const low = !!o.low;
  const num = (p) => Number(p.score) || 0;
  let all = (board || []).slice();
  if (low) all = all.filter((p) => p && Number.isFinite(Number(p.score))).sort((a, b) => num(a) - num(b));
  // Nobody stands on a step with 0 once somebody scored (a high-wins board only).
  const top = (low ? all : (all[0] && num(all[0]) > 0 ? all.filter((p) => num(p) > 0) : all)).slice(0, 3);
  // A lone winner (1230): two or more played, only one scored.
  const solo = !low && !o.noScore && top.length === 1 && all.length >= 2 && num(top[0]) > 0;
  if ((top.length < 2 && !solo) || (!low && !(num(top[0]) > 0))) return '';
  const rankOf = (p) => 1 + all.filter((x) => (low ? num(x) < num(p) : num(x) > num(p))).length;
  const rise = motionFirst(['podium', roomDealKey(state), state && state.game, JSON.stringify(top)].join('|'));
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const atOf = (i) => 150 + (top.length - 1 - i) * 520;
  const winMs = atOf(0) + 620;
  const unitKind = o.unit === undefined ? podiumUnitOf(state) : o.unit;
  const unitOf = (p) => {
    const w = o.noScore ? '' : podiumUnitWord(unitKind, num(p));
    return w ? '<small class="podium__unit">' + escapeHTML(w) + '</small>' : '';
  };
  return '<div class="podium' + (solo ? ' podium--solo' : '') + (rise ? ' podium--rise" data-reveal-ms="' + winMs + '"' : '"') +
    (solo && rise ? ' data-confetti="' + winMs + '"' : '') + '>' +
    top.map((p, i) => {
      const rank = Math.min(3, rankOf(p));
      return '<div class="podium__place podium__place--' + (i + 1) + ' podium__place--rank' + rank + '" style="--at:' + atOf(i) + 'ms">' +
               '<div class="podium__who">' +
                 '<span class="podium__medal" aria-hidden="true">' + medals[rank] + '</span>' +
                 '<span class="podium__name">' + escapeHTML(p.name) + '</span>' +
                 (o.noScore ? '' : '<span class="podium__score metric">' + num(p) + '</span>' + unitOf(p)) +
               '</div>' +
               '<div class="podium__block"><span class="metric">' + rank + '</span></div>' +
             '</div>';
    }).join('') +
  '</div>';
}

/* --- 9b. The podium's little cheerers ------------------------------------------
   The owner, 27 Sep 2026 (the living characters): a figure of the cast stands on
   every podium step - the winner jumping with both arms up and a crown landing on
   its head, the second clapping and nodding, the third sulking with its arms
   crossed, then shrugging and clapping too (a ten-second loop). The first letter
   of the name is on the shirt, so it reads as that player. Nothing calls this: any
   .podium (renderPodium, the card games', لودو's, بنك الحظ's, the tournament's) or
   .tv-podium put into the page is dressed by the observer below, so every caller
   keeps its markup. The figures rise with their step only when the podium does
   (.podium--rise / .tv-podium--rise, set by the caller's motionFirst key), so a
   redraw shows them settled. A bubble now and then on a phone, never on the TV.
   .podium--plain keeps the old look. Style.html section 44. */
const POD_CAST_HAIR = ['#3b2a1e', '#1f1a17', '#7a3b1d', '#5b3a24', '#2b2320'];
function podCastSvg(rank, letter, hair) {
  const arm = (side) => {
    const x = side === 'l' ? 21 : 39;
    return `<g class="pod-arm pod-arm--${side}"><path class="pod-sleeve" d="M${x} 34 V42"/><path class="pod-sleeve pod-sleeve--in" d="M${x} 34 V42"/><circle class="pod-skin pod-ink" cx="${x}" cy="43" r="3.3"/></g>`;
  };
  return `<svg class="pod-fig pod-fig--r${rank}" viewBox="0 -4 60 88" aria-hidden="true" focusable="false">` +
    '<ellipse class="pod-shadow" cx="30" cy="80" rx="15" ry="2.6"/>' +
    '<g class="pod-jump">' +
      '<g class="pod-legs"><path class="pod-pants pod-ink" d="M22 58 L21 74 L28.5 74 L30 58z"/><path class="pod-pants pod-ink" d="M30 58 L31.5 74 L39 74 L38 58z"/>' +
        '<ellipse class="pod-shoe" cx="24" cy="76.5" rx="5.2" ry="2.9"/><ellipse class="pod-shoe" cx="36" cy="76.5" rx="5.2" ry="2.9"/></g>' +
      '<rect class="pod-shirt pod-ink" x="19" y="30" width="22" height="30" rx="7"/>' +
      `<text class="pod-letter" x="30" y="58" text-anchor="middle">${escapeHTML(letter)}</text>` +
      arm('l') + arm('r') +
      '<g class="pod-cross"><path class="pod-sleeve" d="M20 35 Q23 41.5 37 39.5"/><path class="pod-sleeve pod-sleeve--in" d="M20 35 Q23 41.5 37 39.5"/><path class="pod-sleeve" d="M40 35 Q37 41.5 23 39.5"/><path class="pod-sleeve pod-sleeve--in" d="M40 35 Q37 41.5 23 39.5"/>' +
        '<circle class="pod-skin pod-ink" cx="37.5" cy="39.5" r="3.2"/><circle class="pod-skin pod-ink" cx="22.5" cy="39.5" r="3.2"/></g>' +
      '<g class="pod-head">' +
        '<circle class="pod-skin pod-ink" cx="30" cy="19" r="10.5"/>' +
        `<path class="pod-hair" style="fill:${hair}" d="M19.5 17 Q21 7 30 7.5 Q39 7 40.5 17 Q36 12.5 30 13.5 Q24 12.5 19.5 17z"/>` +
        '<g class="pod-eyes"><circle class="pod-eye" cx="26" cy="19" r="1.6"/><circle class="pod-eye" cx="34" cy="19" r="1.6"/></g>' +
        '<path class="pod-eyes-happy pod-ink" d="M23.5 19.5 Q26 16.5 28.5 19.5 M31.5 19.5 Q34 16.5 36.5 19.5"/>' +
        '<path class="pod-brows pod-ink" d="M23 14.5 L28 16.5 M37 14.5 L32 16.5"/>' +
        '<path class="pod-mouth pod-mouth--grin pod-ink" d="M25 23.5 Q30 30.5 35 23.5z"/>' +
        '<path class="pod-mouth pod-mouth--smile pod-ink" d="M26 24 Q30 27.5 34 24"/>' +
        '<path class="pod-mouth pod-mouth--sulk pod-ink" d="M26.5 26 Q30 22.5 33.5 26"/>' +
        '<path class="pod-mouth pod-mouth--flat pod-ink" d="M26.5 25 H33.5"/>' +
        '<path class="pod-crown pod-ink" d="M22 10 L21.5 1.5 L26 5.5 L30 -1 L34 5.5 L38.5 1.5 L38 10z"/>' +
