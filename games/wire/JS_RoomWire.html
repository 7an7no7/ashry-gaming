<script>
/* ============================================================================
   الحقوا! (first called سلك مقطوع) — the co-op panic game (rooms and the TV), 29 Sep 2026
   ----------------------------------------------------------------------------
   Every phone is a panel of 4-6 controls with funny names (Wire.js), every
   phone gets an order with a draining bar - usually for a control on someone
   else's panel, so it is shouted across the table. The server deals the
   panels, makes every order and judges every change (RoomWire.js); the phone
   draws its own panel (state.you), its own order (shared.orders[me]), the
   level's progress, damage and clock, and plays the moments.

   Each place keeps its own layout, from the owner's picks on the design sheet:
     bus      «تابلوه الميكروباص»: the order on an LED screen with a segment
              timer, metal plates in a grid; the TV's road is the progress,
              the engine's temperature the damage, a ticker of the last order.
     kitchen  «ورقة ماما على التلاجة»: the order a yellow note with a burning
              fuse, pinned in the middle of the controls; the TV split, the
              kitchen and a fridge of every phone's order, plates filling the
              table, smoke rising.
     wedding  «عم الفرح والمكسر»: the uncle shouts the order, a ring round his
              face that angers as it closes, a DJ mixer's faders; the TV's
              stage lights coming on, the guests' faces falling.
   The TV is the one voice (the alarms loud and a bit tense); with no TV the
   host's phone plays them, and every phone shows the damage and the clock.
   Every name here starts with wr / WR_. Section 55 of Style.html.
   ========================================================================= */
const WR_OPTS_KEY = 'wire';
const WR_OPTS_DEFAULT = { place: 'random', surprises: true };
const WR_PLACE_ICON = { bus: '🚐', kitchen: '🍲', wedding: '💃', random: '🎲' };

const wr = {
  gap: Infinity,        // the smallest (receivedAt − serverNow) seen: the server's clock on this phone
  seen: {},             // per deal: the last event seq played
  local: {},            // a control this phone just changed: { v, at } until the server agrees
  loop: 0,              // the rAF painting the bars and the clocks
  el: null,             // the frame the loop paints (the phone's or the TV's)
  tv: false,
  motion: '',           // '' not asked, 'asking', 'on' allowed (listening only while a shake is on: wrMotionSync), 'no' tap only
  listening: false,
  shake: { id: null, n: 0, last: 0, sent: false },
  beepAt: 0,
  tickSec: -1,
  momentTimer: null,
  toastTimer: null,
  hostKey: '',
  noteKey: '',
  fxDrag: null          // a finger on a surprise's cover (792): { fx, x, y, run, total }
};

const wrT = () => TRANSLATIONS[appState.lang] || {};
const wrL = () => (typeof contentLang === 'function' && contentLang() === 'en' ? 'en' : 'ar');
const wrFill = (str, vars) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
const wrIso = (s) => '⁨' + s + '⁩';
function wrOpts() { return recallOptions(WR_OPTS_KEY, WR_OPTS_DEFAULT); }
function wrSetOpt(patch) {
  rememberOptions(WR_OPTS_KEY, patch);
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
}
function wrNoteTime(state) {
  if (state && typeof state.serverNow === 'number' && typeof state.receivedAt === 'number') wr.gap = Math.min(wr.gap, state.receivedAt - state.serverNow);
}
const wrNow = () => (isFinite(wr.gap) ? Date.now() - wr.gap : Date.now());
const wrName = (state, id) => ((state.players || []).find((p) => p.id === id) || {}).name || '';
const wrClockText = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/** The one voice: the TV (the first online screen), else the host's phone. */
function wrIsVoice(state) {
  const screens = (state.screens || []).filter((x) => x.online).map((x) => x.id).sort();
  if (state.youAreScreen) return screens[0] === Room.me;
  return !!state.youAreHost && !screens.length;
}

/* --- the controls ------------------------------------------------------------- */
/** A panel in the order its place lays it out: slides last across (bus, kitchen), faders first (wedding). */
function wrOrdered(place, panel) {
  const kind = (x) => { const c = wireControl(x.c) || {}; return c.t === 'slide' ? 1 : 0; };
  const list = panel.slice();
  if (place === 'wedding') list.sort((a, b) => kind(b) - kind(a));
  else list.sort((a, b) => kind(a) - kind(b));
  return list;
}

function wrCtlHtml(x) {
  const c = wireControl(x.c);
  if (!c) return '';
  const name = escapeHTML(wireName(x.c, wrL()));
  const label = `<b class="wr-ctl__n">${name}</b>`;
  let inner;
  if (c.t === 'btn') {
    inner = `<button type="button" class="wr-btn" style="--c:${c.c}" data-wr-act="press" aria-label="${name}"></button>${label}`;
  } else if (c.t === 'sw') {
    inner = `<button type="button" class="wr-sw" data-wr-act="sw" aria-pressed="false" aria-label="${name}"><span class="wr-sw__b"></span><span class="wr-sw__l"></span></button>${label}`;
  } else if (c.t === 'dial') {
    inner = `<button type="button" class="wr-dial" data-wr-act="dial" aria-label="${name}"><span class="wr-dial__knob"></span><span class="wr-dial__v metric" data-wr-v>1</span></button>${label}`;
  } else {
    const sl = `<div class="wr-sl" data-o="${c.o}" data-wr-act="slide" role="slider" aria-label="${name}" aria-valuemin="1" aria-valuemax="5" tabindex="0" dir="ltr"><div class="wr-sl__tr"></div><div class="wr-sl__th"></div></div>`;
    inner = c.o === 'v'
      ? `${label}${sl}<span class="wr-sl__v" dir="ltr"><span>5</span><span>1</span></span>`
      : `${sl}<span class="wr-sl__v" dir="ltr"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></span>${label}`;
  }
  const cls = 'wr-ctl wr-ctl--' + c.t + (c.t === 'slide' ? ' wr-ctl--' + c.o : '');
  return `<div class="${cls}" data-c="${escapeHTML(x.c)}">${inner}</div>`;
}

/** The uncle of the wedding: glad, or angry once his ring is nearly closed (.is-hurry). */
function wrUncleSvg() {
  return `<svg viewBox="0 0 80 80" aria-hidden="true" focusable="false"><circle cx="40" cy="42" r="30" fill="#f2c4a0" stroke="#221f36" stroke-width="4"/>
    <path d="M14 36 Q16 10 40 10 Q64 10 66 36 Q58 22 40 22 Q22 22 14 36Z" fill="#5a3b2a" stroke="#221f36" stroke-width="3"/>
    <circle cx="30" cy="40" r="4" fill="#221f36"/><circle cx="50" cy="40" r="4" fill="#221f36"/>
    <g class="wr-mad"><path d="M22 30 L36 35 M58 30 L44 35" stroke="#221f36" stroke-width="4" stroke-linecap="round"/><ellipse cx="40" cy="62" rx="9" ry="6" fill="#7a1b1d" stroke="#221f36" stroke-width="3"/></g>
    <path d="M24 54 Q32 50 40 54 Q48 50 56 54 Q48 58 40 56 Q32 58 24 54Z" fill="#221f36"/>
    <path class="wr-glad" d="M30 62 Q40 70 50 62" stroke="#221f36" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M32 76 L40 70 L48 76 L40 80Z" fill="#e5383b" stroke="#221f36" stroke-width="2"/></svg>`;
}

/** The order's box, in the place's own shape. */
function wrOrderHtml(place) {
  const t = wrT();
  const text = `<b class="wr-ord__text" data-wr-otext></b><span class="wr-ord__who" data-wr-onote></span>`;
  if (place === 'wedding') {
    return `<div class="wr-ord wr-ord--uncle" data-wr-ord>
      <div class="wr-face">${wrUncleSvg()}</div>
      <div class="wr-bub"><small>${escapeHTML(t.wr_ord_wedding)}</small>${text}</div></div>`;
  }
  if (place === 'kitchen') {
    return `<div class="wr-ord wr-ord--note" data-wr-ord><small>${escapeHTML(t.wr_ord_kitchen)}</small>${text}<div class="wr-drain wr-drain--fuse"><i></i><span class="wr-spark"></span></div></div>`;
  }
  return `<div class="wr-ord wr-ord--led" data-wr-ord><small>${escapeHTML(t.wr_ord_bus)}</small>${text}<div class="wr-drain wr-drain--seg"><i></i></div></div>`;
}

const wrPlaceName = (place) => ((WIRE_PLACE_NAMES[place] || ['', ''])[appState.lang === 'en' ? 1 : 0]);

function wrBarsHtml(place) {
  const t = wrT();
  return `<div class="wr-bars">
    <div>${escapeHTML(t['wr_prog_' + place] || t.wr_prog_bus)}<div class="wr-mbar wr-mbar--p"><i></i></div></div>
    <div>${escapeHTML(t['wr_dmg_' + place] || t.wr_dmg_bus)}<div class="wr-mbar wr-mbar--d"><i></i></div></div></div>`;
}

function wrPhoneHtml(state) {
  const t = wrT();
  const s = state.shared || {};
  const place = s.place || 'bus';
  const me = Room.me;
  const inTable = (s.alive || []).indexOf(me) !== -1;
  const panel = wrOrdered(place, ((state.you || {}).panel) || []);
  const top = `<div class="wr-top"><span class="wr-top__lv" data-wr-level></span><span class="wr-top__place">${escapeHTML(wrPlaceName(place))}</span><span class="wr-top__clock metric" data-wr-clock dir="ltr">1:15</span></div>`;
  let body;
  if (s.phase === 'gameover') {
    body = '';          // the end card takes the panel's place
  } else if (!inTable) {
    // «المنادي» (the ideas of 7 Oct 2026, 793): a watcher reads every open order out to the table,
    // the one about to burn first. Orders are public (shared.orders); the panels never come here.
    body = `<div class="wr-caller" data-wr-caller>
      <div class="wr-caller__head"><b>📣 ${escapeHTML(t.wr_caller_title)}</b><small>${escapeHTML(t.wr_caller_hint)}</small></div>
      <div class="wr-caller__list" data-wr-calls aria-live="polite"></div>
      <div class="wr-caller__foot">${escapeHTML(t.wr_watching)}</div></div>`;
  } else if (place === 'kitchen') {
    const first = panel.filter((x) => (wireControl(x.c) || {}).t !== 'slide').slice(0, 2);
    const rest = panel.filter((x) => first.indexOf(x) === -1);
    body = `<div class="wr-pnl">${first.map(wrCtlHtml).join('')}${wrOrderHtml(place)}${rest.map(wrCtlHtml).join('')}</div>`;
  } else {
    body = `${wrOrderHtml(place)}<div class="wr-pnl">${panel.map(wrCtlHtml).join('')}</div>`;
  }
  const shake = inTable ? `<div class="wr-shake" data-wr-shake hidden>
      <div class="wr-shake__card">
        <div class="wr-shake__icon" aria-hidden="true">📳</div>
        <div class="wr-shake__title">${escapeHTML(t.wr_shake_title)}</div>
        <div class="wr-shake__dots" data-wr-sdots><i></i><i></i><i></i></div>
        <button type="button" class="btn btn--lg wr-shake__tap" data-wr-act="shake">${escapeHTML(t.wr_shake_tap)}</button>
        <div class="wr-shake__left metric" data-wr-sleft></div>
      </div></div>` : '';
  const over = s.phase === 'gameover' ? wrOverHtml(state) : '';
  return `${over}<div class="wr wr--${place}${over ? ' wr--over' : ''}" data-wr-root>${top}${wrBarsHtml(place)}${body}<div class="wr-stamp" data-wr-stamp aria-live="polite"></div><div class="wr-red"></div>${shake}</div>
    <div data-wr-host></div>${renderRoomPlayerStrip(state)}`;
}

/** The end: how far the table got, the room's best, and the host's buttons. */
function wrOverHtml(state) {
  const t = wrT();
  const s = state.shared || {};
  const why = s.why === 'time' ? t.wr_over_time : s.why === 'left' ? t.wr_over_left : t.wr_over_damage;
  const rise = motionFirst(['wr-over', roomDealKey(state)].join('|'));
  const host = state.youAreHost
    ? `<div class="btn-row" style="margin-top:var(--sp-3)"><button class="btn btn--go" onclick="roomAct('playAgain', {})">▶ ${escapeHTML(t.wr_again)}</button><button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game)}</button></div>`
    : `<div class="waiting-note">${escapeHTML(t.wr_wait_host)}</div>`;
  return `<div class="card wr-over ${rise ? 'wr-over--rise' : ''}" data-reveal-ms="${rise ? 900 : 0}">
      <div class="wr-over__why">${escapeHTML(why)}</div>
      <div class="wr-over__big"><span class="metric" data-wr-won data-to="${s.levelsWon || 0}">${rise ? 0 : (s.levelsWon || 0)}</span></div>
      <div class="wr-over__line">${escapeHTML(t.wr_levels_cleared)}</div>
      <div class="wr-over__end">${escapeHTML(wrEndLine(s).text)} ${wrEndLine(s).icon}</div>
      <div class="wr-over__best">${s.newBest ? '🏆 ' + escapeHTML(t.wr_new_best) + ' · ' : ''}${escapeHTML(wrFill(t.wr_room_best, { n: s.best || 0 }))}</div>
      ${host}</div>`;
}

/* --- the room game ------------------------------------------------------------ */
ROOM_GAMES.wire = {
  lateJoin: true,     // someone who joins mid-game watches, and is dealt in with play again
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = wrT();
    const o = wrOpts();
    const opt = (p) => `<button type="button" class="chip ${o.place === p ? 'is-active' : ''}" aria-pressed="${o.place === p}" onclick="wrSetOpt({ place: '${p}' })"><span aria-hidden="true">${WR_PLACE_ICON[p]}</span> ${escapeHTML(t['wr_place_' + p])}</button>`;
    return `
      <div class="card card--tight wr-lobby">
        <div class="field">
          <span class="field__label">${escapeHTML(t.wr_place)}</span>
          <div class="chip-set wr-lobby__places">${['bus', 'kitchen', 'wedding', 'random'].map(opt).join('')}</div>
        </div>
        <label class="switch-row" for="wr-surprises">
          <span class="field__label">${escapeHTML(t.wr_surprises)}</span>
          <span class="switch">
            <input type="checkbox" id="wr-surprises" role="switch" ${o.surprises ? 'checked' : ''} onchange="wrSetOpt({ surprises: this.checked })">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>
        <p class="field__hint" style="text-align:center">${escapeHTML(o.surprises ? t.wr_surprises_hint : t.wr_lobby_hint)}</p>
      </div>`;
  },
  startPayload() { const o = wrOpts(); return { place: o.place, surprises: !!o.surprises }; },
  actionKey(state) {
    // The screen stays put while the orders run; only a new level or the end scrolls to the top.
    const s = state.shared || {};
    return [state.code, roomDealKey(state), s.level, s.phase === 'gameover'].join('|');
  },
  render(state) {
    if (appState.currentView !== 'room-wire') setView('room-wire');
    const el = document.getElementById('view-room-wire');
    if (!el) return;
    wrNoteTime(state);
    const s = state.shared || {};
    const panel = ((state.you || {}).panel || []).map((x) => x.c).join(',');
    const sig = ['wr', s.place, s.level, s.phase === 'gameover', panel, (s.alive || []).indexOf(Room.me) !== -1, state.youAreHost, appState.lang, wrL()].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => wrPhoneHtml(state));
    // A drag held on the old frame never gets its release here: its control goes back to the server's value.
    if (rebuilt) { wr.hostKey = ''; wr.dragging = null; wrWire(el); }
    refreshRoomPlayerStrip(el, state);
    wr.el = el; wr.tv = false;
    wrPaint(state, el);
    wrEvents(state, el);
    if (rebuilt && s.phase === 'gameover') wrOverMotion(state, el);
    wrStartLoop();
  }
};

/* --- input: one listener on the frame --------------------------------------- */
function wrWire(el) {
  const root = el.querySelector('[data-wr-root]');
  if (!root) return;
  let drag = null;
  root.addEventListener('pointerdown', (e) => {
    wrAskMotion();
    const fx = e.target.closest('[data-wr-fx]');
    if (fx) { wrFxDown(fx, e); return; }
    const hit = e.target.closest('[data-wr-act]');
    if (!hit) return;
    const act = hit.dataset.wrAct;
    const ctl = hit.closest('[data-c]');
    const cid = ctl ? ctl.dataset.c : '';
    if (act === 'slide') {
      e.preventDefault();
      drag = { el: hit, cid, v: 0 };
      wr.dragging = cid;
      try { hit.setPointerCapture(e.pointerId); } catch (err) {}
      wrSlideTo(drag, e);
      return;
    }
    if (act === 'press') {
      hit.classList.remove('is-hit'); void hit.offsetWidth; hit.classList.add('is-hit');
      setTimeout(() => hit.classList.remove('is-hit'), 140);
      haptic('light');
      wrClick(0.8);
      wrSend('press', { c: cid });
    }
  });
  root.addEventListener('pointermove', (e) => { if (wr.fxDrag) wrFxMove(e); else if (drag) wrSlideTo(drag, e); });
  // The slider goes to the server once, where the finger lets go: sending every value it
  // passed filled every order on the way (the review of 1 Oct 2026).
  const end = (e) => {
    if (wr.fxDrag) { wrFxUp(e); return; }
    if (!drag) return;
    const d = drag;
    drag = null;
    wr.dragging = null;
    const x = wrMine(d.cid);
    if (d.v && (!x || x.v !== d.v)) { wrLocal(d.cid, d.v); wrSend('ctl', { c: d.cid, v: d.v }); }
    else wrPaintNow();
  };
  root.addEventListener('pointerup', end);
  root.addEventListener('pointercancel', end);
  root.addEventListener('click', (e) => {
    const hit = e.target.closest('[data-wr-act]');
    if (!hit) return;
    const act = hit.dataset.wrAct;
    const ctl = hit.closest('[data-c]');
    const cid = ctl ? ctl.dataset.c : '';
    if (act === 'sw') {
      const v = wrValue(cid) ? 0 : 1;
      wrLocal(cid, v);
      haptic('light'); wrClick(1);
      wrSend('ctl', { c: cid, v });
    } else if (act === 'dial') {
      const v = (wrValue(cid) || 1) % WIRE_VALUES + 1;
      wrLocal(cid, v);
      haptic('light'); wrClick(1.2);
      wrSend('ctl', { c: cid, v });
    } else if (act === 'shake') {
      wrShakeCount(true);
    }
  });
  root.addEventListener('keydown', (e) => {
    const fx = e.target.closest && e.target.closest('[data-wr-fx]');
    if (fx && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); wrFxWipe(fx); return; }
    const sl = e.target.closest && e.target.closest('[data-wr-act="slide"]');
    if (!sl) return;
    const cid = sl.closest('[data-c]').dataset.c;
    let d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
    if (!d) return;
    if (sl.closest('.wr-ctl.is-flip')) d = -d;   // drawn upside down: the arrow goes the way it looks
    e.preventDefault();
    const v = Math.max(1, Math.min(WIRE_VALUES, (wrValue(cid) || 1) + d));
    if (v !== wrValue(cid)) { wrLocal(cid, v); wrSend('ctl', { c: cid, v }); }
  });
}

function wrSlideTo(drag, e) {
  const r = drag.el.getBoundingClientRect();
  const vert = drag.el.dataset.o === 'v';
  let f = vert ? (r.bottom - e.clientY) / r.height : (e.clientX - r.left) / r.width;
  // An upside-down break turns the control 180° (labels and all): read the finger turned too.
  if (drag.el.closest('.wr-ctl.is-flip')) f = 1 - f;
  const v = 1 + Math.round(Math.max(0, Math.min(1, f)) * (WIRE_VALUES - 1));
  if (v === wrValue(drag.cid)) return;
  // Shown here while the finger moves; sent when it lets go (end, in wrWire).
  drag.v = v;
  wrLocal(drag.cid, v);
  haptic('light'); wrClick(0.6 + v * 0.15);
}

function wrSend(action, payload) {
  const st = Room.state;
  const s = (st && st.shared) || {};
  roomAct(action, Object.assign({ lv: s.level }, payload));
}

/** This phone's own control as the server last sent it. */
function wrMine(cid) {
  const panel = ((Room.state && Room.state.you) || {}).panel || [];
  return panel.find((x) => x.c === cid) || null;
}
/** A control's value: this phone's own change until the server has caught up with it. */
function wrValue(cid) {
  const l = wr.local[cid];
  const x = wrMine(cid);
  const server = x ? x.v : 0;
  if (l && (wr.dragging === cid || (Date.now() - l.at < 1500 && l.v !== server))) return l.v;
  return server;
}
function wrLocal(cid, v) {
  wr.local[cid] = { v, at: Date.now() };
  wrPaintNow();
}

/* --- 792 «مفاجأة كل مكان»: the place's own surprise over a panel --------------------
   The server's 'smoke' (a control broken, WIRE_WIPES wipes by its holder, the same clock as
   before) is drawn as the place's own surprise: a sandstorm over the half of the microbus panel
   the control is in (swipe it clear), steam fogging the kitchen's panel (rub it off; mum's note
   stays readable above it), the power cut on the wedding's mixer (dark; the finger is the torch,
   and the lights come back a step with every wipe). The layer takes the touches over what it
   covers. Every WR_FX_STEP of the finger's travel is one wipe, and so is a tap (the old four
   taps still clear it). A phone under reduced motion gets the layer at once and gone at once;
   the finger's trail is the finger's, not an animation, so it is drawn there too. */
const WR_FX_KIND = { bus: 'sand', kitchen: 'steam', wedding: 'dark' };
const WR_FX_STEP = 56;          // px of the finger's travel for one wipe (at least; a fifth of a wide layer)

/** The covers this phone needs: the broken controls grouped by the part of the panel they cover. */
function wrFxZones(state, root) {
  const s = state.shared || {};
  const kind = WR_FX_KIND[s.place] || 'sand';
  const pnl = root.querySelector('.wr-pnl');
  const zones = {};
  if (!pnl || s.phase === 'gameover') return { kind, pnl, zones };
  const h = pnl.clientHeight;
  (((state.you || {}).panel) || []).forEach((x) => {
    if (!x.b || x.b.k !== 'smoke' || !(x.b.left > 0)) return;
    let z = 'all';
    if (kind === 'sand') {
      const ctl = pnl.querySelector(`[data-c="${CSS.escape(x.c)}"]`);
      const mid = ctl ? ctl.offsetTop + ctl.offsetHeight / 2 : h;
      z = mid < h / 2 ? 'top' : 'bottom';
    }
    (zones[z] = zones[z] || []).push(x);
  });
  return { kind, pnl, zones };
}

function wrFxPaint(state, root) {
  const t = wrT();
  const { kind, pnl, zones } = wrFxZones(state, root);
  if (!pnl) return;
  pnl.querySelectorAll('[data-wr-fx]').forEach((fx) => { if (!fx.classList.contains('is-gone') && !zones[fx.dataset.wrFx]) wrFxGone(fx); });
  Object.keys(zones).forEach((z) => {
    const list = zones[z];
    let fx = pnl.querySelector(`[data-wr-fx="${z}"]:not(.is-gone)`);
    if (!fx) {
      fx = document.createElement('div');
      fx.className = `wr-fx wr-fx--${kind} wr-fx--${z}`;
      fx.dataset.wrFx = z;
      fx.dataset.kind = kind;
      fx.setAttribute('role', 'button');
      fx.tabIndex = 0;
      fx.innerHTML = `<canvas aria-hidden="true"></canvas><div class="wr-fx__tag"><b></b><span class="wr-fx__dots" aria-hidden="true"></span></div>`;
      pnl.appendChild(fx);

      // A third pointless move in a row: a quarter of a miss, on this phone's buzz alone.
      wrStamp(el, 'bad', t.wr_mash);
      wrSound('danger');
      haptic('heavy');
    } else if (e.type === 'break' && e.pid === me) {
      haptic('medium');
    } else if (e.type === 'fixed' && e.pid === me) {
      wrStamp(el, 'ok', t.wr_fx_cleared);
    } else if (e.type === 'shake') {
      haptic('heavy');
    } else if (e.type === 'shakeOk') {
      wrStamp(el, 'ok', t.wr_shake_ok);
    } else if (e.type === 'level') {
      wrStamp(el, 'lvl', wrFill(t.wr_level, { n: e.n }));
    } else if (e.type === 'won') {
      wrStamp(el, 'lvl', wrFill(t.wr_level_won, { n: e.n }));
      haptic('medium');
    } else if (e.type === 'lost') {
      wrStamp(el, 'bad', t.wr_game_over);

    }
  });
}

function wrStamp(el, kind, text) {
  const root = el.querySelector('[data-wr-root]');
  const st = el.querySelector('[data-wr-stamp]');
  if (!root || !st) return;
  st.textContent = text;

  void root.offsetWidth;

}

function wrOverMotion(state, el) {

/* --- «الكل يهز الموبايل!»: the phone's motion, or three taps ----------------------- */
function wrAskMotion() {
  if (wr.motion) return;
  const listen = () => { wr.motion = 'on'; const s = (Room.state || {}).shared || {}; wrMotionSync(s.phase === 'play' && !!s.shake); };
  if (typeof DeviceMotionEvent === 'undefined') { wr.motion = 'no'; return; }
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    wr.motion = 'asking';
    // iOS asks only inside a tap: this runs in the first tap on the panel.
    DeviceMotionEvent.requestPermission().then((r) => { if (r === 'granted') listen(); else wr.motion = 'no'; }).catch(() => { wr.motion = 'no'; });
  } else listen();
}
/** The sensor is listened to only while «الكل يهز» is on, and never after the room screen is left. */
function wrMotionSync(on) {
  const want = !!on && wr.motion === 'on';
  if (want === wr.listening) return;
  wr.listening = want;
  if (want) window.addEventListener('devicemotion', wrOnMotion);
  else window.removeEventListener('devicemotion', wrOnMotion);
}
function wrOnMotion(e) {
  const st = Room.state;
  if (!st || st.game !== 'wire' || !st.shared || !st.shared.shake) return;
  const a = e.acceleration && e.acceleration.x !== null ? e.acceleration : null;
  const g = e.accelerationIncludingGravity;
  let hard = false;
  if (a) hard = Math.hypot(a.x || 0, a.y || 0, a.z || 0) > 12;
  else if (g) hard = Math.abs(Math.hypot(g.x || 0, g.y || 0, g.z || 0) - 9.8) > 10;
  if (hard) wrShakeCount(false);
}
function wrShakeCount(tap) {
  const st = Room.state;
  const s = (st && st.shared) || {};
  if (!s.shake || s.phase !== 'play' || (s.shake.done || []).indexOf(Room.me) !== -1) return;
  if (wr.shake.id !== s.shake.id) wr.shake = { id: s.shake.id, n: 0, last: 0, sent: false };
  const now = Date.now();
  if (!tap && now - wr.shake.last < 180) return;
  wr.shake.last = now;
  if (wr.shake.sent) return;
  wr.shake.n += 1;
  haptic('light');
  if (wr.shake.n >= 3) {
    wr.shake.sent = true;
    roomAct('shake', { id: s.shake.id });
  }
  wrPaintNow();
}

/* --- the sounds: the voice's alarms, loud and a bit tense ---------------------- */
function wrClick(pitch) {
  try { fxTone('triangle', [[0, 260 * (pitch || 1)]], [[0, 0.06], [0.04, 0.001]], fxCtx().currentTime + 0.005); } catch (e) {}
}
function wrSound(kind) {
  if (!kind) return;
  try {
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'alarm') {
      // A two-tone klaxon, three times: the order was missed.
      for (let k = 0; k < 3; k++) {
        fxTone('square', [[0, 880]], [[0, 0.0001], [0.01, 0.22], [0.14, 0.2], [0.16, 0.0001]], at + k * 0.3);
        fxTone('square', [[0, 660]], [[0, 0.0001], [0.01, 0.22], [0.12, 0.2], [0.14, 0.0001]], at + k * 0.3 + 0.15);
      }
      fxTone('sawtooth', [[0, 110], [0.9, 70]], [[0, 0.16], [0.9, 0.001]], at);
    } else if (kind === 'done') {
      fxTone('sine', [[0, 740], [0.08, 1110]], [[0, 0.14], [0.16, 0.001]], at);
    } else if (kind === 'crackle') {
      for (let k = 0; k < 5; k++) fxNoise('bandpass', 1400 + k * 500, 3, [[0, 0.3], [0.05, 0.001]], at + k * 0.07);
      fxNoise('lowpass', 400, 0.7, [[0, 0.25], [0.6, 0.001]], at + 0.3);
    } else if (kind === 'whistle') {
      fxTone('sine', [[0, 500], [0.6, 1600]], [[0, 0.2], [0.55, 0.2], [0.7, 0.001]], at);
      fxTone('sine', [[0, 500], [0.6, 1600]], [[0, 0.2], [0.55, 0.2], [0.7, 0.001]], at + 0.8);
    } else if (kind === 'danger') {
      fxTone('square', [[0, 440]], [[0, 0.0001], [0.01, 0.14], [0.09, 0.0001]], at);
    } else if (kind === 'tick') {
      fxTone('triangle', [[0, 1200]], [[0, 0.12], [0.05, 0.001]], at);
    } else if (kind === 'level') {
      fxTone('sawtooth', [[0, 220], [0.25, 330]], [[0, 0.16], [0.3, 0.001]], at);
      fxTone('sawtooth', [[0, 330], [0.25, 440]], [[0, 0.16], [0.35, 0.001]], at + 0.3);
    } else if (kind === 'ok') playFx('ding');
    else if (kind === 'fail') playFx('buzzer');
    else if (kind === 'won') playFx('tada');
    else if (kind === 'lost') playFx('sad');
  } catch (e) {}
}
/** On the voice: a tense beep while the damage is one short of the end, and the last ten seconds ticking. */
function wrVoiceTick(st, s, now) {
  if (s.phase !== 'play' || !wrIsVoice(st)) return;
  if ((s.damage || 0) >= (s.dmgMax || 5) - 1 && Date.now() - wr.beepAt > 1200) { wr.beepAt = Date.now(); wrSound('danger'); }
  const left = Math.ceil(((s.endsAt || 0) - now) / 1000);
  if (left <= 10 && left > 0 && left !== wr.tickSec) { wr.tickSec = left; wrSound('tick'); }
}

/* --- 796 «نهاية الحكاية»: the place's scene plays on to its ending -------------------
   At the game's end the TV no longer lays a card over the scene: the scene the table watched
   all game plays on, full screen, to the ending the levels cleared earned, and the count rises
   in a corner (with the room's best and, on a TV that hosts, its buttons, once the scene has
   played). Under 2 levels the bad ending, 2-4 the middle, 5 and more the good one
   (WR_END_MID, WR_END_GOOD):
     bus      it drives on from the desert's start and stops where the levels took it - broken
              down near the start, or steaming a little short of the oasis - or rolls into it;
     kitchen  the plates fill one by one, and the guests eat their fill, half of them do, or
              they all walk out to the door hungry;
     wedding  the lanterns come on one by one over the zaffa, half of them do, or they flicker
              and die and the bride comes in in the dark, the guests holding up their phones.
   Played once per deal (motionFirst): a redraw, a reload or motion off draws the ending as it
   ends, every end state the element's own value (the animations only run from the start). */
const WR_END_MID = 2;
const WR_END_GOOD = 5;
const wrEndTier = (n) => (n >= WR_END_GOOD ? 'good' : n >= WR_END_MID ? 'mid' : 'bad');
const WR_END_ICON = { bus: { good: '🌴', mid: '🛞', bad: '🚐' }, kitchen: { good: '😋', mid: '🍽️', bad: '🚪' }, wedding: { good: '💃', mid: '💡', bad: '🕯️' } };
/** The ending's line, for the TV's corner and the phones' end card. */
function wrEndLine(s) {
  const t = wrT();
  const place = s.place || 'bus';
  const tier = wrEndTier(s.levelsWon || 0);
  return { icon: (WR_END_ICON[place] || WR_END_ICON.bus)[tier], text: t['wr_end_' + place + '_' + tier] || '' };
}

function wrEndBusScene(n, tier, t) {
  // From off the road's start (left) to where the levels took it: past the sign when broken down, a little short of the oasis in the middle, into it.
  const x1 = tier === 'good' ? 560 : tier === 'mid' ? 270 + n * 50 : 230 + n * 70;
  const sign = tier === 'good' ? t.wr_end_sign_good : wrFill(t.wr_end_sign_km, { n: (WR_END_GOOD - Math.min(n, WR_END_GOOD - 1)) * 20 + 20 });
  const palm = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 0 Q6 -60 -4 -120" stroke="#7a4a2a" stroke-width="12" fill="none"/>${[[-60, -110], [60, -112], [-50, -140], [50, -142], [0, -160]].map(([a, b]) => `<path d="M-4 -120 Q${a / 2} ${b - 20} ${a} ${b + 10}" stroke="#2f8a3c" stroke-width="14" fill="none" stroke-linecap="round"/>`).join('')}</g>`;
  const oasis = `<g class="wr-end__oasis"><ellipse cx="850" cy="440" rx="150" ry="24" fill="#3fa7d6" stroke="#221f36" stroke-width="4"/>${palm(760, 430, 0.9)}${palm(940, 435, 1.1)}${palm(860, 420, 0.7)}</g>`;
  const steam = tier === 'good' ? '' : `<g transform="translate(${x1 + 296} 300)"><g class="wr-end__steam"><circle r="14"/><circle cx="12" cy="-24" r="18"/><circle cx="-4" cy="-52" r="22"/></g></g>`;
  return wrTvBusSvg({ sign, busOpen: `<g class="wr-end__bus" style="--x0:-340px;--x1:${x1}px"><g class="wr-bus" transform="translate(0 250) scale(.8) translate(0 50)">`, busClose: '</g>', extra: oasis + steam });
}

function wrEndKitchenScene(tier) {
  const full = tier === 'good' ? 6 : tier === 'mid' ? 3 : 0;
  const food = ['#e5383b', '#4f7d3a', '#f59e0b', '#c0392b', '#7a4a2a', '#2f8a3c'];
  const plates = food.map((col, k) => `<g transform="translate(${130 + k * 95} 388)"><ellipse rx="38" ry="14" fill="#fff" stroke="#221f36" stroke-width="4"/>${k < full ? `<ellipse class="wr-end__food" style="--k:${k}" cy="-6" rx="24" ry="10" fill="${col}"/>` : ''}</g>`).join('');
  const door = `<g transform="translate(18 150)"><rect width="66" height="180" rx="6" fill="#8a5a3a" stroke="#221f36" stroke-width="5"/><circle cx="14" cy="96" r="6" fill="#ffd166" stroke="#221f36" stroke-width="3"/></g>`;
  const svg = wrTvKitchenSvg().replace('</svg>', door + plates + '</svg>');
  const sad = (k) => tier === 'bad' || (tier === 'mid' && k >= 3);
  const guests = WR_GUEST_COLORS.map((c, k) => `<div class="wr-end__g ${sad(k) ? 'is-sad' : ''}" style="--k:${k}">${wrGuestSvg(c, k)}</div>`).join('');
  return `<div class="wr-tv__scene">${svg}</div><div class="wr-end__guests is-${tier}" dir="ltr">${guests}</div>`;
}

function wrEndWeddingScene(tier) {
  let svg = wrTvWeddingSvg();
  const lit = tier === 'good' ? 12 : tier === 'mid' ? 6 : 0;
  let i = 0;
  svg = svg.replace(/class="wr-blb"/g, () => { const k = i++; return `class="wr-blb wr-end__blb${k < lit ? ' is-on' : ''}" style="--k:${k}"`; });
  const lanterns = [140, 300, 660, 820].map((x, k) => `<g transform="translate(${x} ${200 + (k % 2) * 30})"><path d="M0 -40 V-10" stroke="#221f36" stroke-width="3"/><path class="wr-end__lan${(tier === 'good' || (tier === 'mid' && k % 2 === 0)) ? ' is-on' : ''}" style="--k:${k}" d="M-16 -10 h32 l6 40 l-22 18 l-22 -18z" stroke="#221f36" stroke-width="4"/></g>`).join('');
  const dark = tier === 'bad' ? `<rect class="wr-end__dark" width="960" height="540" fill="#030208"/>${[[300, 360], [520, 380], [700, 350]].map(([x, y], k) => `<g class="wr-end__torch" style="--k:${k}"><circle cx="${x}" cy="${y}" r="26" fill="#fff6c4" opacity=".55"/><circle cx="${x}" cy="${y}" r="6" fill="#fff"/></g>`).join('')}` : '';
  svg = svg.replace('</svg>', lanterns + dark + '</svg>');
  const sad = (k) => tier === 'bad' || (tier === 'mid' && k % 2 === 1);
  const crowd = WR_GUEST_COLORS.map((c, k) => `<div class="wr-gst wr-end__g ${sad(k) ? 'is-sad' : ''}" style="--k:${k}">${wrGuestSvg(c, k)}</div>`).join('');
  return `${svg}<div class="wr-crowd">${crowd}</div>`;
}

/** The ending, full screen: the scene and the corner's count (the TV's frame at gameover). */
function wrTvEndHtml(state, t) {
  const s = state.shared || {};
  const place = s.place || 'bus';
  const n = s.levelsWon || 0;
  const tier = wrEndTier(n);
  // Played once per deal, and only just after the game ended: a TV that reloads or joins later sees the ending as it ends.
  wrNoteTime(state);
  const lost = (s.events || []).filter((e) => e.type === 'lost').pop();
  const play = !!lost && wrNow() - (lost.at || 0) < 6000 && motionFirst(['wr-end', roomDealKey(state)].join('|'));
  const end = wrEndLine(s);
  const why = s.why === 'time' ? t.wr_over_time : s.why === 'left' ? t.wr_over_left : t.wr_over_damage;
  const scene = place === 'kitchen' ? wrEndKitchenScene(tier) : place === 'wedding' ? wrEndWeddingScene(tier) : wrEndBusScene(n, tier, t);
  const host = state.youAreHost ? `<div class="tv-actions">${tvBtn('▶ ' + t.wr_again, "roomAct('playAgain', {})")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>` : '';
  return `<div class="wr-tv wr-tv--${place} wr-end wr-end--${tier} ${play ? 'is-play' : ''}" data-wr-tv data-wr-end="${play ? 'play' : 'still'}">
    ${scene}
    <div class="wr-endb ${tier === 'good' ? 'is-good' : ''}" data-reveal-ms="${play ? 2900 : 0}">
      <small>${escapeHTML(t.wr_levels_cleared)}</small>
      <b class="metric" data-wr-endn data-to="${n}">${play ? 0 : n}</b>
      <span>${escapeHTML(end.text)} ${end.icon}</span>
      <div class="wr-endb__more">
        <em>${escapeHTML(why)}</em>
        <em>${s.newBest ? '🏆 ' + escapeHTML(t.wr_new_best) + ' · ' : ''}${escapeHTML(wrFill(t.wr_room_best, { n: s.best || 0 }))}</em>
        ${host}
      </div>
    </div></div>`;
}

/** Once, when the ending is drawn with motion: the count rises with the scene, a good ending's confetti after it. */
function wrTvEndPaint(state, tv) {
  if (tv.dataset.wrEnd !== 'play' || tv.dataset.counted) return;
  tv.dataset.counted = '1';
  const num = tv.querySelector('[data-wr-endn]');
  if (num) setTimeout(() => { if (num.isConnected) countUp(num, 0, Number(num.dataset.to) || 0); }, 900);
  const s = state.shared || {};
  if (wrEndTier(s.levelsWon || 0) === 'good' || (s.newBest && (s.levelsWon || 0) > 0)) {
    afterReveal(tv, () => { if (tv.isConnected && typeof confetti === 'function') confetti({ particleCount: 140, spread: 90, origin: { y: 0.55 } }); });
  }
}

/** The latest order given out: what the bus's ticker and the uncle shout. */
function wrLatestOrder(s) {
  let best = null;
  Object.keys(s.orders || {}).forEach((pid) => { const o = s.orders[pid]; if (o && (!best || o.at > best.at)) best = o; });
  return best;
}

function wrTvPaint(state, el) {
  const t = wrT();
  const s = state.shared || {};
  const tv = el.querySelector('[data-wr-tv]');
  if (!tv) return;
  if (tv.hasAttribute('data-wr-end')) { wrTvEndPaint(state, tv); wrFrame(); return; }
  const p = Math.min(1, (s.progress || 0) / Math.max(1, s.target || 1));
  const d = Math.min(1, (s.damage || 0) / Math.max(1, s.dmgMax || 1));
  tv.style.setProperty('--p', p.toFixed(3));
  tv.style.setProperty('--d', d.toFixed(3));
  tv.classList.toggle('is-hot', d >= 0.5);
  el.querySelectorAll('[data-wr-level]').forEach((x) => { x.textContent = wrFill(t.wr_level, { n: s.level || 1 }); });
  const light = (sel, frac) => { const list = tv.querySelectorAll(sel); const n = Math.round(frac * list.length); list.forEach((x, i) => { const on = i < n; if (x.classList.contains('is-on') !== on) { x.classList.toggle('is-on', on); if (on && !motionOff()) { x.classList.remove('is-pop'); void x.getBoundingClientRect(); x.classList.add('is-pop'); } } }); };
  light('.wr-plate', p);
  light('.wr-blb', p);
  light('.wr-gst', d);
  const tick = tv.querySelector('[data-wr-tick]');
  if (tick) {
    const o = wrLatestOrder(s);
    const txt = s.phase === 'play' && s.shake ? t.wr_shake_title : o ? wireOrderText(o, wrL()) : '—';
    if (tick.textContent !== txt) tick.textContent = txt;
  }
  // The kitchen's fridge: every phone's order, each with its fuse.
  const notes = tv.querySelector('[data-wr-notes]');
  if (notes) {
    const alive = s.alive || [];
    const key = alive.map((pid) => pid + ':' + ((s.orders || {})[pid] ? s.orders[pid].id : '-')).join(',') + '|' + wrL() + '|' + !!s.shake;
    if (wr.noteKey !== key) {
      wr.noteKey = key;
      notes.innerHTML = alive.map((pid, i) => {
        const o = (s.orders || {})[pid];
        const txt = s.shake ? t.wr_shake_title : o ? wireOrderText(o, wrL()) : '…';
        return `<div class="wr-note ${i % 2 ? 'wr-note--b' : ''} ${o ? '' : 'is-idle'}" data-wr-note="${escapeHTML(pid)}"><small>${escapeHTML(wrFill(t.wr_tv_phone_of, { name: wrIso(wrName(state, pid)) }))}</small><span>${escapeHTML(txt)}</span><i></i></div>`;
      }).join('');
    }
  }
  // The place's surprise (792): a veil over the scene and whose panel it is on, while it lasts.
  const fx = tv.querySelector('[data-wr-tvfx]');
  if (fx) {
    const cover = s.phase === 'play' ? Object.keys(s.cover || {}).filter((pid) => (s.alive || []).indexOf(pid) !== -1) : [];
    const who = cover.map((pid) => wrFill(t.wr_tv_fx_who, { name: wrIso(wrName(state, pid)) })).join(' · ');
    const txt = who ? (WR_TV_FX_ICON[WR_FX_KIND[s.place] || 'sand'] + ' ' + who) : '';
    const w = fx.querySelector('[data-wr-tvfx-who]');
    if (w && w.textContent !== txt) w.textContent = txt;
    fx.classList.toggle('is-on', !!who);
  }
  // The level's card over the scene: ready, won (the end is the ending's own frame, 796).
  const card = tv.querySelector('[data-wr-tvcard]');
  if (card) {
    let html = '';
    if (s.phase === 'ready') html = `<div class="wr-tvcard__big">${escapeHTML(wrFill(t.wr_level, { n: s.level || 1 }))}</div><div class="wr-tvcard__line">${escapeHTML(wrFill(t.wr_tv_target, { n: s.target || 0 }))}</div><div class="wr-tvcard__line metric" data-wr-cd></div>`;
    else if (s.phase === 'won') html = `<div class="wr-tvcard__big">🎉 ${escapeHTML(wrFill(t.wr_level_won, { n: s.level || 1 }))}</div><div class="wr-tvcard__line" data-wr-cd></div>${roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.wr_next_now, `roomAct('nextLevel', { lv: ${Number(s.level) || 0} })`, 'secondary')}</div>`)}`;
    const key = [s.phase, s.level, s.levelsWon, s.best, state.youAreHost, !!state.hostAway, appState.lang].join('|');
    if (card.dataset.key !== key) {
      card.dataset.key = key;
      card.innerHTML = html;
      card.hidden = !html;
      if (html && !motionOff()) { card.classList.remove('is-in'); void card.offsetWidth; card.classList.add('is-in'); }
    }
  }
  wrFrame();
}

const WR_TV_FX_ICON = { sand: '🌪️', steam: '♨️', dark: '🔌' };

function wrTvFrame(st, el, now) {
  const s = st.shared || {};
  const t = wrT();
  el.querySelectorAll('[data-wr-note]').forEach((n) => {
    const o = (s.orders || {})[n.dataset.wrNote];
    const i = n.querySelector('i');
    if (!i) return;
    const f = o && s.phase === 'play' ? Math.max(0, Math.min(1, ((s.shake ? o.ends - (s.shake.ends - now) : o.ends) - now) / Math.max(1, o.ends - o.at))) : 0;
    i.style.transform = 'scaleX(' + f.toFixed(3) + ')';
  });
  const cd = el.querySelector('[data-wr-cd]');
  if (cd) {
    const secs = Math.max(0, Math.ceil(((s.phase === 'ready' ? s.startAt : s.nextAt) - now) / 1000));
    const txt = s.phase === 'ready' ? wrFill(t.wr_orders_in, { n: secs }) : wrFill(t.wr_next_in, { n: secs });
    if (cd.textContent !== txt) cd.textContent = txt;
  }
  const tv = el.querySelector('[data-wr-tv]');
  if (tv) tv.classList.toggle('is-alarm-soon', s.phase === 'play' && (s.endsAt || 0) - now < 10000);
  wrVoiceTick(st, s, now);
}

/** A moment on the TV: the scene reacts, a toast says what broke, the frame flashes on a miss. */
function wrTvMoment(state, el, e) {
  const tv = el.querySelector('[data-wr-tv]');
  if (!tv) return;
  const t = wrT();
  const moment = e.type === 'done' || e.type === 'shakeOk' || e.type === 'won' ? 'ok' : e.type === 'miss' || e.type === 'shakeFail' ? 'bad' : e.type === 'break' ? 'smoke' : e.type === 'shake' ? 'shake' : '';
  if (!moment) return;
  if (!motionOff()) {
    tv.dataset.moment = moment;
    clearTimeout(wr.momentTimer);
    wr.momentTimer = setTimeout(() => { delete tv.dataset.moment; }, 1600);
    if (moment === 'bad') { tv.classList.remove('is-alarm'); void tv.offsetWidth; tv.classList.add('is-alarm'); }
  }
  const tick = tv.querySelector('[data-wr-tick]');
  if (tick && (e.type === 'done' || e.type === 'miss')) tick.textContent = wireOrderText(e, wrL()) || tick.textContent;
  let msg = '';
  if (e.type === 'break') msg = (e.k === 'smoke' ? WR_TV_FX_ICON[WR_FX_KIND[(state.shared || {}).place] || 'sand'] + ' ' : '') + wrFill(e.k === 'smoke' ? t['wr_tv_fx_' + (WR_FX_KIND[(state.shared || {}).place] || 'sand')] : t.wr_tv_flip, { name: wrIso(wrName(state, e.pid)), c: wireName(e.c, wrL()) });
  else if (e.type === 'shake') msg = t.wr_shake_title + ' 📳';
  else if (e.type === 'shakeFail') msg = t.wr_shake_fail;
  if (msg) {
    const toast = tv.querySelector('[data-wr-toast]');
    if (toast) {
      toast.textContent = msg;
      toast.classList.add('is-on');
      clearTimeout(wr.toastTimer);
      wr.toastTimer = setTimeout(() => toast.classList.remove('is-on'), 3200);
    }
  }
}
</script>
