<script>
/* ============================================================================
   رد الفعل «أسرع إيد» — THE REACTION TEST IN A ROOM (phones and the TV), 2 Oct 2026
   ----------------------------------------------------------------------------
   Every phone is a big red pad. At one moment of the server's (RoomReaction.js,
   a secret until it comes) every phone and the TV turn green, and everyone taps
   their own pad. The tap carries the server's time as this phone knows it
   (rxrTapAt: Date.now() − the smallest receivedAt − serverNow seen, the chairs'
   mchTapAt), so a slow connection loses nothing. Five rounds; the fastest three
   each round get 3 / 2 / 1, a tap before the green is ✖. «خدعة» (the lobby's
   switch, on by default, the one-phone setup's too: recallOptions('reaction')):
   about one round in three a fake comes first - the pad flashes yellow, a 🐱
   jumps in, or «استنى!» slams in - and a tap on it is ✖ «اتضحك عليك!».

   Motion: the green bursts out of the pad's middle and «دوس!» pops (rx-pad--go,
   motionBump, keyed once a round); my time counts up (countUp); the round's
   rows rise one by one, fastest last; the totals count and slide
   (renderScoreboard / animateScoreboards); after the fifth the podium
   (renderPodium) and confetti (afterReveal). Colours are the tokens'
   (--danger-btn red, --pop the yellow fake and a tie, --success-btn green;
   RX_CSS below, shared with the one-phone halves, .rx-half).
   Every name here starts with rxr / RXR_ (the one-phone test is rx*, JS_NewGames.html).
   ========================================================================= */
/* --- the game's words and its look, which come with its code ---------------------
   Only this game's code reads them, so they are here and not in TRANSLATIONS or
   Style.html (the shell's size budget, notes/lazy-load.md): the one-phone test
   (JS_NewGames.html) and the room both call rxStyleOn() before they draw. The
   rules are this game's own classes, which nothing else restyles, so landing at
   the end of the page changes no other rule. The motion classes (.rx-msg--pop,
   .rx-pad--go, .rx-row--rise, .rx-again) are only added when motionOff() is false,
   so the sheet needs no reduced-motion block. Section 65 of Style.html points here. */
const RX_TEXT = {
  ar: {
    reaction_wait: "استنى...",
    reaction_tap: "دوس!",
    reaction_too_soon: "بدري أوي! ❌",

    rx_fake_word: "استنى!",
    rx_fooled: "اتضحك عليك! 😜",

    rx_wait_sub: "لما تخضرّ دوس!",

    rx_tapped: "داسوا: {n} من {m}",
    rx_next_in: "الجولة الجاية بعد {n}…",
    rx_next_now: "الجولة الجاية دلوقتي",
    rx_watching: "بتتفرّج: هتلعب في اللعبة الجاية",
    rx_points: "النقط",

    rx_tv_tap: "دوس على موبايلك!",
  },
  en: {
    reaction_wait: "Wait...",
    reaction_tap: "TAP!",
    reaction_too_soon: "Too Soon! ❌",
    reaction_winner: "Winner! 🏆",
    reaction_ms: "ms",
    rx_fake_word: "Wait!",
    rx_fooled: "Gotcha! 😜",

    rx_again_tap: "Tap to play again 🔄",
    rx_lobby_hint: "Every phone and the TV turn green at the same moment. 5 rounds: the fastest three each round get 3, 2 and 1, and a tap before the green is ✖.",
    rx_wait_sub: "Tap when it turns green!",
    rx_early: "Too soon! ✖",

    rx_your_time: "Your time",
    rx_round_of: "Round",
    rx_round_rows: "Who tapped first?",
    rx_tapped: "Tapped: {n} of {m}",
    rx_next_in: "Next round in {n}…",
    rx_next_now: "Next round now",
    rx_watching: "You're watching: you'll play in the next game",
    rx_points: "Points",
    rx_play_again: "Play again",
    rx_winner: "{name} has the fastest hand!",
    rx_tv_tap: "Tap on your phone!",
  }
};

const RX_CSS = `

transition: background-color 80ms linear;
-webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}

opacity: 0; pointer-events: none;

box-shadow: var(--sh-3); touch-action: manipulation;
}

.rx-count:empty { display: none; }

display: inline-flex; align-items: center; justify-content: center;

}
.rx-ms { color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; }
.rx-row--rise { animation: rxRise 0.45s var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes rxRise { from { opacity: 0; transform: translateY(0.75rem); } to { opacity: 1; transform: none; } }

}
@media (min-width: 900px) {

.rx-pad { min-height: 18rem; }
}
.rx-tv { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(24vmin, 1fr); gap: 3vmin; align-items: center; height: 100%; }

.rx-tv__side { display: flex; flex-direction: column; gap: 1.5vmin; min-width: 0; }

body.is-tv-view .rx-pad--tv .rx-sub { font-size: var(--tv-md); }

/** The app's words with this game's own (RX_TEXT). */
function rxText() {
  return Object.assign({}, TRANSLATIONS[appState.lang], RX_TEXT[appState.lang === 'en' ? 'en' : 'ar']);
}
/** This game's styles, put in the page once (after the app's own, at the end of <body>). */
function rxStyleOn() {
  if (document.getElementById('rx-style')) return;
  const st = document.createElement('style');
  st.id = 'rx-style';
  st.textContent = RX_CSS;
  document.body.appendChild(st);
}
rxStyleOn();

const RXR_GO_MS = 2500;          // REACTION_GO_MS on the server
const RXR_FLOOR_MS = 100;        // REACTION_MIN_REACT_MS: no time shown under it
const RXR_MEDALS = ['🥇', '🥈', '🥉'];

const rxr = {
  gap: Infinity,     // the smallest (receivedAt − serverNow) seen: the server's clock on this phone
  sent: '',          // the round this phone tapped in (one tap a round, before the server answers)
  mine: null,        // { key, ms, foul } my tap as this phone saw it, drawn at once
  timer: null,       // the next round's countdown, painted in place
  seen: new Set()    // play-once keys for sounds and buzzes, whatever the motion setting
};

function rxrNoteTime(state) {
  if (state && typeof state.serverNow === 'number' && typeof state.receivedAt === 'number') {
    rxr.gap = Math.min(rxr.gap, state.receivedAt - state.serverNow);
  }
}
const rxrServerNow = () => (isFinite(rxr.gap) ? Date.now() - rxr.gap : Date.now());
/** The stamp a tap carries: the server's time as this phone knows it (null before it knows). */
const rxrTapAt = () => (isFinite(rxr.gap) ? Date.now() - rxr.gap : null);
const rxrT = () => rxText();
const rxrFill = (str, vars) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
const rxrOnce = (key) => { if (!key || rxr.seen.has(key)) return false; if (rxr.seen.size > 300) rxr.seen.clear(); rxr.seen.add(key); return true; };
const rxrRoundKey = (state) => roomDealKey(state) + '|' + ((state.shared || {}).round || 0);
const rxrNameOf = (state, id) => ((state.players || []).find((p) => p.id === id) || {}).name || '';

function rxrOpts() { return recallOptions('reaction', { fakes: true }); }
function rxrSetFakes(on) {
  rememberOptions('reaction', { fakes: !!on });
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
}

/** My tap this round: the server's, else the one this phone has just sent. */
function rxrMine(state) {
  const s = state.shared || {};
  const srv = (s.taps || []).find((x) => x.id === Room.me);
  if (srv) return srv.ms === null && !srv.foul ? null : { ms: srv.ms, foul: srv.foul || null, sure: true };
  return rxr.mine && rxr.mine.key === rxrRoundKey(state) ? rxr.mine : null;
}

/**
 * The pad: red, the fake (yellow / 🐱 / «استنى!»), green, or my tap's verdict.
 * A button on a phone (the finger going down is the tap), a plain stage on the TV.
 */
function rxrPadHtml(state, s, o) {
  const L = rxrT();
  const tv = !!(o && o.tv);
  const mine = tv ? null : rxrMine(state);
  const fake = s.phase === 'wait' && s.fake ? s.fake.kind : '';
  let look, big, sub = '', extra = '';
  if (mine && mine.foul) {
    look = 'bad'; big = escapeHTML(mine.foul === 'fake' ? L.rx_fooled : L.rx_early);
  } else if (mine) {
    look = 'win'; big = `<span class="metric" dir="ltr"><span data-rx-ms="${mine.ms}">${mine.ms}</span> ms</span>`; sub = escapeHTML(L.rx_your_time);
  } else if (s.phase === 'go') {
    look = 'go'; big = escapeHTML(L.reaction_tap); sub = tv ? escapeHTML(L.rx_tv_tap) : ''; extra = 'rx-msg--go';
  } else if (s.phase === 'result') {
    look = 'idle'; big = '⏱'; sub = escapeHTML(L.rx_no_tap); extra = 'rx-msg--icon';
  } else if (fake === 'yellow') {
    look = 'fake'; big = '⚡'; extra = 'rx-msg--icon';
  } else if (fake) {
    look = 'wait'; big = fake === 'cat' ? '🐱' : escapeHTML(L.rx_fake_word);
    extra = (fake === 'cat' ? 'rx-msg--icon ' : '') + (motionOff() ? '' : 'rx-msg--pop');
  } else {
    look = 'wait'; big = escapeHTML(L.reaction_wait); sub = escapeHTML(L.rx_wait_sub);
  }
  const burst = s.phase === 'go' && look === 'go' ? '<i class="rx-burst" aria-hidden="true"></i>' : '';
  const inner = `${burst}<div class="rx-msg ${extra}"><div class="rx-big">${big}</div>${sub ? `<div class="rx-sub">${sub}</div>` : ''}</div>`;
  if (tv) return `<div class="rx-pad rx-pad--tv rx-half is-${look}" data-rx-pad>${inner}</div>`;
  const live = (s.phase === 'wait' || s.phase === 'go') && !mine;
  return `<button type="button" class="rx-pad rx-half is-${look}" data-rx-pad ${live ? '' : 'disabled'}
            onpointerdown="rxrTap(event)" onclick="rxrTap(event)" aria-label="${escapeHTML(L.reaction_tap)}">${inner}</button>`;
}

/** The round's rows: who tapped first, the time, the points; a ✖ and a no-tap last. */
function rxrRowsHtml(state, s) {
  const L = rxrT();
  const rows = s.rows || [];
  if (!rows.length) return '';
  const me = Room.me;
  const rise = motionFirst(['rxr-rows', roomDealKey(state), s.round].join('|'));
  const n = rows.length;
  const html = rows.map((r, i) => {
    const out = r.ms === null;
    const rank = r.foul ? '✖' : out ? '—' : (r.pts && RXR_MEDALS[i]) || String(i + 1);
    const what = r.foul === 'fake' ? L.rx_fooled : r.foul ? L.rx_early : out ? L.rx_no_tap : '';
    // Rise from the bottom up: the fastest lands last.
    return `<div class="status-row rx-row ${out ? 'is-out' : ''} ${r.id === me ? 'is-me' : ''} ${rise ? 'rx-row--rise' : ''}" style="--at:${(n - 1 - i) * 140}ms">
      <span class="rx-rank">${rank}</span>
      <div class="status-row__body"><div class="status-row__name">${escapeHTML(r.name || rxrNameOf(state, r.id))}</div></div>
      ${out ? `<span class="rx-ms">${escapeHTML(what)}</span>` : `<span class="rx-ms metric" dir="ltr"><span data-rx-ms="${r.ms}">${r.ms}</span> ms</span>`}
      ${r.pts ? `<span class="badge badge--accent" dir="ltr">+${r.pts}</span>` : ''}
    </div>`;
  }).join('');
  return `<div class="card card--tight rx-rows" ${rise ? `data-reveal-ms="${n * 140 + 300}"` : ''}>
    <div class="eyebrow">${escapeHTML(L.rx_round_of)} <span class="metric">${s.round}/${s.rounds || 5}</span> · ${escapeHTML(L.rx_round_rows)}</div>${html}</div>`;
}

/** The end: the winner, the podium, the totals with each one's best time. */
function rxrOverHtml(state, s) {
  const L = rxrT();
  const board = s.board || [];
  const top = board[0];
  const line = top && top.score > 0 ? `<div class="rx-over__line">⚡ ${escapeHTML(rxrFill(L.rx_winner, { name: '⁨' + top.name + '⁩' }))}</div>` : '';
  const podium = renderPodium(state, board);
  return `<div class="card rx-over">${line}${podium}</div>`;
}

/** Who has tapped this round, painted in place (so others' taps don't rebuild the pad under a finger). */
function rxrCountText(state) {
  const s = state.shared || {};
  const roster = (s.roster || []).filter((id) => (state.players || []).some((p) => p.id === id));
  return rxrFill(rxrT().rx_tapped, { n: (s.taps || []).length, m: roster.length });
}

/* --- the room game ------------------------------------------------------------- */
ROOM_GAMES.reaction = {
  lateJoin: true,     // someone who joins mid-game watches the pads, and plays the next game
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const L = rxrT();
    const o = rxrOpts();
    return `
      <div class="card card--tight">
        <label class="switch-row" for="rxr-fakes">
          <span class="field__label">${escapeHTML(L.rx_fakes)}</span>
          <span class="switch">
            <input type="checkbox" id="rxr-fakes" role="switch" ${o.fakes ? 'checked' : ''} onchange="rxrSetFakes(this.checked)">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>
        <p class="field__hint" style="text-align:center">${escapeHTML(o.fakes ? L.rx_fakes_hint : L.rx_lobby_hint)}</p>
      </div>`;
  },
  startPayload() { return { fakes: !!rxrOpts().fakes }; },

  render(state) {
    if (appState.currentView !== 'room-reaction') setView('room-reaction');
    const el = document.getElementById('view-room-reaction');
    if (!el) return;
    rxrNoteTime(state);
    const L = rxrT();
    const s = state.shared || {};
    const me = Room.me;
    const inGame = (s.roster || []).indexOf(me) !== -1;
    const mine = rxrMine(state);
    const myPts = (s.points || {})[me] || 0;

    const sig = ['rxr', roomDealKey(state), s.phase, s.round, s.fake ? s.fake.kind : '', mine ? (mine.ms + ':' + mine.foul + ':' + !!mine.sure) : '',
      (s.rows || []).map((r) => r.id + ':' + r.ms + ':' + r.pts).join(','), JSON.stringify(s.board || []),
      state.youAreHost, inGame, appState.lang].join('|');

    renderRoomFrame(el, sig, () => {
      const head = `
        <div class="play-head rx-head">
          <span class="badge">${escapeHTML(L.round)} <span class="metric">${s.round || 1}/${s.rounds || 5}</span></span>
          ${inGame ? `<span class="badge badge--accent">${escapeHTML(L.rx_points)} <span class="metric">${myPts}</span></span>` : ''}
          ${s.settings && s.settings.fakes ? `<span class="badge">🐱 ${escapeHTML(L.rx_fakes)}</span>` : ''}
        </div>`;
      let main = '';
      if (s.phase === 'gameover') {
        main = rxrOverHtml(state, s);
      } else if (!inGame) {
        main = `${s.phase === 'result' ? '' : rxrPadHtml(state, s, { tv: true })}<div class="waiting-note">${escapeHTML(L.rx_watching)}</div>`;
      } else {
        main = rxrPadHtml(state, s);
      }
      const count = s.phase === 'wait' || s.phase === 'go' ? `<p class="rx-count" data-rx-count>${escapeHTML(rxrCountText(state))}</p>` : '';
      const next = s.phase === 'result' ? `<p class="rx-count" data-rx-next></p>` : '';
      const host = s.phase === 'result'
        ? roomMoveOnHtml(state, roomHostRow([[L.rx_next_now, `roomAct('nextRound', { round: ${Number(s.round) || 0} })`, 'secondary']]))
        : s.phase === 'gameover' && state.youAreHost
          ? `<div class="btn-row" style="margin-top:var(--sp-3)"><button class="btn btn--go" onclick="roomAct('playAgain', {})">▶ ${escapeHTML(L.rx_play_again)}</button><button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(L.room_another_game)}</button></div>`
          : '';
      const share = s.phase === 'gameover' && typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, s.board) : '';
      const rows = s.phase === 'result' || s.phase === 'gameover' ? rxrRowsHtml(state, s) : '';
      const board = (s.phase === 'result' || s.phase === 'gameover') ? renderScoreboard(s.board, L.rx_points) : '';
      return `<div class="rx-room">${head}${main}${count}${next}${host}${share}${rows}${board}${renderRoomPlayerStrip(state)}</div>`;
    });
    refreshRoomPlayerStrip(el, state);
    rxrAfter(state, el, false);
  }
};

/**
 * The tap: on the finger going down, once a round, with the server's time as
 * this phone knows it. Drawn at once (red: ✖ already; green: the time this phone
 * measured), and the server's verdict replaces it a moment later.
 */
function rxrTap(ev) {
  if (ev && ev.cancelable) ev.preventDefault();
  const state = Room.state;
  const s = (state && state.shared) || {};
  if (!state || state.game !== 'reaction' || (s.phase !== 'wait' && s.phase !== 'go')) return;
  if ((s.roster || []).indexOf(Room.me) === -1) return;
  const key = rxrRoundKey(state);
  if (rxr.sent === key) return;
  rxr.sent = key;
  const at = rxrTapAt();
  haptic('heavy');
  if (s.phase === 'go') {
    const ms = Math.max(RXR_FLOOR_MS, Math.round((at === null ? Date.now() : at) - (s.greenAt || 0)));
    rxr.mine = { key, ms, foul: null };
  } else {
    rxr.mine = { key, ms: null, foul: s.fake || s.fakeSeen ? 'fake' : 'early' };
  }
  roomAct('tap', { round: s.round, at });
  ROOM_GAMES.reaction.render(state);
}

/* --- motion, sound and the countdown, after every paint (phone and TV) ---------- */
function rxrAfter(state, el, tv) {
  const s = state.shared || {};
  const key = rxrRoundKey(state);
  rxrNoteTime(state);
  const pad = el.querySelector('[data-rx-pad]');
  // The green: a burst from the pad's middle, «دوس!» pops, the sound and a buzz - once a round.
  if (s.phase === 'go' && rxrOnce('go|' + (tv ? 'tv|' : '') + key)) {
    if (!motionOff() && pad) {
      pad.classList.add('rx-pad--go');
      const big = pad.querySelector('.rx-msg--go .rx-big');
      if (big) motionBump(big, 1.22);
    }
    if (!tv) haptic('heavy');
    playSound('success');
  }
  // A fake: it pops (its own CSS), and the TV's voice gives it a little sting.
  if (s.phase === 'wait' && s.fake && rxrOnce('fake|' + (tv ? 'tv|' : '') + key)) {
    if (tv || !state.screens || !state.screens.some((x) => x.online)) playSound('tick');
  }
  // My time counts up once the server has it.
  const mine = !tv && rxrMine(state);
  if (mine && mine.sure && !mine.foul && rxrOnce('mine|' + key) && !motionOff()) {
    const n = pad && pad.querySelector('[data-rx-ms]');
    if (n) countUp(n, 0, mine.ms);
  }
  if (mine && mine.sure && mine.foul && rxrOnce('foul|' + key)) {
    playSound('alarm');
    if (pad && !motionOff()) pad.animate && pad.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 260 });
  }
  // The round's times count up as their rows rise.
  if ((s.phase === 'result' || s.phase === 'gameover') && rxrOnce('rows|' + (tv ? 'tv|' : '') + key) && !motionOff()) {
    el.querySelectorAll('.rx-rows [data-rx-ms]').forEach((n) => countUp(n, 0, Number(n.dataset.rxMs) || 0));
  }
  if (s.phase === 'gameover' && rxrOnce('over|' + (tv ? 'tv|' : '') + roomDealKey(state))) {
    const top = (s.board || [])[0];
    if (top && top.score > 0 && (top.id === Room.me || state.youAreScreen)) {
      playFx('tada');
      afterReveal(el.querySelector('.rx-over') || el, () => { if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); });
    }
  }
  // The count of who has tapped, and the next round's countdown, painted in place.
  if (rxr.timer) clearInterval(rxr.timer);
  rxr.timer = null;
  const paint = () => {
    const st = Room.state;
    if (!st || st.game !== 'reaction') { rxrStop(); return; }
    const sh = st.shared || {};
    const c = el.querySelector('[data-rx-count]');
    if (c) { const txt = rxrCountText(st); if (c.textContent !== txt) c.textContent = txt; }
    const n = el.querySelector('[data-rx-next]');
    if (n && sh.phase === 'result' && sh.nextAt) {
      const left = Math.max(0, Math.ceil((sh.nextAt - rxrServerNow()) / 1000));
      const txt = rxrFill(rxrT().rx_next_in, { n: left });
      if (n.textContent !== txt) { n.textContent = txt; motionBump(n); }
    }
  };
  paint();
  if (s.phase === 'result') rxr.timer = setInterval(paint, 250);
}

function rxrStop() {
  if (rxr.timer) clearInterval(rxr.timer);
  rxr.timer = null;
}
onLeaveScreen((from) => { if (from === 'room-reaction' || from === 'room-tv') rxrStop(); });
onRoomClocksReset(() => { rxrStop(); rxr.mine = null; });

/* --- the big screen ---------------------------------------------------------- */
/** The TV's side while a round is on: everyone in, ✓ once they tapped (✖ for a tap on red). */
function rxrTvListHtml(state, s) {
  const L = rxrT();
  const rows = (state.players || []).filter((p) => (s.roster || []).indexOf(p.id) !== -1).map((p) => {
    const tap = (s.taps || []).find((x) => x.id === p.id);
    const mark = !tap ? '' : tap.foul ? '✖' : '✓';
    return `<div class="status-row ${tap && tap.foul ? 'is-out' : ''}"><div class="status-row__body"><div class="status-row__name">${escapeHTML(p.name)}</div></div><span class="rx-ms">${mark}</span>
      <span class="badge">${(s.points || {})[p.id] || 0}</span></div>`;
  }).join('');
  return `<div class="card card--tight rx-rows"><div class="eyebrow">${escapeHTML(L.rx_points)}</div>${rows}</div>`;
}

TV_GAMES.reaction = {
  sig(state) {
    const s = state.shared || {};
    return ['reaction', roomDealKey(state), s.phase, s.round, s.fake ? s.fake.kind : '',
      (s.taps || []).map((x) => x.id + ':' + (x.foul || '')).join(','), (s.rows || []).map((r) => r.id + ':' + r.ms).join(','),
      JSON.stringify(s.board || []), state.youAreHost, appState.lang].join('|');
  },
  frame(state) {
    const L = rxrT();
    const s = state.shared || {};
    const head = `<div class="tv-eyebrow tv-center-text">${escapeHTML(L.round)} <span class="metric">${s.round || 1}/${s.rounds || 5}</span>${s.settings && s.settings.fakes ? ' · 🐱 ' + escapeHTML(L.rx_fakes) : ''}</div>`;
    const host = s.phase === 'result' ? roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(L.rx_next_now, `roomAct('nextRound', { round: ${Number(s.round) || 0} })`, 'secondary')}</div>`)
      : !state.youAreHost ? '' : s.phase === 'gameover' ? `<div class="tv-actions">${tvBtn('▶ ' + L.rx_play_again, "roomAct('playAgain', {})")}${tvBtn(L.room_another_game, "roomAct('backToHub')", 'ghost')}</div>` : '';
    if (s.phase === 'gameover') {
      return `<div class="rx-tv">
        <div class="rx-tv__stage tv-scale">${head}${rxrOverHtml(state, s)}</div>
        <div class="rx-tv__side tv-scale">${renderScoreboard(s.board, L.rx_points)}${host}</div>
      </div>`;
    }
    const stage = s.phase === 'result'
      ? `${rxrRowsHtml(state, s)}<p class="tv-note" data-rx-next></p>`
      : `${rxrPadHtml(state, s, { tv: true })}<p class="tv-note" data-rx-count>${escapeHTML(rxrCountText(state))}</p>`;
    const side = s.phase === 'result' ? renderScoreboard(s.board, L.rx_points) : rxrTvListHtml(state, s);
    return `<div class="rx-tv">
      <div class="rx-tv__stage ${s.phase === 'result' ? 'tv-scale' : ''}">${head}${stage}</div>
      <div class="rx-tv__side tv-scale">${side}${host}</div>
    </div>`;
  },
  after(state) {
    const el = document.getElementById('view-room-tv');
    if (el) rxrAfter(state, el, true);
  }
};
</script>
