<style>
/* Style_Living.html - sections 44-49: the living characters - the hot-or-cold man, the bomb, the spy, the podium's cheerers, the monkey, the bus.
   Part of the stylesheet that starts in Style.html: the parts are included in
   Controller.html in this order, and the cascade depends on it. */

/* ==========================================================================
   44. خمّن الرقم: the living hot-or-cold man (the owner, 27 Sep 2026)
   --------------------------------------------------------------------------
   The same flat cast as المشنقة's man (section 25): dark ink outlines that stay
   dark in dark mode, flat fills, skin, the game's colour for the shirt. The
   svg carries its band (gn-idle, gn-far, gn-mid, gn-warm, gn-hot, gn-win,
   gn-out) and every part a band owns is .gn-o.gn-o--<band>, hidden otherwise.
   A moment (a new band) is is-morph / is-jump on the svg and is-say for the
   bubble, is-new for the arrow; each starts --gn-late ms in, so a board
   rebuilt mid-way carries on. Transform and opacity only; the groups pivot at
   their joints in the drawing's own units (transform-box: view-box). On one
   phone under the range (#gn-char), in a room beside the range on a solver's
   own board (.gn-duo), never on the TV.
   ========================================================================== */
:root { --gn-ink: #23213a; --gn-skin: #f6c9a5; --gn-hair: #3b2a1e; --gn-pants: #4b5fb0; }
body.dark { --gn-ink: #16142a; --gn-skin: #f0bf9a; --gn-hair: #4a3626; --gn-pants: #5b6fc4; }
.gn-char { display: flex; justify-content: center; }
.gn-char .gn-man { width: min(10rem, 56%); }
.gn-man { display: block; height: auto; overflow: visible; }
.gn-duo { display: flex; align-items: center; gap: var(--sp-2); }
.gn-duo > .gn-man { flex: none; width: 7.5rem; }
.gn-duo > .sv-num__range { flex: 1 1 auto; min-width: 0; }
@media (orientation: landscape) and (max-height: 500px) {
  .gn-char .gn-man { width: 6.5rem; }
  .gn-duo > .gn-man { width: 6rem; }
}

.gn-o { display: none; }
.gn-idle .gn-o--idle, .gn-far .gn-o--far, .gn-mid .gn-o--mid, .gn-warm .gn-o--warm,
.gn-hot .gn-o--hot, .gn-win .gn-o--win, .gn-out .gn-o--out { display: inline; }

.gn-ink { stroke: var(--gn-ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.gn-line { fill: none; stroke: var(--gn-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.gn-skin { fill: var(--gn-skin); }
.gn-far .gn-skin { fill: #cfe0ff; }
.gn-hot .gn-skin { fill: #ffb892; }
.gn-out .gn-skin { fill: #e6d3c4; }
.gn-hair { fill: var(--gn-hair); }
.gn-shirt { fill: var(--accent); }
.gn-sleeve { fill: none; stroke: var(--gn-ink); stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; }
.gn-sleeve--in { stroke: var(--accent); stroke-width: 3.6; }
.gn-pants { fill: var(--gn-pants); }
.gn-shoe, .gn-eye { fill: var(--gn-ink); }
.gn-hot .gn-eye { r: 3; }
.gn-shadow { fill: var(--gn-ink); opacity: 0.12; }
.gn-cheek { fill: #ff6b6b; opacity: 0.7; }
.gn-tooth, .gn-grin { fill: #fff; }
.gn-mouth-o { fill: #5a1f24; }
.gn-tongue { fill: #ff7b8b; }
.gn-snow { fill: #f6fbff; stroke-width: 1.6; }
.gn-ice { fill: #cdeeff; stroke-width: 1.2; }
.gn-scarf { fill: #e5383b; stroke-width: 1.8; }
.gn-scarf-line { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; }
.gn-flake { fill: #8ec5ff; font-family: var(--font); }
.gn-flame__out { fill: #ff7a1a; stroke-width: 1.8; }
.gn-flame__in { fill: #ffd23f; }
.gn-drop { fill: #7fb6ff; opacity: 0; }
.gn-drip { fill: #ff9f5a; opacity: 0; }
.gn-puddle { fill: #ff9f5a; opacity: 0.45; }
.gn-hat { fill: #ffd23f; stroke-width: 1.8; }
.gn-hat-line { fill: none; stroke: #e5383b; stroke-width: 2; stroke-linecap: round; }
.gn-pom { fill: #e5383b; stroke-width: 1.4; }
.gn-fan__paper { fill: #ffd23f; stroke-width: 1.8; }
.gn-fan__rib { fill: none; stroke: var(--gn-ink); stroke-width: 1; opacity: 0.45; }
.gn-cloud__c { fill: #9aa3b5; stroke-width: 1.8; }
.gn-rain { fill: none; stroke: #7fb6ff; stroke-width: 1.8; stroke-linecap: round; opacity: 0; }
.gn-arrow--up .gn-ink { fill: var(--accent); }
.gn-arrow--down .gn-ink { fill: var(--danger); }
.gn-bub__box { fill: var(--surface-solid); stroke: var(--text); stroke-width: 1.6; stroke-linejoin: round; }
.gn-bub__t { font-family: var(--font); font-size: 8.5px; font-weight: 700; fill: var(--text); }

.gn-pop, .gn-fig, .gn-head, .gn-eyes, .gn-teeth, .gn-arm, .gn-fan__leaf, .gn-flame, .gn-drop, .gn-drip, .gn-puddle, .gn-cloud, .gn-rain, .gn-flake text, .gn-bub { transform-box: view-box; }
.gn-pop, .gn-fig { transform-origin: 60px 124px; }
.gn-head { transform-origin: 60px 59px; }

/* The loops: one per band. */
.gn-eyes { transform-origin: 60px 40px; animation: gn-blink 4.2s ease-in-out infinite; }
.gn-idle .gn-fig { animation: gn-breathe 3s ease-in-out infinite; }
.gn-far .gn-fig { animation: gn-shiver 0.14s linear infinite; }
.gn-far .gn-teeth { transform-origin: 60px 49px; animation: gn-chatter 0.12s linear infinite; }
.gn-flake text { animation: gn-snow 3.2s linear infinite; }
.gn-flake text:nth-child(2) { animation-delay: -1.1s; }
.gn-flake text:nth-child(3) { animation-delay: -2.2s; }
.gn-mid .gn-fig { animation: gn-tilt 3.4s ease-in-out infinite; }
.gn-warm .gn-fig { animation: gn-tilt 2.2s ease-in-out infinite; }
.gn-fan__leaf { transform-origin: 89px 54px; }
.gn-warm .gn-fan__leaf { animation: gn-fan 0.42s ease-in-out infinite alternate; }
.gn-warm .gn-drop--1 { transform-origin: 40px 34px; animation: gn-sweat 1.1s ease-out infinite; }
.gn-warm .gn-drop--2 { transform-origin: 80px 32px; animation: gn-sweat 1.1s ease-out infinite 0.5s; }
.gn-hot .gn-fig { animation: gn-hop 0.62s ease-in-out infinite; }
.gn-flame { transform-origin: 60px 31px; }
.gn-hot .gn-flame { animation: gn-flicker 0.28s ease-in-out infinite alternate; }
.gn-arm--l { transform-origin: 47px 66px; }
.gn-arm--r { transform-origin: 73px 66px; }
.gn-hot .gn-arm--l { animation: gn-flap-l 0.5s ease-in-out infinite; }
.gn-hot .gn-arm--r { animation: gn-flap-r 0.5s ease-in-out infinite; }
.gn-hot .gn-drip--1 { transform-origin: 53px 60px; animation: gn-drip 0.9s ease-in infinite; }
.gn-hot .gn-drip--2 { transform-origin: 66px 60px; animation: gn-drip 0.9s ease-in infinite 0.45s; }
.gn-puddle { transform-origin: 60px 126px; }
.gn-hot .gn-puddle { animation: gn-puddle 1.2s ease-in-out infinite alternate; }
.gn-win .gn-fig { animation: gn-bounce 0.8s ease-in-out infinite; }
.gn-win .gn-arm--l { animation: gn-cheer-l 0.8s ease-in-out infinite; }
.gn-win .gn-arm--r { animation: gn-cheer-r 0.8s ease-in-out infinite; }
.gn-out .gn-fig { transform: translateY(5px) rotate(-5deg); }
.gn-out .gn-head { transform: rotate(10deg) translateY(2px); }
.gn-out .gn-eyes { animation: none; }
.gn-cloud { transform-origin: 69px 7px; }
.gn-out .gn-cloud { animation: gn-cloud 3s ease-in-out infinite; }
.gn-out .gn-rain { animation: gn-rain 0.8s linear infinite; }
.gn-out .gn-rain--2 { animation-delay: 0.27s; }
.gn-out .gn-rain--3 { animation-delay: 0.53s; }
.gn-arrow__in { transform-box: fill-box; transform-origin: 50% 50%; }
.gn-arrow--up .gn-arrow__in { animation: gn-arr-up 0.9s ease-in-out infinite; }
.gn-arrow--down .gn-arrow__in { animation: gn-arr-down 0.9s ease-in-out infinite; }
.gn-arrow { transform-box: fill-box; transform-origin: 50% 50%; }

/* The moments: a new band pops him into his new self (a jump for the hit), the arrow pops in, the bubble speaks at once. */
.gn-man.is-morph .gn-pop { animation: gn-morph 520ms var(--ease-out) both; animation-delay: var(--gn-late, 0ms); }
.gn-man.is-jump .gn-pop { animation: gn-jump 900ms var(--ease-out) both; animation-delay: var(--gn-late, 0ms); }
.gn-man.is-new .gn-arrow { animation: gn-arrow-in 440ms var(--ease-out) both; animation-delay: var(--gn-late, 0ms); }

/* The bubble: two seconds every nine, the band's line; said at once when the band changes, then back to now and then. */
.gn-bub { opacity: 0; transform-origin: 30px 4px; animation: gn-bub 9s ease-in-out infinite; animation-delay: 2s; }
.gn-man.is-say .gn-bub { animation: gn-bub-now 2.4s ease-out both, gn-bub 9s ease-in-out infinite; animation-delay: var(--gn-late, 0ms), calc(2.4s + var(--gn-late, 0ms)); }

@keyframes gn-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.15); } }
@keyframes gn-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.01, 1.025); } }
@keyframes gn-shiver { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.3px); } 75% { transform: translateX(1.3px); } }
@keyframes gn-chatter { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.62); } }
@keyframes gn-snow { 0% { transform: translateY(-8px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
@keyframes gn-tilt { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes gn-fan { 0% { transform: rotate(-20deg); } 100% { transform: rotate(14deg); } }
@keyframes gn-sweat { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(0, 10px) scale(1); } }
@keyframes gn-hop { 0%, 100% { transform: translateY(0) scale(1.05, 0.95); } 15% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-8px) scale(0.97, 1.04); } 80% { transform: translateY(0) scale(1, 1); } }
@keyframes gn-flicker { 0% { transform: scale(0.95, 0.94); } 100% { transform: scale(1.05, 1.14); } }
@keyframes gn-flap-l { 0%, 100% { transform: rotate(25deg); } 50% { transform: rotate(-70deg); } }
@keyframes gn-flap-r { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(70deg); } }
@keyframes gn-drip { 0% { opacity: 0; transform: translateY(0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px) scale(1.1); } }
@keyframes gn-puddle { 0% { transform: scaleX(0.85); } 100% { transform: scaleX(1.08); } }
@keyframes gn-bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9px); } 70% { transform: translateY(0) scale(1.04, 0.96); } }
@keyframes gn-cheer-l { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
@keyframes gn-cheer-r { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
@keyframes gn-cloud { 0%, 100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
@keyframes gn-rain { 0% { opacity: 0; transform: translateY(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
@keyframes gn-arr-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes gn-arr-down { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes gn-morph { 0% { transform: scale(0.7); opacity: 0.4; } 35% { transform: scale(1.14, 0.9); opacity: 1; } 65% { transform: scale(0.95, 1.07); } 100% { transform: scale(1); opacity: 1; } }
@keyframes gn-jump { 0% { transform: translateY(0) scale(1); } 15% { transform: translateY(0) scale(1.1, 0.88); } 45% { transform: translateY(-28px) scale(0.94, 1.08); } 75% { transform: translateY(0) scale(1.12, 0.88); } 100% { transform: translateY(0) scale(1); } }
@keyframes gn-arrow-in { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes gn-bub { 0%, 60%, 100% { opacity: 0; transform: scale(0.6); } 66%, 88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(0.8); } }
@keyframes gn-bub-now { 0% { opacity: 0; transform: scale(0.5); } 12% { opacity: 1; transform: scale(1.08); } 18% { transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.8); } }

@media (prefers-reduced-motion: reduce) {
  .gn-pop, .gn-fig, .gn-head, .gn-eyes, .gn-teeth, .gn-arm, .gn-fan__leaf, .gn-flame, .gn-drop, .gn-drip, .gn-puddle, .gn-cloud, .gn-rain, .gn-flake text, .gn-bub, .gn-arrow, .gn-arrow__in { animation: none !important; }
  .gn-bub { opacity: 1; }
  .gn-drop, .gn-drip { opacity: 1; }
}

/* ==== 45. القنبلة: the living bomb (JS_Bomb.html, 27 Sep 2026) ==== */
/* The bomb as a character in المشنقة's flat-cartoon look: ink outlines that stay dark in dark mode,
   flat fills, a face that changes with the heat (bm-h0..3 on the svg, switched in place by
   bombCharHeat): happy at 0, eyes open at 1, wide and sweating at 2, a gasp and a hard shake at 3.
   The fuse is four pieces that fade as it burns and the spark slides down it (a transition on its
   transform); every tick squashes it (.is-tick on .bm-jolt). The explosion (.bomb-boom-svg) plays
   once a round, from --bm-late (a negative delay) so a redraw carries on; .is-settled is the
   remains. Transform and opacity only; stilled under reduced motion at the end. */
:root {
  --bm-ink: #1b1a2a; --bm-shell: #2e2b3a; --bm-rim: rgba(255, 255, 255, 0.16); --bm-cap: #6c6579; --bm-cord: #d9b27c;
  --bm-spark: #f97316; --bm-spark-core: #ffe27a; --bm-cheek: #ff8fa3; --bm-drop: #8cc2ff; --bm-mouth: #7a1e2b;
  --bm-smoke: #a39cb2; --bm-soot: #1d1a22; --bm-face: #f6efe2; --bm-fire: #ff8a1f; --bm-fire-in: #ffd23f; --bm-flash: #fff6cf;
}
body.dark { --bm-ink: #0b0a14; --bm-shell: #34303f; --bm-rim: rgba(255, 255, 255, 0.22); --bm-smoke: #7b748d; }

.bomb-fuse.bm-holder { line-height: 0; margin-bottom: var(--sp-2); }
.bomb-char { display: block; margin-inline: auto; overflow: visible; }
.bomb-char--big { width: min(10.5rem, 44vw); }
.bomb-char--small { width: 5rem; }
.bomb-char--mini { display: inline-block; width: 100%; height: 100%; vertical-align: middle; }
.bomb-char[role="button"] { cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 50%; }
.bomb-char[role="button"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
@media (orientation: landscape) and (max-height: 500px) { .bomb-char--big { width: 6.5rem; } .bomb-char--small { width: 3.5rem; } }
.tv-bomb .bomb-char--big { width: 8.5rem; }
/* On the TV the bomb stands beside the category, so the order and the strikes stay on the screen. */
.tv-bomb .bomb-card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-5); align-items: center; max-width: 44rem; }
.tv-bomb .bomb-card > :is(.bomb-fuse, .bomb-boom) { grid-row: 1 / span 4; margin: 0; }
.tv-bomb .bomb-card > :not(.bomb-fuse):not(.bomb-boom) { grid-column: 2; }

.bomb-char g, .bomb-char circle, .bomb-char ellipse, .bomb-char path, .bomb-boom-svg g, .bomb-boom-svg circle, .bomb-boom-svg polygon { transform-box: view-box; }
.bm-ink { stroke: var(--bm-ink); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.bm-line { fill: none; }
.bm-shell { fill: var(--bm-shell); stroke-width: 3.2; }
.bm-rim { fill: none; stroke: var(--bm-rim); stroke-width: 1.6; }
.bm-shine { fill: #fff; opacity: 0.38; }
.bm-cap { fill: var(--bm-cap); }
.bm-cap__band { fill: #fff; opacity: 0.28; }
.bm-shadow { fill: var(--bm-ink); opacity: 0.16; }
.bm-fuse__ink { fill: none; stroke: var(--bm-ink); stroke-width: 5.8; stroke-linecap: round; }
.bm-fuse__cord { fill: none; stroke: var(--bm-cord); stroke-width: 3; stroke-linecap: round; }
.bm-fuse { transition: opacity 600ms var(--ease-out); }
.bm-h1 .bm-fuse--3, .bm-h2 .bm-fuse--3, .bm-h2 .bm-fuse--2, .bm-h3 .bm-fuse--3, .bm-h3 .bm-fuse--2, .bm-h3 .bm-fuse--1 { opacity: 0; }
.bm-spark { transition: transform 900ms var(--ease-out); }
.bomb-char .bm-spark__size, .bomb-char .bm-spark__fl { transform-origin: 0 0; }
.bm-spark__size { transition: transform 600ms var(--ease-out); }
.bm-h2 .bm-spark__size { transform: scale(1.25); }
.bm-h3 .bm-spark__size { transform: scale(1.55); }
.bm-spark__star { fill: var(--bm-spark); stroke: var(--bm-ink); stroke-width: 1.3; stroke-linejoin: round; }
.bm-spark__core { fill: var(--bm-spark-core); }
.bm-spark__fl { animation: bm-flicker 0.26s steps(2, jump-none) infinite; }
.bm-spark__p { fill: var(--bm-spark-core); opacity: 0; }
.bm-spark__p--1 { animation: bm-sp1 0.7s ease-out infinite; }
.bm-spark__p--2 { animation: bm-sp2 0.7s ease-out infinite 0.23s; }
.bm-spark__p--3 { animation: bm-sp3 0.7s ease-out infinite 0.46s; }
@keyframes bm-flicker { 0% { transform: scale(1) rotate(0deg); } 100% { transform: scale(0.8) rotate(20deg); } }
@keyframes bm-sp1 { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(-8px, -7px); } }
@keyframes bm-sp2 { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(8px, -8px); } }
@keyframes bm-sp3 { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(3px, 9px); } }

/* The face, a set a heat. */
.bm-f { display: none; }
.bm-h0 .bm-f--0, .bm-h1 .bm-f--1, .bm-h2 .bm-f--2, .bm-h3 .bm-f--3 { display: inline; }
.bm-mouth-fill, .bm-gasp { fill: var(--bm-mouth); }
.bm-face .bm-ink { stroke: var(--bm-face); }
.bm-face .bm-eye-w { stroke: var(--bm-ink); }
.bm-cheek { fill: var(--bm-cheek); opacity: 0.75; }
.bm-eye-w { fill: #fff; stroke-width: 2.2; }
.bm-pupil { fill: var(--bm-ink); }
.bm-blink { transform-origin: 58px 80px; animation: bm-blink 3.8s ease-in-out infinite; }
.bm-look { animation: bm-look 1.4s ease-in-out infinite; }
.bm-drop { fill: var(--bm-drop); stroke: var(--bm-ink); stroke-width: 0.9; opacity: 0; }
.bm-h2 .bm-drop--2 { animation: bm-sweat 1.4s ease-in infinite; }
.bm-h3 .bm-drop--1 { animation: bm-sweat 0.8s ease-in infinite; }
.bm-h3 .bm-drop--2 { animation: bm-sweat 0.8s ease-in infinite 0.4s; }
.bm-glow { fill: var(--danger); opacity: 0; transform-origin: 58px 82px; transition: opacity 600ms var(--ease-out); }
.bm-h2 .bm-glow { opacity: 0.1; }
.bm-h3 .bm-glow { animation: bm-pulse 0.5s ease-in-out infinite alternate; }
@keyframes bm-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
@keyframes bm-look { 0%, 100% { transform: translate(-2.2px, 0); } 50% { transform: translate(2.2px, 0); } }
@keyframes bm-sweat { 0% { opacity: 0; transform: translate(0, 0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(0, 12px); } }
@keyframes bm-pulse { 0% { opacity: 0.12; transform: scale(0.96); } 100% { opacity: 0.22; transform: scale(1.05); } }

/* The body's loop, harder with every heat, and the jolt of every tick. */
.bm-body { transform-origin: 58px 120px; }
.bm-h0 .bm-body { animation: bm-bob 2.6s ease-in-out infinite; }
.bm-h1 .bm-body { animation: bm-rock 1.3s ease-in-out infinite; }
.bm-h2 .bm-body { animation: bm-jitter 0.42s linear infinite; }
.bm-h3 .bm-body { animation: bm-jitter-hard 0.2s linear infinite; }
.bm-jolt { transform-origin: 58px 122px; }
.bomb-char.is-tick .bm-jolt { animation: bm-jolt 200ms var(--ease-out); }
.bomb-char.bm-h3.is-tick .bm-jolt { animation-name: bm-jolt-hard; }
.bomb-char.is-hotter .bm-glow { animation: bm-hot 700ms var(--ease-out); }
.bomb-char.bm-h3.is-hotter .bm-glow { animation: bm-hot 700ms var(--ease-out), bm-pulse 0.5s ease-in-out 700ms infinite alternate; }
@keyframes bm-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-3px) rotate(2deg); } }
@keyframes bm-rock { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes bm-jitter { 0%, 100% { transform: translate(0, 0) rotate(-3deg); } 25% { transform: translate(1.5px, -1px) rotate(2deg); } 50% { transform: translate(-1px, 1px) rotate(-2deg); } 75% { transform: translate(1px, 0) rotate(3deg); } }
@keyframes bm-jitter-hard { 0%, 100% { transform: translate(0, 0) rotate(-5deg); } 25% { transform: translate(2.5px, -2px) rotate(4deg); } 50% { transform: translate(-2.5px, 1px) rotate(-4deg); } 75% { transform: translate(2px, 1px) rotate(5deg); } }
@keyframes bm-jolt { 0% { transform: scale(1); } 35% { transform: scale(1.07, 0.93); } 100% { transform: scale(1); } }
@keyframes bm-jolt-hard { 0% { transform: scale(1); } 35% { transform: scale(1.13, 0.87); } 70% { transform: scale(0.96, 1.05); } 100% { transform: scale(1); } }

/* ==========================================================================
   47. THE PODIUM: THE LIVING CHEERERS (27 Sep 2026) - a figure of the cast
   on every step (podCastDress in JS_Motion.html dresses any .podium or
   .tv-podium put into the page, so no caller changed): the winner jumping
   with both arms up and a crown landing on its head, the second clapping and
   nodding, the third sulking with its arms crossed, then shrugging and
   clapping too (a ten-second loop). The first letter of the name on the
   shirt. Flat cartoon, the same cast as المشنقة's man (section 25): ink
   outlines that stay dark in dark mode, skin, a shirt in the step's colour.
   They rise with their step only under .podium--rise / .tv-podium--rise (the
   caller's motionFirst key), so a redraw shows them settled; a bubble now and
   then on a phone, never on the TV; .podium--plain keeps the old look.

:root { --pod-ink: #23213a; --pod-skin: #f6c9a5; --pod-pants: #4b5fb0; --pod-gold: #f5b400; --pod-silver: #c3cad6; --pod-bronze: #d6955a; }
body.dark { --pod-ink: #16142a; --pod-skin: #f0bf9a; --pod-pants: #5b6fc4; }
.podium--plain .pod-cast { display: none; }
.pod-cast {
  position: relative;
  /* Over the step (the rising step is a later layer of its own): the winner's bubble sits on it. */
  z-index: 1;
  display: flex;
  justify-content: center;
  /* The feet on the step: the place's gap taken back. */
  margin-bottom: calc(-1 * var(--sp-2));
  pointer-events: none;
  --pod-d1: 3s;
  --pod-d3: -5.4s;

.pod-fig--r3 { --pod-shirt: var(--pod-bronze); }
.pod-ink { stroke: var(--pod-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pod-skin { fill: var(--pod-skin); }
.pod-pants { fill: var(--pod-pants); }
.pod-shoe, .pod-eye { fill: var(--pod-ink); }
.pod-shadow { fill: var(--pod-ink); opacity: 0.16; }
.pod-shirt { fill: var(--pod-shirt); }
.pod-sleeve { fill: none; stroke: var(--pod-ink); stroke-width: 7; stroke-linecap: round; }
.pod-sleeve--in { stroke: var(--pod-shirt); stroke-width: 3.4; }
.pod-letter {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 800;
  fill: #fff;
  stroke: var(--pod-ink);
  stroke-width: 2.6px;
  stroke-linejoin: round;
  paint-order: stroke;
}
.pod-crown { display: none; fill: var(--pod-gold); }
.pod-eyes-happy, .pod-brows, .pod-mouth { display: none; fill: none; }
.pod-mouth--grin { fill: #fff; }
.pod-cross { opacity: 0; }
.pod-jump, .pod-arm, .pod-head, .pod-crown, .pod-shadow, .pod-cross, .pod-mouth, .pod-brows { transform-box: view-box; }
.pod-arm--l { transform-origin: 21px 34px; }
.pod-arm--r { transform-origin: 39px 34px; }
.pod-head { transform-origin: 30px 29px; }
.pod-jump, .pod-shadow { transform-origin: 30px 80px; }
.pod-crown { transform-origin: 30px 6px; }

/* The winner: both arms up, happy eyes, a grin, the crown, jumping. */
.pod-fig--r1 .pod-crown, .pod-fig--r1 .pod-eyes-happy, .pod-fig--r1 .pod-mouth--grin { display: block; }
.pod-fig--r1 .pod-eyes { display: none; }
.pod-fig--r1 .pod-arm--l { transform: rotate(143deg); animation: pod-wave-l 1.1s ease-in-out infinite; }
.pod-fig--r1 .pod-arm--r { transform: rotate(-143deg); animation: pod-wave-r 1.1s ease-in-out infinite; }
.pod-fig--r1 .pod-jump { animation: pod-jump 1.1s ease-in-out infinite; }
.pod-fig--r1 .pod-shadow { animation: pod-shadow 1.1s ease-in-out infinite; }

@keyframes pod-wave-r { 0%, 100% { transform: rotate(-143deg); } 50% { transform: rotate(-162deg); } }
@keyframes pod-jump {
  0%, 100% { transform: translateY(0) scale(1.07, 0.93); }

  82% { transform: translateY(0) scale(1, 1); }
}
@keyframes pod-shadow { 0%, 14%, 82%, 100% { transform: scale(1); opacity: 0.16; } 48% { transform: scale(0.65); opacity: 0.08; } }

/* The second: clapping in front of the chest, nodding along. */
.pod-fig--r2 .pod-mouth--smile { display: block; }
.pod-fig--r2 .pod-arm--l { transform: rotate(-38deg); animation: pod-clap-l 0.46s ease-in-out infinite; }

/* The third: arms crossed and a pout, then a shrug, then clapping too, and round again (ten
   seconds). Settled it starts in the clapping (--pod-d3), risen it starts sulking as it lands.
   Without the loop (reduced motion) it simply claps: that is the base below. */
.pod-fig--r3 .pod-mouth, .pod-fig--r3 .pod-brows { display: block; opacity: 0; }
.pod-fig--r3 .pod-mouth--smile { opacity: 1; }

.pod-fig--r3 .pod-arm--r { transform: rotate(38deg); animation: pod-r3-arm-r 10s linear infinite; animation-delay: var(--pod-d3); }
.pod-fig--r3 .pod-cross { animation: pod-r3-cross 10s linear infinite; animation-delay: var(--pod-d3); }
.pod-fig--r3 .pod-mouth--sulk, .pod-fig--r3 .pod-brows { animation: pod-r3-sulk 10s linear infinite; animation-delay: var(--pod-d3); }
.pod-fig--r3 .pod-mouth--flat { animation: pod-r3-flat 10s linear infinite; animation-delay: var(--pod-d3); }
.pod-fig--r3 .pod-mouth--smile { animation: pod-r3-smile 10s linear infinite; animation-delay: var(--pod-d3); }
.pod-fig--r3 .pod-head { animation: pod-r3-head 10s ease-in-out infinite; animation-delay: var(--pod-d3); }
.pod-fig--r3 .pod-jump { animation: pod-r3-body 10s ease-in-out infinite; animation-delay: var(--pod-d3); }
@keyframes pod-r3-arm-l {
  0%, 38% { transform: rotate(-38deg); opacity: 0; }
  40% { transform: rotate(107deg); opacity: 1; }
  44% { transform: rotate(119deg); }
  48% { transform: rotate(107deg); }
  51% { transform: rotate(107deg); }
  54% { transform: rotate(-38deg); }
  56.5% { transform: rotate(-20deg); }
  59% { transform: rotate(-38deg); }
  61.5% { transform: rotate(-20deg); }
  64% { transform: rotate(-38deg); }
  66.5% { transform: rotate(-20deg); }
  69% { transform: rotate(-38deg); }
  71.5% { transform: rotate(-20deg); }
  74% { transform: rotate(-38deg); }
  76.5% { transform: rotate(-20deg); }
  79% { transform: rotate(-38deg); }
  81.5% { transform: rotate(-20deg); }
  84% { transform: rotate(-38deg); }
  86.5% { transform: rotate(-20deg); }
  89% { transform: rotate(-38deg); }
  91.5% { transform: rotate(-20deg); }
  94% { transform: rotate(-38deg); }

  99%, 100% { transform: rotate(-38deg); opacity: 0; }
}
@keyframes pod-r3-arm-r {
  0%, 38% { transform: rotate(38deg); opacity: 0; }
  40% { transform: rotate(-107deg); opacity: 1; }
  44% { transform: rotate(-119deg); }
  48% { transform: rotate(-107deg); }
  51% { transform: rotate(-107deg); }
  54% { transform: rotate(38deg); }
  56.5% { transform: rotate(20deg); }
  59% { transform: rotate(38deg); }
  61.5% { transform: rotate(20deg); }
  64% { transform: rotate(38deg); }
  66.5% { transform: rotate(20deg); }
  69% { transform: rotate(38deg); }
  71.5% { transform: rotate(20deg); }
  74% { transform: rotate(38deg); }
  76.5% { transform: rotate(20deg); }
  79% { transform: rotate(38deg); }
  81.5% { transform: rotate(20deg); }
  84% { transform: rotate(38deg); }
  86.5% { transform: rotate(20deg); }
  89% { transform: rotate(38deg); }
  91.5% { transform: rotate(20deg); }
  94% { transform: rotate(38deg); }
  97% { transform: rotate(38deg); opacity: 1; }

}
@keyframes pod-r3-cross { 0%, 38% { opacity: 1; } 39.5%, 98% { opacity: 0; } 99.5%, 100% { opacity: 1; } }
@keyframes pod-r3-sulk { 0%, 38% { opacity: 1; } 39.5%, 98% { opacity: 0; } 99.5%, 100% { opacity: 1; } }
@keyframes pod-r3-flat { 0%, 39% { opacity: 0; } 40%, 51% { opacity: 1; } 52.5%, 100% { opacity: 0; } }
@keyframes pod-r3-smile { 0%, 51% { opacity: 0; } 52.5%, 97% { opacity: 1; } 98.5%, 100% { opacity: 0; } }
@keyframes pod-r3-head {

/* The bubbles: the winner's line two seconds every nine, the third's while it sulks. */
.pod-bub {
  position: absolute;
  bottom: 62%;
  z-index: 1;
  padding: 0.15rem 0.45rem;
  border: 1.5px solid var(--text);

.pod-bub--r1 { top: calc(100% + 0.45rem); bottom: auto; inset-inline: -1rem; width: max-content; max-width: calc(100% + 2rem); margin-inline: auto; white-space: normal; text-align: center; transform-origin: 50% 0%; animation: pod-bub 9s ease-in-out infinite; animation-delay: var(--pod-d1); }

.pod-bub--r3 { inset-inline-end: 60%; border-end-end-radius: 0.15rem; transform-origin: 100% 100%; animation: pod-bub3 10s ease-in-out infinite; animation-delay: var(--pod-d3); }

/* Rising with the step: the figure hops up onto it once the step is up, the crown lands after,
   the third starts sulking and the winner's first line waits until it has landed. */
.podium--rise .pod-cast, .tv-podium--rise .pod-cast {
  --pod-d1: calc(var(--at, 0ms) + 2600ms);
  --pod-d3: calc(var(--at, 0ms) + 900ms);
  animation: pod-in 560ms cubic-bezier(0.2, 1.35, 0.35, 1) both;
  animation-delay: calc(var(--at, 0ms) + 380ms);
  transform-origin: 50% 100%;
}

@media (prefers-reduced-motion: reduce) {

/* ==== 48. ربع قرد: the living monkey ====
   A player's quarters as a flat cartoon monkey (mkFigSvg in JS_Monkey.html), المشنقة's cast: ink
   outlines that stay dark in dark mode, flat fills, dot eyes. mk-q0..4 on the svg is how many quarters
   (1 the tail, 2 the body and legs, 3 the arms, 4 the head); the pieces not yet earned are a faint
   dashed outline (a silhouette on the small figures, .mk-monkey--mini). Every move is a transform on a
   group pivoted at its joint (transform-box: view-box). The big figures (.mk-big: the verdict, a
   monkey's own note, the TV) sit and rock, scratch, hang from the branch and throw a banana peel, beat
   the chest; the small ones only twitch the tail and rock, and a whole one sleeps. A one-shot's delay
   is var(--mk-late) (negative), so a redraw inside a moment carries on. */
:root { --mk-ink: #23213a; --mk-fur: #9a6440; --mk-belly: #f3d2a6; --mk-ghost: #23213a; --mk-branch: #7a5231; --mk-leaf: #3f9a52; --mk-peel: #f2c632; --mk-ground: #d9d2e8; }
body.dark { --mk-ink: #16142a; --mk-fur: #a86f48; --mk-belly: #efc99a; --mk-ghost: #c9c2e6; --mk-branch: #8a5f3a; --mk-leaf: #4caf60; --mk-ground: #3a3552; }
.mk-monkey { display: block; width: 100%; height: auto; overflow: visible; }
.mk-ink { stroke: var(--mk-ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.mk-fur { fill: var(--mk-fur); }
.mk-belly { fill: var(--mk-belly); }
.mk-eye { fill: var(--mk-ink); }
.mk-tl { fill: none; stroke: var(--mk-ink); stroke-width: 7; stroke-linecap: round; }
.mk-tl--in { stroke: var(--mk-fur); stroke-width: 3.4; }
.mk-branch { fill: none; stroke: var(--mk-branch); stroke-width: 3.2; stroke-linecap: round; }
.mk-leaf { fill: var(--mk-leaf); }
.mk-ground { fill: var(--mk-ground); }
.mk-peel { display: none; }
.mk-peel__skin { fill: var(--mk-peel); stroke: var(--mk-ink); stroke-width: 1.2; stroke-linejoin: round; }
.mk-eyes-shut, .mk-brows, .mk-mouth, .mk-tongue, .mk-drop, .mk-zzz { display: none; }
.mk-eyes-shut, .mk-brows, .mk-mouth { fill: none; }
.mk-mouth--grin { fill: #fff; }
.mk-tongue { fill: var(--danger); }
.mk-drop { fill: #7fb6ff; }
.mk-zzz { font-family: var(--font); font-size: 13px; font-weight: 800; fill: var(--mk-ghost); }
.mk-fig, .mk-act, .mk-part, .mk-pop, .mk-arm, .mk-eyes, .mk-drop, .mk-peel, .mk-bub, .mk-zzz { transform-box: view-box; }

/* The face: cheeky while there is hope, worried at three quarters, a grin once whole, asleep when out. */
.mk-q0 :is(.mk-brows--cheeky, .mk-mouth--cheeky, .mk-tongue--cheeky),
.mk-q1 :is(.mk-brows--cheeky, .mk-mouth--cheeky, .mk-tongue--cheeky),
.mk-q2 :is(.mk-brows--cheeky, .mk-mouth--cheeky, .mk-tongue--cheeky) { display: block; }
.mk-q3 :is(.mk-brows--worry, .mk-mouth--worry, .mk-drop) { display: block; }
.mk-q4 .mk-mouth--grin { display: block; }
.mk-monkey.is-asleep .mk-eyes, .mk-monkey.is-asleep .mk-mouth--grin { display: none; }
.mk-monkey.is-asleep :is(.mk-eyes-shut, .mk-mouth--o, .mk-zzz) { display: block; }
.mk-monkey--mini.is-asleep .mk-act { filter: grayscale(0.8); opacity: 0.8; }

/* The pieces still to come: a dashed outline (the face faint on it), or a silhouette when small. */
.mk-pop.mk-ghost { opacity: 0.3; }
.mk-ghost :is(.mk-fur, .mk-belly) { fill: none; }
.mk-ghost .mk-ink { stroke: var(--mk-ghost); stroke-width: 1.3; stroke-dasharray: 2.4 2.6; }
.mk-ghost .mk-face .mk-ink { stroke-dasharray: none; stroke-width: 1.6; }
.mk-ghost .mk-eye { fill: var(--mk-ghost); }
.mk-ghost .mk-tl { stroke: var(--mk-ghost); stroke-width: 1.3; stroke-dasharray: 2.4 2.6; }
.mk-ghost .mk-tl--in, .mk-ghost .mk-tongue { display: none; }
.mk-monkey--mini .mk-pop.mk-ghost { opacity: 0.14; }
.mk-monkey--mini .mk-ghost :is(.mk-fur, .mk-belly) { fill: var(--mk-ghost); }
.mk-monkey--mini .mk-ghost .mk-ink { stroke: none; }
.mk-monkey--mini .mk-ghost .mk-face { display: none; }
.mk-monkey--mini .mk-ghost .mk-tl { stroke: var(--mk-ghost); stroke-width: 7; stroke-dasharray: none; }

/* A quarter given pops in from its joint; one taken back (swapped back in) pops out over its ghost. */
.mk-tail .mk-pop { transform-origin: 58px 86px; }
.mk-body .mk-pop { transform-origin: 50px 90px; }
.mk-arms .mk-pop { transform-origin: 50px 62px; }
.mk-head .mk-pop { transform-origin: 50px 57px; }
.mk-pop.is-new { animation: mk-pop-in 520ms var(--ease-out) both; animation-delay: calc(var(--mk-i, 0) * 180ms + var(--mk-late, 0ms)); }
.mk-pop.is-lost { animation: mk-pop-out 620ms var(--ease-out) forwards; animation-delay: var(--mk-late, 0ms); }
@keyframes mk-pop-in { 0% { transform: scale(0); } 60% { transform: scale(1.18); } 80% { transform: scale(0.94); } 100% { transform: scale(1); } }
@keyframes mk-pop-out { 0% { transform: scale(1); opacity: 1; } 30% { transform: scale(1.15) rotate(-6deg); opacity: 1; } 100% { transform: scale(0) rotate(20deg) translateY(-8px); opacity: 0; } }

/* The loops. */
.mk-tail { transform-origin: 58px 86px; }
.mk-fig { transform-origin: 50px 98px; }
.mk-arm--l { transform-origin: 41px 63px; }
.mk-arm--r { transform-origin: 59px 63px; }
.mk-head { transform-origin: 50px 57px; }
.mk-eyes { transform-origin: 50px 41.5px; animation: mk-blink 4.6s ease-in-out infinite; }
.mk-q3 .mk-eyes { animation-duration: 2.2s; }
.mk-monkey:not(.is-asleep):is(.mk-q1, .mk-q2, .mk-q3, .mk-q4) .mk-tail { animation: mk-twitch 3.8s ease-in-out infinite; }
.mk-monkey--mini:not(.is-asleep):is(.mk-q1, .mk-q2, .mk-q3) .mk-tail { animation-duration: 5.6s; }
.mk-q2 .mk-fig, .mk-monkey--mini.mk-q3 .mk-fig { animation: mk-rock 3.2s ease-in-out infinite; }
.mk-monkey--mini:is(.mk-q2, .mk-q3) .mk-fig { animation-duration: 4.8s; }
.mk-monkey.is-asleep .mk-fig { animation: mk-breathe 3.6s ease-in-out infinite; }
.mk-monkey.is-asleep .mk-eyes { animation: none; }
.mk-monkey.is-asleep .mk-zzz { animation: mk-zzz 2.8s ease-in-out infinite; }
.mk-monkey.is-asleep .mk-zzz--2 { animation-delay: 1.4s; }

/* Three quarters (big): it scratches where its head will be, hangs from the branch by one arm, then
   throws a banana peel that lands beside it. One 12 s loop over the figure, both arms and the peel. */
.mk-big.mk-q3 .mk-fig { animation: mk-q3-fig 12s ease-in-out infinite; }
.mk-big.mk-q3 .mk-arm--r { animation: mk-q3-arm-r 12s ease-in-out infinite; }
.mk-big.mk-q3 .mk-arm--l { animation: mk-q3-arm-l 12s ease-in-out infinite; }
.mk-big.mk-q3 .mk-peel { display: block; opacity: 0; transform-origin: 0 0; animation: mk-q3-peel 12s linear infinite; }
.mk-big.mk-q3 .mk-drop { transform-origin: 63px 33px; animation: mk-sweat 1.3s ease-out infinite; }

/* The whole monkey (big): beats its chest, jumps, nods. Just become one: two big jumps and a drum roll
   on the chest first, then the loop. */
.mk-big.mk-q4:not(.is-asleep) .mk-fig { animation: mk-q4-fig 6s ease-in-out infinite; }
.mk-big.mk-q4:not(.is-asleep) .mk-arm--l { animation: mk-q4-arm-l 6s ease-in-out infinite; }
.mk-big.mk-q4:not(.is-asleep) .mk-arm--r { animation: mk-q4-arm-r 6s ease-in-out infinite; }
.mk-big.mk-q4:not(.is-asleep) .mk-head { animation: mk-q4-head 6s ease-in-out infinite; }
.mk-big.is-became .mk-fig { animation: mk-q4-fig 6s ease-in-out calc(2400ms + var(--mk-late, 0ms)) infinite, mk-became 2.4s var(--ease-out) var(--mk-late, 0ms) backwards; }
.mk-big.is-became .mk-arm--l { animation: mk-q4-arm-l 6s ease-in-out calc(2400ms + var(--mk-late, 0ms)) infinite, mk-beat-l 240ms ease-in-out var(--mk-late, 0ms) 10 alternate; }
.mk-big.is-became .mk-arm--r { animation: mk-q4-arm-r 6s ease-in-out calc(2400ms + var(--mk-late, 0ms)) infinite, mk-beat-r 240ms ease-in-out calc(120ms + var(--mk-late, 0ms)) 10 alternate; }
.mk-big.is-became .mk-head { animation: mk-q4-head 6s ease-in-out calc(2400ms + var(--mk-late, 0ms)) infinite; }

@keyframes mk-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.12); } }
@keyframes mk-twitch { 0%, 78%, 100% { transform: rotate(0deg); } 82% { transform: rotate(-16deg); } 86% { transform: rotate(9deg); } 90% { transform: rotate(-7deg); } 94% { transform: rotate(3deg); } }
@keyframes mk-rock { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes mk-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 0.97); } }
@keyframes mk-zzz { 0% { opacity: 0; transform: translate(0, 4px) scale(0.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -8px) scale(1.1); } }
@keyframes mk-sweat { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(5px, 9px) scale(1); } }
@keyframes mk-q3-fig {
  0% { transform: rotate(-2deg); } 12% { transform: rotate(2deg); } 26% { transform: rotate(-1deg); }
  30% { transform: translate(0, 0); } 34% { transform: translate(0, -28px); } 37% { transform: translate(0, -26px) rotate(3deg); }
  42% { transform: translate(0, -26px) rotate(-3deg); } 47% { transform: translate(0, -26px) rotate(3deg); } 52% { transform: translate(0, -26px) rotate(0deg); }
  56% { transform: translate(0, 2px) scale(1.06, 0.93); } 59% { transform: translate(0, 0) scale(1, 1); }
  72% { transform: rotate(2deg); } 86% { transform: rotate(-2deg); } 100% { transform: rotate(-2deg); }
}
@keyframes mk-q3-arm-r {
  0%, 3% { transform: rotate(0deg); } 6% { transform: rotate(140deg); } 9% { transform: rotate(160deg); } 12% { transform: rotate(140deg); }
  15% { transform: rotate(160deg); } 18% { transform: rotate(140deg); } 21% { transform: rotate(160deg); } 25%, 31% { transform: rotate(0deg); }
  34%, 52% { transform: rotate(-160deg); } 57%, 100% { transform: rotate(0deg); }
}
@keyframes mk-q3-arm-l {
  0%, 30% { transform: rotate(0deg); } 36% { transform: rotate(18deg); } 42% { transform: rotate(-14deg); } 48% { transform: rotate(18deg); }
  54%, 58% { transform: rotate(0deg); } 62% { transform: rotate(-25deg); } 65% { transform: rotate(95deg); } 70%, 100% { transform: rotate(0deg); }
}
@keyframes mk-q3-peel {
  0%, 64% { opacity: 0; transform: translate(23px, 52px) scale(0.6); }
  65% { opacity: 1; transform: translate(23px, 52px) rotate(0deg); }
  69% { opacity: 1; transform: translate(16px, 36px) rotate(160deg); }
  76% { opacity: 1; transform: translate(12px, 97px) rotate(330deg); }
  78% { opacity: 1; transform: translate(12px, 93px) rotate(345deg); }
  80%, 95% { opacity: 1; transform: translate(12px, 97px) rotate(360deg); }
  99%, 100% { opacity: 0; transform: translate(12px, 97px) rotate(360deg); }
}
@keyframes mk-q4-fig {
  0%, 25% { transform: translate(0, 0); } 30% { transform: translate(0, 2px) scale(1.06, 0.94); } 36% { transform: translate(0, -14px) scale(0.96, 1.05); }
  42% { transform: translate(0, 1px) scale(1.06, 0.94); } 46% { transform: translate(0, 0) scale(1, 1); }
  70% { transform: rotate(2deg); } 85% { transform: rotate(-2deg); } 100% { transform: rotate(0deg); }
}
@keyframes mk-q4-arm-l {
  0% { transform: rotate(0deg); } 3%, 9%, 15%, 21% { transform: rotate(-72deg); } 6%, 12%, 18% { transform: rotate(-12deg); }
  25% { transform: rotate(0deg); } 36% { transform: rotate(40deg); } 44%, 100% { transform: rotate(0deg); }
}
@keyframes mk-q4-arm-r {
  0%, 3% { transform: rotate(0deg); } 6%, 12%, 18% { transform: rotate(72deg); } 9%, 15%, 21% { transform: rotate(12deg); }
  25% { transform: rotate(0deg); } 36% { transform: rotate(-40deg); } 44%, 100% { transform: rotate(0deg); }
}
@keyframes mk-q4-head { 0%, 100% { transform: rotate(0deg); } 5%, 15% { transform: rotate(-4deg); } 10%, 20% { transform: rotate(4deg); } 25% { transform: rotate(0deg); } }
@keyframes mk-became {
  0% { transform: scale(0.92); } 12% { transform: translate(0, -18px) scale(0.96, 1.05); } 22% { transform: translate(0, 2px) scale(1.1, 0.9); }
  30% { transform: translate(0, 0) scale(1, 1); } 45% { transform: translate(0, -15px) scale(0.96, 1.05); } 55% { transform: translate(0, 2px) scale(1.08, 0.92); }
  62%, 100% { transform: translate(0, 0) scale(1, 1); }
}
@keyframes mk-beat-l { from { transform: rotate(-10deg); } to { transform: rotate(-78deg); } }
@keyframes mk-beat-r { from { transform: rotate(10deg); } to { transform: rotate(78deg); } }

/* The speech bubble: a line a stage, two seconds every nine, never on the small figures. */
.mk-bub { opacity: 0; transform-origin: 34px 20px; animation: mk-bub 9s ease-in-out infinite; animation-delay: var(--mk-bub-delay, 0s); }
.mk-bub__box { fill: var(--surface-solid); stroke: var(--text); stroke-width: 1.4; stroke-linejoin: round; }
.mk-bub__t { font-family: var(--font); font-size: 10px; font-weight: 700; fill: var(--text); }
.mk-q3 .mk-bub { animation-duration: 7s; }
.mk-big.is-became .mk-bub { animation: mk-bub-now 2.6s ease-in-out calc(500ms + var(--mk-late, 0ms)) both, mk-bub 9s ease-in-out calc(3.2s + var(--mk-late, 0ms)) infinite; }
@keyframes mk-bub { 0%, 60%, 100% { opacity: 0; transform: scale(0.6); } 66%, 88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(0.8); } }
@keyframes mk-bub-now { 0% { opacity: 0; transform: scale(0.5); } 15%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.8); } }

/* Where the monkeys sit: small on every row and chip, big beside a verdict and on the TV. */
.mk-row-fig { flex: 0 0 auto; width: 3rem; margin-inline-end: calc(var(--sp-1) * -1); }
.mk-row-bub {
  display: inline-block; margin-inline-start: var(--sp-2); padding: 0.05rem 0.55rem;
  border: 1.5px solid var(--text); border-radius: var(--r-full); background: var(--surface-solid);
  color: var(--text); font-size: var(--fs-xs); font-weight: 800; white-space: nowrap; vertical-align: middle;
}
.status-row--out .mk-row-fig { opacity: 1; }
.mk-verdict:has(> .mk-verdict__fig) { justify-content: flex-start; padding-block: var(--sp-2); }
.mk-verdict__fig { flex: 0 0 auto; width: 7.5rem; margin-block: calc(var(--sp-1) * -1); }
.mk-verdict__text { flex: 1 1 auto; min-width: 0; }
.mk-res { display: inline-flex; align-items: center; gap: var(--sp-1); }
.mk-res-fig { display: inline-block; width: 1.9rem; }
.mk-tv-stage { flex-direction: row; gap: 4vmin; }
.mk-tv-fig { flex: 0 0 auto; width: 30vmin; }
.mk-tv-main { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); min-width: 0; }
.mk-tv-chip .mk-monkey { width: 5.6vmin; }
.mk-tv-strip { margin-top: 5vmin; }
.mk-tv-chip { position: relative; }
.mk-row-bub--tv {
  position: absolute; bottom: calc(100% + 0.6vmin); left: 50%; translate: -50% 0;
  margin: 0; font-size: var(--tv-xs); opacity: 0; animation: mk-tv-bub 3s var(--ease-out) var(--mk-late, 0ms) both;
}
@keyframes mk-tv-bub { 0% { opacity: 0; transform: scale(0.6); } 12%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.9); } }

@media (prefers-reduced-motion: reduce) {
  .mk-monkey *, .mk-monkey .mk-fig, .mk-row-bub--tv { animation: none !important; }
  .mk-pop.is-lost { display: none; }
  .mk-bub { opacity: 0; }
  .mk-row-bub--tv { opacity: 1; }
}

/* ==========================================================================
   49. أتوبيس كومبليت: the living bus (27 Sep 2026, JS_StopBus.html) - a flat
   cartoon in المشنقة's cast: ink outlines that stay dark, the game's accent
   for the body, a destination board where the round's letter lands. The scene
   is a physical strip (dir="ltr"); in Arabic the bus drives right to left
   (--sbus-dir: -1, the body mirrored in the SVG). The drive in, the idle and
   the drive off are transforms on three nested boxes (.sbus-bus moves,
   .sbus-rock rocks, .sbus-bob bounces); the SVG's pieces inside the mirrored
   group turn on their own box (transform-box: fill-box), so a mirror turns the
   wheels the other way by itself. Every one-shot waits var(--sbus-late) (a
   negative delay: a frame rebuilt mid-way carries on) and ends `both`.
   ========================================================================== */
:root { --sbus-ink: #23213a; --sbus-skin: #f6c9a5; --sbus-glass: #cfe6fb; --sbus-road: #dcd6e6; --sbus-kerb: #bdb5cf; --sbus-dust: #c9c2dc; --sbus-metal: #8a86a0; --sbus-led: #ffcf4a; --sbus-deep: #2f2a4a; }
body.dark { --sbus-ink: #16142a; --sbus-skin: #f0bf9a; --sbus-glass: #3d5478; --sbus-road: #2a2640; --sbus-kerb: #3b3656; --sbus-dust: #5a5470; --sbus-metal: #6b6780; }

/* Edge to edge in the card on a phone; on a laptop or a phone on its side no wider than the screen's height allows. */
.sbus-scene { --sbus-dir: 1; --sbus-w: min(calc(100% + 2 * var(--sp-4)), 36rem, calc(var(--app-h, 100dvh) * 0.8)); position: relative; width: var(--sbus-w); margin: var(--sp-2) calc((100% - var(--sbus-w)) / 2) var(--sp-3); aspect-ratio: 100 / 47; overflow: clip; container-type: inline-size; }
.sbus-scene.is-rtl, .sbus-left.is-rtl { --sbus-dir: -1; }
.sbus-road { position: absolute; left: 0; right: 0; bottom: 0; height: 15%; background: var(--sbus-road); border-top: 0.35cqw solid var(--sbus-kerb);
  background-image: linear-gradient(90deg, rgba(255,255,255,0.75) 55%, transparent 55%); background-size: 9% 0.6cqw; background-repeat: repeat-x; background-position: 0 62%; }
body.dark .sbus-road { background-image: linear-gradient(90deg, rgba(255,255,255,0.28) 55%, transparent 55%); }
.sbus-bus { position: absolute; left: 3%; bottom: 7%; width: 76%; container-type: inline-size; transform-origin: 50% 100%; }
.sbus-scene.is-rtl .sbus-bus { left: 21%; }
.sbus-rock, .sbus-bob { position: relative; transform-origin: 50% 100%; }
.sbus-svg, .sbus-stop__svg, .sbus-walker { display: block; width: 100%; height: auto; overflow: visible; }
.sbus-stop { position: absolute; left: 84%; bottom: 7%; width: 11.5%; }
.sbus-scene.is-rtl .sbus-stop { left: 4.5%; }

/* The drawing's colours. */
.sbus-ink { stroke: var(--sbus-ink); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.sbus-body { fill: var(--accent); }
.sbus-roof { fill: #fff; opacity: 0.35; }
.sbus-skirt { fill: #000; opacity: 0.13; }
.sbus-stripe { fill: #fff; opacity: 0.9; }
.sbus-glass { fill: var(--sbus-glass); }
.sbus-shine { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; opacity: 0.55; }
.sbus-doorway, .sbus-arch, .sbus-board__led { fill: var(--sbus-deep); }
.sbus-dark, .sbus-tyre, .sbus-board, .sbus-eye, .sbus-shoe { fill: var(--sbus-ink); }
.sbus-metal { fill: var(--sbus-metal); }
.sbus-hub { fill: #d9d3e6; }
.sbus-spoke { fill: none; stroke: var(--sbus-ink); stroke-width: 1.6; stroke-linecap: round; }
.sbus-lamp { fill: #ffe27a; }
.sbus-shadow { fill: #000; opacity: 0.16; }
.sbus-skin { fill: var(--sbus-skin); }
.sbus-mouth, .sbus-face-happy { fill: none; }
.sbus-driver__shirt, .sbus-pants { fill: #4b5fb0; }
.sbus-sleeve { fill: none; stroke: #4b5fb0; stroke-width: 4.2; }
.sbus-initial { fill: #fff; font-family: var(--font-display); font-weight: 800; }
.sbus-sign { fill: #f5b400; }
.sbus-sign__bus { fill: #fff; }
.sbus-sign__win { fill: var(--sbus-glass); }
.sbus-pax .sbus-face-happy { display: none; }
.sbus-pax.is-done .sbus-face-happy { display: block; }
.sbus-pax.is-done .sbus-face-open { display: none; }

/* The destination board: the letter spinLetter spins lands here, in amber LEDs. */
.sbus-led { position: absolute; left: 48.33%; top: 0.8%; width: 47.5%; height: 30.6%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.sbus-scene.is-rtl .sbus-led { left: 4.17%; }
.sbus-led .stop-letter, .sbus-led .tv-stop-letter { font-family: var(--font-display); font-size: 14.5cqw; font-weight: 900; line-height: 1; color: var(--sbus-led); text-shadow: 0 0 0.14em rgba(255, 207, 74, 0.65); }
.sbus-led .stop-letter.is-spinning, .sbus-led .tv-stop-letter.is-spinning { color: #b9a15e; text-shadow: none; }

/* The timetable on the stop's pole: the round's clock, read from the existing element. */
.sbus-tt { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.1em;
  min-width: 118%; padding: 0.35em 0.4em 0.3em; border: 0.35cqw solid var(--sbus-ink); border-radius: 0.4em; background: var(--sbus-deep); color: var(--sbus-led); font-size: 3.1cqw; line-height: 1; box-shadow: 0 0.2em 0 rgba(0, 0, 0, 0.18); }
.sbus-scene .sbus-tt { font-size: max(3.1cqw, 0.7rem); }
.sbus-tt__head { font-size: 0.8em; }
.sbus-tt .metric, .sbus-tt .badge, .sbus-tt .tv-timer { all: unset; font-family: var(--font-display); font-size: 1.9em; font-weight: 900; color: var(--sbus-led); font-variant-numeric: tabular-nums; }
