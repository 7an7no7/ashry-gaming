<script>
/* ============================================================================
   لوحدك — what every one-player game shares
   ----------------------------------------------------------------------------
   The solo games (سودوكو, 2048, كاسحة الألغام, الملكات, شمس وقمر, نونوجرام,
   خيوط, كلمات من حروف, إيه اللي يجمعهم؟, سلسلة الإجابات, خمّن الدولة) and
   تحدي اليوم are built on these pieces, so each game file is only its own
   rules and board.

   - SOLO_GAMES: a game registers its screens (soloRegister). A reload goes
     back to its board through soloRestoreView (called from restoreView), its
     setup is painted through soloPaintSetup (from paintSetupOptions), and
     loadFromLocal accepts its views through soloViews. `repaint` redraws the
     board when the language changes (onLanguageChange).
   - Randomness that repeats: soloRng(seed) is a small seeded generator, and
     soloDaySeed(id) the seed for a game's puzzle of the day - the same puzzle
     on every phone on the same date, a new one at local midnight. Anything a
     daily puzzle deals has to go through the seeded source, never
     Math.random, or two phones get different puzzles.
   - Bests per game and level (soloBest / soloRecord) and today's results
     (soloDailyResult / soloMarkDaily / soloStreak), in this phone's storage.
   - A daily is played once: starting it again goes back to the board it was
     left on (soloDailyResume), and a new game dealt over it sets it aside
     first (soloDailySetAside, ashryDailyPlay_v1). A daily finished after
     midnight counts for the day it was started.
   - The clock of a timed game (`timed: true`) stops while its board is not on
     screen - another screen, the phone locked, the app closed - by moving
     startedAt forward by the break (soloPause / soloResume).
   - The result sheet (soloResult): icon, title, a number that counts up, a
     line or two, share (a daily result goes to WhatsApp as text), again,
     exit, and "look at the board", which closes the sheet and leaves the
     finished board on screen with a way back to the result.
   - Timers that end a game later (a result sheet after an animation) go
     through soloLater, so they do nothing once a new game has started or the
     player has left the board.
   ========================================================================= */

const SOLO_GAMES = {};

/**
 * {
 *   setup: 'setup-x', play: 'play-x', paintSetup(), restore() -> bool,
 *   state: () => appState.x,      the game's state (daily, phase, startedAt)
 *   resume(),                     back to a board in play (its "continue")
 *   repaint(),                    redraw the board's text (language change)
 *   timed: true,                  the clock stops while the board is away
 *   prefs: ['level']              setup choices a daily set aside must not overwrite
 * }
 */
function soloRegister(id, def) {
  SOLO_GAMES[id] = Object.assign({ id: id }, def);
}

function soloViews() {
  const out = [];
  Object.keys(SOLO_GAMES).forEach(id => {
    const g = SOLO_GAMES[id];
    if (g.setup) out.push(g.setup);
    if (g.play) out.push(g.play);
  });
  return out;
}

/** The solo game whose board is on screen, if any. */
function soloGameOnScreen() {
  return Object.values(SOLO_GAMES).find(g => g.play && g.play === appState.currentView) || null;
}

/** A reload on a solo game's board: redraw it, or fall back to its setup. */
function soloRestoreView(viewId) {
  const g = Object.values(SOLO_GAMES).find(x => x.play === viewId);
  if (!g) return false;
  if (g.timed && g.state) soloResume(g.state());
  let ok = false;
  try { ok = !!(g.restore && g.restore()); } catch (e) { ok = false; }
  if (!ok) setTimeout(() => setView(g.setup), 50);
  return true;
}

function soloPaintSetup(viewId) {
  const g = Object.values(SOLO_GAMES).find(x => x.setup === viewId);
  if (g && typeof g.paintSetup === 'function') g.paintSetup();
}

/** A key press a board should ignore: typing in a field, a shortcut, or a popup open over it. */
function soloKeyBlocked(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return true;
  const target = e.target;
  if (target && target.closest && target.closest('input, textarea, select, [contenteditable="true"]')) return true;
  return !!document.querySelector('.modal-overlay:not(.hidden)');
}

/* --- Timers that belong to one game ------------------------------------------ */

const soloEpochs = {};

/** A new board for game `id`: timers set for the last one no longer fire. */
function soloNewGame(id) {
  soloEpochs[id] = (soloEpochs[id] || 0) + 1;
  soloLookOn = null;   // the finished board being looked at is gone
  const g = typeof SOLO_GAMES !== 'undefined' ? SOLO_GAMES[id] : null;
  const s = g && g.state ? g.state() : null;
  if (s && s.archive) delete s.archive;
}

/** setTimeout for game `id` that does nothing if a new game started or its board left the screen. */
function soloLater(id, ms, fn) {
  const epoch = soloEpochs[id] || 0;
  const g = SOLO_GAMES[id];
  return setTimeout(() => {
    if ((soloEpochs[id] || 0) !== epoch) return;
    if (g && g.play && appState.currentView !== g.play) return;
    fn();
  }, ms || 0);
}

/* --- Randomness that can repeat ---------------------------------------------- */

function soloHash(text) {
  let h = 2166136261;
  const s = String(text);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** mulberry32: a fast seeded generator, good enough for dealing puzzles. */
function soloRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var soloArchiveDay = null;

/** Today on this phone, as YYYY-MM-DD (local time, so the day turns at midnight here). */
function soloToday(date) {
  if (soloArchiveDay && !date) return soloArchiveDay;
  const d = date || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function soloDaySeed(id, day) {
  return soloHash('ashry-daily:' + id + ':' + (day || soloArchiveDay || soloToday()));
}

/** Whole days from 1 Jan 2026 to a YYYY-MM-DD date: a counter for things that go round day by day. */
function soloDayIndex(day) {
  const p = String(day || soloArchiveDay || soloToday()).split('-').map(Number);
  return Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - Date.UTC(2026, 0, 1)) / 86400000);
}

/** A random source: seeded when a seed is given (the daily), Math.random otherwise. */
function soloRandom(seed) {
  return (seed === undefined || seed === null) ? Math.random : soloRng(seed);
}

function soloShuffle(arr, rnd) {
  const r = rnd || Math.random;
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}

function soloPick(arr, rnd) {
  return arr[Math.floor((rnd || Math.random)() * arr.length)];
}

/* --- Bests --------------------------------------------------------------------- */

const SOLO_BEST_KEY = 'ashrySoloBest_v1';

function soloBestAll() {
  try { return JSON.parse(localStorage.getItem(SOLO_BEST_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function soloBest(id, level) {
  return soloBestAll()[id + ':' + (level || '')] || null;
}

/**
 * Keeps `result` as the best for this game and level if `isBetter(result, prev)`.
 * Returns { record, prev }.
 */
function soloRecord(id, level, result, isBetter) {
  const all = soloBestAll();
  const key = id + ':' + (level || '');
  const prev = all[key] || null;
  const record = !prev || isBetter(result, prev);
  if (record) {
    all[key] = result;
    try { localStorage.setItem(SOLO_BEST_KEY, JSON.stringify(all)); } catch (e) {}
  }
  return { record: record, prev: prev };
}

/** Puts a best back to what it was (null: no best), for a move that was taken back. */
function soloSetBest(id, level, result) {
  const all = soloBestAll();
  const key = id + ':' + (level || '');
  if (result) all[key] = result; else delete all[key];
  try { localStorage.setItem(SOLO_BEST_KEY, JSON.stringify(all)); } catch (e) {}
}

/* --- Today's puzzles (تحدي اليوم) ------------------------------------------------ */

const SOLO_DAILY_KEY = 'ashryDaily_v1';

function soloDailyAll() {
  try { return JSON.parse(localStorage.getItem(SOLO_DAILY_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function soloDailyResult(id, day) {
  const all = soloDailyAll();
  return (all[day || soloToday()] || {})[id] || null;
}

/**
 * Remembers a daily's result (the first one only: a daily is played once),
 * under the day it was started - one begun before midnight and finished after
 * still counts for its own day.
 */
function soloMarkDaily(id, result, day) {
  const all = soloDailyAll();
  const key = day || soloToday();
  all[key] = all[key] || {};
  if (all[key][id]) return all[key][id];
  all[key][id] = result;
  // Two months is plenty for a streak.
  const cutoff = soloToday(new Date(Date.now() - 62 * 24 * 3600 * 1000));
  Object.keys(all).forEach(d => { if (d < cutoff) delete all[d]; });
  try { localStorage.setItem(SOLO_DAILY_KEY, JSON.stringify(all)); } catch (e) {}
  const kept = soloDailyKept();
  if (kept[id] && kept[id].day === key) { delete kept[id]; soloDailyKeptSave(kept); }
  return result;
}

/** Days in a row with at least one daily finished, counting today or, if not yet, yesterday. */
function soloStreak() {
  const all = soloDailyAll();
  const has = (d) => Object.keys(all[soloToday(d)] || {}).length > 0;
  const day = new Date();
  if (!has(day)) day.setDate(day.getDate() - 1);
  let n = 0;
  while (has(day) && n < 400) {
    n++;
    day.setDate(day.getDate() - 1);
  }
  return n;
}

/* --- A daily in progress ------------------------------------------------------------ */

/* A daily can't be dealt again from the start for a better go. While it is the
   game's current board it lives in the game's own state, like any game; when
   another board of that game is dealt over it, a copy is set aside here (one
   per game, today's only), and starting the daily again brings it back. */
const SOLO_DAILY_PLAY_KEY = 'ashryDailyPlay_v1';

function soloDailyKept() {
  try { return JSON.parse(localStorage.getItem(SOLO_DAILY_PLAY_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function soloDailyKeptSave(all) {
  const today = soloToday();
  Object.keys(all).forEach(id => { if (!all[id] || all[id].day !== today) delete all[id]; });
  try { localStorage.setItem(SOLO_DAILY_PLAY_KEY, JSON.stringify(all)); } catch (e) {}
}

/** Today's daily is the game's current board, still being played. */
function soloDailyLive(g) {
  const s = g && g.state ? g.state() : null;
  return !!(s && s.daily && s.daily === soloToday() && s.phase === 'play' && !soloDailyResult(g.id));
}

/** Today's daily of `id` was started and isn't finished (on its board, or set aside). */
function soloDailyInProgress(id) {
  if (soloDailyResult(id)) return false;
  if (soloDailyLive(SOLO_GAMES[id])) return true;
  const kept = soloDailyKept()[id];
  return !!(kept && kept.day === soloToday() && kept.state);
}

/** Called before a game deals a new board: today's daily in progress is kept aside, not lost. */
function soloDailySetAside(id) {
  const g = SOLO_GAMES[id];
  if (!soloDailyLive(g)) return;
  const copy = JSON.parse(JSON.stringify(g.state()));
  soloPause(copy);
  const all = soloDailyKept();
  all[id] = { day: copy.daily, state: copy };
  soloDailyKeptSave(all);
}

/**
 * Starting today's daily when it has already begun: back to that board.
 * Returns true when it did, so the game doesn't deal it fresh.
 */
function soloDailyResume(id) {
  const g = SOLO_GAMES[id];
  if (!g || !g.state || typeof g.resume !== 'function' || soloDailyResult(id)) return false;
  if (soloArchiveDay) return false;
  if (!soloDailyLive(g)) {
    const all = soloDailyKept();
    const kept = all[id];
    if (!kept || kept.day !== soloToday() || !kept.state) return false;
    // Put it back in the same object (the game's code holds on to it),
    // keeping the setup choices made since.
    const s = g.state();
    const prefs = {};
    (g.prefs || []).forEach(k => { if (k in s) prefs[k] = s[k]; });
    Object.keys(s).forEach(k => { delete s[k]; });
    Object.assign(s, kept.state, prefs);
    delete all[id];
    soloDailyKeptSave(all);
    saveToLocal();
  }
  soloNewGame(id);
  if (appState.currentView === g.play) soloResume(g.state());
  g.resume();
  return true;
}

/**
 * Asks before a new board replaces a game with work on it. Today's daily is
 * never lost (it is set aside), so it doesn't ask for that. Returns true when
 * it asked; `go` runs on yes.
 */
function soloConfirmNew(id, hasWork, go) {
  const g = SOLO_GAMES[id];
  const s = g && g.state ? g.state() : null;
  if (!s || s.phase !== 'play' || (s.daily && s.daily === soloToday()) || !hasWork(s)) return false;
  const t = TRANSLATIONS[appState.lang] || {};
  showConfirmModal(t.solo_new_confirm || t.g2048_new_confirm || 'تبدأ لعبة جديدة وتسيب اللي شغال؟', go);
  return true;
}

/* --- The clock stops while the board is away ---------------------------------------- */

/** Marks when a timed board went away (another screen, a locked phone). */
function soloPause(s) {
  if (s && s.phase === 'play' && s.startedAt && !s.pausedAt) s.pausedAt = Date.now();
}

/** Back on the board: the break is taken off the clock by moving its start forward. */
function soloResume(s) {
  if (!s || !s.pausedAt) return;
  if (s.startedAt && s.pausedAt >= s.startedAt) s.startedAt += Math.max(0, Date.now() - s.pausedAt);
  s.pausedAt = 0;
}

function soloPauseOnScreen(hidden) {
  const g = soloGameOnScreen();
  if (!g || !g.timed || !g.state) return;
  const s = g.state();
  if (hidden) {
    soloPause(s);
    saveToLocal();
  } else {
    soloResume(s);
    soloClockRefresh();
  }
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', () => soloPauseOnScreen(document.visibilityState === 'hidden'));
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pagehide', () => soloPauseOnScreen(true));
}

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    Object.values(SOLO_GAMES).forEach(g => {
      if (!g.timed || !g.state || !g.play) return;
      if (from === g.play) soloPause(g.state());
      if (to === g.play) soloResume(g.state());
    });
    if (soloLookOn && from === soloLookOn.view) soloLookOn = null;
  });
}

if (typeof onLanguageChange === 'function') {
  onLanguageChange((view) => {
    const g = Object.values(SOLO_GAMES).find(x => x.play && x.play === view);
    if (!g || typeof g.repaint !== 'function') return;
    g.repaint();
    soloLookPaint();
  });
}

/* --- Small pieces ---------------------------------------------------------------- */

function soloTime(seconds) {
  const s = Math.max(0, Math.floor(seconds || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = String(s % 60).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss;
}

const soloClockPainters = {};

/**
 * A running clock for a board, painted into #id every second. `startedAt` is
 * a function reading the state (it moves when a break is taken off), or a
 * fixed time.
 */
function soloClock(elId, startedAt) {
  const get = typeof startedAt === 'function' ? startedAt : () => startedAt;
  const paint = () => {
    const el = document.getElementById(elId);
    if (el) el.textContent = soloTime((Date.now() - get()) / 1000);
  };
  soloClockPainters[elId] = paint;
  return createClock({ countUp: true, onTick: paint });
}

function soloClockRefresh() {
  Object.keys(soloClockPainters).forEach(id => soloClockPainters[id]());
}

/** The stats row above a board: [{ label, value, id }]. */
function soloBarHtml(items) {
  const g = typeof soloGameOnScreen === 'function' ? soloGameOnScreen() : null;
  const s = g && g.state ? g.state() : null;
  const isArchive = !!(s && s.archive);
  const t = (typeof TRANSLATIONS !== 'undefined' && typeof appState !== 'undefined' && TRANSLATIONS[appState.lang]) || {};
  const archiveHtml = isArchive ? `<div class="solo-archive-badge"><span class="badge badge--warning">📅 ${escapeHTML(t.daily_archive_badge || 'أرشيف')} ${escapeHTML(s.archive)}</span></div>` : '';
  return archiveHtml + `<div class="solo-bar" style="--solo-cols:${items.length}">${items.map(it => `
    <div class="solo-stat${it.cls ? ' ' + it.cls : ''}">
      <span class="solo-stat__label">${escapeHTML(it.label || '')}</span>
      <b class="metric"${it.id ? ` id="${it.id}"` : ''}>${it.value === undefined ? '' : it.value}</b>
    </div>`).join('')}</div>`;
}

/** The daily line on a setup screen: play today's puzzle, carry on with it, or see that it's done. */
function soloDailyButtonHtml(id, startCall) {
  const t = TRANSLATIONS[appState.lang] || {};
  const done = soloDailyResult(id);
  if (done) return `<div class="solo-daily is-done"><span aria-hidden="true">📅</span><span>${escapeHTML(t.daily_done_today || '')}</span><b>✓</b></div>`;
  const label = soloDailyInProgress(id) ? (t.daily_continue_today || 'كمّل تحدي النهارده') : (t.daily_play_today || '');
  return `<button type="button" class="btn btn--secondary" onclick="${startCall}">📅 ${escapeHTML(label)}</button>`;
}

/* --- The result sheet ------------------------------------------------------------- */

let soloResultActions = { again: null, exit: null, share: '' };
let soloLastResult = null;   // the sheet last shown, to open it again from the board
let soloLookOn = null;       // { view } while a finished board is being looked at

/**
 * o: { icon, title, value (number, counts up) or valueText, valueLabel, lines: [html],
 *      win (confetti), share (text, for a daily), again(), againLabel, exit(),
 *      look (false: no "look at the board"), quiet (no sound or confetti: opened again) }
 */
function soloResult(o) {
  const t = TRANSLATIONS[appState.lang] || {};
  const g = typeof soloGameOnScreen === 'function' ? soloGameOnScreen() : null;
  const s = g && g.state ? g.state() : null;
  if (s && s.archive) {
    o = Object.assign({}, o, {
      share: '',
      again: typeof playArchive === 'function' ? () => playArchive(g.id, s.archive) : o.again,
      againLabel: '🔄 ' + (t.play_again || 'العب تاني'),
      exit: typeof openDailyArchive === 'function' ? openDailyArchive : openDaily
    });
  } else if (o.share && typeof soloHubReturn !== 'undefined' && soloHubReturn) {
    o = Object.assign({}, o, { again: openDaily, againLabel: '📅 ' + (t.daily_back || ''), exit: openDaily });
  }
  soloResultActions = { again: o.again || null, exit: o.exit || null, share: o.share || '' };
  soloLastResult = o;
  soloLookOn = null;
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('solo-result-icon', o.icon || '🏁');
  set('solo-result-title', escapeHTML(o.title || ''));
  set('solo-result-label', escapeHTML(o.valueLabel || ''));
  set('solo-result-detail', (o.lines || []).map(l => `<p class="sheet__subtitle">${l}</p>`).join(''));
  const valueEl = document.getElementById('solo-result-value');
  if (valueEl) {
    if (typeof o.value === 'number') {
      valueEl.textContent = String(o.value);
      if (!o.quiet && typeof countUp === 'function' && !motionOff() && o.value > 0) countUp(valueEl, 0, o.value);
    } else {
      valueEl.textContent = o.valueText || '';
    }
  }
  const share = document.getElementById('solo-result-share');
  if (share) share.classList.toggle('hidden', !o.share);
  const shareText = document.getElementById('solo-result-share-text');
  if (shareText) shareText.classList.toggle('hidden', !o.share);
  const again = document.getElementById('solo-result-again');
  if (again) {
    again.classList.toggle('hidden', !o.again);
    again.textContent = o.againLabel || t.play_again || '';
  }
  const look = soloResultLookButton();
  if (look) {
    look.textContent = '👀 ' + (t.solo_look || 'شوف اللوحة');
    look.classList.toggle('hidden', o.look === false || !soloGameOnScreen());
  }
  const modal = document.getElementById('solo-result-modal');
  if (modal) modal.classList.remove('hidden');
  if (o.quiet) return;
  if (o.win) {
    playSound('success');
    if (typeof confetti === 'function') setTimeout(() => confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }), 250);
  } else {
    playSound('alarm');
  }
}

/** The sheet's "look at the board" button: in the markup (#solo-result-look), or added once before Exit. */
function soloResultLookButton() {
  let btn = document.getElementById('solo-result-look');
  if (btn) return btn;
  const modal = document.getElementById('solo-result-modal');
  const actions = modal && modal.querySelector('.modal-actions');
  if (!actions || !document.createElement) return null;
  btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'solo-result-look';
  btn.className = 'btn btn--neutral';
  btn.setAttribute('onclick', 'soloResultLook()');
  actions.insertBefore(btn, actions.lastElementChild);
  return btn;
}

function soloResultAgain() {
  closeModal('solo-result-modal');
  soloLookOn = null;
  if (soloResultActions.again) soloResultActions.again();
}

function soloResultExit() {
  closeModal('solo-result-modal');
  soloLookOn = null;
  if (soloResultActions.exit) soloResultActions.exit();
}

/**
 * The result as a picture. soloLastResult is the sheet exactly as it was
 * drawn, so the card carries the same icon, title, number and lines, and the
 * game's own share text (a daily's streak and its grid of emoji) goes under
 * them - and travels with the picture as the message's text.
 */
function soloResultShare() {
  if (!soloResultActions.share) return;
  const o = soloLastResult || {};
  const value = typeof o.value === 'number' ? String(o.value) : (o.valueText || '');
  const rows = [];
  if (value) rows.push({ name: shareCardText(o.valueLabel) || (o.title || ''), value: value });
  (o.lines || []).forEach(l => { const line = shareCardText(l); if (line) rows.push(line); });
  return shareResultCard({
    title: o.title || '',
    icon: o.icon || '🏁',
    rows: rows,
    footer: soloResultActions.share.split('\n')[0] || '',
    text: soloResultActions.share
  });
}

/** The same result as plain words, for anyone who would rather send that. */
function soloResultShareText() {
  const t = TRANSLATIONS[appState.lang] || {};
  if (!soloResultActions.share) return;
  shareOrCopy(appLink(), soloResultActions.share, t.solo_copied || '');
}

/** Closes the sheet and leaves the finished board on screen, with the result and "again" at its foot. */
function soloResultLook() {
  closeModal('solo-result-modal');
  const g = soloGameOnScreen();
  if (!g || !soloLastResult) return;
  soloLookOn = { view: g.play };
  soloLookPaint();
}

/** Adds the result and "again" buttons to the board's action bar (again after a redraw). */
function soloLookPaint() {
  if (!soloLookOn || !soloLastResult || appState.currentView !== soloLookOn.view) return;
  const view = document.getElementById('view-' + soloLookOn.view);
  if (!view || view.querySelector('.solo-look')) return;
  const bars = view.querySelectorAll('.view-actions');
  const actions = bars[bars.length - 1];
  if (!actions) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const o = soloLastResult;
  const row = document.createElement('div');
  row.className = 'btn-row solo-look';
  row.innerHTML = `<button type="button" class="btn btn--primary btn--sm" onclick="soloLookResult()">🏁 ${escapeHTML(t.solo_look_result || 'النتيجة')}</button>`
    + (o.again ? `<button type="button" class="btn btn--neutral btn--sm" onclick="soloLookAgain()">${escapeHTML(o.againLabel || t.play_again || '')}</button>` : '');
  const stack = document.createElement('div');
  stack.className = 'btn-stack';
  stack.appendChild(row);
  while (actions.firstChild) stack.appendChild(actions.firstChild);
  actions.appendChild(stack);
}

function soloLookResult() {
  if (soloLastResult) soloResult(Object.assign({}, soloLastResult, { quiet: true }));
}

function soloLookAgain() {
  const o = soloLastResult;
  soloLookOn = null;
  if (o && o.again) o.again();
}

/** The first line of a daily's share text: "عشرى جيمينج · تحدي اليوم 17/9", for the day it was played. */
function soloShareHeader(t, day) {
  const p = String(day || soloToday()).split('-').map(Number);
  return `${t.title || 'عشرى جيمينج'} · ${t.daily_title || ''} ${p[2]}/${p[1]}`;
}

/** A list's category as its name and its emoji: "فواكه وخضروات 🍎" -> { name, icon }. */
function soloCategory(category) {
  const re = /\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*/gu;
  const text = String(category || '');
  return { name: text.replace(re, '').trim(), icon: (text.match(re) || [''])[0] };
}

/* --- A finger dragging across a board ------------------------------------------ */

/**
 * The cell under a pointer, for boards you paint or trace across (a word
 * search, a nonogram, the letter wheel): the element matching `selector`
 * under the point, found without relying on the event's target, which stays
 * the first cell for a captured touch.
 */
function soloCellAt(x, y, selector) {
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest(selector) : null;
}
</script>
