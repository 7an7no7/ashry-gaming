<script>
/* ============================================================================
   إيه اللي يجمعهم؟ — FIVE CLUES, ONE CATEGORY
   ----------------------------------------------------------------------------
   Five rounds. Each is a category of the Chameleon lists (CHAMELEON_DB, 92 of
   them in each language) shown as up to five of its words, one at a time, and
   six categories to choose from. Right after one word is 5 points, after five
   words 1; a wrong choice is crossed out and shows the next word.

   The round maker is Pinpoint.js (shared with the rooms server, which deals a
   race's rounds and judges every pick): the choices are made to be close.
   Free play deals categories through freshPick, so they don't come back
   until the list has gone round; the daily is seeded. The game is in
   appState.pinpoint.

   In سباق ألغاز (RACE_UI.pinpoint, JS_RoomRace.html) the same rounds play
   the room's puzzle: the answers and the clues to come stay on the server,
   each pick is sent (`move { round, i }`), and what comes back is the points
   or the next clue. The race ranks by points, then by time.
   ========================================================================= */

function pinState() {
  const race = soloRaceState('pinpoint');
  if (race) return race;
  if (!appState.pinpoint) {
    appState.pinpoint = { daily: '', lang: 'ar', rounds: [], round: 0, phase: 'setup' };
  }
  return appState.pinpoint;
}

function setupPinpoint() {
  setView('setup-pinpoint');
}

function paintPinpointSetup() {
  const s = pinState();
  const t = TRANSLATIONS[appState.lang];
  const best = soloBest('pinpoint', '');
  const el = document.getElementById('pinpoint-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${best.score}/${PIN_ROUNDS * PIN_CLUES}` : '';
  const cont = document.getElementById('pinpoint-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('pinpoint-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('pinpoint', 'startPinpoint(true)');
}

function startPinpoint(daily) {
  if (daily && soloDailyResume('pinpoint')) return;
  soloDailySetAside('pinpoint');
  soloNewGame('pinpoint');
  const s = pinState();
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  const cats = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  const rnd = soloRandom(daily ? soloDaySeed('pinpoint:' + lang) : null);
  const picks = daily
    ? soloShuffle(cats, rnd).slice(0, PIN_ROUNDS)
    : freshPick('pinpoint:' + lang, cats, PIN_ROUNDS, { key: c => c.category });
  Object.assign(s, {
    daily: daily ? soloToday() : '', lang: lang,
    rounds: picks.map(c => pinMakeRound(cats, c, rnd)),
    round: 0, phase: 'play', startedAt: Date.now()
  });
  saveToLocal();
  setView('play-pinpoint');
  paintPinpoint(true);
}

function continuePinpoint() {
  if (pinState().phase !== 'play') return;
  setView('play-pinpoint');
  paintPinpoint(false);
}

const pinScore = (s) => s.rounds.reduce((sum, r) => sum + (r.points || 0), 0);

function paintPinpoint(freshClue) {
  const s = pinState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('pinpoint-stage');
  const r = s.rounds[s.round];
  if (!el || !r) return;
  const over = r.points !== null;
  // The daily marks the round's label, so the round's worth keeps its place.
  const bar = soloBarHtml([
    { label: `${s.daily ? '📅 ' : ''}${t.pin_round || ''}`, value: `${s.round + 1}/${s.rounds.length}` },
    { label: t.pin_points || '', value: pinScore(s), id: 'pin-score' },
    { label: t.pin_worth || '', value: over ? '–' : Math.max(1, PIN_CLUES + 1 - r.shown), id: 'pin-worth' }
  ]);
  const clues = r.clues || [];
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="pin-clues" id="pin-clues">
          ${Array.from({ length: PIN_CLUES }, (_, i) => {
            const w = clues[i];
            const open = w !== undefined && (i < r.shown || over);
            return `<div class="pin-clue${open ? ' is-open' : ''}${freshClue && i === r.shown - 1 && !over ? ' is-new' : ''}" data-i="${i}">
              <span class="pin-clue__n metric">${i + 1}</span><b>${open ? escapeHTML(w) : '?'}</b></div>`;
          }).join('')}
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}
        <p class="pin-ask">${escapeHTML(over ? (r.points ? (t.pin_right || '') : (t.pin_missed || '')) : (t.pin_ask || ''))}</p>
        <div class="solo-choices" id="solo-choices">
          ${r.options.map((o, i) => {
            const cls = over && i === r.answer ? ' is-right' : (r.wrong.indexOf(i) !== -1 ? ' is-wrong' : '');
            return `<button type="button" class="solo-choice${cls}" data-i="${i}" onclick="guessPinpoint(${i})" ${over || r.wrong.indexOf(i) !== -1 ? 'disabled' : ''}>
              <span class="solo-choice__icon" aria-hidden="true">${o.icon}</span><span>${escapeHTML(o.name)}</span></button>`;
          }).join('')}
        </div>
        ${over && s.phase === 'play' ? `<button type="button" class="btn btn--primary" onclick="nextPinpoint()">${escapeHTML(s.round + 1 < s.rounds.length ? (t.pin_next || '') : (t.pin_finish || ''))}</button>` : ''}
      </div>
    </div>
    ${s.race ? '' : `<div class="view-actions">
      <button class="btn btn--ghost btn--sm" onclick="setupPinpoint()">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
}

/** A wrong pick: the option shakes. */
function pinShakeOption(i) {
  const btn = document.querySelector(`#solo-choices [data-i="${i}"]`);
  if (btn && btn.animate && !motionOff()) btn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 260 });
}

function guessPinpoint(i) {
  const s = pinState();
  const r = s.rounds[s.round];
  if (!r || s.phase !== 'play' || r.points !== null || r.wrong.indexOf(i) !== -1) return;
  // A race: the answer is on the server, which judges the pick (JS_RoomRace.html).
  if (s.race) { s.lastPick = i; raceMove('pinpoint', { k: s.round, i: i }); return; }
  if (i === r.answer) {
    r.points = Math.max(1, PIN_CLUES + 1 - r.shown);
    saveToLocal();
    playSound('success');
    haptic('light');
    const btn = document.querySelector(`#solo-choices [data-i="${i}"]`);
    const from = btn ? btn.getBoundingClientRect() : null;
    paintPinpoint(false);
    pinCelebrate(i, r.points, from);
    return;
  }
  r.wrong.push(i);
  haptic('medium');
  const wasShown = r.shown;
  if (r.shown < r.clues.length) r.shown++;
  else r.points = 0;
  saveToLocal();
  playSound(r.points === 0 ? 'alarm' : 'click');
  paintPinpoint(r.shown > wasShown);
  pinShakeOption(i);
}

/** The points rise out of the right answer and land on the score. */
function pinCelebrate(i, points, from) {
  if (motionOff() || !from || !document.body.animate) return;
  const score = document.getElementById('pin-score');
  if (!score) return;
  const to = score.getBoundingClientRect();
  const ghost = document.createElement('span');
  ghost.className = 'pin-ghost metric';
  ghost.textContent = '+' + points;
  ghost.style.left = (from.left + from.width / 2) + 'px';
  ghost.style.top = (from.top + from.height / 2) + 'px';
  document.body.appendChild(ghost);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2);
  const dy = to.top + to.height / 2 - (from.top + from.height / 2);
  const a = ghost.animate([
    { transform: 'translate(-50%, -50%) scale(0.6)', opacity: 0 },
    { transform: 'translate(-50%, calc(-50% - 1.5rem)) scale(1.3)', opacity: 1, offset: 0.35 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.7)`, opacity: 0.4 }
  ], { duration: 820, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });
  const done = () => {
    ghost.remove();
    if (score.animate) score.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 320 });
  };
  a.onfinish = done;
  setTimeout(() => { if (ghost.isConnected) done(); }, 1500);
}

function nextPinpoint() {
  const s = pinState();
  const r = s.rounds[s.round];
  if (!r || r.points === null) return;
  if (s.round + 1 < s.rounds.length) {
    s.round++;
    saveToLocal();
    paintPinpoint(true);
    return;
  }
  if (s.race) return;   // the server ends the board with the fifth answer
  pinFinish();
}

function pinFinish() {
  const s = pinState();
  const t = TRANSLATIONS[appState.lang];
  if (s.phase !== 'play') return;
  s.phase = 'done';
  saveToLocal();
  const score = pinScore(s);
  const max = s.rounds.length * PIN_CLUES;
  const rec = soloRecord('pinpoint', '', { score: score }, (a, b) => a.score > b.score);
  const marks = s.rounds.map(r => r.points ? ['', '1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣'][PIN_CLUES + 1 - r.points] : '❌').join(' ');
  let share = '';
  if (s.daily) {
    soloMarkDaily('pinpoint', { score: score }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🔗 ${t.setup_pinpoint || ''} ${score}/${max}\n${marks}`;
  }
  paintPinpoint(false);
  const lines = [marks, s.rounds.map(r => `${r.icon} ${escapeHTML(r.name)}`).join(' · ')];
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.score}/${max}`);
  soloResult({
    icon: '🔗', title: rec.record && score ? (t.solo_new_best || '') : (t.pin_result || ''),
    value: score, valueLabel: `${t.pin_points || ''} / ${max}`, lines: lines, win: score >= max / 2, share: share,
    again: () => startPinpoint(false), exit: setupPinpoint
  });
}

function restorePinpoint() {
  const s = pinState();
  if (s.phase !== 'play' || !s.rounds.length) return false;
  paintPinpoint(false);
  return true;
}

soloRegister('pinpoint', {
  setup: 'setup-pinpoint', play: 'play-pinpoint', paintSetup: paintPinpointSetup, restore: restorePinpoint,
  state: pinState, resume: continuePinpoint, repaint: () => paintPinpoint(false)
});

/* --- سباق ألغاز: the same rounds, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.pinpoint = {
  stage: 'pinpoint-stage',
  unit: 'race_unit_rounds',
  fresh: (pub) => ({ daily: '', lang: 'ar', round: 0, lastPick: -1,
    rounds: pub.rounds.map(r => ({ name: '', icon: '', clues: [], options: r.options, answer: -1, shown: 1, wrong: [], points: null })) }),
  // The server's word on a pick: the points land on the score, a wrong pick shows the next clue; the shown round follows the board.
  sync(s, board, fx) {
    const b = board || {};
    const rounds = b.rounds || [];
    let changed = false, right = -1, wrong = -1, nextClue = false;
    rounds.forEach((br, k) => {
      const r = s.rounds[k];
      if (!r) return;
      const was = { shown: r.shown, wrong: r.wrong.length, points: r.points };
      r.clues = br.clues || r.clues;
      r.shown = br.shown; r.wrong = br.wrong.slice(); r.points = br.points;
      if (br.points !== null) { r.answer = br.answer; r.name = br.name || ''; r.icon = br.icon || ''; }
      if (k === s.round) {
        if (was.points === null && br.points !== null && br.points > 0) right = br.answer;
        if (br.wrong.length > was.wrong) { wrong = br.wrong[br.wrong.length - 1]; nextClue = br.shown > was.shown; }
      }
      if (was.shown !== br.shown || was.wrong !== br.wrong.length || was.points !== br.points) changed = true;
    });
    if (fx && fx.first) { s.round = Math.min(b.cur || 0, s.rounds.length - 1); paintPinpoint(false); return; }
    if (!changed) return;
    if (right >= 0) {
      playSound('success'); haptic('light');
      const btn = document.querySelector(`#solo-choices [data-i="${right}"]`);
      const from = btn ? btn.getBoundingClientRect() : null;
      paintPinpoint(false);
      pinCelebrate(right, s.rounds[s.round].points, from);
    } else if (wrong >= 0) {
      haptic('medium');
      playSound(s.rounds[s.round].points === 0 ? 'alarm' : 'click');
      paintPinpoint(nextClue);
      pinShakeOption(wrong);
    } else paintPinpoint(false);
  },
  paint: () => paintPinpoint(false),
  finished: () => 0,
  scoreLabel: (score, t) => (t.race_score_pts || '{n}').replace('{n}', score),
  revealHtml: (r) => (r && r.cats ? `<div class="race-cats">${r.cats.map(c => `<span class="badge">${c.icon} ${escapeHTML(c.name)}</span>`).join(' ')}</div>` : '')
};
</script>
