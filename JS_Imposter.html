<script>
  /* --- IMPOSTER GAME LOGIC --- */

  function renderSpyCategories() {
      const select = document.getElementById('imposter-category-select');
      if(!select) return;
      const countriesLabel = appState.lang === 'ar' ? '🌍 دول العالم (تلقائي)' : '🌍 World Countries (Auto)';
      const manualLabel = appState.lang === 'ar' ? '✍️ إدخال يدوي' : '✍️ Manual Entry';
      
      let html = `<option value="countries">${countriesLabel}</option><option value="manual">${manualLabel}</option>`;
      // «كلماتنا» first, when the phone has the family's words (JS_PackStore.html).
      for(const cat in spyCategoriesPlus()) {
          html += `<option value="${cat}">${cat}</option>`;
      }
      // Rebuilt on every visit: the pick goes back to the one last chosen on
      // this phone (data-remember), not the first in the list.
      const previous = select.value;
      select.innerHTML = html;
      if (!recallField(select) && previous && [...select.options].some(o => o.value === previous)) select.value = previous;
      const container = document.getElementById('manual-word-container');
      if (container) container.classList.toggle('hidden', select.value !== 'manual');
  }

  // The categories follow the games' language: switched in Settings over this
  // screen, the list is redrawn in the new one.
  if (typeof onLanguageChange === 'function') onLanguageChange(view => { if (view === 'setup-imposter') renderSpyCategories(); });

  function toggleManualWordInput() {
      const select = document.getElementById('imposter-category-select');
      const container = document.getElementById('manual-word-container');
      if (select.value === 'manual') {
          container.classList.remove('hidden');
          document.getElementById('imposter-manual-word').focus();
      } else {
          container.classList.add('hidden');
      }
  }

  function startImposterGame(playersToUse) {
      // «العب تاني» hands the same table back: the score carries on. After a reload
      // lastSelectedPlayers is empty, so the table of the last deal is used.
      if (Array.isArray(playersToUse) && !playersToUse.length && (appState.imposter.players || []).length >= 3) {
          playersToUse = appState.imposter.players.map(p => p.name);
      }
      imp1Replay = Array.isArray(playersToUse) && playersToUse.length >= 3;
      const undercoverSwitch = document.getElementById('imposter-undercover-on');
      const undercover = !!(undercoverSwitch && undercoverSwitch.checked);
      if (!undercover) {
          const catSelect = document.getElementById('imposter-category-select');
          const category = catSelect.value;
          if (category.includes('🔒')) {
              const expectedPw = spyCategories()[category][0]; 
              if (appState.imposter.unlockedCategories && 
                  !Array.isArray(appState.imposter.unlockedCategories) && 
                  appState.imposter.unlockedCategories[category] === expectedPw) {
                   continuePrepImposter(playersToUse);
                   return;
              }
              if (expectedPw) {
                  document.getElementById('password-error').innerText = '';
                  document.getElementById('category-password-input').value = '';
                  document.getElementById('password-modal').classList.remove('hidden');
                  document.getElementById('category-password-input').focus();
                  window._pendingImposterPlayers = playersToUse;
                  return;
              }
          }
      }
      continuePrepImposter(playersToUse);
  }

  function verifyCategoryPassword() {
      const input = document.getElementById('category-password-input').value;
      const catSelect = document.getElementById('imposter-category-select');
      const category = catSelect.value;
      const expectedPw = spyCategories()[category][0];
      if (input === expectedPw) {
          playSound('success');
          if (!appState.imposter.unlockedCategories || Array.isArray(appState.imposter.unlockedCategories)) {
              appState.imposter.unlockedCategories = {}; 
              }
          appState.imposter.unlockedCategories[category] = input;
          saveToLocal();
          closeModal('password-modal');
          continuePrepImposter(window._pendingImposterPlayers);
          delete window._pendingImposterPlayers;
      } else {
          playSound('alarm');
          const errorMsg = appState.lang === 'ar' ? 'كلمة مرور خاطئة!' : 'Incorrect password!';
          document.getElementById('password-error').innerText = errorMsg;
      }
  }

  function continuePrepImposter(playersToUse) {
      let selected = playersToUse || (appState.activePlayers ? [...appState.activePlayers] : []);
      saveActivePlayers(selected);
      const countInput = document.getElementById('imposter-count');
      // An emptied or negative field used to reach Array(count) and throw.
      let count = parseInt(countInput.value, 10);
      if (!isFinite(count) || count < 1) count = 1;
      countInput.value = count;
      
      if(selected.length < 3) {
          // «مين بيلعب؟»: the names in a sheet, then on to the game (JS_Utils.html).
          return askPlayers(3, () => continuePrepImposter());
      }
      if(count >= selected.length) {
          const msg = appState.lang === 'ar' ? 'عدد الجواسيس كبير جداً' : 'Too many imposters';
          // The count that is too high, scrolled to and shaken (JS_Utils.html).
          return blockStartAt(countInput.closest('.stepper') || countInput, msg);
      }
      
      if (!appState.imposter.config) appState.imposter.config = {};
      appState.imposter.config.impostersCount = count;
      const undercoverSwitch = document.getElementById('imposter-undercover-on');
      const undercover = !!(undercoverSwitch && undercoverSwitch.checked);
      appState.imposter.config.undercover = undercover;
      if (undercover) {
          // The pairs in the games' language (spyPairs in JS_Core.html); the Arabic
          // list keeps its old memory key.
          const pairs = spyPairs();
          const picked = freshPick(contentLang() === 'en' ? 'imppair:en' : 'imppair', pairs, 1, { key: p => p[0] + '|' + p[1] })[0];
          // Either word can be the odd one's: always the second of the pair (a list the
          // page ships) told whoever held it that they were the odd one out.
          const pair = picked && Math.random() < 0.5 ? [picked[1], picked[0]] : picked;
          appState.imposter.secretWord = pair ? pair[0] : '';
          appState.imposter.pairOther = pair ? pair[1] : '';
      } else {
          appState.imposter.pairOther = null;
      }
      lastSelectedPlayers = selected;
      playSound('click');
      // The order is the picker's; «↕ رتّب» there changes it (the owner, 26 Sep
      // 2026: the order no longer pops up before every round).
      finalizeImposterGame(selected);
  }

  function finalizeImposterGame(orderedNames) {
      lastSelectedPlayers = orderedNames;
      const undercover = !!(appState.imposter.config && appState.imposter.config.undercover);
      let secretWord = "";
      if (undercover) {
          secretWord = appState.imposter.secretWord;
      } else {
          const catSelect = document.getElementById('imposter-category-select');
          // «العب تاني» after a reload: the setup's list was never painted, and an
          // empty pick dealt no word at all.
          if (catSelect && !catSelect.options.length) renderSpyCategories();
          const category = catSelect.value;
          if (category === 'manual') {
              secretWord = document.getElementById('imposter-manual-word').value.trim();
              if (!secretWord) {
                  const msg = appState.lang === 'ar' ? 'يرجى إدخال الكلمة السرية' : 'Please enter the secret word';
                  if (appState.currentView !== 'setup-imposter') setView('setup-imposter');
                  // What is missing, scrolled to and shaken (JS_Utils.html).
                  blockStartAt(document.getElementById('imposter-manual-word'), msg);
                  return;
              }
          } else if (category === 'countries') {
              // The country list went to MonkeyWords.js with ربع قرد; this category
              // still read the old COUNTRIES_DB and threw, so Start did nothing.
              // The countries everyone knows (Countries.js tier 1): from the whole list
              // the spy's table was asked to talk about Fiji and Honduras.
              const known = typeof COUNTRIES !== 'undefined'
                  ? COUNTRIES.filter(c => c.tier === 1).map(c => contentLang() === 'en' ? c.en : c.ar) : [];
              const countries = known.length ? known : (MONKEY_LISTS[contentLang()] || MONKEY_LISTS.ar).countries;
              secretWord = freshPick('imposter:countries:' + contentLang(), countries, 1)[0];
          } else if (spyCategoriesPlus()[category]) {
              let list = spyCategoriesPlus()[category];
              if (category === packWordsCatName() && packWordsCode()) packPlayed(packWordsCode());
              if (category.includes('🔒')) list = list.slice(1);
              secretWord = freshPick('imposter:' + category, list, 1)[0];
          }
      }
      const count = appState.imposter.config.impostersCount;
      const total = orderedNames.length;
      let roles = Array(count).fill('Imposter').concat(Array(total - count).fill('Civilian'));
      roles = shuffleArray(roles);
      appState.imposter.players = orderedNames.map((name, idx) => ({ name: name, role: roles[idx] }));
      // The room's round (JS_RoomImposter.html): the table accuses one, a caught spy
      // picks the word from six, and a running score like the room's.
      const im = appState.imposter;
      if (!imp1Replay || !im.scores) { im.scores = {}; im.scoreId = Date.now(); }
      imp1Replay = false;
      orderedNames.forEach(n => { if (typeof im.scores[n] !== 'number') im.scores[n] = 0; });
      const catSel = document.getElementById('imposter-category-select');
      im.category = undercover ? '' : (catSel ? catSel.value : '');
      im.phase = 'reveal';
      im.accused = '';
      im.picked = '';
      im.outcome = null;
      im.guess = null;
      im.options = null;
      im.dealId = Date.now();
      // Who asks whom, if the table asked for it (JS_Director.html).
      if (typeof directorStart === 'function') directorStart(appState.imposter, orderedNames, directorModeOf('imposter'));
      appState.imposter.secretWord = secretWord;
      appState.imposter.revealIndex = 0;
      appState.imposter.timer = 0;
      showRevealStep();
      setView('imposter-reveal');
  }

  /**
   * The next player's name, and their role already on the back of the card:
   * it shows only while they hold it (JS_Motion.html, section 11), so nothing
   * here may make a sound that differs between a spy and everyone else.
   */
  function showRevealStep() {
      const player = appState.imposter.players[appState.imposter.revealIndex];
      document.getElementById('reveal-player-name').innerText = player.name;
      fillRole(player);
      holdCardReset(document.getElementById('imposter-hold'));
  }

  function fillRole(player) {
      const wordDiv = document.getElementById('role-word');
      const card = document.getElementById('role-card-content');
      const undercover = !!appState.imposter.config.undercover;
      const spy = !undercover && player.role === 'Imposter';
      wordDiv.innerText = undercover
          ? (player.role === 'Imposter' ? appState.imposter.pairOther : appState.imposter.secretWord)
          : (spy ? (appState.lang === 'ar' ? "أنت الجاسوس!" : "You are the Imposter!")
                 : appState.imposter.secretWord);
      if (spy) wordDiv.insertAdjacentHTML('afterbegin', '<span class="hold-card__art">' + iconHtml('art:imposter') + '</span> ');
      // Tokens, not palette classes: green-700 on the dark card was 2.6:1, and
      // overwriting className also dropped the card's own sizing.
      wordDiv.className = 'hold-card__word ' + (spy ? 'tx-danger' : 'tx-success');
      if (card) card.classList.toggle('is-spy', spy);
  }

  function hideRole() {
      appState.imposter.revealIndex++;
      if (appState.imposter.revealIndex >= appState.imposter.players.length) {
          appState.imposter.phase = 'play';
          playSound('success');
          renderImposterBoard();
          setView('play-imposter');
          startImposterTimer();
      } else {
          playSound('click');
          showRevealStep();
      }
  }

  function renderImposterBoard() {
      const container = document.getElementById('imposter-game-players');
      container.innerHTML = '';
      appState.imposter.players.forEach(p => {
          container.innerHTML += `<div class="imposter-card m-1">${escapeHTML(p.name)}</div>`;
      });
      if (typeof paintDirector === 'function') paintDirector('imposter-director', appState.imposter, 'imposterDirectorNext()');
      // A round already decided (its result closed with the back button): no accusation left to make.
      const live = appState.imposter.phase !== 'done';
      document.getElementById('imp1-live')?.classList.toggle('hidden', !live);
  }

  function imposterDirectorNext() {
      directorNext(appState.imposter);
      paintDirector('imposter-director', appState.imposter, 'imposterDirectorNext()');
      haptic('light');
  }

  function startImposterTimer() {
      isPaused = false;
      appState.imposter.timer = 0;
      updateImposterTimerUI();
      runImposterClock(0);
  }

  /**
   * Counts up from `from` seconds: this is the discussion timer, it has no
   * fixed length. A reload comes back paused with the time it showed and no
   * clock (restoreView), so Resume starts one from there.
   */
  function runImposterClock(from) {
      stopImposterTimer();
      const base = Math.max(0, Math.floor(Number(from) || 0));
      imposterInterval = createClock({
          countUp: true,
          onTick: (elapsed) => {
              appState.imposter.timer = base + elapsed;
              updateImposterTimerUI();
          }
      });
  }

  function stopImposterTimer() {
      if (imposterInterval) imposterInterval.stop();
      imposterInterval = null;
  }

  function toggleImposterTimer() {
      playSound('click');
      if (imposterInterval) {
          isPaused = imposterInterval.toggle();
      } else if (isPaused) {
          // Resume after a reload: Resume used to flip the label and leave the clock at 00:00.
          isPaused = false;
          runImposterClock(appState.imposter.timer);
          saveToLocal();
      } else {
          isPaused = true;
      }
      updateImposterTimerUI();
  }

  function updateImposterTimerUI() {
      const display = document.getElementById('imposter-timer-display');
      const btn = document.getElementById('imp-pause-btn');
      const t = TRANSLATIONS[appState.lang] || {};
      const mins = Math.floor(appState.imposter.timer / 60).toString().padStart(2, '0');
      const secs = (appState.imposter.timer % 60).toString().padStart(2, '0');
      if (display) display.innerText = `${mins}:${secs}`;
      if (btn) {
          // The key moves with the label, so a language change keeps the right word.
          btn.setAttribute('data-i18n', isPaused ? 'resume_btn' : 'pause_btn');
          btn.innerText = isPaused ? (t.resume_btn || '') : (t.pause_btn || '');
      }
  }

  function revealImposterResult() {
      imp1Finish('revealed', null);
  }

  /* ---- The room's round on one phone (ideas batch: party2) --------------------
     «اتهموا»: the table picks one name (a tap picks, a second confirms). A spy
     named in الجاسوس picks the word from six (the secret among five others of its
     category, IMPOSTER_GUESS_OPTIONS on the server); المختلف named is caught at
     once (the room's rule). Caught: a point to everyone who isn't a spy; escaped
     or guessed the word: two to each spy; revealed without a vote: nothing. */
  let imp1Replay = false;
  const IMP1_GUESS_OPTIONS = 6;

  function imp1Live() {
      const im = appState.imposter;
      return appState.currentView === 'play-imposter' && im.phase !== 'done' && (im.players || []).length;
  }

  function imp1OpenAccuse() {
      if (!imp1Live()) return;
      // The guess's sheet closed with the back button: the button takes it back there.
      if (appState.imposter.phase === 'guess') { imp1OpenGuess(); return; }
      appState.imposter.picked = '';
      imp1PaintAccuse();
      const t = TRANSLATIONS[appState.lang] || {};
      const title = document.getElementById('imp1-accuse-title');
      if (title) title.textContent = appState.imposter.config.undercover ? (t.imp_und_accuse || '') : (t.imp1_accuse_title || '');
      document.getElementById('imp1-accuse-modal').classList.remove('hidden');
  }

  function imp1PaintAccuse() {
      const list = document.getElementById('imp1-accuse-list');
      if (!list) return;
      const t = TRANSLATIONS[appState.lang] || {};
      const picked = appState.imposter.picked;
      list.innerHTML = appState.imposter.players.map((p, i) => {
          const on = p.name === picked;
          return `<button type="button" class="ballot-option imp1-pick ${on ? 'is-picked' : ''}" aria-pressed="${on}" onclick="imp1Pick(${i})">
              <span class="ballot-option__label">${escapeHTML(p.name)}</span>
              <span class="badge ${on ? 'badge--danger imp1-pick__confirm' : 'badge--plain'}">${escapeHTML(on ? (t.imp1_confirm || '') : (t.accuse_badge || ''))}</span>
            </button>`;
      }).join('');
  }

  function imp1Pick(i) {
      const im = appState.imposter;
      const p = im.players[i];
      if (!p || !imp1Live()) return;
      if (im.picked !== p.name) {
          im.picked = p.name;
          imp1PaintAccuse();
          haptic('light');
          return;
      }
      closeModal('imp1-accuse-modal');
      imp1Accuse(p.name);
  }

  function imp1Accuse(name) {
      const im = appState.imposter;
      if (!imp1Live()) return;
      stopImposterTimer();
      im.accused = name;
      const spy = im.players.some(p => p.name === name && p.role === 'Imposter');
      if (!spy) { imp1Finish('escaped', null); return; }
      const options = im.config.undercover ? null : imp1GuessOptions();
      if (!options) { imp1Finish('caught', null); return; }
      im.options = options;
      im.phase = 'guess';
      saveToLocal();
      playSound('alarm');
      haptic('double');
      imp1OpenGuess();
  }

  /** The secret among five others of its category; null where there is no list (a typed word). */
  function imp1GuessOptions() {
      const im = appState.imposter;
      const cat = im.category || '';
      let pool = [];
      if (cat === 'countries') {
          pool = typeof COUNTRIES !== 'undefined'
              ? COUNTRIES.filter(c => c.tier === 1).map(c => contentLang() === 'en' ? c.en : c.ar) : [];
          if (pool.indexOf(im.secretWord) === -1) pool = ((MONKEY_LISTS[contentLang()] || MONKEY_LISTS.ar).countries || []).slice();
      } else if (cat && cat !== 'manual' && spyCategoriesPlus()[cat]) {
          pool = spyCategoriesPlus()[cat].slice(cat.includes('🔒') ? 1 : 0);
      }
      const others = shuffleArray(pool.filter(w => w !== im.secretWord)).slice(0, IMP1_GUESS_OPTIONS - 1);
      if (others.length < 2) return null;
      return shuffleArray(others.concat([im.secretWord]));
  }

  function imp1OpenGuess() {
      const im = appState.imposter;
      const t = TRANSLATIONS[appState.lang] || {};
      const title = document.getElementById('imp1-guess-title');
      if (title) title.textContent = '🕵️ ' + im.accused;
      const pass = document.getElementById('imp1-guess-pass');
      if (pass) pass.textContent = (t.imp1_pass_to || '').replace('{name}', im.accused);
      const list = document.getElementById('imp1-guess-list');
      if (list) list.innerHTML = (im.options || []).map((w, i) =>
          `<button type="button" class="ballot-option" onclick="imp1Guess(${i})"><span class="ballot-option__label">${escapeHTML(w)}</span></button>`).join('');
      document.getElementById('imp1-guess-modal').classList.remove('hidden');
  }

  function imp1Guess(i) {
      const im = appState.imposter;
      if (im.phase !== 'guess') return;
      const word = i === -1 ? null : (im.options || [])[i];
      closeModal('imp1-guess-modal');
      imp1Finish(word && word === im.secretWord ? 'stole' : 'caught', word || null);
  }

  /** The round's end: the score (as the room's finishImposter), then the result. */
  function imp1Finish(outcome, guess) {
      const im = appState.imposter;
      if (im.phase === 'done' || !(im.players || []).length) return;
      stopImposterTimer();
      im.phase = 'done';
      im.outcome = outcome;
      im.guess = guess;
      im.scores = im.scores || {};
      if (outcome === 'caught') {
          im.players.forEach(p => { if (p.role !== 'Imposter') im.scores[p.name] = (im.scores[p.name] || 0) + 1; });
      } else if (outcome === 'escaped' || outcome === 'stole') {
          im.players.forEach(p => { if (p.role === 'Imposter') im.scores[p.name] = (im.scores[p.name] || 0) + 2; });
      }
      saveToLocal();
      imp1ShowResult();
  }

  function imp1ShowResult(quiet) {
      const im = appState.imposter;
      const outcome = im.outcome || 'revealed';
      if (!quiet) playSound(outcome === 'escaped' || outcome === 'stole' ? 'alarm' : 'success');
      
      const undercover = !!(appState.imposter.config && appState.imposter.config.undercover);
      const wordTitle = undercover
          ? (appState.lang === 'ar' ? 'الكلمة' : 'Word')
          : (appState.lang === 'ar' ? 'الكلمة السرية' : 'Secret Word');
      const impTitle = undercover
          ? (appState.lang === 'ar' ? 'المختلف' : 'Undercover')
          : (appState.lang === 'ar' ? 'الجواسيس' : 'Imposters');
      const andText = appState.lang === 'ar' ? ' و ' : ' & ';

      const imposters = appState.imposter.players.filter(p => p.role === 'Imposter').map(p => escapeHTML(p.name)).join(andText);
      
      const pairOtherHtml = undercover && appState.imposter.pairOther ? `
        <div class="mb-4">
            <div class="eyebrow">${appState.lang === 'ar' ? 'كلمة المختلف' : 'Undercover Word'}</div>
            <div class="result-word tx-danger">${escapeHTML(appState.imposter.pairOther)}</div>
        </div>
      ` : '';

      const t = TRANSLATIONS[appState.lang] || {};
      const spyCount = appState.imposter.players.filter(p => p.role === 'Imposter').length;
      const revealKey = ['imp1', im.dealId || '', appState.imposter.secretWord, imposters, outcome].join('|');
      const cover = spyRevealParts(revealKey, spyCount > 1 ? t.reveal_spies_were : t.reveal_spy_was);
      // The spy behind the card plays what happened (the accusation), as in a room.
      const verdict = typeof spyCastVerdict === 'function' ? spyCastVerdict(outcome) : '';
      const cast = typeof spyCastHtml === 'function' ? spyCastHtml(revealKey, verdict, { kind: 'spy' }) : '';
      const lineState = { outcome: outcome, undercover: undercover, spies: im.players.filter(p => p.role === 'Imposter').map(p => p.name) };
      // No vote, no line (the room's says "the host revealed", and there is no host here).
      const line = outcome !== 'revealed' && typeof imposterOutcomeLine === 'function' ? imposterOutcomeLine(lineState, t) : '';
      const won = outcome === 'caught';
      const board = im.players.map(p => ({ id: p.name, name: p.name, score: (im.scores || {})[p.name] || 0 }))
          .sort((a, b) => b.score - a.score);
      document.getElementById('winners-list').innerHTML = `${cast}
        <div class="result-reveal ${cover.cls}" ${cover.attrs}>${cover.cover}
        ${line ? `<div class="imp1-line ${won ? 'tx-success' : (outcome === 'revealed' ? '' : 'tx-danger')}">${won ? '🎉 ' : ''}${escapeHTML(line)}</div>` : ''}
        ${im.accused ? `<p class="imp1-sub">${escapeHTML(t.cham_accused || '')}: ${escapeHTML(im.accused)}${im.guess ? ` · ${escapeHTML(t.spy_guess_was || '')}: ${escapeHTML(im.guess)}` : ''}</p>` : ''}
        <div class="mb-4">
            <div class="eyebrow">${wordTitle}</div>
            <div class="result-word tx-success">${escapeHTML(appState.imposter.secretWord)}</div>
        </div>
        ${pairOtherHtml}
        <div>
            <div class="eyebrow">${impTitle}</div>
            <div class="result-word tx-danger">${imposters}</div>
        </div>
        </div>
        <div class="modal-section imp1-board">${outcome === 'revealed' && !board.some(r => r.score) ? '' : renderScoreboard(board)}</div>
      `;
      
      // Clear specific screw chart stuff if any
      const screwChart = document.getElementById('screw-chart-container');
      if(screwChart) screwChart.classList.add('hidden');
      
      const winnerScores = document.getElementById('winner-scores-container');
      if(winnerScores) winnerScores.classList.add('hidden');
      // Nothing to list for the spy: the button opened another game's table.
      const fullBtn = document.getElementById('toggle-results-btn');
      if (fullBtn) fullBtn.classList.add('hidden');
      
      const modal = document.getElementById('winner-modal');
      modal.classList.remove('hidden');
      if (typeof animateScoreboards === 'function') animateScoreboards({ code: 'imposter1', game: String(im.scoreId || '') });
      if (won) afterReveal(document.getElementById('winners-list'), () => confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } }));
  }

  /** After a reload on the play screen: the accusation's guess, or the result, as they were. */
  function imp1Restore() {
      const im = appState.imposter;
      if (im.phase === 'guess' && (im.options || []).length) setTimeout(() => { if (appState.currentView === 'play-imposter') imp1OpenGuess(); }, 0);
      else if (im.phase === 'done') setTimeout(() => { if (appState.currentView === 'play-imposter') imp1ShowResult(true); }, 0);
  }
</script>
