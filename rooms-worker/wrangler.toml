# The rooms server on Cloudflare. See README.md.
name = "ashry-rooms"
main = "src/index.js"
# Cloudflare keeps a Worker behaving as it did on this date, whatever changes
# later - which is what lets it run for years untouched.
compatibility_date = "2026-09-01"

# The game rules and word lists live at the project root (RoomGames.js and the
# word files); build.mjs bundles them into generated/rules.js first.
[build]
command = "node build.mjs"

# A copy of the built app (docs/, from npm run build:site) is served here too:
# a test link before GitHub Pages is updated, and a spare address for the app.
# Files are matched first; everything else (/create, /ws, ...) reaches the Worker.
[assets]
directory = "../docs"

# One Durable Object per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# One shared memory of which prompts every room has dealt lately.
[[durable_objects.bindings]]
name = "MEMORY"
class_name = "PromptMemory"

# How many players are online across every room, for the مع بعض tab.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveStats"

# SQLite-backed Durable Objects are the kind the free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PromptMemory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["LiveStats"]
