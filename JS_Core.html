    'room-mind':         { title: 'setup_mind',         up: 'menu',               accent: 'teal' },
    'room-timeline':     { title: 'setup_timeline',     up: 'menu',               accent: 'amber' },
    'room-uno':          { title: 'setup_uno',          up: 'menu',               accent: 'rose' },
    'room-domino':       { title: 'setup_domino',       up: 'menu',               accent: 'green' },
    'room-connect4':     { title: 'setup_connect4',     up: 'menu',               accent: 'blue' },
    'room-dots':         { title: 'setup_dots',         up: 'menu',               accent: 'indigo' }
  };

  // Depth is what makes the slide directional: deeper = forward, shallower = back.
  function viewDepth(viewId) {
    let depth = 0;
    let cursor = viewId;
    while (cursor && VIEW_META[cursor] && VIEW_META[cursor].up && depth < 8) {
      cursor = VIEW_META[cursor].up;
      depth++;
    }
    return depth;
  }

  let titleSwapTimer = null;
  let pendingTitle = '';

  /** Header title, back button and nav state for the view now on screen. */
  function syncChrome(viewId) {
    const meta = VIEW_META[viewId] || {};
    const t = TRANSLATIONS[appState.lang];
    const titleEl = document.getElementById('app-title');
    const backEl = document.getElementById('nav-back');
    const homeEl = document.getElementById('nav-home');

    if (titleEl) {
      const text = (meta.title && t[meta.title]) || t.title;
      const textEl = document.getElementById('app-title-text') || titleEl;
      // The brand mark sits beside the name on the home screen only.
      titleEl.classList.toggle('shell__title--brand', viewId === 'menu');
      // textContent, not innerText: innerText forces a layout mid-setView.
      if (textEl.textContent !== text) {
        // Cross-fade rather than snapping the text. One timer, so navigating
        // twice in quick succession can't land the writes out of order.
        pendingTitle = text;
        titleEl.classList.add('is-swapping');
        clearTimeout(titleSwapTimer);
        titleSwapTimer = setTimeout(() => {
          textEl.textContent = pendingTitle;
          titleEl.classList.remove('is-swapping');
        }, 110);
      }
    }
    if (backEl) backEl.classList.toggle('is-hidden', !meta.up);
    const tab = navTabFor(viewId);
    ['home', 'together', 'tools'].forEach(name => {
      const el = document.getElementById('nav-' + name);
      if (el) el.classList.toggle('is-active', name === tab);
    });
    // The screen's own icon beside its name; the home shows the mark instead.
    const iconEl = document.getElementById('app-title-icon');
    const icon = viewId === 'menu' ? '' : screenIcon(viewId);
    if (iconEl && iconEl._icon !== icon) { iconEl._icon = icon; iconEl.innerHTML = iconHtml(icon); }
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
  }

  /** Which bottom tab a screen sits under: the rooms, the tools, or the games. */
  function navTabFor(viewId) {
    const id = String(viewId || '');
    if (id === 'together' || id.indexOf('room-') === 0 || id === 'setup-codenames') return 'together';
    if (id === 'tools') return 'tools';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[id] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry && entry.group === 'tools' ? 'tools' : 'home';
  }

  /** The emoji for a screen, from its help entry - every screen has one. */
  function screenIcon(viewId) {
    if (viewId === 'together') return '📲';
    if (viewId === 'tools') return '🛠️';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[viewId] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry ? entry.icon : '';
  }

  /*
   * Drawn icons. Two games have no emoji of their own - there is no Uno card in
   * emoji, and 🀄 is a Mahjong tile, not a domino (the owner, 21 Sep 2026) - so
   * their icon is 'art:uno' / 'art:domino': a small SVG in the game's own colours
   * (UnoCards' red and blue, the domino's ivory, pips and brass pin), 1.2em
   * square so it sits wherever an emoji would and grows with the font. Flat
   * colours and no ids, so a page can hold it any number of times. Anything that
   * shows a game's icon goes through iconHtml (markup) or iconText (a plain line,
   * where a drawn icon is left out rather than printed as its name).
   */
  const ICON_ART = {
    uno: '<g transform="rotate(-13 26 32)"><rect x="11" y="9.5" width="30" height="45" rx="5.5" fill="#1e6fd9"/>' +
      '<ellipse cx="19" cy="18" rx="8" ry="4" transform="rotate(-35 19 18)" fill="#fff" opacity=".18"/></g>' +
      '<g transform="rotate(9 38 33)"><rect x="21.6" y="12" width="30" height="45" rx="5.5" fill="#000" opacity=".22"/>' +
      '<rect x="23" y="10.5" width="30" height="45" rx="5.5" fill="#e5383b"/>' +
      '<ellipse cx="31" cy="19" rx="9" ry="4.5" transform="rotate(-35 31 19)" fill="#fff" opacity=".18"/>' +
      '<path d="M32.5 24h11l-8 19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>',
    domino: '<g transform="rotate(-28 32 31.5)"><rect x="19" y="7.4" width="26" height="51" rx="5" fill="#c9b58a"/>' +
      '<rect x="19" y="4.6" width="26" height="51" rx="5" fill="#fffdf7" stroke="#cdbd98" stroke-width="1.2"/>' +
      '<path d="M22.5 30.1h19" stroke="#1b1b1f" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>' +
      '<g fill="#1b1b1f"><circle cx="25.8" cy="11.2" r="2.5"/><circle cx="38.2" cy="11.2" r="2.5"/><circle cx="25.8" cy="17.35" r="2.5"/><circle cx="38.2" cy="17.35" r="2.5"/><circle cx="25.8" cy="23.5" r="2.5"/><circle cx="38.2" cy="23.5" r="2.5"/><circle cx="25.8" cy="36.7" r="2.5"/><circle cx="38.2" cy="36.7" r="2.5"/><circle cx="25.8" cy="42.85" r="2.5"/><circle cx="38.2" cy="42.85" r="2.5"/><circle cx="25.8" cy="49" r="2.5"/><circle cx="38.2" cy="49" r="2.5"/></g>' +
      '<circle cx="32" cy="30.1" r="2.4" fill="#b8892a"/><circle cx="31.3" cy="29.4" r=".9" fill="#fbe7a0"/></g>'
  };

  function isArtIcon(icon) { return typeof icon === 'string' && icon.indexOf('art:') === 0; }

  /** A game's icon as markup: an emoji as it is, a drawn icon as its SVG. */
  function iconHtml(icon) {
    if (!isArtIcon(icon)) return icon || '';
    const body = ICON_ART[icon.slice(4)];
    return body ? '<svg class="art-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + body + '</svg>' : '';
  }

  /** A game's icon inside a plain line of text: a drawn icon has no text, so it is left out. */
  function iconText(icon) { return isArtIcon(icon) ? '' : (icon || ''); }

  /** A drawn icon as an image, for a canvas (the share card); null for an emoji or on failure. */
  function artIconImage(icon, px) {
    return new Promise((resolve) => {
      const body = isArtIcon(icon) && ICON_ART[icon.slice(4)];
      if (!body) return resolve(null);
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="' + (px || 256) + '" height="' + (px || 256) + '">' + body + '</svg>');
    });
  }

  /** The header back button. Falls back to the menu for unregistered views. */
  /** A stepper's − and +: clamps to data-min/max, moves by data-step, and fires change for whoever listens. */
  function stepField(id, dir) {
    const el = document.getElementById(id);
    if (!el) return;
    const min = Number(el.dataset.min || el.min || 0);
    const max = Number(el.dataset.max || el.max || 99);
    const step = Number(el.dataset.step || 1);
    const next = Math.min(max, Math.max(min, (Number(el.value) || min) + dir * step));
    if (next !== Number(el.value)) {
      el.value = next;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }
    haptic('light');
  }

  /* Every setup screen's Start sits in a sticky bar at the foot of its panel,
     one thumb away however long the options run. The markup keeps the button
     where it reads best; this moves it once at start-up. A game with a mode
     switch keeps the bar inside its "this device" panel, so it hides with it. */
  const STICKY_START_KEYS = ['start', 'bomb_start', 'start_counter'];
  function stickySetupStarts() {
    document.querySelectorAll('[id^="view-setup-"]').forEach(view => {
      view.querySelectorAll('button.btn--primary[data-i18n]').forEach(btn => {
        if (STICKY_START_KEYS.indexOf(btn.getAttribute('data-i18n')) === -1) return;
        if (btn.closest('.mode-online-panel') || btn.closest('.view-actions') || btn.closest('.modal-overlay')) return;
        const host = btn.closest('.mode-device-panel') || view;
        let bar = host.querySelector(':scope > .view-actions--start');
        if (!bar) {
          bar = document.createElement('div');
          bar.className = 'view-actions view-actions--start';
          host.appendChild(bar);
        }
        btn.classList.add('btn--lg');
        bar.appendChild(btn);
      });
    });
  }

  /* --- The segmented control's sliding thumb ---------------------------------
     The active option's place becomes two custom properties on its group and
     the thumb (the group's ::before) slides there. Positions are re-read after
     any class change (an option turned on, a panel shown), a rebuilt group, a
     screen change and a resize - coalesced to one pass per frame. */
  function syncSegmented(seg) {
    const active = seg.querySelector(':scope > .segmented__item.is-active');
    if (!active || !active.offsetWidth) return;      // hidden: measured when shown
    const x = active.offsetLeft + 'px', w = active.offsetWidth + 'px';
    if (seg.style.getPropertyValue('--seg-x') !== x) seg.style.setProperty('--seg-x', x);
    if (seg.style.getPropertyValue('--seg-w') !== w) seg.style.setProperty('--seg-w', w);
    if (!seg.classList.contains('has-thumb')) seg.classList.add('has-thumb');
  }
  function syncAllSegmented() {
    document.querySelectorAll('.segmented').forEach(syncSegmented);
    if (typeof syncNavPill === 'function') syncNavPill();
  }
  (function () {
    let queued = false;
    const later = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; syncAllSegmented(); });
    };
    document.addEventListener('DOMContentLoaded', () => {
      new MutationObserver(later).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
      later();
    });
    window.addEventListener('resize', later);
    /* A webfont swapping in changes the width of every label it sets - and it
       fires no mutation and no resize, so a thumb measured against the
       fallback stayed where the fallback put it until something else happened
       to redraw. Both faces are variable ranges fetched with display=swap, so
       on a cold cache there is always a moment of fallback first; the nav pill
       rides on the same pass. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(later).catch(() => {});
    }
  })();

  function goBack() {
    // On a game screen the back arrow asks first, and offers the way out the
    // table actually wants: another game (openExitSheet in JS_Utils.html).
    if (typeof openExitSheet === 'function' && openExitSheet()) return;
    const meta = VIEW_META[appState.currentView];
    setView(meta && meta.up ? meta.up : 'menu');
  }

  /* The bottom bar's tabs. Mid-round on a passed phone, a stray tap on 🏠 used
     to drop the round without a word; it asks first, like the back arrow. */
  function navTo(target) {
    if (typeof openExitSheet === 'function' && openExitSheet(target)) return;
    navGo(target);
  }
  function navGo(target) {
    if (target === 'together' && typeof goTogether === 'function') goTogether();
    else setView(target);
  }

  /* The browser's history follows the app's screens. The phone's own back -
     Android's button, a browser's back swipe - used to leave the app in the
     middle of a game, and then (with one history entry kept in front of the
     app) an iPhone's swipe slid in a stale snapshot while the real screen
     changed underneath with its animation already over. Now every screen
     deeper than the last has its own entry, so Safari's swipe slides in the
     screen you are going back to; the header's arrow walks back through the
     same entries (history.go), so the two never disagree; a popup closes
     first, and a game asks before it is dropped. On an iPhone the back swipe
     is the app's own (below), so it looks exactly like the header's arrow. */
  /* The history is kept equal to what the screen shows, and re-derived after
     every change (navReconcile) rather than patched move by move:
       - the screen's chain of `up` screens from the home (so the phone's back
         goes exactly where the header's arrow goes; الأدوات and مع بعض sit on
         top of the home, so back from them comes home rather than leaving),
       - one more entry of the same screen when leaving it would end a game
         (exitSheetAsks): the swipe slides that screen onto itself and the
         "leave this game?" sheet opens, instead of sliding in the setup screen
         and snapping back,
       - one more while a popup is open: back closes it.
     Entries are tokens ('play-sudoku', and 'play-sudoku+' for the extras). */
  const nav = { stack: [], index: 0, expect: null, dirty: false, soon: false, uaAnimated: false, ready: false, session: '' };
  const navState = (token, i) => ({ ashry: 1, s: nav.session, t: token, i: i });

  function navDesired() {
    const view = appState.currentView || 'menu';
    const chain = [];
    for (let v = view, guard = 0; v && guard < 8; guard++) {
      chain.unshift(v);
      if (v === 'menu') break;
      v = (VIEW_META[v] || {}).up || 'menu';
    }
    if (chain[0] !== 'menu') chain.unshift('menu');
    if (typeof exitSheetAsks === 'function' && exitSheetAsks(view)) chain.push(view + '+');
    if (document.querySelector('.modal-overlay:not(.hidden)')) chain.push(view + '+');
    return chain;
  }

  function navReconcile() {
    nav.soon = false;
    if (!nav.ready) return;
    if (nav.expect !== null) { nav.dirty = true; return; }
    nav.dirty = false;
    try {
      const want = navDesired();
      const have = nav.stack;
      let p = 0;
      while (p < have.length && p < want.length && have[p] === want[p]) p++;
      if (p === have.length && p === want.length) return;
      if (have.length === 0) {
        history.replaceState(navState(want[0], 0), '');
        have.push(want[0]);
        nav.index = 0;
        p = 1;
      } else if (p < have.length) {
        // Entries past p are wrong. Walk back to p (or p-1 when there is nothing
        // to put at p), then carry on from there once the browser has moved.
        const to = p < want.length ? p : p - 1;
        if (nav.index > to) {
          nav.expect = to;
          nav.dirty = true;
          history.go(to - nav.index);
          return;
        }
        if (p < want.length) {
          history.replaceState(navState(want[p], p), '');
          have[p] = want[p];
          have.length = p + 1;
          nav.index = p;
          p++;
        }
      }
      for (; p < want.length; p++) {
        history.pushState(navState(want[p], p), '');
        have[p] = want[p];
        nav.index = p;
      }
      have.length = nav.index + 1;
    } catch (e) {}
  }

  /** After the current task: setView closes popups after it has run, and several changes coalesce. */
  function navSoon() {
    if (nav.soon) return;
    nav.soon = true;
    Promise.resolve().then(navReconcile);
  }

  function navInit() {
    nav.session = Math.random().toString(36).slice(2, 10);
    nav.stack = [];
    nav.index = 0;
    nav.ready = true;
    navReconcile();
  }

  /** setView's side: the screen changed. */
  function navSync() { navSoon(); }

  /* The iPhone's back swipe, drawn by the app. Safari's own swipe slid a picture
     of the page across and the app then changed screens with none of its own
     motion - "not the same animation as the back button" (the owner, twice).
     A touch that starts at the left edge is taken before Safari sees it
     (preventDefault on touchstart, which iOS honours at the edge): the screen
     follows the finger, and letting go past a third of the width - or with a
     quick flick - does exactly what the header's back arrow does, with its
     animation: close the top popup, ask before a game is dropped, or go up a
     screen. If Safari takes the gesture anyway, the page gets touchcancel
     instead of touchend and nothing is done twice. A tap that starts at the
     edge is passed on as a click, and a vertical drag there scrolls the page. */
  const EDGE_IOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const EDGE_PX = 20;
  const edge = { on: false, x0: 0, y0: 0, y: 0, dx: 0, t0: 0, el: null, target: null, dir: '' };

  function edgeCanGoBack() {
    if (document.body.classList.contains('is-tv-view')) return false;
    return !!document.querySelector('.modal-overlay:not(.hidden)') || appState.currentView !== 'menu';
  }
  function edgeBack() {
    const open = [...document.querySelectorAll('.modal-overlay:not(.hidden)')];
    if (open.length) {
      const top = open[open.length - 1];
      if (top.id) closeModal(top.id); else top.classList.add('hidden');
      return;
    }
    goBack();
  }
  function edgeReset() {
    edge.on = false;
    edge.el = null;
    edge.target = null;
    edge.dir = '';
    edge.dx = 0;
  }

  if (EDGE_IOS) {
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { edgeReset(); return; }
      const t = e.touches[0];
      if (t.clientX > EDGE_PX || !edgeCanGoBack()) return;
      e.preventDefault();
      edge.on = true;
      edge.x0 = t.clientX;
      edge.y0 = edge.y = t.clientY;
      edge.t0 = Date.now();
      edge.dx = 0;
      edge.dir = '';
      edge.target = e.target;
      edge.el = document.querySelector('.modal-overlay:not(.hidden)') ? null : document.getElementById('view-' + appState.currentView);
    }, { passive: false, capture: true });

    document.addEventListener('touchmove', (e) => {
      if (!edge.on) return;
      const t = e.touches[0];
      const dx = t.clientX - edge.x0;
      const dy = t.clientY - edge.y0;
      if (!edge.dir && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) edge.dir = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
      if (edge.dir === 'y') {
        const main = document.getElementById('shell-main');
        if (main) main.scrollTop += edge.y - t.clientY;
        edge.y = t.clientY;
        return;
      }
      if (edge.dir !== 'x') return;
      edge.dx = Math.max(0, dx);
      if (edge.el && !motionOff()) edge.el.style.transform = 'translateX(' + edge.dx + 'px)';
    }, { passive: true, capture: true });

    document.addEventListener('touchend', () => {
      if (!edge.on) return;
      const el = edge.el;
      const dx = edge.dx;
      const w = window.innerWidth;
      const target = edge.target;
      const dir = edge.dir;
      const go = dir === 'x' && (dx > w / 3 || (dx > 40 && Date.now() - edge.t0 < 300));
      edgeReset();
      if (!dir) {
        // A tap at the very edge: the preventDefault above swallowed its click.
        if (target && typeof target.click === 'function') target.click();
        if (target && target.matches && target.matches('input, textarea, select')) target.focus();
        return;
      }
      if (dir !== 'x') return;
      if (!el || motionOff()) {
        if (el) el.style.transform = '';
        if (go) edgeBack();
        return;
      }
      if (go) {
        const out = el.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(' + w + 'px)' }],
          { duration: Math.max(90, 220 * (1 - dx / w)), easing: 'cubic-bezier(0.3, 0, 0.6, 1)', fill: 'forwards' });
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          edgeBack();
          el.style.transform = '';
          out.cancel();
        };
        out.onfinish = finish;
        setTimeout(finish, 400);
      } else {
        el.style.transform = '';
        el.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(0)' }], { duration: 180, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
      }
    }, { capture: true });

    document.addEventListener('touchcancel', () => {
      if (!edge.on) return;
      if (edge.el) edge.el.style.transform = '';
      edgeReset();
    }, { capture: true });
  }

  window.addEventListener('popstate', (e) => {
    const st = e.state;
    if (!nav.ready || !st || !st.ashry) return;
    // An entry left by this page before a reload: start the history over from here.
    if (st.s !== nav.session) {
      nav.expect = null;
      nav.stack = [];
      nav.index = 0;
      navSoon();
      return;
    }
    // Our own history.go arriving.
    if (nav.expect !== null && st.i === nav.expect) {
      nav.expect = null;
      nav.index = st.i;
      nav.stack.length = st.i + 1;
      if (nav.dirty) navReconcile();
      return;
    }
    nav.expect = null;
    // Forward (a swipe from the other edge): the app doesn't go forward into a
    // screen it can't rebuild from nothing, so it stays where it is.
    if (st.i >= nav.index) {
      if (st.i !== nav.index) { nav.expect = nav.index; history.go(nav.index - st.i); }
      return;
    }
    nav.index = st.i;
    nav.stack.length = st.i + 1;
    const landed = String(st.t || 'menu').replace(/\+$/, '');
    const current = appState.currentView;
    if (landed === current) {
      // One of this screen's own extra entries went: close the top popup, or
      // ask before a game is dropped; with nothing to close or ask about, go
      // on back as the arrow would.
      const open = [...document.querySelectorAll('.modal-overlay:not(.hidden)')];
      if (open.length) {
        const top = open[open.length - 1];
        if (top.id) closeModal(top.id); else top.classList.add('hidden');
      } else if (!(typeof openExitSheet === 'function' && openExitSheet())) {
        const meta = VIEW_META[current];
        if (meta && meta.up) setView(meta.up);
      }
      navSoon();
      return;
    }
    const target = VIEW_META[landed] && document.getElementById('view-' + landed) ? landed : 'menu';
    // A browser that animated the way back itself (Android's predictive back):
    // the screen doesn't slide in a second time. On an iPhone the app draws the
    // swipe (the edge handler above), so this stays false there.
    nav.uaAnimated = e.hasUAVisualTransition === true && !EDGE_IOS;
    try {
      if (/^room-/.test(target) || target === 'together') {
        if (typeof Room !== 'undefined' && Room.isIn && typeof roomReturnToActive === 'function' && target !== 'together') roomReturnToActive();
        else setView('together');
      } else {
        setView(target);
      }
    } finally {
      nav.uaAnimated = false;
    }
    navSoon();
  });

  /** Told to the player when a reload cost them a timed round. */
  function toastRoundLost() {
    showToast(appState.lang === 'ar'
      ? 'انتهت الجولة بسبب إعادة تحميل الصفحة'
      : 'The round ended because the page reloaded');
  }

  /* The shell's height (--app-h in Style.html). 100dvh is right nearly always,
     but iOS keeps reporting the old value for a moment after the phone turns,
     and a landscape screen laid out at portrait height has half of itself off
     the bottom with nothing to scroll. innerHeight is current once resize
     fires; the late re-read covers a turn that reports its size after the
     event. */
  /* --- SCREEN SIZE -----------------------------------------------------------
   * Every size in Style.html is in rem, so the font size on <html> scales the
   * whole app. "auto" leaves it to the screen (the ANY SCREEN block). A laptop
   * driving a TV can report a small screen, so a size can also be picked here.
   * ------------------------------------------------------------------------ */
  const UI_SCALES = ['auto', '100', '125', '150', '200'];
  const UI_SCALE_KEY = 'ashryUiScale';

  function uiScale() {
    try {
      const saved = localStorage.getItem(UI_SCALE_KEY);
      return UI_SCALES.indexOf(saved) !== -1 ? saved : 'auto';
    } catch (e) {
      return 'auto';
    }
  }

  function applyUiScale() {
    const scale = uiScale();
    if (scale === 'auto') delete document.documentElement.dataset.uiScale;
    else document.documentElement.dataset.uiScale = scale;
  }

  function cycleUiScale() {
    const next = UI_SCALES[(UI_SCALES.indexOf(uiScale()) + 1) % UI_SCALES.length];
    try { localStorage.setItem(UI_SCALE_KEY, next); } catch (e) {}
    applyUiScale();
    updateSettingsLabels();
    haptic('light');
  }

  applyUiScale();
  applyMotionPref();

  function syncAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  syncAppHeight();
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      syncAppHeight();
      // Turning can leave the page itself scrolled, which shifts the whole app.
      window.scrollTo(0, 0);
    }, 300);
  });

  let viewEnterFallback = null;

  /** Tools that take the whole screen; the header and nav step aside for them. */
  const FULLSCREEN_VIEWS = ['play-chess', 'play-reaction', 'room-tv', 'play-chooser', 'play-headsup'];

  /* Setup screens whose options are drawn from appState (segmented controls,
     chips). They are painted whenever the screen is reached - from the menu,
     the back button or a reload - so they always show what is saved. */
  const SETUP_PAINTERS = {
    'setup-bomb': 'paintBombSetup',
    'setup-emoji': 'paintEmojiSetup',
    'setup-monkey': 'paintMonkeySetup',
    'setup-fiveseconds': 'paintFiveSetup',
    'setup-stop': 'paintStopSetup',
    'setup-memory': 'paintMemorySetup',
    'setup-xo': 'paintXOSetup',
    'setup-imposter': 'paintImposterSetup',
    'setup-whoami': 'paintWhoAmISetup',
    'setup-charades': 'paintCharadesSetup',
    'setup-describe': 'paintDescribeSetup',
    'setup-trivia': 'paintTriviaSetup',
    'setup-teams': 'paintTeamsSetup',
    'setup-justone': 'paintJustOneSetup',
    'setup-guessnum': 'paintGuessNumSetup',
    'setup-codenames': 'paintCodenamesSetup'
  };
  function paintSetupOptions(viewId) {
    const view = document.getElementById('view-' + viewId);
    // The plain fields (data-remember) and the one phone / own phones switch
    // go back first, so the screen's painter reads what was last chosen.
    if (view) recallFields(view);
    if (typeof paintPlayMode === 'function') paintPlayMode(viewId);
    const fn = SETUP_PAINTERS[viewId];
    if (fn && typeof window[fn] === 'function') window[fn]();
    else if (typeof soloPaintSetup === 'function') soloPaintSetup(viewId);
    if (view) syncTimePicks(view);
  }

  /* A segmented control standing in for a number field. A round length is one
     of a few sensible values, not something to type: the buttons write the
     seconds into the (hidden) input the game already reads. */
  function pickTime(btn, seconds) {
    const group = btn.closest('.time-pick');
    if (!group) return;
    const input = document.getElementById(group.dataset.for);
    if (input) {
      input.value = seconds;
      if (input.matches('[data-remember]')) rememberField(input);
    }
    group.querySelectorAll('.segmented__item').forEach(b => b.classList.toggle('is-active', b === btn));
  }
  function syncTimePicks(view) {
    view.querySelectorAll('.time-pick').forEach(group => {
      const input = document.getElementById(group.dataset.for);
      const value = input ? String(input.value) : '';
      group.querySelectorAll('.segmented__item').forEach(b => b.classList.toggle('is-active', b.textContent.trim() === value));
    });
  }

  const viewScroll = {};   // where each screen was scrolled to when it was left

  function setView(viewId) {
    if (typeof syncFxButton === 'function') syncFxButton(viewId);
    const previous = appState.currentView;
    document.body.classList.toggle('is-fullscreen-view', FULLSCREEN_VIEWS.indexOf(viewId) !== -1);
    document.body.classList.toggle('is-tv-view', viewId === 'room-tv');
    const goingBack = viewDepth(viewId) < viewDepth(previous);
    // Remembered before the views are hidden: hiding them shrinks the scroll
    // height, and the position would be read back clamped.
    const main = document.getElementById('shell-main');
    if (main && previous && previous !== viewId) viewScroll[previous] = main.scrollTop;
    // Going back from a game's screen, its icon flies home to its card (JS_Motion.html).
    const homeFlight = goingBack && typeof heroHomeFlight === 'function' ? heroHomeFlight(previous, viewId) : null;

    appState.currentView = viewId;
    if (previous !== viewId) runLeaveHooks(previous, viewId);
    navSync(previous, viewId, goingBack);
    if (typeof syncWakeLock === 'function') syncWakeLock(viewId);
    saveToLocal();

    if (viewId === 'menu' && previous !== 'menu' && typeof resetHomeFilters === 'function') resetHomeFilters(previous);
    if (viewId === 'menu' && typeof renderHome === 'function') renderHome();
    if (viewId === 'together' && typeof renderTogether === 'function') renderTogether();
    if (viewId === 'tools' && typeof renderTools === 'function') renderTools();

    document.querySelectorAll('[id^="view-"]').forEach(el => {
        el.classList.add('hidden');
        el.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
    });

    const viewEl = document.getElementById('view-' + viewId);
    if (viewEl) {
        const meta = VIEW_META[viewId];
        if (meta && meta.accent) viewEl.setAttribute('data-accent', meta.accent);

        viewEl.classList.remove('hidden');
        void viewEl.offsetWidth;   // restart the animation
        // The browser already slid this screen in (an iPhone's back swipe).
        if (!nav.uaAnimated) viewEl.classList.add('view-enter', goingBack ? 'view-enter-back' : 'view-enter-fwd');

        // animationend is the normal path, but never the only one — a very
        // short or suppressed animation fires no events at all, and the class
        // would then hold its transform forever (see the handler below).
        clearTimeout(viewEnterFallback);
        viewEnterFallback = setTimeout(() => {
            viewEl.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
        }, 600);
    }

    // A view arrives scrolled to wherever the last one was left otherwise;
    // going back, a screen comes back where it was (restored at the end,
    // once it is drawn).
    if (main) main.scrollTop = 0;

    closeAllModals();
    clearAllIntervals();
    syncChrome(viewId);

    if (viewId === 'tool-dice' && typeof paintDiceTool === 'function') paintDiceTool();
    if (viewId === 'timers' && typeof paintGenTimer === 'function') paintGenTimer();
    if(viewId.startsWith('setup-')) {
        const listId = viewId.replace('setup-', '') + '-player-list';
        if(typeof renderActiveChips === 'function') renderActiveChips(listId, true);
        paintSetupOptions(viewId);
        if(viewId === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
        if(viewId === 'setup-chameleon' && typeof renderChameleonCategories === 'function') renderChameleonCategories();
        if(viewId === 'setup-charades' && typeof renderCharadesDropdown === 'function') renderCharadesDropdown();
    }
    applyTranslations();
    if (main && goingBack && viewScroll[viewId]) main.scrollTop = viewScroll[viewId];
    if (homeFlight) homeFlight();
    if ((viewId === 'menu' || viewId === 'together' || viewId === 'tools') && typeof installAskSoon === 'function') installAskSoon();
    if (typeof syncAllSegmented === 'function') requestAnimationFrame(syncAllSegmented);
}

  /**
   * Scrolls the main area to where the action is: the top of the screen, or
   * `el`. The owner (17 Sep 2026): "my screen should always be in the place
   * that has actions" - a room's podium and a one-phone game's next card are
   * drawn at the top while the player is still scrolled down at the answer box
   * or the last button they pressed, and swiping up to find out what happened
   * is not a reveal. Nothing moves while the player is typing.
   */
  function scrollToAction(el) {
    const main = document.getElementById('shell-main');
    if (!main) return;
    const active = document.activeElement;
    if (active && main.contains(active)
        && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|color)$/i.test(active.type || '')))) return;
    const behavior = typeof motionOff === 'function' && motionOff() ? 'auto' : 'smooth';
    // After the new frame is laid out. A hidden page draws no frames, so there a
    // timer does it: the phone comes back from the lock screen already in place.
    const later = document.hidden ? (fn) => setTimeout(fn, 0) : requestAnimationFrame;
    later(() => {
      if (!el || !el.isConnected) { if (main.scrollTop > 0) main.scrollTo({ top: 0, behavior: behavior }); return; }
      const r = el.getBoundingClientRect(), m = main.getBoundingClientRect();
      const top = main.scrollTop + r.top - m.top - 8;
      if (Math.abs(top - main.scrollTop) > 4) main.scrollTo({ top: Math.max(0, top), behavior: behavior });
    });
  }

  /* The enter animation must not leave its transform behind: a transformed
     element becomes the containing block for its position:fixed descendants,
     which detached the floating action bars from the viewport. */
  document.addEventListener('animationend', (e) => {
      if (e.animationName === 'viewEnter' && e.target.id && e.target.id.startsWith('view-')) {
          e.target.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
      }
  });

  /* --- SETTINGS SHEET --- */
  function openSettings() {
      playSound('click');
      updateSettingsLabels();
      const el = document.getElementById('settings-modal');
      if (el) el.classList.remove('hidden');
  }

  function updateSettingsLabels() {
      const t = TRANSLATIONS[appState.lang];
      const icon = document.getElementById('settings-theme-icon');
      const themeVal = document.getElementById('settings-theme-value');
      const langVal = document.getElementById('settings-lang-value');
      if (icon) icon.innerText = appState.isDarkMode ? '☀️' : '🌙';
      if (themeVal) themeVal.innerText = appState.isDarkMode ? t.theme_dark : t.theme_light;
      if (langVal) langVal.innerText = appState.lang === 'ar' ? 'العربية' : 'English';
      const gameLangVal = document.getElementById('settings-gamelang-value');
      if (gameLangVal) gameLangVal.innerText = appState.gameLang === 'ar' ? 'العربية' : appState.gameLang === 'en' ? 'English' : (t.game_lang_auto || '');
      const nameVal = document.getElementById('settings-name-value');
      if (nameVal) nameVal.innerText = (typeof roomName !== 'undefined' && roomName.get()) || t.name_not_set || '';
      const scaleVal = document.getElementById('settings-scale-value');
      if (scaleVal) scaleVal.innerText = uiScale() === 'auto' ? (t.ui_scale_auto || '') : uiScale() + '%';
      const motionVal = document.getElementById('settings-motion-value');
      if (motionVal) motionVal.innerText = t['motion_' + motionPref()] || '';
  }

  /* --- CORE UI HELPERS --- */
  function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
      resumeClocksAfterSheet();
      // setView() closes everything, so the help nav item has to be released
      // here too or it stays lit after navigating away.
      const nav = document.getElementById('nav-help');
      if (nav) nav.classList.remove('is-active');
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
    if (id === 'exit-modal' || id === 'help-modal') resumeClocksAfterSheet();
    // The help sheet lights its nav item while it is open.
    if (id === 'help-modal') {
      const nav = document.getElementById('nav-help');
      if (nav) nav.classList.remove('is-active');
    }
  }

  function showToast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    let icon = 'ℹ️';
    if(type === 'success') icon = '✅';
    if(type === 'error') icon = '⚠️';
    const iconSpan = document.createElement('span');
    iconSpan.innerText = icon;
    const msgSpan = document.createElement('span');
    msgSpan.innerText = msg;
    el.appendChild(iconSpan);
    el.appendChild(document.createTextNode(' '));
    el.appendChild(msgSpan);
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 400);
    }, 3000);
  }

        uno: `

        screw: `
            <ol class="list-decimal list-inside space-y-1 text-xs">
                <li>Everyone has four face-down cards and, at the start, looks only at the bottom two (the third and fourth). The aim is the lowest total after the last round.</li>
                <li>On your turn, one thing: draw from the deck, take the top card of the pile, throw a matching card from your hand, or call <b>Screw</b>.</li>

            <details class="help-more">
                <summary>🃏 The cards and their values</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>1 to 6</b>: their face value, four of each.</li>
                    <li><b>7 and 8</b>: look at one of your cards. <b>9 and 10</b>: look at someone else's. Face value, four of each.</li>
                    <li><b>Blind swap</b> (4): swap one of your cards with someone else's without anyone seeing.</li>
                    <li><b>Basra</b> (4, or 2 in the first print): throw one of your cards on the pile.</li>
                    <li><b>All around</b> (2): look at one card of every player, or at two of yours.</li>
                    <li><b>+20</b> (4) and the <b>red screw</b> (2, worth 25): penalty cards, counted against you if they stay in your hand. Like any card, a drawn one is thrown or swapped into your hand (to throw it on a match later). The two screws are one kind: either goes on either, red on green, green on red, or the same colour.</li>
                    <li>The <b>green screw</b> (2, worth zero) and <b>−1</b> (1): the best cards to keep.</li>
                    <li>An action card only works when drawn from the deck and thrown straight away. Taken from the pile or left in a hand it does nothing and counts 10 (7, 8, 9 and 10 count their face).</li>
                </ul>
            </details>
            <details class="help-more">
                <summary>🎯 Your turn</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>Draw from the deck</b>: only you see it. Put it in place of one of your cards (the old one goes face up on the pile), or throw it; an action card thrown this way may use its power.</li>
                    <li><b>Take from the pile</b>: the top card replaces one of yours, and the old one goes on the pile. No power.</li>
                    <li><b>Throw a matching card</b>, on your own turn only: a card from your hand with the same value as the top card (or the same card). Right: it leaves your hand. Wrong: everyone sees it, it goes back face down where it was, and you draw a penalty card from the deck into a new slot (4 cards become 5) without looking at it.</li>
                    <li><b>Screw</b>: ends your turn, and your cards are protected. In the app it is allowed from the lap the host picked.</li>
                    <li>Cards with a mind of their own: <b>the Thief</b> and <b>Pong</b> go into your hand, and <b>Ping</b> and <b>El-Mesaharaty</b> play themselves as soon as they are drawn. Every other card is the same: throw it or keep it.</li>
                </ul>
            </details>
            <details class="help-more">
                <summary>📣 How a round ends: every case</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>Screw</b>: every other player gets one last turn, and nobody can call Screw again. Nobody can swap, take, give to, blow up, fire the cannon at or scream away the caller's cards (in teams, the whole team's); looking is allowed.</li>
                    <li><b>Someone runs out of cards</b> (their last card thrown): the round stops at once for everyone, even in the middle of the last turns after Screw. No more turns, no Screw.</li>
                    <li><b>El-Mesaharaty</b>: a forced Screw on the spot; the cards are shown without a last lap, and whoever drew it counts as the caller. If someone had already called Screw, the last turns stop and the cards are shown at once, and the first caller stays the caller.</li>
                    <li><b>The deck runs out</b>: the top card of the pile stays, the rest is shuffled into a new deck, and play goes on.</li>
                    <li><b>Sudden death</b> (an option in the app): as soon as the last card is drawn, everyone gets one last turn (no drawing from the deck), then the reveal.</li>
                </ul>
            </details>
            <details class="help-more">
                <summary>🧮 Scoring, with examples</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li>Everyone adds up their cards. The lowest total scores <b>zero</b>, everyone else their total.</li>
                    <li>A <b>caller</b> lower than everyone or <b>equal to the lowest</b>: scores zero, and the player who tied keeps their own total.</li>
                    <li>A <b>caller who is beaten</b>: their total is doubled, even a negative one (−1 becomes −2, in their favour), and the lowest of the others scores zero. In teams only the caller's own hand is doubled, then added to the partner's.</li>
                    <li>A player who <b>runs out of cards</b>: scores zero and wins the round even against a negative total, even when someone else's card (such as Boom) emptied the hand; everyone else their total, and the caller (if someone else) is doubled.</li>
                    <li>After the last round, the <b>lowest overall total wins</b>.</li>
                </ul>
                <p class="help-sub">Examples</p>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li>Screw on 3, the next lowest has 5: the caller 0, the other 5.</li>

                    <li>When the round ends, before the reveal, <b>everyone votes</b>: who holds the thief, or no thief. The majority decides, and a tie goes the caller's way.</li>

                    <li><b>Ping</b>: plays itself when drawn, and the next player (from the other side) loses their turn, so it passes to your partner.</li>

                    <li>Every version can also be played alone, 2 to 12 players.</li>

                    <li><b>The Cannon</b>: pick a player; their cards are face up for everyone until the round ends.</li>
                    <li><b>Khoshaf</b>: see the top four cards of the deck and take one; the other three go under the deck. The card you take counts as drawn: keep it, throw it, or throw an action card and use its power.</li>

            <details class="help-more">
                <summary>😱 Oscar</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>These two play themselves</b>: the moment you draw Boom or Oscar's scream off the pile it fires — you cannot keep it in your hand and you cannot skip its power.</li>
                    <li><b>Oscar's scream</b>: everyone's cards are gathered, shuffled and dealt back face down, each player getting as many as they had, and nobody knows which card they got: whatever you memorised is gone. The caller's cards (and their team's) stay where they are. Then whoever played it takes a whole new turn.</li>
                    <li><b>Boom</b>: every other player (not whoever played it, and not the caller's side) picks one of their own cards and it goes onto the pile face up, whatever it is, even the red screw or the thief (a lucky escape). If a hand runs out, the round ends. Then whoever played it takes a whole new turn.</li>

        timeline: `

        mind: `
            <ol class="list-decimal list-inside space-y-1 text-xs">
                <li>A cooperative game: no teams and no single winner — you all win or you all lose.</li>
                <li>Everyone gets numbers from <b>1 to 100</b> on their own phone that nobody else can see. Level 1 is one card each, level 2 is two, and so on.</li>
                <li>You have to lay every card down <b>from lowest to highest</b> — without anyone saying their number or hinting at it.</li>
                <li>When you believe nobody holds anything lower than your lowest card, play it.</li>
                <li>If somebody did hold something lower, <b>you lose a heart</b>, and every card lower than the one played is turned face up and taken away — so the level keeps moving.</li>
                <li>You start with a heart per player. When they run out, the game is over.</li>
                <li>Cleared the level? The host deals the next one, with one more card each.</li>
            </ol>
            <p class="help-sub">💡 Tips</p>
            <ul class="list-disc list-inside space-y-1 text-xs">
                <li>The silence is the game. Waiting is the only language: the longer you wait, the higher your card.</li>
                <li>Agree only on when to start, then look at each other and say nothing.</li>
            </ul>
            <p class="help-sub">📺 On the TV</p>
            <ul class="list-disc list-inside space-y-1 text-xs">
                <li>The screen shows the level, the hearts, the last card down and how many cards each player still holds — never the numbers themselves.</li>
            </ul>`,
        uno: `
            <ol class="list-decimal list-inside space-y-1 text-xs">
                <li>Everyone gets <b>7 cards</b> on their phone, and one card is turned up on the pile.</li>
                <li>On your turn throw a card of <b>the same colour</b> or <b>the same number or symbol</b> as the pile, or a <b>wild</b>. The cards that fit light up by themselves.</li>
                <li>Nothing fits (or you'd rather not)? <b>Draw one card</b>: if it fits you may throw it at once, or keep it and your turn ends. After drawing you can't throw a different card from your hand.</li>
                <li>With two cards left, press <b>UNO!</b> before you throw one of them or right after. Down to one card without saying it, anyone can press <b>Catch!</b> before the next move, and you draw two.</li>
                <li>The first to go out wins the round.</li>
            </ol>
            <p class="help-sub">📱 Each on their own phone</p>
            <ul class="list-disc list-inside space-y-1 text-xs">
                <li>Your cards are on your phone only; the others see how many you hold. The pile, the colour, the direction of play and who is next are in front of everyone, and every move shows as it happens.</li>
                <li>The host sets the rules in the room, and their phone remembers them for next time. Short of players, add <b>computer players</b>: the easy one throws the first card that fits and sometimes forgets UNO; the hard one plays to win. A computer never sees anyone's hand.</li>
                <li>The host can skip the turn of a phone that has gone quiet.</li>
            </ul>
            <p class="help-sub">📺 On the TV</p>
            <ul class="list-disc list-inside space-y-1 text-xs">
                <li>The whole table: the pile, the deck and how many cards each player holds, every move as it happens, and the result at the end.</li>
            </ul>
            <p class="help-sub">💡 Tips</p>
            <ul class="list-disc list-inside space-y-1 text-xs">
                <li>Keep a wild for when you need it: it saves you when nothing else fits.</li>
                <li>The next player is nearly out? Hit them with a Skip or a +2.</li>
            </ul>
            <details class="help-more">
                <summary>🃏 The cards</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>108 cards</b>: four colours (red, yellow, green, blue), each with one 0 and two of every 1 to 9, two Skips, two Reverses and two +2s; then 4 wilds and 4 wild +4s. From 11 players: two decks shuffled together.</li>
                    <li><b>Skip</b>: the next player misses their turn. <b>Reverse</b>: play turns the other way (with two players it works as a Skip).</li>
                    <li><b>+2</b>: the next player draws 2 and misses their turn. <b>Wild</b>: goes on anything, and you name the colour. <b>Wild +4</b>: name the colour, and the next player draws 4 and misses their turn; it can be played at any time.</li>
                    <li><b>The first card</b>: a wild +4 goes back and another is turned. A wild: the first player picks the colour. A Skip, Reverse or +2 acts on the first player (with a Reverse the dealer starts, the other way round).</li>
                    <li>The deck ran out? The whole pile but its top card is shuffled into a new deck.</li>
                </ul>
            </details>
            <details class="help-more">
                <summary>🏠 House rules (set in the room)</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>➕ Stacking draws</b> (on to begin with): facing a draw, throw a +2 on a +2 (any colour) or a +4 on a +4 and the draw grows and passes on - or draw it all and lose your turn. <b>Also +4 on +2</b> lets a +4 go on a +2 (a +2 never goes on a +4). With stacking off, the player after a +2 or +4 just draws and is skipped.</li>
                    <li><b>🂠 Draw until you can play</b>: instead of one card, keep drawing until one fits; then throw it or keep it.</li>
                    <li><b>🔀 7-0</b>: a 7 swaps your whole hand with a player you pick; a 0 passes every hand on one seat in the direction of play. A 7 or 0 as your last card ends the round with no swap, and a hand of one that came by a swap can't be caught.</li>
                    <li><b>⚡ Jump in</b>: holding the very same card as the pile's top (same colour, same number or symbol, never a wild), throw it at any time, even out of turn; play carries on from you and whoever was up loses the turn. On a +2 still waiting with stacking on, jumping in with the same +2 raises the draw and passes it to the player after you.</li>
                    <li><b>⏱️ Turn clock</b> (30 or 60 seconds): when it runs out the phone plays for you: it takes a draw waiting on you, or draws a card and passes.</li>
                </ul>
            </details>
            <details class="help-more">
                <summary>🧮 Rounds and points</summary>
                <ul class="list-disc list-inside space-y-1 text-xs">
                    <li><b>One round</b> (to begin with): the first to go out wins, no points. The cards left are turned over for everyone to see, and playing again counts the wins.</li>
                    <li><b>A number of rounds</b> (3, 5 or 7): whoever goes out scores the cards left in everyone else's hand - numbers their face, Skip, Reverse and +2 20, wilds and wild +4s 50. Most points after the last round wins.</li>
                    <li>If the last card is a +2 or +4, the next player still draws them, and in a game of rounds they count.</li>
                </ul>
            </details>`,
        herd: `

        mafia: `

        'cs-estimation': `
            <ol class="list-decimal list-inside space-y-1 text-xs">
                <li>Play with a real deck; the phone keeps the score. After each round enter every player's <b>call</b> and the <b>tricks they took</b> (13 in all), and choose the <b>caller</b> and <b>who called last</b>.</li>
                <li>Made the call exactly: <b>10 + the call</b>, +10 for the caller and anyone "with" them (the same number), +10 per risk level for the last to call, +10 for the only one who made it.</li>
                <li>Missed: minus the tricks off, −10 for the caller and "with", −10 per risk level, −10 for the only one who missed.</li>
                <li><b>Risk</b>: calls 2-3 away from 13 is one level, 4-5 away two.</li>
                <li><b>Dash call</b> (zero before the auction): ±33 in an under round and ±25 in an over round, or +33 / −23 as you choose.</li>
                <li>If nobody makes their call, nobody scores and the next round counts double.</li>
                <li>13 rounds, then 5 speed rounds with no auction. Highest total wins.</li>

        'cs-tarneeb': `
            <ol class="list-decimal list-inside space-y-1 text-xs">
                <li>4 players in seating order: the 1st and 3rd are a team, the 2nd and 4th the other.</li>
                <li><b>Levantine</b>: after each hand choose the bidding team, the bid (7-13) and the tricks it took. Made: it scores its tricks. Failed: it loses the bid and the other team scores its tricks.</li>
                <li>All 13 without bidding 13 is 16. Bidding 13 and making it 26; failing −16, and the other team scores double.</li>
                <li><b>Egyptian</b>: the same, and a bid can be doubled ×2 or ×4.</li>
                <li><b>41</b>: everyone bids alone; mark who made their bid. Bids of 5 and up are worth more (5 = 10, 9 = 27...). A team wins when one player reaches 41 with their partner above zero; bidding 13 and making it wins outright.</li>
