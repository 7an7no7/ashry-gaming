    } else {
        // The build always puts the spy words in the page; carry on without them.
        SPY_CATEGORIES = {};
        dataLoaded = true;
        setSyncing(false);
    }

    try { loadFromLocal(); } catch (e) {
      console.error('load failed', e);
      try { setView('menu'); } catch (e2) {}
    }
    // The history gets one entry per screen from the home to the one restored.
    navInit(appState.currentView);
    // The saved screen is known now, so the intro can decide how to leave.
    introExit();

    // An iPhone copy on the home screen with an older icon (JS_Utils.html).
    if (typeof checkIconBanner === 'function') checkIconBanner();
    // The "open in Safari" link from that banner lands on the install steps.
    if ((window.OPEN_INSTALL || /[?&]install=1/.test(location.search)) && typeof showInstallHelp === 'function') {
        setTimeout(showInstallHelp, 700);
    }
    // A shortcut on the app's icon (a long press: «ادخل غرفة», «تحدي اليوم»,
    // «الليلة دي؟»; manifest.webmanifest, the owner's pick F1 of 7 Oct 2026). The
    // build reads ?open= and takes it off the address; the preview has no build
    // script, so the address is read here too.
    const shortcut = window.OPEN_SHORTCUT || (location.search.match(/[?&]open=(join|daily|tonight)\b/) || [])[1] || '';
    if (shortcut) {
        setTimeout(() => {
            if (shortcut === 'join' && typeof roomOpenJoin === 'function') roomOpenJoin('');
            else if (shortcut === 'daily') setView('setup-daily');
            else if (shortcut === 'tonight' && typeof tonightOpen === 'function') { setView('menu'); tonightOpen(); }
        }, 700);
    }

    
    document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
  }

  /* Settings → تحديث البيانات. A real reload: the service worker fetches the
     network first, so this is how a home-screen copy (which has no reload
     button) picks up a new build. Re-running initializeApp loaded nothing new. */
  /**
   * Settings → تحديث البيانات. The app opens from the copy on the phone, so a plain reload
   * would show that copy again: ask for sw.js first, and if a newer build is being
   * installed, the page switches the moment its worker takes over (controllerchange above).
   */
  let appUpdateAsked = false;
  // A room's game whose chunk is gone from the server (lzUpdateApp): switch even in the room.
  let appUpdateForced = false;
  async function updateApp(force) {
    const sw = window.STATIC_SITE && navigator.serviceWorker;
    const reg = sw ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
    if (!reg) { reloadApp(); return; }
    appUpdateAsked = true;
    if (force === true) appUpdateForced = true;
    try { await reg.update(); } catch (e) {}
    if (!reg.installing && !reg.waiting) { reloadApp(); return; }
    const t = TRANSLATIONS[appState.lang] || {};
    if (typeof showToast === 'function') showToast(t.update_downloading || 'بنزّل النسخة الجديدة…', 'info');
    // A download that never ends (the network went) still gets a reload - on a screen
    // that loses nothing, or once the phone is back on one.
    setTimeout(() => { if (appUpdateForced || appUpdateSafeView()) reloadApp(); else appUpdateWatch(); }, 120000);
  }

  /* --- Settings → الإصدار: when this copy was published, and whether it is the latest --- */
  let appVersionState = '';

  // BUILD_ID is the build's time in UTC, YYYYMMDDHHMMSS (tools/build-site.mjs).
  function appBuildDate() {
    const id = String(window.BUILD_ID || '');
    if (!/^\d{14}$/.test(id)) return null;
    return new Date(Date.UTC(+id.slice(0, 4), +id.slice(4, 6) - 1, +id.slice(6, 8), +id.slice(8, 10), +id.slice(10, 12), +id.slice(12, 14)));
  }

  // A date and a time, never a version number (the owner's rule: no "v12").
  function appVersionLabel() {
    const d = appBuildDate();
    if (!d) return '';
    try {
      return d.toLocaleString(appState.lang === 'en' ? 'en-GB' : 'ar-EG', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', hour12: true });
    } catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
  }

  /**
   * Asks the server for sw.js (a couple of KB, quick however slow the page itself would be):
   * its stamp is the newest build. Newer than this page and already on the phone (its cache
   * is there): ready, a tap switches. Newer and not yet here: it is being fetched now.
   */
  async function paintAppVersion() {
    const val = document.getElementById('settings-version-value');
    const st = document.getElementById('settings-version-status');
    if (!val || !st) return;
    const t = TRANSLATIONS[appState.lang] || {};
    const set = (k) => { appVersionState = k; st.textContent = t['ver_' + k] || ''; };
    val.textContent = appVersionLabel();
    if (!window.STATIC_SITE || !window.BUILD_ID) { set('preview'); return; }
    // Offline first: a copy of sw.js a browser cache still holds would say "latest".
    if (typeof navigator !== 'undefined' && navigator.onLine === false) { set('offline'); return; }
    set('checking');
    let latest = null;
    try {
      const res = await fetch('sw.js', { cache: 'no-store' });
      const m = /const CACHE = 'ashry-(\d+)'/.exec(await res.text());
      latest = m && m[1];
    } catch (e) { latest = null; }
    if (!latest) { set('offline'); return; }
    if (latest <= String(window.BUILD_ID)) { set('latest'); return; }
    // A worker still installing (or waiting) is the new build on its way, not here yet.
    let reg = null;
    try { reg = await navigator.serviceWorker.getRegistration(); } catch (e) {}
    if (reg && (reg.installing || reg.waiting)) { set('downloading'); return; }
    // Its cache is opened before anything is fetched, and stays after a failed install:
    // here means the install's last word, which it writes once everything has arrived.
    let here = false;
    try {
      if ((await caches.keys()).indexOf('ashry-' + latest) !== -1) here = !!(await (await caches.open('ashry-' + latest)).match('./.installed'));
    } catch (e) {}
    if (here) { set('ready'); return; }
    set('downloading');
    try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) reg.update(); } catch (e) {}
  }

  /**
   * Settings → الإصدار, a second line (the owner's pick 1261, 7 Oct 2026): «جاهز من غير نت ✓»
   * once every game's chunk of this build is on the phone, «بيتحمّل للعب من غير نت ٤٠/٧٢» while
   * the worker is still fetching them. Counted here, in the worker's own cache (g-chunks: the
   * worker fetches every chunk when a build installs, and a chunk opened is kept there too),
   * against the build's map (LZ_MANIFEST); looked at again every 1.5 s while Settings is open.
   * Nothing at all where there is no offline copy (the preview, a browser with no worker).
   */
  let offlineReadyTimer = null;
  let offlineReadyLast = null;   // { text, done, lang }: what the line said last
  async function paintOfflineReady() {
    clearTimeout(offlineReadyTimer);
    const el = document.getElementById('settings-offline-status');
    if (!el) return;
    const lz = window.LZ_MANIFEST;
    const files = lz && lz.chunks ? Object.keys(lz.chunks).map(id => lz.chunks[id].f) : [];
    if (!window.STATIC_SITE || !files.length || typeof caches === 'undefined' || !navigator.serviceWorker) { el.hidden = true; return; }
    // The line keeps its place while the cache is counted (the owner, 8 Oct 2026: it
    // appeared after ~70 lookups and grew the sheet under its rising rows): what it
    // said last time, or «…», where a worker is in charge.
    if (el.hidden && navigator.serviceWorker.controller) {
      const last = offlineReadyLast && offlineReadyLast.lang === appState.lang ? offlineReadyLast : null;
      el.textContent = last ? last.text : '…';
      el.classList.toggle('tx-success', !!(last && last.done));
      el.hidden = false;
    }
    let have = 0;
    try {
      if (await caches.has('g-chunks')) {
        const g = await caches.open('g-chunks');
        const hits = await Promise.all(files.map(f => g.match(new URL((lz.base || 'g/') + f, location.href).href, { ignoreSearch: true })));
        have = hits.filter(Boolean).length;
      }
    } catch (e) { el.hidden = true; return; }
    // No worker in charge and nothing kept: this browser has no offline copy to talk about.
    if (!have && !navigator.serviceWorker.controller) { el.hidden = true; return; }
    const t = TRANSLATIONS[appState.lang] || {};
    const num = (n) => (appState.lang === 'ar' ? n.toLocaleString('ar-EG') : String(n));
    const done = have >= files.length;
    // The count held left to right (an isolate): "40/72" in an Arabic line.
    el.textContent = done ? (t.offline_ready || '')
      : String(t.offline_loading || '').replace('{n}', '\u2066' + num(have) + '/' + num(files.length) + '\u2069');
    el.classList.toggle('tx-success', done);
    el.hidden = false;
    offlineReadyLast = { text: el.textContent, done, lang: appState.lang };
    const sheet = document.getElementById('settings-modal');
    if (!done && sheet && !sheet.classList.contains('hidden')) offlineReadyTimer = setTimeout(paintOfflineReady, 1500);
  }

  function appVersionTap() {
    if (appVersionState === 'ready') { reloadApp(); return; }
    // Being fetched: a tap asks for it to open as soon as it has arrived.
    if (appVersionState === 'downloading') {
      updateApp();
      const st = document.getElementById('settings-version-status');
      const t = TRANSLATIONS[appState.lang] || {};
      if (st) st.textContent = t.update_downloading || '';
      return;
    }
    paintAppVersion();
  }

  function reloadApp() {
      try { saveToLocal(); } catch (e) {}
      // Every caller is a new build being switched to: the next page says so (appUpdateNews).
      try { sessionStorage.setItem(APP_SWITCHED_KEY, '1'); } catch (e) {}
      location.reload();
  }

  /* «اتحدّث» names what's new (the owner's pick 1265, 7 Oct 2026). The build this phone last
     ran is kept; once the intro has gone, a page that is a newer build than that says so in one
     quiet toast: «اتحدّث ✨ · جديد: الليزر», the games whose `added` date (Games.js) is after
     the last build's day, with a button that opens the first. With no new game it speaks only
     when it was switched to by itself (reloadApp), «اتحدّث ✨» alone; a first visit says nothing. */
  const APP_LAST_BUILD_KEY = 'ashryLastBuild';
  const APP_SWITCHED_KEY = 'ashrySwitched';
  function appUpdateNews() {
    const now = String(window.BUILD_ID || '');
    if (!/^\d{14}$/.test(now)) return;
    let prev = '', switched = false;
    try {
      prev = localStorage.getItem(APP_LAST_BUILD_KEY) || '';
      switched = sessionStorage.getItem(APP_SWITCHED_KEY) === '1';
      sessionStorage.removeItem(APP_SWITCHED_KEY);
      localStorage.setItem(APP_LAST_BUILD_KEY, now);
    } catch (e) { return; }
    if (!/^\d{14}$/.test(prev) || prev >= now) return;
    const day = prev.slice(0, 4) + '-' + prev.slice(4, 6) + '-' + prev.slice(6, 8);
    const today = now.slice(0, 4) + '-' + now.slice(4, 6) + '-' + now.slice(6, 8);
    const fresh = (typeof GAME_LIST !== 'undefined' ? GAME_LIST : [])
      .filter(g => g.added && g.added > day && g.added <= today && !(typeof catalogOff === 'function' && catalogOff(g.id)));
    if (!fresh.length && !switched) return;
    const t = TRANSLATIONS[appState.lang] || {};
    const names = fresh.slice(0, 2).map(g => t[g.title] || g.id).join(appState.lang === 'en' ? ', ' : '، ');
    const msg = (t.update_done || '') + (names ? ' · ' + (t.update_new || '{names}').replace('{names}', names) : '');
    showToast(msg, 'info', fresh.length && typeof catalogOpen === 'function'
      ? { ms: 8000, action: { label: t.update_try || '', run: () => catalogOpen(fresh[0].id) } } : null);
  }

  // Clock handles and timeout ids are parked on appState, but they mean nothing
  // outside the current page: dropping them keeps a revived save from handing back
  // something that merely looks like a live clock.
  const OMIT_FROM_SAVE = ['interval', 'timeoutId'];

  function saveToLocal() {
    // Private browsing or a full storage throws here; setView calls this on
    // every screen change, so a throw would stop the app from moving at all.
    try {
      localStorage.setItem('gameTrackerState_v1', JSON.stringify(appState,
        (key, value) => OMIT_FROM_SAVE.includes(key) ? undefined : value));
    } catch (e) { /* nothing to save to: play on */ }
  }

  /**
   * Clears every timer handle parked on appState, and the flags that go with them.
   *
   * Called when leaving a view and again after loading a saved state - a save from
   * an older version holds setInterval ids (plain numbers) where a clock handle is
   * now expected, and either would pass a truthiness check and then blow up on
   * .stop().
   */
  function dropTimerHandles() {
    appState.charades.interval = null;
    appState.describe.interval = null;
    appState.whoami.interval = null;
    appState.whoami.isPaused = false;
    const general = appState.timers.general;
    if (!(general.interval && general.interval.keepRunning && general.interval.isRunning())) {
        general.interval = null;
        general.running = false;
    }
    appState.timers.chess.interval = null;
    appState.timers.chess.active = null;
    appState.reaction.timeoutId = null;
  }

  function loadFromLocal() {
    // A browser that blocks storage (a TV's, a locked-down kiosk) throws here;
    // the app starts fresh rather than not at all.
    let saved = null;
    try { saved = localStorage.getItem('gameTrackerState_v1'); } catch (e) { saved = null; }

    // 👇 FIX: Added 'input-whoami' and 'play-chess' to the safe list
    const validViews = [
        'menu', 'together', 'tools', 'crew',
        'setup-chameleon', 'reveal-chameleon', 'play-chameleon', 'setup-spyfall', 'reveal-spyfall', 'play-spyfall', 'setup-timesup', 'play-timesup',
        'setup-screw', 'play-screw', 
        'setup-monkey', 'play-monkey', 
        'setup-imposter', 'imposter-reveal', 'play-imposter', 
        'setup-domino', 'play-domino', 
        'setup-spin', 'play-spin', 
        'setup-universal', 'play-universal', 
        'timers',
        'setup-whoami', 'input-whoami', 'play-whoami', 'tool-dice', 'setup-codenames',
        'setup-charades', 'play-charades',
        'setup-describe', 'play-describe',
        'setup-wordle', 'play-wordle',
        'setup-guessnum', 'play-guessnum',
        'setup-justone', 'play-justone',
        'setup-tourney', 'play-tourney',
        'setup-teams', 'results-teams',
        'setup-reaction', 'play-reaction',
        'setup-trivia', 'play-trivia',
        'setup-quizmaker', 'play-quizmaker', 'setup-wordpack',
        'setup-connections', 'play-connections',
        'setup-bomb', 'play-bomb',
        'setup-emoji', 'play-emoji', 'setup-proverbs', 'play-proverbs', 'setup-fiveseconds', 'play-fiveseconds',
        'room-twotruths', 'room-emoji', 'room-proverbs', 'room-fiveseconds', 'room-telephone', 'room-monkey', 'room-herd', 'room-mafia', 'room-mind', 'room-timeline', 'room-uno', 'room-domino',
        'room-connect4', 'room-dots', 'room-xo', 'room-battleship', 'room-chess', 'room-votechess', 'room-handbrain', 'room-bughouse', 'room-ludo', 'room-snakes', 'room-bank', 'room-guesswho', 'room-hangman', 'room-bowling', 'room-doubt', 'room-skull', 'room-oldmaid', 'room-estimation', 'room-minigolf', 'room-chess4',
        // One sets, everyone solves (JS_RoomSolve.html).
        'room-wordle', 'room-guessnum', 'room-flags',
        'setup-stop', 'play-stop',
        'setup-memory', 'play-memory',
        'setup-xo', 'play-xo',
        'play-chooser',
        'play-chess',
        'setup-daily-archive',
        'setup-stats'
    ];

    // A game's own screens (VIEW_RESTORE, its file) come back too.
    validViews.push(...Object.keys(VIEW_RESTORE));

    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            
            const deepMerge = (target, source) => {
                for (const key in source) {
                    if (source[key] instanceof Object && !Array.isArray(source[key]) && target[key] instanceof Object) {
                        Object.assign(target[key], deepMerge(target[key], source[key]));
                    } else {
                        target[key] = source[key];
                    }
                }
                return target;
            };
            appState = deepMerge(appState, parsed);
            dropTimerHandles();

            // cachedPlayers was a copy of the shared sheet list; the library
            // is its own store now and is loaded by initializeApp.
            delete appState.cachedPlayers;
            // الترتيب الأعمى was removed (the owner, 17 Sep 2026); drop its saved board.
            delete appState.blindrank;

            // Room screens come back too: initRooms() redraws them once the session
            // resumes, and restoreView() sends the player to the menu if it can't.
            // Left out, a reload mid-game always landed on the menu.
            if (!validViews.includes(appState.currentView) && String(appState.currentView || '').indexOf('room-') !== 0
                && !(typeof soloViews === 'function' && soloViews().includes(appState.currentView))) {
                appState.currentView = 'menu';
            }
            if(appState.isDarkMode) document.body.classList.add('dark');
            
            document.documentElement.lang = appState.lang || 'ar';
            document.documentElement.dir = (appState.lang === 'en') ? 'ltr' : 'rtl';
            applyTranslations();
        } catch (e) {
            console.error("Error loading state", e);
            appState.currentView = 'menu';
        }
    } else {
        appState.currentView = 'menu'; 
        // A phone opening the app for the first time starts in its own theme.
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            appState.isDarkMode = true;
            document.body.classList.add('dark');
        }
    }
    syncThemeColor();
    restoreView();
  }

  /* The browser's bar (and an installed app's status bar) takes the page's own
     background, in either theme, instead of a fixed indigo. */
  function syncThemeColor() {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      // Read once the theme's colour fade (350ms) has finished.
      setTimeout(() => {
          const bg = getComputedStyle(document.body).backgroundColor;
          if (bg && bg !== 'rgba(0, 0, 0, 0)') meta.setAttribute('content', bg);
      }, 400);
  }

  // Held so a rapid double-toggle doesn't strip .theme-transition mid-fade.
  let themeTransitionTimer = null;

  function toggleDarkMode() {
      appState.isDarkMode = !appState.isDarkMode;

      // Colour transitions are scoped to this class rather than living in the
      // global `*` rule, so they only apply while the theme is switching.
      document.body.classList.add('theme-transition');
      clearTimeout(themeTransitionTimer);
      themeTransitionTimer = setTimeout(() => {
          document.body.classList.remove('theme-transition');
      }, 350);

      document.body.classList.toggle('dark');
      syncThemeColor();

      const icon = appState.isDarkMode ? '☀️' : '🌙';
      const headerIcon = document.getElementById('dark-mode-icon');
      const bottomIcon = document.getElementById('bottom-dark-mode-icon');
      
      if (headerIcon) headerIcon.innerText = icon;
      if (bottomIcon) bottomIcon.innerText = icon;
      
      updateSettingsLabels();
      playSound('click');
      haptic('light');
      saveToLocal();
  }

  /* A game that brings its own screens back after a reload (5 Oct 2026): its file
     says VIEW_RESTORE['play-mygame'] = () => { … } for each of its screens (tools/
     new-game.mjs writes them), and those screens are kept on a reload (validViews)
     and handed to it here. The games written before have their branch below. */
  const VIEW_RESTORE = {};

  /* A save from an older build, or a bug in one game's redraw, must not leave a
     blank screen (and on a full-screen view, no header or nav to get out
     with): a restore that throws lands on that game's setup screen instead. */
  function restoreView() {
    try {
        restoreSavedView();
    } catch (e) {
        console.error('restore failed', appState.currentView, e);
        const up = (VIEW_META[appState.currentView] || {}).up || '';
        document.body.classList.remove('is-fullscreen-view', 'is-tv-view');
        // The setup screen can throw on the same saved data: then the home, and start-up goes on.
        try { setView(up.indexOf('setup-') === 0 ? up : 'menu'); } catch (e2) {
          console.error('restore fallback failed', e2);
          try { setView('menu'); } catch (e3) {}
        }
    }
  }

  function restoreSavedView() {
    // A game switched off for a fix (DisabledGames.js) doesn't come back on a
    // reload either: setView's own check never runs for a restored screen.
    if (!/^room-/.test(appState.currentView || '') && typeof gameOffForView === 'function' && gameOffForView(appState.currentView)) {
        setView('menu');
        if (typeof gameOffToast === 'function') setTimeout(gameOffToast, 0);
        return;
    }
    document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
    // setView sets these, but a reload restores the screen without it: the
    // chess clock came back with the header and nav, and the big screen as a
    // 520px phone column.
    document.body.classList.toggle('is-fullscreen-view', FULLSCREEN_VIEWS.indexOf(appState.currentView) !== -1);
    document.body.classList.toggle('is-tv-view', appState.currentView === 'room-tv');
    document.body.classList.toggle('in-room-game', /^room-/.test(appState.currentView || '') && ['room-lobby', 'room-join', 'room-tv'].indexOf(appState.currentView) === -1);
    syncNavRoom(appState.currentView);
    // A room screen restored after a reload is not reached through setView.
    if (typeof syncFxButton === 'function') syncFxButton(appState.currentView);
    
    const restoring = appState.currentView;
    const viewEl = document.getElementById('view-' + restoring);
    
    if (viewEl) {
        // --- RESTORE GAME LOGIC ---
        if (appState.currentView === 'together' && typeof renderTogether === 'function') renderTogether();
        else if (appState.currentView === 'crew' && typeof renderCrew === 'function') renderCrew();
        else if (appState.currentView === 'tools' && typeof renderTools === 'function') renderTools();
        else if (typeof VIEW_RESTORE[appState.currentView] === 'function') VIEW_RESTORE[appState.currentView]();
        else if (appState.currentView === 'play-screw') renderScrewBoard();
        else if (appState.currentView === 'play-monkey') {
            renderMonkeyBoard();
            // Mid-turn the clock isn't saved: the turn starts again with its full time.
            if (monkeyState().phase === 'play') startTimer(); else updateTimerUI();
            // A game that had ended: its result comes back (initializeApp closes
            // every popup after this, hence the tick), with its play-again.
            if (appState.monkey && appState.monkey.phase === 'done') {
                setTimeout(() => { if (appState.currentView === 'play-monkey' && appState.monkey.phase === 'done') checkWinCondition(true); }, 0);
            }
        }
        else if (appState.currentView === 'imposter-reveal') showRevealStep();
        else if (appState.currentView === 'play-imposter') { renderImposterBoard(); isPaused = true; updateImposterTimerUI(); if (typeof imp1Restore === 'function') imp1Restore(); }
        else if (appState.currentView === 'play-domino') {
            if ((appState.domino.players || []).length) renderDominoBoard();
            else setTimeout(() => setView('setup-domino'), 50);
        }
        else if (appState.currentView === 'play-universal') {
            if ((appState.universal.players || []).length) renderUniversalBoard();
            else setTimeout(() => setView('setup-universal'), 50);
        }
        else if (appState.currentView === 'timers') { switchTimerMode('general'); if (typeof paintGenTimer === 'function') paintGenTimer(); }
        else if (appState.currentView === 'tool-dice' && typeof paintDiceTool === 'function') paintDiceTool();
        // The bracket lives entirely in appState, so it redraws exactly. (The
        // old call named a function that does not exist, and the typeof guard
        // meant it failed silently and showed an empty bracket.)
        else if (appState.currentView === 'play-tourney') {
            if ((appState.tourney.matches || []).length && typeof renderBracket === 'function') renderBracket();
            else setTimeout(() => setView('setup-tourney'), 50);
        }
        // paintTeams, not renderTeams: the latter re-rolls, re-navigates and
        // re-fires confetti, and called with no argument it threw outright.
        else if (appState.currentView === 'results-teams') {
            if ((appState.teams.result || []).length && typeof paintTeams === 'function') paintTeams(appState.teams.result);
            else setTimeout(() => setView('setup-teams'), 50);
        }
        else if (appState.currentView === 'play-spin') {
            const pickerDisplay = document.getElementById('picker-display');
            if(pickerDisplay) pickerDisplay.innerText = "???";
            const spinResultBox = document.getElementById('spin-result-box');
            if(spinResultBox) spinResultBox.classList.add('hidden');
            const spinBtn = document.getElementById('spin-btn');
            if(spinBtn) spinBtn.disabled = false;
        }
        // 👇 FIX: Full-Screen reload protections added here 👇
        else if (appState.currentView === 'play-chess' && typeof updateChessUI === 'function') {
            updateChessUI(); 
        }
        else if (appState.currentView === 'play-reaction') {
            setTimeout(() => { setView('setup-reaction'); toastRoundLost(); }, 50);
        }
        else if (appState.currentView === 'play-whoami' || appState.currentView === 'input-whoami') {
            setTimeout(() => { setView('setup-whoami'); toastRoundLost(); }, 50);
        }
        // Fully restorable: the whole game is in appState, it just needs drawing.
        else if (appState.currentView === 'play-wordle' && typeof renderWordleBoard === 'function') {
            renderWordleBoard();
            renderKeyboard();
        }
        else if (appState.currentView === 'play-guessnum' && typeof renderGuessNumHistory === 'function') {
            renderGuessNumHistory();
        }
        // Room screens are drawn by the server's next projection. If the saved
        // session cannot be resumed there is nothing to draw, so don't strand
        // the player on a blank view - initRooms() decides which it is.
        else if (appState.currentView.indexOf('room-') === 0) {
            const restored = appState.currentView;
            setTimeout(() => {
                // Only if nothing has moved on meanwhile. A join link opens
                // room-join during this wait, and bouncing then threw the join
                // screen away; room-join itself needs no session to stay on.
                if (restored === 'room-join' || appState.currentView !== restored) return;
                if (typeof Room === 'undefined' || !Room.isIn) setView('menu');
            }, 1500);
        }
        else if (appState.currentView === 'play-connections') {
            // The puzzle is kept on the phone as it is drawn (JS_Connections.html):
            // the same board comes back; a finished one opens the setup.
            setTimeout(() => (typeof restoreConnections === 'function' ? restoreConnections() : setupConnections()), 50);
        }
        // «اعمل مسابقتك»: the quiz being written comes back, the question that was open open again.
        else if (appState.currentView === 'play-quizmaker' && typeof qmRestore === 'function') qmRestore();
        // The team board is all in appState: draw it as it was left.
        else if (appState.currentView === 'play-trivia' && typeof renderTriviaBoard === 'function') {
            renderTriviaBoard();
            // A card that was open comes back with the time it had left. Not
            // straight away: initializeApp closes every overlay once this has
            // run, and a ?room= link may have moved the screen on meanwhile.
            if (appState.triviaBoard && appState.triviaBoard.open && typeof showTriviaCell === 'function') {
                setTimeout(() => { if (appState.currentView === 'play-trivia') showTriviaCell(); }, 0);
            }
        }
        // Timer-driven: the time left was never persisted, so resuming would be
        // a lie. Send them back to setup and say so rather than showing a dead
        // card and a frozen clock.
        // A turn's list of cards (ideas batch: party1) is kept, and comes back.
        else if (appState.currentView === 'play-charades') {
            if (!(typeof restoreCharadesSummary === 'function' && restoreCharadesSummary()))
                setTimeout(() => { setView('setup-charades'); toastRoundLost(); }, 50);
        }
        else if (appState.currentView === 'play-describe') {
            if (!(typeof restoreDescribeSummary === 'function' && restoreDescribeSummary()))
                setTimeout(() => { setView('setup-describe'); toastRoundLost(); }, 50);
        }
        // كلمة واحدة has no clock: the game (players, guesser, round, score) is in
        // appState.justone. A round being judged or the final score comes back as it
        // was; the clues typed mid-round aren't saved, so that round is dealt again
        // with a fresh word for the same guesser.
        else if (appState.currentView === 'play-justone') {
            const jo = appState.justone || {};
            if ((jo.players || []).length >= 3 && jo.round && typeof nextJoRound === 'function') {
                setTimeout(() => {
                    if (appState.currentView !== 'play-justone') return;
                    if (['result', 'judged', 'final'].indexOf(jo.phase) !== -1) {
                        ['pass', 'write', 'guess', 'check'].forEach(p => document.getElementById('jo-phase-' + p).classList.add('hidden'));
                        document.getElementById('jo-phase-result').classList.remove('hidden');
                        joPaintResult();
                    } else nextJoRound();
                }, 0);
            } else setTimeout(() => { setView('setup-justone'); toastRoundLost(); }, 50);
        }
        // The pass-the-phone deals live in module variables, not appState, so a
        // reload has no deal to show - and the reveal screens hold the secrets.
        else if (/^(reveal|play)-(chameleon|spyfall)$/.test(appState.currentView) || appState.currentView === 'play-timesup') {
            const game = appState.currentView.split('-')[1];
            // الحرباء and الموقع السري keep their deal on the phone now
            // (restoreChameleon / restoreSpyfall), so a reload comes back to it.
            // ثلاث جولات keeps its game in appState.timesup and comes back to
            // the current turn's ready card (restoreTimesUp, 26 Sep 2026).
            const restore = game === 'chameleon' ? window.restoreChameleon : game === 'spyfall' ? window.restoreSpyfall
              : game === 'timesup' ? window.restoreTimesUp : null;
            if (typeof restore === 'function' && restore(appState.currentView)) { /* back where it was */ }
            else setTimeout(() => { setView('setup-' + game); toastRoundLost(); }, 50);
        }
        // Each of these keeps its whole game in appState, with any deadline
        // as a timestamp, so its restore function redraws it as it was; it
        // says no when there was nothing to come back to.
        else if (appState.currentView === 'play-emoji') {
            if (typeof restoreEmoji !== 'function' || !restoreEmoji()) setTimeout(() => setView('setup-emoji'), 50);
        }
        else if (appState.currentView === 'play-proverbs') {
            if (typeof restoreProverbs !== 'function' || !restoreProverbs()) setTimeout(() => setView('setup-proverbs'), 50);
        }
        else if (appState.currentView === 'play-fiveseconds') {
            if (typeof restoreFiveSeconds !== 'function' || !restoreFiveSeconds()) setTimeout(() => setView('setup-fiveseconds'), 50);
        }
        else if (appState.currentView === 'play-bomb') {
            if (typeof restoreBomb !== 'function' || !restoreBomb()) setTimeout(() => setView('setup-bomb'), 50);
        }
        else if (appState.currentView === 'play-stop') {
            if (typeof restoreStop !== 'function' || !restoreStop()) setTimeout(() => setView('setup-stop'), 50);
        }
        else if (appState.currentView === 'play-memory') {
            if (typeof restoreMemory !== 'function' || !restoreMemory()) setTimeout(() => setView('setup-memory'), 50);
        }
        else if (appState.currentView === 'play-xo') {
            if (typeof restoreXO !== 'function' || !restoreXO()) setTimeout(() => setView('setup-xo'), 50);
        }
        // No game to keep: the chooser just needs its stage wired up again.
        // The solo games register their own boards (JS_Solo.html).
        else if (typeof soloRestoreView === 'function' && soloRestoreView(appState.currentView)) { /* redrawn */ }
        else if (appState.currentView === 'play-chooser') {
            setTimeout(() => { if (typeof openChooser === 'function') openChooser(); }, 0);
        }
        else if (appState.currentView === 'setup-daily-archive' && typeof renderDailyArchive === 'function') {
            renderDailyArchive();
        }
        else if (appState.currentView === 'setup-stats' && typeof renderStats === 'function') {
            renderStats();
        }
        // 👆 END PROTECTIONS 👆
        else if (appState.currentView.startsWith('setup-')) {
            const listId = appState.currentView.replace('setup-', '') + '-player-list';
            if(typeof renderActiveChips === 'function') renderActiveChips(listId, true);
            paintSetupOptions(appState.currentView);
            if(appState.currentView === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
            if(appState.currentView === 'setup-chameleon' && typeof renderChameleonCategories === 'function') renderChameleonCategories();
            
            if(appState.currentView === 'setup-charades' && typeof renderCharadesDropdown === 'function') {
                renderCharadesDropdown(); 
            }
        }
        
        // A branch that found nothing to restore may have moved on (setView to
        // its setup, or reveal to play): that screen is showing already, and
        // un-hiding the saved one here put the two on top of each other.
        if (appState.currentView !== restoring) return;
        const meta = VIEW_META[appState.currentView];
        if (meta && meta.accent) viewEl.setAttribute('data-accent', meta.accent);
        viewEl.classList.remove('hidden');
        syncChrome(appState.currentView);
    } else {
        const menuEl = document.getElementById('view-menu');
        if (menuEl) {
            menuEl.classList.remove('hidden');
            appState.currentView = 'menu';
            syncChrome('menu');
        }
    }
  }

  // Depth is what makes the slide directional: deeper = forward, shallower = back.
  function viewDepth(viewId) {
    let depth = 0;
    let cursor = viewId;
    while (cursor && VIEW_META[cursor] && VIEW_META[cursor].up && depth < 8) {
      cursor = VIEW_META[cursor].up;
      depth++;
    }
    return depth;
  }

  let titleSwapTimer = null;
  let pendingTitle = '';

  /* A tap on the header's title glides the screen back to its top (the owner's
     pick 1213, 7 Oct 2026), the way an iPhone's status bar does for an ordinary
     page - which can't work here, because the page itself never scrolls, only
     .shell__main does. scrollToAction does the gliding (instant with motion off). */
  function titleTapToTop() {
    const main = document.getElementById('shell-main');
    if (!main || main.scrollTop <= 0) return;
    const active = document.activeElement;
    if (active && main.contains(active) && typeof active.blur === 'function') active.blur();
    scrollToAction();
  }
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('app-title');
    if (el) el.addEventListener('click', titleTapToTop);
  });

  /** Header title, back button and nav state for the view now on screen. */
  function syncChrome(viewId) {
    const meta = VIEW_META[viewId] || {};
    const t = TRANSLATIONS[appState.lang];
    const titleEl = document.getElementById('app-title');
    const backEl = document.getElementById('nav-back');
    const homeEl = document.getElementById('nav-home');

    if (titleEl) {
      const text = (meta.title && t[meta.title]) || t.title;
      const textEl = document.getElementById('app-title-text') || titleEl;
      // The brand mark sits beside the name on the home screen only.
      titleEl.classList.toggle('shell__title--brand', viewId === 'menu');
      // textContent, not innerText: innerText forces a layout mid-setView.
      if (textEl.textContent !== text) {
        // Cross-fade rather than snapping the text. One timer, so navigating
        // twice in quick succession can't land the writes out of order.
        pendingTitle = text;
        titleEl.classList.add('is-swapping');
        clearTimeout(titleSwapTimer);
        titleSwapTimer = setTimeout(() => {
          textEl.textContent = pendingTitle;
          titleEl.classList.remove('is-swapping');
        }, 110);
      }
    }
    if (backEl) backEl.classList.toggle('is-hidden', !meta.up);
    syncNavTabs(viewId);
    // The screen's own icon beside its name; the home shows the mark instead.
    const iconEl = document.getElementById('app-title-icon');
    const icon = viewId === 'menu' ? '' : screenIcon(viewId);
    if (iconEl && iconEl._icon !== icon) { iconEl._icon = icon; iconEl.innerHTML = iconHtml(icon); }
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
  }

  /** Lights the bar's tab for a screen. Run again when a room starts or ends (syncNavRoom),
      since a room's screens light «غرفتك» only once this phone is in one. */
  function syncNavTabs(viewId) {
    const tab = navTabFor(viewId);
    ['home', 'together', 'room', 'tools'].forEach(name => {
      const el = document.getElementById('nav-' + name);
      if (!el) return;
      if (el.classList.contains('is-active') !== (name === tab)) el.classList.toggle('is-active', name === tab);
      if (name === tab) { if (el.getAttribute('aria-current') !== 'page') el.setAttribute('aria-current', 'page'); }
      else if (el.hasAttribute('aria-current')) el.removeAttribute('aria-current');
    });
  }

  /** Which bottom tab a screen sits under: the rooms, the tools, or the games. */
  function navTabFor(viewId) {
    const id = String(viewId || '');
    // In a room, its own screens light «غرفتك» (the raised button) rather than مع بعض (the owner, 7 Oct 2026).
    if (id.indexOf('room-') === 0 && id !== 'room-join' && typeof Room !== 'undefined' && Room.session) return 'room';
    if (id === 'together' || id === 'crew' || id.indexOf('room-') === 0 || id === 'setup-codenames') return 'together';
    if (id === 'tools') return 'tools';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[id] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry && entry.group === 'tools' ? 'tools' : 'home';
  }

  /** The emoji for a screen, from its help entry - every screen has one. */
  function screenIcon(viewId) {
    if (viewId === 'together') return '📲';
    if (viewId === 'tools') return '🛠️';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[viewId] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry ? entry.icon : '';
  }
