const connections = { puzzle: null, solved: [], selected: [], mistakes: 0, lang: 'ar' };
const CONNECT_MAX_MISTAKES = 4;

function setupConnections() { setView('setup-connections'); }

function startConnections() {
  const lang = appState.lang === 'en' ? 'en' : 'ar';
  const pool = CONNECTIONS_DB[lang];
  const puzzle = pool[Math.floor(Math.random() * pool.length)];

  connections.lang = lang;
  connections.puzzle = puzzle;
  connections.solved = [];
  connections.selected = [];
  connections.mistakes = 0;

  // Group index travels with each word so a guess can be checked without
  // searching the puzzle every time.
  connections.tiles = shuffleArray(
    puzzle.groups.flatMap((g, gi) => g.words.map(w => ({ word: w, group: gi })))
  );

  setView('play-connections');
  renderConnections();
}

function shuffleArray(arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function toggleConnectTile(word) {
  if (connections.selected.includes(word)) {
    connections.selected = connections.selected.filter(w => w !== word);
  } else {
    if (connections.selected.length >= 4) return;
    connections.selected.push(word);
  }
  renderConnections();
}

function submitConnectGuess() {
  if (connections.selected.length !== 4) return;
  const tiles = connections.tiles.filter(t => connections.selected.includes(t.word));
  const groups = [...new Set(tiles.map(t => t.group))];

  if (groups.length === 1) {
    connections.solved.push(groups[0]);
    connections.selected = [];
    playSound('success');
    haptic('medium');
    renderConnections();
    if (connections.solved.length === 4) finishConnections(true);
    return;
  }

  // "One away" is the feedback that makes the game feel fair.
  const counts = {};
  tiles.forEach(t => { counts[t.group] = (counts[t.group] || 0) + 1; });
  const best = Math.max(...Object.values(counts));

  connections.mistakes++;
  // Clear the selection so the same wrong guess can't be resubmitted by a
  // stray second tap, burning another life for nothing.
  connections.selected = [];
  playSound('alarm');
  haptic('heavy');
  const t = TRANSLATIONS[appState.lang];
  showToast(best === 3 ? (t.conn_one_away || 'قريب! ثلاثة من نفس المجموعة') : (t.conn_wrong || 'مش صح'),
            best === 3 ? 'info' : 'error');

  const grid = document.getElementById('connect-grid');
  if (grid) { grid.classList.add('animate-shake'); setTimeout(() => grid.classList.remove('animate-shake'), 500); }

  renderConnections();
  if (connections.mistakes >= CONNECT_MAX_MISTAKES) finishConnections(false);
}

function finishConnections(won) {
  // Losing still reveals the answer — otherwise the puzzle just nags at you.
  connections.solved = [0, 1, 2, 3];
  connections.selected = [];
  renderConnections(true);
  if (won) confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
  else playSound('alarm');
}

function renderConnections(finished) {
  const el = document.getElementById('connect-grid');
  const meta = document.getElementById('connect-meta');
  if (!el || !connections.puzzle) return;
  const t = TRANSLATIONS[appState.lang];

  const solvedHtml = connections.solved.map(gi => {
    const g = connections.puzzle.groups[gi];
    return `<div class="connect-group connect-group--${gi}">
        <div class="connect-group__name">${escapeHTML(g.name)}</div>
        <div class="connect-group__words">${g.words.map(escapeHTML).join(' · ')}</div>
      </div>`;
  }).join('');

  const remaining = connections.tiles.filter(x => !connections.solved.includes(x.group));
  const tilesHtml = remaining.map(x => `
      <button class="connect-tile ${connections.selected.includes(x.word) ? 'is-selected' : ''}"
              onclick="toggleConnectTile('${jsStringAttr(x.word)}')">${escapeHTML(x.word)}</button>`).join('');

  el.innerHTML = solvedHtml + (remaining.length ? `<div class="connect-grid">${tilesHtml}</div>` : '');

  if (meta) {
    const left = CONNECT_MAX_MISTAKES - connections.mistakes;
    meta.innerHTML = finished || connections.solved.length === 4
      ? `<button onclick="startConnections()" class="btn btn--primary btn--lg">${t.play_again || 'لعبة جديدة'}</button>`
      : `<div class="connect-lives">${t.conn_mistakes || 'محاولات متبقية'}:
           ${'●'.repeat(Math.max(0, left))}${'○'.repeat(connections.mistakes)}</div>
         <button onclick="submitConnectGuess()" class="btn btn--primary"
                 ${connections.selected.length === 4 ? '' : 'disabled'}>${t.conn_submit || 'تأكيد'}</button>
         <button onclick="shuffleConnections()" class="btn btn--ghost btn--sm">${t.conn_shuffle || 'خلط'}</button>`;
  }
}

function shuffleConnections() {
  connections.tiles = shuffleArray(connections.tiles);
  renderConnections();
}
