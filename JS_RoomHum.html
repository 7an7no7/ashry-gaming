<script>
/* ============================================================================
   دندنها — HUM IT on the phones and the TV (1 Oct 2026)
   ----------------------------------------------------------------------------
   The rules are RoomHum.js, the songs Songs.js (server-only). Look ج «الفرح:
   المسرح والجمهور» (the owner, from the design sheet): the phone is a wedding
   hall - the others in the crowd at the top raising ✓ signs as they answer,
   fifteen bulbs over the stage going out as the clock, the stage between its
   red curtains, the fastest three taking the front-row seats, and a sign in
   your hand to write the song's name on (four signs to pick from once the bulbs
   are out). The hummer gets the big mic as ▶ and the DJ's sealed envelope with
   the song (press and hold to read it). The TV is one stage with curtains and
   the crowd along the bottom; the answer is a banner unrolling, then a 1-2-3
   podium of the round's fastest.

   The sound is Apple's 30-second preview, fetched by the rooms server for this
   song's opaque token (/song/CODE/TOKEN) into a blob the phone plays from: one
   request a song, every phone the same bytes. One <audio> element for the whole
   page (an iPhone lets an element play by itself only after a tap has played it:
   the hummer's mic, «سمّع»'s ▶ round), which also plays on a phone's silent switch
   (a web page's own sounds don't). «سمّع» plays on the server's clock: every
   phone starts the clip at playAt (its own time = the server's + the gap), a
   phone that joins late starts mid-clip, and «بتطول» plays 2 s, 5 s and 10 s.
   The TV plays no song (the phones are the speakers); it is the room's one voice
   for the little sounds (the signs, the last bulbs, the banner), else the host's
   phone. Every name here starts with dnd / DND_ (section 60 of Style.html).
   ========================================================================= */
const DND_BULBS = 15;
const DND_CLIP_MS = 30000;
const DND_ONCE_MS = 10000;                 // keep in step with HUM_ONCE_MS (RoomHum.js)
// «بتطول»: keep in step with HUM_GROW (RoomHum.js): when each clip starts after playAt, how long, its bonus.
const DND_GROW = [{ at: 0, len: 2000, bonus: 2 }, { at: 4000, len: 5000, bonus: 1 }, { at: 11000, len: 10000, bonus: 0 }];
const DND_COLS = ['#e5387b', '#2f6fd6', '#1f9d55', '#f59e0b', '#7c3aed', '#e5383b', '#0891b2', '#db2777', '#65a30d', '#b45309', '#9333ea', '#0f766e'];
const DND_OPTS_KEY = 'ashryHumRoom';

const dnd = {
  audio: null,          // the page's one <audio>
  unlocked: false,      // a tap has played it (iPhone)
  unlocking: null,      // that first play, still settling
  blob: null,           // { token, url } the clip loaded
  loading: null,        // { token, promise }
  failed: '',           // the token whose clip would not load
  reported: '',         // the deal a failure was told to the room for
  cur: null,            // what is playing: 'manual' or a window's key
  manualUntil: 0,       // performance.now() a manual play ends at
  timer: null,          // the painter's interval
  seen: new Set(),      // play-once keys for sounds and stamps
  missSeen: '',         // the last near miss shown (deal|n)
  sent: '',             // what this phone just raised (deal|text), to keep the button calm
  tick: -1
};

/* --- small helpers ------------------------------------------------------------ */
function dndT(key, vars) {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || key;
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
const dndIso = (s) => '⁨' + s + '⁩';
const dndPlus = (n) => '<bdi dir="ltr">+' + Number(n || 0) + '</bdi>';
/** Points in plain text, held left to right inside an Arabic line («+3», never «3+»). */
const dndPts = (n) => '\u2066+' + Number(n || 0) + '\u2069';
const dndOnce = (key) => { if (!key || dnd.seen.has(key)) return false; if (dnd.seen.size > 400) dnd.seen.clear(); dnd.seen.add(key); return true; };
const dndNameOf = (state, id) => ((state.players || []).find(p => p.id === id) || {}).name || '';
const dndColorOf = (s, id) => DND_COLS[Math.max(0, (s.roster || []).indexOf(id)) % DND_COLS.length];
/** A song's Latin title under its Arabic one, for a table playing in English. */
const dndLatin = (c) => (appState.lang === 'en' && c && c.en ? `<em class="dnd-latin">${escapeHTML(c.en)}</em>` : '');
/** «الأغنية 3 من 10» / «Song 3 of 10», the design sheet's words: a round counter with no slash cannot read backwards in an Arabic line (GEMINI.md, the trap about «1 / 3»). */
const dndSongOf = (s) => dndT('dnd_song_of', { n: Math.max(1, s.round || 1), m: s.rounds || 1 });
const dndSongKey = (state) => roomDealKey(state) + '|' + ((state.shared || {}).deal || 0);
const dndRightOf = (s, id) => (s.right || []).find(r => r.id === id) || null;

/** Who this device is this song: the hummer, a guesser, watching, or a screen. */
function dndRole(state) {
  const s = state.shared || {};
  if (state.youAreScreen) return 'screen';
  if ((s.roster || []).indexOf(Room.me) === -1) return 'watch';
  if (s.mode === 'hum' && s.hummerId === Room.me) return 'hummer';
  return 'guess';
}

/** The TV is the room's one voice; with no screen, the host's phone (the chairs' rule). */
function dndVoice(state) {
  const screens = (state.screens || []).filter(x => x.online).map(x => x.id).sort();
  if (state.youAreScreen) return screens[0] === Room.me;
  return !!state.youAreHost && !screens.length;
}

/** The host's choices, kept on the host's phone. */
function dndOpts() {
  const o = Object.assign({ mode: 'hum', replay: 'full', count: 10 }, recallOptions(DND_OPTS_KEY, {}));
  if (['hum', 'listen'].indexOf(o.mode) === -1) o.mode = 'hum';
  if (['once10', 'full', 'grow'].indexOf(o.replay) === -1) o.replay = 'full';
  if ([5, 10, 15].indexOf(Number(o.count)) === -1) o.count = 10;
  return o;
}
function dndSetOpt(key, value) {
  rememberOptions(DND_OPTS_KEY, { [key]: key === 'count' ? Number(value) : value });
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

/* --- the sound ------------------------------------------------------------------ */
function dndAudio() {
  if (!dnd.audio) {
    const a = new Audio();
    a.preload = 'auto';
    a.setAttribute('playsinline', '');
    a.addEventListener('playing', () => dndPlayingClass(true));
    a.addEventListener('pause', () => dndPlayingClass(false));
    a.addEventListener('ended', () => { dnd.cur = null; dndPlayingClass(false); });
    a.addEventListener('error', () => { if (dnd.blob && a.src === dnd.blob.url) dndClipFailed(dnd.blob.token); });
    dnd.audio = a;
  }
  return dnd.audio;
}

function dndPlayingClass(on) {
  document.querySelectorAll('.dnd').forEach(el => el.classList.toggle('is-playing', !!on));
}

/** A second of silence, made once: what the first tap plays to let this page play sound later. */
let dndSilentUrl = '';
function dndSilent() {
  if (dndSilentUrl) return dndSilentUrl;
  const n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
  v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  dndSilentUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  return dndSilentUrl;
}

/** Inside a tap: the element plays once (silence if no clip yet), which is what lets it play by itself later. */
function dndUnlock() {
  const a = dndAudio();
  if (dnd.unlocked) return;
  dnd.unlocked = true;
  if (dnd.blob && a.src === dnd.blob.url) return;   // the clip itself is about to play in this tap
  try {
    a.src = dndSilent();
    const p = a.play();
    dnd.unlocking = (p && p.then ? p : Promise.resolve()).then(() => { a.pause(); }).catch(() => { dnd.unlocked = false; }).then(() => {
      dnd.unlocking = null;
      if (dnd.blob) { a.src = dnd.blob.url; try { a.load(); } catch (e) {} }
    });
  } catch (e) { dnd.unlocked = false; }
}

/** The clip for a token, fetched once into a blob. */
function dndLoad(token) {
  if (!token) return Promise.reject(new Error('no token'));
  if (dnd.blob && dnd.blob.token === token) return Promise.resolve(dnd.blob.url);
  if (dnd.loading && dnd.loading.token === token) return dnd.loading.promise;
  const base = String(window.ROOMS_URL || '').replace(/\/+$/, '');
  const code = (Room.state && Room.state.code) || '';
  const promise = fetch(base + '/song/' + encodeURIComponent(code) + '/' + encodeURIComponent(token))
    .then(res => { if (!res.ok) throw new Error('song ' + res.status); return res.blob(); })
    .then(blob => {
      if (!blob || blob.size < 1000) throw new Error('empty song');
      const url = URL.createObjectURL(blob);
      if (dnd.blob) { try { URL.revokeObjectURL(dnd.blob.url); } catch (e) {} }
      dnd.blob = { token, url };
      dnd.loading = null;
      const a = dndAudio();
      if (!dnd.unlocking && dnd.cur === null) { a.src = url; try { a.load(); } catch (e) {} }
      dndPaintNow();
      return url;
    })
    .catch(err => { if (dnd.loading && dnd.loading.token === token) dnd.loading = null; dndClipFailed(token); throw err; });
  dnd.loading = { token, promise };
  return promise;
}

/** A clip that won't load or play: the room deals another song by itself («دندنة»: the hummer's phone says so;
 *  «سمّع» once it plays: only when a second phone says so too - this phone hears it from the others meanwhile). */
function dndClipFailed(token) {
  dnd.failed = token;
  const st = Room.state;
  const s = st && st.shared;
  if (!st || st.game !== 'hum' || !s) return;
  const mine = (st.you && st.you.token) || s.token;
  if (mine !== token || ['listen', 'count', 'type'].indexOf(s.phase) === -1 || (s.right || []).length) { dndPaintNow(); return; }
  if (s.mode === 'hum' ? dndRole(st) !== 'hummer' : dndRole(st) !== 'guess') return;
  const key = dndSongKey(st);
  if (dnd.reported === key) return;
  dnd.reported = key;
  showToast(dndT(s.mode === 'listen' && s.phase !== 'count' ? 'dnd_broken_mine' : 'dnd_broken'), 'info');
  roomAct('broken', { deal: s.deal });
}

function dndStopSound() {
  dnd.cur = null;
  dnd.manualUntil = 0;
  if (dnd.audio) { try { dnd.audio.pause(); } catch (e) {} }
}

/** The token this phone may play now: the hummer's own, everyone's in «سمّع», everyone's once the song is out. */
function dndTokenOf(state) {
  const s = state.shared || {};
  if (state.youAreScreen) return '';
  if (s.mode === 'hum' && s.phase !== 'reveal') return (state.you && state.you.token) || '';
  return s.token || '';
}

/** A tap on ▶ (the mic, «اسمعها تاني», the reveal's ▶): plays the whole clip from the start, or stops it. */
function dndPlayTap() {
  const st = Room.state;
  if (!st || st.game !== 'hum') return;
  const s = st.shared || {};
  const token = dndTokenOf(st);
  if (!token) return;
  haptic('light');
  if (dnd.cur === 'manual' && dnd.audio && !dnd.audio.paused) { dndStopSound(); return; }
  dndUnlock();
  if (s.mode === 'listen' && s.replay !== 'full' && s.phase !== 'reveal') { dndPaintNow(); return; }   // only the clock plays these
  const a = dndAudio();
  const go = () => {
    if (dnd.unlocking) { dnd.unlocking.then(go); return; }
    if (!dnd.blob || dnd.blob.token !== token) return;
    if (a.src !== dnd.blob.url) a.src = dnd.blob.url;
    try { a.currentTime = 0; } catch (e) {}
    dnd.cur = 'manual';
    dnd.manualUntil = performance.now() + DND_CLIP_MS + 500;
    const p = a.play();
    if (p && p.catch) p.catch(() => { dnd.cur = null; });
  };
  if (dnd.blob && dnd.blob.token === token) go();
  else dndLoad(token).then(go).catch(() => {});
}

/** «سمّع»: the windows (server time) when the clip plays by itself, each from its start. */
function dndWindows(s) {
  if (s.mode !== 'listen' || typeof s.playAt !== 'number') return [];
  if (s.replay === 'once10') return [[s.playAt, s.playAt + DND_ONCE_MS]];
  if (s.replay === 'grow') return DND_GROW.map(g => [s.playAt + g.at, s.playAt + g.at + g.len]);
  return [[s.playAt, s.playAt + DND_CLIP_MS]];
}

/** Called on every paint tick: «سمّع»'s clip starts and stops with the server's clock. */
function dndClockSound(state) {
  const s = state.shared || {};
  if (state.youAreScreen || s.mode !== 'listen' || ['count', 'type', 'choices'].indexOf(s.phase) === -1) {
    if (dnd.cur && dnd.cur !== 'manual') dndStopSound();
    return;
  }
  if (dnd.cur === 'manual') {
    if (performance.now() < dnd.manualUntil && dnd.audio && !dnd.audio.paused) return;
    dnd.cur = null;
  }
  const now = roomServerNow();
  const wins = dndWindows(s);
  let want = null;
  wins.forEach((w, i) => { if (now >= w[0] && now < w[1] - 250) want = { key: s.deal + '|' + i, off: (now - w[0]) / 1000 }; });
  const a = dndAudio();
  if (!want) { if (dnd.cur) { dnd.cur = null; try { a.pause(); } catch (e) {} } return; }
  if (dnd.cur === want.key) return;
  if (!dnd.unlocked || dnd.unlocking || !dnd.blob || dnd.blob.token !== s.token) return;
  if (a.src !== dnd.blob.url) a.src = dnd.blob.url;
  try { a.currentTime = want.off; } catch (e) {}
  dnd.cur = want.key;
  const p = a.play();
  if (p && p.catch) p.catch(() => { dnd.cur = null; dnd.unlocked = false; dndPaintNow(); });
}

/** A late phone (a reload, «سمّع»'s ▶ never tapped): this tap lets the clock's clip play. */
function dndTapSound() {
  dndUnlock();
  haptic('light');
  dndPaintNow();
}

/* --- the room's little sounds ---------------------------------------------------- */
function dndSound(kind, i) {
  try {
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'sign') {
      const hz = 700 + Math.min(6, i || 0) * 80;
      fxTone('triangle', [[0, hz], [0.06, hz * 1.5]], [[0, 0.18], [0.16, 0.001]], at);
    } else if (kind === 'tick') {
      fxTone('square', [[0, 1100]], [[0, 0.06], [0.05, 0.001]], at);
    } else if (kind === 'bulbs') {
      fxTone('sawtooth', [[0, 300], [0.3, 140]], [[0, 0.12], [0.34, 0.001]], at);
    } else if (kind === 'reveal') {
      [523, 659, 784].forEach((hz, k) => fxTone('triangle', [[0, hz]], [[0, 0.14], [0.5, 0.001]], at + k * 0.09));
    } else if (kind === 'win') {
      playFx('tada');
    }
  } catch (e) {}
}

/* --- the scene's pieces ----------------------------------------------------------- */

/** A face in the crowd (the sheet's): a shirt in the player's colour, two kinds of hair. */
function dndFaceSvg(col, k) {
  return '<svg viewBox="0 0 80 84" aria-hidden="true" focusable="false"><path d="M8 84 Q8 54 40 54 Q72 54 72 84Z" fill="' + col + '" stroke="#221f36" stroke-width="4"/>' +
    '<circle cx="40" cy="32" r="22" fill="#f2c4a0" stroke="#221f36" stroke-width="4"/>' +
    (k % 2 ? '<path d="M18 30 Q18 8 40 8 Q62 8 62 30 L62 50 Q40 44 18 50Z" fill="#6b4ea0" stroke="#221f36" stroke-width="3"/><circle cx="40" cy="34" r="16" fill="#f2c4a0"/>'
      : '<path d="M18 26 Q24 8 40 10 Q58 8 62 26 Q50 18 40 18 Q28 18 18 26Z" fill="#3b2a20"/>') +
    '<circle cx="33" cy="32" r="3" fill="#221f36"/><circle cx="47" cy="32" r="3" fill="#221f36"/><path d="M32 40 Q40 47 48 40" stroke="#221f36" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
}

/** The singer on the stage (the sheet's), with the mic. */
const DND_SINGER = '<svg viewBox="0 0 120 150" aria-hidden="true" focusable="false"><path d="M20 150 Q20 98 60 98 Q100 98 100 150Z" fill="#2f6fd6" stroke="#221f36" stroke-width="4"/>' +
  '<circle cx="60" cy="60" r="32" fill="#f2c4a0" stroke="#221f36" stroke-width="4"/><path d="M28 54 Q30 24 60 24 Q90 24 92 54 Q78 38 60 40 Q42 38 28 54Z" fill="#3b2a20" stroke="#221f36" stroke-width="3"/>' +
  '<circle cx="48" cy="60" r="4" fill="#221f36"/><circle cx="72" cy="60" r="4" fill="#221f36"/><ellipse class="dnd-singer__mouth" cx="60" cy="78" rx="6" ry="7" fill="#7a1b1d" stroke="#221f36" stroke-width="3"/>' +
  '<rect x="84" y="86" width="9" height="34" rx="4" transform="rotate(25 88 103)" fill="#3a3450" stroke="#221f36" stroke-width="3"/><circle cx="82" cy="84" r="10" fill="#cfcbe0" stroke="#221f36" stroke-width="3"/></svg>';

/** The big mic: the hummer's ▶. */
const DND_MIC = '<svg viewBox="0 0 100 140" aria-hidden="true" focusable="false"><rect x="47" y="72" width="6" height="56" fill="#cfcbe0" stroke="#221f36" stroke-width="3"/>' +
  '<ellipse cx="50" cy="132" rx="28" ry="6" fill="#3a3450" stroke="#221f36" stroke-width="3"/><rect x="36" y="56" width="28" height="22" rx="6" fill="#3a3450" stroke="#221f36" stroke-width="4"/>' +
  '<circle cx="50" cy="34" r="27" fill="#cfcbe0" stroke="#221f36" stroke-width="4"/><path d="M29 26 H71 M26 36 H74 M29 46 H71 M41 9 V59 M59 9 V59" stroke="#8d8aa0" stroke-width="2.5"/>' +
  '<circle cx="50" cy="34" r="12" fill="#e5387b" stroke="#221f36" stroke-width="3"/><path class="dnd-mic__play" d="M46 28 L56 34 L46 40Z" fill="#fff"/></svg>';

/** The earphones, beside the line about the earpiece. */
const DND_EAR = '<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M8 30 V24 Q8 8 24 8 Q40 8 40 24 V30" fill="none" stroke="#221f36" stroke-width="4"/>' +
  '<rect x="4" y="26" width="11" height="16" rx="4" fill="#e5387b" stroke="#221f36" stroke-width="3"/><rect x="33" y="26" width="11" height="16" rx="4" fill="#e5387b" stroke="#221f36" stroke-width="3"/></svg>';

const DND_WAVE = '<div class="dnd-wave" aria-hidden="true">' + '<i></i>'.repeat(12) + '</div>';
const DND_NOTES = '<span class="dnd-note" aria-hidden="true">♪</span><span class="dnd-note" aria-hidden="true">♫</span><span class="dnd-note" aria-hidden="true">♪</span>';

/** The crowd: everyone playing but this phone (and the hummer, who is on the stage), each with a sign. */
function dndCrowdHtml(state, o) {
  const s = state.shared || {};
  const ids = (s.roster || []).filter(id => id !== Room.me && !(s.mode === 'hum' && id === s.hummerId) &&
    (state.players || []).some(p => p.id === id));
  if (!ids.length) return '';
  return `<div class="dnd-crowd ${(o && o.tv) ? 'dnd-crowd--tv' : ''}" data-dnd-crowd style="--n:${ids.length}">${ids.map(id => {
    const k = Math.max(0, (s.roster || []).indexOf(id));
    return `<div class="dnd-head" data-dnd-head="${escapeHTML(id)}"><span class="dnd-sign" data-dnd-sign></span>${dndFaceSvg(dndColorOf(s, id), k)}<b><bdi>${escapeHTML(dndNameOf(state, id))}</bdi></b></div>`;
  }).join('')}</div>`;
}

/** The fifteen bulbs over the stage: painted in place by the clock. */
function dndBulbsHtml(tv) {
  return `<div class="dnd-bulbs ${tv ? 'dnd-bulbs--tv' : ''}" data-dnd-bulbs aria-hidden="true">${'<i></i>'.repeat(DND_BULBS)}</div>`;
}

/** The front row: the fastest three typed answers, filled in place. */
function dndFrontHtml() {
  return `<div class="dnd-front" data-dnd-front>
      <span class="dnd-front__l">${escapeHTML(dndT('dnd_front'))} (${dndPlus(3)} · ${dndPlus(2)} · ${dndPlus(1)})</span>
      ${[1, 2, 3].map(n => `<div class="dnd-slot" data-dnd-slot="${n}"><span class="metric">${n}</span></div>`).join('')}
    </div>`;
}

/** The song, as a banner unrolling: the title, the singer. */
function dndBannerHtml(state, o) {
  const s = state.shared || {};
  if (!s.song) return '';
  const unroll = o && o.unroll;
  return `<div class="dnd-ban ${unroll ? 'dnd-ban--in' : ''} ${(o && o.tv) ? 'dnd-ban--tv' : ''}">
      <small>${escapeHTML(dndT(s.skipped ? 'dnd_status_skipped' : 'dnd_status_reveal'))}</small>
      <b>${escapeHTML(s.song.t)}</b>
      <span>${escapeHTML(s.song.s)}</span>
      ${appState.lang === 'en' && s.song.en ? `<em>${escapeHTML(s.song.en + ' · ' + (s.song.se || ''))}</em>` : ''}
    </div>`;
}

/** The DJ's envelope: the song on the hummer's phone, covered until held. */
function dndEnvelopeHtml(state) {
  const song = (state.you && state.you.song) || {};
  return `<div class="dnd-env" data-dnd-env role="button" tabindex="0" aria-label="${escapeHTML(dndT('dnd_env_hold'))}">
      <small>${escapeHTML(dndT('dnd_env_label'))}</small>
      <b>${escapeHTML(song.t || '')}</b>
      <span>${escapeHTML(song.s || '')}</span>
      <div class="dnd-env__cv" aria-hidden="true">${escapeHTML(dndT('dnd_env_cover'))}<small>${escapeHTML(dndT('dnd_env_hold'))}</small></div>
    </div>`;
}

/** A one-line result for this phone at the reveal. */
function dndMyNote(state) {
  const s = state.shared || {};
  const role = dndRole(state);
  const hummer = dndIso(dndNameOf(state, s.hummerId));
  const typed = (s.right || []).length;
  if (role === 'hummer') {
    return typed ? dndT('dnd_res_hummer_ok', { n: typed, p: dndPts((s.gained || {})[Room.me] || 0) }) : dndT('dnd_res_hummer_no');
  }
  if (role !== 'guess') return '';
  const r = dndRightOf(s, Room.me);
  let line;
  if (r) line = r.rank <= 3 ? dndT('dnd_rank_' + r.rank) : dndT('dnd_res_late');
  else if (s.picks && typeof s.picks[Room.me] === 'number') line = s.picks[Room.me] === s.correct ? dndT('dnd_res_pick_ok') : dndT('dnd_res_pick_no');
  else line = dndT('dnd_res_none');
  const got = (s.gained || {})[Room.me] || 0;
  if (got) line += ' · ' + dndPts(got);
  if (s.mode === 'hum' && s.hummerId) line += ' — ' + (typed ? dndT('dnd_res_h_got', { h: hummer }) : dndT('dnd_res_h_none', { h: hummer }));
  return line;
}

/* --- the frames ------------------------------------------------------------------- */
function dndSig(state) {
  const s = state.shared || {};
  const role = dndRole(state);
  const mine = dndRightOf(s, Room.me);
  const you = state.you || {};
  // The crowd's signs, the slots, the bulbs and the clock are painted in place (dndPaint): an answer
  // somewhere else never rebuilds the sign this phone is writing on.
  return ['dnd', s.phase, s.round, s.deal, s.hummerId, role, !!mine, typeof you.pick === 'number' ? you.pick : '',
    (s.choices || []).length, s.mode, s.replay, state.youAreHost, appState.lang,
    s.phase === 'arm' ? (s.armed || []).indexOf(Room.me) !== -1 : '',
    s.phase === 'reveal' || s.phase === 'gameover' ? JSON.stringify(s.board || []) : '',
    !!you.song, (s.roster || []).filter(id => (state.players || []).some(p => p.id === id)).join(',')].join('|');
}

function dndHostBtns(state) {
  const s = state.shared || {};
  const t = TRANSLATIONS[appState.lang] || {};
  if (s.phase === 'arm') return roomMoveOnHtml(state, roomHostRow([[dndT('dnd_go'), `roomAct('go', {})`, 'primary']]));
  if (['listen', 'count', 'type', 'choices'].indexOf(s.phase) !== -1) {
    return roomMoveOnHtml(state, roomHostRow([[dndT('dnd_skip'), `roomAct('skipSong', { deal: ${Number(s.deal) || 0} })`]]));
  }
  if (s.phase === 'reveal') {
    const last = (s.round || 0) >= (s.rounds || 0);
    return autoNextSlotHtml(state) + roomMoveOnHtml(state,
      `<div class="btn-stack dnd-next"><button type="button" class="btn btn--go btn--lg" onclick="roomAct('nextRound', { round: ${Number(s.round) || 0} })">${escapeHTML(dndT(last ? 'dnd_final' : 'dnd_next'))}</button></div>`,
      `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`);
  }
  if (s.phase === 'gameover' && state.youAreHost) {
    return `<div class="btn-row" style="margin-top:var(--sp-3)"><button class="btn btn--go" onclick="roomAct('playAgain', {})">▶ ${escapeHTML(t.play_again || '')}</button><button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button></div>`;
  }
  return '';
}

/** The stage: what the middle of the hall shows, by the phase and who this phone is. */
function dndStageHtml(state) {
  const s = state.shared || {};
  const role = dndRole(state);
  const hummer = dndIso(dndNameOf(state, s.hummerId));
  const clock = `<span class="dnd-stg__clk metric" data-dnd-clock></span>`;
  const singer = (who) => `<div class="dnd-singer">${DND_SINGER}${DND_NOTES}<span class="dnd-singer__t">${escapeHTML(dndT('dnd_on_stage', { h: who }))}</span></div>`;
  let body = '';
  if (s.phase === 'arm') {
    const armed = (s.armed || []).indexOf(Room.me) !== -1;
    body = `<div class="dnd-big">🎧</div><p class="dnd-status">${escapeHTML(dndT(armed ? 'dnd_armed' : 'dnd_arm_title'))}</p>`;
  } else if (s.phase === 'count') {
    body = `<div class="dnd-cnt metric" data-dnd-cnt>3</div><p class="dnd-status">${escapeHTML(dndT('dnd_count_line'))}</p>
      <button type="button" class="dnd-tap" data-dnd-tap onclick="dndTapSound()">${escapeHTML(dndT('dnd_tap_sound'))}</button>`;
  } else if (s.mode === 'listen' && (s.phase === 'type' || s.phase === 'choices')) {
    const again = s.replay === 'full' && role !== 'screen' ? `<button type="button" class="dnd-again" onclick="dndPlayTap()">${escapeHTML(dndT('dnd_again'))}</button>` : '';
    const grow = s.replay === 'grow' ? `<div class="dnd-grow" data-dnd-grow>${DND_GROW.map((g, k) => `<span data-k="${k}">${dndT('dnd_grow_n', { n: g.len / 1000 })}${g.bonus ? ' · ' + dndPlus(g.bonus) : ''}</span>`).join('')}</div>` : '';
    body = `<div class="dnd-speaker">🔊${DND_WAVE}</div>
      <p class="dnd-status" data-dnd-listen-status>${escapeHTML(dndT(s.phase === 'choices' ? (role === 'guess' && !dndRightOf(s, Room.me) && !(state.you && typeof state.you.pick === 'number') ? 'dnd_choices_h' : 'dnd_choices_wait') : 'dnd_listen_type'))}</p>
      ${grow}${again}
      <button type="button" class="dnd-tap" data-dnd-tap onclick="dndTapSound()">${escapeHTML(dndT('dnd_tap_sound'))}</button>`;
  } else if (role === 'hummer' && (s.phase === 'listen' || s.phase === 'type' || s.phase === 'choices')) {
    const listening = s.phase === 'listen';
    body = `${dndEnvelopeHtml(state)}
      <button type="button" class="dnd-mic" onclick="dndPlayTap()" aria-label="${escapeHTML(dndT(listening ? 'dnd_mic_hear' : 'dnd_mic_again'))}">${DND_MIC}</button>
      <span class="dnd-mic__l" data-dnd-mic-l>${escapeHTML(dndT(listening ? 'dnd_mic_hear' : 'dnd_mic_again'))}</span>
      ${DND_WAVE}
      <p class="dnd-status">${escapeHTML(dndT(listening ? 'dnd_h_listen' : 'dnd_hum_now'))}</p>`;
  } else if (s.mode === 'hum' && (s.phase === 'listen' || s.phase === 'type' || s.phase === 'choices')) {
    body = `${singer(hummer)}<p class="dnd-status">${escapeHTML(dndT(s.phase === 'listen' ? 'dnd_g_listen' : s.phase === 'type' ? 'dnd_g_type' : (role === 'guess' && !dndRightOf(s, Room.me) && !(state.you && typeof state.you.pick === 'number') ? 'dnd_choices_h' : 'dnd_choices_wait'), { h: hummer }))}</p>`;
  } else if (s.phase === 'reveal') {
    const unroll = motionFirst('dnd-ban|' + dndSongKey(state));
    body = `${dndBannerHtml(state, { unroll })}
      ${role !== 'screen' && s.token ? `<button type="button" class="dnd-again" onclick="dndPlayTap()">${escapeHTML(dndT('dnd_listen_btn'))}</button>` : ''}`;
  }
  return `<div class="dnd-stg">${clock}${body}<span class="dnd-last" data-dnd-last></span></div>`;
}

/** The bottom of the hall: the sign in your hand, the four signs, or a line. */
function dndBottomHtml(state) {
  const s = state.shared || {};
  const role = dndRole(state);
  const you = state.you || {};
  const key = dndSongKey(state);
  if (s.phase === 'arm') {
    if (role === 'watch' || role === 'screen') return `<div class="dnd-note-box">${escapeHTML(dndT('dnd_arm_hint'))}</div>`;
    const armed = (s.armed || []).indexOf(Room.me) !== -1;
    return armed ? `<div class="dnd-note-box">${escapeHTML(dndT('dnd_armed'))}</div>`
      : `<button type="button" class="dnd-raise dnd-raise--big" onclick="dndArm()">${escapeHTML(dndT('dnd_arm_btn'))}</button><p class="dnd-hint">${escapeHTML(dndT('dnd_arm_hint'))}</p>`;
  }
  if (role === 'watch') return `<div class="dnd-note-box">${escapeHTML(dndT('dnd_watch'))}</div>`;
  if (role === 'hummer') {
    if (s.phase === 'listen') {
      return `<button type="button" class="dnd-raise" onclick="dndHeard()">${escapeHTML(dndT('dnd_heard_btn'))}</button>
        <div class="dnd-ear">${DND_EAR}<span>${escapeHTML(dndT('dnd_ear'))}</span></div>`;
    }
    if (s.phase === 'type' || s.phase === 'choices') return `<div class="dnd-note-box">${escapeHTML(dndT('dnd_hummer_wait'))}</div>`;
  }
  if (role === 'guess') {
    const mine = dndRightOf(s, Room.me);
    if (s.phase === 'listen' || s.phase === 'count') return `<div class="dnd-note-box">${escapeHTML(dndT(s.mode === 'hum' ? 'dnd_g_wait' : 'dnd_count_wait'))}</div>`;
    if (s.phase === 'type' && !mine) {
      return `<label class="dnd-sgn" for="dnd-input"><small>${escapeHTML(dndT('dnd_type_label'))}</small>
          <input id="dnd-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" maxlength="60"
            placeholder="${escapeHTML(dndT('dnd_type_ph'))}" onkeydown="if(event.key==='Enter'){event.preventDefault();dndSend();}"></label>
        <button type="button" class="dnd-raise" onclick="dndSend()">${escapeHTML(dndT('dnd_raise'))}</button>
        <p class="dnd-err" data-dnd-err aria-live="polite"></p>`;
    }
    if (s.phase === 'choices' && !mine && typeof you.pick !== 'number') {
      return `<div class="dnd-chs">${(s.choices || []).map((c, i) => `<button type="button" class="dnd-ch" onclick="dndPick(${i})"><b>${escapeHTML(c.t)}</b><small>${escapeHTML(c.s)}</small>${dndLatin(c)}</button>`).join('')}</div>`;
    }
    if (s.phase === 'type' || s.phase === 'choices') {
      return `<div class="dnd-note-box">${escapeHTML(dndT(mine ? 'dnd_done' : 'dnd_picked'))}</div>`;
    }
  }
  if (s.phase === 'reveal') {
    const picks = (s.choices || []).length && s.picks && Object.keys(s.picks).length;
    const chs = picks ? `<div class="dnd-chs dnd-chs--done">${s.choices.map((c, i) => `<div class="dnd-ch ${i === s.correct ? 'is-right' : ''} ${(s.picks || {})[Room.me] === i && i !== s.correct ? 'is-wrong' : ''}"><b>${escapeHTML(c.t)}</b><small>${escapeHTML(c.s)}</small>${dndLatin(c)}</div>`).join('')}</div>` : '';
    const note = dndMyNote(state);
    return `${note ? `<div class="dnd-note-box dnd-note-box--res">${escapeHTML(note)}</div>` : ''}${chs}`;
  }
  return '';
}

/** The phone's whole hall. */
function dndPhoneFrame(state) {
  const s = state.shared || {};
  const role = dndRole(state);
  const t = TRANSLATIONS[appState.lang] || {};
  const me = (s.scores || {})[Room.me] || 0;
  const top = `<div class="dnd-top"><span>${escapeHTML(dndSongOf(s))}</span>
      <span class="dnd-top__mode">${escapeHTML(dndT(s.mode === 'listen' ? 'dnd_mode_listen' : 'dnd_mode_hum'))}</span>
      <span>${role === 'guess' || role === 'hummer' ? escapeHTML(dndT('dnd_score', { n: me })) : ''}</span></div>`;
  if (s.phase === 'gameover') {
    const podium = renderPodium(state, s.board);
    return `<div class="dnd dnd--over">
        <div class="dnd-over">
          <div class="dnd-over__t">${escapeHTML(dndT('dnd_over_title'))}</div>
          ${podium}
        </div>
        ${renderScoreboard(s.board)}
        ${typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, s.board) : ''}
        ${dndHostBtns(state)}
        ${renderRoomPlayerStrip(state)}
      </div>`;
  }
  return `<div class="dnd dnd--${s.phase} dnd--${role} dnd--${s.mode}" data-dnd-root>
      <div class="dnd-hall">
        ${top}
        <div class="dnd-hall__main">
          ${dndCrowdHtml(state)}
          ${dndBulbsHtml(false)}
          ${dndStageHtml(state)}
        </div>
        <div class="dnd-hall__side">
          ${dndFrontHtml()}
          <div class="dnd-btm">${dndBottomHtml(state)}</div>
        </div>
        <div class="dnd-stamp" data-dnd-stamp aria-hidden="true"></div>
      </div>
      ${s.phase === 'reveal' ? renderScoreboard(s.board) : ''}
      ${dndHostBtns(state)}
      ${renderRoomPlayerStrip(state)}
    </div>`;
}

/* --- the moves ------------------------------------------------------------------- */
function dndArm() {
  dndUnlock();
  haptic('medium');
  roomAct('arm', {});
}

function dndHeard() {
  const st = Room.state;
  if (!st) return;
  haptic('medium');
  dndStopSound();
  roomAct('heard', { deal: st.shared.deal });
}

function dndSend() {
  const st = Room.state;
  const box = document.getElementById('dnd-input');
  if (!st || !box || (st.shared || {}).phase !== 'type') return;
  const text = box.value.replace(/\s+/g, ' ').trim();
  if (!text) { box.focus(); return; }
  haptic('light');
  const deal = st.shared.deal;
  Room.act('guess', { deal, text }).then((state) => {
    const s = (state && state.shared) || {};
    if (s.deal !== deal) return;
    if (dndRightOf(s, Room.me)) return;     // the frame rebuilds with the stamp
    try { box.select(); } catch (e) {}
  }).catch(err => showToast((err && err.message) || 'تعذر الإرسال', 'error'));
}

function dndPick(i) {
  const st = Room.state;
  if (!st || (st.shared || {}).phase !== 'choices') return;
  haptic('light');
  document.querySelectorAll('#view-room-hum .dnd-ch').forEach((b, k) => { b.disabled = true; b.classList.toggle('is-picked', k === i); });
  roomAct('pick', { deal: st.shared.deal, i });
}

/* --- painting in place: the crowd's signs, the slots, the bulbs, the clock, the stamp --- */
function dndPaint(state, el) {
  const s = state.shared || {};
  const now = roomServerNow();
  const key = dndSongKey(state);
  // The crowd: a ✓ and its place for a right typed answer, ✋ for a pick, the points at the reveal.
  el.querySelectorAll('[data-dnd-head]').forEach(head => {
    const id = head.getAttribute('data-dnd-head');
    const r = dndRightOf(s, id);
    let txt = '';
    let cls = '';
    if (s.phase === 'arm') { if ((s.armed || []).indexOf(id) !== -1) { txt = '🎧'; cls = 'on'; } }
    else if (s.phase === 'reveal') {
      const g = (s.gained || {})[id] || 0;
      if (r || (s.picks && typeof s.picks[id] === 'number')) { txt = g ? dndPts(g) : '✗'; cls = 'on'; }
    } else if (r) { txt = '\u2066✓ ' + r.rank + '\u2069'; cls = 'on'; }
    else if ((s.picked || []).indexOf(id) !== -1) { txt = '✋'; cls = 'on'; }
    const sign = head.querySelector('[data-dnd-sign]');
    if (sign && sign.textContent !== txt) sign.textContent = txt;
    const was = head.classList.contains('on');
    head.classList.toggle('on', cls === 'on');
    if (cls === 'on' && !was && !motionOff() && dndOnce('sign|' + key + '|' + s.phase + '|' + id + '|' + el.id)) {
      head.classList.remove('is-hop'); void head.offsetWidth; head.classList.add('is-hop');
      if (dndVoice(state) && s.phase !== 'reveal') dndSound('sign', (s.right || []).length);
    }
  });
  // The front row.
  el.querySelectorAll('[data-dnd-slot]').forEach(slot => {
    const n = Number(slot.getAttribute('data-dnd-slot'));
    const r = (s.right || []).find(x => x.rank === n);
    const html = r ? `<b><bdi>${escapeHTML(dndNameOf(state, r.id))}</bdi></b><i>+${r.pts}</i>` : `<span class="metric">${n}</span>`;
    if (slot.dataset.who !== (r ? r.id : '')) {
      slot.dataset.who = r ? r.id : '';
      slot.innerHTML = html;
      slot.classList.toggle('on', !!r);
      if (r && !motionOff() && dndOnce('slot|' + key + '|' + n + '|' + el.id)) { slot.classList.remove('is-in'); void slot.offsetWidth; slot.classList.add('is-in'); }
    }
  });
  // The last one to raise a sign.
  const last = el.querySelector('[data-dnd-last]');
  if (last) {
    const lr = (s.right || [])[(s.right || []).length - 1];
    const txt = lr && (s.phase === 'type' || s.phase === 'choices') && lr.id !== Room.me ? dndT('dnd_last', { name: dndNameOf(state, lr.id) }) : '';
    if (last.textContent !== txt) last.textContent = txt;
  }
  // The bulbs and the clock.
  let frac = 1, secs = null, hurry = false, cnt = null;
  if (s.phase === 'type' && s.typeEndsAt) {
    const total = Math.max(1, s.typeEndsAt - (s.typeStartAt || s.typeEndsAt - 15000));
    frac = Math.max(0, Math.min(1, (s.typeEndsAt - now) / total));
    secs = Math.max(0, Math.ceil((s.typeEndsAt - now) / 1000));
    hurry = frac < 0.34;
  } else if (s.phase === 'choices' && s.choiceEndsAt) {
    frac = 0; secs = Math.max(0, Math.ceil((s.choiceEndsAt - now) / 1000)); hurry = secs <= 3;
  } else if (s.phase === 'listen' && s.listenEndsAt) {
    secs = Math.max(0, Math.ceil((s.listenEndsAt - now) / 1000));
  } else if (s.phase === 'count' && s.playAt) {
    cnt = Math.max(0, Math.ceil((s.playAt - now) / 1000));
  } else if (s.phase === 'arm' && s.armEndsAt) {
    secs = Math.max(0, Math.ceil((s.armEndsAt - now) / 1000));
  } else if (s.phase === 'reveal' || s.phase === 'gameover') frac = 0;
  const lit = Math.ceil(frac * DND_BULBS);
  el.querySelectorAll('[data-dnd-bulbs]').forEach(b => {
    [...b.children].forEach((bulb, i) => { const on = i < lit; if (bulb.classList.contains('on') !== on) bulb.classList.toggle('on', on); });
  });
  el.querySelectorAll('[data-dnd-root], .dnd-tv').forEach(r => r.classList.toggle('is-hurry', hurry));
  el.querySelectorAll('[data-dnd-clock]').forEach(c => {
    const txt = secs === null ? '' : String(secs);
    if (c.textContent !== txt) c.textContent = txt;
    c.hidden = secs === null;
  });
  el.querySelectorAll('[data-dnd-cnt]').forEach(c => { const txt = cnt > 0 ? String(cnt) : '🎧'; if (c.textContent !== txt) c.textContent = txt; });
  // The last three seconds of the bulbs tick on the room's voice; the bulbs going out buzz once.
  if (s.phase === 'type' && secs !== null && secs <= 3 && secs > 0 && dnd.tick !== secs && dndVoice(state)) { dnd.tick = secs; dndSound('tick'); }
  if (s.phase === 'choices' && dndVoice(state) && dndOnce('bulbs|' + key + '|' + el.id)) dndSound('bulbs');
  // «بتطول»: which clip is on.
  el.querySelectorAll('[data-dnd-grow] span').forEach(sp => {
    const k = Number(sp.dataset.k), g = DND_GROW[k];
    const on = typeof s.playAt === 'number' && now >= s.playAt + g.at && (k === DND_GROW.length - 1 || now < s.playAt + DND_GROW[k + 1].at);
    if (sp.classList.contains('on') !== on) sp.classList.toggle('on', on);
  });
  // A phone that can't play by itself yet (a reload, no ▶ tapped): the tap button shows.
  const root = el.querySelector('[data-dnd-root]');
  if (root && !state.youAreScreen) {
    const needs = s.mode === 'listen' && ['count', 'type'].indexOf(s.phase) !== -1 && !dnd.unlocked;
    root.classList.toggle('needs-tap', needs);
    root.classList.toggle('is-loading', !!(dnd.loading && dnd.loading.token === dndTokenOf(state)));
  }
}

/** Your own sign: a near miss shakes it, a right answer stamps the hall. */
function dndPaintMine(state, el) {
  const s = state.shared || {};
  const you = state.you || {};
  const key = dndSongKey(state);
  const err = el.querySelector('[data-dnd-err]');
  if (err && you.miss && you.deal === s.deal) {
    const k = key + '|' + you.miss.n;
    if (dnd.missSeen !== k) {
      dnd.missSeen = k;
      err.textContent = dndT(you.miss.close ? 'dnd_close' : 'dnd_miss');
      err.classList.toggle('is-close', !!you.miss.close);
      const sign = el.querySelector('.dnd-sgn');
      if (sign && !motionOff() && sign.animate) sign.animate([{ transform: 'rotate(-1.5deg)' }, { transform: 'rotate(-1.5deg) translateX(-8px)' }, { transform: 'rotate(-1.5deg) translateX(7px)' }, { transform: 'rotate(-1.5deg) translateX(-4px)' }, { transform: 'rotate(-1.5deg)' }], { duration: 380 });
      haptic('light');
    }
  }
  const mine = dndRightOf(s, Room.me);
  const stamp = el.querySelector('[data-dnd-stamp]');
  if (stamp && mine && (s.phase === 'type' || s.phase === 'choices') && dndOnce('stamp|' + key + '|' + el.id)) {
    stamp.textContent = (mine.rank <= 3 ? dndT('dnd_rank_' + mine.rank) : dndT('dnd_res_late')) + ' ' + dndPts(mine.pts);
    stamp.classList.remove('is-on'); void stamp.offsetWidth; stamp.classList.add('is-on');
    haptic('medium');
    playSound('success');
  }
}

/** The envelope opens while it is held. */
function dndWireEnvelope(el) {
  const env = el.querySelector('[data-dnd-env]');
  if (!env || env.dataset.wired) return;
  env.dataset.wired = '1';
  const on = (e) => { env.classList.add('is-peek'); if (e && e.cancelable && e.type === 'touchstart') {} };
  const off = () => env.classList.remove('is-peek');
  env.addEventListener('pointerdown', on);
  env.addEventListener('pointerup', off);
  env.addEventListener('pointercancel', off);
  env.addEventListener('pointerleave', off);
  env.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') on(); });
  env.addEventListener('keyup', off);
  env.addEventListener('blur', off);
  env.addEventListener('contextmenu', (e) => e.preventDefault());
}

let dndPaintTarget = null;
function dndPaintNow() {
  const st = Room.state;
  if (!st || st.game !== 'hum' || !dndPaintTarget || !dndPaintTarget.isConnected) return;
  dndPaint(st, dndPaintTarget);
  dndClockSound(st);
}

/** After every render: paint, start the clip loading, the clock, the sounds of the moment. */
function dndAfter(state, el) {
  const s = state.shared || {};
  const key = dndSongKey(state);
  dndPaintTarget = el;
  dndPaint(state, el);
  if (!state.youAreScreen) dndPaintMine(state, el);
  dndWireEnvelope(el);
  // The clip: loaded as soon as this phone may play it, so the tap or the clock plays at once.
  const token = dndTokenOf(state);
  if (token && dnd.failed !== token && ['listen', 'count', 'type', 'choices'].indexOf(s.phase) !== -1) dndLoad(token).catch(() => {});
  if (['listen', 'count', 'type', 'choices', 'arm'].indexOf(s.phase) === -1 && dnd.cur && dnd.cur !== 'manual') dndStopSound();
  if (s.phase === 'reveal' && dndOnce('rev|' + key + '|' + el.id)) {
    if (dnd.cur && dnd.cur !== 'manual') dndStopSound();
    if (dndVoice(state)) dndSound('reveal');
    if ((s.gained || {})[Room.me]) setTimeout(() => haptic('medium'), 500);
  }
  if (s.phase === 'reveal' || s.phase === 'gameover') animateScoreboards(state);
  if (s.phase === 'gameover' && dndOnce('over|' + roomDealKey(state) + '|' + el.id)) {
    dndStopSound();
    if (dndVoice(state)) dndSound('win');
    const top = (s.board || [])[0];
    if (top && top.score > 0 && (state.youAreScreen || (s.board || []).some(r => r.id === Room.me && r.score === top.score))) {
      afterReveal(el, () => { if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); });
    }
  }
  if (s.phase !== 'type') dnd.tick = -1;
  if (dnd.timer) clearInterval(dnd.timer);
  dnd.timer = null;
  if (['arm', 'listen', 'count', 'type', 'choices'].indexOf(s.phase) !== -1) dnd.timer = setInterval(dndPaintNow, 120);
  dndClockSound(state);
}

/** The first time this page sees the room: what is already on the table counts as seen (no replays). */
function dndFirstSight(state) {
  if (dnd.sightRoom === state.code) return;
  dnd.sightRoom = state.code;
  const s = state.shared || {};
  const key = dndSongKey(state);
  if (s.phase === 'reveal') { motionFirst('dnd-ban|' + key); motionFirst('dnd-tv-ban|' + key); dnd.seen.add('rev|' + key + '|view-room-hum'); dnd.seen.add('rev|' + key + '|view-room-tv'); }
  if (s.phase === 'gameover') { dnd.seen.add('over|' + roomDealKey(state) + '|view-room-hum'); dnd.seen.add('over|' + roomDealKey(state) + '|view-room-tv'); }
  ['view-room-hum', 'view-room-tv'].forEach(id => {
    (s.right || []).forEach(r => { dnd.seen.add('sign|' + key + '|' + s.phase + '|' + r.id + '|' + id); dnd.seen.add('slot|' + key + '|' + r.rank + '|' + id); });
    if (dndRightOf(s, Room.me)) dnd.seen.add('stamp|' + key + '|' + id);
    if (s.phase === 'choices') dnd.seen.add('bulbs|' + key + '|' + id);
  });
}

function dndStop() {
  if (dnd.timer) clearInterval(dnd.timer);
  dnd.timer = null;
  dnd.tick = -1;
  dndStopSound();
}
onLeaveScreen((from) => { if (from === 'room-hum' || from === 'room-tv') dndStop(); });
onRoomClocksReset(() => { if (dnd.timer || dnd.cur) dndStop(); });

/* --- the room game ----------------------------------------------------------------- */
ROOM_GAMES.hum = {
  lobbyOptions(state) {
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(dndT('dnd_lobby_hint'))}</p>`;
    const o = dndOpts();
    const seg = (key, values, current) => `
      <div class="segmented" role="group">
        ${values.map(([v, label]) => `<button type="button" class="segmented__item ${String(v) === String(current) ? 'is-active' : ''}" onclick="dndSetOpt('${key}', '${v}')">${escapeHTML(label)}</button>`).join('')}
      </div>`;
    return `
      <div class="card card--tight">
        <div class="field">
          <label class="field__label">${escapeHTML(dndT('dnd_mode_label'))}</label>
          ${seg('mode', [['hum', dndT('dnd_mode_hum')], ['listen', dndT('dnd_mode_listen')]], o.mode)}
          <p class="field__hint">${escapeHTML(dndT(o.mode === 'listen' ? 'dnd_mode_listen_hint' : 'dnd_mode_hum_hint'))}</p>
        </div>
        ${o.mode === 'listen' ? `<div class="field">
          <label class="field__label">${escapeHTML(dndT('dnd_replay_label'))}</label>
          ${seg('replay', [['once10', dndT('dnd_replay_once10')], ['full', dndT('dnd_replay_full')], ['grow', dndT('dnd_replay_grow')]], o.replay)}
        </div>` : ''}
        <div class="field">
          <label class="field__label">${escapeHTML(dndT('dnd_count_label'))}</label>
          ${seg('count', [[5, '5'], [10, '10'], [15, '15']], o.count)}
        </div>
        <p class="field__hint" style="text-align:center">${escapeHTML(dndT('dnd_lobby_hint'))}</p>
      </div>` + autoNextLobbyHtml(state, 'hum');
  },
  startPayload() {
    const o = dndOpts();
    return { mode: o.mode, replay: o.replay, count: Number(o.count), autoNext: autoNextChoice('hum') };
  },
  actionKey(state) {
    const s = state.shared || {};
    return [roomDealKey(state), s.round, s.deal, s.phase === 'choices' ? 'type' : s.phase].join('|');
  },
  render(state) {
    if (appState.currentView !== 'room-hum') setView('room-hum');
    const el = document.getElementById('view-room-hum');
    if (!el) return;
    dndFirstSight(state);
    const s = state.shared || {};
    // The sign being written survives a rebuild within the same song (a new host, the language).
    renderRoomFrame(el, dndSig(state), () => dndPhoneFrame(state), s.phase === 'type' ? 'dnd-type-' + s.deal : '');
    refreshRoomPlayerStrip(el, state);
    dndAfter(state, el);
  }
};

/* --- the big screen ---------------------------------------------------------------- */
function dndTvPodiumHtml(state, rise) {
  const s = state.shared || {};
  const top = (s.right || []).filter(r => r.rank <= 3);
  if (!top.length) return '';
  const order = [2, 1, 3].map(n => top.find(r => r.rank === n)).filter(Boolean);
  return `<div class="dnd-pod ${rise ? 'dnd-pod--rise' : ''}">${order.map(r =>
    `<div class="dnd-pb dnd-pb--${r.rank}"><b><bdi>${escapeHTML(dndNameOf(state, r.id))}</bdi> <i>+${r.pts}</i></b><div class="dnd-pb__b metric">${r.rank}</div></div>`).join('')}
    ${s.mode === 'hum' && s.hummerId && (s.gained || {})[s.hummerId] ? `<div class="dnd-pb dnd-pb--h"><b>🎤 <bdi>${escapeHTML(dndNameOf(state, s.hummerId))}</bdi> <i>+${s.gained[s.hummerId]}</i></b></div>` : ''}
  </div>`;
}

TV_GAMES.hum = {
  sig(state) {
    const s = state.shared || {};
    return ['hum', roomDealKey(state), s.phase, s.round, s.deal, s.hummerId, s.mode, (s.choices || []).length,
      state.youAreHost, appState.lang, s.phase === 'reveal' || s.phase === 'gameover' ? JSON.stringify(s.board || []) : '',
      (s.roster || []).filter(id => (state.players || []).some(p => p.id === id)).join(',')].join('|');
  },
  frame(state, t) {
    dndFirstSight(state);
    const s = state.shared || {};
    const hummer = dndIso(dndNameOf(state, s.hummerId));
    const key = dndSongKey(state);
    const host = (() => {
      if (s.phase === 'arm') return roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(dndT('dnd_go'), "roomAct('go', {})")}</div>`);
      if (['listen', 'count', 'type', 'choices'].indexOf(s.phase) !== -1) return roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(dndT('dnd_skip'), `roomAct('skipSong', { deal: ${Number(s.deal) || 0} })`, 'ghost')}</div>`);
      if (s.phase === 'reveal') {
        const last = (s.round || 0) >= (s.rounds || 0);
        return autoNextSlotHtml(state) + roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(dndT(last ? 'dnd_final' : 'dnd_next'), `roomAct('nextRound', { round: ${Number(s.round) || 0} })`)}</div>`);
      }
      if (s.phase === 'gameover' && state.youAreHost) return `<div class="tv-actions">${tvBtn('▶ ' + (t.play_again || ''), "roomAct('playAgain', {})")}${tvBtn(t.room_another_game || '', "roomAct('backToHub')", 'ghost')}</div>`;
      return '';
    })();
    if (s.phase === 'gameover') {
      return `<div class="dnd-tv dnd-tv--over">
          <div class="dnd-tv__over"><div class="dnd-over__t">${escapeHTML(dndT('dnd_over_title'))}</div><div class="tv-scale">${renderPodium(state, s.board)}</div></div>
          <div class="dnd-tv__board tv-scale">${renderScoreboard(s.board)}${host}</div>
        </div>`;
    }
    let mid = '';
    const marq = (big) => `<div class="dnd-marq"><small>${escapeHTML(dndSongOf(s))} — ${escapeHTML(dndT(s.mode === 'listen' ? 'dnd_mode_listen' : 'dnd_mode_hum'))}</small><b>${big}</b></div>`;
    if (s.phase === 'arm') mid = marq(escapeHTML(dndT('dnd_tv_arm'))) + `<p class="dnd-tv__cap">${escapeHTML(dndT('dnd_arm_hint'))}</p>`;
    else if (s.phase === 'listen') mid = marq(escapeHTML(dndT('dnd_tv_card', { h: hummer }))) + `<p class="dnd-tv__cap">${escapeHTML(dndT('dnd_tv_listen_hum', { h: hummer }))}</p>`;
    else if (s.phase === 'count') mid = `<div class="dnd-tv__count"><b>${escapeHTML(dndT('dnd_tv_count'))}</b><span class="dnd-cnt metric" data-dnd-cnt>3</span><p class="dnd-tv__cap">${escapeHTML(dndT('dnd_count_line'))}</p></div>`;
    else if (s.phase === 'type') mid = `<p class="dnd-tv__cap dnd-tv__cap--top">${escapeHTML(dndT(s.mode === 'hum' ? 'dnd_tv_hum' : 'dnd_tv_type_listen', { h: hummer }))}</p>`;
    else if (s.phase === 'choices') {
      mid = `<p class="dnd-tv__pill">${escapeHTML(dndT('dnd_tv_choices'))} (${dndPlus(1)})</p>
        <div class="dnd-plc4">${(s.choices || []).map(c => `<span><b>${escapeHTML(c.t)}</b><em>${escapeHTML(c.s)}</em></span>`).join('')}</div>`;
    } else if (s.phase === 'reveal') {
      const rise = motionFirst('dnd-tv-ban|' + key);
      mid = `${dndBannerHtml(state, { unroll: rise, tv: true })}${dndTvPodiumHtml(state, rise)}`;
    }
    const singer = s.mode === 'hum' && ['listen', 'type', 'choices'].indexOf(s.phase) !== -1
      ? `<div class="dnd-tv__singer ${s.phase === 'type' ? 'is-humming' : ''}">${DND_SINGER}${DND_NOTES}<span class="dnd-singer__t">${escapeHTML(dndT('dnd_on_stage', { h: hummer }))}</span></div>` : '';
    const speaker = s.mode === 'listen' && (s.phase === 'type' || s.phase === 'choices') ? `<div class="dnd-tv__speaker" aria-hidden="true">🔊${DND_NOTES}</div>` : '';
    return `<div class="dnd-tv dnd-tv--${s.phase}">
        <div class="dnd-tv__scene" aria-hidden="true">
          <div class="dnd-tv__curtain dnd-tv__curtain--s"></div><div class="dnd-tv__curtain dnd-tv__curtain--e"></div><div class="dnd-tv__valance"></div><div class="dnd-tv__floor"></div><div class="dnd-tv__light"></div>
        </div>
        ${dndBulbsHtml(true)}
        <span class="dnd-tv__clk metric" data-dnd-clock></span>
        <div class="dnd-tv__mid">${singer}${speaker}<div class="dnd-tv__words">${mid}</div></div>
        <div class="dnd-tv__host">${host}</div>
        ${dndCrowdHtml(state, { tv: true })}
      </div>`;
  },
  after(state) {
    const el = document.getElementById('view-room-tv');
    if (el) dndAfter(state, el);
  }
};
</script>
