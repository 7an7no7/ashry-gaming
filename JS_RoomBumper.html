  });
  if (g.ball) bmpBallStep(g, dt, running, state, now);
  const live = cars.filter(c => !c.fall && !c.out);
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) bmpTvCollide(live[i], live[j], running);
  }
  if (g.ball) live.forEach(c => bmpBallHit(g, c, wall));
}

/** Off the edge of the ring: a point to whoever pushed last, and back in or out. */
function bmpTvFall(c, now, running) {
  const g = bmp.tv;
  c.fall = { t: 0, x: c.x, y: c.y, vx: c.vx, vy: c.vy, at: now, back: now + BMP_RESPAWN_MS };
  c.taken++;
  const pusher = c.lastTouch && now - c.lastTouch.at < 2500 ? g.cars[c.lastTouch.id] : null;
  if (pusher && running) {
    pusher.hits++;
    g.pops.push({ x: pusher.x, y: pusher.y - BMP_R * 1.6, t: 0.9, color: bmpColorOf(Room.state, pusher.id) });
    if (!pusher.bot) bmpTvSend({ k: 'h', to: pusher.id, w: 'hit' });
    g.sent.push(now);
  }
  if (g.st.ringWin === 'last') { c.out = true; c.elimAt = ++g.elim; }
  if (!c.bot) { bmpTvSend({ k: 'h', to: c.id, w: 'fell' }); g.sent.push(now); }
  bmpTvSnd('fall');
}
function bmpTvRespawn(c, now) {
  const a = Math.random() * Math.PI * 2, r = Math.random() * BMP_RING_R * 0.35;
  c.x = BMP_W / 2 + Math.cos(a) * r; c.y = BMP_H / 2 + Math.sin(a) * r;
  c.vx = 0; c.vy = 0; c.fall = null; c.safeUntil = now + 1500; c.lastTouch = null;
  c.h = Math.atan2(BMP_H / 2 - c.y, BMP_W / 2 - c.x) + Math.PI;
}

function bmpTvCollide(a, b, running) {
  const wall = Date.now();
  // Just back on the ring: the others pass through for a moment.
  if (wall < a.safeUntil && bmp.tv.st.mode === 'ring') return;
  if (wall < b.safeUntil && bmp.tv.st.mode === 'ring') return;
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  if (d >= BMP_R * 2 || d === 0) return;
  const nx = dx / d, ny = dy / d;
  const push = (BMP_R * 2 - d) / 2;
  a.x -= nx * push; a.y -= ny * push;
  b.x += nx * push; b.y += ny * push;
  const vr = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (vr >= 0) return;
  const j = (1 + 0.9) / 2 * vr - 40;       // the rubber bumper gives a little extra
  a.vx += j * nx; a.vy += j * ny;
  b.vx -= j * nx; b.vy -= j * ny;
  const g = bmp.tv;
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  const hard = -vr;
  // Cars pushing against each other touch every step: sparks and a crash only for a real knock.
  if (hard < 70) return;
  a.lastTouch = { id: b.id, at: wall };
  b.lastTouch = { id: a.id, at: wall };
  const pairKey = a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id;
  if (!g.sndPairs[pairKey] || wall - g.sndPairs[pairKey] > 180) { g.sndPairs[pairKey] = wall; bmpTvSnd('bump', hard / 600); }
  for (let k = 0; k < Math.min(14, 4 + hard / 40); k++) {
    const ang = Math.random() * Math.PI * 2, v = 80 + Math.random() * hard * 0.6;
    g.sparks.push({ x: cx, y: cy, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, t: 0.45 });
  }
  // A knock scores only in بالونات and نقط: in الحلبة the fall is the point, at the ball only goals count.
  if (!running || hard < 170 || g.st.mode === 'ring' || g.st.mode === 'ball') return;
  if (g.pairs[pairKey] && wall - g.pairs[pairKey] < 600) return;
  // Who drove into whom: each car's speed toward the other before the knock.
  const sa = (a.vx - j * nx) * nx + (a.vy - j * ny) * ny;
  const sb = -((b.vx + j * nx) * nx + (b.vy + j * ny) * ny);
  if (Math.max(sa, sb) < 90) return;
  g.pairs[pairKey] = wall;
  // Head-on at about the same speed is a draw (the owner, 28 Sep 2026: "if we both hit while facing
  // each other, who gets what?"): both were driving in, within a quarter of each other's speed, so
  // nobody scores. A clearly faster car, or a hit on the side or from behind, still scores one.
  if (sa > 60 && sb > 60 && Math.min(sa, sb) >= 0.75 * Math.max(sa, sb)) {
    g.pops.push({ x: cx, y: cy - BMP_R, t: 0.9, color: '#ffffff', text: '💥' });
    return;
  }
  const hitter = sa >= sb ? a : b, victim = hitter === a ? b : a;
  if (g.st.mode === 'balloons') {
    // A ghost pops nothing, a ghost has nothing to pop, and a car just popped has a moment's grace.
    if (hitter.ghost || victim.ghost || wall < victim.safeUntil) return;
    victim.lives--;
    victim.safeUntil = wall + 1000;
    if (victim.lives <= 0) { victim.lives = 0; victim.ghost = true; victim.elimAt = ++g.elim; }
    if (g.view && g.view.popBalloon) g.view.popBalloon(victim, victim.lives);
    bmpTvSnd('pop');
  }
  hitter.hits++;
  victim.taken++;
  victim.flash = 0.4;
  g.pops.push({ x: hitter.x, y: hitter.y - BMP_R * 1.6, t: 0.9, color: bmpColorOf(Room.state, hitter.id) });
  if (!hitter.bot) bmpTvSend({ k: 'h', to: hitter.id, w: 'hit' });
  if (!victim.bot) bmpTvSend({ k: 'h', to: victim.id, w: g.st.mode === 'balloons' ? 'pop' : 'got' });
  g.sent.push(wall, wall);
  bmpTvSnd('point');
}

/** The standings as they are now: a place for every car, ties sharing one. */
function bmpTvRank(g) {
  const st = g.st;
  const cars = Object.values(g.cars);
  let key;
  if (st.mode === 'balloons') key = (c) => c.ghost ? [0, c.elimAt, 0] : [1, c.lives, c.hits];
  else if (st.mode === 'ring' && st.ringWin === 'last') key = (c) => c.out ? [0, c.elimAt, 0] : [1, c.hits, -c.taken];
  else key = (c) => [1, c.hits, -c.taken];
  const cmp = (a, b) => { const ka = key(a), kb = key(b); for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return kb[i] - ka[i]; return 0; };
  const sorted = cars.slice().sort(cmp);
  sorted.forEach((c, i) => { c.place = i && cmp(sorted[i - 1], c) === 0 ? sorted[i - 1].place : i + 1; });
  return sorted;
}

/** The round's end: one screen (the first online, by id) tells the server the result. */
function bmpTvReport(state) {
  const g = bmp.tv;
  // Only the lead screen reports; another screen keeps looking, in case it becomes the lead (the first went off).
  if (!bmpIsLead(state)) return;
  g.reported = true;
  const scores = {};
  bmpTvRank(g).forEach(c => { scores[c.id] = { score: c.hits, taken: c.taken, lives: c.lives, place: c.place }; });
  // A finish that didn't arrive is sent again (after a breath, not every frame).
  Room.act('finish', { round: (state.shared || {}).round, scores, done: g.done })
    .catch(() => setTimeout(() => { if (bmp.tv === g) g.reported = false; }, 2000));
}

/** Each phone hears its car's lives, score and place - when they change, and now and then anyway. */
function bmpTvStatus(state) {
  const g = bmp.tv;
  const ranked = bmpTvRank(g);
  const now = Date.now();
  ranked.forEach((c) => {
    if (c.bot) return;
    const d = { k: 's', to: c.id, l: c.lives, sc: c.hits, pl: c.place, of: ranked.length, gh: c.ghost ? 1 : 0, out: c.out ? 1 : 0 };
    const key = JSON.stringify(d);
    if (key === c.sent && now - (c.sentAt || 0) < 3000) return;
    if (bmpTvSend(d)) { c.sent = key; c.sentAt = now; g.sent.push(now); }
  });
}

/** The side: the way to play, the clock, the standings; the delay and the traffic behind 📶. */
function bmpTvPanel(state) {
  const g = bmp.tv;
  const t = bmpT();
  const st = g.st;
  const clock = document.querySelector('[data-bmp-tvclock]');
  if (clock) clock.textContent = bmpClockText(bmpSecsLeft(state));
  const sound = document.getElementById('bmp-sound');
  if (sound) { let asleep = true; try { asleep = audioCtx.state !== 'running'; } catch (e) {} sound.classList.toggle('hidden', !asleep || !g.lead); }
  const wall = Date.now();
  const recent = (list) => { while (list.length && wall - list[0] > 3000) list.shift(); return list.length / 3; };
  // Trimmed every tick, whether or not the numbers are shown, so the lists never grow for a whole round.
  recent(g.msgs); recent(g.sent);
  Object.values(g.cars).forEach(c => recent(c.rate));
  const table = document.getElementById('bmp-table');
  if (table) {
    table.innerHTML = bmpTvRank(g).map(c => {
      const color = bmpColorOf(state, c.id);
      const level = c.ping === null ? '' : c.ping < 80 ? 'good' : c.ping < 150 ? 'ok' : 'bad';
      const stat = st.mode === 'balloons' ? (c.ghost ? '👻' : bmpBalloonsHtml(c.lives, color))
        : st.mode === 'ring' ? (c.out ? '💦' : `<span class="metric">⭕ ${c.hits}</span>`) : `<span class="metric">💥 ${c.hits}</span>`;
      const extra = bmp.stats && !c.bot
        ? `<span class="bmp-row__ping metric" data-level="${level}">${c.ping === null ? '–' : c.ping + ' ms'}</span><span class="bmp-row__rate metric tx-muted">${Math.round(recent(c.rate))}/s</span>` : '';
      const idle = !c.bot && wall - c.inAt >= BMP_STALE_MS;
      return `<div class="bmp-row ${idle ? 'is-idle' : ''} ${c.ghost || c.out ? 'is-ghost' : ''}" style="--car:${color}">
        <span class="bmp-row__place">${c.place}</span>
        <span class="bmp-row__dot"></span>
        <span class="bmp-row__name"><bdi>${escapeHTML(c.name)}</bdi>${c.bot ? ' 🤖' : ''}</span>
        <span class="bmp-row__stat">${stat}</span>${extra}
      </div>`;
    }).join('');
  }
  const stats = document.getElementById('bmp-stats');
  if (stats) {
    if (!bmp.stats) stats.innerHTML = '';
    else {
      const perSec = recent(g.msgs) + recent(g.sent);
      const pct = perSec * 3600 / BMP_MSGS_PER_REQUEST / BMP_FREE_PER_DAY * 100;
      stats.innerHTML = `<div><span class="tx-muted">${escapeHTML(t.bmp_msgs)}</span> <b class="metric">${Math.round(perSec)}</b></div>
        <div class="tx-muted">${escapeHTML(bmpFill(t.bmp_quota, { n: pct < 10 ? pct.toFixed(1) : Math.round(pct) }))}</div>`;
    }
  }
}

/* --- the view: the 3D fairground rink, or the flat one --------------------------- */
function bmpViewMount(g, stage) {
  if (g.view) { try { g.view.dispose(); } catch (e) {} g.view = null; }
  stage.innerHTML = '';
  g.view = bmpFlatView(g, stage);          // drawn at once; 3D takes over when it has loaded
  if (typeof loadThree !== 'function') return;
  loadThree().then((T) => {
    if (bmp.tv !== g || !g.raf || !stage.isConnected) return;   // the rink was stopped while three.js loaded
    const v = bmp3dView(g, stage, T);
    if (!v) return;
    if (g.view) { try { g.view.dispose(); } catch (e) {} }
    g.view = v;
  }).catch(() => {});
}

/** The flat rink: a canvas from above, where 3D can't draw or hasn't loaded yet. */
function bmpFlatView(g, stage) {
  const cv = document.createElement('canvas');
  cv.className = 'bmp-canvas';
  stage.appendChild(cv);
  const ring = g.st.mode === 'ring';
  return {
    el: cv,
    remove() {},
    dispose() { cv.remove(); },
    draw(state, now) {
      const box = stage.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      // The pitch has its goals outside the rink: the canvas is wider by their depth.
      const ox = g.ball ? BMP_GOAL_D : 0, VW = BMP_W + ox * 2;
      const scale = Math.min(box.width / VW, box.height / BMP_H);
      if (!(scale > 0)) return;
      const w = Math.round(VW * scale), h = Math.round(BMP_H * scale);
      if (cv.width !== w * dpr || cv.height !== h * dpr) {
        cv.width = w * dpr; cv.height = h * dpr;
        cv.style.width = w + 'px'; cv.style.height = h + 'px';
      }
      const ctx = cv.getContext('2d');
      ctx.direction = 'ltr';
      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * scale * ox, 0);
      ctx.fillStyle = '#16131f';
      ctx.fillRect(-ox, 0, VW, BMP_H);
      if (g.ball) {
        bmpBallFlatDraw(ctx, g);
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 18;
        const mid = BMP_H / 2, gh = BMP_GOAL_HALF;
        ctx.beginPath();
        ctx.moveTo(9, mid - gh); ctx.lineTo(9, 9); ctx.lineTo(BMP_W - 9, 9); ctx.lineTo(BMP_W - 9, mid - gh);
        ctx.moveTo(BMP_W - 9, mid + gh); ctx.lineTo(BMP_W - 9, BMP_H - 9); ctx.lineTo(9, BMP_H - 9); ctx.lineTo(9, mid + gh);
        ctx.stroke();
      } else if (ring) {
        ctx.fillStyle = '#2b2740';
        ctx.beginPath(); ctx.arc(BMP_W / 2, BMP_H / 2, BMP_RING_R, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 10; ctx.stroke();
      } else {
        ctx.fillStyle = '#231f33'; ctx.fillRect(18, 18, BMP_W - 36, BMP_H - 36);
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 18; ctx.strokeRect(9, 9, BMP_W - 18, BMP_H - 18);
      }
      Object.values(g.cars).forEach(c => {
        if (c.fall) return;
        ctx.save();
        ctx.globalAlpha = c.ghost || c.out ? 0.35 : 1;
        ctx.translate(c.x, c.y);
        ctx.rotate(c.h);
        ctx.fillStyle = '#2b2b36';
        ctx.beginPath(); ctx.ellipse(0, 0, BMP_R * 1.2, BMP_R, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = c.flash > 0 ? '#fff' : bmpColorOf(state, c.id);
        ctx.beginPath(); ctx.ellipse(0, 0, BMP_R, BMP_R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        ctx.beginPath(); ctx.moveTo(BMP_R, 0); ctx.lineTo(BMP_R * 0.5, -BMP_R * 0.35); ctx.lineTo(BMP_R * 0.5, BMP_R * 0.35); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
        ctx.font = '700 26px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(c.name + (g.st.mode === 'balloons' && !c.ghost ? ' ' + '●'.repeat(c.lives) : ''), c.x, c.y - BMP_R * 1.4);
      });
      if (g.ball) bmpBallFlatBall(ctx, g);
      g.sparks.forEach(p => { p.x += p.vx / 60; p.y += p.vy / 60; ctx.fillStyle = '#fde047'; ctx.globalAlpha = p.t / 0.45; ctx.fillRect(p.x - 4, p.y - 4, 8, 8); });
      ctx.globalAlpha = 1;
      bmpOverlayText(ctx, state, now, BMP_W, BMP_H, 1);
    }
  };
}
/** The countdown, «يلا!» and the end, over the rink (flat: on the canvas; 3D: on its own overlay canvas). */
function bmpOverlayText(ctx, state, now, W, H, k) {
  const s = state.shared || {};
  const t = bmpT();
  const g = bmp.tv;
  let text = null, size = 0;
  if (now < s.startAt) { text = String(Math.min(3, Math.ceil((s.startAt - now) / 1000))); size = 260; }
  else if (now < s.startAt + 700) { text = t.bmp_go; size = 200; }
  else if (g && g.ball) {
    // «كورة التصادم»: the kick-off's 3-2-1 and «يلا!», the golden goal, the end.
    if (g.goal) return;
    if (g.over) { text = bmpX('full_time'); size = 110; }
    else if (g.kickAt && now < g.kickAt) { text = String(Math.min(3, Math.ceil((g.kickAt - now) / 1000))); size = 260; }
    else if (g.kickAt && now < g.kickAt + 700) { text = t.bmp_go; size = 200; }
    else if (g.golden && now < (g.goldenAt || s.endsAt) + 1800) { text = '⭐ ' + bmpX('golden'); size = 120; }
  }
  else if (now >= s.endsAt || (bmp.tv && bmp.tv.done)) { text = t.bmp_over; size = 110; }
  if (!text) return;
  size *= k;
  ctx.font = '900 ' + size + 'px ' + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 10; ctx.strokeStyle = '#1b1b1f'; ctx.fillStyle = '#fde047';
  ctx.strokeText(text, W / 2, H / 2); ctx.fillText(text, W / 2, H / 2);
}

/* --- the 3D fairground rink (three.js) ------------------------------------------
   A hall at night: a steel checker-plate floor (or, for الحلبة, a round stage
   over a padded pit), a rubber rail in yellow and black, a ring of fairground
   bulbs, two coloured lights sweeping round, and bumper cars - a rubber skirt,
   a lacquered body in the driver's colour, a seat, the driver's head, a pole
   with a spark on top, and in بالونات three balloons tied behind. Everything
   the sim moves is placed from it every frame: a unit of the sim is a
   centimetre, the rink 16 × 9 m. */
function bmp3dView(g, stage, T) {
  const canvas = document.createElement('canvas');
  canvas.className = 'bmp-canvas3d';
  let renderer;
  try { renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); } catch (e) { return null; }
  const small = Math.min(window.screen.width || 800, window.screen.height || 800) < 700;
  renderer.setPixelRatio(threeGfxRatio());
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  const overlay = document.createElement('canvas');
  overlay.className = 'bmp-overlay';
  const wrap = document.createElement('div');
  wrap.className = 'bmp-3d';
  wrap.appendChild(canvas); wrap.appendChild(overlay);
  stage.appendChild(wrap);

  const ring = g.st.mode === 'ring';
  const balloons = g.st.mode === 'balloons';
  const ballMode = g.st.mode === 'ball';
  const W = (x) => (x - BMP_W / 2) / 100, Z = (y) => (y - BMP_H / 2) / 100;
  const disposables = [];
  const keep = (o) => { disposables.push(o); return o; };
  const tex = (draw, w, h, rep) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = keep(new T.CanvasTexture(c));
    t.colorSpace = T.SRGBColorSpace;
    if (rep) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    t.anisotropy = 4;
    return t;
  };

  const scene = new T.Scene();
  scene.background = new T.Color(0x0c0a14);
  scene.fog = new T.Fog(0x0c0a14, 18, 40);
  const cam = new T.PerspectiveCamera(36, 16 / 9, 0.1, 80);
  scene.add(new T.HemisphereLight(0xdcd4ff, 0x1a1422, 0.9));
  const sun = new T.DirectionalLight(0xfff2e0, 1.6);
  sun.position.set(-3, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 7, bottom: -7, near: 1, far: 40 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  const party = [0xff3d7f, 0x3dd6ff].map((col) => {
    const l = new T.PointLight(col, 40, 16, 1.6);
    l.position.set(0, 4, 0);
    scene.add(l);
    return l;
  });

  // The floor of the hall, and the rink.
  const plate = tex((c, w, h) => {
    c.fillStyle = '#4a4e5a'; c.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 32) for (let x = (y / 32) % 2 ? 16 : 0; x < w; x += 32) {
      c.save(); c.translate(x + 8, y + 8); c.rotate(((x + y) / 32) % 2 ? 0.7 : -0.7);
      c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(-9, -2.2, 18, 4.4);
      c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(-9, 1.4, 18, 1.4);
      c.restore();
    }
  }, 256, 256, [8, 4.5]);
  const hallFloor = new T.Mesh(keep(new T.PlaneGeometry(60, 40)), keep(new T.MeshStandardMaterial({ color: 0x1b1726, roughness: 0.9 })));
  hallFloor.rotation.x = -Math.PI / 2; hallFloor.position.y = ring ? -1.6 : -0.02; hallFloor.receiveShadow = true;
  scene.add(hallFloor);
  // «كورة التصادم»: the rink is a pitch - the turf, its lines, a rail with a gap for each goal, two goals with nets.
  const nets = [];
  let ballMesh = null;
  if (ballMode) {
    const turf = tex((c, w, h) => bmpPitchPaint(c, w, h), 1024, 576);
    const pitch = new T.Mesh(keep(new T.PlaneGeometry(16, 9)), keep(new T.MeshStandardMaterial({ map: turf, roughness: 0.92 })));
    pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true; scene.add(pitch);
    const stripes = tex((c, w, h) => { for (let x = 0; x < w; x += 32) { c.fillStyle = (x / 32) % 2 ? '#1b1b1f' : '#f5b400'; c.fillRect(x, 0, 32, h); } }, 256, 16, [20, 1]);
    const railMat = keep(new T.MeshStandardMaterial({ map: stripes, roughness: 0.6 }));
    const railH = 0.32, railT = 0.22, gh = BMP_GOAL_HALF / 100, endLen = 4.5 - gh;
    [[0, -4.5 - railT / 2, 16 + railT * 2, railT], [0, 4.5 + railT / 2, 16 + railT * 2, railT],
      [-8 - railT / 2, -(gh + endLen / 2), railT, endLen], [-8 - railT / 2, gh + endLen / 2, railT, endLen],
      [8 + railT / 2, -(gh + endLen / 2), railT, endLen], [8 + railT / 2, gh + endLen / 2, railT, endLen]].forEach(([x, z, w, d]) => {
      const m = new T.Mesh(keep(new T.BoxGeometry(w, railH, d)), railMat);
      m.position.set(x, railH / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
    });
    // The goals: posts and bar in the colour of the side that defends it (blue on the left), the net behind.
    const netTex = tex((c, w, h) => {
      c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2;
      for (let i = -h; i < w + h; i += 12) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i + h, h); c.stroke(); c.beginPath(); c.moveTo(i + h, 0); c.lineTo(i, h); c.stroke(); }
    }, 128, 128, [3, 1.2]);
    const netMat = keep(new T.MeshStandardMaterial({ map: netTex, transparent: true, side: T.DoubleSide, depthWrite: false, roughness: 0.9 }));
    const depth = BMP_GOAL_D / 100, barY = 1.1, postR = 0.06;
    const postGeo = keep(new T.CylinderGeometry(postR, postR, barY, 12));
    const barGeo = keep(new T.CylinderGeometry(postR, postR, gh * 2 + postR * 2, 12));
    [[-1, BMP_TEAM.blue], [1, BMP_TEAM.red]].forEach(([d, col]) => {
      const grp = new T.Group();
      const frame = keep(new T.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.35, roughness: 0.35 }));
      [-gh, gh].forEach(z => { const p = new T.Mesh(postGeo, frame); p.position.set(0, barY / 2, z); p.castShadow = true; grp.add(p); });
      const bar = new T.Mesh(barGeo, frame); bar.rotation.x = Math.PI / 2; bar.position.set(0, barY, 0); bar.castShadow = true; grp.add(bar);
      const floorIn = new T.Mesh(keep(new T.PlaneGeometry(depth, gh * 2)), keep(new T.MeshStandardMaterial({ color: 0x226f40, roughness: 0.95 })));
      floorIn.rotation.x = -Math.PI / 2; floorIn.position.set(d * depth / 2, 0.005, 0); floorIn.receiveShadow = true; grp.add(floorIn);
      const net = new T.Group();
      const back = new T.Mesh(keep(new T.PlaneGeometry(gh * 2, barY)), netMat); back.rotation.y = Math.PI / 2; back.position.set(d * depth, barY / 2, 0); net.add(back);
      const top = new T.Mesh(keep(new T.PlaneGeometry(depth, gh * 2)), netMat); top.rotation.x = Math.PI / 2; top.position.set(d * depth / 2, barY, 0); net.add(top);
      [-gh, gh].forEach(z => { const sd = new T.Mesh(keep(new T.PlaneGeometry(depth, barY)), netMat); sd.position.set(d * depth / 2, barY / 2, z); net.add(sd); });
      grp.add(net);
      grp.position.set(d * (8 - BMP_RAIL / 100), 0, 0);       // on the line the ball crosses (the rail's inner face)
      scene.add(grp);
      nets.push({ side: d < 0 ? 'left' : 'right', net });
    });
    // The ball: a football's skin, rolled by its own speed.
    const skin = tex((c, w, h) => bmpBallSkin(c, w, h), 512, 256);
    ballMesh = new T.Mesh(keep(new T.SphereGeometry(BMP_BALL_R / 100, 32, 24)), keep(new T.MeshStandardMaterial({ map: skin, roughness: 0.45 })));
    ballMesh.castShadow = true;
    scene.add(ballMesh);
  } else if (!ring) {
    const floor = new T.Mesh(keep(new T.PlaneGeometry(16, 9)), keep(new T.MeshStandardMaterial({ map: plate, roughness: 0.38, metalness: 0.55 })));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const stripes = tex((c, w, h) => { for (let x = 0; x < w; x += 32) { c.fillStyle = (x / 32) % 2 ? '#1b1b1f' : '#f5b400'; c.fillRect(x, 0, 32, h); } }, 256, 16, [20, 1]);
    const railMat = keep(new T.MeshStandardMaterial({ map: stripes, roughness: 0.6 }));
    const railH = 0.32, railT = 0.22;
    [[0, -4.5 - railT / 2, 16 + railT * 2, railT], [0, 4.5 + railT / 2, 16 + railT * 2, railT], [-8 - railT / 2, 0, railT, 9], [8 + railT / 2, 0, railT, 9]].forEach(([x, z, w, d]) => {
      const m = new T.Mesh(keep(new T.BoxGeometry(w, railH, d)), railMat);
      m.position.set(x, railH / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
    });
  } else {
    const R = BMP_RING_R / 100;
    const top = new T.Mesh(keep(new T.CylinderGeometry(R, R, 0.3, 72)), [
      keep(new T.MeshStandardMaterial({ color: 0x2b2740, roughness: 0.6 })),
      keep(new T.MeshStandardMaterial({ map: plate, roughness: 0.38, metalness: 0.55 })),
      keep(new T.MeshStandardMaterial({ color: 0x2b2740 }))]);
    top.position.y = -0.15; top.receiveShadow = true; scene.add(top);
    const edge = new T.Mesh(keep(new T.TorusGeometry(R, 0.05, 8, 96)), keep(new T.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xf59e0b, emissiveIntensity: 1.4 })));
    edge.rotation.x = Math.PI / 2; edge.position.y = 0.01; scene.add(edge);
    // The pit: soft mats in the fairground colours.
    const mats = [0xe5383b, 0x3f73d6, 0xe9b52a, 0x35a35a];
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      const m = new T.Mesh(keep(new T.BoxGeometry(1.8, 0.3, 1.2)), keep(new T.MeshStandardMaterial({ color: mats[i % 4], roughness: 0.9 })));
      m.position.set(Math.cos(a) * (R + 1.2), -1.45, Math.sin(a) * (R + 1.2)); m.rotation.y = -a; m.receiveShadow = true; scene.add(m);
    }
  }
  // A ring of fairground bulbs around it all.
  const bulbGeo = keep(new T.SphereGeometry(0.07, 10, 8));
  const bulbCols = [0xffd166, 0xff6b6b, 0x7bdff2, 0xb8f28b];
  const bulbs = bulbCols.map(col => keep(new T.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 2 })));
  const addBulb = (x, y, z, i) => { const b = new T.Mesh(bulbGeo, bulbs[i % 4]); b.position.set(x, y, z); scene.add(b); };
  if (ring) {
    const R = BMP_RING_R / 100 + 0.25;
    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2; addBulb(Math.cos(a) * R, 0.08, Math.sin(a) * R, i); }
  } else {
    let i = 0;
    for (let x = -8.3; x <= 8.31; x += 0.55) { addBulb(x, 0.42, -4.8, i++); addBulb(x, 0.42, 4.8, i++); }
    for (let z = -4.25; z <= 4.26; z += 0.55) {
      if (ballMode && Math.abs(z) < BMP_GOAL_HALF / 100 + 0.1) continue;          // the goal mouths
      addBulb(-8.3, 0.42, z, i++); addBulb(8.3, 0.42, z, i++);
    }
  }
  // The cars.
  const skinMat = keep(new T.MeshStandardMaterial({ color: 0xf1c7a0, roughness: 0.7 }));
  const rubberMat = keep(new T.MeshStandardMaterial({ color: 0x222228, roughness: 0.85 }));
  const seatMat = keep(new T.MeshStandardMaterial({ color: 0x1b1b1f, roughness: 0.6 }));
  const chromeMat = keep(new T.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.2 }));
  const lampMat = keep(new T.MeshStandardMaterial({ color: 0xfff6c8, emissive: 0xfff2a8, emissiveIntensity: 1.5 }));
  const hairMat = keep(new T.MeshStandardMaterial({ color: 0x2a1a12, roughness: 0.8 }));
  const rounded = (w, l, r) => {
    const s = new T.Shape();
    s.moveTo(-w / 2 + r, -l / 2); s.lineTo(w / 2 - r, -l / 2); s.quadraticCurveTo(w / 2, -l / 2, w / 2, -l / 2 + r);
    s.lineTo(w / 2, l / 2 - r); s.quadraticCurveTo(w / 2, l / 2, w / 2 - r, l / 2); s.lineTo(-w / 2 + r, l / 2);
    s.quadraticCurveTo(-w / 2, l / 2, -w / 2, l / 2 - r); s.lineTo(-w / 2, -l / 2 + r); s.quadraticCurveTo(-w / 2, -l / 2, -w / 2 + r, -l / 2);
    return s;
  };
  const skirtGeo = keep(new T.ExtrudeGeometry(rounded(1.02, 0.84, 0.36), { depth: 0.16, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 3, curveSegments: 10 }));
  skirtGeo.rotateX(-Math.PI / 2);
  const bodyGeo = keep(new T.ExtrudeGeometry(rounded(0.86, 0.68, 0.28), { depth: 0.24, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 4, curveSegments: 12 }));
  bodyGeo.rotateX(-Math.PI / 2);
  const headGeo = keep(new T.SphereGeometry(0.13, 18, 14));
  const hairGeo = keep(new T.SphereGeometry(0.135, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2));
  const seatGeo = keep(new T.BoxGeometry(0.12, 0.34, 0.5));
  const wheelGeo = keep(new T.TorusGeometry(0.09, 0.018, 8, 20));
  const lampGeo = keep(new T.SphereGeometry(0.05, 10, 8));
  const poleGeo = keep(new T.CylinderGeometry(0.018, 0.018, 1.3, 8));
  const balloonGeo = keep(new T.SphereGeometry(0.22, 20, 16)); balloonGeo.scale(1, 1.18, 1);
  const strMat = keep(new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
  const glow = tex((c, w, h) => { const gr = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,220,1)'); gr.addColorStop(0.3, 'rgba(255,220,120,.7)'); gr.addColorStop(1, 'rgba(255,200,80,0)'); c.fillStyle = gr; c.fillRect(0, 0, w, h); }, 64, 64);
  const glowMat = keep(new T.SpriteMaterial({ map: glow, blending: T.AdditiveBlending, depthWrite: false, transparent: true }));
  const views = {};
  const label = (text, color) => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const x = c.getContext('2d');
    x.font = '800 58px ' + getComputedStyle(document.body).fontFamily;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    const w = Math.min(500, x.measureText(text).width + 60);
    x.fillStyle = 'rgba(20,16,32,.78)';
    x.beginPath(); if (x.roundRect) x.roundRect(256 - w / 2, 18, w, 92, 46); else x.rect(256 - w / 2, 18, w, 92); x.fill();
    x.fillStyle = color; x.fillRect(256 - w / 2 + 26, 50, 22, 28);
    x.fillStyle = '#fff'; x.fillText(text, 256 + 14, 66);
    const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace;
    const sp = new T.Sprite(new T.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
    sp.scale.set(2.8, 0.7, 1);
    sp.renderOrder = 10;
    return sp;
  };
  const makeCar = (c) => {
    const color = bmpColorOf(Room.state, c.id);
    const grp = new T.Group();
    const body = new T.Group();
    grp.add(body);
    const paint = new T.MeshPhysicalMaterial({ color, roughness: 0.28, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.1, transparent: true });
    const skirt = new T.Mesh(skirtGeo, rubberMat); skirt.position.y = 0.06; skirt.castShadow = true; body.add(skirt);
    const shell = new T.Mesh(bodyGeo, paint); shell.position.y = 0.24; shell.castShadow = true; body.add(shell);
    const seat = new T.Mesh(seatGeo, seatMat); seat.position.set(-0.2, 0.66, 0); seat.castShadow = true; body.add(seat);
    const head = new T.Mesh(headGeo, skinMat); head.position.set(-0.05, 0.84, 0); head.castShadow = true; body.add(head);
    const hair = new T.Mesh(hairGeo, hairMat); hair.position.copy(head.position); hair.position.y += 0.02; body.add(hair);
    const wheel = new T.Mesh(wheelGeo, chromeMat); wheel.position.set(0.16, 0.66, 0); wheel.rotation.y = Math.PI / 2; wheel.rotation.x = 0.5; body.add(wheel);
    [-0.2, 0.2].forEach(z => { const l = new T.Mesh(lampGeo, lampMat); l.position.set(0.47, 0.42, z); body.add(l); });
    const pole = new T.Mesh(poleGeo, chromeMat); pole.position.set(-0.36, 1.05, 0); body.add(pole);
    const spark = new T.Sprite(glowMat.clone()); spark.position.set(-0.36, 1.72, 0); spark.scale.set(0.35, 0.35, 1); body.add(spark);
    const boost = new T.Sprite(glowMat); boost.position.set(-0.6, 0.35, 0); boost.scale.set(0.001, 0.001, 1); body.add(boost);
    const bl = [];
    let bm = null;
    if (balloons) {
      bm = new T.MeshPhysicalMaterial({ color, roughness: 0.2, clearcoat: 1, transparent: true, opacity: 0.95 });
      for (let i = 0; i < BMP_LIVES; i++) {
        const b = new T.Mesh(balloonGeo, bm);
        const z = (i - 1) * 0.3;
        b.position.set(-0.5, 1.4 + (i === 1 ? 0.18 : 0), z);
        b.castShadow = true;
        const sg = new T.BufferGeometry().setFromPoints([new T.Vector3(-0.42, 0.45, 0), new T.Vector3(-0.5, 1.16 + (i === 1 ? 0.18 : 0), z)]);
        const str = new T.Line(sg, strMat);
        grp.add(b); grp.add(str);
        // A car brought back after a reload (bmpTvRestore) has only the balloons it had left.
        bl.push({ b, str, sg, gone: i < BMP_LIVES - Math.max(0, Math.min(BMP_LIVES, c.lives)), popT: 0 });
      }
    }
    const lab = label(c.name + (c.bot ? ' 🤖' : ''), color);
    lab.position.set(0, balloons ? 2.35 : 2.0, 0);
    grp.add(lab);
    const horn = label('📯', color); horn.scale.set(1.3, 0.33, 1); horn.position.set(0.5, 1.5, 0); horn.visible = false; grp.add(horn);
    scene.add(grp);
    return { grp, body, paint, spark, boost, bl, bm, lab, horn, name: c.name };
  };
  const freeCar = (v) => {
    scene.remove(v.grp);
    v.paint.dispose(); v.spark.material.dispose();
    v.lab.material.map.dispose(); v.lab.material.dispose();
    v.horn.material.map.dispose(); v.horn.material.dispose();
    if (v.bm) v.bm.dispose();
    v.bl.forEach(x => x.sg.dispose());
  };
  // Sparks: one pool of points.
  const MAXP = 240;
  const pGeo = keep(new T.BufferGeometry());
  const pPos = new Float32Array(MAXP * 3);
  pGeo.setAttribute('position', new T.BufferAttribute(pPos, 3));
  const pts = new T.Points(pGeo, keep(new T.PointsMaterial({ color: 0xffe066, size: 0.12, map: glow, blending: T.AdditiveBlending, depthWrite: false, transparent: true })));
  pts.frustumCulled = false;
  scene.add(pts);
  const confetti = [];                     // balloon bits
  const bitGeo = keep(new T.PlaneGeometry(0.08, 0.05));

  const fit = () => {
    const box = stage.getBoundingClientRect();
    const w = Math.max(1, Math.floor(box.width)), h = Math.max(1, Math.floor(box.height));
    if (overlay.width !== w || overlay.height !== h) {
      renderer.setSize(w, h, false);
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      overlay.width = w; overlay.height = h;
      overlay.style.width = w + 'px'; overlay.style.height = h + 'px';
      cam.aspect = w / h;
      // The whole rink in view, seen from the near long side at an angle.
      const half = ring ? 6.6 : ballMode ? 9.7 : 9.2, halfD = ring ? 6.2 : 5.2;
      const vf = cam.fov * Math.PI / 180;
      const hf = 2 * Math.atan(Math.tan(vf / 2) * cam.aspect);
      const dist = Math.max(half / Math.tan(hf / 2), halfD * 1.2 / Math.tan(vf / 2)) * 0.87;
      const el = 56 * Math.PI / 180;
      cam.position.set(0, Math.sin(el) * dist, Math.cos(el) * dist);
      cam.lookAt(0, 0, 0.45);
      cam.updateProjectionMatrix();
    }
  };
  const t0 = performance.now();
  // A screen that can't keep up draws fewer pixels and plainer shadows (JS_Three.html).
  const tune = threeGfxTuner(T, renderer, scene, [sun]);

  return {
    el: wrap,
    remove(id) { const v = views[id]; if (v) { freeCar(v); delete views[id]; } },
    popBalloon(car) {
      const v = views[car.id];
      if (!v) return;
      const b = v.bl.find(x => !x.gone);
      if (!b) return;
      b.gone = true; b.popT = 0.001;
      const wp = new T.Vector3(); b.b.getWorldPosition(wp);
      for (let i = 0; i < 14; i++) {
        const m = new T.Mesh(bitGeo, b.b.material);
        m.position.copy(wp);
        m.userData = { vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2.5 + 0.5, vz: (Math.random() - 0.5) * 3, t: 0.9, spin: Math.random() * 10 };
        scene.add(m); confetti.push(m);
      }
    },
    dispose() {
      Object.values(views).forEach(freeCar);
      disposables.forEach(o => { try { o.dispose(); } catch (e) {} });
      renderer.dispose();
      try { renderer.forceContextLoss(); } catch (e) {}
      wrap.remove();
    },
    draw(state, now) {
      fit();
      const tt = (performance.now() - t0) / 1000;
      party.forEach((l, i) => { const a = tt * 0.5 + i * Math.PI; l.position.set(Math.cos(a) * 6, 4, Math.sin(a) * 3.5); });
      Object.values(g.cars).forEach(c => {
        let v = views[c.id];
        if (!v || v.name !== c.name) { if (v) freeCar(v); v = views[c.id] = makeCar(c); }
        const faded = c.ghost || c.out;
        v.paint.opacity = faded ? 0.35 : 1;
        v.paint.color.set(c.flash > 0 ? 0xffffff : bmpColorOf(state, c.id));
        let y = 0, rx = 0, rz = 0;
        let x = c.x, z = c.y;
        if (c.fall) {
          // Off the edge: it slides on out and drops into the pit, tumbling.
          const f = c.fall.t;
          x = c.fall.x + c.fall.vx * Math.min(f, 0.5) * 0.6; z = c.fall.y + c.fall.vy * Math.min(f, 0.5) * 0.6;
          y = -Math.min(1.35, 4.9 * f * f);
          rx = Math.min(1.2, f * 2.2); rz = Math.min(0.8, f * 1.4);
        }
        v.grp.position.set(W(x), y, Z(z));
        v.body.rotation.set(rx, -c.h, rz);
        v.grp.visible = !(c.out && c.fall && c.fall.t > 1.2);
        // A car just back on the ring blinks.
        if (!c.fall && Date.now() < c.safeUntil && g.st.mode === 'ring') v.grp.visible = Math.floor(tt * 8) % 2 === 0;
        v.spark.material.opacity = 0.6 + 0.4 * Math.random();
        const bAge = Date.now() - c.boostFx;
        const bs = bAge < 600 ? (1 - bAge / 600) * 0.9 : 0.001;
        v.boost.scale.set(bs, bs * 0.6, 1);
        v.horn.visible = Date.now() - c.hornFx < 700;
        v.bl.forEach((b, i) => {
          if (b.gone) {
            if (b.popT > 0 && b.popT < 0.2) { b.popT += 1 / 60; const s = 1 + b.popT * 4; b.b.scale.set(s, s, s); }
            else { b.b.visible = false; b.str.visible = false; }
          } else {
            b.b.position.y = 1.4 + (i === 1 ? 0.18 : 0) + Math.sin(tt * 2 + i) * 0.04;
          }
        });
      });
      if (ballMesh && g.ball) {
        // The ball rolls: turned about the axis across its way, by how far it went.
        const b = g.ball;
        const bx = W(b.x), bz = Z(b.y);
        const lx = ballMesh.position.x, lz = ballMesh.position.z;
        const mx = bx - lx, mz = bz - lz, dist = Math.hypot(mx, mz);
        if (dist > 0.0005 && dist < 3) {
          const q = new T.Quaternion().setFromAxisAngle(new T.Vector3(mz / dist, 0, -mx / dist), dist / (BMP_BALL_R / 100));
          ballMesh.quaternion.premultiply(q);
        }
        ballMesh.position.set(bx, BMP_BALL_R / 100, bz);
        // The net that took it shakes.
        nets.forEach(x => {
          const age = g.net && g.net.side === x.side ? (performance.now() - g.net.t) / 1000 : 9;
          x.net.position.x = age < 0.8 && !motionOff() ? Math.sin(age * 28) * 0.12 * (1 - age / 0.8) * (x.side === 'left' ? -1 : 1) : 0;
        });
      }
      // Sparks and balloon bits.
      let n = 0;
      g.sparks.forEach(p => { if (n >= MAXP) return; pPos[n * 3] = W(p.x += p.vx / 60); pPos[n * 3 + 1] = 0.45 + (0.45 - p.t) * 1.2; pPos[n * 3 + 2] = Z(p.y += p.vy / 60); n++; });
      pGeo.setDrawRange(0, n);
      pGeo.attributes.position.needsUpdate = true;
      for (let i = confetti.length - 1; i >= 0; i--) {
        const m = confetti[i], u = m.userData;
        u.t -= 1 / 60; u.vy -= 6 / 60;
        m.position.x += u.vx / 60; m.position.y += u.vy / 60; m.position.z += u.vz / 60;
        m.rotation.x += u.spin / 60; m.rotation.y += u.spin / 90;
        if (u.t <= 0) { scene.remove(m); confetti.splice(i, 1); }
      }
      tune.frame(performance.now(), true);
      renderer.render(scene, cam);
      // The countdown and the end, and a +1 over the scorer, on the overlay.
      const ox = overlay.getContext('2d');
      ox.direction = 'ltr';
      ox.clearRect(0, 0, overlay.width, overlay.height);
      g.pops.forEach(p => {
        const wp = new T.Vector3(W(p.x), 2.3 + (0.9 - p.t) * 0.8, Z(p.y)).project(cam);
        const sx = (wp.x + 1) / 2 * overlay.width, sy = (1 - wp.y) / 2 * overlay.height;
        ox.globalAlpha = Math.min(1, p.t / 0.4);
        ox.font = '900 ' + Math.round(overlay.height / 16) + 'px ' + getComputedStyle(document.body).fontFamily;
        ox.textAlign = 'center'; ox.lineWidth = 6; ox.strokeStyle = '#1b1b1f'; ox.fillStyle = p.color;
        const txt = p.text || '+1';
        ox.strokeText(txt, sx, sy); ox.fillText(txt, sx, sy);
      });
      ox.globalAlpha = 1;
      bmpOverlayText(ox, state, now, overlay.width, overlay.height, overlay.height / 900);
    }
  };
}
</script>
