<script>
/* ============================================================================
   خيوط — THEMED WORD SEARCH
   ----------------------------------------------------------------------------
   A grid of letters and a theme ("حيوانات المزرعة"). The theme's words are
   hidden in straight lines; drag across one from its first letter to its last
   (either way round) to find it. The list shows how long each word is, and a
   hint gives away a word's first letter.

   The themes and words are CHAMELEON_DB's (kinds of things, sixteen words
   each), in the games' language. The grid is made in Strands.js (shared with
   the rooms server, which deals a race's grid and judges every line traced):
   easy 7×7 with 5 words, medium 8×8 with 6, hard 9×9 with 8; the daily is
   medium from the seed. The board is in appState.strands.

   In سباق ألغاز (RACE_UI.strands, JS_RoomRace.html) the same grid and drag
   play the room's puzzle: the words are on the server, so every traced line
   is sent (`move { cells }`) and the words found come back and land in their
   slots with the same flight. No hint in a race.

   «من كلماتنا» (the owner, 2 Oct 2026): the setup's «الكلمات» switch deals
   the family's words instead (s.source 'pack'): a word pack on this phone
   (packWordPacks, JS_PackStore.html: the own «كلماتنا» and the crews') or one
   opened by its 6-letter code (packFetch; kept in s.codePack, not as the
   phone's own pack). strandsPackMake hides the words of 3-8 letters in the
   grid's alphabet (the one most of them are written in, so English packs
   play in English); «الخيط الملوّن» (span: true, its own colour) is the
   pack's name when it is one word that fits, else its longest word; too
   few, and a theme of the app's bank tops it up (ours: true, «من عندنا» on
   its slot). Never the daily, and no best kept (every family's grid is its
   own).
   ========================================================================= */

let strandsTimer = null;
let strandsDrag = null;

function strandsState() {
  const race = soloRaceState('strands');
  if (race) return race;
  if (!appState.strands) {
    appState.strands = { level: 'easy', daily: '', lang: 'ar', size: 7, theme: '', icon: '', grid: [], words: [], found: [], hints: [], startedAt: 0, pausedAt: 0, phase: 'setup' };
  }
  return appState.strands;
}

/* --- Setup and play --------------------------------------------------------------- */

function setupStrands() {
  strandsStopTimer();
  setView('setup-strands');
}

function paintStrandsSetup() {
  const s = strandsState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#strands-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const fromPack = s.source === 'pack';
  document.querySelectorAll('#strands-source .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === (fromPack ? 'pack' : 'app')));
  strandsPaintPack();
  const best = fromPack ? null : soloBest('strands', s.level);
  const el = document.getElementById('strands-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('strands-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('strands-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('strands', 'startStrands(true)');
}

function setStrandsLevel(level) {
  strandsState().level = level;
  saveToLocal();
  paintStrandsSetup();
}

/* --- «من كلماتنا»: the family's words as the words to find ---------------------------- */

/* The game's own words, here in its chunk rather than the shell's TRANSLATIONS (the shell's
   budget; notes/lazy-load.md, *The budget was full*). */
const STRANDS_TEXT = {
  ar: {
    theme_label: "الموضوع",
    found: "لقيت",
    done: "لقيت كل الكلمات! 🧵",
    label: "أنهي كلمات؟",
    none: "مفيش «كلماتنا» على الموبايل ده. افتحها بكودها، أو اعملها من الأدوات.",
    code: "أو افتح كلمات بكودها",
    make: "✍️ اعمل كلماتنا",
    hint: "الكلمات اللي من 3 لـ 8 حروف بتستخبى في الشبكة، والأطول بتتشال. لو مش كفاية بنكمّل بكلمات من عندنا.",
    opened: "اتفتحت: {t}",
    notwords: "الكود ده لمسابقة، مش كلمات",
    offline: "مش متصل بالنت، جرّب تاني لما يرجع",
    few: "مفيش كلمات كفاية تنفع في الشبكة دي",
    span: "الخيط الملوّن",
    ours: "من عندنا",
    theme: "كلمات العيلة"
  },
  en: {
    theme_label: "Theme",
    found: "Found",
    done: "Every word found! 🧵",
    label: "Which words?",
    none: "No «Our words» on this phone. Open them by their code, or make them in Tools.",
    code: "Or open words by their code",
    make: "✍️ Make our words",
    hint: "Words of 3 to 8 letters are hidden in the grid; longer ones are left out. Too few, and we top up with words of ours.",
    opened: "Opened: {t}",
    notwords: "That code is a quiz, not words",
    offline: "Not online, try again when you are",
    few: "Not enough words that fit in this grid",
    span: "The coloured thread",
    ours: "From us",
    theme: "The family's words"
  }
};
const strandsT = () => STRANDS_TEXT[appState.lang] || STRANDS_TEXT.ar;

const STRANDS_PACK_MIN = 3, STRANDS_PACK_MAX = 8;   // letters a family word may have to be hidden
const STRANDS_PACK_OWN = 2;                          // family words (the thread among them) a grid needs at least

function setStrandsSource(source) {
  strandsState().source = source === 'pack' ? 'pack' : 'app';
  saveToLocal();
  paintStrandsSetup();
}

/** Every word pack the setup offers: this phone's (its own and its crews'), then the one opened by code. */
function strandsPackList() {
  const s = strandsState();
  const out = (typeof packWordPacks === 'function' ? packWordPacks() : []).map(p => ({ id: p.id, code: p.code, title: p.title, name: p.name, words: p.words }));
  const cp = s.codePack;
  if (cp && cp.code && Array.isArray(cp.words) && !out.some(p => p.code === cp.code)) {
    out.push({ id: 'code:' + cp.code, code: cp.code, title: cp.title || '', name: '✍️ ' + (cp.title || '') + ' · ' + cp.code, words: cp.words });
  }
  return out;
}

function strandsPackPicked() {
  const list = strandsPackList();
  return list.find(p => p.id === strandsState().packId) || list[0] || null;
}

function setStrandsPack(id) {
  strandsState().packId = String(id || '');
  saveToLocal();
}

/** The «من كلماتنا» panel: the packs as a list, a code to open, and what fits. */
function strandsPaintPack() {
  const box = document.getElementById('strands-pack');
  if (!box) return;
  const s = strandsState();
  const t = TRANSLATIONS[appState.lang] || {};
  box.classList.toggle('hidden', s.source !== 'pack');
  if (s.source !== 'pack') return;
  const typed = (document.getElementById('strands-pack-code') || {}).value || '';
  const list = strandsPackList();
  const pick = strandsPackPicked();
  box.innerHTML = `
    ${list.length ? `
      <label class="field__label" for="strands-pack-pick">${escapeHTML(strandsT().label || '')}</label>
      <select id="strands-pack-pick" onchange="setStrandsPack(this.value)">
        ${list.map(p => `<option value="${escapeHTML(p.id)}" ${pick && p.id === pick.id ? 'selected' : ''}>${escapeHTML(p.name)} · ${p.words.length}</option>`).join('')}
      </select>` : `<p class="field__hint">${escapeHTML(strandsT().none || '')}</p>`}
    <label class="field__label" for="strands-pack-code">${escapeHTML(strandsT().code || '')}</label>
    <div class="input-group">
      <input type="text" id="strands-pack-code" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false"
             dir="ltr" class="qm-code-in" placeholder="${escapeHTML(t.qm_open_code_ph || '')}" value="${escapeHTML(typed)}"
             onkeydown="if(event.key==='Enter') strandsOpenCode()">
      <button type="button" class="btn btn--secondary btn--auto" onclick="strandsOpenCode()">${escapeHTML(t.qm_open_btn || '')}</button>
    </div>
    ${list.length ? '' : `<button type="button" class="btn btn--ghost btn--sm" onclick="catalogOpen('wordpack')">${escapeHTML(strandsT().make || '')}</button>`}
    <p class="field__hint">${escapeHTML(strandsT().hint || '')}</p>`;
}

/** A pack by its code: fetched (not made the phone's own «كلماتنا»), kept for this game, and picked. */
async function strandsOpenCode() {
  const s = strandsState();
  const t = TRANSLATIONS[appState.lang] || {};
  const input = document.getElementById('strands-pack-code');
  const code = packCode(input ? input.value : '');
  if (!PACK_CODE_RE.test(code)) { showToast(packErrorText('not_found'), 'error'); return; }
  const have = strandsPackList().find(p => p.code === code);
  if (have) {
    s.packId = have.id;
    if (input) input.value = '';
    saveToLocal();
    strandsPaintPack();
    return;
  }
  showToast(t.qm_opening || '', 'info');
  let got;
  try { got = await packFetch(code); } catch (e) {
    showToast(e.message === 'offline' ? (strandsT().offline || '') : packErrorText(e.message), 'error');
    return;
  }
  if (got.kind !== 'words' || !got.pack || !Array.isArray(got.pack.words)) { showToast(strandsT().notwords || '', 'error'); return; }
  const now = strandsState();
  now.codePack = { code: got.code, title: got.pack.title || '', words: got.pack.words.slice() };
  now.packId = 'code:' + got.code;
  now.source = 'pack';
  const field = document.getElementById('strands-pack-code');
  if (field) field.value = '';
  saveToLocal();
  showToast((strandsT().opened || '').replace('{t}', got.pack.title || ''), 'success');
  if (appState.currentView === 'setup-strands') paintStrandsSetup();
}

/**
 * A grid from a word pack: { size, lang, grid, words: [{ w, cells, span?, title?, ours?, label? }] } or null.
 * The thread (span) goes in first, then the family's words, then the bank's (ours) for the rest.
 */
function strandsPackMake(pack, level, rnd) {
  const L = STRANDS_LEVELS[level] || STRANDS_LEVELS.easy;
  const words = (pack.words || []).map(w => String(w || '').trim()).filter(Boolean);
  // The grid's alphabet is the one most of the family's words are written in.
  const arCount = words.filter(w => /[ء-ي]/.test(w)).length;
  const enCount = words.filter(w => /[A-Za-z]/.test(w)).length;
  const lang = enCount > arCount ? 'en' : 'ar';
  const re = lang === 'en' ? /^[A-Z]+$/ : /^[ء-ي]+$/;
  const fits = (w) => re.test(w) && w.length >= STRANDS_PACK_MIN && w.length <= STRANDS_PACK_MAX;
  const seen = new Set();
  let mine = [];
  // A found word is listed as the family wrote it (أحمد, not the grid's folded احمد).
  const shown = {};
  words.forEach(w => {
    const f = strandsFold(w, lang);
    if (fits(f) && !seen.has(f)) { seen.add(f); mine.push(f); shown[f] = w; }
  });
  // «الخيط الملوّن»: the pack's name when it is one word that fits, else its longest word.
  const title = strandsFold(String(pack.title || '').trim(), lang);
  let thread = null;
  if (fits(title)) {
    thread = { w: title, span: true, title: true, label: String(pack.title).trim() };
    seen.add(title);
    mine = mine.filter(w => w !== title);
  } else if (mine.length) {
    const longest = mine.reduce((a, b) => (b.length > a.length ? b : a));
    thread = { w: longest, span: true, label: shown[longest] };
    mine = mine.filter(w => w !== longest);
  }
  if (!thread || mine.length + 1 < STRANDS_PACK_OWN) return null;
  const size = Math.max(L.size, thread.w.length, ...mine.map(w => w.length));
  // The top-up: the app's own themes (freshPick, so they go round), never a word the family has.
  const bank = [];
  const db = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  const themes = freshPick('strands:ours:' + lang, db, Math.min(3, db.length), { key: th => th.category });
  themes.forEach(th => soloShuffle(th.words, rnd).forEach(w => {
    const f = strandsFold(w, lang);
    if (re.test(f) && f.length >= 3 && f.length <= size && !seen.has(f)) { seen.add(f); bank.push({ w: f, ours: true }); }
  }));
  const dirs = lang === 'en'
    ? [[0, 1], [1, 0], [1, 1]].concat(L.reverse ? [[0, -1], [-1, 0], [1, -1]] : [])
    : [[0, -1], [1, 0], [1, -1]].concat(L.reverse ? [[0, 1], [-1, 0], [1, 1]] : []);
  let fallback = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    const order = [thread].concat(soloShuffle(mine, rnd).map(w => ({ w: w, label: shown[w] })), bank);
    const grid = new Array(size * size).fill('');
    const placed = [];
    for (const item of order) {
      if (placed.length >= L.words) break;
      const w = item.w;
      const back = w.split('').reverse().join('');
      // A word inside another placed word (either way round) would be found twice.
      if (placed.some(p => p.w.indexOf(w) !== -1 || w.indexOf(p.w) !== -1 || p.w.indexOf(back) !== -1 || back.indexOf(p.w) !== -1)) continue;
      let cellsAt = null;
      const starts = soloShuffle(Array.from({ length: size * size }, (_, k) => k), rnd);
      for (const start of starts) {
        for (const [dr, dc] of soloShuffle(dirs, rnd)) {
          const r0 = Math.floor(start / size), c0 = start % size;
          const cells = [];
          let ok = true;
          for (let k = 0; k < w.length; k++) {
            const r = r0 + dr * k, c = c0 + dc * k;
            if (r < 0 || r >= size || c < 0 || c >= size) { ok = false; break; }
            const i = r * size + c;
            if (grid[i] && grid[i] !== w[k]) { ok = false; break; }
            cells.push(i);
          }
          if (ok) { cellsAt = cells; break; }
        }
        if (cellsAt) break;
      }
      if (!cellsAt) { if (item.span) break; continue; }
      cellsAt.forEach((i, k) => { grid[i] = w[k]; });
      placed.push(Object.assign({}, item, { cells: cellsAt }));
    }
    if (placed.length < L.words || !placed[0] || !placed[0].span) continue;
    if (placed.filter(p => !p.ours).length < STRANDS_PACK_OWN) continue;
    const letters = placed.map(p => p.w).join('').split('');
    const empty = [];
    for (let i = 0; i < grid.length; i++) if (!grid[i]) empty.push(i);
    let clean = false;
    for (let fill = 0; fill < 12 && !clean; fill++) {
      empty.forEach(i => { grid[i] = letters[Math.floor(rnd() * letters.length)]; });
      clean = placed.every(p => strandsCopies(grid, size, p.w) === 1);
    }
    const made = { size: size, lang: lang, grid: grid, words: placed };
    if (clean) return made;
    fallback = fallback || made;
  }
  return fallback;
}

function startStrandsPack(sure) {
  if (!sure && soloConfirmNew('strands', strandsHasWork, () => startStrandsPack(true))) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const s = strandsState();
  const pack = strandsPackPicked();
  if (!pack) { showToast(strandsT().none || '', 'error'); return; }
  const made = strandsPackMake(pack, s.level, soloRandom(null));
  if (!made) { showToast(strandsT().few || '', 'error'); return; }
  soloDailySetAside('strands');
  soloNewGame('strands');
  Object.assign(s, {
    // The theme names the pack, unless the pack's name is the thread itself: then it would give it away.
    daily: '', playLevel: s.level, lang: made.lang, size: made.size, icon: '✍️',
    theme: made.words[0].title ? (strandsT().theme || '') : (pack.title || t.wp_title_default || ''),
    grid: made.grid, words: made.words, found: [], hints: [], startedAt: Date.now(), pausedAt: 0, seconds: 0, phase: 'play',
    pack: { code: pack.code || '', title: pack.title || '' }
  });
  if (pack.code && typeof packPlayed === 'function') packPlayed(pack.code);
  saveToLocal();
  setView('play-strands');
  paintStrands();
  strandsArmTimer();
}

// A grid with a word found: a new one asks first (soloConfirmNew).
const strandsHasWork = (s) => (s.found || []).length > 0;

function startStrands(daily, sure) {
  if (!daily && strandsState().source === 'pack') { startStrandsPack(sure); return; }
  if (!sure && soloConfirmNew('strands', strandsHasWork, () => startStrands(daily, true))) return;
  if (daily && soloDailyResume('strands')) return;
  const s = strandsState();
  const level = daily ? 'medium' : s.level;
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  // The daily's theme walks the list (soloDailyCycle) from SOLO_CYCLE_FROM; a day before keeps its dice alone.
  const dayTheme = daily && soloToday() >= SOLO_CYCLE_FROM ? soloDailyCycle('strands:' + lang, CHAMELEON_DB[lang] || CHAMELEON_DB.ar) : null;
  let made = strandsMake(level, lang, soloRandom(daily ? soloDaySeed('strands:' + lang) : null), dayTheme);
  // A free grid that couldn't be made gets one more go with other dice.
  if (!made && !daily) made = strandsMake(level, lang, soloRandom(null));
  if (!made) { showToast((TRANSLATIONS[appState.lang] || {}).solo_make_failed || '', 'error'); return; }
  soloDailySetAside('strands');
  soloNewGame('strands');
  s.daily = daily ? soloToday() : '';
  s.pack = null;
  s.playLevel = level;
  s.lang = lang;
  s.size = made.size;
  s.theme = made.theme;
  s.icon = made.icon;
  s.grid = made.grid;
  s.words = made.words;
  s.found = [];
  s.hints = [];
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'play';
  saveToLocal();
  setView('play-strands');
  paintStrands();
  strandsArmTimer();
}

function continueStrands() {
  if (strandsState().phase !== 'play') return;
  setView('play-strands');
  paintStrands();
  strandsArmTimer();
}

function strandsArmTimer() {
  strandsStopTimer();
  strandsTimer = soloClock('strands-time', () => strandsState().startedAt);
}

function strandsStopTimer() {
  if (strandsTimer) strandsTimer.stop();
  strandsTimer = null;
}

/** How long a word is: in a race the words are on the server, only their lengths here. */
const strandsLen = (w) => (w.w ? w.w.length : (w.len || 0));

function paintStrands() {
  const s = strandsState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('strands-stage');
  if (!el || !s.grid.length) return;
  const foundCells = {};
  // «الخيط الملوّن» has its own colour (fs); the rest take the six in turn.
  s.found.forEach((wi, n) => (s.words[wi].cells || []).forEach(i => { foundCells[i] = (foundCells[i] || []).concat(s.words[wi].span ? 's' : n % 6); }));
  const bar = soloBarHtml([
    { label: strandsT().found || '', value: `${s.found.length}/${s.words.length}`, id: 'strands-count' },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.seconds), id: 'strands-time' }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="strands-grid" id="strands-grid" dir="ltr" style="--st-n:${s.size}">
          ${s.grid.map((ch, i) => `<div class="strands-cell${foundCells[i] ? ' is-found f' + foundCells[i][foundCells[i].length - 1] : ''}" data-i="${i}">${escapeHTML(ch)}</div>`).join('')}
        </div>
      </div>
      <div class="solo-layout__side">
        <div class="strands-theme"><span class="strands-theme__icon" aria-hidden="true">${s.icon || '🧵'}</span>
          <span><span class="eyebrow">${escapeHTML(strandsT().theme_label || '')}</span><b>${escapeHTML(s.theme)}</b></span>${s.daily ? ' <span class="badge">📅</span>' : ''}</div>
        ${bar}
        <div class="strands-words" id="strands-words">
          ${s.words.map((w, wi) => {
            const found = s.found.indexOf(wi) !== -1;
            const hinted = s.hints.indexOf(wi) !== -1;
            const tag = w.span ? `<span class="strands-word__tag">🧵 ${escapeHTML(strandsT().span || '')}</span>`
              : (w.ours ? `<span class="strands-word__tag">${escapeHTML(strandsT().ours || '')}</span>` : '');
            // A slot is a box a letter (1170); a hint fills the first box.
            const boxes = `<span class="strands-word__boxes" dir="${s.lang === 'en' ? 'ltr' : 'rtl'}">${hinted ? `<i class="is-hint">${escapeHTML(w.w[0])}</i>` : ''}${'<i></i>'.repeat(strandsLen(w) - (hinted ? 1 : 0))}</span>`;
            return `<span class="strands-word${found ? ' is-found' : ''}${w.span ? ' strands-word--span' : ''}${w.ours ? ' strands-word--ours' : ''}" data-w="${wi}">${tag}${found ? escapeHTML(w.label || w.w) : boxes}</span>`;
          }).join('')}
        </div>
        ${s.race ? '' : `<div class="sdk-tools">
          <button type="button" class="btn btn--neutral btn--sm" onclick="hintStrands()">💡 ${escapeHTML(t.solo_hint || '')}</button>
        </div>`}
      </div>
    </div>
    ${s.race ? '' : `<div class="view-actions play-foot">
      <button class="btn btn--ghost btn--sm btn--auto play-exit" onclick="${s.phase === 'play' ? 'playExit(setupStrands)' : 'setupStrands()'}">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
  strandsBind();
}

function strandsBind() {
  const grid = document.getElementById('strands-grid');
  if (!grid) return;
  grid.addEventListener('pointerdown', (e) => {
    const s = strandsState();
    const cell = e.target.closest('.strands-cell');
    if (!cell || s.phase !== 'play') return;
    e.preventDefault();
    strandsDrag = { start: Number(cell.dataset.i), cells: [Number(cell.dataset.i)] };
    strandsPaintDrag();
    const move = (ev) => {
      const over = soloCellAt(ev.clientX, ev.clientY, '.strands-cell');
      if (!over || !strandsDrag) return;
      const line = strandsLine(s.size, strandsDrag.start, Number(over.dataset.i));
      if (line) { strandsDrag.cells = line; strandsPaintDrag(); }
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      const d = strandsDrag;
      strandsDrag = null;
      strandsPaintDrag();
      if (d && d.cells.length >= 2) strandsTry(d.cells);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}

function strandsPaintDrag() {
  const cells = strandsDrag ? strandsDrag.cells : [];
  const on = new Set(cells);
  document.querySelectorAll('#strands-grid .strands-cell').forEach(c => c.classList.toggle('is-tracing', on.has(Number(c.dataset.i))));
  strandsPaintBand(cells);
}

/**
 * The line under the finger (1169): a thick rounded band in the accent from the first
 * cell to the last, under the letters, and the word so far in a bubble above the grid -
 * on a 9×9 at 375px the finger hides the letters it is on.
 */
function strandsPaintBand(cells) {
  const grid = document.getElementById('strands-grid');
  let bubble = document.getElementById('strands-bubble');
  let band = grid && grid.querySelector('.strands-band');
  const a = grid && cells.length ? grid.querySelector(`[data-i="${cells[0]}"]`) : null;
  const b = grid && cells.length ? grid.querySelector(`[data-i="${cells[cells.length - 1]}"]`) : null;
  if (!a || !b) {
    if (grid) grid.classList.remove('has-band');
    if (bubble) bubble.classList.add('hidden');
    return;
  }
  if (!band) {
    band = document.createElement('div');
    band.className = 'strands-band';
    band.setAttribute('aria-hidden', 'true');
    grid.appendChild(band);
  }
  const ax = a.offsetLeft + a.offsetWidth / 2, ay = a.offsetTop + a.offsetHeight / 2;
  const bx = b.offsetLeft + b.offsetWidth / 2, by = b.offsetTop + b.offsetHeight / 2;
  const h = a.offsetWidth * 0.86;
  band.style.width = (Math.hypot(bx - ax, by - ay) + h) + 'px';
  band.style.height = h + 'px';
  band.style.transformOrigin = (h / 2) + 'px 50%';
  band.style.transform = `translate(${ax - h / 2}px, ${ay - h / 2}px) rotate(${Math.atan2(by - ay, bx - ax)}rad)`;
  grid.classList.add('has-band');
  if (!bubble) {
    bubble = document.createElement('div');
    bubble.id = 'strands-bubble';
    bubble.className = 'strands-bubble hidden';
    bubble.setAttribute('aria-hidden', 'true');
    document.body.appendChild(bubble);
  }
  const s = strandsState();
  bubble.dir = s.lang === 'en' ? 'ltr' : 'rtl';
  bubble.textContent = cells.map(i => s.grid[i] || '').join('');
  bubble.classList.remove('hidden');
  const r = grid.getBoundingClientRect();
  bubble.style.left = (r.left + r.width / 2) + 'px';
  bubble.style.top = Math.max(r.top - 8, bubble.offsetHeight + 8) + 'px';
}

// The bubble lives under <body>: it never outlasts its screen.
if (typeof onLeaveScreen === 'function') onLeaveScreen(() => { const b = document.getElementById('strands-bubble'); if (b) b.classList.add('hidden'); });

/** A wrong line: the grid shakes. */
function strandsMiss() {
  const grid = document.getElementById('strands-grid');
  if (grid && grid.animate && !motionOff()) grid.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 240 });
}

function strandsTry(cells) {
  const s = strandsState();
  // A race: the words are on the server, which judges the line (JS_RoomRace.html).
  if (s.race) { raceMove('strands', { cells: cells }); return; }
  const hit = strandsTrace(s.grid, s.words, s.found, cells);
  if (!hit) { strandsMiss(); return; }
  strandsLand(hit.wi, hit.cells);
  if (s.found.length === s.words.length) strandsFinish();
}

/**
 * A word found lands in its place in the list: the letters fly from the grid
 * (where it was traced, in reading order) into the slot. The state is written
 * here too, so a race's found word (told by the server) lands the same way.
 */
function strandsLand(wi, cells, word) {
  const s = strandsState();
  if (word) s.words[wi].w = word;
  s.words[wi].cells = cells.slice();
  if (s.found.indexOf(wi) === -1) s.found.push(wi);
  saveToLocal();
  playSound('success');
  haptic('light');
  const from = cells.map(i => document.querySelector(`#strands-grid [data-i="${i}"]`)).filter(Boolean);
  const rects = from.map(c => c.getBoundingClientRect());
  paintStrands();
  const slot = document.querySelector(`#strands-words [data-w="${wi}"]`);
  if (slot && rects.length && !motionOff() && document.body.animate) {
    const to = slot.getBoundingClientRect();
    slot.classList.add('motion-waiting');
    rects.forEach((r, k) => {
      const ghost = document.createElement('span');
      ghost.className = 'strands-ghost';
      ghost.textContent = s.grid[cells[k]];
      ghost.style.left = r.left + 'px';
      ghost.style.top = r.top + 'px';
      ghost.style.width = r.width + 'px';
      ghost.style.height = r.height + 'px';
      document.body.appendChild(ghost);
      const dx = to.left + to.width / 2 - (r.left + r.width / 2);
      const dy = to.top + to.height / 2 - (r.top + r.height / 2);
      const a = ghost.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(0.5)`, opacity: 0.2 }],
                              { duration: 520, delay: k * 35, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });
      const done = () => ghost.remove();
      a.onfinish = done;
      setTimeout(done, 1400);
    });
    setTimeout(() => {
      slot.classList.remove('motion-waiting', 'motion-landed');
      void slot.offsetWidth;
      slot.classList.add('motion-landed');
    }, 520 + rects.length * 35);
  }
}

function hintStrands() {
  const s = strandsState();
  if (s.phase !== 'play' || s.race) return;
  const wi = s.words.findIndex((w, k) => s.found.indexOf(k) === -1 && s.hints.indexOf(k) === -1);
  if (wi === -1) return;
  s.hints.push(wi);
  saveToLocal();
  paintStrands();
  const first = document.querySelector(`#strands-grid [data-i="${s.words[wi].cells[0]}"]`);
  if (first && first.animate && !motionOff()) first.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 500, iterations: 2 });
}

function strandsFinish() {
  const s = strandsState();
  const t = TRANSLATIONS[appState.lang];
  strandsStopTimer();
  s.phase = 'done';
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  saveToLocal();
  const level = s.playLevel || s.level;
  // A family's grid («من كلماتنا») keeps no best: every pack is its own puzzle.
  const rec = s.pack ? { record: false, prev: null }
    : s.hints.length || s.archive ? { record: false, prev: soloBest('strands', level) }
    : soloRecord('strands', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('strands', { seconds: seconds, hints: s.hints.length }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🧵 ${t.setup_strands || ''} ✅ ${soloTime(seconds)}${s.hints.length ? ' · 💡 ' + s.hints.length : ''}`;
  }
  const lines = [`${s.icon || ''} <b>${escapeHTML(s.theme)}</b>`];
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  const shareLines = s.daily ? lines.slice(1) : lines;   // a daily's picture never names the theme
  soloLater('strands', motionOff() ? 0 : 900, () => soloResult({
    icon: '🧵', title: rec.record ? (t.solo_new_best || '') : (strandsT().done || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, shareLines: shareLines, win: true, share: share,
    again: () => startStrands(false), exit: setupStrands
  }));
}

function restoreStrands() {
  const s = strandsState();
  if (s.phase !== 'play' || !s.grid.length) return false;
  paintStrands();
  strandsArmTimer();
  return true;
}

soloRegister('strands', {
  setup: 'setup-strands', play: 'play-strands', paintSetup: paintStrandsSetup, restore: restoreStrands,
  state: strandsState, resume: continueStrands, repaint: paintStrands, timed: true, prefs: ['level', 'source', 'packId', 'codePack']
});

/* --- سباق ألغاز: the same grid, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.strands = {
  stage: 'strands-stage',
  unit: 'race_unit_words',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', lang: pub.lang, size: pub.size, theme: pub.theme, icon: pub.icon,
    grid: pub.grid.slice(), words: pub.lens.map(len => ({ w: '', len: len, cells: [] })), found: [], hints: [], seconds: 0 }),
  // The words the server says this phone has found: a new one lands with its flight (a reload
  // draws them settled); a line that found nothing (snapshot unchanged after the move) shakes the grid.
  sync(s, board, fx) {
    const found = (board && board.found) || [];
    const fresh = found.filter(f => s.found.indexOf(f.wi) === -1);
    if (!fresh.length) return;
    fresh.forEach(f => {
      if (fx && fx.first) { s.words[f.wi].w = f.w; s.words[f.wi].cells = f.cells.slice(); s.found.push(f.wi); }
      else strandsLand(f.wi, f.cells, f.w);
    });
    if (fx && fx.first) paintStrands();
  },
  snapshot: (s) => s.found.length,
  miss: () => strandsMiss(),
  paint: () => paintStrands(),
  finished: () => 0,
  revealHtml: (r) => (r && r.words ? `<div class="strands-theme"><span class="strands-theme__icon" aria-hidden="true">${r.icon || '🧵'}</span><b>${escapeHTML(r.theme || '')}</b></div>
    <div class="strands-words">${r.words.map(w => `<span class="strands-word is-found">${escapeHTML(w)}</span>`).join('')}</div>` : '')
};
</script>
