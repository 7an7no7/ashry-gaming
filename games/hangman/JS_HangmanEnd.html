    bounce: (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; }

        if (t > a0 + 420 && t < a0 + 700) { p.face = 'o'; p.head = osc(t, 120, 8); }
      });
      if (t > 1200) p.face = 'flat';
      p.rope = t < 1700 ? 14 : K(t, [[1700, 14], [1850, 5, 'out']]);
      if (t >= 1700) {
        p.ox = 80; p.oy = 64; p.face = 'sulk';
        p.y = K(t, [[1700, 0], [2000, 37, 'in2'], [2090, 34, 'out'], [2170, 37, 'in2']]);
        const lg = K(t, [[1800, 0], [2000, -84, 'out']]); p.ll = lg; p.lr = lg + 6;
        // He wipes his face with one sleeve, then crosses his arms.
        p.ar = t < 2500 ? K(t, [[2050, 0], [2250, -125]]) + osc(t, 220, 10) * W(t, 2250, 2350) : K(t, [[2500, -125], [2700, 62]]);
        p.al = K(t, [[2450, 0], [2700, -62]]);
      }
    } },
  { D: 3200,
    back: `<ellipse data-k="hole" cx="80" cy="122" rx="0" ry="4.6" fill="#1b1726"/>
      <g data-k="peek" style="opacity:0"><ellipse cx="76" cy="120" rx="2.2" ry="1.7" fill="#fff"/><ellipse cx="84" cy="120" rx="2.2" ry="1.7" fill="#fff"/><circle data-k="pk1" cx="76.4" cy="120.3" r="0.95" fill="#1b1726"/><circle data-k="pk2" cx="84.4" cy="120.3" r="0.95" fill="#1b1726"/></g>`,
    front: `<rect x="-10" y="122.6" width="190" height="20" fill="var(--surface-solid)"/><path data-k="lip" d="M54 122.6 Q80 128.5 106 122.6" stroke="#4a4458" stroke-width="2" fill="none" style="opacity:0"/>
      <g data-k="wave" style="opacity:0"><path d="M95 124 L95 106" stroke="var(--hm-ink)" stroke-width="7" stroke-linecap="round"/><path d="M95 124 L95 106" stroke="var(--accent, #e8641b)" stroke-width="4.4" stroke-linecap="round"/><circle cx="95" cy="103" r="3.8" class="hm-skin hm-ink"/></g>`
      + puff('h1') + puff('h2') + puff('h3'),
    says: [[2000, 3000, 'l8a', [118, 96], 'o']],
    u(t, p, P) {
      // The rope snaps, a hole opens under him and he sinks right into the floor; then his eyes blink in
      // the dark of the hole and one hand comes up out of it and waves.
      hang(t, p, 450, 'o');
      p.rope = t < 450 ? 14 : K(t, [[450, 14], [600, 5, 'out']]);
      const open = K(t, [[450, 0], [750, 26, 'back']]);
      P.hole.setAttribute('rx', open.toFixed(2)); op(P.lip, open > 2 ? 1 : 0);
      if (t >= 450) {
        p.ox = 80; p.oy = 64; p.face = 'o';
        p.y = K(t, [[450, 0], [800, 18, 'in2'], [1300, 125, 'in2']]);
        p.ll = 0; p.lr = 0; p.al = K(t, [[450, 0], [700, -150]]); p.ar = K(t, [[450, 0], [700, 150]]);
      }
      puffs(t, [P.h1, P.h2, P.h3], 800, 1400, 300, () => [80, 119], [0, -9]);
      const pk = W(t, 1450, 1650); op(P.peek, pk);
      const blink = t > 1700 && (t % 1500) < 130 ? 0.1 : 1;
      tf(P.peek, `translate(80 120) scale(1 ${blink}) translate(-80 -120)`);
      const look = t > 1700 ? osc(t, 1800, 0.9) : 0;
      tf(P.pk1, `translate(${look.toFixed(2)} 0)`); tf(P.pk2, `translate(${look.toFixed(2)} 0)`);
      const up = K(t, [[1700, 22], [1950, 0, 'back']]);
      tf(P.wave, `translate(0 ${up.toFixed(2)}) rotate(${(t > 1950 ? osc(t - 1950, 520, 22) : 0).toFixed(2)} 95 122)`);
      op(P.wave, t > 1700 ? 1 : 0);
    } }
  ];

  const defOf = (kind, id) => (kind === 'won' ? WINS : LOSSES)[Math.max(0, Math.min(7, Number(id) || 0))];
  const ALL_ON = ['head', 'body', 'armL', 'handL', 'armR', 'handR', 'legL', 'legR'];

  /** A leaving ending's last frame (the owner, 3 Oct 2026): the rope he was cut from, frayed, swinging. */
  const CUT = '<g class="hme-cut" style="display:none"><path d="M80 10 V22" stroke="#b08a52" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M78.4 22 l-1.4 3.2 M80 22 v3.6 M81.6 22 l1.4 3.2" stroke="#b08a52" stroke-width="1.3" stroke-linecap="round" fill="none"/></g>';

  /** The markup: the gallows, the man with the pieces in `o.on`, the ending's props, his bubble. */
  function svg(kind, id, o) {
    const opt = o || {};
    const def = defOf(kind, id);
    const words = (s) => String(s || '').replace(/\{\{(\w+)\}\}/g, (m, k) => escapeHTML(hmT('hm_end_' + k)));
    const on = Array.isArray(opt.on) ? opt.on : ALL_ON;
    return `<svg class="hme-svg ${opt.cls || ''}" viewBox="-10 -20 190 160" aria-hidden="true" focusable="false" data-hme="${kind === 'won' ? 'w' : 'l'}${Number(id) || 0}"
        data-hme-key="${escapeHTML(opt.key || '')}" data-hme-play="${opt.play ? 1 : ''}" data-hme-on="${on.join(' ')}">
        <path class="hme-floor" d="M-10 122.5 H180"/>${words(def.back)}${GALLOWS}${def.leave ? CUT : ''}${manSvg({ head: words(def.head), body: words(def.body) }, on)}${words(def.front)}${def.leave ? `<g class="hme-trace" style="opacity:0">${def.trace}</g>` : ''}${opt.mini ? '' : BUBBLE}</svg>`;
  }

  /* --- bringing one to life --- */
  const starts = {};        // key -> when its ending began (Date.now), so a redraw carries on
  const running = [];
  const idling = [];        // endings over, still on the screen: the last frame keeps living (idle)
  let raf = 0;

  function rig(el) {
    const q = (s) => el.querySelector(s);
    const m = /^([wl])(\d)$/.exec(el.getAttribute('data-hme') || '') || [0, 'w', '0'];
    const def = defOf(m[1] === 'w' ? 'won' : 'lost', Number(m[2]));
    const c = {
      el, def, face: null, bubText: null, bubW: 0, on: (el.getAttribute('data-hme-on') || '').split(' '),
      fig: q('.m-fig'), lean: q('.m-lean'), bend: q('.m-bend'), headG: q('.m-head'), armL: q('.m-armL'), armR: q('.m-armR'), legL: q('.m-legL'), legR: q('.m-legR'),
      rope: q('[data-g="rope"]'), eyes: Array.from(el.querySelectorAll('.m-eyes')), faces: Array.from(el.querySelectorAll('[data-f]')),
      bub: q('.m-bub'), bubBox: q('.hme-bub-box'), bubT: q('.hme-bub-t'), P: {}, G: {}
    };
    el.querySelectorAll('[data-k]').forEach((n) => { c.P[n.getAttribute('data-k')] = n; });
    // What must not outlive the ending (dust, feathers): faded over its last moment, never frozen in the air.
    c.fade = Array.from(el.querySelectorAll('[data-k]')).filter((n) => n.getAttribute('fill') === 'var(--hm-dust)' || /^fe\d/.test(n.getAttribute('data-k')));
    c.trace = q('.hme-trace'); c.cut = q('.hme-cut');
    el.querySelectorAll('[data-g]').forEach((n) => { c.G[n.getAttribute('data-g')] = n; });
    return c;
  }
  function setFace(c, face) {
    if (c.face === face) return; c.face = face;
    c.faces.forEach((n) => { n.style.display = n.getAttribute('data-f').split(' ').indexOf(face) !== -1 ? '' : 'none'; });
  }
  function say(c, text, k, at) {
    if (!c.bub) return;
    if (!text || k <= 0) { c.bub.style.display = 'none'; return; }
    c.bub.style.display = '';
    if (c.bubText !== text || !c.bubW) {
      c.bubT.textContent = text; c.bubText = text;
      let w = 0; try { w = c.bubT.getComputedTextLength(); } catch (e) { w = 0; }
      c.bubW = (w || text.length * 4.6) + 12;
      const hw = c.bubW / 2, h = 15;
      c.bubBox.setAttribute('d', `M${-hw + 4} ${-h - 5} H${hw - 4} a4 4 0 0 1 4 4 V-9 a4 4 0 0 1 -4 4 H4 L0 0 L-3 -5 H${-hw + 4} a4 4 0 0 1 -4 -4 V${-h - 1} a4 4 0 0 1 4 -4z`);
      c.bubT.setAttribute('y', (-h / 2 - 2.2).toFixed(1));
    }
    const hw = c.bubW / 2;
    const x = clamp(at[0], -10 + hw + 2, 180 - hw - 2), y = clamp(at[1], -20 + 22, 140);
    c.bubT.setAttribute('x', 0);
    tf(c.bub, `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${k.toFixed(3)})`);
  }
  /** One frame at `tt` ms into the ending (its length is the last frame). */
  function draw(c, tt, live) {
    const d = c.def;
    const p = pose0();
    c.G.rope.style.display = '';
    d.u(tt, p, c.P, c);
    // The leftovers fade out over the last 320 ms; a leaving ending's trace and cut rope fade in.
    const fade = 1 - W(tt, d.D - 320, d.D);
    if (fade < 1) c.fade.forEach((n) => { const o = n.style.opacity === '' ? 1 : Number(n.style.opacity) || 0; n.style.opacity = (o * fade).toFixed(3); });
    if (d.leave) {
      const k = W(tt, d.D - 450, d.D);
      op(c.trace, k);
      if (c.cut) c.cut.style.display = k > 0 ? '' : 'none';
      if (k > 0) p.rope = null;
    }
    c.fig.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${p.r.toFixed(2)} ${p.ox} ${p.oy}) translate(80 105) scale(${(p.sx * p.fx).toFixed(3)} ${p.sy.toFixed(3)}) translate(-80 -105)`);
    if (p.sw) c.fig.setAttribute('transform', `rotate(${p.sw.toFixed(2)} ${p.swx} ${p.swy}) ` + c.fig.getAttribute('transform'));
    tf(c.lean, `rotate(${p.lean.toFixed(2)} 80 78)`); tf(c.bend, `rotate(${p.bend.toFixed(2)} 80 76)`);
    tf(c.headG, `rotate(${p.head.toFixed(2)} 80 44)`);
    tf(c.armL, `rotate(${p.al.toFixed(2)} 74 52)`); tf(c.armR, `rotate(${p.ar.toFixed(2)} 86 52)`);
    tf(c.legL, `rotate(${p.ll.toFixed(2)} 77.5 75)`); tf(c.legR, `rotate(${p.lr.toFixed(2)} 83.5 75)`);
    c.fig.style.opacity = p.op;
    setFace(c, p.face);
    const blink = live && (Date.now() % 3300) < 120 ? 0.12 : 1;
    c.eyes.forEach((e) => tf(e, `translate(0 33) scale(1 ${blink}) translate(0 -33)`));
    if (p.rope === null) c.rope.style.display = 'none';
    else if (Array.isArray(p.rope)) c.rope.setAttribute('d', `M80 10 L${p.rope[0].toFixed(1)} ${p.rope[1].toFixed(1)}`);
    else c.rope.setAttribute('d', `M80 10 V${(10 + p.rope).toFixed(1)}`);
    // His lines only while he has a head to say them with; the others' (the family, the audience) always.
    let shown = false;
    const head = c.on.indexOf('head') !== -1;
    for (const s of d.says || []) {
      if (!live || tt < s[0] || tt > s[1]) continue;
      const theirs = s[4] === 'o';
      if (!theirs && !head) continue;
      const k = Math.min(EASE.back(W(tt, s[0], s[0] + 180)), 1 - W(tt, s[1] - 140, s[1]));
      let at;
      if (typeof s[3] === 'function') at = s[3](p, c.P, c);
      else if (s[3]) at = s[3];
      else { const h = headTop(p); at = [h[0] - 8, h[1] - 1]; }
      say(c, hmT('hm_end_' + s[2]), Math.max(0, k), at); shown = true; break;
    }
    if (!shown) say(c, null, 0);
  }

  /**
   * After the ending, the last frame lives (the owner, 3 Oct 2026, from the sheet): he breathes and
   * blinks, the family keeps cheering, the spotlight shimmers; a leaving ending's cut rope swings and
   * its trace drifts. Small and calm, never a replay. Not on the small men (no bubble), not when the
   * app's motion is off, and only while the drawing is on the page.
   */
  function idleStart(c) {
    if (!c.bub || hmEndsStill() || idling.indexOf(c) !== -1) return;
    c.idleAt = Date.now(); c.idleLast = 0;
    c.figBase = c.fig.getAttribute('transform') || '';
    c.famBase = c.P.fam ? (c.P.fam.getAttribute('transform') || '') : '';
    c.spotBase = c.P.spot ? (Number(c.P.spot.style.opacity) || 0) : 0;
    c.clBase = c.P.cl ? (c.P.cl.getAttribute('transform') || '') : '';
    c.far = Array.from(c.el.querySelectorAll('.hme-far')).map((n) => [n, n.getAttribute('transform') || '']);
    c.dust = Array.from(c.el.querySelectorAll('.hme-dust'));
    idling.push(c);
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function idle(c, now) {
    if (now - c.idleLast < 33) return;               // about 30 a second is plenty for a breath
    c.idleLast = now;
    const t = now - c.idleAt;
    if (c.def.leave) {
      if (c.cut) tf(c.cut, `rotate(${osc(t, 2400, 7).toFixed(2)} 80 10)`);
      c.dust.forEach((n, i) => { n.style.opacity = (0.6 + 0.3 * Math.sin(t / 700 + i)).toFixed(2); });
      c.far.forEach(([n, base]) => tf(n, `${base} translate(0 ${osc(t, 2200, 1.1).toFixed(2)})`));
      return;
    }
    const bob = -Math.abs(osc(t, 2400, 1.4));
    c.fig.setAttribute('transform', `translate(0 ${bob.toFixed(2)}) ${c.figBase}`);
    if (c.P.fam) tf(c.P.fam, `translate(0 ${bob.toFixed(2)}) ${c.famBase}`);
    const blink = (t % 3300) > 3180 ? 0.12 : 1;
    c.eyes.forEach((e) => tf(e, `translate(0 33) scale(1 ${blink}) translate(0 -33)`));
    if (c.P.spot && c.spotBase) op(c.P.spot, (c.spotBase * (0.85 + 0.15 * Math.sin(t / 600))).toFixed(3));
    if (c.P.cl) tf(c.P.cl, `translate(0 ${osc(t, 2600, 1.4).toFixed(2)}) ${c.clBase}`);
    if (c.P.wave) tf(c.P.wave, `rotate(${osc(t, 900, 18).toFixed(2)} 95 122)`);
    if (c.P.peek) tf(c.P.peek, `translate(80 120) scale(1 ${(t % 2600) > 2470 ? 0.1 : 1}) translate(-80 -120)`);
  }

  // Gone, or on a screen that was left (setView only hides it): the loop lets go. Dropping the
  // on-air mark lets the next hmEndPlay on that screen bring the last frame back to life.
  const away = (c) => !c.el.isConnected || !!c.el.closest('[id^="view-"].hidden');
  function tick() {
    raf = 0;
    const now = Date.now();
    for (let i = running.length - 1; i >= 0; i--) {
      const c = running[i];
      const t = now - c.start;
      if (away(c) || t >= c.def.D) {
        running.splice(i, 1);
        if (c.el.isConnected) { draw(c, c.def.D, false); if (!away(c)) idleStart(c); else c.el.removeAttribute('data-hme-on-air'); }
        continue;
      }
      draw(c, t, true);
    }
    for (let i = idling.length - 1; i >= 0; i--) {
      const c = idling[i];
      if (away(c) || hmEndsStill()) { idling.splice(i, 1); if (c.el.isConnected && away(c)) c.el.removeAttribute('data-hme-on-air'); continue; }
      idle(c, now);
    }
    if (running.length || idling.length) raf = requestAnimationFrame(tick);
  }

  /** Every ending in root not yet alive: plays it (or carries on), or draws its last frame. */
  function play(root) {
    (root || document).querySelectorAll('svg.hme-svg:not([data-hme-on-air])').forEach((el) => {
      el.setAttribute('data-hme-on-air', '1');
      const c = rig(el);
      const key = el.getAttribute('data-hme-key') || '';
      const now = Date.now();
      let start = key ? starts[key] : undefined;
      if (start === undefined && el.getAttribute('data-hme-play') && !hmEndsStill()) {
        start = now;
        if (key) starts[key] = now;
      }
      if (start === undefined || hmEndsStill() || now - start >= c.def.D) { draw(c, c.def.D, false); idleStart(c); return; }
      run(c, start);
    });
  }
  function run(c, start) {
    const el = c.el, now = Date.now();
    c.start = start;
    draw(c, now - start, true);
    running.push(c);
    // The last frame by a timer too: a page that isn't painting gets no frames.
    setTimeout(() => { if (el.isConnected && running.indexOf(c) === -1) return; if (el.isConnected) draw(c, c.def.D, false); }, c.def.D - (now - start) + 60);
    if (!raf) raf = requestAnimationFrame(tick);
  }

  /** The replay button: the ending under it plays again, on this device only. */
  function replay(el) {
    if (!el || hmEndsStill()) return;
    [running, idling].forEach((list) => { for (let i = list.length - 1; i >= 0; i--) if (list[i].el === el) list.splice(i, 1); });
    const c = rig(el);
    const now = Date.now();
    const key = el.getAttribute('data-hme-key') || '';
    if (key) starts[key] = now;
    run(c, now);
  }

  /** Has the ending under `key` begun on this page (so a redraw carries it on)? */
  const begun = (key) => !!key && starts[key] !== undefined;
  const length = (kind, id) => defOf(kind, id).D;
  return { svg, play, replay, begun, length };
})();

/**
 * The endings play even when the device asks for less motion (Windows' "Animation effects" off, an
 * iPhone's Reduce Motion): they are the moment the table watches, as in the owner's sheet, and the
 * snakes' moves do the same. Only the app's own setting (الحركة → مقفولة) stills them, and a page
 * that isn't showing (its timer draws the last frame).
 */
function hmEndsStill() { return (typeof motionPref === 'function' && motionPref() === 'off') || document.hidden; }

/** An ending's markup: kind 'won' | 'lost', id 0-7; o: { on (the pieces he has), key, play, mini, cls }. */
function hmEndSvg(kind, id, o) { return HM_END.svg(kind, id, o); }

/** Every ending in root comes to life (or shows its last frame). */
function hmEndPlay(root) { HM_END.play(root); }

/** The replay button beside an ending: plays the drawing next to it again. */
function hmEndReplay(btn) {
  const host = btn && btn.parentNode;
  HM_END.replay(host && host.querySelector('svg.hme-svg'));
  if (typeof haptic === 'function') haptic('light');
}
</script>
