<script>
/* ============================================================================
   سباق ألغاز — the solo puzzles as a race: the phones and the TV
   ----------------------------------------------------------------------------
   The owner's decisions of 26 Sep 2026 (GEMINI.md, *The owner's specs*): ten
   solo puzzles raced in a room on the engine of RoomSolve.js (RoomRace.js).
   The same puzzle is dealt on the server to every phone; each phone solves it
   on its own board - the game's very own board code, painted into this
   screen's stage (soloStage / soloRaceState in JS_Solo.html, RACE_UI[kind]
   registered by each game) - and the table sees one strip of everyone's
   progress, never a board. Two endings (the lobby): «الكل يخلّص» or «Fast 3».
   «استسلم» marks a phone done with 0. Every race looks the same: the puzzle,
   the strip, a podium.

   One renderer for the ten (raceRender, raceTvFrame). What a phone is doing
   on its board is never redrawn under it: the frame's signature is the
   phone's own state (its board's phase, the round), and the strip, the host's
   buttons and the clock are refreshed in place (racePaintLive). A game the
   server judges move by move (خيوط, كلمات من حروف, تشابه, إيه اللي يجمعهم؟,
   كاسحة الألغام, سلسلة الإجابات) has its board brought up to the server's on
   every state (RACE_UI[kind].sync); a game judged from the whole board
   (الملكات, شمس وقمر, نونوجرام, سودوكو) sends its cells after every change
   (raceMove) and the server counts and says when it is solved.

   Motion (the toolkit): the bars grow (scaleX), a row that finishes pops with
   its place, «⚡ 10 ثواني!» slides in when Fast 3's third finishes, the
   result turns over (the engine's svTurn), the points fly to the row
   (flyPoints), the board counts up (animateScoreboards), the podium rises
   with confetti.
   ========================================================================= */

const raceRoom = { seen: {}, scoreKey: '', myScore: 0, liveHtml: {} };

/* The race's own words, in its chunk (2 Oct 2026: moved out of TRANSLATIONS for the shell's budget, when
   «خماسي السهرة» came): only this file reads them, through t.race_* and svT() as before - they join
   TRANSLATIONS when the chunk loads. */
const RACE_TEXT = {
  ar: {
    race_lobby_hint: "المضيف بيختار عدد الجولات وطريقة النهاية. نفس اللغز للكل، وكل واحد بيحلّه على موبايله.",
    race_lobby_rounds: "كام جولة؟",
    race_lobby_finish: "النهاية",
    race_finish_all: "الكل يخلّص",
    race_finish_fast3: "Fast 3",
    race_finish_all_hint: "الجولة تخلص لما الكل يخلّص أو الوقت يخلص. الحل 10 نقط + بونص للأسرع (+5، +4…).",
    race_finish_fast3_hint: "أول 3 يخلّصوا ياخدوا 10 و7 و5، وبعدها 10 ثواني لأي حد يلحق ياخد 2، والجولة تقفل.",
    race_clock_hint: "⏱️ الوقت {m} دقايق للغز ده، ثابت مش بيتغير.",
    race_you_done: "🎉 خلصت! المركز {n}",
    race_you_lost: "💀 خسرت الجولة دي",
    race_you_gave: "🏳️ استسلمت الجولة دي",
    race_give_up: "استسلم",
    race_give_up_confirm: "تستسلم في اللغز ده؟ هتاخد 0 الجولة دي عشان الباقي يكمّلوا.",
    race_closing: "10 ثواني وتقفل!",
    race_watching: "انت بتتفرج السباق ده",
    race_round_over: "خلصت الجولة",
  },
  en: {
    race_lobby_hint: "The host picks the rounds and the ending. The same puzzle for everyone, each solving on their own phone.",
    race_lobby_rounds: "Rounds",
    race_lobby_finish: "The ending",
    race_finish_all: "Everyone finishes",
    race_finish_fast3: "Fast 3",
    race_finish_all_hint: "The round ends when everyone is done or the clock runs out. A solve is 10 points plus a bonus for the fastest (+5, +4…).",
    race_finish_fast3_hint: "The first three to finish score 10, 7 and 5; anyone finishing in the ten seconds after scores 2, then the round closes.",
    race_clock_hint: "⏱️ {m} minutes for this puzzle, fixed.",
    race_you_done: "🎉 Done! Place {n}",
    race_you_lost: "💀 You lost this round",
    race_you_gave: "🏳️ You gave up this round",
    race_give_up: "Give up",
    race_give_up_confirm: "Give up this puzzle? You score 0 this round so the others can finish.",
    race_closing: "10 seconds and it closes!",
    race_watching: "You are watching this race",
    race_round_over: "Round over",
  }
};
['ar', 'en'].forEach(l => { Object.keys(RACE_TEXT[l]).forEach(k => { if (!(k in TRANSLATIONS[l])) TRANSLATIONS[l][k] = RACE_TEXT[l][k]; }); });

const raceIcon = (kind) => (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID[kind] ? iconHtml(CATALOG_BY_ID[kind].icon) : '🏁');
const raceName = (kind) => { const t = TRANSLATIONS[appState.lang] || {}; return t['setup_' + kind] || kind; };

/* --- the lobby: three things - the puzzle chosen, the rounds, the ending -------------- */

function raceOpts() {
  return recallOptions('raceRoom', { rounds: 3, finish: '' });
}

/** The ending in force: the host's choice, else Fast 3 from five people (the owner). */
function raceFinishOf(state) {
  const o = raceOpts();
  if (SV_RACE_FINISH.indexOf(o.finish) !== -1) return o.finish;
  return ((state && state.players) || []).length >= SV_RACE_FAST3_FROM ? 'fast3' : 'all';
}

function setRaceOpt(key, value) {
  rememberOptions('raceRoom', { [key]: value });
  // «خماسي السهرة» on: the line-up has as many puzzles as rounds (the server keeps the ones there).
  const st = Room.state;
  if (key === 'rounds' && st && st.youAreHost && Array.isArray((st.shared || {}).lineup)) roomAct('raceLineup', { on: true, rounds: value });
  duelLobbyRedraw();
}

function raceLobbyHtml(kind, state) {
  const t = TRANSLATIONS[appState.lang] || {};
  const mins = Math.round((SV_RACE_CLOCKS[kind] || 120) / 60);
  const mix = Array.isArray((state.shared || {}).lineup);
  const clockLine = `<p class="field__hint">${escapeHTML(mix ? rmT('clock') : svT('race_clock_hint', { m: mins }))}</p>`;
  if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(t.race_lobby_hint || '')}</p>${clockLine}`;
  const o = raceOpts();
  const finish = raceFinishOf(state);
  const seg = (label, key, values, current, hint) => `<div class="field">
      <label class="field__label">${escapeHTML(label)}</label>
      <div class="segmented" role="group">${values.map(v => `<button type="button" class="segmented__item ${String(v[0]) === String(current) ? 'is-active' : ''}" onclick="setRaceOpt('${key}', ${typeof v[0] === 'string' ? `'${v[0]}'` : v[0]})">${escapeHTML(v[1])}</button>`).join('')}</div>
      ${hint ? `<p class="field__hint">${escapeHTML(hint)}</p>` : ''}
    </div>`;
  // «خماسي السهرة»: one puzzle every round, or the line-up (drawn on the server, shown above the options to everyone).
  const mixSeg = `<div class="field">
      <label class="field__label">${escapeHTML(rmT('label'))}</label>
      <div class="segmented" role="group">${[[false, rmT('one')], [true, rmT('title')]].map(v => `<button type="button" class="segmented__item ${v[0] === mix ? 'is-active' : ''}" onclick="raceMixSet(${v[0]})">${escapeHTML(v[1])}</button>`).join('')}</div>
      <p class="field__hint">${escapeHTML(rmT(mix ? 'hint_on' : 'hint_off'))}</p>
    </div>`;
  return `<div class="card card--tight">
      ${mixSeg}
      ${seg(t.race_lobby_rounds || '', 'rounds', SV_RACE_ROUNDS.map(n => [n, String(n)]), SV_RACE_ROUNDS.indexOf(Number(o.rounds)) !== -1 ? o.rounds : 3)}
      ${seg(t.race_lobby_finish || '', 'finish', [['all', t.race_finish_all || ''], ['fast3', t.race_finish_fast3 || '']], finish, t[finish === 'fast3' ? 'race_finish_fast3_hint' : 'race_finish_all_hint'] || '')}
      ${clockLine}
    </div>`;
}

function raceStartPayload(kind) {
  const o = raceOpts();
  return { rounds: SV_RACE_ROUNDS.indexOf(Number(o.rounds)) !== -1 ? o.rounds : 3, finish: raceFinishOf(Room.state), lang: contentLang() };
}

/* --- «خماسي السهرة»: a different puzzle every round (the owner, 2 Oct 2026) ------------------
   A lobby choice (RoomRace.js): the app draws the line-up - as many different puzzles of the
   ten as rounds - every phone and the TV see it above the options (raceMixLobbyHtml, the
   ROOM_GAMES entry's lobbyTop), and the host taps one to swap it. The room's game stays the
   puzzle the lobby was opened with; each round is drawn as a race of its own puzzle
   (raceKindOf: shared.solve) on that puzzle's own screen, room-<id>. The line-up rides along
   at the top (raceMixStripHtml), and between rounds the next puzzle is announced: its name
   spins through the ten and lands (spinLetter), its icon pops (raceNextHtml, raceNextSpin) -
   on the phones and the TV. Its words live here, in the race's chunk (RACE_MIX_TEXT). */

const RACE_MIX_TEXT = {
  ar: {
    label: 'الألغاز', one: 'لغز واحد', title: 'خماسي السهرة',
    hint_off: 'نفس اللغز كل الجولات.',
    hint_on: 'كل جولة لغز مختلف، والتطبيق اختارهم. مجموع نقط الجولات بيعمل المنصة.',
    clock: '⏱️ كل لغز بوقته (من 2 لـ 4 دقايق).',
    tap: 'دوس على أي لغز يتغيّر بلغز تاني.', wait: 'دي الألغاز بالترتيب، والمضيف ممكن يغيّر أي واحد.',
    swap: 'غيّر', next: 'اللغز الجاي', mins: '⏱️ {m} دقايق', rounds: '{n} جولات'
  },
  en: {
    label: 'Puzzles', one: 'One puzzle', title: 'Puzzle pentathlon',
    hint_off: 'The same puzzle every round.',
    hint_on: 'A different puzzle every round, drawn by the app. The rounds\' totals make the podium.',
    clock: '⏱️ Each puzzle keeps its own time (2 to 4 minutes).',
    tap: 'Tap a puzzle to swap it for another.', wait: 'The puzzles in order; the host can swap any of them.',
    swap: 'Swap', next: 'Next puzzle', mins: '⏱️ {m} min', rounds: '{n} rounds'
  }
};
const rmT = (key, vars) => {
  let s = (RACE_MIX_TEXT[appState.lang] || RACE_MIX_TEXT.ar)[key] || '';
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
};

/** The game's line-up once it is dealt, or null (one puzzle every round). */
function raceLineupOf(state) {
  const s = (state && state.shared) || {};
  return s.race && s.settings && Array.isArray(s.settings.lineup) ? s.settings.lineup : null;
}

/** The puzzle this round is: the line-up's (shared.solve), else the room's own game. */
function raceKindOf(state, kind) {
  const s = (state && state.shared) || {};
  return raceLineupOf(state) && SV_RACE_IDS.indexOf(s.solve) !== -1 ? s.solve : kind;
}

const raceAccent = (kind) => (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID[kind] && CATALOG_BY_ID[kind].accent) || 'violet';

function raceMixSet(on) {
  const st = Room.state;
  if (!st || !st.youAreHost || on === Array.isArray((st.shared || {}).lineup)) return;
  haptic('light');
  const o = raceOpts();
  roomAct('raceLineup', on ? { on: true, rounds: SV_RACE_ROUNDS.indexOf(Number(o.rounds)) !== -1 ? Number(o.rounds) : 3 } : { on: false });
}

/** The host's tap on a puzzle of the line-up: another one, not in it yet (`was`: a double tap swaps once). */
function raceMixSwap(at, was) {
  const st = Room.state;
  if (!st || !st.youAreHost) return;
  haptic('light');
  roomAct('raceLineup', { at: at, was: was });
}

/** The lobby's line-up, for everyone (the host's puzzles are buttons): above the folded options. */
function raceMixLobbyHtml(state, tv) {
  const list = (state.shared || {}).lineup;
  if (!Array.isArray(list) || !list.length) return '';
  const host = !!state.youAreHost;
  const items = list.map((id, i) => {
    const pop = motionFirst(['race-mix', state.code, i, id, tv ? 'tv' : 'p'].join('|'));
    const inner = `<span class="race-mix__n metric">${i + 1}</span>
        <span class="race-mix__icon" aria-hidden="true">${raceIcon(id)}</span>
        <span class="race-mix__name">${escapeHTML(raceName(id))}</span>
        ${host ? '<span class="race-mix__swap" aria-hidden="true">🔄</span>' : ''}`;
    const cls = `race-mix__item ${pop ? 'is-new' : ''}`;
    return `<li data-accent="${raceAccent(id)}">${host
      ? `<button type="button" class="${cls}" style="--at:${i * 70}ms" onclick="raceMixSwap(${i}, '${id}')" aria-label="${escapeHTML(rmT('swap') + ': ' + raceName(id))}">${inner}</button>`
      : `<span class="${cls}" style="--at:${i * 70}ms">${inner}</span>`}</li>`;
  }).join('');
  return `<div class="card card--tight race-mix">
      <p class="eyebrow">🏅 ${escapeHTML(rmT('title'))} · ${escapeHTML(rmT('rounds', { n: list.length }))}</p>
      <ol class="race-mix__list">${items}</ol>
      <p class="field__hint">${escapeHTML(rmT(host ? 'tap' : 'wait'))}</p>
    </div>`;
}

/** The line-up during the game: the puzzles played dimmed, this round's with its name. */
function raceMixStripHtml(state, tv) {
  const list = raceLineupOf(state);
  if (!list) return '';
  const s = state.shared;
  const at = (Number(s.round) || 1) - 1;
  const over = s.phase === 'result' || s.phase === 'gameover';
  const html = `<ol class="race-strip" aria-label="${escapeHTML(rmT('title'))}">${list.map((id, i) => {
    const cls = i < at || (i === at && over) ? 'is-done' : (i === at ? 'is-now' : '');
    return `<li class="${cls}" data-accent="${raceAccent(id)}" title="${escapeHTML(raceName(id))}"><span aria-hidden="true">${raceIcon(id)}</span>${i === at ? `<b>${escapeHTML(raceName(id))}</b>` : ''}</li>`;
  }).join('')}</ol>`;
  return tv ? `<div class="tv-scale">${html}</div>` : html;
}

/** Between two rounds: the next puzzle, its name to spin and land once (raceNextSpin). */
function raceNextHtml(state, tv) {
  const list = raceLineupOf(state);
  const s = state.shared;
  if (!list || s.phase !== 'result' || s.round >= list.length) return '';
  const id = list[s.round];
  const spin = motionFirst(['race-next', state.code, s.dealId, s.round, tv ? 'tv' : 'p'].join('|')) && !motionOff();
  const html = `<div class="card card--accent race-next" data-accent="${raceAccent(id)}" ${spin ? `data-race-spin="${id}"` : ''}>
      <p class="eyebrow">${escapeHTML(rmT('next'))} · ${escapeHTML(svT('sv_round', { n: s.round + 1, m: list.length }))}</p>
      <div class="race-next__pick">
        <span class="race-next__icon ${spin ? 'is-waiting' : ''}" aria-hidden="true">${raceIcon(id)}</span>
        <b class="race-next__name">${spin ? '&nbsp;' : escapeHTML(raceName(id))}</b>
      </div>
      <p class="field__hint">${escapeHTML(rmT('mins', { m: Math.round((SV_RACE_CLOCKS[id] || 120) / 60) }))}</p>
    </div>`;
  return tv ? `<div class="tv-scale">${html}</div>` : html;
}

/** The next puzzle's name runs through the ten and lands; its icon pops in as it does. */
function raceNextSpin(el) {
  const card = el && el.querySelector('[data-race-spin]');
  if (!card) return;
  const id = card.dataset.raceSpin;
  delete card.dataset.raceSpin;
  const name = card.querySelector('.race-next__name');
  const icon = card.querySelector('.race-next__icon');
  const land = () => {
    if (icon) { icon.classList.remove('is-waiting'); icon.classList.add('motion-landed'); }
    haptic('light');
  };
  spinLetter(name, raceName(id), SV_RACE_IDS.map(raceName), land);
}

/* --- a move, and giving up ------------------------------------------------------------ */

/**
 * A board's move to the server: the game's own payload (its marks, a traced
 * line, an answer) with the round it was made in. A game the server judges
 * says nothing back on a miss - the board's snapshot not having moved after
 * the answer is the miss (RACE_UI[kind].snapshot / miss).
 */
async function raceMove(kind, payload) {
  const st = Room.state;
  const s = (st && st.shared) || {};
  if (!st || s.solve !== kind || s.phase !== 'solving' || !st.you || st.you.state !== 'play') return false;
  const ui = RACE_UI[kind];
  const local = soloRaceState(kind);
  const before = ui && ui.snapshot && local ? ui.snapshot(local) : null;
  try {
    await Room.act('move', Object.assign({ round: Number(s.round) || 0 }, payload));
  } catch (err) {
    showToast(err.message || '', 'error');
    return false;
  }
  const after = ui && ui.snapshot && local ? ui.snapshot(local) : null;
  if (ui && ui.miss && before !== null && after === before && Room.state && Room.state.you && Room.state.you.state === 'play') ui.miss(local);
  return true;
}

function raceGiveUp(sure) {
  const st = Room.state;
  const s = (st && st.shared) || {};
  if (!st || !s.race || s.phase !== 'solving' || !st.you || st.you.state !== 'play') return;
  const t = TRANSLATIONS[appState.lang] || {};
  if (!sure) { showConfirmModal(t.race_give_up_confirm || '', () => raceGiveUp(true), { yes: 'cf_resign', tone: 'danger', icon: '🏳️' }); return; }
  haptic('medium');
  roomAct('giveUp', { round: Number(s.round) || 0 });
}

/* --- the strip: everyone's progress, one row each ----------------------------------------- */

function raceRowsHtml(kind, state, tv) {
  const s = state.shared;
  const prog = s.progress || {};
  const ui = RACE_UI[kind] || {};
  const t = TRANSLATIONS[appState.lang] || {};
  const ids = Object.keys(prog).sort((a, b) => {
    const pa = prog[a], pb = prog[b];
    const ra = pa.state === 'won' ? 0 : pa.state === 'play' ? 1 : 2, rb = pb.state === 'won' ? 0 : pb.state === 'play' ? 1 : 2;
    return ra - rb || (ra === 0 ? (pa.at || 0) - (pb.at || 0) : (pb.done || 0) - (pa.done || 0));
  });
  if (!ids.length) return '';
  const unit = t[ui.unit || ''] || '';
  const rows = ids.map(id => {
    const p = prog[id];
    const total = Math.max(1, Number(p.total) || 1);
    const done = Math.max(0, Math.min(total, Number(p.done) || 0));
    const won = p.state === 'won';
    const st = won ? `✅ ${escapeHTML(svT('hm_place', { n: (p.at || 0) + 1 }))}${typeof p.secs === 'number' ? ` · <span class="metric">${escapeHTML(soloTime(p.secs))}</span>` : ''}`
      : p.state === 'lost' ? `<span aria-hidden="true">${p.timeUp ? '⏳' : '💀'}</span>` : `<span class="race-row__dots" aria-hidden="true"><i></i><i></i><i></i></span>`;
    const pop = won && motionFirst(['race-won', state.code, s.dealId, s.round, id, tv ? 'tv' : 'p'].join('|'));
    return `<div class="race-row is-${p.state} ${id === Room.me ? 'is-me' : ''} ${pop ? 'is-new' : ''}">
        <span class="race-row__who">${escapeHTML(svName(state, id))}</span>
        <span class="race-row__bar" aria-hidden="true"><i style="--p:${won ? 1 : done / total}"></i></span>
        <span class="race-row__n metric">${won ? total : done}/${total}${unit ? ` <small>${escapeHTML(unit)}</small>` : ''}</span>
        <span class="race-row__st">${st}</span>
      </div>`;
  }).join('');
  return `<div class="race-rows ${tv ? 'race-rows--tv' : ''}">${rows}</div>`;
}

/** Fast 3: the third finished, the round closes in ten seconds. */
function raceClosingHtml(state) {
  const s = state.shared;
  if (!s.closeAt || s.phase !== 'solving') return '';
  const first = motionFirst(['race-close', state.code, s.dealId, s.round].join('|'));
  return `<div class="race-closing ${first ? 'is-in' : ''}" role="status">⚡ ${escapeHTML(svT('race_closing'))}</div>`;
}

/* --- the end of a round: what was hidden turns over, then who took what --------------------- */

function raceResultHtml(kind, state, tv) {
  const s = state.shared;
  const r = s.result || {};
  const t = TRANSLATIONS[appState.lang] || {};
  const ui = RACE_UI[kind] || {};
  const turn = motionFirst(['race-reveal', state.code, s.dealId, s.round, tv ? 'tv' : 'phone'].join('|'));
  const reveal = ui.revealHtml ? ui.revealHtml(r.reveal, s) : '';
  const rows = (r.rows || []).map((x, i) => `<li class="sv-res is-${x.state}" style="--at:${(reveal ? 700 : 100) + i * 140}ms">
      <span>${x.state === 'won' ? '✅' : (x.gave ? '🏳️' : (x.timeUp ? '⏳' : '💀'))} ${escapeHTML(x.name)}
        ${x.state === 'won' && typeof x.secs === 'number' ? `<small class="tx-muted metric">${escapeHTML(soloTime(x.secs))}</small>` : ''}
        ${typeof x.score === 'number' && x.score > 0 && ui.scoreLabel ? `<small class="tx-muted">${escapeHTML(ui.scoreLabel(x.score, t))}</small>` : ''}</span>
      <b class="metric">${x.pts ? '+' + x.pts : '0'}</b></li>`).join('');
  return `<div class="card card--accent sv-result race-result ${tv ? 'sv-result--tv' : ''} ${turn ? 'is-turning' : ''}" ${turn ? `data-reveal-ms="${reveal ? 700 : 100}"` : ''}>
      <p class="eyebrow">${raceIcon(kind)} ${escapeHTML(t.race_round_over || '')}</p>
      ${reveal ? `<div class="sv-result__secret">${reveal}</div>` : ''}
      <ul class="sv-results">${rows}</ul>
    </div>`;
}

/* --- the host's buttons, what changes in place, the signature ------------------------------ */

function raceHostButtons(state) {
  const s = state.shared || {};
  if (!roomCanMoveOn(state) || s.phase !== 'solving') return [];
  return [['⏹️ ' + svT('sv_close_round'), `roomAct('closeRound', { round: ${Number(s.round) || 0} })`]];
}

function racePaintLive(el, kind, state) {
  const put = (sel, html) => {
    const box = el.querySelector(sel);
    if (box && box._html !== html) { box.innerHTML = html; box._html = html; }
  };
  put('[data-race-progress]', raceRowsHtml(kind, state, false));
  put('[data-race-closing]', raceClosingHtml(state));
  put('[data-sv-host]', roomHostRow(raceHostButtons(state)));
  refreshRoomPlayerStrip(el, state);
  svTickClock(state);
}

/** This phone's own: the round, the phase, its board's state - never the others' progress. */
function raceSig(state) {
  const s = state.shared || {};
  const you = state.you || {};
  const done = s.phase === 'result' || s.phase === 'gameover';
  return ['race', s.solve, s.dealId || '', s.round, s.phase, you.state || '', you.gave ? 'g' : '', you.board ? 'b' : '',
    done ? JSON.stringify(s.result || null) + JSON.stringify(s.board || []) : '', state.youAreHost, appState.lang].join('|');
}

/* --- a phone ------------------------------------------------------------------------------- */

function raceRender(kind, state) {
  const view = 'room-' + kind;
  if (appState.currentView !== view) setView(view);
  const el = document.getElementById('view-' + view);
  if (!el) return;
  const s = state.shared;
  if (!s || s.solve !== kind) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const you = state.you || {};
  const ui = RACE_UI[kind];
  const head = `<div class="cn-score race-head"><span class="cn-score__role">${raceIcon(kind)} ${escapeHTML(svT('sv_round', { n: s.round, m: s.rounds }))}</span>
      <span class="badge">${escapeHTML(t[s.settings && s.settings.finish === 'fast3' ? 'race_finish_fast3' : 'race_finish_all'] || '')}</span>
      ${s.endsAt && s.phase === 'solving' ? '<span class="badge badge--accent" data-sv-clock></span>' : ''}</div>${raceMixStripHtml(state)}`;
  const rebuilt = renderRoomFrame(el, raceSig(state), () => {
    if (s.phase === 'gameover') {
      const podium = renderPodium(state, s.board);
      return `<div class="sv-room race-room">
          ${raceMixStripHtml(state)}
          ${s.result ? raceResultHtml(kind, state) : ''}
          ${podium || renderScoreboard(s.board)}
          ${state.youAreHost
            ? `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('playAgain')">${escapeHTML(t.play_again || '')}</button>
               <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button></div>`
            : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
          ${roomShareBtnHtml(state, s.board)}
          ${renderRoomPlayerStrip(state)}
        </div>`;
    }
    if (s.phase === 'result') {
      return `<div class="sv-room race-room">${head}
          ${raceResultHtml(kind, state)}
          ${raceNextHtml(state)}
          ${renderScoreboard(s.board)}
          ${roomMoveOnHtml(state,
            `<button class="btn btn--primary btn--lg" onclick="roomAct('nextRound', { round: ${Number(s.round) || 0} })">${escapeHTML(t.sv_next_round || '')}</button>`,
            `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`)}
          ${renderRoomPlayerStrip(state)}
        </div>`;
    }
    // Solving: my board (the game's own, painted into the stage after this frame is in the page), or watching.
    let mine;
    if (you.board && ui) {
      const won = you.state === 'won';
      const p = (s.progress || {})[Room.me] || {};
      const doneCard = you.state === 'play' ? '' : `<div class="card card--accent hm-end race-done ${motionFirst(['race-done', state.code, s.dealId, s.round].join('|')) ? 'is-in' : ''}">
          <p class="sheet__title">${escapeHTML(won ? svT('race_you_done', { n: (p.at || 0) + 1 }) : (you.gave ? (t.race_you_gave || '') : (t.race_you_lost || '')))}</p>
          ${won && typeof p.secs === 'number' ? `<p class="metric race-done__time">${escapeHTML(soloTime(p.secs))}</p>` : ''}
          <p class="field__hint">${escapeHTML(t.hm_done_wait || '')}</p></div>`;
      mine = `${doneCard}<div class="race-stage ${you.state !== 'play' ? 'is-done' : ''}" data-race-stage="${ui.stage}"></div>`;
    } else {
      mine = `<div class="card hm-wait"><div class="hm-wait__icon" aria-hidden="true">${raceIcon(kind)}</div><p class="sheet__title">${escapeHTML(t.race_watching || '')}</p></div>`;
    }
    return `<div class="sv-room race-room">${head}
        <div data-race-closing></div>
        <div class="sv-layout race-layout">
          <div class="sv-layout__board">${mine}</div>
          <div class="sv-layout__side">
            <div data-race-progress></div>
            <div data-sv-host></div>
            ${you.board && you.state === 'play' ? `<button type="button" class="btn btn--ghost btn--sm btn--auto race-giveup" onclick="raceGiveUp()">🏳️ ${escapeHTML(t.race_give_up || '')}</button>` : ''}
            ${renderRoomPlayerStrip(state)}
          </div>
        </div>
      </div>`;
  });
  racePaintLive(el, kind, state);
  if (s.phase === 'solving' && you.board && ui) raceSyncBoard(kind, state, rebuilt);
  if (!rebuilt) return;
  raceAfter(el, kind, state);
}

/**
 * The board on this phone kept in step with the server's: a reload or a late
 * frame draws it settled (`first`), a game the server judges lands each answer
 * as it comes. The local phase follows the server's word on the board.
 */
function raceSyncBoard(kind, state, rebuilt) {
  const ui = RACE_UI[kind];
  const s = soloRaceState(kind);
  if (!s) return;
  const you = state.you;
  const key = [state.code, state.shared.dealId, state.shared.round].join('|');
  const first = raceRoom.seen[key] === undefined;
  const wasDone = raceRoom.seen[key] === 'done';
  if (ui.sync) ui.sync(s, you.board, { first: first || rebuilt, fresh: !first });
  const done = you.state !== 'play';
  if (done && s.phase === 'play') { s.phase = 'done'; s.seconds = ((state.shared.progress || {})[Room.me] || {}).secs || 0; }
  if (first || rebuilt) ui.paint();
  // The board's own clock cell stands still here (the race's clock is in the head): hidden.
  const stage = document.querySelector('#view-room-' + kind + ' [data-race-stage]');
  if (stage) stage.querySelectorAll('.solo-stat b[id$="-time"]').forEach(b => { b.closest('.solo-stat').classList.add('hidden'); });
  raceRoom.seen[key] = done ? 'done' : 'play';
  if (done && !wasDone && !first) {
    const el = document.getElementById('view-room-' + kind);
    const won = you.state === 'won';
    playSound(won ? 'success' : 'wrong');
    haptic(won ? 'double' : 'medium');
    const wait = (ui.finished && ui.finished(s, won)) || 0;
    if (won && el) setTimeout(() => { if (typeof confetti === 'function' && !motionOff()) confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } }); }, wait);
    scrollToAction();
  }
}

/** After a redraw: the points this phone won fly to its row, the winner's confetti at the end. */
function raceAfter(el, kind, state) {
  const s = state.shared;
  const key = state.code + '|' + (s.dealId || '');
  const mineRow = (s.board || []).find(r => r.id === Room.me);
  const now = mineRow ? Number(mineRow.score) || 0 : 0;
  const gain = raceRoom.scoreKey === key ? now - raceRoom.myScore : 0;
  raceRoom.scoreKey = key;
  raceRoom.myScore = now;
  if (s.phase === 'result' || s.phase === 'gameover') {
    // «خماسي السهرة»: the next puzzle is announced once the result has turned over.
    if (el.querySelector('[data-race-spin]')) afterReveal(el, () => raceNextSpin(el));
    const card = el.querySelector('.race-result');
    const row = el.querySelector(`[data-pid="${CSS.escape(Room.me || '')}"]`);
    if (gain > 0 && card && row && typeof flyPoints === 'function') afterReveal(el, () => flyPoints('+' + gain, card.getBoundingClientRect(), row));
    if (s.phase === 'gameover' && (s.board || [])[0] && s.board[0].id === Room.me && duelOnce(['race-over', state.code, s.dealId].join('|'))) {
      afterReveal(el, () => { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 85 }); });
    }
  }
}

/** The stage is emptied when the race leaves the screen: a board's ids must not linger before the board's own screen. */
function raceStageClear() {
  document.querySelectorAll('[data-race-stage]').forEach(el => { el.innerHTML = ''; });
}
onRoomClocksReset(() => { raceStageClear(); raceRoom.seen = {}; });
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from) => { if (String(from).indexOf('room-') === 0 && SV_RACE_IDS.indexOf(from.slice(5)) !== -1) raceStageClear(); });
}

/* --- the TV: everyone a card, the clock big, how the race is won ------------------------------
   The owner's sheet of 1 Oct 2026: the strip of thin full-width bars left the top and bottom thirds
   of a TV empty. A card a player in a grid that takes the height (one column up to 3 players, two
   from 4, three from 7): a bubble with the initial (👑 on the leader), the name big, a thick bar and
   the count; a finished card turns green with its place and time. The bars grow (scaleX) and a
   card that finishes pops, as the strip's rows did. */

function raceTvCardsHtml(kind, state) {
  const s = state.shared;
  const prog = s.progress || {};
  const ui = RACE_UI[kind] || {};
  const t = TRANSLATIONS[appState.lang] || {};
  const ids = Object.keys(prog).sort((a, b) => {
    const pa = prog[a], pb = prog[b];
    const ra = pa.state === 'won' ? 0 : pa.state === 'play' ? 1 : 2, rb = pb.state === 'won' ? 0 : pb.state === 'play' ? 1 : 2;
    return ra - rb || (ra === 0 ? (pa.at || 0) - (pb.at || 0) : (pb.done || 0) - (pa.done || 0));
  });
  if (!ids.length) return '';
  const unit = t[ui.unit || ''] || '';
  // The leader: whoever finished first, else the furthest on (nobody while everyone is at 0).
  const lead = ids.find(id => prog[id].state === 'won' || (prog[id].state === 'play' && (Number(prog[id].done) || 0) > 0)) || null;
  const cols = ids.length >= 7 ? 3 : ids.length >= 4 ? 2 : 1;
  const cards = ids.map(id => {
    const p = prog[id];
    const total = Math.max(1, Number(p.total) || 1);
    const done = Math.max(0, Math.min(total, Number(p.done) || 0));
    const won = p.state === 'won';
    const st = won ? `✅ ${escapeHTML(svT('hm_place', { n: (p.at || 0) + 1 }))}${typeof p.secs === 'number' ? ` · <span class="metric">${escapeHTML(soloTime(p.secs))}</span>` : ''}`
      : p.state === 'lost' ? `<span aria-hidden="true">${p.timeUp ? '⏳' : '💀'}</span>` : `<span class="race-row__dots" aria-hidden="true"><i></i><i></i><i></i></span>`;
    const pop = won && motionFirst(['race-won', state.code, s.dealId, s.round, id, 'tv'].join('|'));
    const isLead = id === lead;
    return `<div class="race-card is-${p.state} ${isLead ? 'is-lead' : ''} ${pop ? 'is-new' : ''}">
        <span class="race-card__av" aria-hidden="true">${isLead ? '👑' : tvInitial(state, id)}</span>
        <span class="race-card__mid">
          <span class="race-card__name"><bdi>${escapeHTML(svName(state, id))}</bdi></span>
          <span class="race-row__bar race-card__bar" aria-hidden="true"><i style="--p:${won ? 1 : done / total}"></i></span>
        </span>
        <span class="race-card__end">
          <span class="race-card__n metric" dir="ltr">${won ? total : done}<small>/${total}</small></span>
          <span class="race-card__st">${st}${unit && p.state === 'play' ? ` <small>${escapeHTML(unit)}</small>` : ''}</span>
        </span>
      </div>`;
  }).join('');
  return `<div class="race-cards race-cards--c${cols}">${cards}</div>`;
}

function raceTvFrame(kind, state, t) {
  const s = state.shared || {};
  if (!s.settings) return tvLookAtPhones(t);
  const accent = (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID[kind] && CATALOG_BY_ID[kind].accent) || 'violet';
  const host = (buttons) => (state.youAreHost && buttons.length ? `<div class="tv-actions">${buttons.map(b => tvBtn(b[0], b[1], b[2] || '')).join('')}</div>` : '');
  // The buttons that only move the game on: anyone's once the host is away (raceTvSig carries it).
  const moveOn = (buttons) => (roomCanMoveOn(state) && buttons.length ? `<div class="tv-actions">${buttons.map(b => tvBtn(b[0], b[1], b[2] || '')).join('')}</div>` : '');
  const fast3 = s.settings.finish === 'fast3';
  const top = `<div class="tv-top race-tv__top">
      <span class="race-tv__chips">
        <span class="tv-pill">${raceIcon(kind)} ${escapeHTML(svT('sv_round', { n: s.round, m: s.rounds }))}</span>
        <span class="tv-pill">${escapeHTML(t[fast3 ? 'race_finish_fast3' : 'race_finish_all'] || '')}</span>
      </span>
      ${s.endsAt && s.phase === 'solving' ? '<span class="race-tv__clock metric" dir="ltr" data-sv-clock="mmss"></span>' : ''}
    </div>${raceMixStripHtml(state, true)}`;
  if (s.phase === 'gameover') {
    return `<div class="tv-vote" data-accent="${accent}">
        <div class="tv-title tv-center-text">🏆</div>
        ${renderPodium(state, s.board) || `<div class="tv-scale">${renderScoreboard(s.board)}</div>`}
        ${host([[t.play_again, "roomAct('playAgain')"], [t.room_another_game, "roomAct('backToHub')", 'ghost']])}
      </div>`;
  }
  if (s.phase === 'result') {
    return `<div class="tv-trivia" data-accent="${accent}">${top}
        <div class="tv-center sv-tv-result">${raceResultHtml(kind, state, true)}${raceNextHtml(state, true)}</div>
        ${moveOn([[svT('sv_next_round'), `roomAct('nextRound', { round: ${Number(s.round) || 0} })`]])}
      </div>`;
  }
  const ui = RACE_UI[kind] || {};
  const line = ui.tvLine ? ui.tvLine(s.pub || {}, t) : '';
  const closing = raceClosingHtml(state);
  return `<div class="tv-trivia race-tv" data-accent="${accent}">${top}
      ${line || closing ? `<div class="sv-tv__head">${line ? `<div class="tv-title">${line}</div>` : ''}${closing}</div>` : ''}
      ${raceTvCardsHtml(kind, state)}
      <p class="race-tv__how">${escapeHTML(t[fast3 ? 'race_finish_fast3_hint' : 'race_finish_all_hint'] || '')}</p>
      ${moveOn(raceHostButtons(state).map(b => [b[0], b[1], 'ghost']))}
    </div>`;
}

function raceTvSig(state) {
  const s = state.shared || {};
  return ['racetv', s.solve, s.dealId || '', s.round, s.phase, s.closeAt || '', JSON.stringify(s.progress || {}), JSON.stringify(s.result || null),
    s.endsAt || '', JSON.stringify(s.board || []), state.youAreHost, !!state.hostAway, appState.lang].join('|');
}

/* --- the ten rooms ---------------------------------------------------------------------------- */

/** The TV after a redraw: the clock, and the next puzzle's spin once the result has turned. */
function raceTvAfter(state, rebuilt) {
  svTickClock(state);
  const el = document.getElementById('view-room-tv');
  if (rebuilt && el && el.querySelector('[data-race-spin]')) afterReveal(el, () => raceNextSpin(el));
}

SV_RACE_IDS.forEach(kind => {
  ROOM_GAMES[kind] = {
    lobbyOptions: (state) => raceLobbyHtml(kind, state),
    // «خماسي السهرة»'s line-up, shown to everyone above the (folded) options.
    lobbyTop: (state, tv) => raceMixLobbyHtml(state, tv),
    startPayload: () => raceStartPayload(kind),
    // A line-up's round is drawn as a race of its own puzzle, on that puzzle's screen.
    render: (state) => raceRender(raceKindOf(state, kind), state),
    // A move is not a new step; a new puzzle, its result and the end are.
    actionKey: (state) => [state.code, (state.shared || {}).round, (state.shared || {}).phase].join('|')
  };
  TV_GAMES[kind] = { sig: raceTvSig, frame: (state, t) => raceTvFrame(raceKindOf(state, kind), state, t), after: raceTvAfter };
});
</script>
