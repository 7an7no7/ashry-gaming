.tv-icon--leave:hover, .tv-icon--leave:focus-visible { border-color: var(--danger); color: var(--danger); }

.tv-strip {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--tv-gap) / 2);
  max-height: 22vh;
  overflow: hidden;
}
.tv-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  padding: 0.25em 0.8em;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  /* Names and scores read from the sofa: --tv-xs was 12px on a TV fed by a 720p laptop. */
  font-size: var(--tv-sm);
  font-weight: 800;
  color: var(--text-strong);
}
.tv-chip.is-away { opacity: 0.45; }
.tv-chip.is-turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tv-chip.is-done { border-color: var(--success); color: var(--success-ink); }
.herd-tv .tv-chip { flex-direction: column; gap: 0.1em; padding: 0.4em 1em; font-size: var(--tv-md); }
.herd-tv { gap: var(--tv-gap); }
.herd-tv__names { color: var(--text-2); font-size: 0.7em; font-weight: 600; }
.tv-chip__score {
  padding: 0 0.45em;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-variant-numeric: tabular-nums;
}
.tv .presence-dot { width: 0.6em; height: 0.6em; }
.tv .fa-dot { width: 0.75em; height: 0.75em; }

/* --- type and shared pieces --- */
.tv-eyebrow { font-size: var(--tv-sm); font-weight: 800; color: var(--text-2); }
.tv-title {
  font-size: var(--tv-lg);
  font-weight: 900;
  line-height: 1.2;
  color: var(--text-strong);
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.tv-note { font-size: var(--tv-sm); font-weight: 700; color: var(--text-2); text-align: center; }
.tv-center-text { text-align: center; }
.tv-success { color: var(--success-ink); }
.tv-danger { color: var(--danger); }
.tv-big-icon { font-size: calc(var(--tv-xl) * 1.3); line-height: 1; }
.tv-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--tv-gap);
  text-align: center;
}
.tv-panel {
  padding: var(--tv-gap);
  border: 1px solid var(--border);
  border-radius: var(--tv-r);
  background: var(--surface-solid);
  text-align: center;
}
.tv-top { display: flex; align-items: center; justify-content: space-between; gap: var(--tv-gap); flex-wrap: wrap; }
.tv-pill {
  padding: 0.25em 0.9em;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  font-size: var(--tv-sm);
  font-weight: 800;
  color: var(--text-strong);
}
.tv-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: var(--tv-gap);
}
.tv-actions--stack { flex-direction: column; align-items: stretch; }
.tv-actions .btn, .tv-chosen .btn {
  min-height: clamp(44px, 6.6vmin, 112px);
  padding-inline: clamp(16px, 2.8vmin, 52px);
  border-radius: var(--tv-r);
  font-size: var(--tv-sm);
}
.tv-timer { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent-ink); }
.tv-timer--big {
  min-width: 2.6ch;
  padding: 0.05em 0.5em;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  font-size: var(--tv-lg);
  text-align: center;
}
.tv-timer.is-low { color: var(--danger); }
.tv-timer--big.is-low { background: var(--danger-soft); }
.tv-clock {
  direction: ltr;
  text-align: center;
  font-size: calc(var(--tv-xl) * 1.4);
  font-weight: 900;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--accent-ink);
}
.tv-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--tv-gap) / 2); }
.tv-question {
  padding: 0 2vw;
  font-size: var(--tv-lg);
  font-weight: 900;
  line-height: 1.25;
  text-align: center;
  color: var(--text-strong);
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.tv-foot { display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); }

/* --- lobby --- */
.tv-lobby {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  /* Both columns from the top: centred, the players' side (a heading and a line
     when this TV isn't the host) floated in the middle of an empty half on a
     1080p screen (the owner, 26 Sep 2026). The pair stays in the middle of the
     stage's height, as long as it fits. */
  align-items: start;
  align-content: center;
  align-content: safe center;
  gap: calc(var(--tv-gap) * 2);
}
/* A TV that isn't the host: the game chosen, and a tile for everyone in. */
.tv-lobby__game {
  display: flex;
  align-items: center;
  gap: var(--tv-gap);
  padding: var(--tv-gap);
  border: 2px solid var(--accent-soft);
  border-radius: var(--tv-r);
  background: var(--accent-soft);
}
.tv-lobby__game-icon { font-size: var(--tv-xl); line-height: 1; }
.tv-lobby__game-text { display: flex; flex-direction: column; gap: 0.2em; min-width: 0; }

.tv-fib-res { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--tv-gap); width: min(96%, 1700px); align-self: center; align-items: start; }
