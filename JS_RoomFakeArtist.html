<script>
/* ============================================================================
   الفنان المزيف — A FAKE ARTIST GOES TO NEW YORK
   ----------------------------------------------------------------------------
   Everyone but one knows the word. Each player adds ONE line in their own
   colour, two laps round the table, then the table votes. A caught fake still
   wins by guessing the word, which is why the server keeps the word back until
   they have guessed.

   The frame is rebuilt only when the screen changes shape: a poll landing in
   the middle of a line, or while the fake is typing a guess, must not replace
   the canvas or the input under them.
   ========================================================================= */

const FA_GRID = 255;
const FA_MAX_POINTS = 150;      // same cap as FAKE_ARTIST_MAX_POINTS on the server

const fakeArt = {
  canvas: null,
  ctx: null,
  drawing: false,
  line: null,          // [x, y, x, y, …] of the line not sent yet
  colour: '#111827',
  sending: false
};

ROOM_GAMES.fakeartist = {
  lobbyOptions: (state) => langLobbyOptions(state, 'fa_hint'),
  startPayload: () => ({ lang: VOTE_LANG() }),

  pollHint(state) {
    const s = state.shared;
    if (s.phase === 'drawing') return s.currentDrawerId === Room.me ? 'acting' : 'watching';
    if (s.phase === 'voting') return (s.vote && s.vote.voted.indexOf(Room.me) === -1) ? 'acting' : 'watching';
    if (s.phase === 'guessing') return s.fakeId === Room.me ? 'acting' : 'watching';
    return 'watching';
  },

  render(state) {
    if (appState.currentView !== 'room-fakeartist') setView('room-fakeartist');
    const el = document.getElementById('view-room-fakeartist');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const myTurn = s.phase === 'drawing' && s.currentDrawerId === Room.me;
    const drawerAway = s.phase === 'drawing' && !myTurn && !faOnline(state, s.currentDrawerId);

    const sig = ['fa', s.round, s.turnIndex, s.phase, (s.strokes || []).length, myTurn,
                 s.vote ? s.vote.voted.length : '', state.youAreHost, drawerAway].join('|');

    if (renderRoomFrame(el, sig, () => fakeArtistFrame(state, t, myTurn, drawerAway))) {
      // The turn moved on (sent, or skipped by the host): nothing of ours is pending.
      if (!myTurn) fakeArt.line = null;
      bindFakeArtistCanvas(myTurn, (s.colors || {})[Room.me] || '#111827');
      paintFakeArtist(s.strokes || []);
    }
    refreshRoomPlayerStrip(el, state);
  }
};

function faOnline(state, id) {
  const p = state.players.find(x => x.id === id);
  return !!(p && p.online);
}

function faName(state, id) {
  const p = state.players.find(x => x.id === id);
  return p ? p.name : '—';
}

function faDot(state, id) {
  const colour = (state.shared.colors || {})[id] || '#111827';
  return `<span class="fa-dot" style="background:${colour}" aria-hidden="true"></span>`;
}

function fakeArtistFrame(state, t, myTurn, drawerAway) {
  const s = state.shared;
  const you = state.you || {};

  const header = s.phase === 'drawing' ? `
      <div class="cn-score">
        <span class="cn-score__role">${faDot(state, s.currentDrawerId)} ${myTurn
            ? (t.your_stroke_turn || '')
            : escapeHTML(faName(state, s.currentDrawerId)) + ' ' + (t.fa_is_drawing || '')}</span>
        <span class="badge badge--accent">${t.round || ''} ${s.round}/${s.totalRounds}</span>
      </div>` : '';

  // Your card: the word, or the news that you haven't got one. Gone at the end,
  // when the word is on everyone's screen anyway.
  const role = s.phase === 'results' ? '' : (you.isFake
    ? `<div class="card plate-danger" style="text-align:center">
         <div class="card__title" style="margin:0">🦹 ${t.fake_artist_role || ''}</div>
         <p style="margin:0">${t.fake_artist_hint || ''}</p>
       </div>`
    : (you.word ? `<div class="card card--accent" style="text-align:center">
         <div class="eyebrow">${t.real_artist_word || ''}</div>
         <div class="metric metric--md metric--accent">${escapeHTML(you.word)}</div>
       </div>` : ''));

  const legend = `
      <div class="chip-set fa-legend">
        ${(s.drawerOrder || []).map(id => `
          <span class="chip chip--plain ${id === s.currentDrawerId ? 'is-turn' : ''}">
            ${faDot(state, id)}<span class="chip__label">${escapeHTML(faName(state, id))}</span>
          </span>`).join('')}
      </div>`;

  const canvas = `<div class="draw-wrap fa-wrap"><canvas id="fa-canvas" width="512" height="512"></canvas></div>`;

  const controls = myTurn ? `
      <div class="btn-row">
        <button class="btn btn--ghost" onclick="clearFakeArtistLine()">${t.fa_redo || ''}</button>
        <button id="fa-send" class="btn btn--primary" onclick="submitFakeArtistLine()" disabled>${t.send_stroke_btn || ''}</button>
      </div>
      <p class="field__hint" style="text-align:center">${t.fa_one_line || ''}</p>` : '';

  const skip = (drawerAway && state.youAreHost) ? `
      <div class="btn-stack">
        <button class="btn btn--ghost btn--sm" onclick="roomAct('skipTurn')">${t.fa_skip_turn || ''}</button>
      </div>` : '';

  const voting = s.phase === 'voting' ? `
      <div class="card">
        <div class="card__title" style="text-align:center">${t.fa_vote_title || ''}</div>
        ${renderBallot(state)}
        ${state.youAreHost ? `
          <div class="btn-stack" style="margin-top: var(--sp-3)">
            <button class="btn btn--ghost" onclick="roomAct('closeVote')">${t.fa_end_vote || ''}</button>
          </div>` : ''}
      </div>` : '';

  let guessing = '';
  if (s.phase === 'guessing') {
    guessing = s.fakeId === Room.me
      ? `<div class="card card--accent">
           <div class="card__title" style="text-align:center">${t.fake_guess_prompt || ''}</div>
           <div class="input-group">
             <input type="text" id="fa-guess" autocomplete="off" maxlength="40"
                    placeholder="${escapeHTML(t.draw_guess_ph || '')}"
                    onkeydown="if(event.key==='Enter') submitFakeArtistGuess()">
             <button class="btn btn--primary" onclick="submitFakeArtistGuess()" aria-label="${escapeHTML(t.submit_guess_btn || '')}">↵</button>
           </div>
         </div>`
      : `<div class="card" style="text-align:center">
           <div class="eyebrow">${t.fa_caught || ''}</div>
           <div class="card__title">${faDot(state, s.fakeId)} ${escapeHTML(faName(state, s.fakeId))}</div>
           <div class="waiting-note"><span class="animate-pulse">🤔</span> ${t.fa_guessing_wait || ''}</div>
           ${state.youAreHost ? `<button class="btn btn--ghost btn--sm" onclick="roomAct('skipGuess')">${t.fa_skip_guess || ''}</button>` : ''}
         </div>`;
  }

  let results = '';
  if (s.phase === 'results') {
    const fakeWon = s.winner === 'fake';
    const line = !s.fakeCaught ? t.fa_escaped : (fakeWon ? t.fa_stole : t.fa_artists_win);
    results = `
      <div class="card ${fakeWon ? 'plate-danger' : 'plate-success'}" style="text-align:center">
        <div class="eyebrow">${t.fa_word_was || ''}</div>
        <div class="metric metric--md">${escapeHTML(s.secretWord || '')}</div>
        <div class="card__title" style="margin: var(--sp-2) 0 0">${fakeWon ? '🦹' : '🎉'} ${line || ''}</div>
        <p style="margin: var(--sp-1) 0 0">${t.fa_fake_was || ''} ${faDot(state, s.fakeId)} <b>${escapeHTML(faName(state, s.fakeId))}</b>${
          s.fakeGuessWord ? ` · ${t.fa_guessed || ''} «${escapeHTML(s.fakeGuessWord)}»` : ''}</p>
      </div>
      ${(s.vote && s.vote.results) ? renderVoteResults(state, { highlightId: s.fakeId }) : ''}
      ${renderScoreboard(s.board)}
      ${renderRoundFooter(state, t.next_round || '')}`;
  }

  return header + role + canvas + legend + controls + skip + voting + guessing + results
       + renderRoomPlayerStrip(state);
}

/* --- canvas ---------------------------------------------------------------- */

function bindFakeArtistCanvas(canDraw, colour) {
  const c = document.getElementById('fa-canvas');
  fakeArt.canvas = c;
  fakeArt.ctx = c ? c.getContext('2d') : null;
  fakeArt.colour = colour;
  fakeArt.drawing = false;
  if (!c || !canDraw) return;

  const pos = (e) => {
    const r = c.getBoundingClientRect();
    return [
      Math.max(0, Math.min(FA_GRID, Math.round((e.clientX - r.left) / r.width * FA_GRID))),
      Math.max(0, Math.min(FA_GRID, Math.round((e.clientY - r.top) / r.height * FA_GRID)))
    ];
  };

  c.onpointerdown = (e) => {
    e.preventDefault();
    // One line a turn: lifting your finger finishes it. Redo clears it.
    if (fakeArt.line) {
      showToast(TRANSLATIONS[appState.lang].fa_one_line_toast || '');
      return;
    }
    c.setPointerCapture(e.pointerId);
    fakeArt.drawing = true;
    fakeArt.line = pos(e);
  };

  c.onpointermove = (e) => {
    if (!fakeArt.drawing) return;
    e.preventDefault();
    const [x, y] = pos(e);
    const p = fakeArt.line;
    // Points that add nothing, or past the cap, only make the payload bigger.
    if (Math.abs(p[p.length - 2] - x) < 3 && Math.abs(p[p.length - 1] - y) < 3) return;
    if (p.length >= FA_MAX_POINTS * 2) return;
    p.push(x, y);
    faStroke(fakeArt.ctx, fakeArt.colour, p.slice(-4));
  };

  const finish = () => {
    if (!fakeArt.drawing) return;
    fakeArt.drawing = false;
    // A tap that never moved is not a line.
    if (!fakeArt.line || fakeArt.line.length < 4) {
      fakeArt.line = null;
      repaintFakeArtist();
      return;
    }
    const btn = document.getElementById('fa-send');
    if (btn) btn.disabled = false;
  };
  c.onpointerup = finish;
  c.onpointercancel = finish;
}

function faStroke(ctx, colour, pts) {
  if (!ctx || !pts || pts.length < 4) return;
  const k = ctx.canvas.width / FA_GRID;
  ctx.strokeStyle = colour;
  ctx.lineWidth = 5 * k;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0] * k, pts[1] * k);
  for (let i = 2; i + 1 < pts.length; i += 2) ctx.lineTo(pts[i] * k, pts[i + 1] * k);
  ctx.stroke();
}

/** Paper, every line sent so far, then your own unsent line on top. */
function paintFakeArtist(strokes) {
  const ctx = fakeArt.ctx;
  if (!ctx) return;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  (strokes || []).forEach(st => faStroke(ctx, st.c, st.p));
  if (fakeArt.line) faStroke(ctx, fakeArt.colour, fakeArt.line);
}

function repaintFakeArtist() {
  paintFakeArtist((Room.state && Room.state.shared && Room.state.shared.strokes) || []);
}

function clearFakeArtistLine() {
  fakeArt.line = null;
  fakeArt.drawing = false;
  const btn = document.getElementById('fa-send');
  if (btn) btn.disabled = true;
  repaintFakeArtist();
}

async function submitFakeArtistLine() {
  if (!fakeArt.line || fakeArt.sending) return;
  const btn = document.getElementById('fa-send');
  if (btn) btn.disabled = true;
  fakeArt.sending = true;
  try {
    await Room.act('sendStroke', { stroke: { p: fakeArt.line } });
    fakeArt.line = null;
    playSound('click');
    haptic('light');
  } catch (err) {
    showToast(err.message || 'تعذر الإرسال', 'error');
    if (btn) btn.disabled = false;
  } finally {
    fakeArt.sending = false;
  }
}

async function submitFakeArtistGuess() {
  const input = document.getElementById('fa-guess');
  const guess = input ? input.value.trim() : '';
  if (!guess) return;
  if (input) input.disabled = true;
  try {
    await Room.act('fakeGuess', { guess: guess });
  } catch (err) {
    if (input) input.disabled = false;
    showToast(err.message || 'تعذر الإرسال', 'error');
  }
}
</script>
