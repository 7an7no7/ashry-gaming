  function isArtIcon(icon) { return typeof icon === 'string' && icon.indexOf('art:') === 0; }

  /** A game's icon as markup: an emoji as it is, a drawn icon as its SVG. */
  function iconHtml(icon) {
    if (!isArtIcon(icon)) return icon || '';
    const body = ICON_ART[icon.slice(4)];
    return body ? '<svg class="art-icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + body + '</svg>' : '';
  }

  /** A game's icon inside a plain line of text: a drawn icon has no text, so it is left out. */
  function iconText(icon) { return isArtIcon(icon) ? '' : (icon || ''); }

  /** A drawn icon as an image, for a canvas (the share card); null for an emoji or on failure. */
  function artIconImage(icon, px) {
    return new Promise((resolve) => {
      const body = isArtIcon(icon) && ICON_ART[icon.slice(4)];
      if (!body) return resolve(null);
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="' + (px || 256) + '" height="' + (px || 256) + '">' + body + '</svg>');
    });
  }

  /** The header back button. Falls back to the menu for unregistered views. */
  /** A stepper's − and +: clamps to data-min/max, moves by data-step, and fires change for whoever listens. */
  function stepField(id, dir) {
    const el = document.getElementById(id);
    if (!el) return;
    const min = Number(el.dataset.min || el.min || 0);
    const max = Number(el.dataset.max || el.max || 99);
    const step = Number(el.dataset.step || 1);
    const next = Math.min(max, Math.max(min, (Number(el.value) || min) + dir * step));
    if (next !== Number(el.value)) {
      el.value = next;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
      if (typeof motionBump === 'function') motionBump(el);
    }
    syncSteppers(el.closest('.stepper') ? el.closest('.stepper').parentElement : null);
    haptic('light');
  }

  /* Every setup screen's Start sits in a sticky bar at the foot of its panel,
     one thumb away however long the options run. The markup keeps the button
     where it reads best; this moves it once at start-up. A game with a mode
     switch keeps the bar inside its "this device" panel, so it hides with it. */
  const STICKY_START_KEYS = ['start', 'bomb_start', 'start_counter'];
  function stickySetupStarts() {
    document.querySelectorAll('[id^="view-setup-"]').forEach(view => {
      view.querySelectorAll('button.btn--primary[data-i18n]').forEach(btn => {
        if (STICKY_START_KEYS.indexOf(btn.getAttribute('data-i18n')) === -1) return;
        if (btn.closest('.mode-online-panel') || btn.closest('.view-actions') || btn.closest('.modal-overlay')) return;
        // A setup with no mode switch keeps the bar in its card too (it sat under the card,
        // wider than every other Start: ثلاث جولات, إستميشن, على راسك; unified 8 Oct 2026).
        const host = btn.closest('.mode-device-panel') || btn.closest('.card') || view;
        let bar = host.querySelector(':scope > .view-actions--start');
        if (!bar) {
          bar = document.createElement('div');
          bar.className = 'view-actions view-actions--start';
          host.appendChild(bar);
        }
        btn.classList.add('btn--lg');
        bar.appendChild(btn);
      });
    });
  }

  /* --- The segmented control's sliding thumb ---------------------------------
     The active option's place becomes two custom properties on its group and
     the thumb (the group's ::before) slides there. Positions are re-read after
     any class change (an option turned on, a panel shown), a rebuilt group, a
     screen change and a resize - coalesced to one pass per frame. */
  function syncSegmented(seg) {
    // Which option is picked, said to a screen reader too (the look is the class alone).
    seg.querySelectorAll(':scope > .segmented__item').forEach(item => {
      const on = item.classList.contains('is-active') ? 'true' : 'false';
      if (item.tagName === 'BUTTON' && item.getAttribute('aria-pressed') !== on) item.setAttribute('aria-pressed', on);
    });
    const active = seg.querySelector(':scope > .segmented__item.is-active');
    if (!active || !active.offsetWidth) return;      // hidden: measured when shown
    const x = active.offsetLeft + 'px', w = active.offsetWidth + 'px';
    if (seg.style.getPropertyValue('--seg-x') !== x) seg.style.setProperty('--seg-x', x);
    if (seg.style.getPropertyValue('--seg-w') !== w) seg.style.setProperty('--seg-w', w);
    if (!seg.classList.contains('has-thumb')) seg.classList.add('has-thumb');
  }
  function syncAllSegmented() {
    document.querySelectorAll('.segmented').forEach(syncSegmented);
    if (typeof syncNavPill === 'function') syncNavPill();
  }
  (function () {
    let queued = false;
    const later = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; syncAllSegmented(); });
    };
    document.addEventListener('DOMContentLoaded', () => {
      new MutationObserver(later).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
      later();
    });
    window.addEventListener('resize', later);
    /* A webfont swapping in changes the width of every label it sets - and it
       fires no mutation and no resize, so a thumb measured against the
       fallback stayed where the fallback put it until something else happened
       to redraw. Both faces are variable ranges fetched with display=swap, so
       on a cold cache there is always a moment of fallback first; the nav pill
       rides on the same pass. */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(later).catch(() => {});
    }
  })();

  function goBack() {
    // On a game screen the back arrow asks first, and offers the way out the
    // table actually wants: another game (openExitSheet in JS_Utils.html).
    if (typeof openExitSheet === 'function' && openExitSheet()) return;
    const meta = VIEW_META[appState.currentView];
    const target = meta && meta.up ? meta.up : 'menu';
    // A game's header shrinks back into its card on the way home (catalogShrinkBack).
    if (typeof catalogShrinkBack === 'function' && catalogShrinkBack(appState.currentView, target, () => setView(target))) return;
    setView(target);
  }

  /* The bottom bar's tabs. Mid-round on a passed phone, a stray tap on 🏠 used
     to drop the round without a word; it asks first, like the back arrow. */
  function navTo(target) {
    // A tab is not "back": a setup opened from «الليلة دي؟» doesn't reopen it (tonightForget, 1217).
    if (typeof tonightForget === 'function') tonightForget();
    // The lit tab tapped again: to the top, and the home's search cleared (1214).
    if (target === appState.currentView && ['menu', 'tools', 'together'].indexOf(target) !== -1 && typeof homeTabAgain === 'function') {
      homeTabAgain(target);
      return;
    }
    if (typeof openExitSheet === 'function' && openExitSheet(target)) return;
    navGo(target);
  }
  function navGo(target) {
    if (target === 'together' && typeof goTogether === 'function') goTogether();
    else if (typeof catalogShrinkBack === 'function' && catalogShrinkBack(appState.currentView, target, () => setView(target))) return;
    else setView(target);
  }

  /* The browser's history follows the app's screens. The phone's own back -
     Android's button, a browser's back swipe - used to leave the app in the
     middle of a game, and then (with one history entry kept in front of the
     app) an iPhone's swipe slid in a stale snapshot while the real screen
     changed underneath with its animation already over. Now every screen
     deeper than the last has its own entry, so Safari's swipe slides in the
     screen you are going back to; the header's arrow walks back through the
     same entries (history.go), so the two never disagree; a popup closes
     first, and a game asks before it is dropped. On an iPhone the back swipe
     is the app's own (below), so it looks exactly like the header's arrow. */
  /* The history is kept equal to what the screen shows, and re-derived after
     every change (navReconcile) rather than patched move by move:
       - the screen's chain of `up` screens from the home (so the phone's back
         goes exactly where the header's arrow goes; الأدوات and مع بعض sit on
         top of the home, so back from them comes home rather than leaving),
       - one more entry of the same screen when leaving it would end a game
         (exitSheetAsks): the swipe slides that screen onto itself and the
         "leave this game?" sheet opens, instead of sliding in the setup screen
         and snapping back,
       - one more while a popup is open: back closes it.
     Entries are tokens ('play-sudoku', and 'play-sudoku+' for the extras). */
  const nav = { stack: [], index: 0, expect: null, dirty: false, soon: false, uaAnimated: false, ready: false, session: '', staleWalk: 0 };
  const navState = (token, i) => ({ ashry: 1, s: nav.session, t: token, i: i });

  function navDesired() {
    const view = appState.currentView || 'menu';
    const chain = [];
    for (let v = view, guard = 0; v && guard < 8; guard++) {
      chain.unshift(v);
      if (v === 'menu') break;
      v = (VIEW_META[v] || {}).up || 'menu';
    }
    if (chain[0] !== 'menu') chain.unshift('menu');
    if (typeof exitSheetAsks === 'function' && exitSheetAsks(view)) chain.push(view + '+');
    if (document.querySelector('.modal-overlay:not(.hidden)')) chain.push(view + '+');
    return chain;
  }

  function navReconcile() {
    nav.soon = false;
    if (!nav.ready) return;
    if (nav.expect !== null) { nav.dirty = true; return; }
    nav.dirty = false;
    try {
      const want = navDesired();
      const have = nav.stack;
      let p = 0;
      while (p < have.length && p < want.length && have[p] === want[p]) p++;
      if (p === have.length && p === want.length) return;
      if (have.length === 0) {
        history.replaceState(navState(want[0], 0), '');
        have.push(want[0]);
        nav.index = 0;
        p = 1;
      } else if (p < have.length) {
        // Entries past p are wrong. Walk back to p (or p-1 when there is nothing
        // to put at p), then carry on from there once the browser has moved.
        const to = p < want.length ? p : p - 1;
        if (nav.index > to) {
          nav.expect = to;
          nav.dirty = true;
          history.go(to - nav.index);
          return;
        }
        if (p < want.length) {
          history.replaceState(navState(want[p], p), '');
          have[p] = want[p];
          have.length = p + 1;
          nav.index = p;
          p++;
        }
      }
      for (; p < want.length; p++) {
        history.pushState(navState(want[p], p), '');
        have[p] = want[p];
        nav.index = p;
      }
      have.length = nav.index + 1;
    } catch (e) {}
  }

  /** After the current task: setView closes popups after it has run, and several changes coalesce. */
  function navSoon() {
    if (nav.soon) return;
    nav.soon = true;
    Promise.resolve().then(navReconcile);
  }

  function navInit() {
    nav.session = Math.random().toString(36).slice(2, 10);
    nav.stack = [];
    nav.index = 0;
    nav.ready = true;
    navReconcile();
  }

  /** setView's side: the screen changed. */
  function navSync() { navSoon(); }

  /* The iPhone's back swipe, drawn by the app. Safari's own swipe slid a picture
     of the page across and the app then changed screens with none of its own
     motion - "not the same animation as the back button" (the owner, twice).
     A touch that starts at the left edge is taken before Safari sees it
     (preventDefault on touchstart, which iOS honours at the edge): the screen
     follows the finger, and letting go past a third of the width - or with a
     quick flick - does exactly what the header's back arrow does, with its
     animation: close the top popup, ask before a game is dropped, or go up a
     screen. If Safari takes the gesture anyway, the page gets touchcancel
     instead of touchend and nothing is done twice. A tap that starts at the
     edge is passed on as a click, and a vertical drag there scrolls the page. */
  const EDGE_IOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const EDGE_PX = 20;
  const edge = { on: false, x0: 0, y0: 0, y: 0, dx: 0, t0: 0, el: null, target: null, dir: '' };

  function edgeCanGoBack() {
    if (document.body.classList.contains('is-tv-view')) return false;
    return !!document.querySelector('.modal-overlay:not(.hidden)') || appState.currentView !== 'menu';
  }
  function edgeBack() {
    if (closeTopModal()) return;
    goBack();
  }
  function edgeReset() {
    edge.on = false;
    edge.el = null;
    edge.target = null;
    edge.dir = '';
    edge.dx = 0;
  }

  if (EDGE_IOS) {
    document.addEventListener('touchstart', (e) => {
      // A second finger calls the swipe off - and puts the screen back where it
      // was: it used to stay shifted by the drag, on every later visit too.
      if (e.touches.length !== 1) { if (edge.el) edge.el.style.transform = ''; edgeReset(); return; }
      const t = e.touches[0];
      if (t.clientX > EDGE_PX || !edgeCanGoBack()) return;
      e.preventDefault();
      edge.on = true;
      edge.x0 = t.clientX;
      edge.y0 = edge.y = t.clientY;
      edge.t0 = Date.now();
      edge.dx = 0;
      edge.dir = '';
      edge.target = e.target;
      edge.el = document.querySelector('.modal-overlay:not(.hidden)') ? null : document.getElementById('view-' + appState.currentView);
    }, { passive: false, capture: true });

    document.addEventListener('touchmove', (e) => {
      if (!edge.on) return;
      const t = e.touches[0];
      const dx = t.clientX - edge.x0;
      const dy = t.clientY - edge.y0;
      if (!edge.dir && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) edge.dir = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
      if (edge.dir === 'y') {
        const main = document.getElementById('shell-main');
        if (main) main.scrollTop += edge.y - t.clientY;
        edge.y = t.clientY;
        return;
      }
      if (edge.dir !== 'x') return;
      edge.dx = Math.max(0, dx);
      if (edge.el && !motionOff()) edge.el.style.transform = 'translateX(' + edge.dx + 'px)';
    }, { passive: true, capture: true });

    document.addEventListener('touchend', () => {
      if (!edge.on) return;
      const el = edge.el;
      const dx = edge.dx;
      const w = window.innerWidth;
      const target = edge.target;
      const dir = edge.dir;
      const go = dir === 'x' && (dx > w / 3 || (dx > 40 && Date.now() - edge.t0 < 300));
      edgeReset();
      if (!dir) {
        // A tap at the very edge: the preventDefault above swallowed its click.
        if (target && typeof target.click === 'function') target.click();
        if (target && target.matches && target.matches('input, textarea, select')) target.focus();
        return;
      }
      if (dir !== 'x') return;
      if (!el || motionOff()) {
        if (el) el.style.transform = '';
        if (go) edgeBack();
        return;
      }
      if (go) {
        const out = el.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(' + w + 'px)' }],
          { duration: Math.max(90, 220 * (1 - dx / w)), easing: 'cubic-bezier(0.3, 0, 0.6, 1)', fill: 'forwards' });
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          edgeBack();
          el.style.transform = '';
          out.cancel();
        };
        out.onfinish = finish;
        setTimeout(finish, 400);
      } else {
        el.style.transform = '';
        el.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(0)' }], { duration: 180, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
      }
    }, { capture: true });

    document.addEventListener('touchcancel', () => {
      if (!edge.on) return;
      if (edge.el) edge.el.style.transform = '';
      edgeReset();
    }, { capture: true });
  }

  window.addEventListener('popstate', (e) => {
    const st = e.state;
    if (!nav.ready || !st || !st.ashry) return;
    // An entry left by this page before a reload: start the history over from here.
    if (st.s !== nav.session) {
      nav.expect = null;
      nav.stack = [];
      nav.index = 0;
      clearTimeout(nav.staleWalk);
      // A reload keeps the history below it, so stale entries lie only under
      // this session's home: back from the home landed on one, was answered by
      // making it the home again, and every press was eaten once per entry
      // before the app could close. On the home with nothing open, keep going
      // back; if nothing happens (the stale entry was the tab's first), take
      // this entry over as before.
      if (appState.currentView === 'menu' && !document.querySelector('.modal-overlay:not(.hidden)')) {
        nav.staleWalk = setTimeout(navSoon, 400);
        history.back();
        return;
      }
      navSoon();
      return;
    }
    clearTimeout(nav.staleWalk);
    // Our own history.go arriving.
    if (nav.expect !== null && st.i === nav.expect) {
      nav.expect = null;
      nav.index = st.i;
      nav.stack.length = st.i + 1;
      if (nav.dirty) navReconcile();
      return;
    }
    nav.expect = null;
    // Forward (a swipe from the other edge): the app doesn't go forward into a
    // screen it can't rebuild from nothing, so it stays where it is.
    if (st.i >= nav.index) {
      if (st.i !== nav.index) { nav.expect = nav.index; history.go(nav.index - st.i); }
      return;
    }
    nav.index = st.i;
    nav.stack.length = st.i + 1;
    const landed = String(st.t || 'menu').replace(/\+$/, '');
    const current = appState.currentView;
    if (landed === current) {
      // One of this screen's own extra entries went: close the top popup, or
      // ask before a game is dropped; with nothing to close or ask about, go
      // on back as the arrow would.
      if (closeTopModal()) {
        // the popup on top closed
      } else if (!(typeof openExitSheet === 'function' && openExitSheet())) {
        const meta = VIEW_META[current];
        if (meta && meta.up) setView(meta.up);
      }
      navSoon();
      return;
    }
    // A game's screen whose chunk hasn't come yet isn't in the page: setView brings it (7 Oct 2026).
    const target = VIEW_META[landed] && (document.getElementById('view-' + landed) ||
      (typeof lzChunksOfView === 'function' && lzChunksOfView(landed).length)) ? landed : 'menu';
    // A browser that animated the way back itself (Android's predictive back):
    // the screen doesn't slide in a second time. On an iPhone the app draws the
    // swipe (the edge handler above), so this stays false there.
    nav.uaAnimated = e.hasUAVisualTransition === true && !EDGE_IOS;
    try {
      if (/^room-/.test(target) || target === 'together') {
        if (typeof Room !== 'undefined' && Room.isIn && typeof roomReturnToActive === 'function' && target !== 'together') roomReturnToActive();
        else setView('together');
      } else {
        setView(target);
      }
    } finally {
      nav.uaAnimated = false;
    }
    navSoon();
  });

  /** Told to the player when a reload cost them a timed round. */
  function toastRoundLost() {
    showToast(appState.lang === 'ar'
      ? 'انتهت الجولة بسبب إعادة تحميل الصفحة'
      : 'The round ended because the page reloaded');
  }

  /* The shell's height (--app-h in Style.html). 100dvh is right nearly always,
     but iOS keeps reporting the old value for a moment after the phone turns,
     and a landscape screen laid out at portrait height has half of itself off
     the bottom with nothing to scroll. innerHeight is current once resize
     fires; the late re-read covers a turn that reports its size after the
     event. */
  /* --- SCREEN SIZE -----------------------------------------------------------
   * Every size in Style.html is in rem, so the font size on <html> scales the
   * whole app. "auto" leaves it to the screen (the ANY SCREEN block). A laptop
   * driving a TV can report a small screen, so a size can also be picked here.
   * ------------------------------------------------------------------------ */
  const UI_SCALES = ['auto', '100', '125', '150', '200'];
  const UI_SCALE_KEY = 'ashryUiScale';

  function uiScale() {
    try {
      const saved = localStorage.getItem(UI_SCALE_KEY);
      return UI_SCALES.indexOf(saved) !== -1 ? saved : 'auto';
    } catch (e) {
      return 'auto';
    }
  }

  function applyUiScale() {
    const scale = uiScale();
    if (scale === 'auto') delete document.documentElement.dataset.uiScale;
    else document.documentElement.dataset.uiScale = scale;
  }

  function cycleUiScale() {
    const next = UI_SCALES[(UI_SCALES.indexOf(uiScale()) + 1) % UI_SCALES.length];
    try { localStorage.setItem(UI_SCALE_KEY, next); } catch (e) {}
    applyUiScale();
    updateSettingsLabels();
    haptic('light');
  }

  /* A TV or a big monitor (the owner's pick 1241, 7 Oct 2026): the first time the app opens
     1600px wide or more, on the size it picked itself, one quiet toast offers the next size up
     of Settings → حجم الشاشة (the first of its steps bigger than what the screen gives now:
     150% on a 1920 TV, 125% on a 1680 monitor). Asked once on this browser, never on the
     room's TV screen (it sizes itself). */
  const UI_SCALE_ASKED_KEY = 'ashryUiScaleAsked';
  function uiScaleOfferTv() {
    if (window.innerWidth < 1600 || uiScale() !== 'auto' || document.body.classList.contains('is-tv-view')) return;
    try { if (localStorage.getItem(UI_SCALE_ASKED_KEY)) return; localStorage.setItem(UI_SCALE_ASKED_KEY, '1'); } catch (e) { return; }
    const now = 100 * (parseFloat(getComputedStyle(document.documentElement).fontSize) || 16) / 16;
    const next = UI_SCALES.filter(v => v !== 'auto' && Number(v) > now + 1)[0];
    if (!next) return;
    const t = TRANSLATIONS[appState.lang] || {};
    showToast(t.ui_scale_offer || '', 'info', { ms: 9000, action: { label: (t.ui_scale_offer_btn || '') + ' ' + next + '%', run: () => {
      try { localStorage.setItem(UI_SCALE_KEY, next); } catch (e) {}
      applyUiScale();
      updateSettingsLabels();
    } } });
  }

  applyUiScale();
  applyMotionPref();

  /* Shapes beside the colours (the improvement plan, Phase 7): for a player who
     can't tell red from green, أونو's cards carry ● red, ▲ yellow, ■ green,
     ◆ blue. A Settings switch, off by default, on this phone (the owner keeps
     the cards' look as picked). */
  const COLOR_SHAPES_KEY = 'ashryColorShapes';
  function colorShapesOn() {
    try { return localStorage.getItem(COLOR_SHAPES_KEY) === '1'; } catch (e) { return false; }
  }
  function applyColorShapes() {
    document.documentElement.classList.toggle('cb-shapes', colorShapesOn());
  }
  function toggleColorShapes() {
    try { localStorage.setItem(COLOR_SHAPES_KEY, colorShapesOn() ? '0' : '1'); } catch (e) {}
    applyColorShapes();
    updateSettingsLabels();
    haptic('light');
  }
  applyColorShapes();

  function syncAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  syncAppHeight();
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      syncAppHeight();
      // Turning can leave the page itself scrolled, which shifts the whole app.
      window.scrollTo(0, 0);
    }, 300);
  });

  let viewEnterFallback = null;

  /** Tools that take the whole screen; the header and nav step aside for them. */
  const FULLSCREEN_VIEWS = ['play-chess', 'play-reaction', 'room-tv', 'play-chooser', 'play-headsup'];

  /* Setup screens whose options are drawn from appState (segmented controls,
     chips). They are painted whenever the screen is reached - from the menu,
     the back button or a reload - so they always show what is saved. */
  const SETUP_PAINTERS = {
    'setup-bomb': 'paintBombSetup',
    'setup-reaction': 'paintReactionSetup',
    'setup-emoji': 'paintEmojiSetup',
    'setup-monkey': 'paintMonkeySetup',
    'setup-fiveseconds': 'paintFiveSetup',
    'setup-stop': 'paintStopSetup',
    'setup-memory': 'paintMemorySetup',
    'setup-xo': 'paintXOSetup',
    'setup-imposter': 'paintImposterSetup',
    'setup-whoami': 'paintWhoAmISetup',
    'setup-charades': 'paintCharadesSetup',
    'setup-describe': 'paintDescribeSetup',
    'setup-trivia': 'paintTriviaSetup',
    'setup-quizmaker': 'qmPaintHub',
    'setup-wordpack': 'wpPaint',
    'setup-teams': 'paintTeamsSetup',
    'setup-justone': 'paintJustOneSetup',
    'setup-guessnum': 'paintGuessNumSetup',
    'setup-codenames': 'paintCodenamesSetup',
    'setup-oracle': 'renderOracleSetup'
  };
  function paintSetupOptions(viewId) {
    const view = document.getElementById('view-' + viewId);
    // The plain fields (data-remember) and the one phone / own phones switch
    // go back first, so the screen's painter reads what was last chosen.
    if (view) recallFields(view);
    if (typeof paintPlayMode === 'function') paintPlayMode(viewId);
    const fn = SETUP_PAINTERS[viewId];
    if (fn && typeof window[fn] === 'function') window[fn]();
    else if (typeof soloPaintSetup === 'function') soloPaintSetup(viewId);
    if (view) syncTimePicks(view);
    // «خيارات أكتر ▾»: its line says what the folded options are set to.
    if (view && typeof setupMoreSummarise === 'function') setupMoreSummarise(view);
    if (view) syncSteppers(view);
    if (view) setupResetSync(view);
  }

  /* «رجّع الأصلي» and a dot on what changed (the owner's pick 1220, 7 Oct 2026).
     A remembered option (data-remember: a stepper, a switch, a list, a time
     pick's field) that differs from the game's own default (setupDefaultSnapshot)
     carries a small accent dot on its label, and while any does, «↺ رجّع الأصلي»
     sits under the last of them and puts every one back - remembered as the
     default, so the next visit opens the same way. Names typed in a box are not
     options and are left alone. Choices kept in a game's own state (the segmented
     rows painted from appState) are that game's, and aren't covered. */
  const setupResetFields = (view) => [...view.querySelectorAll('[data-remember]')].filter(el =>
    el.id && el.dataset.def !== undefined && !/^(text|search)$/i.test(el.type || '') && !el.closest('.mode-online-panel'));
  function setupFieldDefault(el) {
    const def = el.dataset.def;
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === def)) return el.options.length ? el.options[0].value : def;
    return def;
  }
  function setupFieldChanged(el) {
    if (el.type === 'checkbox') return el.checked !== (el.dataset.def === '1');
    if (el.tagName === 'SELECT' && !el.options.length) return false;
    return String(el.value) !== String(setupFieldDefault(el));
  }
  /** The label a field's dot goes on: its row's, or the time pick's, or the one just before it. */
  function setupFieldLabel(el) {
    const pick = el.id && document.querySelector('.time-pick[data-for="' + el.id + '"]');
    const at = pick || el;
    const box = at.closest('.stepper-row, .switch-row, .field');
    let label = box && box.querySelector('.field__label');
    if (label) return label;
    for (let n = at, i = 0; n && i < 3 && !label; i++) {
      for (let p = n.previousElementSibling; p && !label; p = p.previousElementSibling) {
        if (p.matches('.field__label, .field__hint')) label = p;
        else if (p.matches('input, select, .stepper, .segmented')) break;
      }
      n = n.parentElement;
      if (n && n.matches('[id^="view-"], .card, .mode-device-panel')) break;
    }
    return label;
  }
  function setupResetSync(view) {
    if (!view || !/^view-setup-/.test(view.id)) return;
    const fields = setupResetFields(view);
    let last = null;
    fields.forEach(el => {
      const changed = setupFieldChanged(el);
      const label = setupFieldLabel(el);
      if (label && label.classList.contains('is-changed') !== changed) label.classList.toggle('is-changed', changed);
      // A time pick's own field is a hidden input: the pick is what shows.
      const shown = document.querySelector('.time-pick[data-for="' + el.id + '"]') || el;
      if (changed && !shown.closest('.hidden')) last = el;
    });
    const old = view.querySelector('.setup-reset');
    if (!last) { if (old) old.remove(); return; }
    // Under the block that holds the last changed option (a stepper's grid, a switch's field).
    let block = document.querySelector('.time-pick[data-for="' + last.id + '"]') || last;
    block = block.closest('.field, .stepper-row, .switch-row') || block;
    while (block.parentElement && !block.parentElement.matches('[id^="view-"], .card, .mode-device-panel, .setup-more__body, .space-y-4')) block = block.parentElement;
    if (old && old.previousElementSibling === block) return;
    if (old) old.remove();
    const t = TRANSLATIONS[appState.lang] || {};
    block.insertAdjacentHTML('afterend', `<div class="setup-reset"><button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="setupResetAll(this)">↺ ${escapeHTML(t.setup_reset || '')}</button></div>`);
  }
  function setupResetAll(btn) {
    const view = btn && btn.closest('[id^="view-setup-"]');
    if (!view) return;
    setupResetFields(view).forEach(el => {
      if (!setupFieldChanged(el)) return;
      if (el.type === 'checkbox') el.checked = el.dataset.def === '1';
      else el.value = setupFieldDefault(el);
      // The game hears it as a choice (onchange handlers), and it is remembered.
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    });
    haptic('light');
    paintSetupOptions(view.id.slice('view-'.length));
  }
  // A choice made: the dots and the link follow (after the game's own handlers).
  ['input', 'change', 'click'].forEach(type => document.addEventListener(type, (e) => {
    const view = e.target && e.target.closest && e.target.closest('[id^="view-setup-"]');
    if (view && view.querySelector('[data-remember]')) setTimeout(() => setupResetSync(view), 0);
  }));

  /** A stepper at its end dims the button that can't go further (− at the least, + at the
      most), so a tap that does nothing isn't a mystery. Run after a value changes. */
  function syncSteppers(root) {
    (root || document).querySelectorAll('.stepper').forEach(box => {
      const el = box.querySelector('.stepper__value');
      const btns = box.querySelectorAll(':scope > .stepper__btn');
      if (!el || btns.length !== 2) return;
      const v = Number(el.value);
      const min = Number(el.dataset.min || el.min || 0), max = Number(el.dataset.max || el.max || 99);
      const [less, more] = btns;
      const atMin = v <= min, atMax = v >= max;
      if (less.disabled !== atMin) less.disabled = atMin;
      if (more.disabled !== atMax) more.disabled = atMax;
    });
  }

  /* A segmented control standing in for a number field. A round length is one
     of a few sensible values, not something to type: the buttons write the
     seconds into the (hidden) input the game already reads. */
  function pickTime(btn, seconds) {
    const group = btn.closest('.time-pick');
    if (!group) return;
    const input = document.getElementById(group.dataset.for);
    if (input) {
      input.value = seconds;
      if (input.matches('[data-remember]')) rememberField(input);
    }
    group.querySelectorAll('.segmented__item').forEach(b => b.classList.toggle('is-active', b === btn));
  }
  function syncTimePicks(view) {
    view.querySelectorAll('.time-pick').forEach(group => {
      const input = document.getElementById(group.dataset.for);
      const value = input ? String(input.value) : '';
      group.querySelectorAll('.segmented__item').forEach(b => b.classList.toggle('is-active', b.textContent.trim() === value));
    });
  }

  const viewScroll = {};   // where each screen was scrolled to when it was left

  /* Baloo Bhaijaan 2 draws the card games' numerals only (سكرو, أونو, the
     playing cards of كدّاب, الشايب and إستميشن, كدّاب's rank chips: every rule
     in Style.html that names it by name). Since the arcade look it is no one's
     --font-display, so it is not in the page's font link: it is asked for the
     first time one of these screens opens. room-tv draws the same games. A new
     rule that names Baloo puts its view here. */
  const BALOO_URL = 'https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap';
  const BALOO_VIEWS = ['room-screw', 'room-uno', 'room-doubt', 'room-oldmaid', 'room-estimation', 'room-box', 'room-tv'];
  let balooAsked = false;
  function ensureBalooFont() {
    if (balooAsked) return;
    balooAsked = true;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = BALOO_URL;
    document.head.appendChild(link);
  }

  /* The raised centre button for the screen on show (the owner, 3 Oct 2026):
     on مع بعض, whose page already opens a room, it is «ادخل غرفة». body.in-play
     marks a one-phone game being played: the bar goes then, as in a room game
     (body.in-room-game; section 67 of Style_Talk.html). */
  function syncNavRoom(viewId) {
    const v = viewId || '';
    document.body.classList.toggle('in-play', (/^(play|reveal|input)-/.test(v) || v === 'imposter-reveal') && navTabFor(v) !== 'tools');
    const btn = document.getElementById('nav-room');
    if (!btn) return;
    // While this phone is in a room the button is «غرفتك» (the owner's pick 3 of the app
    // polish, 7 Oct 2026): it takes you back to the room, and on the room's own screens it is
    // the tab you're on and a tap scrolls to the top (roomNavTap). «افتح غرفة» comes back
    // when you leave; a second room is still opened from مع بعض, which asks first.
    const mode = (typeof Room !== 'undefined' && Room.session) ? 'room' : v === 'together' ? 'join' : 'open';
    syncNavTabs(v);
    if (btn.dataset.mode === mode && btn.dataset.lang === appState.lang) return;
    btn.dataset.mode = mode;
    btn.dataset.lang = appState.lang;
    const glyph = btn.querySelector('.nav-room__btn');
    const label = btn.querySelector('.nav-label');
    const key = mode === 'room' ? 'nav_your_room' : mode === 'join' ? 'join_room_menu' : 'room_open';
    if (glyph) glyph.textContent = mode === 'room' ? '🚪' : mode === 'join' ? '🔑' : '+';
    if (label) {
      label.setAttribute('data-i18n', key);
      const t = TRANSLATIONS[appState.lang] || {};
      label.textContent = t[key] || label.textContent;
    }
    btn.setAttribute('onclick', mode === 'room' ? 'roomNavTap()' : mode === 'join' ? "roomOpenJoin('')" : 'roomCreateEmpty()');
    btn.classList.toggle('nav-item--join', mode === 'join');
    btn.classList.toggle('nav-item--inroom', mode === 'room');
  }

  function setView(viewId) {
    // A game switched off for a fix (DisabledGames.js): its screens send you home with a word why.
    if (typeof gameOffForView === 'function' && gameOffForView(viewId)) {
      if (typeof gameOffToast === 'function') setTimeout(gameOffToast, 0);
      viewId = 'menu';
    }
    // A game's screen waits for its code (JS_Lazy.html): the screen on show stays
    // until the chunk has run, then this is called again.
    if (typeof lzWait === 'function' && lzWait(lzChunksOfView(viewId), () => setView(viewId))) return;
    if (BALOO_VIEWS.indexOf(viewId) !== -1) ensureBalooFont();
    if (typeof syncFxButton === 'function') syncFxButton(viewId);
    const previous = appState.currentView;
    // Away and back again is a move too (JS_Lazy.html, lzLeft): a redraw of the same screen isn't.
    if (previous !== viewId && typeof lzNavMoved === 'function') lzNavMoved();
    document.body.classList.toggle('is-fullscreen-view', FULLSCREEN_VIEWS.indexOf(viewId) !== -1);
    document.body.classList.toggle('is-tv-view', viewId === 'room-tv');
    // A room game on screen (not its lobby): the raised «افتح غرفة» lowers into
    // an ordinary tab, so it never hangs over the game's own foot (section 42).
    document.body.classList.toggle('in-room-game', /^room-/.test(viewId || '') && ['room-lobby', 'room-join', 'room-tv'].indexOf(viewId) === -1);
    // Chess on one phone, a puzzle, the review: on a phone on its side the app's bar gives the board
    // its height and its ‹ 🔊 ⚙ stand in the game's column (the owner's look 6A, 4 Oct 2026; section 68).
    document.body.classList.toggle('in-chess-own', ['play-shatranj', 'play-chesspuzzle', 'review-shatranj'].indexOf(viewId) !== -1);
    syncNavRoom(viewId);
    const goingBack = viewDepth(viewId) < viewDepth(previous);
    // Remembered before the views are hidden: hiding them shrinks the scroll
    // height, and the position would be read back clamped.
    const main = document.getElementById('shell-main');
    if (main && previous && previous !== viewId) viewScroll[previous] = main.scrollTop;
    // Going back from a game's screen, its icon flies home to its card (JS_Motion.html).
    const homeFlight = goingBack && typeof heroHomeFlight === 'function' ? heroHomeFlight(previous, viewId) : null;

    appState.currentView = viewId;
    if (previous !== viewId) runLeaveHooks(previous, viewId);
    navSync(previous, viewId, goingBack);
    if (typeof syncWakeLock === 'function') syncWakeLock(viewId);
    saveToLocal();

    if (viewId === 'menu' && previous !== 'menu' && typeof resetHomeFilters === 'function') resetHomeFilters(previous);
    if (viewId === 'menu' && typeof renderHome === 'function') renderHome();
    if (viewId === 'together' && typeof renderTogether === 'function') renderTogether();
    if (viewId === 'tools' && typeof renderTools === 'function') renderTools();
    if (viewId === 'crew' && typeof renderCrew === 'function') renderCrew();

    document.querySelectorAll('[id^="view-"]').forEach(el => {
        el.classList.add('hidden');
        el.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
    });

    const viewEl = document.getElementById('view-' + viewId);
    if (viewEl) {
        const meta = VIEW_META[viewId];
        if (meta && meta.accent) viewEl.setAttribute('data-accent', meta.accent);

        viewEl.classList.remove('hidden');
        void viewEl.offsetWidth;   // restart the animation
        // The browser already slid this screen in (an iPhone's back swipe).
        if (!nav.uaAnimated) viewEl.classList.add('view-enter', goingBack ? 'view-enter-back' : 'view-enter-fwd');

        // animationend is the normal path, but never the only one — a very
        // short or suppressed animation fires no events at all, and the class
        // would then hold its transform forever (see the handler below).
        clearTimeout(viewEnterFallback);
        viewEnterFallback = setTimeout(() => {
            viewEl.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
        }, 600);
        // Its first cards rise in one after another (JS_Motion.html section 13).
        if (!nav.uaAnimated && typeof motionEnterView === 'function') motionEnterView(viewEl, viewId, previous);
    }

    // A view arrives scrolled to wherever the last one was left otherwise;
    // going back, a screen comes back where it was (restored at the end,
    // once it is drawn).
    if (main) main.scrollTop = 0;

    closeAllModals();
    clearAllIntervals();
    syncChrome(viewId);

    if (viewId === 'tool-dice' && typeof paintDiceTool === 'function') paintDiceTool();
    if (viewId === 'timers' && typeof paintGenTimer === 'function') paintGenTimer();
    if(viewId.startsWith('setup-')) {
        const listId = viewId.replace('setup-', '') + '-player-list';
        if(typeof renderActiveChips === 'function') renderActiveChips(listId, true);
        paintSetupOptions(viewId);
        if(viewId === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
        if(viewId === 'setup-chameleon' && typeof renderChameleonCategories === 'function') renderChameleonCategories();
        if(viewId === 'setup-charades' && typeof renderCharadesDropdown === 'function') renderCharadesDropdown();
    }
    applyTranslations();
    if (main && goingBack && viewScroll[viewId]) main.scrollTop = viewScroll[viewId];
    // The home's shelves back where they were scrolled sideways (JS_Catalog.html), before the flight measures.
    if (viewId === 'menu' && previous !== 'menu' && typeof homeShelvesRestore === 'function') homeShelvesRestore();
    if (homeFlight) homeFlight();
    if ((viewId === 'menu' || viewId === 'together' || viewId === 'tools') && typeof installAskSoon === 'function') installAskSoon();
    if (typeof syncAllSegmented === 'function') requestAnimationFrame(syncAllSegmented);
}

  /**
   * Scrolls the main area to where the action is: the top of the screen, or
   * `el`. The owner (17 Sep 2026): "my screen should always be in the place
   * that has actions" - a room's podium and a one-phone game's next card are
   * drawn at the top while the player is still scrolled down at the answer box
   * or the last button they pressed, and swiping up to find out what happened
   * is not a reveal. Nothing moves while the player is typing.
   */
  function scrollToAction(el) {
    const main = document.getElementById('shell-main');
    if (!main) return;
    const active = document.activeElement;
    if (active && main.contains(active)
        && (active.tagName === 'TEXTAREA' || (active.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|color)$/i.test(active.type || '')))) return;
    const morphing = document.documentElement.classList.contains('vt-pick');
    const behavior = morphing || (typeof motionOff === 'function' && motionOff()) ? 'auto' : 'smooth';
    // After the new frame is laid out. A hidden page draws no frames, so there a
    // timer does it: the phone comes back from the lock screen already in place.
    const later = document.hidden ? (fn) => setTimeout(fn, 0) : requestAnimationFrame;
    later(() => {
      if (!el || !el.isConnected) { if (main.scrollTop > 0) main.scrollTo({ top: 0, behavior: behavior }); return; }
      const r = el.getBoundingClientRect(), m = main.getBoundingClientRect();
      const top = main.scrollTop + r.top - m.top - 8;
      if (Math.abs(top - main.scrollTop) > 4) main.scrollTo({ top: Math.max(0, top), behavior: behavior });
    });
  }

  /* The enter animation must not leave its transform behind: a transformed
     element becomes the containing block for its position:fixed descendants,
     which detached the floating action bars from the viewport. */
  document.addEventListener('animationend', (e) => {
      if (e.animationName === 'viewEnter' && e.target.id && e.target.id.startsWith('view-')) {
          e.target.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
      }
  });

  /* --- SETTINGS SHEET --- */
  function openSettings() {
      playSound('click');
      updateSettingsLabels();
      paintAppVersion();
      paintOfflineReady();
      const el = document.getElementById('settings-modal');
      if (el) el.classList.remove('hidden');
  }

  /* A crowded header on a narrow phone (the owner's pick 1216): under 400px with
     📁 and 💬 both showing, 🔊 and ⚙️ fold into «⋯» (the CSS decides when, section
     72 of Style_Talk.html), which opens this small centred menu of the two. */
  function openHeaderMore() {
      const el = document.getElementById('hdr-more-modal');
      if (el) el.classList.remove('hidden');
  }

  /* The general timer's pill under the header (the owner's pick 1232): while the
     timer runs and another screen is showing, «⏱ 3:42» in rose; a tap goes back
     to it. Painted on every tick (updateGenDisplay) and every screen change. */
  function timerPillSync() {
      const pill = document.getElementById('timer-pill');
      if (!pill) return;
      const tm = appState.timers && appState.timers.general;
      const show = !!(tm && tm.running && tm.time > 0) && appState.currentView !== 'timers';
      if (pill.hidden === show) {
          pill.hidden = !show;
          if (show && !motionOff() && pill.animate) {
              pill.animate([{ opacity: 0, transform: 'translateY(-6px) scale(0.92)' }, { opacity: 1, transform: 'none' }],
                  { duration: 260, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
          }
      }
      if (!show) return;
      const text = Math.floor(tm.time / 60) + ':' + String(tm.time % 60).padStart(2, '0');
      const box = document.getElementById('timer-pill-time');
      if (box && box.textContent !== text) box.textContent = text;
      const low = tm.time <= 10;
      if (pill.classList.contains('is-low') !== low) pill.classList.toggle('is-low', low);
  }
  function timerPillGo() {
      haptic('light');
      if (typeof navTo === 'function') navTo('timers'); else setView('timers');
  }
  onLeaveScreen(() => timerPillSync());

  /* «انقل لموبايل تاني» (the owner, 7 Oct 2026): the door to the chunk 'move'
     (JS_Move.html, app/MoveData.js), opened over the home or wherever Settings was. */
  function openMoveData() {
      closeModal('settings-modal');
      lzRun('move', () => moveOpen());
  }

  /* Ask the browser to keep this phone's data (the owner, 7 Oct 2026): a browser may
     clear a site's storage when the phone runs short, and with it every name, crew,
     streak and quiz. Asked once, the first time something worth keeping is saved (a
     name, a crew, a daily, a pack, a move); never a prompt of ours - Chrome and Safari
     answer by themselves, Firefox asks in its own bar. Remembered whatever the answer. */
  const PERSIST_ASKED_KEY = 'ashryPersistAsked';
  function keepDataAsk() {
      try {
          if (localStorage.getItem(PERSIST_ASKED_KEY)) return;
          if (!navigator.storage || typeof navigator.storage.persist !== 'function') return;
          localStorage.setItem(PERSIST_ASKED_KEY, String(Date.now()));
      } catch (e) { return; }
      Promise.resolve()
          .then(() => (typeof navigator.storage.persisted === 'function' ? navigator.storage.persisted() : false))
          .then((already) => already || navigator.storage.persist())
          .catch(() => {});
  }

  function updateSettingsLabels() {
      const t = TRANSLATIONS[appState.lang];
      const icon = document.getElementById('settings-theme-icon');
      const themeVal = document.getElementById('settings-theme-value');
      const langVal = document.getElementById('settings-lang-value');
      if (icon) icon.innerText = appState.isDarkMode ? '☀️' : '🌙';
      if (themeVal) themeVal.innerText = appState.isDarkMode ? t.theme_dark : t.theme_light;
      if (langVal) langVal.innerText = appState.lang === 'ar' ? 'العربية' : 'English';
      if (typeof crewPaintSettings === 'function') crewPaintSettings();
      // The version row in the language just chosen (no new check: paintAppVersion did it).
      const verVal = document.getElementById('settings-version-value');
      const verSt = document.getElementById('settings-version-status');
      if (verVal && verVal.textContent) verVal.textContent = appVersionLabel();
      if (verSt && appVersionState) verSt.textContent = t['ver_' + appVersionState] || '';
      const gameLangVal = document.getElementById('settings-gamelang-value');
      if (gameLangVal) gameLangVal.innerText = appState.gameLang === 'ar' ? 'العربية' : appState.gameLang === 'en' ? 'English' : (t.game_lang_auto || '');
      const nameVal = document.getElementById('settings-name-value');
      if (nameVal) nameVal.innerText = (typeof roomName !== 'undefined' && roomName.get()) || t.name_not_set || '';
      const scaleVal = document.getElementById('settings-scale-value');
      if (scaleVal) scaleVal.innerText = uiScale() === 'auto' ? (t.ui_scale_auto || '') : uiScale() + '%';
      const shapesVal = document.getElementById('settings-shapes-value');
      if (shapesVal) shapesVal.innerText = colorShapesOn() ? (t.shapes_on || '') : (t.shapes_off || '');
      const motionVal = document.getElementById('settings-motion-value');
      if (motionVal) motionVal.innerText = t['motion_' + motionPref()] || '';
      const sound = soundPref();
      const soundVal = document.getElementById('settings-sound-value');
      if (soundVal) soundVal.innerText = t['sound_' + sound] || '';
      const soundIcon = document.getElementById('settings-sound-icon');
      if (soundIcon) soundIcon.innerText = sound === 'on' ? '🔊' : sound === 'buzz' ? '📳' : '🔇';
  }

  /* --- CORE UI HELPERS --- */
  /* A popup closes with a small scale and fade (P14, the owner's "cool animations
     all the way", 26 Sep 2026) - and still closes at once: the real overlay is
     hidden straight away, so everything that reads it (a popup opened again
     next, the history, the clocks) sees it closed, and what fades out is a copy
     with no ids and no taps, removed by a timer as well as by its animation
     (an animation event is never the only path, GEMINI.md Traps). */
  function modalExitGhost(el) {
    if (!el || el.classList.contains('hidden') || el.classList.contains('modal-ghost')) return;
    if (typeof motionOff === 'function' && motionOff()) return;
    const ghost = el.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    ghost.classList.add('modal-ghost');
    ghost.setAttribute('aria-hidden', 'true');
    ghost.classList.remove('modal-overlay');
    ghost.classList.add('modal-overlay--ghost');
    document.body.appendChild(ghost);
    const done = () => { if (ghost.parentNode) ghost.remove(); };
    ghost.addEventListener('animationend', (e) => { if (e.target === ghost) done(); });
    setTimeout(done, 260);
  }

  function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(el => { modalExitGhost(el); el.classList.add('hidden'); });
      syncModalInert();
      resumeClocksAfterSheet();
      // setView() closes everything, so the help nav item has to be released
      // here too or it stays lit after navigating away.
      const nav = document.getElementById('nav-help');
      if (nav) nav.classList.remove('is-active');
  }
  function closeModal(id) {
    // دوري المعرفة's card closed by the phone's back or the edge swipe: close it
    // the card's own way, or its clock (and the steal) runs on behind the board.
    // closeTriviaCell clears `open` first, so its own closeModal comes straight here.
    if (id === 'tb-question-modal' && appState.triviaBoard && appState.triviaBoard.open && typeof closeTriviaCell === 'function') {
      closeTriviaCell();
      return;
    }
    const el = document.getElementById(id);
    if (el) { modalExitGhost(el); el.classList.add('hidden'); }
    syncModalInert();
    if (id === 'exit-modal' || id === 'help-modal') resumeClocksAfterSheet();
    // ربع قرد's swap cancelled: its turn clock was paused for it (openSwitchModal).
    if ((id === 'switch-modal' || id === 'switch-confirm-modal') && typeof monkeySwapClosed === 'function') setTimeout(monkeySwapClosed, 0);
    // The coach's blunder warning closed some other way than its own buttons
    // (the phone's back, the edge swipe): the game would stay frozen on the
    // warning. The buttons clear `pending` right after closing it, so wait a
    // tick and only act if it is still the same warning.
    if (id === 'ch-warn-modal' && typeof chLocal !== 'undefined' && chLocal && chLocal.pending) {
      const p = chLocal.pending;
      setTimeout(() => {
        if (chLocal.pending === p && typeof chCoachDismissed === 'function') chCoachDismissed();
      }, 0);
    }
    // The help sheet lights its nav item while it is open.
    if (id === 'help-modal') {
      const nav = document.getElementById('nav-help');
      if (nav) nav.classList.remove('is-active');
    }
  }

  /* --- Toasts: a small stack at the foot of the screen (the design system, "Toasts").
     The newest sits at the bottom, where a toast always showed; at most three
     at once, the oldest leaving first. Each stays about as long as it takes to
     read, the same text again refreshes the one showing, and a tap dismisses. --- */
  // Three at most; two on a phone on its side, where three would cover half the screen.
  const toastMax = () => (window.innerHeight < 500 ? 2 : 3);
  function toastMs(msg, type) {
    const ms = Math.min(7000, Math.max(2500, 2500 + 60 * String(msg || '').length));
    return type === 'error' ? ms + 1000 : ms;
  }
  function toastStill() {
    return typeof motionOff === 'function' ? motionOff() : reducedMotion();
  }
  function toastStack() {
    let s = document.getElementById('toast-stack');
    if (!s) {
      s = document.createElement('div');
      s.id = 'toast-stack';
      s.className = 'toast-stack';
      document.body.appendChild(s);
    }
    return s;
  }
  // Takes a toast away; the ones left slide into its place.
  function toastDismiss(el) {
    if (!el || el._leaving) return;
    el._leaving = true;
    clearTimeout(el._timer);
    const stack = el.parentNode;
    const still = toastStill();
    const gone = () => {
      if (!el.parentNode) return;
      const rest = still ? [] : [...stack.children].filter(n => n !== el && !n._leaving);
      const before = rest.map(n => n.getBoundingClientRect().top);
      el.remove();
      rest.forEach((n, i) => {
        const dy = before[i] - n.getBoundingClientRect().top;
        if (dy && n.animate) n.animate([{ translate: `0 ${dy}px` }, { translate: '0 0' }], { duration: 220, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
      });
    };
    if (still) { gone(); return; }
    el.classList.remove('show');
    el.classList.add('is-leaving');
    setTimeout(gone, 260);
  }
  function toastArm(el) {
    clearTimeout(el._timer);
    el._timer = setTimeout(() => toastDismiss(el), el._ms || toastMs(el._msg, el._type));
  }

  /** A setup screen's Start bar sits where the toasts do: the stack goes just above it, so a
      toast never covers Start and a tap meant for Start never lands on a toast. */
  function toastClearStart(stack) {
    stack.style.bottom = '';
    const view = document.getElementById('view-' + (appState.currentView || ''));
    if (!view) return;
    const bar = [...view.querySelectorAll('.view-actions--start')].find(b => b.getClientRects().length && !b.closest('.hidden'));
    if (!bar) return;
    const r = bar.getBoundingClientRect(), h = window.innerHeight;
    if (!r.height || r.top > h || r.bottom < h * 0.5) return;
    const floor = h - parseFloat(getComputedStyle(stack).bottom || '0');
    if (floor > r.top) stack.style.bottom = Math.round(h - r.top + 8) + 'px';
  }

  /* opts (the owner's picks of 7 Oct 2026, third batch): { action: { label, run } } puts a small
     button in the toast (a tap on it runs `run`, a tap anywhere else only dismisses), and
     { ms } holds it longer. 'warning' is 'warn'. */
  function showToast(msg, type = 'info', opts) {
    if (type === 'warning') type = 'warn';
    const o = opts || {};
    const stack = toastStack();
    if (!stack.children.length) toastClearStart(stack);
    const live = [...stack.children].filter(n => !n._leaving);
    const last = live[live.length - 1];
    // The same words twice in a row: the toast showing stays, its clock starts again.
    if (last && last._msg === String(msg) && last._type === type) {
      toastArm(last);
      if (!toastStill() && last.animate) last.animate([{ scale: 1 }, { scale: 1.04 }, { scale: 1 }], { duration: 240, easing: 'ease-out' });
      return;
    }
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el._msg = String(msg);
    el._type = type;
    // Announced by a screen reader: an error at once, the rest when it is free.
    el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
    el.setAttribute('aria-atomic', 'true');
    el.addEventListener('click', () => toastDismiss(el));
    // The kind reads without the colour (the owner's pick 1257): ✓ done, ⚠ careful, ✕ didn't work.
    const icon = { success: '✓', warn: '⚠︎', error: '✕' }[type] || 'ℹ️';
    const iconSpan = document.createElement('span');
    iconSpan.setAttribute('aria-hidden', 'true');
    iconSpan.className = 'toast__icon';
    iconSpan.innerText = icon;
    const msgSpan = document.createElement('span');
    msgSpan.className = 'toast__msg';
    el.appendChild(iconSpan);
    el.appendChild(document.createTextNode(' '));
    el.appendChild(msgSpan);
    if (o.action && typeof o.action.run === 'function') {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'toast__btn';
      b.textContent = o.action.label || '';
      b.addEventListener('click', (e) => { e.stopPropagation(); toastDismiss(el); o.action.run(); });
      el.appendChild(b);
    }
    if (o.ms) el._ms = o.ms;
    if (toastStill()) el.style.transition = 'none';
    stack.appendChild(el);
    // Room for the new one: the oldest go first.
    live.slice(0, Math.max(0, live.length + 1 - toastMax())).forEach(toastDismiss);
    // The words go in once the toast is in the page: a live region announces a change, not
    // what it was born with.
    const still = toastStill();
    setTimeout(() => { msgSpan.innerText = msg; if (still) el.classList.add('show'); }, 30);
    if (!still) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    toastArm(el);
  }
  
</script>
