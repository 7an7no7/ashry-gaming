<script>
/* ============================================================================
   تشابه — CONNECTIONS
   ----------------------------------------------------------------------------
   Sixteen words, four hidden groups of four. Single-device by nature: everyone
   is looking at the same grid and arguing, so there is nothing to hide and no
   room needed - and, since 26 Sep 2026, a race in a room (سباق ألغاز): the
   same puzzle on every phone, each finding the groups on its own board.

   Difficulty is carried by the order of the groups in each puzzle — the first
   is meant to be findable, the last to look like several of the others. The
   three banks are ConnectionsWords.js (shared with the rooms server, which
   deals a race's puzzle and judges every four submitted).

   The board on screen is one of two: the solo game's (`connections`, kept in
   localStorage) or the race's (soloRaceState('connections'), the room's);
   connState() answers with whichever is being played, and renderConnections
   draws into soloStage('connect-grid') - the race screen's stage, or the
   play screen's own #connect-grid, with the buttons in #connect-meta beside
   it (the race stage holds both).
   ========================================================================= */

const connections = { puzzle: null, solved: [], selected: [], mistakes: 0, lang: 'ar', level: 'medium' };
const CONNECT_MAX_MISTAKES = 4;

/** The board being played: the race's while this phone races, else the solo game's. */
function connState() {
  return soloRaceState('connections') || connections;
}

/** The groups a board knows: the puzzle's when playing alone, the solved ones (and the reveal) in a race. */
function connGroups(c) {
  if (c.puzzle) return c.puzzle.groups;
  return c.groups || [];
}

/** The three boards. Medium keeps its old list id, so its "already played" memory carries over. */
const CONNECT_LEVELS = {
  easy:   { db: () => CONNECTIONS_EASY, list: 'connections-easy:' },
  medium: { db: () => CONNECTIONS_DB,   list: 'connections:' },
  hard:   { db: () => CONNECTIONS_HARD, list: 'connections-hard:' }
};
const CONNECT_LEVEL_KEY = 'ashryConnectLevel';

function connectLevel() {
  try {
    const saved = localStorage.getItem(CONNECT_LEVEL_KEY);
    return CONNECT_LEVELS[saved] ? saved : 'medium';
  } catch (e) {
    return 'medium';
  }
}

function setConnectLevel(level) {
  if (!CONNECT_LEVELS[level]) return;
  try { localStorage.setItem(CONNECT_LEVEL_KEY, level); } catch (e) {}
  paintConnectLevel();
  playSound('click');
}

/** Marks the chosen level and says how many words and groups it deals. */
function paintConnectLevel() {
  const level = connectLevel();
  document.querySelectorAll('#conn-level .segmented__item').forEach(b => {
    b.classList.toggle('is-active', b.dataset.level === level);
  });
  const hint = document.getElementById('conn-level-hint');
  if (!hint) return;
  const first = CONNECT_LEVELS[level].db()[contentLang()][0];
  const groups = first ? first.groups.length : 4;
  const t = TRANSLATIONS[appState.lang] || {};
  hint.textContent = (t.conn_level_hint || '{cards} · {groups}')
    .replace('{cards}', groups * 4)
    .replace('{groups}', groups);
  const daily = document.getElementById('conn-daily');
  if (daily && typeof soloDailyButtonHtml === 'function') daily.innerHTML = soloDailyButtonHtml('connections', 'startConnections(true)');
}

function setupConnections() {
  setView('setup-connections');
  paintConnectLevel();
}

// The content check loads this file in Node, where there is no page.
if (typeof document !== 'undefined') {
  // Loaded with its chunk after the page is up (JS_Lazy.html): paint now.
  const paint = () => { try { paintConnectLevel(); } catch (e) {} };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();
}
// The level line is text drawn here, so it is drawn again whenever the setup
// screen is reached (the back arrow skips setupConnections) and when the
// language changes; a board on screen redraws its buttons too.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => { if (to === 'setup-connections') paintConnectLevel(); });
}
if (typeof onLanguageChange === 'function') {
  onLanguageChange(view => {
    if (view === 'setup-connections') paintConnectLevel();
    if (view === 'play-connections' && connections.puzzle) {
      renderConnections(connections.solved.length === connections.puzzle.groups.length || connections.mistakes >= CONNECT_MAX_MISTAKES);
    }
  });
}

/**
 * A new puzzle at the chosen level, or today's (`daily`): a medium puzzle (4
 * groups) in the games' language, the same puzzle and the same order of tiles
 * on every phone on the date (soloRng(soloDaySeed('connections'))), played
 * once. Started again while it's under way, it goes back to that board.
 */
// A board with a group found or a mistake made: a new one asks first (soloConfirmNew).
const connectHasWork = (c) => !!c.puzzle && ((c.solved || []).length > 0 || c.mistakes > 0);

function startConnections(daily, sure) {
  daily = daily === true;
  if (!sure && soloConfirmNew('connections', connectHasWork, () => startConnections(daily, true))) return;
  if (daily && soloDailyResume('connections')) return;
  // Played once: today's, once finished, is never dealt again (a past day from the archive may be).
  if (daily && !soloArchiveDay && soloDailyResult('connections')) { setupConnections(); return; }
  const lang = contentLang();
  const level = daily ? 'medium' : connectLevel();
  const pool = CONNECT_LEVELS[level].db()[lang];
  // The daily walks the list (soloDailyCycle): nothing comes back until all of it has been.
  const puzzle = daily
    ? soloDailyCycle('connections', pool)[0]
    : freshPick(CONNECT_LEVELS[level].list + lang, pool, 1, { key: p => p.groups.map(g => g.name).join('|') })[0];
  // Today's daily in progress is kept aside, never lost, when another board is dealt.
  soloDailySetAside('connections');
  soloNewGame('connections');

  connections.lang = lang;
  connections.level = level;
  connections.puzzle = puzzle;
  connections.solved = [];
  connections.selected = [];
  connections.mistakes = 0;
  connections.tried = [];
  // Every four tried, as the groups of its tiles: the daily's share is made of these.
  connections.guesses = [];
  connections.phase = 'play';
  connections.daily = daily ? soloToday() : '';
  delete connections.archive;

  // Group index travels with each word so a guess can be checked without
  // searching the puzzle every time.
  const tiles = puzzle.groups.flatMap((g, gi) => g.words.map(w => ({ word: w, group: gi })));
  // The daily's tiles in the date's order (its `rnd` went with the move to soloDailyCycle,
  // and the daily threw here until the names check found it, 5 Oct 2026).
  connections.tiles = daily ? soloShuffle(tiles, soloRng(soloDaySeed('connections'))) : shuffleArray(tiles);

  setView('play-connections');
  renderConnections();
}

/** Back to the board in play (a daily set aside and brought back). */
function continueConnections() {
  setView('play-connections');
  renderConnections();
}

/** "📅 تحدي اليوم" (or the archive's day) over a daily's board. */
function paintConnectBadge() {
  const el = document.getElementById('conn-daily-badge');
  if (!el) return;
  const c = connections;
  const t = TRANSLATIONS[appState.lang] || {};
  const html = c.archive
    ? `<span class="badge badge--warning">📅 ${escapeHTML(t.daily_archive_badge || '')} ${escapeHTML(c.archive)}</span>`
    : (c.daily ? `<span class="badge">📅 ${escapeHTML(t.daily_title || '')}</span>` : '');
  el.innerHTML = html;
  el.classList.toggle('hidden', !html);
}

// A race's four on their way to the server (submitConnectGuess): drawn pressed in, the grid
// and «تأكيد» off until the verdict.
let connRaceSending = false;

function toggleConnectTile(word) {
  const c = connState();
  if (c.phase === 'done' || (c.race && connRaceSending)) return;
  if (c.selected.includes(word)) {
    c.selected = c.selected.filter(w => w !== word);
  } else {
    if (c.selected.length >= 4) return;
    c.selected.push(word);
  }
  renderConnections();
}

/** The four chosen were one away, or wrong: the shake, and the toast that says which. */
/**
 * The tries left as four dots beside «تأكيد» (1111): the cost sits where the finger is.
 * A lost dot is an empty ring; its filled self (`i`) is only shown while it falls.
 */
function connectDotsHtml(t, left, lost) {
  const dots = '<i class="connect-dot"></i>'.repeat(Math.max(0, left))
    + '<i class="connect-dot is-lost"><i></i></i>'.repeat(Math.max(0, lost));
  const label = `${t.conn_mistakes || ''}: ${Math.max(0, left)}`;
  return `<span class="connect-dots" role="img" aria-label="${escapeHTML(label)}" title="${escapeHTML(label)}">${dots}</span>`;
}

/** The dot a miss just cost falls out of its ring (transform and opacity; nothing with motion off). */
function connectDropDot() {
  if (typeof motionOff !== 'function' || motionOff()) return;
  const lost = document.querySelectorAll('#connect-meta .connect-dot.is-lost > i');
  const fall = lost[0];
  if (!fall || !fall.animate) return;
  fall.animate([
    { opacity: 1, transform: 'none' },
    { opacity: 1, transform: 'translateY(-0.2rem) scale(1.15)', offset: 0.2 },
    { opacity: 0, transform: 'translateY(1.6rem) rotate(25deg) scale(0.7)' }
  ], { duration: 620, easing: 'cubic-bezier(0.5, 0, 0.9, 0.6)' });
}

function connectMiss(oneAway, chosen) {
  const t = TRANSLATIONS[appState.lang] || {};
  playSound('miss');
  haptic('heavy');
  connectDropDot();
  showToast(oneAway ? (t.conn_one_away || 'قريب! ثلاثة من نفس المجموعة') : (t.conn_wrong || 'مش صح'), oneAway ? 'info' : 'error');
  // One away shakes the four you chose; any other wrong guess shakes the whole grid.
  const grid = document.getElementById('connect-grid');
  if (grid && !oneAway) { grid.classList.add('animate-shake'); setTimeout(() => grid.classList.remove('animate-shake'), 500); }
  if (oneAway && typeof motionOff === 'function' && !motionOff()) {
    chosen.forEach(word => {
      const tile = document.querySelector(`#connect-grid .connect-tile[data-word="${CSS.escape(word)}"]`);
      if (!tile) return;
      tile.classList.add('animate-shake');
      setTimeout(() => tile.classList.remove('animate-shake'), 600);
    });
  }
}

function submitConnectGuess() {
  const c = connState();
  if (c.selected.length !== 4 || c.phase === 'done') return;
  // A race: the groups are on the server, which judges the four (JS_RoomRace.html).
  if (c.race) {
    // The same four already tried and wrong (the server's list, synced): said as on one phone,
    // and not sent - the server would only mark it 'again', which nothing drew.
    if ((c.tried || []).indexOf(c.selected.slice().sort().join('|')) !== -1) {
      const tt = TRANSLATIONS[appState.lang] || {};
      showToast(tt.conn_already_tried || 'جرّبت الأربعة دول قبل كده', 'info');
      haptic('light');
      return;
    }
    // The four stay chosen, pressed in, until the server's word lands (the owner, 8 Oct 2026:
    // they went plain at once and the verdict came a round trip later). The sync clears them
    // with its verdict; a refusal, or an answer that changed nothing, gives them back here.
    if (connRaceSending) return;
    const words = c.selected.slice();
    c.lastWords = words;
    connRaceSending = true;
    renderConnections();
    raceMove('connections', { words: words }).finally(() => {
      if (!connRaceSending) return;
      connRaceSending = false;
      if (connState() === c) renderConnections();
    });
    return;
  }
  const tiles = c.tiles.filter(t => c.selected.includes(t.word));
  const groups = [...new Set(tiles.map(t => t.group))];
  // The four as the player chose them, for the share (a repeat of a wrong four costs nothing and isn't kept).
  const guessGroups = c.selected.map(w => (c.tiles.find(x => x.word === w) || {}).group);
  const guessKeyNow = c.selected.slice().sort().join('|');
  if (groups.length === 1 || (c.tried || []).indexOf(guessKeyNow) === -1) (c.guesses = c.guesses || []).push(guessGroups);

  if (groups.length === 1) {
    const from = connectTileRects();
    const puzzle = c.puzzle;
    c.solved.push(groups[0]);
    c.selected = [];
    playSound('success');
    haptic('medium');
    renderConnections();
    const flying = flyConnectGroup(groups[0], from);
    if (c.solved.length === puzzle.groups.length) {
      // The board is finished (and a daily marked) at once, so a reload in the
      // flight can't lose it; only the redraw and the sheet wait for the last row.
      finishConnections(true, flying ? CONNECT_FLY_MS : 0);
    }
    return;
  }

  // The same four already tried and wrong: say so, and it costs nothing.
  const guessKey = c.selected.slice().sort().join('|');
  c.tried = c.tried || [];
  if (c.tried.indexOf(guessKey) !== -1) {
    const tt = TRANSLATIONS[appState.lang] || {};
    showToast(tt.conn_already_tried || 'جرّبت الأربعة دول قبل كده', 'info');
    haptic('light');
    return;
  }
  c.tried.push(guessKey);

  // "One away" is the feedback that makes the game feel fair.
  const counts = {};
  tiles.forEach(t => { counts[t.group] = (counts[t.group] || 0) + 1; });
  const best = Math.max(...Object.values(counts));

  c.mistakes++;
  // Clear the selection so the same wrong guess can't be resubmitted by a
  // stray second tap, burning another life for nothing.
  const chosen = guessKey.split('|');
  c.selected = [];
  renderConnections();
  connectMiss(best === 3, chosen);
  if (c.mistakes >= CONNECT_MAX_MISTAKES) finishConnections(false);
}

const CONNECT_FLY_MS = 640;

/** Where each tile is on screen, by word, before the grid is redrawn. */
function connectTileRects() {
  const rects = {};
  document.querySelectorAll('#connect-grid .connect-tile').forEach(b => { rects[b.dataset.word] = b.getBoundingClientRect(); });
  return rects;
}

/**
 * A solved group's four tiles fly into the row that took their place, and the
 * tiles left behind slide from where they were, instead of the grid jumping.
 * Returns whether anything moves.
 */
function flyConnectGroup(gi, from) {
  if (typeof motionOff !== 'function' || motionOff()) return false;
  const grid = document.getElementById('connect-grid');
  const row = grid && grid.querySelector('.connect-group--' + gi);
  if (!row || !row.animate) return false;
  const to = row.getBoundingClientRect();
  const rtl = getComputedStyle(row).direction === 'rtl';
  const words = connGroups(connState())[gi].words;

  row.animate([
    { opacity: 0, transform: 'scale(0.96)' },
    { opacity: 0, transform: 'scale(0.96)', offset: 0.5 },
    { opacity: 1, transform: 'scale(1.03)', offset: 0.8 },
    { opacity: 1, transform: 'none' }
  ], { duration: CONNECT_FLY_MS + 160, easing: 'ease-out' });

  words.forEach((w, i) => {
    const r = from[w];
    if (!r) return;
    const ghost = document.createElement('div');
    ghost.className = 'connect-tile is-selected connect-ghost';
    ghost.textContent = w;
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    document.body.appendChild(ghost);
    const slot = rtl ? words.length - 1 - i : i;
    const dx = to.left + (to.width * (slot + 0.5)) / words.length - (r.left + r.width / 2);
    const dy = to.top + to.height / 2 - (r.top + r.height / 2);
    const anim = ghost.animate([
      { transform: 'none', opacity: 1 },
      { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0.5)', opacity: 0 }
    ], { duration: CONNECT_FLY_MS, delay: i * 40, easing: 'cubic-bezier(0.5, 0, 0.2, 1)', fill: 'both' });
    const done = () => ghost.remove();
    anim.onfinish = done;
    setTimeout(done, CONNECT_FLY_MS + 500);
  });

  grid.querySelectorAll('.connect-tile').forEach(b => {
    const r = from[b.dataset.word];
    if (!r) return;
    const now = b.getBoundingClientRect();
    const dx = r.left - now.left;
    const dy = r.top - now.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    b.animate([{ transform: 'translate(' + dx + 'px, ' + dy + 'px)' }, { transform: 'none' }],
              { duration: 480, delay: 120, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' });
  });
  return true;
}

const CONNECT_SQUARES = ['🟨', '🟩', '🟦', '🟪', '🟥'];

/** The board is over: its state (and a daily's result) kept now; the redraw and the sheet after `waitMs`. */
function finishConnections(won, waitMs) {
  const found = connections.solved.length;
  connections.phase = 'done';
  // Losing still reveals the answer — otherwise the puzzle just nags at you.
  connections.solved = connections.puzzle.groups.map((g, i) => i);
  connections.selected = [];
  const c = connections;
  const puzzle = c.puzzle;
  saveConnections();
  const t = TRANSLATIONS[appState.lang] || {};
  let share = '';
  if (c.daily) {
    soloMarkDaily('connections', { won: won, mistakes: c.mistakes, groups: found, total: c.puzzle.groups.length }, c.daily);
    share = connectShareText(t, c.daily, won, c.mistakes, c.guesses || []);
  }
  // 1107: a free puzzle keeps its tally per level now, at once like a daily's result.
  c.tally = !c.daily && !c.archive ? connectTally(c.level, won, c.mistakes) : null;
  if (waitMs) { setTimeout(() => { if (connections.puzzle === puzzle) connectSettle(won, found, share); }, waitMs); return; }
  connectSettle(won, found, share);
}

/**
 * 1107 (the owner's picks, 7 Oct 2026): a free puzzle's tally per level, kept
 * through soloRecord ('connections:<level>' in ashrySoloBest_v1): puzzles
 * solved and solved with no mistake. Every board ends on the result sheet,
 * a free one as a daily does (without the share), with the tally under it.
 */
function connectTally(level, won, mistakes) {
  const prev = soloBest('connections', level) || {};
  const next = {
    solved: (prev.solved || 0) + (won ? 1 : 0),
    perfect: (prev.perfect || 0) + (won && !mistakes ? 1 : 0),
    played: (prev.played || 0) + 1
  };
  soloRecord('connections', level, next, () => true);
  return next;
}

function connectSettle(won, found, share) {
  const c = connections;
  renderConnections(true);
  // The result sheet, a daily's (today's was kept at once), a past day's or a free puzzle's.
  const t = TRANSLATIONS[appState.lang] || {};
  const lines = [escapeHTML((t.conn_daily_mistakes || '').replace('{n}', c.mistakes).replace('{m}', CONNECT_MAX_MISTAKES))];
  if (c.tally) {
    const lvl = t['solo_lvl_' + c.level] || '';
    lines.push(escapeHTML((t.conn_tally || '').replace('{level}', lvl).replace('{n}', c.tally.solved).replace('{p}', c.tally.perfect)));
  }
  soloLater('connections', motionOff() ? 0 : 900, () => soloResult({
    icon: '🔗',
    title: won ? (c.mistakes ? (t.conn_daily_won || '') : (t.conn_daily_perfect || '')) : (t.conn_daily_lost || ''),
    value: found,
    valueLabel: (t.conn_daily_groups || '').replace('{n}', c.puzzle.groups.length),
    lines: lines,
    win: won, share: share,
    again: () => startConnections(false), exit: setupConnections
  }));
}

/**
 * A daily's result for WhatsApp, Connections' way: every four tried as a row
 * of its tiles' group colours (yellow, green, blue, purple, easiest first), a
 * wrong one ending in ❌ - the colours only, never the words.
 */
function connectShareText(t, day, won, mistakes, guesses) {
  const rows = guesses.map(g => {
    const one = g.every(x => x === g[0]);
    return g.map(x => CONNECT_SQUARES[x] || '⬜').join('') + (one ? '' : ' ❌');
  });
  const head = `🔗 ${t.setup_connections || ''} ${won ? '✅' : '❌'} ${mistakes}/${CONNECT_MAX_MISTAKES}`;
  return `${soloShareHeader(t, day)}\n${head}\n${rows.join('\n')}`;
}

function renderConnections(finished) {
  const c = connState();
  const stage = soloStage('connect-grid');
  if (!stage || (!c.puzzle && !c.race)) return;
  const t = TRANSLATIONS[appState.lang];
  const groups = connGroups(c);
  const total = c.puzzle ? c.puzzle.groups.length : (c.total || 4);

  const solvedHtml = c.solved.map(gi => {
    const g = groups[gi];
    if (!g) return '';
    return `<div class="connect-group connect-group--${gi}">
        <div class="connect-group__name">${escapeHTML(g.name)}</div>
        <div class="connect-group__words">${g.words.map(escapeHTML).join(' · ')}</div>
      </div>`;
  }).join('');

  const solvedWords = new Set(c.solved.flatMap(gi => (groups[gi] ? groups[gi].words : [])));
  const remaining = c.tiles.filter(x => (c.puzzle ? !c.solved.includes(x.group) : !solvedWords.has(x.word)));
  const sending = !!c.race && connRaceSending;
  const tilesHtml = remaining.map(x => {
    const sel = c.selected.includes(x.word);
    const wait = sending ? ` disabled style="${sel ? 'opacity: 0.7; transform: scale(0.94);' : 'opacity: 0.55;'}"` : '';
    return `
      <button class="connect-tile ${sel ? 'is-selected' : ''}${sending && sel ? ' is-pending' : ''}" data-word="${escapeHTML(x.word)}"${wait}
              onclick="toggleConnectTile('${jsStringAttr(x.word)}')">${escapeHTML(x.word)}</button>`;
  }).join('');

  const gridHtml = solvedHtml + (remaining.length ? `<div class="connect-grid">${tilesHtml}</div>` : '');
  const over = finished || c.solved.length === total || c.phase === 'done';
  if (!c.race) paintConnectBadge();
  const left = CONNECT_MAX_MISTAKES - c.mistakes;
  const metaHtml = over
    ? (c.race ? '' : `<button onclick="startConnections(false)" class="btn btn--primary btn--lg">${t.play_again || 'لعبة جديدة'}</button>`)
    : `<div class="connect-submit">
         <button onclick="submitConnectGuess()" class="btn btn--primary"
               ${c.selected.length === 4 && !sending ? '' : 'disabled'}>${t.conn_submit || 'تأكيد'}</button>
         ${connectDotsHtml(t, left, c.mistakes)}
       </div>
       <button onclick="shuffleConnections()" class="btn btn--ghost btn--sm">${t.conn_shuffle || 'خلط'}</button>`;

  if (c.race) {
    // The race stage holds the grid and its buttons together.
    stage.innerHTML = `<div id="connect-grid">${gridHtml}</div><div id="connect-meta" class="btn-stack" style="margin-top: var(--sp-4)">${metaHtml}</div>`;
    return;
  }
  stage.innerHTML = gridHtml;
  saveConnections();
  const meta = document.getElementById('connect-meta');
  if (meta) meta.innerHTML = metaHtml;
}

function shuffleConnections() {
  const c = connState();
  c.tiles = shuffleArray(c.tiles);
  renderConnections();
}

/* A reload mid-puzzle comes back to it (CLAUDE.md: "reload in the middle, it
   should come back"). The board is kept on the phone as it is drawn. */
const CONNECT_SAVE_KEY = 'ashryConnections_v1';
function saveConnections() {
  try {
    if (!connections.puzzle) return;
    const c = connections;
    localStorage.setItem(CONNECT_SAVE_KEY, JSON.stringify({
      puzzle: c.puzzle, tiles: c.tiles, solved: c.solved, mistakes: c.mistakes,
      tried: c.tried || [], lang: c.lang, level: c.level,
      guesses: c.guesses || [], phase: c.phase || 'play', daily: c.daily || '', archive: c.archive || ''
    }));
  } catch (e) {}
}
/** The saved board put back into `connections` when it is unfinished; false otherwise. */
function connectLoadSaved() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(CONNECT_SAVE_KEY) || 'null'); } catch (e) {}
  const over = !saved || !saved.puzzle || !Array.isArray(saved.tiles) || !Array.isArray(saved.solved)
    || saved.phase === 'done' || saved.solved.length >= saved.puzzle.groups.length || saved.mistakes >= CONNECT_MAX_MISTAKES;
  if (over) return false;
  Object.assign(connections, saved, { selected: [], phase: 'play' });
  if (!connections.archive) delete connections.archive;
  return true;
}
function restoreConnections() {
  if (!connectLoadSaved()) { setupConnections(); return; }
  setView('play-connections');
  renderConnections();
}
// The board lives in this file, not appState: an unfinished one is put back at
// start-up, so the dailies (soloDailyLive, soloDailySetAside) see it after a
// reload on any screen and a free game can't deal over today's silently.
if (typeof localStorage !== 'undefined') { try { connectLoadSaved(); } catch (e) {} }

/* The dailies (JS_Solo.html) read and set this board aside through `connections`.
   JS_Solo.html loads after this file: it registers the game once it is there. */
(window.SOLO_LATE = window.SOLO_LATE || []).push(() => soloRegister('connections', {
  setup: 'setup-connections', play: 'play-connections', paintSetup: paintConnectLevel,
  state: () => connections, resume: continueConnections,
  repaint: () => renderConnections(connections.phase === 'done')
}));

/* --- سباق ألغاز: the same grid, raced (JS_RoomRace.html) ------------------------------ */
window.RACE_UI = window.RACE_UI || {};
RACE_UI.connections = {
  stage: 'connect-grid',
  unit: 'race_unit_groups',
  fresh: (pub) => ({ puzzle: null, lang: pub.lang, level: 'medium', tiles: pub.tiles.map(w => ({ word: w, group: -1 })), groups: [],
    solved: [], selected: [], mistakes: 0, tried: [], total: pub.count || 4, last: '' }),
  // The server's word on the four: a group lands with its flight, one away or wrong shakes, the fourth mistake ends it.
  sync(s, board, fx) {
    const b = board || {};
    (b.solved || []).forEach(g => { s.groups[g.gi] = { name: g.name, words: g.words }; });
    const fresh = (b.solved || []).filter(g => s.solved.indexOf(g.gi) === -1).map(g => g.gi);
    const from = fresh.length && !(fx && fx.first) ? connectTileRects() : null;
    fresh.forEach(gi => s.solved.push(gi));
    const moreMistakes = (b.mistakes || 0) > s.mistakes;
    s.mistakes = b.mistakes || 0;
    s.tried = b.tried || [];
    // The verdict on the four this phone sent: they leave the selection now, not at the tap.
    if ((fresh.length || moreMistakes) && !(fx && fx.first)) { connRaceSending = false; s.selected = []; }
    if (fx && fx.first) connRaceSending = false;
    if (fresh.length || moreMistakes || (fx && fx.first)) renderConnections();
    if (fresh.length && from) { playSound('success'); haptic('medium'); fresh.forEach(gi => flyConnectGroup(gi, from)); }
    else if (moreMistakes && !(fx && fx.first)) connectMiss(b.last === 'one', s.lastWords || []);
    s.last = b.last || '';
  },
  paint: () => renderConnections(),
  // The round is over for this board: the reveal (every group) comes with the result; nothing to pop here.
  finished: (s, won) => 0,
  revealHtml: (r) => (r && r.groups ? r.groups.map(g => `<div class="connect-group connect-group--${g.gi}"><div class="connect-group__name">${escapeHTML(g.name)}</div><div class="connect-group__words">${g.words.map(escapeHTML).join(' · ')}</div></div>`).join('') : '')
};
</script>
