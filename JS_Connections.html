const connections = { puzzle: null, solved: [], selected: [], mistakes: 0, lang: 'ar', level: 'medium' };
const CONNECT_MAX_MISTAKES = 4;

/** The three boards. Medium keeps its old list id, so its "already played" memory carries over. */
const CONNECT_LEVELS = {
  easy:   { db: () => CONNECTIONS_EASY, list: 'connections-easy:' },
  medium: { db: () => CONNECTIONS_DB,   list: 'connections:' },
  hard:   { db: () => CONNECTIONS_HARD, list: 'connections-hard:' }
};
const CONNECT_LEVEL_KEY = 'ashryConnectLevel';

function connectLevel() {
  try {
    const saved = localStorage.getItem(CONNECT_LEVEL_KEY);
    return CONNECT_LEVELS[saved] ? saved : 'medium';
  } catch (e) {
    return 'medium';
  }
}

function setConnectLevel(level) {
  if (!CONNECT_LEVELS[level]) return;
  try { localStorage.setItem(CONNECT_LEVEL_KEY, level); } catch (e) {}
  paintConnectLevel();
  playSound('click');
}

/** Marks the chosen level and says how many words and groups it deals. */
function paintConnectLevel() {
  const level = connectLevel();
  document.querySelectorAll('#conn-level .segmented__item').forEach(b => {
    b.classList.toggle('is-active', b.dataset.level === level);
  });
  const hint = document.getElementById('conn-level-hint');
  if (!hint) return;
  const first = CONNECT_LEVELS[level].db()[contentLang()][0];
  const groups = first ? first.groups.length : 4;
  const t = TRANSLATIONS[appState.lang] || {};
  hint.textContent = (t.conn_level_hint || '{cards} · {groups}')
    .replace('{cards}', groups * 4)
    .replace('{groups}', groups);
}

function setupConnections() {
  setView('setup-connections');
  paintConnectLevel();
}

// The content check loads this file in Node, where there is no page.
if (typeof document !== 'undefined') {
  document.addEventListener('DOMContentLoaded', () => { try { paintConnectLevel(); } catch (e) {} });
}
// The level line is text drawn here, so it is drawn again whenever the setup
// screen is reached (the back arrow skips setupConnections) and when the
// language changes; a board on screen redraws its buttons too.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => { if (to === 'setup-connections') paintConnectLevel(); });
}
if (typeof onLanguageChange === 'function') {
  onLanguageChange(view => {
    if (view === 'setup-connections') paintConnectLevel();
    if (view === 'play-connections' && connections.puzzle) {
      renderConnections(connections.solved.length === connections.puzzle.groups.length || connections.mistakes >= CONNECT_MAX_MISTAKES);
    }
  });
}

function startConnections() {
  const lang = contentLang();
  const level = connectLevel();
  const pool = CONNECT_LEVELS[level].db()[lang];
  const puzzle = freshPick(CONNECT_LEVELS[level].list + lang, pool, 1, { key: p => p.groups.map(g => g.name).join('|') })[0];

  connections.lang = lang;
  connections.level = level;
  connections.puzzle = puzzle;
  connections.solved = [];
  connections.selected = [];
  connections.mistakes = 0;
  connections.tried = [];

  // Group index travels with each word so a guess can be checked without
  // searching the puzzle every time.
  connections.tiles = shuffleArray(
    puzzle.groups.flatMap((g, gi) => g.words.map(w => ({ word: w, group: gi })))
  );

  setView('play-connections');
  renderConnections();
}

function toggleConnectTile(word) {
  if (connections.selected.includes(word)) {
    connections.selected = connections.selected.filter(w => w !== word);
  } else {
    if (connections.selected.length >= 4) return;
    connections.selected.push(word);
  }
  renderConnections();
}

function submitConnectGuess() {
  if (connections.selected.length !== 4) return;
  const tiles = connections.tiles.filter(t => connections.selected.includes(t.word));
  const groups = [...new Set(tiles.map(t => t.group))];

  if (groups.length === 1) {
    const from = connectTileRects();
    const puzzle = connections.puzzle;
    connections.solved.push(groups[0]);
    connections.selected = [];
    playSound('success');
    haptic('medium');
    renderConnections();
    const flying = flyConnectGroup(groups[0], from);
    if (connections.solved.length === puzzle.groups.length) {
      // The last row lands before the board settles into its finished state.
      if (flying) setTimeout(() => { if (connections.puzzle === puzzle) finishConnections(true); }, CONNECT_FLY_MS);
      else finishConnections(true);
    }
    return;
  }

  // The same four already tried and wrong: say so, and it costs nothing.
  const guessKey = connections.selected.slice().sort().join('|');
  connections.tried = connections.tried || [];
  if (connections.tried.indexOf(guessKey) !== -1) {
    const tt = TRANSLATIONS[appState.lang] || {};
    showToast(tt.conn_already_tried || 'جرّبت الأربعة دول قبل كده', 'info');
    haptic('light');
    return;
  }
  connections.tried.push(guessKey);

  // "One away" is the feedback that makes the game feel fair.
  const counts = {};
  tiles.forEach(t => { counts[t.group] = (counts[t.group] || 0) + 1; });
  const best = Math.max(...Object.values(counts));

  connections.mistakes++;
  // Clear the selection so the same wrong guess can't be resubmitted by a
  // stray second tap, burning another life for nothing.
  connections.selected = [];
  playSound('alarm');
  haptic('heavy');
  const t = TRANSLATIONS[appState.lang];
  showToast(best === 3 ? (t.conn_one_away || 'قريب! ثلاثة من نفس المجموعة') : (t.conn_wrong || 'مش صح'),
            best === 3 ? 'info' : 'error');

  // One away shakes the four you chose; any other wrong guess shakes the whole
  // grid, as it always has. The words are captured before the selection is
  // cleared, and the tiles are found again after the redraw below - which
  // rebuilds the grid and would otherwise throw the class away.
  const oneAway = best === 3;
  const chosen = guessKey.split('|');
  const grid = document.getElementById('connect-grid');
  if (grid && !oneAway) { grid.classList.add('animate-shake'); setTimeout(() => grid.classList.remove('animate-shake'), 500); }

  renderConnections();

  if (oneAway && typeof motionOff === 'function' && !motionOff()) {
    chosen.forEach(word => {
      const tile = document.querySelector(`#connect-grid .connect-tile[data-word="${CSS.escape(word)}"]`);
      if (!tile) return;
      tile.classList.add('animate-shake');
      setTimeout(() => tile.classList.remove('animate-shake'), 600);
    });
  }
  if (connections.mistakes >= CONNECT_MAX_MISTAKES) finishConnections(false);
}

const CONNECT_FLY_MS = 640;

/** Where each tile is on screen, by word, before the grid is redrawn. */
function connectTileRects() {
  const rects = {};
  document.querySelectorAll('#connect-grid .connect-tile').forEach(b => { rects[b.dataset.word] = b.getBoundingClientRect(); });
  return rects;
}

/**
 * A solved group's four tiles fly into the row that took their place, and the
 * tiles left behind slide from where they were, instead of the grid jumping.
 * Returns whether anything moves.
 */
function flyConnectGroup(gi, from) {
  if (typeof motionOff !== 'function' || motionOff()) return false;
  const grid = document.getElementById('connect-grid');
  const row = grid && grid.querySelector('.connect-group--' + gi);
  if (!row || !row.animate) return false;
  const to = row.getBoundingClientRect();
  const rtl = getComputedStyle(row).direction === 'rtl';
  const words = connections.puzzle.groups[gi].words;

  row.animate([
    { opacity: 0, transform: 'scale(0.96)' },
    { opacity: 0, transform: 'scale(0.96)', offset: 0.5 },
    { opacity: 1, transform: 'scale(1.03)', offset: 0.8 },
    { opacity: 1, transform: 'none' }
  ], { duration: CONNECT_FLY_MS + 160, easing: 'ease-out' });

  words.forEach((w, i) => {
    const r = from[w];
    if (!r) return;
    const ghost = document.createElement('div');
    ghost.className = 'connect-tile is-selected connect-ghost';
    ghost.textContent = w;
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    ghost.style.width = r.width + 'px';
    ghost.style.height = r.height + 'px';
    document.body.appendChild(ghost);
    const slot = rtl ? words.length - 1 - i : i;
    const dx = to.left + (to.width * (slot + 0.5)) / words.length - (r.left + r.width / 2);
    const dy = to.top + to.height / 2 - (r.top + r.height / 2);
    const anim = ghost.animate([
      { transform: 'none', opacity: 1 },
      { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0.5)', opacity: 0 }
    ], { duration: CONNECT_FLY_MS, delay: i * 40, easing: 'cubic-bezier(0.5, 0, 0.2, 1)', fill: 'both' });
    const done = () => ghost.remove();
    anim.onfinish = done;
    setTimeout(done, CONNECT_FLY_MS + 500);
  });

  grid.querySelectorAll('.connect-tile').forEach(b => {
    const r = from[b.dataset.word];
    if (!r) return;
    const now = b.getBoundingClientRect();
    const dx = r.left - now.left;
    const dy = r.top - now.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    b.animate([{ transform: 'translate(' + dx + 'px, ' + dy + 'px)' }, { transform: 'none' }],
              { duration: 480, delay: 120, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' });
  });
  return true;
}

function finishConnections(won) {
  // Losing still reveals the answer — otherwise the puzzle just nags at you.
  connections.solved = connections.puzzle.groups.map((g, i) => i);
  connections.selected = [];
  renderConnections(true);
  if (won) confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
  else playSound('alarm');
}

function renderConnections(finished) {
  const el = document.getElementById('connect-grid');
  const meta = document.getElementById('connect-meta');
  if (!el || !connections.puzzle) return;
  const t = TRANSLATIONS[appState.lang];

  const solvedHtml = connections.solved.map(gi => {
    const g = connections.puzzle.groups[gi];
    return `<div class="connect-group connect-group--${gi}">
        <div class="connect-group__name">${escapeHTML(g.name)}</div>
        <div class="connect-group__words">${g.words.map(escapeHTML).join(' · ')}</div>
      </div>`;
  }).join('');

  const remaining = connections.tiles.filter(x => !connections.solved.includes(x.group));
  const tilesHtml = remaining.map(x => `
      <button class="connect-tile ${connections.selected.includes(x.word) ? 'is-selected' : ''}" data-word="${escapeHTML(x.word)}"
              onclick="toggleConnectTile('${jsStringAttr(x.word)}')">${escapeHTML(x.word)}</button>`).join('');

  el.innerHTML = solvedHtml + (remaining.length ? `<div class="connect-grid">${tilesHtml}</div>` : '');

  if (meta) {
    const left = CONNECT_MAX_MISTAKES - connections.mistakes;
    meta.innerHTML = finished || connections.solved.length === connections.puzzle.groups.length
      ? `<button onclick="startConnections()" class="btn btn--primary btn--lg">${t.play_again || 'لعبة جديدة'}</button>`
      : `<div class="connect-lives">${t.conn_mistakes || 'محاولات متبقية'}:
           ${'●'.repeat(Math.max(0, left))}${'○'.repeat(connections.mistakes)}</div>
         <button onclick="submitConnectGuess()" class="btn btn--primary"
                 ${connections.selected.length === 4 ? '' : 'disabled'}>${t.conn_submit || 'تأكيد'}</button>
         <button onclick="shuffleConnections()" class="btn btn--ghost btn--sm">${t.conn_shuffle || 'خلط'}</button>`;
  }
}

function shuffleConnections() {
  connections.tiles = shuffleArray(connections.tiles);
  renderConnections();
}
</script>
