<script>
  /* --- SECURITY UTILS --- */
  function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag)
      );
  }

  /**
   * Escapes a value for use as a single-quoted JS string inside an inline
   * handler attribute, e.g. onclick="fn('${jsStringAttr(name)}')".
   *
   * escapeHTML is the wrong tool here: it turns ' into &#39;, and the HTML parser
   * decodes that back to a bare ' before the JS is ever compiled — so a player
   * called O'Brien produced fn('O'Brien'), a syntax error that left the button
   * silently dead. Backslash-escaping has to happen first (the HTML parser leaves
   * backslashes alone, so JS receives them), then the characters that would end
   * the attribute get entity-encoded.
   */
  function jsStringAttr(value) {
      return String(value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r?\n/g, '\\n')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
  }

  /* --- AUDIO SYSTEM --- */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let lastClickAt = 0;

  function playSound(type) {
    // The delegated pointerdown handler clicks for every control, and a few
    // handlers still click for themselves; collapse the overlap rather than
    // hunting down every call site.
    if (type === 'click') {
      const now = Date.now();
      if (now - lastClickAt < 70) return;
      lastClickAt = now;
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'tick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'alarm') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.6);
        osc.start(now); osc.stop(now + 0.6);
    } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
  }

  /* --- TACTILE FEEDBACK ------------------------------------------------------
   * Two channels, both cheap and both optional: a short vibration where the
   * device supports it, and a ripple that starts at the finger. Between them a
   * tap feels acknowledged before any state has changed.
   * ------------------------------------------------------------------------ */

  const HAPTIC_PATTERNS = { light: 8, medium: 14, heavy: 22, double: [12, 40, 12] };
  const prefersReducedMotion = () =>
      window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /** Vibrates if the device and browser allow it. iOS Safari has no vibrate. */
  function haptic(kind = 'light') {
      if (!navigator.vibrate || prefersReducedMotion()) return;
      try { navigator.vibrate(HAPTIC_PATTERNS[kind] || HAPTIC_PATTERNS.light); } catch (e) {}
  }

  /* Every host listed here must be `position: relative; overflow: hidden` in
     Style.html, or the ripple escapes its box. See the ".ripple" rule there. */
  const RIPPLE_TARGETS = '.btn, .game-card, .tool-item, .row--interactive, .setting-row, .nav-item, .key';

  document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
      if (!host || host.disabled || prefersReducedMotion()) return;

      const rect = host.getBoundingClientRect();
      // One circle big enough to cover the element from wherever it started.
      const size = Math.max(rect.width, rect.height) * 1.1;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';

      // The ripple is absolutely positioned, so the host has to be a stacking
      // context for it; .btn and the tiles already are.
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      host.appendChild(ripple);

      // animationend is the normal path, but never the only one: if the
      // animation doesn't run the node would stay in the DOM forever, and in a
      // flex host that means it keeps taking up space.
      const drop = () => ripple.remove();
      ripple.addEventListener('animationend', drop);
      setTimeout(drop, 800);
  }, { passive: true });

  /* Every tap on a control gets a click and a nudge from here, so individual
     handlers don't each have to remember playSound('click'). They still raise
     the meaningful sounds themselves — success, alarm, tick. */
  document.addEventListener('pointerdown', (e) => {
      const host = e.target.closest && e.target.closest(RIPPLE_TARGETS);
      if (!host || host.disabled) return;
      playSound('click');
      haptic('light');
  }, { passive: true });

  /**
   * Fisher-Yates shuffle into a new array. Every "random order" in the app goes
   * through this: sort(() => Math.random() - 0.5) is biased towards the start.
   */
  function shuffleArray(arr) {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /* --- NO-REPEAT MEMORY --- */

  // Most word games picked at random, or forgot what they had shown the moment a
  // new round began, so the same cards came back within a couple of games however
  // long the list was. This remembers, per phone and per list, what has been
  // dealt; a list only starts over once all of it has been seen.
  const SEEN_KEY = 'ashrySeen_v1';
  let seenLists = null;

  function readSeenLists() {
    if (seenLists) return seenLists;
    try { seenLists = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }
    catch (e) { seenLists = {}; }
    return seenLists;
  }

  /** "Reset everything" has to mean this too. */
  function forgetSeenLists() {
    seenLists = {};
    try { localStorage.removeItem(SEEN_KEY); } catch (e) {}
  }

  /**
   * Deals `count` items from `pool` that this phone has not had from `listId`.
   *
   *   key    how an item is identified (default: the string itself, or its JSON)
   *   avoid  keys to leave out this time only - the cards already up in the
   *          current round - without counting them as dealt
   *
   * Several pools can share one list (Who Am I's categories): starting over only
   * forgets the items of the pool being dealt from.
   */
  function freshPick(listId, pool, count, options) {
    const opts = options || {};
    const keyOf = opts.key || (x => typeof x === 'string' ? x : JSON.stringify(x));
    const avoid = new Set(opts.avoid || []);
    const candidates = (pool || []).filter(x => !avoid.has(keyOf(x)));
    const want = Math.max(0, Math.min(count === undefined ? 1 : count, candidates.length));
    if (!want) return [];

    const lists = readSeenLists();
    const dealt = new Set(lists[listId] || []);
    const unseen = candidates.filter(x => !dealt.has(keyOf(x)));
    let picks;

    if (unseen.length >= want) {
      picks = shuffleArray(unseen).slice(0, want);
      picks.forEach(x => dealt.add(keyOf(x)));
    } else {
      // The list has run out: deal what is left of it, then start it over for
      // the rest, and the new cycle begins with just those.
      const leftKeys = new Set(unseen.map(keyOf));
      const refill = shuffleArray(candidates.filter(x => !leftKeys.has(keyOf(x)))).slice(0, want - unseen.length);
      picks = shuffleArray(unseen).concat(refill);
      pool.forEach(x => dealt.delete(keyOf(x)));
      refill.forEach(x => dealt.add(keyOf(x)));
    }

    lists[listId] = [...dealt];
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(lists)); } catch (e) {}
    return picks;
  }

  /* --- CLOCKS --- */

  // Every live clock, so clearAllIntervals() can stop them and so they can all be
  // re-read when the tab comes back to the foreground.
  const activeClocks = new Set();

  /**
   * A pausable clock anchored to Date.now().
   *
   * Every timer in the app used to sit on setInterval(..., 1000) and decrement a
   * counter. That drifts, and on mobile it does worse than drift: browsers
   * throttle or suspend timers in backgrounded tabs, so locking the screen or
   * switching apps mid-round quietly froze the clock and it resumed as if no time
   * had passed. Reading elapsed time from the clock instead of counting ticks
   * keeps it honest, and each tick is scheduled at the next whole-second boundary
   * rather than 1000ms after the last one, so the display cannot slide.
   *
   *   seconds  countdown length (ignored when countUp is set)
   *   countUp  count up from zero instead of down (imposter's discussion timer)
   *   onTick   called with the whole-second value whenever it changes
   *   onEnd    called once when a countdown reaches zero
   */
  function createClock(options) {
      const countUp = !!options.countUp;
      const totalMs = Math.max(0, Math.round(options.seconds || 0)) * 1000;
      const onTick = options.onTick || function() {};
      const onEnd = options.onEnd || function() {};

      let elapsedBefore = 0;        // ms banked from previous (pre-pause) runs
      let startedAt = Date.now();   // when the current run began
      let timeoutId = null;
      let paused = false;
      let finished = false;
      let lastValue = null;

      const elapsedMs = () =>
          elapsedBefore + ((paused || finished) ? 0 : Date.now() - startedAt);

      const value = () => countUp
          ? Math.floor(elapsedMs() / 1000)
          : Math.max(0, Math.ceil((totalMs - elapsedMs()) / 1000));

      const emit = () => {
          const v = value();
          if (v !== lastValue) {
              lastValue = v;
              onTick(v);
          }
      };

      const cancel = () => {
          if (timeoutId) clearTimeout(timeoutId);
          timeoutId = null;
      };

      // Aim at the next whole-second boundary of the elapsed time, so a late
      // wake-up is absorbed instead of accumulating.
      const schedule = () => {
          cancel();
          timeoutId = setTimeout(step, Math.max(25, 1000 - (elapsedMs() % 1000)));
      };

      function step() {
          timeoutId = null;
          if (paused || finished) return;
          emit();
          if (!countUp && elapsedMs() >= totalMs) {
              finished = true;
              activeClocks.delete(clock);
              onEnd();
              return;
          }
          schedule();
      }

      const clock = {
          /** Re-read the clock right now (used when the tab regains focus). */
          sync() {
              if (!paused && !finished) step();
              return clock;
          },
          pause() {
              if (paused || finished) return clock;
              elapsedBefore = elapsedMs();
              paused = true;
              cancel();
              return clock;
          },
          resume() {
              if (!paused || finished) return clock;
              paused = false;
              startedAt = Date.now();
              emit();
              schedule();
              return clock;
          },
          /** Pause or resume; returns true if the clock is now paused. */
          toggle() {
              if (paused) clock.resume(); else clock.pause();
              return paused;
          },
          stop() {
              finished = true;
              cancel();
              activeClocks.delete(clock);
              return clock;
          },
          isPaused: () => paused,
          isRunning: () => !paused && !finished,
          value: value
      };

      activeClocks.add(clock);
      emit();
      schedule();
      return clock;
  }

  /** Stops every running clock. */
  function stopAllClocks() {
      [...activeClocks].forEach(c => c.stop());
  }

  // A backgrounded tab may not have been able to fire its pending tick, so
  // re-read every clock the moment we are visible again.
  document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
          [...activeClocks].forEach(c => c.sync());
      }
  });

  /* --- GLOBAL STATE & STORAGE --- */

  /**
   * The names this phone knows. Local, and local only.
   *
   * This used to be a column in the `اللاعبين` sheet — one list shared by every
   * device that ever opened the app, so playing once with your family put their
   * names in front of your friends the next time they opened it. It also meant
   * every new name waited on a spreadsheet write before the + button came back.
   */
  const PLAYER_LIBRARY_KEY = 'ashryPlayers_v1';
  let allPlayers = [];
  let SPY_CATEGORIES = {};
  let dataLoaded = false;

  /** Case- and spelling-insensitive, so أحمد and احمد are the same person. */
  function samePlayer(a, b) {
    const fold = (x) => String(x || '').trim().toLowerCase()
      .replace(/[\u064b-\u0652\u0670]/g, '')
      .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
      .replace(/\u0629/g, '\u0647')
      .replace(/[\u0649\u064a]/g, '\u064a')
      .replace(/\s+/g, ' ');
    return fold(a) === fold(b);
  }

  /**
   * The spellings of one word, folded: أسد and اسد, مكتبة and مكتبه, مصطفى and
   * مصطفي, diacritics, the tatweel, punctuation, spaces, and a leading "ال" or
   * "the". Mirrors normaliseClue in RoomGames.js - keep the two identical - so a
   * phone refuses the same Codenames clue the server would, and the one-phone
   * Just One removes the same duplicate clues a room does.
   */
  function foldWord(text) {
    let out = String(text || '').toLowerCase()
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/[ىی]/g, 'ي')
      .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ک/g, 'ك')
      .replace(/[^\p{L}\p{N} ]/gu, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    if (out.indexOf('the ') === 0) out = out.slice(4);
    for (let i = 0; i < 2 && out.length > 3 && out.indexOf('ال') === 0; i++) out = out.slice(2);
    return out.replace(/\s+/g, '');
  }

  function loadPlayerLibrary() {
    try {
      const raw = localStorage.getItem(PLAYER_LIBRARY_KEY);
      allPlayers = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(allPlayers)) allPlayers = [];
    } catch (e) { allPlayers = []; }
    return allPlayers;
  }

  function savePlayerLibrary() {
    try { localStorage.setItem(PLAYER_LIBRARY_KEY, JSON.stringify(allPlayers)); } catch (e) {}
  }

  /** Returns the stored spelling, so a second "احمد" reuses the first "أحمد". */
  function addToPlayerLibrary(rawName) {
    const name = String(rawName || '').trim().slice(0, 24);
    if (!name) return '';
    const existing = allPlayers.find(p => samePlayer(p, name));
    if (existing) return existing;
    allPlayers.push(name);
    savePlayerLibrary();
    return name;
  }

  function removeFromPlayerLibrary(name) {
    allPlayers = allPlayers.filter(p => !samePlayer(p, name));
    savePlayerLibrary();
    // Someone deleted from the library shouldn't stay selected for the round.
    if (appState.activePlayers) {
      appState.activePlayers = appState.activePlayers.filter(p => !samePlayer(p, name));
      saveToLocal();
    }
  }

    justone: { players: [], writers: [], guesserIndex: 0, currentWriterIndex: 0, secretWord: "", clues: [], phase: 'setup' },
    teams: { players: [], count: 2, result: [] },

  };

  // Fail-Safe Aliases for older HTML references
  const charadesState = appState.charades;
  const descState = appState.describe;


  function clearAllIntervals() {
      // Every countdown and clock in the app now runs through createClock, so one
      // call covers monkey, imposter, charades, describe, who-am-I, the general
      // timer and both chess clocks.
      stopAllClocks();

      // ...then drop the handles, so nothing is left holding a stopped clock.
      if (typeof stopTimer === 'function') stopTimer();
      if (typeof stopImposterTimer === 'function') stopImposterTimer();
      dropTimerHandles();

      // Still plain timers: the picker's spin animation and the reaction game's
      // random start delay.
      if (appState.reaction.timeoutId) clearTimeout(appState.reaction.timeoutId);
      if (typeof pickerInterval !== 'undefined' && pickerInterval) {
          clearInterval(pickerInterval);
          pickerInterval = null;
      }
  }

  function toggleLanguage() {
    appState.lang = appState.lang === 'ar' ? 'en' : 'ar';
    applyTranslations();
    // Screens drawn in JS carry their own text; redraw the ones on show.
    if (appState.currentView === 'play-trivia' && typeof renderTriviaBoard === 'function') renderTriviaBoard();
    if (appState.currentView === 'setup-connections' && typeof paintConnectLevel === 'function') paintConnectLevel();
    // A room screen only redraws when the room changes, so it kept the old
    // language until the next move. Drop its signatures and draw it now.
    if ((appState.currentView || '').indexOf('room-') === 0 && typeof Room !== 'undefined' && Room.state) {
      const view = document.getElementById('view-' + appState.currentView);
      if (view) delete view.dataset.sig;
      const setup = document.getElementById('room-host-setup');
      if (setup) delete setup.dataset.sig;
      routeRoomState(Room.state);
    }
    saveToLocal();
    playSound('click');
    haptic('light');
  }

  function applyTranslations() {
    const t = TRANSLATIONS[appState.lang];

    // Direction belongs here, not only in toggleLanguage: every logical
    // property in the stylesheet and the `html[lang="ar"]` typography rules
    // key off these two attributes, so anything that changes the language
    // without going through the toggle would leave the app mirrored.
    document.documentElement.lang = appState.lang;
    document.documentElement.dir = appState.lang === 'en' ? 'ltr' : 'rtl';

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerHTML = t[key];
    });
    
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (t[key]) el.placeholder = t[key];
    });

    // The header shows the current screen's name, not the app name, so it is
    // owned by syncChrome rather than by the generic [data-i18n] sweep.
    syncChrome(appState.currentView);
    updateSettingsLabels();

    // The home screen and the hero on a setup screen are drawn from the
    // catalog in this language (JS_Catalog.html).
    if (typeof renderCatalogViews === 'function' && homeRenderedLang !== appState.lang) renderCatalogViews();
    if (typeof syncGameHero === 'function') syncGameHero(appState.currentView);
  }
  let homeRenderedLang = null;

  /**
   * Popups belong to the page, not to the screen they are written next to. Most
   * sit inside <main> in Controller.html, and on iPhone a position:fixed element
   * inside that scrolling area is drawn inside it: the header and the bottom nav
   * covered the popup and its buttons. Moved under <body> once at start-up,
   * every popup covers the whole screen.
   */
  function hoistModals() {
    document.querySelectorAll('.modal-overlay').forEach(el => {
      if (el.parentElement !== document.body) document.body.appendChild(el);
    });
  }

  const syncEl = document.getElementById('sync-status');
  function setSyncing(isSyncing) {
    if(isSyncing) syncEl.classList.add('syncing');
    else syncEl.classList.remove('syncing');
  }

   /* --- INITIALIZATION --- */
   document.addEventListener('DOMContentLoaded', function() {
     hoistModals();
     initializeApp();
     registerServiceWorker();
 
     // Honour a scanned ?room= link, or quietly rejoin the last room.
     if (typeof initRooms === 'function') initRooms();

     document.body.addEventListener('click', function initWakeLock() {
         if (typeof requestWakeLock === 'function') {
             requestWakeLock(); 
         }
     }, { once: true }); 
 
     // Safety net: Save state whenever the app is hidden or closed
     window.addEventListener('visibilitychange', () => {
         if (document.visibilityState === 'hidden') saveToLocal();
     });
     window.addEventListener('beforeunload', saveToLocal);
   });
  function registerServiceWorker() {
    // The published site only: the local preview sets no STATIC_SITE, so testing
    // never runs against a cached copy. docs/sw.js keeps an offline copy of the
    // app; tools/build-site.mjs writes it.
    if (!window.STATIC_SITE || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  function saveActivePlayers(selectedArray) {
    if (selectedArray && selectedArray.length > 0) {
        appState.activePlayers = selectedArray;
        saveToLocal();
    }
}

  function initializeApp() {
    setSyncing(true);
    applyTranslations();
    if (typeof renderHome === 'function') renderHome();

    // Function to hide loader with transition
    const hideLoader = () => {
        const loader = document.getElementById('app-loader');
        if(loader && !loader.classList.contains('opacity-0')) {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.classList.add('hidden');
                loader.style.display = 'none';
            }, 500);
        }
    };

    // Names are local, and the spy words arrive with the page (SpyWords.js).
    loadPlayerLibrary();

    if (window.SERVER_DATA && window.SERVER_DATA.spyData) {
        SPY_CATEGORIES = window.SERVER_DATA.spyData || {};
        dataLoaded = true;
        setSyncing(false);
        
        // Render UI if needed
        const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
        if (activeSetup) {
            const listContainer = activeSetup.querySelector('[id$="-player-list"]');
            if (listContainer && typeof renderActiveChips === 'function') {
                renderActiveChips(listContainer.id);
            }
        }
        
        // Hide loader immediately!
        hideLoader();
    } else {
        // The build always puts the spy words in the page; carry on without them.
        SPY_CATEGORIES = {};
        dataLoaded = true;
        setSyncing(false);
        hideLoader();
    }

    loadFromLocal();

    // An iPhone copy on the home screen with an older icon (JS_Utils.html).
    if (typeof checkIconBanner === 'function') checkIconBanner();
    // The "open in Safari" link from that banner lands on the install steps.
    if ((window.OPEN_INSTALL || /[?&]install=1/.test(location.search)) && typeof showInstallHelp === 'function') {
        setTimeout(showInstallHelp, 700);
    }

    // Safety timeout to hide loader if script calls take too long
    setTimeout(hideLoader, 2000);
    
    document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
  }

  function reloadApp() {
      initializeApp();
  }

  // Clock handles and timeout ids are parked on appState, but they mean nothing
  // outside the current page: dropping them keeps a revived save from handing back
  // something that merely looks like a live clock.
  const OMIT_FROM_SAVE = ['interval', 'timeoutId'];

  function saveToLocal() {
    localStorage.setItem('gameTrackerState_v1', JSON.stringify(appState,
      (key, value) => OMIT_FROM_SAVE.includes(key) ? undefined : value));
  }

  /**
   * Clears every timer handle parked on appState, and the flags that go with them.
   *
   * Called when leaving a view and again after loading a saved state - a save from
   * an older version holds setInterval ids (plain numbers) where a clock handle is
   * now expected, and either would pass a truthiness check and then blow up on
   * .stop().
   */
  function dropTimerHandles() {
    appState.charades.interval = null;
    appState.describe.interval = null;
    appState.whoami.interval = null;
    appState.whoami.isPaused = false;
    appState.timers.general.interval = null;
    appState.timers.general.running = false;
    appState.timers.chess.interval = null;
    appState.timers.chess.active = null;
    appState.reaction.timeoutId = null;
  }

  function loadFromLocal() {
    const saved = localStorage.getItem('gameTrackerState_v1');
    
    // 👇 FIX: Added 'input-whoami' and 'play-chess' to the safe list
    const validViews = [
        'menu', 'together', 'tools',
        'setup-chameleon', 'reveal-chameleon', 'play-chameleon', 'setup-spyfall', 'reveal-spyfall', 'play-spyfall', 'setup-timesup', 'play-timesup',
        'setup-screw', 'play-screw', 
        'setup-monkey', 'play-monkey', 
        'setup-imposter', 'imposter-reveal', 'play-imposter', 
        'setup-domino', 'play-domino', 
        'setup-spin', 'play-spin', 
        'setup-universal', 'play-universal', 
        'timers',
        'setup-whoami', 'input-whoami', 'play-whoami', 
        'setup-charades', 'play-charades',
        'setup-describe', 'play-describe',
        'setup-wordle', 'play-wordle',
        'setup-guessnum', 'play-guessnum',
        'setup-justone', 'play-justone',
        'setup-tourney', 'play-tourney',
        'setup-teams', 'results-teams',
        'setup-reaction', 'play-reaction',
        'setup-trivia', 'play-trivia',
        'setup-connections', 'play-connections',
        'setup-bomb', 'play-bomb',
        'setup-stop', 'play-stop',
        'setup-memory', 'play-memory',
        'setup-xo', 'play-xo',
        'play-chooser',
        'play-chess'
    ];

    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            
            const deepMerge = (target, source) => {
                for (const key in source) {
                    if (source[key] instanceof Object && !Array.isArray(source[key]) && target[key] instanceof Object) {
                        Object.assign(target[key], deepMerge(target[key], source[key]));
                    } else {
                        target[key] = source[key];
                    }
                }
                return target;
            };
            appState = deepMerge(appState, parsed);
            dropTimerHandles();

            // cachedPlayers was a copy of the shared sheet list; the library
            // is its own store now and is loaded by initializeApp.
            delete appState.cachedPlayers;

            // Room screens come back too: initRooms() redraws them once the session
            // resumes, and restoreView() sends the player to the menu if it can't.
            // Left out, a reload mid-game always landed on the menu.
            if (!validViews.includes(appState.currentView) && String(appState.currentView || '').indexOf('room-') !== 0) {
                appState.currentView = 'menu';
            }
            if(appState.isDarkMode) document.body.classList.add('dark');
            
            document.documentElement.lang = appState.lang || 'ar';
            document.documentElement.dir = (appState.lang === 'en') ? 'ltr' : 'rtl';
            applyTranslations();
        } catch (e) {
            console.error("Error loading state", e);
            appState.currentView = 'menu';
        }
    } else {
        appState.currentView = 'menu'; 
    }
    restoreView();
  }

  // Held so a rapid double-toggle doesn't strip .theme-transition mid-fade.
  let themeTransitionTimer = null;

  function toggleDarkMode() {
      appState.isDarkMode = !appState.isDarkMode;

      // Colour transitions are scoped to this class rather than living in the
      // global `*` rule, so they only apply while the theme is switching.
      document.body.classList.add('theme-transition');
      clearTimeout(themeTransitionTimer);
      themeTransitionTimer = setTimeout(() => {
          document.body.classList.remove('theme-transition');
      }, 350);

      document.body.classList.toggle('dark');

      const icon = appState.isDarkMode ? '☀️' : '🌙';
      const headerIcon = document.getElementById('dark-mode-icon');
      const bottomIcon = document.getElementById('bottom-dark-mode-icon');
      
      if (headerIcon) headerIcon.innerText = icon;
      if (bottomIcon) bottomIcon.innerText = icon;
      
      updateSettingsLabels();
      playSound('click');
      haptic('light');
      saveToLocal();
  }

  function restoreView() {
    document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
    // setView sets these, but a reload restores the screen without it: the
    // chess clock came back with the header and nav, and the big screen as a
    // 520px phone column.
    document.body.classList.toggle('is-fullscreen-view', FULLSCREEN_VIEWS.indexOf(appState.currentView) !== -1);
    document.body.classList.toggle('is-tv-view', appState.currentView === 'room-tv');
    
    const viewEl = document.getElementById('view-' + appState.currentView);
    
    if (viewEl) {
        // --- RESTORE GAME LOGIC ---
        if (appState.currentView === 'together' && typeof renderTogether === 'function') renderTogether();
        else if (appState.currentView === 'tools' && typeof renderTools === 'function') renderTools();
        else if (appState.currentView === 'play-screw') renderScrewBoard();
        else if (appState.currentView === 'play-monkey') { renderMonkeyBoard(); updateTimerUI(); }
        else if (appState.currentView === 'imposter-reveal') showRevealStep();
        else if (appState.currentView === 'play-imposter') { renderImposterBoard(); isPaused = true; updateImposterTimerUI(); }
        else if (appState.currentView === 'play-domino') {
            if ((appState.domino.players || []).length) renderDominoBoard();
            else setTimeout(() => setView('setup-domino'), 50);
        }
        else if (appState.currentView === 'play-universal') {
            if ((appState.universal.players || []).length) renderUniversalBoard();
            else setTimeout(() => setView('setup-universal'), 50);
        }
        else if (appState.currentView === 'timers') switchTimerMode('general');
        // The bracket lives entirely in appState, so it redraws exactly. (The
        // old call named a function that does not exist, and the typeof guard
        // meant it failed silently and showed an empty bracket.)
        else if (appState.currentView === 'play-tourney') {
            if ((appState.tourney.matches || []).length && typeof renderBracket === 'function') renderBracket();
            else setTimeout(() => setView('setup-tourney'), 50);
        }
        // paintTeams, not renderTeams: the latter re-rolls, re-navigates and
        // re-fires confetti, and called with no argument it threw outright.
        else if (appState.currentView === 'results-teams') {
            if ((appState.teams.result || []).length && typeof paintTeams === 'function') paintTeams(appState.teams.result);
            else setTimeout(() => setView('setup-teams'), 50);
        }
        else if (appState.currentView === 'play-spin') {
            const pickerDisplay = document.getElementById('picker-display');
            if(pickerDisplay) pickerDisplay.innerText = "???";
            const spinResultBox = document.getElementById('spin-result-box');
            if(spinResultBox) spinResultBox.classList.add('hidden');
            const spinBtn = document.getElementById('spin-btn');
            if(spinBtn) spinBtn.disabled = false;
        }
        // 👇 FIX: Full-Screen reload protections added here 👇
        else if (appState.currentView === 'play-chess' && typeof updateChessUI === 'function') {
            updateChessUI(); 
        }
        else if (appState.currentView === 'play-reaction') {
            setTimeout(() => setView('setup-reaction'), 50); 
        }
        else if (appState.currentView === 'play-whoami' || appState.currentView === 'input-whoami') {
            setTimeout(() => setView('setup-whoami'), 50);
        }
        // Fully restorable: the whole game is in appState, it just needs drawing.
        else if (appState.currentView === 'play-wordle' && typeof renderWordleBoard === 'function') {
            renderWordleBoard();
            renderKeyboard();
        }
        else if (appState.currentView === 'play-guessnum' && typeof renderGuessNumHistory === 'function') {
            renderGuessNumHistory();
        }
        // Room screens are drawn by the server's next projection. If the saved
        // session cannot be resumed there is nothing to draw, so don't strand
        // the player on a blank view - initRooms() decides which it is.
        else if (appState.currentView.indexOf('room-') === 0) {
            const restored = appState.currentView;
            setTimeout(() => {
                // Only if nothing has moved on meanwhile. A join link opens
                // room-join during this wait, and bouncing then threw the join
                // screen away; room-join itself needs no session to stay on.
                if (restored === 'room-join' || appState.currentView !== restored) return;
                if (typeof Room === 'undefined' || !Room.isIn) setView('menu');
            }, 1500);
        }
        else if (appState.currentView === 'play-connections') {
            // The puzzle lives in a module variable, not appState, so a reload
            // has nothing to draw — start a fresh one rather than show a blank grid.
            setTimeout(() => setupConnections(), 50);
        }
        // The team board is all in appState: draw it as it was left.
        else if (appState.currentView === 'play-trivia' && typeof renderTriviaBoard === 'function') {
            renderTriviaBoard();
            // A card that was open comes back with the time it had left. Not
            // straight away: initializeApp closes every overlay once this has
            // run, and a ?room= link may have moved the screen on meanwhile.
            if (appState.triviaBoard && appState.triviaBoard.open && typeof showTriviaCell === 'function') {
                setTimeout(() => { if (appState.currentView === 'play-trivia') showTriviaCell(); }, 0);
            }
        }
        // Timer-driven: the time left was never persisted, so resuming would be
        // a lie. Send them back to setup and say so rather than showing a dead
        // card and a frozen clock.
        else if (appState.currentView === 'play-charades') {
            setTimeout(() => { setView('setup-charades'); toastRoundLost(); }, 50);
        }
        else if (appState.currentView === 'play-describe') {
            setTimeout(() => { setView('setup-describe'); toastRoundLost(); }, 50);
        }
        else if (appState.currentView === 'play-justone') {
            setTimeout(() => { setView('setup-justone'); toastRoundLost(); }, 50);
        }
        // The pass-the-phone deals live in module variables, not appState, so a
        // reload has no deal to show - and the reveal screens hold the secrets.
        else if (/^(reveal|play)-(chameleon|spyfall)$/.test(appState.currentView) || appState.currentView === 'play-timesup') {
            const game = appState.currentView.split('-')[1];
            setTimeout(() => { setView('setup-' + game); toastRoundLost(); }, 50);
        }
        // Each of these keeps its whole game in appState, with any deadline
        // as a timestamp, so its restore function redraws it as it was; it
        // says no when there was nothing to come back to.
        else if (appState.currentView === 'play-bomb') {
            if (typeof restoreBomb !== 'function' || !restoreBomb()) setTimeout(() => setView('setup-bomb'), 50);
        }
        else if (appState.currentView === 'play-stop') {
            if (typeof restoreStop !== 'function' || !restoreStop()) setTimeout(() => setView('setup-stop'), 50);
        }
        else if (appState.currentView === 'play-memory') {
            if (typeof restoreMemory !== 'function' || !restoreMemory()) setTimeout(() => setView('setup-memory'), 50);
        }
        else if (appState.currentView === 'play-xo') {
            if (typeof restoreXO !== 'function' || !restoreXO()) setTimeout(() => setView('setup-xo'), 50);
        }
        // No game to keep: the chooser just needs its stage wired up again.
        else if (appState.currentView === 'play-chooser') {
            setTimeout(() => { if (typeof openChooser === 'function') openChooser(); }, 0);
        }
        // 👆 END PROTECTIONS 👆
        else if (appState.currentView.startsWith('setup-')) {
            const listId = appState.currentView.replace('setup-', '') + '-player-list';
            if(typeof renderActiveChips === 'function') renderActiveChips(listId, true);
            paintSetupOptions(appState.currentView);
            if(appState.currentView === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
            if(appState.currentView === 'setup-chameleon' && typeof renderChameleonCategories === 'function') renderChameleonCategories();
            
            if(appState.currentView === 'setup-charades' && typeof renderCharadesDropdown === 'function') {
                renderCharadesDropdown(); 
            }
        }
        
        const meta = VIEW_META[appState.currentView];
        if (meta && meta.accent) viewEl.setAttribute('data-accent', meta.accent);
        viewEl.classList.remove('hidden');
        syncChrome(appState.currentView);
    } else {
        const menuEl = document.getElementById('view-menu');
        if (menuEl) {
            menuEl.classList.remove('hidden');
            appState.currentView = 'menu';
            syncChrome('menu');
        }
    }
  }

  // Depth is what makes the slide directional: deeper = forward, shallower = back.
  function viewDepth(viewId) {
    let depth = 0;
    let cursor = viewId;
    while (cursor && VIEW_META[cursor] && VIEW_META[cursor].up && depth < 8) {
      cursor = VIEW_META[cursor].up;
      depth++;
    }
    return depth;
  }

  let titleSwapTimer = null;
  let pendingTitle = '';

  /** Header title, back button and nav state for the view now on screen. */
  function syncChrome(viewId) {
    const meta = VIEW_META[viewId] || {};
    const t = TRANSLATIONS[appState.lang];
    const titleEl = document.getElementById('app-title');
    const backEl = document.getElementById('nav-back');
    const homeEl = document.getElementById('nav-home');

    if (titleEl) {
      const text = (meta.title && t[meta.title]) || t.title;
      const textEl = document.getElementById('app-title-text') || titleEl;
      // The brand mark sits beside the name on the home screen only.
      titleEl.classList.toggle('shell__title--brand', viewId === 'menu');
      if (textEl.innerText !== text) {
        // Cross-fade rather than snapping the text. One timer, so navigating
        // twice in quick succession can't land the writes out of order.
        pendingTitle = text;
        titleEl.classList.add('is-swapping');
        clearTimeout(titleSwapTimer);
        titleSwapTimer = setTimeout(() => {
          textEl.innerText = pendingTitle;
          titleEl.classList.remove('is-swapping');
        }, 110);
      }
    }
    if (backEl) backEl.classList.toggle('is-hidden', !meta.up);
    const tab = navTabFor(viewId);
    ['home', 'together', 'tools'].forEach(name => {
      const el = document.getElementById('nav-' + name);
      if (el) el.classList.toggle('is-active', name === tab);
    });
    // The screen's own icon beside its name; the home shows the mark instead.
    const iconEl = document.getElementById('app-title-icon');
    if (iconEl) iconEl.textContent = viewId === 'menu' ? '' : screenIcon(viewId);
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
  }

  /** Which bottom tab a screen sits under: the rooms, the tools, or the games. */
  function navTabFor(viewId) {
    const id = String(viewId || '');
    if (id === 'together' || id.indexOf('room-') === 0 || id === 'setup-codenames') return 'together';
    if (id === 'tools') return 'tools';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[id] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry && entry.group === 'tools' ? 'tools' : 'home';
  }

  /** The emoji for a screen, from its help entry - every screen has one. */
  function screenIcon(viewId) {
    if (viewId === 'together') return '📲';
    if (viewId === 'tools') return '🛠️';
    const key = (typeof HELP_FOR_VIEW !== 'undefined') ? HELP_FOR_VIEW[viewId] : null;
    const entry = (key && typeof helpEntry === 'function') ? helpEntry(key) : null;
    return entry ? entry.icon : '';
  }

  /** The header back button. Falls back to the menu for unregistered views. */
  function goBack() {
    const meta = VIEW_META[appState.currentView];
    setView(meta && meta.up ? meta.up : 'menu');
  }

  /** Told to the player when a reload cost them a timed round. */
  function toastRoundLost() {
    showToast(appState.lang === 'ar'
      ? 'انتهت الجولة بسبب إعادة تحميل الصفحة'
      : 'The round ended because the page reloaded');
  }

  /* The shell's height (--app-h in Style.html). 100dvh is right nearly always,
     but iOS keeps reporting the old value for a moment after the phone turns,
     and a landscape screen laid out at portrait height has half of itself off
     the bottom with nothing to scroll. innerHeight is current once resize
     fires; the late re-read covers a turn that reports its size after the
     event. */
  /* --- SCREEN SIZE -----------------------------------------------------------
   * Every size in Style.html is in rem, so the font size on <html> scales the
   * whole app. "auto" leaves it to the screen (the ANY SCREEN block). A laptop
   * driving a TV can report a small screen, so a size can also be picked here.
   * ------------------------------------------------------------------------ */
  const UI_SCALES = ['auto', '100', '125', '150', '200'];
  const UI_SCALE_KEY = 'ashryUiScale';

  function uiScale() {
    try {
      const saved = localStorage.getItem(UI_SCALE_KEY);
      return UI_SCALES.indexOf(saved) !== -1 ? saved : 'auto';
    } catch (e) {
      return 'auto';
    }
  }

  function applyUiScale() {
    const scale = uiScale();
    if (scale === 'auto') delete document.documentElement.dataset.uiScale;
    else document.documentElement.dataset.uiScale = scale;
  }

  function cycleUiScale() {
    const next = UI_SCALES[(UI_SCALES.indexOf(uiScale()) + 1) % UI_SCALES.length];
    try { localStorage.setItem(UI_SCALE_KEY, next); } catch (e) {}
    applyUiScale();
    updateSettingsLabels();
    haptic('light');
  }

  applyUiScale();

  function syncAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  syncAppHeight();
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      syncAppHeight();
      // Turning can leave the page itself scrolled, which shifts the whole app.
      window.scrollTo(0, 0);
    }, 300);
  });

  let viewEnterFallback = null;

  /** Tools that take the whole screen; the header and nav step aside for them. */
  const FULLSCREEN_VIEWS = ['play-chess', 'play-reaction', 'room-tv', 'play-chooser'];

  /* Setup screens whose options are drawn from appState (segmented controls,
     chips). They are painted whenever the screen is reached - from the menu,
     the back button or a reload - so they always show what is saved. */
  const SETUP_PAINTERS = {
    'setup-bomb': 'paintBombSetup',
    'setup-stop': 'paintStopSetup',
    'setup-memory': 'paintMemorySetup',
    'setup-xo': 'paintXOSetup',
    'setup-imposter': 'paintImposterSetup',
    'setup-whoami': 'paintWhoAmISetup',
    'setup-charades': 'paintCharadesSetup',
    'setup-describe': 'paintDescribeSetup'
  };
  function paintSetupOptions(viewId) {
    const fn = SETUP_PAINTERS[viewId];
    if (fn && typeof window[fn] === 'function') window[fn]();
    const view = document.getElementById('view-' + viewId);
    if (view) syncTimePicks(view);
  }

  /* A segmented control standing in for a number field. A round length is one
     of a few sensible values, not something to type: the buttons write the
     seconds into the (hidden) input the game already reads. */
  function pickTime(btn, seconds) {
    const group = btn.closest('.time-pick');
    if (!group) return;
    const input = document.getElementById(group.dataset.for);
    if (input) input.value = seconds;
    group.querySelectorAll('.segmented__item').forEach(b => b.classList.toggle('is-active', b === btn));
  }
  function syncTimePicks(view) {
    view.querySelectorAll('.time-pick').forEach(group => {
      const input = document.getElementById(group.dataset.for);
      const value = input ? String(input.value) : '';
      group.querySelectorAll('.segmented__item').forEach(b => b.classList.toggle('is-active', b.textContent.trim() === value));
    });
  }

  function setView(viewId) {
    const previous = appState.currentView;
    document.body.classList.toggle('is-fullscreen-view', FULLSCREEN_VIEWS.indexOf(viewId) !== -1);
    document.body.classList.toggle('is-tv-view', viewId === 'room-tv');
    const goingBack = viewDepth(viewId) < viewDepth(previous);

    appState.currentView = viewId;
    saveToLocal();

    if (viewId === 'menu' && typeof renderHome === 'function') renderHome();
    if (viewId === 'together' && typeof renderTogether === 'function') renderTogether();
    if (viewId === 'tools' && typeof renderTools === 'function') renderTools();

    document.querySelectorAll('[id^="view-"]').forEach(el => {
        el.classList.add('hidden');
        el.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
    });

    const viewEl = document.getElementById('view-' + viewId);
    if (viewEl) {
        const meta = VIEW_META[viewId];
        if (meta && meta.accent) viewEl.setAttribute('data-accent', meta.accent);

        viewEl.classList.remove('hidden');
        void viewEl.offsetWidth;   // restart the animation
        viewEl.classList.add('view-enter', goingBack ? 'view-enter-back' : 'view-enter-fwd');

        // animationend is the normal path, but never the only one — a very
        // short or suppressed animation fires no events at all, and the class
        // would then hold its transform forever (see the handler below).
        clearTimeout(viewEnterFallback);
        viewEnterFallback = setTimeout(() => {
            viewEl.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
        }, 600);
    }

    // A view arrives scrolled to wherever the last one was left otherwise.
    const main = document.getElementById('shell-main');
    if (main) main.scrollTop = 0;

    closeAllModals();
    clearAllIntervals();
    syncChrome(viewId);

    if(viewId.startsWith('setup-')) {
        const listId = viewId.replace('setup-', '') + '-player-list';
        if(typeof renderActiveChips === 'function') renderActiveChips(listId, true);
        paintSetupOptions(viewId);
        if(viewId === 'setup-imposter' && typeof renderSpyCategories === 'function') renderSpyCategories();
        if(viewId === 'setup-chameleon' && typeof renderChameleonCategories === 'function') renderChameleonCategories();
        if(viewId === 'setup-charades' && typeof renderCharadesDropdown === 'function') renderCharadesDropdown();
    }
    applyTranslations();
}

  /* The enter animation must not leave its transform behind: a transformed
     element becomes the containing block for its position:fixed descendants,
     which detached the floating action bars from the viewport. */
  document.addEventListener('animationend', (e) => {
      if (e.animationName === 'viewEnter' && e.target.id && e.target.id.startsWith('view-')) {
          e.target.classList.remove('view-enter', 'view-enter-fwd', 'view-enter-back');
      }
  });

  /* --- SETTINGS SHEET --- */
  function openSettings() {
      playSound('click');
      updateSettingsLabels();
      const el = document.getElementById('settings-modal');
      if (el) el.classList.remove('hidden');
  }

  function updateSettingsLabels() {
      const t = TRANSLATIONS[appState.lang];
      const icon = document.getElementById('settings-theme-icon');
      const themeVal = document.getElementById('settings-theme-value');
      const langVal = document.getElementById('settings-lang-value');
      if (icon) icon.innerText = appState.isDarkMode ? '☀️' : '🌙';
      if (themeVal) themeVal.innerText = appState.isDarkMode ? t.theme_dark : t.theme_light;
      if (langVal) langVal.innerText = appState.lang === 'ar' ? 'العربية' : 'English';
      const nameVal = document.getElementById('settings-name-value');
      if (nameVal) nameVal.innerText = (typeof roomName !== 'undefined' && roomName.get()) || t.name_not_set || '';
      const scaleVal = document.getElementById('settings-scale-value');
      if (scaleVal) scaleVal.innerText = uiScale() === 'auto' ? (t.ui_scale_auto || '') : uiScale() + '%';
  }

  /* --- CORE UI HELPERS --- */
  function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(el => el.classList.add('hidden'));
      // setView() closes everything, so the help nav item has to be released
      // here too or it stays lit after navigating away.
      const nav = document.getElementById('nav-help');
      if (nav) nav.classList.remove('is-active');
  }
  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
    // The help sheet lights its nav item while it is open.
    if (id === 'help-modal') {
      const nav = document.getElementById('nav-help');
      if (nav) nav.classList.remove('is-active');
    }
  }

  function showToast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    let icon = 'ℹ️';
    if(type === 'success') icon = '✅';
    if(type === 'error') icon = '⚠️';
    const iconSpan = document.createElement('span');
    iconSpan.innerText = icon;
    const msgSpan = document.createElement('span');
    msgSpan.innerText = msg;
    el.appendChild(iconSpan);
    el.appendChild(document.createTextNode(' '));
    el.appendChild(msgSpan);
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 400);
    }, 3000);
  }
