<script>
/* ============================================================================
   الموقع السري — ON SEPARATE PHONES, AND ON THE TV
   ----------------------------------------------------------------------------
   Every phone shows its owner the place and their job there; the spy's phone
   says only that they are the spy. The list of all the places is on every
   screen (it is what the spy guesses from), and can be crossed out locally
   as suspects are ruled out. A clock runs on the server: when it runs out
   the vote opens by itself. Rules: spyfallRoomAction in RoomGames.js.
   ========================================================================= */

const spyfallRoom = { crossed: new Set(), crossedRound: '', guessing: false, clock: null, clockKey: null };
const SPYFALL_ROOM_OPTS_KEY = 'ashrySpyfallRoomOpts';

function spyfallRoomOpts() {
  const base = { minutes: 8, spies: 1 };
  try {
    const saved = JSON.parse(localStorage.getItem(SPYFALL_ROOM_OPTS_KEY) || 'null');
    if (saved && [5, 8, 10].indexOf(saved.minutes) !== -1) base.minutes = saved.minutes;
    if (saved && [1, 2].indexOf(saved.spies) !== -1) base.spies = saved.spies;
  } catch (e) {}
  return base;
}

function setSpyfallRoomOpt(key, value) {
  const o = spyfallRoomOpts();
  o[key] = Number(value);
  try { localStorage.setItem(SPYFALL_ROOM_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

ROOM_GAMES.spyfall = {
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang];
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(t.spy_room_hint || '')}</p>`;
    const o = spyfallRoomOpts();
    const seg = (key, values, current, labelOf) => `
      <div class="segmented" role="group">
        ${values.map(v => `<button type="button" class="segmented__item ${v === current ? 'is-active' : ''}" onclick="setSpyfallRoomOpt('${key}', ${v})">${labelOf(v)}</button>`).join('')}
      </div>`;
    return `
      <div class="card card--tight">
        <div class="field">
          <label class="field__label">${escapeHTML(t.spy_minutes || '')}</label>
          ${seg('minutes', [5, 8, 10], o.minutes, v => v)}
        </div>
        <div class="field">
          <label class="field__label">${escapeHTML(t.spy_room_count || '')}</label>
          ${seg('spies', [1, 2], o.spies, v => v)}
          <p class="field__hint">${escapeHTML(t.spy_two_hint || '')}</p>
        </div>
        <p class="field__hint" style="text-align:center">${escapeHTML(t.spy_room_hint || '')}</p>
      </div>`;
  },
  startPayload() {
    const o = spyfallRoomOpts();
    return { lang: VOTE_LANG(), minutes: o.minutes, spies: o.spies };
  },

  render(state) {
    if (appState.currentView !== 'room-spyfall') setView('room-spyfall');
    const el = document.getElementById('view-room-spyfall');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const v = s.vote || {};
    const roundKey = roomDealKey(state, s.round);
    if (spyfallRoom.crossedRound !== roundKey) { spyfallRoom.crossed = new Set(); spyfallRoom.crossedRound = roundKey; spyfallRoom.guessing = false; }
    const sig = ['spy', s.phase, s.round, (v.voted || []).length, v.phase, s.outcome, state.youAreHost, appState.lang,
                 spyfallRoom.guessing, [...spyfallRoom.crossed].join(','), JSON.stringify(s.scores || {})].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => spyfallFrame(state, t));
    if (rebuilt) spyfallFirstSpin(el, state, 'phone');
    if (rebuilt && s.phase === 'results' && s.outcome === 'caught' && typeof confetti === 'function') afterReveal(el, () => confetti({ particleCount: 120, spread: 70 }));
    refreshRoomPlayerStrip(el, state);
    if (s.phase === 'play' && s.endsAt) startSpyfallRoomClock(s); else stopSpyfallRoomClock();
  }
};

/** The places, as chips; tapping crosses one out on this phone only. */
function spyfallPlacesHtml(s, opts) {
  const o = opts || {};
  return `
    <div class="spy-places">
      ${(s.locations || []).map(loc => {
        const crossed = spyfallRoom.crossed.has(loc);
        const secret = s.phase === 'results' && loc === s.location;
        const cls = ['spy-place', crossed ? 'is-crossed' : '', secret ? 'is-secret' : '', s.phase === 'results' && s.guess === loc && !secret ? 'is-wrong' : ''].join(' ');
        const onclick = o.guess ? `spyfallGuessPlace('${jsStringAttr(loc)}')` : (o.cross ? `spyfallCross('${jsStringAttr(loc)}')` : '');
        return onclick ? `<button type="button" class="${cls}" onclick="${onclick}">${escapeHTML(loc)}</button>` : `<span class="${cls}">${escapeHTML(loc)}</span>`;
      }).join('')}
    </div>`;
}

function spyfallFrame(state, t) {
  const s = state.shared;
  const you = state.you || {};
  const iAmSpy = you.role === 'spy';
  const inRound = (s.roster || []).indexOf(Room.me) !== -1;
  const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
  const head = `
    <div class="play-head">
      <span class="badge">${escapeHTML(t.round || '')} <span class="metric">${s.round}</span></span>
      ${s.phase === 'play' && s.endsAt ? `<span id="spy-room-timer" class="badge badge--accent metric">${spyfallClockText(s.endsAt)}</span>` : ''}
    </div>`;
  // The same card, shape and colour for the spy and everyone else (like مافيا's
  // night): it stays up through play and the vote, and a red card with no place
  // on it told the table who the spy was. Only the words differ.
  const card = !inRound ? `<div class="waiting-note">${escapeHTML(t.vote_spectating || '')}</div>` : (iAmSpy
    ? `<div class="role-card"><div class="role-card__label">🕵️ ${escapeHTML(t.spy_you_are || '')}</div><div class="role-card__value">❓</div><div class="role-card__hint">${escapeHTML(t.spy_you_hint || '')}</div></div>`
    : `<div class="role-card"><div class="role-card__label">📍 ${escapeHTML(t.spy_location || '')}</div><div class="role-card__value">${escapeHTML(you.location || '')}</div><div class="role-card__hint">🧑‍💼 ${escapeHTML(t.spy_your_job || '')}: <b>${escapeHTML(you.job || '')}</b></div></div>`);

  if (s.phase === 'play') {
    // The spy's way to guess is the same quiet button on every phone in the
    // round, as on one phone: a red «أنا الجاسوس» on the spy's phone alone
    // named the spy to anyone glancing at it. A non-spy's tap only says so.
    // 525: the guess mode (on the spy's phone only) looks like what it is: the
    // card's edge goes --danger, the hint says a tap is final, and «إلغاء» is
    // pinned in the sticky bar, so a spy never guesses thinking they cross out.
    const guessing = spyfallRoom.guessing && iAmSpy;
    const guessBtn = inRound && !guessing
      ? `<button class="btn btn--ghost btn--sm" onclick="spyfallToggleGuess()"><span aria-hidden="true">🕵️ </span>${escapeHTML(t.spy_guess_short || '')}</button>`
      : '';
    return head + card + `
      <p class="field__hint spy-first" style="text-align:center">🎤 ${escapeHTML(t.spy_first || '')}: <b class="spy-first__name" data-spy-first>${escapeHTML(nameOf(s.firstId))}</b></p>
      <div class="card card--tight ${guessing ? 'spy-guess-card' : ''}">
        <div class="eyebrow ${guessing ? 'tx-danger' : ''}">${escapeHTML(guessing ? (t.spy_pick_place || '') : (t.spy_places || ''))}</div>
        ${guessing ? `<p class="field__hint tx-danger">🎯 ${escapeHTML(t.spy_bold_hint || '')}</p>` : ''}
        ${spyfallPlacesHtml(s, guessing ? { guess: true } : { cross: true })}
        ${guessing ? '' : `<p class="field__hint">${escapeHTML(t.spy_cross_hint || '')}</p>`}
      </div>
      ${guessing ? `<div class="view-actions spy-guess-bar"><button class="btn btn--secondary btn--lg" onclick="spyfallToggleGuess()">✕ ${escapeHTML(t.cancel || '')}</button></div>` : ''}
      <div class="btn-stack">
        ${guessBtn}
        ${roomMoveOnHtml(state, `<button class="btn btn--primary btn--lg" onclick="roomAct('startVote')">${escapeHTML(t.spy_start_vote || '')}</button>`)}
      </div>
      ${state.youAreHost ? '' : `<span class="room-moveon-not"><div class="waiting-note">${escapeHTML(t.spy_wait_vote || '')}</div></span>`}
      ${renderRoomPlayerStrip(state)}`;
  }
  if (s.phase === 'voting') {
    return head + card + `
      <div class="card card--tight">
        <div class="eyebrow">${escapeHTML(t.accuse_player || '')}</div>
        ${renderBallot(state, { ownLabel: t.vote_you })}
      </div>` + renderRoomPlayerStrip(state);
  }
  if (s.phase === 'guess') {
    const mine = s.guesserId === Room.me;
    // The vote first, the caught spy's bar rising last; their card stays face down till then.
    const bars = roomSpyVoteBars(state, [s.guesserId], 'phone');
    const cover = spyRevealParts(['spy-guess', roomDealKey(state, s.round), s.guesserId].join('|'), t.reveal_spy_was, bars.ms);
    return head + `${bars.html}
      <div class="card card--accent ${cover.cls}" ${cover.attrs} style="text-align:center; --cover-at:${cover.at}ms">${cover.cover}
        <div class="metric metric--md">🕵️ ${escapeHTML(s.guesserName || '')}</div>
        <p class="sheet__subtitle">${escapeHTML(mine ? (t.spy_room_guess_hint || '') : (t.spy_guessing || ''))}</p>
      </div>
      <div class="card card--tight">${spyfallPlacesHtml(s, mine ? { guess: true } : {})}</div>
      ${roomMoveOnHtml(state, `<div class="btn-stack"><button class="btn btn--ghost btn--sm" onclick="roomAct('skipGuess')">${escapeHTML(t.fa_skip_guess || '')}</button></div>`)}
      ${renderRoomPlayerStrip(state)}`;
  }
  const won = s.outcome === 'caught';
  const line = s.impostorLeft ? (t.room_impostor_left || '').replace('{name}', s.impostorLeftName || '{name}') : s.outcome === 'escaped' ? (t.spy_escaped || '') : s.outcome === 'stole' ? (t.spy_stole || '') : (t.spy_caught || '');
  const revealKey = ['spy', roomDealKey(state, s.round), s.outcome, s.location].join('|');
  // The vote as bars first, the spy's own rising last and lit; the card and the spy wait for it.
  const bars = roomSpyVoteBars(state, s.spyIds || [], 'phone');
  const cover = spyRevealParts(revealKey, (s.spyNames || []).length > 1 ? t.reveal_spies_were : t.reveal_spy_was, bars.ms);
  const cast = typeof spyCastHtml === 'function' ? spyCastHtml(revealKey, spyCastVerdict(s.outcome), { kind: 'spyfall', loud: spyCastLoud(state), after: cover.at }) : '';
  return head + `${bars.html}${cast}
    <div class="card ${won ? 'card--accent' : ''} ${cover.cls}" ${cover.attrs} style="text-align:center; --cover-at:${cover.at}ms">${cover.cover}
      <div class="metric metric--md ${won ? 'tx-success' : 'tx-danger'}">${won ? '🎉' : '🕵️'} ${escapeHTML(line.replace('{name}', (s.spyNames || []).join(' · ')))}</div>
      <p class="sheet__subtitle">📍 ${escapeHTML(s.location || '')}${s.accusedName ? ` · ${escapeHTML(t.cham_accused || '')}: ${escapeHTML(s.accusedName)}` : ''}${s.guess ? ` · ${escapeHTML(t.spy_guess_was || '')}: ${escapeHTML(s.guess)}` : ''}</p>
      ${spyfallPtsLine(s, t) ? `<p class="field__hint">${escapeHTML(spyfallPtsLine(s, t))}</p>` : ''}
    </div>
    ${renderScoreboard(s.board)}
    ${roomMoveOnHtml(state,
      `<div class="btn-stack">
           <button class="btn btn--primary btn--lg" onclick="roomAct('nextRound', { lang: '${VOTE_LANG()}' })">${escapeHTML(t.next_round || '')}</button>
           ${state.youAreHost ? `<button class="btn btn--ghost" onclick="tvBackToHub()">${escapeHTML(t.room_another_game || '')}</button>` : ''}
         </div>`,
      `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`)}
    ${renderRoomPlayerStrip(state)}`;
}

/** 520: what the spy's right guess was worth (3 bold, 1 after a catch); '' otherwise. */
function spyfallPtsLine(s, t) {
  if (s.outcome !== 'stole' || !s.spyPts) return '';
  return s.bold ? (t.spy_pts_bold || '') : (t.spy_pts_late || '');
}

function spyfallCross(loc) {
  if (spyfallRoom.crossed.has(loc)) spyfallRoom.crossed.delete(loc); else spyfallRoom.crossed.add(loc);
  haptic('light');
  if (Room.state) ROOM_GAMES.spyfall.render(Room.state);
}

function spyfallToggleGuess() {
  const me = (Room.state && Room.state.you) || {};
  if (me.role !== 'spy') {
    showToast(TRANSLATIONS[appState.lang].spy_guess_only_spy || (appState.lang === 'en' ? 'Only the spy guesses the place: you already know it' : 'الزرار ده للجاسوس بس: أنت عارف المكان'));
    return;
  }
  spyfallRoom.guessing = !spyfallRoom.guessing;
  if (Room.state) ROOM_GAMES.spyfall.render(Room.state);
}

function spyfallGuessPlace(loc) {
  showConfirmModal((TRANSLATIONS[appState.lang].spy_confirm_guess || '{place}').replace('{place}', loc), () => {
    spyfallRoom.guessing = false;
    roomAct('spyGuess', { location: loc });
  }, { yes: 'cf_guess', tone: 'accent', icon: '🎯' });
}

function spyfallClockText(endsAt) {
  const left = Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000));
  return `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}

function paintSpyfallRoomTimer(endsAt) {
  const text = spyfallClockText(endsAt);
  const low = endsAt - roomServerNow() <= 30000;
  const el = document.getElementById('spy-room-timer');
  if (el) { el.textContent = text; el.classList.toggle('badge--danger', low); el.classList.toggle('badge--accent', !low); }
  const big = document.getElementById('tv-spy-timer');
  if (big) { big.textContent = text; big.classList.toggle('is-low', low); }
  countdownUrgency(el || big, Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000)));
}

function startSpyfallRoomClock(s) {
  paintSpyfallRoomTimer(s.endsAt);
  if (spyfallRoom.clockKey === s.endsAt && spyfallRoom.clock && spyfallRoom.clock.isRunning()) return;
  stopSpyfallRoomClock();
  spyfallRoom.clockKey = s.endsAt;
  const endsAt = s.endsAt;
  spyfallRoom.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - roomServerNow()) / 1000)),
    onTick: () => paintSpyfallRoomTimer(endsAt),
    onEnd: () => {
      spyfallRoom.clock = null;
      // Only if this round is still running here: not after the room moved to another game.
      const st = Room.state;
      if (!st || st.game !== 'spyfall' || !st.shared || st.shared.phase !== 'play' || st.shared.endsAt !== endsAt) return;
      playSound('alarm');
    }
  });
}

function stopSpyfallRoomClock() {
  countdownClear();
  if (spyfallRoom.clock) spyfallRoom.clock.stop();
  spyfallRoom.clock = null;
  spyfallRoom.clockKey = null;
}
onRoomClocksReset(stopSpyfallRoomClock);

/* --- the big screen --- */
TV_GAMES.spyfall = {
  sig(state) {
    const s = state.shared || {};
    const v = s.vote || {};
    return [s.phase, s.round, (v.voted || []).length, v.phase, s.outcome, s.bold ? 1 : 0, JSON.stringify(s.scores || {})].join('|');
  },
  frame(state, t) {
    const s = state.shared || {};
    const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
    const head = `<div class="tv-eyebrow tv-center-text">${t.round || ''} ${s.round}</div>`;
    const places = `<div class="tv-spy-places">${(s.locations || []).map(loc => `<span class="tv-chip ${s.phase === 'results' && loc === s.location ? 'is-done' : ''}">${escapeHTML(loc)}</span>`).join('')}</div>`;
    if (s.phase === 'play') {
      return `<div class="tv-vote">${head}
        <div class="tv-timer tv-timer--big" id="tv-spy-timer">${spyfallClockText(s.endsAt)}</div>
        <div class="tv-note spy-first">🎤 ${t.spy_first || ''}: <b class="spy-first__name" data-spy-first>${escapeHTML(nameOf(s.firstId))}</b> · ${t.spy_tv_hint || ''}</div>
        ${places}
        ${roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.spy_start_vote, "roomAct('startVote')")}</div>`)}</div>`;
    }
    if (s.phase === 'voting') return `<div class="tv-vote">${head}<div class="tv-question">${t.accuse_player || ''}</div>${tvVoteProgress(state, t)}</div>`;
    if (s.phase === 'guess') {
      // The vote's bars first, the caught spy's last; the line under its cover until then.
      const bars = roomSpyVoteBars(state, [s.guesserId], 'tv');
      const cover = spyRevealParts(['spy-guess-tv', roomDealKey(state, s.round), s.guesserId].join('|'), t.reveal_spy_was, bars.ms);
      return `<div class="tv-vote">${head}${bars.html ? `<div class="tv-scale">${bars.html}</div>` : ''}
        <div class="tv-spy-reveal ${cover.cls}" ${cover.attrs} style="--cover-at:${cover.at}ms">${cover.cover}<div class="tv-question">🕵️ ${escapeHTML(s.guesserName || '')} · ${t.spy_guessing || ''}</div></div>${places}
        ${roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.fa_skip_guess, "roomAct('skipGuess')", 'ghost')}</div>`)}</div>`;
    }
    const line = s.impostorLeft ? (t.room_impostor_left || '').replace('{name}', s.impostorLeftName || '{name}') : s.outcome === 'escaped' ? (t.spy_escaped || '') : s.outcome === 'stole' ? (t.spy_stole || '') : (t.spy_caught || '');
    const revealKey = ['spy', roomDealKey(state, s.round), s.outcome, s.location].join('|');
    // The vote as bars first, the spy's own rising last; then the line turns over and he plays it.
    const bars = roomSpyVoteBars(state, s.spyIds || [], 'tv');
    const cover = spyRevealParts(revealKey + '|tv', (s.spyNames || []).length > 1 ? t.reveal_spies_were : t.reveal_spy_was, bars.ms);
    const cast = typeof spyCastHtml === 'function'
      ? spyCastHtml(revealKey, spyCastVerdict(s.outcome), { kind: 'spyfall', tv: true, after: cover.at })
      : '';
    return `<div class="tv-vote">${head}${bars.html ? `<div class="tv-scale">${bars.html}</div>` : ''}${cast}
      <div class="tv-spy-reveal ${cover.cls}" ${cover.attrs} style="--cover-at:${cover.at}ms">${cover.cover}<div class="tv-question">${s.outcome === 'caught' ? '🎉' : '🕵️'} ${escapeHTML(line.replace('{name}', (s.spyNames || []).join(' · ')))} · 📍 ${escapeHTML(s.location || '')}</div>${spyfallPtsLine(s, t) ? `<div class="tv-note">${escapeHTML(spyfallPtsLine(s, t))}</div>` : ''}</div>
      <div class="tv-scale">${renderScoreboard(s.board)}</div>
      ${roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.next_round, `roomAct('nextRound', { lang: '${VOTE_LANG()}' })`)}${state.youAreHost ? tvBtn(t.room_another_game, "tvBackToHub()", 'ghost') : ''}</div>`)}</div>`;
  },
  after(state, rebuilt) {
    const s = state.shared || {};
    if (rebuilt) spyfallFirstSpin(document.getElementById('view-room-tv'), state, 'tv');
    if (s.phase === 'play' && s.endsAt) startSpyfallRoomClock(s); else stopSpyfallRoomClock();
  }
};

/*
 * 523 (7 Oct 2026): who asks first is a little show that opens every round - the name
 * spins through everyone in the round (spinLetter over their names) on the phones and the
 * TV and lands on the one the server picked. Once per round on each screen (motionFirst),
 * and only in the round's first 20 seconds: a phone reloaded later just shows the name.
 * Off with motion (spinLetter sets the name at once).
 */
function spyfallFirstSpin(root, state, where) {
  const s = state.shared || {};
  if (!root || s.phase !== 'play' || !s.firstId) return;
  const el = root.querySelector('[data-spy-first]');
  if (!el) return;
  const minutes = Number(s.minutes) || 0;
  const now = typeof roomServerNow === 'function' ? roomServerNow() : Date.now();
  if (!minutes || !s.endsAt || s.endsAt - now < minutes * 60000 - 20000) return;
  if (!motionFirst(['spy-first', where, roomDealKey(state, s.round)].join('|'))) return;
  const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '';
  const pool = (s.roster || []).map(nameOf).filter(Boolean);
  spinLetter(el, nameOf(s.firstId), pool);
}
</script>
