<script>
/* ============================================================================
   الترتيب الأعمى — RANK THEM BEFORE YOU'VE SEEN THEM ALL
   ----------------------------------------------------------------------------
   A category and its things one at a time; each has to go into a place from
   1 (the best) down before the next one shows, and a place once taken stays
   taken. There is no right answer: the fun is the list you end up with and
   sending it to the group, who got the same things in the daily.

   The categories and things are the Chameleon lists (CHAMELEON_DB, 92
   categories of 16). Free play deals the category through freshPick; the
   daily is seeded, so every phone ranks the same five in the same order.
   appState.blindrank holds the game.
   ========================================================================= */

const RANK_SIZES = [5, 10];
let rankBusy = false;

function rankState() {
  if (!appState.blindrank) {
    appState.blindrank = { size: 5, daily: '', lang: 'ar', name: '', icon: '', items: [], slots: [], next: 0, phase: 'setup' };
  }
  return appState.blindrank;
}

function setupBlindRank() {
  setView('setup-blindrank');
}

function paintBlindRankSetup() {
  const s = rankState();
  document.querySelectorAll('#blindrank-size .segmented__item').forEach(el => el.classList.toggle('is-active', Number(el.dataset.value) === s.size));
  const cont = document.getElementById('blindrank-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('blindrank-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('blindrank', 'startBlindRank(true)');
}

function setBlindRankSize(size) {
  rankState().size = RANK_SIZES.indexOf(Number(size)) !== -1 ? Number(size) : 5;
  saveToLocal();
  paintBlindRankSetup();
}

function startBlindRank(daily) {
  if (daily && soloDailyResume('blindrank')) return;
  soloDailySetAside('blindrank');
  soloNewGame('blindrank');
  const s = rankState();
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  const cats = CHAMELEON_DB[lang] || CHAMELEON_DB.ar;
  const size = daily ? 5 : s.size;
  const rnd = soloRandom(daily ? soloDaySeed('blindrank:' + lang) : null);
  const cat = daily ? soloPick(cats, rnd) : freshPick('blindrank:' + lang, cats, 1, { key: c => c.category })[0];
  const split = soloCategory(cat.category);
  Object.assign(s, {
    daily: daily ? soloToday() : '', lang: lang, playSize: size,
    name: split.name, icon: split.icon,
    items: soloShuffle(cat.words, rnd).slice(0, size),
    slots: Array(size).fill(null), next: 0, phase: 'play'
  });
  saveToLocal();
  setView('play-blindrank');
  paintBlindRank(true);
}

function continueBlindRank() {
  if (rankState().phase !== 'play') return;
  setView('play-blindrank');
  paintBlindRank(false);
}

function paintBlindRank(fresh) {
  const s = rankState();
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('blindrank-stage');
  if (!el || !s.items.length) return;
  const done = s.next >= s.items.length;
  const current = done ? '' : s.items[s.next];
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <ol class="rank-slots" id="rank-slots">
          ${s.slots.map((item, i) => `
            <li><button type="button" class="rank-slot${item !== null ? ' is-filled' : ''}" data-i="${i}" onclick="placeBlindRank(${i})" ${item !== null || done ? 'disabled' : ''}>
              <span class="rank-slot__n metric">${i + 1}</span><b>${item !== null ? escapeHTML(item) : ''}</b></button></li>`).join('')}
        </ol>
      </div>
      <div class="solo-layout__side">
        <div class="strands-theme"><span class="strands-theme__icon" aria-hidden="true">${s.icon || '📊'}</span>
          <span><span class="eyebrow">${escapeHTML(t.rank_theme || '')}</span><b>${escapeHTML(s.name)}</b></span>${s.daily ? ' <span class="badge">📅</span>' : ''}</div>
        ${done ? `
          <p class="pin-ask rank-done">${escapeHTML(t.rank_done || '')} ✓</p>
          <div class="btn-stack">
            <button type="button" class="btn btn--primary" onclick="shareBlindRank()">📤 ${escapeHTML(t.solo_share || '')}</button>
            ${s.daily && typeof soloHubReturn !== 'undefined' && soloHubReturn
              ? `<button type="button" class="btn btn--secondary" onclick="openDaily()">📅 ${escapeHTML(t.daily_back || '')}</button>`
              : `<button type="button" class="btn btn--secondary" onclick="startBlindRank(false)">${escapeHTML(t.play_again || '')}</button>`}
          </div>` : `
          <div class="solo-bar" style="--solo-cols:1"><div class="solo-stat"><span class="solo-stat__label">${escapeHTML(t.rank_left || '')}</span><b class="metric">${s.items.length - s.next}</b></div></div>
          <div class="rank-card${fresh ? ' is-new' : ''}" id="rank-card"><span class="eyebrow">${escapeHTML(t.rank_where || '')}</span><b id="rank-current">${escapeHTML(current)}</b></div>
          <p class="field__hint">${escapeHTML(t.rank_hint || '')}</p>`}
      </div>
    </div>
    <div class="view-actions">
      <button class="btn btn--ghost btn--sm" onclick="setupBlindRank()">${escapeHTML(t.exit || '')}</button>
    </div>`;
}

function placeBlindRank(i) {
  const s = rankState();
  if (s.phase !== 'play' || rankBusy || s.slots[i] !== null || s.next >= s.items.length) return;
  const word = s.items[s.next];
  const from = document.getElementById('rank-current');
  const fromRect = from ? from.getBoundingClientRect() : null;
  s.slots[i] = word;
  s.next++;
  const finished = s.next >= s.items.length;
  if (finished) {
    s.phase = 'done';
    if (s.daily) soloMarkDaily('blindrank', { list: s.slots.slice() }, s.daily);
  }
  saveToLocal();
  playSound('click');
  haptic('light');
  paintBlindRank(!finished);
  const slot = document.querySelector(`#rank-slots [data-i="${i}"] b`);
  if (!slot || !fromRect || motionOff() || !document.body.animate) {
    if (finished) rankCelebrate();
    return;
  }
  // The word flies from the card into its place.
  const to = slot.getBoundingClientRect();
  slot.style.visibility = 'hidden';
  const ghost = document.createElement('span');
  ghost.className = 'rank-ghost';
  ghost.textContent = word;
  ghost.style.left = fromRect.left + 'px';
  ghost.style.top = fromRect.top + 'px';
  document.body.appendChild(ghost);
  const g = ghost.getBoundingClientRect();
  const dx = to.left + to.width / 2 - (g.left + g.width / 2);
  const dy = to.top + to.height / 2 - (g.top + g.height / 2);
  rankBusy = true;
  const a = ghost.animate([{ transform: 'none' }, { transform: `translate(${dx}px, ${dy}px) scale(0.9)` }],
                          { duration: 480, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'both' });
  const land = () => {
    if (!ghost.isConnected) return;
    ghost.remove();
    rankBusy = false;
    slot.style.visibility = '';
    const btn = slot.closest('.rank-slot');
    if (btn && btn.animate) btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }, { transform: 'scale(1)' }], { duration: 260 });
    if (finished) rankCelebrate();
  };
  a.onfinish = land;
  setTimeout(land, 900);
}

function rankCelebrate() {
  playSound('success');
  const slots = document.querySelectorAll('#rank-slots .rank-slot');
  if (motionOff()) return;
  slots.forEach((el, k) => el.animate && el.animate([{ transform: 'none' }, { transform: 'translateY(-4px)' }, { transform: 'none' }], { duration: 320, delay: k * 60 }));
}

function shareBlindRank() {
  const s = rankState();
  const t = TRANSLATIONS[appState.lang];
  const head = s.daily ? soloShareHeader(t, s.daily) + '\n' : '';
  const text = `${head}📊 ${t.setup_blindrank || ''} · ${s.name} ${s.icon}\n${s.slots.map((w, i) => `${i + 1}. ${w}`).join('\n')}`;
  shareOrCopy(appLink(), text, t.solo_copied || '');
}

function restoreBlindRank() {
  const s = rankState();
  if (!s.items.length || (s.phase !== 'play' && s.phase !== 'done')) return false;
  paintBlindRank(false);
  return true;
}

soloRegister('blindrank', {
  setup: 'setup-blindrank', play: 'play-blindrank', paintSetup: paintBlindRankSetup, restore: restoreBlindRank,
  state: rankState, resume: continueBlindRank, repaint: () => paintBlindRank(false), prefs: ['size']
});
</script>
