    "Moscow", "Athens", "Vienna", "Geneva", "New York", "Los Angeles",
    "Washington", "Chicago", "Toronto", "Rio de Janeiro", "Buenos Aires", "Tokyo",
    "Beijing", "Shanghai", "Seoul", "Bangkok", "Singapore", "Mumbai",
    "Sydney", "Cape Town", "Manchester", "Liverpool", "Florence", "Lisbon",
    "Dublin", "Edinburgh", "San Francisco"
  ]
};

/*
   خلصت الكلمة: a turn's ✅ and ⏭ can be taken back (↶ beside the clock), the
   way بدون كلام and أوصف لي do - a tap under a clock lands on the wrong
   button often enough. The stack is the turn's own and empties when it ends.
*/
const timesUpState = {
  deck: [],
  currentRoundDeck: [],
  round: 1, // 1: Any words, 2: One word, 3: Pantomime/Charades
  scores: { 1: 0, 2: 0 },
  teams: { 1: [], 2: [] },
  activeTeam: 1,
  activePlayerIndex: { 1: 0, 2: 0 },
  turnTimerSeconds: 40,
  turnClock: null,
  currentCard: "",
  turnProcessing: false,
  judged: []
};

function setupTimesUp() {
  setView('setup-timesup');
}

/*
   A reload comes back to the game (the owner's decision of 26 Sep 2026): the
   deck, the round, the teams, whose turn it is and the scores live in
   appState.timesup, written after every move. A turn in the middle of its clock
   comes back to its own "ready" card - the cards already guessed stay guessed
   and scored, the time that was left is not kept (بدون كلام's relay does the
   same with its handover card). The game over, the slot is emptied.
*/
function timesUpSave() {
  if (typeof appState === 'undefined') return;
  const s = timesUpState;
  appState.timesup = {
    deck: s.deck.slice(), currentRoundDeck: s.currentRoundDeck.slice(), round: s.round,
    scores: { 1: s.scores[1], 2: s.scores[2] }, teams: { 1: s.teams[1].slice(), 2: s.teams[2].slice() },
    activeTeam: s.activeTeam, activePlayerIndex: { 1: s.activePlayerIndex[1], 2: s.activePlayerIndex[2] },
    turnTimerSeconds: s.turnTimerSeconds, carrySeconds: s.readyCarry || 0
  };
  if (typeof saveToLocal === 'function') saveToLocal();
}

function timesUpClearSave() {
  if (typeof appState === 'undefined') return;
  appState.timesup = null;
  if (typeof saveToLocal === 'function') saveToLocal();
}

/** Called by restoreView for play-timesup: back to the current turn's ready card, or false. */
function restoreTimesUp() {
  const g = typeof appState !== 'undefined' ? appState.timesup : null;
  if (!g || !Array.isArray(g.deck) || !g.deck.length || !Array.isArray(g.currentRoundDeck) || !g.currentRoundDeck.length
    || !g.teams || !Array.isArray(g.teams[1]) || !Array.isArray(g.teams[2]) || !g.teams[1].length || !g.teams[2].length
    || !(g.round >= 1 && g.round <= 3)) return false;
  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  Object.assign(timesUpState, {
    deck: g.deck.slice(), currentRoundDeck: g.currentRoundDeck.slice(), round: g.round,
    scores: { 1: g.scores[1] || 0, 2: g.scores[2] || 0 }, teams: { 1: g.teams[1].slice(), 2: g.teams[2].slice() },
    activeTeam: g.activeTeam === 2 ? 2 : 1, activePlayerIndex: { 1: g.activePlayerIndex[1] || 0, 2: g.activePlayerIndex[2] || 0 },
    turnTimerSeconds: g.turnTimerSeconds || 40, carrySeconds: g.carrySeconds || 0,
    turnClock: null, currentCard: '', turnProcessing: false, judged: []
  });
  setView('play-timesup');
  prepareTimesUpTurn();
  return true;
}

function startTimesUpGame() {
  const selected = appState.activePlayers ? [...appState.activePlayers] : [];
  saveActivePlayers(selected);

  if (selected.length < 4) {
    askPlayers(4, () => startTimesUpGame());
    return;
  }

  // Shuffle and split into 2 teams
  const shuffled = shuffleArray(selected);
  timesUpState.teams[1] = [];
  timesUpState.teams[2] = [];
  shuffled.forEach((p, idx) => {
    timesUpState.teams[(idx % 2) + 1].push(p);
  });

  const lang = contentLang();
  // A repeat would put the same card in the deck twice - a free point.
  const db = [...new Set(TIMESUP_DB[lang] || TIMESUP_DB.ar)];
  const deckSize = parseInt(document.getElementById('timesup-deck-size')?.value || '35', 10);
  timesUpState.turnTimerSeconds = parseInt(document.getElementById('timesup-turn-timer')?.value || '40', 10);

  // Pick unique deck
  timesUpState.deck = freshPick('timesup:' + lang, db, Math.min(deckSize, db.length));
  timesUpState.currentRoundDeck = [...timesUpState.deck];
  timesUpState.round = 1;
  timesUpState.scores = { 1: 0, 2: 0 };
  timesUpState.activeTeam = 1;
  timesUpState.activePlayerIndex = { 1: 0, 2: 0 };
  timesUpState.turnProcessing = false;
  timesUpState.judged = [];

  playSound('click');
  startTimesUpRound(1);
}

function startTimesUpRound(roundNum, carrySeconds) {
  timesUpState.round = roundNum;
  timesUpState.currentRoundDeck = shuffleArray([...timesUpState.deck]);
  timesUpState.carrySeconds = carrySeconds || 0;
  // No confirm dialog between rounds: cancelling it left the last card on
  // screen with no clock and no way on. The ready card names the round instead.
  setView('play-timesup');
  prepareTimesUpTurn();
}

const timesUpTeamLabel = (team) => {
  const t = TRANSLATIONS[appState.lang] || {};
  return t['timesup_team_' + team] || ((appState.lang === 'en' ? 'Team ' : 'فريق ') + team);
};

function prepareTimesUpTurn() {
  timesUpState.turnProcessing = false;
  timesUpState.judged = [];
  timesUpState.currentCard = '';
  timesUpState.readyCarry = timesUpState.carrySeconds || 0;
  const team = timesUpState.activeTeam;
  const playerList = timesUpState.teams[team];
  const pIdx = timesUpState.activePlayerIndex[team] % playerList.length;
  const activeClueGiver = playerList[pIdx];
  const t = TRANSLATIONS[appState.lang] || {};

  document.getElementById('timesup-round-badge').innerText = `${t.round || ''} ${timesUpState.round}/3`;
  document.getElementById('timesup-team-turn-name').innerText = `${timesUpTeamLabel(team)} (${activeClueGiver})`;
  document.getElementById('timesup-cards-left').innerText = timesUpState.currentRoundDeck.length;

  // Update scores
  document.getElementById('timesup-score-team1').innerText = timesUpState.scores[1];
  document.getElementById('timesup-score-team2').innerText = timesUpState.scores[2];

  // Show "Ready to start turn" overlay
  document.getElementById('timesup-turn-ready-card').classList.remove('hidden');
  document.getElementById('timesup-turn-live-card').classList.add('hidden');
  document.getElementById('timesup-ready-player-name').innerText = activeClueGiver;

  const rule = document.getElementById('timesup-round-rule');
  if (rule) {
    const carry = timesUpState.carrySeconds;
    rule.textContent = ([t.timesup_r1, t.timesup_r2, t.timesup_r3][timesUpState.round - 1] || '')
      + (carry ? ' · ⏱️ ' + (t.timesup_carry || '').replace('{n}', carry) : '');
  }
  timesUpSave();
}

function beginTimesUpLiveTurn() {
  document.getElementById('timesup-turn-ready-card').classList.add('hidden');
  document.getElementById('timesup-turn-live-card').classList.remove('hidden');
  timesUpState.judged = [];
  ensureTimesUpUndo();
  // The round's rule stays in sight during the turn: round 2 is one word, round 3 no sound.
  const liveRule = document.getElementById('timesup-live-rule');
  if (liveRule) liveRule.textContent = [(TRANSLATIONS[appState.lang] || {}).timesup_r1, (TRANSLATIONS[appState.lang] || {}).timesup_r2, (TRANSLATIONS[appState.lang] || {}).timesup_r3][timesUpState.round - 1] || '';

  drawNextTimesUpCard();

  let left = timesUpState.carrySeconds || timesUpState.turnTimerSeconds;
  timesUpState.carrySeconds = 0;
  updateTimesUpClockUI(left);

  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  timesUpState.turnClock = createClock({
    seconds: left,
    onTick: (val) => {
      updateTimesUpClockUI(val);
      if (val <= 5 && val > 0) playSound('tick');
      if (val === 0) {
        playSound('alarm');
        endTimesUpTurn(true);
      }
    },
    onEnd: () => {
      endTimesUpTurn(true);
    }
  });
}

/**
 * The ↶ button beside the clock. Controller.html can hold it (same id); until
 * it does, it is put there the first time a turn starts.
 */
function ensureTimesUpUndo() {
  const t = TRANSLATIONS[appState.lang] || {};
  let btn = document.getElementById('timesup-undo-btn');
  if (!btn) {
    const clock = document.getElementById('timesup-clock-display');
    if (!clock || !clock.parentElement) return;
    btn = document.createElement('button');
    btn.id = 'timesup-undo-btn';
    btn.type = 'button';
    btn.className = 'btn btn--ghost btn--sm btn--auto';
    btn.setAttribute('onclick', 'undoTimesUpCard()');
    btn.setAttribute('data-i18n-title', 'undo_card');
    btn.textContent = '↶';
    clock.parentElement.insertBefore(btn, clock);
  }
  btn.title = t.undo_card || '';
  btn.setAttribute('aria-label', t.undo_card || '');
}

function updateTimesUpClockUI(sec) {
  const el = document.getElementById('timesup-clock-display');
  if (el) el.innerText = sec;
}

function drawNextTimesUpCard() {
  if (timesUpState.currentRoundDeck.length === 0) {
    // Round ended mid-turn!
    endTimesUpRound();
    return;
  }
  timesUpState.currentCard = timesUpState.currentRoundDeck[0];
  const cardEl = document.getElementById('timesup-word-display');
  if (cardEl) {
    cardEl.innerText = timesUpState.currentCard;
  }
  document.getElementById('timesup-cards-left').innerText = timesUpState.currentRoundDeck.length;
}

function timesUpAction(action) {
  if (timesUpState.turnProcessing) return;
  if (!timesUpState.currentCard) return;

  if (action === 'correct') {
    timesUpState.turnProcessing = true;
    playSound('success');
    timesUpState.scores[timesUpState.activeTeam]++;
    document.getElementById(`timesup-score-team${timesUpState.activeTeam}`).innerText = timesUpState.scores[timesUpState.activeTeam];

    // Remove from current round deck
    const card = timesUpState.currentRoundDeck.shift();
    timesUpState.judged.push({ card: card, action: 'correct' });

    if (timesUpState.currentRoundDeck.length === 0) {
      endTimesUpRound();
      return;
    }

    drawNextTimesUpCard();
    timesUpSave();
    setTimeout(() => { timesUpState.turnProcessing = false; }, 200);
  } else if (action === 'pass') {
    playSound('click');
    // Rotate card to back of deck
    const passed = timesUpState.currentRoundDeck.shift();
    timesUpState.currentRoundDeck.push(passed);
    timesUpState.judged.push({ card: passed, action: 'pass' });
    drawNextTimesUpCard();
    timesUpSave();
  }
}

/** Puts the last card of this turn back on top: a ✅ gives its point back, a ⏭ comes off the bottom. */
function undoTimesUpCard() {
  const t = TRANSLATIONS[appState.lang] || {};
  const live = document.getElementById('timesup-turn-live-card');
  const running = !!(timesUpState.turnClock && timesUpState.turnClock.isRunning && timesUpState.turnClock.isRunning());
  const last = running && live && !live.classList.contains('hidden') ? timesUpState.judged.pop() : null;
  if (!last) { showToast(t.undo_nothing || '', 'info'); return; }
  const deck = timesUpState.currentRoundDeck;
  const team = timesUpState.activeTeam;
  if (last.action === 'correct') {
    timesUpState.scores[team] = Math.max(0, (timesUpState.scores[team] || 0) - 1);
    const el = document.getElementById(`timesup-score-team${team}`);
    if (el) el.innerText = timesUpState.scores[team];
  } else {
    const at = deck.lastIndexOf(last.card);
    if (at !== -1) deck.splice(at, 1);
  }
  deck.unshift(last.card);
  timesUpState.turnProcessing = false;
  drawNextTimesUpCard();
  timesUpSave();
  playSound('tick');
  haptic('light');
  showToast(t.undo_done || '', 'success');
}

function endTimesUpTurn(timeRanOut) {
  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  timesUpState.judged = [];

  // Rotate player and switch team
  timesUpState.activePlayerIndex[timesUpState.activeTeam]++;
  timesUpState.activeTeam = (timesUpState.activeTeam === 1) ? 2 : 1;

  if (timesUpState.currentRoundDeck.length > 0) {
    prepareTimesUpTurn();
  }
}

function endTimesUpRound() {
  // Read the clock before stopping it: whoever emptied the deck keeps their time.
  const left = timesUpState.turnClock ? timesUpState.turnClock.value() : 0;
  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  timesUpState.turnClock = null;
  timesUpState.judged = [];
  playSound('success');

  if (timesUpState.round >= 3) {
    finishTimesUpGrandFinale();
    return;
  }

  confetti({ particleCount: 100 });
  const t = TRANSLATIONS[appState.lang] || {};
  showToast((t.timesup_round_done || '').replace('{n}', timesUpState.round), 'success');

  // The rule: the clue giver who cleared the deck carries straight on into the
  // next round with the time they had left. With next to none left, it is
  // simply the other team's turn.
  if (left < 3) {
    timesUpState.activePlayerIndex[timesUpState.activeTeam]++;
    timesUpState.activeTeam = timesUpState.activeTeam === 1 ? 2 : 1;
  }
  startTimesUpRound(timesUpState.round + 1, left >= 3 ? left : 0);
}

function finishTimesUpGrandFinale() {
  const t = TRANSLATIONS[appState.lang] || {};
  const modal = document.getElementById('timesup-result-modal');
  const titleEl = document.getElementById('timesup-result-title');
  const detailEl = document.getElementById('timesup-result-detail');

  // The last card is gone: ✅ behind the result sheet must not score again.
  timesUpState.currentCard = '';
  timesUpClearSave();
  const score1 = timesUpState.scores[1];
  const score2 = timesUpState.scores[2];

  let winnerText = "";
  if (score1 > score2) {
    winnerText = `🏆 ${timesUpTeamLabel(1)} ${t.tb_wins || ''}`;
    titleEl.className = "sheet__title tx-accent";
  } else if (score2 > score1) {
    winnerText = `🏆 ${timesUpTeamLabel(2)} ${t.tb_wins || ''}`;
    titleEl.className = "sheet__title tx-warning";
  } else {
    winnerText = `🤝 ${t.tb_draw || ''}`;
    titleEl.className = "sheet__title tx-success";
  }

  titleEl.innerText = winnerText;
  confetti({ particleCount: 200, spread: 90 });

  detailEl.innerHTML = `
    <div class="grid grid-cols-2 gap-3 my-4">
      <div class="p-4 rounded-xl bg-blue-500/10 border border-blue-500/30 text-center">
        <div class="eyebrow tx-accent">${escapeHTML(timesUpTeamLabel(1))}</div>
        <div class="text-3xl font-black my-1">${score1}</div>
        <div class="text-xs opacity-75">${timesUpState.teams[1].map(escapeHTML).join(', ')}</div>
      </div>
      <div class="p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-center">
        <div class="eyebrow tx-warning">${escapeHTML(timesUpTeamLabel(2))}</div>
        <div class="text-3xl font-black my-1">${score2}</div>
        <div class="text-xs opacity-75">${timesUpState.teams[2].map(escapeHTML).join(', ')}</div>
      </div>
    </div>
  `;

  modal.classList.remove('hidden');
}

function resetTimesUpPlay() {
  if (timesUpState.turnClock) timesUpState.turnClock.stop();
  closeModal('timesup-result-modal');
  setupTimesUp();
}
</script>
