<script>
  /* --- IMPOSTER GAME LOGIC --- */

  function renderSpyCategories() {
      const select = document.getElementById('imposter-category-select');
      if(!select) return;
      const countriesLabel = appState.lang === 'ar' ? '🌍 دول العالم (تلقائي)' : '🌍 World Countries (Auto)';
      const manualLabel = appState.lang === 'ar' ? '✍️ إدخال يدوي' : '✍️ Manual Entry';
      
      let html = `<option value="countries">${countriesLabel}</option><option value="manual">${manualLabel}</option>`;
      for(const cat in SPY_CATEGORIES) {
          html += `<option value="${cat}">${cat}</option>`;
      }
      select.innerHTML = html;
  }

  function toggleManualWordInput() {
      const select = document.getElementById('imposter-category-select');
      const container = document.getElementById('manual-word-container');
      if (select.value === 'manual') {
          container.classList.remove('hidden');
          document.getElementById('imposter-manual-word').focus();
      } else {
          container.classList.add('hidden');
      }
  }

  function startImposterGame(playersToUse) {
      const catSelect = document.getElementById('imposter-category-select');
      const category = catSelect.value;
      if (category.includes('🔒')) {
          const expectedPw = SPY_CATEGORIES[category][0]; 
          if (appState.imposter.unlockedCategories && 
              !Array.isArray(appState.imposter.unlockedCategories) && 
              appState.imposter.unlockedCategories[category] === expectedPw) {
               continuePrepImposter(playersToUse);
               return;
          }
          if (expectedPw) {
              document.getElementById('password-error').innerText = '';
              document.getElementById('category-password-input').value = '';
              document.getElementById('password-modal').classList.remove('hidden');
              document.getElementById('category-password-input').focus();
              window._pendingImposterPlayers = playersToUse;
              return;
          }
      }
      continuePrepImposter(playersToUse);
  }

  function verifyCategoryPassword() {
      const input = document.getElementById('category-password-input').value;
      const catSelect = document.getElementById('imposter-category-select');
      const category = catSelect.value;
      const expectedPw = SPY_CATEGORIES[category][0];
      if (input === expectedPw) {
          playSound('success');
          if (!appState.imposter.unlockedCategories || Array.isArray(appState.imposter.unlockedCategories)) {
              appState.imposter.unlockedCategories = {}; 
          }
          appState.imposter.unlockedCategories[category] = input;
          saveToLocal();
          closeModal('password-modal');
          continuePrepImposter(window._pendingImposterPlayers);
          delete window._pendingImposterPlayers;
      } else {
          playSound('alarm');
          const errorMsg = appState.lang === 'ar' ? 'كلمة مرور خاطئة!' : 'Incorrect password!';
          document.getElementById('password-error').innerText = errorMsg;
      }
  }

  function continuePrepImposter(playersToUse) {
      let selected = playersToUse || (appState.activePlayers ? [...appState.activePlayers] : []);
      saveActivePlayers(selected);
      const countInput = document.getElementById('imposter-count');
      // An emptied or negative field used to reach Array(count) and throw.
      let count = parseInt(countInput.value, 10);
      if (!isFinite(count) || count < 1) count = 1;
      countInput.value = count;
      
      if(selected.length < 3) {
          const msg = appState.lang === 'ar' ? 'الحد الأدنى 3 لاعبين' : 'Minimum 3 players';
          return showToast(msg);
      }
      if(count >= selected.length) {
          const msg = appState.lang === 'ar' ? 'عدد الجواسيس كبير جداً' : 'Too many imposters';
          return showToast(msg);
      }
      
      appState.imposter.config.impostersCount = count;
      lastSelectedPlayers = selected;
      playSound('click');
      openReorderModal('imposter', selected.map(name => ({ name: name })),
                       TRANSLATIONS[appState.lang].start);
  }

  function finalizeImposterGame(orderedNames) {
      lastSelectedPlayers = orderedNames;
      const catSelect = document.getElementById('imposter-category-select');
      const category = catSelect.value;
      let secretWord = "";
      if (category === 'manual') {
          secretWord = document.getElementById('imposter-manual-word').value.trim();
          if (!secretWord) {
              const msg = appState.lang === 'ar' ? 'يرجى إدخال الكلمة السرية' : 'Please enter the secret word';
              showToast(msg);
              setView('setup-imposter');
              return;
          }
      } else if (category === 'countries') {
          const r = Math.floor(Math.random() * COUNTRIES_DB.length);
          secretWord = COUNTRIES_DB[r];
      } else if (SPY_CATEGORIES[category]) {
          let list = SPY_CATEGORIES[category];
          if (category.includes('🔒')) list = list.slice(1);
          const r = Math.floor(Math.random() * list.length);
          secretWord = list[r];
      }
      const count = appState.imposter.config.impostersCount;
      const total = orderedNames.length;
      let roles = Array(count).fill('Imposter').concat(Array(total - count).fill('Civilian'));
      roles = shuffleArray(roles);
      appState.imposter.players = orderedNames.map((name, idx) => ({ name: name, role: roles[idx] }));
      appState.imposter.secretWord = secretWord;
      appState.imposter.revealIndex = 0;
      appState.imposter.timer = 0;
      showRevealStep();
      setView('imposter-reveal');
  }

  function showRevealStep() {
      const player = appState.imposter.players[appState.imposter.revealIndex];
      document.getElementById('reveal-player-name').innerText = player.name;
      document.getElementById('reveal-step-pass').classList.remove('hidden');
      document.getElementById('reveal-step-show').classList.add('hidden');
  }

  function showRole() {
      const player = appState.imposter.players[appState.imposter.revealIndex];
      const wordDiv = document.getElementById('role-word');
      const card = document.getElementById('role-card-content');
      const spy = player.role === 'Imposter';
      wordDiv.innerText = spy
          ? (appState.lang === 'ar' ? "🕵️‍♂️ أنت الجاسوس!" : "🕵️‍♂️ You are the Imposter!")
          : appState.imposter.secretWord;
      // Tokens, not palette classes: green-700 on the dark card was 2.6:1, and
      // overwriting className also dropped the card's own sizing.
      wordDiv.className = 'metric metric--lg ' + (spy ? 'tx-danger' : 'tx-success');
      if (card) card.classList.toggle('is-spy', spy);
      document.getElementById('reveal-step-pass').classList.add('hidden');
      document.getElementById('reveal-step-show').classList.remove('hidden');
      playSound('click');
  }

  function hideRole() {
      appState.imposter.revealIndex++;
      if (appState.imposter.revealIndex >= appState.imposter.players.length) {
          playSound('success');
          renderImposterBoard();
          setView('play-imposter');
          startImposterTimer();
      } else {
          playSound('click');
          showRevealStep();
      }
  }

  function renderImposterBoard() {
      const container = document.getElementById('imposter-game-players');
      container.innerHTML = '';
      appState.imposter.players.forEach(p => {
          container.innerHTML += `<div class="imposter-card m-1">${escapeHTML(p.name)}</div>`;
      });
  }

  function startImposterTimer() {
      stopImposterTimer();
      isPaused = false;
      appState.imposter.timer = 0;
      updateImposterTimerUI();
      // Counts up: this is the discussion timer, it has no fixed length.
      imposterInterval = createClock({
          countUp: true,
          onTick: (elapsed) => {
              appState.imposter.timer = elapsed;
              updateImposterTimerUI();
          }
      });
  }

  function stopImposterTimer() {
      if (imposterInterval) imposterInterval.stop();
      imposterInterval = null;
  }

  function toggleImposterTimer() {
      playSound('click');
      isPaused = imposterInterval ? imposterInterval.toggle() : !isPaused;
      updateImposterTimerUI();
  }

  function updateImposterTimerUI() {
      const display = document.getElementById('imposter-timer-display');
      const btn = document.getElementById('imp-pause-btn');
      const mins = Math.floor(appState.imposter.timer / 60).toString().padStart(2, '0');
      const secs = (appState.imposter.timer % 60).toString().padStart(2, '0');
      display.innerText = `${mins}:${secs}`;
      if(isPaused) {
          btn.innerText = appState.lang === 'ar' ? "استئناف" : "Resume";
      } else {
          btn.innerText = TRANSLATIONS[appState.lang].pause_btn;
      }
  }

  function revealImposterResult() {
      stopImposterTimer();
      playSound('success');
      
      const wordTitle = appState.lang === 'ar' ? 'الكلمة السرية' : 'Secret Word';
      const impTitle = appState.lang === 'ar' ? 'الجواسيس' : 'Imposters';
      const andText = appState.lang === 'ar' ? ' و ' : ' & ';

      const imposters = appState.imposter.players.filter(p => p.role === 'Imposter').map(p => escapeHTML(p.name)).join(andText);
      
      document.getElementById('winners-list').innerHTML = `
        <div class="mb-4">
            <div class="eyebrow">${wordTitle}</div>
            <div class="metric metric--md tx-success">${escapeHTML(appState.imposter.secretWord)}</div>
        </div>
        <div>
            <div class="eyebrow">${impTitle}</div>
            <div class="metric metric--md tx-danger">${imposters}</div>
        </div>
      `;
      
      // Clear specific screw chart stuff if any
      const screwChart = document.getElementById('screw-chart-container');
      if(screwChart) screwChart.classList.add('hidden');
      
      const winnerScores = document.getElementById('winner-scores-container');
      if(winnerScores) winnerScores.classList.add('hidden');
      
      document.getElementById('winner-modal').classList.remove('hidden');
  }
</script>
