<script>
/* ============================================================================
   كمّل المثل — COMPLETE THE PROVERB (one phone)
   ----------------------------------------------------------------------------
   A proverb with a word missing, for the whole table to finish out loud; a
   tap shows the word, the next tap deals another. The proverbs (PROVERBS)
   live in Proverbs.js, shared with the rooms server. Restorable.

   With names picked on the setup screen it keeps score like فوازير إيموجي:
   "who got it?" chips under the word, a scoreboard, a podium at the end
   (the quizPoints* helpers in JS_Emoji.html).
   ========================================================================= */

function provState() {
  if (!appState.proverbs) appState.proverbs = { phase: 'idle', item: null, revealed: false, n: 0 };
  return appState.proverbs;
}

function setupProverbs() {
  provState().phase = 'idle';
  setView('setup-proverbs');
}

function provBank() { return PROVERBS[contentLang()] || PROVERBS.ar; }

function startProverbsGame() {
  const p = provState();
  quizPointsReset(p, 'proverbs-player-list');
  p.n = 0;
  p.phase = 'play';
  nextProverb();
}

function proverbsPlayAgain() {
  const p = provState();
  quizPointsReset(p, '', (p.players || []).slice());
  p.n = 0;
  p.phase = 'play';
  nextProverb();
}

function nextProverb() {
  const p = provState();
  p.item = freshPick('proverbs:' + contentLang(), provBank(), 1)[0];
  p.revealed = false;
  p.got = -1;
  p.n += 1;
  saveToLocal();
  if (appState.currentView !== 'play-proverbs') setView('play-proverbs');
  paintProverb();
  // The new proverb is at the top; the "who got it?" chips left the phone scrolled down.
  if (typeof scrollToAction === 'function') scrollToAction();
}

function revealProverb() {
  const p = provState();
  p.revealed = true;
  saveToLocal();
  paintProverb();
  playSound('success');
}

function proverbGot(index) {
  if (quizPointsToggle(provState(), index)) paintProverb();
}

/** Scored: the podium. Not scored: back to the setup, as before. */
function finishProverbsGame() {
  const p = provState();
  if (!quizScoring(p)) { setupProverbs(); return; }
  p.phase = 'over';
  saveToLocal();
  paintProverb();
  playSound('success');
  if (typeof confetti === 'function' && quizPointsBoard(p).some(x => x.score > 0)) {
    afterReveal(document.getElementById('proverbs-stage'), () => confetti({ particleCount: 140, spread: 90 }));
  }
}

function paintProverb() {
  const p = provState();
  const stage = document.getElementById('proverbs-stage');
  if (!stage) return;
  const t = TRANSLATIONS[appState.lang];
  if (p.phase === 'over') {
    stage.innerHTML = quizOverHtml(p, t, 'proverbs', 'proverbsPlayAgain()', 'setupProverbs()');
    quizSettleBoard(p, 'proverbs');
    if (typeof scrollToAction === 'function') scrollToAction();   // the podium rises at the top
    return;
  }
  if (!p.item) return;
  const scoring = quizScoring(p);
  const parts = String(p.item.p).split('___');
  const blank = p.revealed
    ? `<span class="prov-blank is-shown">${escapeHTML(p.item.a)}</span>`
    : `<span class="prov-blank">......</span>`;
  stage.innerHTML = `
    <div class="cn-score">
      <span class="cn-score__role">${escapeHTML(t.prov_n || '')} ${p.n}</span>
    </div>
    <div class="card" style="text-align:center">
      <div class="prov-card">${escapeHTML(parts[0] || '')}${blank}${escapeHTML(parts[1] || '')}</div>
      ${p.revealed ? '' : `<p class="sheet__subtitle">${escapeHTML(t.prov_device_hint || '')}</p>`}
    </div>
    ${quizWhoGotHtml(p, t, 'proverbGot')}
    <div class="btn-stack">
      ${p.revealed
        ? `<button class="btn btn--primary btn--lg" onclick="nextProverb()">${escapeHTML(t.prov_next || '')}</button>`
        : `<button class="btn btn--primary btn--lg" onclick="revealProverb()">${escapeHTML(t.prov_reveal || '')}</button>
           <button class="btn btn--ghost btn--sm" onclick="nextProverb()">${escapeHTML(t.emoji_skip || '')}</button>`}
      ${scoring
        ? `<button class="btn btn--ghost" onclick="finishProverbsGame()">🏁 ${escapeHTML(t.tb_finish || '')}</button>`
        : `<button class="btn btn--ghost" onclick="setupProverbs()">${escapeHTML(t.exit || '')}</button>`}
    </div>
    ${scoring ? renderScoreboard(quizPointsBoard(p)) : ''}`;
  if (scoring) quizSettleBoard(p, 'proverbs');
}

function restoreProverbs() {
  const p = provState();
  if (p.phase === 'over' && quizScoring(p)) { paintProverb(); return true; }
  if (p.phase !== 'play' || !p.item) return false;
  paintProverb();
  return true;
}

onLanguageChange((view) => { if (view === 'play-proverbs') paintProverb(); });
</script>
