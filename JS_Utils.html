<script>
  /* --- UI HELPERS --- */

  function renderActiveChips(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    // 1. Loading State
    if (typeof dataLoaded !== 'undefined' && !dataLoaded) {
        const loadingText = appState.lang === 'ar' ? 'جاري التحميل...' : 'Loading...';
        container.innerHTML = `<div class="text-center text-slate-400 py-6 font-bold animate-pulse">⏳ ${loadingText}</div>`;
        return;
    }
    
    // Ensure activePlayers exists
    if (!appState.activePlayers) appState.activePlayers = [];

    // 2. Render horizontal chips
    let htmlString = '<div class="flex flex-wrap gap-2 mb-4">';
    
    if (appState.activePlayers.length === 0) {
        const emptyText = appState.lang === 'ar' ? 'لم يتم اختيار لاعبين بعد' : 'No players selected yet';
        htmlString += `<div class="text-slate-400 text-sm font-bold w-full text-center py-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700">${emptyText}</div>`;
    } else {
        htmlString += appState.activePlayers.map(p => `
            <div class="bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-2 border border-indigo-200 dark:border-indigo-800 animate-pop">
                <span>${escapeHTML(p)}</span>
                <button onclick="removeActivePlayer('${escapeHTML(p)}', '${containerId}')" class="text-red-500 hover:text-red-700 font-bold ml-1 transition-colors">×</button>
            </div>
        `).join('');
    }
    
    htmlString += '</div>';
    container.innerHTML = htmlString;
}

function removeActivePlayer(name, containerId) {
    appState.activePlayers = appState.activePlayers.filter(p => p !== name);
    // When manually removing a player, we are no longer strictly in the saved group
    appState.currentGroup = ""; 
    renderSavedGroups(); 
    saveToLocal();
    renderActiveChips(containerId);
    playSound('click');
}

function updateGlobalDatalist(filter = "") {
    const datalist = document.getElementById('global-player-datalist');
    if (!datalist || !allPlayers) return;
    
    if (!filter) {
        datalist.innerHTML = ''; 
        return;
    }
    
    const search = filter.toLowerCase();
    const matches = allPlayers.filter(p => p.toLowerCase().includes(search));
    datalist.innerHTML = matches.map(p => `<option value="${escapeHTML(p)}">`).join('');
}

function checkAutoAdd(input) {
    const val = input.value.trim();
    if (!val) {
        updateGlobalDatalist("");
        return;
    }

    updateGlobalDatalist(val); 
    
    const datalist = document.getElementById('global-player-datalist');
    if (!datalist) return;
    const opts = datalist.options;
    for (let i = 0; i < opts.length; i++) {
        if (opts[i].value === val) {
            // MATCH FOUND
            const btn = input.parentElement.querySelector('button');
            if (btn) {
                // Clear datalist immediately to force iOS to hide suggestions
                datalist.innerHTML = ''; 
                btn.click();
            }
            break;
        }
    }
}

function addPlayerFromSetup(btn) {
    const parent = btn.parentElement;
    const input = parent.querySelector('input');
    const name = input.value.trim();
    if (!name) return;

    playSound('click');

    const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
    if (!activeSetup) return;
    const list = activeSetup.querySelector('[id$="-player-list"]');
    if (!list) return;

    // HELPER to reset input safely (especially for iOS)
    const resetInput = () => {
        const datalist = document.getElementById('global-player-datalist');
        if (datalist) datalist.innerHTML = ''; // Force clear suggestions
        
        input.value = '';
        input.blur(); 

        // Reliable refocus for iOS
        setTimeout(() => {
            input.focus();
            // Scroll to top helps iOS decide to put suggestions BELOW the input
            input.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50); 
    };

    // Check for duplicates in active list
    if (appState.activePlayers.includes(name)) {
        resetInput();
        showToast(appState.lang === 'ar' ? 'اللاعب موجود بالفعل في القائمة' : 'Player already in list', 'warn');
        return;
    }

    // Check if player exists in database (allPlayers)
    const existingName = allPlayers.find(p => p.toLowerCase().trim() === name.toLowerCase());
    
    if (existingName) {
        // Player exists in database, just add to active list
        appState.activePlayers.push(existingName);
        saveToLocal();
        renderActiveChips(list.id);
        resetInput();
        return;
    }

    // Player is NEW - Save to server
    btn.disabled = true;
    const originalContent = btn.innerHTML;
    btn.innerHTML = '<span class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"></span>';

    google.script.run
        .withSuccessHandler(players => {
            allPlayers = players;
            if (!appState.activePlayers.includes(name)) {
                appState.activePlayers.push(name);
            }
            saveToLocal();
            
            btn.disabled = false;
            btn.innerHTML = originalContent;
            resetInput();
            
            renderActiveChips(list.id);
            showToast(appState.lang === 'ar' ? `تم إضافة ${name}` : `Added ${name}`);
        })
        .withFailureHandler(error => {
            btn.disabled = false;
            btn.innerHTML = originalContent;
            handleServerFailure(error);
            input.focus();
        })
        .addGlobalPlayer(name);
}

/* --- REORDER LIST (TAP-TO-SWAP) --- */
  let selectedReorderIndex = null; // Tracks the first tapped player

  function renderReorderList() {
    const list = document.getElementById('reorder-list');
    list.innerHTML = '';
    
    const tapToSwapText = appState.lang === 'ar' ? 'بدّل مع... 🔄' : 'Swap with... 🔄';

    tempReorderList.forEach((p, idx) => {
        const isSelected = selectedReorderIndex === idx;
        
        // We add 'reorder-item' for our custom CSS, and 'selected' if it's clicked
        const baseClasses = "reorder-item flex justify-between items-center p-4 rounded-xl border mb-2 cursor-pointer transition-all duration-200 active:scale-95 shadow-sm select-none ";
        const selectedClass = isSelected ? "selected" : "border-slate-200 dark:border-slate-700";

        list.innerHTML += `
        <div onclick="handleReorderTap(${idx})" class="${baseClasses} ${selectedClass}">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center font-black text-sm ${isSelected ? 'bg-white text-indigo-600' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'}">
                    ${idx + 1}
                </div>
                <span class="font-bold text-lg">${p.name}</span>
            </div>
            <div class="text-xs font-bold opacity-70">
                ${isSelected ? tapToSwapText : '👆'}
            </div>
        </div>`;
    });
  }
  
  function handleReorderTap(index) {
      if (selectedReorderIndex === null) {
          // First tap: Select the player
          selectedReorderIndex = index;
          playSound('click');
          renderReorderList();
      } else if (selectedReorderIndex === index) {
          // Tapped the exact same player: Cancel selection
          selectedReorderIndex = null;
          playSound('click');
          renderReorderList();
      } else {
          // Second tap on a different player: SWAP!
          const temp = tempReorderList[selectedReorderIndex];
          tempReorderList[selectedReorderIndex] = tempReorderList[index];
          tempReorderList[index] = temp;
          
          // Reset selection, play success sound, and re-render
          selectedReorderIndex = null;
          playSound('success'); 
          renderReorderList();
      }
  }
  
  function saveNewOrder() {
      selectedReorderIndex = null; // Clean up memory
      document.getElementById('reorder-modal').classList.add('hidden');
      
      if (reorderContext === 'imposter') {
          finalizeImposterGame(tempReorderList.map(p => p.name));
      } else if (reorderContext === 'domino-teams') {
          finalizeDominoTeams(tempReorderList.map(p => p.name));
      } else {
          appState.monkey.players = [...tempReorderList];
          appState.monkey.turnIndex = 0; 
          renderMonkeyBoard();
          startTimer();
      }
  }

  /* --- SPIN PICKER --- */
  let pickerInterval = null;
  function runStartSpin() {
      const selected = appState.activePlayers || [];
      if(selected.length < 2) {
          const msg = appState.lang === 'ar' ? 'اختر لاعبين على الأقل' : 'Select at least 2 players';
          return showToast(msg, 'warn');
      }
      appState.spin.players = [...selected];
      setView('play-spin');
      const display = document.getElementById('picker-display');
      display.innerText = "???";
      document.getElementById('spin-result-box').classList.add('hidden');
      document.getElementById('spin-btn').disabled = false;
  }

  function pickRandomPlayer() {
      const players = appState.spin.players;
      if (players.length === 0) return;
      const btn = document.getElementById('spin-btn');
      const display = document.getElementById('picker-display');
      btn.disabled = true;
      document.getElementById('spin-result-box').classList.add('hidden');
      playSound('click');
      let counter = 0;
      const totalShuffles = 15; 
      const speed = 80; 
      if(pickerInterval) clearInterval(pickerInterval);
      pickerInterval = setInterval(() => {
          const r = Math.floor(Math.random() * players.length);
          display.innerText = players[r];
          playSound('tick'); 
          counter++;
          if (counter >= totalShuffles) {
              clearInterval(pickerInterval);
              finalizePickerResult();
          }
      }, speed);
  }

  function finalizePickerResult() {
      const players = appState.spin.players;
      const winnerIdx = Math.floor(Math.random() * players.length);
      const winner = players[winnerIdx];
      const display = document.getElementById('picker-display');
      const btn = document.getElementById('spin-btn');
      
      // عرض الاسم الفائز
      display.innerText = winner;
      display.style.color = "var(--primary)";
      
      // تحديث صندوق النتيجة (بدون تحدي)
      document.getElementById('picked-player-name').innerText = winner;
      
      // تفريغ مكان التحدي القديم
      const challengeEl = document.getElementById('picked-challenge');
      if(challengeEl) challengeEl.innerText = ""; 
      
      setTimeout(() => {
          document.getElementById('spin-result-box').classList.remove('hidden');
          playSound('success');
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          btn.disabled = false;
      }, 400);
  }

  /* --- UNIVERSAL COUNTER --- */
  function addUniversalPlayer() {
      const input = document.getElementById('univ-new-player');
      const name = input.value.trim();
      if(!name) return;
      const chip = document.createElement('div');
      chip.className = "bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2 m-1";
      chip.innerHTML = `<span>${escapeHTML(name)}</span><button onclick="this.parentElement.remove()" class="text-red-500 font-bold ml-1 mr-1">×</button>`;
      document.getElementById('universal-setup-list').appendChild(chip);
      input.value = '';
      input.focus();
  }
  function startUniversal() {
      const chips = document.querySelectorAll('#universal-setup-list > div > span');
      let players = Array.from(chips).map(c => ({ name: c.innerText, score: 0 }));
      
      // Fallback: If no manual chips, use appState.activePlayers
      if (players.length === 0 && appState.activePlayers && appState.activePlayers.length > 0) {
          players = appState.activePlayers.map(name => ({ name: name, score: 0 }));
      }

      if(players.length === 0) {
          const msg = appState.lang === 'ar' ? 'أضف لاعبين أولاً' : 'Add players first';
          return showToast(msg);
      }
      appState.universal.players = players;
      renderUniversalBoard();
      setView('play-universal');
  }
  function renderUniversalBoard() {
      const div = document.getElementById('universal-board');
      div.innerHTML = '';
      appState.universal.players.forEach((p, idx) => {
          div.innerHTML += `
          <div class="flex justify-between items-center bg-white dark:bg-slate-700 p-4 rounded-xl border border-slate-100 dark:border-slate-600 mb-2">
              <div class="font-bold text-lg w-1/3 truncate">${escapeHTML(p.name)}</div>
              <div class="font-black text-3xl text-indigo-600 w-1/3 text-center" dir="ltr">${p.score}</div>
              <div class="flex gap-2 w-1/3 justify-end">
                  <button onclick="modUnivScore(${idx}, 1)" class="w-10 h-10 rounded-lg bg-green-100 text-green-600 font-bold">+</button>
                  <button onclick="modUnivScore(${idx}, -1)" class="w-10 h-10 rounded-lg bg-red-100 text-red-600 font-bold">-</button>
              </div>
          </div>`;
      });
  }
  function modUnivScore(idx, val) {
      appState.universal.players[idx].score += val;
      renderUniversalBoard();
      playSound(val > 0 ? 'click' : 'tick');
  }

/* --- TIMERS --- */
  function switchTimerMode(mode) {
      document.getElementById('timer-general-ui').classList.add('hidden');
      // Tab switching is no longer needed for chess since it has its own screen, 
      // but we keep this for the General Timer view safely.
      if(document.getElementById('tab-general')) {
          document.getElementById('tab-general').className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow";
      }
      document.getElementById('timer-general-ui').classList.remove('hidden');
  }

  function adjustGenTimer(mins) {
      appState.timers.general.time += (mins * 60);
      if(appState.timers.general.time < 0) appState.timers.general.time = 0;
      updateGenDisplay();
  }

  function updateGenDisplay() {
      const t = appState.timers.general.time;
      const m = Math.floor(t / 60).toString().padStart(2,'0');
      const s = (t % 60).toString().padStart(2,'0');
      document.getElementById('gen-timer-display').innerText = `${m}:${s}`;
  }

  function toggleGenTimer() {
      const tm = appState.timers.general;
      const btn = document.getElementById('gen-start-btn');
      if(tm.running) {
          clearInterval(tm.interval);
          tm.running = false;
          btn.innerText = TRANSLATIONS[appState.lang].start_btn;
      } else {
          if(tm.time <= 0) return;
          tm.running = true;
          btn.innerText = TRANSLATIONS[appState.lang].pause_btn;
          tm.interval = setInterval(() => {
              tm.time--;
              updateGenDisplay();
              if(tm.time <= 0) {
                  clearInterval(tm.interval);
                  tm.running = false;
                  playSound('alarm');
                  btn.innerText = TRANSLATIONS[appState.lang].start_btn;
              }
          }, 1000);
      }
  }

  function resetGenTimer() {
      const tm = appState.timers.general;
      clearInterval(tm.interval);
      tm.running = false;
      tm.time = 0;
      updateGenDisplay();
      document.getElementById('gen-start-btn').innerText = TRANSLATIONS[appState.lang].start_btn;
  }

  /* --- UPGRADED FULL SCREEN CHESS LOGIC --- */
  function exitChessTimer(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      pauseChess();
      setView('menu');
  }

  function configChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      pauseChess();
      const currentMins = Math.floor(appState.timers.chess.initial / 60);
      document.getElementById('chess-config-input').value = currentMins;
      document.getElementById('chess-config-modal').classList.remove('hidden');
      document.getElementById('chess-config-input').select(); 
  }

  function submitChessConfig() {
      const val = document.getElementById('chess-config-input').value;
      if(val && !isNaN(val) && val > 0) {
          const secs = parseInt(val) * 60;
          appState.timers.chess.initial = secs;
          resetChess(); 
          closeModal('chess-config-modal'); 
          playSound('success'); 
      } else {
          const msg = appState.lang === 'ar' ? 'الرجاء إدخال وقت صحيح!' : 'Please enter valid time!';
          showToast(msg);
      }
  }

  function resetChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      const tm = appState.timers.chess;
      clearInterval(tm.interval);
      tm.active = null;
      tm.time1 = tm.initial;
      tm.time2 = tm.initial;
      updateChessUI();
      playSound('click');
  }

  function chessClick(player) {
      const tm = appState.timers.chess;
      if(player === 1) {
          if(tm.active === 1 || tm.active === null) startChessTimer(2); 
      } else if (player === 2) {
          if(tm.active === 2 || tm.active === null) startChessTimer(1); 
      }
      playSound('click');
  }

  function startChessTimer(activePlayer) {
      const tm = appState.timers.chess;
      clearInterval(tm.interval);
      tm.active = activePlayer;
      updateChessUI();
      tm.interval = setInterval(() => {
          if(tm.active === 1) {
              tm.time1--;
              if(tm.time1 <= 0) chessGameOver();
          } else {
              tm.time2--;
              if(tm.time2 <= 0) chessGameOver();
          }
          updateChessUI();
      }, 1000);
  }

  function pauseChess(event) {
      if(event) { event.stopPropagation(); event.preventDefault(); }
      clearInterval(appState.timers.chess.interval);
      appState.timers.chess.active = null;
      updateChessUI();
  }

  function updateChessUI() {
      const tm = appState.timers.chess;
      const fmt = (t) => {
          const m = Math.floor(t / 60).toString().padStart(2,'0');
          const s = (t % 60).toString().padStart(2,'0');
          return `${m}:${s}`;
      };
      
      const time1El = document.getElementById('chess-time-1');
      const time2El = document.getElementById('chess-time-2');
      if(time1El) time1El.innerText = fmt(tm.time1);
      if(time2El) time2El.innerText = fmt(tm.time2);

      const btn1 = document.getElementById('chess-btn-1');
      const btn2 = document.getElementById('chess-btn-2');
      if(!btn1 || !btn2) return;

      const base1 = "flex-1 flex flex-col items-center justify-center cursor-pointer transition-colors duration-150 ";
      const base2 = "flex-1 flex flex-col items-center justify-center cursor-pointer transition-colors duration-150 transform rotate-180 ";

      if (tm.active === 1) {
          btn1.className = base1 + "bg-green-500 text-white shadow-[inset_0_0_50px_rgba(0,0,0,0.3)]";
          btn2.className = base2 + "bg-slate-900 text-slate-600 opacity-60";
      } else if (tm.active === 2) {
          btn2.className = base2 + "bg-green-500 text-white shadow-[inset_0_0_50px_rgba(0,0,0,0.3)]";
          btn1.className = base1 + "bg-slate-900 text-slate-600 opacity-60";
      } else {
          // Paused / Idle State
          btn1.className = base1 + "bg-slate-800 text-slate-300";
          btn2.className = base2 + "bg-slate-800 text-slate-300";
      }
  }

  function chessGameOver() {
      clearInterval(appState.timers.chess.interval);
      playSound('alarm');
      const msg = appState.lang === 'ar' ? 'انتهى الوقت!' : "Time's up!";
      showToast(msg);
  }

  /* --- ALERTS & CONFIRMS --- */
  function showCustomAlert(msg, title) {
      document.getElementById('alert-msg').innerText = msg;
      const t = TRANSLATIONS[appState.lang];
      document.getElementById('alert-title').innerText = title || t.alert_title;
      document.getElementById('alert-modal').classList.remove('hidden');
      playSound('alarm');
  }
  function showConfirmModal(msg, callback) {
    document.getElementById('custom-confirm-msg').innerText = msg;
    confirmCallback = callback;
    document.getElementById('custom-confirm-modal').classList.remove('hidden');
  }
  function onCustomConfirm() {
    playSound('click');
    if (confirmCallback) {
        confirmCallback();
        confirmCallback = null;
    }
    closeModal('custom-confirm-modal');
  }

  /* --- MONKEY UTILS --- */
  function openMonkeyReorder() {
      reorderContext = 'monkey';
      tempReorderList = [...appState.monkey.players];
      const modalBtn = document.getElementById('reorder-save-btn');
      if(modalBtn) modalBtn.innerText = TRANSLATIONS[appState.lang].reorder_save;
      renderReorderList();
      document.getElementById('reorder-modal').classList.remove('hidden');
  }
  function openSwitchModal(monkeyRow, monkeyName) {
    stopTimer(); 
    switchData.monkeyRow = monkeyRow;
    switchData.monkeyName = monkeyName;
    const list = document.getElementById('switch-targets-list');
    list.innerHTML = '';
    const targets = appState.monkey.players.filter(p => !p.isMonkey);
    
    const t = TRANSLATIONS[appState.lang];
    const stagesMap = [t.safe, t.quarter_monkey, t.half_monkey, t.three_quarters_monkey, t.monkey_loser];

    if(targets.length === 0) {
        const noSafeMsg = appState.lang === 'ar' ? 'لا يوجد لاعبين آمنين' : 'No safe players';
        list.innerHTML = `<p class="text-red-500">${noSafeMsg}</p>`;
    } else {
        targets.forEach(t => {
            const stageName = stagesMap[t.col - 1] || t.safe;
            list.innerHTML += `<button onclick="confirmSwitch('${t.row}', '${t.col}', '${t.name}')" class="btn btn-gray flex justify-between items-center w-full mb-2 h-12 mt-0">
                <span class="font-bold text-slate-700 dark:text-slate-200">${t.name}</span> 
                <span class="text-xs bg-white dark:bg-slate-600 px-2 py-1 rounded border border-slate-200 dark:border-slate-500 font-bold">${stageName}</span>
            </button>`;
        });
    }
    document.getElementById('switch-modal').classList.remove('hidden');
  }
  function confirmSwitch(targetRow, targetCol, targetName) {
    switchData.targetRow = targetRow;
    switchData.targetCol = targetCol;
    document.getElementById('switch-modal').classList.add('hidden');
    document.getElementById('confirm-monkey-name').innerText = switchData.monkeyName;
    document.getElementById('confirm-target-name').innerText = targetName;
    
    // Switch confirm modal text needs localization too but it's hardcoded in HTML
    // We can update it here
    const msgEl = document.querySelector('#switch-confirm-modal p');
    if(appState.lang === 'en') {
        msgEl.innerHTML = `Are you sure you want to switch places between <br> <b id="confirm-monkey-name" class="text-red-500">${switchData.monkeyName}</b> and <b id="confirm-target-name" class="text-blue-500">${targetName}</b>?`;
    } else {
        msgEl.innerHTML = `هل أنت متأكد من تبديل أماكن <br> <b id="confirm-monkey-name" class="text-red-500">${switchData.monkeyName}</b> مع <b id="confirm-target-name" class="text-blue-500">${targetName}</b>؟`;
    }

    document.getElementById('switch-confirm-modal').classList.remove('hidden');
  }
  function executeSwitch() {
    document.getElementById('switch-confirm-modal').classList.add('hidden');
    const monkeyIdx = appState.monkey.players.findIndex(p => p.row == switchData.monkeyRow);
    const targetIdx = appState.monkey.players.findIndex(p => p.row == switchData.targetRow);
    if (monkeyIdx > -1 && targetIdx > -1) {
        const tempCol = appState.monkey.players[targetIdx].col;
        appState.monkey.players[targetIdx].col = 5; 
        appState.monkey.players[targetIdx].isMonkey = true;
        appState.monkey.players[monkeyIdx].col = tempCol; 
        appState.monkey.players[monkeyIdx].isMonkey = false;
        appState.monkey.turnIndex = monkeyIdx;
        checkWinCondition();
        renderMonkeyBoard();
        startTimer(); 
    }
  }
  function toggleAddPlayerModal() {
    const listContainer = document.getElementById('midgame-existing-list');
    listContainer.innerHTML = '';
    const currentNames = appState.monkey.players.map(p => p.name);
    const available = allPlayers.filter(p => !currentNames.includes(p));
    if(available.length === 0) {
        const allInMsg = appState.lang === 'ar' ? 'كل اللاعبين المسجلين يلعبون حالياً.' : 'All registered players are playing.';
        listContainer.innerHTML = `<p class="text-xs text-slate-400 col-span-2 text-center">${allInMsg}</p>`;
    } else {
        available.forEach(name => {
            const chip = document.createElement('div');
            chip.className = 'bg-slate-100 dark:bg-slate-800 p-2 px-4 rounded-full text-xs font-bold cursor-pointer';
            chip.innerText = name;
            chip.onclick = () => {
                document.getElementById('add-midgame-modal').classList.add('hidden');
                addLocalPlayer(name);
            };

/* --- KEEP SCREEN AWAKE (WAKE LOCK) --- */
let wakeLock = null;

async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('💡 Screen Wake Lock Active');
            
            // If the user minimizes the app and comes back, the lock breaks.
            // This listens for that and re-activates it automatically.
            document.addEventListener('visibilitychange', async () => {
                if (wakeLock !== null && document.visibilityState === 'visible') {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('💡 Screen Wake Lock Re-acquired');
                }
            });
        } catch (err) {
            console.log(`❌ Wake Lock Error: ${err.name}, ${err.message}`);
        }
    } else {
        console.log('⚠️ Wake Lock API not supported on this browser.');
    }
}

// 2. Action: Create a Brand New Group
function saveAsNewGroup() {
    const inputEl = document.getElementById('custom-group-name-input');
    const groupName = inputEl.value.trim();
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اكتب اسماً للمجموعة!" : "Enter a group name!", "error");
        return;
    }

    if (appState.activePlayers.length < 2) {
        showToast(appState.lang === 'ar' ? "المجموعة الجديدة تحتاج لاعبين (2) على الأقل!" : "New groups need at least 2 players!", "error");
        return;
    }

    saveDataToGroup(groupName, [...appState.activePlayers]);
}

// 3. Action: Update an Existing Group (Add or Replace)
function updateExistingGroup(mode) {
    const selectEl = document.getElementById('update-group-select');
    const groupName = selectEl.value;

    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة من القائمة لتحديثها!" : "Select a group to update!", "error");
        return;
    }

    let groups = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
    let currentGroupPlayers = groups[groupName] || [];

    if (mode === 'add') {
        // Merge without duplicates
        const newSet = new Set([...currentGroupPlayers, ...appState.activePlayers]);
        saveDataToGroup(groupName, Array.from(newSet));
        showToast(appState.lang === 'ar' ? `تم تحديث ${groupName}` : `Updated ${groupName}`, "success");
    
    } else if (mode === 'replace') {
        if (appState.activePlayers.length < 2) {
            showToast(appState.lang === 'ar' ? "يجب اختيار لاعبين (2) على الأقل للاستبدال!" : "Select at least 2 players to replace!", "error");
            return;
        }
        saveDataToGroup(groupName, [...appState.activePlayers]);
        showToast(appState.lang === 'ar' ? `تم استبدال مجموعة ${groupName}` : `Replaced ${groupName}`, "success");
    }
}

// Helper: Saves data and cleans up UI
function saveDataToGroup(groupName, playersArray) {
    let groups = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
    groups[groupName] = playersArray;
    localStorage.setItem('ashry_saved_groups', JSON.stringify(groups));
    
    closeModal('group-name-modal');
    renderSavedGroups(); 
    loadGroup(groupName); // Auto-load it to show the result
    playSound('success');
}

// 4. Loading Logic
function loadGroup(groupName) {
    const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
    if (!activeSetup) return;

    const listContainer = activeSetup.querySelector('[id$="-player-list"]');
    if (!listContainer) return;

    appState.currentGroup = groupName || "";

    if (!groupName || groupName === "") {
        appState.activePlayers = [];
        saveToLocal();
        renderActiveChips(listContainer.id);
        renderSavedGroups(); // Sync other dropdowns
        return; 
    }

    let groups = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
    const selectedNames = groups[groupName];

    if (selectedNames && selectedNames.length > 0) {
        appState.activePlayers = [...selectedNames];
        saveToLocal();
        renderActiveChips(listContainer.id);
        renderSavedGroups(); // Sync other dropdowns
        playSound('click');
    }
}

// 5. Delete Logic (From Modal)
function deleteGroupFromModal() {
    const select = document.getElementById('update-group-select');
    const groupName = select.value;
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة أولاً!" : "Select a group!", "error");
        return;
    }
    
    const msg = appState.lang === 'ar' ? `هل أنت متأكد من حذف "${groupName}" نهائياً؟` : `Delete "${groupName}"?`;
    
    if (typeof showConfirmModal === 'function') {
        showConfirmModal(msg, () => {
            let groups = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
            delete groups[groupName];
            localStorage.setItem('ashry_saved_groups', JSON.stringify(groups));
            
            if (appState.currentGroup === groupName) {
                appState.currentGroup = "";
            }
            
            renderSavedGroups(); 
            // Re-populate modal select
            const updateSelect = document.getElementById('update-group-select');
            updateSelect.innerHTML = `<option value="">-- اختر لتحديث مجموعة --</option>`;
            Object.keys(groups).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                updateSelect.appendChild(opt);
            });
            
            showToast(appState.lang === 'ar' ? "تم الحذف" : "Deleted", "success");
        });
    }
}

// 5. Delete Logic (Original - used from within setup views)
function deleteGroup(btnElement) {
    const select = btnElement.parentElement.querySelector('select');
    const groupName = select.value;
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة أولاً!" : "Select a group!", "error");
        return;
    }
    
    const msg = appState.lang === 'ar' ? `هل أنت متأكد من حذف "${groupName}" نهائياً؟` : `Delete "${groupName}"?`;
    
    if (typeof showConfirmModal === 'function') {
        showConfirmModal(msg, () => {
            let groups = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
            delete groups[groupName];
            localStorage.setItem('ashry_saved_groups', JSON.stringify(groups));
            
            if (appState.currentGroup === groupName) {
                appState.currentGroup = "";
            }
            
            renderSavedGroups(); 
            showToast(appState.lang === 'ar' ? "تم الحذف" : "Deleted", "success");
        });
    }
}

function renderSavedGroups() {
    const selects = document.querySelectorAll('.saved-groups-select');
    if (selects.length === 0) return;

    let groups = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
    const defaultText = appState.lang === 'ar' ? '-- اختر مجموعة محفوظة --' : '-- Select Saved Group --';
    
    selects.forEach(select => {
        select.innerHTML = `<option value="">${defaultText}</option>`;
        Object.keys(groups).forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.innerText = `${name} (${groups[name].length} ${appState.lang === 'ar' ? 'لاعب' : 'players'})`;
            select.appendChild(option);
        });
        
        // Restore selection
        select.value = appState.currentGroup || "";
    });
}


document.addEventListener('DOMContentLoaded', () => {

});
