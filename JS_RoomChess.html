<script>
/* ============================================================================
   شطرنج in rooms and on the TV (RoomChess.js): two play, the room watches
   ----------------------------------------------------------------------------
   The duels' winner stays on: two sit down (the challenger with White), the
   rest watch on their phones and the TV, and after a game the loser goes to
   the back of the line. Everything is public; the server checks the move with
   Chess.js, the same file this phone lights its squares with.

   Your own move is drawn as your finger lifts (the duels' rule): the phone
   plays it on a copy with the very rules the server uses, the piece slides at
   once, and the server's board, when it comes back with that move, is the same
   board - the same animation key, so nothing moves twice. Refused, the room's
   own board is drawn back.

   The clock is the server's (shared.chess.clock: each side's time and when the
   side to move's started, in the server's time). A phone can't read the
   server's clock, so it keeps the smallest gap it has seen between a clock
   start and the moment it heard of it (chRoomLocal.offset): at most one
   network delay behind, well inside the grace the server gives a move.

   In the duels' tournament (JS_RoomTournament.html) this file draws one
   match: the room is read through duelRoomState() (the match on this phone's
   screen, shaped like winner stays) and every move is sent through duelAct(),
   which carries the match. A tournament's replay and its Armageddon game say
   so above the status (chRoomTagHtml); the TV's live cards are small flat
   boards with their clocks (TOUR_CLIENT.chess in JS_RoomTournament.html).
   ========================================================================= */

// sel: the piece picked up; early: this phone's move, drawn before the server answers;
// offset: the server's clock against this phone's; tick: the clocks' redraw.
// pre / presel / preKey: your premove (one, on this phone only, never sent until it is played), for this game.
const chRoomLocal = { sel: '', selKey: '', early: null, offset: null, seenAt: null, tick: null, turnKey: '', stored: '', pre: null, presel: '', preKey: '' };

const chRoomSeat = (state) => (state.youAreScreen ? -1 : ((state.shared || {}).seats || []).indexOf(Room.me));

/** The board this phone shows: the room's, or its own move on top of it until the server has it. */
function chRoomBoard(state) {
  const s = state.shared;
  const bd = s.chess;
  const e = chRoomLocal.early;
  if (e && e.code === state.code && e.round === s.round && e.n === bd.moves + 1) return e;
  if (e && (e.code !== state.code || e.round !== s.round || bd.moves >= e.n)) chRoomLocal.early = null;
  return { g: bd.g, last: bd.last, lost: bd.lost, n: bd.moves, sans: bd.sans };
}

/** The server's clock, read on this phone. */
function chRoomNoteClock(state) {
  // The server says its time with every state (serverNow): the smallest gap seen between that and
  // now is the network's share. Only an older server leaves the clock's own start stamp to go by,
  // which after a reload is as old as the move being thought about.
  if (typeof state.serverNow === 'number') {
    if (chRoomLocal.seenAt !== 'n' + state.serverNow) {
      chRoomLocal.seenAt = 'n' + state.serverNow;
      // From when it arrived (the room engine notes it), not when the screen drew it.
      const gap = (state.receivedAt || Date.now()) - state.serverNow;
      chRoomLocal.offset = chRoomLocal.offset === null ? gap : Math.min(chRoomLocal.offset, gap);
    }
    return;
  }
  const c = ((state.shared || {}).chess || {}).clock;
  if (!c || c.at === null || c.at === undefined) return;
  if (chRoomLocal.seenAt !== c.at) {
    chRoomLocal.seenAt = c.at;
    const gap = Date.now() - c.at;
    chRoomLocal.offset = chRoomLocal.offset === null ? gap : Math.min(chRoomLocal.offset, gap);
  }
}

function chRoomClockLeft(state, side) {
  const bd = (state.shared || {}).chess;
  const c = bd && bd.clock;
  if (!c) return Infinity;
  if (c.at === null || c.at === undefined || bd.g.turn !== side || bd.result) return c.left[side];
  return c.left[side] - Math.max(0, Date.now() - (chRoomLocal.offset || 0) - c.at);
}

function chRoomPaintClocks(state) {
  document.querySelectorAll('[data-ch-rclock]').forEach(el => {
    const side = Number(el.dataset.chRclock);
    const left = chRoomClockLeft(state, side);
    el.textContent = chClockText(left);
    const bd = state.shared.chess;
    el.classList.toggle('is-running', !bd.result && bd.g.turn === side && !!(bd.clock && bd.clock.at));
    el.classList.toggle('is-low', left < 20000);
  });
}

/** The game whose clocks this screen shows big: the room's, or in a tournament the match on screen (or null). */
function chRoomLiveState() {
  const st = Room.state;
  if (!st || st.game !== 'chess' || !st.shared) return null;
  if (!st.shared.tour) return st.shared.chess ? st : null;
  const id = st.youAreScreen ? tourTvFocusId(st) : tourFocusId(st);
  const ms = id ? tourMatchState(st, id) : null;
  return ms && ms.shared.chess ? ms : null;
}

/** The TV's live cards: every match's clocks, read from the tournament. */
function chRoomPaintMiniClocks(full) {
  const els = document.querySelectorAll('[data-ch-mclock]');
  if (!els.length) return false;
  const games = ((full || {}).shared || {}).games || {};
  els.forEach(el => {
    const parts = el.dataset.chMclock.split(':');
    const g = games[parts[0]];
    if (!g || !g.chess) return;
    const text = chClockText(chRoomClockLeft({ shared: g }, Number(parts[1])));
    if (el.textContent !== text) el.textContent = text;
  });
  return true;
}

function chRoomTickStart() {
  if (chRoomLocal.tick) return;
  chRoomLocal.tick = setInterval(() => {
    const full = Room.state;
    const minis = full && full.game === 'chess' && full.shared && full.shared.tour ? chRoomPaintMiniClocks(full) : false;
    const st = chRoomLiveState();
    if (!st) { if (!minis) chRoomTickStop(); return; }
    chRoomPaintClocks(st);
    const bd = st.shared.chess;
    const seat = chRoomSeat(st);
    const left = chRoomClockLeft(st, bd.g.turn);
    if (bd.clock && bd.clock.at && !bd.result && left < 10000 && left > 0 && (seat === bd.g.turn || st.youAreScreen)) {
      const sec = Math.ceil(left / 1000);
      if (chRoomLocal.lastTick !== sec) { chRoomLocal.lastTick = sec; playSound('tick'); }
    }
  }, 200);
}

function chRoomTickStop() {
  if (chRoomLocal.tick) clearInterval(chRoomLocal.tick);
  chRoomLocal.tick = null;
}

/** Your move: drawn now, sent to the server, and taken back if the server says no. */
function chRoomPlay(from, to, promo) {
  const state = duelRoomState();
  if (!state || state.game !== 'chess') return;
  const s = state.shared;
  const bd = s.chess;
  const seat = chRoomSeat(state);
  if (s.phase !== 'play' || bd.result || seat !== bd.g.turn || chRoomLocal.early) return;
  const g = chessCloneGame(bd.g);
  const info = chessPlay(g, { from: from, to: to, promo: promo });
  if (!info) { chSound('refuse'); return; }
  const lost = [bd.lost[0].slice(), bd.lost[1].slice()];
  if (info.capture) lost[1 - seat].push(info.capture);
  const n = bd.moves + 1;
  chRoomLocal.early = { code: state.code, round: s.round, n: n, g: g, lost: lost, sans: bd.sans.concat([info.san]),
    last: { from: info.from, to: info.to, capture: info.capture, captureSq: info.captureSq, castle: info.castle, promo: info.promo, check: info.check, n: n } };
  chRoomLocal.sel = '';
  haptic('light');
  chRoomRedraw();
  Promise.resolve(duelAct('move', { from: from, to: to, promo: promo, move: bd.moves })).then(() => {
    const st = duelRoomState();
    const e = chRoomLocal.early;
    if (!e || e.n !== n) return;
    if (!st || st.game !== 'chess' || !st.shared.chess || st.shared.round !== e.round || st.shared.chess.moves < n) {
      chRoomLocal.early = null;
      chRoomRedraw(true);
    }
  });
}

function chRoomRedraw(still) {
  const full = Room.state;
  if (!full || full.game !== 'chess') return;
  if (full.youAreScreen) { if (appState.currentView === 'room-tv') TV_GAMES.chess.after(full, false); return; }
  if (appState.currentView !== 'room-chess') return;
  chRoomRender(duelRoomState(), still);
}

function chRoomResign() {
  const st = duelRoomState();
  if (!st || !st.shared.chess) return;
  const round = st.shared.round;
  showConfirmModal(chT('ch_resign_confirm'), () => duelAct('resign', { round: round }));
}

/** The model the board draws for a room screen. */
function chRoomModel(state, tv, still) {
  const s = state.shared;
  const bd = s.chess;
  const seat = tv ? -1 : chRoomSeat(state);
  const view = chRoomBoard(state);
  const mine = !tv && s.phase === 'play' && !bd.result && seat === view.g.turn && !chRoomLocal.early;
  const selKey = [roomDealKey(state), s.round, view.n].join('|');
  if (chRoomLocal.selKey !== selKey) { chRoomLocal.selKey = selKey; chRoomLocal.sel = ''; }
  const ctx = {
    g: view.g, side: seat, sel: chRoomLocal.sel,
    setSel: (sq) => { chRoomLocal.sel = sq; chRoomRedraw(); },
    play: (from, to, promo) => chRoomPlay(from, to, promo),
    redraw: () => chRoomRedraw()
  };
  const over = s.phase === 'over' && bd.result;
  // The other side to move (or your own move still on its way): a premove can be queued.
  const preKey = [roomDealKey(state), s.round].join('|');
  if (chRoomLocal.preKey !== preKey) { chRoomLocal.preKey = preKey; chRoomLocal.pre = null; chRoomLocal.presel = ''; }
  const preOn = !tv && (seat === 0 || seat === 1) && s.phase === 'play' && !bd.result && !mine;
  if (!preOn && !mine) { chRoomLocal.pre = null; chRoomLocal.presel = ''; }
  const pctx = {
    board: view.g.board, side: seat, sel: chRoomLocal.presel, pre: chRoomLocal.pre,
    setSel: (sq) => { chRoomLocal.presel = sq; chRoomRedraw(); },
    setPre: (mv) => { chRoomLocal.pre = mv; chRoomRedraw(); }
  };
  return {
    key: ['room', roomDealKey(state), s.round, tv ? 'tv' : 'p'].join('|'),
    board: view.g.board, orient: seat === 1 ? 1 : 0, tv: !!tv,
    loud: duelRoomLoud(state) || !!chRoomLocal.early,
    last: view.last ? { from: view.last.from, to: view.last.to } : null,
    anim: view.last ? Object.assign({ key: [roomDealKey(state), s.round, view.last.n].join('|'), still: !!still }, view.last) : null,
    check: chessCheckSq(view.g),
    mate: over && bd.result.reason === 'mate' ? chMateKing(view.g) : '',
    sel: mine ? chRoomLocal.sel : preOn ? chRoomLocal.presel : '',
    targets: mine ? chTargets(view.g, chRoomLocal.sel) : preOn && chRoomLocal.presel ? chPremoveTargets(view.g.board, chRoomLocal.presel) : [],
    marks: [], arrows: preOn && chRoomLocal.pre ? [{ from: chRoomLocal.pre.from, to: chRoomLocal.pre.to, color: CH_PRE_COLOR }] : [],
    lost: view.lost,
    input: mine ? { canMove: true, side: seat, onPick: (sq, fromDrag) => chTapLogic(ctx, sq, fromDrag), onDrop: (from, to) => chDropLogic(ctx, from, to) }
      : preOn ? { canMove: true, side: seat, premove: true, onPick: (sq, fromDrag) => chPreTapLogic(pctx, sq, fromDrag), onDrop: (from, to) => chPreDropLogic(pctx, from, to) } : null
  };
}

function chRoomPills(state, tv) {
  const s = state.shared;
  const bd = s.chess;
  const names = duelRoomNames(state);
  const seat = tv ? -1 : chRoomSeat(state);
  const scores = [(s.scores || {})[s.seats[0]] || 0, (s.scores || {})[s.seats[1]] || 0];
  const subs = [0, 1].map(k => (k === seat ? escapeHTML(chT('xo_you')) : ''));
  const view = chRoomBoard(state);
  return duelPillsHtml({
    players: [0, 1].map(k => ({
      name: names[k], score: scores[k],
      mark: `<span class="ch-mark ${k ? 'is-dark' : 'is-light'}" aria-hidden="true">${chPieceSvg(6 | (k ? 8 : 0))}</span>`,
      sub: (subs[k] ? subs[k] + ' ' : '') + (bd.clock ? `<b class="ch-clock metric" data-ch-rclock="${k}"></b>` : '') + chTakenHtml(view.lost[1 - k], chLead(view.lost, k))
    })),
    turn: s.phase === 'play' && !bd.result ? view.g.turn : -1, draws: null
  });
}

function chRoomStatus(state, tv) {
  const s = state.shared;
  const bd = s.chess;
  const names = duelRoomNames(state);
  if (s.phase === 'over' && bd.result) {
    if (bd.result.reason === 'left') return duelRoomResultLine(state, TRANSLATIONS[appState.lang] || {});
    // Armageddon: the game was drawn, and the draw is Black's.
    if (bd.result.drawn) {
      const how = chT('ch_end_' + bd.result.reason);
      return '🏆 ' + chT('ch_arma_won', { name: duelIso(names[1] || '') }) + (how ? ' · ' + how : '');
    }
    return chResultLine(bd.result.result, bd.result.reason, names);
  }
  const view = chRoomBoard(state);
  const seat = tv ? -1 : chRoomSeat(state);
  const check = chessCheckSq(view.g) ? ' · ' + chT('ch_check') : '';
  if (chRoomLocal.early && seat !== -1) return chT('ch_sent') + check;
  if (bd.offer) {
    if (seat !== -1 && seat !== bd.offer.seat) return chT('ch_offer_to_you', { name: duelIso(names[bd.offer.seat]) });
    return chT('ch_offer_made', { name: duelIso(names[bd.offer.seat]) });
  }
  if (seat === view.g.turn) return chT('duel_your_turn') + check;
  return chT('duel_turn_of', { name: duelIso(names[view.g.turn] || '') }) + check;
}

function chRoomBarHtml(state) {
  const s = state.shared;
  const bd = s.chess;
  const seat = chRoomSeat(state);
  const t = TRANSLATIONS[appState.lang] || {};
  if (s.phase !== 'play' || bd.result) return '';
  if (seat === -1) return duelRoomWatchNote(state, t);
  if (bd.offer && bd.offer.seat !== seat) {
    return `<div class="ch-offer"><p>½ ${escapeHTML(chT('ch_offer_to_you', { name: duelIso(duelRoomNames(state)[bd.offer.seat]) }))}</p>
      <div class="btn-row">
        <button type="button" class="btn btn--primary" onclick="duelAct('answerDraw', { accept: true })">🤝 ${escapeHTML(chT('ch_accept'))}</button>
        <button type="button" class="btn btn--ghost" onclick="duelAct('answerDraw', { accept: false })">${escapeHTML(chT('ch_refuse'))}</button>
      </div></div>`;
  }
  const canOffer = !bd.offer && (bd.offered || [])[seat] !== bd.moves;
  return `<div class="ch-bar__row">
      <button type="button" class="btn btn--ghost btn--sm btn--auto" ${canOffer ? '' : 'disabled'} onclick="duelAct('offerDraw', { move: ${Number(bd.moves) || 0} })">½ ${escapeHTML(bd.offer ? chT('ch_offer_sent') : chT('ch_offer'))}</button>
      <button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="chRoomResign()">🏳️ ${escapeHTML(chT('ch_resign'))}</button>
    </div>`;
}

/** The key a room's game is kept under on this phone (a tournament's by its number and the match's game). */
function chRoomGameKey(state) {
  const s = state.shared || {};
  const full = Room.state;
  if (s.tourMid) return 'room|' + state.code + '|t' + (((full && full.shared && full.shared.tour) || {}).no || 0) + '.' + (s.dealId || s.round);
  // Every chess start in a room is round 1 again: the deal tells two games apart.
  return 'room|' + state.code + '|' + (s.dealId || '') + '|' + s.round;
}

/** A tournament's game that isn't a match's first: the replay with the colours swapped, or Armageddon; plus 960 and handicap tags. */
function chRoomTagHtml(state) {
  const s = state.shared || {};
  const bd = s.chess;
  if (!bd) return '';
  const tags = [];
  if (s.tourMid) {
    if (bd.armageddon) tags.push(`<p class="ch-tag ch-tag--arma">⚔️ ${escapeHTML(chT('ch_arma_tag'))}</p>`);
    else if ((s.tourGames || 0) >= 2) tags.push(`<p class="ch-tag">🔁 ${escapeHTML(chT('ch_replay_tag'))}</p>`);
  }
  const set = s.settings || {};
  if (set.variant === '960') {
    tags.push(`<p class="ch-tag ch-tag--960">🎲 ${escapeHTML(chT('ch_pill_960') || '960')}</p>`);
  }
  if (!s.tourMid && set.odds && set.odds !== 'none' && s.champ && (s.seats || []).indexOf(s.champ) !== -1) {
    let label = '';
    if (set.odds === 'time') {
      label = chT('ch_pill_odds_time') || 'حسبة: نص الوقت';
    } else {
      const pieceName = chT('ch_odds_' + set.odds) || set.odds;
      label = chT('ch_pill_odds', { piece: pieceName }) || ('حسبة: بدون ' + pieceName);
    }
    tags.push(`<p class="ch-tag ch-tag--odds">⚖️ ${escapeHTML(label)}</p>`);
  }
  return tags.join('');
}

/**
 * The host's way on for a phone that went quiet (40 seconds on one move, or at
 * once for one that's away): the computer plays one move for it, at a low
 * rating (chessHostMove in RoomChess.js). With a clock, running out is the
 * other way on.
 */
function chRoomHostRow(state, tv) {
  const s = state.shared || {};
  const bd = s.chess;
  if (!state.youAreHost || s.phase !== 'play' || !bd || bd.result) return '';
  const key = [roomDealKey(state), s.round, bd.moves].join('|');
  if (chRoomLocal.turnKey !== key) { chRoomLocal.turnKey = key; chRoomLocal.turnSince = Date.now(); }
  const id = (s.seats || [])[bd.g.turn];
  const p = (state.players || []).find(x => x.id === id);
  if (!p || id === Room.me) return '';
  const wait = 40000 - (Date.now() - chRoomLocal.turnSince);
  if (p.online && wait > 0) {
    // Nothing else redraws a quiet board: look again when the 40 seconds are up.
    if (chRoomLocal.hostTimerKey !== key) {
      chRoomLocal.hostTimerKey = key;
      clearTimeout(chRoomLocal.hostTimer);
      chRoomLocal.hostTimer = setTimeout(() => chRoomRedraw(true), wait + 300);
    }
    return '';
  }
  const label = '⏭️ ' + chT('ch_play_for', { name: duelIso(duelRoomNames(state)[bd.g.turn] || '') });
  const press = `duelAct('skipTurn', { move: ${Number(bd.moves) || 0} })`;
  return tv ? `<div class="tv-actions">${tvBtn(label, press, 'ghost')}</div>` : roomHostRow([[label, press]]);
}

/**
 * A tournament: every game this phone played is kept for the review as it ends,
 * whatever the phone is showing (the final ends on the podium, not the board).
 */
function chRoomKeepTourGames(full) {
  const s = (full && full.shared) || {};
  if (!s.tour || full.youAreScreen) return;
  s.tour.matches.forEach(m => {
    const g = (s.games || {})[m.id];
    if (!g || g.phase !== 'over' || (g.seats || []).indexOf(Room.me) === -1) return;
    const ms = tourMatchState(full, m.id);
    if (ms) chRoomKeepGame(ms);
  });
}

/** Once a game is over, every phone that played it keeps it for the review. */
function chRoomKeepGame(state) {
  const s = state.shared;
  const bd = s.chess;
  if (s.phase !== 'over' || !bd || !bd.result || !bd.hist || !bd.hist.length || chRoomSeat(state) === -1) return;
  const key = chRoomGameKey(state);
  chRoomLocal.storedKeys = chRoomLocal.storedKeys || {};
  if (chRoomLocal.storedKeys[key]) return;
  chRoomLocal.storedKeys[key] = true;
  const names = duelRoomNames(state);
  chStoreGame({ mode: 'room', names: [names[0] || '', names[1] || ''], me: chRoomSeat(state), result: bd.result.result || 'd', reason: bd.result.reason || '', start: bd.start || '', moves: bd.hist.slice(), key: key, variant: (s.settings || {}).variant === '960' ? '960' : '' });
}

function chRoomRender(state, still) {
  const el = document.getElementById('view-room-chess');
  const s = state.shared;
  if (!el || !s || !s.chess) return;
  const t = TRANSLATIONS[appState.lang] || {};
  renderRoomFrame(el, ['chr', state.code, appState.lang].join('|'), () => chLayoutHtml());
  chRoomNoteClock(state);
  // Your turn has come with a premove queued: played now through the normal move (the server's
  // stale-tap guard sees this board's move count), or dropped with a shake if it isn't legal now.
  let preDropped = '';
  {
    const pre = chRoomLocal.pre;
    const bd0 = s.chess, seat0 = chRoomSeat(state);
    if (pre && chRoomLocal.preKey === [roomDealKey(state), s.round].join('|') && s.phase === 'play' && !bd0.result && !chRoomLocal.early && seat0 === bd0.g.turn) {
      chRoomLocal.pre = null; chRoomLocal.presel = '';
      if (chPremoveLegal(bd0.g, pre)) { chRoomPlay(pre.from, pre.to, pre.promo); return; }
      preDropped = pre.from;
    }
  }
  const model = chRoomModel(state, false, still);
  chViewShow(el.querySelector('[data-ch-host]'), model);
  const bd = s.chess;
  const seat = chRoomSeat(state);
  const view = chRoomBoard(state);
  const myTurn = s.phase === 'play' && !bd.result && seat === view.g.turn;
  const over = s.phase === 'over';
  chSetHtml(el, '[data-ch-head]', `${chRoomPills(state)}${chRoomTagHtml(state)}<p class="duel-status ${over ? 'is-done' : ''} ${myTurn ? 'is-mine' : ''}">${escapeHTML(chRoomStatus(state))}</p>`);
  chSetHtml(el, '[data-ch-bar]', chRoomBarHtml(state) + chRoomHostRow(state));
  const side = [];
  if (over) {
    // Kept first, so the share row below finds the game (a watcher keeps none, and has no row).
    chRoomKeepGame(state);
    side.push(duelRoomOverHtml(state, t), `<button type="button" class="btn btn--secondary" onclick="chOpenRoomReview(duelRoomState())">📊 ${escapeHTML(chT('ch_review'))}</button>`);
    if (seat !== -1) side.push(chShareRowHtml(chRoomGameKey(state)));
  }
  const rSet = s.settings || {};
  side.push(chMovesHtml(view.sans, { current: view.sans.length - 1, start: view.start || (s.chess && s.chess.start) || '', variant: rSet.variant || 'standard' }));
  side.push(duelRoomLineHtml(state, t));
  if ((state.players || []).length > 2 && !s.tourMid) side.push(renderScoreboard(s.board));
  if (over && !s.tourMid) side.push(roomShareBtnHtml(state, s.board));
  side.push(renderRoomPlayerStrip(state));
  chSetHtml(el, '[data-ch-side]', side.join(''));
  const mv = el.querySelector('.ch-moves');
  if (mv) mv.scrollTop = mv.scrollHeight;
  // A tournament's places in this screen (the round, the other matches, what comes next).
  if (s.tourMid && typeof tourAfterMatch === 'function') tourAfterMatch(el, Room.state, s.tourMid);
  chRoomPaintClocks(state);
  if (bd.clock) chRoomTickStart(); else chRoomTickStop();
  duelPillsAfter(el, 'chr|' + state.code, { turn: s.phase === 'play' && !bd.result ? view.g.turn : -1, scores: [(s.scores || {})[s.seats[0]] || 0, (s.scores || {})[s.seats[1]] || 0] });
  if (myTurn && duelOnce(['chturn', roomDealKey(state), s.round, bd.moves].join('|'))) haptic('medium');
  if (preDropped) chPremoveDropped(preDropped);
  if (over) { chRoomKeepGame(state); duelRoomCheer(el, state, ['ch', roomDealKey(state), s.round].join('|')); }
}

/* --- the lobby: the clock, the host's choice, remembered on their phone ---------- */

const chRoomOpts = () => recallOptions('chessRoom', { clock: 'off', variant: 'standard', odds: 'none' });

function setChRoomClock(v) {
  rememberOptions('chessRoom', { clock: chessClockId(v) });
  duelLobbyRedraw();
}

function setChRoomVariant(v) {
  rememberOptions('chessRoom', { variant: v === '960' ? '960' : 'standard' });
  duelLobbyRedraw();
}

function setChRoomOdds(v) {
  rememberOptions('chessRoom', { odds: String(v) });
  duelLobbyRedraw();
}

ROOM_GAMES.chess = {
  // Someone who joins mid-game joins the line and watches (routeRoomState).
  lateJoin: true,
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang] || {};
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(t.duel_lobby_hint || '')}</p>`;
    const o = chRoomOpts();
    const isTour = typeof tourModeOf === 'function' && tourModeOf('chess') === 'tour';
    const clockHtml = `
      <div class="field">
        <label class="field__label">⏱️ ${escapeHTML(chT('ch_clock_label'))}</label>
        <div class="segmented" role="group">
          ${CHESS_CLOCK_IDS.map(v => `<button type="button" class="segmented__item ${v === o.clock ? 'is-active' : ''}" onclick="setChRoomClock('${v}')">${escapeHTML(v === 'off' ? chT('gw_clock_off') : v)}</button>`).join('')}
        </div>
        <p class="field__hint">${escapeHTML(chT('ch_clock_hint'))}</p>
      </div>`;
    const varHtml = `
      <div class="field">
        <label class="field__label">🎲 ${escapeHTML(chT('ch_variant_label'))}</label>
        <div class="segmented" role="group">
          <button type="button" class="segmented__item ${o.variant !== '960' ? 'is-active' : ''}" onclick="setChRoomVariant('standard')">${escapeHTML(chT('ch_var_standard'))}</button>
          <button type="button" class="segmented__item ${o.variant === '960' ? 'is-active' : ''}" onclick="setChRoomVariant('960')">${escapeHTML(chT('ch_var_960'))}</button>
        </div>
        <p class="field__hint">${escapeHTML(chT('ch_variant_hint'))}</p>
      </div>`;
    const oddsValues = [
      ['none', chT('ch_odds_none')],
      ['pawn', chT('ch_odds_pawn')],
      ['knight', chT('ch_odds_knight')],
      ['rook', chT('ch_odds_rook')],
      ['queen', chT('ch_odds_queen')],
      ['time', chT('ch_odds_time')]
    ];
    const oddsHtml = isTour ? '' : `
      <div class="field">
        <label class="field__label">⚖️ ${escapeHTML(chT('ch_odds_label'))}</label>
        <div class="segmented" role="group">
          ${oddsValues.map(v => `<button type="button" class="segmented__item ${v[0] === (o.odds || 'none') ? 'is-active' : ''}" onclick="setChRoomOdds('${v[0]}')">${escapeHTML(v[1])}</button>`).join('')}
        </div>
        <p class="field__hint">${escapeHTML(chT('ch_odds_hint'))}</p>
      </div>`;
    return `<div class="card card--tight">
        ${clockHtml}
        ${varHtml}
        ${oddsHtml}
        ${isTour && typeof tourCanStart === 'function' && tourCanStart(state) ? '' : `<p class="field__hint" style="text-align:center">${escapeHTML(t.duel_lobby_hint || '')}</p>`}
      </div>`;
  },
  startPayload() {
    const o = chRoomOpts();
    return { clock: o.clock, variant: o.variant || 'standard', odds: o.odds || 'none' };
  },
  render(state) {
    if (appState.currentView !== 'room-chess') setView('room-chess');
    chRoomRender(state);
  },
  // A move is not a new step to scroll to: the board is what everyone is watching.
  actionKey: (state) => [state.code, (state.shared || {}).round, (state.shared || {}).phase].join('|')
};

onRoomClocksReset(() => {
  chRoomTickStop();
  chRoomLocal.sel = '';
  chRoomLocal.early = null;
  const st = Room.state;
  if (!st || st.game !== 'chess' || st.phase === 'lobby') {
    if (appState.currentView === 'room-chess' || appState.currentView === 'room-tv' || appState.currentView === 'room-lobby') chViewDrop();
  }
});

/* --- the TV: the board big, both players with their clocks and what they took, the moves --- */

TV_GAMES.chess = {
  sig: (state) => ['ch', state.code].join('|'),
  frame(state, t) {
    const s = state.shared || {};
    if (!s.chess) return tvLookAtPhones(t);
    return `<div class="ch-tv duel">
        <div class="ch-tv__stage"><div class="ch-stage ch-stage--tv" data-ch-host></div></div>
        <div class="ch-tv__side" data-ch-tvside></div>
      </div>`;
  },
  after(state) {
    const view = document.getElementById('view-room-tv');
    const s = state.shared || {};
    if (!view || !s.chess) return;
    const host = view.querySelector('[data-ch-host]');
    if (!host) return;
    const t = TRANSLATIONS[appState.lang] || {};
    chRoomNoteClock(state);
    chViewShow(host, chRoomModel(state, true));
    const bd = s.chess;
    const over = s.phase === 'over';
    const tvSet = s.settings || {};
    const moves = bd.sans.length ? `<div class="ch-tv__moves">${chMovesHtml(bd.sans, { current: bd.sans.length - 1, start: bd.start || '', variant: tvSet.variant || 'standard' })}</div>` : '';
    const html = `
      <div class="tv-scale">${chRoomPills(state, true)}</div>
      ${chRoomTagHtml(state)}
      <div class="tv-title tv-center-text duel-tv__status">${escapeHTML(chRoomStatus(state, true))}</div>
      ${over ? duelRoomOverHtml(state, t, true) : moves}
      ${chRoomHostRow(state, true)}
      <div class="tv-scale">${duelRoomLineHtml(state, t, true)}</div>`;
    const side = view.querySelector('[data-ch-tvside]');
    if (side && side._chHtml !== html) {
      side.innerHTML = html;
      side._chHtml = html;
      const mv = side.querySelector('.ch-moves');
      if (mv) mv.scrollTop = mv.scrollHeight;
      if (s.tourMid && typeof tourAfterMatch === 'function') tourAfterMatch(view, Room.state, s.tourMid);
    }
    chRoomPaintClocks(state);
    if (bd.clock) chRoomTickStart(); else chRoomTickStop();
    duelPillsAfter(view, 'chtv|' + state.code, { turn: s.phase === 'play' && !bd.result ? bd.g.turn : -1, scores: [(s.scores || {})[s.seats[0]] || 0, (s.scores || {})[s.seats[1]] || 0] });
    if (over) duelRoomCheer(view, state, ['ch', roomDealKey(state), s.round].join('|'));
  }
};
</script>
