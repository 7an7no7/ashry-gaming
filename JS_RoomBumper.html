<script>
/* ============================================================================
   عربيات التصادم — BUMPER CARS (28 Sep 2026)
   ----------------------------------------------------------------------------
   The TV runs the game; every phone is a controller. The moves never go
   through the rules: a phone sends its stick (or its tilt), its boost and its
   horn over the room's live channel (Room.sendLive), the rooms server passes
   them to the screens without keeping them (room.js, relayDrive), and the TV
   drives the cars - the computer players' too - judges the knocks, the
   balloons and the ring, and sends the result at the end (`finish`). The
   server only deals the round (RoomBumper.js).

   Three ways to play (the owner): بالونات (3 each, a knock pops one, the last
   with balloons wins, the popped drive on as ghosts), نقط (the most knocks on
   a clock) and الحلبة (a platform with no rail: push the others off - a point
   a push on a clock, or the last one on). A 3D fairground rink on the TV
   (three.js), and a flat one where 3D can't draw.

   Messages (d): phone → TV  { k: 'i', x, y }  the stick, -100..100 each (y down)
                             { k: 'i', s, g }  the tilt: steer -100..100, gas -100..100
                             { k: 'b' } boost   { k: 'hn' } horn
                             { k: 'p', n, at, r }  a ping (r: the last delay seen)
                 TV → phone  { k: 'p', to, n, at }  the ping's echo
                             { k: 'h', to, w: 'hit' | 'got' | 'pop' | 'fell' }  a moment to feel
                             { k: 's', to, l, sc, pl, of, gh, out }  lives, score, place, ghost / out
   Every name here starts with bmp / BMP_.
   ========================================================================= */
const BMP_W = 1600, BMP_H = 900;          // the rink, in its own units (16:9); a unit is a centimetre
const BMP_R = 38;                         // a car's bumper, a circle
const BMP_RING_R = 440;                   // الحلبة: the platform's radius
const BMP_COLORS = ['#e5383b', '#3f73d6', '#e9b52a', '#35a35a', '#8b5cf6', '#f97316', '#ec4899', '#06b6d4'];
const BMP_SEND_MS = 66;                   // the controller's beat: ~15 a second
const BMP_KEEP_MS = 800;                  // an input that hasn't changed is resent this often
const BMP_PING_MS = 1500;
const BMP_STALE_MS = 1500;                // the TV lets go of a stick not heard from this long
const BMP_BOOST_MS = 4000;                // the boost's cooldown
const BMP_RESPAWN_MS = 3000;              // الحلبة on the clock: back on the platform after this
const BMP_LIVES = 3;
const BMP_FREE_PER_DAY = 100000;          // Durable Object requests a day on the free plan
const BMP_MSGS_PER_REQUEST = 20;          // incoming WebSocket messages billed as one request

const bmp = {
  gap: Infinity,                          // receivedAt - serverNow, smallest seen (the chess clocks' way)
  mode: 'stick',
  stick: { x: 0, y: 0 },
  tilt: { s: 0, held: false, auto: false, zero: 0, flip: 1, on: false, asking: false, raw: 0, rot: 90 },
  lastSent: '', lastSentAt: 0, sendTimer: null,
  ping: { n: 0, sent: {}, last: null, list: [] }, pingTimer: null,
  wake: null, uiTimer: null, flashUntil: 0,
  boostAt: 0,
  me: null,                               // what the TV last said about this phone's car
  tv: null,                               // the TV's game: cars, loop, view
  stats: false,                           // the TV's delay and traffic numbers
  locked: false                           // the fullscreen + landscape lock this game asked for itself
};
try {
  const o = recallOptions('bumper', { mode: 'stick', auto: false, stats: false });
  bmp.mode = o.mode === 'tilt' ? 'tilt' : 'stick';
  bmp.tilt.auto = !!o.auto;
  bmp.stats = !!o.stats;
} catch (e) {}

const bmpT = () => TRANSLATIONS[appState.lang] || TRANSLATIONS.ar;
const bmpFill = (str, vals) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (vals[k] !== undefined ? vals[k] : m));

/* «كورة التصادم» (2 Oct 2026): its words live here, in the game's own chunk (the shell is full). */
const BMP_TEXT = {
  ar: {
    mode: 'كورة', mode_full: 'كورة التصادم', red: 'الأحمر', blue: 'الأزرق', team_red: 'فريق الأحمر', team_blue: 'فريق الأزرق',
    how: 'كورة كبيرة وجونين: الأحمر ضد الأزرق. زُق الكورة بعربيتك لجون التاني. الخبطة بتزق ومبتحسبش، والتعادل جون ذهبي.',
    m300: '5 دقايق', pick_side: 'فريقك', nobody: 'لسه محدش', unpicked: 'لسه {n} ما اختاروش، هيروحوا الناحية الأقل.',
    cpu_fill: 'الكمبيوتر بيلعب بس في الناحية الفاضية.', attack: 'بتجيب جون في {team}', goal: 'جوووول!', own: 'في نفسه',
    golden: 'جون ذهبي!', golden_short: 'جون ذهبي', full_time: 'انتهى الماتش', won: '{team} كسب!', draw: 'تعادل!',
    cpu: 'كمبيوتر', for_team: 'لـ{team}', next_side: 'الماتش الجاي: اختار فريقك', goals: 'جون'
  },
  en: {
    mode: 'Ball', mode_full: 'Bumper Ball', red: 'Red', blue: 'Blue', team_red: 'Red team', team_blue: 'Blue team',
    how: 'A big ball and two goals: Red against Blue. Push the ball into the other goal with your car. Bumps push and score nothing; a draw goes to a golden goal.',
    m300: '5 min', pick_side: 'Your side', nobody: 'Nobody yet', unpicked: '{n} haven\'t picked yet: they go to the smaller side.',
    cpu_fill: 'A computer car plays only on an empty side.', attack: 'Score in {team}\'s goal', goal: 'GOOOAL!', own: 'own goal',
    golden: 'Golden goal!', golden_short: 'Golden goal', full_time: 'Full time', won: '{team} win!', draw: 'A draw!',
    cpu: 'Computer', for_team: 'for {team}', next_side: 'Next match: pick your side', goals: 'goals'
  }
};
const bmpX = (key) => (BMP_TEXT[appState.lang] || BMP_TEXT.ar)[key] || BMP_TEXT.ar[key] || '';
const BMP_TEAM = { red: '#e11d48', blue: '#2563eb' };   // the design system's --team-red / --team-blue
const BMP_BALL_R = 46;                    // the ball: bigger than a car's bumper (38)
const BMP_RAIL = 18;                      // the rail's inner face
const BMP_GOAL_HALF = 150;                // the goal mouth: 3 m
const BMP_GOAL_D = 120;                   // the net's depth: a ball fits in whole
const BMP_GOAL_SHOW_MS = 2600;            // «جوووول!» on the screen before the kick-off
const BMP_KICK_MS = 3000;                 // the 3-2-1 before the kick-off
const BMP_GOLDEN_MS = 60000;              // a draw at the whistle: a golden goal, a minute at most
const BMP_BALL_SECS = [120, 180, 300];
const bmpIsBall = (s) => !!(s && s.settings && s.settings.mode === 'ball');
/** A driver's side: the match's, or for a latecomer the smaller side (RoomBumper.js bumperSideOf, the same steps). */
function bmpSideOf(state, id) {
  const s = (state && state.shared) || {};
  const sides = s.sides || {};
  if (sides[id]) return sides[id];
  const count = { red: 0, blue: 0 };
  Object.keys(sides).forEach(k => { if (count[sides[k]] !== undefined) count[sides[k]]++; });
  let mine = null;
  ((state && state.players) || []).filter(p => !p.bot && !sides[p.id]).forEach(p => {
    const side = count.red <= count.blue ? 'red' : 'blue';
    count[side]++;
    if (p.id === id) mine = side;
  });
  return mine;
}
/** The match's cars by side, in the order they line up and number their shirts: the dealt, the fillers, the latecomers. */
function bmpBallTeams(state) {
  const s = (state && state.shared) || {};
  const ids = (s.roster || []).concat(Object.keys(s.cpu || {}));
  ((state && state.players) || []).forEach(p => { if (!p.bot && ids.indexOf(p.id) === -1) ids.push(p.id); });
  const out = { red: [], blue: [] };
  ids.forEach(id => { const k = bmpSideOf(state, id); if (out[k]) out[k].push(id); });
  return out;
}
const bmpShirtNo = (state, id) => { const k = bmpSideOf(state, id) || 'red'; return Math.max(0, bmpBallTeams(state)[k].indexOf(id)) + 1; };
const bmpCpuName = (state, id) => ((state && state.shared && state.shared.cpu) || {})[id] ? '🤖 ' + bmpX('cpu') : null;
function bmpNoteTime(state) {
  if (state && typeof state.serverNow === 'number' && typeof state.receivedAt === 'number') {
    bmp.gap = Math.min(bmp.gap, state.receivedAt - state.serverNow);
  }
}
const bmpServerNow = () => (isFinite(bmp.gap) ? Date.now() - bmp.gap : Date.now());
const bmpSettings = (s) => Object.assign({ mode: 'balloons', ringWin: 'clock', secs: 120, ballSecs: 180 }, (s && s.settings) || {});
const bmpLastStanding = (st) => st.mode === 'balloons' || (st.mode === 'ring' && st.ringWin === 'last');

/** A driver's colour: the one dealt, or for a latecomer the next in the room's order (the same on every screen). */
function bmpColorOf(state, pid) {
  const s = (state && state.shared) || {};
  if (bmpIsBall(s)) return BMP_TEAM[bmpSideOf(state, pid) || 'red'];    // «كورة التصادم»: the side's colour
  const dealt = s.colors || {};
  if (dealt[pid] !== undefined) return BMP_COLORS[dealt[pid] % BMP_COLORS.length];
  const late = ((state && state.players) || []).filter(p => !p.bot && dealt[p.id] === undefined).map(p => p.id);
  const k = Object.keys(dealt).length + Math.max(0, late.indexOf(pid));
  return BMP_COLORS[k % BMP_COLORS.length];
}
const bmpColorIndex = (state, pid) => BMP_COLORS.indexOf(bmpColorOf(state, pid));
/**
 * The ink for a word on a car's colour: dark on the light cars (yellow, orange,
 * cyan, green, pink), white on the dark ones; `plate` where neither reaches
 * 4.5:1 (the red and the violet), so the word sits on a darker pill.
 */
function bmpCarInk(hex) {
  const lum = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255)
    .map(v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)))
    .reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0);
  const L = /^#[0-9a-f]{6}$/i.test(hex || '') ? lum(hex) : 0.2;
  const onWhite = 1.05 / (L + 0.05), onDark = (L + 0.05) / (lum('#1b1b1f') + 0.05);
  return onDark > onWhite ? { ink: '#1b1b1f', plate: onDark < 4.5 } : { ink: '#ffffff', plate: onWhite < 4.5 };
}
const bmpHasScreen = (state) => (state.screens || []).some(x => x.online);
function bmpSecsLeft(state) {
  const s = state.shared || {};
  return Math.max(0, Math.ceil(((s.endsAt || 0) - bmpServerNow()) / 1000));
}
const bmpClockText = (secs) => Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
const bmpModeName = (st, t) => st.mode === 'ball' ? bmpX('mode_full') : st.mode === 'balloons' ? t.bmp_mode_balloons : st.mode === 'points' ? t.bmp_mode_points
  : (st.ringWin === 'last' ? t.bmp_mode_ring_last : t.bmp_mode_ring_clock);
const bmpModeLine = (st, t) => st.mode === 'ball' ? bmpX('how') : st.mode === 'balloons' ? t.bmp_how_balloons : st.mode === 'points' ? t.bmp_how_points
  : (st.ringWin === 'last' ? t.bmp_how_ring_last : t.bmp_how_ring_clock);
/** The balloons as a row of icons: those left, and the popped ones faded. */
const bmpBalloonsHtml = (n, color) => Array.from({ length: BMP_LIVES }, (_, i) =>
  `<span class="bmp-balloon ${i < n ? '' : 'is-popped'}" style="--car:${color}" aria-hidden="true"></span>`).join('');

/* --- the lobby ---------------------------------------------------------------- */
function bmpLobbyOpts() {
  const o = recallOptions('bumper', { gmode: 'balloons', ringWin: 'clock', secs: 120, ballSecs: 180 });
  return { mode: ['balloons', 'points', 'ring', 'ball'].indexOf(o.gmode) !== -1 ? o.gmode : 'balloons',
    ringWin: o.ringWin === 'last' ? 'last' : 'clock', secs: [60, 120, 180].indexOf(o.secs) !== -1 ? o.secs : 120,
    ballSecs: BMP_BALL_SECS.indexOf(o.ballSecs) !== -1 ? o.ballSecs : 180 };
}
function bmpSetLobby(patch) {
  const next = Object.assign(bmpLobbyOpts(), patch);
  rememberOptions('bumper', { gmode: next.mode, ringWin: next.ringWin, secs: next.secs, ballSecs: next.ballSecs });
  const box = document.getElementById('bmp-lobby');
  if (box && Room.state) box.outerHTML = bmpLobbyHtml(Room.state);
  if (patch.mode && Room.state) bmpSendLobbyMode(Room.state);
  const seats = document.getElementById('bmp-seats');
  if (Room.state) { if (seats) seats.outerHTML = bmpLobbySeats(Room.state) || '<div id="bmp-seats"></div>'; }
}
/**
 * «كورة التصادم»: every phone shows the side picker once the host's way is the ball,
 * so the host's choice goes to the room (lobbyMode) - when it changes, and once
 * when the lobby opens with a way remembered from before.
 */
let bmpLobbySent = '';
function bmpSendLobbyMode(state) {
  if (!state || !state.youAreHost || state.game !== 'bumper') return;
  const mode = bmpLobbyOpts().mode;
  const s = state.shared || {};
  const lobbyish = state.phase === 'lobby' || s.phase === 'over';
  const key = state.code + '|' + mode + '|' + (s.dealId || '');
  if (!lobbyish || s.lobbyMode === mode || bmpLobbySent === key) return;
  bmpLobbySent = key;
  roomAct('lobbyMode', { mode });
}
function bmpLobbyHtml(state) {
  const t = bmpT();
  const o = bmpLobbyOpts();
  const tv = bmpHasScreen(state) ? '' : `<p class="field__hint bmp-need">📺 ${escapeHTML(t.bmp_need_tv)}</p>`;
  const seg = (items, cur, fn) => `<div class="segmented" role="radiogroup">${items.map(([v, label]) =>
    `<button type="button" class="segmented__item ${cur === v ? 'is-active' : ''}" onclick="${fn}('${v}')">${escapeHTML(label)}</button>`).join('')}</div>`;
  if (!state.youAreHost) {
    return `<div class="card card--tight" id="bmp-lobby">${tv}<p class="field__hint" style="text-align:center">${escapeHTML(t.bmp_lobby_wait)}</p></div>`;
  }
  setTimeout(() => bmpSendLobbyMode(Room.state), 0);
  const clocked = o.mode === 'points' || (o.mode === 'ring' && o.ringWin === 'clock');
  return `
    <div class="card card--tight" id="bmp-lobby">
      <div class="field">
        <span class="field__label">${escapeHTML(t.bmp_mode)}</span>
        ${seg([['balloons', '🎈 ' + t.bmp_mode_balloons], ['points', '💥 ' + t.bmp_mode_points], ['ring', '⭕ ' + t.bmp_mode_ring], ['ball', '⚽ ' + bmpX('mode')]], o.mode, "bmpPickMode")}
      </div>
      ${o.mode === 'ring' ? `<div class="field">
        <span class="field__label">${escapeHTML(t.bmp_ring_win)}</span>
        ${seg([['clock', t.bmp_ring_clock], ['last', t.bmp_ring_last]], o.ringWin, "bmpPickRing")}
      </div>` : ''}
      ${clocked ? `<div class="field">
        <span class="field__label">${escapeHTML(t.bmp_len)}</span>
        ${seg([['60', t.bmp_m60], ['120', t.bmp_m120], ['180', t.bmp_m180]], String(o.secs), "bmpPickSecs")}
      </div>` : ''}
      ${o.mode === 'ball' ? `<div class="field">
        <span class="field__label">${escapeHTML(t.bmp_len)}</span>
        ${seg([['120', t.bmp_m120], ['180', t.bmp_m180], ['300', bmpX('m300')]], String(o.ballSecs), "bmpPickBallSecs")}
      </div>` : ''}
      <p class="field__hint bmp-how">${escapeHTML(bmpModeLine(o, t))}</p>
      ${tv}
    </div>`;
}
function bmpPickMode(v) { bmpSetLobby({ mode: v }); }
function bmpPickRing(v) { bmpSetLobby({ ringWin: v }); }
function bmpPickSecs(v) { bmpSetLobby({ secs: Number(v) }); }
function bmpPickBallSecs(v) { bmpSetLobby({ ballSecs: Number(v) }); }

/** «كورة التصادم»: the two sides, each person tapping theirs (blue on the left, red on the right, as on the pitch). */
function bmpSidesHtml(state, label) {
  const s = state.shared || {};
  const picks = s.picks || {};
  const mine = picks[Room.me];
  const people = (state.players || []).filter(p => !p.bot);
  const me = people.some(p => p.id === Room.me) && !state.youAreScreen;
  const sep = appState.lang === 'ar' ? '، ' : ', ';
  const col = (side) => {
    const names = people.filter(p => picks[p.id] === side).map(p => `<bdi>${escapeHTML(p.name)}</bdi>`).join(sep);
    return `<button type="button" class="bmp-side bmp-side--${side} ${mine === side ? 'is-mine' : ''}" ${me ? `onclick="bmpPickSide('${side}')"` : 'disabled'} aria-pressed="${mine === side}">
      <b>${escapeHTML(bmpX(side))}</b><span>${names || escapeHTML(bmpX('nobody'))}</span></button>`;
  };
  const left = people.filter(p => !picks[p.id]).length;
  return `<div class="field bmp-seats" id="bmp-seats">
      <span class="field__label">${escapeHTML(label || bmpX('pick_side'))}</span>
      <div class="bmp-sides" dir="ltr">${col('blue')}${col('red')}</div>
      <p class="field__hint">${left ? escapeHTML(bmpFill(bmpX('unpicked'), { n: left })) + ' ' : ''}${escapeHTML(bmpX('cpu_fill'))}</p>
    </div>`;
}
function bmpLobbySeats(state) {
  const s = state.shared || {};
  const ball = state.youAreHost ? bmpLobbyOpts().mode === 'ball' : s.lobbyMode === 'ball';
  return ball ? bmpSidesHtml(state) : '';
}
function bmpPickSide(side) {
  haptic('light');
  roomAct('side', { side });
}

/* --- the phone ---------------------------------------------------------------- */
ROOM_GAMES.bumper = {
  lateJoin: true,       // someone who joins mid-round gets a car at once
  bots: { max: 8 },
  lobbyOptions(state) { return bmpLobbyHtml(state); },
  // «كورة التصادم»: the sides are where the table is seated, so never folded with the host's options.
  lobbySeats(state) { return bmpLobbySeats(state); },
  startPayload() { return bmpLobbyOpts(); },
  // The cars drive on the big screen: Start waits for one to be online (the server refuses it too).
  startBlock(state) { const t = bmpT(); return bmpHasScreen(state) ? '' : '📺 ' + t.bmp_start_need_tv; },

  render(state) {
    if (appState.currentView !== 'room-bumper') setView('room-bumper');
    const el = document.getElementById('view-room-bumper');
    if (!el) return;
    bmpNoteTime(state);
    const t = bmpT();
    const s = state.shared || {};
    const st = bmpSettings(s);
    const me = Room.me;
    const driver = (state.players || []).some(p => p.id === me && !p.bot);
    if (bmp.me && bmp.me.round !== s.round) bmp.me = null;
    const sig = ['bmp', s.round, s.phase, bmp.mode, bmp.tilt.auto, bmpHasScreen(state), state.youAreHost, driver, appState.lang,
      s.phase === 'over' ? JSON.stringify(s.results) + JSON.stringify(s.wins) + JSON.stringify(s.picks || {}) : '',
      bmpIsBall(s) ? bmpSideOf(state, me) + bmpShirtNo(state, me) : ''].join('|');
    renderRoomFrame(el, sig, () => {
      if (s.phase === 'over' && bmpIsBall(s)) return bmpBallOverHtml(state, s, t) + (driver ? bmpSidesHtml(state, bmpX('next_side')) : '') + renderRoomPlayerStrip(state);
      if (s.phase === 'over') return bmpOverHtml(state, s, t) + renderRoomPlayerStrip(state);
      const color = bmpColorOf(state, me);
      const noTv = bmpHasScreen(state) ? '' : `<div class="waiting-note bmp-need">📺 ${escapeHTML(t.bmp_need_tv)}</div>`;
      const ink = bmpCarInk(color);
      const acts = `
        <div class="bmp-acts">
          <button type="button" class="bmp-act bmp-act--boost ${ink.plate ? 'is-plate' : ''}" id="bmp-boost" onclick="bmpBoost()" style="--car:${color};--car-ink:${ink.ink}">
            <span class="bmp-act__ring" aria-hidden="true"></span><span class="bmp-act__label">🚀 ${escapeHTML(t.bmp_boost)}</span>
          </button>
          <button type="button" class="bmp-act bmp-act--horn" onclick="bmpHorn()">📯 ${escapeHTML(t.bmp_horn)}</button>
        </div>`;
      if (!driver) {
        return `<div class="bmp">${noTv}<p class="bmp-look">${escapeHTML(t.bmp_look_tv)}</p>${renderRoomPlayerStrip(state)}</div>`;
      }
      if (bmp.mode === 'tilt') {
        return `<div class="bmp is-tilt" id="bmp-phone">
          <div class="bmp-land" id="bmp-land" style="--car:${color};--car-ink:${ink.ink}">
            <div class="bmp-land__top">
              ${bmpStatusHtml(state, true)}
              <button type="button" class="btn btn--ghost btn--xs btn--auto bmp-land__back" onclick="bmpSetMode('stick')">${escapeHTML(t.bmp_back_stick)}</button>
            </div>
            <div class="bmp-land__main">
              <div class="bmp-land__side">
                <div class="bmp-wheel" id="bmp-wheel" aria-hidden="true"><div class="bmp-wheel__spoke"></div></div>
                <div class="bmp-land__row">
                  <button type="button" class="btn btn--ghost btn--xs btn--auto" onclick="bmpTiltCentre()">${escapeHTML(t.bmp_center)}</button>
                  <button type="button" class="btn btn--ghost btn--xs btn--auto" onclick="bmpTiltFlip()">${escapeHTML(t.bmp_flip)}</button>
                </div>
              </div>
              <div class="bmp-land__side">
                <button type="button" class="bmp-auto ${bmp.tilt.auto ? 'is-on' : ''}" onclick="bmpToggleAuto()" aria-pressed="${bmp.tilt.auto}">${escapeHTML(t.bmp_auto)}</button>
                <button type="button" class="bmp-gas ${bmp.tilt.auto ? 'is-brake' : ''}" id="bmp-gas">${escapeHTML(bmp.tilt.auto ? t.bmp_brake : t.bmp_gas)}</button>
                ${acts}
              </div>
            </div>
          </div>
          ${noTv}</div>`;
      }
      const host = state.youAreHost ? roomHostRow([[t.bmp_end_now, "roomAct('endNow', {})", 'ghost']]) : '';
      return `<div class="bmp" id="bmp-phone">
        ${bmpStatusHtml(state, false)}${noTv}
        <div class="bmp-pad" id="bmp-pad" style="--car:${color}" aria-label="${escapeHTML(t.bmp_stick)}">
          <div class="bmp-pad__ring"></div><div class="bmp-pad__knob" id="bmp-knob"></div>
        </div>
        ${acts}
        <div class="segmented bmp-modes" role="radiogroup">
          <button type="button" class="segmented__item is-active" onclick="bmpSetMode('stick')">${escapeHTML(t.bmp_stick)}</button>
          <button type="button" class="segmented__item" onclick="bmpSetMode('tilt')">${escapeHTML(t.bmp_tilt)}</button>
        </div>
        <p class="bmp-hint">${escapeHTML(bmpModeLine(st, t))}</p>
        ${host}${renderRoomPlayerStrip(state)}</div>`;
    });
    refreshRoomPlayerStrip(el, state);
    if (bmpIsBall(s)) bmpBallPhone(el, state);
    if (s.phase === 'play' && driver) bmpControllerOn(); else bmpControllerOff();
    bmpWirePad();
    bmpLandLayout();
    bmpPaintPhone();
  }
};

/** The phone's own car: the balloons, the score, the place - big. Filled in by bmpPaintPhone. */
function bmpStatusHtml(state, compact) {
  if (bmpIsBall(state.shared)) return bmpBandHtml(state, compact);
  const t = bmpT();
  const color = bmpColorOf(state, Room.me);
  return `<div class="bmp-status ${compact ? 'is-compact' : ''}" style="--car:${color}">
    <span class="bmp-status__car" aria-hidden="true"></span>
    <span class="bmp-status__main" data-bmp-main></span>
    <span class="bmp-status__place" data-bmp-place></span>
    <span class="bmp-status__chips">
      <span class="badge"><span aria-hidden="true">⏱️</span> <span class="metric" data-bmp-clock>${bmpClockText(bmpSecsLeft(state))}</span></span>
      <span class="badge" data-bmp-ping>${escapeHTML(t.bmp_ping)} <span class="metric">–</span></span>
    </span>
  </div>`;
}

function bmpSetMode(mode) {
  if (mode === bmp.mode) { if (mode === 'tilt') bmpTiltCentre(); return; }
  bmp.mode = mode;
  rememberOptions('bumper', { mode });
  bmp.stick = { x: 0, y: 0 };
  bmp.tilt.held = false;
  if (mode === 'tilt') bmpTiltAsk(); else bmpTiltStop();
  bmpLockLandscape(mode === 'tilt');
  if (Room.state) ROOM_GAMES.bumper.render(Room.state);
}

/* --- the stick --------------------------------------------------------------- */
function bmpWirePad() {
  const pad = document.getElementById('bmp-pad');
  if (pad && !pad.dataset.wired) {
    pad.dataset.wired = '1';
    let active = null;
    const move = (e) => {
      const r = pad.getBoundingClientRect();
      const rad = r.width / 2;
      let x = (e.clientX - (r.left + rad)) / (rad * 0.62);
      let y = (e.clientY - (r.top + rad)) / (rad * 0.62);
      const m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      bmp.stick = { x, y };
      const knob = document.getElementById('bmp-knob');
      if (knob) knob.style.transform = `translate(${x * rad * 0.62}px, ${y * rad * 0.62}px)`;
    };
    pad.addEventListener('pointerdown', (e) => {
      active = e.pointerId;
      try { pad.setPointerCapture(e.pointerId); } catch (err) {}
      pad.classList.add('is-held');
      move(e);
      bmpSendNow();
      e.preventDefault();
    });
    pad.addEventListener('pointermove', (e) => { if (e.pointerId === active) move(e); });
    const up = (e) => {
      if (e.pointerId !== active) return;
      active = null;
      pad.classList.remove('is-held');
      bmp.stick = { x: 0, y: 0 };
      const knob = document.getElementById('bmp-knob');
      if (knob) knob.style.transform = '';
      bmpSendNow();
    };
    pad.addEventListener('pointerup', up);
    pad.addEventListener('pointercancel', up);
  }
  const gas = document.getElementById('bmp-gas');
  if (gas && !gas.dataset.wired) {
    gas.dataset.wired = '1';
    const on = (e) => { if (!bmp.tilt.on) bmpTiltAsk(); bmp.tilt.held = true; gas.classList.add('is-held'); try { gas.setPointerCapture(e.pointerId); } catch (err) {} bmpSendNow(); e.preventDefault(); };
    const off = () => { bmp.tilt.held = false; gas.classList.remove('is-held'); bmpSendNow(); };
    gas.addEventListener('pointerdown', on);
    gas.addEventListener('pointerup', off);
    gas.addEventListener('pointercancel', off);
    // An iPhone asks for the sensor only inside a tap (the Gas button's first press, or the mode button).
    const O = window.DeviceOrientationEvent;
    if (!bmp.tilt.on && !(O && typeof O.requestPermission === 'function')) bmpTiltAsk();
  }
}

/* --- the tilt: the phone as a wheel -------------------------------------------- */
/**
 * The steer is the phone's roll: where gravity points in the plane of the
 * controller as the player holds it, worked out from the phone's orientation
 * (the down vector in the phone's own axes, rotated by the way the controller
 * is turned). It doesn't care how far the phone leans back, which reading beta
 * or gamma alone did (the owner, 28 Sep 2026: "the stick was more accurate").
 * Level is 0; 🎯 makes the way it is held now level, ↔ flips it. 28° from level
 * is full lock, with a small dead zone and a light smoothing.
 *
 * The tilt screen is always sideways (the owner: "force landscape even if the
 * phone is locked"): a phone's own rotation can't be forced on an iPhone, so
 * the controller is laid over the page and turned a quarter by CSS while the
 * page is upright - to whichever side the phone is really held - and not
 * turned when the page is sideways already. Android also gets the real lock
 * (fullscreen, then screen.orientation.lock), where it is allowed.
 */
const BMP_FULL_LOCK = 28, BMP_DEAD = 3;
function bmpScreenAngle() {
  const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle
    : (typeof window.orientation === 'number' ? window.orientation : 0);
  return a === 270 ? -90 : a;
}
/** The angle the controller is drawn at, as the phone's rotation: 90 or -90. */
function bmpLandTheta() {
  if (window.innerWidth >= window.innerHeight) return bmpScreenAngle() === -90 ? -90 : 90;
  return bmp.tilt.rot;
}
function bmpLandLayout() {
  const el = document.getElementById('bmp-land');
  if (!el) return;
  const W = window.innerWidth, H = window.innerHeight;
  if (W >= H) {
    el.style.width = W + 'px'; el.style.height = H + 'px';
    el.style.transform = 'translate(-50%, -50%)';
  } else {
    el.style.width = H + 'px'; el.style.height = W + 'px';
    el.style.transform = `translate(-50%, -50%) rotate(${bmp.tilt.rot}deg)`;
  }
}
window.addEventListener('resize', bmpLandLayout);
window.addEventListener('orientationchange', () => setTimeout(bmpLandLayout, 150));

function bmpTiltRead(e) {
  if (typeof e.beta !== 'number' || typeof e.gamma !== 'number') return;
  const r = Math.PI / 180, b = e.beta * r, g = e.gamma * r;
  // Down, in the phone's own axes (x to its right edge, y to its top).
  const gx = Math.cos(b) * Math.sin(g), gy = -Math.sin(b);
  // Upright page: turn the controller to the side the phone is really held.
  if (window.innerWidth < window.innerHeight) {
    const want = gx < -0.45 ? 90 : gx > 0.45 ? -90 : bmp.tilt.rot;
    if (want !== bmp.tilt.rot) { bmp.tilt.rot = want; bmpLandLayout(); }
  }
  const th = bmpLandTheta() * r;
  const sx = gx * Math.cos(th) - gy * Math.sin(th);
  const sy = gx * Math.sin(th) + gy * Math.cos(th);
  if (Math.hypot(sx, sy) < 0.25) return;        // lying flat: no roll to read
  const phi = Math.atan2(sx, -sy) / r;
  bmp.tilt.raw = phi;
  let d = phi - bmp.tilt.zero;
  d = ((d + 540) % 360) - 180;
  const m = Math.max(0, Math.abs(d) - BMP_DEAD) / (BMP_FULL_LOCK - BMP_DEAD);
  const want = Math.sign(d) * Math.min(1, m) * bmp.tilt.flip;
  bmp.tilt.s += (want - bmp.tilt.s) * 0.4;
  if (Math.abs(bmp.tilt.s) < 0.02) bmp.tilt.s = 0;
  const wheel = document.getElementById('bmp-wheel');
  if (wheel) wheel.style.transform = `rotate(${(bmp.tilt.s * 90).toFixed(1)}deg)`;
}
function bmpTiltAsk() {
  if (bmp.tilt.on || bmp.tilt.asking) return;
  const O = window.DeviceOrientationEvent;
  const asked = O && typeof O.requestPermission === 'function' ? O.requestPermission().catch(() => 'denied') : Promise.resolve('granted');
  bmp.tilt.asking = true;
  asked.then((ans) => {
    bmp.tilt.asking = false;
    if (ans !== 'granted' || !O) { showToast(bmpT().bmp_tilt_denied, 'error'); bmpSetMode('stick'); return; }
    bmp.tilt.granted = true;
    if (bmp.mode !== 'tilt' || bmp.tilt.on || appState.currentView !== 'room-bumper') return;
    bmp.tilt.on = true;
    window.addEventListener('deviceorientation', bmpTiltRead);
  });
}
function bmpTiltStop() {
  bmp.tilt.held = false;
  bmp.tilt.s = 0;
  if (!bmp.tilt.on) return;
  bmp.tilt.on = false;
  window.removeEventListener('deviceorientation', bmpTiltRead);
}
function bmpTiltCentre() { bmp.tilt.zero = bmp.tilt.raw; haptic('light'); }
function bmpTiltFlip() { bmp.tilt.flip = -bmp.tilt.flip; haptic('light'); }
/** Auto gas: on until tapped off; the big button is the brake meanwhile. */
function bmpToggleAuto() {
  bmp.tilt.auto = !bmp.tilt.auto;
  rememberOptions('bumper', { auto: bmp.tilt.auto });
  haptic('light');
  if (Room.state) ROOM_GAMES.bumper.render(Room.state);
  bmpSendNow();
}
/** The real lock where the phone allows it (Android, in fullscreen); nothing is lost where it doesn't. */
function bmpLockLandscape(on) {
  try {
    const de = document.documentElement;
    if (on) {
      if (!document.fullscreenElement && de.requestFullscreen && screen.orientation && screen.orientation.lock) {
        de.requestFullscreen({ navigationUI: 'hide' }).then(() => {
          bmp.locked = true;               // ours: only this is undone below (a TV's own ⛶ is left alone)
          return screen.orientation.lock('landscape');
        }).catch(() => {});
      }
    } else if (bmp.locked) {
      bmp.locked = false;
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    }
  } catch (e) {}
}

/* --- the boost and the horn ----------------------------------------------------- */
function bmpBoost() {
  const now = Date.now();
  if (now - bmp.boostAt < BMP_BOOST_MS) { haptic('light'); return; }
  bmp.boostAt = now;
  Room.sendLive({ k: 'b' });
  haptic('heavy');
  bmpPaintPhone();
}
let bmpHornAt = 0;
function bmpHorn() {
  const now = Date.now();
  if (now - bmpHornAt < 600) return;
  bmpHornAt = now;
  Room.sendLive({ k: 'hn' });
  haptic('light');
}

/* --- sending: the controller's beat ---------------------------------------------- */
function bmpInput() {
  if (bmp.mode === 'tilt') {
    // Auto gas: forward until tapped off, the big button braking; otherwise the button is the gas.
    const g = bmp.tilt.auto ? (bmp.tilt.held ? -100 : 100) : (bmp.tilt.held ? 100 : 0);
    return { k: 'i', s: Math.round(bmp.tilt.s * 50) * 2, g };
  }
  return { k: 'i', x: Math.round(bmp.stick.x * 20) * 5, y: Math.round(bmp.stick.y * 20) * 5 };
}
function bmpSendNow() {
  const d = bmpInput();
  const key = JSON.stringify(d);
  const now = Date.now();
  if (key === bmp.lastSent && now - bmp.lastSentAt < BMP_KEEP_MS) return;
  if (Room.sendLive(d)) { bmp.lastSent = key; bmp.lastSentAt = now; }
}
function bmpPing() {
  const n = ++bmp.ping.n;
  const at = Date.now();
  bmp.ping.sent[n] = at;
  delete bmp.ping.sent[n - 10];            // an echo that never came
  Room.sendLive({ k: 'p', n, at, r: bmp.ping.last === null ? -1 : bmp.ping.last });
}
function bmpControllerOn() {
  // Round 2 on: the round's end took the sensor away (bmpControllerOff). Once allowed, an iPhone
  // answers again without a tap; one that never allowed it still asks in the Gas button's tap.
  const O = window.DeviceOrientationEvent;
  if (bmp.mode === 'tilt' && !bmp.tilt.on && (bmp.tilt.granted || !(O && typeof O.requestPermission === 'function'))) bmpTiltAsk();
  if (!bmp.sendTimer) bmp.sendTimer = setInterval(bmpSendNow, BMP_SEND_MS);
  if (!bmp.pingTimer) { bmpPing(); bmp.pingTimer = setInterval(bmpPing, BMP_PING_MS); }
  if (!bmp.uiTimer) bmp.uiTimer = setInterval(bmpPaintPhone, 200);
  if (!bmp.wake) {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        bmp.wake = 'asking';
        navigator.wakeLock.request('screen').then(l => {
          if (bmp.wake !== 'asking') { try { l.release(); } catch (e) {} return; }   // switched off meanwhile
          bmp.wake = l;
          l.addEventListener('release', () => { if (bmp.wake === l) bmp.wake = null; });
        }).catch(() => { bmp.wake = null; });
      }
    } catch (e) {}
  }
}
function bmpControllerOff() {
  if (bmp.sendTimer) { clearInterval(bmp.sendTimer); bmp.sendTimer = null; }
  if (bmp.pingTimer) { clearInterval(bmp.pingTimer); bmp.pingTimer = null; }
  if (bmp.uiTimer) { clearInterval(bmp.uiTimer); bmp.uiTimer = null; }
  if (bmp.wake && bmp.wake !== 'asking') { try { bmp.wake.release(); } catch (e) {} }
  bmp.wake = null;
  bmpTiltStop();
  bmpLockLandscape(false);
  bmp.stick = { x: 0, y: 0 };
  bmp.lastSent = '';
}
// Runs on every game change in any game: undo only what bumper itself started.
onRoomClocksReset(() => {
  if (bmp.sendTimer || bmp.pingTimer || bmp.uiTimer || bmp.wake || bmp.tilt.on || bmp.locked) bmpControllerOff();
  if (bmp.tv) bmpTvStop(true);
});
onLeaveScreen((from) => { if (from === 'room-bumper') bmpControllerOff(); if (from === 'room-tv') bmpTvStop(true); });
// The browser lets go of a wake lock when the page is hidden: ask again on the way back.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && bmp.sendTimer && !bmp.wake && appState.currentView === 'room-bumper') bmpControllerOn();
});

/** The phone's car, the clock, the delay and the boost's ring, refreshed in place. */
function bmpPaintPhone() {
  const state = Room.state;
  if (!state || state.game !== 'bumper') return;
  const t = bmpT();
  const st = bmpSettings(state.shared);
  const clock = document.querySelector('[data-bmp-clock]');
  if (clock) clock.textContent = st.mode === 'ball' ? bmpBallClockText(state) : bmpClockText(bmpSecsLeft(state));
  if (st.mode === 'ball') bmpBandPaint(state);
  const ping = document.querySelector('[data-bmp-ping] .metric');
  if (ping) {
    const v = bmp.ping.last;
    ping.textContent = v === null ? '–' : v + ' ms';
    ping.parentElement.dataset.level = v === null ? '' : v < 80 ? 'good' : v < 150 ? 'ok' : 'bad';
  }
  const me = bmp.me;
  const main = document.querySelector('[data-bmp-main]');
  if (main) {
    const color = bmpColorOf(state, Room.me);
    let html;
    if (!me) html = `<span class="bmp-status__wait">${escapeHTML(t.bmp_look_tv)}</span>`;
    else if (st.mode === 'balloons') html = me.gh ? `<span class="bmp-status__ghost">👻 ${escapeHTML(t.bmp_ghost)}</span>` : bmpBalloonsHtml(me.l, color);
    else if (st.mode === 'ring' && st.ringWin === 'last') html = me.out ? `<span class="bmp-status__ghost">💦 ${escapeHTML(t.bmp_fell_out)}</span>`
      : `<span class="bmp-status__n metric">${me.sc}</span><span class="bmp-status__unit">${escapeHTML(t.bmp_pushes)}</span>`;
    else html = `<span class="bmp-status__n metric">${me.sc}</span><span class="bmp-status__unit">${escapeHTML(st.mode === 'ring' ? t.bmp_pushes : t.bmp_bumps)}</span>`;
    const key = html;
    if (main.dataset.k !== key) {
      const was = main.dataset.k;
      main.innerHTML = html;
      main.dataset.k = key;
      if (was && !motionOff()) { main.classList.remove('is-bump'); void main.offsetWidth; main.classList.add('is-bump'); }
    }
  }
  const place = document.querySelector('[data-bmp-place]');
  if (place) {
    const txt = me && me.pl ? bmpFill(t.bmp_place, { n: me.pl, of: me.of }) : '';
    if (place.textContent !== txt) place.textContent = txt;
    place.classList.toggle('is-first', !!(me && me.pl === 1));
  }
  const boost = document.getElementById('bmp-boost');
  if (boost) {
    const left = Math.max(0, BMP_BOOST_MS - (Date.now() - bmp.boostAt));
    boost.style.setProperty('--cd', (left / BMP_BOOST_MS).toFixed(3));
    boost.classList.toggle('is-cool', left > 0);
  }
  const phone = document.getElementById('bmp-phone');
  if (phone) phone.classList.toggle('is-hit', Date.now() < bmp.flashUntil);
}

/** What comes back from the TV: a ping's echo, a moment, the car's status. */
Room.onLive((d) => {
  if (!d || typeof d !== 'object') return;
  const state = Room.state;
  if (!state || state.game !== 'bumper') return;
  if (state.youAreScreen) { bmpTvHear(d); return; }
  if (d.to !== Room.me) return;
  if (d.k === 'p') {
    const at = bmp.ping.sent[d.n];
    if (!at) return;
    delete bmp.ping.sent[d.n];
    const list = bmp.ping.list;
    list.push(Math.round((Date.now() - at) / 2));
    if (list.length > 7) list.shift();
    bmp.ping.last = list.slice().sort((a, b) => a - b)[Math.floor(list.length / 2)];
    return;
  }
  if (d.k === 's') {
    bmp.me = { round: (state.shared || {}).round, l: d.l | 0, sc: d.sc | 0, pl: d.pl | 0, of: d.of | 0, gh: !!d.gh, out: !!d.out };
    bmpPaintPhone();
    return;
  }
  if (d.k === 'h') {
    if (d.w === 'got' || d.w === 'pop' || d.w === 'fell') {
      bmp.flashUntil = Date.now() + 350;
      bmpSnd(d.w === 'pop' ? 'pop' : 'got');
      try { if (navigator.vibrate) navigator.vibrate(d.w === 'fell' ? [80, 60, 80] : 90); } catch (e) {}
    } else {
      haptic('medium');
      bmpSnd('point');
      const phone = document.getElementById('bmp-phone');
      if (phone && !motionOff()) {
        const pop = document.createElement('div');
        pop.className = 'bmp-pop';
        pop.textContent = '+1';
        phone.appendChild(pop);
        setTimeout(() => pop.remove(), 900);
      }
    }
    bmpPaintPhone();
  }
});

/* --- the result (phone and TV) ------------------------------------------------ */
function bmpResultStat(r, st, t) {
  if (st.mode === 'balloons') return `${bmpBalloonsHtml(r.lives, 'var(--car)')} <span class="metric tx-muted">💥 ${r.score}</span>`;
  if (st.mode === 'ring') return `<span class="metric">⭕ ${r.score}</span> <span class="metric tx-muted">💦 ${r.taken}</span>`;
  return `<span class="metric">💥 ${r.score}</span> <span class="metric tx-muted">🤕 ${r.taken}</span>`;
}
function bmpOverHtml(state, s, t, tv) {
  const st = bmpSettings(s);
  const res = s.results || [];
  const podium = res.map(r => ({ id: r.id, name: r.name, score: Math.max(1, (res.length + 1) - r.place) }));
  const winners = res.filter(r => r.place === 1);
  const head = winners.length && res.length > 1 && s.reported
    ? `<div class="bmp-over__win">🏆 ${escapeHTML(bmpFill(winners.length > 1 ? t.bmp_winners : t.bmp_winner, { name: winners.map(r => r.name).join(appState.lang === 'ar' ? ' و' : ' & ') }))}</div>` : '';
  const medal = (p) => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : p;
  const rows = res.map(r => `
    <div class="bmp-row" style="--car:${bmpColorOf(state, r.id)}">
      <span class="bmp-row__place">${medal(r.place)}</span>
      <span class="bmp-row__dot"></span>
      <span class="bmp-row__name"><bdi>${escapeHTML(r.name)}</bdi>${r.bot ? ' 🤖' : ''}</span>
      <span class="bmp-row__stat">${bmpResultStat(r, st, t)}</span>
    </div>`).join('');
  const none = !s.reported ? `<p class="waiting-note">${escapeHTML(t.bmp_no_report)}</p>` : '';
  const host = !state.youAreHost ? '' : tv
    ? `<div class="tv-actions">${tvBtn('▶ ' + t.bmp_again, "roomAct('playAgain', {})")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>`
    : `<div class="btn-row" style="margin-top:var(--sp-3)"><button class="btn btn--go" onclick="roomAct('playAgain', {})">▶ ${escapeHTML(t.bmp_again)}</button><button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game)}</button></div>`;
  return `<div class="bmp-over">
    <div class="eyebrow bmp-over__eyebrow" style="text-align:center">${escapeHTML(t.bmp_over)} · ${escapeHTML(bmpModeName(st, t))}</div>
    ${head}<div class="bmp-over__podium">${s.reported ? renderPodium(state, podium) : ''}</div>
    <div class="card card--tight bmp-rows">${rows}</div>${none}${host}</div>`;
}

/* ============================================================================
   «كورة التصادم» (idea 254, the owner's rules of 2 Oct 2026; look أ «بث مباشر»)
   ----------------------------------------------------------------------------
   A fourth way to play, inside the same card: a big ball, two goals, red
   against blue. Everyone picks a side on their phone in the lobby (`side`);
   a computer player fills a side only when it is empty. The TV runs the ball
   like the cars (bmpBallStep, bmpBallHit), sends each goal to the server
   (`goal`, numbered so a resend counts once), and the server keeps the score
   and the clock: the side ahead at the whistle wins, a draw goes to a golden
   goal for a minute at most, then a draw (RoomBumper.js). Bumps push and score
   nothing; turbo as always; no items. Blue defends the left goal, red the
   right, and every score reads blue on the left, red on the right, as on the
   pitch, in both languages.
   ========================================================================= */

/*
 * Its styles come with it (2 Oct 2026): the shell is at its budget, and every class here is the
 * ball's own (nothing in Style.html restyles them), so the cascade can't change by where they
 * land. Put into the page once, as this chunk runs - before anything of the ball is drawn.
 * Blue on the left and red on the right everywhere, as on the pitch.
 */
const BMP_BALL_CSS = `.bmp-sides { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.bmp-side { --team: var(--team-blue); display: flex; flex-direction: column; gap: 0.2rem; min-height: var(--tap); padding: var(--sp-2) var(--sp-3); border-radius: 14px; border: 2px solid color-mix(in srgb, var(--team) 45%, transparent); background: color-mix(in srgb, var(--team) 10%, var(--surface-solid)); color: var(--text); text-align: center; }
.bmp-side--red { --team: var(--team-red); }
.bmp-side b { font: 800 1rem var(--font-display, inherit); }
.bmp-side span { font-size: var(--fs-sm); color: var(--text-2); }
.bmp-side.is-mine { background: var(--team); border-color: var(--team); color: #fff; }
.bmp-side.is-mine span { color: #fff; opacity: 0.9; }
.bmp-band { --team: var(--team-red); position: relative; overflow: hidden; display: flex; align-items: center; gap: var(--sp-3); width: min(100%, 24rem); padding: var(--sp-3) var(--sp-4); border-radius: 20px; color: #fff; background: linear-gradient(135deg, var(--team), color-mix(in srgb, var(--team) 62%, black)); }
.bmp-band--blue { --team: var(--team-blue); }

  // The server's word wins: its score (another screen, a reload) and its golden goal.
  const sv = s.goals || [];
  if (sv.length > g.goalsN) { g.goalsN = sv.length; g.score = { red: s.score.red, blue: s.score.blue }; }
  g.pend = g.pend.filter(p => p.n > sv.length);
  if (s.golden) g.golden = true;
  if (g.goal && now >= g.goal.at + BMP_GOAL_SHOW_MS) {
    g.goal = null;
    if (!g.over) { bmpBallKickoff(g, state); g.kickAt = now + BMP_KICK_MS; }
  }
  // The kick-off's count, and its whistle.
  if (g.kickAt && now < g.kickAt) {
    const n = Math.ceil((g.kickAt - now) / 1000);
    if (n !== g.cd) { g.cd = n; bmpTvSnd('beep'); }
  } else if (g.kickAt && g.cd !== 0) { g.cd = 0; bmpTvSnd('whistle'); }
  if (!g.over && now >= s.endsAt && !g.golden) {
    if (g.score.red === g.score.blue && !s.cut) { g.golden = true; g.goldenAt = now; bmpTvSnd('whistle'); }
    else { g.over = true; bmpTvSnd('end'); bmpEngineOff(); }
  }
  if (!g.over && g.golden && now >= s.endsAt + BMP_GOLDEN_MS) { g.over = true; bmpTvSnd('end'); bmpEngineOff(); }
  bmpBallSend(g, s);
}
/** A goal: the score, the server told (again until it says so), the band, the net, the crowd. */
function bmpBallGoal(g, state, side, now) {
  const s = state.shared || {};
  const by = g.ball.touch ? g.ball.touch.id : '';
  const car = by ? g.cars[by] : null;
  g.score[side]++;
  g.goalsN++;
  g.goal = { side, at: now, by, name: car ? car.name : '', own: !!car && car.side !== side, red: g.score.red, blue: g.score.blue };
  if (g.golden) g.over = true;                      // the golden goal ends it
  g.pend.push({ round: s.round, n: g.goalsN, side, by });
  g.net = { side: side === 'red' ? 'left' : 'right', t: performance.now() };
  bmpTvSnd('goal');
  bmpBallBanner(g, state);
  bmpBallSend(g, s);
}
function bmpBallSend(g, s) {
  if (g.sending || !g.pend.length || !g.lead) return;
  const p = g.pend[0];
  g.sending = true;
  Room.act('goal', p)
    .then(() => { g.sending = false; if (g.pend[0] === p) g.pend.shift(); })
    .catch(() => setTimeout(() => { g.sending = false; }, 1500));
}

/* --- the ball: heavier than air, lighter than a car ------------------------------ */
const BMP_BALL_MASS = 0.55;               // a car is 1
function bmpBallStep(g, dt, live, state, now) {
  const b = g.ball;
  const R = BMP_BALL_R, L = BMP_RAIL, mid = BMP_H / 2;
  const k = Math.exp(-0.6 * dt);
  b.vx *= k; b.vy *= k;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 1500) { b.vx *= 1500 / sp; b.vy *= 1500 / sp; }
  if (sp < 4) { b.vx = 0; b.vy = 0; }
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.spin = (b.spin || 0) + sp * dt / R;
  let thud = 0;
  const inMouth = Math.abs(b.y - mid) < BMP_GOAL_HALF;
  // The long rails.
  if (b.x > L && b.x < BMP_W - L) {
    if (b.y < L + R) { thud = Math.abs(b.vy); b.y = L + R; b.vy = Math.abs(b.vy) * 0.8; }
    if (b.y > BMP_H - L - R) { thud = Math.abs(b.vy); b.y = BMP_H - L - R; b.vy = -Math.abs(b.vy) * 0.8; }
  }
  // The short rails, but for the goal mouths.
  [[L, 1], [BMP_W - L, -1]].forEach(([line, dir]) => {
    const past = (b.x - line) * dir;                       // how far in front of the line, towards the pitch
    if (past >= R) return;
    if (!inMouth && past > -R) { thud = Math.abs(b.vx); b.x = line + R * dir; b.vx = Math.abs(b.vx) * 0.8 * dir; return; }
    if (past < 0) {
      // Inside the goal: the side netting and the back of the net take the pace off it.
      const side = BMP_GOAL_HALF - R;
      if (b.y < mid - side) { b.y = mid - side; b.vy = Math.abs(b.vy) * 0.3; }
      if (b.y > mid + side) { b.y = mid + side; b.vy = -Math.abs(b.vy) * 0.3; }
      const back = line - (BMP_GOAL_D - R) * dir;
      if ((b.x - back) * dir < 0) { b.x = back; b.vx = Math.abs(b.vx) * 0.25 * dir; }
    }
  });
  // The posts.
  [L, BMP_W - L].forEach(px => [mid - BMP_GOAL_HALF, mid + BMP_GOAL_HALF].forEach(py => {
    const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), min = R + 8;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d;
    b.x = px + nx * min; b.y = py + ny * min;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 1.8 * vn * nx; b.vy -= 1.8 * vn * ny; thud = Math.max(thud, -vn * 1.4); }
  }));
  if (live && thud > 200 && Date.now() - (g.wallAt || 0) > 90) { g.wallAt = Date.now(); bmpTvSnd('wall', thud / 900); }
  // Over the line, whole: blue's goal is on the left (red scores there), red's on the right.
  live = live && !g.goal && !g.over;                    // one goal a moment, even inside one frame's steps
  if (live && b.x + R < L) bmpBallGoal(g, state, 'red', now);
  else if (live && b.x - R > BMP_W - L) bmpBallGoal(g, state, 'blue', now);
}
/** A car meets the ball: the cars' knock (bmpTvCollide), with the ball the lighter. */
function bmpBallHit(g, c, wall) {
  const b = g.ball;
  if (c.fall || c.out) return;
  const dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy), min = BMP_R + BMP_BALL_R;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d, over = min - d;
  const m = BMP_BALL_MASS;
  c.x -= nx * over * m / (1 + m); c.y -= ny * over * m / (1 + m);
  b.x += nx * over / (1 + m); b.y += ny * over / (1 + m);
  b.touch = { id: c.id, at: wall };
  const vr = (b.vx - c.vx) * nx + (b.vy - c.vy) * ny;
  if (vr >= 0) return;
  const j = -(1 + 0.75) * vr / (1 + 1 / m);
  c.vx -= j * nx; c.vy -= j * ny;
  b.vx += (j / m + 30) * nx; b.vy += (j / m + 30) * ny;
  if (-vr > 140 && wall - (g.kickSndAt || 0) > 120) { g.kickSndAt = wall; bmpTvSnd('kick', -vr / 900); }
}

/* --- the computer players at the ball ------------------------------------------
   One of a side goes for the ball: round behind it on the line from the other
   goal, then through it towards that goal (hard leads the ball, turbos when it
   is lined up). The rest of a side hang back between the ball and their own goal
   (hard only; easy ones all chase, slower). */
function bmpBallBotInput(g, c, now) {
  const hard = c.bot === 'hard';
  const b = g.ball;
  const ai = c.ai || (c.ai = { slowSince: 0, unstick: 0, ux: 0, uy: 0 });
  const opp = c.side === 'red' ? { x: 0, y: BMP_H / 2 } : { x: BMP_W, y: BMP_H / 2 };
  const own = c.side === 'red' ? { x: BMP_W, y: BMP_H / 2 } : { x: 0, y: BMP_H / 2 };
  const lead = hard ? 0.3 : 0.08;
  const bx = b.x + b.vx * lead, by = b.y + b.vy * lead;
  const mates = Object.values(g.cars).filter(o => o.side === c.side && !o.fall);
  const near = mates.slice().sort((p, q) => Math.hypot(p.x - bx, p.y - by) - Math.hypot(q.x - bx, q.y - by))[0];
  let tx, ty, push = false;
  if (hard && near !== c) {
    // Hang back: on the line from our goal to the ball, a third of the way out.
    tx = own.x + (bx - own.x) * 0.35; ty = own.y + (by - own.y) * 0.35;
  } else {
    let ux = bx - opp.x, uy = by - opp.y;
    const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;          // from their goal through the ball
    const back = BMP_R + BMP_BALL_R + 30;
    const proj = (c.x - bx) * ux + (c.y - by) * uy;                  // > 0: on our side of the ball
    if (proj < 10) {
      // Wrong side of the ball: round it, on whichever side the car is.
      const px = -uy, py = ux;
      const sgn = ((c.x - bx) * px + (c.y - by) * py) >= 0 ? 1 : -1;
      tx = bx + ux * 130 + px * sgn * 150; ty = by + uy * 130 + py * sgn * 150;
    } else {
      const off = Math.abs((c.x - bx) * -uy + (c.y - by) * ux);      // how far off the line
      if (off < 55 || Math.hypot(c.x - (bx + ux * back), c.y - (by + uy * back)) < 70) { tx = bx - ux * 220; ty = by - uy * 220; push = true; }
      else { tx = bx + ux * back; ty = by + uy * back; }
    }
  }
  tx = Math.max(70, Math.min(BMP_W - 70, tx)); ty = Math.max(70, Math.min(BMP_H - 70, ty));
  let dx = tx - c.x, dy = ty - c.y;
  const dl = Math.hypot(dx, dy);
  if (dl < 25 && !push) return { k: 'i', x: 0, y: 0 };
  dx /= dl || 1; dy /= dl || 1;
  // Stuck against a rail or a car: a moment of driving somewhere else.
  const speed = Math.hypot(c.vx, c.vy);
  if (speed < 40 && dl > 60) { if (!ai.slowSince) ai.slowSince = now; } else ai.slowSince = 0;
  if (ai.slowSince && now - ai.slowSince > 1200) {
    ai.slowSince = 0; ai.unstick = now + 600;
    const a = Math.random() * Math.PI * 2; ai.ux = Math.cos(a); ai.uy = Math.sin(a);
  }
  if (now < ai.unstick) { dx = ai.ux; dy = ai.uy; }
  const mag = hard ? 1 : 0.62;
  if (push && hard && now - c.boostAt > BMP_BOOST_MS && Math.hypot(c.x - b.x, c.y - b.y) < 260 &&
      (Math.cos(c.h) * dx + Math.sin(c.h) * dy) > 0.93) bmpTvBoost(c);
  if (Math.random() < (hard ? 0.0006 : 0.001)) bmpTvHorn(c);
  return { k: 'i', x: Math.round(dx * mag * 100), y: Math.round(dy * mag * 100) };
}

/* --- the pitch, drawn once for both views ------------------------------------------ */
/** The turf, the halves' tints, the lines (the sim's units: 1600 × 900, the rail's inner face at 18). */
function bmpPitchPaint(c, W, H) {
  const k = W / BMP_W;
  c.save();
  c.scale(k, H / BMP_H);
  for (let i = 0; i < 16; i++) { c.fillStyle = i % 2 ? '#2f9e58' : '#28914f'; c.fillRect(i * 100, 0, 100, BMP_H); }
  c.fillStyle = 'rgba(37,99,235,0.08)'; c.fillRect(0, 0, BMP_W / 2, BMP_H);
  c.fillStyle = 'rgba(225,29,72,0.08)'; c.fillRect(BMP_W / 2, 0, BMP_W / 2, BMP_H);
  c.strokeStyle = 'rgba(255,255,255,0.78)'; c.lineWidth = 6;
  c.strokeRect(40, 40, BMP_W - 80, BMP_H - 80);
  c.beginPath(); c.moveTo(BMP_W / 2, 40); c.lineTo(BMP_W / 2, BMP_H - 40); c.stroke();
  c.beginPath(); c.arc(BMP_W / 2, BMP_H / 2, 120, 0, Math.PI * 2); c.stroke();
  c.fillStyle = 'rgba(255,255,255,0.85)';
  c.beginPath(); c.arc(BMP_W / 2, BMP_H / 2, 9, 0, Math.PI * 2); c.fill();
  [[40, 1], [BMP_W - 40, -1]].forEach(([x, d]) => {
    c.strokeRect(Math.min(x, x + 220 * d), BMP_H / 2 - 240, 220, 480);
    c.strokeRect(Math.min(x, x + 90 * d), BMP_H / 2 - 160, 90, 320);
    c.beginPath(); c.arc(x + 220 * d, BMP_H / 2, 80, d > 0 ? -Math.PI / 2 : Math.PI / 2, d > 0 ? Math.PI / 2 : Math.PI * 1.5); c.stroke();
    c.beginPath(); c.arc(x + 160 * d, BMP_H / 2, 7, 0, Math.PI * 2); c.fill();
  });
  c.restore();
}
/** A football's skin for the 3D ball: white, with dark patches spread over the sphere. */
function bmpBallSkin(c, w, h) {
  c.fillStyle = '#f8f8f8'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#1b1726';
  const spots = [[0.5, 0.5], [0, 0.5], [1, 0.5], [0.25, 0.22], [0.75, 0.22], [0.25, 0.78], [0.75, 0.78], [0.5, 0.06], [0.5, 0.94], [0, 0.1], [1, 0.1], [0, 0.9], [1, 0.9]];
  spots.forEach(([u, v]) => {
    const x = u * w, y = v * h, r = h * 0.09;
    c.beginPath();
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; c.lineTo(x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r); }
    c.closePath(); c.fill();
  });
}
/** The flat pitch: the turf, the goals with their nets in the defending side's colour, the ball. */
function bmpBallFlatDraw(ctx, g) {
  bmpPitchPaint(ctx, BMP_W, BMP_H);
  const mid = BMP_H / 2;
  [[BMP_RAIL, -1, BMP_TEAM.blue], [BMP_W - BMP_RAIL, 1, BMP_TEAM.red]].forEach(([x, d, col]) => {
    const x0 = Math.min(x, x + BMP_GOAL_D * d);
    ctx.fillStyle = '#226f40'; ctx.fillRect(x0, mid - BMP_GOAL_HALF, BMP_GOAL_D, BMP_GOAL_HALF * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
    for (let i = -BMP_GOAL_HALF; i <= BMP_GOAL_HALF; i += 22) { ctx.beginPath(); ctx.moveTo(x0, mid + i); ctx.lineTo(x0 + BMP_GOAL_D, mid + i); ctx.stroke(); }
    ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x, mid - BMP_GOAL_HALF); ctx.lineTo(x + BMP_GOAL_D * d, mid - BMP_GOAL_HALF);
    ctx.lineTo(x + BMP_GOAL_D * d, mid + BMP_GOAL_HALF); ctx.lineTo(x, mid + BMP_GOAL_HALF); ctx.stroke();
  });
}
function bmpBallFlatBall(ctx, g) {
  const b = g.ball;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(8, 10, BMP_BALL_R, BMP_BALL_R * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(b.spin || 0);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1b1726'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, BMP_BALL_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1b1726';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17); }
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 4;
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 17, Math.sin(a) * 17); ctx.lineTo(Math.cos(a) * BMP_BALL_R, Math.sin(a) * BMP_BALL_R); ctx.stroke(); }
  ctx.restore();
}

/* --- the sound ------------------------------------------------------------------
   The TV is the rink's voice: the countdown, the start horn, an engine that
   follows how fast the cars go, every crash by how hard it was, a balloon's
   pop, a fall off the ring, each car's own horn, a chime for a point, the last
   five seconds and the end. A phone plays only its own moments (an iPhone
   can't buzz). A TV whose browser keeps the sound asleep shows
   «🔊 اضغط هنا عشان الصوت». */
function bmpSnd(kind, v) {
  try {
    const ctx = fxCtx();
    if (ctx.state !== 'running') return;
    const at = ctx.currentTime + 0.01;
    const k = Math.max(0, Math.min(1, v === undefined ? 1 : v));
    if (kind === 'beep') fxTone('square', [[0, 660]], [[0, 0.0001], [0.01, 0.16], [0.2, 0.0001]], at);
    else if (kind === 'tick') fxTone('square', [[0, 1040]], [[0, 0.0001], [0.005, 0.1], [0.09, 0.0001]], at);
    else if (kind === 'go') {
      fxTone('sawtooth', [[0, 440], [0.6, 440]], [[0, 0.0001], [0.02, 0.16], [0.55, 0.12], [0.75, 0.0001]], at);
      fxTone('square', [[0, 880], [0.6, 880]], [[0, 0.0001], [0.02, 0.07], [0.7, 0.0001]], at);
    } else if (kind === 'bump') {
      fxNoise('bandpass', 1100, 0.8, [[0, 0.0001], [0.004, 0.25 + 0.45 * k], [0.22, 0.0001]], at);
      fxTone('sine', [[0, 150], [0.18, 55]], [[0, 0.0001], [0.01, 0.25 + 0.45 * k], [0.28, 0.0001]], at);
      fxTone('triangle', [[0, 380], [0.1, 720], [0.26, 330]], [[0, 0.0001], [0.02, 0.1 + 0.08 * k], [0.32, 0.0001]], at + 0.03);
    } else if (kind === 'wall') fxNoise('lowpass', 380, 0.7, [[0, 0.0001], [0.005, 0.12 + 0.3 * k], [0.14, 0.0001]], at);
    else if (kind === 'point') {
      fxTone('sine', [[0, 988]], [[0, 0.0001], [0.01, 0.16], [0.12, 0.0001]], at);
      fxTone('sine', [[0, 1319]], [[0, 0.0001], [0.01, 0.16], [0.3, 0.0001]], at + 0.09);
    } else if (kind === 'got') {
      fxNoise('lowpass', 500, 0.8, [[0, 0.0001], [0.004, 0.45], [0.18, 0.0001]], at);
      fxTone('sine', [[0, 120], [0.15, 60]], [[0, 0.0001], [0.01, 0.4], [0.22, 0.0001]], at);
    } else if (kind === 'pop') {
      fxNoise('highpass', 1800, 0.7, [[0, 0.0001], [0.002, 0.6], [0.06, 0.0001]], at);
      fxTone('sine', [[0, 900], [0.08, 300]], [[0, 0.0001], [0.005, 0.2], [0.1, 0.0001]], at);
    } else if (kind === 'fall') {
      fxTone('sine', [[0, 700], [0.7, 140]], [[0, 0.0001], [0.03, 0.16], [0.7, 0.0001]], at);
      fxNoise('lowpass', 260, 0.6, [[0, 0.0001], [0.72, 0.0001], [0.75, 0.4], [1.0, 0.0001]], at);
    } else if (kind === 'boost') {
      fxNoise('bandpass', 700, 1.2, [[0, 0.0001], [0.04, 0.25], [0.5, 0.0001]], at);
      fxTone('sawtooth', [[0, 110], [0.4, 260]], [[0, 0.0001], [0.03, 0.08], [0.45, 0.0001]], at);
    } else if (kind === 'horn') {
      // A car's own horn: two notes a fifth apart, pitched by its colour.
      const base = 330 * Math.pow(1.12, v || 0);
      fxTone('square', [[0, base]], [[0, 0.0001], [0.02, 0.09], [0.32, 0.08], [0.38, 0.0001]], at);
      fxTone('square', [[0, base * 1.5]], [[0, 0.0001], [0.02, 0.07], [0.32, 0.06], [0.38, 0.0001]], at);
    } else if (kind === 'kick') {
      // The ball: a thump, its weight in the low note.
      fxTone('sine', [[0, 210], [0.12, 70]], [[0, 0.0001], [0.006, 0.2 + 0.3 * k], [0.18, 0.0001]], at);
      fxNoise('lowpass', 700, 0.7, [[0, 0.0001], [0.003, 0.12 + 0.2 * k], [0.08, 0.0001]], at);
    } else if (kind === 'whistle') {
      fxTone('sine', [[0, 2900], [0.05, 3050], [0.1, 2900], [0.15, 3050], [0.2, 2900], [0.32, 3000]], [[0, 0.0001], [0.02, 0.12], [0.3, 0.1], [0.36, 0.0001]], at);
    } else if (kind === 'goal') {
      // The stands: a roar that swells and settles, and the horns.
      fxNoise('bandpass', 900, 0.45, [[0, 0.0001], [0.35, 0.32], [1.4, 0.24], [2.4, 0.0001]], at);
      fxNoise('bandpass', 2400, 0.8, [[0, 0.0001], [0.3, 0.1], [1.6, 0.0001]], at);
      [523, 659, 784].forEach((f, i) => fxTone('sawtooth', [[0, f]], [[0, 0.0001], [0.03, 0.06], [0.7, 0.05], [0.9, 0.0001]], at + 0.15 + i * 0.12));
    } else if (kind === 'end') {
      fxTone('sawtooth', [[0, 523], [0.35, 523], [0.36, 392], [1.0, 392]], [[0, 0.0001], [0.02, 0.16], [0.95, 0.12], [1.15, 0.0001]], at);
    }
  } catch (e) {}
}

/**
 * Two screens in a room both run the rink, but only one is its voice and
 * talks to the phones: the lead, the first online screen by id (the same one
 * that reports the result, bmpTvReport). The others only draw.
 */
function bmpIsLead(state) {
  const screens = ((state && state.screens) || []).filter(x => x.online).map(x => x.id).sort();
  return screens[0] === Room.me;
}
function bmpTvSnd(kind, v) { if (bmp.tv && bmp.tv.lead) bmpSnd(kind, v); }
function bmpTvSend(d) { return bmp.tv && bmp.tv.lead ? Room.sendLive(d) : false; }

/** The engine: one low buzz for the rink, its pitch and loudness following the cars' speed. */
function bmpEngine(speed) {
  const g = bmp.tv;
  if (!g) return;
  if (!g.lead) { bmpEngineOff(); return; }
  let ctx;
  try { ctx = fxCtx(); } catch (e) { return; }
  if (ctx.state !== 'running') return;
  let e = g.eng;
  // A context wakeAudio replaced: the engine is built again on the new one (the old one's nodes let go).
  if (e && e.ctx !== ctx) { try { e.o1.stop(); e.o2.stop(); } catch (err) {} e = g.eng = null; }
  if (!e) {
    try {
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), gain = ctx.createGain();
      o1.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 7;
      f.type = 'lowpass'; f.frequency.value = 520;
      gain.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(gain); gain.connect(ctx.destination);
      o1.start(); o2.start();
      e = g.eng = { ctx, o1, o2, gain };

/* --- the TV: the rink ----------------------------------------------------------- */
/**
 * «كورة التصادم»: the match ends on the server the moment a golden goal (or the
 * whistle) comes in, and the TV holds the pitch until «جوووول!» has had its
 * moment. Decided in the signature, before the frame, so the two agree.

function bmpBallHold(state) {
  const s = state.shared || {};
  const g = bmp.tv;
  if (!bmpIsBall(s) || s.phase !== 'over' || !g || !g.goal || g.key !== roomDealKey(state, s.round)) return false;
  const left = g.goal.at + BMP_GOAL_SHOW_MS - bmpServerNow();
  if (left <= 0) return false;
  if (!g.holdTimer) g.holdTimer = setTimeout(() => {
    g.holdTimer = null;
    if (Room.state && Room.state.youAreScreen && onRoomView()) routeRoomState(Room.state);
  }, left + 50);
  return true;
}
TV_GAMES.bumper = {
  sig(state) {
    const s = state.shared || {};
    const hold = bmpBallHold(state);
    const phase = hold ? 'play' : s.phase;
    return ['bmp', s.round, phase, phase === 'over' ? JSON.stringify(s.results) : '', state.youAreHost, appState.lang,
      phase === 'play' ? bmpIsLead(state) : ''].join('|');
  },
  frame(state, t) {
    const s = state.shared || {};
    const hold = bmpBallHold(state);
    if (s.phase === 'over' && !hold && bmpIsBall(s)) return `<div class="bmp-tv bmp-tv--over tv-scale">${bmpBallOverHtml(state, s, t, true)}</div>`;
    if (s.phase === 'over' && !hold) return `<div class="bmp-tv bmp-tv--over tv-scale">${bmpOverHtml(state, s, t, true)}</div>`;
    // A second screen in the room: the rink runs on the lead one only (bmpIsLead), so two
    // screens never play two different games; this one says where it is (the review of 1 Oct 2026).
    if (!bmpIsLead(state)) {
      const host = state.youAreHost ? `<div class="tv-actions">${tvBtn(t.bmp_end_now, "roomAct('endNow', {})", 'ghost')}</div>` : '';
      return `<div class="bmp-tv bmp-tv--other tv-scale"><div class="waiting-note">📺 ${escapeHTML(t.bmp_tv_other)}</div>${host}</div>`;
    }
    if (bmpIsBall(s)) return bmpBallTvFrame(state, t);
    const st = bmpSettings(s);
    const host = state.youAreHost ? `<div class="tv-actions">${tvBtn(t.bmp_end_now, "roomAct('endNow', {})", 'ghost')}</div>` : '';
    return `<div class="bmp-tv">
      <div class="bmp-tv__stage" id="bmp-stage"></div>
      <div class="bmp-tv__side">
        <div class="bmp-tv__mode">${escapeHTML(bmpModeName(st, t))}</div>
        <div class="bmp-tv__clock metric" data-bmp-tvclock>–</div>
        <button type="button" class="btn btn--primary btn--auto bmp-sound hidden" id="bmp-sound" onclick="setTimeout(() => bmpSnd('beep'), 150)">${escapeHTML(t.bmp_sound_tap)}</button>
        <div class="bmp-table" id="bmp-table"></div>
        <div class="bmp-stats" id="bmp-stats"></div>
        <button type="button" class="btn btn--ghost btn--xs btn--auto bmp-stats-btn" onclick="bmpToggleStats()">📶 ${escapeHTML(t.bmp_stats)}</button>
        ${host}
      </div>
    </div>`;
  },
  after(state, rebuilt) {
    bmpNoteTime(state);
    const s = state.shared || {};
    if (bmpBallHold(state)) return;                                  // the golden goal's moment plays on
    if (s.phase === 'over' && bmpIsBall(s)) bmpBallOverAfter(document.getElementById('view-room-tv'), state);
    if (s.phase !== 'play' || !bmpIsLead(state)) { bmpTvStop(true); return; }
    bmpTvStart(state, rebuilt);
  }
};

function bmpToggleStats() {
  bmp.stats = !bmp.stats;
  rememberOptions('bumper', { stats: bmp.stats });
  if (bmp.tv && Room.state) bmpTvPanel(Room.state);
}

function bmpTvStart(state, rebuilt) {
  const s = state.shared || {};
  const key = roomDealKey(state, s.round);
  if (!bmp.tv || bmp.tv.key !== key) {
    bmpTvStop(true);
    bmp.tv = { key, round: s.round, st: bmpSettings(s), cars: {}, sparks: [], pops: [], pairs: {}, sndPairs: {}, reported: false,
      msgs: [], sent: [], raf: 0, tick: null, last: 0, uiAt: 0, statusAt: 0, snd: { cd: null, go: false, tick: null, end: false },
      wallAt: 0, elim: 0, view: null, done: false, lead: false };

  if (!g.raf) { g.last = performance.now(); g.raf = requestAnimationFrame(bmpTvFrame); }
  // A page in the background draws no frames: the result still goes in when the round ends.
  if (!g.tick) g.tick = setInterval(() => {
    const st = Room.state;
    if (bmp.tv !== g || !st || st.game !== 'bumper' || !st.youAreScreen || (st.shared || {}).phase !== 'play') return;
    bmpTvSave(g);
    if (g.ball) { bmpBallTick(g, st, bmpServerNow()); return; }      // the ball's score is the server's: no report
    if ((bmpServerNow() >= st.shared.endsAt || g.done) && !g.reported) bmpTvReport(st);

}
/*
 * The rink across a reload: the lead screen keeps the cars, the scores and the balloons in
 * sessionStorage (this tab only) every second, keyed on the deal and the round, and a reload
 * into the same round picks them up (the review of 1 Oct 2026: a reload used to start the
 * round over, everyone back on their spot with nothing scored).
 */
const BMP_TV_SAVE = 'ashryBmpTv';
const BMP_CAR_KEEP = ['id', 'name', 'bot', 'side', 'x', 'y', 'vx', 'vy', 'h', 'hits', 'taken', 'lives', 'ghost', 'out', 'fall',
  'safeUntil', 'boostAt', 'lastTouch', 'elimAt'];
function bmpTvSave(g) {
  if (!g || !g.lead) return;
  const cars = {};
  Object.values(g.cars).forEach((c) => { const o = {}; BMP_CAR_KEEP.forEach((k) => { o[k] = c[k]; }); cars[c.id] = o; });
  const ball = g.ball ? { ball: g.ball, score: g.score, goalsN: g.goalsN, pend: g.pend, goal: g.goal, kickAt: g.kickAt, golden: g.golden, over: g.over } : null;
  try { sessionStorage.setItem(BMP_TV_SAVE, JSON.stringify({ key: g.key, cars, elim: g.elim, done: g.done, doneAt: g.doneAt || 0, ball })); } catch (e) {}
}

  if (!saved || saved.key !== g.key || !saved.cars) return;
  Object.values(saved.cars).forEach((o) => {
    if (!o || !o.id) return;
    g.cars[o.id] = Object.assign({ input: null, inAt: 0, hits: 0, taken: 0, lives: BMP_LIVES, ghost: false, out: false, fall: null,
      safeUntil: 0, boostAt: 0, boostFx: 0, hornAt: 0, hornFx: 0, lastTouch: null, elimAt: 0, ping: null, flash: 0, rate: [], ai: null, sent: '' }, o);
  });
  g.elim = saved.elim || 0;
  g.done = !!saved.done;
  if (saved.doneAt) g.doneAt = saved.doneAt;
  // «كورة التصادم»: the ball where it was, the goals still on their way to the server, the moment it was in.
  const b = saved.ball;
  if (g.ball && b && b.ball && (b.goalsN || 0) >= g.goalsN) {
    Object.assign(g.ball, b.ball);
    g.score = b.score || g.score; g.goalsN = b.goalsN || 0; g.pend = b.pend || [];
    g.goal = b.goal || null; g.kickAt = b.kickAt || 0; g.golden = !!b.golden || g.golden; g.over = !!b.over;

/* --- the cars: people, latecomers and computer players --------------------------- */
function bmpTvSyncCars(state) {
  const g = bmp.tv;
  const s = state.shared || {};
  if (g.ball) { bmpBallSyncCars(g, state); return; }
  const botsDealt = s.bots || {};
  const drivers = (state.players || []).filter(p => !p.bot || botsDealt[p.id]);
  const ids = drivers.map(p => p.id);
  Object.keys(g.cars).forEach(id => { if (ids.indexOf(id) === -1) { if (g.view) g.view.remove(id); delete g.cars[id]; } });
  drivers.forEach((p) => {
    if (g.cars[p.id]) { g.cars[p.id].name = p.name; return; }
    const k = Object.keys(g.cars).length;
    const n = Math.max(ids.length, 2);
    const a = (k / n) * Math.PI * 2 + 0.3;
    const ring = g.st.mode === 'ring';
    const rx = ring ? BMP_RING_R * 0.62 : BMP_W * 0.33, ry = ring ? BMP_RING_R * 0.62 : BMP_H * 0.3;
    const x = BMP_W / 2 + Math.cos(a) * rx;
    const y = BMP_H / 2 + Math.sin(a) * ry;
    g.cars[p.id] = { id: p.id, name: p.name, bot: p.bot || null, x, y, vx: 0, vy: 0, h: Math.atan2(BMP_H / 2 - y, BMP_W / 2 - x),
      input: null, inAt: 0, hits: 0, taken: 0, lives: BMP_LIVES, ghost: false, out: false, fall: null, safeUntil: 0,
      boostAt: 0, boostFx: 0, hornAt: 0, hornFx: 0, lastTouch: null, elimAt: 0, ping: null, flash: 0, rate: [], ai: null, sent: '' };
  });
}

/** A message from a phone. */
function bmpTvHear(d) {
  const g = bmp.tv;
  if (!g || !d.from) return;
  const now = Date.now();
  g.msgs.push(now);
  const car = g.cars[d.from];
  if (d.k === 'p') {
    bmpTvSend({ k: 'p', to: d.from, n: d.n, at: d.at });
    g.sent.push(now);
    if (car && typeof d.r === 'number' && d.r >= 0) car.ping = d.r;
    return;
  }
  if (!car) return;
  if (d.k === 'i') { car.input = d; car.inAt = now; car.rate.push(now); return; }
  if (d.k === 'b') { bmpTvBoost(car); return; }
  if (d.k === 'hn') bmpTvHorn(car);
}
function bmpTvRunning(s) {
  const now = bmpServerNow();
  if (bmp.tv.ball) return bmpBallLive(bmp.tv, s, now);
  return now >= s.startAt && now < s.endsAt && !bmp.tv.done;
}
function bmpTvBoost(car) {
  const s = (Room.state && Room.state.shared) || {};
  const now = Date.now();
  if (!bmpTvRunning(s) || car.fall || car.out || now - car.boostAt < BMP_BOOST_MS - 200) return;
  car.boostAt = now;
  car.boostFx = now;
  car.vx += Math.cos(car.h) * 560;
  car.vy += Math.sin(car.h) * 560;
  bmpTvSnd('boost');
}
function bmpTvHorn(car) {
  const now = Date.now();
  if (now - car.hornAt < 600) return;
  car.hornAt = now;
  car.hornFx = now;
  bmpTvSnd('horn', bmpColorIndex(Room.state, car.id));
}

/* --- the computer players --------------------------------------------------------
   Driven on the TV like a stick: a target now and then (easy: anyone, or a
   wander; hard: the one worth hitting - the leader, the one with most balloons,
   the one nearest the edge of the ring), aimed at where it is going (hard leads
   it), keeping off the ring's edge, and the boost when the target is close
   ahead (hard) or now and then (easy). */
function bmpBotInput(g, c, now, alive) {
  const hard = c.bot === 'hard';
  const st = g.st;
  const pool = alive || Object.values(g.cars).filter(o => !o.fall && !o.out && !(st.mode === 'balloons' && o.ghost));
  const others = pool.filter(o => o !== c);
  const ai = c.ai || (c.ai = { target: null, until: 0, wander: null, slowSince: 0 });
  if (now > ai.until || (ai.target && (!g.cars[ai.target] || g.cars[ai.target].fall || g.cars[ai.target].out))) {
    ai.until = now + (hard ? 1200 : 2000) + Math.random() * 1200;
    ai.wander = null;
    if (!others.length || (!hard && Math.random() < 0.25)) {
      ai.target = null;
      ai.wander = { x: BMP_W / 2 + (Math.random() - 0.5) * 900, y: BMP_H / 2 + (Math.random() - 0.5) * 500 };
    } else if (hard) {
      const worth = (o) => {
        const d = Math.hypot(o.x - c.x, o.y - c.y);
        let v = -d / 400;
        if (st.mode === 'balloons') v += o.lives * 0.6;
        if (st.mode === 'points') v += o.hits * 0.15;
        if (st.mode === 'ring') v += Math.hypot(o.x - BMP_W / 2, o.y - BMP_H / 2) / BMP_RING_R * 2.5;
        return v;
      };
      ai.target = others.slice().sort((a, b) => worth(b) - worth(a))[0].id;
    } else {
      ai.target = others[Math.floor(Math.random() * others.length)].id;
    }
  }
  let tx, ty;
  const tg = ai.target && g.cars[ai.target];
  if (tg) {
    const lead = hard ? 0.35 : 0;
    tx = tg.x + tg.vx * lead; ty = tg.y + tg.vy * lead;
  } else if (ai.wander) { tx = ai.wander.x; ty = ai.wander.y; } else { tx = BMP_W / 2; ty = BMP_H / 2; }
  let dx = tx - c.x, dy = ty - c.y;
  const dl = Math.hypot(dx, dy) || 1;
  dx /= dl; dy /= dl;
  if (st.mode === 'ring') {
    const cx = BMP_W / 2 - c.x, cy = BMP_H / 2 - c.y, cd = Math.hypot(cx, cy) || 1;
    const edge = cd / BMP_RING_R;
    const care = hard ? 0.72 : 0.84;
    if (edge > care) {
      const w = Math.min(1, (edge - care) / (1 - care)) * (hard ? 1.6 : 1.1);
      dx = dx * (1 - w) + (cx / cd) * w * 1.3; dy = dy * (1 - w) + (cy / cd) * w * 1.3;
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;

  const speed = Math.hypot(c.vx, c.vy);
  if (speed < 40) { if (!ai.slowSince) ai.slowSince = now; } else ai.slowSince = 0;
  if (ai.slowSince && now - ai.slowSince > 1200) { ai.until = 0; ai.slowSince = 0; }
  const mag = hard ? 1 : 0.62;
  if (now - c.boostAt > BMP_BOOST_MS) {
    const ahead = tg && dl < 300 && (Math.cos(c.h) * dx + Math.sin(c.h) * dy) > 0.9;
    if ((hard && ahead) || (!hard && Math.random() < 0.004)) bmpTvBoost(c);

/* --- the loop ------------------------------------------------------------------ */
function bmpTvFrame(ts) {
  const g = bmp.tv;
  if (!g) return;
  g.raf = requestAnimationFrame(bmpTvFrame);
  const state = Room.state;
  if (!state || state.game !== 'bumper' || !state.youAreScreen) { bmpTvStop(true); return; }
  const s = state.shared || {};
  if (s.phase !== 'play' && !bmpBallHold(state)) return;
  bmpTvSyncCars(state);
  let dt = Math.min(0.05, (ts - g.last) / 1000);
  g.last = ts;
  const now = bmpServerNow();
  if (g.ball) bmpBallTick(g, state, now);
  const running = g.ball ? bmpBallLive(g, s, now) : now >= s.startAt && now < s.endsAt && !g.done;
  // Fixed steps, so a slow frame doesn't let cars pass through each other.
  while (dt > 0) {
    const step = Math.min(dt, 1 / 120);
    bmpTvStep(step, running, state, now);
    dt -= step;
  }
  g.sparks = g.sparks.filter(p => (p.t -= 1 / 60) > 0);
  g.pops = g.pops.filter(p => (p.t -= 1 / 60) > 0);
  bmpTvCheckDone(state);
  bmpTvSounds(s, now, running);
  if (!g.ball && (now >= s.endsAt || g.done) && !g.reported) bmpTvReport(state);
  if (g.view) g.view.draw(state, now);
  if (ts - g.uiAt > 250) { g.uiAt = ts; if (g.ball) bmpBallPanel(state); else bmpTvPanel(state); }
  if (!g.ball && ts - g.statusAt > 450) { g.statusAt = ts; bmpTvStatus(state); }
}

/** Balloons and «آخر واحد»: one car left ends the round (a moment later, so the pop is seen). */
function bmpTvCheckDone(state) {
  const g = bmp.tv;
  if (g.done || !bmpLastStanding(g.st)) return;
  const cars = Object.values(g.cars);
  if (cars.length < 2) return;
  const inGame = cars.filter(c => g.st.mode === 'balloons' ? !c.ghost : !c.out);
  if (inGame.length <= 1) {
    if (!g.doneAt) g.doneAt = Date.now() + 1400;
    if (Date.now() >= g.doneAt) g.done = true;
  }
}

/** The countdown, the start, the last five seconds and the end - each once - and the engine. */
function bmpTvSounds(s, now, running) {
  const g = bmp.tv, m = g.snd;
  if (now < s.startAt) {
    const n = Math.min(3, Math.ceil((s.startAt - now) / 1000));
    if (n !== m.cd) { m.cd = n; bmpTvSnd('beep'); }
  } else if (!m.go && now < s.startAt + 1500) { m.go = true; bmpTvSnd('go'); }
  const left = Math.ceil((s.endsAt - now) / 1000);
  if (running && !bmpLastStanding(g.st) && left <= 5 && left >= 1 && left !== m.tick) { m.tick = left; bmpTvSnd('tick'); }
  if (!g.ball && (now >= s.endsAt || g.done) && !m.end) { m.end = true; bmpTvSnd('end'); bmpEngineOff(); }
  if (running) {
    const cars = Object.values(g.cars).filter(c => !c.fall);
    const avg = cars.length ? cars.reduce((a, c) => a + Math.hypot(c.vx, c.vy), 0) / cars.length / 720 : 0;
    bmpEngine(Math.min(1, avg * 1.4));
  }
}

function bmpTvStep(dt, running, state, now) {
  const g = bmp.tv;
  const st = g.st;
  const cars = Object.values(g.cars);
  const wall = Date.now();
  // The cars a computer player can go for, worked out once a step rather than once a bot.
  const alive = cars.filter(o => !o.fall && !o.out && !(st.mode === 'balloons' && o.ghost));
  cars.forEach((c) => {
    if (c.fall) {
      // Falling off the ring: down it goes; on the clock, back on the platform after a moment.
      c.fall.t += dt;
      if (st.mode === 'ring' && st.ringWin === 'clock' && wall >= c.fall.back && running) bmpTvRespawn(c, wall);
      return;
    }
    const human = !c.bot;
    const inp = !running || c.out ? null : human ? (c.input && wall - c.inAt < BMP_STALE_MS ? c.input : null)
      : g.ball ? bmpBallBotInput(g, c, wall) : bmpBotInput(g, c, wall, alive);
    let thrust = 0;
    if (inp && typeof inp.x === 'number') {
      const x = inp.x / 100, y = inp.y / 100;
      const m = Math.min(1, Math.hypot(x, y));
      if (m > 0.15) {
        const want = Math.atan2(y, x);
        let diff = want - c.h;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));

        thrust = 1000 * m * Math.max(0.25, Math.cos(diff));
      }
    } else if (inp && typeof inp.s === 'number') {
      c.h += (inp.s / 100) * 3.2 * dt;
      thrust = inp.g > 0 ? 1000 * Math.min(1, inp.g / 100) : inp.g < 0 ? -700 : 0;
    }
    const fx = Math.cos(c.h), fy = Math.sin(c.h);
    c.vx += fx * thrust * dt;
    c.vy += fy * thrust * dt;
    // Grip: the sideways slide dies faster than the roll, so it steers like a car and a knock still slides.
    const fwd = c.vx * fx + c.vy * fy;
    const side = -c.vx * fy + c.vy * fx;
    const f2 = fwd * Math.exp(-1.3 * dt), s2 = side * Math.exp(-3.2 * dt);

    c.vy = f2 * fy + s2 * fx;

    if (sp > cap) { c.vx *= cap / sp; c.vy *= cap / sp; }
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    if (st.mode === 'ring') {
      // No rail: past the edge is a fall.
      const d = Math.hypot(c.x - BMP_W / 2, c.y - BMP_H / 2);
      if (d > BMP_RING_R + 6 && !c.out) bmpTvFall(c, wall, running);
    } else {
      const m = 18 + BMP_R;
      let hitWall = 0;
      if (c.x < m) { hitWall = Math.abs(c.vx); c.x = m; c.vx = Math.abs(c.vx) * 0.7; }
      if (c.x > BMP_W - m) { hitWall = Math.abs(c.vx); c.x = BMP_W - m; c.vx = -Math.abs(c.vx) * 0.7; }
      if (c.y < m) { hitWall = Math.max(hitWall, Math.abs(c.vy)); c.y = m; c.vy = Math.abs(c.vy) * 0.7; }
      if (c.y > BMP_H - m) { hitWall = Math.max(hitWall, Math.abs(c.vy)); c.y = BMP_H - m; c.vy = -Math.abs(c.vy) * 0.7; }
