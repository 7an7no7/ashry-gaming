<style>
/* Style_Night.html - the ideas batch of 30 Sep 2026, a game's code on its way, the next batch, برنامج السهرة, «الشلة», «اعمل مسابقتك» and «كلماتنا».
   Part of the stylesheet that starts in Style.html: the parts are included in
   Controller.html in this order, and the cascade depends on it. */

/* ===== IDEAS BATCH: SOLO ===== */
/* The Wordle tiles turn over row by row (wordleReveal, Web Animations): a
   little depth so rotateX reads as a turn, not a squash. */
#wordle-grid .wordle-row { perspective: 40rem; }

/* Guess the number: the window of what is still possible, over a bar of the
   whole range whose lit part shrinks with each verdict (gnPaintWindow). */
.gnw { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.gnw__text { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
.gnw__line { display: flex; align-items: center; gap: var(--sp-2); inline-size: min(100%, 20rem); font-size: var(--fs-xs, 0.75rem); color: var(--text-3); }
.gnw__end { flex: none; min-inline-size: 1.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.gnw__bar { position: relative; flex: 1; block-size: 0.625rem; border-radius: var(--r-full); background: var(--surface-3); overflow: hidden; }
.gnw__fill { position: absolute; inset: 0; border-radius: var(--r-full); background: var(--accent); transform-origin: left center; transition: transform 480ms var(--ease-spring); }
.gnw__fill.is-won { background: var(--success-btn); }
@media (prefers-reduced-motion: reduce) { .gnw__fill { transition: none; } }

/* 2048: "+N" rising from the score, and a ring round a new highest tile. */
.g2048-plus {
  position: fixed; z-index: var(--z-fx, 60); pointer-events: none;
  font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.25rem;
  color: var(--accent-ink); text-shadow: 0 1px 0 var(--surface-solid);
}
.g2048-tile.is-top { animation: g2048-top 520ms var(--ease-spring); }
.g2048-tile.is-top::after {
  content: ''; position: absolute; inset: -0.25rem; border-radius: inherit;
  border: 3px solid var(--pop); opacity: 0; pointer-events: none;
  animation: g2048-ring 620ms ease-out;
}
@keyframes g2048-top { 0% { scale: 1; } 35% { scale: 1.22; } 100% { scale: 1; } }
@keyframes g2048-ring { 0% { opacity: 0.9; transform: scale(0.85); } 100% { opacity: 0; transform: scale(1.45); } }

/* Minesweeper: a ring fills over the long press (MINES_HOLD_MS), and a mine
   that goes off in the chain flashes. */
.mines-cell { position: relative; }
.mines-ring {
  position: absolute; inset: 8%; border-radius: 50%; pointer-events: none;
  border: 3px solid var(--accent); opacity: 0.85;
  transform: scale(0.2);
  animation: mines-ring var(--hold, 420ms) linear forwards;
}
@keyframes mines-ring { to { transform: scale(1); opacity: 1; } }
.mines-cell.is-blown::after {
  content: ''; position: absolute; inset: -20%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--warning-btn) 70%, transparent), transparent 70%);
  opacity: 0; animation: mines-blow 420ms ease-out;
}
@keyframes mines-blow { 0% { opacity: 1; transform: scale(0.5); } 100% { opacity: 0; transform: scale(1.4); } }

/* The timer: a ring that drains round the time, and one-tap presets. */
.gtm-dial { position: relative; display: grid; place-items: center; inline-size: min(16rem, 70vw, calc(var(--app-h, 100vh) * 0.42)); aspect-ratio: 1; margin: var(--sp-2) auto var(--sp-5); }
.gtm-dial > .metric { position: relative; }
.gtm-ring { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; transform: rotate(-90deg); }
.gtm-ring circle { fill: none; stroke-width: 7; }
.gtm-ring__track { stroke: var(--surface-3); }
.gtm-ring__fill { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1s linear, stroke 300ms; }
[dir="rtl"] .gtm-ring { transform: rotate(-90deg) scaleY(-1); }
.gtm-dial.is-low .gtm-ring__fill { stroke: var(--danger-btn); }
.gtm-dial.is-low > .metric { color: var(--danger-ink, var(--danger)); }
.gtm-presets { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin-block-end: var(--sp-4); }
.gtm-presets .chip { min-block-size: 2.75rem; min-inline-size: 3.25rem; justify-content: center; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .gtm-ring__fill { transition: none; } }

/* The counter: the leader wears the crown (the rows themselves: «العداد العام» at the end). */
.univ-crown { display: none; }
.univ-row.is-leader .univ-crown { display: inline; }
.univ-row.is-leader .univ-place { display: none; }

/* Hold to repeat: a held + or − never selects text or opens a menu. */
.stepper__btn, .cs-step__btn, [data-hold-repeat] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }

/* The solo result sheet: a new record's gold stamp slams on once. */
.solo-stamp { display: flex; justify-content: center; }
.solo-stamp > span {
  display: inline-block; padding: 0.35rem 1rem; border-radius: var(--r-lg);
  border: 3px solid var(--pop); color: var(--pop-on);
  background: color-mix(in srgb, var(--pop) 88%, var(--surface-solid));
  font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.35rem;
  rotate: -6deg; box-shadow: 0 0.25rem 1rem color-mix(in srgb, var(--pop) 45%, transparent);
}
.solo-stamp.is-slam > span { animation: solo-stamp-slam 520ms cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes solo-stamp-slam {
  0% { opacity: 0; transform: scale(2.4); }
  60% { opacity: 1; transform: scale(0.92); }
  100% { opacity: 1; transform: scale(1); }
}
.solo-result-minor > .btn { flex: 1; white-space: nowrap; min-inline-size: 0; }
@media (prefers-reduced-motion: reduce) { .solo-stamp.is-slam > span { animation: none; } .g2048-tile.is-top, .g2048-tile.is-top::after, .mines-ring, .mines-cell.is-blown::after { animation: none; } }

/* ===== IDEAS BATCH: PARTY1 ===== */
/* بدون كلام / أوصف لي: the 3-2-1 over the card, before the clock (partyCountdown). */
.pt-count { display: none; }
.is-counting .pt-count {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  color: var(--accent-ink);
  font-size: clamp(5rem, 28vw, 9rem);
  font-weight: var(--fw-black);
  line-height: 1;
}
.is-counting .play-stage__card > :not(.pt-count) { visibility: hidden; }
.is-counting .play-stage__actions,
.is-counting .play-stage__head .btn-row > :first-child { opacity: 0.4; pointer-events: none; }

/* The last three seconds read red on the one-phone clocks that pop (countdownUrgency). */
:is(#charades-timer, #desc-timer, #timesup-clock-display, #whoami-timer-display, #spyfall-timer-display, #stop-clock):is([data-count-at="1"], [data-count-at="2"], [data-count-at="3"]) { color: var(--danger); }

/* The end of a turn: every card, a tap flips its verdict (partyTurnSummaryHtml). */
.pt-sum { text-align: center; }
.pt-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.pt-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  min-height: 2.75rem;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-3);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: var(--fw-bold);
  text-decoration: line-through;
  cursor: pointer;
}
.pt-chip.is-right { border-color: transparent; background: var(--success-soft); color: var(--success-ink); text-decoration: none; }

/* The one-phone bomb: who holds it (bombOneOrderHtml). */
.bm1-holding { margin: 0 0 var(--sp-2); text-align: center; color: var(--danger-ink); font-weight: var(--fw-bold); }
.bm1-chip { min-height: 2.75rem; cursor: pointer; font-family: var(--font); font-size: var(--fs-body); }
/* Its bar is the talk's (.talk__actions): on a phone on its side pass, another
   category and the exit share one row, so the bar doesn't cover the bomb; so do
   another category and the exit when nobody's names are kept. */
@media (orientation: landscape) and (max-height: 500px) {
  #bomb-stage .view-actions.play-foot:not(.talk__actions) { flex-direction: row; }
  #bomb-stage .view-actions.play-foot:not(.talk__actions) > .btn--lg { flex: 1 1 0; min-width: 0; --btn-h: 2.625rem; }
  #bomb-stage .view-actions.play-foot:not(.talk__actions) > .play-exit { flex: none; }
}

/* كلمة واحدة on one phone: the writers' check (joPaintCheck) and the guesser's cards. */
.jo-check { display: grid; gap: var(--sp-3); }
.jo-check .card__title { margin: 0; }
.jo-check-word { color: var(--text-2); }
.jo-check-word b { color: var(--success-ink); }
.jo-dup-line { margin: 0; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--danger-soft); color: var(--danger-ink); font-weight: var(--fw-bold); }
.jo-clues { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.jo-clue {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 6rem;
  min-height: 3.5rem;
  padding: var(--sp-2) var(--sp-3);
  border: 2px solid var(--accent-border, var(--border));
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  cursor: pointer;
  box-shadow: var(--sh-1);
}
.jo-clue__word { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: var(--fw-black); line-height: 1.2; }
.jo-clue__by { color: var(--text-3); font-size: var(--fs-xs); }
.jo-clue.is-struck { border-color: var(--danger); background: var(--danger-soft); box-shadow: none; }
.jo-clue.is-struck .jo-clue__word { color: var(--danger-ink); text-decoration: line-through; text-decoration-thickness: 3px; }
.jo-clue.is-dup { cursor: default; }
.jo-clue.is-shake { animation: jo-shake 520ms var(--ease-out) both; }
@keyframes jo-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px) rotate(-2deg); } 40% { transform: translateX(6px) rotate(2deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.jo-card {
  display: grid;
  place-items: center;
  min-width: 7rem;
  min-height: 5rem;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-xl);
  background: var(--accent);
  color: var(--accent-on);
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 6vw, 2rem);
  font-weight: var(--fw-black);
  line-height: 1.2;
  box-shadow: var(--sh-2);
}
.jo-clues--deal .jo-card { animation: jo-card-in 560ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 260ms + 150ms); }
@keyframes jo-card-in { 0% { opacity: 0; transform: perspective(40rem) rotateY(90deg) scale(0.8); } 60% { opacity: 1; transform: perspective(40rem) rotateY(-10deg) scale(1.04); } 100% { opacity: 1; transform: none; } }
@media (orientation: landscape) and (max-height: 500px) {
  .jo-check { gap: var(--sp-2); }
  .jo-card { min-height: 3.75rem; font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  .jo-clue.is-shake, .jo-clues--deal .jo-card { animation: none; }
}

/* ===== IDEAS BATCH: PARTY2 ===== */
/* One-phone الجاسوس, من أنا؟, الموقع السري and أتوبيس كومبليت brought up to their
   rooms (JS_Imposter, JS_WhoAmI, JS_Spyfall, JS_Stop). */

/* الجاسوس: the accusation, the caught spy's guess, the result's line and board. */
.imp1-live { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
.imp1-live .btn--sm { width: auto; }
.imp1-pick { transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out); }
.imp1-pick.is-picked { border-color: var(--danger); background: var(--danger-soft); }
.imp1-pick__confirm { animation: imp1-nudge 1.1s var(--ease-in-out) infinite; }
@keyframes imp1-nudge { 0%, 100% { scale: 1; } 50% { scale: 1.08; } }
.imp1-guess-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.imp1-guess-list .ballot-option { min-height: 3.5rem; justify-content: center; text-align: center; font-size: var(--fs-body); padding: var(--sp-3); }
.imp1-guess-list .ballot-option__label { flex: none; }
#winners-list .imp1-line { font-size: var(--fs-h3); font-weight: var(--fw-black); margin-block-end: var(--sp-2); text-wrap: balance; }
#winners-list .imp1-sub { font-size: var(--fs-sm); font-weight: var(--fw-semi); color: var(--text-2); margin-block-end: var(--sp-3); }
#winners-list .imp1-board { font-size: var(--fs-body); font-weight: var(--fw-body); text-align: start; }
#winners-list .imp1-board:empty { display: none; }

/* من أنا؟: who got theirs, in order. */
.wa1-got { margin-block: var(--sp-4); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.wa1-got__chips { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.wa1-chip {
  min-height: 2.75rem; display: inline-flex; align-items: center; gap: var(--sp-2);
  padding-inline: var(--sp-4); border-radius: var(--r-full);
  border: 2px solid var(--border); background: var(--surface-solid); color: var(--text-strong);
  font-family: var(--font); font-size: var(--fs-sm); font-weight: var(--fw-bold); cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.wa1-chip:active { transform: scale(0.96); }
.wa1-chip.is-got { background: var(--success-soft); border-color: var(--success); color: var(--success-ink); }
.wa1-chip__at {
  display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem; border-radius: var(--r-full);
  background: var(--success-btn); color: var(--success-on); font-size: var(--fs-xs);
}
.wa1-chip__pts { font-size: var(--fs-xs); }
.wa1-podium { margin-block-end: var(--sp-4); }

/* الموقع السري: the spy owns up. */
.spy1-guess-btn { display: flex; width: auto; margin-inline: auto; margin-block-end: var(--sp-4); }

/* أتوبيس كومبليت: scoring one category at a time. */
.stop1-cat__head { display: flex; align-items: center; gap: var(--sp-4); margin-block-end: var(--sp-2); }
.stop1-cat__letter {
  flex: none; width: 4.25rem; height: 4.25rem; display: grid; place-items: center;
  border-radius: var(--r-lg); background: var(--accent-soft); color: var(--accent-ink);
  font-family: var(--font-display); font-size: 2.75rem; font-weight: var(--fw-black); line-height: 1;
}
.stop1-cat__name { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: var(--fw-black); color: var(--text-strong); }
.stop1-cat.is-new .stop1-cat__head, .stop1-cat.is-new .stop1-row { animation: stop1-in var(--dur-4) var(--ease-out) backwards; }
.stop1-cat.is-new .stop1-row:nth-child(2) { animation-delay: 40ms; }
.stop1-cat.is-new .stop1-row:nth-child(3) { animation-delay: 80ms; }
.stop1-cat.is-new .stop1-row:nth-child(n+4) { animation-delay: 120ms; }
@keyframes stop1-in { from { opacity: 0; translate: 0 0.625rem; } to { opacity: 1; translate: 0 0; } }
.stop1-rows { display: flex; flex-direction: column; gap: var(--sp-2); margin-block: var(--sp-3); }
@media (min-width: 900px) { .stop1-rows { max-width: 36rem; margin-inline: auto; } .stop1-quick { max-width: 36rem; margin-inline: auto; } }
.stop1-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 15rem); align-items: center; gap: var(--sp-3); }
.stop1-row__name { font-weight: var(--fw-bold); color: var(--text-strong); overflow-wrap: anywhere; }
.stop1-seg::before { display: none; }
.stop1-seg .stop1-seg__item { min-height: 2.75rem; display: flex; flex-direction: column; gap: 0; line-height: 1.15; padding-inline: var(--sp-1); }
.stop1-seg .stop1-seg__item b { font-size: var(--fs-xs); opacity: 0.8; }
/* Past .segmented.has-thumb's transparent active item: this choice has no sliding thumb. */
.segmented.stop1-seg .segmented__item.stop1-seg__item.is-active { color: var(--text-strong); background: var(--surface-solid); box-shadow: var(--sh-1); }
.segmented.stop1-seg .segmented__item.stop1-v5.is-active { background: var(--warning-btn); color: var(--warning-on); }
.segmented.stop1-seg .segmented__item.stop1-v10.is-active { background: var(--success-btn); color: var(--success-on); }
.stop1-quick { justify-content: center; }
.stop1-quick .btn { width: auto; }
.stop1-letter-chip {
  display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3);
  border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-ink); font-weight: var(--fw-bold);
}
.stop1-letter-chip b { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1; }
.stop1-th-btn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent-ink); text-decoration: underline dotted; text-underline-offset: 0.2em; cursor: pointer; min-height: 2.75rem; }

/* A phone on its side: the rows two by two. */
@media (orientation: landscape) and (max-height: 500px) {
  .stop1-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--sp-5); }
  .stop1-row { grid-template-columns: minmax(0, 1fr) minmax(0, 12rem); }
  .stop1-cat__letter { width: 3.25rem; height: 3.25rem; font-size: 2rem; }
}
@media (prefers-reduced-motion: reduce) {
  .imp1-pick__confirm, .stop1-cat.is-new .stop1-cat__head, .stop1-cat.is-new .stop1-row { animation: none; }
}
/* A category's buttons in one row on a phone on its side, so the players' rows keep the height. */
@media (orientation: landscape) and (max-height: 500px) {
  .view-actions.stop1-actions { display: flex; flex-direction: row; align-items: center; gap: var(--sp-2); }
  .view-actions.stop1-actions > .btn--lg { flex: 1 1 auto; width: auto; }
  .view-actions.stop1-actions > .btn-row { flex: 0 1 auto; flex-wrap: nowrap; margin: 0; }
  .view-actions.stop1-actions > .btn-row > .btn { white-space: nowrap; }
}

/* ===== IDEAS BATCH: SHELL ===== */
/* The setup hero's mode pills. With the one phone / own phones switch on the
   screen they are that switch (a real button, the side it is on lit); with no
   switch they are plain words, nothing to press. */
.game-hero__meta .meta-bit--mode {
  background: transparent;
  border: 0;
  padding-inline: 2px;
  color: var(--text-3);
}
.game-hero__meta .meta-bit--pick {
  font: inherit;
  font-size: var(--fs-xs);
  font-weight: 700;
  min-height: 2.25rem;
  padding: 0 0.75rem;
  gap: 0.3rem;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-2);
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.game-hero__meta .meta-bit--pick.is-active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.game-hero__meta .meta-bit--pick:active { transform: scale(0.95); }
.game-hero__meta .meta-bit--pick:focus-visible { outline: var(--focus-w) solid var(--accent-ink); outline-offset: 2px; }

/* The recent row at the top of a returning phone's home: a slim row, its head
   one small line (renderHome). */
.section.home-recent--slim { margin-bottom: var(--sp-3); }
.home-recent--slim .section__head { margin-bottom: var(--sp-1); gap: var(--sp-1); }
.home-recent--slim .section__title { font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); }
.home-recent--slim .section__emoji { font-size: 0.9rem; }
.home-recent--slim .recent-row { padding-block: 2px 4px; }

/* «كمّل: بنك الحظ»: the game left in the middle, first thing on the home. */
.home-cont {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}
.home-cont__go {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 3.75rem;
  padding: var(--sp-2) var(--sp-3);
  border: 1.5px solid var(--accent-border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  color: var(--text);
  box-shadow: var(--sh-2);
  font: inherit;
  text-align: start;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out);
}
.home-cont__go:active { transform: scale(0.98); }
.home-cont__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: var(--r-md);
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  font-size: 1.5rem;
  line-height: 1;
}
.home-cont__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.home-cont__title { font-family: var(--font-display); font-size: 1rem; font-weight: 800; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-cont__line { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-cont__play {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--r-full);
  background: var(--pop, var(--accent));
  color: var(--pop-on, var(--accent-on));
  font-size: 0.85rem;
}
.home-cont__x {
  flex: none;
  width: 2.75rem;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 0.9rem;
  cursor: pointer;
}
@media (prefers-reduced-motion: no-preference) {
  .home-cont { animation: home-cont-in var(--dur-3) var(--ease-out) both; }
}
@keyframes home-cont-in { from { opacity: 0; transform: translateY(8px); } }

/* The host's room list: what this room can start now, then the rest folded
   (renderRoomHub → roomHubListHtml in JS_Room.html). */
.room-hub-now {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin: var(--sp-3) 0 var(--sp-2);
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-strong);
}
.room-hub-count { font-weight: 700; color: var(--text-3); }
.room-hub-more {
  margin-top: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
}
.room-hub-more__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  min-height: 3rem;
  padding: 0 var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-2);
  list-style: none;
  cursor: pointer;
}
.room-hub-more__head::-webkit-details-marker { display: none; }
.room-hub-more__chev { flex: none; color: var(--accent-ink); transition: transform var(--dur-3) var(--ease-spring); }
.room-hub-more[open] .room-hub-more__chev { transform: rotate(180deg); }
.room-hub-more__body { padding: 0 var(--sp-3) var(--sp-3); }
.room-hub-sec + .room-hub-sec { margin-top: var(--sp-3); }
.room-hub-sec__head {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--text-3);
}
@media (prefers-reduced-motion: reduce) { .room-hub-more__chev { transition: none; } }

/* The host TV's lobby with nobody in yet (tvLobbyEmptyHtml in JS_RoomTv.html):
   the QR and the code in the middle, big, «امسحوا الكود» breathing. The first
   person in brings the list (tv-lobby--arrive) and pops their chip. */
.tv-lobby.tv-lobby--empty {
  height: 100%;
  grid-template-columns: minmax(0, 1fr);
  align-content: center;
  justify-items: center;
}
.tv-lobby--empty > .tv-join {
  display: grid;
  grid-template-columns: auto minmax(0, 42rem);
  grid-template-areas: "qr code" "qr cta" "qr url" "qr hint" "qr game";
  align-content: center;
  align-items: center;
  justify-items: center;
  column-gap: calc(var(--tv-gap) * 2.5);
  row-gap: calc(var(--tv-gap) * 0.8);
}
.tv-lobby--empty .tv-qr { grid-area: qr; width: min(60vmin, 42vw, 900px); }
.tv-lobby--empty .tv-join__code { grid-area: code; font-size: calc(var(--tv-xl) * 1.35); }
.tv-lobby--empty .tv-join__url { grid-area: url; font-size: var(--tv-md); color: var(--text-2); }
.tv-lobby--empty .tv-join__hint { grid-area: hint; }
.tv-join__cta {
  grid-area: cta;
  margin: 0;
  padding: 0.3em 0.9em;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--font-display);
  font-size: var(--tv-lg);
  font-weight: 900;
  white-space: nowrap;
}
.tv-join__game {
  grid-area: game;
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  margin: 0;
  font-size: var(--tv-sm);
  font-weight: 700;
  color: var(--text-2);
}
.tv-join__game b { color: var(--accent-ink); }
/* A TV held upright, or a narrow window: one column. */
@media (max-aspect-ratio: 1/1) {
  .tv-lobby--empty > .tv-join { grid-template-columns: minmax(0, 1fr); grid-template-areas: "qr" "code" "cta" "url" "hint" "game"; }
  .tv-lobby--empty .tv-qr { width: min(60vmin, 80vw); }
}
@media (prefers-reduced-motion: no-preference) {
  .tv-join__cta { animation: tv-cta-pulse 1.8s var(--ease-in-out) infinite; }
  .tv-lobby--arrive > .tv-lobby__side { animation: tv-side-in 560ms var(--ease-out) both; }
  .tv-lobby--arrive > .tv-join { animation: tv-join-step 560ms var(--ease-out) both; }
  .tv-chip.is-new { animation: tv-player-in 420ms var(--ease-out) both; }
}
@keyframes tv-cta-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.82; } }
@keyframes tv-side-in { from { opacity: 0; transform: translateY(1.5rem) scale(0.98); } }
@keyframes tv-join-step { from { transform: scale(1.18); } }


/* ===== IDEAS BATCH: ROOMS ===== */
/* Staged reveals (stageReveal in JS_Motion.html, section 14): each part waits
   for its --rv-at, and its resting state is the settled one. */
[data-rv] {
  animation-duration: 460ms;
  animation-timing-function: var(--ease-out);
  animation-delay: var(--rv-at, 0ms);
  animation-fill-mode: backwards;
}
[data-rv="in"]    { animation-name: rv-in; }
[data-rv="pop"]   { animation-name: rv-pop; animation-duration: 640ms; animation-timing-function: cubic-bezier(0.2, 1.3, 0.35, 1); }
[data-rv="undim"] { animation-name: rv-undim; animation-duration: 520ms; }
[data-rv="win"]   { animation-name: rv-win; animation-duration: 700ms; animation-timing-function: cubic-bezier(0.2, 1.3, 0.35, 1); }
[data-rv="flip"]  { position: relative; animation-name: rv-turn; animation-duration: 560ms; animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); animation-fill-mode: both; }
@keyframes rv-in    { from { opacity: 0; transform: translateY(0.6rem); } }
@keyframes rv-pop   { 0% { opacity: 0; transform: scale(0.82); } 60% { opacity: 1; transform: scale(1.05); } }
@keyframes rv-undim { from { opacity: 1; transform: none; } }
@keyframes rv-win   { 0% { transform: none; } 45% { transform: scale(1.07); } }
@keyframes rv-fade  { from { opacity: 0; } }
@keyframes rv-turn  { 0% { transform: perspective(60rem) rotateX(0); } 50% { transform: perspective(60rem) rotateX(90deg); } 100% { transform: perspective(60rem) rotateX(0); } }

/* A 'flip' part's face: shown until the card is edge-on (--rv-at + 280ms). */
.rv-cover {
  position: absolute;
  inset: -1px;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  border-radius: inherit;
  background:
    repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent-on) 12%, transparent) 0 0.5rem, transparent 0.5rem 1rem),
    var(--accent);
  color: var(--accent-on);
  font-weight: 900;
  visibility: hidden;
  pointer-events: none;
  animation: spy-cover calc(var(--rv-at, 0ms) + 280ms) linear both;
}
.rv-cover b { font-size: 1.4em; line-height: 1; }
.rv-cover small { font-size: var(--fs-sm); }


/* فيبج: the lies one by one, the truth last (fibRevealHtml). */
.fib-reveal { display: flex; flex-direction: column; gap: var(--sp-4); margin-block: var(--sp-3); }
.fib-reveal__cards { display: flex; flex-direction: column; gap: var(--sp-2); }
.fib-card {
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
}
.fib-card__label { font-weight: 800; font-size: 1.125rem; color: var(--text-strong); overflow-wrap: anywhere; }
.fib-card__line { margin-top: var(--sp-1); font-size: var(--fs-sm); color: var(--text-2); }
.fib-card.is-fooled .fib-card__line b { color: var(--danger-ink); }
.fib-card__voters { margin-top: var(--sp-1); font-size: var(--fs-xs); color: var(--text-3); }
.fib-card--truth { text-align: center; border-color: var(--success); background: var(--success-soft); box-shadow: 0 0 0 1px var(--success), var(--sh-2); }
.fib-card__eyebrow { font-size: var(--fs-sm); font-weight: 800; color: var(--success-ink); }
.fib-card__truth { margin-block: var(--sp-1); font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; color: var(--text-strong); overflow-wrap: anywhere; }
body.dark .fib-card__eyebrow { color: var(--success); }
.fib-reveal--tv { width: min(96%, 1700px); align-self: center; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; gap: var(--tv-gap); margin: 0; }
.fib-reveal--tv .fib-reveal__cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tv-gap); }
.fib-reveal--tv .fib-card { padding: 1.4vmin 2vmin; border-radius: var(--tv-r); }
.fib-reveal--tv .fib-card__label { font-size: var(--tv-md); }
.fib-reveal--tv .fib-card__line { font-size: var(--tv-sm); }
.fib-reveal--tv .fib-card__voters { font-size: calc(var(--tv-sm) * 0.85); }
.fib-reveal--tv .fib-card--truth { grid-column: 1 / -1; }
.fib-reveal--tv .fib-card__eyebrow { font-size: var(--tv-sm); }
.fib-reveal--tv .fib-card__truth { font-size: clamp(1.6rem, 5vmin, 4.2rem); }
.fib-reveal--tv .fib-reveal__board { width: 100%; }
.fib-reveal--tv .rv-cover { font-size: var(--tv-md); }
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  .fib-reveal:not(.fib-reveal--tv) .fib-reveal__cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fib-reveal:not(.fib-reveal--tv) .fib-card--truth { grid-column: 1 / -1; }
}

/* مافيا: the end, role by role. */
.mafia-end-card { text-align: center; }
.mafia-final.is-mafia > b { color: var(--danger); }
.mafia-final .rv-cover b { color: var(--accent-on); text-decoration: none; }
.mafia-final[data-rv] .rv-cover { border-radius: var(--r-sm); }
.mafia-final-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: calc(var(--tv-gap) / 2) var(--tv-gap); width: min(94%, 1600px); align-self: center; }
.mafia-final-grid .mafia-final { grid-template-columns: 1.6em minmax(0, 1fr) auto; padding: 0.35em 0.7em; border: 1px solid var(--border); border-radius: var(--tv-r); background: var(--surface-solid); font-size: var(--tv-sm); }
.mafia-final-grid .mafia-final:last-child { border-bottom: 1px solid var(--border); }
.mafia-final-grid .mafia-final.is-mafia { border-color: var(--danger); }

/* تحدي المعلومات: the right answer's ring comes with it, not before (the TV). */
.tv-choice.is-correct[data-rv="win"] { box-shadow: none; }
.tv-choice.is-correct[data-rv="win"]::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 0.6vmin var(--bg), 0 0 0 1.2vmin var(--success);
  pointer-events: none;
  animation: rv-fade 300ms var(--ease-out) var(--rv-at, 0ms) backwards;
}
.tv-trivia-res { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: var(--tv-gap); width: min(96%, 1700px); }
.tv-trivia-res .tv-fastest { justify-content: flex-start; }
.tv-trivia-board { width: 100%; }
body.is-tv-view .tv-trivia-board .scoreboard { margin: 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 11rem), 1fr)); }
body.is-tv-view .tv-trivia-board .status-row { padding-block: 0.3rem; min-height: 0; }

/* الجرس: how far behind the first press. */
.bz-gap { font-size: var(--fs-xs); color: var(--text-2); background: var(--surface-2); font-variant-numeric: tabular-nums; }
.tv-chip .bz-gap { font-size: 0.8em; }
.bz-finish { position: relative; width: min(90%, 1100px); height: clamp(5rem, 16vmin, 12rem); margin-top: var(--tv-gap); }
.bz-finish__track { position: absolute; inset-inline: 0; top: 50%; height: 0.35vmin; min-height: 2px; background: var(--border); }
.bz-finish__line { position: absolute; top: 8%; bottom: 8%; left: 4%; width: 0.6vmin; min-width: 3px; background: repeating-linear-gradient(0deg, var(--text-strong) 0 0.8vmin, transparent 0.8vmin 1.6vmin); opacity: 0.6; }
.bz-finish__mark { position: absolute; top: 50%; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); }
.bz-finish__dot { width: 2vmin; height: 2vmin; min-width: 10px; min-height: 10px; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 0.4vmin var(--bg); }
.bz-finish__mark.is-first .bz-finish__dot { background: var(--accent); width: 3vmin; height: 3vmin; }
.bz-finish__tag { position: absolute; white-space: nowrap; font-size: var(--tv-sm); font-weight: 800; color: var(--text-strong); }
.bz-finish__tag small { font-weight: 700; color: var(--text-2); }
.bz-finish__mark--high .bz-finish__tag { bottom: calc(100% + 0.6vmin); }
.bz-finish__mark--low .bz-finish__tag { top: calc(100% + 0.6vmin); }
.bz-finish__mark.is-first .bz-finish__tag { color: var(--accent-ink); }

/* الشاهد: the sketch against the real face, feature by feature. */
.wit-tally { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); margin-block: var(--sp-2); }
.wit-tally__chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem; }
.wit-tick { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0.55rem; border-radius: var(--r-full); font-size: var(--fs-xs); font-weight: 800; border: 1px solid var(--border); background: var(--surface-solid); color: var(--text-2); }
.wit-tick.is-ok { border-color: var(--success); color: var(--success-ink); background: var(--success-soft); }
.wit-tick.is-off { color: var(--danger-ink); }
body.dark .wit-tick.is-ok { color: var(--success); }
.wit-tally--tv .wit-tick { font-size: calc(var(--tv-sm) * 0.8); }
/* «الرسم مطابق 78%» (2 Oct 2026): the % beside the ticks, a bar with the 70% line, the +1 or the laugh. */
.wit-match { display: grid; grid-template-columns: auto auto; align-items: baseline; justify-content: center; column-gap: var(--sp-2); row-gap: 0.35rem; width: 100%; max-width: 18rem; }
.wit-match__k { font-weight: 800; color: var(--text-2); font-size: var(--fs-sm); }
.wit-match__pct { font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1; color: var(--text-strong); }
.wit-match__pct i { font-style: normal; font-size: 0.6em; margin-inline-start: 0.1em; }
.wit-match.is-won .wit-match__pct { color: var(--success-ink); }
body.dark .wit-match.is-won .wit-match__pct { color: var(--success); }
.wit-match__bar { grid-column: 1 / -1; position: relative; display: block; height: 0.5rem; border-radius: var(--r-full); background: var(--surface-3); overflow: hidden; direction: ltr; }
.wit-match__fill { position: absolute; inset: 0; border-radius: inherit; background: var(--text-3); transform-origin: left center; transform: scaleX(var(--p, 0)); }
.wit-match.is-won .wit-match__fill { background: var(--success); }
.wit-match__fill[data-rv="grow"] { animation-name: wit-match-grow; animation-duration: 720ms; }
@keyframes wit-match-grow { from { transform: scaleX(0); } }
.wit-match__line { position: absolute; inset-block: 0; left: var(--l, 70%); width: 2px; background: var(--text-strong); opacity: 0.55; }
.wit-match__n { grid-column: 1 / -1; text-align: center; font-weight: 800; font-size: var(--fs-sm); color: var(--text-2); }
.wit-match__bonus { font-weight: 800; font-size: var(--fs-sm); color: var(--text-2); text-align: center; }
.wit-match__bonus.is-won { padding: 0.3rem 0.8rem; border-radius: var(--r-full); background: var(--success-soft); color: var(--success-ink); border: 1px solid var(--success); }
body.dark .wit-match__bonus.is-won { color: var(--success); }
.wit-tally--tv .wit-match { max-width: none; }
/* The reveal's side column holds the faces, the meter, the ticks, the verdict and the points: smaller faces, so it all fits a 16:9 screen. */
.wit-tv.wit--reveal .wit-compare { max-width: 36vmin; }
.wit-tv.wit--reveal .wit-tv__side { gap: 1.2vmin; }
.wit-tv.wit--reveal .wit-tally { margin-block: 0; gap: 1vmin; }
.wit-tally--tv .wit-match__k, .wit-tally--tv .wit-match__n, .wit-tally--tv .wit-match__bonus { font-size: var(--tv-sm); }
.wit-tally--tv .wit-match__pct { font-size: var(--tv-lg); }
.wit-tally--tv .wit-match__bar { height: 1.1vmin; min-height: 0.5rem; }

@media (prefers-reduced-motion: reduce) {
  [data-rv], .rv-cover { animation: none; }
}

/* ===== IDEAS BATCH: BOARD ===== */

/* لودو: where every piece that can move lands, drawn at once (a touch screen has no hover). */
.ludo-path--end.ludo-land { animation: ideasLudoLand 1.6s ease-in-out infinite; }
/* Over the movable pieces (z 4) so a label is never under one; the layer takes no taps. */
.ludo-board.is-choosing .ludo-fx { z-index: 5; }
.ludo-path--end.ludo-land.is-safe { background: rgba(255, 255, 255, 0.55); }
.ludo-path--end.ludo-land i {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-style: normal; font-size: 0.8rem; line-height: 1; color: var(--pc);
}
@keyframes ideasLudoLand { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.55; } }

/* السلم والتعبان: before your roll, your piece's ring and the six squares a roll could reach. */
.snk-hint { stroke-width: 3.5; fill-opacity: 0.2; stroke-opacity: 0.95; }
.snk-hint--plain { stroke: #ffffff; fill: #ffffff; stroke-dasharray: 6 5; }
.snk-hint--ladder { stroke: #1f9d55; fill: #1f9d55; }
.snk-hint--snake { stroke: #e5383b; fill: #e5383b; }
.snk-myring {
  fill: none; stroke-width: 3;
  transform-box: fill-box; transform-origin: center;
  animation: ideasSnkRing 1.2s ease-out infinite;
}
@keyframes ideasSnkRing { from { transform: scale(0.85); opacity: 1; } to { transform: scale(1.35); opacity: 0.15; } }

/* أونو: how many of each colour you hold, and a faint ring on the one you hold most. */
.uno-colorbtn__n { font-family: var(--font); font-weight: 700; font-size: 0.85em; opacity: 0.85; }
.uno-colorbtn.is-most { outline: 3px solid color-mix(in srgb, var(--c) 45%, var(--text)); outline-offset: 2px; }

/* «بعدك إنت»: a small pill under the header when the player just before you is up. */
.room-nextup {
  position: fixed;
  inset-block-start: calc(var(--safe-top) + 3.9rem);
  left: 50%;
  transform: translate(-50%, 0);
  z-index: var(--z-toast);
  padding: 0.35rem 0.9rem;
  border-radius: 999px;
  background: var(--accent-soft, var(--surface-solid));
  color: var(--accent-ink, var(--text));
  border: 1px solid color-mix(in srgb, var(--accent, #7c5cff) 35%, transparent);
  box-shadow: var(--sh-3);
  font-weight: 700;
  font-size: 0.9rem;
  pointer-events: none;
  white-space: nowrap;
}
@media (orientation: landscape) and (max-height: 500px) {
  .room-nextup { inset-block-start: calc(var(--safe-top) + 0.5rem); }
}

/* بنك الحظ: the 🏗️ button breathes when a whole colour can be built on. */
.bank-nudge { animation: ideasBankNudge 1.8s ease-in-out infinite; box-shadow: 0 0 0 2px var(--accent); }
@keyframes ideasBankNudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

@media (prefers-reduced-motion: reduce) {
  .ludo-path--end.ludo-land, .snk-myring, .bank-nudge { animation: none; }
}

/* ===== A GAME'S CODE ON ITS WAY (JS_Lazy.html) =====
   A small pill under the header while a game's chunk comes (only after a quarter
   second: from the phone's own copy it is there in a few ms), or, when it can't
   come (offline before it was ever saved), what happened and a way to try again. */
.lz-status {
  position: fixed;
  top: calc(var(--safe-top) + var(--header-h) + var(--sp-2));
  inset-inline: 0;
  margin-inline: auto;
  width: max-content;
  max-width: calc(100vw - 2rem);
  z-index: var(--z-toast);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-4);
  border-radius: 999px;
  background: var(--surface-solid);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--sh-3);
  font-size: var(--fs-sm);
  font-weight: 600;
  animation: lz-in 180ms var(--ease-out, ease-out);
}
.lz-status[hidden] { display: none; }
.lz-status__spin {
  width: 1rem; height: 1rem; flex: none;
  border-radius: 50%;
  border: 2px solid var(--accent-soft, rgba(124, 58, 237, .25));
  border-top-color: var(--accent, #7c3aed);
  animation: lz-spin 700ms linear infinite;
}
.lz-status--fail { border-color: var(--danger); }
.lz-status__btn {
  min-height: 2.25rem;
  padding: 0 var(--sp-3);
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-on);
  font-weight: 700;
}
.lz-status__x {
  min-width: 2.25rem; min-height: 2.25rem;
  border-radius: 50%;
  color: var(--text-2);
}
@keyframes lz-spin { to { transform: rotate(360deg); } }
@keyframes lz-in { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  .lz-status { animation: none; }
  .lz-status__spin { animation-duration: 1.6s; }
}

/* ===== NEXT BATCH: AUTONEXT ===== */
/* «التالي لوحده»: the count to the next round under a room game's result
   (JS_RoomAutoNext.html). The slot is filled in place by autoNextPaint. */
.an-slot:empty { display: none; }
.an-slot { display: flex; justify-content: center; margin-block: var(--sp-3); }
.an-count {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: var(--sp-2) var(--sp-3);
  inline-size: min(100%, 26rem);
  padding: var(--sp-2) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  text-align: center;
}
.an-count__line { display: inline-flex; align-items: center; gap: var(--sp-1); }
.an-count__n { color: var(--accent-ink); font-size: 1.15em; min-inline-size: 1.2ch; display: inline-block; }
.an-count__bar {
  flex: 1 0 100%;
  block-size: 0.3125rem;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  overflow: hidden;
}
.an-count__fill {
  display: block; block-size: 100%; inline-size: 100%;
  background: var(--accent);
  border-radius: inherit;
  transform-origin: left center;
}
html[dir="rtl"] .an-count__fill { transform-origin: right center; }
.an-count__pause { flex: 0 0 auto; }
.an-count--paused { color: var(--text-3); font-weight: var(--fw-semi, 600); }
/* While the count runs the "waiting for the host" line under it says nothing new. */
.an-slot[data-an-on="1"] ~ .room-moveon-not { display: none; }
/* The TV reads it from the sofa. */
body.is-tv-view .an-slot--tv .an-count {
  inline-size: min(100%, 44vmin);
  font-size: var(--tv-sm);
  padding: 1vmin 2.4vmin;
  gap: 1vmin 2vmin;
}
body.is-tv-view .an-slot--tv .an-count__bar { block-size: 0.8vmin; }

/* ===== NEXT BATCH: SMALL ===== */
/* سكرو: «↺ شوف تاني» beside the latest move (this phone only). */
.skr-latest--replay { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); flex-wrap: wrap; }
.skr-latest--replay > span { min-width: 0; }
.skr-replay {
  flex: none;
  min-height: 2rem;
  padding: 0.15rem 0.7rem;
  border: 1px solid var(--accent-border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--accent-ink);
  font: inherit;
  font-size: var(--fs-xs);
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.skr-replay:active { transform: scale(0.95); }
.skr-replay:disabled { opacity: 0.45; cursor: default; }
/* Its tap area reaches past the pill without making the line taller. */
.skr-replay { position: relative; }
/* Up and down only: reaching past its sides counted as overflow, and with GitHub's fonts the
   screen test read the label as cut off (7 Oct 2026). Its own padding is the side reach. */
.skr-replay::after { content: ''; position: absolute; inset: -0.4rem 0; }

/* دوري المعرفة: the double card - the slam in gold, the card's points, the ×2 left on a played cell. */
.tb-dbl-slam .slam__word { color: var(--warning-ink); font-size: clamp(2rem, min(10vw, 16vh), 4.5rem); }
.tb-q-points--double { background: var(--warning-soft); color: var(--warning-ink); border-color: var(--warning); }
.tb-cell.is-double { position: relative; }
.tb-x2 {
  position: absolute;
  inset-block-start: 0.15rem;
  inset-inline-end: 0.2rem;
  padding: 0 0.3em;
  border-radius: var(--r-full);
  background: var(--warning-soft);
  color: var(--warning-ink);
  font-size: 0.65rem;
  font-weight: 900;
  line-height: 1.35;
  direction: ltr;
}

/* الدومينو: the numbers a seat passed on, with the host's helper on. */
.dom-seat__lacks {
  display: inline-flex;
  align-items: center;
  gap: 0.1rem;
  padding: 0 0.35em;
  border-radius: var(--r-full);
  background: var(--warning-soft);
  color: var(--warning-ink);
  font-size: var(--fs-xs);
  font-weight: 900;
  line-height: 1.5;
  white-space: nowrap;
}
.dom-seat__lacks > span { font-size: 0.8em; }
.dom-tv .dom-seat__lacks { font-size: var(--tv-xs); padding: 0.1vmin 0.8vmin; }
/* A phone upright: the seats are narrow, so the chip hangs on the seat's top edge and the name keeps its room. */
@media (max-width: 599px) and (orientation: portrait) {
  .dom-seats .dom-seat__lacks {
    position: absolute;
    inset-block-start: -0.6rem;
    inset-inline-end: 0.3rem;
    font-size: 0.65rem;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .dom-seats:has(.dom-seat__lacks) { padding-block-start: 0.45rem; }
}


/* ===== برنامج السهرة: THE NIGHT'S PROGRAM (JS_RoomProgram.html) =====
   Look أ «لوحة المذيع»: a studio card between two games - the night's table in big
   rows beside the next game's poster and its countdown ring - and the finale: the
   champion, the podium with the cast, a row of award cards. The card is a stage in
   both themes (the page's tokens set again inside it, as كدّاب's stage does), sized
   in rem on a phone and in vmin on the TV (.prog--tv). */

/* The host's door, at the top of the room's list. */
.prog-door {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  margin-block: var(--sp-2) var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid rgba(251, 191, 36, 0.45);
  border-radius: var(--r-xl);
  background: radial-gradient(120% 140% at 100% 0%, rgba(245, 158, 11, 0.28), transparent 55%),
              linear-gradient(135deg, #2a2150, #151126);
  color: #f3f0ff;
  text-align: start;
  box-shadow: var(--sh-2);
  cursor: pointer;
}
.prog-door__icon { font-size: 2rem; line-height: 1; filter: drop-shadow(0 0.2rem 0.4rem rgba(0, 0, 0, 0.35)); }
.prog-door__text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.prog-door__title { font: 900 var(--fs-h3) / 1.3 var(--font-display); color: #fff; }
.prog-door__sub { font-size: var(--fs-sm); color: #cfc6ee; line-height: 1.45; }
.prog-door__chev { font-size: 1.6rem; color: #fbbf24; line-height: 1; }
html[dir="rtl"] .prog-door__chev { transform: scaleX(-1); }
@media (hover: hover) and (pointer: fine) { .prog-door:hover { transform: translateY(-2px); box-shadow: var(--sh-3); } }
.prog-door { transition: transform var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out); }
.tv .prog-door { margin-block: 0 var(--tv-gap); padding: 1.4vmin 2vmin; border-radius: var(--tv-r); }
.tv .prog-door__title { font-size: var(--tv-md); }
.tv .prog-door__sub { font-size: var(--tv-xs); }

/* The builder. */
.prog-sheet { max-width: 30rem; }
.prog-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); width: 100%; }
.prog-row {
  display: grid;
  grid-template-columns: 1.9rem 1rem 2rem minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 0.4rem;
  padding: 0.4rem;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  touch-action: pan-y;
}
.prog-row.is-dragging { position: relative; z-index: 2; box-shadow: var(--sh-3); border-color: var(--accent); transition: none; }
.prog-row:not(.is-dragging) { transition: transform var(--dur-2) var(--ease-out); }
.prog-row__grip {
  min-width: 1.9rem;
  min-height: 2.75rem;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--text-3);
  font-weight: 900;
  letter-spacing: -0.2em;
  cursor: grab;
  touch-action: none;
}
.prog-row__num { font-weight: 900; color: var(--accent-ink); text-align: center; }
.prog-row__icon { font-size: 1.7rem; line-height: 1; text-align: center; }
.prog-row__text { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.prog-row__name { font-weight: 800; color: var(--text-strong); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-row__sum { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-row__btn { min-width: 2.5rem; min-height: 2.5rem; padding: 0; }
/* In a program «التالي لوحده» is always on (the program runs by itself): its switch isn't offered. */
.prog-opts .an-lobby { display: none; }
.prog-empty { width: 100%; }
.prog-warn { color: var(--warning-ink); }
.prog-pick-grid { width: 100%; }
.prog-pick { position: relative; }
.prog-pick__in {
  position: absolute;
  inset-block-start: 0.35rem;
  inset-inline-end: 0.35rem;
  min-width: 1.5rem;
  padding: 0 0.3rem;
  border-radius: var(--r-full);
  background: var(--success-btn);
  color: var(--success-on);
  font-size: var(--fs-xs);
  font-weight: 900;
  line-height: 1.5rem;
}
.prog-opts { width: 100%; display: flex; flex-direction: column; gap: var(--sp-3); text-align: start; }

/* The stage: between two games and the finale. */
.prog {
  --pg-gold: #fbbf24;
  --pg-green: #4ade80;
  --text: #f3f0ff;
  --text-strong: #ffffff;
  --text-2: #cfc6ee;
  --text-3: #a79fcb;
  --surface: rgba(255, 255, 255, 0.06);
  --surface-solid: #1d1733;
  --surface-2: rgba(255, 255, 255, 0.07);
  --surface-3: rgba(255, 255, 255, 0.1);
  --border: rgba(255, 255, 255, 0.12);
  --accent-ink: #fcd34d;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-3);
  border-radius: var(--r-2xl);
  background: radial-gradient(90% 60% at 50% -10%, rgba(124, 58, 237, 0.5), transparent 60%),
              radial-gradient(45% 45% at 100% 100%, rgba(245, 158, 11, 0.18), transparent 70%),
              linear-gradient(180deg, #1c1438, #0f0b1f);
  color: var(--text);
  box-shadow: var(--sh-3);
  overflow: hidden;
}
.prog-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.prog-pill {
  padding: 0.25rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: var(--fs-sm);
  font-weight: 700;
}
.prog-dots { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.prog-dot {
  width: 1.9rem;
  height: 1.9rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-2);
  font-size: 1.05rem;
  opacity: 0.55;
}
.prog-dot.is-done { opacity: 0.9; box-shadow: inset 0 0 0 2px var(--pg-green); }
.prog-dot.is-next { opacity: 1; box-shadow: inset 0 0 0 2px var(--pg-gold); animation: prog-glow 1.6s ease-in-out infinite; }
@keyframes prog-glow { 50% { transform: scale(1.12); } }
.prog-h { margin: 0; font: 900 var(--fs-h2) / 1.3 var(--font-display); color: var(--text-strong); }
.prog-last { margin: -0.4rem 0 0; font-size: var(--fs-sm); color: var(--text-2); }
.prog-grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); }
.prog-rows { display: flex; flex-direction: column; gap: 0.45rem; min-width: 0; }
.prog-trow {
  display: grid;
  grid-template-columns: 1.6rem 2.1rem minmax(0, 1fr) auto 4.2rem;
  align-items: center;
  gap: 0.55rem;
  padding: 0.5rem 0.65rem;
  border-radius: var(--r-lg);
  background: var(--surface-2);
}
.prog-trow--1 {
  background: linear-gradient(90deg, rgba(245, 184, 46, 0.12), rgba(245, 184, 46, 0.3));
  box-shadow: inset 0 0 0 2px rgba(245, 184, 46, 0.7);
}
html[dir="rtl"] .prog-trow--1 { background: linear-gradient(270deg, rgba(245, 184, 46, 0.12), rgba(245, 184, 46, 0.3)); }
.prog-trow__p { font-weight: 900; color: var(--text-2); text-align: center; font-size: 1.1rem; }
.prog-av {
  width: 2.1rem;
  height: 2.1rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-on);
  font: 800 1rem / 1 var(--font-display);
}
.prog-trow__name { min-width: 0; font-weight: 800; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-trow__w { font-size: var(--fs-xs); color: var(--text-3); text-align: center; line-height: 1.2; }
.prog-trow__w b { display: block; font-size: 1rem; color: var(--text-strong); }
.prog-trow__pts { text-align: center; line-height: 1.1; }
.prog-trow__pts b { display: block; font: 900 1.35rem / 1.1 var(--font-display); color: var(--text-strong); }
.prog-up { display: block; font-size: var(--fs-xs); font-weight: 900; color: var(--pg-green); }
.prog-lineup { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.45rem; }
.prog-lineup__row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.75rem;
  border-radius: var(--r-lg);
  background: var(--surface-2);
  font-weight: 800;
  color: var(--text-strong);
}
.prog-lineup__row .metric { color: var(--pg-gold); min-width: 1.2rem; text-align: center; }
.prog-lineup__icon { font-size: 1.4rem; line-height: 1; }
.prog-next {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  padding: var(--sp-4) var(--sp-3);
  border-radius: var(--r-xl);
  background: linear-gradient(160deg, var(--accent), var(--accent-hover, var(--accent)));
  color: #fff;
  text-align: center;
  box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.35);
}
.prog-next__lbl { font-size: var(--fs-sm); font-weight: 800; opacity: 0.9; }
.prog-next__art { font-size: 3.4rem; line-height: 1.1; filter: drop-shadow(0 0.3rem 0.6rem rgba(0, 0, 0, 0.35)); }
.prog-next__name { font: 900 var(--fs-h2) / 1.25 var(--font-display); }
.prog-next__sub { font-size: var(--fs-sm); opacity: 0.9; line-height: 1.45; }
.prog-next__foot { display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-top: 0.25rem; font-weight: 700; }
.prog-ring { position: relative; width: 3.4rem; height: 3.4rem; flex: none; }
.prog-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.prog-ring__bg { fill: none; stroke: rgba(255, 255, 255, 0.25); stroke-width: 3; }
.prog-ring__fg { fill: none; stroke: var(--pg-gold); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset 260ms linear; }
.prog-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 1.3rem / 1 var(--font-display); color: #fff; }
.prog-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
/* The lighter buttons, on the stage's dark ground in both themes. */
.prog .btn--secondary, .prog .btn--ghost {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.22);
  color: #fff;
  box-shadow: none;
}
.prog .btn--ghost { background: transparent; }
.prog-wait { margin: 0; text-align: center; color: var(--text-2); font-size: var(--fs-sm); }

/* The finale. */
.prog-fin-title { text-align: center; color: var(--text-2); font-weight: 700; font-size: var(--fs-sm); }
.prog-champ { text-align: center; font: 900 var(--fs-h1) / 1.25 var(--font-display); color: var(--pg-gold); text-shadow: 0 0.2rem 1rem rgba(245, 158, 11, 0.35); }
/* «السهرة بالأرقام» (7 Oct 2026, 780): the night counted up before the champion. */
.prog-stats { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0.25rem 0.5rem; text-align: center; font-weight: 700; color: var(--text); }
.prog-stat b { font-size: 1.25em; font-weight: 900; color: var(--pg-gold); }
.prog-stat__dot { color: var(--text-3); }
.prog-fresh .prog-stat { animation: prog-next-in 520ms cubic-bezier(0.2, 1.3, 0.35, 1) calc(var(--i, 0) * 260ms) both; }
.prog-fresh .prog-stats ~ .prog-champ { animation-delay: 1.5s; }
.prog-podium .podium { padding-top: 4.5rem; }
.prog-awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--sp-2); }
.prog-aw {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  font-size: var(--fs-xs);
  line-height: 1.45;
  color: var(--text-2);
}
.prog-aw b { color: var(--pg-gold); font-size: var(--fs-sm); }
.prog-aw strong { color: var(--text-strong); font-size: 1rem; }
.prog-fulltable summary { cursor: pointer; text-align: center; font-weight: 800; color: var(--text-2); padding: var(--sp-2); list-style: none; }
.prog-fulltable summary::-webkit-details-marker { display: none; }
.prog-fulltable[open] summary span { display: inline-block; transform: rotate(180deg); }

/* Motion: the rows come in one after another, ▲ +N pops, the award cards flip up. Once per card (prog-fresh). */
.prog-fresh .prog-trow, .prog-fresh .prog-lineup__row { animation: prog-row-in 420ms var(--ease-out, ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
.prog-fresh .prog-next { animation: prog-next-in 560ms cubic-bezier(0.2, 1.2, 0.35, 1) both 180ms; }
.prog-fresh .prog-up { animation: prog-up 520ms cubic-bezier(0.2, 1.5, 0.35, 1) both; animation-delay: calc(700ms + var(--i, 0) * 70ms); }
.prog-fresh .prog-champ { animation: prog-next-in 620ms cubic-bezier(0.2, 1.3, 0.35, 1) both; }
.prog-fresh .prog-aw { animation: prog-aw-in 520ms cubic-bezier(0.2, 1.2, 0.35, 1) both; animation-delay: calc(2400ms + var(--i, 0) * 220ms); }
@keyframes prog-row-in { from { opacity: 0; transform: translateY(0.6rem); } }
@keyframes prog-next-in { from { opacity: 0; transform: scale(0.85); } }
@keyframes prog-up { from { opacity: 0; transform: translateY(0.4rem) scale(0.6); } }
@keyframes prog-aw-in { from { opacity: 0; transform: perspective(40rem) rotateX(55deg) translateY(0.8rem); } }

/* A phone on its side and wider: the table beside the next game. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  .prog-grid { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }
  .prog-awards { grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .prog { padding: var(--sp-3); gap: var(--sp-2); }
  .prog-next { padding: var(--sp-3) var(--sp-2); }
  .prog-next__art { font-size: 2.4rem; }
}

/* The TV: the same card, as big as the screen. */
.tv-stage > .prog--tv { flex: 1 1 auto; }
.prog--tv {
  gap: 2vmin;
  padding: 2.4vmin 3vmin;
  border-radius: var(--tv-r);
  font-size: var(--tv-sm);
}
.prog--tv .prog-pill { font-size: var(--tv-xs); padding: 0.5vmin 1.6vmin; }
.prog--tv .prog-dot { width: 4.4vmin; height: 4.4vmin; font-size: 2.4vmin; }
.prog--tv .prog-h { font-size: var(--tv-lg); }
.prog--tv .prog-last { font-size: var(--tv-xs); margin: -1vmin 0 0; }
.prog--tv .prog-grid { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 2.6vmin; flex: 1 1 auto; min-height: 0; align-items: stretch; }
.prog--tv .prog-rows { gap: 1.1vmin; }
.prog--tv .prog-trow { grid-template-columns: 4vmin 5.4vmin minmax(0, 1fr) 11vmin 11vmin; gap: 1.4vmin; padding: 1vmin 1.6vmin; border-radius: 1.6vmin; }
.prog--tv .prog-trow__p { font-size: 3vmin; }
.prog--tv .prog-av { width: 5.2vmin; height: 5.2vmin; font-size: 2.4vmin; }
.prog--tv .prog-trow__name { font-size: 3vmin; }
.prog--tv .prog-trow__w { font-size: 1.8vmin; }
.prog--tv .prog-trow__w b { font-size: 3vmin; }
.prog--tv .prog-trow__pts b { font-size: 3.6vmin; }
.prog--tv .prog-up { font-size: 1.9vmin; }
.prog--tv .prog-lineup__row { font-size: 3vmin; padding: 1.2vmin 1.8vmin; gap: 1.4vmin; }
.prog--tv .prog-lineup__icon { font-size: 4vmin; }
.prog--tv .prog-next { padding: 3vmin 2vmin; gap: 1vmin; justify-content: center; border-radius: 2vmin; }
.prog--tv .prog-next__lbl { font-size: 2.2vmin; }
.prog--tv .prog-next__art { font-size: 13vmin; }
.prog--tv .prog-next__name { font-size: 4.6vmin; }
.prog--tv .prog-next__sub { font-size: 2.2vmin; }
.prog--tv .prog-next__foot { font-size: 2.2vmin; gap: 1.6vmin; }
.prog-ring--big { width: 10vmin; height: 10vmin; }
.prog-ring--big b { font-size: 4.4vmin; }
.prog--tv .prog-wait { font-size: var(--tv-xs); }
.prog--tv .prog-fin-title { font-size: var(--tv-sm); }
.prog--tv .prog-champ { font-size: var(--tv-xl); }
.prog--tv .prog-stats { font-size: var(--tv-md); gap: 0.6vmin 1.6vmin; }
.prog--tv .prog-podium { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.prog--tv .prog-podium .podium { zoom: 1.6; padding-top: 3.5rem; }
.prog--tv .prog-awards { grid-template-columns: repeat(auto-fit, minmax(22vmin, 1fr)); gap: 1.4vmin; }
.prog--tv .prog-aw { font-size: 1.8vmin; padding: 1.2vmin 1.4vmin; border-radius: 1.6vmin; }
.prog--tv .prog-aw b { font-size: 2.2vmin; }
.prog--tv .prog-aw strong { font-size: 2.8vmin; }
@media (max-height: 800px) { .prog--tv .prog-podium .podium { zoom: 1.25; } }

/* The pill over the room's screens: where the program is, and the host's ⏭ ⏸. */
.prog-bar {
  position: fixed;
  z-index: var(--z-float-hi);
  top: calc(var(--safe-top) + var(--header-h) + var(--sp-2));
  inset-inline-start: var(--sp-3);
  max-width: calc(100vw - var(--sp-6));
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.25rem 0.35rem 0.25rem 0.75rem;
  border: 1px solid rgba(251, 191, 36, 0.55);
  border-radius: var(--r-full);
  background: linear-gradient(135deg, #2a2150, #151126);
  color: #f3f0ff;
  box-shadow: var(--sh-2);
  font: 700 var(--fs-sm) / 1.3 var(--font);
  animation: turnIn var(--dur-3) var(--ease-spring);
}
html[dir="rtl"] .prog-bar { padding: 0.25rem 0.75rem 0.25rem 0.35rem; }
.prog-bar[hidden] { display: none; }
.prog-bar__moon { font-size: 1rem; }
.prog-bar__n { color: #fbbf24; font-weight: 900; }
.prog-bar__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-bar__text b { color: #fbbf24; }
.prog-bar__btn {
  min-width: 2.25rem;
  min-height: 2.25rem;
  padding: 0 0.5rem;
  border: 0;
  border-radius: var(--r-full);
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font: 800 var(--fs-sm) / 1 var(--font);
  cursor: pointer;
}
.prog-bar__btn::before { content: ''; position: absolute; inset: -0.35rem; }
.prog-bar__btn { position: relative; }
.prog-bar__btn--wide { white-space: nowrap; }
body.room-host-away .prog-bar, body.room-offline .prog-bar { top: calc(var(--safe-top) + var(--header-h) + var(--sp-2) + 2.4rem); }
body .prog-bar.prog-bar--tv, body.room-host-away .prog-bar.prog-bar--tv, body.room-offline .prog-bar.prog-bar--tv { top: auto; bottom: calc(var(--safe-bottom) + 1.4vmin); inset-inline-start: auto; inset-inline-end: 2vmin; font-size: 2vmin; padding: 0.6vmin 1.6vmin; }
.prog-bar--tv .prog-bar__btn { min-width: 5vmin; min-height: 5vmin; font-size: 2.2vmin; }
@media (prefers-reduced-motion: reduce) {
  .prog-bar, .prog-dot.is-next, .prog-fresh .prog-trow, .prog-fresh .prog-lineup__row, .prog-fresh .prog-next,
  .prog-fresh .prog-up, .prog-fresh .prog-champ, .prog-fresh .prog-aw, .prog-fresh .prog-stat { animation: none !important; }
  .prog-ring__fg, .prog-row, .prog-door { transition: none !important; }
}
/* The program's result pause: a game's own «العب تاني» / «التالي» would only be refused
   («البرنامج هيكمّل لوحده»), so they're hidden while it lasts (body.prog-result, JS_Room.html). */
body.prog-result :is([onclick*="'playAgain'"], [onclick*="'restart'"], [onclick*="'tourNew'"],
  [onclick*="'nextRound'"], [onclick*="'nextQuestion'"], [onclick*="'nextGame'"]) { display: none; }

/* ===== «الشلة» (THE CREW): JS_CrewCore.html, JS_Crew.html =====
   Look ج «كارنيه النادي» (notes/archive/sheets/next-level-looks.html): a membership card on top,
   four tabs under it; the month opens on the podium of the cast figures. Built on
   the app's tokens; the card's gold chip and the podium's steps keep their metals
   in both themes. */
.crew-page { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 36rem; margin-inline: auto; width: 100%; }
.crew-switch { margin: 0; }

/* The membership card. */
.crew-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  width: 100%;
  aspect-ratio: 1.6;
  max-height: 15rem;
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border: 0;
  border-radius: var(--r-2xl);
  overflow: hidden;
  color: #ffffff;
  text-align: start;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #12052e), var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, #ffffff));
  box-shadow: var(--poster-shadow);
  cursor: pointer;
  font: inherit;
}
.crew-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0 10px, transparent 10px 22px);
  pointer-events: none;
}
.crew-card > * { position: relative; }
.crew-card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); }
.crew-card__brand { font-size: var(--fs-xs); font-weight: 700; opacity: 0.85; }
.crew-card__name { font-family: var(--font-display); font-weight: 900; font-size: 1.45rem; line-height: 1.3; overflow-wrap: anywhere; }
.crew-card__season { font-size: var(--fs-sm); opacity: 0.9; margin-top: 2px; }
.crew-card__chip { flex: none; width: 2.4rem; height: 1.75rem; border-radius: 0.4rem; background: linear-gradient(135deg, #f5b82e, #c98a0b); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }
.crew-card__mid { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: var(--sp-2); }
.crew-card__code small { display: block; font-size: var(--fs-xs); opacity: 0.8; }
.crew-card__codev { font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; letter-spacing: 0.08em; }
.crew-card__faces { display: flex; padding-inline-start: 0.5rem; }
.crew-card__faces .crew-av { margin-inline-start: -0.5rem; border: 2px solid rgba(255, 255, 255, 0.92); }
.crew-card--ghost { cursor: default; opacity: 0.9; transform: rotate(-3deg); max-width: 18rem; margin-inline: auto; }
.crew-card--in { animation: crew-card-in 520ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
@keyframes crew-card-in {
  from { opacity: 0; transform: translateY(14px) rotate(-2deg) scale(0.96); }
  to { opacity: 1; transform: none; }
}

/* The faces: a letter on a colour (the same hue for a name everywhere). */
.crew-av {
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  font-weight: 800;
  font-size: var(--fs-sm);
  color: #ffffff;
  background: #7c3aed;
}
/* A shade darker than they were, so the white initial reads (4.5:1 or more; the UI pass of 4 Oct 2026). */
.crew-av--c0 { background: #7c3aed; } .crew-av--c1 { background: #0369a1; } .crew-av--c2 { background: #be185d; }
.crew-av--c3 { background: #15803d; } .crew-av--c4 { background: #c2410c; } .crew-av--c5 { background: #0f766e; }
.crew-av--more { background: rgba(255, 255, 255, 0.28); font-size: var(--fs-xs); }
.crew-av--s { width: 1.75rem; height: 1.75rem; font-size: var(--fs-xs); }
.crew-av--xs { width: 1.35rem; height: 1.35rem; font-size: 0.625rem; }

.crew-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.crew-actions .btn { min-width: 0; padding-inline: var(--sp-2); }
.crew-actions .btn--primary { grid-column: 1 / -1; }
.crew-tabs .segmented__item { white-space: nowrap; }
.crew-pane { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 8rem; }

/* الشهر: the podium's steps in gold, silver and bronze, as on the look. */
.crew-podium { margin-top: var(--sp-2); }
.crew-podium .podium__place--rank1 .podium__block { background: linear-gradient(180deg, #f5b82e, #c98a0b); color: #1c1200; }
.crew-podium .podium__place--rank2 .podium__block { background: linear-gradient(180deg, #b8bfd0, #8a93a8); color: #ffffff; border-color: transparent; }
.crew-podium .podium__place--rank3 .podium__block { background: linear-gradient(180deg, #d38a55, #a3602f); color: #ffffff; border-color: transparent; }
.crew-podium .podium__score { font-size: var(--fs-sm); }
.crew-podium__pts { font-size: var(--fs-xs); color: var(--text-3); font-weight: 700; }
.crew-table { padding: var(--sp-1) var(--sp-3); }
.crew-row {
  display: grid;
  grid-template-columns: 1.5rem auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  border-bottom: 1px solid var(--hairline);
}
.crew-row:last-child { border-bottom: 0; }
.crew-row__n { color: var(--text-3); font-weight: 800; text-align: center; }
.crew-row__who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; color: var(--text-strong); }
.crew-row__stat { text-align: end; white-space: nowrap; }
.crew-row__stat b { font-family: var(--font-display); font-weight: 900; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.crew-row__stat small { color: var(--text-3); font-size: var(--fs-xs); }
.crew-row.is-you .crew-row__who { color: var(--accent-ink); }
.crew-hint { margin: 0; font-size: var(--fs-xs); color: var(--text-3); text-align: center; }
.crew-note {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: var(--fs-sm);
}
.crew-note__icon { font-size: 1.5rem; }
.crew-peek { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.crew-peek__c {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 5.5rem;
  padding: var(--sp-2) var(--sp-1);
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--hairline);
  text-align: center;
  font: inherit;
  font-size: var(--fs-xs);
  color: var(--text-2);
  cursor: pointer;
  min-width: 0;
}
.crew-peek__c b { font-family: var(--font-display); font-size: var(--fs-sm); color: var(--text-strong); }
.crew-peek__c > span:last-child { overflow-wrap: anywhere; }
.crew-peek__e { font-size: 1.2rem; }

/* الأبطال: the wall, a frame a month. */
.crew-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: var(--sp-2); }
.crew-champ {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-1);
  padding: var(--sp-3) var(--sp-2);
  border-radius: var(--r-lg);
  text-align: center;
  background: linear-gradient(160deg, color-mix(in srgb, #f5b82e 18%, var(--surface-solid)), var(--surface-solid));
  border: 1px solid color-mix(in srgb, #c98a0b 35%, transparent);
  box-shadow: var(--sh-2);
}
.crew-champ__cup { font-size: 1.8rem; }
.crew-champ__month { font-family: var(--font-display); font-weight: 900; color: var(--text-strong); }
.crew-champ__names { font-weight: 700; color: var(--text); overflow-wrap: anywhere; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.crew-champ__stat { font-size: var(--fs-xs); color: var(--text-3); }

/* الألقاب: a card a title, then the records as rows. */
.crew-titles { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: var(--sp-2); }
.crew-title {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: var(--sp-3);
  border-radius: var(--r-lg);
  background: var(--accent-soft);
  color: var(--accent-ink);
  transform: rotate(-1deg);
}
.crew-title:nth-child(even) { transform: rotate(1deg); }
.crew-title__e { font-size: 1.5rem; }
.crew-title__name { font-family: var(--font-display); font-size: 1rem; }
.crew-title__who { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--text-strong); overflow-wrap: anywhere; }
.crew-title__why { color: var(--text-2); font-size: var(--fs-xs); }
.crew-sub { margin-top: var(--sp-2); }
.crew-records { padding: var(--sp-1) var(--sp-3); }
.crew-rec { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-2); min-height: var(--tap); border-bottom: 1px solid var(--hairline); padding-block: 6px; }
.crew-rec:last-child { border-bottom: 0; }
.crew-rec__e { font-size: 1.3rem; }
.crew-rec__what { display: flex; flex-direction: column; font-weight: 700; color: var(--text-strong); min-width: 0; }
.crew-rec__what small { font-weight: 500; color: var(--text-3); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.crew-rec__v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 900; color: var(--accent-ink); font-variant-numeric: tabular-nums; }

/* السهرات: a card a night. */
.crew-nights { display: flex; flex-direction: column; gap: var(--sp-2); }
.crew-night { padding: var(--sp-3); border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--hairline); box-shadow: var(--sh-1); display: flex; flex-direction: column; gap: var(--sp-2); }
.crew-night__head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.crew-night__date { font-family: var(--font-display); font-weight: 800; color: var(--text-strong); }
.crew-night__win { font-weight: 800; color: var(--accent-ink); font-size: var(--fs-sm); }
.crew-night__games { display: flex; flex-wrap: wrap; gap: 6px; }
.crew-night__game { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border-radius: var(--r-full); background: var(--surface-2); font-size: var(--fs-xs); color: var(--text-2); }
.crew-night__game .art-icon, .crew-night__game > :first-child { font-size: 1rem; }
.crew-night__top { display: flex; flex-wrap: wrap; gap: 4px var(--sp-3); font-size: var(--fs-sm); color: var(--text); }
.crew-night__who.is-guest { color: var(--text-3); }
.crew-night__who small { font-size: var(--fs-xs); }

/* The empty page: a ghost card, what it is, two ways in. */
.crew-empty { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-3); max-width: 28rem; margin-inline: auto; text-align: center; padding-top: var(--sp-3); }
.crew-empty__title { margin: var(--sp-2) 0 0; font-family: var(--font-display); font-size: 1.35rem; color: var(--text-strong); }
.crew-empty__text { margin: 0; color: var(--text-2); }

/* The sheet: the join's «إنت مين فيهم؟», the members, the invite. */
.crew-sheet .field { display: flex; flex-direction: column; gap: 6px; }
.crew-codein { text-transform: uppercase; letter-spacing: 0.15em; text-align: center; font-weight: 800; }
.crew-codein::placeholder { letter-spacing: normal; text-transform: none; } /* as .qm-code-in's (4 Oct 2026) */
.crew-who { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); max-height: 14rem; overflow: auto; }
.crew-who__m {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 4px 14px 4px 6px;
  border-radius: var(--r-full);
  border: 1px solid var(--border);
  background: var(--surface-solid);
  color: var(--text-strong);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.crew-who__m.is-guess { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.crew-new { display: flex; flex-direction: column; gap: var(--sp-2); }
.crew-new > summary { list-style: none; }
.crew-new > summary::-webkit-details-marker { display: none; }
.crew-new[open] { gap: var(--sp-2); }
.crew-new[open] > summary { display: none; }
.crew-new[open] > .field, .crew-new[open] > .btn { margin-top: var(--sp-2); }
.crew-mems { max-height: 20rem; overflow: auto; }
.crew-mem { display: flex; align-items: center; gap: var(--sp-2); min-height: 3rem; border-bottom: 1px solid var(--hairline); }
.crew-mem:last-child { border-bottom: 0; }
.crew-mem__name { flex: 1; min-width: 0; font-weight: 700; color: var(--text-strong); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; overflow-wrap: anywhere; }
.crew-mem__acts { display: flex; gap: 4px; }
.crew-mem__acts .iconbtn { width: 2.5rem; height: 2.5rem; }
.crew-invite__code { font-family: var(--font-display); font-weight: 900; font-size: 2rem; letter-spacing: 0.15em; color: var(--accent-ink); text-align: center; }
.crew-qr { max-width: 12rem; margin-inline: auto; }
.crew-picks { display: flex; flex-direction: column; gap: var(--sp-2); }
.crew-pick {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 3rem;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface-solid);
  color: var(--text-strong);
  font: inherit;
  font-weight: 700;
  text-align: start;
  cursor: pointer;
}
.crew-pick.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.crew-pick__name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.crew-pick__on { font-weight: 900; }

/* The room: the lobby's line, and the guest's offer under the night's board. */
.crew-lobby {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: var(--tap);
  margin-bottom: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-lg);
  border: 1px dashed var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  font: inherit;
  font-weight: 700;
  text-align: start;
  cursor: pointer;
}
.crew-lobby.is-on { border-style: solid; border-color: color-mix(in srgb, #7c3aed 40%, transparent); background: color-mix(in srgb, #7c3aed 10%, var(--surface-solid)); color: var(--text-strong); }
.crew-lobby--guest { cursor: default; }
.crew-lobby__text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.crew-offer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--r-lg);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 700;
}
.crew-offer__text { flex: 1 1 12rem; min-width: 0; }
.crew-offer__icon { font-size: 1.4rem; }

/* The مع بعض tab's door. */
.crew-door { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); margin-block: var(--sp-3); text-align: start; }
button.crew-door { width: 100%; border: 1px solid var(--border); font: inherit; cursor: pointer; background: var(--surface); }
.crew-door__icon { font-size: 1.9rem; flex: none; }
.crew-door__text { flex: 1 1 12rem; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.crew-door__eyebrow { font-size: var(--fs-xs); color: var(--text-3); font-weight: 700; }
.crew-door__more { color: var(--accent-ink); }
.crew-door__title { font-family: var(--font-display); font-weight: 900; color: var(--text-strong); overflow-wrap: anywhere; }
.crew-door__sub { font-size: var(--fs-sm); color: var(--text-2); }
.crew-door__btns { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.crew-door__chev { color: var(--text-3); font-size: 1.4rem; }
html[dir="ltr"] .crew-door__chev { transform: scaleX(-1); }

/* The links (30 Sep 2026): the crew's quizzes and words under the card, a night that was a program. */
.crew-packs { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--hairline); box-shadow: var(--sh-1); }
.crew-packs__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
