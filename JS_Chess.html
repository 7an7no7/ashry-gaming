/* --- your rating against the computer (the owner, 24 Sep 2026) ---------------------------------
   A normal Elo from 800: K 32 for the first 20 rated games, then 20, against the computer's
   rating. Only a game with no help counts: no undo, no hint, no best-move arrows, no coach
   warning, not from a set-up position, no handicap. Leaving a rated game unfinished for a new
   one counts it as a loss (chess.com's rule). */

const CH_RATING_START = 800;

/** The change to a rating r (after n rated games) from a score (1, 0.5, 0) against a rating opp. */
function chRatingDelta(r, n, opp, score) {
  const expected = 1 / (1 + Math.pow(10, (opp - r) / 400));
  return Math.round((n < 20 ? 32 : 20) * (score - expected));
}

/** Why a game with these settings would not count ('' when it would): a translation key. o: { setup, practice }. */
function chUnratedReason(s, o) {
  const x = o || {};
  if (s.vs !== 'phone') return 'ch_unrated_friend';
  if (x.practice) return 'ch_unrated_practice';
  if (x.setup) return 'ch_unrated_setup';
  if (s.variant === 'hq') return 'ch_unrated_hq';
  if (s.helpLimit !== 'none') return 'ch_unrated_help';
  if (s.coach && s.coachOpts.warn !== false) return 'ch_unrated_warn';
  if (s.coach && s.coachOpts.best) return 'ch_unrated_best';
  if (!x.setup && !x.practice && chOddsNow(s) !== 'none') return 'ch_unrated_odds';
  return '';
}

/** Was any help used in this game? */
const chHelpUsed = (h) => !!h && !!(h.undo || h.hint || h.best || h.warn || h.setup || h.odds);

/** The computer's rating in this game (kept at its start, so the setup changed meanwhile doesn't count). */
const chOppElo = (s) => (s.opp && s.opp.elo) || s.elo;

/** A rated game against the computer going on, with a move of yours in it: leaving it counts as a loss. */
const chRatedPending = (s) => !!(s.g && s.phase === 'play' && s.rated && !s.practice && s.hist && chMyMoves(s) >= 1);

/** The game ends as a loss for you (a new game started over a rated one). */
function chAbandonLocal() {
  const s = chState();
  if (!chRatedPending(s)) return;
  const vs = s.vs;
  s.vs = 'phone';
  chEnd(s, s.me === 0 ? 'b' : 'w', 'left');
  s.vs = vs;
  saveToLocal();
}

/** Before a new game replaces the one on the board: a rated game left unfinished asks first, then counts as a loss. */
function chConfirmReplace(go) {
  const s = chState();
  if (!chRatedPending(s)) { go(); return; }
  showConfirmModal(chT('ch_rated_abandon'), () => { chAbandonLocal(); go(); });
}

/** A rating change as "+12" / "−8" (the caller holds it left to right). */
const chDeltaText = (d) => (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d);

/* --- undo and hints against the computer: unlimited, 3 a game or none (the owner, 24 Sep 2026) --- */

const CH_HELP_LIMITS = ['unlimited', '3', 'none'];

/** What a game has used: undos and hints counted, the rest as flags (the kept record carries it). */
const chHelpNew = (o) => Object.assign({ undo: 0, hint: 0, best: false, warn: false, setup: false, odds: false }, o || {});

/** How many undos or hints are left in this game (Infinity when unlimited, 0 when none). */
function chHelpLeft(s, kind) {
  if (s.vs !== 'phone') return 0;
  const lim = s.gameHelp || s.helpLimit || '3';
  if (lim === 'unlimited') return Infinity;
  if (lim === 'none') return 0;
  return Math.max(0, Number(lim) - ((s.help && s.help[kind]) || 0));
}

/** Your moves so far against the computer. */
const chMyMoves = (s) => (s.me === 0 ? Math.ceil(s.hist.length / 2) : Math.floor(s.hist.length / 2));

/** Can ↶ be pressed now: against the computer, a game going on, a move of yours to take back, one left. */
const chCanUndo = (s) => s.vs === 'phone' && s.phase === 'play' && !chLocal.pending && chMyMoves(s) >= 1 && chHelpLeft(s, 'undo') > 0;

/** The game again from its start and the moves in `hist`: the position (repetition keys too), the moves, what was taken. */
function chRebuildLocal(s, hist) {
  const h = chHqOf(s);
  if (h) {
    // The hidden queen's game: its picks and its moves again, the secret following them.
    const r = chessHqReplay(s.start, h.pick, hist);
    const lostH = s.lostStart ? [s.lostStart[0].slice(), s.lostStart[1].slice()] : [[], []];
    r.lost.forEach((l, k) => l.forEach(x => lostH[k].push(x)));
    const n = r.infos.length;
    const li = r.last;
    s.g = r.g; s.hq = r.h; s.hist = hist.slice(0, n); s.sans = r.sans; s.lost = lostH;
    s.last = li ? { from: li.from, to: li.to, capture: li.capture, captureSq: li.captureSq, castle: li.castle, promo: li.promo, check: li.check, n: n,
      hq: li.hq && (li.hq.reveal || li.hq.captured) ? { reveal: li.hq.reveal, captured: li.hq.captured, by: r.g.turn ^ 1 } : undefined } : null;
    return;
  }
  const g = s.start ? chessFromFen(s.start) : chessNew();
  const lost = s.lostStart ? [s.lostStart[0].slice(), s.lostStart[1].slice()] : [[], []];
  const kept = [], sans = [];
  let last = null;
  for (let k = 0; k < hist.length; k++) {
    const mover = g.turn;
    const info = chessPlay(g, chessFromUci(hist[k]));
    if (!info) break;
    kept.push(hist[k]);
    sans.push(info.san);
    if (info.capture) lost[1 - mover].push(info.capture);
    last = { from: info.from, to: info.to, capture: info.capture, captureSq: info.captureSq, castle: info.castle, promo: info.promo, check: info.check, n: kept.length };
  }
  s.g = g; s.hist = kept; s.sans = sans; s.lost = lost; s.last = last;
}

/** ↶: your last move and the computer's answer taken back (only yours while it is still thinking). */
function chUndoLocal() {
  const s = chState();
  if (!chCanUndo(s)) return;
  chStopTimers();
  if (s.clk && s.clk.at) { const side = s.g.turn; s.clk.left[side] = Math.max(0, chessClockLeft(s.clk, side, side, Date.now())); s.clk.at = null; }
  const back = s.g.turn === s.me ? 2 : 1;
  chRebuildLocal(s, s.hist.slice(0, Math.max(0, s.hist.length - back)));
  s.help.undo++;
  s.comment = null;
  chLocal.sel = '';
  chLocal.hint = null;
  chLocal.pre = null; chLocal.presel = '';
  saveToLocal();
  haptic('light');
  chPaint({ still: true });
  chAfterMove();
}

/* --- Chess960, the handicap and the clocks on one phone (the owner, 24 Sep 2026) -------------
   960 draws a new start every game (chess960Random); the handicap takes a piece off the giver's
   side (chessHandicapFen, or the same rule on a 960 row) or gives them half the clock. Against the
   computer you choose who gives it; two on one phone, White or Black. A handicap is never rated;
   960 is. */

const CH_ODDS = ['none', 'pawn', 'knight', 'rook', 'queen', 'time'];

/** The handicap a new game would really get: half the time needs a clock. */
const chOddsNow = (s) => (chHqChosen(s) || (s.odds === 'time' && chessClockId(s.clock) === 'off') ? 'none' : (CH_ODDS.indexOf(s.odds) === -1 ? 'none' : s.odds));

/* --- الوزير المستخبي on one phone: against the computer only (the owner, 24 Sep 2026) ---------
   Two on one phone can't hide a secret, so the choice isn't offered there (a phone that had it
   chosen plays standard). Never rated, and no handicap with it. You pick a pawn before the first
   move (the computer picks at random); s.hq is the secret of both sides (Chess.js's chessHqNew),
   kept on this phone - the computer's own is read only by its search, never shown. */

/** Is the hidden queen what a new game from the setup would be? */
const chHqChosen = (s) => s.variant === 'hq' && s.vs === 'phone';

/** The hidden queen's secret of the game on the board (null in any other game). */
const chHqOf = (s) => (s.gameVariant === 'hq' && s.hq && Array.isArray(s.hq.sq) ? s.hq : null);

/** Still picking your pawn? */
const chHqPicking = (s) => { const h = chHqOf(s); return !!h && s.phase === 'play' && h.pick[s.me] < 0; };

/** Your hidden queen's square ('' once it is gone, or in another game). */
const chHqMine = (s) => { const h = chHqOf(s); return h && h.sq[s.me] >= 0 ? chSqName(h.sq[s.me]) : ''; };

/** The pick: your pawn becomes the hidden queen, and the game begins (the computer as White moves first). */
function chHqPickLocal(sq) {
  const s = chState();
  const h = chHqOf(s);
  if (!h || !chHqPicking(s) || !chessHqPick(h, s.g, s.me, sq)) return;
  chLocal.hqSel = '';
  saveToLocal();
  haptic('medium');
  chSound('hint');
  chPaint();
  chAfterMove();
}

/** A tap while picking: a pawn of yours is chosen, a second tap on it (or the button) confirms. */
function chHqTapLocal(sq, fromDrag) {
  const s = chState();
  const i = chSqIndex(sq);
  if (!chHqPicking(s) || i < 0 || s.g.board[i] !== ((s.me << 3) | 1)) { if (chLocal.hqSel) { chLocal.hqSel = ''; chPaint(); } return false; }
  if (chLocal.hqSel === sq) { if (!fromDrag) chHqPickLocal(sq); return false; }
  chLocal.hqSel = sq;
  chSound('pick');
  chPaint();
  return false;
}

/** The words of a hidden queen's moment: its reveal, or its capture while still hidden. */
const chHqWord = (kind) => chT(kind === 'captured' ? 'ch_hq_was' : 'ch_hq_reveal');

/**
 * The moment on the board (every screen): the pawn turning into a queen, or a hidden one taken, with
 * the words over the board once the move has landed. Played once per move (motionFirst on `key`), so a
 * redraw doesn't replay it; the move list and the status keep the words.
 */
function chHqMoment(kind, key) {
  const root = chView.root;
  if (!root || typeof motionFirst !== 'function' || !motionFirst('chhq|' + key)) return;
  setTimeout(() => {
    if (!chView.root || !chView.root.isConnected) return;
    const el = document.createElement('div');
    el.className = 'ch-hq-pop' + (kind === 'captured' ? ' ch-hq-pop--was' : '');
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<span>${escapeHTML(chHqWord(kind))}</span>`;
    chView.root.appendChild(el);
    chSound('hint');
    if (typeof haptic === 'function') haptic('double');
    setTimeout(() => el.remove(), 2000);
  }, chViewBusyLeft() + 120);
}

/** The end: which pawn each side had picked, and what became of it («الأبيض: e2 · اتكشف»). ends: [{ pick, how, at }]. */
function chHqEndHtml(ends, names) {
  if (!ends || !ends.some(e => e && e.pick)) return '';
  const row = (e, k) => {
    if (!e || !e.pick) return '';
    const how = chT('ch_hq_how_' + (e.how || 'hidden'), { sq: e.at || e.pick });
    return `<span class="ch-hqend__row"><span class="ch-mark ${k ? 'is-dark' : 'is-light'}" aria-hidden="true">${chPieceSvg(1 | (k ? 8 : 0))}</span><bdi>${escapeHTML(names[k] || '')}</bdi> <b dir="ltr">${escapeHTML(e.pick)}</b> · ${escapeHTML(how)}</span>`;
  };
  return `<p class="ch-hqend">👑 ${escapeHTML(chT('ch_hq_end'))}</p><div class="ch-hqend__list">${row(ends[0], 0)}${row(ends[1], 1)}</div>`;
}

/** The one-phone game's secrets at the end, as the room shows them. */
function chHqLocalEnds(h) {
  return [0, 1].map(c => ({
    pick: h.pick[c] >= 0 ? chSqName(h.pick[c]) : '',
    how: h.pick[c] >= 0 ? (h.how[c] || 'hidden') : '',
    at: h.sq[c] >= 0 ? chSqName(h.sq[c]) : (h.at[c] >= 0 ? chSqName(h.at[c]) : '')
  }));
}

/** The move's animation for a board: a reveal draws as the pawn becoming a queen (a promotion's pop). */
const chAnimOf = (last, key, still) => (last ? Object.assign({ key: key, still: !!still }, last, last.hq && last.hq.reveal ? { promo: 'q' } : {}) : null);

/** The colour that gives the handicap (0 White, 1 Black): you or the computer; two on one phone, as chosen. */
const chOddsGiver = (s, me) => (s.vs === 'phone' ? (s.oddsBy === 'cpu' ? 1 - me : me) : (s.oddsColor === 'b' ? 1 : 0));

/**
 * The start without the giver's piece: the standard start through chessHandicapFen; a 960 row the same
 * way - the f-pawn, the knight, the rook or the queen nearest the a-file (castling that side lost with it).
 */
function chOddsFen(fen, kind, side) {
  // One copy of the rule, in Chess.js, so a room's server takes the same piece (a truthy side is Black here).
  return chessOddsFen(fen, kind, side ? 1 : 0);
}

/** Is this a 960 game (castling rooks or king off their standard files)? */
function chIs960(g) {
  const r = g && g.rooks;
  if (r && (r[0] !== 7 || r[1] !== 0 || r[2] !== 7 || r[3] !== 0)) return true;
  const wk = g ? g.board.indexOf(6) : -1, bk = g ? g.board.indexOf(14) : -1;
  return !!g && !!g.castle && ((g.castle & 3 && wk !== 4) || (g.castle & 12 && bk !== 60));
}

/** Castling by the king picked up and its own rook (960: "king takes own rook"), if legal here. */
function chCastleByRook(g, kingSq, rookSq) {
  const ki = chSqIndex(kingSq), ri = chSqIndex(rookSq);
  if (ki < 0 || ri < 0 || (g.board[ki] & 7) !== 6 || (g.board[ri] & 7) !== 4 || (g.board[ki] >> 3) !== (g.board[ri] >> 3)) return false;
  const m = chessFind(chessPos(g), { from: ki, to: ri });
  return !!m && !!(chessMFlags(m) & CHESS_F_CASTLE);
}

/**
 * The castling rook's two squares, as indices [from, to] (-1s when it didn't move): the rook that went
 * to f or d is the one of that colour, beyond the king on that side, no longer where it was.
 * before(i): the piece on square i before the move; after: the board after it.
 */
function chCastleRookSquares(a, before, after) {
  const from = chSqIndex(a.from), to = chSqIndex(a.to);
  if (from < 0 || to < 0 || !a.castle || !after) return [-1, -1];
  const rank = to & 56, short = a.castle === 'short';
  const rt = rank + (short ? 5 : 3);
  const rook = after[rt];
  if ((rook & 7) !== 4) return [-1, -1];
  for (let f = 0; f < 8; f++) {
    const i = rank + f;
    if (before(i) !== rook || (short ? f <= (from & 7) : f >= (from & 7))) continue;
    if (i === rt) return [-1, -1];
    if (after[i] !== rook) return [i, rt];
  }
  return [-1, -1];
}

/** The tags over the one-phone board: 960, and the handicap with who gives it. */
function chLocalTagHtml(s, names) {
  const tags = [];
  if (s.gameVariant === '960') tags.push(`<p class="ch-tag ch-tag--960">🎲 ${escapeHTML(chT('ch_pill_960'))}</p>`);
  if (s.gameVariant === 'hq') tags.push(`<p class="ch-tag ch-tag--hq">👑 ${escapeHTML(chT('ch_var_hq'))}</p>`);
  const o = s.gameOdds;
  if (o && o.kind && o.kind !== 'none') {
    const label = o.kind === 'time' ? chT('ch_pill_odds_time') : chT('ch_pill_odds', { piece: chT('ch_odds_' + o.kind) });
    tags.push(`<p class="ch-tag ch-tag--odds">⚖️ ${escapeHTML(label)} · <bdi>${escapeHTML(names[o.giver] || '')}</bdi></p>`);
  }
  return tags.length ? `<div class="ch-tags">${tags.join('')}</div>` : '';
}

function setupShatranj() {
  chStopTimers();
  setView('setup-shatranj');
  paintShatranjSetup();
}

/** The names on each side: [White's, Black's]. Against the computer, you and "the computer (1200)". */
function chNames(s) {
  if (s.vs === 'phone') {
    const you = chT('xo_you');
    const cpu = s.opp && s.opp.char ? chT('ch_char_' + s.opp.char) : chT('ch_cpu', { elo: chOppElo(s) });
    return s.me === 0 ? [you, cpu] : [cpu, you];
  }
  const n = s.names || [];
  const p1 = n[0] || chT('ch_player1'), p2 = n[1] || chT('ch_player2');
  return s.firstWhite === 0 ? [p1, p2] : [p2, p1];
}

function chEloLabel(elo) {
  return elo + ' · ' + chT('ch_band_' + chessEloBand(elo));
}

function paintShatranjSetup() {
  const s = chState();
  // A "try the better move" game played against the computer is over: the setup is as it was chosen.
  if (s.vsBefore && !(s.practice && s.phase === 'play')) { s.vs = s.vsBefore; s.vsBefore = null; saveToLocal(); }
  duelPaintSegmented('shatranj-vs', s.vs);
  duelPaintSegmented('shatranj-color', s.color);
  // The clocks, from the shared list (a clock added there shows here by itself).
  const clockBox = document.getElementById('shatranj-clock');
  if (clockBox) {
    const html = CHESS_CLOCK_IDS.map(v => `<button type="button" class="segmented__item" data-value="${v}" onclick="setShatranjOption('clock', '${v}')">${escapeHTML(v === 'off' ? chT('gw_clock_off') : v)}</button>`).join('');
    if (clockBox._chHtml !== html) { clockBox.innerHTML = html; clockBox._chHtml = html; }
  }
  duelPaintSegmented('shatranj-clock', s.clock);
  duelPaintSegmented('shatranj-help', s.helpLimit);
  const phone = s.vs === 'phone';
  // The hidden queen is against the computer only: two on one phone see standard and 960.
  const variantNow = !phone && s.variant === 'hq' ? 'standard' : s.variant;
  duelPaintSegmented('shatranj-variant', variantNow);
  const hqBtn = document.querySelector('#shatranj-variant [data-value="hq"]');
  if (hqBtn) hqBtn.classList.toggle('hidden', !phone);
  // Each hint explains its own choice, shown only when it is picked.
  const varHint = document.getElementById('shatranj-variant-hint');
  if (varHint) varHint.classList.toggle('hidden', variantNow !== '960');
  const hqHint = document.getElementById('shatranj-variant-hint-hq');
  if (hqHint) hqHint.classList.toggle('hidden', variantNow !== 'hq');
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !on); };
  // No handicap with the hidden queen.
  show('shatranj-odds-field', variantNow !== 'hq');
  // The handicap: which piece (or half the clock), then who gives it - you or the computer; White or Black.
  const odds = document.getElementById('shatranj-odds');
  if (odds) {
    const html = CH_ODDS.map(k => `<button type="button" class="opt-chip ${s.odds === k ? 'is-active' : ''}" aria-pressed="${s.odds === k}" onclick="setShatranjOption('odds', '${k}')">${k === 'none' || k === 'time' ? '' : chPieceSvg(CH_LETTER_KIND[{ pawn: 'p', knight: 'n', rook: 'r', queen: 'q' }[k]], 'ch-odds__pc')}${escapeHTML(chT('ch_odds_' + k))}</button>`).join('');
    if (odds._chHtml !== html) { odds.innerHTML = html; odds._chHtml = html; }
  }
  const by = document.getElementById('shatranj-oddsby');
  if (by) {
    const opts = phone ? [['me', chT('ch_odds_by_me')], ['cpu', chT('ch_odds_by_cpu')]] : [['w', chT('ch_color_w')], ['b', chT('ch_color_b')]];
    const cur = phone ? s.oddsBy : s.oddsColor;
    const html = opts.map(([v, label]) => `<button type="button" class="segmented__item" data-value="${v}" onclick="setShatranjOption('${phone ? 'oddsBy' : 'oddsColor'}', '${v}')">${escapeHTML(label)}</button>`).join('');
    if (by._chHtml !== html) { by.innerHTML = html; by._chHtml = html; }
    duelPaintSegmented('shatranj-oddsby', cur);
  }
  show('shatranj-oddsby-field', s.odds !== 'none');
  // The line under the handicap: only when one is chosen - half the time with no clock warns; two on one
  // phone is never rated, so its line says nothing about the rating.
  const oddsHint = document.getElementById('shatranj-odds-hint');
  if (oddsHint) {
    oddsHint.classList.toggle('hidden', s.odds === 'none');
    oddsHint.textContent = s.odds === 'time' && chessClockId(s.clock) === 'off' ? chT('ch_odds_time_noclock') : chT(phone ? 'ch_odds_hint_local' : 'ch_odds_hint_friend');
  }

  show('shatranj-color-field', phone);
  show('shatranj-coach-field', phone);
  show('shatranj-help-field', phone);
  show('shatranj-names-field', !phone);
  const elo = document.getElementById('shatranj-elo');
  if (elo && Number(elo.value) !== s.elo) elo.value = s.elo;
  if (elo) elo.style.setProperty('--fill', ((s.elo - 400) / 16) + '%');
  const out = document.getElementById('shatranj-elo-out');
  if (out) out.textContent = chEloLabel(s.elo);
  const coach = document.getElementById('shatranj-coach');
  if (coach) coach.checked = !!s.coach;
  show('shatranj-coach-opts', phone && !!s.coach);
  ['warn', 'comment', 'threats'].forEach(k => { const el = document.getElementById('shatranj-coach-' + k); if (el) el.checked = s.coachOpts[k] !== false; });
  // The best-move arrows are off unless switched on (and they make the game unrated).
  const bestSw = document.getElementById('shatranj-coach-best');
  if (bestSw) bestSw.checked = !!s.coachOpts.best;
  const cont = document.getElementById('shatranj-continue');
  if (cont) cont.classList.toggle('hidden', !(s.phase === 'play' && s.g));
  // Your rating, and whether the game about to start counts for it.
  // The characters: a face, a name and a rating each, and «مخصص» for the slider.
  const chars = document.getElementById('shatranj-chars');
  if (chars) {
    const html = CH_CHARACTERS.map(c => `<button type="button" class="ch-char ${s.char === c.id ? 'is-active' : ''}" onclick="setShatranjOption('char', '${c.id}')" aria-pressed="${s.char === c.id}">
        <span class="ch-char__face">${chCharFaceSvg(c.id)}</span>
        <span class="ch-char__name">${escapeHTML(chT('ch_char_' + c.id))}</span>
        <span class="ch-char__elo metric" dir="ltr">${c.elo}</span>
      </button>`).join('') + `<button type="button" class="ch-char ch-char--custom ${s.char === 'custom' ? 'is-active' : ''}" onclick="setShatranjOption('char', 'custom')" aria-pressed="${s.char === 'custom'}">
        <span class="ch-char__face ch-char__face--custom" aria-hidden="true">🎚️</span>
        <span class="ch-char__name">${escapeHTML(chT('ch_char_custom'))}</span>
        <span class="ch-char__elo metric" dir="ltr">${s.elo}</span>
      </button>`;
    if (chars._chHtml !== html) { chars.innerHTML = html; chars._chHtml = html; }
  }
  const pick = chCharById(s.char);
  show('shatranj-char-field', phone);
  show('shatranj-elo-field', phone && !pick);
  const line = document.getElementById('shatranj-char-line');
  if (line) { line.textContent = pick ? chT('ch_char_' + pick.id + '_line') : ''; line.classList.toggle('hidden', !pick); }
  const sug = document.getElementById('shatranj-char-suggest');
  if (sug) {
    const c = chCharSuggest(s.rating.r);
    sug.classList.toggle('hidden', !phone || s.char === c.id);
    sug.innerHTML = `💡 ${escapeHTML(chT('ch_char_suggest', { name: chT('ch_char_' + c.id) }))} <b class="metric" dir="ltr">${c.elo}</b>`;
    sug.onclick = () => setShatranjOption('char', c.id);
  }
  const rt = document.getElementById('shatranj-rating');
  if (rt) {
    rt.classList.toggle('hidden', !phone);
    rt.innerHTML = `⭐ ${escapeHTML(chT('ch_rating_you'))} <b class="metric" dir="ltr">${s.rating.r}</b>` +
      (s.rating.n ? ` <span class="ch-rating__n">· ${escapeHTML(chT('ch_rating_n', { n: s.rating.n }))}</span>` : '');
  }
  const rated = document.getElementById('shatranj-rated');
  if (rated) {
    const why = chUnratedReason(s);
    rated.classList.toggle('hidden', !phone);
    rated.classList.toggle('is-rated', !why);
    rated.textContent = why ? chT('ch_rated_no', { why: chT(why) }) : chT('ch_rated_yes');
  }
  // The board's look: 2D or 3D (the same switch as on the board; none where 3D can't draw), its style, premoves.
  duelPaintSegmented('shatranj-view', chLook().view);
  show('shatranj-view', chCan3D());
  const preSw = document.getElementById('shatranj-premove');
  if (preSw) preSw.checked = chLook().premove;
  show('shatranj-premove-field', phone);
  const looks = document.getElementById('shatranj-looks');
  if (looks) { const html = chLookPickerHtml(); if (looks._chHtml !== html) { looks.innerHTML = html; looks._chHtml = html; } }
  if (typeof chPaintHistory === 'function') chPaintHistory();
}

function setShatranjOption(key, value) {
  const s = chState();
  if (key === 'elo') s.elo = chessElo(value);
  else if (key === 'coach') s.coach = !!value;
  else if (key.indexOf('coach.') === 0) s.coachOpts[key.slice(6)] = !!value;
  else s[key] = value;
  saveToLocal();
  paintShatranjSetup();
}

/** Start: a new match (the tally from nothing). */
function startShatranj() {
  chConfirmReplace(() => {
    const s = chState();
    const read = (id) => ((document.getElementById(id) || {}).value || '').trim().slice(0, 16);
    s.names = [read('shatranj-name1'), read('shatranj-name2')];
    s.scores = [0, 0, 0];
    s.firstWhite = 0;
    // A practice game left in the middle borrowed "against the computer": the match is the chosen way.
    if (s.vsBefore) { s.vs = s.vsBefore; s.vsBefore = null; }
    s.practice = false;
    s.start = '';
    chNewGame();
  });
}

function chContinue() {
  // The game in progress goes on the way it was started: a "vs" picked in the setup since is for
  // the next Start (otherwise you would move the computer's pieces yourself in a game still rated).
  const s = chState();
  if (s.gameVs && s.vs !== s.gameVs) { s.vs = s.gameVs; saveToLocal(); }
  setView('play-shatranj');
  chPaint({ still: true });
  chAfterMove();
}

/** A new game: against the computer your colour as chosen; two on one phone, the colours swap each game. */
function chNewGame(opts) {
  const o = opts || {};
  const s = chState();
  chStopTimers();
  if (s.vs === 'phone') s.me = o.me !== undefined ? o.me : (s.color === 'b' ? 1 : s.color === 'random' ? (Math.random() < 0.5 ? 0 : 1) : 0);
  // A game of the setup's own (not a set-up position, not practice): 960 draws a new start every
  // game, and the handicap takes the giver's piece off it (or half their clock).
  let fen = o.fen || '';
  s.gameVariant = 'standard';
  s.gameOdds = null;
  if (!o.fen) {
    if (s.variant === '960') { fen = chess960Random(); s.gameVariant = '960'; }
    const kind = chOddsNow(s);
    if (kind !== 'none') {
      s.gameOdds = { kind: kind, giver: chOddsGiver(s, s.me || 0) };
      if (kind !== 'time') fen = chOddsFen(fen, kind, s.gameOdds.giver);
    }
  }
  s.g = fen ? chessFromFen(fen) : chessNew();
  s.start = fen;
  // The hidden queen (against the computer, from the setup): the computer picks a pawn at random now, you before your first move.
  s.hq = null;
  chLocal.hqSel = '';
  if (!o.fen && !o.practice && chHqChosen(s)) {
    s.gameVariant = 'hq';
    s.hq = chessHqNew();
    const cpu = 1 - (s.me || 0);
    chessHqPick(s.hq, s.g, cpu, chessHqRandom(s.g, cpu));
  }
  s.hist = [];
  s.sans = [];
  // A game from a position (try the better move) keeps what had been taken by then.
  s.lost = o.lost ? [o.lost[0].slice(), o.lost[1].slice()] : [[], []];
  s.lostStart = [s.lost[0].slice(), s.lost[1].slice()];
  s.last = null;
  s.result = null;
  s.comment = null;
  s.flip = false;
  s.practice = !!o.practice;
  // A set-up position: which famous endgame it is, if one ('' for your own).
  s.setupEg = o.setup ? (o.eg || '') : '';
  // Undo and hints: this game keeps the limit it was started with, and counts what it used.
  s.gameHelp = s.helpLimit;
  s.help = chHelpNew({ setup: !!o.setup, odds: !!s.gameOdds });
  // Whether this game counts for your rating is settled now, and the computer's rating kept with it.
  s.rated = !chUnratedReason(s, { setup: !!o.setup, practice: !!o.practice });
  const who = chCharById(s.char);
  s.opp = s.vs === 'phone' ? { elo: who ? who.elo : s.elo, style: who && who.style ? who.style : '', char: who ? who.id : '' } : null;
  s.ratingChange = null;
  s.clk = chessClockNew(s.clock, s.gameOdds && s.gameOdds.kind === 'time' ? { odds: s.gameOdds.giver } : undefined);
  s.phase = 'play';
  s.gameVs = s.vs;
  s.gameId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  chLocal.sel = '';
  chLocal.coachBefore = null; chLocal.coachKey = '';
  chLocal.hint = null; chLocal.hintKey = '';
  chLocal.pending = null;
  chLocal.pre = null; chLocal.presel = '';
  saveToLocal();
  if (appState.currentView !== 'play-shatranj') setView('play-shatranj');
  chPaint();
  if (typeof scrollToAction === 'function') scrollToAction();
  chAfterMove();
}

/** The next game of the match. */
function chNextGame() {
  const s = chState();
  // A "try the better move" game is over: back to the setup as it was chosen, not a real game
  // against the computer that would count in the match (and for the rating).
  if (s.practice) {
    if (s.vsBefore) { s.vs = s.vsBefore; s.vsBefore = null; }
    s.practice = false;
    saveToLocal();
    setupShatranj();
    return;
  }
  if (s.vs === 'friend') s.firstWhite = 1 - (s.firstWhite || 0);
  // A set-up position is played again from the same place, the same side yours.
  if (s.help && s.help.setup && s.start) { chNewGame({ fen: s.start, setup: true, eg: s.setupEg, me: s.vs === 'phone' ? s.me : undefined }); return; }
  chNewGame();
}

const chHumanTurn = (s) => s.phase === 'play' && (s.vs === 'friend' || s.g.turn === s.me);

/** Who sits at the bottom: against the computer, you; two on one phone, White (or Black, turned by ↻). */
const chOrient = (s) => (s.vs === 'phone' ? s.me : (s.flip ? 1 : 0));

/* --- a move on one phone ----------------------------------------------------------- */

function chPlayLocal(from, to, promo) {
  const s = chState();
  if (!chHumanTurn(s) || Date.now() < chLocal.busy || chLocal.pending || chHqPicking(s)) return;
  const before = chessCloneGame(s.g);
  const beforeHq = chHqOf(s) ? chessHqClone(s.hq) : null;
  const beforeLost = [s.lost[0].slice(), s.lost[1].slice()];
  // The clock as it was before this move (and when it was made), for a take back.
  const beforeClk = s.clk ? { clk: JSON.parse(JSON.stringify(s.clk)), side: s.g.turn, at: Date.now() } : null;
  s.comment = null;
  const info = chApplyMove(s, { from: from, to: to, promo: promo });
  if (!info) return;
  chLocal.busy = Date.now() + 250;
  haptic('light');
  // The coach watches your moves against the computer: a blunder is caught before it counts.
  if (s.vs === 'phone' && s.coach && s.phase === 'play' && (s.coachOpts.warn !== false || s.coachOpts.comment !== false)) {
    chPaint();
    // Not if the board was left meanwhile (a warning would open over another screen), or the move taken back.
    const n = s.hist.length;
    setTimeout(() => { if (appState.currentView === 'play-shatranj' && chState().phase === 'play' && chState().hist.length === n) chCoachJudge(before, beforeLost, info, beforeClk, beforeHq); }, 40);
    return;
  }
  chPaint();
  chAfterMove();
}

/** Plays a move on the one-phone game: the clock, the record, what was taken, the end. */
function chApplyMove(s, mv) {
  const mover = s.g.turn;
  const now = Date.now();
  if (s.clk && chessClockFlagged(s.clk, mover, now, 0)) { chFlag(s, mover); return null; }
  const h = chHqOf(s);
  const info = h ? chessHqPlay(s.g, h, mv) : chessPlay(s.g, mv);
  if (!info) return null;
  if (s.clk) chessClockPress(s.clk, mover, now, 0, s.hist.length === 0);
  const seen = h ? info.hq : null;
  s.hist.push(h ? info.uci : info.from + info.to + (info.promo || ''));
  s.sans.push(info.san + (seen && seen.reveal ? CHESS_HQ_MARK : ''));
  if (info.capture) s.lost[1 - mover].push(info.capture);
  s.last = { from: info.from, to: info.to, capture: info.capture, captureSq: info.captureSq, castle: info.castle, promo: info.promo, check: info.check, n: s.hist.length };
  if (seen && (seen.reveal || seen.captured)) s.last.hq = { reveal: seen.reveal, captured: seen.captured, by: mover };
  chLocal.hint = null;
  if (info.status.over) chEnd(s, info.status.result, info.status.reason);
  saveToLocal();
  return info;
}

function chFlag(s, side) {
  chEnd(s, chessFlagResult(s.g.board, side), 'time');
  saveToLocal();
  chPaint();
}

function chResignLocal() {
  const s = chState();
  if (s.phase !== 'play') return;
  showConfirmModal(chT('ch_resign_confirm'), () => {
    const loser = s.vs === 'phone' ? s.me : s.g.turn;
    chEnd(s, loser === 0 ? 'b' : 'w', 'resign');
    saveToLocal();
    chPaint();
  });
}

function chDrawLocal() {
  const s = chState();
  if (s.phase !== 'play' || s.vs !== 'friend') return;
  showConfirmModal(chT('ch_draw_confirm'), () => { chEnd(s, 'd', 'agreed'); saveToLocal(); chPaint(); });
}

/** The game is over: the tally, the clock stopped, the game kept for the review. */
function chEnd(s, result, reason) {
  if (s.phase !== 'play') return;
  s.phase = 'done';
  s.result = { result: result, reason: reason };
  if (s.clk && s.clk.at) { const side = s.g.turn; s.clk.left[side] = Math.max(0, chessClockLeft(s.clk, side, side, Date.now())); s.clk.at = null; }
  // The tally: [player 1 (or you), player 2 (or the computer), draws]. A "try the better move"
  // game is practice: it counts for nobody and isn't kept among the last 20 games.
  if (s.practice) { chStopTimers(); return; }
  if (result === 'd') s.scores[2]++;
  else {
    const winnerColour = result === 'w' ? 0 : 1;
    const p1Colour = s.vs === 'phone' ? s.me : s.firstWhite === 0 ? 0 : 1;
    s.scores[winnerColour === p1Colour ? 0 : 1]++;
  }
  chStopTimers();
  // Your rating: a rated game with no help used, against the computer.
  let rating = null;
  if (s.vs === 'phone' && s.rated && !chHelpUsed(s.help) && s.hist.length) {
    const R = s.rating;
    const score = result === 'd' ? 0.5 : result === (s.me ? 'b' : 'w') ? 1 : 0;
    const d = chRatingDelta(R.r, R.n, chOppElo(s), score);
    rating = { before: R.r, after: R.r + d, delta: d, opp: chOppElo(s) };
    R.r += d;
    R.n++;
  }
  s.ratingChange = rating;
  if (typeof chStoreGame === 'function') {
    const names = chNames(s);
    chStoreGame({ mode: s.vs === 'phone' ? 'phone' : 'friend', names: names, elo: s.vs === 'phone' ? chOppElo(s) : null, me: s.vs === 'phone' ? s.me : null,
      result: result, reason: reason, start: s.start || '', moves: s.hist.slice(), key: 'local|' + s.gameId,
      help: s.vs === 'phone' ? chHelpNew(s.help) : null, rated: !!rating, rating: rating,
      variant: s.gameVariant === '960' ? '960' : s.gameVariant === 'hq' ? 'hq' : '', odds: s.gameOdds || null });
  }
}

/** After every move: the computer's turn, the clock, the coach's look at the new position. */
function chAfterMove() {
  const s = chState();
  if (appState.currentView !== 'play-shatranj' || !s.g) return;
  chTickStart();
  if (s.phase !== 'play') return;
  // The hidden queen: nobody moves before your pawn is picked.
  if (chHqPicking(s)) return;
  if (s.vs === 'phone' && s.g.turn !== s.me) chComputerSoon();
  else if (s.vs === 'phone' && chLocal.pre && !chLocal.pending) {
    // Your turn, and a move queued: played now if it still is one, else dropped with a shake.
    const pre = chLocal.pre;
    chLocal.pre = null; chLocal.presel = '';
    if (chPremoveLegal(s.g, pre)) { chLocal.busy = 0; chLocal.sel = ''; chPlayLocal(pre.from, pre.to, pre.promo); return; }
    chPaint();
    chPremoveDropped(pre.from);
    if (s.coach) chCoachPrepare();
    chBestPrepare();
  }
  else if (s.vs === 'phone' && s.coach) { chCoachPrepare(); chBestPrepare(); }
}

function chComputerSoon() {
  const s = chState();
  if (chLocal.thinking || s.phase !== 'play' || s.g.turn === s.me) return;
  // Let the last move land first, then think.
  const wait = chViewBusyLeft() + 250;
  chLocal.thinking = setTimeout(() => {
    chLocal.thinking = null;
    const st = chState();
    if (appState.currentView !== 'play-shatranj' || st.phase !== 'play' || st.g.turn === st.me || st.vs !== 'phone') return;
    const settings = chessEloSettings(chOppElo(st));
    let ms = settings.ms;
    if (st.clk && st.clk.at) ms = Math.min(ms, Math.max(80, chessClockLeft(st.clk, st.g.turn, st.g.turn, Date.now()) / 25));
    const t0 = Date.now();
    const hqs = chHqOf(st);
    const mv = chessBestMove(st.g, { elo: chOppElo(st), ms: ms, style: (st.opp && st.opp.style) || undefined, hq: hqs ? hqs.sq[st.g.turn] : -1 });
    // A move found at once still waits a human moment, so it can be seen coming.
    const pause = Math.max(0, 450 - (Date.now() - t0));
    chLocal.thinking = setTimeout(() => {
      chLocal.thinking = null;
      const s2 = chState();
      if (appState.currentView !== 'play-shatranj' || s2.phase !== 'play' || s2.g.turn === s2.me) return;
      if (mv) chApplyMove(s2, mv);
      chPaint();
      chAfterMove();
    }, pause);
  }, wait);
}

function chStopTimers() {
  if (chLocal.thinking) clearTimeout(chLocal.thinking);
  chLocal.thinking = null;
  if (chLocal.tick) clearInterval(chLocal.tick);
  chLocal.tick = null;
}

/* --- the clock on one phone: it counts only while the board is on screen --- */

function chTickStart() {
  const s = chState();
  if (chLocal.tick) clearInterval(chLocal.tick);
  chLocal.tick = null;
  if (!s.clk || s.phase !== 'play') { chPaintClocks(); return; }
  if (!s.clk.at && s.hist.length) s.clk.at = Date.now();
  chPaintClocks();
  // The time is read from the clock's own stamps each tick, never counted down.
  chLocal.tick = setInterval(() => {
    const st = chState();
    if (appState.currentView !== 'play-shatranj' || !st.clk || st.phase !== 'play') { clearInterval(chLocal.tick); chLocal.tick = null; return; }
    const side = st.g.turn;
    if (chessClockFlagged(st.clk, side, Date.now(), 0)) { clearInterval(chLocal.tick); chLocal.tick = null; chStopTimers(); chFlag(st, side); return; }
    chPaintClocks();
  }, 200);
}

/** Leaving the board stops the clock where it stands; coming back starts it again. */
function chPauseClock() {
  const s = chState();
  if (s.clk && s.clk.at && s.phase === 'play') {
    const side = s.g.turn;
    s.clk.left[side] = Math.max(0, chessClockLeft(s.clk, side, side, Date.now()));
    s.clk.at = null;
    saveToLocal();
  }
}

function chPaintClocks() {
  const s = chState();
  document.querySelectorAll('#shatranj-stage [data-ch-clock]').forEach(el => {
    const side = Number(el.dataset.chClock);
    if (!s.clk) { el.textContent = ''; return; }
    const left = chessClockLeft(s.clk, side, s.g.turn, Date.now());
    el.textContent = chClockText(left);
    el.classList.toggle('is-running', s.phase === 'play' && s.g.turn === side && !!s.clk.at);
    el.classList.toggle('is-low', left < 20000);
  });
}

/* --- the coach, against the computer ---------------------------------------------- */

const CH_COACH_NODES = 25000;

/** On your turn the coach looks at the position once: the hint and the warning read it. */
function chCoachPrepare() {
  const s = chState();
  const key = s.gameId + '|' + s.hist.length;
  if (chLocal.coachKey === key) { chPaint(); return; }
  setTimeout(() => {
    const st = chState();
    if (st.phase !== 'play' || st.gameId + '|' + st.hist.length !== key || appState.currentView !== 'play-shatranj') return;
    chLocal.coachBefore = chessAnalyse(st.g, { nodes: CH_COACH_NODES, ms: 900 });
    chLocal.coachKey = key;
    chPaint();
  }, chViewBusyLeft() + 80);
}

/** Your move against the computer, judged: a blunder waits for you to take it back or play it anyway. */
function chCoachJudge(before, beforeLost, info, beforeClk, beforeHq) {
  const s = chState();
  const key = s.gameId + '|' + (s.hist.length - 1);
  const pre = chLocal.coachKey === key && chLocal.coachBefore ? chLocal.coachBefore : chessAnalyse(before, { nodes: CH_COACH_NODES, ms: 900 });
  const after = chessAnalyse(s.g, { nodes: CH_COACH_NODES, ms: 900 });
  const mv = { from: info.from, to: info.to, promo: info.promo || '' };
  if (info.hq && info.hq.reveal) mv.hq = true;
  const verdict = chessJudge(before, mv, pre, after);
  if (s.coachOpts.warn !== false && verdict.cls === 'blunder' && s.phase !== 'done') {
    chLocal.pending = { before: before, lost: beforeLost, verdict: verdict, hist: s.hist.length, clk: beforeClk || null, hq: beforeHq || null };
    if (s.help) s.help.warn = true;
    // Kept at once: a reload now drops the warning but keeps the move, and the game must stay unrated.
    saveToLocal();
    // Nobody's clock runs while the warning is read: the computer's is stopped where it is, and it
    // runs again on "play it anyway" (chAfterMove); a take back puts yours back as it was.
    chStopTimers();
    chPauseClock();
    chPaint();
    chCoachWarn(verdict);
    return;
  }
  chCoachAccept(verdict);
}

function chCoachAccept(verdict) {
  const s = chState();
  chLocal.pending = null;
  if (s.coachOpts.comment !== false) s.comment = { cls: verdict.cls, reasons: verdict.reasons, best: verdict.best, n: s.hist.length };
  saveToLocal();
  chPaint();
  chAfterMove();
}

/** "Careful - your queen can be taken": take it back, or play it anyway. */
function chCoachWarn(verdict) {
  const body = document.getElementById('ch-warn-body');
  if (body) {
    body.innerHTML = `<p class="ch-warn__why">${escapeHTML(chReasonsLine(verdict.reasons, 2) || chT('ch_warn_generic'))}</p>`;
  }
  const m = document.getElementById('ch-warn-modal');
  if (m) m.classList.remove('hidden');
  chSound('refuse');
  haptic('double');
}

function chCoachTakeBack() {
  const s = chState();
  const p = chLocal.pending;
  // Cleared before the modal closes, so closeModal's chCoachDismissed sees nothing waiting.
  chLocal.pending = null;
  closeModal('ch-warn-modal');
  if (!p) return;
  s.g = p.before;
  s.lost = p.lost;
  if (p.hq) s.hq = p.hq;
  s.hist = s.hist.slice(0, p.hist - 1);
  s.sans = s.sans.slice(0, p.hist - 1);
  if (p.clk) {
    // Your clock as it stood when you moved (no increment for a move that is gone); if it wasn't
    // running yet (White's free first move), it still isn't.
    const c = p.clk.clk;
    if (c.at !== null && c.at !== undefined) {
      c.left[p.clk.side] = Math.max(0, chessClockLeft(c, p.clk.side, p.clk.side, p.clk.at));
      c.at = Date.now();
    }
    s.clk = c;
  }
  s.phase = 'play';
  s.result = null;
  s.last = null;
  chLocal.pending = null;
  chLocal.sel = '';
  saveToLocal();
  chPaint({ still: true });
  chAfterMove();
}

/** The warning closed without its buttons (✕, the backdrop, the phone's back): the move stands,
    as "play it anyway" (JS_Core's closeModal calls this). */
function chCoachDismissed() {
  const p = chLocal.pending;
  if (!p) return;
  chCoachAccept(p.verdict);
}

function chCoachPlayAnyway() {
  const p = chLocal.pending;
  // Cleared before the modal closes, so closeModal's chCoachDismissed sees nothing waiting.
  chLocal.pending = null;
  closeModal('ch-warn-modal');
  if (!p) return;
  chCoachAccept(p.verdict);
}

/* --- the best moves as arrows (the owner, 24 Sep 2026: a coach switch «أفضل الحركات», off by
   default, against the computer only; the game is then not rated) ----------------------------
   On your turn the three best moves are drawn as arrows - green, lighter green, yellow - each with
   your chance to win if you play it, and a line under the board names them. Worked out in slices so
   the page never freezes: a short look at the position picks five candidates, then each candidate's
   position is searched in a tick of its own (bounded by positions, so the same position gives the
   same arrows), and nothing shows until all are in. */

const CH_BEST = { cands: 5, rootNodes: 4000, nodes: 9000 };
const CH_BEST_COLORS = [['rgba(22, 163, 74, 0.9)', '#ffffff'], ['rgba(110, 231, 150, 0.9)', '#14532d'], ['rgba(250, 204, 21, 0.92)', '#422006']];

/** Are the best-move arrows on in this game (and is it your move to see them)? */
const chBestOn = (s) => s.vs === 'phone' && !!s.coach && !!(s.coachOpts && s.coachOpts.best) && s.phase === 'play' && s.g && s.g.turn === s.me && !chLocal.pending;

/** Works the three best moves out, a candidate a tick, then draws them. */
function chBestPrepare() {
  const s = chState();
  if (!chBestOn(s)) return;
  const key = s.gameId + '|' + ((s.help && s.help.undo) || 0) + '|' + s.hist.length;
  if ((chLocal.best && chLocal.best.key === key) || chLocal.bestKey === key) return;
  chLocal.bestKey = key;
  const g0 = chessCloneGame(s.g);
  const alive = () => { const st = chState(); return appState.currentView === 'play-shatranj' && chLocal.bestKey === key && chBestOn(st) && st.gameId + '|' + ((st.help && st.help.undo) || 0) + '|' + st.hist.length === key; };
  let cands = [], k = 0;
  const out = [];
  const step = () => {
    if (!alive()) { if (chLocal.bestKey === key) chLocal.bestKey = ''; return; }
    if (!cands.length && k === 0) {
      const a = chessAnalyse(g0, { lines: CH_BEST.cands, nodes: CH_BEST.rootNodes, ms: 60000 });
      cands = (a.lines || (a.move ? [{ move: a.move, san: a.san }] : [])).slice(0, CH_BEST.cands);
      if (!cands.length) return;
      k = 0;
      setTimeout(step, 16);
      return;
    }
    const c = cands[k];
    const g = chessCloneGame(g0);
    const info = chessPlay(g, c.move);
    if (info) {
      const st = chessStatus(g);
      const a = st.over ? null : chessAnalyse(g, { nodes: CH_BEST.nodes, ms: 60000 });
      const score = st.over ? (st.reason === 'mate' ? CHESS_MATE : 0) : -a.score;
      out.push({ from: info.from, to: info.to, san: info.san, score: score, pct: Math.round(chessWinPct(score)), order: k });
    }
    k++;
    if (k < cands.length) { setTimeout(step, 16); return; }
    // Best first; a tie keeps the engine's own order.
    out.sort((x, y) => y.score - x.score || x.order - y.order);
    chLocal.best = { key: key, lines: out.slice(0, 3) };
    const s2 = chState();
    if (s2.help && !s2.help.best) { s2.help.best = true; saveToLocal(); }
    chPaint();
  };
  setTimeout(step, chViewBusyLeft() + 60);
}

/** The best moves showing now (this position's), or null. */
function chBestNow(s) {
  if (!chBestOn(s) || !chLocal.best) return null;
  return chLocal.best.key === s.gameId + '|' + ((s.help && s.help.undo) || 0) + '|' + s.hist.length ? chLocal.best : null;
}

/** The hint: the best move as an arrow on the board, and why in one line. */
function chHint() {
  const s = chState();
  if (!chHumanTurn(s) || s.vs !== 'phone' || chLocal.pending) return;
  const key = s.gameId + '|' + s.hist.length;
  // The hint on the board already is not asked for twice.
  if (chLocal.hint && chLocal.hint.key === key) return;
  if (chHelpLeft(s, 'hint') <= 0) return;
  const a = chLocal.coachKey === key && chLocal.coachBefore ? chLocal.coachBefore : chessAnalyse(s.g, { nodes: CH_COACH_NODES, ms: 900 });
  chLocal.coachBefore = a; chLocal.coachKey = key;
  if (!a.move) return;
  chLocal.hint = { move: a.move, san: a.san, reasons: chessMoveGood(s.g, a.move, a), key: key };
  s.help.hint++;
  saveToLocal();
  chSound('hint');
  haptic('light');
  chPaint();
}

/* --- drawing the one-phone screen -------------------------------------------------- */

function chLayoutHtml(prefix) {
  return `<div class="ch-game duel">
      <div class="ch-layout">
        <div class="ch-layout__stage"><div class="ch-stage" data-ch-host></div></div>
        <div class="ch-layout__side">
          <div class="duel-head ch-head" data-ch-head></div>
          <div class="ch-browse-slot" data-ch-browse></div>
          <div class="ch-bar" data-ch-bar></div>
          <div class="ch-side" data-ch-side></div>
        </div>
      </div>
    </div>`;
}

function chSetHtml(root, sel, html) {
  const el = root && root.querySelector(sel);
  if (!el || el._chHtml === html) return false;
  el.innerHTML = html;
  el._chHtml = html;
  return true;
}

/** The two players as the duels' pills: the piece colour, the name, the clock and what they have taken. */
function chPillsHtml(names, turn, scores, clk, lost, subs, faces) {
  const pill = (k) => ({
    name: names[k],
    score: scores ? scores[k] : 0,
    // A character's face, with its colour as a small king in the corner.
    mark: faces && faces[k]
      ? `<span class="ch-mark ch-mark--face" aria-hidden="true">${faces[k]}<span class="ch-mark__side ${k ? 'is-dark' : 'is-light'}">${chPieceSvg(6 | (k ? 8 : 0))}</span></span>`
      : `<span class="ch-mark ${k ? 'is-dark' : 'is-light'}" aria-hidden="true">${chPieceSvg(6 | (k ? 8 : 0))}</span>`,
    sub: (subs && subs[k] ? subs[k] + ' ' : '') + (clk ? `<b class="ch-clock metric" data-ch-clock="${k}"></b>` : '') + chTakenHtml(lost ? lost[1 - k] : [], lost ? chLead(lost, k) : 0)
  });
  return duelPillsHtml({ players: [pill(0), pill(1)], turn: turn, draws: null });
}

function chPaint(opts) {
  const o = opts || {};
  const s = chState();
  const el = document.getElementById('shatranj-stage');
  if (!el || !s.g) return;
  if (!el.querySelector('.ch-game') || el._chLang !== appState.lang) { el.innerHTML = chLayoutHtml(); el._chLang = appState.lang; }
  const names = chNames(s);
  const humanTurn = chHumanTurn(s) && !chLocal.pending;
  const side = s.vs === 'phone' ? s.me : s.g.turn;
  const threats = s.vs === 'phone' && s.coach && s.coachOpts.threats !== false && s.phase === 'play' ? chessThreats(s.g) : null;
  const marks = [];
  if (threats) {
    const mine = s.me ? 'b' : 'w';
    threats[mine].forEach(sq => marks.push({ sq: sq, kind: 'mine' }));
    threats[mine === 'w' ? 'b' : 'w'].forEach(sq => marks.push({ sq: sq, kind: 'theirs' }));
  }
  const hint = chLocal.hint && chLocal.hint.key === s.gameId + '|' + s.hist.length ? chLocal.hint : null;
  const best = chBestNow(s);
  const ended = s.phase === 'done' && s.result;
  // The computer thinking: your next move can be queued (a premove) - unless premoves are switched off.
  const preOn = s.vs === 'phone' && s.phase === 'play' && s.g.turn !== s.me && !chLocal.pending && chLook().premove;
  if (!preOn && s.phase !== 'play') { chLocal.pre = null; chLocal.presel = ''; }
  const pctx = {
    board: s.g.board, side: s.me, sel: chLocal.presel, pre: chLocal.pre,
    setSel: (sq) => { chLocal.presel = sq; chPaint(); },
    setPre: (mv) => { chLocal.pre = mv; chPaint(); }
  };
  // The hidden queen: your pawns lit while you pick; afterwards its crown on your board only (both once it is over).
  const hq = chHqOf(s);
  const picking = chHqPicking(s);
  const hqMine = chHqMine(s);
  if (hq) {
    if (picking) chessHqPawns(s.g, s.me).forEach(i => marks.push({ sq: chSqName(i), kind: chSqName(i) === chLocal.hqSel ? 'hq' : 'chance' }));
    else if (ended) hq.sq.forEach(i => { if (i >= 0) marks.push({ sq: chSqName(i), kind: 'hq' }); });
    else if (hqMine) marks.push({ sq: hqMine, kind: 'hq' });
  }
  const ctx = {
    g: s.g, side: side, sel: chLocal.sel, hq: hqMine,
    setSel: (sq) => { chLocal.sel = sq; chPaint(); },
    play: (from, to, promo) => chPlayLocal(from, to, promo),
    redraw: () => chPaint()
  };
  const model = {
    key: 'local|' + s.gameId,
    board: s.g.board, orient: chOrient(s), loud: true, preable: s.vs === 'phone',
    last: s.last ? { from: s.last.from, to: s.last.to } : null,
    // The undo count is in the key: after ↶ the same move number is another move (else the piece snaps).
    anim: s.last ? chAnimOf(s.last, s.gameId + '|' + ((s.help && s.help.undo) || 0) + '|' + s.last.n, o.still) : null,
    check: chessCheckSq(s.g),
    mate: ended && s.result.reason === 'mate' ? chMateKing(s.g) : '',
    sel: picking ? '' : humanTurn ? chLocal.sel : preOn ? chLocal.presel : '',
    targets: picking ? [] : humanTurn ? chTargets(s.g, chLocal.sel, hqMine) : preOn && chLocal.presel ? chPremoveTargets(s.g.board, chLocal.presel) : [],
    marks: marks,
    arrows: (hint ? [{ from: hint.move.from, to: hint.move.to }] : []).concat(best ? best.lines.map((b, k) => ({ from: b.from, to: b.to, color: CH_BEST_COLORS[k][0], label: b.pct + '%', ink: CH_BEST_COLORS[k][1] })) : [], chLocal.pre && s.phase === 'play' ? [{ from: chLocal.pre.from, to: chLocal.pre.to, color: CH_PRE_COLOR }] : []),
    lost: s.lost,
    input: picking ? { canMove: true, side: s.me, onPick: (sq, fromDrag) => chHqTapLocal(sq, fromDrag), onDrop: () => false }
      : humanTurn ? { canMove: true, side: side, onPick: (sq, fromDrag) => chTapLogic(ctx, sq, fromDrag), onDrop: (from, to) => chDropLogic(ctx, from, to) }
      : preOn ? { canMove: true, side: s.me, premove: true, onPick: (sq, fromDrag) => chPreTapLogic(pctx, sq, fromDrag), onDrop: (from, to) => chPreDropLogic(pctx, from, to) } : null
  };
  // Looking back at an earlier move: that position, nothing to move (the game itself goes on).
  const bply = chBrowseSync('local|' + s.gameId, s.hist.length, () => chPaint({ still: true }));
  chViewShow(el.querySelector('[data-ch-host]'), bply >= 0 ? chBrowseModel(model, chReplayPositions(s.start, s.hist, s.lostStart), bply) : model);
  if (hq && s.last && s.last.hq && !o.still) {
    const k = s.gameId + '|' + ((s.help && s.help.undo) || 0) + '|' + s.last.n;
    if (s.last.hq.reveal) chHqMoment('reveal', k + '|r');
    if (s.last.hq.captured) chHqMoment('captured', k + '|c');
  }
  const scores = s.scores || [0, 0, 0];
  // The pills are by colour; the tally is by player.
  const p1Colour = s.vs === 'phone' ? s.me : (s.firstWhite === 0 ? 0 : 1);
  const byColour = p1Colour === 0 ? [scores[0], scores[1]] : [scores[1], scores[0]];
  // Against a character: its face and its rating on the computer's pill.
  const cpuSide = s.me ? 0 : 1;
  const char = s.vs === 'phone' && s.opp && s.opp.char ? s.opp.char : '';
  const subs = char ? [0, 1].map(k => (k === cpuSide ? `<span class="ch-pill-elo metric" dir="ltr">${chOppElo(s)}</span>` : '')) : null;
  const faces = char ? [0, 1].map(k => (k === cpuSide ? chCharFaceSvg(char) : '')) : null;
  chSetHtml(el, '[data-ch-head]', chPillsHtml(names, s.phase === 'play' ? s.g.turn : -1, byColour, s.clk, s.lost, subs, faces) + chLocalTagHtml(s, names) +
    (bply >= 0 ? chBrowseNoteHtml(s.sans) : `<p class="duel-status ${ended ? 'is-done' : ''} ${chLocal.thinking ? 'is-thinking' : ''}">${escapeHTML(chLocalStatus(s, names))}</p>`));
  chSetHtml(el, '[data-ch-browse]', chBrowseNavHtml(s.hist.length));
  chSetHtml(el, '[data-ch-bar]', chLocalBarHtml(s, hint));
  if (chSetHtml(el, '[data-ch-side]', chLocalSideHtml(s, names))) chBrowseScrollList(el);
  duelPillsAfter(el, 'ch-local', { turn: s.phase === 'play' ? s.g.turn : -1, scores: byColour });
  chPaintClocks();
  if (ended && duelOnce('ch|' + s.gameId + '|cheer') && !o.still) {
    const r = s.result.result;
    const won = s.vs === 'phone' ? (r === (s.me ? 'b' : 'w')) : r !== 'd';
    setTimeout(() => {
      if (appState.currentView !== 'play-shatranj') return;
      if (won) { duelSound('win'); if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); }
      else duelSound(r === 'd' ? 'draw' : 'lose');
    }, chViewBusyLeft() + 700);
    haptic(won ? 'double' : 'light');
  }
}

/** The king that is mated, for the board to topple. */
function chMateKing(g) {
  const k = 6 | (g.turn ? 8 : 0);
  const i = g.board.indexOf(k);
  return i >= 0 ? chSqName(i) : '';
}

function chLocalStatus(s, names) {
  if (s.phase === 'done' && s.result) return chResultLine(s.result.result, s.result.reason, names);
  if (chLocal.pending) return chT('ch_coach_wait');
  if (chHqPicking(s)) return chT('ch_hq_pick');
  const check = (chessCheckSq(s.g) ? ' · ' + chT('ch_check') : '') + (s.last && s.last.hq && s.last.n === s.hist.length ? ' · ' + chHqWord(s.last.hq.captured && !s.last.hq.reveal ? 'captured' : 'reveal') : '');
  if (s.vs === 'phone') return (s.g.turn === s.me ? chT('duel_your_turn') : chT('xo_thinking')) + check;
  return chT('duel_turn_of', { name: duelIso(names[s.g.turn]) }) + check;
}

function chLocalBarHtml(s, hint) {
  if (s.phase === 'done') {
    return `<div class="btn-row">
        <button type="button" class="btn btn--primary btn--lg" onclick="chNextGame()">${escapeHTML(chT('duel_next_game'))}</button>
        <button type="button" class="btn btn--secondary" onclick="chOpenLastReview()">📊 ${escapeHTML(chT('ch_review'))}</button>
      </div>${!s.practice && typeof chShareRowHtml === 'function' ? chShareRowHtml('local|' + s.gameId) : ''}`;
  }
  if (chHqPicking(s)) {
    return `<p class="ch-hq-note">👑 ${escapeHTML(chT('ch_hq_pick_hint'))}</p><div class="ch-bar__row">
        <button type="button" class="btn btn--primary btn--auto" ${chLocal.hqSel ? '' : 'disabled'} onclick="chHqPickLocal(chLocal.hqSel)">👑 ${escapeHTML(chT('ch_hq_pick_ok'))}${chLocal.hqSel ? ` <b dir="ltr">${escapeHTML(chLocal.hqSel)}</b>` : ''}</button>
        <button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="chResignLocal()">🏳️ ${escapeHTML(chT('ch_resign'))}</button>
      </div>`;
  }
  const parts = [];
  if (s.vs === 'phone' && (s.gameHelp || s.helpLimit) !== 'none') {
    // Each shows what is left in this game (nothing when unlimited).
    const count = (kind) => { const n = chHelpLeft(s, kind); return n === Infinity ? '' : ` <b class="ch-help-n metric">${n}</b>`; };
    const hintOn = chHumanTurn(s) && !chLocal.pending && (chHelpLeft(s, 'hint') > 0 || !!hint);
    parts.push(`<button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="chHint()" ${hintOn ? '' : 'disabled'}>💡 ${escapeHTML(chT('ch_hint'))}${count('hint')}</button>`);
    parts.push(`<button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="chUndoLocal()" ${chCanUndo(s) ? '' : 'disabled'}>↶ ${escapeHTML(chT('ch_undo'))}${count('undo')}</button>`);
  }
  if (s.vs === 'friend') parts.push(`<button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="chFlipLocal()" aria-label="${escapeHTML(chT('ch_flip'))}">↻ ${escapeHTML(chT('ch_flip'))}</button>`);
  if (s.vs === 'friend') parts.push(`<button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="chDrawLocal()">½ ${escapeHTML(chT('ch_draw_agree'))}</button>`);
  parts.push(`<button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="chResignLocal()">🏳️ ${escapeHTML(chT('ch_resign'))}</button>`);
  const best = chBestNow(s);
  const bestLine = best && best.lines.length ? `<p class="ch-bestline">🎯 ${escapeHTML(chT('ch_best_line'))} ${best.lines.map((b, k) => `<span class="ch-bestline__mv ch-bestline__mv--${k}"><b dir="ltr">${escapeHTML(chFigurine(b.san))}</b> <span dir="ltr">${b.pct}%</span></span>`).join('')}</p>` : '';
  const hintLine = hint ? `<p class="ch-hintline">💡 <b dir="ltr">${escapeHTML(chFigurine(hint.san))}</b> · ${escapeHTML(chReasonsLine(hint.reasons, 1))}</p>` : '';
  return `${bestLine}${hintLine}<div class="ch-bar__row">${parts.join('')}</div>`;
}

function chLocalSideHtml(s, names) {
  const out = [];
  if (s.phase === 'done' && s.ratingChange) {
    const rc = s.ratingChange;
    out.push(`<p class="ch-rating-result ${rc.delta > 0 ? 'is-up' : rc.delta < 0 ? 'is-down' : ''}">⭐ ${escapeHTML(chT('ch_rating_now', { r: rc.after }))} <b dir="ltr">${chDeltaText(rc.delta)}</b></p>`);
  }
  if (s.comment && s.vs === 'phone' && s.coach) out.push(chCommentHtml(s.comment));
  const hqEnd = chHqOf(s);
  if (hqEnd && s.phase === 'done') out.push(chHqEndHtml(chHqLocalEnds(hqEnd), names));
  out.push(chMovesHtml(s.sans, { current: chBrowseCurrent(s.sans.length), onClick: 'chBrowseMove', start: s.start || (s.practice ? 'practice' : ''), variant: s.gameVariant }));
  if (s.practice) out.push(`<p class="field__hint">🎯 ${escapeHTML(chT('ch_practice_note'))}</p>`);
  if (s.help && s.help.setup) {
    out.push(`<p class="field__hint">🧩 ${s.setupEg ? `<b>${escapeHTML(chT('ch_eg_' + s.setupEg))}</b> · ${escapeHTML(chT('ch_eg_' + s.setupEg + '_line'))}` : escapeHTML(chT('ch_pos_title'))}</p>`);
  }
  out.push(`<div class="duel-actions"><button type="button" class="btn btn--ghost btn--sm" onclick="setupShatranj()">${escapeHTML(chT('exit'))}</button></div>`);
  return out.join('');
}

/** The coach's word on your last move: the verdict, why, and the better move. */
function chCommentHtml(c) {
  const why = chReasonsLine(c.reasons, 2);
  const better = c.best && c.cls !== 'best' && c.cls !== 'brilliant' ? `<span class="ch-comment__better">${escapeHTML(chT('ch_better'))} <b dir="ltr">${escapeHTML(chFigurine(c.best.san))}</b></span>` : '';
  return `<div class="ch-comment ch-comment--${c.cls}">
      <span class="ch-comment__head">${chClassDot(c.cls)} ${escapeHTML(chT('ch_cls_' + c.cls))}</span>
      ${why ? `<span class="ch-comment__why">${escapeHTML(why)}</span>` : ''}${better}
    </div>`;
}

function chFlipLocal() {
  const s = chState();
  s.flip = !s.flip;
  saveToLocal();
  chPaint({ still: true });
}

/** After a reload: the board as it was, the clock stopped while away, the computer thinking again if it was its turn. */
function restoreShatranj() {
  const s = chState();
  if ((s.phase !== 'play' && s.phase !== 'done') || !s.g || !Array.isArray(s.g.board)) return false;
  chLocal.pending = null;
  if (s.clk && s.clk.at && s.phase === 'play') s.clk.at = Date.now();
  chPaint({ still: true });
  setTimeout(chAfterMove, 0);
  return true;
}

if (typeof soloRegister === 'function') {
  soloRegister('shatranj', {
    setup: 'setup-shatranj', play: 'play-shatranj',
    paintSetup: paintShatranjSetup, restore: restoreShatranj,
    repaint: () => chPaint({ still: true })
  });
}

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    if (from === 'play-shatranj') { chStopTimers(); chPauseClock(); }
    if (to === 'play-shatranj') setTimeout(chAfterMove, 0);
    // One board per page: gone as soon as no screen shows one.
    const keep = to === 'play-shatranj' || to === 'review-shatranj' || to === 'play-chesspuzzle' || to === 'room-chess' || to === 'room-votechess' || to === 'room-handbrain' ||
      (to === 'room-tv' && typeof Room !== 'undefined' && Room.state && ['chess', 'votechess', 'handbrain'].indexOf(Room.state.game) !== -1);
    if (!keep) chViewDrop();
  });
}

// The clock counts only while the board is looked at: a locked phone or another app stops it, as
// leaving the screen does (the guide's "stands still while the board is off screen").
document.addEventListener('visibilitychange', () => {
  if (appState.currentView !== 'play-shatranj') return;
  if (document.hidden) { chStopTimers(); chPauseClock(); }
  else if (!chLocal.pending) chAfterMove();
});
</script>
