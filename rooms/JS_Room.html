<script>
/* ============================================================================
   MULTIPLAYER CLIENT
   ----------------------------------------------------------------------------
   Talks to the rooms server on Cloudflare (rooms-worker/). Creating and joining
   a room are plain requests. After that every phone keeps one WebSocket open
   to its room, and the room sends each phone what it may see the moment
   anything changes - nobody asks "anything new?" every few seconds.

     - A move goes over the socket, and its answer comes back on it.
     - A dropped connection (lock screen, WiFi to mobile data, a tunnel)
       reconnects by itself, and the room sends the current state on arrival.
     - On a network where WebSockets won't connect at all, the phone falls back
       to asking over plain HTTP every few seconds until one does.

   Games register a renderer with Room.onChange, so this file knows nothing
   about any particular game. The server's address is window.ROOMS_URL, set by
   tools/build-site.mjs (and by build-preview.mjs for local testing).
   ========================================================================= */

const Room = (() => {
  // v2 sessions carry the key the server issued to this phone. v1 sessions
  // were Apps Script rooms, which the new server has never heard of.
  const STORE_KEY = 'ashryRoom_v2';
  const OLD_STORE_KEY = 'ashryRoom_v1';

  const BASE = String(window.ROOMS_URL || '').replace(/\/+$/, '');
  const REQUEST_TIMEOUT = 12000;
  const ACK_TIMEOUT = 10000;
  const CONNECT_TIMEOUT = 8000;
  const HEARTBEAT_MS = 25000;        // a quiet socket is checked this often...
  const PONG_TIMEOUT = 6000;         // ...and replaced if it hasn't answered by then
  const RETRY_DELAYS = [300, 1000, 2000, 4000, 8000];
  const POLL_MS = 2500;              // the HTTP fallback's pace
  const OFFLINE_NOTICE_MS = 2000;    // a drop this short doesn't flash the sync dot

  const DROPPED = { gone: 'انتهت الغرفة', kicked: 'تمت إزالتك من الغرفة' };

  let session = null;      // { code, playerId, key, game }
  let state = null;        // last projection from the server
  // When each projection reached this phone, beside the server's time on it (serverNow): the
  // two together are the network's delay, whenever the screen gets round to drawing it.
  // The smallest gap seen for this room is the network's share at most: roomServerNow() reads by it.
  // A move's answer also gives a round trip (sent → answered): the server's time is then read
  // from its middle (`mid`), the smallest round trip seen kept - nearer the truth than `gap`,
  // which leans early by the network's one-way delay. الجرس stamps its presses with it.
  let clock = { code: '', gap: null, rtt: null, mid: null };
  const arrived = (s) => {
    if (s && typeof s === 'object') {
      s.receivedAt = Date.now();
      if (typeof s.serverNow === 'number') {
        const gap = s.receivedAt - s.serverNow;
        if (clock.code !== s.code) clock = { code: s.code, gap: gap, rtt: null, mid: null };
        else clock.gap = Math.min(clock.gap, gap);
      }
    }
    return s;
  };
  // An HTTP answer can land after the socket (opened meanwhile) already brought
  // something newer: never step back to an older version of the same room.
  const notOlder = (s) => !state || !s || state.code !== s.code ||
    typeof s.version !== 'number' || typeof state.version !== 'number' || s.version >= state.version;
  let heardAt = 0;         // when the server last answered, over either path
  let listeners = [];
  let liveListeners = [];
  let lastSignature = '';

  let socket = null;
  let retries = 0;
  let retryTimer = null;
  let connectTimer = null;
  let heartbeatTimer = null;
  let pongTimer = null;
  let offlineTimer = null;
  let pollTimer = null;
  let pollInFlight = false;
  let nextId = 1;
  const pending = new Map();   // ack id -> { resolve, reject, timer }

  /* --- persistence: survive a lock screen or an accidental reload --------- */
  const remember = () => {
    try {
      localStorage.removeItem(OLD_STORE_KEY);
      if (session) localStorage.setItem(STORE_KEY, JSON.stringify(session));
      else localStorage.removeItem(STORE_KEY);
    } catch (e) {}
  };
  const recall = () => {
    try {
      localStorage.removeItem(OLD_STORE_KEY);
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };

  /* --- HTTP: create, join, leave, and the fallback --------------------------- */

  /** POSTs to the rooms server and resolves with its answer ({ ok, ... }). */
  const request = async (path, body) => {
    if (!BASE) throw new Error(roomErrText('net'));
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(() => { if (controller) controller.abort(); }, REQUEST_TIMEOUT);
    let res;
    try {
      // text/plain keeps this a "simple" request: no CORS preflight round trip.
      res = await fetch(BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(body),
        signal: controller ? controller.signal : undefined
      });
    } catch (err) {
      throw new Error(roomErrText(err && err.name === 'AbortError' ? 'timeout' : 'net'));
    } finally {
      clearTimeout(timer);
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!data) throw new Error(roomErrText('net'));
    return data;
  };

  /* --- change notification ----------------------------------------------- */
  const signatureOf = (s) => !s ? '' :
      s.version + '|' + s.phase + '|' + s.players.map(p => p.id + (p.online ? '1' : '0')).join(',') +
      '|' + (s.screens || []).map(x => x.id + (x.online ? '1' : '0')).join(',') +
      // The host away long enough for anyone to move the game on (room.js): no move, but a change.
      (s.hostAway ? '|away' : '');

  const emit = (force) => {
    const sig = signatureOf(state);
    if (!force && sig === lastSignature) return;
    // The game's code loads with its chunk (JS_Lazy.html): the state is held
    // back until it has come, then everyone hears the latest one.
    if (state && state.game && typeof lzWait === 'function' &&
        lzWait(lzChunksOfRoom(state.game), () => emit(true), 'room')) {
      // A lobby doesn't wait for it: the chosen game's card is drawn now, its options then.
      if (typeof roomLobbyEarly === 'function') roomLobbyEarly(state);
      return;
    }
    lastSignature = sig;
    listeners.forEach(fn => { try { fn(state); } catch (e) { console.error('room listener', e); } });
  };

  const handleDropped = (message) => {
    const wasIn = !!session;
    session = null; state = null; lastSignature = '';
    disconnect();
    failPending(message);
    remember();
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
    if (wasIn) {
      // The room's own popups go with it, wherever they were opened from.
      ['chat-modal', 'room-player-menu'].forEach((id) => {
        const m = document.getElementById(id);
        if (m && !m.classList.contains('hidden')) closeModal(id);
      });
      showToast(roomErrLocal(message), 'error');
      emit(true);
      // Only from a room screen: someone playing a one-phone game or using a timer
      // meanwhile stays put (setView would stop that game's clocks), and so does
      // someone on the join screen typing another room's code.
      if (onRoomView()) setView('menu');
    }
  };

  /* --- the live connection ------------------------------------------------- */
  const connected = () => !!socket && socket.readyState === 1;

  const send = (msg) => {
    if (!connected()) return false;
    try {
      socket.send(typeof msg === 'string' ? msg : JSON.stringify(msg));
      return true;
    } catch (e) {
      return false;
    }
  };

  const socketUrl = () => BASE.replace(/^http/i, 'ws') + '/ws?code=' + encodeURIComponent(session.code) +
      '&pid=' + encodeURIComponent(session.playerId) + '&key=' + encodeURIComponent(session.key);

  function connect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    if (!session || !BASE || socket) return;
    let ws;
    try { ws = new WebSocket(socketUrl()); } catch (e) { scheduleReconnect(); return; }
    socket = ws;
    clearTimeout(connectTimer);
    connectTimer = setTimeout(() => { if (socket === ws && ws.readyState !== 1) dropSocket(ws); }, CONNECT_TIMEOUT);

    ws.onopen = () => {
      if (socket !== ws) return;
      clearTimeout(connectTimer);
      retries = 0;
      stopPolling();
      clearTimeout(offlineTimer);
      offlineTimer = null;
      setSyncing(false);
      roomNetNotice(false);
      startHeartbeat();
    };
    ws.onmessage = (event) => { if (socket === ws) onMessage(event.data); };
    ws.onclose = () => dropSocket(ws);
    ws.onerror = () => {};     // a close always follows
  }

  /** Forgets a socket that died, fails the moves waiting on it, and tries again. */
  function dropSocket(ws) {
    if (socket !== ws) return;
    socket = null;
    clearTimeout(connectTimer);
    stopHeartbeat();
    try { ws.onopen = ws.onmessage = ws.onclose = null; ws.close(); } catch (e) {}
    failPending('انقطع الاتصال، حاول مرة أخرى');
    if (!session) return;
    if (!offlineTimer) {
      offlineTimer = setTimeout(() => {
        offlineTimer = null;
        // A poll that answered lately means the room is moving over HTTP: a
        // socket that keeps failing (a proxy that blocks them) isn't "offline".
        if (session && !connected() && Date.now() - heardAt > POLL_MS * 2) { setSyncing(true); roomNetNotice(true); }
      }, OFFLINE_NOTICE_MS);
    }
    scheduleReconnect();
  }

  function scheduleReconnect() {
    if (!session || retryTimer) return;
    // A hidden page waits: coming back to the screen reconnects at once.
    if (document.hidden) return;
    const delay = RETRY_DELAYS[Math.min(retries, RETRY_DELAYS.length - 1)];
    retries++;
    // Missed twice: keep the game moving over HTTP while the socket retries.
    if (retries >= 2) startPolling();
    retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
  }

  function disconnect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    clearTimeout(offlineTimer);
    offlineTimer = null;
    clearTimeout(connectTimer);
    stopPolling();
    stopHeartbeat();
    retries = 0;
    const ws = socket;
    socket = null;
    if (ws) { try { ws.onopen = ws.onmessage = ws.onclose = null; ws.close(1000); } catch (e) {} }
  }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(() => ping(PONG_TIMEOUT), HEARTBEAT_MS);
  }

  function stopHeartbeat() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    clearTimeout(pongTimer);
    pongTimer = null;
  }

  /**
   * Asks for a "pong" (Cloudflare answers it without waking the room). A socket
   * that doesn't answer in time is replaced - after a lock screen a phone can
   * hold a socket that looks open but is long dead.
   */
  function ping(timeout) {
    const ws = socket;
    if (!ws || ws.readyState !== 1 || pongTimer) return;
    if (!send('ping')) { dropSocket(ws); return; }
    pongTimer = setTimeout(() => {
      pongTimer = null;
      dropSocket(ws);
    }, timeout);
  }

  function onMessage(raw) {
    if (raw === 'pong') {
      clearTimeout(pongTimer);
      pongTimer = null;
      return;
    }
    let msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    if (!msg || !session) return;
    heardAt = Date.now();

    if (msg.t === 'state') {
      state = arrived(msg.state);
      emit(false);
    } else if (msg.t === 'strokes') {
      applyStrokes(msg);
    } else if (msg.t === 'ack') {
      settleAck(msg);
    } else if (msg.t === 'live') {
      liveListeners.forEach(fn => { try { fn(msg.d); } catch (e) { console.error('room live listener', e); } });
    } else if (msg.t === 'gone') {
      handleDropped(DROPPED.gone);
    } else if (msg.t === 'kicked' || msg.t === 'left') {
      handleDropped(DROPPED.kicked);
    }
  }

  /**
   * New strokes arrive as just the strokes, so a drawing isn't resent to every
   * phone several times a second. They only fit onto the exact version they
   * were cut from; anything else asks the room for a full copy.
   */
  function applyStrokes(patch) {
    const strokes = state && state.shared && state.shared.strokes;
    if (state && state.version === patch.from && Array.isArray(strokes)) {
      patch.add.forEach(st => strokes.push(st));
      state.version = patch.v;
      emit(false);
      return;
    }
    send({ t: 'sync' });
  }

  function settleAck(msg) {
    if (msg.patch) applyStrokes(msg.patch);
    else if (msg.state) { state = arrived(msg.state); timeRoundTrip(pending.get(msg.id), msg.state); emit(false); }

    const waiter = pending.get(msg.id);
    if (!waiter) return;
    pending.delete(msg.id);
    clearTimeout(waiter.timer);
    if (msg.ok) { waiter.resolve(state); return; }
    if (msg.gone || msg.kicked) handleDropped(msg.gone ? DROPPED.gone : DROPPED.kicked);
    waiter.reject(roomError(msg.error || roomErrText('action')));
  }

  /** A move's round trip: the server's clock is read from its middle (the shortest trip kept). */
  function timeRoundTrip(waiter, s) {
    if (!waiter || !waiter.sentAt || !s || typeof s.serverNow !== 'number' || clock.code !== s.code) return;
    const rtt = s.receivedAt - waiter.sentAt;
    if (!(rtt >= 0) || (clock.rtt !== null && rtt >= clock.rtt)) return;
    clock.rtt = rtt;
    clock.mid = s.receivedAt - s.serverNow - rtt / 2;
  }

  function failPending(message, quiet) {
    pending.forEach(w => {
      clearTimeout(w.timer);
      const err = roomError(message);
      if (quiet) err.quiet = true;
      w.reject(err);
    });
    pending.clear();
  }

  /* --- HTTP fallback, only while the socket can't connect ------------------ */
  function startPolling() {
    if (pollTimer || !session) return;
    const tick = async () => {
      pollTimer = setTimeout(tick, POLL_MS);
      if (!session || connected() || pollInFlight || document.hidden) return;
      pollInFlight = true;
      // The room this poll is about: a leave and a join while it is out make its answer another room's.
      const asked = session;
      try {
        const res = await request('/poll', {
          code: session.code, pid: session.playerId, key: session.key, v: state ? state.version : 0
        });
        if (session !== asked || !session || connected()) return;
        heardAt = Date.now();
        if (res.gone) { handleDropped(DROPPED.gone); return; }
        if (res.kicked) { handleDropped(DROPPED.kicked); return; }
        if (res.same && state) {
          // A computer player has no phone to lose (the server always shows it
          // here), and a big screen's presence decides who plays the table's sounds.
          state.players.forEach(p => { p.online = !!p.bot || res.online.indexOf(p.id) !== -1; });
          (state.screens || []).forEach(x => { x.online = res.online.indexOf(x.id) !== -1; });
          // The host away (room.js): no move, but the stand-ins' buttons open or close.
          if (typeof res.hostAway === 'boolean') state.hostAway = res.hostAway;
        } else if (res.state && res.state.code === session.code && notOlder(res.state)) {
          // A poll sent before a move over /act can answer after it: never step back to its older state.
          state = arrived(res.state);
        }
        setSyncing(false);
        roomNetNotice(false);     // moving again over HTTP: nothing is lost
        emit(false);
      } catch (e) {
        // Still offline; the socket and this both keep trying.
      } finally {
        pollInFlight = false;
      }
    };
    pollTimer = setTimeout(tick, 0);
  }

  function stopPolling() {
    clearTimeout(pollTimer);
    pollTimer = null;
  }

  const adoptSession = (res, game) => {
    const old = session;
    disconnect();
    // A move still waiting on the old room's socket is let go without a word:
    // its answer would never come, and it is not this room's.
    failPending('', true);
    // Opening or joining a room while in another one leaves the old one properly,
    // or it kept a ghost seat (and, for a host, two minutes before handing over).
    if (old && old.code && old.playerId && old.playerId !== res.playerId) {
      request('/leave', { code: old.code, pid: old.playerId, key: old.key }).catch(() => {});
    }
    session = { code: res.state.code, playerId: res.playerId, key: res.key, game: game };
    state = arrived(res.state);
    lastSignature = '';
    remember();
    emit(true);
    connect();
  };

  /* --- public API --------------------------------------------------------- */
  return {
    get state() { return state; },
    get session() { return session; },
    get isIn() { return !!session; },
    get isHost() { return !!(state && state.youAreHost); },
    get isScreen() { return !!(state && state.youAreScreen); },
    get me() { return session ? session.playerId : null; },
    get connected() { return connected(); },
    /** The room this device was last in, as saved, before resume() has run. */
    get saved() { const s = recall(); return s && s.code && s.playerId && s.key ? s : null; },
    // A socket can look open after the phone slept and still be dead; this is
    // when something actually came back (JS_RoomTurn.html waits on it).
    get heardAt() { return heardAt; },
    /** This phone's clock less the server's, as closely as the answers so far show it (0 before any). */
    get clockGap() { return state && clock.code === state.code && clock.gap !== null ? clock.gap : 0; },
    /** The same, read from the middle of a timed round trip once a move has made one (null before). */
    get clockMid() { return state && clock.code === state.code && clock.mid !== null ? clock.mid : null; },

    onChange(fn) { listeners.push(fn); return () => { listeners = listeners.filter(f => f !== fn); }; },

    /** Messages the room relays between phones without keeping (the line being drawn). */
    onLive(fn) { liveListeners.push(fn); return () => { liveListeners = liveListeners.filter(f => f !== fn); }; },
    sendLive(data) { return send({ t: 'live', d: data }); },

    /** `screen`: this device shows the room on a big screen instead of playing in it. */
    async create(name, gameId, screen) {
      const res = await request('/create', { name: name, game: gameId || null, screen: !!screen, face: screen ? '' : roomFace.get() });
      if (!res.ok) throw roomError(res.error || roomErrText('create'));
      adoptSession(res, gameId);
      return res;
    },

    async join(code, name, screen) {
      const res = await request('/join', { code: String(code || '').trim().toUpperCase(), name: name, screen: !!screen, face: screen ? '' : roomFace.get() });
      if (!res.ok) {
        const err = roomError(res.error || roomErrText('join'));
        // «ده أنا» (1278): who has the name, and whether that seat's phone is away (room.js join).
        err.taken = res.taken && typeof res.taken === 'object' ? res.taken : null;
        throw err;
      }
      adoptSession(res, res.state.game);
      return res;
    },

    /**
     * «ده أنا» (1272): asks for the seat under `name` back ({ waiting, claim, token }), then
     * comes for the answer: { waiting } while the host hasn't answered, { joined } once this
     * phone has the seat (the room adopted as a join's is); throws when refused or lapsed.
     */
    async claimAsk(code, name) {
      const res = await request('/claim', { code: String(code || '').trim().toUpperCase(), name: name });
      if (!res.ok) throw roomError(res.error || roomErrText('join'));
      return res;
    },
    async claimPoll(code, claim, token) {
      const res = await request('/claim', { code: String(code || '').trim().toUpperCase(), claim: claim, token: token });
      if (res.ok && res.playerId && res.state) { adoptSession(res, res.state.game); return { joined: true }; }
      if (res.ok && res.waiting) return { waiting: true };
      throw roomError(res.error || roomErrText('join'));
    },
    claimCancel(code, claim, token) {
      return request('/claim', { code: String(code || '').trim().toUpperCase(), claim: claim, token: token, cancel: true }).catch(() => {});
    },

    /** Send a move. The server is authoritative: this resolves with the state after it. */
    act(action, payload) {
      if (!session) return Promise.reject(new Error(roomErrText('noroom')));

      if (connected()) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(roomErrText('timeout')));
            ping(3000);
          }, ACK_TIMEOUT);
          pending.set(id, { resolve, reject, timer, sentAt: Date.now() });
          if (!send({ t: 'act', id: id, action: action, payload: payload || {} })) {
            pending.delete(id);
            clearTimeout(timer);
            reject(new Error(roomErrText('lost')));
          }
        });
      }

      // No socket right now: the same move over plain HTTP.
      const { code, playerId, key } = session;
      const asked = session;
      return request('/act', { code: code, pid: playerId, key: key, action: action, payload: payload || {} })
        .then(res => {
          // Sent from a room this phone has since left: its gone or kicked is not this room's.
          if (session !== asked) return state;
          if (res.gone || res.kicked) {
            handleDropped(res.gone ? DROPPED.gone : DROPPED.kicked);
            throw roomError(res.gone ? DROPPED.gone : DROPPED.kicked);
          }
          if (!res.ok) throw roomError(res.error || roomErrText('action'));
          // A late answer from a room this phone has since left is not this room's state.
          if (res.state && session && res.state.code === session.code && notOlder(res.state)) { state = arrived(res.state); emit(false); }
          connect();
          return state;
        });
    },

    async leave() {
      if (!session) return;
      const { code, playerId, key } = session;
      session = null; state = null; lastSignature = '';
      disconnect();
      failPending('لست في غرفة');
      remember();
      emit(true);
      if (typeof updateRoomBanner === 'function') updateRoomBanner();
      try { await request('/leave', { code: code, pid: playerId, key: key }); } catch (e) {}
    },

    /**
     * Leaves the room saved on this device without rejoining it first: a link
     * to a different room was opened. Uses the key stored with it.
     */
    async leaveSaved() {
      if (session) return this.leave();
      const saved = recall();
      if (!saved) return;
      remember();                      // session is null: forgets the saved one
      if (!saved.code || !saved.playerId || !saved.key) return;
      try { await request('/leave', { code: saved.code, pid: saved.playerId, key: saved.key }); } catch (e) {}
    },

    /** Called on load: silently rejoin the room this device was last in. */
    async resume() {
      const saved = recall();
      if (!saved || !saved.code || !saved.playerId || !saved.key) return false;
      session = saved;
      try {
        const res = await request('/poll', { code: saved.code, pid: saved.playerId, key: saved.key, v: 0 });
        if (session !== saved) return false;
        if (!res.ok || res.gone || res.kicked || !res.state) {
          session = null;
          remember();
          // A slow answer comes after restoreView's look (1.5 s): a reload onto a room screen
          // whose room is gone goes home, not to an empty lobby with no banner.
          if (typeof updateRoomBanner === 'function') updateRoomBanner();
          if (onRoomView()) setView('menu');
          return false;
        }
        if (notOlder(res.state)) {
          state = arrived(res.state);
          emit(true);
        }
        connect();
        return true;
      } catch (err) {
        // No connection right now. The room may well still be there, so keep
        // the session and let the socket keep trying; the state arrives with it.
        if (session === saved) connect();
        return false;
      }
    },

    /** Catch up now: the screen woke, the network came back, or something looks stale. */
    refresh() {
      if (!session) return;
      if (connected()) {
        send({ t: 'sync' });
        ping(3000);
      } else if (!socket) {
        connect();
      }
    }
  };
})();

/** The server's time now, read on this phone: a room's endsAt is compared with this,
    never with Date.now(), or a phone whose clock is off shows the wrong time left. */
function roomServerNow() {
  return Date.now() - Room.clockGap;
}

// A phone that wakes up, or gets its network back, catches up at once.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Room.isIn) Room.refresh();
});
window.addEventListener('online', () => { if (Room.isIn) Room.refresh(); });
window.addEventListener('pageshow', (event) => { if (event.persisted && Room.isIn) Room.refresh(); });

/* ==========================================================================
   QR CODE
   --------------------------------------------------------------------------
   Rendered locally from the join URL. If the library fails to load the code is
   simply not drawn — the 4-letter room code is always shown as well and is
   usually the faster way in anyway.
   ========================================================================== */
/* The library loads `async`: a QR asked for before it came keeps its square (an empty white
   card) and is drawn the moment it arrives, not at the next state that happens to redraw the
   lobby (the owner, 8 Oct 2026). Looked for every 250 ms for 12 s; then the card goes. */
const joinQrWait = { want: {}, timer: null, until: 0, gaveUp: false };
function joinQrLater(containerId, url) {
  joinQrWait.want[containerId] = url;
  if (!joinQrWait.timer) joinQrWait.until = Date.now() + 12000;
  if (joinQrWait.timer) return;
  const look = () => {
    joinQrWait.timer = null;
    const ready = typeof qrcode !== 'undefined';
    if (!ready && Date.now() < joinQrWait.until) { joinQrWait.timer = setTimeout(look, 250); return; }
    const want = joinQrWait.want;
    joinQrWait.want = {};
    Object.keys(want).forEach((id) => {
      const el = document.getElementById(id);
      if (!el || el.dataset.qrWait !== want[id]) return;   // drawn again or gone meanwhile
      if (ready) renderJoinQR(id, want[id]);
      else { delete el.dataset.qrWait; el.style.aspectRatio = ''; el.classList.add('hidden'); }
    });
    // Not come at all (offline, blocked): later lobbies don't hold an empty card again.
    if (!ready) joinQrWait.gaveUp = true;
  };
  joinQrWait.timer = setTimeout(look, 250);
}

function renderJoinQR(containerId, url) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  delete el.dataset.qrWait;
  el.style.aspectRatio = '';
  if (!url) { el.classList.add('hidden'); return; }
  if (typeof qrcode === 'undefined') {
    if (joinQrWait.gaveUp) { el.classList.add('hidden'); return; }
    el.dataset.qrWait = url;
    el.style.aspectRatio = '1';
    el.classList.remove('hidden');
    joinQrLater(containerId, url);
    return;
  }
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    el.classList.remove('hidden');
  } catch (err) {
    el.classList.add('hidden');
  }
}

/* ==========================================================================
   LOBBY UI
   --------------------------------------------------------------------------
   Generic: creating a room, joining one, showing who's in and handing off to
   the game once the host starts. Each game supplies its own lobby options and
   its own start payload through ROOM_GAMES.
   ========================================================================== */

/** Registered per game in its own JS_*.html file. */
const ROOM_GAMES = {};

/* --- clocks the room screens run ----------------------------------------------
   A game's countdown (and what it does at zero: a sound, "giveUp", "timeUp")
   belongs to one deal of one game. Each game registers how to stop its clocks,
   and they all stop when the room leaves that deal: another game, back to the
   hub, a new deal (shared.dealId), or no room at all. A clock's own onEnd still
   checks that the room is on its game, for the moment in between. */
const ROOM_CLOCK_STOPS = [];
function onRoomClocksReset(fn) { if (typeof fn === 'function') ROOM_CLOCK_STOPS.push(fn); }
function stopRoomClocks() {
  ROOM_CLOCK_STOPS.forEach(fn => { try { fn(); } catch (e) { console.warn('room clock', e); } });
}
/** The deal a clock belongs to: the game, lobby or not, and the server's deal id. */
const roomClockStage = (state) => !state ? '' :
  [state.game || '', state.phase === 'lobby' ? 'lobby' : 'game', (state.shared && state.shared.dealId) || ''].join('|');

/** A per-deal key for "already sent / already seen": the deal id, else what the game had before. */
function roomDealKey(state, fallback) {
  const deal = state && state.shared && state.shared.dealId;
  return (deal ? deal + '#' : '') + (state ? state.code : '') + '#' + (fallback === undefined ? '' : fallback);
}

/* --- when the host is away -----------------------------------------------------
   The owner, 28 Sep 2026: once the host has been gone 20 seconds (a locked
   phone), anyone at the table may press the host's "move on" buttons - the next
   round, closing a vote, playing for a quiet phone - so the table never freezes;
   the host stays the host, and the room is handed on only after 2 minutes. The
   server decides (state.hostAway, room.js; requireHost in RoomGames.js). */

/** True when this phone may press the host's "move on" buttons. */
function roomCanMoveOn(state) {
  return !!(state && (state.youAreHost || state.hostAway));
}

/**
 * A host's "move on" control. The host gets it as ever; everyone else gets it
 * drawn but hidden, shown only while the host is away (body.room-host-away, set
 * from every state), so no frame is redrawn - and nothing half-typed lost - when
 * that changes. `orElse` is what a non-host sees the rest of the time (a waiting
 * line). A button that fires when the host is back is simply refused.
 */
function roomMoveOnHtml(state, html, orElse) {
  if (roomProgHeld(html, state)) html = '';
  if (!state || state.youAreHost) return html || '';
  if (!html) return orElse || '';
  return `<span class="room-moveon">${html}</span>` + (orElse ? `<span class="room-moveon-not">${orElse}</span>` : '');
}

/* برنامج السهرة's result pause (~6 s, then the table): the server refuses another round of the game
   just played (programGuard, RoomProgram.js), so its buttons aren't drawn meanwhile - the program's
   bar has «⏭» for the host. True when `code` (a button's markup or onclick) is one of those. */
const ROOM_PROG_HELD = /'(playAgain|restart|tourNew|nextRound|nextQuestion|nextGame)'/;
function roomProgHeld(code, state) {
  const st = state || (typeof Room !== 'undefined' ? Room.state : null);
  return !!(st && st.program && st.program.phase === 'result' && ROOM_PROG_HELD.test(String(code || '')));
}

/** The body class and the line that say so, on a phone's room screens and the TV. */
function paintRoomHostAway(state) {
  const away = !!(state && state.hostAway && !state.youAreHost && state.phase !== 'lobby');
  document.body.classList.toggle('room-host-away', away);
  let note = document.getElementById('room-host-away');
  if (!away) { if (note) note.hidden = true; return; }
  if (!note) {
    note = document.createElement('div');
    note.id = 'room-host-away';
    note.className = 'room-host-away-note';
    note.setAttribute('role', 'status');
    document.body.appendChild(note);

  note.textContent = t.room_host_away || 'المضيف مش متصل - أي حد يقدر يكمّل';
  note.hidden = false;

/**
 * The room can't be reached (the socket dropped and polling fails too): a line under the
 * header says so, where the host-away note sits, so a player doesn't tap into moves that

 * long as the trouble does.

}

   and the host gets two buttons in its lobby: a bot that plays the first thing
   that fits, and one that plays to win. The server does the rest (ROOM_BOT_GAMES
   in RoomGames.js): a bot is a player with `bot` set to its level, always
   present, dealt like anyone, and it moves on the server's clock. Its name is
   offered by the host's phone, in the host's language. */
const ROOM_BOT_NAMES = {
  ar: ['زيزو', 'بندق', 'سمسم', 'فلفل', 'كوكي', 'توتا', 'شوشو', 'لولي', 'ميمي', 'بسبوسة', 'كراميلا'],

/** The game's bot settings, or null when it has none. */
function roomBotsOf(state) {
  const game = state && state.game && ROOM_GAMES[state.game];
  return game && game.bots ? game.bots : null;
}

/** A name nobody in the room has, from the list in the host's language. */
function roomNextBotName(state) {
  const names = ROOM_BOT_NAMES[appState.lang] || ROOM_BOT_NAMES.ar;
  const taken = (state.players || []).map(p => p.name);
  const free = names.filter(n => !taken.some(x => samePlayer(x, n)));
  return free.length ? free[Math.floor(Math.random() * free.length)] : names[0];

function roomAddBot(level) {

/* «اعمل وشك» (the looks of 7 Oct 2026, 1282): a player's drawn face, a string of digits made in

  set(v) { try { if (v) localStorage.setItem('ashryFace', v); else localStorage.removeItem('ashryFace'); } catch (e) {} }

let roomFacesAsked = false;
/** A face as an <svg> (tiny: a chip's, the head only), or '' - no face, or the faces not here yet. */
function roomFaceHtml(face, tiny) {
  if (!face) return '';
  if (typeof faceSvg === 'function') return faceSvg(face, tiny);
  if (!roomFacesAsked && typeof lzEnsure === 'function') {
    roomFacesAsked = true;
    lzEnsure(['faces']).then(() => {
      if (typeof Room !== 'undefined' && Room.state && typeof onRoomView === 'function' && onRoomView()) routeRoomState(Room.state);
    }, () => { roomFacesAsked = false; });
  }
  return '';
}
/** The face of a player in this room, by id (or by name, for a chip that only has the name). */
function roomFaceOf(id, name) {
  const st = typeof Room !== 'undefined' ? Room.state : null;
  if (!st || !st.players) return '';
  const p = st.players.find(x => id ? x.id === id : (name && !x.bot && samePlayer(x.name, name)));
  return (p && p.face) || '';
}
/** A small round face before a name (a chip, a board's row), or '' for none. */
function roomFaceChip(id, name) {

  return h ? `<span class="room-face" aria-hidden="true">${h}</span>` : '';
}
/* A face changed since this phone last drew it lands with a small pop (never the first sight). */
const roomFaceSeen = {};
function roomFaceNew(p) {
  const was = roomFaceSeen[p.id];
  roomFaceSeen[p.id] = p.face || '';

let pendingRoomGame = null;   // game id chosen before the room exists

 * The lobby while the room is being made or joined: the shape of what is

    if (list) list.innerHTML = '<div class="skel skel--row"></div>';

/* «الليلة دي؟» answered "on the TV" on a laptop or TV: the next room is opened
   by this device as its big screen, with the game chosen (ideas batch: shell). */
let roomCreateScreenOnce = false;

/** Entry point from a game's setup screen: "play on separate phones". */
async function roomCreateFor(gameId) {
  // Already in a room: the bar's raised «افتح غرفة» (and a setup's) used to make
  // a new room at once, leaving the table in the old one with no host (UI pass,
  // 7 Oct 2026). Ask, and leave the old room properly so the host passes on.
  const inRoom = Room.state && Room.state.code;
  if (inRoom) {
    const t = TRANSLATIONS[appState.lang] || {};
    showConfirmModal(String(t.room_new_leaves || '').replace('{code}', inRoom), () => {
      // Left here at once (Room.leave clears this phone first); the server is told without waiting
      // for its answer (the owner, 8 Oct 2026: up to 12 s offline before anything moved).
      Room.leave();
      roomCreateFor(gameId);
    }, { yes: 'cf_new_room', tone: 'accent', icon: '🚪' });
    return;
  }
  if (roomCreateScreenOnce) {
    roomCreateScreenOnce = false;
    try {
      setSyncing(true);
      await Room.create('', gameId, true);
      setSyncing(false);
      setView('room-tv');
      if (Room.state) routeRoomState(Room.state);
    } catch (err) {
      setSyncing(false);
      showToast(err.message || roomErrText('create'), 'error');
    }
    return;
  }
  // The name this phone used last time goes straight in (the owner, 26 Sep
  // 2026: it used to be asked every time, one more tap for every room); the
  // lobby shows «أنت: منى ✏️» to change it. A phone with no name is asked.
  const name = await roomNameOrAsk();
  if (!name) return;
  roomName.set(name);
  pendingRoomGame = gameId;
  const from = appState.currentView;
  setView('room-lobby');
  lobbySkeleton(true);
  try {
    setSyncing(true);
    await Room.create(name, gameId);
    setSyncing(false);
    lobbySkeleton(false);
    // «الشلة»: a phone in a crew is asked «للشلة؟» every time (the lobby changes it).
    if (typeof crewAutoForRoom === 'function') crewAutoForRoom();
    // The room arrived while the skeleton was showing, so nothing has drawn it yet.
    if (Room.state) routeRoomState(Room.state);
  } catch (err) {
    setSyncing(false);
    lobbySkeleton(false);
    setView(from);
    showToast(err.message || roomErrText('create'), 'error');
  }
}

/**
 * The room code in whatever was typed or pasted: a code, or a whole join link
 * someone sent ("…/?room=ABCD" or "…/r/ABCD"), in any case and with stray spaces.
 */
function extractRoomCode(text) {
  // An Arabic keyboard's number layer types ٢-٩ (or the Persian ۲-۹): read them as 2-9.
  const raw = String(text || '').replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x660)).replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x6F0));
  const fromLink = /[?&]room=([A-Za-z0-9]{4,8})/.exec(raw) || /\/r\/([A-Za-z0-9]{4,8})/.exec(raw);
  return (fromLink ? fromLink[1] : raw.replace(/[^A-Za-z0-9]/g, '')).toUpperCase().slice(0, 4);
}

/** Keeps the code field down to a clean code while typing or pasting. */
function tidyRoomCodeInput(el) {
  const code = extractRoomCode(el.value);
  if (el.value !== code) el.value = code;
  paintJoinBoxes();
  const nameEl = document.getElementById('room-join-name');
  const wrap = document.getElementById('room-join-name-wrap');
  if (code.length !== 4) { delete el.dataset.went; return; }
  // Code complete and no name yet: carry on to the name.
  if (nameEl && !nameEl.value && document.activeElement === el) { nameEl.focus(); return; }
  // The phone knows the name: the fourth letter goes in, no button (look 2A). Once per code.
  if (nameEl && nameEl.value && wrap && wrap.classList.contains('hidden') && el.dataset.went !== code) {
    el.dataset.went = code;
    setTimeout(() => { if (extractRoomCode(el.value) === code && appState.currentView === 'room-join') roomJoinFromForm(); }, motionOff() ? 0 : 260);
  }
}

/** The four boxes under the code field: a letter each, the next one lit while typing. */
function paintJoinBoxes() {
  const el = document.getElementById('room-join-code');
  const boxes = el && el.parentElement ? el.parentElement.querySelectorAll('.code-boxes__box') : [];
  if (!boxes.length) return;
  const code = extractRoomCode(el.value);
  const focused = document.activeElement === el;
  boxes.forEach((box, i) => {
    const ch = code[i] || '';
    if (box.textContent !== ch) {
      box.textContent = ch;
      if (ch && !motionOff()) { box.classList.remove('is-pop'); void box.offsetWidth; box.classList.add('is-pop'); }
    }
    box.classList.toggle('is-filled', !!ch);
    box.classList.toggle('is-on', focused && i === Math.min(code.length, 3) && code.length < 4);
    box.classList.toggle('is-full', code.length === 4);
  });
}

/* «ارجع للغرفة» (look 2A): the last room this phone was in, kept for 6 hours (a room
   with nobody in it goes after 6 idle hours), shown on the join screen while this
   phone isn't in it. A tap joins it again under the saved name. */
const LAST_ROOM_KEY = 'ashryLastRoom_v1';
const LAST_ROOM_MS = 6 * 3600 * 1000;
let lastRoomSeen = '';

function rememberLastRoom(code) {
  if (!code || code === lastRoomSeen) return;
  lastRoomSeen = code;
  try { localStorage.setItem(LAST_ROOM_KEY, JSON.stringify({ code: code, at: Date.now() })); } catch (e) {}
}

function lastRoom() {
  try {
    const r = JSON.parse(localStorage.getItem(LAST_ROOM_KEY) || 'null');
    return r && r.code && Date.now() - (r.at || 0) < LAST_ROOM_MS ? r : null;
  } catch (e) { return null; }
}

function roomJoinBackPaint() {
  const btn = document.getElementById('room-join-back');
  if (!btn) return;
  const r = lastRoom();
  const show = !!r && !(Room.state && Room.state.code === r.code);
  btn.classList.toggle('hidden', !show);
  if (!show) return;
  const t = TRANSLATIONS[appState.lang] || {};
  btn.innerHTML = `<span aria-hidden="true">↩️</span><span class="room-join-back__text">${escapeHTML(t.room_back_to || '')} <b dir="ltr">${escapeHTML(r.code)}</b>` +
    `<small>${escapeHTML(t.room_back_hint || '')}</small></span><span class="room-join-back__chev" aria-hidden="true">›</span>`;
}

function roomJoinBack() {
  const r = lastRoom();
  const codeEl = document.getElementById('room-join-code');
  if (!r || !codeEl) return;
  codeEl.value = r.code;
  paintJoinBoxes();
  const nameEl = document.getElementById('room-join-name');
  if (nameEl && nameEl.value) roomJoinFromForm(); else if (nameEl) nameEl.focus();
}

/**
 * A room's join link. On the published site it is <app>/r/CODE: site-worker/ answers it
 * with a small page carrying the room's preview (its title and picture for WhatsApp and
 * the rest), which sends a browser straight on to <app>?room=CODE. `game` (the room
 * game chosen) names the game in the preview, and an English phone asks for an English
 * one; a QR leaves both out (shorter, easier to scan). The preview and a copy with no
 * worker keep the plain ?room= link.
 */
function roomInviteUrl(code, opts) {
  const data = window.SERVER_DATA || {};
  const base = data.webAppUrl;
  if (!base || !code) return '';
  if (!data.roomLinks) return base + '?room=' + code;
  const o = opts || {};
  const q = [];
  if (o.game && /^[a-z0-9]{1,24}$/.test(o.game)) q.push('g=' + o.game);
  // A night, not one game (the ideas of 7 Oct 2026, 1323): برنامج السهرة's number of games, or «الشلة» and its name.
  if (o.program > 0) q.push('p=' + Math.min(12, Math.floor(o.program)));
  else if (o.crew) q.push('c=1' + (o.crew.name ? '&n=' + encodeURIComponent(String(o.crew.name).slice(0, 30)) : ''));
  if (o.lang === 'en') q.push('l=en');
  return base.replace(/\/?$/, '/') + 'r/' + code + (q.length ? '?' + q.join('&') : '');
}

/**
 * Sends the join link through the phone's share sheet (WhatsApp and the rest),
 * or copies it where there is none - for friends who can't scan the QR code
 * because they aren't in the same place.
 */
async function roomShareLink() {
  const state = Room.state;
  const base = window.SERVER_DATA && window.SERVER_DATA.webAppUrl;
  if (!state || !base) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const prog = state.program && state.program.phase !== 'final' ? (state.program.games || []).length : 0;
  const url = roomInviteUrl(state.code, { game: state.game, lang: appState.lang, program: prog, crew: state.crew || null });
  return shareOrCopy(url, roomShareText(state, t), t.room_link_copied || '');
}

/* The words that go with the link (the ideas of 7 Oct 2026, 1319): who opened the room, the game
   chosen and its one line from the catalog, the code - all from the phone, nothing new on the server.
   A room hosted by a TV (no name) or a game not chosen yet keeps the parts it has. */
function roomShareText(state, t) {
  const host = (state.players || []).find(p => p.id === state.hostId && !p.bot);
  const entry = state.game ? ROOM_HUB_GAMES.find(g => g.id === state.game) : null;
  const cat = entry && typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[state.game === 'chess' ? 'shatranj' : state.game] : null;
  const game = entry ? ((iconText(entry.icon) ? iconText(entry.icon) + ' ' : '') + (t[entry.key] || entry.id)) : '';
  if (!host) return (t.room_share_text || '') + ' ' + state.code + (game ? ' · ' + game : '');
  const line = String((game ? t.room_share_invite : t.room_share_invite_nogame) || '')
    .replace('{name}', host.name).replace('{game}', game).replace('{code}', state.code);
  const desc = cat && t[cat.desc] ? t[cat.desc] : '';
  return line + (desc ? '\n' + desc : '');
}

/**
 * The phone's share sheet where there is one, the clipboard where there isn't,
 * and the link in a toast where neither works. Used for a room's join link and
 * for the app's own link (Settings and the مع بعض tab).
 */
async function shareOrCopy(url, text, copiedMsg) {
  const t = TRANSLATIONS[appState.lang] || {};
  if (navigator.share) {
    try {
      await navigator.share({ title: t.title || 'عشرى جيمينج', text: text, url: url });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // closed the share sheet
    }
  }
  const message = text + '\n' + url;
  let copied = false;
  try {
    await navigator.clipboard.writeText(message);
    copied = true;
  } catch (err) {
    // No clipboard API here (an older browser, or an embedded one): the old way.
    const area = document.createElement('textarea');
    area.value = message;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(area);
    area.select();
    try { copied = document.execCommand('copy'); } catch (e) {}
    area.remove();
  }
  if (copied) showToast(copiedMsg || t.link_copied || '', 'success');
  else showToast(url, 'info');
}

/** Settings and the مع بعض tab: the app's own link, for friends who aren't here. */
function shareAppLink() {
  const base = (window.SERVER_DATA && window.SERVER_DATA.webAppUrl) || location.origin + location.pathname;
  const t = TRANSLATIONS[appState.lang] || {};
  return shareOrCopy(base, t.share_app_text || '', t.link_copied || '');
}

/**
 * A join mistake is said under the field it is about (the code, or the name), and the
 * field is focused, rather than in a toast that goes: the player sees what to fix.
 * Typing in the field takes the line away.
 */
function roomJoinFieldError(id, msg) {
  const el = document.getElementById(id);
  if (!el) return showToast(msg, 'error');
  const field = el.closest('.field') || el.parentElement;
  let line = field.querySelector('.field__error');
  if (!line) {
    line = document.createElement('p');
    line.className = 'field__error';
    line.id = id + '-err';
    line.setAttribute('role', 'alert');
    field.appendChild(line);
  }
  line.textContent = msg;
  el.setAttribute('aria-invalid', 'true');
  el.setAttribute('aria-describedby', line.id);
  el.addEventListener('input', () => roomJoinClearErrors(), { once: true });
  playSound('alarm');
  try { el.focus(); } catch (e) {}
}
function roomJoinClearErrors() {
  ['room-join-code', 'room-join-name'].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.removeAttribute('aria-invalid');
    el.removeAttribute('aria-describedby');
    const line = (el.closest('.field') || el.parentElement).querySelector('.field__error');
    if (line) line.remove();
  });
}

async function roomJoinFromForm() {
  const code = extractRoomCode(document.getElementById('room-join-code').value);
  const name = (document.getElementById('room-join-name').value || '').trim();
  roomJoinClearErrors();
  if (code.length < 4) return roomJoinFieldError('room-join-code', roomErrText('code'));
  if (!name) { roomJoinEditName(); return roomJoinFieldError('room-join-name', roomErrText('name')); }

  roomName.set(name);
  setView('room-lobby');
  lobbySkeleton(true);
  try {
    setSyncing(true);
    await Room.join(code, name);
    setSyncing(false);
    lobbySkeleton(false);
    playSound('success');
    if (Room.state) routeRoomState(Room.state);
  } catch (err) {
    setSyncing(false);
    lobbySkeleton(false);
    setView('room-join');
    const msg = String(err.message || '');
    // Someone in the room has this phone's name: who, and - their phone gone a while - «ده أنا» (1278).
    if (err.taken && err.taken.name) roomTakenCard(code, name, err.taken);
    // An older server: the field comes back to change it.
    else if (String(err.raw || msg).indexOf('الاسم') !== -1) { roomJoinEditName(); roomJoinFieldError('room-join-name', msg); }
    else if (msg.indexOf('ROOM_NOT_FOUND') !== -1 && roomFromLink === code) { roomFromLink = ''; roomClosedCard(code); }
    else if (msg.indexOf('ROOM_NOT_FOUND') !== -1) roomJoinFieldError('room-join-code', roomErrText('notfound'));
    else showToast(msg, 'error');
  }
}

/* «ده أنا» (the ideas of 7 Oct 2026, 1272 + 1278). A name that is taken says who has it: «فيه منى
   في الغرفة - إنت منى تاني؟», with «اسم تاني» (the field back, «منى ٢» in it) and - only when
   that seat's phone has been gone over a minute - «ده أنا», which asks the host to give this
   phone the seat back (Room.claimAsk) and waits for the answer, asking every 2 s
   (roomClaimWait). The host's side is roomClaimPrompt below. The joiner's cards are the
   room's small sheet (room-sheet-modal); the host's question has its own popup. */
let roomClaimLive = null;   // { code, claim, token, timer }: the ask this phone is waiting on
function roomTakenCard(code, name, taken) {
  const t = TRANSLATIONS[appState.lang] || {};
  const body = document.getElementById('room-sheet-body');
  const modal = document.getElementById('room-sheet-modal');
  if (!body || !modal) { roomJoinEditName(); roomJoinFieldError('room-join-name', roomErrLocal('الاسم ده مستخدم في الغرفة، اختار اسم تاني')); return; }
  body.removeAttribute('data-accent');
  body.removeAttribute('data-accent-auto');
  const seat = taken.name || name;
  const fill = (key) => escapeHTML(t[key] || '').split('{name}').join('<bdi>' + escapeHTML(seat) + '</bdi>');
  body.innerHTML = `
    <div class="modal-icon" aria-hidden="true">🙋</div>

      <button type="button" class="btn ${taken.away ? 'btn--secondary' : 'btn--primary btn--lg'}" onclick="roomTakenOther('${jsStringAttr(seat)}')">✏️ ${escapeHTML(t.room_taken_other || '')}</button>
    </div>`;

}

/** «اسم تاني»: the name field back, with the name and the next number in it («منى ٢»), selected. */
function roomTakenOther(name) {
  closeModal('room-sheet-modal');
  roomJoinEditName();
  const el = document.getElementById('room-join-name');
  if (!el) return;
  el.value = String(name || '').trim().slice(0, 21) + ' ' + (appState.lang === 'ar' ? '٢' : '2');
  setTimeout(() => { try { el.focus(); el.select(); } catch (e) {} }, 300);
}

async function roomClaimStart(code, name) {
  const t = TRANSLATIONS[appState.lang] || {};
  roomClaimStop(false);
  // The waiting card at once, before the room has the ask (the owner, 8 Oct 2026: nothing
  // showed until /claim answered); «إلغاء» meanwhile drops the ask as soon as it is made.
  const live = { code: code, name: name, claim: null, token: null, timer: null };
  roomClaimLive = live;
  const body = document.getElementById('room-sheet-body');
  if (body) {
    body.innerHTML = `
      <div class="modal-icon room-claim__wait" aria-hidden="true">⏳</div>
      <div class="sheet__title">${escapeHTML(t.room_claim_wait || '')}</div>
      <p class="sheet__subtitle">${escapeHTML(t.room_claim_wait_sub || '').split('{name}').join('<bdi>' + escapeHTML(name) + '</bdi>')}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn--ghost" onclick="roomClaimStop(true); closeModal('room-sheet-modal')">${escapeHTML(t.cancel || '')}</button>
      </div>`;
  }
  let res;
  try {
    res = await Room.claimAsk(code, name);
  } catch (err) {
    if (roomClaimLive !== live) return;   // cancelled meanwhile: nothing was asked
    roomClaimLive = null;
    closeModal('room-sheet-modal');
    // The name is free after all (its seat left meanwhile): join as anyone would.
    if (String(err.raw || '') === 'CLAIM_NONE') { roomJoinFromForm(); return; }
    // (audit 7 Oct 2026, R6) a room closed meanwhile reads as such, never the raw code.
    showToast(String(err.raw || '') === 'ROOM_NOT_FOUND' ? roomErrText('notfound') : (err.message || roomErrText('join')), 'error');
    roomTakenOther(name);
    return;
  }
  // Cancelled while the ask was on its way: the host's question goes at once.
  if (roomClaimLive !== live) { Room.claimCancel(code, res.claim, res.token); return; }
  live.claim = res.claim;
  live.token = res.token;
  roomClaimWait();
}

// 2000 -> 1000 (the owner, 8 Oct 2026: felt slow): the host's yes reached the joiner up to 2 s late.
const ROOM_CLAIM_POLL_MS = 1000;

/** Asks for the answer every second while the waiting card is up; the card closed some other way gives up. */
function roomClaimWait() {
  const live = roomClaimLive;
  if (!live) return;
  live.timer = setTimeout(async () => {
    if (roomClaimLive !== live) return;
    const modal = document.getElementById('room-sheet-modal');
    if (!modal || modal.classList.contains('hidden')) { roomClaimStop(true); return; }
    let got = null;
    try {
      got = await Room.claimPoll(live.code, live.claim, live.token);
    } catch (err) {
      if (roomClaimLive !== live) return;
      const raw = String(err.raw || '');
      // The network let one ask go: the next one tries again (the ask lapses on the server by itself).
      if (raw !== 'CLAIM_NO' && raw !== 'CLAIM_GONE' && raw !== 'ROOM_NOT_FOUND') { roomClaimWait(); return; }
      roomClaimLive = null;
      closeModal('room-sheet-modal');
      const t = TRANSLATIONS[appState.lang] || {};
      showToast(raw === 'CLAIM_NO' ? (t.room_claim_no || '') : raw === 'CLAIM_GONE' ? (t.room_claim_gone || '') : raw === 'ROOM_NOT_FOUND' ? roomErrText('notfound') : (err.message || roomErrText('join')), 'error');
      roomTakenOther(live.name);
      return;
    }
    if (roomClaimLive !== live) return;
    if (got && got.joined) {
      roomClaimLive = null;
      closeModal('room-sheet-modal');
      playSound('success');
      haptic('double');
      if (Room.state) routeRoomState(Room.state);
      return;
    }
    roomClaimWait();
  }, ROOM_CLAIM_POLL_MS);
}

/** Stops waiting; `tell`: the room is told this phone gave up, so the host's question goes. */
function roomClaimStop(tell) {
  const live = roomClaimLive;
  roomClaimLive = null;
  if (!live) return;
  clearTimeout(live.timer);
  // Not asked yet (the ask still on its way): roomClaimStart cancels it when it comes back.
  if (tell && live.claim) Room.claimCancel(live.code, live.claim, live.token);
}

/* The host's side: «منى رجع؟ رجّعه مكانه» on the host's phone or the TV hosting the room, or on
   any seated phone once the host has been away 20 s (the server checks again; then it takes two
   seated people's yes, and a phone that said yes isn't asked again). One ask at a time,
   oldest first; «لأ» or «رجّعه» answers it (claimSeat), and an ask that lapsed or was taken back
   simply goes. Closed by hand, it isn't asked again (the asking phone's ask lapses in 3 minutes). */
let roomClaimShown = '';
let roomClaimLater = null;
function roomClaimCanAnswer(state) {
  if (!state || !state.claims || !state.claims.length) return false;
  if (state.youAreHost) return true;
  // A screen isn't seated, so the server refuses its answer; and a TV host's 20 s away is the
  // server's own hostAway, so a phone doesn't ask early (audit 7 Oct 2026, R3).
  if (state.youAreScreen) return false;
  const me = (state.players || []).find(p => p.id === Room.me);
  if (!me || me.bot) return false;
  if (state.hostAway) return true;
  const host = (state.players || []).find(p => p.id === state.hostId);
  if (!host) return false;
  if (host.online || !host.away) return false;
  const wait = host.away + 20000 - (Date.now() - (Room.clockGap || 0));
  if (wait > 0) {
    clearTimeout(roomClaimLater);
    roomClaimLater = setTimeout(() => roomClaimPrompt(Room.state), wait + 300);
    return false;
  }
  return true;
}
function roomClaimPrompt(state) {
  const modal = document.getElementById('room-claim-modal');
  const body = document.getElementById('room-claim-body');
  if (!modal || !body) return;
  // A phone that already said yes as a stand-in isn't asked again: the second yes is someone else's (audit 7 Oct 2026, S1).
  const c = roomClaimCanAnswer(state) ? state.claims.find(x => x.seat !== Room.me && !(Array.isArray(x.yes) && x.yes.indexOf(Room.me) !== -1)) : null;
  if (!c) {
    if (roomClaimShown && !modal.classList.contains('hidden')) closeModal('room-claim-modal');
    roomClaimShown = '';
    return;
  }
  if (roomClaimShown === c.id) return;
  roomClaimShown = c.id;
  const t = TRANSLATIONS[appState.lang] || {};
  const fill = (key) => escapeHTML(t[key] || '').split('{name}').join('<bdi>' + escapeHTML(c.name) + '</bdi>');
  body.innerHTML = `
    <div class="modal-icon" aria-hidden="true">👋</div>
    <div class="sheet__title">${fill('room_claim_q')}</div>
    <p class="sheet__subtitle">${fill('room_claim_q_sub')}</p>
    <div class="modal-actions">
      <button type="button" class="btn btn--primary btn--lg" onclick="roomClaimAnswer('${jsStringAttr(c.id)}', true)">🔁 ${fill('room_claim_yes')}</button>
      <button type="button" class="btn btn--ghost" onclick="roomClaimAnswer('${jsStringAttr(c.id)}', false)">${fill('room_claim_noit')}</button>
    </div>`;
  modal.classList.remove('hidden');
  playSound('success');
  haptic('light');
}
function roomClaimAnswer(id, yes) {
  closeModal('room-claim-modal');
  roomAct('claimSeat', { claim: id, ok: !!yes });
  // With the host away a yes needs a second person's (audit 7 Oct 2026, S1).
  const ask = Room.state && (Room.state.claims || []).find(x => x.id === id);
  const others = ask && Array.isArray(ask.yes) ? ask.yes.filter(x => x !== Room.me).length : 0;
  if (yes && Room.state && !Room.state.youAreHost && !others) {
    const t = TRANSLATIONS[appState.lang] || {};
    showToast(t.room_claim_second || (appState.lang === 'ar' ? 'مستني موافقة تانية' : 'Waiting for one more yes'), 'info');
  }
}
if (typeof Room !== 'undefined') Room.onChange((state) => roomClaimPrompt(state));

/* A link whose room is gone (the ideas of 7 Oct 2026, 1320): not a red line under the code but a
   kind card - «الغرفة دي قفلت 🌙», «افتح غرفة جديدة» first, another code, and when this phone was
   in that room, the night's last table as ليالينا kept it. `roomFromLink` is the code a link

      <button type="button" class="btn btn--secondary" onclick="roomClosedOtherCode()">📱 ${escapeHTML(t.room_closed_code || '')}</button>
      <button type="button" class="btn btn--ghost" onclick="closeModal('room-sheet-modal'); setView('menu')">${escapeHTML(t.room_closed_home || '')}</button>
