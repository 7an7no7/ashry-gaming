<script>
/* ============================================================================
   على نفس الموجة — WAVELENGTH
   ----------------------------------------------------------------------------
   One psychic sees where the target sits between two opposites and gives a
   clue; everyone else turns the dial until they agree, and the host locks it.

   The spectrum is laid out left-to-right in both languages. It is a physical
   line, and the slider, the needle and the two labels have to agree about
   which end is zero — under dir="rtl" a range input runs right-to-left while
   `left: 40%` still measures from the left, so they drifted apart in Arabic.
   ========================================================================= */

// Must match WAVELENGTH_BANDS on the server. Widest first, so the narrow,
// valuable band is painted on top.
const WL_BANDS = [
  { within: 15, points: 2 },
  { within: 8, points: 3 },
  { within: 3, points: 4 }
];

const wave = {
  dragging: false,
  lastInput: 0,
  sendTimer: null,
  pending: null
};

ROOM_GAMES.wavelength = {
  lobbyOptions: (state) => langLobbyOptions(state, 'wl_hint'),
  startPayload: () => ({ lang: VOTE_LANG() }),

  render(state) {
    if (appState.currentView !== 'room-wavelength') setView('room-wavelength');
    const el = document.getElementById('view-room-wavelength');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const psychicAway = s.phase === 'clue' && !wlOnline(state, s.psychicId);

    // The dial is left out on purpose: it moves constantly, and rebuilding for
    // it would yank the slider out from under whoever is dragging it.
    const sig = ['wl', s.round, s.phase, state.youAreHost, psychicAway, appState.lang].join('|');
    renderRoomFrame(el, sig, () => wavelengthFrame(state, t, psychicAway));
    paintWavelengthDial(s.dial);
    refreshRoomPlayerStrip(el, state);
  }
};

function wlOnline(state, id) {
  const p = state.players.find(x => x.id === id);
  return !!(p && p.online);
}

function wavelengthFrame(state, t, psychicAway) {
  const s = state.shared;
  const you = state.you || {};
  const amPsychic = s.psychicId === Room.me;
  const canTurn = s.phase === 'dial' && !amPsychic && state.inGame !== false;
  const target = s.phase === 'results' ? s.target : (amPsychic && typeof you.target === 'number' ? you.target : null);

  const band = (b) => {
    const from = Math.max(0, target - b.within);
    const to = Math.min(100, target + b.within);
    return `<div class="wl-zone wl-zone--${b.points}" style="left:${from}%; width:${to - from}%"></div>`;
  };

  const header = `
    <div class="cn-score">
      <span class="cn-score__role">🧠 ${amPsychic
          ? (t.psychic_role || '')
          : (t.wl_psychic || '') + ': <bdi>' + escapeHTML(s.psychicName || '') + '</bdi>'}</span>
      <span class="badge badge--accent">${t.round || ''} ${s.round} · ${t.wl_team_score || ''} ${(s.scores && s.scores.team) || 0}</span>
    </div>`;

  const spectrum = `
    <div class="card">
      ${s.clue ? `
        <div class="eyebrow" style="text-align:center">${t.wl_clue || ''}</div>
        <div class="prompt-text" style="text-align:center">«${escapeHTML(s.clue)}»</div>` : ''}
      <div class="wl-spectrum" dir="ltr">
        <div class="wl-labels">
          <span class="wl-label">${escapeHTML(s.leftLabel || '')}</span>
          <span class="wl-label">${escapeHTML(s.rightLabel || '')}</span>
        </div>
        <div class="wl-bar">
          ${target !== null ? WL_BANDS.map(band).join('') + `<div class="wl-target" style="left:${target}%"></div>` : ''}
          <div class="wl-needle" id="wl-needle" style="left:${s.dial}%"></div>
        </div>
        ${canTurn ? `
          <input type="range" id="wl-dial" class="wl-dial" min="0" max="100" step="1" value="${s.dial}"
                 aria-label="${escapeHTML(t.team_adjust_dial || '')}"
                 oninput="onWavelengthDial(this.value)"
                 onpointerdown="wave.dragging = true"
                 onpointerup="endWavelengthDrag()" onpointercancel="endWavelengthDrag()"
                 onchange="endWavelengthDrag()">` : ''}
      </div>
      ${amPsychic && s.phase !== 'results' ? `<p class="field__hint" style="text-align:center">${t.wl_zone_hint || ''}</p>` : ''}
    </div>`;

  let panel = '';
  if (s.phase === 'clue') {
    if (amPsychic) {
      panel = `
        <div class="card card--accent">
          <div class="card__title" style="text-align:center">${t.psychic_hint || ''}</div>
          <div class="input-group">
            <input id="wl-clue" type="text" autocomplete="off" maxlength="60"
                   placeholder="${escapeHTML(t.enter_clue_ph || '')}"
                   onkeydown="if(event.key==='Enter') submitWavelengthClue()">
            <button onclick="submitWavelengthClue()" class="btn btn--primary" aria-label="${escapeHTML(t.send_clue_btn || '')}">↵</button>
          </div>
        </div>`;
    } else {
      panel = `
        <div class="waiting-note"><span class="animate-pulse">🧠</span> ${t.wl_waiting_clue || ''} <bdi>${escapeHTML(s.psychicName || '')}</bdi>…</div>
        ${psychicAway && state.youAreHost ? `
          <div class="btn-stack">
            <button class="btn btn--ghost btn--sm" onclick="roomAct('nextRound', ${roomNextArgs(state, { skip: true })})">${t.wl_skip_psychic || ''}</button>
          </div>` : ''}`;
    }
  } else if (s.phase === 'dial') {
    panel = `
      ${amPsychic
        ? `<div class="waiting-note">🤐 ${t.wl_psychic_quiet || ''}</div>`
        : `<p class="field__hint" style="text-align:center">${t.team_adjust_dial || ''}</p>`}
      ${state.youAreHost
        ? `<div class="btn-stack"><button onclick="lockWavelengthDial()" class="btn btn--primary btn--lg">${t.lock_dial_btn || ''}</button></div>`
        : `<div class="waiting-note">${t.wl_host_locks || ''}</div>`}`;
  } else if (s.phase === 'results') {
    const verdict = { 4: t.bullseye, 3: t.very_close, 2: t.close_points }[s.pointsEarned] || t.miss_points;
    panel = `
      <div class="card ${s.pointsEarned ? 'plate-success' : 'plate-danger'}" style="text-align:center">
        <div class="card__title" style="margin:0">${verdict || ''}</div>
        <p style="margin: var(--sp-1) 0 0">${t.wl_dial || ''} ${s.dial} · ${t.wl_target || ''} ${s.target}</p>
      </div>
      ${renderRoundFooter(state, t.next_round || '')}`;
  }

  return header + spectrum + panel + renderRoomPlayerStrip(state);
}

// The dial is shared while it moves, a few times a second, so everyone watches
// the needle travel instead of seeing it jump once the finger lifts.
const WAVE_SEND_MS = 150;

function onWavelengthDial(value) {
  const v = Math.max(0, Math.min(100, Math.round(Number(value))));
  wave.lastInput = Date.now();
  wave.pending = v;
  const needle = document.getElementById('wl-needle');
  if (needle) needle.style.left = v + '%';
  if (wave.sendTimer) return;          // the send already queued takes the newest value
  wave.sendTimer = setTimeout(() => {
    wave.sendTimer = null;
    const next = wave.pending;
    wave.pending = null;
    if (next !== null) roomAct('setDial', { dial: next });
  }, WAVE_SEND_MS);
}

function endWavelengthDrag() {
  wave.dragging = false;
  wave.lastInput = Date.now();
}

/** Moves the needle and slider to the room's dial — unless this phone is mid-move. */
function paintWavelengthDial(dial) {
  // Not under a finger, and not back to the server's last value while this
  // phone's own move is still on its way there.
  if (wave.dragging || Date.now() - wave.lastInput < 1500) return;
  const v = Number(dial);
  const needle = document.getElementById('wl-needle');
  if (needle) needle.style.left = v + '%';
  const slider = document.getElementById('wl-dial');
  if (slider && Number(slider.value) !== v) slider.value = v;
}

async function submitWavelengthClue() {
  const input = document.getElementById('wl-clue');
  const clue = input ? input.value.trim() : '';
  if (!clue) return;
  if (input) input.disabled = true;
  try {
    await Room.act('giveClue', { clue: clue });
  } catch (err) {
    if (input) input.disabled = false;
    showToast(err.message || 'تعذر الإرسال', 'error');
  }
}

async function lockWavelengthDial() {
  // The host's own last nudge may still be waiting on its debounce; send it
  // first, or the lock scores the dial from before it.
  if (wave.sendTimer && wave.pending !== null) {
    clearTimeout(wave.sendTimer);
    wave.sendTimer = null;
    const v = wave.pending;
    wave.pending = null;
    try { await Room.act('setDial', { dial: v }); } catch (e) {}
  }
  roomAct('lockDial');
}
</script>
