<script>
/* ============================================================================
   تحدي اليوم — EVERY PUZZLE OF THE DAY IN ONE PLACE
   ----------------------------------------------------------------------------
   Each solo game already has its puzzle of the day (the same on every phone,
   seeded from the date, JS_Solo.html). This screen lists them all with what
   this phone did today, the streak of days with at least one finished, and
   one message with every result for the family group.

   DAILY_GAMES is the order and how each result reads in one short line; the
   results themselves are what each game passed to soloMarkDaily. A daily
   already started says "continue" and goes back to where it was left
   (soloDailyResume, through the game's own start). A daily started from here
   comes back here when its result sheet is closed (soloHubReturn), instead of
   to that game's own setup screen - as long as the player stays on its board.
   ========================================================================= */

const dailyHints = (r) => (r.hints ? ' 💡' + r.hints : '');

/** A game's icon in a line of text: an emoji and a space, a drawn icon nothing (its line carries its own emoji). */
const dailyIconText = (icon) => { const x = typeof iconText === 'function' ? iconText(icon) : icon; return x ? x + ' ' : ''; };

const DAILY_GAMES = [
  { id: 'flags',     start: () => startFlags(true),     line: (r) => r.won ? `✅ ${r.guesses}/6` : '❌ X/6' },
  { id: 'streak',    start: () => startStreak(true),    line: (r) => `${r.score >= 7 ? '✅' : '☑️'} ${r.score}/10` },
  { id: 'pinpoint',  start: () => startPinpoint(true),  line: (r) => `${r.score >= 13 ? '✅' : '☑️'} ${r.score}/25` },
  { id: 'strands',   start: () => startStrands(true),   line: (r) => `✅ ${soloTime(r.seconds)}${dailyHints(r)}` },
  { id: 'wordwheel', start: () => startWordWheel(true), line: (r) => `✅ ${soloTime(r.seconds)}${r.bonus ? ' ⭐' + r.bonus : ''}${dailyHints(r)}` },
  { id: 'sudoku',    start: () => startSudoku(true),    line: (r) => `✅ ${soloTime(r.seconds)}${dailyHints(r)}` },
  { id: 'queens',    start: () => startQueens(true),    line: (r) => `✅ ${soloTime(r.seconds)}${dailyHints(r)}` },
  { id: 'tango',     start: () => startTango(true),     line: (r) => `✅ ${soloTime(r.seconds)}${dailyHints(r)}` },
  { id: 'nonogram',  start: () => startNonogram(true),  line: (r) => `✅ ${soloTime(r.seconds)}${dailyHints(r)}` },
  { id: 'mines',     start: () => startMines(true),     line: (r) => r.lost ? '💥' : `✅ ${soloTime(r.seconds)}` },
  { id: 'minigolf',  start: () => startMiniGolf(true),  line: (r) => `${r.strokes <= r.par ? '🟢 ' : ''}⛳ ${r.strokes} · 🎯 ${r.par}` },
  { id: 'chesspuzzle', start: () => chPzStartDaily(),  line: (r) => chPzDailyLine(r) }
];

let soloHubReturn = false;
let soloHubGame = '';   // the daily last started from here

// Only that game's board keeps the way back here. Leaving it for anywhere but
// the hub (the back arrow to its setup, another game) forgets it, or the next
// daily played from its own screen would come back here too.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    if (!soloHubReturn || to === 'setup-daily') return;
    const g = SOLO_GAMES[soloHubGame];
    if (!g || to !== g.play) soloHubReturn = false;
  });
}

function openDaily() {
  setView('setup-daily');
}

function dailyDone() {
  return DAILY_GAMES.filter(g => soloDailyResult(g.id));
}

function renderDaily() {
  const el = document.getElementById('daily-stage');
  if (!el) return;
  soloHubReturn = false;
  const t = TRANSLATIONS[appState.lang];
  const done = dailyDone();
  const streak = soloStreak();
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const hours = Math.max(1, Math.ceil((midnight - now) / 3600000));
  const all = done.length === DAILY_GAMES.length;
  const first = motionFirst('daily-hub:' + soloToday() + ':' + done.length);
  el.innerHTML = `
    <div class="daily-head card">
      <div class="daily-head__streak">
        <span class="daily-head__fire" aria-hidden="true">${streak ? '🔥' : '🌱'}</span>
        <span><b class="metric" id="daily-streak">${streak}</b> <span>${escapeHTML(streak === 1 ? (t.daily_day || '') : (t.daily_days || ''))}</span></span>
        <span class="field__hint">${escapeHTML(t.daily_streak_hint || '')}</span>
      </div>
      <div class="daily-head__progress">
        <span>${escapeHTML((t.daily_progress || '').replace('{n}', done.length).replace('{m}', DAILY_GAMES.length))}</span>
        <span class="daily-bar" aria-hidden="true"><i style="--p:${done.length / DAILY_GAMES.length}"${first ? ' class="is-new"' : ''}></i></span>
        <span class="field__hint">${escapeHTML(all ? (t.daily_all_done || '') : (t.daily_renews || '').replace('{h}', hours))}</span>
      </div>
      <button type="button" class="btn btn--primary" onclick="shareDaily()" ${done.length ? '' : 'disabled'}>📤 ${escapeHTML(t.daily_share_all || '')}</button>
      <div class="daily-head__actions">
        <button type="button" class="btn btn--ghost btn--sm" onclick="shareDailyText()" ${done.length ? '' : 'disabled'}>${escapeHTML(t.share_card_text || '')}</button>
        <button type="button" class="btn btn--secondary" onclick="openDailyArchive()">📅 ${escapeHTML(t.daily_archive || 'الأرشيف')}</button>
        <button type="button" class="btn btn--secondary" onclick="openStats()">📊 ${escapeHTML(t.stats_title || 'أرقامي')}</button>
      </div>
    </div>
    <div class="daily-list">
      ${DAILY_GAMES.map(g => {
        const cat = CATALOG_BY_ID[g.id];
        const result = soloDailyResult(g.id);
        const going = !result && soloDailyInProgress(g.id);
        return `
          <button type="button" class="tool-item daily-row${result ? ' is-done' : ''}" data-accent="${cat.accent}" data-game="${g.id}" onclick="playDaily('${g.id}')" ${result ? 'disabled' : ''}>
            <span class="tool-icon" aria-hidden="true">${typeof iconHtml === 'function' ? iconHtml(cat.icon) : cat.icon}</span>
            <span class="tool-info">
              <span class="tool-name">${escapeHTML(t[cat.title] || g.id)}</span>
              <span class="tool-desc">${escapeHTML(result ? (t.daily_done_today || '') : (t[cat.desc] || ''))}</span>
            </span>
            <span class="daily-row__status">${result ? escapeHTML(g.line(result)) : `<span class="badge">${escapeHTML(going ? (t.daily_continue || 'كمّل') : (t.daily_play || ''))}</span>`}</span>
          </button>`;
      }).join('')}
    </div>`;
  const streakEl = document.getElementById('daily-streak');
  if (first && streak > 1 && streakEl && typeof countUp === 'function' && !motionOff()) countUp(streakEl, 0, streak);
}

/** Plays a daily from here: its game's own start, which continues one already begun. */
function playDaily(id) {
  const g = DAILY_GAMES.find(x => x.id === id);
  if (!g || soloDailyResult(id)) return;
  soloHubReturn = true;
  soloHubGame = id;
  if (typeof rememberRecent === 'function') rememberRecent(id);
  g.start();
}

function shareDaily() {
  const t = TRANSLATIONS[appState.lang];
  const done = dailyDone();
  if (!done.length) return;
  const streak = soloStreak();
  // Each game by its name as well as its icon: a column of emoji means little to the family group.
  const lines = done.map(g => {
    const cat = CATALOG_BY_ID[g.id];
    return `${dailyIconText(cat.icon)}${t[cat.title] || g.id}: ${g.line(soloDailyResult(g.id))}`;
  });
  // "3 من 11" rather than "3/11", which reads as a date next to the day's date.
  const count = (t.daily_progress || '{n} من {m}').replace('{n}', done.length).replace('{m}', DAILY_GAMES.length);
  const text = `${soloShareHeader(t)} · ${count}\n${streak > 1 ? `🔥 ${streak} ${t.daily_days || ''}\n` : ''}${lines.join('\n')}`;
  // The same day as a picture: a game to a row, its result beside it. The
  // words still travel with it, for anyone reading on a phone that shows text.
  return shareResultCard({
    title: t.daily_title || '',
    icon: '📅',
    rows: done.map(g => {
      const cat = CATALOG_BY_ID[g.id];
      return { name: `${dailyIconText(cat.icon)}${t[cat.title] || g.id}`, value: g.line(soloDailyResult(g.id)) };
    }),
    maxRows: DAILY_GAMES.length,
    footer: `${soloShareHeader(t)} · ${count}${streak > 1 ? ` · 🔥 ${streak} ${t.daily_days || ''}` : ''}`,
    text: text
  });
}

/** The same day as plain words, for anyone who would rather send that. */
function shareDailyText() {
  const t = TRANSLATIONS[appState.lang];
  const done = dailyDone();
  if (!done.length) return;
  const streak = soloStreak();
  const lines = done.map(g => {
    const cat = CATALOG_BY_ID[g.id];
    return `${dailyIconText(cat.icon)}${t[cat.title] || g.id}: ${g.line(soloDailyResult(g.id))}`;
  });
  const count = (t.daily_progress || '{n} من {m}').replace('{n}', done.length).replace('{m}', DAILY_GAMES.length);
  shareOrCopy(appLink(), `${soloShareHeader(t)} · ${count}\n${streak > 1 ? `🔥 ${streak} ${t.daily_days || ''}\n` : ''}${lines.join('\n')}`, t.solo_copied || '');
}

/* ============================================================================
   أرشيف تحدي اليوم — PAST DAILIES ARCHIVE
   ========================================================================= */

let archiveSelectedDay = null;
let archiveMonthOffset = 1; // 1 = current month, 0 = previous month

function openDailyArchive() {
  setView('setup-daily-archive');
}

function setArchiveMonth(offset) {
  archiveMonthOffset = offset;
  renderDailyArchive();
}

function selectArchiveDay(day) {
  archiveSelectedDay = day;
  renderDailyArchive();
}

/**
 * Starts past daily for game `id` on date `day`.
 * Deals with identical seed, sets s.archive, clears s.daily so soloMarkDaily is not called.
 */
function playArchive(id, day, sure) {
  const g = DAILY_GAMES.find(x => x.id === id);
  const soloG = typeof SOLO_GAMES !== 'undefined' ? SOLO_GAMES[id] : null;
  if (!g || !soloG) return;
  // Today is the real daily, never practice: the archive dealt today's puzzle as a
  // board that records nothing, and "again" replayed it before the real go.
  if (day >= soloRealToday()) { playDaily(id); return; }
  soloHubReturn = false;
  const epoch = soloEpochs[id] || 0;
  soloArchiveDay = day;
  soloArchiveSure = !!sure;
  try {
    g.start();
  } finally {
    soloArchiveDay = null;
    soloArchiveSure = false;
  }
  // Nothing was dealt (a "start a new game?" question is waiting): the board on
  // screen is still the old one, and must not be relabelled as that day.
  if ((soloEpochs[id] || 0) === epoch) return;
  const s = soloG.state ? soloG.state() : null;
  if (s) {
    s.archive = day;
    s.daily = '';
    saveToLocal();
    if (typeof soloG.repaint === 'function') soloG.repaint();
  }
}

function renderDailyArchive() {
  const el = document.getElementById('daily-archive-stage');
  if (!el) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const isAr = appState.lang === 'ar';
  const todayStr = soloToday();
  const allDailies = soloDailyAll();

  const now = new Date();
  const targetDate = new Date(now.getFullYear(), now.getMonth() - (1 - archiveMonthOffset), 1);
  const year = targetDate.getFullYear();
  const month = targetDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const curMonthDate = new Date(now.getFullYear(), now.getMonth(), 1);
  const prevMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const curMonthLabel = curMonthDate.toLocaleDateString(isAr ? 'ar-EG' : 'en-US', { month: 'long', year: 'numeric' });
  const prevMonthLabel = prevMonthDate.toLocaleDateString(isAr ? 'ar-EG' : 'en-US', { month: 'long', year: 'numeric' });

  if (!archiveSelectedDay || !archiveSelectedDay.startsWith(year + '-' + String(month + 1).padStart(2, '0'))) {
    if (archiveMonthOffset === 1) {
      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      const yStr = soloToday(yesterday);
      archiveSelectedDay = (yStr.startsWith(year + '-' + String(month + 1).padStart(2, '0'))) ? yStr : todayStr;
    } else {
      archiveSelectedDay = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(daysInMonth).padStart(2, '0');
    }
  }

  const weekDays = isAr ? ['س', 'ح', 'ن', 'ث', 'ر', 'خ', 'ج'] : ['Sa', 'Su', 'Mo', 'Tu', 'We', 'Th', 'Fr'];
  const startDayPad = (targetDate.getDay() + 1) % 7;

  let daysHtml = '';
  for (let p = 0; p < startDayPad; p++) {
    daysHtml += `<div class="archive-cal__day is-empty" aria-hidden="true"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dayStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const isFuture = dayStr > todayStr;
    const isSelected = dayStr === archiveSelectedDay;
    const dayResults = allDailies[dayStr] || {};
    const doneCount = Object.keys(dayResults).length;
    const isAll = doneCount === DAILY_GAMES.length;

    let badge = '';
    if (!isFuture && doneCount > 0) {
      badge = `<span class="archive-cal__badge${isAll ? ' is-all' : ''}">${isAll ? '★' : doneCount}</span>`;
    }

    daysHtml += `
      <button type="button" class="archive-cal__day${isSelected ? ' is-selected' : ''}${isFuture ? ' is-future' : ''}" onclick="selectArchiveDay('${dayStr}')" ${isFuture ? 'disabled' : ''}>
        <span>${d}</span>
        ${badge}
      </button>`;
  }

  const selectedResults = allDailies[archiveSelectedDay] || {};
  const selectedDoneCount = Object.keys(selectedResults).length;

  el.innerHTML = `
    <div class="archive-cal-wrap card">
      <div class="segmented" style="margin-bottom:var(--sp-3)">
        <button type="button" class="segmented__item ${archiveMonthOffset === 1 ? 'is-active' : ''}" onclick="setArchiveMonth(1)">${escapeHTML(curMonthLabel)}</button>
        <button type="button" class="segmented__item ${archiveMonthOffset === 0 ? 'is-active' : ''}" onclick="setArchiveMonth(0)">${escapeHTML(prevMonthLabel)}</button>
      </div>

      <div class="archive-cal" dir="${isAr ? 'rtl' : 'ltr'}">
        ${weekDays.map(w => `<div class="archive-cal__head">${escapeHTML(w)}</div>`).join('')}
        ${daysHtml}
      </div>
      <div class="field__hint" style="text-align:center;margin:0">
        ${escapeHTML((t.daily_archive_solved_count || 'اتحل {n} من {m}').replace('{n}', selectedDoneCount).replace('{m}', DAILY_GAMES.length))}
      </div>
    </div>

    <div class="section__head" style="margin-bottom:var(--sp-2)">
      <span class="section__emoji" aria-hidden="true">📅</span>
      <h2 class="section__title">${escapeHTML((t.daily_archive_selected || 'تحديات {day}').replace('{day}', archiveSelectedDay))}</h2>
    </div>

    <div class="daily-list">
      ${DAILY_GAMES.map(g => {
        const cat = CATALOG_BY_ID[g.id] || {};
        const result = selectedResults[g.id];
        return `
          <div class="tool-item daily-row${result ? ' is-done' : ''}" data-accent="${cat.accent || 'amber'}" data-game="${g.id}">
            <span class="tool-icon" aria-hidden="true">${typeof iconHtml === 'function' ? iconHtml(cat.icon || '🎮') : (cat.icon || '🎮')}</span>
            <span class="tool-info">
              <span class="tool-name">${escapeHTML(t[cat.title] || g.id)}</span>
              <span class="tool-desc">${result ? escapeHTML(g.line(result)) : escapeHTML(t.daily_archive_not_done || 'لم يُحل في يومه')}</span>
            </span>
            <button type="button" class="btn btn--secondary btn--sm" onclick="playArchive('${g.id}', '${archiveSelectedDay}')">
              ${result ? '🔄 ' + escapeHTML(t.daily_archive_replay || 'العب تاني') : '▶ ' + escapeHTML(t.daily_archive_play || 'العب')}
            </button>
          </div>`;
      }).join('')}
    </div>`;
}

soloRegister('daily_archive', { setup: 'setup-daily-archive', paintSetup: renderDailyArchive });

function calcBestDailyStreak() {
  const all = soloDailyAll();
  const days = Object.keys(all).filter(d => Object.keys(all[d] || {}).length > 0).sort();
  if (!days.length) return 0;
  let maxStreak = 0;
  let cur = 0;
  let prevDate = null;
  for (const dayStr of days) {
    const p = dayStr.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    if (prevDate) {
      const diffDays = Math.round((d - prevDate) / (1000 * 3600 * 24));
      if (diffDays === 1) {
        cur++;
      } else if (diffDays > 1) {
        cur = 1;
      }
    } else {
      cur = 1;
    }
    prevDate = d;
    if (cur > maxStreak) maxStreak = cur;
  }
  return Math.max(maxStreak, soloStreak());
}

function calcTotalDailiesDone() {
  const all = soloDailyAll();
  let count = 0;
  for (const dayStr in all) {
    if (all[dayStr]) {
      count += Object.keys(all[dayStr]).length;
    }
  }
  return count;
}

      const lvlLabel = t[lvl.label] || lvl.key || t.stats_record || 'أفضل رقم';
      levelsHtml += `
        <div class="stats-level-box">
          <span class="stats-level-name">${escapeHTML(lvlLabel)}</span>
          <span class="stats-level-val">${escapeHTML(valStr)}</span>
        </div>`;
    });

    gamesHtml += `
      <div class="card stats-game-card" data-accent="${accent}">
        <div class="stats-game-head">
          <span class="tool-icon" aria-hidden="true">${typeof iconHtml === 'function' ? iconHtml(icon) : icon}</span>
          <span class="stats-game-title">${escapeHTML(title)}</span>
        </div>
        <div class="stats-levels">
          ${levelsHtml}
        </div>
      </div>`;
  });

  el.innerHTML = `
    <div class="section__head" style="margin-bottom:var(--sp-2)">
      <span class="section__emoji" aria-hidden="true">📊</span>
      <h2 class="section__title">${escapeHTML(t.stats_sec_daily || 'إحصائيات تحدي اليوم')}</h2>
    </div>

    <div class="stats-summary card">
      <div class="solo-stat">
        <span class="solo-stat__label">${escapeHTML(t.stats_streak || 'السلسلة الحالية')}</span>
        <b class="metric">${currentStreak ? '🔥 ' + currentStreak : '—'}</b>
      </div>
      <div class="solo-stat">
        <span class="solo-stat__label">${escapeHTML(t.stats_best_streak || 'أطول سلسلة')}</span>
        <b class="metric">${bestStreak ? '⭐ ' + bestStreak : '—'}</b>
      </div>
      <div class="solo-stat">
        <span class="solo-stat__label">${escapeHTML(t.stats_total_dailies || 'تحديات تم حلها')}</span>
        <b class="metric">${totalDailies ? totalDailies : '—'}</b>
      </div>
    </div>

    ${statsNightsHtml(t)}

    <div class="section__head" style="margin-bottom:var(--sp-2);margin-top:var(--sp-4)">
      <span class="section__emoji" aria-hidden="true">🏆</span>
      <h2 class="section__title">${escapeHTML(t.stats_sec_solo || 'أفضل أرقام الألعاب')}</h2>
    </div>

    <div class="stats-games-list">
      ${gamesHtml}
    </div>`;
}

/** «ليالينا»: the room evenings this phone was at, added up by name (rememberNight in JS_Room.html). */
function statsNightsHtml(t) {
  const nights = typeof readNights === 'function' ? readNights() : [];
  if (!nights.length) return '';
  const table = {};
  nights.forEach(n => {
    const top = n.board[0] ? n.board[0].score : 0;
    n.board.forEach(r => {
      const key = typeof foldWord === 'function' ? foldWord(r.name) : r.name;
      const row = table[key] || (table[key] = { name: r.name, score: 0, won: 0 });
      row.score += r.score;
      if (r.score === top) row.won++;
    });
  });
  const rows = Object.values(table).sort((a, b) => b.won - a.won || b.score - a.score).slice(0, 10);
  const recent = nights.slice(-5).reverse();
  return `
    <div class="section__head" style="margin-bottom:var(--sp-2);margin-top:var(--sp-4)">
      <span class="section__emoji" aria-hidden="true">🌙</span>
      <h2 class="section__title">${escapeHTML(t.stats_nights || '')}</h2>
    </div>
    <div class="card">
      <p class="field__hint">${escapeHTML((t.stats_nights_hint || '').replace('{n}', nights.length))}</p>
      ${rows.map((r, i) => `<div class="status-row"><span>${i === 0 ? '👑 ' : ''}<bdi>${escapeHTML(r.name)}</bdi></span>
        <span class="metric">${escapeHTML((t.stats_nights_won || '{n}').replace('{n}', r.won))} · ${escapeHTML((t.stats_nights_pts || '{n}').replace('{n}', r.score))}</span></div>`).join('')}
    </div>
    <div class="card" style="margin-top:var(--sp-2)">
      ${recent.map(n => `<div class="status-row"><span class="metric">${escapeHTML(n.day)}</span>
        <span>🏆 <bdi>${escapeHTML(n.board[0].name)}</bdi></span></div>`).join('')}
    </div>`;
}

soloRegister('stats', { setup: 'setup-stats', paintSetup: renderStats });

  id: 'stats',

  accent: 'indigo',
  group: 'tools',
  setup: 'setup-stats',
  open: () => openStats()
};
if (typeof GAME_CATALOG !== 'undefined' && !GAME_CATALOG.some(g => g.id === 'stats')) {
  GAME_CATALOG.push(STATS_CATALOG_ENTRY);
  if (typeof CATALOG_BY_ID !== 'undefined') CATALOG_BY_ID['stats'] = STATS_CATALOG_ENTRY;
}
