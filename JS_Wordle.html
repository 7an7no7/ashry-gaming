<script>
/* --- WORDLE GAME LOGIC --- */

// The word lists and the keypad (WORDLE_DB, WORDLE_LAYOUTS) are WordleWords.js, shared with the rooms server.

/** The language of the word on the board (a game saved before this was kept follows the games' language). */
function wordleLang() {
    const lang = (appState.wordle && appState.wordle.lang) || contentLang();
    return lang === 'ar' ? 'ar' : 'en';
}

function setupWordle() {
    setView('setup-wordle');
}

/**
 * A new board of `length` letters, or today's puzzle (`daily`): 5 letters in
 * the games' language, the same word on every phone on the date (dealt from
 * the same list with soloRng(soloDaySeed('wordle'))), 6 tries, played once.
 * Started again while it's under way, it goes back to that board.
 */
function startWordleGame(length, daily) {
    if (daily && soloDailyResume('wordle')) return;
    // Played once: today's, once finished, is never dealt again (a past day from the archive may be).
    if (daily && !soloArchiveDay && soloDailyResult('wordle')) { setupWordle(); return; }
    if (daily) length = WORDLE_DAILY_LEN;
    const lang = contentLang();
    const db = WORDLE_DB[lang][length];

    if(!db || db.length === 0) {
        showToast("No words found for this length!", "Error");
        return;
    }
    // Today's daily in progress is kept aside, never lost, when another board is dealt.
    soloDailySetAside('wordle');
    soloNewGame('wordle');

    // The keypad types the word, so it follows the language the word was
    // dealt in, not whatever the games' language is changed to later.
    appState.wordle.lang = lang;
    appState.wordle.wordLength = length;
    // Rule: Increase tries to 7 if length > 6
    appState.wordle.maxTries = length > 6 ? 7 : 6;

    const picked = daily
        ? soloPick(db, soloRng(soloDaySeed('wordle')))
        : freshPick('wordle:' + lang + ':' + length, db, 1)[0];
    // The Arabic keypad has a single alef, so a word spelled with أ, إ or آ
    // could never be typed and the game could not be won. It is played with
    // the plain letter, and the real spelling is shown at the end.
    appState.wordle.displayWord = picked;
    appState.wordle.targetWord = foldWordleWord(picked).toUpperCase();
    appState.wordle.currentGuess = "";
    appState.wordle.guesses = [];
    appState.wordle.status = "playing";
    // What the dailies read (JS_Solo.html): a board in play, and whose day it is.
    appState.wordle.phase = 'play';
    appState.wordle.daily = daily ? soloToday() : '';
    delete appState.wordle.archive;

    renderWordleBoard();
    renderKeyboard();
    saveToLocal();
    setView('play-wordle');
}

const WORDLE_DAILY_LEN = 5;

/** Back to the board in play (a daily set aside and brought back). */
function continueWordle() {
    renderWordleBoard();
    renderKeyboard();
    setView('play-wordle');
}

/** The setup screen's daily line: play today's word, carry on with it, or that it's done. */
function paintWordleSetup() {
    const el = document.getElementById('wordle-daily');
    if (el) el.innerHTML = soloDailyButtonHtml('wordle', 'startWordleGame(5, true)');
}

/** "📅 تحدي اليوم" (or the archive's day) over a daily's board. */
function paintWordleBadge() {
    const el = document.getElementById('wordle-daily-badge');
    if (!el) return;
    const s = appState.wordle;
    const t = TRANSLATIONS[appState.lang] || {};
    const html = s.archive
        ? `<span class="badge badge--warning">📅 ${escapeHTML(t.daily_archive_badge || '')} ${escapeHTML(s.archive)}</span>`
        : (s.daily ? `<span class="badge">📅 ${escapeHTML(t.daily_title || '')}</span>` : '');
    el.innerHTML = html;
    el.classList.toggle('hidden', !html);
}

function renderWordleBoard() {
    const container = document.getElementById('wordle-grid');
    const len = appState.wordle.wordLength;
    const cell = (cls, char) => `<div class="wordle-cell ${cls}">${char || ''}</div>`;
    const rows = [];

    // Completed guesses
    appState.wordle.guesses.forEach(guess => {
        const result = checkGuess(guess);
        let cells = '';
        for (let i = 0; i < len; i++) {
            cells += cell('wordle-cell--' + result[i] + ' animate-flip', guess[i]);
        }
        rows.push(cells);
    });

    // The row being typed
    if (appState.wordle.status === 'playing') {
        let cells = '';
        for (let i = 0; i < len; i++) {
            const char = appState.wordle.currentGuess[i];
            cells += char
                ? cell('wordle-cell--filled animate-pop', char)
                : cell('wordle-cell--empty');
        }
        rows.push(cells);
    }

    // Rows still to come
    const rowsLeft = appState.wordle.maxTries - appState.wordle.guesses.length -
                     (appState.wordle.status === 'playing' ? 1 : 0);
    for (let r = 0; r < rowsLeft; r++) {
        rows.push(cell('wordle-cell--empty').repeat(len));
    }

    // Real rows rather than one long grid, so each row can size independently
    // and the board stays square at any word length.
    container.style.gridTemplateColumns = '';
    // The stylesheet caps the board by height as well as width, and needs the
    // shape to do it — an 8-letter board gets a seventh row.
    container.style.setProperty('--wordle-cols', len);
    container.style.setProperty('--wordle-rows', appState.wordle.maxTries);
    container.innerHTML = rows.map(cells =>
        `<div class="wordle-row" style="grid-template-columns: repeat(${len}, 1fr)">${cells}</div>`
    ).join('');
    paintWordleBadge();
}

function renderKeyboard() {
    const kbContainer = document.getElementById('wordle-keyboard');

    const layout = WORDLE_LAYOUTS[wordleLang()];
    const keyState = getKeyboardState();

    const keyClass = (char) => {
        const status = keyState[char];
        return status ? ' key--' + status : '';
    };

    // Enter and Backspace get their own row: on the widest Arabic row (12 keys)
    // squeezing them in alongside dropped every key well under a 44px target.
    const rows = layout.map(row =>
        `<div class="keypad__row">` +
        row.split('').map(char =>
            `<button class="key${keyClass(char)}" onclick="handleWordleKey('${char}')">${char}</button>`
        ).join('') +
        `</div>`
    );

    const enterLabel = appState.lang === 'ar' ? 'تحقق' : 'Enter';
    rows.push(
        `<div class="keypad__row">` +
        `<button class="key key--wide" onclick="handleWordleKey('BACK')" aria-label="Backspace">⌫</button>` +
        `<button class="key key--wide" onclick="handleWordleKey('ENTER')">${enterLabel}</button>` +
        `</div>`
    );

    kbContainer.className = 'keypad';
    kbContainer.innerHTML = rows.join('');
}

/** One alef for all its hamza forms - the keypad only has the plain one. */
function foldWordleWord(word) {
    return String(word).replace(/[أإآ]/g, 'ا');
}

function handleWordleKey(key) {
    if(appState.wordle.status !== 'playing') return;

    if(key === 'ENTER') {
        submitWordleGuess();
    } else if(key === 'BACK') {
        if(appState.wordle.currentGuess.length > 0) {
            appState.wordle.currentGuess = appState.wordle.currentGuess.slice(0, -1);
            renderWordleBoard();
        }
    } else {
        if(appState.wordle.currentGuess.length < appState.wordle.wordLength) {
            appState.wordle.currentGuess += foldWordleWord(key);
            renderWordleBoard();
        }
    }
}

function submitWordleGuess() {
    if(appState.wordle.currentGuess.length !== appState.wordle.wordLength) {
        playSound('alarm');
        const msg = appState.lang === 'ar' ? "الكلمة قصيرة جداً!" : "Word too short!";
        showToast(msg);
        // The row you are typing in shakes: the feedback every word game gives.
        // `animate-shake` is the one Connections already uses. Removed on a timer
        // as well, so a second short word shakes again (an animation that is
        // suppressed fires no animationend at all).
        const row = document.querySelectorAll('#wordle-grid .wordle-row')[appState.wordle.guesses.length];
        if (row && typeof motionOff === 'function' && !motionOff()) {
            row.classList.remove('animate-shake');
            void row.offsetWidth;                       // restart it mid-shake
            row.classList.add('animate-shake');
            setTimeout(() => row.classList.remove('animate-shake'), 600);
        }
        return;
    }

    appState.wordle.guesses.push(appState.wordle.currentGuess);
    
    // Check Win/Loss
    if(appState.wordle.currentGuess === appState.wordle.targetWord) {
        appState.wordle.status = "won";
        appState.wordle.phase = 'done';
        appState.wordle.currentGuess = "";   // don't leave a half-row in state
        wordleResultSoon(true);
    } else if(appState.wordle.guesses.length >= appState.wordle.maxTries) {
        appState.wordle.status = "lost";
        appState.wordle.phase = 'done';
        appState.wordle.currentGuess = "";
        wordleResultSoon(false);
    } else {
        playSound('click');
        appState.wordle.currentGuess = "";
    }

    renderWordleBoard();
    renderKeyboard();
    saveToLocal();
}

function checkGuess(guess) {
    let result = Array(appState.wordle.wordLength).fill('absent');
    let targetArr = appState.wordle.targetWord.split('');
    let guessArr = guess.split('');

    // 1. Check Greens (Correct position)
    for(let i=0; i<appState.wordle.wordLength; i++) {
        if(guessArr[i] === targetArr[i]) {
            result[i] = 'correct';
            targetArr[i] = null; // Mark as used
            guessArr[i] = null;
        }
    }

    // 2. Check Yellows (Wrong position)
    for(let i=0; i<appState.wordle.wordLength; i++) {
        if(guessArr[i] !== null) { // Skip already matched
            const idx = targetArr.indexOf(guessArr[i]);
            if(idx !== -1) {
                result[i] = 'present';
                targetArr[idx] = null; // Mark used
            }
        }
    }
    return result;
}

function getKeyboardState() {
    let state = {};
    appState.wordle.guesses.forEach(guess => {
        const result = checkGuess(guess);
        for(let i=0; i<guess.length; i++) {
            const char = guess[i];
            const status = result[i];
            
            // Priority: correct > present > absent > unused
            if(state[char] === 'correct') continue;
            if(status === 'correct') state[char] = 'correct';
            else if(status === 'present' && state[char] !== 'correct') state[char] = 'present';
            else if(status === 'absent' && !state[char]) state[char] = 'absent';
        }
    });
    return state;
}

/**
 * The result a second after the last row, once it has turned over: only for
 * the game that ended, and only on its board (soloLater: a new game dealt in
 * that second has its own word). A daily's result is kept at once, so a
 * reload in that second can't lose it or play it again.
 */
function wordleResultSoon(win) {
    const s = appState.wordle;
    const word = s.displayWord || s.targetWord;
    const tries = s.guesses.length;
    const max = s.maxTries;
    const rows = s.guesses.map(g => checkGuess(g));
    const t = TRANSLATIONS[appState.lang] || {};
    let share = '';
    if (s.daily) {
        soloMarkDaily('wordle', { won: win, tries: tries, max: max }, s.daily);
        share = wordleShareText(t, s.daily, win, tries, max, rows, s.lang);
    }
    soloLater('wordle', motionOff() ? 0 : 1000, () => soloResult({
        icon: win ? '🟩' : '🟨',
        title: win ? (t.wordle_won || '') : (t.wordle_lost || ''),
        value: win ? tries : undefined,
        valueText: win ? '' : `X/${max}`,
        valueLabel: (t.wordle_tries_of || '').replace('{max}', max),
        lines: [`${escapeHTML(t.wordle_word_was || '')} <b class="tx-accent">${escapeHTML(String(word || ''))}</b>`],
        win: win, share: share,
        again: () => startWordleGame(s.wordLength || 5, false), exit: setupWordle
    }));
}

/**
 * A daily's result for WhatsApp, Wordle's way: the tries, then a row of
 * 🟩🟨⬛ a guess - the colours only, never the letters. An Arabic row starts
 * with a right-to-left mark, so its first square (the word's first letter)
 * sits on the right, as it does on the board.
 */
function wordleShareText(t, day, win, tries, max, rows, lang) {
    const sq = { correct: '🟩', present: '🟨', absent: '⬛' };
    const lead = lang === 'ar' ? '\u200F' : '';
    const grid = rows.map(r => lead + r.map(x => sq[x] || '⬛').join('')).join('\n');
    return `${soloShareHeader(t, day)}\n🟩 ${t.setup_wordle || ''} ${win ? tries : 'X'}/${max}\n${grid}`;
}

/** A reload on the board: drawn as it was left. */
function restoreWordle() {
    const s = appState.wordle;
    if (!s || !s.targetWord) return false;
    renderWordleBoard();
    renderKeyboard();
    return true;
}

/**
 * A computer's keyboard types too: the letters of the word's language (an
 * Arabic key's hamza forms fold to the keypad's alef, and the لا key gives
 * both letters), Backspace and Enter. Not while typing in a field or with a
 * popup open.
 */
function wordleKeyFromKeyboard(e) {
    if (appState.currentView !== 'play-wordle' || appState.wordle.status !== 'playing') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (document.querySelector('.modal-overlay:not(.hidden)')) return;
    if (e.key === 'Enter') { e.preventDefault(); handleWordleKey('ENTER'); return; }
    if (e.key === 'Backspace') { e.preventDefault(); handleWordleKey('BACK'); return; }
    // One character, or the Arabic لا key; never a named key such as "Tab".
    if (!e.key || !(e.key.length === 1 || /^ل[اأإآ]$/.test(e.key))) return;
    const keys = WORDLE_LAYOUTS[wordleLang()].join('');
    const chars = foldWordleWord(wordleLang() === 'en' ? e.key.toUpperCase() : e.key).split('');
    if (!chars.every(ch => keys.indexOf(ch) !== -1)) return;
    e.preventDefault();
    chars.forEach(ch => handleWordleKey(ch));
}

// The content check loads this file in Node, where there is no page.
if (typeof document !== 'undefined') {
    document.addEventListener('keydown', wordleKeyFromKeyboard);
}
if (typeof onLanguageChange === 'function') {
    onLanguageChange(view => { if (view === 'play-wordle') { renderKeyboard(); paintWordleBadge(); } });
}
// JS_Solo.html loads after this file: it registers the game once it is there.
if (typeof window !== 'undefined') {
    (window.SOLO_LATE = window.SOLO_LATE || []).push(() => soloRegister('wordle', {
        setup: 'setup-wordle', play: 'play-wordle', paintSetup: paintWordleSetup, restore: restoreWordle,
        state: () => appState.wordle, resume: continueWordle, repaint: () => { renderWordleBoard(); renderKeyboard(); }
    }));
}
</script>
