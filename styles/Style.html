<style>
/* ============================================================================
   ASHRY GAMING — DESIGN SYSTEM
   ----------------------------------------------------------------------------
   Mobile-first. Everything below is driven by the tokens in section 1, so a
   colour, radius, duration or spacing change happens in exactly one place.

   Per-screen colour comes from `data-accent` on the view element: components
   inside read --accent / --accent-soft / --accent-ink and re-tint themselves,
   which is what gives each game its own identity without one-off CSS.

   Sections
     1  Tokens                 6  Cards, tiles, rows
     2  Base & reset           7  Forms
     3  App shell              8  Sheets, modals, toasts
     4  Motion                 9  Game-specific
     5  Buttons               10  Accessibility

   This file holds sections 1-8. The rest of the stylesheet is in parts, each
   saying at its top what it holds, included by Controller.html in this order
   (later rules win, so the order is part of the CSS): Style_Screens, Style_Home,
   Style_Party, Style_Finish, Style_Solo, Style_Cards, Style_Boards, Style_Chess,
   Style_Arcade, Style_Living, Style_Rooms, Style_Night, Style_Talk. A new
   section goes at the end of the last part (or a new part after it).
   ========================================================================= */

/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root {
  color-scheme: light;

  /* --- Neutral ramp (slate) --- */
  --n-0:   #ffffff;
  --n-25:  #fcfdfe;
  --n-50:  #f8fafc;
  --n-100: #f1f5f9;
  --n-200: #e2e8f0;
  --n-300: #cbd5e1;
  --n-400: #94a3b8;
  --n-500: #64748b;
  --n-600: #475569;
  --n-700: #334155;
  --n-800: #1e293b;
  --n-900: #0f172a;
  --n-950: #020617;

  /* --- Surfaces --- */
  /* The ground is warm paper, not cold slate. The neutral ramp above is still
     the slate it always was (a handful of rules reference it directly); what
     changed is the surfaces built on it, each held to within ~1% of the
     luminance it had, so the contrast ratios below are unaffected. A cool
     blue-grey page under white cards is the single thing that read as
     "default framework" from across the room. */
  --bg:            #f5f3ee;
  --surface:       rgba(255, 255, 255, 0.92);
  --surface-solid: var(--n-0);
  --surface-2:     #faf8f4;
  /* Measured, not picked: this is the lightest warm step that clears AA for
     every ink that ever sits on it (a segmented track before its thumb has
     been measured is the tight case, with --warning-ink on it) - and it
     beats the cold #f1f5f9 it replaced on all eight palettes. */
  --surface-3:     #f7f5f1;
  --surface-sunken: #f0ede7;
  --elevated:      var(--n-0);
  --border:        rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.14);
  --hairline:      rgba(15, 23, 42, 0.06);

  /* --- Text --- */
  --text:   var(--n-700);
  /* Not straight off the neutral ramp: n-500 lands at 4.34:1 on the page
     background and n-400 at 2.34:1, so the section titles, ghost-button
     labels and every field hint sat under AA. These are the same hues, dark
     enough to clear it on both the page and a card. */
  --text-2: #51607a;
  --text-3: #5f6e85;
  --text-strong: var(--n-900);

  /* --- Semantic --- */
  --success:      #059669;
  --success-ink:  #047857;
  --success-soft: #ecfdf5;
  --danger:       #e11d48;
  --danger-ink:   #be123c;
  --danger-soft:  #fff1f2;
  --warning:      #d97706;
  --warning-ink:  #a64b06;
  --warning-soft: #fffbeb;

  /* Solid semantic buttons: white is not readable on every one of these, and
     which one it is changes between the themes. Same idea as --accent-on. */
  --success-btn:  #047857;   /* darkened; white on #059669 is 3.8:1 */
  --success-on:   #ffffff;
  --danger-btn:   #e11d48;
  --danger-on:    #ffffff;
  --warning-btn:  #b45309;
  --warning-on:   #ffffff;
  --info:         #2563eb;
  --info-soft:    #eff6ff;
  --info-btn:     #2563eb;
  /* The two sides of أسماء الرموز and دوري المعرفة: a fill with white on it, and
     an ink for text on the page (the fill is 2.8:1 on the dark card). */
  --team-red:      #e11d48;
  --team-blue:     #2563eb;
  --team-red-ink:  #be123c;
  --team-blue-ink: #1d4ed8;

  /* --- Default accent (brand violet); overridden by [data-accent] --- */
  --accent:        #6d28d9;
  --accent-hover:  #5b21b6;
  --accent-ink:    #6d28d9;
  --accent-soft:   #f5f3ff;
  --accent-border: #ddd6fe;
  --accent-on:     #ffffff;
  --accent-glow:   rgba(109, 40, 217, 0.28);

  /* --- Type scale --- */
  --font: 'Cairo', 'Twemoji Country Flags', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* Titles, numerals and anything that carries a screen are set in Baloo
     Bhaijaan 2 - a rounded Arabic-and-Latin display face that was already on
     the wire for سكرو's card numerals, so it costs nothing new. Cairo stays
     the reading face. Both are asked for as variable ranges now (300-900 and
     400-800), which is fewer bytes than the six static cuts they replaced and
     is what gives the weight scale below a floor. */
  --font-display: 'Baloo Bhaijaan 2', 'Cairo', 'Twemoji Country Flags', ui-sans-serif, system-ui, sans-serif;

  /* --- Weight scale ---
     There was no weight under 600 anywhere in the app, so nothing could read
     as emphatic: a card's title and its description were both heavy and only
     3px apart. Secondary text sits at --fw-quiet / --fw-body now and the top
     of the range is kept for the things that carry a screen. */
  --fw-quiet: 400;
  --fw-body:  500;
  --fw-med:   600;
  --fw-semi:  700;
  --fw-bold:  800;
  --fw-black: 900;
  --fs-display: 2.25rem;   /* 36 — hero numbers */
  --fs-h1:      1.375rem;  /* 22 */
  --fs-h2:      1.125rem;  /* 18 */
  --fs-h3:      1rem;      /* 16 */
  --fs-body:    0.9375rem; /* 15 */
  --fs-sm:      0.8125rem; /* 13 */
  --fs-xs:      0.6875rem; /* 11 */
  --lh-tight: 1.15;
  --lh-snug:  1.35;
  --lh-body:  1.6;

  /* --- Spacing (4px base) --- */
  --sp-1: 0.25rem;  --sp-2: 0.5rem;   --sp-3: 0.75rem; --sp-4: 1rem;
  --sp-5: 1.25rem; --sp-6: 1.5rem;  --sp-7: 2rem; --sp-8: 2.5rem; --sp-9: 3rem;

  /* --- Radii --- */
  /* Tighter than they were: 26px corners on every card read as toy-like next
     to 15px text. Cards sit at 20px, controls at 12-14px. */
  --r-xs: 0.5rem; --r-sm: 0.625rem; --r-md: 0.875rem; --r-lg: 1rem;
  --r-xl: 1.25rem; --r-2xl: 1.5rem; --r-full: 999px;

  /* --- Elevation --- */
  /* Warm-neutral, not blue-black: a cold shadow on warm paper reads as dirt
     rather than depth. Same geometry and much the same weight as before. */
  --sh-1: 0 1px 2px rgba(46, 37, 26, 0.055);
  --sh-2: 0 1px 2px rgba(46, 37, 26, 0.045), 0 4px 12px -6px rgba(46, 37, 26, 0.09);
  --sh-3: 0 2px 6px rgba(46, 37, 26, 0.045), 0 8px 22px -10px rgba(46, 37, 26, 0.13);
  --sh-4: 0 20px 48px -12px rgba(28, 22, 16, 0.24);
  --sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.7);

  /* --- Motion --- */
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in:     cubic-bezier(0.55, 0, 1, 0.45);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.45, 0.5, 1);
  --dur-1: 120ms;  /* press / hover */
  --dur-2: 200ms;  /* control state */
  --dur-3: 300ms;  /* view + sheet */
  --dur-4: 460ms;  /* celebratory */
  --press-scale: 0.965;

  /* --- Layers, bottom to top ---
     Everything that sits on the page rather than inside one component takes
     one of these, so a new popup can't land under a toast, or a flying card
     under the header, by picking a number. Small numbers inside a component
     (a card's corner, a piece on a board) stay local. The values are the ones
     each layer always had; only the names are new (22 Sep 2026). */
  --z-chrome:     20;       /* the header and the bottom bar */
  --z-banner:     25;       /* "you're in a room", under the header */
  --z-float:      60;       /* over the page: the turn banner, the sync note, a game's ghosts */
  --z-float-hi:   90;       /* ghosts that pass over those */
  --z-modal:      100;      /* popups and sheets */
  --z-alert:      200;      /* an alert over a popup */
  --z-confirm:    250;      /* a confirm over an alert */
  --z-toast:      400;
  --z-splash:     9000;     /* a room dealing a game, on every phone */
  --z-intro:      9999;     /* the intro (Controller.html's first-paint CSS) */
  --z-fx:         10000;    /* a card game's motion, over the whole table */
  --z-fx-ghost:   10001;    /*   a card or tile in flight, a ring */
  --z-fx-pop:     10002;    /*   a pop, a spark, a sign */
  --z-fx-stamp:   10003;    /*   a stamp, a band across the table */
  --z-fx-top:     10004;    /*   an UNO! shout, over all of it */
  --z-full:       99990;    /* a full-screen tool (على راسك) */
  --z-full-top:   99999;    /* مين يبدأ, over one */
  --z-full-modal: 100010;   /* a popup over a full-screen tool */
  --z-full-toast: 100020;   /* a toast over that */
  --z-points:     100030;   /* points flying to the board */
  --z-slam:       100040;   /* وقف's slam */
  --z-confetti:   100050;   /* over everything (JS_Sounds.html reads it) */

  /* --- Layout --- */
  --shell-max: 32.5rem;
  --header-h: 3.5rem;
  --nav-h: 3.875rem;
  --tap: 2.75rem;               /* minimum touch target */
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}

body.dark {
  color-scheme: dark;

  /* Dark is ink, not slate: the same steps leaned a few degrees toward the
     brand violet so the night theme belongs to the mark rather than to a
     framework's default grey. Every one of these is darker than the slate it
     replaces, so the text ratios below only improve. */
  --bg:            #14121e;
  --surface:       rgba(32, 29, 46, 0.92);
  --surface-solid: #201d2e;
  --surface-2:     #1a1826;
  --surface-3:     #2f2b40;
  --surface-sunken: #0d0b14;
  --elevated:      #232032;
  --border:        rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.18);
  --hairline:      rgba(255, 255, 255, 0.06);

  --text:   #e8eef7;
  --text-2: #a3b1c4;      /* n-400 was 4.04:1 on the segmented track */
  --text-3: #8b98ac;      /* n-500 was 3.07:1 on a dark card */
  --text-strong: #ffffff;

  --success:      #10b981;
  --success-ink:  #6ee7b7;
  --success-soft: rgba(16, 185, 129, 0.14);
  --danger:       #f43f5e;
  --danger-ink:   #fda4af;
  --danger-soft:  rgba(244, 63, 94, 0.15);
  --warning:      #f59e0b;
  --warning-ink:  #fcd34d;
  --warning-soft: rgba(245, 158, 11, 0.15);

  /* Dark semantics are bright by design, so the button text goes dark. */
  --success-btn:  #10b981;
  --success-on:   #032018;
  --danger-btn:   #f43f5e;
  --danger-on:    #2b0410;
  --warning-btn:  #f59e0b;
  --warning-on:   #1c1200;
  --info:         #3b82f6;
  --info-soft:    rgba(59, 130, 246, 0.15);
  --info-btn:     #1d4ed8;   /* white on #3b82f6 is 3.7:1 */
  --team-red:      #e11d48;
  --team-blue:     #2563eb;
  --team-red-ink:  #fb7185;
  --team-blue-ink: #93c5fd;

  --accent:        #8b5cf6;
  --accent-hover:  #a78bfa;
  --accent-ink:    #c4b5fd;
  --accent-soft:   rgba(139, 92, 246, 0.16);
  --accent-border: rgba(139, 92, 246, 0.32);
  --accent-on:     #0b0518;   /* white is only 4.23:1 on this violet */
  --accent-glow:   rgba(139, 92, 246, 0.32);

  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --sh-2: 0 2px 8px -2px rgba(0, 0, 0, 0.5);
  --sh-3: 0 8px 24px -8px rgba(0, 0, 0, 0.6);
  --sh-4: 0 20px 48px -12px rgba(0, 0, 0, 0.7);
  --sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* --- Accent palettes -------------------------------------------------------
   Set data-accent on a view (or any container) and everything inside re-tints.
   -------------------------------------------------------------------------- */
[data-accent="violet"] { --accent:#6d28d9; --accent-hover:#5b21b6; --accent-ink:#6d28d9; --accent-soft:#f5f3ff; --accent-border:#ddd6fe; --accent-glow:rgba(109,40,217,.28); --accent-on:#ffffff; }
[data-accent="indigo"] { --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-border:#c7d2fe; --accent-glow:rgba(79,70,229,.28); --accent-on:#ffffff; }
[data-accent="blue"]   { --accent:#2563eb; --accent-hover:#1d4ed8; --accent-ink:#1d4ed8; --accent-soft:#eff6ff; --accent-border:#bfdbfe; --accent-glow:rgba(37,99,235,.28); --accent-on:#ffffff; }
[data-accent="teal"]   { --accent:#0f766e; --accent-hover:#0c5f59; --accent-ink:#0f766e; --accent-soft:#f0fdfa; --accent-border:#99f6e4; --accent-glow:rgba(13,148,136,.28); --accent-on:#ffffff; }
[data-accent="green"]  { --accent:#047857; --accent-hover:#036347; --accent-ink:#047857; --accent-soft:#ecfdf5; --accent-border:#a7f3d0; --accent-glow:rgba(5,150,105,.28); --accent-on:#ffffff; }
[data-accent="amber"]  { --accent:#d97706; --accent-hover:#b45309; --accent-ink:#a64b06; --accent-soft:#fffbeb; --accent-border:#fde68a; --accent-glow:rgba(217,119,6,.30); --accent-on:#1c1200; }
[data-accent="orange"] { --accent:#c2410c; --accent-hover:#9c340a; --accent-ink:#c2410c; --accent-soft:#fff7ed; --accent-border:#fed7aa; --accent-glow:rgba(234,88,12,.30); --accent-on:#ffffff; }
[data-accent="rose"]   { --accent:#e11d48; --accent-hover:#be123c; --accent-ink:#be123c; --accent-soft:#fff1f2; --accent-border:#fecdd3; --accent-glow:rgba(225,29,72,.28); --accent-on:#ffffff; }
[data-accent="pink"]   { --accent:#db2777; --accent-hover:#be185d; --accent-ink:#be185d; --accent-soft:#fdf2f8; --accent-border:#fbcfe8; --accent-glow:rgba(219,39,119,.28); --accent-on:#ffffff; }

body.dark [data-accent="indigo"] { --accent:#6366f1; --accent-hover:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(99,102,241,.16); --accent-border:rgba(99,102,241,.32); --accent-glow:rgba(99,102,241,.34); --accent-on:#05041a; }
body.dark [data-accent="blue"]   { --accent:#3b82f6; --accent-hover:#60a5fa; --accent-ink:#93c5fd; --accent-soft:rgba(59,130,246,.16); --accent-border:rgba(59,130,246,.32); --accent-glow:rgba(59,130,246,.34); --accent-on:#08172e; }
body.dark [data-accent="teal"]   { --accent:#14b8a6; --accent-hover:#2dd4bf; --accent-ink:#5eead4; --accent-soft:rgba(20,184,166,.16); --accent-border:rgba(20,184,166,.32); --accent-glow:rgba(20,184,166,.34); --accent-on:#04201c; }
body.dark [data-accent="green"]  { --accent:#10b981; --accent-hover:#34d399; --accent-ink:#6ee7b7; --accent-soft:rgba(16,185,129,.16); --accent-border:rgba(16,185,129,.32); --accent-glow:rgba(16,185,129,.34); --accent-on:#032018; }
body.dark [data-accent="amber"]  { --accent:#f59e0b; --accent-hover:#fbbf24; --accent-ink:#fcd34d; --accent-soft:rgba(245,158,11,.16); --accent-border:rgba(245,158,11,.32); --accent-glow:rgba(245,158,11,.34); --accent-on:#1c1200; }
body.dark [data-accent="orange"] { --accent:#f97316; --accent-hover:#fb923c; --accent-ink:#fdba74; --accent-soft:rgba(249,115,22,.16); --accent-border:rgba(249,115,22,.32); --accent-glow:rgba(249,115,22,.34); --accent-on:#200d02; }
body.dark [data-accent="rose"]   { --accent:#f43f5e; --accent-hover:#fb7185; --accent-ink:#fda4af; --accent-soft:rgba(244,63,94,.16); --accent-border:rgba(244,63,94,.32); --accent-glow:rgba(244,63,94,.34); --accent-on:#2b0410; }
body.dark [data-accent="pink"]   { --accent:#ec4899; --accent-hover:#f472b6; --accent-ink:#f9a8d4; --accent-soft:rgba(236,72,153,.16); --accent-border:rgba(236,72,153,.32); --accent-glow:rgba(236,72,153,.34); --accent-on:#2a0616; }

/* ==========================================================================
   2. BASE & RESET
   ========================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  background-color: var(--bg);
  overscroll-behavior: none;
  /* Stops iOS from letting a double-tap zoom the whole app. */
  touch-action: manipulation;
}

/* Two viewport-locked gradient layers that cross-fade. The original design
   animated `background-position` across a 400%-wide gradient, repainting the
   whole viewport every frame for as long as the app was open; animating
   `opacity` on a fixed layer is composited on the GPU instead. Keeping the
   gradients off `body` also avoids `background-attachment: fixed`, which
   repaints on every scroll frame on mobile. */
/* One still wash behind the app. It used to be two gradient layers
   cross-fading for as long as the app was open; a backdrop that keeps moving
   is the first thing that tires the eyes, so it sits still now, and is only
   faintly tinted towards the brand colour at the top. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(170deg, #f7f4f0 0%, #f5f3ee 42%, #f3f0e9 100%);
}
body.dark::before { background: linear-gradient(170deg, #1a1628 0%, #14121e 48%, #110f1a 100%); }

.hidden { display: none !important; }

h1, h2, h3, h4 { margin: 0; line-height: var(--lh-tight); color: var(--text-strong); font-weight: 800; }
p { margin: 0; }

/* Scrollbars — visible enough to orient, quiet enough to ignore. */
::-webkit-scrollbar { width: 0.3125rem; height: 0.3125rem; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); }

::selection { background: var(--accent); color: var(--accent-on); }

/* ==========================================================================
   3. APP SHELL
   --------------------------------------------------------------------------
   A three-row grid: header / scrolling main / nav. The nav is a grid row
   rather than a fixed overlay, so content can never end up hidden behind it —
   which is what used to clip the Wordle keyboard and the player lists.
   ========================================================================== */
.shell {
  position: relative;
  width: 100%;
  max-width: var(--shell-max);
  margin-inline: auto;
  height: 100vh;
  height: 100dvh;
  /* The window's real height, kept by syncAppHeight in JS_Core.html. iOS goes
     on reporting the old 100dvh for a moment after the phone turns, which left
     a landscape screen laid out at portrait height - half of it off screen,
     with nothing to scroll. */
  height: var(--app-h, 100dvh);
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  padding-left: var(--safe-left);
  padding-right: var(--safe-right);
}

/* Rows are pinned. The room banner is display:none most of the time, and with
   nothing placed explicitly the main area slid up into the banner's auto row
   and the nav into the 1fr one: a stretched nav on short screens, and on long
   ones a nav pushed off the bottom. */
.shell__header      { grid-row: 1; }
.active-room-banner { grid-row: 2; }
.icon-banner        { grid-row: 3; }
.shell__main        { grid-row: 4; }
.shell__nav         { grid-row: 5; }

/* --- Header --- */
.shell__header {
  display: grid;
  grid-template-columns: minmax(auto, 1fr) auto minmax(auto, 1fr);
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--header-h);
  padding: var(--safe-top) var(--sp-3) 0;
  position: relative;
  z-index: var(--z-chrome);
}

.shell__title {
  grid-column: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  text-align: center;
  font-size: var(--fs-h2);
  font-weight: 900;
  color: var(--text-strong);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity var(--dur-2) var(--ease-out);
}
.shell__title-icon { font-size: 1.1rem; line-height: 1; }
#app-title-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.shell__title-icon:empty { display: none; }
/* A drawn game icon (أونو, الدومينو; ICON_ART in JS_Core.html): the size of the
   emoji it stands in for, wherever it is, so it grows with the font like one. */
.art-icon { display: inline-block; flex: none; width: 1.2em; height: 1.2em; vertical-align: -0.22em; overflow: visible; }

/* The title cross-fades on navigation so it doesn't pop. */
.shell__title.is-swapping { opacity: 0; }
#nav-back { grid-column: 1; justify-self: start; }
.shell__tools { grid-column: 3; justify-self: end; display: flex; align-items: center; }

/* --- Active Room Banner --- */
.active-room-banner {
  margin: 0 var(--sp-3) var(--sp-2);
  padding: 0.5rem var(--sp-3);
  background: linear-gradient(135deg, rgba(13, 148, 136, 0.18), rgba(99, 102, 241, 0.16));
  border: 1px solid rgba(20, 184, 166, 0.38);
  box-shadow: 0 4px 16px -2px rgba(13, 148, 136, 0.22);
  border-radius: var(--r-lg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  z-index: var(--z-banner);
  animation: slideDownFade 0.25s var(--ease-out);
}

@keyframes slideDownFade {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.arb__content {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  cursor: pointer;
  flex: 1;
}

.arb__badge {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  background: rgba(13, 148, 136, 0.25);
  border: 1px solid rgba(20, 184, 166, 0.45);
  padding: 2px 0.5rem;
  border-radius: var(--r-full);
  flex-shrink: 0;
}

.arb__pulse {
  position: relative;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: #10b981;
  flex-shrink: 0;
}
.arb__pulse::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: rgba(16, 185, 129, 0.7);
  animation: arbPulse 1.8s ease-out infinite;
}

@keyframes arbPulse {
  0%   { transform: scale(1); opacity: 0.7; }
  70%  { transform: scale(2.5); opacity: 0; }
  100% { transform: scale(2.5); opacity: 0; }
}

.arb__code {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-weight: 800;
  letter-spacing: 1.5px;
  font-size: var(--fs-xs);
  color: var(--text-strong);
}

.arb__desc {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.arb__actions {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  flex-shrink: 0;
}

.arb__btn {
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  font-size: var(--fs-xs);
  border-radius: var(--r-md);
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
}

.arb__btn--return {
  /* The token pair, not white on teal-600: that was 3.7:1 for 12px text. */
  background: var(--success-btn);
  color: var(--success-on);
  padding: 0.3125rem 0.75rem;
  min-height: 2.25rem;
  box-shadow: 0 2px 8px rgba(13, 148, 136, 0.35);
}

.arb__btn--return:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(13, 148, 136, 0.5);
}

.arb__btn--return:active {
  transform: translateY(0);
}

.arb__arrow {
  font-size: 1.1em;
  line-height: 1;
}

.arb__btn--leave {
  background: var(--danger-soft);
  color: var(--danger-ink);
  border: 1px solid var(--danger);
  width: 2.75rem;
  height: 2.75rem;
  padding: 0;
  border-radius: var(--r-full);
  font-size: 0.8125rem;
}

.arb__btn--leave:hover { filter: brightness(0.95); }

/* Unread chat on the banner (1295, paintRoomChatBanner): «💬 2» beside the code, a tap opens the chat. */
.arb__chat {
  display: inline-flex; align-items: center; gap: 0.25rem; flex-shrink: 0;
  min-height: 2rem; padding: 0 0.5rem;
  border: 1px solid var(--accent); border-radius: var(--r-full);
  background: var(--accent-soft); color: var(--accent-ink);
  font: 800 var(--fs-xs) / 1 var(--font); cursor: pointer;
}
.arb__chat[hidden] { display: none; }
/* «عودة»: the banner's ghost folding up where it stood (1299, roomBannerFold). */
.arb-ghost {
  position: fixed; z-index: var(--z-float); margin: 0; pointer-events: none;
  transform-origin: top center; animation: none;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}

/* --- Main scroll area --- */
.shell__main {
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  /* The foot padding is a variable because a sticky bar is held inside it:
     .view-actions reaches down by exactly this much (see there). */
  --main-pb: var(--sp-6);
  padding: var(--sp-2) var(--sp-4) var(--main-pb);
  scrollbar-gutter: stable;
  /* A column so a view can claim the leftover height when it needs to (see
     .view--fill); short views keep their natural height and don't stretch. */
  display: flex;
  flex-direction: column;
}
.shell__main > [id^="view-"]:not(.hidden) { flex: 1 0 auto; }

/* Opt-in: the view becomes a flex column whose child fills the viewport. Used
   by screens that must fit exactly — a board plus a keyboard, a full-height
   timer — rather than scroll. */
.view--fill { display: flex; flex-direction: column; }
.view--fill > * { flex: 1; min-height: 0; }

/* --- Bottom nav --- */
.shell__nav {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
  min-height: var(--nav-h);
  padding: var(--sp-2) var(--sp-3) calc(var(--sp-2) + var(--safe-bottom));
  background: var(--surface);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-top: 1px solid var(--border);
  z-index: var(--z-chrome);
}

.nav-item {
  flex: 1;
  min-height: var(--tap);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 2px;
  border: 0;
  border-radius: var(--r-md);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: 0.72rem;
  font-weight: 800;
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out),
              color var(--dur-2) var(--ease-out),
              transform var(--dur-1) var(--ease-out);
}
.nav-item:active { transform: scale(var(--press-scale)); }
.nav-item.is-active { background: var(--accent-soft); color: var(--accent-ink); }
.nav-icon { font-size: 1.3rem; line-height: 1; }
.nav-label { line-height: 1; }

/* --- Icon button (header actions, compact controls) --- */
.iconbtn {
  width: var(--tap);
  height: var(--tap);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--text);
  font-family: var(--font);
  font-size: 1.05rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--sh-1);
  transition: transform var(--dur-1) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              opacity var(--dur-2) var(--ease-out);
}
.iconbtn:active { transform: scale(0.9); }
.iconbtn--plain { background: transparent; border-color: transparent; box-shadow: none; }
.iconbtn[hidden], .iconbtn.is-hidden { visibility: hidden; pointer-events: none; }

/* The back chevron points the way the language reads. */
.iconbtn--back .chev { display: inline-block; font-size: 1.5rem; line-height: 1; margin-top: -3px; }
[dir="rtl"] .iconbtn--back .chev { transform: scaleX(-1); }

/* --- Sync dot --- */
#sync-status {
  position: fixed;
  top: calc(var(--safe-top) + 0.375rem);
  inset-inline-start: 0.5rem;
  width: 0.4375rem; height: 0.4375rem;
  border-radius: 50%;
  z-index: var(--z-float);
  opacity: 0;
  transition: opacity var(--dur-2) var(--ease-out);
}
#sync-status.syncing {
  opacity: 1;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  animation: syncPulse 1.1s var(--ease-in-out) infinite;
}
@keyframes syncPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.6); opacity: 0.45; }
}

/* ==========================================================================
   4. MOTION
   ========================================================================== */

/* --- View transitions -----------------------------------------------------
   Direction-aware: going deeper slides in from the reading-trailing edge,
   going back from the leading edge. JS removes the class on animationend so
   no transform is left behind (a lingering transform would make the view a
   containing block for its position:fixed children).
   -------------------------------------------------------------------------- */
.view-enter {
  animation: viewEnter var(--dur-3) var(--ease-out) both;
}
.view-enter-back { --view-slide: -26px; }
.view-enter-fwd  { --view-slide: 26px; }
[dir="rtl"] .view-enter-back { --view-slide: 26px; }
[dir="rtl"] .view-enter-fwd  { --view-slide: -26px; }

@keyframes viewEnter {
  from { opacity: 0; transform: translate3d(var(--view-slide, 0), 6px, 0) scale(0.985); }
  to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}

/* Children of an entering view rise in sequence — the thing that makes a
   screen feel composed rather than pasted in. */
.view-stagger > * {
  animation: riseIn var(--dur-3) var(--ease-out) both;
}
.view-stagger > *:nth-child(1) { animation-delay: 20ms; }
.view-stagger > *:nth-child(2) { animation-delay: 60ms; }
.view-stagger > *:nth-child(3) { animation-delay: 100ms; }
.view-stagger > *:nth-child(4) { animation-delay: 140ms; }
.view-stagger > *:nth-child(5) { animation-delay: 180ms; }
.view-stagger > *:nth-child(n+6) { animation-delay: 210ms; }

@keyframes riseIn {
  from { opacity: 0; transform: translate3d(0, 10px, 0); }
  to   { opacity: 1; transform: none; }
}



/* --- Named keyframes reused across games -------------------------------- */
@keyframes pop {
  0%   { transform: scale(0.85); opacity: 0; }
  60%  { transform: scale(1.04); opacity: 1; }
  100% { transform: scale(1); }
}
.animate-pop { animation: pop var(--dur-2) var(--ease-spring) both; }

@keyframes flip {
  0%   { transform: rotateX(0); }
  50%  { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}
.animate-flip { animation: flip var(--dur-4) var(--ease-in-out); }

@keyframes flipFast { from { transform: rotateY(0); } to { transform: rotateY(720deg); } }
.animate-flip-fast { animation: flipFast 0.8s var(--ease-in-out); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px) rotate(-1.5deg); }
  40% { transform: translateX(6px) rotate(1.5deg); }
  60% { transform: translateX(-4px) rotate(-1deg); }
  80% { transform: translateX(3px) rotate(0.5deg); }
}
.animate-shake { animation: shake 0.45s var(--ease-in-out) both; }

@keyframes diceRoll {
  0%   { transform: translateY(0) rotate(0) scale(1); }
  25%  { transform: translateY(-38px) rotate(200deg) scale(1.12); }
  50%  { transform: translateY(-56px) rotate(400deg) scale(1.18); }
  75%  { transform: translateY(-22px) rotate(590deg) scale(1.08); }
  100% { transform: translateY(0) rotate(720deg) scale(1); }
}
.animate-roll { animation: diceRoll 0.65s var(--ease-out) forwards; }

@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
.animate-fade-in { animation: fadeIn var(--dur-3) var(--ease-out) both; }

@keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
.animate-pulse { animation: pulseSoft 1.8s var(--ease-in-out) infinite; }

/* Theme switching is scoped to this class, which JS adds for the length of
   the cross-fade only. It used to live in the `*` rule, putting a live
   transition on every element in the document including all 36 views. */
body.theme-transition,
body.theme-transition *:not(#app-loader):not(#app-loader *) {
  transition: background-color var(--dur-3) var(--ease-out),
              color var(--dur-3) var(--ease-out),
              border-color var(--dur-3) var(--ease-out) !important;
}

/* ==========================================================================
   5. BUTTONS
   --------------------------------------------------------------------------
   One .btn base, three visual tiers, three sizes. Tier carries importance;
   colour comes from the surrounding accent unless a semantic tier is used.
   ========================================================================== */
.btn {
  --btn-h: 3rem;
  position: relative;
  width: 100%;
  min-height: var(--btn-h);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0 var(--sp-5);
  border: 1px solid transparent;
  border-radius: var(--r-md);
  font-family: var(--font);
  font-size: var(--fs-h3);
  font-weight: 800;
  line-height: 1;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition: transform var(--dur-1) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out),
              opacity var(--dur-2) var(--ease-out);
}
.btn:active { transform: scale(var(--press-scale)); }
.btn:disabled, .btn[disabled] { opacity: 0.45; pointer-events: none; }

/* Sizes */
.btn--lg { --btn-h: 3.375rem; font-size: 1.0625rem; }
.btn--sm { --btn-h: 2.625rem; font-size: var(--fs-sm); padding: 0 var(--sp-4); border-radius: var(--r-sm); }
.btn--xs { --btn-h: 2.5rem; min-width: 2.5rem; font-size: var(--fs-xs); padding: 0 var(--sp-3); border-radius: var(--r-sm); }
.btn--auto { width: auto; }

/* Tier 1 — the one action the screen exists for */
.btn--primary {
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 6px 18px -6px var(--accent-glow), var(--sh-inset);
}
.btn--primary:active { box-shadow: 0 2px 8px -4px var(--accent-glow); }

/* Tier 2 — supporting actions, same hue at low weight */
.btn--secondary {
  background: var(--accent-soft);
  color: var(--accent-ink);
  border-color: var(--accent-border);
}

/* Tier 3 — retreat / dismiss */
.btn--ghost {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}
.btn--ghost:active { background: var(--surface-3); }

/* Neutral filled — for controls that aren't the accent action */
.btn--neutral {
  background: var(--surface-solid);
  color: var(--text);
  border-color: var(--border);
  box-shadow: var(--sh-1);
}

/* Semantic tiers */
.btn--success { background: var(--success-btn); color: var(--success-on); box-shadow: 0 6px 18px -6px rgba(5,150,105,.4), var(--sh-inset); }
.btn--danger  { background: var(--danger-btn);  color: var(--danger-on);  box-shadow: 0 6px 18px -6px rgba(225,29,72,.4), var(--sh-inset); }
.btn--warning { background: var(--warning-btn); color: var(--warning-on); box-shadow: 0 6px 18px -6px rgba(217,119,6,.4), var(--sh-inset); }
.btn--danger-soft { background: var(--danger-soft); color: var(--danger-ink); border-color: var(--danger); }

/* Icon-only, square */
.btn--icon { width: var(--btn-h); min-width: var(--btn-h); padding: 0; }

/* --- Legacy colour classes ------------------------------------------------
   The old markup picked button colours decoratively (btn-blue, btn-orange…),
   which is why three unrelated actions in a row could end up three different
   colours. Call sites now use the tiers above; these aliases stay as a safety
   net so a class left behind anywhere still renders as a proper button rather
   than as bare text. Colour comes from the screen's accent. (.btn-red went on
   22 Sep 2026: white on --danger is 3.67:1 in dark mode, and nothing used it.
   Meaning comes from .btn--danger, on --danger-btn / --danger-on.)
   -------------------------------------------------------------------------- */
.btn-blue, .btn-green, .btn-purple, .btn-orange, .btn-indigo {
  background: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 6px 18px -6px var(--accent-glow), var(--sh-inset);
}
.btn-gray {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}

/* Ripple, painted by JS on pointerdown.
   This has to be a standalone class, not one scoped under .btn: the JS attaches
   ripples to every RIPPLE_TARGETS host (.game-card, .tool-item, .nav-item,
   .setting-row, .key). An unstyled span inside a flex host like .game-card gets
   blockified into a real flex item, takes the width/height the JS sets inline,
   and — with no animation to end — is never cleaned up, so each tap grew the
   tile by ~120px. */
.ripple {
  position: absolute;
  z-index: 0;
  border-radius: 50%;
  transform: scale(0);
  background: currentColor;
  opacity: 0.18;
  pointer-events: none;
  animation: rippleOut 520ms var(--ease-out) forwards;
}
@keyframes rippleOut {
  to { transform: scale(2.4); opacity: 0; }
}

/* Ripple hosts must clip the circle and be a positioning context for it.
   (.btn, .card-like rows and .game-card already set both.) */
.tool-item, .nav-item, .setting-row, .key {
  position: relative;
  overflow: hidden;
}

/* --- Button groups ------------------------------------------------------- */
.btn-row { display: flex; gap: var(--sp-2); }
.btn-row > .btn { flex: 1; }
/* A button that asked for its own width keeps it: shared equally in a row that
   shrinks to its content, "توقف" was cut to "توق". */
.btn-row > .btn--auto { flex: none; }
.btn-stack { display: flex; flex-direction: column; gap: var(--sp-2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }

/* Sticky action bar at the foot of a scrolling view. Replaces the old
   `position: fixed` bars, which were positioned against whichever ancestor
   happened to be transformed.
   A sticky box stops at the scroll area's padding, not its edge, so the bar
   reaches down by that padding (--main-pb) to sit flush on the edge. It
   reached down a fixed 8px while the padding was 16-24px, so the page
   scrolled past in a strip under the button - the switches of a setup
   screen showing beneath its Start (the owner, 21 Sep 2026). */
.view-actions {
  position: sticky;
  bottom: calc(var(--main-pb, var(--sp-2)) * -1);
  /* No negative inline margin: it made the bar 8px wider than the view, which
     .shell__main then clipped anyway - so it bought nothing and reported as a
     horizontal overflow on every screen that used it. */
  margin: var(--sp-5) 0 0;
  padding: var(--sp-3) 0;
  background: linear-gradient(to top, var(--bg) 42%, transparent);
  z-index: 5;
}
/* A one-phone game's bar (.play-foot; the owner's sheet of 1 Oct 2026): its «خروج»
   was a full-width ghost floating in the middle of the screen, a second exit beside
   the header's arrow. It is a small quiet button in the bar now (.play-exit),
   and upright on a phone the bar sits at the foot of the screen: the view and its
   stage are a column the bar is pushed to the end of. On its side and on a big
   screen each game keeps its own layout (the bar in the column beside the board). */
.view-actions.play-foot:not(.talk__actions) { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.view-actions.play-foot:not(.talk__actions) > :not(.play-exit) { width: 100%; }
.play-exit { min-width: 8.5rem; }
.view-actions.play-foot > .btn + .btn, .view-actions.play-foot > .btn-row { margin-top: 0; }
@media (orientation: portrait) and (max-width: 899px) {
  :is(#view-play-bomb, #view-play-memory, #view-play-sudoku, #view-play-g2048, #view-play-mines, #view-play-queens,
      #view-play-tango, #view-play-nonogram, #view-play-strands, #view-play-pinpoint, #view-play-connect4, #view-play-dots):not(.hidden) {
    display: flex; flex-direction: column;
  }
  :is(#bomb-stage, #memory-stage, #sudoku-stage, #g2048-stage, #mines-stage, #queens-stage, #tango-stage,
      #nonogram-stage, #strands-stage, #pinpoint-stage, #connect4-stage, #dots-stage) { flex: 1 0 auto; display: flex; flex-direction: column; }
  :is(#connect4-stage, #dots-stage) > .duel { flex: 1 0 auto; display: flex; flex-direction: column; }
  :is(#connect4-stage, #dots-stage) > .duel > .duel-layout { flex: 1 0 auto; }
  :is(#bomb-stage, #memory-stage, #sudoku-stage, #g2048-stage, #mines-stage, #queens-stage, #tango-stage,
      #nonogram-stage, #strands-stage, #pinpoint-stage, #connect4-stage, #dots-stage) .view-actions.play-foot { margin-top: auto; }
}

/* ==========================================================================
   6. CARDS, TILES, ROWS
   ========================================================================== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-5);
  margin-bottom: var(--sp-4);
  box-shadow: var(--sh-2), var(--sh-inset);
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
}
.card--tight { padding: var(--sp-4); }
.card--flush { padding: 0; overflow: hidden; }
.card--accent { background: var(--accent-soft); border-color: var(--accent-border); backdrop-filter: none; -webkit-backdrop-filter: none; }
.card > :last-child { margin-bottom: 0; }

/* --- Section heading ---------------------------------------------------- */
.section { margin-bottom: var(--sp-6); }
.section__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: 0 var(--sp-1) var(--sp-3);
}
.section__emoji { font-size: 1rem; line-height: 1; }
.section__title {
  font-size: var(--fs-h3);
  font-weight: 900;
  color: var(--text-strong);
  letter-spacing: 0;
  text-transform: none;
  margin: 0;
}
.section__rule { flex: 1; height: 1px; background: var(--hairline); border-radius: var(--r-full); }

/* --- Card title inside a view ------------------------------------------- */
.card__title {
  font-size: var(--fs-h2);
  font-weight: 900;
  color: var(--accent-ink);
  text-align: center;
  margin-bottom: var(--sp-2);
}
.card__title--neutral { color: var(--text-strong); }
.card__title--xl { font-size: var(--fs-h1); }

.card__subtitle {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  margin-bottom: var(--sp-5);
  line-height: var(--lh-snug);
}

/* A quiet label sitting above a block of content. */
.eyebrow {
  margin: 0 0 var(--sp-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
html[lang="ar"] .eyebrow { text-transform: none; letter-spacing: normal; font-size: var(--fs-sm); }

/* --- Saved-groups picker ------------------------------------------------ */
.group-picker {
  display: flex;
  align-items: stretch;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}
.group-picker select {
  flex: 1;
  min-width: 0;
  min-height: 3rem;
  font-size: var(--fs-sm);
  background: var(--surface-2);
}
.group-picker .iconbtn { flex: none; width: 3rem; height: auto; background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-ink); }

/* --- Game tiles (menu grid) --------------------------------------------- */
.game-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: 1fr;          /* every tile matches the tallest in its row */
  gap: var(--sp-2);
}

.game-card {
  position: relative;
  min-height: 6rem;
  padding: var(--sp-4) var(--sp-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  text-align: center;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
  touch-action: manipulation;
  transition: transform var(--dur-2) var(--ease-spring),
              box-shadow var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out);
}
/* A soft wash of the tile's own accent, so the grid reads as colourful
   without 11 competing solid blocks. */
.game-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-soft);
  opacity: 0.85;
  z-index: 0;
  transition: opacity var(--dur-2) var(--ease-out);
}
.game-card > *:not(.ripple) { position: relative; z-index: 1; }
.game-card:active { transform: scale(0.94); box-shadow: var(--sh-1); border-color: var(--accent-border); }
.game-card:active::after { opacity: 1; }

.game-icon {
  font-size: 1.9rem;
  line-height: 1;
  filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.14));
  transition: transform var(--dur-2) var(--ease-spring);
}
.game-card:active .game-icon { transform: scale(1.12) translateY(-2px); }

.game-title {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-strong);
  line-height: var(--lh-snug);
  overflow-wrap: anywhere;
  text-wrap: balance;
  /* Reserve two lines so single- and double-line labels sit at the same
     height and the icons stay on one baseline across the row. */
  min-height: 2.7em;
  display: flex;
  align-items: center;
}

/* --- Tools list --------------------------------------------------------- */
.tools-list { display: flex; flex-direction: column; gap: var(--sp-2); }

.tool-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 4.25rem;
  padding: var(--sp-3) var(--sp-4);
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  touch-action: manipulation;
  transition: transform var(--dur-2) var(--ease-spring),
              border-color var(--dur-2) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out);
}
.tool-item:active { transform: scale(0.975); border-color: var(--accent-border); box-shadow: var(--sh-1); }

.tool-icon {
  flex: none;
  width: 2.75rem; height: 2.75rem;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.35rem;
  border-radius: var(--r-sm);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.tool-info { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; gap: 2px; }
.tool-name { font-size: var(--fs-h3); font-weight: 800; color: var(--text-strong); line-height: 1.2; }
.tool-desc { font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); line-height: 1.3; }
.tool-chev { margin-inline-start: auto; color: var(--text-3); font-size: 1.25rem; line-height: 1; }
[dir="rtl"] .tool-chev { transform: scaleX(-1); }

/* --- Generic list row --------------------------------------------------- */
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 3.5rem;
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
}
.row + .row { margin-top: var(--sp-2); }
.row--interactive { cursor: pointer; touch-action: manipulation; transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out); }
.row--interactive:active { transform: scale(0.985); border-color: var(--accent-border); }
.row__body { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.row__trail { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-2); }

/* --- Chips -------------------------------------------------------------- */
.chip-set { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  height: 2.5rem;
  padding-block: 0;
  padding-inline: var(--sp-3) var(--sp-1);
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  border: 1px solid var(--accent-border);
  font-size: var(--fs-sm);
  font-weight: 800;
  max-width: 100%;
}
.chip--plain { background: var(--surface-3); color: var(--text); border-color: var(--border); padding-inline-end: var(--sp-3); }

/* --- Player picker -------------------------------------------------------
   The saved names, as chips you tap to put someone in the round. Typing a
   name is for someone new; everyone you already play with is one tap.
   -------------------------------------------------------------------------- */
.picker__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.picker__head .eyebrow { margin: 0; flex: 1; }
.picker__edit {
  flex: none;
  min-height: 2.5rem;
  /* "تم" / "Done" is short enough that padding alone left it under the 40px
     tap floor the rest of the app holds to. */
  min-width: 3.5rem;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-2);
  font-family: var(--font);
  font-size: var(--fs-xs);
  font-weight: 800;
  cursor: pointer;
}
.picker__edit.is-on { background: var(--danger-soft); color: var(--danger-ink); border-color: var(--danger); }

.pick-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: 2.75rem;
  padding-inline: var(--sp-4);
  border-radius: var(--r-full);
  border: 1.5px solid var(--border);
  background: var(--surface-solid);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  max-width: 100%;
  transition: transform var(--dur-1) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out),
              color var(--dur-2) var(--ease-out);
}
.pick-chip:active { transform: scale(0.94); }
/* In the round. The tick carries the meaning as well as the colour, so it
   still reads for anyone who cannot separate the two. */
.pick-chip.is-on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
}
.pick-chip__tick { font-size: 0.9em; }
.pick-chip__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Dashed, because it makes something rather than selecting something. */
.pick-chip--add {
  border-style: dashed;
  border-color: var(--accent-border);
  color: var(--accent-ink);
  background: transparent;
}

/* Edit mode: every chip becomes a delete. */
.pick-chip--del {
  background: var(--danger-soft);
  border-color: var(--danger);
  color: var(--danger-ink);
}

/* Four rows. Measured against a forty-name library: at this height the Start
   button still sits on the first screen for six of the seven setup screens
   (Imposter has three more fields above it and scrolls either way). Taller and
   the button everyone presses every time drops below the fold. */
.picker__chips {
  max-height: 13.5rem;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 2px;
  margin: -2px;
}
/* Only fades when there is actually more below, so a short list looks flat. */
.picker__chips.is-scrollable {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
          mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
}

.picker__count {
  margin-top: var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--text-2);
}
.picker__count b { color: var(--text-strong); }
.picker__empty {
  padding: var(--sp-4);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-md);
  text-align: center;
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip__remove {
  flex: none;
  width: 2.125rem; height: 2.125rem;
  display: grid; place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  opacity: 0.6;
  font-family: var(--font);
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
  transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.chip__remove:active { transform: scale(0.85); background: var(--danger-soft); color: var(--danger); opacity: 1; }
/* Small targets that keep their look: the hit area reaches past the drawn circle to the
   44px a finger needs (the kick ✕, the audience's cheers, the room banner's Return). */
.chip__remove, .audience__cheer, .arb__btn--return { position: relative; }
.chip__remove::after, .audience__cheer::after, .arb__btn--return::after {
  content: '';
  position: absolute;
}
.chip__remove::after { inset: -0.3125rem; }
.audience__cheer::after { inset: -0.28rem; }
.arb__btn--return::after { inset: -0.25rem -0.125rem; }

/* --- Badge -------------------------------------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  height: 1.5rem;
  padding: 0 var(--sp-2);
  border-radius: var(--r-full);
  background: var(--surface-3);
  color: var(--text-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  white-space: nowrap;
}
.badge--accent  { background: var(--accent-soft);  color: var(--accent-ink); }
.badge--success { background: var(--success-soft); color: var(--success-ink); }
.badge--danger  { background: var(--danger-soft);  color: var(--danger-ink); }
.badge--warning { background: var(--warning-soft); color: var(--warning-ink); }

/* --- Metrics (scores, timers) ------------------------------------------- */
.metric {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
  font-weight: 900;
  line-height: 1;
  color: var(--text-strong);
  letter-spacing: -0.02em;
}
.metric--xl { font-size: 3.25rem; }
.metric--lg { font-size: var(--fs-display); }
.metric--md { font-size: 1.75rem; }
.metric--accent { color: var(--accent-ink); }

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.stat__label { font-size: var(--fs-xs); font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }

/* --- Play header (whose turn + the clock) ------------------------------- */
.play-head {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}
.play-head__turn { flex: 1; min-width: 0; }
.play-head__name {
  font-size: 1.75rem;
  font-weight: 900;
  line-height: 1.1;
  color: var(--accent-ink);
  overflow-wrap: anywhere;
}
.play-head__clock {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
}
.play-head__clock-actions { display: flex; gap: var(--sp-1); }

/* --- Player status row (monkey board) ----------------------------------- */
.status-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 3.75rem;
  padding: var(--sp-2) var(--sp-4);
  margin-bottom: var(--sp-2);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.status-row--turn {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -10px var(--accent-glow);
}
.status-row--out { opacity: 0.55; }
.status-row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.status-row__name {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: var(--fs-h3);
  font-weight: 800;
  color: var(--text-strong);
}
.status-row__actions { flex: none; display: flex; align-items: center; gap: var(--sp-1); }
.status-row__tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); }

/* Round picker + dealer badge above a scoreboard. */
.round-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.round-bar select {
  width: auto;
  flex: none;
  min-height: var(--tap);
  font-size: var(--fs-sm);
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: var(--accent-border);
}
.round-bar .badge { margin-inline-start: auto; }

/* --- Empty state -------------------------------------------------------- */
.empty {
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-lg);
  color: var(--text-3);
  font-size: var(--fs-sm);
  font-weight: 700;
}
.empty__icon { display: block; font-size: 1.6rem; margin-bottom: var(--sp-2); opacity: 0.7; }

/* ==========================================================================
   7. FORMS
   ========================================================================== */
.field { margin-bottom: var(--sp-4); }
.field__label {
  display: block;
  margin: 0 var(--sp-1) var(--sp-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.field__hint { margin: var(--sp-2) var(--sp-1) 0; font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); line-height: 1.4; }
/* An option changed from the game's default (1220, 7 Oct 2026; setupResetSync in
   JS_Core.html): a small accent dot after its label, and «↺ رجّع الأصلي» under
   the last one changed. */
.field__label.is-changed::after, .field__hint.is-changed::after {
  content: '';
  display: inline-block;
  width: 0.4rem;
  height: 0.4rem;
  margin-inline-start: var(--sp-1);
  border-radius: var(--r-full);
  background: var(--accent);
  vertical-align: middle;
}
.setup-reset { display: flex; justify-content: flex-end; margin: calc(-1 * var(--sp-2)) 0 var(--sp-3); }
.setup-reset > .btn { color: var(--accent-ink); }
/* A mistake said at its field (the join screen: roomJoinFieldError, JS_Room.html). */
.field__error { margin: var(--sp-2) var(--sp-1) 0; font-size: var(--fs-sm); font-weight: 700; color: var(--danger-ink); line-height: 1.4; }
input[aria-invalid="true"] { border-color: var(--danger); }
input[aria-invalid="true"]:focus { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent); }

input, select, textarea {
  width: 100%;
  min-height: 3rem;
  padding: 0 var(--sp-4);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text);
  font-family: var(--font);
  /* 16px keeps iOS Safari from zooming the page when a field is focused. */
  font-size: 1rem;
  font-weight: 700;
  transition: border-color var(--dur-2) var(--ease-out),
              box-shadow var(--dur-2) var(--ease-out),
              background-color var(--dur-2) var(--ease-out);
  -webkit-appearance: none;
  appearance: none;
}
input::placeholder { color: var(--text-3); font-weight: 600; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="number"] { text-align: center; }
input[type="checkbox"] {
  width: 1.375rem; height: 1.375rem;
  min-height: 0;
  padding: 0;
  border-radius: 0.375rem;
  accent-color: var(--accent);
  flex: none;
}

select {
  padding-inline-end: var(--sp-8);
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
                    linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  cursor: pointer;
}
[dir="rtl"] select {
  background-position: calc(var(--sp-5) - 3px) calc(50% + 1px), var(--sp-5) calc(50% + 1px);
}
[dir="ltr"] select {
  background-position: calc(100% - var(--sp-5)) calc(50% + 1px), calc(100% - var(--sp-5) + 5px) calc(50% + 1px);
}

/* --- Input + button pair ------------------------------------------------ */
.input-group { display: flex; gap: var(--sp-2); align-items: stretch; }
.input-group > input { flex: 1; min-width: 0; }
.input-group > .btn { width: 3rem; min-width: 3rem; flex: none; padding: 0; }

/* --- Stepper (numeric ± ) ---------------------------------------------- */
.stepper {
  display: grid;
  grid-template-columns: var(--tap) 1fr var(--tap);
  align-items: center;
  gap: var(--sp-1);
  padding: var(--sp-1);
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.stepper__btn {
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center;
  border: 0;
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  color: var(--accent-ink);
  box-shadow: var(--sh-1);
  font-family: var(--font);
  font-size: 1.25rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}
.stepper__btn:active { transform: scale(0.88); background: var(--accent-soft); }
.stepper__btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; transform: none; }
.stepper__value { text-align: center; font-size: var(--fs-h2); font-weight: 900; font-variant-numeric: tabular-nums; color: var(--text-strong); }

/* --- Segmented control -------------------------------------------------- */
.segmented {
  /* Full width by default: as a centred flex child it would otherwise collapse
     to its content, which is what shrank the dice-count pair to 24px. */
  width: 100%;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.segmented__item {
  flex: 1;
  min-height: 2.625rem;
  display: grid; place-items: center;
  border: 0;
  border-radius: calc(var(--r-md) - 0.25rem);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.segmented__item.is-active { background: var(--surface-solid); color: var(--accent-ink); box-shadow: var(--sh-1); }



/* Toggle switch knob (who-am-I shuffle) */
.dot { transition: transform var(--dur-2) var(--ease-spring); }

/* ==========================================================================
   8. SHEETS, MODALS, TOASTS
   ========================================================================== */
/* Every popup is a centred dialog, on phones too. As a bottom sheet it sat
   under the bottom nav on iPhone; centred it is plainly a question, and the
   overlay's padding keeps it clear of notches and the home indicator. Overlays
   are moved under <body> at start-up (hoistModals in JS_Core.html), so no part
   of the page can trap one or draw over it. */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: max(var(--sp-4), var(--safe-top)) max(var(--sp-4), var(--safe-right))
           max(var(--sp-4), var(--safe-bottom)) max(var(--sp-4), var(--safe-left));
  background: rgba(2, 6, 23, 0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: overlayIn var(--dur-2) var(--ease-out) both;
}
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

#alert-modal { z-index: var(--z-alert); }
#custom-confirm-modal { z-index: var(--z-confirm); }

/* The dialog. Sheets with a header, a scrolling body and a footer (help,
   settings) keep those pinned and get the wider column; everything else is a
   simple dialog that scrolls as one block. */
.modal-content {
  position: relative;
  width: 100%;
  max-width: 27.5rem;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  padding: 0;
  background: var(--elevated);
