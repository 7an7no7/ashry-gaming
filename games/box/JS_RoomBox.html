<script>
/* ============================================================================
   المزاد — THE BLUFFING AUCTION on the phones and the TV (29 Sep 2026)
   ----------------------------------------------------------------------------
   The rules are RoomBox.js. Look أ «استوديو الصندوق» (the owner, 29 Sep 2026,
   from the design sheet): a TV game-show studio - a violet LED wall, a sign in
   bulbs, two swinging spotlights, the players at podiums with little LED
   screens, and a red lacquer box with a gold bow on a lit turntable. The
   opening is the star: the bids flip over all at once, the winner's coins fly
   into the box, a drumroll, the box shakes and light leaks from its cracks,
   3-2-1, a flash, the lid flies off - and each kind of box has its own reveal
   (a coin fountain; the scorpion in a bow tie and top hat who runs to the
   winner and scatters their coins; the bill unrolling; the thief's mask and
   the leader's coins flying over; the giant coin that lands heads or tails;
   the key that flies to its holder; a puff of dust and a moth).

   The phone is one step at a time: the clue (held to read, a .hold-card), the
   bid (one big number, − and +, chips, Confirm), waiting. During the opening
   the phone shows the box close up (the scene cropped) and the bids.

   The scene is an SVG 1280 × 720 with a canvas over it for the particles, in
   one container sized to 16:9 (or the crop's shape); its words are HTML over
   it, sized in cqw. The show is a timeline read from the server's openAt, so a
   screen that redraws or reloads mid-show carries on (the particles re-run
   from the start in a blink), and one that comes after it sees the end. The
   TV is the room's one voice (the host's phone when there is none). Every
   name here starts with bx / BX_; styles in section 59 of Style.html.
   ========================================================================= */
const BX_T = 10.6;          // the show's length in seconds (BOX_SHOW_MS on the server)
const BX_TB = 5.6;          // the moment the lid flies
const BX_CROP = [300, 30, 680, 590];   // a phone's close-up of the box: x, y, w, h in the scene

const BX_CONF = ['#ff5ec4', '#29d3ff', '#ffd35a', '#a78bfa', '#ffffff'];
const BX_INSURE = 50;          // BOX_INSURE: «تأمين» costs 50 (the ideas of 7 Oct 2026)
const BX_OFFER_MS = 8000;      // BOX_OFFER_MS: «عرض الحاج» lasts 8 s

const bx = {

  timer: null,       // the clocks, painted in place
  show: null,        // the opening running on this page: { key, root, raf, ... }
  seen: new Set(),   // play-once keys
  local: null        // this phone's step and number for the box: { key, step, v }
};

/* --- small helpers ------------------------------------------------------------ */
function bxNoteTime(state) {
  if (state && typeof state.serverNow === 'number' && typeof state.receivedAt === 'number') bx.gap = Math.min(bx.gap, state.receivedAt - state.serverNow);
}
const bxServerNow = () => (isFinite(bx.gap) ? Date.now() - bx.gap : Date.now());
const bxIso = (s) => '⁨' + s + '⁩';
function bxT(key, vars) {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || key;
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
const bxOnce = (key) => { if (!key || bx.seen.has(key)) return false; if (bx.seen.size > 300) bx.seen.clear(); bx.seen.add(key); return true; };
const bxNameOf = (state, id) => ((state.players || []).find(p => p.id === id) || {}).name || '';
const bxMoney = (n) => Math.round(n || 0).toLocaleString('en-US');
const bxCur = () => bxT('box_cur');
const bxAmt = (n) => bxIso(bxMoney(n) + ' ' + bxCur());
const bxKind = (k) => bxT('box_k_' + k);
const bxBoxKey = (state) => roomDealKey(state) + '|' + ((state.shared || {}).box);
const bxCl = (x, a, b) => (x < (a || 0) ? (a || 0) : x > (b === undefined ? 1 : b) ? (b === undefined ? 1 : b) : x);
const bxEo = (u) => 1 - Math.pow(1 - u, 3);
const bxEio = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const bxEb = (u) => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const bxRnd = (a, b) => a + Math.random() * (b - a);

/** Who this device is: a bidder, a watcher, or a screen. */
function bxRole(state) {
  if (state.youAreScreen) return 'screen';
  return ((state.shared || {}).roster || []).indexOf(Room.me) === -1 ? 'watch' : 'player';
}
/** The TV is the room's one voice; with no screen, the host's phone. */
function bxVoice(state) {
  const screens = (state.screens || []).filter(x => x.online).map(x => x.id).sort();
  if (state.youAreScreen) return screens[0] === Room.me;
  return !!state.youAreHost && !screens.length;
}
const bxHereIds = (state) => ((state.shared || {}).roster || []).filter(id => (state.players || []).some(p => p.id === id));

/** A clue in this phone's language. */
function bxClueText(c) {
  if (!c) return '';
  const v = {};
  Object.keys(c.v || {}).forEach(k => { v[k] = k === 'x' ? bxAmt(c.v[k]) : bxKind(c.v[k]); });
  return bxT('box_clue_' + c.k, v);
}

/* --- the studio ----------------------------------------------------------------- */

    s += `<circle class="bl" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5.5"/>`;
  }
  return s;
};

  let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; s += `<circle class="bl" cx="${(cx + rx * Math.cos(a)).toFixed(1)}" cy="${(cy + ry * Math.sin(a)).toFixed(1)}" r="5"/>`; }

};

/** The scorpion (our own drawing): a round orange body, big friendly eyes, a curled tail, a top hat and a bow tie. */
const BX_SCORP = `<g fill="none" stroke-linecap="round"><path d="M-8 12l-18 26M8 16l-8 30M22 16l6 28M34 10l18 24" stroke="#b8400f" stroke-width="7"/>
<path d="M44-2C82-6 96-50 78-74C64-92 38-86 36-66" stroke="#b8400f" stroke-width="27"/><path d="M44-2C82-6 96-50 78-74C64-92 38-86 36-66" stroke="#f0702a" stroke-width="20"/>

<path d="M4-18q6 22 0 44M20-20q6 24 0 46M36-14q4 18 0 34" fill="none" stroke="#ffc08f" stroke-width="3" opacity=".8"/>
<path d="M-30-4C-50-12-58-24-64-34M-30 8C-52 12-60 22-64 30" fill="none" stroke="#b8400f" stroke-width="15" stroke-linecap="round"/><path d="M-30-4C-50-12-58-24-64-34M-30 8C-52 12-60 22-64 30" fill="none" stroke="#f0702a" stroke-width="10" stroke-linecap="round"/>
<g transform="translate(-72,-42) rotate(-24)"><ellipse rx="20" ry="13" fill="url(#bxScorp)" stroke="#b8400f" stroke-width="3"/><path d="M-21-1L-5 2L-21 6Z" fill="#ffe0cc"/></g>
<g transform="translate(-72,38) rotate(24)"><ellipse rx="20" ry="13" fill="url(#bxScorp)" stroke="#b8400f" stroke-width="3"/><path d="M-21-6L-5-2L-21 1Z" fill="#ffe0cc"/></g>

<circle cx="-38" cy="-24" r="12.5" fill="#fff" stroke="#b8400f" stroke-width="2.5"/><circle cx="-14" cy="-26" r="12.5" fill="#fff" stroke="#b8400f" stroke-width="2.5"/>

<circle cx="-46" cy="5" r="6" fill="#ff8fb3" opacity=".75"/><circle cx="-8" cy="7" r="6" fill="#ff8fb3" opacity=".75"/>

<g transform="translate(-24,26)"><path d="M0 0L-17-10V10ZM0 0L17-10V10Z" fill="#ffd35a" stroke="#8a5a06" stroke-width="2"/><circle r="5" fill="#ff5ec4"/></g>
<g transform="translate(-24,-46) rotate(-12)"><rect x="-14" y="-24" width="28" height="24" fill="#1a0533" stroke="#ffd35a" stroke-width="2.5"/><rect x="-14" y="-9" width="28" height="5" fill="#ff5ec4"/><rect x="-22" y="-2" width="44" height="7" rx="3.5" fill="#1a0533" stroke="#ffd35a" stroke-width="2.5"/></g>`;

      <path d="M-4 -150L6 -174L20 -158L34 -178L44 -150Z" fill="url(#bxGold)" stroke="#8a5a06" stroke-width="2.5"/><circle cx="20" cy="-160" r="4" fill="#e0115f"/>
      <path d="M-50 -110l14 -18l14 18l-14 22z" fill="#1fbf73" stroke="#fff" stroke-width="2"/><path d="M86 -104l12 -16l12 16l-12 20z" fill="#2b5fd9" stroke="#fff" stroke-width="2"/>

  }

    return `<g class="bx-obj__bill" transform="translate(0,34)"><path d="M-60 -250H100V-20l-16 10l-16-10l-16 10l-16-10l-16 10l-16-10l-16 10l-16-10l-16 10l-16-10Z" fill="#fffdf6" stroke="#2b2438" stroke-width="3"/>
      <rect x="-60" y="-250" width="160" height="40" fill="#e11d48"/><text x="20" y="-222" text-anchor="middle" class="bx-svgtxt" font-size="26" font-weight="900" fill="#fff">${escapeHTML(bxT('box_bill_word'))}</text>

  }
  if (kind === 'steal') {
    return `<g class="bx-obj__steal"><path d="M-40 -60Q-44 -140 20 -150Q84 -140 80 -60Q40 -40 20 -40Q0 -40 -40 -60Z" fill="#6b4f2c" stroke="#2b2438" stroke-width="3"/>
      <path d="M-14 -150Q20 -170 54 -150" fill="none" stroke="#2b2438" stroke-width="6" stroke-linecap="round"/><text x="20" y="-80" text-anchor="middle" class="bx-svgtxt" font-size="44" font-weight="900" fill="#ffd35a">${escapeHTML(bxT('box_cur'))}</text>

      <ellipse cx="-36" cy="-2" rx="15" ry="9" fill="#fff"/><ellipse cx="36" cy="-2" rx="15" ry="9" fill="#fff"/><circle cx="-32" cy="-1" r="5" fill="#141018"/><circle cx="40" cy="-1" r="5" fill="#141018"/>
      <path d="M78 -8l26 -12M78 -4l26 10" stroke="#141018" stroke-width="6" stroke-linecap="round"/></g></g>`;
  }
  if (kind === 'double') {
    const face = coin === 'tails' ? `<text y="16" text-anchor="middle" class="bx-svgtxt" font-size="52" font-weight="900" fill="#7a5205">0</text>` : `<text y="18" text-anchor="middle" class="bx-svgtxt" font-size="50" font-weight="900" fill="#7a5205">×2</text>`;
    return `<g class="bx-obj__dbl" transform="translate(20,-200)"><g class="bx-coinspin"><circle r="70" fill="url(#bxGold)" stroke="#8a5a06" stroke-width="5"/><circle r="56" fill="none" stroke="#8a5a06" stroke-width="3" stroke-dasharray="4 7"/>${face}</g></g>`;

      <rect x="-30" y="-9" width="120" height="18" rx="5" fill="url(#bxGoldH)" stroke="#8a5a06" stroke-width="2"/><path d="M58 9v22h12V9M80 9v14h10V9" fill="url(#bxGold)" stroke="#8a5a06" stroke-width="2"/>

    <ellipse rx="6" ry="16" fill="#5b5348"/><path d="M-3 -14l-10 -16M3 -14l10 -16" stroke="#5b5348" stroke-width="3" stroke-linecap="round"/></g></g>`;

/** The red lacquer box with its gold ribbon and bow (box coordinates, centred on the turntable). */

${bxStar(-80, -60, 12)}${bxStar(84, -20, 9)}${bxStar(-60, 30, 8)}

<path d="M22-176C-30-246-86-204-42-176C-22-166 0-170 22-176ZM22-176C74-246 130-204 86-176C66-166 44-170 22-176Z" fill="url(#bxGold)" stroke="#8a5a06" stroke-width="2.5"/>
<circle cx="22" cy="-176" r="13" fill="url(#bxGold)" stroke="#8a5a06" stroke-width="2.5"/>
</g>
<g class="bx-scorp-in" style="display:none"></g>`;
}

/** Where each podium stands: the players split either side of the turntable. */
function bxSeats(state) {
  const s = state.shared || {};
  const ids = (s.order || []).filter(id => (s.roster || []).indexOf(id) !== -1);
  const n = ids.length;
  const left = ids.slice(0, Math.ceil(n / 2)), right = ids.slice(Math.ceil(n / 2));
  const place = (list, a, b) => list.map((id, i) => {
    const k = list.length;
    const x = k === 1 ? (a + b) / 2 : a + i * (b - a) / (k - 1);
    return { id, x, y: 560, sc: k > 3 ? 0.66 : k > 2 ? 0.86 : 1 };
  });
  const four = Math.max(left.length, right.length) > 3;
  return place(left, four ? 64 : 92, four ? 346 : 328).concat(place(right, four ? 934 : 952, four ? 1216 : 1188));
}

/** The podium: its LED screen (the bid, «؟» or ✓), the name, the money. */
function bxPodSvg(state, seat) {
  const nm = bxNameOf(state, seat.id) || '…';
  const short = nm.length > 9 ? nm.slice(0, 8) + '…' : nm;
  const me = seat.id === Room.me ? ' bx-pod--me' : '';
  return `<g class="bx-pod${me}" data-bx-pod="${escapeHTML(seat.id)}" transform="translate(${seat.x},${seat.y}) scale(${seat.sc})">

    <text class="bx-svgtxt bx-pod__mon" y="131" text-anchor="middle" font-size="20" font-weight="700" fill="#ffd35a" direction="ltr"></text>

      <text class="bx-svgtxt bx-num" y="17" text-anchor="middle" font-size="44" fill="#ffd35a" filter="url(#bxGlow)" direction="ltr">?</text></g>
  </g>`;
}

/** Gradient and filter ids made unique per screen (the phone's view and the TV's may both be in the page). */
const bxIds = (html, u) => html.replace(/(id="|url\(#)bx([A-Z]\w*)/g, '$1bx$2' + (u || ''));

/** The whole studio as SVG. o: { crop, kind, coin, u } (the kind only once the box is open). */
function bxSceneSvg(state, o) {
  const opt = o || {};
  const vb = opt.crop ? BX_CROP : BX_SCEN;
  const pods = bxSeats(state).map(seat => bxPodSvg(state, seat)).join('');
  return `<svg class="bx-svg" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="bxGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4b8"/><stop offset=".3" stop-color="#f7c948"/><stop offset=".62" stop-color="#d49a1c"/><stop offset=".8" stop-color="#ffe08a"/><stop offset="1" stop-color="#8a5a06"/></linearGradient>
<linearGradient id="bxGoldH" x1="0" x2="1"><stop offset="0" stop-color="#9a6a0a"/><stop offset=".25" stop-color="#f7c948"/><stop offset=".45" stop-color="#fff4b8"/><stop offset=".6" stop-color="#e0ad2a"/><stop offset="1" stop-color="#8a5a06"/></linearGradient>
<linearGradient id="bxRay" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fffbe0" stop-opacity=".95"/><stop offset=".5" stop-color="#ffd24a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></linearGradient>
<radialGradient id="bxInGlow"><stop offset="0" stop-color="#fffdf0"/><stop offset=".4" stop-color="#ffd54a" stop-opacity=".95"/><stop offset="1" stop-color="#ff9a00" stop-opacity="0"/></radialGradient>
<radialGradient id="bxScorp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb57a"/><stop offset=".55" stop-color="#ff7a2e"/><stop offset="1" stop-color="#d2481a"/></radialGradient>
<filter id="bxGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

/**
 * The stage: the scene, its canvas, and the words over it (the tag, the banner,
 * the big word, the flash). o: { crop, kind, coin, tag, info }.
 */
function bxStageHtml(state, o) {
  const opt = o || {};
  const vb = opt.crop ? BX_CROP : BX_SCEN;
  return `<div class="bx-stage ${opt.crop ? 'bx-stage--crop' : ''} ${opt.cls || ''}" style="--bx-ar:${vb[2]} / ${vb[3]}" data-bx-stage="${opt.crop ? 'crop' : 'full'}" data-bx-u="${opt.u || ''}">
      <div class="bx-cam">${bxSceneSvg(state, opt)}<canvas class="bx-cv" width="${vb[2]}" height="${vb[3]}"></canvas></div>
      <div class="bx-vign"></div><div class="bx-flash"></div>
      ${opt.tag ? `<div class="bx-tag">${escapeHTML(opt.tag)}</div>` : ''}
      <div class="bx-ban" data-bx-ban>${opt.banner ? escapeHTML(opt.banner) : ''}</div>
      <div class="bx-big" data-bx-big></div>
      ${opt.info || ''}
    </div>`;
}

/* --- the podiums at rest: a ✓ once a bid is sent, the money --------------------- */
function bxPaintPods(root, state) {
  const s = state.shared || {};
  if (!root || s.phase === 'open') return;
  root.querySelectorAll('[data-bx-pod]').forEach(g => {
    const id = g.getAttribute('data-bx-pod');
    const num = g.querySelector('.bx-num');
    const mon = g.querySelector('.bx-pod__mon');
    const done = (s.done || []).indexOf(id) !== -1;
    const txt = s.phase === 'gameover' ? '' : done ? '✓' : '?';
    if (num && num.textContent !== txt) {
      num.textContent = txt;
      if (done && !motionOff() && num.animate) num.animate([{ transform: 'scale(1,0.1)' }, { transform: 'scale(1,1.15)' }, { transform: 'none' }], { duration: 360, easing: 'ease-out' });
    }
    g.classList.toggle('is-done', done);
    const m = bxMoney((s.money || {})[id]) + ' ' + bxCur();
    if (mon && mon.textContent !== m) mon.textContent = m;
    g.classList.toggle('is-gone', !(state.players || []).some(p => p.id === id));
  });
}

/* --- the opening -------------------------------------------------------------------
   Adapted from the design sheet's timeline: 0 the bids turn over, 1.3 the winner,
   1.8 their coins fly into the box, 2.9 the drumroll, 4.1-5.1 3-2-1, 5.6 the lid
   flies and the reveal, the money settling by 9.4, the end at 10.6.
   ------------------------------------------------------------------------------ */
const bxSprite = (w, f) => { const c = document.createElement('canvas'); c.width = c.height = w; f(c.getContext('2d'), w); return c; };
let BX_SPR = null;
function bxSprites() {
  if (BX_SPR) return BX_SPR;
  const coin = bxSprite(64, (g) => {
    const r = g.createRadialGradient(24, 22, 4, 32, 32, 32);
    r.addColorStop(0, '#fff6c8'); r.addColorStop(0.45, '#f6c343'); r.addColorStop(0.85, '#c08a12'); r.addColorStop(1, '#7a5205');
    g.fillStyle = r; g.beginPath(); g.arc(32, 32, 30, 0, 7); g.fill();
    g.strokeStyle = 'rgba(122,82,5,.8)'; g.lineWidth = 3; g.beginPath(); g.arc(32, 32, 22, 0, 7); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.ellipse(22, 18, 9, 5, -0.6, 0, 7); g.fill();
  });
  const gems = ['#e0115f', '#1fbf73', '#2b5fd9'].map(col => bxSprite(64, (g) => {
    g.translate(32, 32);
    const r = g.createLinearGradient(-20, -24, 20, 24); r.addColorStop(0, '#fff'); r.addColorStop(0.3, col); r.addColorStop(1, '#111');
    g.fillStyle = r; g.beginPath(); g.moveTo(0, -26); g.lineTo(22, -6); g.lineTo(0, 26); g.lineTo(-22, -6); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-22, -6); g.lineTo(22, -6); g.moveTo(-10, -6); g.lineTo(0, 26); g.lineTo(10, -6); g.stroke();
  }));
  BX_SPR = { coin, gems };
  return BX_SPR;
}

function bxStopShow() {
  if (bx.show && bx.show.raf) cancelAnimationFrame(bx.show.raf);
  if (bx.show) bx.show.dead = true;
  bx.show = null;
}

/**
 * The opening on the stage in `root`, for the box in state.shared.result. Keeps
 * running across a redraw of the same box (it moves to the new stage and seeks),
 * plays its sounds on the room's voice only while it is watched live.
 */
function bxRunShow(root, state) {
  const s = state.shared || {};
  const R = s.result;
  if (!root || !R) return;
  const key = bxBoxKey(state) + '|' + (root.dataset.bxStage || '');
  const stage = root;
  const cam = stage.querySelector('.bx-cam'), svg = stage.querySelector('.bx-svg'), cv = stage.querySelector('.bx-cv');
  if (!cam || !svg || !cv) return;
  if (bx.show && bx.show.key === key && bx.show.stage === stage) return;
  if (stage.dataset.bxDone === key) { bxShowEnded(stage, state); return; }
  bxStopShow();
  const g = cv.getContext('2d');
  const crop = stage.dataset.bxStage === 'crop';
  const vb = crop ? BX_CROP : BX_SCEN;
  g.setTransform(1, 0, 0, 1, -vb[0], -vb[1]);
  const q = (sel) => svg.querySelector(sel);
  const ban = stage.querySelector('[data-bx-ban]'), big = stage.querySelector('[data-bx-big]');
  const flash = stage.querySelector('.bx-flash'), vign = stage.querySelector('.bx-vign');
  const BX = 640, BY = 440, BS = 0.9, TOPY = BY - 120 * BS, FLOOR = 612, CFLOOR = 600;
  const bxg = q('.bx-bx'), lid = q('.bx-lid'), crk = q('.bx-crk'), rays = q('.bx-rays'), ing = q('.bx-inglow'), obj = q('.bx-obj'), front = q('.bx-front');
  const rock = q('.bx-rock');
  if (rock) rock.classList.add('is-show');
  const seats = bxSeats(state);
  const B = seats.map(seat => {
    const el = svg.querySelector(`[data-bx-pod="${CSS.escape(seat.id)}"]`);
    return { id: seat.id, x: seat.x, y: seat.y, sc: seat.sc, el, disp: el && el.querySelector('.bx-disp'), num: el && el.querySelector('.bx-num'), hl: el && el.querySelector('.bx-hl'), mon: el && el.querySelector('.bx-pod__mon'), n: null, m: null };
  });
  const byId = (id) => B.find(b => b.id === id);
  const W = byId(R.winnerId);
  const pay = R.winnerId ? R.bid : 0;
  // «عرض الحاج» taken: the box is only shown, its effect never happens (the ideas of 7 Oct 2026).
  const dealt = R.deal !== null && R.deal !== undefined && !!R.winnerId;
  const tEffect = R.kind === 'scorpion' && !dealt ? 8.8 : 6.6, dEffect = R.kind === 'scorpion' && !dealt ? 0.6 : 1.1;
  // What the box itself moved (not the bid, the insurance or the deal): the lines and the floating numbers.
  const eff = (pred) => ((R.moves || []).find(m => !m.at && pred(m)) || {}).n || 0;
  const insured = {};
  (R.insured || []).forEach(id => { insured[id] = true; });
  const voice = bxVoice(state);
  const winnerName = bxIso(bxNameOf(state, R.winnerId));
  // The scorpion that jumps out (in front of everything, in scene coordinates).
  let scF = null;
  if (R.kind === 'scorpion' && front) {
    front.innerHTML = bxIds(`<g class="bx-scorp" style="display:none">${BX_SCORP}</g>`, stage.dataset.bxU || '');
    scF = front.querySelector('.bx-scorp');
  }
  const SPR = bxSprites();
  const S = { t: 0, last: -1, live: false, scx: 0, scy: 0 };
  let P = [], FT = [], curBan = null;
  const setBan = (txt) => { if (!ban || txt === curBan) return; curBan = txt; ban.textContent = txt; ban.classList.remove('is-in'); if (S.live && !motionOff()) { void ban.offsetWidth; ban.classList.add('is-in'); } };
  const pop = (txt, cls) => {
    if (!big) return;
    S.popAt = S.t; S.popCls = cls;
    big.textContent = txt; big.className = 'bx-big';
    if (!S.live) { if (cls === 'hold') big.className = 'bx-big is-held'; return; }
    void big.offsetWidth; big.className = 'bx-big is-' + cls;
  };
  const popTidy = () => { if (big && S.popCls === 'hold' && S.t - S.popAt > 2.6) { big.className = 'bx-big'; S.popCls = null; } if (big && S.popCls === 'pop' && !S.live) { big.className = 'bx-big'; S.popCls = null; } };
  const ft = (txt, x, y, c) => FT.push({ s: txt, x, y, c, t: 0, life: 1.8 });
  const snd = (kind, i) => { if (S.live && voice) bxSound(kind, i); };
  const spark = (x, y, n, col, sp) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = bxRnd(60, sp || 260); P.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.15, t: 0, life: bxRnd(0.4, 0.8), s: bxRnd(0.6, 1.3), c: col || '255,236,170' }); } };
  const fountain = (n, kinds) => { for (let i = 0; i < n; i++) { const k = kinds[Math.floor(Math.random() * kinds.length)]; P.push({ k, x: BX + bxRnd(-60, 60) * BS, y: TOPY + 8, vx: bxRnd(-0.5, 0.5) * 760, vy: -(680 + Math.random() * 560), r: Math.random() * 6, vr: bxRnd(-14, 14), s: bxRnd(0.75, 1.2), t: 0, life: bxRnd(2.8, 4.2), fl: 1, b: 0, c: Math.floor(Math.random() * 3), seed: Math.random() }); } };
  const smoke = (n, x, y, col, spd) => { for (let i = 0; i < n; i++) P.push({ k: 'smoke', x: (x === undefined ? BX : x) + bxRnd(-100, 100) * BS, y: (y === undefined ? TOPY : y) - bxRnd(0, 40), vx: bxRnd(-160, 160) * (spd || 1), vy: -bxRnd(60, 240) * (spd || 1), s: bxRnd(30, 70), t: 0, life: bxRnd(1.3, 2.3), c: col || '199,160,255' }); };
  const flyTo = (n, x0, y0, x1, y1, d0) => { for (let i = 0; i < n; i++) P.push({ k: 'fly', x0: x0 + bxRnd(-20, 20), y0: y0 + bxRnd(-10, 10), x1: x1 + bxRnd(-30, 30), y1: y1 + bxRnd(-8, 8), d: (d0 || 0) + i * 0.06, dur: 0.7, t: 0, life: 9, r: Math.random() * 6, x: x0, y: y0 }); };
  const confetti = () => { for (let i = 0; i < 150; i++) P.push({ k: 'conf', x: bxRnd(vb[0], vb[0] + vb[2]), y: vb[1] - bxRnd(10, 260), vx: bxRnd(-80, 80), vy: bxRnd(60, 260), g: 0.12, r: Math.random() * 6, vr: bxRnd(-10, 10), t: 0, life: bxRnd(3, 4.5), c: BX_CONF[i % 5] }); };
  const goldSparks = () => { for (let i = 0; i < 90; i++) { const a = Math.random() * 6.28, v = bxRnd(40, 340); P.push({ k: 'spark', x: BX, y: TOPY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, g: -0.02, t: 0, life: bxRnd(1.4, 2.6), s: bxRnd(0.6, 1.4), c: '255,214,110' }); } };
  const resultLine = () => {
    const v = { w: winnerName };
    if (!R.winnerId) return bxT('box_res_nobody', { k: bxKind(R.kind) });
    if (dealt) return bxT('box_res_deal', { w: winnerName, v: bxAmt(R.deal), k: bxKind(R.kind) + (R.kind === 'treasure' ? ' (' + bxAmt(R.value) + ')' : '') });
    if (R.kind === 'treasure') v.v = bxAmt(R.value);
    if (R.kind === 'scorpion') v.v = bxAmt(eff(m => m.from === R.winnerId && m.to === null));
    if (R.kind === 'bill') v.v = bxAmt(R.value);
    if (R.kind === 'steal') { v.v = bxAmt(eff(m => m.from === R.victimId && m.to === R.winnerId)); v.x = bxIso(bxNameOf(state, R.victimId)); }
    if (R.kind === 'double') v.v = bxAmt(eff(m => m.from === null && m.to === R.winnerId) || pay * (R.x2 ? 4 : 2));
    const k = R.kind === 'double' ? (R.coin === 'heads' ? 'box_res_heads' : 'box_res_tails') : R.kind === 'steal' && !R.victimId ? 'box_res_empty' : 'box_res_' + R.kind;
    // «تأمين»: what the insurance saved, said after.
    const saved = Object.keys(R.insPaid || {}).map(id => bxT('box_ins_paid', { w: bxIso(bxNameOf(state, id)), v: bxAmt(R.insPaid[id]) })).join(' · ');
    return bxT(k, v) + (saved ? ' · ' + saved : '');
  };
  const bigWord = () => (R.x2 ? '×2 ' : '') + (dealt && R.kind === 'double' ? bxKind('double')
    : bxT(R.kind === 'double' ? (R.winnerId && R.coin === 'tails' ? 'box_big_tails' : 'box_big_heads') : 'box_big_' + R.kind));

  function events() {
    const ev = (a) => S.last < a && S.t >= a;
    if (ev(0)) { setBan(bxT('box_sh_start')); snd('whoosh'); }
    if (ev(0.6)) { B.forEach(b => spark(b.x, b.y, 10)); snd('flip'); }
    // «تأمين»: the insured pay their 50, a shield on their podium.
    if (ev(0.95)) B.forEach(b => { if (insured[b.id]) ft('🛡 −' + bxMoney(50), b.x, b.y - 70, '#9ad1ff'); });
    if (ev(1.3)) {
      if (W && dealt) setBan(bxT('box_sh_deal', { w: winnerName, v: bxAmt(R.deal) }));
      else if (W && R.offer) setBan(bxT('box_sh_nodeal', { w: winnerName }));
      else if (W) setBan(R.tie ? bxT(R.tieBy === 'poorer' ? 'box_sh_tie' : 'box_sh_lot') + ' · ' + bxT('box_sh_won', { w: winnerName, n: bxAmt(pay) }) : bxT('box_sh_won', { w: winnerName, n: bxAmt(pay) }));
      else setBan(bxT('box_sh_nobody'));
      snd('ding');
    }
    if (ev(1.8) && W) { flyTo(12, W.x, W.y, BX, TOPY + 6); ft('−' + bxMoney(pay), W.x, W.y - 60, '#ff9a9a'); snd('coins'); }
    if (ev(2.9)) { setBan(bxT(R.x2 ? 'box_sh_drum_x2' : 'box_sh_drum')); snd(R.x2 ? 'drumBig' : 'drum'); }
    [4.1, 4.6, 5.1].forEach((a, i) => { if (ev(a)) { pop(['3', '2', '1'][i], 'pop'); snd('tick', i); } });
    if (ev(BX_TB)) {
      P.push({ k: 'boom', x: BX, y: TOPY, t: 0, life: 0.9 });
      setBan('');
      spark(BX, TOPY, 40, null, 520);
      snd('boom');
      if (R.kind === 'treasure' || (R.kind === 'double' && R.coin !== 'tails' && R.winnerId)) fountain(45, ['coin', 'coin', 'coin', 'gem']);
      else if (R.kind === 'empty') smoke(26, BX, TOPY, '190,182,170', 0.8);
      else smoke(24);
    }
    if (R.kind === 'treasure' && S.t > BX_TB && S.t < BX_TB + 1.2) fountain(3, ['coin', 'coin', 'coin', 'gem']);
    if (ev(BX_TB + 0.25)) {
      pop(bigWord(), 'hold');
      if (R.kind === 'treasure') { confetti(); snd('fanfare'); }
      else if (R.kind === 'key') { goldSparks(); snd('chime'); }
      else if (R.kind === 'double') { snd('spin'); }
      else if (R.kind === 'empty') { snd('sad'); }
      else if (R.kind === 'bill') { snd('paper'); }
      else if (R.kind === 'steal') { snd('sneak'); }
    }
    if (R.kind === 'scorpion' && !dealt) {
      if (ev(BX_TB + 0.4)) snd('boing');
      if (ev(BX_TB + 2.1)) setBan(bxT('box_big_scorpion'));
      if (ev(8.8) && W) {
        const dir = Math.sign(W.x - BX) || 1;
        for (let i = 0; i < 18; i++) P.push({ k: 'coin', x: W.x + bxRnd(-30, 30), y: W.y, vx: dir * bxRnd(120, 520), vy: -bxRnd(380, 820), r: Math.random() * 6, vr: bxRnd(-14, 14), s: bxRnd(0.75, 1.1), t: 0, life: 2.6, fl: 1, b: 0, seed: Math.random() });
        ft('−' + bxMoney(eff(m => m.from === R.winnerId && m.to === null)), W.x, W.y - 70, '#ff9a9a');
        setBan(resultLine());
        snd('scatter');
      }
      if (ev(8.8) && !W) setBan(resultLine());
    } else if (ev(6.6) && dealt) {
      // The old host's money, from above the stage to the winner; the box only shows what was given up.
      setBan(resultLine());
      if (W) { flyTo(16, BX, vb[1] + 40, W.x, W.y); ft('+' + bxMoney(R.deal), W.x, W.y - 60, '#7dffb0'); snd('coins'); }
    } else if (ev(6.6)) {
      setBan(resultLine());
      if (W && R.kind === 'treasure') { flyTo(16, BX, TOPY, W.x, W.y); ft('+' + bxMoney(R.value), W.x, W.y - 60, '#7dffb0'); snd('coins'); }
      if (W && R.kind === 'double') {
        if (R.coin === 'heads') { flyTo(16, BX, TOPY, W.x, W.y); ft('+' + bxMoney(eff(m => m.from === null && m.to === R.winnerId) || pay * 2), W.x, W.y - 60, '#7dffb0'); snd('coins'); }
        else smoke(18, BX, TOPY - 90, '120,110,140', 0.6);
      }
      if (W && R.kind === 'bill') {
        (R.moves || []).filter(m => m.from === R.winnerId && m.to).forEach((m, i) => {
          const T = byId(m.to); if (!T) return;
          flyTo(4, W.x, W.y, T.x, T.y, i * 0.08); ft('+' + bxMoney(m.n), T.x, T.y - 60, '#7dffb0');
        });
        ft('−' + bxMoney((R.moves || []).filter(m => !m.at && m.from === R.winnerId && m.to).reduce((a, m) => a + m.n, 0)), W.x, W.y - 60, '#ff9a9a');
        snd('coins');
      }
      if (W && R.kind === 'steal' && R.victimId) {

  const fin = s.box === s.finale && typeof s.finale === 'number' ? `<div class="bx-fin">${escapeHTML(bxT('box_finale'))}</div>` : '';
  return `${fin}<div class="bx-ptop">
      <span class="bx-ptop__n">${escapeHTML(bxT('box_n', { n: (s.box || 0) + 1, m: s.boxes || 8 }))}</span>
      <span class="bx-pmon"><span class="bx-pmon__k">${escapeHTML(bxT('box_money'))}</span> <b class="metric" dir="ltr">${bxMoney(bxMyMoney(state))}</b> ${escapeHTML(bxCur())}</span>
    </div>
    <div class="bx-dots" aria-hidden="true">${[0, 1, 2].map(k => `<i class="${k <= i ? 'is-on' : ''}"></i>`).join('')}</div>`;
}

/** The talk clock (or the last call): the seconds and a draining bar, painted in place. */
function bxTalkHtml(state) {
  const s = state.shared || {};
  const until = s.phase === 'talk' ? s.talkEndsAt : s.bidEndsAt;
  const total = s.phase === 'talk' ? 60000 : 20000;
  return `<div class="bx-talk ${s.phase === 'bid' ? 'is-last' : ''}">
      <span>${escapeHTML(bxT(s.phase === 'talk' ? 'box_talk' : 'box_last'))}</span>
      <b class="metric bx-talk__t" data-bx-clock="${until || 0}">…</b>
    </div>
    <i class="bx-tbar"><i data-bx-bar="${until || 0}" data-bx-total="${total}"></i></i>`;
}

/** A key's holder: what they alone know about this box (or the next). */
function bxPeekHtml(state) {
  const p = state.you && state.you.peek;
  const s = state.shared || {};
  if (!p) return '';
  const what = bxKind(p.kind) + (p.kind === 'treasure' && p.value ? ' (' + bxAmt(p.value) + ')' : '');
  const line = p.box === s.box ? bxT('box_peek_line', { k: what }) : bxT('box_peek_next', { k: what });
  return `<div class="bx-peek"><b>${escapeHTML(bxT('box_peek_title'))}</b><span>${escapeHTML(line)}</span></div>`;
}

function bxWaitChipsHtml(state) {
  const s = state.shared || {};
  const done = s.done || [];
  return `<div class="bx-avs" data-bx-avs>${bxHereIds(state).map(id => {
    const nm = bxNameOf(state, id);
    return `<span class="bx-av ${done.indexOf(id) !== -1 ? 'is-ok' : ''}" data-bx-av="${escapeHTML(id)}" title="${escapeHTML(nm)}">${escapeHTML((String(nm).trim()[0] || '?'))}</span>`;
  }).join('')}</div>`;
}

function bxPhoneBidHtml(state) {
  const s = state.shared || {};
  const l = bxLocalFor(state);
  const max = bxMyMoney(state);
  if (l.v > max) l.v = max;
  const mine = state.you && typeof state.you.bid === 'number';
  if (mine || l.step === 'wait') {
    const n = mine ? state.you.bid : l.v;
    return `${bxPhoneTopHtml(state, 'wait')}
      <div class="bx-step bx-step--wait">
        <div class="bx-coin3" aria-hidden="true">${escapeHTML(bxCur())}</div>
        <p class="bx-k" data-bx-wmsg>${escapeHTML(bxT('box_wait'))}</p>
        ${bxWaitChipsHtml(state)}
        <p class="bx-note">${escapeHTML(n > 0 ? bxT('box_you_bid', { n: bxMoney(n), cur: bxCur() }) : bxT('box_you_pass'))}</p>
        ${(mine ? state.you.insured : l.ins) ? `<p class="bx-note bx-note--ins">${escapeHTML(bxT('box_ins_on', { n: BX_INSURE }))}</p>` : ''}
        ${bxTalkHtml(state)}
        ${bxPeekHtml(state)}
      </div>`;
  }
  const maxBid = bxMaxBid(state);
  if (l.v > maxBid) l.v = maxBid;
  if (l.step === 'bid') {
    return `${bxPhoneTopHtml(state, 'bid')}
      <div class="bx-step bx-step--bid">
        <p class="bx-k">${escapeHTML(bxT('box_bid_q'))}</p>
        <div class="bx-bidrow" dir="ltr">
          <button type="button" class="bx-rb" data-bx-minus onclick="bxAdd(-10)" aria-label="${escapeHTML(bxT('box_minus'))}" ${l.v <= 0 ? 'disabled' : ''}>−</button>
          <div class="bx-bn"><b class="bx-bv metric" data-bx-v>${bxMoney(l.v)}</b><span>${escapeHTML(bxCur())}</span></div>
          <button type="button" class="bx-rb" data-bx-plus onclick="bxAdd(10)" aria-label="${escapeHTML(bxT('box_plus'))}" ${l.v >= maxBid ? 'disabled' : ''}>+</button>
        </div>
        <div class="bx-qchips">
          <button type="button" onclick="bxChip(50)"><span dir="ltr">+50</span></button>
          <button type="button" onclick="bxChip(100)"><span dir="ltr">+100</span></button>
          <button type="button" onclick="bxChip('all')">${escapeHTML(bxT('box_all_in'))}</button>
          <button type="button" onclick="bxChip('zero')">${escapeHTML(bxT('box_zero'))}</button>
        </div>
        <p class="bx-note">${escapeHTML(bxT('box_bid_note'))}</p>
        <p class="bx-note bx-note--zero" data-bx-zero-note ${l.v === 0 ? '' : 'hidden'}>${escapeHTML(bxT('box_zero_note'))}</p>
        <button type="button" class="bx-ins ${l.ins ? 'is-on' : ''}" aria-pressed="${l.ins ? 'true' : 'false'}" onclick="bxIns()" ${max < BX_INSURE ? 'disabled' : ''}><b>${escapeHTML(bxT('box_ins', { n: BX_INSURE }))}</b><small>${escapeHTML(bxT('box_ins_hint'))}</small></button>
        ${bxTalkHtml(state)}
        <button type="button" class="bx-go" onclick="bxConfirm()">${escapeHTML(bxT('box_confirm'))}</button>
        <button type="button" class="bx-ghost" onclick="bxStep('clue')">${escapeHTML(bxT('box_back_clue'))}</button>
      </div>`;
  }
  const clue = state.you && state.you.clue;
  return `${bxPhoneTopHtml(state, 'clue')}
    <div class="bx-step bx-step--clue">
      <p class="bx-k">${escapeHTML(bxT('box_clue_title'))}</p>
      <div class="hold-card bx-clue" role="button" tabindex="0" aria-label="${escapeHTML(bxT('box_hold'))}">
        <div class="hold-card__front bx-clue__back">
          <svg class="bx-clue__art" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="#ffd35a" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/><text x="60" y="86" text-anchor="middle" font-size="84" font-weight="900" fill="#ffd35a">؟</text></svg>
          <b>${escapeHTML(bxT('box_hold'))}</b><small>${escapeHTML(bxT('box_hold_hint'))}</small>
        </div>
        <div class="hold-card__back bx-clue__front" aria-hidden="true">
          <small>${escapeHTML(bxT('box_about'))}</small>
          <p>${escapeHTML(bxClueText(clue))}</p>
          <em>${escapeHTML(bxT('box_true'))}</em>
        </div>
      </div>
      ${bxPeekHtml(state)}
      ${bxTalkHtml(state)}
      <p class="bx-note">${escapeHTML(bxT('box_note_lie'))}</p>
      <button type="button" class="bx-go" onclick="bxStep('bid')">${escapeHTML(bxT('box_ready'))}</button>
    </div>`;
}

/** The phone during the opening: the box close up, then what happened to you. */
function bxPhoneOpenHtml(state) {
  const s = state.shared || {};
  const R = s.result || {};
  const bids = bxHereIds(state).concat(Object.keys(R.bids || {})).filter((id, i, a) => a.indexOf(id) === i);
  const chips = bids.map(id => {
    const n = (R.bids || {})[id];
    const win = id === R.winnerId;
    return `<span class="bx-bidchip ${win ? 'is-win' : ''}"><bdi>${escapeHTML(bxNameOf(state, id))}</bdi> <b class="metric" dir="ltr">${n === undefined ? '—' : bxMoney(n)}</b>${(R.insured || []).indexOf(id) !== -1 ? ' 🛡️' : ''}</span>`;
  }).join('');
  const d = (R.delta || {})[Room.me];
  const mine = typeof d === 'number' && d !== 0
    ? `<div class="bx-mine ${d > 0 ? 'is-up' : 'is-down'}"><span><b dir="ltr">${d > 0 ? '+' : '−'}${bxMoney(Math.abs(d))}</b> ${escapeHTML(bxCur())}</span></div>` : '';
  return `${bxStageHtml(state, { crop: true, u: 'P', kind: R.kind, coin: R.coin, tag: bxT('box_n', { n: (s.box || 0) + 1, m: s.boxes || 8 }) })}
    <div class="bx-bids bx-after" data-bx-from="0.6">${chips}</div>
    <div class="bx-after" data-bx-from="9.4">${mine}</div>`;
}

function bxOpenedHtml(state) {
  const s = state.shared || {};
  // The box being opened stays shut in the strip until its lid flies (the server adds it as the show starts).
  const lidAt = s.phase === 'open' ? (s.openAt || 0) + BX_TB * 1000 : 0;
  const cells = Array.from({ length: s.boxes || 8 }, (_, i) => {
    const o = (s.opened || [])[i];
    const cur = i === s.box && s.phase !== 'gameover' && !(s.phase === 'open');
    if (o && i === s.box && lidAt > bxServerNow()) {
      return `<span class="bx-ob${i === s.finale ? ' is-x2' : ''}" data-bx-lid="${lidAt}" data-bx-icon="${escapeHTML(BX_KIND_ICON[o.kind] || '?')}" data-bx-title="${escapeHTML(bxKind(o.kind))}"><b dir="ltr">${i + 1}</b></span>`;
    }
    const x2 = i === s.finale ? ' is-x2' : '';
    return `<span class="bx-ob ${o ? 'is-open' : ''} ${cur ? 'is-cur' : ''}${x2}" title="${o ? escapeHTML(bxKind(o.kind)) : i === s.finale ? escapeHTML(bxT('box_finale_tag')) : ''}">${o ? BX_KIND_ICON[o.kind] || '?' : `<b dir="ltr">${i + 1}</b>`}${x2 ? '<i class="bx-ob__x2" dir="ltr">×2</i>' : ''}</span>`;
  }).join('');
  if (lidAt) setTimeout(bxOpenedLater, 0);
  return `<div class="bx-opened" aria-label="${escapeHTML(bxT('box_opened'))}">${cells}</div>`;
}
/** The strip's shut cell turns open when the lid flies, on every screen showing it. */
function bxOpenedLater() {
  clearTimeout(bx.obTimer);
  const due = [...document.querySelectorAll('[data-bx-lid]')];
  if (!due.length) return;
  const wait = Math.min(...due.map((c) => Number(c.dataset.bxLid))) - bxServerNow();
  bx.obTimer = setTimeout(() => {
    document.querySelectorAll('[data-bx-lid]').forEach((c) => {
      if (Number(c.dataset.bxLid) > bxServerNow() + 30) return;
      c.classList.add('is-open');
      c.title = c.dataset.bxTitle || '';
      c.textContent = c.dataset.bxIcon || '?';
      c.removeAttribute('data-bx-lid');
    });
    bxOpenedLater();
  }, Math.max(0, wait));
}

/* --- the host's buttons ---------------------------------------------------------------- */
function bxHostBtns(state, tv) {
  const s = state.shared || {};
  const t = TRANSLATIONS[appState.lang] || {};
  const btn = (label, fn, kind) => (tv ? tvBtn(label, fn, kind) : `<button type="button" class="btn btn--${kind === 'ghost' ? 'ghost' : 'go'} btn--auto" onclick="${fn}">${escapeHTML(label)}</button>`);
  if (s.phase === 'talk') return roomMoveOnHtml(state, `<div class="${tv ? 'tv-actions' : 'bx-host'}">${btn(bxT('box_host_call'), `roomAct('openBids', { box: ${s.box} })`, 'ghost')}${btn(bxT('box_host_close'), `roomAct('closeBids', { box: ${s.box} })`, 'ghost')}</div>`);
  if (s.phase === 'bid') return roomMoveOnHtml(state, `<div class="${tv ? 'tv-actions' : 'bx-host'}">${btn(bxT('box_host_close'), `roomAct('closeBids', { box: ${s.box} })`, 'ghost')}</div>`);
  if (s.phase === 'open') {
    const last = (s.box || 0) + 1 >= (s.boxes || 8);
    const soon = `<div class="bx-soon">${escapeHTML(bxT(last ? 'box_final_in' : 'box_next_in'))} <b class="metric" data-bx-clock="${s.nextAt || 0}">…</b></div>`;
    return `<div class="bx-after" data-bx-from="${BX_T}">${roomMoveOnHtml(state, `<div class="${tv ? 'tv-actions' : 'bx-host'}">${btn(bxT(last ? 'box_final' : 'box_next'), `roomAct('nextBox', { box: ${s.box} })`)}</div>`)}${soon}</div>`;
  }
  if (s.phase === 'gameover' && state.youAreHost) {
    return `<div class="${tv ? 'tv-actions' : 'btn-row'}" style="margin-top:var(--sp-3)">${btn('▶ ' + (t.play_again || ''), "roomAct('playAgain', {})")}${btn(t.room_another_game || '', "roomAct('backToHub')", 'ghost')}</div>`;
  }
  return '';
}

function bxOverHtml(state, tv) {
  const s = state.shared || {};
  return `<div class="bx-over ${tv ? 'bx-over--tv' : ''}">
      <div class="bx-over__title">${escapeHTML(bxT('box_over'))}</div>
      ${bxOpenedHtml(state)}
      ${renderPodium(state, s.board)}
      ${tv ? '' : renderScoreboard(s.board)}
      ${!tv && typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, s.board) : ''}
    </div>`;
}

/* --- the room game ------------------------------------------------------------------ */
function bxSig(state) {
  const s = state.shared || {};
  const l = s.phase === 'talk' || s.phase === 'bid' ? bxLocalFor(state) : null;
  const you = state.you || {};
  return ['bx', s.phase, s.box, bxRole(state), l ? l.step : '', l ? !!l.ins : '', typeof you.bid === 'number' ? 'sent' : '',
    you.clue ? you.clue.id : '', you.peek ? you.peek.box : '', bxMyMoney(state), state.youAreHost, appState.lang,
    s.phase === 'gameover' ? JSON.stringify(s.board || []) : ''].join('|');
}

ROOM_GAMES.box = {
  lateJoin: true,     // someone who joins mid-game watches, and plays the next game
  lobbyOptions(state) {
    return `<p class="field__hint" style="text-align:center">${escapeHTML(bxT('box_lobby_hint'))}</p>`;
  },
  startPayload() { return {}; },
  actionKey(state) {
    const s = state.shared || {};
    return [roomDealKey(state), s.box, s.phase === 'bid' ? 'talk' : s.phase].join('|');
  },
  render(state) {
    if (appState.currentView !== 'room-box') setView('room-box');
    const el = document.getElementById('view-room-box');
    if (!el) return;
    bxNoteTime(state);
    const s = state.shared || {};
    const role = bxRole(state);
    renderRoomFrame(el, bxSig(state), () => {
      let body = '';
      if (s.phase === 'gameover') body = bxOverHtml(state, false);
      else if (s.phase === 'open') body = bxPhoneOpenHtml(state);
      else if (s.phase === 'offer') body = bxPhoneOfferHtml(state);
      else if (role === 'watch') body = `${bxStageHtml(state, { crop: true, u: 'P', tag: bxT('box_n', { n: (s.box || 0) + 1, m: s.boxes || 8 }) })}<div class="waiting-note">${escapeHTML(bxT('box_watch'))}</div>${bxTalkHtml(state)}`;
      else body = bxPhoneBidHtml(state);
      return `<div class="bx bx--${s.phase}">
          <div class="bx-phone">${body}</div>
          ${s.phase !== 'gameover' ? bxOpenedHtml(state) : ''}
          ${bxHostBtns(state, false)}
          ${renderRoomPlayerStrip(state)}
        </div>`;
    });
    refreshRoomPlayerStrip(el, state);
    bxAfter(state, el);
  }
};

/* --- after every paint: the ✓s in place, the clocks, the show, the sounds ------------ */
function bxAfter(state, el) {
  const s = state.shared || {};
  bxNoteTime(state);
  // Who has bid, painted in place (a redraw would drop a finger holding the clue).
  (s.done || []).forEach(id => { const a = el.querySelector(`[data-bx-av="${CSS.escape(id)}"]`); if (a && !a.classList.contains('is-ok')) { a.classList.add('is-ok'); if (!motionOff() && a.animate) a.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.15)' }, { transform: 'none' }], { duration: 320 }); } });
  const wmsg = el.querySelector('[data-bx-wmsg]');
  if (wmsg) {
    const all = bxHereIds(state).every(id => (s.done || []).indexOf(id) !== -1);
    wmsg.textContent = bxT(all ? 'box_all_done' : 'box_wait');
  }
  el.querySelectorAll('[data-bx-stage]').forEach(st => bxPaintPods(st, state));
  if (s.phase === 'open') {
    const stage = el.querySelector('[data-bx-stage]');
    if (stage) bxRunShow(stage, state);
  } else if (bx.show && !bx.show.stage.isConnected) bxStopShow();
  if (s.phase === 'gameover') {
    animateScoreboards(state);
    if (bxOnce('over|' + roomDealKey(state))) {
      if (bxVoice(state)) bxSound('fanfare');
      const top = (s.board || [])[0];
      if (top && (state.youAreScreen || (s.board || []).some(r => r.id === Room.me && r.score === top.score))) {
        afterReveal(el, () => { if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); });
      }
    }
  }
  if ((s.phase === 'talk') && bxOnce('talk|' + bxBoxKey(state)) && bxVoice(state)) bxSound(s.box === s.finale ? 'drumBig' : 'ding');
  if (s.phase === 'offer' && bxOnce('offer|' + bxBoxKey(state))) { if (bxVoice(state)) bxSound('offer'); if ((s.offer || {}).winnerId === Room.me) haptic('double'); }
  if ((s.phase === 'bid') && bxOnce('last|' + bxBoxKey(state))) { if (bxVoice(state)) bxSound('tick', 2); if (bxRole(state) === 'player' && (s.done || []).indexOf(Room.me) === -1) haptic('medium'); }
  // The clocks and the bars, painted in place.
  if (bx.timer) clearInterval(bx.timer);
  bx.timer = null;
  const paint = () => {
    const st = Room.state;
    if (!st || st.game !== 'box') { bxStop(); return; }
    const now = bxServerNow();
    el.querySelectorAll('[data-bx-clock]').forEach(c => {
      const left = Math.max(0, Math.ceil((Number(c.dataset.bxClock) - now) / 1000));
      const txt = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (c.textContent !== txt) c.textContent = txt;
      c.classList.toggle('is-low', left <= 10);
    });
    el.querySelectorAll('[data-bx-bar]').forEach(b => {
      const left = Math.max(0, Number(b.dataset.bxBar) - now);
      b.style.transform = `scaleX(${Math.min(1, left / (Number(b.dataset.bxTotal) || 1)).toFixed(3)})`;
    });
  };
  paint();
  if (s.phase === 'talk' || s.phase === 'bid' || s.phase === 'open' || s.phase === 'offer') bx.timer = setInterval(paint, 250);
}

function bxStop() {
  if (bx.timer) clearInterval(bx.timer);
  bx.timer = null;
}
onLeaveScreen((from) => { if (from === 'room-box' || from === 'room-tv') { bxStop(); bxStopShow(); } });
onRoomClocksReset(() => { bxStop(); bxStopShow(); bx.local = null; });

/** The studio's sounds: a drumroll, the ticks, the boom, coins, a fanfare, the scorpion's boing and the rest. */
function bxSound(kind, i) {
  try {
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'drumBig') {
      // The finale's own drumroll: longer, louder, a cymbal at its end.
      for (let k = 0; k < 40; k++) fxNoise('lowpass', 220 + k * 9, 0.8, [[0, 0.2 + k * 0.012], [0.07, 0.001]], at + k * (0.075 - k * 0.0008));
      fxNoise('highpass', 5000, 0.6, [[0, 0.001], [0.02, 0.35], [1.4, 0.001]], at + 2.4);
      fxTone('sine', [[0, 90], [0.6, 45]], [[0, 0.5], [0.7, 0.001]], at + 2.4);
    } else if (kind === 'offer') {
      // The old host's phone call: a two-tone ring and a till.
      for (let k = 0; k < 2; k++) { fxTone('sine', [[0, 880]], [[0, 0.14], [0.18, 0.001]], at + k * 0.4); fxTone('sine', [[0, 1100]], [[0, 0.12], [0.18, 0.001]], at + k * 0.4 + 0.2); }
      for (let k = 0; k < 5; k++) fxTone('triangle', [[0, 1800 + k * 120]], [[0, 0.1], [0.12, 0.001]], at + 0.9 + k * 0.05);
    } else if (kind === 'drum') {
      for (let k = 0; k < 26; k++) fxNoise('lowpass', 260 + k * 8, 0.8, [[0, 0.18 + k * 0.012], [0.07, 0.001]], at + k * (0.1 - k * 0.0018));
    } else if (kind === 'tick') {
      fxTone('square', [[0, 880 + (i || 0) * 220]], [[0, 0.12], [0.09, 0.001]], at);
    } else if (kind === 'boom') {
      fxNoise('lowpass', 900, 0.7, [[0, 0.7], [0.5, 0.001]], at);
      fxTone('sine', [[0, 120], [0.4, 40]], [[0, 0.6], [0.5, 0.001]], at);
    } else if (kind === 'coins') {
      for (let k = 0; k < 7; k++) { const hz = 1500 + Math.random() * 900; fxTone('triangle', [[0, hz], [0.04, hz * 1.4]], [[0, 0.12], [0.16, 0.001]], at + k * 0.06); }
    } else if (kind === 'fanfare') {
      playFx('tada');
    } else if (kind === 'ding') {
      fxTone('sine', [[0, 1320]], [[0, 0.18], [0.5, 0.001]], at);
      fxTone('sine', [[0, 1980]], [[0, 0.08], [0.4, 0.001]], at + 0.02);
    } else if (kind === 'flip') {
      for (let k = 0; k < 4; k++) fxNoise('bandpass', 2200, 2, [[0, 0.14], [0.04, 0.001]], at + k * 0.05);
    } else if (kind === 'whoosh') {
      fxNoise('bandpass', 900, 0.6, [[0, 0.001], [0.2, 0.2], [0.4, 0.001]], at);
    } else if (kind === 'boing') {
      fxTone('sine', [[0, 180], [0.12, 520], [0.3, 240]], [[0, 0.3], [0.35, 0.001]], at);
    } else if (kind === 'scatter') {
      for (let k = 0; k < 10; k++) { const hz = 1200 + Math.random() * 1400; fxTone('triangle', [[0, hz]], [[0, 0.1], [0.12, 0.001]], at + k * 0.04 + Math.random() * 0.03); }
      fxTone('sawtooth', [[0, 300], [0.4, 90]], [[0, 0.12], [0.45, 0.001]], at);
    } else if (kind === 'chime') {
      [1568, 1976, 2349, 3136].forEach((hz, k) => fxTone('sine', [[0, hz]], [[0, 0.14], [0.6, 0.001]], at + k * 0.09));
    } else if (kind === 'spin') {
      for (let k = 0; k < 12; k++) fxTone('triangle', [[0, 2400 - k * 60]], [[0, 0.08], [0.05, 0.001]], at + k * 0.1);
    } else if (kind === 'sad') {
      [392, 370, 349, 294].forEach((hz, k) => fxTone('sawtooth', [[0, hz], [k === 3 ? 0.9 : 0.3, hz * (k === 3 ? 0.94 : 1)]], [[0, 0.1], [k === 3 ? 0.9 : 0.3, 0.001]], at + k * 0.34));
    } else if (kind === 'paper') {
      fxNoise('highpass', 2500, 0.8, [[0, 0.001], [0.3, 0.16], [0.9, 0.001]], at);
      fxTone('sine', [[0, 1760]], [[0, 0.12], [0.2, 0.001]], at + 0.9);
    } else if (kind === 'sneak') {
      [196, 233, 262, 233].forEach((hz, k) => fxTone('triangle', [[0, hz]], [[0, 0.14], [0.15, 0.001]], at + k * 0.2));
    } else if (kind === 'end') {
      fxTone('sine', [[0, 660]], [[0, 0.1], [0.3, 0.001]], at);
    }
  } catch (e) {}
}

/* --- the big screen ---------------------------------------------------------------- */
TV_GAMES.box = {
  sig(state) {
    const s = state.shared || {};
    return ['box', roomDealKey(state), s.phase, s.box, state.youAreHost, appState.lang,
      (s.roster || []).filter(id => (state.players || []).some(p => p.id === id)).join(','), s.phase === 'gameover' ? JSON.stringify(s.board || []) : ''].join('|');
  },
  frame(state, t) {
    const s = state.shared || {};
    if (s.phase === 'gameover') {
      return `<div class="bx bx-tv bx-tv--over"><div class="bx-tv__over">${bxOverHtml(state, true)}</div><div class="bx-tv__side tv-scale">${renderScoreboard(s.board)}${bxHostBtns(state, true)}</div></div>`;
    }
    const tag = bxT('box_n', { n: (s.box || 0) + 1, m: s.boxes || 8 });
    let info = '';
    if (s.phase === 'offer' && s.offer) {
      info = `<div class="bx-tvinfo bx-tvoffer">
          <span class="bx-tvoffer__old" aria-hidden="true">🎩👴</span>
          <span>${escapeHTML(bxT('box_offer_tv', { w: bxIso(bxNameOf(state, s.offer.winnerId)), v: bxAmt(s.offer.amount) }))}</span>
          <b class="metric bx-tvinfo__clock" data-bx-clock="${s.offer.endsAt || 0}">…</b>
        </div>`;
    }
    if (s.phase === 'talk' || s.phase === 'bid') {
      const until = s.phase === 'talk' ? s.talkEndsAt : s.bidEndsAt;
      info = `<div class="bx-tvinfo ${s.phase === 'bid' ? 'is-last' : ''}">
          <b class="metric bx-tvinfo__clock" data-bx-clock="${until || 0}">…</b>
          <span>${escapeHTML(bxT(s.phase === 'talk' ? 'box_tv_talk' : 'box_tv_bid'))}</span>
        </div>`;
    }
    const R = s.result || {};
    return `<div class="bx bx-tv">
        ${bxStageHtml(state, { u: 'T', kind: s.phase === 'open' ? R.kind : null, coin: R.coin, tag, info, cls: 'bx-stage--tv', banner: s.phase === 'open' ? '' : s.phase === 'offer' ? bxT('box_offer_title') : s.box === s.finale && s.phase === 'talk' ? bxT('box_finale') : bxT(s.phase === 'talk' ? 'box_talk' : 'box_last') })}
        <div class="bx-tv__bar">${bxOpenedHtml(state)}${bxHostBtns(state, true)}</div>
      </div>`;
  },
  after(state) {
    const el = document.getElementById('view-room-tv');
    if (el) bxAfter(state, el);
  }
};
</script>
