<script>
/* ============================================================================
   كلمة واحدة + من أنا؟ — MULTIPLAYER
   ----------------------------------------------------------------------------
   Both games exist here twice on purpose: the original pass-the-phone flow is
   untouched, and this is a second way in. A group with one working phone plays
   exactly as it did before.
   ========================================================================= */

/** The this-device / separate-phones switch on a setup screen. */
function setPlayMode(gameId, mode) {
  const view = document.querySelector('[id^="view-setup-"]:not(.hidden)');
  if (!view) return;
  const online = mode === 'online';

  view.querySelectorAll('.mode-switch .segmented__item').forEach(b => {
    b.classList.toggle('is-active', b.dataset.mode === mode);
  });
  const onlinePanel = view.querySelector('.mode-online-panel');
  const devicePanel = view.querySelector('.mode-device-panel');
  if (onlinePanel) onlinePanel.classList.toggle('hidden', !online);
  if (devicePanel) devicePanel.classList.toggle('hidden', online);
}

/* ==========================================================================
   كلمة واحدة
   Everyone writes at once instead of one at a time, which is the whole reason
   to put this on separate phones.
   ========================================================================== */
ROOM_GAMES.justone = {
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = TRANSLATIONS[appState.lang];
    return `<p class="field__hint" style="text-align:center">${
      t.jo_lobby_hint || 'كل جولة يخمّن لاعب مختلف، والباقي يكتبون تلميحاً واحداً.'}</p>`;
  },

  startPayload() {
    // Reuse the spy word bank; it's the same kind of everyday noun. Locked
    // categories are skipped: their first entry is the password itself, so
    // folding them in both leaked it and bypassed the lock.
    const all = Object.keys(SPY_CATEGORIES || {})
      .filter(k => k.indexOf('🔒') === -1)
      .reduce((acc, k) => acc.concat(SPY_CATEGORIES[k]), []);
    return { words: all };
  },

  render(state) {
    if (appState.currentView !== 'room-justone') setView('room-justone');
    const el = document.getElementById('view-room-justone');
    if (!el) return;

    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const amGuesser = Room.me === s.guesserId;
    const head = `
      <div class="cn-score">
        <span class="cn-score__role">${t.round || 'جولة'} ${s.round}</span>
        <span class="badge badge--success">${t.score || 'النقاط'}: ${s.score || 0}</span>
      </div>`;

    if (s.phase === 'writing') {
      // The roster intersected with who is still here: a mid-round joiner isn't
      // a writer and shouldn't inflate the counter, and somebody who left
      // shouldn't be waited on - the server already stopped waiting.
      const here = state.players.map(p => p.id);
      const active = (s.roster || here).filter(id => here.indexOf(id) !== -1);
      const done = (s.submitted || []).filter(id => active.indexOf(id) !== -1).length;
      const need = Math.max(0, active.length - 1);
      const iSubmitted = (s.submitted || []).indexOf(Room.me) !== -1;

      // While you are still writing, nothing on your screen depends on how many
      // others have finished - so the frame doesn't change and the box you are
      // typing in survives. Once you have submitted, the counter is the point.
      const sig = 'writing|' + s.round + '|' + amGuesser + '|' + iSubmitted + '|' + state.youAreHost + '|' + appState.lang
                + (amGuesser || iSubmitted ? '|' + done + '/' + need : '');

      renderRoomFrame(el, sig, () => head + (amGuesser
        ? `<div class="card" style="text-align:center">
             <div class="role-card">
               <div class="role-card__label">${t.jo_you_guess || 'أنت المخمّن هذه الجولة'}</div>
               <div class="role-card__value">🤔</div>
               <div class="role-card__hint">${t.jo_wait_clues || 'انتظر حتى يكتب الجميع تلميحاتهم'}</div>
             </div>
             <div class="waiting-note">${done} / ${need}</div>
           </div>`
        : `<div class="card" style="text-align:center">
             <div class="eyebrow">${t.secret_word || 'الكلمة السرية'}</div>
             <div class="metric metric--md metric--accent" style="margin-bottom: var(--sp-4)">
               ${escapeHTML((state.you && state.you.word) || '')}
             </div>
             ${iSubmitted
               ? `<div class="waiting-note"><span class="animate-pulse">✍️</span> ${t.waiting_others} (${done}/${need})</div>`
               : `<label class="field__label">${t.jo_your_clue || 'تلميحك (كلمة واحدة)'}</label>
                  <input type="text" id="jo-clue" autocomplete="off" maxlength="24">
                  <button onclick="submitJustOneClue()" class="btn btn--primary btn--lg">${t.send || 'إرسال'}</button>
                  <p class="field__hint">${t.forbidden_rule || 'ممنوع كتابة الكلمة نفسها أو ترجمتها'}</p>`}
           </div>`)
        + (state.youAreHost ? roomHostRow([[joCloseWritingLabel(t), "roomAct('closeWriting')"]]) : '')
        + renderRoomPlayerStrip(state));
      refreshRoomPlayerStrip(el, state);
      return;
    }

    if (s.phase === 'guessing') {
      const clues = (s.clues || []).filter(c => !c.removed);
      const removed = s.removedCount || 0;
      const gsig = 'guessing|' + s.round + '|' + amGuesser + '|' + clues.length + '|' + removed + '|' + state.youAreHost + '|' + appState.lang;
      renderRoomFrame(el, gsig, () => head + `
        <div class="card">
          ${removed ? `<p class="field__hint" style="text-align:center; color: var(--danger)">
              🚫 ${t.clues_removed_msg || 'تم حذف تلميحات متشابهة'} (${removed})</p>` : ''}
          <div class="chip-set" style="justify-content:center; margin-bottom: var(--sp-4)">
            ${clues.map(c => `<span class="chip"><span class="chip__label">${escapeHTML(c.text)}</span></span>`).join('')
              || `<span class="tool-desc">${t.jo_no_clues || 'لم يتبق أي تلميح!'}</span>`}
          </div>
          ${amGuesser
            ? `<label class="field__label">${t.jo_your_guess || 'تخمينك'}</label>
               <input type="text" id="jo-guess" autocomplete="off">
               <button onclick="submitJustOneGuess()" class="btn btn--primary btn--lg">${t.send || 'إرسال'}</button>`
            : `<div class="waiting-note">${t.jo_waiting_guess || 'في انتظار تخمين'} ${escapeHTML(s.guesserName || '')}…</div>`}
        </div>`
        + (state.youAreHost && !amGuesser ? roomHostRow([[joSkipGuessLabel(t), "roomAct('skipGuess')"]]) : '')
        + renderRoomPlayerStrip(state));
      refreshRoomPlayerStrip(el, state);
      return;
    }

    if (s.phase === 'judging' || s.phase === 'result') {
      const right = s.lastResult === 'correct';
      renderRoomFrame(el, [s.phase, s.round, s.guess, s.lastResult, state.youAreHost, appState.lang].join('|'), () => head + `
        <div class="card" style="text-align:center">
          <div class="eyebrow">${t.jo_the_guess || 'التخمين'}</div>
          <div class="metric metric--md" style="margin-bottom: var(--sp-3)">${escapeHTML(s.guess || '—')}</div>
          <div class="eyebrow">${t.secret_word || 'الكلمة السرية'}</div>
          <div class="metric metric--md metric--accent">${escapeHTML(s.secretWord || '')}</div>
          ${s.phase === 'result'
            ? `<div class="badge ${right ? 'badge--success' : 'badge--danger'}" style="margin-top: var(--sp-4)">
                 ${right ? (t.correct || 'إجابة صحيحة') : (t.wrong || 'إجابة خاطئة')}</div>`
            : ''}
        </div>
        ${state.youAreHost
          ? (s.phase === 'judging'
              ? `<div class="btn-row">
                   <button onclick="roomAct('judge', { correct: true })" class="btn btn--success">${t.correct || 'صحيحة'}</button>
                   <button onclick="roomAct('judge', { correct: false })" class="btn btn--danger">${t.wrong || 'خاطئة'}</button>
                 </div>`
              : `<div class="btn-stack">
                   <button onclick="justOneNextRound(${Number(s.round) || 0})" class="btn btn--primary btn--lg">${t.next_round || 'الجولة التالية'}</button>
                   <button onclick="roomAct('backToHub')" class="btn btn--ghost">${t.room_another_game || 'لعبة أخرى'}</button>
                 </div>`)
          : `<div class="waiting-note">${t.room_wait_host}</div>`}
        ${renderRoomPlayerStrip(state)}`);
      refreshRoomPlayerStrip(el, state);
    }
  }
};

/** The host's labels for moving a stuck round on. */
const joCloseWritingLabel = (t) => t.jo_close_writing || (appState.lang === 'en' ? 'Guess with the clues so far' : 'خمّن باللي اتكتب');
const joSkipGuessLabel = (t) => t.jo_skip_guess || (appState.lang === 'en' ? 'Skip the guess' : 'تخطي التخمين');

/** Next round, stamped with the round it was pressed on so a late second tap does nothing. */
function justOneNextRound(round) {
  const payload = ROOM_GAMES.justone.startPayload();
  if (round) payload.round = round;
  roomAct('nextRound', payload);
}

async function submitJustOneClue() {
  const input = document.getElementById('jo-clue');
  const clue = (input.value || '').trim();
  if (!clue) return showToast(TRANSLATIONS[appState.lang].jo_need_clue || 'اكتب تلميحاً', 'error');
  await roomAct('submitClue', { clue: clue });
}

async function submitJustOneGuess() {
  const input = document.getElementById('jo-guess');
  await roomAct('submitGuess', { guess: (input.value || '').trim() });
}

/* ==========================================================================
   من أنا؟
   Your phone shows everyone else's identity and never your own.
   ========================================================================== */

/* The host's category, remembered: the big screen's lobby is rebuilt whenever
   someone joins, and the picker used to jump back to the first category. */
const WHOAMI_ROOM_CAT_KEY = 'ashryWhoamiRoomCat';
function whoamiRoomCat() { try { return localStorage.getItem(WHOAMI_ROOM_CAT_KEY) || ''; } catch (e) { return ''; } }
function setWhoamiRoomCat(value) { try { localStorage.setItem(WHOAMI_ROOM_CAT_KEY, String(value)); } catch (e) {} }
ROOM_GAMES.whoami = {
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = TRANSLATIONS[appState.lang];
    const cats = Object.keys(typeof WHOAMI_DB !== 'undefined' ? (WHOAMI_DB[contentLang()] || {}) : {});
    if (!cats.length) return '';
    const saved = whoamiRoomCat();
    const chosen = cats.indexOf(saved) !== -1 ? saved : cats[0];
    return `
      <div class="card card--tight">
        <label class="field__label" for="room-whoami-cat">${t.category || 'المجموعة'}</label>
        <select id="room-whoami-cat" onchange="setWhoamiRoomCat(this.value)">
          ${cats.map(c => `<option value="${escapeHTML(c)}" ${c === chosen ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
        </select>
      </div>`;
  },

  startPayload() {
    const sel = document.getElementById('room-whoami-cat');
    const db = (typeof WHOAMI_DB !== 'undefined' ? WHOAMI_DB[contentLang()] : {}) || {};
    const saved = whoamiRoomCat();
    const cat = sel ? sel.value : (db[saved] ? saved : Object.keys(db)[0]);
    return { words: (db[cat] || []).slice() };
  },

  render(state) {
    if (appState.currentView !== 'room-whoami') setView('room-whoami');
    const el = document.getElementById('view-room-whoami');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const guessed = s.guessed || [];
    const inRound = (s.roster || []).indexOf(Room.me) !== -1;
    const myPlace = guessed.indexOf(Room.me);
    const present = state.players.map(p => p.id);
    const expected = (s.roster || []).filter(id => present.indexOf(id) !== -1);
    const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';

    if (s.revealed) {
      const fresh = renderRoomFrame(el, ['wa-result', JSON.stringify(s.all || []), state.youAreHost, appState.lang].join('|'), () => `
        <div class="card">
          <div class="card__title">${t.whoami_reveal || 'الهويات'}</div>
          ${(s.all || []).map(x => `
            <div class="status-row">
              <div class="status-row__body">
                <div class="status-row__name">${x.got ? ['🥇', '🥈', '🥉'][x.got - 1] || '✅' : '❔'} ${escapeHTML(x.name)}</div>
                <div><span class="badge badge--accent">${escapeHTML(x.word)}</span></div>
              </div>
            </div>`).join('')}
        </div>
        ${renderScoreboard(s.board)}
        ${state.youAreHost
          ? `<div class="btn-stack">
               <button onclick="roomAct('restart')" class="btn btn--primary btn--lg">${t.play_again || 'لعبة جديدة'}</button>
               <button onclick="roomAct('backToHub')" class="btn btn--ghost">${t.room_another_game || 'لعبة أخرى'}</button>
             </div>`
          : `<div class="waiting-note">${t.room_wait_host}</div>`}
        ${renderRoomPlayerStrip(state)}`);
      if (fresh && typeof confetti === 'function') confetti({ particleCount: 120, spread: 70 });
      refreshRoomPlayerStrip(el, state);
      return;
    }

    const others = (state.you && state.you.others) || [];
    renderRoomFrame(el, ['wa-play', guessed.join(','), myPlace, state.youAreHost, appState.lang].join('|'), () => `
      <div class="card" style="text-align:center">
        <div class="role-card ${myPlace !== -1 ? 'role-card--done' : ''}">
          <div class="role-card__label">${t.whoami_you || 'هويتك'}</div>
          <div class="role-card__value">${myPlace !== -1 ? '✅' : '❓'}</div>
          <div class="role-card__hint">${myPlace !== -1 ? escapeHTML((t.wa_you_got || '').replace('{n}', myPlace + 1)) : (t.whoami_hint || '')}</div>
        </div>
        ${inRound && myPlace === -1
          ? `<button class="btn btn--success btn--lg" style="margin-top: var(--sp-3)" onclick="roomAct('gotIt')">${escapeHTML(t.wa_got_it || '')}</button>`
          : ''}
        ${inRound && myPlace !== -1
          ? `<button class="btn btn--ghost btn--sm" style="margin-top: var(--sp-2)" onclick="roomAct('notYet')">${escapeHTML(t.wa_not_yet || '')}</button>`
          : ''}
        <p class="field__hint" style="margin-top: var(--sp-2)">${escapeHTML((t.wa_progress || '').replace('{n}', guessed.length).replace('{m}', expected.length))}</p>
      </div>
      <div class="section">
        <div class="section__head">
          <h2 class="section__title">${t.whoami_others || 'هويات الآخرين'}</h2>
          <span class="section__rule"></span>
        </div>
        ${others.map(o => {
          const id = (state.players.find(p => p.name === o.name) || {}).id;
          const got = id ? guessed.indexOf(id) : -1;
          return `
          <div class="status-row">
            <div class="status-row__body">
              <div class="status-row__name">${got !== -1 ? '✅ ' : ''}${escapeHTML(o.name)}</div>
              <div><span class="badge badge--accent">${escapeHTML(o.word)}</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${state.youAreHost
        ? `<button onclick="roomAct('reveal')" class="btn btn--danger" >${t.reveal_words || 'كشف الكلمات'}</button>`
        : `<div class="waiting-note">${escapeHTML(t.wa_wait || '')}</div>`}
      ${renderRoomPlayerStrip(state)}`);
    refreshRoomPlayerStrip(el, state);
  }
};
</script>
