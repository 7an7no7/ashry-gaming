<script>
/* ============================================================================
   نقط ومربعات in rooms and on the TV
   ----------------------------------------------------------------------------
   The same winner-stays-on duel as كونكت ٤ (dotsAction in RoomDuels.js, the
   line and the next game drawn by the pieces in JS_RoomConnect4.html), with
   the board DotsBoxes.js judges. A box taken keeps the turn, so the ring
   stays on that player's pill and it pulses, on every phone and the TV.
   The host picks the size in the lobby (4x4, 6x6 or 8x8), remembered on
   their phone with the one-phone game's choice.
   ========================================================================= */

/** The room's board, as the pure rules want it. */
const dotsRoomBoard = (s) => ({ n: s.size, lines: s.lines || [], boxes: s.boxes || [] });

function setDotsRoomSize(size) {
  dotsState().size = dotsSize(size);
  saveToLocal();
  duelLobbyRedraw();
}

function dotsRoomDraw(e) {
  const state = Room.state;
  if (!state || state.game !== 'dots') return;
  const s = state.shared;
  if (s.phase !== 'play' || (s.seats || [])[s.turn] !== Room.me || (s.lines || [])[e]) return;
  duelRoomSend(state, { edge: e });
}

/** Did the last line take a box and keep the turn? */
const dotsRoomAgain = (s) => !!(s.phase === 'play' && s.last && s.last.boxes && s.last.boxes.length && s.last.seat === s.turn);

/** The pills in a room: the boxes this game, the room's wins under the name. */
function dotsRoomPills(state, t, initials) {
  const s = state.shared;
  const names = duelRoomNames(state);
  const wins = s.scores || {};
  const count = s.count || [0, 0];
  const pill = (i) => ({
    name: names[i],
    score: count[i] || 0,
    mark: dotsMark(i + 1, initials[i]),
    sub: `🏆 ${Number(wins[s.seats[i]]) || 0}${s.seats[i] === Room.me && !state.youAreScreen ? ' · ' + escapeHTML(t.xo_you || '') : ''}`
  });
  return duelPillsHtml({ players: [pill(0), pill(1)], turn: s.phase === 'play' ? s.turn : -1, draws: null });
}

ROOM_GAMES.dots = {
  lateJoin: true,
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang] || {};
    return duelLobbyHtml(state, t, t.dots_size_label || '', [[4, '4×4'], [6, '6×6'], [8, '8×8']], dotsState().size, 'setDotsRoomSize', t.dots_size_hint);
  },
  startPayload() { return { size: dotsState().size }; },

  render(state) {
    if (appState.currentView !== 'room-dots') setView('room-dots');
    const el = document.getElementById('view-room-dots');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang] || {};
    const s = state.shared;
    if (!s || !s.lines) return;
    const seat = (s.seats || []).indexOf(Room.me);
    const myTurn = s.phase === 'play' && seat === s.turn;
    const again = dotsRoomAgain(s);
    const board = dotsRoomBoard(s);
    const initials = dotsInitials(duelRoomNames(state));
    const sig = ['dotsr', s.round, s.phase, s.moves, s.turn, seat, JSON.stringify(s.line || []), s.champ,
                 JSON.stringify(s.scores || {}), (state.players || []).map(p => p.id + p.name).join(','),
                 state.youAreHost, appState.lang].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => `
      <div class="duel dots-game">
        <div class="duel-layout">
          <div class="duel-layout__board" style="--duel-aspect:1">
            ${dotsBoardHtml(board, { last: s.last, playable: myTurn, next: s.turn + 1, initials: initials })}
          </div>
          <div class="duel-layout__side">
            <div class="duel-head">
              ${dotsRoomPills(state, t, initials)}
              <p class="duel-status ${s.phase === 'over' ? 'is-done' : ''} ${again ? 'is-again' : ''}">${escapeHTML(duelRoomStatus(state, t, again))}</p>
            </div>
            ${s.phase === 'over' ? duelRoomOverHtml(state, t) : duelRoomWatchNote(state, t)}
            ${duelRoomLineHtml(state, t)}
            ${(state.players || []).length > 2 ? renderScoreboard(s.board) : ''}
            ${s.phase === 'over' ? roomShareBtnHtml(state, s.board) : ''}
            ${renderRoomPlayerStrip(state)}
          </div>
        </div>
      </div>`);
    if (rebuilt) {
      const key = ['dots', state.code, s.round].join('|');
      dotsAfterPaint(el, board, {
        onDraw: dotsRoomDraw,
        lineKey: s.last ? key + '|' + s.moves : '',
        ending: s.phase === 'over',
        sound: duelRoomLoud(state)
      });
      duelPillsAfter(el, 'dotsr|' + state.code, {
        turn: s.phase === 'play' ? s.turn : -1,
        scores: (s.count || [0, 0]).slice(),
        againKey: again ? key + '|' + s.moves : ''
      });
      if (myTurn && duelOnce(['dotsturn', state.code, s.round, s.moves].join('|'))) haptic('medium');
      duelRoomCheer(el, state, key);
    }
    refreshRoomPlayerStrip(el, state);
  },
  actionKey: (state) => [state.code, (state.shared || {}).round, (state.shared || {}).phase].join('|')
};

TV_GAMES.dots = {
  sig: (state) => {
    const s = state.shared || {};
    return ['dots', s.round, s.phase, s.moves, JSON.stringify(s.line || []), s.champ, JSON.stringify(s.scores || {}),
            (state.players || []).map(p => p.id + p.name).join(','), state.youAreHost].join('|');
  },
  frame(state, t) {
    const s = state.shared || {};
    if (!s.lines) return tvLookAtPhones(t);
    const initials = dotsInitials(duelRoomNames(state));
    return `
      <div class="duel-tv dots-game">
        <div class="duel-tv__board" style="--duel-aspect:1">
          ${dotsBoardHtml(dotsRoomBoard(s), { last: s.last, playable: false, next: s.turn + 1, initials: initials })}
        </div>
        ${duelTvSide(state, t, dotsRoomPills(state, t, initials), dotsRoomAgain(s))}
      </div>`;
  },
  after(state, rebuilt) {
    if (!rebuilt) return;
    const el = document.getElementById('view-room-tv');
    const s = state.shared || {};
    if (!el || !s.lines) return;
    const key = ['dots', state.code, s.round].join('|');
    const again = dotsRoomAgain(s);
    dotsAfterPaint(el, dotsRoomBoard(s), {
      lineKey: s.last ? key + '|' + s.moves : '',
      ending: s.phase === 'over',
      sound: true
    });
    duelPillsAfter(el, 'dotstv|' + state.code, {
      turn: s.phase === 'play' ? s.turn : -1,
      scores: (s.count || [0, 0]).slice(),
      againKey: again ? key + '|' + s.moves : ''
    });
    duelRoomCheer(el, state, key);
  }
};
</script>
