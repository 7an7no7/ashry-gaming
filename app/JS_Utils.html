// A game's card, its hero, the header and its help entry show one icon, colour
// and name - the catalog's. Copied here rather than kept twice by hand: the two
// lists had drifted (🀏 against 🀄, 🔗 against 🧩, 🤝 against 👥).
HELP_ENTRIES.forEach(e => {
  const g = typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[e.key] : null;
  if (g) {
    e.icon = g.icon; e.accent = g.accent; e.title = g.title;
    // Games or tools follows the catalog too: the score keepers moved to the tools.
    e.group = g.group === 'tools' ? 'tools' : 'games';
  }
});
const helpEntry = (key) => HELP_ENTRIES.find(e => e.key === key) || null;

// A room game whose help lives under another key: the room's شطرنج is 'chess', and
// 'chess' in the help is the chess clock tool, so the game's own rules are 'shatranj'.
const ROOM_HELP_KEY = { chess: 'shatranj' };

/**
 * What this player most likely wants explained.
 *
 * Sitting in a room lobby with a game already chosen, the question is about
 * that game — the lobby itself is self-explanatory once you are looking at it.
 */
function helpContextKey() {
  const view = appState.currentView;
  if ((view === 'room-lobby' || view === 'room-tv') && typeof Room !== 'undefined' && Room.isIn
      && Room.state && Room.state.game && helpEntry(ROOM_HELP_KEY[Room.state.game] || Room.state.game)) {
    return ROOM_HELP_KEY[Room.state.game] || Room.state.game;
  }
  return HELP_FOR_VIEW[view] || null;
}

/* --- Search --------------------------------------------------------------
   Arabic writes the same word several ways — أ إ آ for ا, ة for ه, ى for ي —
   and diacritics are optional. Matching raw strings means a search for
   "اسماء" misses "أسماء".
   ------------------------------------------------------------------------- */
function helpNormalise(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/[ً-ْٰ]/g, '')      // harakat
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/[ىي]/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ء')
    .replace(/\s+/g, ' ')
    .trim();
}

let helpSearchTerm = '';

function openHelpModal() {
  helpSearchTerm = '';
  const box = document.getElementById('help-search');
  if (box) box.value = '';
  const clear = document.getElementById('help-search-clear');
  if (clear) clear.classList.add('hidden');

  renderHelpContent();
  // Reading the rules mid-round on one phone doesn't cost the turn.
  if (exitGameOf(appState.currentView)) pauseClocksForSheet();
  document.getElementById('help-modal').classList.remove('hidden');
  // Light up the nav item while the sheet is open, the way Home does — it is
  // the only nav button that never showed you it had done anything.
  document.getElementById('nav-help')?.classList.add('is-active');
  playSound('click');
  haptic('light');

  // Always open at the top: the context card is the answer, and the sheet
  // would otherwise still be scrolled to wherever it was left.
  const body = document.getElementById('help-content-area');
  if (body) body.scrollTop = 0;
  helpScrollToWay();
}

/* From a room (the owner's pick 1243, 7 Oct 2026): the game's card opens at the part for this
   way of playing - its «📱» sub-head on a phone, its «📺» one on the TV - with a short glow of
   the screen's colour, the steps above it a scroll away. The sheet's own scrollTop, never
   scrollIntoView (it would scroll the page under it too). */
function helpScrollToWay() {
  const view = appState.currentView || '';
  // Not from the lobby: there the game hasn't started and its steps are the question.
  if (!/^room-/.test(view) || view === 'room-join' || view === 'room-lobby') return;
  const mark = view === 'room-tv' ? '📺' : '📱';
  const sub = [...document.querySelectorAll('#help-context .help-hero__body .help-sub')]
    .find(el => (el.textContent || '').trim().indexOf(mark) === 0);
  const area = document.getElementById('help-content-area');
  if (!sub || !area) return;
  // A part folded under its own heading (سكرو's «help-more») is opened first.
  const fold = sub.closest('details');
  if (fold && !fold.open) fold.open = true;
  requestAnimationFrame(() => {
    const r = sub.getBoundingClientRect(), a = area.getBoundingClientRect();
    area.scrollTop = Math.max(0, area.scrollTop + r.top - a.top - 16);
    if (typeof motionOff === 'function' && motionOff()) return;
    sub.classList.remove('help-sub--glow');
    void sub.offsetWidth;
    sub.classList.add('help-sub--glow');
    setTimeout(() => sub.classList.remove('help-sub--glow'), 1700);
  });
}

/** Jump from the context card to a related entry and open it. */
function helpJumpTo(key) {
  const card = document.getElementById('help-card-' + key);
  if (!card) return;
  card.open = true;
  card.scrollIntoView({
    behavior: (typeof prefersReducedMotion === 'function' && prefersReducedMotion()) ? 'auto' : 'smooth',
    block: 'center'
  });
  playSound('click');
}

/* Typing in Help's search waits for a pause (~120 ms) before the list is filtered: every
   letter used to fold every entry's rules and rebuild the list (the owner, 8 Oct 2026). */
let helpSearchTimer = 0;
function filterHelpSoon(value) {
  const clear = document.getElementById('help-search-clear');
  if (clear) clear.classList.toggle('hidden', !value);
  clearTimeout(helpSearchTimer);
  helpSearchTimer = setTimeout(() => filterHelp(value), 120);
}

function filterHelp(value) {
  clearTimeout(helpSearchTimer);
  helpSearchTerm = helpNormalise(value);
  const clear = document.getElementById('help-search-clear');
  if (clear) clear.classList.toggle('hidden', !value);
  renderHelpContent();
  // A new set of results rises in (JS_Motion.html section 13); the same set stays still.
  const box = document.getElementById('help-sections');
  if (box && typeof motionRiseIn === 'function') {
    const sig = [...box.querySelectorAll('.help-game-card:not(.hidden)')].map(c => c.id).join(',');
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      motionRiseIn(box, { step: 28, dur: 260, dist: 8, max: 6 });
    }
  }
}

function clearHelpSearch() {
  const box = document.getElementById('help-search');
  if (box) { box.value = ''; box.focus(); }
  filterHelp('');
}

/**
 * The sections of the list: the rooms and the basics first, then a section
 * per kind of game in the order the home uses (CATALOG_GROUPS), then the
 * tools. HELP_ENTRIES stays the registry of what each entry looks like;
 * the catalog says where it sits.
 */
function helpSections() {
  const start = ['rooms', 'tv', 'program', 'mission', 'crew', 'players', 'settings'].map(helpEntry).filter(Boolean);
  const groups = (typeof CATALOG_GROUPS !== 'undefined' ? CATALOG_GROUPS : []).map(grp => ({
    id: grp.id, icon: grp.icon, title: grp.title,
    entries: (typeof GAME_CATALOG !== 'undefined' ? GAME_CATALOG : []).filter(g => g.group === grp.id).map(g => helpEntry(g.id)).filter(Boolean)
  }));
  const placed = {};
  start.concat(...groups.map(g => g.entries)).forEach(e => { placed[e.key] = true; });
  const rest = HELP_ENTRIES.filter(e => !placed[e.key]);
  return [{ id: 'start', icon: '🚀', title: 'help_sec_start', entries: start }]
    .concat(groups)
    .concat(rest.length ? [{ id: 'more', icon: '📎', title: 'help_sec_more', entries: rest }] : []);
}

/** "👥 3–12 · ⏱ 10 min · 📱📲" for an entry that is a game in the catalog. */
function helpMetaHtml(key, t) {
  const g = (typeof CATALOG_BY_ID !== 'undefined') ? CATALOG_BY_ID[key] : null;
  if (!g || typeof catalogMeta !== 'function') return '';
  return `<span class="help-meta">${catalogMeta(g, t, false)}</span>`;
}

/** The one-line pitch from the catalog, above the rules. */
function helpLeadHtml(key, t) {
  const g = (typeof CATALOG_BY_ID !== 'undefined') ? CATALOG_BY_ID[key] : null;
  const desc = g ? (t[g.desc] || '') : '';
  return desc ? `<p class="help-lead">${escapeHTML(desc)}</p>` : '';
}

/* The list is built once per language (helpListEnsure) and a search only hides and
   shows its cards (the owner, 8 Oct 2026: every open built every entry's rules, and
   every letter typed folded all their text and built the list again). Each entry's
   text is folded once (helpFoldCache). */
let helpListKey = '';
const helpFoldCache = {};
function helpListEnsure() {
  const box = document.getElementById('help-sections');
  if (!box) return null;
  const lang = appState.lang;
  const t = TRANSLATIONS[lang];
  const rules = GAME_RULES[lang] || {};
  const key = lang + ':' + Object.keys(rules).length;
  if (helpListKey === key && box.firstElementChild) return box;
  const titleOf = (e) => t[e.title] || e.key;
  /** One accordion row. The accent comes from data-accent on the card. */
  const createItem = (e) => `
      <details class="help-game-card" id="help-card-${e.key}" data-key="${e.key}" data-accent="${e.accent}">
        <summary>
          <span class="help-game-card__icon" aria-hidden="true">${iconHtml(e.icon)}</span>
          <span class="help-game-card__text">
            <span class="help-game-card__name">${escapeHTML(titleOf(e))}</span>
            ${helpMetaHtml(e.key, t)}
          </span>
          <span class="help-game-card__chev" aria-hidden="true">▾</span>
        </summary>
        <div class="help-game-text" style="padding: 0 var(--sp-3) var(--sp-3)">
          ${helpLeadHtml(e.key, t)}
          ${rules[e.key]}
        </div>
      </details>`;
  // An entry with no rules written yet is left out entirely rather than
  // rendered as an accordion that opens onto nothing.
  box.innerHTML = helpSections().map(sec => {
    const entries = sec.entries.filter(e => rules[e.key]);
    if (!entries.length) return '';
    return `
      <section class="section help-section">
        <div class="section__head">
          <span class="section__emoji" aria-hidden="true">${sec.icon}</span>
          <h2 class="section__title">${escapeHTML(t[sec.title] || sec.id)}</h2>
          <span class="section__rule"></span>
          <span class="section__count metric">${entries.length}</span>
        </div>
        ${entries.map(createItem).join('')}
      </section>`;
  }).join('');
  helpListKey = key;
  return box;
}
/** What an entry answers to in the search: its name, its line and its rules, folded. */
function helpFoldOf(entryKey) {
  const lang = appState.lang;
  const k = lang + ':' + entryKey;
  if (helpFoldCache[k] !== undefined) return helpFoldCache[k];
  const t = TRANSLATIONS[lang];
  const e = helpEntry(entryKey);
  const body = String((GAME_RULES[lang] || {})[entryKey] || '').replace(/<[^>]+>/g, ' ');
  const g = (typeof CATALOG_BY_ID !== 'undefined') ? CATALOG_BY_ID[entryKey] : null;
  const desc = g ? (t[g.desc] || '') : '';
  return (helpFoldCache[k] = helpNormalise(((e && t[e.title]) || entryKey) + ' ' + desc + ' ' + body));
}
/** A search's marks taken out again: the text as it was written. */
function helpUnmarkAll(box) {
  const parents = new Set();
  box.querySelectorAll('mark.help-mark').forEach(m => {
    const p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    parents.add(p);
  });
  parents.forEach(p => p.normalize());
}

function renderHelpContent() {
  const lang = appState.lang;
  const t = TRANSLATIONS[lang];
  const rules = GAME_RULES[lang] || {};
  const searching = !!helpSearchTerm;

  const box = helpListEnsure();
  let shown = 0;
  if (box) {
    helpUnmarkAll(box);
    // Every card closed, as a fresh list was (a single hit is opened again below).
    box.querySelectorAll('details.help-game-card[open]').forEach(d => { d.open = false; });
    const set = (el, off) => { if (el.classList.contains('hidden') !== off) el.classList.toggle('hidden', off); };
    box.querySelectorAll('.help-section').forEach(sec => {
      let n = 0;
      sec.querySelectorAll('.help-game-card').forEach(card => {
        // Searching looks inside the rules too, not just the names — people search
        // for the thing they are stuck on ("assassin", "قاتلة"), not the title.
        const ok = !searching || helpFoldOf(card.dataset.key).indexOf(helpSearchTerm) !== -1;
        set(card, !ok);
        if (ok) n++;
      });
      set(sec, !n);
      const count = sec.querySelector('.section__count');
      if (count && n && count.textContent !== String(n)) count.textContent = String(n);
      shown += n;
    });
  }
  const empty = document.getElementById('help-empty');
  if (empty) empty.classList.toggle('hidden', !(searching && shown === 0));

  // The words searched for, marked inside the rules (the owner's pick 1244).
  if (searching && box) box.querySelectorAll('.help-game-card:not(.hidden) .help-game-text').forEach(el => helpMarkHits(el, helpSearchTerm));

  // A single hit gets opened for you rather than asking for one more tap
  // (and its first mark is scrolled to: helpScrollToMark, on its toggle).
  if (searching && shown === 1) {
    const only = document.querySelector('#help-content-area .help-game-card:not(.hidden)');
    if (only) only.open = true;
  }

  renderHelpContext(helpContextKey(), rules, t, searching);
}

/**
 * Wraps every place `term` (already through helpNormalise) is found in `root`'s text in
 * <mark class="help-mark"> (the owner's pick 1244, 7 Oct 2026): «قاتلة» lands on the line
 * about the assassin. Matched the way the search matches - the same folds, letter by letter,
 * so أسماء is found by اسماء - and mapped back onto the text as written. A hit split across
 * two pieces of markup (a <b> in the middle of it) is left unmarked.
 */
function helpMarkHits(root, term) {
  if (!root || !term) return;
  const fold = (c) => {
    if (/[ً-ْٰ]/.test(c)) return '';
    if (/[أإآٱ]/.test(c)) return 'ا';
    if (c === 'ة') return 'ه';
    if (c === 'ى') return 'ي';
    if (c === 'ؤ') return 'و';
    if (c === 'ئ') return 'ء';
    if (/\s/.test(c)) return ' ';
    const low = c.toLowerCase();
    return low.length === 1 ? low : c;
  };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const text = node.nodeValue || '';
    // The folded text, and for each of its letters the index of the letter it came from.
    let norm = '';
    const at = [];
    for (let i = 0; i < text.length; i++) {
      const f = fold(text[i]);
      if (!f || (f === ' ' && norm.endsWith(' '))) continue;
      norm += f;
      at.push(i);
    }
    const spans = [];
    for (let k = norm.indexOf(term); k !== -1; k = norm.indexOf(term, k + term.length)) {
      spans.push([at[k], at[k + term.length - 1] + 1]);
    }
    if (!spans.length) return;
    const frag = document.createDocumentFragment();
    let from = 0;
    spans.forEach(([a, b]) => {
      if (a > from) frag.appendChild(document.createTextNode(text.slice(from, a)));
      const m = document.createElement('mark');
      m.className = 'help-mark';
      m.textContent = text.slice(a, b);
      frag.appendChild(m);
      from = b;
    });
    if (from < text.length) frag.appendChild(document.createTextNode(text.slice(from)));
    node.parentNode.replaceChild(frag, node);
  });
}

/** A card opened while searching: its first mark comes into the middle of the sheet. The
    sheet's own scrollTop, not scrollIntoView, which would scroll the page under it too. */
function helpScrollToMark(card) {
  const mark = card && card.querySelector('mark.help-mark');
  const area = document.getElementById('help-content-area');
  if (!mark || !area) return;
  requestAnimationFrame(() => {
    const r = mark.getBoundingClientRect(), a = area.getBoundingClientRect();
    const top = Math.max(0, area.scrollTop + r.top - a.top - a.height / 3);
    const still = typeof motionOff === 'function' ? motionOff() : false;
    area.scrollTo({ top: top, behavior: still ? 'auto' : 'smooth' });
  });
}
// `toggle` doesn't bubble: listened for on the way down.
document.addEventListener('toggle', (e) => {
  const card = e.target;
  if (helpSearchTerm && card && card.classList && card.classList.contains('help-game-card') && card.open) helpScrollToMark(card);
}, true);

const HELP_WELCOME_KEY = 'ashryHelpWelcome_v1';

/** The card for the screen help was opened from. */
function renderHelpContext(key, rules, t, searching) {
  const slot = document.getElementById('help-context');
  if (!slot) return;

  // While searching, the results are the answer — a card about the screen
  // behind the sheet is just something in the way of them.
  if (searching) { slot.innerHTML = ''; return; }

  const entry = key ? helpEntry(key) : null;

  if (!entry || !rules[entry.key]) {
    // No particular screen — the menu, or a search in progress. On the menu,
    // say what the app is for rather than leaving a gap where the answer goes.
    if (appState.currentView !== 'menu' && appState.currentView !== 'tools') { slot.innerHTML = ''; return; }
    // Read once, the welcome folds to one line that opens it again (the owner's pick 5 of
    // the app polish, 7 Oct 2026). "Read" is a minute after it was first shown, so a
    // redraw while someone is reading it (a search cleared) never folds it under them;
    // «حذف جميع البيانات» shows it whole again.
    let seenAt = 0;
    try { seenAt = Number(localStorage.getItem(HELP_WELCOME_KEY)) || 0; } catch (e) {}
    if (!seenAt) { try { localStorage.setItem(HELP_WELCOME_KEY, String(Date.now())); } catch (e) {} }
    const folded = seenAt && Date.now() - seenAt > 60 * 1000;
    const head = (title) => `
        <div class="help-hero__head">
          <span class="help-hero__icon" aria-hidden="true">👋</span>
          <div class="help-hero__meta">
            <div class="help-hero__title">${escapeHTML(title)}</div>
          </div>
          ${folded ? '<span class="help-hero__chev" aria-hidden="true">▾</span>' : ''}
        </div>`;
    slot.innerHTML = folded ? `
      <details class="help-hero help-hero--fold" data-accent="violet">
        <summary>${head(t.help_welcome_fold || t.help_welcome || '')}</summary>
        <div class="help-hero__body">${t.help_intro || ''}</div>
      </details>` : `
      <div class="help-hero" data-accent="violet">${head(t.help_welcome || '')}
        <div class="help-hero__body">${t.help_intro || ''}</div>
      </div>`;
    return;
  }

  const title = t[entry.title] || entry.key;
  // A game that also plays over the room layer gets a way through to how that
  // works, because it is the next thing people ask.
  const jump = (entry.room || entry.roomOnly)
    ? `<button class="help-jump" onclick="helpJumpTo('rooms')">
         <span aria-hidden="true">📱</span>
         <span>${escapeHTML(entry.roomOnly ? (t.help_room_only || '') : (t.help_room_too || ''))}</span>
       </button>`
    : '';

  slot.innerHTML = `
    <div class="help-hero" data-accent="${entry.accent}">
      <div class="help-hero__head">
        <span class="help-hero__icon" aria-hidden="true">${iconHtml(entry.icon)}</span>
        <div class="help-hero__meta">
          <div class="help-hero__eyebrow">${escapeHTML(t.help_here || '')}</div>
          <div class="help-hero__title">${escapeHTML(title)}</div>
          ${helpMetaHtml(entry.key, t)}
        </div>
      </div>
      <div class="help-hero__body">${helpLeadHtml(entry.key, t)}${rules[entry.key]}</div>
      ${jump}
    </div>`;
}


/* --- KEEP SCREEN AWAKE (WAKE LOCK) --- */
let wakeLock = null;

let wakeLockWatching = false;

/* The screen stays on while a game is being played - a passed phone going
   dark mid-round is worse than a battery - and sleeps as usual on the home,
   the tabs and the setup screens. setView calls syncWakeLock on every change. */
/* The tools too (the owner's pick 1231, 7 Oct 2026): the dice on the table, and the
   timer while it runs - a phone that sleeps lets iOS freeze the page, and the
   alarm never rings. The timer asks again when it starts and stops (toggleGenTimer). */
const wantsWakeLock = (view) => (/^(play-|room-|reveal-|imposter-reveal$|input-|results-)/.test(view || '') && view !== 'room-join')
  || view === 'tool-dice'
  || (view === 'timers' && !!(appState.timers && appState.timers.general && appState.timers.general.running));

// A request still on its way: a second call in that moment would ask again,
// and the first lock would be overwritten and never released.
let wakeLockPending = false;
async function requestWakeLock() {
    if (!('wakeLock' in navigator) || !wantsWakeLock(appState.currentView)) return;
    if (wakeLockPending || (wakeLock && !wakeLock.released)) return;
    wakeLockPending = true;
    try {
        const lock = await navigator.wakeLock.request('screen');
        // Granted after the game was left (the menu): let it go at once, or
        // the screen never sleeps on the home.
        if (!wantsWakeLock(appState.currentView)) { lock.release().catch(() => {}); return; }
        wakeLock = lock;
    } catch (err) {
        return;   // denied, or the tab isn't visible yet - not worth surfacing
    } finally {
        wakeLockPending = false;
    }

    // Registered once. It used to be added inside requestWakeLock, so every
    // game start stacked another listener on the same event.
    if (wakeLockWatching) return;
    wakeLockWatching = true;
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestWakeLock();
    });
}

function syncWakeLock(view) {
    if (wantsWakeLock(view)) { requestWakeLock(); return; }
    if (wakeLock && !wakeLock.released) {
        const lock = wakeLock;
        wakeLock = null;
        lock.release().catch(() => {});
    }
}

/* =========================================
   SMART GROUP MANAGER LOGIC (FIXES ALL BUGS)
   ========================================= */

// 1. Opens the Modal and prepares the data
function saveCurrentGroup() {
    // Opens with nobody picked too: a saved group can be deleted, or chosen to update, from
    // a clean setup. Saving and replacing still ask for players (they check it themselves).
    if (!appState.activePlayers) appState.activePlayers = [];

    // Populate the update dropdown
    const updateSelect = document.getElementById('update-group-select');
    let groups = readSavedGroups();
    
    updateSelect.innerHTML = `<option value="">${groupPickerLabel()}</option>`;
    Object.keys(groups).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        updateSelect.appendChild(opt);
    });

    document.getElementById('custom-group-name-input').value = "";
    document.getElementById('group-name-modal').classList.remove('hidden');
}

/** The one placeholder both group dropdowns share; it was Arabic-only. */
function groupPickerLabel() {
    return appState.lang === 'ar' ? '-- اختار مجموعة تحدّثها --' : '-- Select a group to update --';
}

// 2. Action: Create a Brand New Group
function saveAsNewGroup() {
    const inputEl = document.getElementById('custom-group-name-input');
    const groupName = inputEl.value.trim();
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اكتب اسماً للمجموعة!" : "Enter a group name!", "error");
        return;
    }

    if (appState.activePlayers.length < 2) {
        showToast(appState.lang === 'ar' ? "المجموعة الجديدة تحتاج لاعبين (2) على الأقل!" : "New groups need at least 2 players!", "error");
        return;
    }

    saveDataToGroup(groupName, [...appState.activePlayers]);
}

// 3. Action: Update an Existing Group (Add or Replace)
function updateExistingGroup(mode) {
    const selectEl = document.getElementById('update-group-select');
    const groupName = selectEl.value;

    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة من القائمة لتحديثها!" : "Select a group to update!", "error");
        return;
    }

    let groups = readSavedGroups();
    let currentGroupPlayers = groups[groupName] || [];

    if (mode === 'add') {
        if (!appState.activePlayers.length) {
            showToast(appState.lang === 'ar' ? "أضف لاعباً واحداً على الأقل!" : "Add at least 1 player!", "error");
            return;
        }
        // Merge without duplicates
        const newSet = new Set([...currentGroupPlayers, ...appState.activePlayers]);
        saveDataToGroup(groupName, Array.from(newSet));
        showToast(appState.lang === 'ar' ? `تم تحديث ${groupName}` : `Updated ${groupName}`, "success");
    
    } else if (mode === 'replace') {
        if (appState.activePlayers.length < 2) {
            showToast(appState.lang === 'ar' ? "يجب اختيار لاعبين (2) على الأقل للاستبدال!" : "Select at least 2 players to replace!", "error");
            return;
        }
        saveDataToGroup(groupName, [...appState.activePlayers]);
        showToast(appState.lang === 'ar' ? `تم استبدال مجموعة ${groupName}` : `Replaced ${groupName}`, "success");
    }
}

// Helper: Saves data and cleans up UI
function saveDataToGroup(groupName, playersArray) {
    let groups = readSavedGroups();
    groups[groupName] = playersArray;
    writeSavedGroups(groups);
    
    closeModal('group-name-modal');
    renderSavedGroups(); 
    loadGroup(groupName); // Auto-load it to show the result
    playSound('success');
}

// 4. Loading Logic
function loadGroup(groupName) {
    const activeSetup = document.querySelector('[id^="view-setup-"]:not(.hidden)');
    if (!activeSetup) return;

    const listContainer = activeSetup.querySelector('[id$="-player-list"]');
    if (!listContainer) return;

    appState.currentGroup = groupName || "";

    if (!groupName || groupName === "") {
        appState.activePlayers = [];
        saveToLocal();
        renderActiveChips(listContainer.id);
        renderSavedGroups(); // Sync other dropdowns
        return; 
    }

    let groups = readSavedGroups();
    const selectedNames = groups[groupName];

    if (selectedNames && selectedNames.length > 0) {
        appState.activePlayers = [...selectedNames];
        saveToLocal();
        renderActiveChips(listContainer.id);
        renderSavedGroups(); // Sync other dropdowns
        playSound('click');
    }
}

// 5. Delete Logic (From Modal)
function deleteGroupFromModal() {
    const select = document.getElementById('update-group-select');
    const groupName = select.value;
    
    if (!groupName) {
        showToast(appState.lang === 'ar' ? "اختر مجموعة أولاً!" : "Select a group!", "error");
        return;
    }
    
    const msg = appState.lang === 'ar' ? `هل أنت متأكد من حذف "${groupName}" نهائياً؟` : `Delete "${groupName}"?`;
    
    if (typeof showConfirmModal === 'function') {
        showConfirmModal(msg, () => {
            let groups = readSavedGroups();
            delete groups[groupName];
            writeSavedGroups(groups);
            
            if (appState.currentGroup === groupName) {
                appState.currentGroup = "";
            }
            
            renderSavedGroups(); 
            // Re-populate modal select
            const updateSelect = document.getElementById('update-group-select');
            updateSelect.innerHTML = `<option value="">${groupPickerLabel()}</option>`;
            Object.keys(groups).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                updateSelect.appendChild(opt);
            });
            
            showToast(appState.lang === 'ar' ? "تم الحذف" : "Deleted", "success");
        }, { yes: 'cf_delete', tone: 'danger', icon: '🗑️' });
    }
}

/* Saved groups live in this phone's storage. A browser that blocks storage (all
   cookies off, a kiosk, a TV) throws on the read, which stopped every chip tap
   halfway: the list changed but the chips never redrew. */
function readSavedGroups() {
  try {
    const g = JSON.parse(localStorage.getItem('ashry_saved_groups') || '{}');
    return g && typeof g === 'object' && !Array.isArray(g) ? g : {};
  } catch (e) { return {}; }
}
function writeSavedGroups(groups) {
  try { localStorage.setItem('ashry_saved_groups', JSON.stringify(groups)); } catch (e) {}
}

function renderSavedGroups() {
    const selects = document.querySelectorAll('.saved-groups-select');
    if (selects.length === 0) return;

    let groups = readSavedGroups();
    const defaultText = appState.lang === 'ar' ? '-- اختار مجموعة محفوظة --' : '-- Select Saved Group --';
    
    selects.forEach(select => {
        select.innerHTML = `<option value="">${defaultText}</option>`;
        Object.keys(groups).forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.innerText = `${name} (${groups[name].length} ${appState.lang === 'ar' ? 'لاعب' : 'players'})`;
            select.appendChild(option);
        });
        
        // Restore selection
        select.value = appState.currentGroup || "";
    });
}


// The iOS datalist-positioning workaround that used to live here went with the
// datalist itself: saved names are chips you tap now, so nothing autocompletes.
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(renderSavedGroups, 1000);
});


/* ============================================================================
   LEAVING A GAME — the header's back button, on a game screen
   ----------------------------------------------------------------------------
   A table that is bored of a game had to finish the round to pick another one:
   the room's "another game" button only appears once a round is over, and on
   one phone the back arrow silently dropped the round. Both now open this
   sheet, which offers the way out that is actually wanted - another game -
   next to the quieter ones.
   ========================================================================= */

/** The catalog game a screen would abandon if you left it; null for the tools. */
function exitGameOf(viewId) {
  const up = ((typeof VIEW_META !== 'undefined' && VIEW_META[viewId]) || {}).up || '';
  if (up.indexOf('setup-') !== 0 || typeof GAME_CATALOG === 'undefined') return null;
  // A screen that only looks at a finished game (the chess review) leaves nothing behind.
  if (((typeof VIEW_META !== 'undefined' && VIEW_META[viewId]) || {}).noExit) return null;
  const g = GAME_CATALOG.find(x => x.setup === up);
  return (g && g.group !== 'tools') ? g : null;
}

/** Whether the back button on this screen asks before leaving (openExitSheet with no tab). */
function exitSheetAsks(view) {
  if (!document.getElementById('exit-modal-body')) return false;
  if ((view || '').indexOf('room-') === 0 && view !== 'room-join') {
    return typeof Room !== 'undefined' && !!Room.isIn && !!Room.state;
  }
  return !!exitGameOf(view || '');
}

/**
 * «خروج» on a one-phone game's own screen (the owner, 4 Oct 2026: every game has one, and
 * mid-game it asks like the header's back arrow - the same sheet, so a stray tap can't drop
 * a round). A button drawn once the game is over calls its game's way out directly instead;
 * so does this one on a screen that has nothing to lose (a tool, a score keeper).
 */
function playExit(leave) {
  if (exitSheetAsks(appState.currentView) && openExitSheet()) return;
  leave();
}

/**
 * The games whose own screen had no «خروج» (4 Oct 2026, 11 of them) get this shared row at
 * the foot of the screen, outside the stage their game redraws. Each says when its game is
 * over, so the button leaves at once then and asks first mid-game, like playExit.
 */
const PLAY_EXIT_OVER = {
  'play-wordle': () => (appState.wordle || {}).phase === 'done',
  'play-guessnum': () => (appState.guessnum || {}).status === 'won',
  'play-connections': () => (typeof connState === 'function' ? connState() : {}).phase === 'done',
  'play-whoami': () => { const r = document.getElementById('whoami-result-ui'); return !!r && !r.classList.contains('hidden'); },
  'play-trivia': () => !!(appState.triviaBoard || {}).finished,
  'play-hangman': () => (appState.hangman || {}).step === 'done',
  'play-ludo': () => !((appState.ludo || {}).g && appState.ludo.g.phase === 'play'),
  'play-snakes': () => !((appState.snakes || {}).g && appState.snakes.g.phase === 'play'),
  'play-bank': () => !((appState.bank || {}).g && appState.bank.g.phase === 'play'),
  'play-bowling': () => (appState.bowling || {}).phase === 'over',
  'play-minigolf': () => (appState.minigolf || {}).phase === 'done'
};

function playExitRows() {
  Object.keys(PLAY_EXIT_OVER).forEach(view => {
    const el = document.getElementById('view-' + view);
    if (!el || el.querySelector(':scope > .play-exit-row')) return;
    const t = TRANSLATIONS[appState.lang] || {};
    el.insertAdjacentHTML('beforeend', `<div class="play-exit-row"><button type="button" class="btn btn--ghost btn--sm btn--auto play-exit" data-i18n="exit" onclick="playExitShared()">${escapeHTML(t.exit || '')}</button></div>`);
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', playExitRows); else playExitRows();

function playExitShared() {
  const view = appState.currentView || '';
  const leave = () => setView(((typeof VIEW_META !== 'undefined' && VIEW_META[view]) || {}).up || 'menu');
  const over = PLAY_EXIT_OVER[view];
  if (over && over()) leave(); else playExit(leave);
}

const exitSheetRow = (label, onclick, kind) =>
  `<button class="btn ${kind || 'btn--neutral'}" onclick="${onclick}">${escapeHTML(label)}</button>`;

/**
 * Opens the sheet when leaving would end something. Returns false when there is
 * nothing to ask about, and the back button then behaves as it always did.
 */
function openExitSheet(navTarget) {
  const view = (appState.currentView || '');
  const t = TRANSLATIONS[appState.lang] || {};
  const body = document.getElementById('exit-modal-body');
  if (!body) return false;

  const inRoom = view.indexOf('room-') === 0 && view !== 'room-join'
              && typeof Room !== 'undefined' && Room.isIn && Room.state;
  // A bottom tab from a room screen doesn't abandon anything: the room stays
  // open behind the banner. Only a round on one phone needs asking about.
  if (navTarget && inRoom) return false;
  const game = inRoom ? null : exitGameOf(view);
  if (!inRoom && !game) return false;

  if (inRoom) {
    const state = Room.state;
    const playing = state.phase !== 'lobby' && !!state.game;
    const entry = state.game && typeof ROOM_HUB_GAMES !== 'undefined' ? ROOM_HUB_GAMES.find(g => g.id === state.game) : null;
    const name = entry ? (t[entry.key] || entry.id) : (t.exit_room_title || '');
    // The room sheet (the owner, 9 Oct 2026): which game and room on top, «كمّل» the loud button
    // (the sheet mostly opens from a back tap nobody meant), the game's own moves in a pair, the
    // room's in a pair, and the one way out last and apart (roomLeave asks before it goes).
    const pair = (x, y) => `<div class="btn-row">${x}${y}</div>`;
    const game = [];
    if (playing && state.youAreHost) {
      const change = exitSheetRow(t.exit_room_change_short || '', 'exitSheetBackToHub()');
      // «⚙️ غيّر الإعدادات» as at a game's end; برنامج السهرة runs its own line-up.
      game.push(state.program ? change : pair(exitSheetRow(t.exit_room_reconf || '', 'exitSheetReconfigure()'), change));
    }
    if (playing && !state.youAreHost) game.push(exitSheetRow(t.exit_room_ask || '', 'exitSheetAsk()'));
    // A big screen on: the host shows its corner QR big for someone just in (1287, roomTvQrAsk).
    if (playing && state.youAreHost && typeof roomHasScreenOn === 'function' && roomHasScreenOn(state)) {
      game.push(exitSheetRow(t.room_tv_qr || '', "closeModal('exit-modal'); roomTvQrAsk()"));
    }
    body.innerHTML = `
      <div class="modal-icon" aria-hidden="true">${entry ? iconHtml(entry.icon) : '🎲'}</div>
      <div class="sheet__title">${escapeHTML(name)}</div>
      <p class="room-sheet__code">${escapeHTML(t.exit_room_code || '')} <bdi class="room-sheet__chip">${escapeHTML(state.code || '')}</bdi></p>
      ${playing && !state.youAreHost ? `<p class="sheet__subtitle">${escapeHTML(t.exit_room_host_note || '')}</p>` : ''}
      <div class="modal-actions">
        <button class="btn btn--primary btn--lg" onclick="closeModal('exit-modal')">${escapeHTML((playing ? t.exit_keep : t.exit_keep_room) || '')}</button>
      </div>
      ${game.length ? `<div class="modal-divider">${escapeHTML(t.exit_room_game_head || '')}</div><div class="btn-stack">${game.join('')}</div>` : ''}
      <div class="modal-divider">${escapeHTML(t.exit_room_title || '')}</div>
      <div class="btn-stack">
        ${pair(
          // The bar (Help's door) is hidden while a game is played: the rules are here.
          exitSheetRow(t.exit_rules || '', "closeModal('exit-modal'); openHelpModal()"),
          exitSheetRow(t.exit_room_menu_short || '', "closeModal('exit-modal'); setView('menu')"))}
        <p class="room-sheet__note">${escapeHTML(t.exit_room_menu_note || '')}</p>
      </div>
      <div class="room-sheet__leave">${exitSheetRow(t.exit_room_leave || '', "closeModal('exit-modal'); roomLeave()", 'btn--danger-soft btn--sm')}</div>`;
  } else {
    const up = (VIEW_META[view] || {}).up || 'menu';
    // The sheet usually opens from a back tap nobody meant, so the loud button keeps the
    // round going and the ways out, which stop it, are quieter. From a bottom tab, the
    // first way out is where that tab goes.
    const leave = navTarget && navTarget !== 'menu'
      ? exitSheetRow(t.exit_leave_game || 'اخرج من اللعبة', `closeModal('exit-modal'); navGo('${jsStringAttr(navTarget)}')`, 'btn--danger-soft')
      : exitSheetRow(t.exit_pick_another || '', "closeModal('exit-modal'); setView('menu')", 'btn--danger-soft');
    body.innerHTML = `
      <div class="modal-icon" aria-hidden="true">${iconHtml(game.icon)}</div>
      <div class="sheet__title">${escapeHTML(t.exit_game_title || '')}</div>
      <p class="sheet__subtitle">${escapeHTML(t.exit_game_sub || '')}</p>
      <div class="modal-actions">
        <button class="btn btn--primary btn--lg" onclick="closeModal('exit-modal')">${escapeHTML(t.exit_keep || '')}</button>
      </div>
      <div class="btn-stack">
        ${leave}
        ${exitSheetRow(t.exit_settings || '', `closeModal('exit-modal'); setView('${jsStringAttr(up)}')`)}
        ${exitSheetRow(t.exit_rules || '', "closeModal('exit-modal'); openHelpModal()")}
      </div>`;
    // The round waits while the table reads this.
    pauseClocksForSheet();
  }
  const modal = document.getElementById('exit-modal');
  if (modal) modal.classList.remove('hidden');
  return true;
}

/** The host ends the round for everyone; the room lands back on its game picker. */
function exitSheetBackToHub() {
  closeModal('exit-modal');
  roomAct('backToHub');
}

/** «⚙️ غيّر الإعدادات» from the sheet: the same game's lobby, its options open (roomReconfigureTap). */
function exitSheetReconfigure() {
  closeModal('exit-modal');
  const st = Room.state;
  if (st && st.game && typeof lobbyOptsOpen === 'object') lobbyOptsOpen[st.game] = true;
  roomAct('reconfigure', {});
}

/** Not the host: say it in the room chat rather than sit there bored. */
async function exitSheetAsk() {
  closeModal('exit-modal');
  const t = TRANSLATIONS[appState.lang] || {};
  try {
    await Room.act('chat', { text: t.exit_room_ask_msg || '' });
    showToast(t.exit_room_asked || '', 'success');
  } catch (e) {
    showToast(e.message || '', 'error');
  }
}
