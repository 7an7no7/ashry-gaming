.dk-pill .dk-hearts svg { width: 2.8vmin; height: 2.6vmin; }
.dk-seg { display: inline-flex; background: rgba(10, 8, 20, 0.78); border-radius: var(--r-full); padding: 0.4vmin; }
.dk-seg button { font: 700 2vmin/1 var(--font); color: #cfc8e6; background: none; border: 0; border-radius: var(--r-full); padding: 1vmin 2vmin; cursor: pointer; min-height: 0; }
.dk-seg button.is-active { background: #6c3ce0; color: #ffffff; }
.dk-chips--tv { flex: 1; justify-content: center; }
.dk-chips--tv .dk-chip { font-size: 1.9vmin; background: rgba(10, 8, 20, 0.74); }
.dk-tv .dk-tvnote { font-size: 1.8vmin; background: rgba(10, 8, 20, 0.74); padding: 0.5vmin 1.4vmin; border-radius: var(--r-full); }
.dk-intro--tv { font-size: 7vmin; z-index: 2; }
.dk-tv .dk-banner { font-size: 3.4vmin; inset-inline: 20%; top: 12%; padding: 1vmin 2vmin; }
.dk-tv.dk--over { display: flex; align-items: center; justify-content: center; padding: 3vmin; }
.dk-tv .dk-over h3 { font-size: 5vmin; }
.dk-tv .dk-over__n { font-size: 3vmin; }
.dk-tv .dk-over__n b { font-size: 9vmin; }
.dk-tv .dk-over__best { font-size: 2.6vmin; }
.dk-tv .dk-over__icon { font-size: 9vmin; }

/* «الميكروفون» and «دايخ!» (7 Oct 2026): who holds the mic, big; the guides told the mover is dizzy. */
.dk-mic {
  --dk-c: #ffd54a;
  display: grid; gap: 0.35rem; justify-items: center; text-align: center; padding: 0.55rem 0.8rem;
  border-radius: var(--r-lg); background: var(--dk-night-2); border: 2px solid color-mix(in srgb, var(--dk-c) 70%, transparent);
  font-weight: 700; color: var(--dk-ink);
}
.dk-mic[hidden] { display: none; }
.dk-mic.is-mine { background: color-mix(in srgb, var(--dk-c) 26%, var(--dk-night-2)); }
.dk-mic__line { display: flex; align-items: center; justify-content: center; gap: 0.45rem; font-size: var(--fs-body); }
.dk-mic__line b { font-family: var(--font-display); font-size: var(--fs-h3); }
.dk-mic__icon { font-size: 1.6rem; line-height: 1; }
.dk-mic small { color: var(--dk-ink-2); font-size: var(--fs-sm); }
.dk-mic__call { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.4rem; }
.dk-mic__call .chip { border-color: var(--dk-c); }
.dk-mic--tv {
  position: absolute; top: 9vmin; left: 50%; translate: -50% 0; z-index: 2; display: flex; align-items: center; gap: 1.4vmin;
  padding: 1vmin 3vmin; background: rgba(10, 8, 20, 0.82); border-width: 0.4vmin; font-size: 4.2vmin; pointer-events: none;
}
.dk-mic--tv .dk-mic__icon { font-size: 5vmin; }
.dk-mic--tv .dk-mic__who { font-family: var(--font-display); font-weight: 900; color: var(--dk-c); }
.dk-dizzy {
  position: absolute; inset-inline: 6%; top: 18%; z-index: 3; text-align: center; border-radius: var(--r-md);
  padding: 0.45rem 0.8rem; font-family: var(--font-display); font-weight: 900; font-size: var(--fs-body);
  background: #c9a0ff; color: #1d0b3a; pointer-events: none; animation: dkWobble 0.9s ease-in-out infinite alternate;
}
.dk-dizzy[hidden] { display: none; }
.dk-dizzy--tv { inset-inline: 22%; top: 20%; font-size: 3.4vmin; padding: 1vmin 2vmin; }
@keyframes dkWobble { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

@media (prefers-reduced-motion: reduce) {
  .dk-fb, .dk-intro, .dk-toast, .dk-banner { transition: none; }
  .dk-dizzy { animation: none; }
}

/* ============================================================================
   58. حط إيدك! (HANDS DOWN, first بالظبط ٣! in rooms, JS_RoomExact.html, 29 Sep 2026)
   Look أ «إيد على الترابيزة», improved: a wooden table from above on a dark
   checker floor, a seat each along the top and bottom edges (a name plate, a
   cartoon hand in the player's colour), the order a paper card in the middle,
   tea glasses on a brass tray on the left (the lives), the food filling the
   right as the table wins; the phone a round wooden pad for your hand. The
   table is laid out left to right in every language (a physical table) and
   sized in cqw off its own width, so the phone, a phone on its side, a laptop
   and the TV are one drawing. Colours are the look's own, the same in both
   themes (the table sits on its own floor).
   ========================================================================= */
.ex { display: flex; flex-direction: column; gap: var(--sp-3); }
.ex-head { justify-content: center; flex-wrap: wrap; }
.ex-head__lives { display: inline-flex; gap: 0.2rem; align-items: center; }
.ex-head__lives i { display: inline-block; width: 0.8rem; height: 1.3rem; transition: transform 0.5s cubic-bezier(.4,1.5,.5,1), opacity 0.4s; }
.ex-head__lives i svg { width: 100%; height: 100%; display: block; }
.ex-head__lives i.is-gone { opacity: 0.28; transform: rotate(-70deg); }
.ex-stage { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }

.ex-table {
  --th: 75cqw;                             /* the table's height, 4:3 */
  --edge: calc(var(--th) * 0.15);          /* the wood's edge from the floor's edge */
  --hh: calc(var(--hw, 8cqw) * 1.686);
  --reach: calc(var(--th) * 0.2);
  position: relative; width: 100%; aspect-ratio: 4 / 3; container-type: inline-size;
  border-radius: 1.25rem; overflow: hidden; isolation: isolate;
  background: repeating-conic-gradient(#3b2a3f 0 25%, #443248 0 50%) 0 0 / 7cqw 7cqw;
  box-shadow: 0 10px 28px rgba(20, 10, 30, 0.28);
  user-select: none; -webkit-user-select: none;
}
.ex-wood {
  position: absolute; inset: 15% 3%; border-radius: 4cqw; border: 0.7cqw solid #221f36;
  background:
    linear-gradient(90deg, rgba(0,0,0,.12), transparent 18%, transparent 82%, rgba(0,0,0,.15)),
    repeating-linear-gradient(0deg, #b77a44 0 7cqw, #ab703c 7cqw 7.25cqw, #c28650 7.25cqw 14cqw, #9f6534 14cqw 14.25cqw);
  box-shadow: 0 1.4cqw 0 #4a2c14, inset 0 0 0 0.9cqw rgba(255,255,255,.08);
}
.ex-wood::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: repeating-linear-gradient(3deg, transparent 0 2.8cqw, rgba(70,35,10,.12) 2.8cqw 2.9cqw),
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.18), transparent 55%);
}

/* the tray and the glasses (the lives) */
.ex-tray {
  position: absolute; left: 4.5%; top: 50%; transform: translateY(-50%); width: 16%; z-index: 3;
  display: flex; justify-content: center; align-items: flex-end; gap: 0.5cqw; padding: 2.2cqw 0.8cqw 1.6cqw;
  border-radius: 50%; border: 0.45cqw solid #221f36;
  background: radial-gradient(ellipse at 45% 40%, #ffe08a, #d9a032 55%, #8a5a12);
}
.ex-cup { position: relative; width: 3.4cqw; height: 5.6cqw; }
.ex-glass { position: absolute; inset: 0; z-index: 1; transform-origin: 50% 90%; transition: transform 0.55s cubic-bezier(.4,1.5,.5,1); }
.ex-glass svg { width: 100%; height: 100%; display: block; }
.ex-glass .ex-tea { transition: opacity 0.4s 0.2s; }
.ex-cup.is-spilt .ex-glass { transform: rotate(-95deg) translate(-0.4cqw, -0.2cqw); }
.ex-cup.is-spilt .ex-tea { opacity: 0.15; }
.ex-pud {
  position: absolute; left: -3.2cqw; top: 72%; width: 7cqw; height: 2.6cqw; border-radius: 50%;
  background: radial-gradient(#b0521c, #8a3d12 70%); border: 0.2cqw solid rgba(60,20,0,.4);
  transform: scale(0); transition: transform 0.8s 0.25s ease-out; opacity: 0.85; pointer-events: none;
}
.ex-cup.is-spilt .ex-pud { transform: scale(1); }
.ex-cup.is-refill { animation: ex-pop 0.6s cubic-bezier(.3,1.8,.5,1); }

/* the food: every level won puts a dish on the table */
.ex-food {
  position: absolute; right: 4.5%; top: 18%; bottom: 18%; width: 16%; z-index: 3;
  display: grid; grid-template-columns: 1fr 1fr; align-content: center; gap: 0.5cqw;
}
.ex-dish { display: block; width: 100%; aspect-ratio: 5 / 4; }
.ex-dish svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ex-dish.is-new { animation: ex-dish 0.7s cubic-bezier(.3,1.6,.5,1) both; }
.ex-steam { animation: ex-steam 2s ease-in-out infinite; }

/* the seats: a column at --x, the hand coming in from the edge */
.ex-seat { position: absolute; left: var(--x); top: 0; bottom: 0; width: 0; z-index: 6; }
.ex-hand {
  position: absolute; left: 0; width: var(--hw, 8cqw); height: var(--hh); z-index: 7;
  transition: transform 0.2s cubic-bezier(.3,1.6,.5,1), filter 0.2s;
  filter: drop-shadow(0 0.5cqw 0.3cqw rgba(0,0,0,.35));
}
.ex-hand svg { width: 100%; height: 100%; display: block; }
.ex-seat--top .ex-hand { top: var(--edge); transform: translate(-50%, calc(-100% + 1.5cqw)) rotate(180deg); }
.ex-seat--bot .ex-hand { bottom: var(--edge); transform: translate(-50%, calc(100% - 1.5cqw)); }
.ex-seat--top.is-down .ex-hand { transform: translate(-50%, calc(-100% + var(--reach))) rotate(180deg) scale(0.96); filter: drop-shadow(0 0.2cqw 0.1cqw rgba(0,0,0,.45)); }
.ex-seat--bot.is-down .ex-hand { transform: translate(-50%, calc(100% - var(--reach))) scale(0.96); filter: drop-shadow(0 0.2cqw 0.1cqw rgba(0,0,0,.45)); }
.ex-seat--top.is-hover .ex-hand { transform: translate(-50%, calc(-100% + var(--reach) * 0.62)) rotate(180deg) scale(1.14); filter: drop-shadow(0 3cqw 1cqw rgba(0,0,0,.32)); }
.ex-seat--bot.is-hover .ex-hand { transform: translate(-50%, calc(100% - var(--reach) * 0.62)) scale(1.14); filter: drop-shadow(0 -3cqw 1cqw rgba(0,0,0,.32)); }
.ex-seat.is-hover .ex-hand svg { animation: ex-tremble 0.15s linear infinite; }
.ex-seat--top.is-pull .ex-hand { transform: translate(-50%, calc(-100% - 2cqw)) rotate(180deg); }
.ex-seat--bot.is-pull .ex-hand { transform: translate(-50%, calc(100% + 2cqw)); }
.ex-seat.is-pull .ex-hand svg { animation: ex-dizzy 0.4s 2; }
.ex-seat.has-bump .ex-hand::after {
  content: ""; position: absolute; left: 38%; top: 30%; width: 2.2cqw; height: 2.2cqw; border-radius: 50%;
  background: radial-gradient(#ff8a8a, #e03a4a); border: 0.3cqw solid #221f36; animation: ex-pop 0.3s cubic-bezier(.3,1.8,.5,1) both;
}

.ex-plate {
  position: absolute; left: 0; z-index: 9; max-width: calc(var(--hw, 8cqw) * 1.9); min-width: 3.2cqw;
  padding: 0.25cqw 1cqw; border-radius: 999px; background: #fff; color: #221f36;
  border: 0.35cqw solid var(--c); box-shadow: 0 0.35cqw 0 rgba(0,0,0,.25);
  font: 900 max(0.66rem, 2.1cqw)/1.25 var(--font-display); text-align: center; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5cqw;
}
.ex-plate__n { overflow: hidden; text-overflow: ellipsis; }
.ex-plate__sec:empty { display: none; }
.ex-seat--top .ex-plate { top: var(--edge); transform: translate(-50%, -50%); }
.ex-seat--bot .ex-plate { bottom: var(--edge); transform: translate(-50%, 50%); }
.ex-seat.is-me .ex-plate { background: var(--c); color: #fff; box-shadow: 0 0 0 0.4cqw rgba(255,255,255,.75), 0 0.35cqw 0 rgba(0,0,0,.25); }
.ex-seat.is-lit .ex-plate { box-shadow: 0 0 0 0.6cqw #ffd23f, 0 0 2.5cqw 0.6cqw rgba(255,210,63,.7); animation: ex-beat 0.4s ease-out; }
.ex-seat.is-lit .ex-hand { filter: drop-shadow(0 0 1.2cqw rgba(255,210,63,.9)); }
.ex-seat.is-bad .ex-plate { border-color: #d62e45; }

.ex-badge {
  position: absolute; left: 0; z-index: 10; width: 4.4cqw; height: 4.4cqw; min-width: 1.4rem; min-height: 1.4rem;
  display: grid; place-items: center; border-radius: 50%; background: #fff; color: #221f36;
  border: 0.35cqw solid #221f36; font: 900 max(0.72rem, 2.3cqw)/1 var(--font-display);
  opacity: 0; transform: translate(40%, 0) scale(0.4); transition: opacity 0.15s, transform 0.25s cubic-bezier(.3,1.8,.5,1);
  pointer-events: none;
}
.ex-seat--top .ex-badge { top: calc(var(--edge) + var(--reach) * 0.3); }
.ex-seat--bot .ex-badge { bottom: calc(var(--edge) + var(--reach) * 0.3); }
.ex-badge { transform: translate(calc(var(--hw, 8cqw) * 0.5), 0) scale(0.4); }
.ex-badge.is-on { opacity: 1; transform: translate(calc(var(--hw, 8cqw) * 0.5), 0) scale(1); }
.ex-badge.is-bad { background: #d62e45; color: #fff; }

.ex-bub {
  position: absolute; left: 0; z-index: 12; padding: 0.5cqw 1.2cqw; border-radius: 1.4cqw;
  background: #fff; color: #221f36; border: 0.3cqw solid #221f36;
  font: 900 max(0.72rem, 2.3cqw)/1.2 var(--font-display); white-space: nowrap;
  opacity: 0; transform: translate(-50%, 0) scale(0.5); pointer-events: none;
}
.ex-seat--top .ex-bub { top: calc(var(--edge) + 1.5cqw); }
.ex-seat--bot .ex-bub { bottom: calc(var(--edge) + 1.5cqw); }
.ex-bub.is-on { opacity: 1; transform: translate(-50%, 0) scale(1); animation: ex-pop 0.35s cubic-bezier(.3,1.8,.5,1) both; }
.ex-bub.is-still { animation: none; }
/* «الإيد الدهب» (7 Oct 2026): a gold ring on the hand right five orders in a row. */
.ex-gold { opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity 0.3s, transform 0.3s; }
.ex-seat.has-ring .ex-gold { opacity: 1; }
.ex-seat.has-ring .ex-hand svg { filter: drop-shadow(0 0 0.8cqw rgba(255, 210, 63, 0.75)); }
.ex-seat.is-ring-new .ex-gold { animation: ex-gold-on 1.1s cubic-bezier(.3,1.6,.5,1) both; }
.ex-seat.is-ring-off .ex-gold { animation: ex-gold-off 0.8s ease-in both; }
.ex-bub.is-gold { background: #ffd23f; color: #3a2600; }
@keyframes ex-gold-on { 0% { transform: scale(2.6); opacity: 0; } 55% { transform: scale(0.9); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes ex-gold-off { to { transform: translateY(14px) rotate(70deg); opacity: 0; } }

/* the order: a paper card in the middle of the table */
.ex-card {
  position: absolute; left: 50%; top: 50%; z-index: 5; width: 50%; min-height: 22%;
  transform: translate(-50%, -50%) rotate(-1.5deg);
  background: #fffbea; color: #221f36; border: 0.55cqw solid #221f36; border-radius: 1.6cqw;
  box-shadow: 0 0.8cqw 0 rgba(0,0,0,.25); padding: 1.4cqw 1.8cqw 2.2cqw;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6cqw; text-align: center;
}
.ex-card__kick { display: flex; gap: 0.8cqw; justify-content: center; flex-wrap: wrap; }
.ex-chip { font: 800 max(0.62rem, 1.7cqw)/1.2 var(--font-display); padding: 0.3cqw 1.2cqw; border-radius: 999px; background: #f59e0b; color: #1c1200; border: 0.25cqw solid #221f36; }
.ex-chip--new { background: #e0457b; color: #fff; animation: ex-beat 1.2s ease-in-out 2; }
.ex-card__title { font: 900 max(0.95rem, 3.6cqw)/1.35 var(--font-display); text-wrap: balance; }
.ex-card__sub { font: 700 max(0.72rem, 2.2cqw)/1.35 var(--font); color: #5b4d6e; text-wrap: balance; }
.ex-card__big { font: 900 max(1.3rem, 5.6cqw)/1 var(--font-display); color: #c2410c; min-height: 1em; }
.ex-card__big:empty { display: none; }
.ex-card__big.is-count { color: #221f36; }
.ex-card__meter { position: absolute; left: 1.4cqw; right: 1.4cqw; bottom: 0.9cqw; height: 0.7cqw; border-radius: 999px; background: rgba(34,31,54,.12); overflow: hidden; }
.ex-card__meter i { display: block; height: 100%; background: #f59e0b; transform-origin: left center; transform: scaleX(1); }
.ex-card.is-read .ex-card__meter i { background: #8b5cf6; }
.ex-card__verdict { font: 900 max(1.3rem, 5.4cqw)/1.2 var(--font-display); }
.ex-card__verdict.is-ok { color: #128a45; }
.ex-card__verdict.is-bad { color: #d62e45; }

/* a secret: a colour, a shape, a number, a word on your own screen */
.ex-sec { display: inline-flex; align-items: center; gap: 0.4em; font: 900 1em/1 var(--font-display); }
.ex-sec__dot { width: 1.1em; height: 1.1em; display: inline-block; }
.ex-sec__dot svg { width: 100%; height: 100%; display: block; }
.ex-sec--say { padding: 0.15em 0.5em; border-radius: 0.4em; border: 0.12em solid #221f36; }
.ex-sec--say.is-press { background: #22c55e; color: #052e16; }
.ex-sec--say.is-stop { background: #ef4444; color: #fff; }
.ex-sec__num { font-size: 1.1em; }
.ex-sec.is-big { font-size: 1.15rem; padding: 0.3rem 0.75rem; border-radius: 999px; background: #fffbea; color: #221f36; border: 2px solid #221f36; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.ex-sec.is-big.ex-sec--c { background: var(--sc); color: #fff; }
.ex-sec.is-big.ex-sec--say.is-press { background: #22c55e; color: #052e16; }
.ex-sec.is-big.ex-sec--say.is-stop { background: #ef4444; color: #fff; }
.ex-sec.is-big .ex-sec__num { font-size: 1.6rem; }

/* the effects layer: a slam, a word, the bee */
.ex-fx { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.ex-imp { position: absolute; width: 10cqw; height: 10cqw; transform: translate(-50%, -50%); animation: ex-imp 0.45s ease-out forwards; }
.ex-imp svg { width: 100%; height: 100%; display: block; }
.ex-pow {
  position: absolute; transform: translate(-50%, -50%); padding: 0.5cqw 1.4cqw; border-radius: 1.4cqw;
  background: #ffd23f; color: #221f36; border: 0.35cqw solid #221f36; font: 900 max(0.9rem, 3cqw)/1 var(--font-display);
  animation: ex-pow 0.85s ease-out forwards; white-space: nowrap;
}
.ex-bee { position: absolute; width: 6cqw; height: 5cqw; margin: -2.5cqw 0 0 -3cqw; z-index: 22; }
.ex-bee svg { width: 100%; height: 100%; display: block; }
.ex-bee__wing { animation: ex-flap 0.06s infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }

.ex-cap { min-height: 1.4em; text-align: center; font: 800 var(--fs-h3)/1.4 var(--font-display); color: var(--text); text-wrap: balance; }
.ex-cap:empty { display: none; }
.ex-next { text-align: center; color: var(--text-2); font-weight: 600; min-height: 1.2em; }
.ex-me { text-align: center; font: 800 1.05rem/1.4 var(--font-display); padding: var(--sp-3); border-radius: var(--r-lg); background: var(--surface-2); }
.ex-me:empty { display: none; }
.ex-me.is-bad { color: var(--danger-ink, #b4232f); }
.ex-below { display: flex; flex-direction: column; gap: var(--sp-2); align-items: stretch; }

:root[dir="rtl"] .ex-bub, :root[dir="rtl"] .ex-pow, :root[dir="rtl"] .ex-plate { direction: rtl; }
.ex-cap--sub { display: none; font-weight: 700; color: var(--text-2); }
@media (max-width: 899px) { .ex-cap--sub { display: block; } }
/* a small table (a phone): the card carries the order only; the line under it is below the table */
@container (max-width: 520px) {
  .ex-card__sub, .ex-chip--new { display: none; }
  .ex-card { width: 58%; padding: 1.4cqw 2cqw 2.6cqw; }
  .ex-card__title { font-size: max(0.78rem, 4.4cqw); }
  .ex-card__big { font-size: max(1.05rem, 7cqw); }
  .ex-chip { font-size: max(0.56rem, 2.8cqw); }
  .ex-plate { font-size: max(0.6rem, 3.2cqw); }
  .ex-bub, .ex-badge { font-size: max(0.62rem, 3.4cqw); }
}
