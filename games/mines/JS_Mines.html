<script>
/* ============================================================================
   كاسحة الألغام — MINESWEEPER
   ----------------------------------------------------------------------------
   Open every cell that isn't a mine. A number says how many mines touch it.
   Flag a mine with a long press, or with 🚩 mode on; tap (or long-press) a
   number whose flags are all placed to open the cells around it.

   The field's rules are Mines.js (shared with the rooms server, which lays a
   race's mines). The first tap is always safe: the mines are laid after it,
   away from it and its neighbours, and laid so that the field never needs a
   guess (minesSolvable). The daily board can't wait for a tap (it
   has to be the same on every phone), so its mines are laid from soloDaySeed
   around a safe cell of its own, which opens by itself when the game starts.
   Opening a patch ripples outwards from the tap. The board is in appState.mines.

   In سباق ألغاز (RACE_UI.mines, JS_RoomRace.html) the mines are the whole
   secret, so they stay on the server: every tap is sent (`move { cells }`) and
   what opened comes back with its numbers (s.nums); the flags stay on the
   phone. A mine puts the phone out of the round with 0.
   ========================================================================= */

const MINES_HOLD_MS = 420;
let minesTimer = null;
let minesHold = null;

function minesState() {
  const race = soloRaceState('mines');
  if (race) return race;
  if (!appState.mines) {
    appState.mines = { level: 'easy', daily: '', cols: 8, rows: 9, count: 10, mines: [], open: [], flags: [],
                       flagMode: false, startedAt: 0, phase: 'setup', boom: -1 };
  }
  return appState.mines;
}

function setupMines() {
  minesStopTimer();
  setView('setup-mines');
}

function paintMinesSetup() {
  const s = minesState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#mines-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const best = soloBest('mines', s.level);
  const el = document.getElementById('mines-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('mines-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play' && s.phase !== 'ready');
  const daily = document.getElementById('mines-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('mines', 'startMines(true)');
}

function setMinesLevel(level) {
  minesState().level = level;
  saveToLocal();
  paintMinesSetup();
}

// A minefield with cells opened: a new one asks first (soloConfirmNew), as
// Queens and Tango do. An untouched one (phase 'ready') just goes.
const minesHasWork = (s) => (s.open || []).some(Boolean);

function startMines(daily, sure) {
  if (!sure && soloConfirmNew('mines', minesHasWork, () => startMines(daily, true))) return;
  if (daily && soloDailyResume('mines')) return;
  soloDailySetAside('mines');
  soloNewGame('mines');
  const s = minesState();
  const level = daily ? 'medium' : s.level;
  const L = MINES_LEVELS[level];
  s.daily = daily ? soloToday() : '';
  s.playLevel = level;
  s.cols = L.cols; s.rows = L.rows; s.count = L.mines;
  s.open = new Array(L.cols * L.rows).fill(0);
  s.flags = new Array(L.cols * L.rows).fill(0);
  s.flagMode = false;
  s.boom = -1;
  s.mines = [];
  s.nums = null;
  s.startedAt = 0;
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'ready';
  if (daily) {
    const rnd = soloRng(soloDaySeed('mines'));
    const safe = Math.floor(rnd() * L.cols * L.rows);
    minesLay(s, safe, rnd);
    s.phase = 'play';
    s.startedAt = Date.now();
    minesFlood(s, safe);
  }
  saveToLocal();
  setView('play-mines');
  paintMines();
  if (s.phase === 'play') minesArmTimer();
}

function continueMines() {
  const s = minesState();
  if (s.phase !== 'play' && s.phase !== 'ready') return;
  setView('play-mines');
  paintMines();
  if (s.phase === 'play') minesArmTimer();
}

function minesArmTimer() {
  minesStopTimer();
  minesTimer = soloClock('mines-time', () => minesState().startedAt);
}

function minesStopTimer() {
  if (minesTimer) minesTimer.stop();
  minesTimer = null;
}

/** A cell's number (0-8), from the mines on this phone or, in a race, from what the server opened. */
const minesNumAt = (s, i) => (s.nums ? (s.nums[i] === 9 ? 0 : (s.nums[i] || 0)) : minesCount(s, i));
/** Whether a cell is a mine, as far as this phone knows (in a race: only once the server showed it). */
const minesIsMine = (s, i) => (s.nums ? s.nums[i] === 9 || (s.mines || []).indexOf(i) !== -1 : (s.mines || []).indexOf(i) !== -1);

/* --- Taps ---------------------------------------------------------------------- */

function minesTap(i) {
  const s = minesState();
  if (s.phase !== 'play' && s.phase !== 'ready') return;
  if (s.flagMode) { minesToggleFlag(i); return; }
  if (s.flags[i]) return;
  // A race: the mines are on the server, which opens the cells (JS_RoomRace.html).
  if (s.race) {
    let cells = [i];
    if (s.open[i]) {
      const around = minesNeighbours(s, i);
      const flagged = around.filter(k => s.flags[k]).length;
      if (minesNumAt(s, i) && flagged !== minesNumAt(s, i)) { minesPulse(s, i); return; }
      if (!minesNumAt(s, i)) return;
      cells = around.filter(k => !s.open[k] && !s.flags[k]);
      if (!cells.length) return;
    }
    s.lastTap = i;
    raceMove('mines', { cells: cells });
    return;
  }
  if (s.phase === 'ready') {
    minesLay(s, i, Math.random);
    s.phase = 'play';
    s.startedAt = Date.now();
    minesArmTimer();
  }
  const mines = new Set(s.mines);
  let opened = [];
  if (s.open[i]) {
    // A number with all its flags down opens the rest of its neighbours.
    const around = minesNeighbours(s, i);
    const flagged = around.filter(k => s.flags[k]).length;
    if (minesCount(s, i) && flagged !== minesCount(s, i)) { minesPulse(s, i); return; }
    if (!minesCount(s, i)) return;
    around.forEach(k => { if (!s.open[k] && !s.flags[k]) opened = opened.concat(minesFlood(s, k)); });
  } else {
    opened = minesFlood(s, i);
  }
  const hit = opened.find(k => mines.has(k));
  saveToLocal();
  paintMines(opened, i);
  if (hit !== undefined) { minesLose(hit); return; }
  if (opened.length) haptic('light');
  const safeLeft = s.open.reduce((n, o, k) => n + (!o && !mines.has(k) ? 1 : 0), 0);
  if (!safeLeft) minesWin();
}

function minesToggleFlag(i) {
  const s = minesState();
  if (s.open[i] || (s.phase !== 'play' && s.phase !== 'ready')) return;
  s.flags[i] = s.flags[i] ? 0 : 1;
  haptic('medium');
  saveToLocal();
  paintMines();
}

function toggleMinesFlagMode() {
  const s = minesState();
  s.flagMode = !s.flagMode;
  saveToLocal();
  paintMines();
}

/* A long press flags, on phones that have no right button; on a computer the right
   button flags at once (the grid swallows its menu). */
function minesPointerDown(e, i) {
  minesCancelHold();
  const s = minesState();
  // An opened number takes no flag: a long press (or the right button) on it does what a
  // tap does - opens the rest of its neighbours once its flags are down (the review of
  // 1 Oct 2026: a long press there used to do nothing at all).
  const openNum = !!(s.open && s.open[i]);
  if (e && e.button === 2) {
    e.preventDefault();
    minesHold = { i: i, fired: true, timer: 0 };
    if (openNum) minesTap(i); else minesToggleFlag(i);
    return;
  }
  if (openNum) {
    minesHold = { i: i, fired: false, x: e ? e.clientX : 0, y: e ? e.clientY : 0, ring: null, timer: setTimeout(() => {
      minesHold.fired = true;
      minesTap(i);
    }, MINES_HOLD_MS) };
    return;
  }
  const cell = e && e.currentTarget;
  // ideas batch: solo - a ring fills over the hold's time on a cell that can
  // take a flag; moving the finger 8px (a scroll, a slip) cancels the hold.
  let ring = null;
  if (cell && !s.open[i] && (s.phase === 'play' || s.phase === 'ready') && !motionOff()) {
    ring = document.createElement('span');
    ring.className = 'mines-ring';
    ring.style.setProperty('--hold', MINES_HOLD_MS + 'ms');
    cell.appendChild(ring);
  }
  minesHold = { i: i, fired: false, x: e ? e.clientX : 0, y: e ? e.clientY : 0, ring: ring, timer: setTimeout(() => {
    minesHold.fired = true;
    if (minesHold.ring) { minesHold.ring.remove(); minesHold.ring = null; }
    minesToggleFlag(i);
  }, MINES_HOLD_MS) };
}

/** ideas batch: solo - a finger that moves more than 8px isn't holding: no flag. */
function minesPointerMove(e) {
  if (!minesHold || minesHold.fired || !minesHold.timer) return;
  if (Math.hypot(e.clientX - minesHold.x, e.clientY - minesHold.y) > 8) {
    minesCancelHold();
    minesHold.cancelled = true;
  }
}

function minesCancelHold() {
  if (!minesHold) return;
  clearTimeout(minesHold.timer);
  minesHold.timer = 0;
  if (minesHold.ring) { minesHold.ring.remove(); minesHold.ring = null; }
}

/** ideas batch: solo - a number tapped without enough flags round it: its closed neighbours pulse. */
function minesPulse(s, i) {
  haptic('light');
  if (motionOff()) return;
  minesNeighbours(s, i).forEach(k => {
    if (s.open[k] || s.flags[k]) return;
    const c = document.querySelector(`#mines-grid [data-i="${k}"]`);
    if (c && c.animate) c.animate([{ scale: '1', opacity: 1 }, { scale: '0.82', opacity: 0.55, offset: 0.4 }, { scale: '1', opacity: 1 }], { duration: 420, easing: 'ease-in-out' });
  });
}

function minesClick(e, i) {
  if (minesHold && minesHold.i === i && minesHold.fired) { minesHold = null; return; }
  // A slide that cancelled the hold was a scroll, not a tap.
  if (minesHold && minesHold.i === i && minesHold.cancelled) { minesHold = null; return; }
  minesCancelHold();
  minesHold = null;
  minesTap(i);
}

/* --- Drawing ------------------------------------------------------------------- */

function paintMines(opened, from) {
  const s = minesState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('mines-stage');
  if (!el) return;
  const over = s.phase === 'lost' || s.phase === 'won' || s.phase === 'done';
  const flagsLeft = s.count - s.flags.reduce((a, b) => a + b, 0);
  const bar = soloBarHtml([
    { label: t.mines_left || '', value: flagsLeft, id: 'mines-left' },
    { label: t.solo_time || '', value: over ? soloTime(s.seconds) : (s.startedAt ? soloTime((Date.now() - s.startedAt) / 1000) : '0:00'), id: 'mines-time' },
    s.daily ? { label: t.daily_title || '', value: '📅' } : { label: t.solo_level || '', value: escapeHTML(t['solo_lvl_' + (s.playLevel || s.level)] || '') }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
    <div class="solo-layout__board" style="--mines-cols:${s.cols};--mines-rows:${s.rows}">
    <div class="mines-grid${over ? ' is-over' : ''}" id="mines-grid" dir="ltr" style="--mines-cols:${s.cols}"
         oncontextmenu="event.preventDefault()">
      ${Array.from({ length: s.cols * s.rows }, (_, i) => {
        const isMine = minesIsMine(s, i);
        let cls = 'mines-cell', inner = '';
        if (s.open[i] || (over && isMine)) {
          cls += ' is-open';
          if (isMine) { cls += i === s.boom ? ' is-boom' : ' is-mine'; inner = '💣'; }
          else { const n = minesNumAt(s, i); if (n) { cls += ' n' + n; inner = n; } }
        } else if (s.flags[i]) {
          cls += ' is-flag' + (over && !isMine && (!s.race || s.minesAll) ? ' is-wrong' : '');
          inner = '🚩';
        }
        return `<button type="button" class="${cls}" data-i="${i}"
                  onpointerdown="minesPointerDown(event, ${i})" onpointerup="minesCancelHold()" onpointerleave="minesCancelHold()" onpointercancel="minesCancelHold()" onpointermove="minesPointerMove(event)"
                  onclick="minesClick(event, ${i})">${inner}</button>`;
      }).join('')}
    </div>
    </div>
    <div class="solo-layout__side">
    ${bar}
    <div class="sdk-tools">
      <button type="button" class="btn btn--sm ${s.flagMode ? 'btn--primary' : 'btn--neutral'}" onclick="toggleMinesFlagMode()" aria-pressed="${s.flagMode}">🚩 ${escapeHTML(t.mines_flag_mode || '')}</button>
      ${s.race ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="startMines(false)">🔄 ${escapeHTML(t.solo_new_game || '')}</button>`}
    </div>
    <p class="field__hint" style="text-align:center">${escapeHTML(s.phase === 'ready' ? (t.mines_first_tap || '') : (t.mines_hint || ''))}</p>
    </div>
    </div>
    ${s.race ? '' : `<div class="view-actions play-foot">
      <button class="btn btn--ghost btn--sm btn--auto play-exit" onclick="${s.phase === 'play' ? 'playExit(setupMines)' : 'setupMines()'}">${escapeHTML(t.exit || '')}</button>
    </div>`}`;

  // A patch opens as a ripple from the tap.
  if (opened && opened.length > 1 && !motionOff()) {
    const fr = Math.floor(from / s.cols), fc = from % s.cols;
    opened.forEach(k => {
      const cell = el.querySelector(`[data-i="${k}"]`);
      if (!cell || !cell.animate) return;
      const d = Math.max(Math.abs(Math.floor(k / s.cols) - fr), Math.abs(k % s.cols - fc));
      cell.animate([{ transform: 'scale(0.6)', opacity: 0.2 }, { transform: 'none', opacity: 1 }],
                   { duration: 260, delay: Math.min(d * 28, 420), easing: 'ease-out', fill: 'backwards' });
    });
  }
}

/**
 * ideas batch: solo - on a loss the other mines go off in a chain outward
 * from the one hit: each pops in with a flash, later the farther it is.
 * Drawn already (fill 'backwards'), so a cut animation leaves them shown.
 * Returns how long the chain takes.
 */
function minesChain(s, hit) {
  if (motionOff() || s.race) return 0;
  const hr = Math.floor(hit / s.cols), hc = hit % s.cols;
  let last = 0;
  (s.mines || []).forEach(k => {
    if (k === hit) return;
    const c = document.querySelector(`#mines-grid [data-i="${k}"]`);
    if (!c || !c.animate) return;
    const d = Math.max(Math.abs(Math.floor(k / s.cols) - hr), Math.abs(k % s.cols - hc));
    const delay = 200 + Math.min(d * 110, 1300);
    last = Math.max(last, delay + 380);
    c.animate([{ scale: '0.2', opacity: 0 }, { scale: '1.45', opacity: 1, offset: 0.45 }, { scale: '1', opacity: 1 }],
      { duration: 380, delay: delay, easing: 'ease-out', fill: 'backwards' });
    setTimeout(() => { if (c.isConnected) { c.classList.add('is-blown'); } }, delay);
  });
  return last;
}

/** The field shakes once: a mine went off. */
function minesShake() {
  const grid = document.getElementById('mines-grid');
  if (grid && grid.animate && !motionOff()) {
    grid.animate([{ transform: 'none' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-4px)' }, { transform: 'none' }], { duration: 380 });
  }
}

function minesLose(hit) {
  const s = minesState();
  const t = TRANSLATIONS[appState.lang];
  minesStopTimer();
  s.phase = 'lost';
  s.boom = hit;
  s.seconds = s.startedAt ? Math.round((Date.now() - s.startedAt) / 1000) : 0;
  saveToLocal();
  paintMines();
  haptic('heavy');
  minesShake();
  const chainMs = minesChain(s, hit);
  let share = '';
  if (s.daily) {
    soloMarkDaily('mines', { lost: true }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🚩 ${t.setup_mines || ''} 💥`;
  }
  // The sheet waits for the shake; a new board dealt meanwhile cancels it.
  soloLater('mines', motionOff() ? 0 : Math.max(900, chainMs + 500), () => soloResult({
    icon: '💥', title: t.mines_lost || '', valueText: '💣', valueLabel: '',
    lines: [escapeHTML(t.mines_lost_line || '')], win: false, share: share,
    again: () => startMines(false), exit: setupMines
  }));
}

function minesWin() {
  const s = minesState();
  const t = TRANSLATIONS[appState.lang];
  minesStopTimer();
  s.phase = 'won';
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  saveToLocal();
  paintMines();
  const level = s.playLevel || s.level;
  // A past day replayed from the archive is never a best.
  const rec = s.archive ? { record: false, prev: soloBest('mines', level) }
    : soloRecord('mines', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('mines', { seconds: seconds }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🚩 ${t.setup_mines || ''} ✅ ${soloTime(seconds)}`;
  }
  const lines = [];
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  soloLater('mines', motionOff() ? 0 : 400, () => soloResult({
    icon: '🚩', title: rec.record ? (t.solo_new_best || '') : (t.mines_won || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, win: true, share: share,
    again: () => startMines(false), exit: setupMines
  }));
}

function restoreMines() {
  const s = minesState();
  if ((s.phase !== 'play' && s.phase !== 'ready') || !s.open || !s.open.length) return false;
  paintMines();
  if (s.phase === 'play') minesArmTimer();
  return true;
}

soloRegister('mines', {
  setup: 'setup-mines', play: 'play-mines', paintSetup: paintMinesSetup, restore: restoreMines,
  state: minesState, resume: continueMines, repaint: () => paintMines(), timed: true, prefs: ['level']
});

/* --- سباق ألغاز: the same field, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.mines = {
  stage: 'mines-stage',
  unit: 'race_unit_cells',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', cols: pub.cols, rows: pub.rows, count: pub.count, mines: [], nums: {},
    open: new Array(pub.cols * pub.rows).fill(0), flags: new Array(pub.cols * pub.rows).fill(0), flagMode: false, boom: -1, seconds: 0, lastTap: -1 }),
  // What the server opened for this phone: the new cells ripple out from the tap; a mine shows every mine and shakes.
  sync(s, board, fx) {
    const b = board || {};
    const fresh = [];
    (b.open || []).forEach(o => { if (!s.open[o.i]) { s.open[o.i] = 1; s.nums[o.i] = o.n; s.flags[o.i] = 0; fresh.push(o.i); } });
    // The mine hit while the others race; the whole field (`all`) once the round is over.
    const had = (s.mines || []).length;
    if (typeof b.boom === 'number' && b.boom >= 0) { s.boom = b.boom; s.mines = (b.mines || []).slice(); s.minesAll = !!b.all; s.phase = 'done'; }
    if (!fresh.length && !(fx && fx.first) && s.mines.length !== had) paintMines();
    if (fresh.length || (fx && fx.first)) {
      const from = s.lastTap >= 0 ? s.lastTap : fresh[0];
      paintMines(fx && fx.first ? null : fresh, from);
      if (fresh.length && !(fx && fx.first)) haptic('light');
    }
  },
  paint: () => paintMines(),
  finished: (s, won) => { if (!won) { minesShake(); haptic('heavy'); } return 0; }
};
</script>
