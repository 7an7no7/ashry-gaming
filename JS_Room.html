<script>
/* ============================================================================
   MULTIPLAYER CLIENT
   ----------------------------------------------------------------------------
   Talks to the rooms server on Cloudflare (rooms-worker/). Creating and joining
   a room are plain requests. After that every phone keeps one WebSocket open
   to its room, and the room sends each phone what it may see the moment
   anything changes - nobody asks "anything new?" every few seconds.

     - A move goes over the socket, and its answer comes back on it.
     - A dropped connection (lock screen, WiFi to mobile data, a tunnel)
       reconnects by itself, and the room sends the current state on arrival.
     - On a network where WebSockets won't connect at all, the phone falls back
       to asking over plain HTTP every few seconds until one does.

   Games register a renderer with Room.onChange, so this file knows nothing
   about any particular game. The server's address is window.ROOMS_URL, set by
   tools/build-site.mjs (and by build-preview.mjs for local testing).
   ========================================================================= */

const Room = (() => {
  // v2 sessions carry the key the server issued to this phone. v1 sessions
  // were Apps Script rooms, which the new server has never heard of.
  const STORE_KEY = 'ashryRoom_v2';
  const OLD_STORE_KEY = 'ashryRoom_v1';

  const BASE = String(window.ROOMS_URL || '').replace(/\/+$/, '');
  const REQUEST_TIMEOUT = 12000;
  const ACK_TIMEOUT = 10000;
  const CONNECT_TIMEOUT = 8000;
  const HEARTBEAT_MS = 25000;        // a quiet socket is checked this often...
  const PONG_TIMEOUT = 6000;         // ...and replaced if it hasn't answered by then
  const RETRY_DELAYS = [300, 1000, 2000, 4000, 8000];
  const POLL_MS = 2500;              // the HTTP fallback's pace
  const OFFLINE_NOTICE_MS = 2000;    // a drop this short doesn't flash the sync dot

  const DROPPED = { gone: 'انتهت الغرفة', kicked: 'تمت إزالتك من الغرفة' };

  let session = null;      // { code, playerId, key, game }
  let state = null;        // last projection from the server
  // When each projection reached this phone, beside the server's time on it (serverNow): the
  // two together are the network's delay, whenever the screen gets round to drawing it.
  // The smallest gap seen for this room is the network's share at most: roomServerNow() reads by it.
  // A move's answer also gives a round trip (sent → answered): the server's time is then read
  // from its middle (`mid`), the smallest round trip seen kept - nearer the truth than `gap`,
  // which leans early by the network's one-way delay. الجرس stamps its presses with it.
  let clock = { code: '', gap: null, rtt: null, mid: null };
  const arrived = (s) => {
    if (s && typeof s === 'object') {
      s.receivedAt = Date.now();
      if (typeof s.serverNow === 'number') {
        const gap = s.receivedAt - s.serverNow;
        if (clock.code !== s.code) clock = { code: s.code, gap: gap, rtt: null, mid: null };
        else clock.gap = Math.min(clock.gap, gap);
      }
    }
    return s;
  };
  // An HTTP answer can land after the socket (opened meanwhile) already brought
  // something newer: never step back to an older version of the same room.
  const notOlder = (s) => !state || !s || state.code !== s.code ||
    typeof s.version !== 'number' || typeof state.version !== 'number' || s.version >= state.version;
  let heardAt = 0;         // when the server last answered, over either path
  let listeners = [];
  let liveListeners = [];
  let lastSignature = '';

  let socket = null;
  let retries = 0;
  let retryTimer = null;
  let connectTimer = null;
  let heartbeatTimer = null;
  let pongTimer = null;
  let offlineTimer = null;
  let pollTimer = null;
  let pollInFlight = false;
  let nextId = 1;
  const pending = new Map();   // ack id -> { resolve, reject, timer }

  /* --- persistence: survive a lock screen or an accidental reload --------- */
  const remember = () => {
    try {
      localStorage.removeItem(OLD_STORE_KEY);
      if (session) localStorage.setItem(STORE_KEY, JSON.stringify(session));
      else localStorage.removeItem(STORE_KEY);
    } catch (e) {}
  };
  const recall = () => {
    try {
      localStorage.removeItem(OLD_STORE_KEY);
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };

  /* --- HTTP: create, join, leave, and the fallback --------------------------- */

  /** POSTs to the rooms server and resolves with its answer ({ ok, ... }). */
  const request = async (path, body) => {
    if (!BASE) throw new Error(roomErrText('net'));
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(() => { if (controller) controller.abort(); }, REQUEST_TIMEOUT);
    let res;
    try {
      // text/plain keeps this a "simple" request: no CORS preflight round trip.
      res = await fetch(BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(body),
        signal: controller ? controller.signal : undefined
      });
    } catch (err) {
      throw new Error(roomErrText(err && err.name === 'AbortError' ? 'timeout' : 'net'));
    } finally {
      clearTimeout(timer);
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!data) throw new Error(roomErrText('net'));
    return data;
  };

  /* --- change notification ----------------------------------------------- */
  const signatureOf = (s) => !s ? '' :
      s.version + '|' + s.phase + '|' + s.players.map(p => p.id + (p.online ? '1' : '0')).join(',') +
      '|' + (s.screens || []).map(x => x.id + (x.online ? '1' : '0')).join(',') +
      // The host away long enough for anyone to move the game on (room.js): no move, but a change.
      (s.hostAway ? '|away' : '');

  const emit = (force) => {
    const sig = signatureOf(state);
    if (!force && sig === lastSignature) return;
    // The game's code loads with its chunk (JS_Lazy.html): the state is held
    // back until it has come, then everyone hears the latest one.
    if (state && state.game && typeof lzWait === 'function' &&
        lzWait(lzChunksOfRoom(state.game), () => emit(true), 'room')) return;
    lastSignature = sig;
    listeners.forEach(fn => { try { fn(state); } catch (e) { console.error('room listener', e); } });
  };

  const handleDropped = (message) => {
    const wasIn = !!session;
    session = null; state = null; lastSignature = '';
    disconnect();
    failPending(message);
    remember();
    if (typeof updateRoomBanner === 'function') updateRoomBanner();
    if (wasIn) {
      showToast(roomErrLocal(message), 'error');
      emit(true);
      // Only from a room screen: someone playing a one-phone game or using a timer
      // meanwhile stays put (setView would stop that game's clocks).
      if (String(appState.currentView || '').indexOf('room-') === 0) setView('menu');
    }
  };

  /* --- the live connection ------------------------------------------------- */
  const connected = () => !!socket && socket.readyState === 1;

  const send = (msg) => {
    if (!connected()) return false;
    try {
      socket.send(typeof msg === 'string' ? msg : JSON.stringify(msg));
      return true;
    } catch (e) {
      return false;
    }
  };

  const socketUrl = () => BASE.replace(/^http/i, 'ws') + '/ws?code=' + encodeURIComponent(session.code) +
      '&pid=' + encodeURIComponent(session.playerId) + '&key=' + encodeURIComponent(session.key);

  function connect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    if (!session || !BASE || socket) return;
    let ws;
    try { ws = new WebSocket(socketUrl()); } catch (e) { scheduleReconnect(); return; }
    socket = ws;
    clearTimeout(connectTimer);
    connectTimer = setTimeout(() => { if (socket === ws && ws.readyState !== 1) dropSocket(ws); }, CONNECT_TIMEOUT);

    ws.onopen = () => {
      if (socket !== ws) return;
      clearTimeout(connectTimer);
      retries = 0;
      stopPolling();
      clearTimeout(offlineTimer);
      offlineTimer = null;
      setSyncing(false);
      roomNetNotice(false);
      startHeartbeat();
    };
    ws.onmessage = (event) => { if (socket === ws) onMessage(event.data); };
    ws.onclose = () => dropSocket(ws);
    ws.onerror = () => {};     // a close always follows
  }

  /** Forgets a socket that died, fails the moves waiting on it, and tries again. */
  function dropSocket(ws) {
    if (socket !== ws) return;
    socket = null;
    clearTimeout(connectTimer);
    stopHeartbeat();
    try { ws.onopen = ws.onmessage = ws.onclose = null; ws.close(); } catch (e) {}
    failPending('انقطع الاتصال، حاول مرة أخرى');
    if (!session) return;
    if (!offlineTimer) {
      offlineTimer = setTimeout(() => {
        offlineTimer = null;
        if (session && !connected()) { setSyncing(true); roomNetNotice(true); }
      }, OFFLINE_NOTICE_MS);
    }
    scheduleReconnect();
  }

  function scheduleReconnect() {
    if (!session || retryTimer) return;
    // A hidden page waits: coming back to the screen reconnects at once.
    if (document.hidden) return;
    const delay = RETRY_DELAYS[Math.min(retries, RETRY_DELAYS.length - 1)];
    retries++;
    // Missed twice: keep the game moving over HTTP while the socket retries.
    if (retries >= 2) startPolling();
    retryTimer = setTimeout(() => { retryTimer = null; connect(); }, delay);
  }

  function disconnect() {
    clearTimeout(retryTimer);
    retryTimer = null;
    clearTimeout(offlineTimer);
    offlineTimer = null;
    clearTimeout(connectTimer);
    stopPolling();
    stopHeartbeat();
    retries = 0;
    const ws = socket;
    socket = null;
    if (ws) { try { ws.onopen = ws.onmessage = ws.onclose = null; ws.close(1000); } catch (e) {} }
  }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(() => ping(PONG_TIMEOUT), HEARTBEAT_MS);
  }

  function stopHeartbeat() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    clearTimeout(pongTimer);
    pongTimer = null;
  }

  /**
   * Asks for a "pong" (Cloudflare answers it without waking the room). A socket
   * that doesn't answer in time is replaced - after a lock screen a phone can
   * hold a socket that looks open but is long dead.
   */
  function ping(timeout) {
    const ws = socket;
    if (!ws || ws.readyState !== 1 || pongTimer) return;
    if (!send('ping')) { dropSocket(ws); return; }
    pongTimer = setTimeout(() => {
      pongTimer = null;
      dropSocket(ws);
    }, timeout);
  }

  function onMessage(raw) {
    if (raw === 'pong') {
      clearTimeout(pongTimer);
      pongTimer = null;
      return;
    }
    let msg;
    try { msg = JSON.parse(raw); } catch (e) { return; }
    if (!msg || !session) return;
    heardAt = Date.now();

    if (msg.t === 'state') {
      state = arrived(msg.state);
      emit(false);
    } else if (msg.t === 'strokes') {
      applyStrokes(msg);
    } else if (msg.t === 'ack') {
      settleAck(msg);
    } else if (msg.t === 'live') {
      liveListeners.forEach(fn => { try { fn(msg.d); } catch (e) { console.error('room live listener', e); } });
    } else if (msg.t === 'gone') {
      handleDropped(DROPPED.gone);
    } else if (msg.t === 'kicked' || msg.t === 'left') {
      handleDropped(DROPPED.kicked);
    }
  }

  /**
   * New strokes arrive as just the strokes, so a drawing isn't resent to every
   * phone several times a second. They only fit onto the exact version they
   * were cut from; anything else asks the room for a full copy.
   */
  function applyStrokes(patch) {
    const strokes = state && state.shared && state.shared.strokes;
    if (state && state.version === patch.from && Array.isArray(strokes)) {
      patch.add.forEach(st => strokes.push(st));
      state.version = patch.v;
      emit(false);
      return;
    }
    send({ t: 'sync' });
  }

  function settleAck(msg) {
    if (msg.patch) applyStrokes(msg.patch);
    else if (msg.state) { state = arrived(msg.state); timeRoundTrip(pending.get(msg.id), msg.state); emit(false); }

    const waiter = pending.get(msg.id);
    if (!waiter) return;
    pending.delete(msg.id);
    clearTimeout(waiter.timer);
    if (msg.ok) { waiter.resolve(state); return; }
    if (msg.gone || msg.kicked) handleDropped(msg.gone ? DROPPED.gone : DROPPED.kicked);
    waiter.reject(roomError(msg.error || roomErrText('action')));
  }

  /** A move's round trip: the server's clock is read from its middle (the shortest trip kept). */
  function timeRoundTrip(waiter, s) {
    if (!waiter || !waiter.sentAt || !s || typeof s.serverNow !== 'number' || clock.code !== s.code) return;
    const rtt = s.receivedAt - waiter.sentAt;
    if (!(rtt >= 0) || (clock.rtt !== null && rtt >= clock.rtt)) return;
    clock.rtt = rtt;
    clock.mid = s.receivedAt - s.serverNow - rtt / 2;
  }

  function failPending(message, quiet) {
    pending.forEach(w => {
      clearTimeout(w.timer);
      const err = roomError(message);
      if (quiet) err.quiet = true;
      w.reject(err);
    });
    pending.clear();
  }

  /* --- HTTP fallback, only while the socket can't connect ------------------ */
  function startPolling() {
    if (pollTimer || !session) return;
    const tick = async () => {
      pollTimer = setTimeout(tick, POLL_MS);
      if (!session || connected() || pollInFlight || document.hidden) return;
      pollInFlight = true;
      try {
        const res = await request('/poll', {
          code: session.code, pid: session.playerId, key: session.key, v: state ? state.version : 0
        });
        if (!session || connected()) return;
        heardAt = Date.now();
        if (res.gone) { handleDropped(DROPPED.gone); return; }
        if (res.kicked) { handleDropped(DROPPED.kicked); return; }
        if (res.same && state) {
          // A computer player has no phone to lose (the server always shows it
          // here), and a big screen's presence decides who plays the table's sounds.
          state.players.forEach(p => { p.online = !!p.bot || res.online.indexOf(p.id) !== -1; });
          (state.screens || []).forEach(x => { x.online = res.online.indexOf(x.id) !== -1; });
          // The host away (room.js): no move, but the stand-ins' buttons open or close.
          if (typeof res.hostAway === 'boolean') state.hostAway = res.hostAway;
        } else if (res.state && res.state.code === session.code && notOlder(res.state)) {
          // A poll sent before a move over /act can answer after it: never step back to its older state.
          state = arrived(res.state);
        }
        setSyncing(false);
        roomNetNotice(false);     // moving again over HTTP: nothing is lost
        emit(false);
      } catch (e) {
        // Still offline; the socket and this both keep trying.
      } finally {
        pollInFlight = false;
      }
    };
    pollTimer = setTimeout(tick, 0);
  }

  function stopPolling() {
    clearTimeout(pollTimer);
    pollTimer = null;
  }

  const adoptSession = (res, game) => {
    const old = session;
    disconnect();
    // A move still waiting on the old room's socket is let go without a word:
    // its answer would never come, and it is not this room's.
    failPending('', true);
    // Opening or joining a room while in another one leaves the old one properly,
    // or it kept a ghost seat (and, for a host, two minutes before handing over).
    if (old && old.code && old.playerId && old.playerId !== res.playerId) {
      request('/leave', { code: old.code, pid: old.playerId, key: old.key }).catch(() => {});
    }
    session = { code: res.state.code, playerId: res.playerId, key: res.key, game: game };
    state = arrived(res.state);
    lastSignature = '';
    remember();
    emit(true);
    connect();
  };

  /* --- public API --------------------------------------------------------- */
  return {
    get state() { return state; },
    get session() { return session; },
    get isIn() { return !!session; },
    get isHost() { return !!(state && state.youAreHost); },
    get isScreen() { return !!(state && state.youAreScreen); },
    get me() { return session ? session.playerId : null; },
    get connected() { return connected(); },
    /** The room this device was last in, as saved, before resume() has run. */
    get saved() { const s = recall(); return s && s.code && s.playerId && s.key ? s : null; },
    // A socket can look open after the phone slept and still be dead; this is
    // when something actually came back (JS_RoomTurn.html waits on it).
    get heardAt() { return heardAt; },
    /** This phone's clock less the server's, as closely as the answers so far show it (0 before any). */
    get clockGap() { return state && clock.code === state.code && clock.gap !== null ? clock.gap : 0; },
    /** The same, read from the middle of a timed round trip once a move has made one (null before). */
    get clockMid() { return state && clock.code === state.code && clock.mid !== null ? clock.mid : null; },

    onChange(fn) { listeners.push(fn); return () => { listeners = listeners.filter(f => f !== fn); }; },

    /** Messages the room relays between phones without keeping (the line being drawn). */
    onLive(fn) { liveListeners.push(fn); return () => { liveListeners = liveListeners.filter(f => f !== fn); }; },
    sendLive(data) { return send({ t: 'live', d: data }); },

    /** `screen`: this device shows the room on a big screen instead of playing in it. */
    async create(name, gameId, screen) {
      const res = await request('/create', { name: name, game: gameId || null, screen: !!screen });
      if (!res.ok) throw roomError(res.error || roomErrText('create'));
      adoptSession(res, gameId);
      return res;
    },

    async join(code, name, screen) {
      const res = await request('/join', { code: String(code || '').trim().toUpperCase(), name: name, screen: !!screen });
      if (!res.ok) throw roomError(res.error || roomErrText('join'));
      adoptSession(res, res.state.game);
      return res;
    },

    /** Send a move. The server is authoritative: this resolves with the state after it. */
    act(action, payload) {
      if (!session) return Promise.reject(new Error(roomErrText('noroom')));

      if (connected()) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(roomErrText('timeout')));
            ping(3000);
          }, ACK_TIMEOUT);
          pending.set(id, { resolve, reject, timer, sentAt: Date.now() });
          if (!send({ t: 'act', id: id, action: action, payload: payload || {} })) {
            pending.delete(id);
            clearTimeout(timer);
            reject(new Error(roomErrText('lost')));
          }
        });
      }

      // No socket right now: the same move over plain HTTP.
      const { code, playerId, key } = session;
      return request('/act', { code: code, pid: playerId, key: key, action: action, payload: payload || {} })
        .then(res => {
          if (res.gone || res.kicked) {
            handleDropped(res.gone ? DROPPED.gone : DROPPED.kicked);
            throw roomError(res.gone ? DROPPED.gone : DROPPED.kicked);
          }
          if (!res.ok) throw roomError(res.error || roomErrText('action'));
          // A late answer from a room this phone has since left is not this room's state.
          if (res.state && session && res.state.code === session.code && notOlder(res.state)) { state = arrived(res.state); emit(false); }
          connect();
          return state;
        });
    },

    async leave() {
      if (!session) return;
      const { code, playerId, key } = session;
      session = null; state = null; lastSignature = '';
      disconnect();
      failPending('لست في غرفة');
      remember();
      emit(true);
      if (typeof updateRoomBanner === 'function') updateRoomBanner();
      try { await request('/leave', { code: code, pid: playerId, key: key }); } catch (e) {}
    },

    /**
     * Leaves the room saved on this device without rejoining it first: a link
     * to a different room was opened. Uses the key stored with it.
     */
    async leaveSaved() {
      if (session) return this.leave();
      const saved = recall();
      if (!saved) return;
      remember();                      // session is null: forgets the saved one
      if (!saved.code || !saved.playerId || !saved.key) return;
      try { await request('/leave', { code: saved.code, pid: saved.playerId, key: saved.key }); } catch (e) {}
    },

    /** Called on load: silently rejoin the room this device was last in. */
    async resume() {
      const saved = recall();
      if (!saved || !saved.code || !saved.playerId || !saved.key) return false;
      session = saved;
      try {
        const res = await request('/poll', { code: saved.code, pid: saved.playerId, key: saved.key, v: 0 });
        if (session !== saved) return false;
        if (!res.ok || res.gone || res.kicked || !res.state) {
          session = null;
          remember();
          return false;
        }
        if (notOlder(res.state)) {
          state = arrived(res.state);
          emit(true);
        }
        connect();
        return true;
      } catch (err) {
        // No connection right now. The room may well still be there, so keep
        // the session and let the socket keep trying; the state arrives with it.
        if (session === saved) connect();
        return false;
      }
    },

    /** Catch up now: the screen woke, the network came back, or something looks stale. */
    refresh() {
      if (!session) return;
      if (connected()) {
        send({ t: 'sync' });
        ping(3000);
      } else if (!socket) {
        connect();
      }
    }
  };
})();

/** The server's time now, read on this phone: a room's endsAt is compared with this,
    never with Date.now(), or a phone whose clock is off shows the wrong time left. */
function roomServerNow() {
  return Date.now() - Room.clockGap;
}

// A phone that wakes up, or gets its network back, catches up at once.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Room.isIn) Room.refresh();
});
window.addEventListener('online', () => { if (Room.isIn) Room.refresh(); });
window.addEventListener('pageshow', (event) => { if (event.persisted && Room.isIn) Room.refresh(); });

/* ==========================================================================
   QR CODE
   --------------------------------------------------------------------------
   Rendered locally from the join URL. If the library fails to load the code is
   simply not drawn — the 4-letter room code is always shown as well and is
   usually the faster way in anyway.
   ========================================================================== */
function renderJoinQR(containerId, url) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  if (!url || typeof qrcode === 'undefined') { el.classList.add('hidden'); return; }
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    el.classList.remove('hidden');
  } catch (err) {
    el.classList.add('hidden');
  }
}

/* ==========================================================================
   LOBBY UI
   --------------------------------------------------------------------------
   Generic: creating a room, joining one, showing who's in and handing off to
   the game once the host starts. Each game supplies its own lobby options and
   its own start payload through ROOM_GAMES.
   ========================================================================== */

/** Registered per game in its own JS_*.html file. */
const ROOM_GAMES = {};

/* --- clocks the room screens run ----------------------------------------------
   A game's countdown (and what it does at zero: a sound, "giveUp", "timeUp")
   belongs to one deal of one game. Each game registers how to stop its clocks,
   and they all stop when the room leaves that deal: another game, back to the
   hub, a new deal (shared.dealId), or no room at all. A clock's own onEnd still
   checks that the room is on its game, for the moment in between. */
const ROOM_CLOCK_STOPS = [];
function onRoomClocksReset(fn) { if (typeof fn === 'function') ROOM_CLOCK_STOPS.push(fn); }
function stopRoomClocks() {
  ROOM_CLOCK_STOPS.forEach(fn => { try { fn(); } catch (e) { console.warn('room clock', e); } });
}
/** The deal a clock belongs to: the game, lobby or not, and the server's deal id. */
const roomClockStage = (state) => !state ? '' :
  [state.game || '', state.phase === 'lobby' ? 'lobby' : 'game', (state.shared && state.shared.dealId) || ''].join('|');

/** A per-deal key for "already sent / already seen": the deal id, else what the game had before. */
function roomDealKey(state, fallback) {
  const deal = state && state.shared && state.shared.dealId;
  return (deal ? deal + '#' : '') + (state ? state.code : '') + '#' + (fallback === undefined ? '' : fallback);
}

/* --- when the host is away -----------------------------------------------------
   The owner, 28 Sep 2026: once the host has been gone 20 seconds (a locked
   phone), anyone at the table may press the host's "move on" buttons - the next
   round, closing a vote, playing for a quiet phone - so the table never freezes;
   the host stays the host, and the room is handed on only after 2 minutes. The
   server decides (state.hostAway, room.js; requireHost in RoomGames.js). */

/** True when this phone may press the host's "move on" buttons. */
function roomCanMoveOn(state) {
  return !!(state && (state.youAreHost || state.hostAway));
}

/**
 * A host's "move on" control. The host gets it as ever; everyone else gets it
 * drawn but hidden, shown only while the host is away (body.room-host-away, set
 * from every state), so no frame is redrawn - and nothing half-typed lost - when
 * that changes. `orElse` is what a non-host sees the rest of the time (a waiting
 * line). A button that fires when the host is back is simply refused.
 */
function roomMoveOnHtml(state, html, orElse) {
  if (!state || state.youAreHost) return html || '';
  if (!html) return orElse || '';
  return `<span class="room-moveon">${html}</span>` + (orElse ? `<span class="room-moveon-not">${orElse}</span>` : '');
}

/** The body class and the line that say so, on a phone's room screens and the TV. */
function paintRoomHostAway(state) {
  const away = !!(state && state.hostAway && !state.youAreHost && state.phase !== 'lobby');
  document.body.classList.toggle('room-host-away', away);
  let note = document.getElementById('room-host-away');
  if (!away) { if (note) note.hidden = true; return; }
  if (!note) {
    note = document.createElement('div');
    note.id = 'room-host-away';
    note.className = 'room-host-away-note';
    note.setAttribute('role', 'status');
    document.body.appendChild(note);
  }
  const t = TRANSLATIONS[appState.lang] || {};
  note.textContent = t.room_host_away || 'المضيف مش متصل - أي حد يقدر يكمّل';
  note.hidden = false;
}

/**
 * The room can't be reached (the socket dropped and polling fails too): a line under the
 * header says so, where the host-away note sits, so a player doesn't tap into moves that
 * fail. It goes the moment the socket or a poll gets through. Not a toast: it lasts as
 * long as the trouble does.
 */
function roomNetNotice(on) {
  const show = !!on && typeof Room !== 'undefined' && Room.isIn;
  document.body.classList.toggle('room-offline', show);
  let note = document.getElementById('room-net');
  if (!show) { if (note) note.hidden = true; return; }
  if (!note) {
    note = document.createElement('div');
    note.id = 'room-net';
    note.className = 'room-host-away-note room-net-note';
    note.setAttribute('role', 'status');
    document.body.appendChild(note);
  }
  const t = TRANSLATIONS[appState.lang] || {};
  note.textContent = '🔄 ' + (t.room_reconnecting || 'النت قطع… بنرجّع الاتصال');
  note.hidden = false;
}
Room.onChange(() => { if (!Room.isIn) roomNetNotice(false); });
// The note is written once when the trouble starts: a language change rewrites it.
if (typeof onLanguageChange === 'function') onLanguageChange(() => {
  const note = document.getElementById('room-net');
  if (note && !note.hidden) roomNetNotice(true);
});

/** The host removes a player whose phone has gone (the server refuses anyone still here). */
function roomKick(playerId) {
  const state = Room.state;
  const p = state && (state.players || []).find(x => x.id === playerId);
  if (!p || !state.youAreHost || p.online || p.id === Room.me) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const msg = (t.room_kick_confirm || (appState.lang === 'en' ? 'Remove {name} from the room? They can join again with the code.' : 'تشيل {name} من الغرفة؟ يقدر يدخل تاني بالكود.'))
    .replace('{name}', p.name);
  showConfirmModal(msg, () => roomAct('kick', { playerId: playerId }));
}

/**
 * The host's menu on a name (the owner, 24 Sep 2026: tap a name, then a menu):
 * «👑 المضيف يبقى …» for someone here, and taking out a phone that is gone.
 * Another person's name is a button for the host only; everyone else's names
 * stay plain text.
 */
function roomCanMenu(state, p) {
  return !!(state && state.youAreHost && p && !p.bot && p.id !== Room.me);
}

/** A name, as a button that opens the host's menu when it may; plain text otherwise. */
/** A room message the phone itself says (no connection, a missing code…), in the app's language. */
function roomErrText(key) {
  const k = 'room_err_' + key;
  return (TRANSLATIONS[appState.lang] || {})[k] || TRANSLATIONS.ar[k] || key;
}

function roomErrLocal(text) {

  return ROOM_ERR_EN[s] || (TRANSLATIONS.en && TRANSLATIONS.en.room_err_generic) || "That can't be done right now";
}
function roomError(text) {
  const err = new Error(roomErrLocal(text));
  err.raw = String(text == null ? '' : text);
