<script>
/* ============================================================================
   مافيا — ON SEPARATE PHONES, AND ON THE TV
   ----------------------------------------------------------------------------
   The app narrates. Each phone holds its role on a card you press to see.
   At night every living phone taps a name, whatever its role, so nobody can
   tell who acted: the Mafia pick who leaves (and see each other's picks), the
   Doctor protects, the Detective checks, everyone else marks a suspect. The
   morning says who left, then the discussion clock, then the vote. Rules and
   everything a phone must not know: mafiaAction in RoomGames.js.

   At night a phone glanced at across the table gives nothing away: every
   living phone shows the same heading, the same list (everyone still in) and
   the same buttons. What the role knows - its task, the Mafia's picks, the
   Lawyer's list, the Detective's answers, the Doctor's last save - is only on
   the back of the hold card. A tap the rules refuse for that role (the Mafia
   on one of their own, a second check) simply does nothing, with no message.
   ========================================================================= */

const MAFIA_OPTS_KEY = 'ashryMafiaOpts';
const MAFIA_ICONS = { mafia: '🕴️', citizen: '🧑', doctor: '🩺', detective: '🔍', lawyer: '💼' };
const mafiaLocal = { clock: null, clockKey: null };

function mafiaOpts() {
  // narrate is off until the owner has heard it on a real phone.
  const base = { mode: 'classic', revealRoles: false, narrate: false, discuss: 3, night: 45 };
  try {
    const saved = JSON.parse(localStorage.getItem(MAFIA_OPTS_KEY) || 'null') || {};
    if (saved.mode === 'roles' || saved.mode === 'classic') base.mode = saved.mode;
    if (typeof saved.revealRoles === 'boolean') base.revealRoles = saved.revealRoles;
    if (typeof saved.narrate === 'boolean') base.narrate = saved.narrate;
    if ([2, 3, 5].indexOf(saved.discuss) !== -1) base.discuss = saved.discuss;
    if ([30, 45, 60].indexOf(saved.night) !== -1) base.night = saved.night;
  } catch (e) {}
  return base;
}

function setMafiaOpt(key, value) {
  const o = mafiaOpts();
  o[key] = key === 'mode' ? value : (key === 'revealRoles' || key === 'narrate' ? !!value : Number(value));
  try { localStorage.setItem(MAFIA_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

/** Must match mafiaCount and mafiaRoles in RoomGames.js. */
const mafiaCountFor = (n) => (n <= 6 ? 1 : n <= 9 ? 2 : 3);
function mafiaRoleSummary(n, mode, t) {
  const bits = [`${mafiaCountFor(n)} ${MAFIA_ICONS.mafia} ${t.mafia_role_mafia || ''}`];
  if (mode === 'roles') {
    bits.push(`${MAFIA_ICONS.doctor} ${t.mafia_role_doctor || ''}`, `${MAFIA_ICONS.detective} ${t.mafia_role_detective || ''}`);
    if (n >= 6) bits.push(`${MAFIA_ICONS.lawyer} ${t.mafia_role_lawyer || ''}`);
  }
  return bits.join(' · ');
}

const mafiaRoleName = (role, t) => `${MAFIA_ICONS[role] || ''} ${t['mafia_role_' + role] || ''}`;

function mafiaClockText(endsAt) {
  const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  return `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
}

function mafiaTickClock(s) {
  const paint = () => {
    const text = s.endsAt ? mafiaClockText(s.endsAt) : '';
    ['mafia-clock', 'tv-mafia-clock'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = text; });
  };
  paint();
  if (!s.endsAt) { mafiaStopClock(); return; }
  if (mafiaLocal.clockKey === s.endsAt && mafiaLocal.clock) return;
  mafiaStopClock();
  mafiaLocal.clockKey = s.endsAt;
  mafiaLocal.clock = createClock({ seconds: Math.max(1, Math.ceil((s.endsAt - Date.now()) / 1000)), onTick: paint, onEnd: paint });
}

function mafiaStopClock() {
  if (mafiaLocal.clock) mafiaLocal.clock.stop();
  mafiaLocal.clock = null;
  mafiaLocal.clockKey = null;
}
onRoomClocksReset(mafiaStopClock);

/** The vote's "nobody" option, said in this phone's language. */
function mafiaVoteState(state) {
  const t = TRANSLATIONS[appState.lang];
  const v = state.shared.vote;
  if (!v) return state;
  const label = (o) => (o.id === 'nobody' ? `🤷 ${t.mafia_nobody || ''}` : o.label);
  const vote = Object.assign({}, v, {
    options: (v.options || []).map(o => Object.assign({}, o, { label: label(o) })),
    results: v.results ? v.results.map(r => Object.assign({}, r, { label: label(r) })) : v.results
  });
  return Object.assign({}, state, { shared: Object.assign({}, state.shared, { vote: vote }) });
}

function mafiaNewsHtml(state, t) {
  const s = state.shared;
  const n = s.news;
  if (!n) return '';
  if (n.kind === 'saved') return `<div class="card mafia-news"><div class="metric metric--md">🩺</div><p class="sheet__subtitle">${escapeHTML(t.mafia_news_saved || '')}</p></div>`;
  if (n.kind === 'quiet') return `<div class="card mafia-news"><div class="metric metric--md">😴</div><p class="sheet__subtitle">${escapeHTML(t.mafia_news_quiet || '')}</p></div>`;
  if (n.kind === 'tie' || n.kind === 'nobody') return `<div class="card mafia-news"><div class="metric metric--md">🤝</div><p class="sheet__subtitle">${escapeHTML(n.kind === 'tie' ? (t.mafia_news_tie || '') : (t.mafia_news_nobody || ''))}</p></div>`;
  const cover = spyRevealParts(['mafia', state.code, s.dealId || '', s.night, s.day, n.kind, n.id].join('|'), n.kind === 'voted' ? t.mafia_reveal_voted : t.mafia_reveal_night);
  return `<div class="card mafia-news ${n.role === 'mafia' ? 'is-mafia' : ''} ${cover.cls}" ${cover.attrs}>${cover.cover}
      <div class="metric metric--md">${n.kind === 'voted' ? '🗳️' : '🌅'}</div>
      <p class="sheet__subtitle">${escapeHTML((n.kind === 'voted' ? (t.mafia_out_voted || '') : (t.mafia_out_night || '')).replace('{name}', n.name || ''))}</p>
      <p class="mafia-news__role">${escapeHTML(t.mafia_was || '')}: ${escapeHTML(mafiaRoleName(n.role, t))}</p>
    </div>`;
}

function mafiaPeopleHtml(state, t) {
  const s = state.shared;
  const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
  return `
    <div class="card card--tight">
      <div class="eyebrow">${escapeHTML(t.mafia_still_in || '')} · <span class="metric">${(s.alive || []).length}</span></div>
      <div class="chip-set">${(s.alive || []).map(id => `<span class="chip chip--plain">${escapeHTML(nameOf(id))}</span>`).join('')}</div>
      ${(s.out || []).length ? `
        <div class="eyebrow" style="margin-top: var(--sp-3)">${escapeHTML(t.mafia_out || '')}</div>
        <div class="chip-set">${s.out.map(o => `<span class="chip chip--plain is-away">${MAFIA_ICONS[o.role] || ''} ${escapeHTML(o.name)}</span>`).join('')}</div>` : ''}
    </div>`;
}

/**
 * The role on a card that shows only while pressed. The back is also where
 * the night's private information lives (mafiaSecretHtml); it is refreshed in
 * place (refreshMafiaSecret), so a teammate changing their pick doesn't turn
 * the card over under a finger.
 */
function mafiaRoleCardHtml(state, t) {
  const you = state.you || {};
  if (!you.role) return '';
  return `
    <div class="hold-card mafia-hold" role="button" tabindex="0">
      <div class="hold-card__front">
        <span class="hold-card__icon" aria-hidden="true">👆</span>
        <span class="hold-card__label">${escapeHTML(t.hold_to_reveal || '')}</span>
        <span class="hold-card__hint">${escapeHTML(t.hold_hint || '')}</span>
      </div>
      <div class="hold-card__back" aria-hidden="true" data-mafia-back>${mafiaSecretHtml(state, t)}</div>
    </div>`;
}

const mafiaNameOf = (state, id) => (state.players.find(p => p.id === id) || {}).name || '…';

/** What only this role knows, for the back of the hold card. At night: its task and its night's information. */
function mafiaSecretHtml(state, t) {
  const s = state.shared || {};
  const you = state.you || {};
  const role = you.role;
  if (!role) return '';
  const night = s.phase === 'night' && (s.alive || []).indexOf(Room.me) !== -1;
  const names = (list) => list.map(escapeHTML).join('، ');
  const team = (you.mafia || []).filter(m => m.id !== Room.me).map(m => m.name);
  const lines = [];
  if (role === 'mafia') lines.push(team.length ? `${escapeHTML(t.mafia_your_team || '')}: ${names(team)}` : escapeHTML(t.mafia_alone || ''));
  if (role === 'lawyer') lines.push(`💼 ${escapeHTML(t.mafia_lawyer_knows || '')}: ${names((you.mafia || []).map(m => m.name))}`);
  if (night && role === 'mafia') {
    const picks = (you.picks || []).filter(p => p.byId !== Room.me);
    if (picks.length) lines.push(picks.map(p => `${escapeHTML(p.by)} ← ${escapeHTML(p.name)}`).join(' · '));
  }
  if (night && role === 'doctor' && you.lastSave) {
    const fallback = appState.lang === 'en' ? 'Not {name} again tonight' : 'مش {name} تاني الليلة دي';
    lines.push(`🚫 ${escapeHTML((t.mafia_last_save || fallback).replace('{name}', mafiaNameOf(state, you.lastSave)))}`);
  }
  if (role === 'detective' && (you.checks || []).length) {
    // Tonight's answer first and in words; the nights before as a short list.
    const tonight = night && you.pick ? (you.checks || []).filter(c => c.id === you.pick).slice(-1)[0] : null;
    if (tonight) lines.push(`${tonight.mafia ? '🕴️' : '✅'} ${escapeHTML((tonight.mafia ? (t.mafia_check_yes || '') : (t.mafia_check_no || '')).replace('{name}', tonight.name))}`);
    const before = (you.checks || []).filter(c => c !== tonight);
    if (before.length) lines.push(before.map(c => `${c.mafia ? '🕴️' : '✅'} ${escapeHTML(c.name)}`).join(' · '));
  }
  const task = { mafia: t.mafia_task_mafia, doctor: t.mafia_task_doctor, detective: t.mafia_task_detective }[role] || t.mafia_task_suspect;
  const text = night ? (task || '') : (t['mafia_desc_' + role] || '');
  return `
    <span class="mafia-role__icon" aria-hidden="true">${MAFIA_ICONS[role] || ''}</span>
    <b class="mafia-role__name">${escapeHTML(t['mafia_role_' + role] || '')}</b>
    <span class="mafia-role__desc">${escapeHTML(text)}</span>
    ${lines.map(l => `<span class="mafia-role__extra">${l}</span>`).join('')}`;
}

/** Puts the latest private information on the card without rebuilding the screen. */
function refreshMafiaSecret(root, state, t) {
  const back = root && root.querySelector('[data-mafia-back]');
  if (!back) return;
  const html = mafiaSecretHtml(state, t);
  if (back._mafiaHtml !== html) { back.innerHTML = html; back._mafiaHtml = html; }
}

/**
 * The night on a living phone. The same on every one of them: the heading,
 * everyone still in the game (yourself last), the same buttons.
 */
function mafiaNightHtml(state, t) {
  const s = state.shared;
  const you = state.you || {};
  const alive = (s.alive || []).indexOf(Room.me) !== -1;
  if (!alive || !you.role) {
    return `<div class="card mafia-night" style="text-align:center"><div class="metric metric--lg">🌙</div><p class="sheet__subtitle">${escapeHTML(t.mafia_city_sleeps || '')}</p></div>`;
  }
  const targets = (s.alive || []).filter(id => id !== Room.me).concat([Room.me]);
  const heading = t.mafia_night_pick || (appState.lang === 'en' ? 'Tap a name. What it does is on your card.' : 'اختار اسم. اللي بيعمله اختيارك مكتوب في كارتك.');
  const picked = t.mafia_night_picked || (appState.lang === 'en' ? 'Your pick is in.' : 'اختيارك اتسجل.');
  return `
    <div class="card mafia-night">
      <div class="mafia-night__task">🌙 ${escapeHTML(heading)}</div>
      <div class="mafia-targets">
        ${targets.map(id => `<button type="button" class="mafia-target${you.pick === id ? ' is-on' : ''}" onclick="mafiaNightTap('${jsStringAttr(id)}')">
            ${escapeHTML(mafiaNameOf(state, id))}${id === Room.me ? ` <span class="badge">${escapeHTML(t.vote_you || '')}</span>` : ''}</button>`).join('')}
      </div>
      <p class="field__hint" style="text-align:center">${you.pick ? '✓ ' + escapeHTML(picked) : '&nbsp;'}</p>
    </div>`;
}

/**
 * A night tap. What the rules refuse for this role (the Mafia on one of their
 * own, the Detective's second check or themselves, the Doctor's last save) is
 * dropped here without a word: an error on screen would say the role out loud.
 */
function mafiaNightTap(id) {
  const st = Room.state;
  const s = st && st.game === 'mafia' && st.shared;
  if (!s || s.phase !== 'night') return;
  const you = st.you || {};
  const mafiaIds = (you.mafia || []).map(m => m.id);
  if (you.role === 'mafia' && (id === Room.me || mafiaIds.indexOf(id) !== -1)) return;
  if (you.role === 'detective' && (id === Room.me || you.pick)) return;
  if (you.role === 'doctor' && id === you.lastSave) return;
  if (you.pick === id) return;
  // A failure says only that it failed: the server's reason can name the role.
  Room.act('nightPick', { target: id }).catch(() => {
    const t = TRANSLATIONS[appState.lang] || {};
    showToast(t.room_action_failed || (appState.lang === 'en' ? "That didn't go through, try again" : 'ماوصلش، جرّب تاني'), 'error');
  });
}

/**
 * Night falls and morning comes over about a second, on a layer of its own so
 * nothing else on the screen repaints. The layer is kept across rebuilds - the
 * frame is rewritten whenever a vote count changes, and a cross-fade that
 * restarted every time would flicker.
 */
function mafiaSky(root, phase) {
  if (!root) return;
  let sky = root.querySelector('.mafia-sky');
  if (!sky) {
    sky = document.createElement('div');
    sky.className = 'mafia-sky';
    root.insertBefore(sky, root.firstChild);
  }
  const night = phase === 'night' || phase === 'roles';
  const day = phase === 'day' || phase === 'dayResult' || phase === 'voting';
  sky.classList.toggle('mafia-sky--day', day);
  sky.classList.toggle('is-on', night || day);
}

/* --- the narrator --------------------------------------------------------- */
/*
   An option, off by default (the owner, 20 Sep 2026): when it is on, one
   device in the room reads a short line at each change of phase - the town
   falling asleep, the morning news, the vote. The lines are about the room,
   never about a role: this is the one thing the narrator must not do, so the
   only names it ever says are ones already printed on every screen.
*/
const mafiaSaid = { key: '' };

/**
 * Whether this device is the one that speaks. The big screen if there is one -
 * it is the table's own voice and nobody is holding it - and otherwise the
 * host's phone. Exactly one device in a room answers true.
 */
function mafiaNarrator(state) {
  if (!state || !state.shared || !state.shared.narrate) return false;
  if (state.youAreScreen) return true;
  const hasScreen = (state.screens || []).length > 0;
  return !hasScreen && !!state.youAreHost;
}

/** Two sentences into one, without doubling a full stop that is already there. */
function mafiaJoinSaid(a, b) {
  const first = String(a || '').trim();
  const second = String(b || '').trim();
  if (!first) return second;
  if (!second) return first;
  return first + (/[.!?؟。]$/.test(first) ? ' ' : '. ') + second;
}

/** The line for the phase the room has just moved into, or nothing. */
function mafiaNarrationLine(s, t) {
  switch (s.phase) {
    case 'roles':     return t.mafia_say_roles || '';
    case 'night':     return t.mafia_say_night || '';
    case 'day':       return mafiaJoinSaid(mafiaNewsText(s, t), t.mafia_say_day || '');
    case 'voting':    return t.mafia_say_vote || '';
    case 'dayResult': return s.news ? mafiaNewsText(s, t) : '';
    case 'gameover':  return t.mafia_say_over || '';
  }
  return '';
}

/**
 * The room's news as words, taken from the very strings already printed on
 * every screen. It says who left, which everyone can see, and **never the
 * role** - mafia_was and the role name are deliberately not read.
 */
function mafiaNewsText(s, t) {
  const n = s.news || {};
  if (n.kind === 'saved' || n.kind === 'quiet' || n.kind === 'tie' || n.kind === 'nobody') {
    return t['mafia_news_' + n.kind] || '';
  }
  if (n.kind === 'out' || n.kind === 'voted') {
    const line = n.kind === 'voted' ? (t.mafia_out_voted || '') : (t.mafia_out_night || '');
    return n.name ? line.replace('{name}', n.name) : '';
  }
  return '';
}

/**
 * Says the line for this phase, once per phase, on the one device that speaks.
 * A news card lies face down for a beat before it turns over (spyRevealParts),
 * so the line waits for it through afterReveal rather than reading the name
 * out from under the reveal. Returns whether anything was said or scheduled.
 */
function mafiaNarrate(state, t, el) {
  const s = state.shared;
  const key = [state.code, s.dealId || '', s.phase, s.night, s.day, (s.news || {}).kind, (s.news || {}).name].join('|');
  if (mafiaSaid.key === key) return false;
  mafiaSaid.key = key;
  if (!mafiaNarrator(state)) return false;
  const line = mafiaNarrationLine(s, t);
  if (!line) return false;
  if (el && typeof afterReveal === 'function') {
    afterReveal(el, () => speakLine(line, appState.lang));
    return true;
  }
  return speakLine(line, appState.lang);
}

// Leaving the game, or the room, stops whatever is being said and lets the
// next game narrate from its first phase again. onLeaveScreen (JS_Sounds.html)
// covers walking off the screen; this covers the room moving on underneath.
onRoomClocksReset(() => { mafiaSaid.key = ''; speakStop(); });

ROOM_GAMES.mafia = {
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang];
    const n = (state.players || []).length;
    const few = n < 5 ? `<p class="field__hint tx-warning" style="text-align:center">${escapeHTML(t.mafia_need_five || '')}</p>` : '';
    if (!state.youAreHost) return `${few}<p class="field__hint" style="text-align:center">${escapeHTML(t.mafia_lobby_hint || '')}</p>`;
    const o = mafiaOpts();
    const seg = (key, values, labelOf) => `
      <div class="segmented" role="group">
        ${values.map(v => `<button type="button" class="segmented__item ${v === o[key] ? 'is-active' : ''}" onclick="setMafiaOpt('${key}', ${typeof v === 'string' ? `'${v}'` : v})">${labelOf(v)}</button>`).join('')}
      </div>`;
    return `
      <div class="card card--tight">
        <div class="field">
          <label class="field__label">${escapeHTML(t.mafia_mode || '')}</label>
          ${seg('mode', ['classic', 'roles'], v => escapeHTML(t['mafia_mode_' + v] || v))}
          <p class="field__hint">${escapeHTML(o.mode === 'roles' ? (t.mafia_mode_roles_hint || '') : (t.mafia_mode_classic_hint || ''))}</p>
        </div>
        <div class="field">
          <label class="switch-row" for="mafia-reveal">
            <span class="field__label">${escapeHTML(t.mafia_reveal || '')}</span>
            <span class="switch"><input type="checkbox" id="mafia-reveal" role="switch" ${o.revealRoles ? 'checked' : ''} onchange="setMafiaOpt('revealRoles', this.checked)"><span class="switch__track" aria-hidden="true"></span></span>
          </label>
          <p class="field__hint">${escapeHTML(t.mafia_reveal_hint || '')}</p>
        </div>
        <div class="field">
          <label class="switch-row" for="mafia-narrate">
            <span class="field__label">${escapeHTML(t.mafia_narrate || '')}</span>
            <span class="switch"><input type="checkbox" id="mafia-narrate" role="switch" ${o.narrate ? 'checked' : ''} onchange="setMafiaOpt('narrate', this.checked)"><span class="switch__track" aria-hidden="true"></span></span>
          </label>
          <p class="field__hint">${escapeHTML(t.mafia_narrate_hint || '')}</p>
        </div>
        <div class="field">
          <label class="field__label">${escapeHTML(t.mafia_discuss || '')}</label>
          ${seg('discuss', [2, 3, 5], v => `${v} ${escapeHTML(t.meta_min || '')}`)}
        </div>
        <div class="field">
          <label class="field__label">${escapeHTML(t.mafia_night_time || '')}</label>
          ${seg('night', [30, 45, 60], v => `${v}″`)}
        </div>
        ${n >= 5 ? `<p class="field__hint" style="text-align:center">👥 ${n}: ${escapeHTML(mafiaRoleSummary(n, o.mode, t))}</p>` : few}
      </div>`;
  },
  startPayload() {
    const o = mafiaOpts();
    return { mode: o.mode, revealRoles: o.revealRoles, narrate: o.narrate, discuss: o.discuss, night: o.night };
  },

  render(state) {
    if (appState.currentView !== 'room-mafia') setView('room-mafia');
    const el = document.getElementById('view-room-mafia');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const you = state.you || {};
    const inGame = (s.roster || []).indexOf(Room.me) !== -1;
    const alive = (s.alive || []).indexOf(Room.me) !== -1;
    const v = s.vote || {};
    // Nothing private and nothing about who has acted is in the signature: a
    // rebuild turns the hold card back over, and a rebuild when a teammate
    // picks would be a tell. Those are refreshed in place below.
    const sig = ['mafia', s.dealId || '', s.phase, s.night, s.day, you.role || '', you.pick, (v.voted || []).length, v.phase,
                 (s.alive || []).length, state.youAreHost, appState.lang].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => {
      const head = `
        <div class="play-head">
          ${s.phase === 'roles' ? '<span class="badge">🎭</span>' : `<span class="badge">${s.phase === 'night' ? '🌙' : '☀️'} <span class="metric">${s.phase === 'night' ? s.night : s.day}</span></span>`}
          ${(s.phase === 'night' || s.phase === 'day') && s.endsAt ? `<span id="mafia-clock" class="badge badge--accent metric">${mafiaClockText(s.endsAt)}</span>` : ''}
          <span class="badge">${escapeHTML(t['mafia_mode_' + s.mode] || '')}</span>
        </div>`;
      const outNote = inGame && !alive && s.phase !== 'gameover' ? `<div class="waiting-note">🤐 ${escapeHTML(t.mafia_you_out || '')}</div>` : '';
      const role = inGame ? mafiaRoleCardHtml(state, t) : `<div class="waiting-note">${escapeHTML(t.vote_spectating || '')}</div>`;

      if (s.phase === 'roles') {
        return head + `
          <div class="card card--accent" style="text-align:center">
            <div class="metric metric--md">🎭</div>
            <p class="sheet__subtitle">${escapeHTML(t.mafia_roles_intro || '')}</p>
            <p class="field__hint">${escapeHTML(mafiaRoleSummary((s.roster || []).length, s.mode, t))}</p>
          </div>
          ${role}
          ${state.youAreHost ? `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('startNight')">🌙 ${escapeHTML(t.mafia_start_night || '')}</button></div>` : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
          ${renderRoomPlayerStrip(state)}`;
      }
      if (s.phase === 'night') {
        return head + `
          <div class="card mafia-sky" style="text-align:center"><div class="eyebrow">🌙 ${escapeHTML((t.mafia_night_n || '').replace('{n}', s.night))}</div>
            <p class="field__hint">${escapeHTML(t.mafia_night_everyone || '')} · <span class="metric" data-mafia-acted>${(s.acted || []).length}/${(s.alive || []).length}</span></p></div>
          ${outNote}${mafiaNightHtml(state, t)}
          ${inGame && alive ? role : ''}
          ${state.youAreHost ? `<div class="btn-stack"><button class="btn btn--ghost btn--sm" onclick="roomAct('endNight')">${escapeHTML(t.mafia_end_night || '')}</button></div>` : ''}
          ${renderRoomPlayerStrip(state)}`;
      }
      if (s.phase === 'day') {
        return head + mafiaNewsHtml(state, t) + outNote + `
          <div class="card" style="text-align:center">
            <div class="eyebrow">🗣️ ${escapeHTML(t.mafia_discuss_now || '')}</div>
            <p class="field__hint">${escapeHTML(t.mafia_discuss_hint || '')}</p>
          </div>
          ${mafiaPeopleHtml(state, t)}
          ${inGame && alive ? role : ''}
          ${state.youAreHost ? `<div class="btn-stack">
              <button class="btn btn--primary btn--lg" onclick="roomAct('startVote')">🗳️ ${escapeHTML(t.mafia_vote_now || '')}</button>
              <button class="btn btn--ghost btn--sm" onclick="roomAct('moreTime')">+1 ${escapeHTML(t.meta_min || '')}</button>
            </div>` : `<div class="waiting-note">${escapeHTML(t.mafia_vote_soon || '')}</div>`}
          ${renderRoomPlayerStrip(state)}`;
      }
      if (s.phase === 'voting') {
        return head + outNote + `
          <div class="card card--tight">
            <div class="eyebrow">🗳️ ${escapeHTML(t.mafia_who_leaves || '')}</div>
            ${renderBallot(mafiaVoteState(state), { ownLabel: t.vote_you })}
          </div>
          ${mafiaPeopleHtml(state, t)}
          ${renderRoomPlayerStrip(state)}`;
      }
      if (s.phase === 'dayResult') {
        return head + mafiaNewsHtml(state, t) + `
          <div class="card card--tight">${s.vote && s.vote.results ? renderVoteResults(mafiaVoteState(state)) : ''}</div>
          ${mafiaPeopleHtml(state, t)}
          ${state.youAreHost ? `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('startNight')">🌙 ${escapeHTML(t.mafia_next_night || '')}</button></div>` : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
          ${renderRoomPlayerStrip(state)}`;
      }
      // gameover
      const mine = (s.roles || []).find(r => r.id === Room.me);
      const iWon = mine && ((s.winner === 'mafia') === (mine.role === 'mafia' || mine.role === 'lawyer'));
      return `
        ${s.news ? mafiaNewsHtml(state, t) : ''}
        <div class="card ${s.winner === 'town' ? 'card--accent' : 'mafia-won'}" style="text-align:center">
          <div class="metric metric--lg">${s.winner === 'town' ? '🏙️' : '🕴️'}</div>
          <div class="card__title">${escapeHTML(s.winner === 'town' ? (t.mafia_town_wins || '') : (t.mafia_mafia_wins || ''))}</div>
          ${mine ? `<p class="sheet__subtitle">${escapeHTML(iWon ? (t.mafia_you_won || '') : (t.mafia_you_lost || ''))}</p>` : ''}
        </div>
        <div class="card card--tight">
          <div class="eyebrow">${escapeHTML(t.mafia_everyone_was || '')}</div>
          ${(s.roles || []).map(r => `<div class="mafia-final ${r.alive ? '' : 'is-out'}"><span>${MAFIA_ICONS[r.role]}</span><b>${escapeHTML(r.name)}</b><span>${escapeHTML(t['mafia_role_' + r.role] || '')}</span></div>`).join('')}
        </div>
        ${renderScoreboard(s.board)}
        ${state.youAreHost ? `<div class="btn-stack">
            <button class="btn btn--primary btn--lg" onclick="roomAct('playAgain', ROOM_GAMES.mafia.startPayload())">${escapeHTML(t.play_again || '')}</button>
            <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button>
          </div>` : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
        ${renderRoomPlayerStrip(state)}`;
    });
    mafiaSky(el, s.phase);
    if (rebuilt) mafiaSounds(state);
    mafiaNarrate(state, t, el);
    refreshRoomPlayerStrip(el, state);
    refreshMafiaSecret(el, state, t);
    const acted = el.querySelector('[data-mafia-acted]');
    if (acted) acted.textContent = `${(s.acted || []).length}/${(s.alive || []).length}`;
    if ((s.phase === 'night' || s.phase === 'day') && s.endsAt) mafiaTickClock(s); else mafiaStopClock();
    if (s.phase === 'gameover' && rebuilt && typeof confetti === 'function' && motionFirst('mafia-over:' + state.code + ':' + JSON.stringify(s.scores || {}))) {
      afterReveal(el, () => confetti({ particleCount: 120, spread: 80 }));
    }
  }
};

/** A sound once per moment on this phone: nightfall, the morning's news. */
function mafiaSounds(state) {
  const s = state.shared;
  const key = ['mafia-sound', state.code, s.dealId || '', s.phase, s.night, s.day].join('|');
  if (!motionFirst(key)) return;
  if (s.phase === 'night') playRoomFx('tick');
  if ((s.phase === 'day' || s.phase === 'dayResult') && s.news) playRoomFx(s.news.kind === 'out' || s.news.kind === 'voted' ? 'alarm' : 'success');
}

/* --- the TV ------------------------------------------------------------------ */
TV_GAMES.mafia = {
  sig: (state) => {
    const s = state.shared;
    const v = s.vote || {};
    return [s.phase, s.night, s.day, (s.acted || []).length, (v.voted || []).length, v.phase, (s.alive || []).length, s.endsAt].join('|');
  },
  frame(state, t) {
    const s = state.shared;
    const host = (html) => (state.youAreHost ? `<div class="tv-actions">${html}</div>` : '');
    const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
    const clock = s.endsAt ? `<div id="tv-mafia-clock" class="tv-clock">${mafiaClockText(s.endsAt)}</div>` : '';
    const people = `<div class="tv-strip-inline">${(s.alive || []).map(id => `<span class="tv-chip">${escapeHTML(nameOf(id))}</span>`).join('')}${(s.out || []).map(o => `<span class="tv-chip is-away">${MAFIA_ICONS[o.role] || ''} ${escapeHTML(o.name)}</span>`).join('')}</div>`;
    if (s.phase === 'roles') {
      return `<div class="tv-center"><div class="tv-big-icon" aria-hidden="true">🎭</div>
        <div class="tv-title">${escapeHTML(t.mafia_roles_intro || '')}</div>
        <div class="tv-note">${escapeHTML(mafiaRoleSummary((s.roster || []).length, s.mode, t))}</div>
        ${host(tvBtn('🌙 ' + (t.mafia_start_night || ''), "roomAct('startNight')"))}</div>`;
    }
    if (s.phase === 'night') {
      return `<div class="tv-center mafia-tv-night"><div class="tv-big-icon" aria-hidden="true">🌙</div>
        <div class="tv-title">${escapeHTML(t.mafia_city_sleeps || '')}</div>${clock}
        <div class="tv-note">${escapeHTML(t.mafia_night_everyone || '')} · ${(s.acted || []).length}/${(s.alive || []).length}</div>
        ${host(tvBtn(t.mafia_end_night, "roomAct('endNight')", 'ghost'))}</div>`;
    }
    if (s.phase === 'day') {
      return `<div class="tv-vote"><div class="tv-scale">${mafiaNewsHtml(state, t)}</div>
        <div class="tv-title tv-center-text">🗣️ ${escapeHTML(t.mafia_discuss_now || '')}</div>${clock}${people}
        ${host(tvBtn('🗳️ ' + (t.mafia_vote_now || ''), "roomAct('startVote')") + tvBtn('+1 ' + (t.meta_min || ''), "roomAct('moreTime')", 'ghost'))}</div>`;
    }
    if (s.phase === 'voting') {
      return `<div class="tv-vote"><div class="tv-title tv-center-text">🗳️ ${escapeHTML(t.mafia_who_leaves || '')}</div>${people}${tvVoteProgress(state, t)}</div>`;
    }
    if (s.phase === 'dayResult') {
      // One screen, no scrolling: the count per name as chips, not the phone's bars.
      const results = ((mafiaVoteState(state).shared.vote || {}).results || []).filter(r => r.count > 0).sort((a, b) => b.count - a.count);
      return `<div class="tv-vote"><div class="tv-scale">${mafiaNewsHtml(state, t)}</div>
        <div class="tv-legend">${results.map((r, k) => `<span class="tv-chip${k === 0 ? ' is-done' : ''}"><b class="metric">${r.count}</b> ${escapeHTML(r.label)}</span>`).join('')}</div>${people}
        ${host(tvBtn('🌙 ' + (t.mafia_next_night || ''), "roomAct('startNight')"))}</div>`;
    }
    return `<div class="tv-vote">
      <div class="tv-title tv-center-text">${s.winner === 'town' ? '🏙️ ' + escapeHTML(t.mafia_town_wins || '') : '🕴️ ' + escapeHTML(t.mafia_mafia_wins || '')}</div>
      <div class="tv-strip-inline">${(s.roles || []).map(r => `<span class="tv-chip ${r.alive ? '' : 'is-away'}">${MAFIA_ICONS[r.role]} ${escapeHTML(r.name)}</span>`).join('')}</div>
      <div class="tv-scale">${renderScoreboard(s.board)}</div>
      ${host(tvBtn(t.play_again, "roomAct('playAgain', ROOM_GAMES.mafia.startPayload())") + tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost'))}</div>`;
  },
  after(state) {
    const s = state.shared;
    if ((s.phase === 'night' || s.phase === 'day') && s.endsAt) mafiaTickClock(s); else mafiaStopClock();
    // The big screen is the table's own voice, so it is the one that reads.
    mafiaNarrate(state, TRANSLATIONS[appState.lang], document.getElementById('view-room-tv'));
  }
};
</script>
