<style>
/* Style_Arcade.html - sections 39-43: an easy start, the arcade look («د · أركيد»), motion everywhere, the arcade rooms and one-phone games, the rooms' design review.
   Part of the stylesheet that starts in Style.html: the parts are included in
   Controller.html in this order, and the cascade depends on it. */

/* ==========================================================================
   39. AN EASY START (26 Sep 2026: "people who open it should not have to do a
   lot of clicks to start a game; I don't want them to get lost")
   The first visit's home (renderHome, JS_Catalog.html), «مين بيلعب؟»
   (askPlayers, JS_Utils.html), the lobby's name, Start and folded options
   (JS_Room.html), the first-play line, and popups that close with motion.
   ========================================================================== */

/* --- The first visit: «يلا نلعب!», three games, a room, and the rest folded --- */
.home-start {
  position: relative;
  overflow: hidden;
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  margin-bottom: var(--sp-3);
  border-radius: var(--r-xl);
  /* The brand gradient the hero has always had: the one surface that keeps its colour in both themes. */
  background: linear-gradient(135deg, #6c5ce7 0%, #5b4bd6 52%, #4a48c2 100%);
  color: #ffffff;
  box-shadow: 0 10px 28px -14px rgba(76, 29, 149, 0.45);
}
body.dark .home-start { background: linear-gradient(135deg, #5847c4 0%, #4a3fb0 52%, #3b3a9c 100%); }
.home-start::before {
  content: '';
  position: absolute;
  width: 17rem; height: 17rem;
  inset-inline-end: -6rem; top: -9rem;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.055);
  pointer-events: none;
}
.home-start__head { position: relative; margin-bottom: var(--sp-3); }
.home-start__title { margin: 0; font-family: var(--font-display); font-size: calc(var(--fs-h1) * 1.2); font-weight: var(--fw-black); line-height: var(--lh-tight); color: #ffffff; }
.home-start__sub { margin: 2px 0 0; font-size: var(--fs-sm); font-weight: var(--fw-med); color: rgba(255, 255, 255, 0.86); }
.home-start__cards { position: relative; display: flex; flex-direction: column; gap: var(--sp-2); }

.start-card {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: 4.75rem;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  background-image: radial-gradient(circle at var(--wash-x, 100%) 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%);
  color: var(--text-strong);
  font-family: var(--font);
  text-align: start;
  cursor: pointer;
  box-shadow: var(--sh-1);
  transition: transform var(--dur-2) var(--ease-spring);
}
body.dark .start-card { background-image: radial-gradient(circle at var(--wash-x, 100%) 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%); }
.start-card:active { transform: scale(0.98); }
.start-card__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 3rem;
  height: 3rem;
  font-size: 2.1rem;
  line-height: 1;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.14));
}
.start-card__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.start-card__title { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: var(--fw-bold); line-height: 1.15; color: var(--text-strong); }
.start-card__desc { font-size: var(--fs-xs); font-weight: var(--fw-med); line-height: var(--lh-snug); color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.start-card__meta { display: flex; flex-wrap: wrap; gap: var(--sp-2); font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--text-3); }
.start-card__go {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-on);
  font-size: 1rem;
  box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--accent) 70%, transparent);
}
/* The three rise one after another the first time the home is drawn. */
@media (prefers-reduced-motion: no-preference) {
  .home-start__head, .start-card, .home-start__ways { animation: startRise var(--dur-4) var(--ease-out) both; }
  .start-card { animation-delay: calc(90ms + var(--i, 0) * 70ms); }
  .home-start__ways { animation-delay: 330ms; }
  .start-card__go { animation: startPulse 2.4s var(--ease-in-out) 1.2s 2; }
}
@keyframes startRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes startPulse { 0%, 100% { box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
  50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 22%, transparent); } }

.home-start__ways { position: relative; display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); }
.home-start__room {
  flex: 1;
  min-width: 0;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #ffffff;
  box-shadow: none;
}
.home-start__room:active { background: rgba(255, 255, 255, 0.28); }
.home-start__tonight { margin: 0; height: 3.375rem; }

.home-all-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  width: 100%;
  min-height: var(--tap);
  margin: 0 0 var(--sp-4);
  padding: var(--sp-2) var(--sp-4);
  border: 1px dashed var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: var(--fw-bold);
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out);
}
.home-all-toggle:active { transform: scale(0.97); }
.home-all-toggle__chev { display: inline-block; transition: transform var(--dur-3) var(--ease-spring); }
.home-all-toggle.is-open .home-all-toggle__chev { transform: rotate(180deg); }
.home-all[hidden] { display: none; }
/* «كل الألعاب» opening: everything under it rises in, section by section. */
.home-all.is-opening > * { animation: startRise var(--dur-4) var(--ease-out) both; }
.home-all.is-opening > :nth-child(2) { animation-delay: 50ms; }
.home-all.is-opening > :nth-child(3) { animation-delay: 100ms; }
.home-all.is-opening > :nth-child(4) { animation-delay: 150ms; }
.home-all.is-opening > :nth-child(n+5) { animation-delay: 200ms; }

/* «📺 دي الشاشة؟» beside the three on a laptop or a TV (1211, 7 Oct 2026;
   homeStartScreenCard, only drawn from 1280px wide): four in the row, the
   screen's card in the room button's frosted glass, so it reads as a way to
   play rather than a fourth game. */
.home-start__cards > .start-card--screen { background: rgba(255, 255, 255, 0.16); background-image: none; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: none; }
body.dark .home-start__cards > .start-card--screen { background-image: none; }
.start-card--screen .start-card__title, .start-card--screen .start-card__desc { color: #ffffff; }
.start-card--screen .start-card__go { background: rgba(255, 255, 255, 0.22); color: #ffffff; box-shadow: none; }
@media (min-width: 1280px) {
  .home-start__cards.home-start__cards--four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 900px), (orientation: landscape) and (max-height: 500px) {
  .home-start__cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .start-card { flex-direction: column; align-items: flex-start; min-height: 0; }
  .start-card__go { align-self: flex-end; margin-top: calc(-1 * var(--sp-6)); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .home-start { padding: var(--sp-3) var(--sp-4); }
  .home-start__head { margin-bottom: var(--sp-2); }
  .start-card { padding: var(--sp-2) var(--sp-3); }
  .start-card__icon { width: 2.25rem; height: 2.25rem; font-size: 1.6rem; }
  .start-card__desc { display: none; }
  .start-card__go { width: 2.5rem; height: 2.5rem; margin-top: calc(-1 * var(--sp-5)); }
}

/* --- «▶ العب تاني» beside a recent tile --- */
.recent-item { flex: none; display: inline-flex; align-items: center; scroll-snap-align: start; }
.recent-item.has-play .recent-tile { border-start-end-radius: 0; border-end-end-radius: 0; padding-inline-end: var(--sp-2); }
.recent-play {
  flex: none;
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.75rem;
  margin-inline-start: -1px;
  border: 1px solid var(--accent-border);
  border-start-end-radius: var(--r-full);
  border-end-end-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-on);
  font-size: 0.8rem;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out);
}
.recent-play:active { transform: scale(0.92); }

/* --- The first-play card as one line that opens in place --- */
.first-play-card--line { display: block; padding: 0; gap: 0; }
.first-play-card__line {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-4);
  cursor: pointer;
  list-style: none;
}
.first-play-card__line::-webkit-details-marker { display: none; }
.first-play-card--line .first-play-card__eyebrow { flex: 1; text-transform: none; font-size: var(--fs-sm); }
.first-play-card__chev { color: var(--accent-ink); transition: transform var(--dur-3) var(--ease-spring); }
.first-play-card--line[open] .first-play-card__chev { transform: rotate(180deg); }
.first-play-card__body { display: flex; flex-direction: column; gap: var(--sp-3); padding: 0 var(--sp-4) var(--sp-4); }

/* --- Rooms: «أنت: منى ✏️», the Start that stays on screen, the folded options --- */
.lobby-me {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  min-height: var(--tap);
  max-width: 100%;
  margin: 0 0 var(--sp-2);
  padding: var(--sp-1) var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  cursor: pointer;
}
.lobby-me.hidden { display: none; }
.lobby-me__label { font-weight: var(--fw-med); }
.lobby-me__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#view-room-join .lobby-me { margin-top: var(--sp-2); margin-bottom: var(--sp-4); }
.lobby-start { display: flex; flex-direction: column; gap: var(--sp-2); }
.lobby-start:not(:has(> :not(.hidden))) { display: none; }
.lobby-start__need { margin: 0; text-align: center; font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--text-3); }
.lobby-opts { margin-bottom: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-solid); }
.lobby-opts__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-4);
  cursor: pointer;
  list-style: none;
}
.lobby-opts__head::-webkit-details-marker { display: none; }
.lobby-opts__title { flex: none; font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--text-strong); }
.lobby-opts__sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-xs); font-weight: var(--fw-med); color: var(--text-3); text-align: end; }
.lobby-opts[open] .lobby-opts__sum { visibility: hidden; }
.lobby-opts__chev { flex: none; color: var(--accent-ink); transition: transform var(--dur-3) var(--ease-spring); }
.lobby-opts[open] .lobby-opts__chev { transform: rotate(180deg); }
.lobby-opts__body { padding: 0 var(--sp-3) var(--sp-3); }
.lobby-opts__body > .card { margin-bottom: 0; box-shadow: none; }

/* --- «مين بيلعب؟» --- */
.players-sheet__fields { display: flex; flex-direction: column; gap: var(--sp-2); text-align: start; }
.players-sheet__row { display: flex; align-items: center; gap: var(--sp-2); }
.players-sheet__row input { flex: 1; min-width: 0; margin: 0; }
.players-sheet__n {
  flex: none;
  width: 1.75rem; height: 1.75rem;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-xs);
  font-weight: var(--fw-black);
}
.players-sheet__add { align-self: center; }
/* «يلا» and «إلغاء» stay in view while the names scroll: with six rows, or the keyboard up,
   the sheet runs past the screen and the button was below it. */
.players-sheet > .modal-actions {
  position: sticky;
  bottom: calc(-1 * var(--sp-5));
  z-index: 1;
  margin-bottom: calc(-1 * var(--sp-5));
  padding-bottom: var(--sp-5);
  background: var(--elevated);
}
/* A fade over the names scrolling under it, above the buttons and taking no room. */
.players-sheet > .modal-actions::before {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 100%;
  height: var(--sp-3);
  background: linear-gradient(to bottom, transparent, var(--elevated));
  pointer-events: none;
}
.players-sheet__chips { justify-content: center; max-height: 7.5rem; overflow-y: auto; }
.players-sheet__chips.hidden { display: none; }
#players-sheet-need.is-error { color: var(--danger); }
.players-sheet__row.is-popping { animation: sheetRowIn var(--dur-3) var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 60ms + 80ms); }
@keyframes sheetRowIn { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }

/* A phone on its side: two names a row, so «يلا» is on the first screen. */
@media (orientation: landscape) and (max-height: 500px) {
  .players-sheet .modal-icon { display: none; }
  .players-sheet__fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .players-sheet .modal-actions { flex-direction: row; }
  .players-sheet .modal-actions > .btn { flex: 1; }
}

/* A name put in the round pops in (P14). */
.pick-chip--pop { animation: chipPop 420ms var(--ease-spring) both; }
@keyframes chipPop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: none; } }

/* --- A popup closing: the copy that fades out (modalExitGhost, JS_Core.html) --- */
.modal-overlay--ghost {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: max(var(--sp-4), var(--safe-top)) max(var(--sp-4), var(--safe-right))
           max(var(--sp-4), var(--safe-bottom)) max(var(--sp-4), var(--safe-left));
  background: rgba(2, 6, 23, 0.5);
  pointer-events: none;
  animation: overlayOut 200ms var(--ease-out) forwards;
}
.modal-overlay--ghost .modal-content { animation: dialogOut 200ms var(--ease-out) forwards; }
@keyframes overlayOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes dialogOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(10px) scale(0.95); } }

/* --- A long setup: the options that matter first, the rest under «خيارات أكتر ▾» --- */
.setup-more { margin: var(--sp-2) 0 var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-2); }
.setup-more__head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-4);
  cursor: pointer;
  list-style: none;
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  color: var(--text-strong);
}
.setup-more__head::-webkit-details-marker { display: none; }
.setup-more__sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-xs); font-weight: var(--fw-med); color: var(--text-3); text-align: end; }
.setup-more[open] .setup-more__sum { visibility: hidden; }
.setup-more__chev { flex: none; color: var(--accent-ink); transition: transform var(--dur-3) var(--ease-spring); }
.setup-more[open] .setup-more__chev { transform: rotate(180deg); }
.setup-more__body { padding: 0 var(--sp-4) var(--sp-2); }

@media (prefers-reduced-motion: reduce) {
  .home-start__head, .start-card, .home-start__ways, .start-card__go, .home-all.is-opening > *,
  .players-sheet__row.is-popping, .pick-chip--pop { animation: none; }
  .modal-overlay--ghost { display: none; }
  .home-all-toggle__chev, .first-play-card__chev, .lobby-opts__chev, .setup-more__chev { transition: none; }
}

/* ==========================================================================
   39. ARCADE - the look the owner picked on 26 Sep 2026 («د · أركيد» from a
   sheet of four styles in three colours: colour ١ as the light theme, ٢ as
   the dark one). A game store: every game a poster in its own colour with
   its icon big and its name on the art, a featured poster on the home, a
   raised «افتح غرفة» in the middle of the bar, the setup hero as a poster,
   the Start button in amber with a glow. The type: Noto Kufi Arabic for
   what names a screen, IBM Plex Sans Arabic for reading (Baloo stays on the
   card games' numerals). This section comes last on purpose: it re-tokens
   and restyles the pieces every screen is built from, and the game boards
   (سكرو's cards, the domino table, the chess board…) keep their own sections.
   ========================================================================== */
:root {
  --font: 'IBM Plex Sans Arabic', 'Twemoji Country Flags', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', 'Twemoji Country Flags', ui-sans-serif, system-ui, sans-serif;

  --bg:             #f6f3ff;
  --surface:        rgba(255, 255, 255, 0.92);
  --surface-solid:  #ffffff;
  --surface-2:      #f2eefc;
  --surface-3:      #ece7fa;
  --surface-sunken: #e9e4f7;
  --elevated:       #ffffff;
  --border:         rgba(52, 29, 120, 0.10);
  --border-strong:  rgba(52, 29, 120, 0.18);
  --hairline:       rgba(52, 29, 120, 0.07);
  --text:           #2b2352;
  --text-2:         #5a5080;
  --text-3:         #6b6291;
  --text-strong:    #1d1538;

  /* The amber "play": the one colour that isn't a game's, kept for the action
     the screen exists for (Start, the featured poster's play). */
  --pop:        #f59e0b;
  --pop-hover:  #d97706;
  --pop-on:     #1c1200;
  --pop-glow:   rgba(245, 158, 11, 0.45);

  --r-lg:  1.125rem;
  --r-xl:  1.5rem;
  --r-2xl: 1.75rem;

  --sh-1: 0 1px 2px rgba(52, 29, 120, 0.06);
  --sh-2: 0 2px 6px rgba(52, 29, 120, 0.05), 0 8px 20px -10px rgba(52, 29, 120, 0.16);
  --sh-3: 0 4px 10px rgba(52, 29, 120, 0.06), 0 14px 34px -14px rgba(52, 29, 120, 0.28);
  --sh-4: 0 24px 56px -14px rgba(29, 21, 56, 0.35);
  --poster-shadow: 0 14px 30px -12px rgba(29, 21, 56, 0.45);
  --poster-shadow-hover: 0 22px 40px -14px rgba(29, 21, 56, 0.55);
  --poster-fade: rgba(10, 6, 20, 0.86);
}
body.dark {
  --bg:             #0d0b16;
  --surface:        rgba(26, 22, 48, 0.92);
  --surface-solid:  #1a1630;
  --surface-2:      #161228;
  --surface-3:      #241e42;
  --surface-sunken: #09070f;
  --elevated:       #241e42;
  --border:         rgba(255, 255, 255, 0.09);
  --border-strong:  rgba(255, 255, 255, 0.18);
  --hairline:       rgba(255, 255, 255, 0.06);
  --text:           #ece8ff;
  --text-2:         #b6afd6;
  --text-3:         #9a93bf;
  --text-strong:    #ffffff;
  --pop:        #fbbf24;
  --pop-hover:  #f59e0b;
  --pop-on:     #1c1200;
  --pop-glow:   rgba(251, 191, 36, 0.4);
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.45);
  --sh-2: 0 2px 8px -2px rgba(0, 0, 0, 0.55);
  --sh-3: 0 8px 24px -8px rgba(0, 0, 0, 0.65);
  --sh-4: 0 20px 48px -12px rgba(0, 0, 0, 0.75);
  --poster-shadow: 0 16px 36px -14px rgba(0, 0, 0, 0.7);
  --poster-shadow-hover: 0 26px 46px -14px rgba(0, 0, 0, 0.8);
  --poster-fade: rgba(6, 4, 14, 0.9);
}

/* The ground: a still violet glow at the top of the page, amber low on one side. */
body::before {
  background:
    radial-gradient(120% 55% at 50% -10%, rgba(124, 58, 237, 0.20), transparent 60%),
    radial-gradient(60% 40% at 100% 100%, rgba(245, 158, 11, 0.10), transparent 60%),
    var(--bg);
}
body.dark::before {
  background:
    radial-gradient(120% 55% at 50% -10%, rgba(124, 58, 237, 0.45), transparent 60%),
    radial-gradient(60% 40% at 100% 100%, rgba(251, 191, 36, 0.14), transparent 60%),
    var(--bg);
}

/* --- What names a screen is set in the display face --- */
.shell__title, .section__title, .card__title, .sheet__title, .tab-hero__title, .home-start__title, .start-card__title, .tool-name, .daily-strip__text b, .room-code, .podium__name, .game-hero__title, .gcard__title, .home-feat__title, .together__name {
  font-family: var(--font-display);
}
/* Plex Arabic stops at 700: the heavier steps of the scale fall to it. */
.shell__title { font-size: var(--fs-h3); }

/* --- Cards and sheets: bigger corners, no hairline, a soft lift --- */
.card { border-radius: var(--r-xl); border-color: var(--hairline); box-shadow: var(--sh-2); }
.modal-content { border-radius: var(--r-2xl); }
.section__head { margin-bottom: var(--sp-3); }
.section__count { padding: 2px 8px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); }
.section__rule { opacity: 0.7; }

/* --- Buttons: the primary glows; Start is amber --- */
.btn { font-family: var(--font-display); }
.btn--primary { box-shadow: 0 10px 24px -8px var(--accent-glow), var(--sh-inset); }
.view-actions--start .btn--primary, .btn--go,
.lobby-start .btn--primary,
.home-start__room {
  background: linear-gradient(180deg, var(--pop), var(--pop-hover));
  color: var(--pop-on);
  border-color: transparent;
  box-shadow: 0 12px 28px -8px var(--pop-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.view-actions--start .btn--primary:active, .btn--go:active,
.lobby-start .btn--primary:active,
.home-start__room:active { box-shadow: 0 4px 12px -6px var(--pop-glow); background: linear-gradient(180deg, var(--pop-hover), var(--pop-hover)); }
.filter-chip { height: 2.5rem; border-radius: var(--r-md); }
.filter-chip.is-active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
.home-search input { border-radius: var(--r-md); }

/* --- The bar: four tabs and the raised centre button --- */
.shell__nav { gap: var(--sp-1); }
.nav-item--room { flex: 0 0 auto; width: 4.5rem; justify-content: flex-end; gap: 3px; overflow: visible; }
.nav-item--room .ripple { display: none; }
.nav-room__btn {
  width: 3.5rem;
  height: 3.5rem;
  margin-top: -1.75rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--accent-hover), var(--accent));
  color: var(--accent-on);
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
  box-shadow: 0 12px 26px -8px var(--accent-glow), 0 0 0 5px var(--bg);
  transition: transform var(--dur-2) var(--ease-spring), box-shadow var(--dur-2) var(--ease-out);
}
.nav-item--room .nav-label { color: var(--accent-ink); }
.nav-item--room:active { transform: none; }
.nav-item--room:active .nav-room__btn { transform: scale(0.9); box-shadow: 0 6px 14px -6px var(--accent-glow), 0 0 0 5px var(--bg); }
.nav-item--room.is-active { background: transparent; box-shadow: none; }
@media (max-width: 899px) and (min-height: 501px) {
  .shell__nav { overflow: visible; }
  .nav-room__btn { box-shadow: 0 12px 26px -8px var(--accent-glow), 0 0 0 4px var(--surface-solid); }
}
/* The rail (a phone on its side, a laptop): a round button among the tabs. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .nav-item--room { width: auto; justify-content: center; }
  .nav-room__btn { width: 3rem; height: 3rem; margin-top: 0; font-size: 1.75rem; box-shadow: 0 8px 20px -8px var(--accent-glow); }
}

/* --- The home ---------------------------------------------------------- */
/* The featured poster («★ الليلة دي»). */
.home-feat {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 18rem;
  margin-bottom: var(--sp-4);
  padding: var(--sp-4);
  border: 0;
  border-radius: var(--r-xl);
  overflow: hidden;
  color: #ffffff;
  background: linear-gradient(135deg, var(--accent), var(--accent-hover));
  box-shadow: var(--poster-shadow);
  text-align: start;
  cursor: pointer;
  aspect-ratio: auto;
}
.gcard.home-feat { aspect-ratio: auto; min-height: 17rem; }
.gcard > .home-feat__art, .gcard > .home-feat__fade { position: absolute; }
.home-feat .gcard__icon { position: static; width: auto; height: auto; padding: 0; background: none; border: 0; font-size: inherit; filter: none; }
.home-feat__art {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: start center;
  padding-top: var(--sp-3);
  font-size: 6.5rem;
  line-height: 1;
  filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.4));
  pointer-events: none;
  z-index: 0;
}
.home-feat__art .art-icon { width: 1.6em; height: 1.6em; }
.home-feat__fade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 28%, var(--poster-fade) 75%); pointer-events: none; z-index: 0; }
.home-feat__text { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 3px; }
.home-feat__tag { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.02em; color: var(--pop); }
.home-feat__title { font-size: 1.9rem; font-weight: 900; line-height: 1.1; color: #ffffff; }
.home-feat__desc { font-size: var(--fs-sm); font-weight: 500; line-height: var(--lh-snug); color: rgba(255, 255, 255, 0.9); }
.home-feat__meta { display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; font-size: var(--fs-xs); font-weight: 700; color: rgba(255, 255, 255, 0.78); }
.home-feat__meta .meta-bit .metric { color: inherit; }
.home-feat__btns { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); }
.home-feat__btn {
  height: 2.625rem;
  padding: 0 var(--sp-4);
  border: 0;
  border-radius: var(--r-md);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-display);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out);
}
.home-feat__btn:active { transform: scale(0.95); }
.home-feat__btn--play { background: var(--pop); color: var(--pop-on); box-shadow: 0 0 24px var(--pop-glow); }
.home-feat__btn--other { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* The three ways in, as plain pills under the poster (the bar has «افتح غرفة»). */
.home-hero--compact, body.dark .home-hero--compact { padding: 0; margin-bottom: var(--sp-3); background: none; box-shadow: none; overflow: visible; }
.home-hero--compact::before, .home-hero--compact::after { display: none; }
.home-hero--compact .together { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.home-all .home-hero--compact .together { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.home-hero--compact .together__tile {
  min-height: 2.75rem;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-strong);
  box-shadow: var(--sh-1);
}
.home-hero--compact .together__tile:active { background: var(--surface-2); }
.home-hero--compact .together__name { font-size: var(--fs-xs); }
.home-hero--compact .together__icon { font-size: 1rem; }
/* The line under a tile's name (a laptop and a TV) is on a white pill now, not the violet hero. */
.home-hero--compact .together__desc { color: var(--text-2); }

/* The filter chips wrap on a phone (the owner, 26 Sep 2026: the last chip was
   cut off behind the pinned «مين وكام؟» chip): every chip is on screen, the
   pinned chip simply last. Wide screens keep the one scrolling row. */
@media (max-width: 899px) {
  .home-tools .filter-bar { flex-wrap: wrap; }
  .home-tools .filter-bar > .filter-row { flex: 1 1 auto; flex-wrap: wrap; overflow: visible; margin-inline: 0; padding: 0; scroll-snap-type: none; }
  .home-tools .filter-bar > .filter-row { -webkit-mask-image: none; mask-image: none; }
  .home-tools .filter-bar .filter-chip { scroll-snap-align: none; }
}

/* Recents as small accent pills. */
.recent-tile { border: 0; background: linear-gradient(150deg, var(--accent), var(--accent-hover)); color: var(--accent-on); box-shadow: var(--sh-2); }
.daily-strip { border-radius: var(--r-lg); }

/* --- Posters: every game in the grid --- */
.gcard-grid { grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: var(--sp-2); }
.gcard {
  min-height: 0;
  aspect-ratio: 3 / 4;
  justify-content: flex-end;
  gap: 0;
  padding: var(--sp-2);
  border: 0;
  border-radius: var(--r-lg);
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: #ffffff;
  box-shadow: var(--poster-shadow);
}
.gcard::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 42%, var(--poster-fade));
  pointer-events: none;
  z-index: 0;
}
.gcard:active { transform: scale(0.96); box-shadow: var(--sh-2); border-color: transparent; }
/* Dark keeps the posters' colour: section 17's `body.dark .gcard` corner wash
   (and the spotlight's) outweighs a plain `.gcard`, and left every dark
   poster, the featured one too, near-black (found 26 Sep 2026). */
body.dark .gcard, body.dark .gcard--spotlight { background-image: linear-gradient(150deg, var(--accent), var(--accent-hover)); }
body.dark .gcard.home-feat { background-image: linear-gradient(135deg, var(--accent), var(--accent-hover)); }
.gcard > .gcard__icon {
  position: absolute;
  inset: 0;
  width: auto;
  height: auto;
  margin: 0;
  padding-bottom: 2rem;
  display: grid;
  place-items: center;
  font-size: 2.9rem;
  line-height: 1;
  border: 0;
  border-radius: 0;
  background: none;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.35));
  z-index: 0;
}
.gcard__icon .art-icon { width: 1.3em; height: 1.3em; }
.gcard > .gcard__badge {
  position: absolute;
  top: var(--sp-2);
  inset-inline-start: var(--sp-2);
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: var(--r-full);
  /* A solid tint, no blur: thirty blurred badges over a scrolling grid cost
     a phone frames (26 Sep 2026). */
  background: rgba(0, 0, 0, 0.44);
  color: #ffffff;
  font-size: 0.66rem;
  font-weight: 800;
}
.gcard__badge .metric { font-size: inherit; color: inherit; }
/* «جديد» on a new game's poster (1208, 7 Oct 2026; catalogIsNew): an amber
   ribbon in the corner the players' badge leaves free; on a recent tile, a small
   tag after the name (the row scrolls, so nothing may stick out of the pill). */
.gcard > .gcard-new {
  position: absolute;
  top: var(--sp-2);
  inset-inline-end: var(--sp-2);
  z-index: 1;
  padding: 2px 7px;
  border-radius: var(--r-full);
  background: var(--warning-btn);
  color: var(--warning-on);
  font-size: 0.66rem;
  font-weight: 800;
  line-height: 1.3;
  box-shadow: 0 3px 8px -3px rgba(0, 0, 0, 0.4);
}
.gcard-new--sm {
  flex: none;
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: var(--warning-btn);
  color: var(--warning-on);
  font-size: 0.62rem;
  font-weight: 800;
  line-height: 1.3;
}
.gcard__title {
  position: relative;
  z-index: 1;
  width: 100%;
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.2;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  overflow-wrap: anywhere;
}
.gcard__desc, .gcard__meta { display: none; }
/* A section of one game: a wide poster with its line and its play pill. */
.gcard--spotlight { grid-column: 1 / -1; aspect-ratio: auto; flex-direction: row; align-items: center; gap: var(--sp-3); min-height: 8.5rem; padding: var(--sp-4); }
.gcard--spotlight::before { background: linear-gradient(90deg, rgba(10, 6, 20, 0.35), rgba(10, 6, 20, 0.6)); }
.gcard--spotlight .gcard__icon { position: relative; inset: auto; width: 5rem; height: 5rem; padding: 0; font-size: 3.5rem; flex: none; }
.gcard--spotlight .gcard__body { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.gcard--spotlight .gcard__title { font-size: var(--fs-h2); }
.gcard--spotlight .gcard__desc { display: block; color: rgba(255, 255, 255, 0.88); font-size: var(--fs-sm); font-weight: 500; }
.gcard--spotlight .gcard__meta { display: flex; color: rgba(255, 255, 255, 0.78); }
.gcard--spotlight .gcard__meta .metric { color: inherit; }
.gcard--spotlight .gcard__cta { position: relative; z-index: 1; background: var(--pop); color: var(--pop-on); border: 0; }
/* The first-visit start cards keep their rows, with a poster thumb and an amber go. */
.start-card { border: 0; box-shadow: var(--sh-2); }
.start-card__icon { width: 3.5rem; height: 3.5rem; border-radius: var(--r-md); background: linear-gradient(150deg, var(--accent), var(--accent-hover)); filter: none; font-size: 2rem; box-shadow: var(--sh-2); }
.start-card__go { background: var(--pop); color: var(--pop-on); box-shadow: 0 6px 16px -6px var(--pop-glow); }
.home-start { background: linear-gradient(150deg, #6d28d9 0%, #5b21b6 55%, #3b0d8e 100%); box-shadow: var(--poster-shadow); }
body.dark .home-start { background: linear-gradient(150deg, #5b21b6 0%, #4c1d95 55%, #2e1065 100%); }

/* --- The hero on a setup screen is a poster --- */
.game-hero {
  position: relative;
  display: block;
  padding: 0;
  margin-bottom: var(--sp-4);
  border: 0;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
}
.game-hero__art {
  position: relative;
  display: grid;
  place-items: center;
  height: 11.5rem;
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
}
.game-hero__art::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.16), transparent 30%, transparent 58%, var(--surface-solid) 90%);
  pointer-events: none;
}
.game-hero__icon {
  position: relative;
  width: auto;
  height: auto;
  padding-bottom: 1.5rem;
  border: 0;
  border-radius: 0;
  background: none;
  font-size: 5.25rem;
  line-height: 1;
  filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.4));
  z-index: 1;
}
.game-hero__icon .art-icon { width: 1.25em; height: 1.25em; }
.game-hero__text { position: relative; z-index: 1; margin-top: -2.25rem; padding: 0 var(--sp-4) var(--sp-3); gap: 4px; }
.game-hero__title { font-size: 1.75rem; font-weight: 900; line-height: 1.1; }
.game-hero__desc { font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.game-hero__meta { margin-top: 6px; gap: 6px; }
.game-hero__meta .meta-bit { padding: 4px 9px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: 700; }
.game-hero .first-play-card { width: auto; margin: 0 var(--sp-4) var(--sp-3); }
.game-hero .hub-ways { margin: 0 var(--sp-4) var(--sp-3); }

/* --- The Together and Tools tabs' heads, and the tool rows --- */
.tab-hero { border: 0; color: #ffffff; background: linear-gradient(150deg, var(--accent), var(--accent-hover)); box-shadow: var(--poster-shadow); }
.tab-hero__icon { background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.25); font-size: 2.2rem; }
.tab-hero__title { color: #ffffff; }
.tab-hero__sub { color: rgba(255, 255, 255, 0.86); }
.together-live { color: #ffffff; }
.tool-item { border: 0; border-radius: var(--r-lg); box-shadow: var(--sh-2); }
/* A tool row is one line - the icon as a poster thumb (the recent tiles'
   gradient), the name over its line, the chevron - at every size, the score
   keepers' rows too. The shadow is on the glyph, not the tile. */
.tool-icon {
  width: 3rem;
  height: 3rem;
  border-radius: var(--r-md);
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  box-shadow: var(--sh-2);
  font-size: 1.6rem;
  line-height: 1;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  filter: none;
}
.tool-icon .art-icon { width: 1.2em; height: 1.2em; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3)); }
/* A score keeper with a game going (1233, 7 Oct 2026; catalogToolRow): ▶ on its
   icon's corner and «كمّل · الجولة ٤» in its accent where the line was. */
.tool-item.has-cont .tool-icon { position: relative; }
.tool-icon__cont {
  position: absolute;
  bottom: -4px;
  inset-inline-end: -4px;
  display: grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--accent-ink);
  font-size: 0.6rem;
  text-shadow: none;
  box-shadow: var(--sh-1);
}
.tool-cont { font-size: var(--fs-xs); font-weight: 800; color: var(--accent-ink); }
.recent-tile__icon .art-icon, .help-game-card__icon .art-icon, .help-hero__icon .art-icon { width: 1.25em; height: 1.25em; }
.tool-item > .tool-info { flex: 1 1 auto; }
.tool-item > .tool-chev { flex: none; }

/* Kufi is wider than Cairo was: a row of three buttons keeps its words (حرب السفن's placing row). */
.bs-bar .btn-row > .btn { min-width: 0; padding-inline: var(--sp-2); font-size: var(--fs-sm); }

/* --- A room's code, in the display face --- */
.room-code { font-family: var(--font-display); letter-spacing: 0.22em; }

/* --- Wide: a phone on its side, tablets, laptops and the TV --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .gcard-grid { grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); gap: var(--sp-3); }
  .gcard__icon { font-size: 3.4rem; }
  .gcard__title { font-size: var(--fs-body); }
  .home-feat { min-height: 17rem; }
  .home-feat__art { font-size: 9rem; }
  .home-feat__title { font-size: 2.4rem; }
  .game-hero__art { height: 9.5rem; }
  .game-hero__icon { font-size: 4.5rem; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .gcard.home-feat { min-height: 13rem; }
  .home-feat__art { font-size: 6.5rem; place-items: center end; padding: 0 var(--sp-5); }
  .home-feat__fade { background: linear-gradient(90deg, var(--poster-fade), transparent 70%); }
  [dir="rtl"] .home-feat__fade { background: linear-gradient(270deg, var(--poster-fade), transparent 70%); }
  .home-feat__text { max-width: 62%; }
}
@media (min-width: 900px) and (min-height: 501px) {
  /* Shorter on a wide screen (the owner, 30 Sep 2026): the first shelf of
     games shows without scrolling; the text sets the height. */
  .gcard.home-feat { min-height: 13rem; padding: var(--sp-5) var(--sp-6); }
  .home-feat__art { place-items: center end; padding: 0 var(--sp-8); font-size: 8.5rem; }
  .home-feat__title { font-size: 2.1rem; }
  .home-feat__fade { background: linear-gradient(90deg, var(--poster-fade), transparent 65%); }
  [dir="rtl"] .home-feat__fade { background: linear-gradient(270deg, var(--poster-fade), transparent 65%); }
  .home-feat__text { max-width: 55%; }
}

/* --- The options under a setup hero -----------------------------------------
   The shared form pieces every setup screen is built from, in the poster look
   (the owner, 26 Sep 2026): each option a calm rounded row on the card, its
   label at the start; a count at the end of that row, a switch at the end of
   its; a choice of a few as a pill track with the accent thumb; a list with an
   accent chevron. Scoped to the setup screens: the lobbies, the settings sheet
   and the game boards keep their controls. Sizes stay the system's (48px
   fields, 44px taps). A group without .field (a <div> whose first child is its
   label) is a row too; one holding fields or a card is not. */
[id^="view-setup-"] .field__label {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--text-2);
  text-transform: none;
  letter-spacing: 0;
}
[id^="view-setup-"] :is(.field, div:has(> .field__label:first-child):not(.card):not(:has(.field, .card))) {
  margin-bottom: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  background: var(--surface-2);
}
[id^="view-setup-"] .setup-more :is(.field, div:has(> .field__label:first-child):not(.card):not(:has(.field, .card))) { background: var(--surface-solid); }
[id^="view-setup-"] .setup-more { border-color: var(--hairline); }
[id^="view-setup-"] .setup-more__head { font-family: var(--font-display); }
/* A count: the label at the start of the row, − n + at its end. The rows are
   marked .stepper-row in Controller.html (every .stepper is there, right after
   its row's first child, the label). They were found with
   :is(.field, div):has(> .field__label:first-child + .stepper), and a :has()
   on a parent with a universal subject (> :not(...)) made every page
   mutation re-check styles far and wide: half of every room screen's style
   recalc (28 Sep 2026, *Performance*). The class is repeated to keep that
   selector's weight, (0,4,0), so the cascade is unchanged. */
[id^="view-setup-"] .stepper-row.stepper-row.stepper-row.stepper-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: var(--sp-3);
}
[id^="view-setup-"] .stepper-row.stepper-row.stepper-row.stepper-row > .field__label { margin: 0; }
[id^="view-setup-"] .stepper-row.stepper-row.stepper-row.stepper-row > .stepper { width: 9.5rem; }
[id^="view-setup-"] .stepper-row.stepper-row.stepper-row.stepper-row > :not(.field__label, .stepper) { grid-column: 1 / -1; }
[id^="view-setup-"] .stepper {
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
}
[id^="view-setup-"] .stepper__btn {
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
  box-shadow: none;
  font-family: var(--font-display);
}
[id^="view-setup-"] .stepper__btn:active { background: var(--accent-border); }
[id^="view-setup-"] .stepper__btn:disabled { opacity: 0.35; background: var(--accent-soft); }
[id^="view-setup-"] .stepper__value { font-family: var(--font-display); font-weight: 800; }
/* A choice of a few: a pill track and the accent thumb (syncSegmented's). */
[id^="view-setup-"] .segmented {
  padding: 4px;
  border-color: transparent;
  border-radius: var(--r-full);
  background: var(--surface-3);
}
/* The reading face, not Kufi: a row of seven clocks (شطرنج) has no room for
   Kufi's width. */
[id^="view-setup-"] .segmented__item { border-radius: var(--r-full); font-weight: 700; }
[id^="view-setup-"] .segmented__item.is-active { background: var(--accent); color: var(--accent-on); box-shadow: 0 6px 14px -6px var(--accent-glow); }
[id^="view-setup-"] .segmented.has-thumb .segmented__item.is-active { background: transparent; box-shadow: none; }
[id^="view-setup-"] .segmented::before {
  top: 4px;
  bottom: 4px;
  border-radius: var(--r-full);
  background: var(--accent);
  box-shadow: 0 6px 14px -6px var(--accent-glow);
}
[id^="view-setup-"] .field .segmented { background: var(--surface-solid); box-shadow: inset 0 0 0 1px var(--border); }
/* Six options or more (شطرنج's seven clocks) are narrow: a pill's round ends
   would cut into their words, so the track and the thumb are rounded boxes. */
[id^="view-setup-"] .segmented:has(> .segmented__item:nth-child(6)) { padding: 3px; border-radius: var(--r-md); }
[id^="view-setup-"] .segmented:has(> .segmented__item:nth-child(6))::before { top: 3px; bottom: 3px; border-radius: calc(var(--r-md) - 0.25rem); }
[id^="view-setup-"] .segmented:has(> .segmented__item:nth-child(6)) > .segmented__item { border-radius: calc(var(--r-md) - 0.25rem); padding-inline: 2px; }
/* A switch lit in the accent, with its glow. */
[id^="view-setup-"] .switch input:checked + .switch__track { box-shadow: 0 4px 12px -4px var(--accent-glow); }
/* A list: rounder, with the chevron in the accent - the saved-groups list
   too, whose `background` shorthand had dropped it (so the chevron's size,
   repeat and place are all said again here). */
[id^="view-setup-"] select {
  border-radius: var(--r-lg);
  background-image: linear-gradient(45deg, transparent 50%, var(--accent-ink) 50%),
                    linear-gradient(135deg, var(--accent-ink) 50%, transparent 50%);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
[dir="rtl"] [id^="view-setup-"] select { background-position: calc(var(--sp-5) - 3px) calc(50% + 1px), var(--sp-5) calc(50% + 1px); }
[dir="ltr"] [id^="view-setup-"] select { background-position: calc(100% - var(--sp-5)) calc(50% + 1px), calc(100% - var(--sp-5) + 5px) calc(50% + 1px); }

/* --- Hover, under a real mouse only: a poster lifts ---------------------------
   With translate and scale, not transform: the posters' rise-in keeps its
   transform (fill: both) through the first visit, which a hover's transform
   can't beat. */
@media (hover: hover) and (pointer: fine) {
  .gcard {
    transition: translate var(--dur-2) var(--ease-out), scale var(--dur-2) var(--ease-out),
                box-shadow var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
  }
  .gcard:hover { transform: none; translate: 0 -4px; scale: 1.02; box-shadow: var(--poster-shadow-hover); }
  .gcard.home-feat:hover, .gcard--spotlight:hover { translate: 0 -2px; scale: 1.006; }
  .gcard:hover:active { translate: none; scale: 0.97; box-shadow: var(--sh-2); }
}

/* --- The featured poster changes with a small fade and rise (catalogFeatured) --- */
@keyframes homeFeatIn {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to   { opacity: 1; transform: none; }
}
.gcard.home-feat--in { animation: homeFeatIn 360ms var(--ease-out) both; }

/* --- «الكل ›» in a section's head: only with shelves (below) --- */
.section__all {
  display: none;
  flex: none;
  align-items: center;
  min-height: 2.25rem;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--accent-ink);
  font-family: var(--font-display);
  font-size: var(--fs-xs);
  font-weight: 800;
  cursor: pointer;
}
.section__all:active { background: var(--surface-2); }
/* A 36px pill with a finger's height to hit. */
.section__all { position: relative; }
.section__all::before { content: ''; position: absolute; inset: -0.25rem 0; }

/* --- Sections as shelves (the grids renderHome and renderTogether mark
   .gcard-grid--shelf): one row of posters that scrolls sideways and fades at
   the edge it can still go to; «الكل» opens a section back into a wrapping
   grid, and so does a search (every result in sight). On every screen since
   3 Oct 2026 (the owner's look 3A: a phone's home was 5,372px of wrapping
   grids; it was laptops and TVs only). The padding keeps the posters' shadows
   and the hover lift inside the scroller. */
@media all {
  .gcard-grid.gcard-grid--shelf {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: 9.5rem;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scroll-padding-inline: var(--sp-1);
    scrollbar-width: none;
    padding: var(--sp-2) var(--sp-1) var(--sp-6);
    margin: calc(-1 * var(--sp-2)) calc(-1 * var(--sp-1)) calc(-1 * var(--sp-4));
  }
  .gcard-grid--shelf::-webkit-scrollbar { display: none; }
  .gcard-grid--shelf > .gcard { scroll-snap-align: start; }
  .section.is-open > .gcard-grid--shelf,
  .is-searching .gcard-grid--shelf {
    grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
    grid-auto-flow: row;
    grid-auto-columns: auto;
    overflow: visible;
    -webkit-mask-image: none;
            mask-image: none;
  }
  .section.has-more .section__all { display: inline-flex; }
  .is-searching .section__all { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .nav-room__btn, .home-feat__btn { transition: none; }
  .gcard.home-feat--in { animation: none; }
}

/* --- The design review of the arcade look (26 Sep 2026) ----------------------
   What the review found across the shell, the solo boards and the tools,
   fixed on the shared pieces so every screen gets them. */

/* The home's chips on a phone: at most two rows (they wrapped to four, ~200px,
   and pushed the first poster down). Shorter chips with small labels, the row
   of ways and the pinned «مين وكام؟» one wrapped flow (the row is `contents`,
   so its chips and the pinned one share the bar's lines); the emoji go, the
   words stay - two rows can't hold seven chips with them at 375px. */
@media (max-width: 899px) {
  .home-tools .filter-bar { flex-wrap: wrap; gap: 6px; }
  .home-tools .filter-bar > .filter-row:not(.filter-row--players) { display: contents; }
  .home-tools .filter-bar .filter-chip {
    height: 2.25rem;
    padding-inline: 0.625rem;
    gap: 0.25rem;
    font-size: var(--fs-xs);
  }
  .home-tools .filter-bar .filter-chip > span[aria-hidden="true"]:first-child { display: none; }
  /* 36px chips (two rows at most), each hit 44px tall through the 6px gap. */
  .home-tools .filter-bar .filter-chip { position: relative; }
  .home-tools .filter-bar .filter-chip::before { content: ''; position: absolute; inset: -0.25rem 0; }
}

/* Settings on a laptop: a sheet of a readable width (a value sat 500px from
   its label), and each value a small pill with a chevron, so it reads as
   something that changes when tapped. */
#settings-modal .modal-content { max-width: 30rem; }
.setting-row__value {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  min-height: 1.75rem;
  padding: 0 0.625rem;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-xs);
  font-weight: 800;
}
.setting-row__value:empty { display: none; }
.setting-row__value::after {
  content: '';
  width: 0.375rem;
  height: 0.375rem;
  border-inline-end: 2px solid currentColor;
  border-block-end: 2px solid currentColor;
  transform: rotate(-45deg);
  opacity: 0.8;
}
[dir="rtl"] .setting-row__value::after { transform: rotate(45deg); }

/* «الليلة دي؟»: the count and the way chips at the tap floor. */
.tonight-row .filter-chip { height: var(--tap); min-width: var(--tap); justify-content: center; }

/* A solo board's row of tools (↶ ⌫ ✏️ 💡): one line each, the label smaller,
   and the row wraps to equal buttons when a language's words are long - never
   a label broken over two lines, which made one button taller than the rest. */
.sdk-tools .btn {
  flex: 1 1 calc(25% - var(--sp-2));
  /* Never narrower than its label: a narrow side column (a phone on its side) wraps the row instead of cutting «✏️ ملاحظات». */
  min-width: max-content;
  gap: 0.25rem;
  padding-inline: var(--sp-1);
  font-size: var(--fs-xs);
  white-space: nowrap;
}

/* The solo stats (level, time, mistakes) in the game's own colour, not white
   boxes with a hairline. */
.solo-stat { border: 0; background: var(--accent-soft); }
.solo-stat__label { color: var(--accent-ink); opacity: 0.8; }
.solo-stat .metric { color: var(--accent-ink); font-family: var(--font-display); }
/* The streak's three hearts fit their box: they wrap, never clip. */
.solo-stat .metric:has(.streak-hearts) { overflow: visible; white-space: normal; }
.streak-hearts { flex-wrap: wrap; justify-content: center; }

/* A phone upright: the raised «افتح غرفة» stands 1.75rem into the page, so the
   page ends that much higher (the Word Wheel's ✓ row and the dice's «ارمي
   النرد» sat under it), and a stuck Start bar keeps its button clear of it. */
@media (max-width: 899px) and (min-height: 501px) {
  body:not(.is-fullscreen-view):not(.is-tv-view):not(.has-audience) .shell__main { --main-pb: calc(var(--sp-6) + 1.75rem); }
  body:not(.is-fullscreen-view) .view-actions--start { padding-bottom: calc(var(--sp-3) + 1.75rem); }
}

/* The Start bar has a ground: the page's own colour with a short fade above,
   so a hint scrolled under it never shows between the button and the bar (a
   Start bar in a card stands on the card). */
.view-actions--start { background: linear-gradient(to top, var(--bg) calc(100% - var(--sp-3)), transparent); }
.card .view-actions--start { background: linear-gradient(to top, var(--surface) calc(100% - var(--sp-3)), transparent); }
/* A screen whose Start is a choice (Wordle's length, the teams' two ways):
   the buttons side by side, one line each. */
.view-actions--row { display: flex; gap: var(--sp-2); }
.view-actions--row > .btn { flex: 1 1 0; min-width: 0; padding-inline: var(--sp-2); white-space: nowrap; }

/* A count row (a label, then − n +) inside a two-column grid got half the
   width, and its label was cut to «عد / الج»: those rows stack, each the
   whole width, and the label always keeps its room. */
[id^="view-setup-"] .grid-2:has(> .stepper-row.stepper-row.stepper-row.stepper-row) { grid-template-columns: minmax(0, 1fr); gap: 0; }
[id^="view-setup-"] .stepper-row.stepper-row.stepper-row.stepper-row > .field__label { min-width: 0; }

/* The score keepers' round card: its counts are the setup's steppers - a pill
   track, round accent buttons, the value in the display face. */
.cs-step {
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  overflow: visible;
}
.cs-step__btn {
  width: 2.5rem;
  min-height: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--font-display);
}
.cs-step__btn:active { background: var(--accent-border); }
.cs-step__val { min-height: 2.5rem; font-family: var(--font-display); font-weight: 800; }
.cs-step__val::placeholder { color: var(--text-3); opacity: 1; }

/* A level segment with its count of letters under it (كلمات من حروف). */
.segmented__item:has(> .segmented__sub) { gap: 0; padding-block: 3px; line-height: 1.15; }
.segmented__sub { display: block; font-size: 0.66rem; font-weight: 600; opacity: 0.8; }

/* The chess puzzles' ways: the whole row is the button, so its «العب» is
   plain words and a chevron, not a pill that looked like a small button. */
.chpz-way__status .badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent-ink);
  font-size: var(--fs-sm);
  font-weight: 800;
}
.chpz-way__status .badge::after { content: '›'; font-size: 1.25rem; line-height: 1; }
[dir="rtl"] .chpz-way__status .badge::after { content: '‹'; }

/* The daily archive's rows: the name and its line take the room, «▶ العب» only
   what it needs. */
.daily-row > .tool-info { flex: 1 1 auto; min-width: 0; }
.daily-row > .daily-row__play { flex: none; }

/* The result sheet: the number and its label never touch, however tall the
   sheet grows with its buttons. */
.solo-result-value { flex: none; gap: var(--sp-1); }
.solo-result-value .metric { line-height: 1.1; }

/* Word Wheel on a laptop or a TV: the crossword and the wheel sized from the
   screen's height like every other board (they were ~200px in a big stage). */
@media (min-width: 900px) and (min-height: 501px) {
  .solo-layout__board:has(.wheel-grid) { width: min(calc(var(--app-h, 100vh) - var(--header-h) - 3rem), 44vw); }
  .solo-layout__board .wheel-grid { max-width: min(calc(var(--ww-cols) * 4.5rem), calc((var(--app-h, 100vh) - var(--header-h) - 3rem) * var(--ww-cols) / var(--ww-rows, 5))); }
  .solo-layout__board .wheel-cell { font-size: clamp(1.1rem, 2.4vh, 1.9rem); }
  .solo-layout__side .wheel-ring { width: clamp(14rem, calc(var(--app-h, 100vh) - 22rem), 21rem); }
  .solo-layout__side .wheel-letter { width: 4.25rem; height: 4.25rem; font-size: 1.9rem; }
}

/* A phone on its side. */
@media (orientation: landscape) and (max-height: 500px) {
  /* What links them?: a narrower list, so its six choices sit two by two. */
  .solo-layout__board:has(.pin-clues) { width: min(36vw, 20rem); }
  .solo-choices:has(> :nth-child(5)) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .streak-hearts { font-size: 0.8rem; }

  /* The setup hero is compact: the art a 6rem tile beside the text, so the
     options are on the first screen. (Its «القوانين» button went on 3 Oct 2026,
     the owner: the «أول مرة؟» drawer is the one way to the rules there.) */
  .game-hero {
    display: grid;
    grid-template-columns: 6rem minmax(0, 1fr);
    grid-template-areas: "art text" "art card";
    align-items: center;
    column-gap: var(--sp-3);
    padding: var(--sp-3);
  }
  .game-hero__art { grid-area: art; height: 6rem; border-radius: var(--r-lg); overflow: hidden; }
  .game-hero__art::after { display: none; }
  .game-hero__icon { padding-bottom: 0; font-size: 3.4rem; }
  .game-hero__text { grid-area: text; margin-top: 0; padding: 0; }
  .game-hero__title { font-size: var(--fs-h2); }
  .game-hero .first-play-card { grid-area: card; margin: var(--sp-2) 0 0; }
  .game-hero:not(:has(.first-play-card)) { grid-template-areas: "art text"; }
}

/* ==========================================================================
   41. MOTION EVERYWHERE - the owner, 26 Sep 2026: "Smooth, nice motion
   everywhere, on every screen and not only in some games." The script is
   JS_Motion.html section 13: a screen entered rises in card by card
   (motionEnterView, from setView), a popup's rows rise under its spring
   (motionRiseModal, from hoistModals' observer), chips give under the finger,
   a changed number pops (motionBump), a lobby row that leaves fades where it
   stood (motionRowsSwap). Those are Web Animations of the individual
   `translate` / `scale` / `opacity` properties with nothing left behind, so
   they need no CSS; what is here is only what CSS does better: the popup's
   spring, the header's title and back chevron, the leaving row's box. No
   component's look is restyled (sections 39 and 40 own that). Nothing here
   moves while a screen sits still.
   ========================================================================== */

/* A popup opens with a spring; the backdrop's fade is overlayIn (section 9),
   the close is the ghost (modalExitGhost). */
/* `backwards`, not `both`: once open the dialog carries no transform at all
   (a transformed box is the containing block of its fixed children). */
.modal-content { animation: dialogSpring 260ms var(--ease-spring) backwards; }
@keyframes dialogSpring {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: none; }
}

/* The header's title cross-fades with a 4px rise; the back chevron fades and
   grows in rather than popping (it keeps its box, so the title never jumps). */
.shell__title {
  transition: opacity var(--dur-2) var(--ease-out), translate var(--dur-2) var(--ease-out);
}
.shell__title.is-swapping { translate: 0 4px; }
#nav-back {
  transition: transform var(--dur-1) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              opacity var(--dur-2) var(--ease-out),
              scale var(--dur-2) var(--ease-spring),
              visibility 0s linear 0s;
}
#nav-back.is-hidden {
  opacity: 0;
  scale: 0.7;
  transition: opacity var(--dur-2) var(--ease-out), scale var(--dur-2) var(--ease-out), visibility 0s linear var(--dur-2);
}

/* A lobby row that left, fading where it stood over the list (motionRowsSwap). */
.motion-row-ghost {
  position: absolute;
  margin: 0;
  box-sizing: border-box;
  pointer-events: none;
  z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
  .modal-content { animation: none; }
  .shell__title, #nav-back, #nav-back.is-hidden { transition: none; }
  .shell__title.is-swapping { translate: none; }
  .motion-row-ghost { display: none; }
}

/* ==========================================================================
   40. ARCADE: ROOMS - the room's lobby and its list of games in the arcade
   look (section 39), approved as a follow-up on 26 Sep 2026: the games a
   room can pick are small posters in their own colour, the code is a
   gradient of amber, pink and violet, the players are cards with an
   avatar, and the banner of a room left behind wears the new colours.
   The home's posters (.gcard) are section 39's; these are their room kin.
   ========================================================================== */

/* --- The list of games: posters, three across on a phone --- */
.game-grid.room-posters {
  grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr));
  grid-auto-rows: auto;
  gap: var(--sp-2);
}
.game-card.room-poster {
  aspect-ratio: 3 / 4;
  min-height: 0;
  padding: var(--sp-2);
  justify-content: flex-end;
  align-items: stretch;
  gap: 2px;
  border: 0;
  border-radius: var(--r-lg);
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: #ffffff;
  text-align: start;
  box-shadow: var(--poster-shadow);
}
/* The dark fade the name sits on (the old tile's wash, repainted). */
.game-card.room-poster::after {
  background: linear-gradient(180deg, transparent 42%, var(--poster-fade));
  opacity: 1;
}
.game-card.room-poster:active { transform: scale(0.96); box-shadow: var(--sh-2); }
.game-card.room-poster:active::after { opacity: 1; }
.game-card.room-poster > .game-icon {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: grid;
  place-items: center;
  padding-bottom: 2rem;
  font-size: 2.9rem;
  line-height: 1;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.35));
}
.game-card.room-poster:active .game-icon { transform: none; }
.room-poster .game-icon .art-icon { width: 1em; height: 1em; }
.game-card.room-poster > .game-title {
  min-height: 0;
  display: block;
  font-family: var(--font-display);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.2;
  color: #ffffff;
  text-align: start;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}
.room-poster .game-card__hint {
  font-size: 0.66rem;
  font-weight: 700;
  line-height: 1.2;
  color: rgba(255, 255, 255, 0.82);
}
/* A game the room can't start yet: greyed, its "N more needed" a dark pill. */
.game-card.room-poster.is-disabled { opacity: 1; filter: grayscale(0.9) brightness(0.82); box-shadow: var(--sh-1); }
.game-card.room-poster.is-disabled > .game-icon { opacity: 0.45; }
.game-card.room-poster.is-disabled > .game-title { opacity: 0.85; }
.game-card.room-poster > .game-card__need {
  position: absolute;
  top: var(--sp-2);
  inset-inline: var(--sp-2);
  z-index: 1;
  justify-self: start;
  width: fit-content;
  max-width: calc(100% - 2 * var(--sp-2));
  padding: 2px 7px;
  border-radius: var(--r-full);
  background: rgba(0, 0, 0, 0.62);
  color: #ffffff;
  font-size: 0.66rem;
  font-weight: 800;
  line-height: 1.35;
  text-align: start;
}
/* A family of games (chess's ways): a second card peeks out behind it. */
.game-card.room-poster--family,
.tv-hub__game.tv-hub__game--family {
  box-shadow: 5px -5px 0 -1px color-mix(in srgb, var(--accent) 45%, transparent), var(--poster-shadow);
}
[dir="rtl"] .game-card.room-poster--family,
[dir="rtl"] .tv-hub__game.tv-hub__game--family {
  box-shadow: -5px -5px 0 -1px color-mix(in srgb, var(--accent) 45%, transparent), var(--poster-shadow);
}
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .game-grid.room-posters { grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: var(--sp-3); }
  .game-card.room-poster > .game-icon { font-size: 3.2rem; }
}

/* The game chosen, over its options: a strip of its poster, ringed in amber. */
.chosen-game {
  border: 0;
  border-radius: var(--r-lg);
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: #ffffff;
  box-shadow: 0 0 0 3px var(--pop), var(--poster-shadow);
}
.chosen-game__icon { font-size: 1.9rem; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3)); }
.chosen-game__icon .art-icon { width: 1em; height: 1em; }
.chosen-game__name { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 800; color: #ffffff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
.chosen-game .btn--ghost { background: rgba(0, 0, 0, 0.24); border-color: rgba(255, 255, 255, 0.35); color: #ffffff; }
.chosen-game .btn--ghost:active { background: rgba(0, 0, 0, 0.4); }

/* --- The code: amber → pink → violet, each letter its own slice ---
   background-clip: text on the code doesn't reach letters that drop in with a
   transform, so each letter carries the gradient, sized to the whole code
   (--n letters) and moved to its own place in it (--i). */
.room-code { font-size: 2.75rem; }
.room-code span,
.room-code:not(.skel):not(:has(span)),
.tv-join__code {
  background-image: linear-gradient(90deg, #fbbf24, #f472b6, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.room-code span {
  background-size: calc(var(--n, 4) * 100%) 100%;
  background-position: calc(var(--i, 0) * 100% / max(1, var(--n, 4) - 1)) 0;
}
/* On the light ground the amber end needs an edge to be read across a table. */
body:not(.dark) .room-code span,
body:not(.dark) .tv-join__code { filter: drop-shadow(0 1px 0 rgba(52, 29, 120, 0.35)); }
.tv-join__code { font-family: var(--font-display); }
.room-qr, .tv-qr { border-radius: var(--r-lg); }

/* --- The players: cards with an avatar, the presence dot on its corner --- */
#room-player-list .lobby-row {
  min-height: 3.5rem;
  gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border: 0;
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
  overflow: visible;
}
#room-player-list .lobby-row.is-host { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pop) 70%, transparent), var(--sh-2); }
#room-player-list .lobby-row .status-row__name { font-size: var(--fs-body); font-weight: 700; }
#room-player-list .lobby-row .room-name-btn { font-family: inherit; }
.lobby-avatar {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: var(--accent-on);
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 800;
  line-height: 1;
  box-shadow: var(--sh-1);
}
.lobby-avatar--emoji { background: var(--surface-2); font-size: 1.25rem; }
.lobby-avatar .presence-dot {
  position: absolute;
  bottom: -1px;
  inset-inline-end: -1px;
  width: 0.8rem;
  height: 0.8rem;
  border: 2px solid var(--surface-solid);
  box-shadow: none;
}
.lobby-avatar .presence-dot.is-online { box-shadow: none; }
.lobby-row__host {
  background: color-mix(in srgb, var(--pop) 20%, transparent);
  color: var(--text-strong);
}

/* --- The host's folded options and «أنت: منى ✏️» --- */
.lobby-opts { border: 0; border-radius: var(--r-xl); box-shadow: var(--sh-2); }
.lobby-opts__title { font-family: var(--font-display); }

/* --- The banner of a room left behind: violet and amber, not the old mint --- */
.active-room-banner {
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.16), rgba(245, 158, 11, 0.12));
  border-color: rgba(124, 58, 237, 0.30);
  box-shadow: 0 6px 18px -8px rgba(124, 58, 237, 0.35);
}
body.dark .active-room-banner {
  background: linear-gradient(135deg, rgba(124, 58, 237, 0.34), rgba(251, 191, 36, 0.12));
  border-color: rgba(167, 139, 250, 0.35);
}
.arb__badge { background: rgba(124, 58, 237, 0.14); border-color: rgba(124, 58, 237, 0.35); }
body.dark .arb__badge { background: rgba(167, 139, 250, 0.18); border-color: rgba(167, 139, 250, 0.4); }
.arb__code { font-family: var(--font-display); letter-spacing: 0.12em; }
.arb__btn { font-family: var(--font-display); }
.arb__btn--return {
  background: linear-gradient(180deg, var(--pop), var(--pop-hover));
  color: var(--pop-on);
  box-shadow: 0 6px 16px -6px var(--pop-glow);
}
.arb__btn--return:hover { box-shadow: 0 8px 20px -6px var(--pop-glow); }

/* --- The TV's list of games (the host's TV): the same posters, in its scale --- */
.tv-hub__game {
  justify-content: flex-end;
  align-items: stretch;
  overflow: hidden;
  border: 0;
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: #ffffff;
  box-shadow: var(--poster-shadow);
  text-align: start;
}
.tv-hub__game::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, var(--poster-fade));
  pointer-events: none;
}
.tv-hub__icon {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding-bottom: 1.1em;
  font-size: var(--tv-lg);
  filter: drop-shadow(0 0.15em 0.25em rgba(0, 0, 0, 0.35));
}
.tv-hub__icon .art-icon { width: 1em; height: 1em; }
.tv-hub__name {
  position: relative;
  font-family: var(--font-display);
  text-align: start;
  color: #ffffff;
  line-height: 1.2;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}
.tv-hub__game:hover:not(:disabled), .tv-hub__game:focus-visible { box-shadow: 0 0 0 3px var(--pop), var(--poster-shadow); }
.tv-hub__game:disabled { opacity: 1; filter: grayscale(0.9) brightness(0.82); box-shadow: none; }
.tv-hub__game:disabled .tv-hub__icon { opacity: 0.45; }
.tv-hub__need {
  top: 0.45em;
  inset-inline-start: 0.45em;
  inset-inline-end: auto;
  max-width: calc(100% - 0.9em);
  padding: 0.1em 0.5em;
  border-radius: var(--r-full);
  background: rgba(0, 0, 0, 0.62);
  color: #ffffff;
  font-weight: 800;
  line-height: 1.35;
}
.tv-lobby__avatar { background: linear-gradient(150deg, var(--accent), var(--accent-hover)); color: var(--accent-on); font-family: var(--font-display); }
.tv-lobby__player { border: 0; box-shadow: var(--sh-2); }
.tv-lobby__game { border: 0; background: linear-gradient(150deg, var(--accent), var(--accent-hover)); box-shadow: 0 0 0 3px var(--pop), var(--poster-shadow); }
.tv-lobby__game-text b { color: #ffffff; font-family: var(--font-display); }
.tv-lobby__game-text span { color: rgba(255, 255, 255, 0.86); }

@media (orientation: landscape) and (max-height: 500px) {
  .room-code { font-size: 2.25rem; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .room-code { font-size: 3.25rem; }
}

/* The host TV's list is the side that matters: it gets the width, the QR
   less. A poster is never narrower than 7rem, so its name reads from the
   sofa (the lead, 26 Sep 2026: readability wins); when they don't all fit,
   the list scrolls in its own box, a fade at its foot while there is more,
   and the QR, the code and the players stay where they are. The page never
   scrolls. Under the home's section heads (tvLobby). */
.tv-lobby:has(.tv-hub-box) {
  height: 100%;
  grid-template-columns: minmax(0, 0.6fr) minmax(0, 1.4fr);
  grid-template-rows: minmax(0, 1fr);
  align-content: stretch;
}
.tv-lobby:has(.tv-hub-box) > .tv-join { align-self: center; }
.tv-lobby:has(.tv-hub-box) > .tv-lobby__side { min-height: 0; height: 100%; }
.tv-lobby:has(.tv-hub-box) .tv-qr { width: min(34vmin, 440px); }
.tv-hub-box { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.tv-hub-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 4px 6px 0;
  margin: -4px -6px 0;
}
.tv-hub-scroll::-webkit-scrollbar { display: none; }
.tv-hub-box::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  height: clamp(28px, 7vmin, 90px);
  background: linear-gradient(180deg, transparent, var(--bg));
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur-2) var(--ease-out);
}
.tv-hub-box.has-more::after { opacity: 1; }
.tv-hub__sec + .tv-hub__sec { margin-top: calc(var(--tv-gap) * 1.2); }
.tv-hub__head {
  display: flex;
  align-items: center;
  gap: 0.4em;
  margin: 0 0 calc(var(--tv-gap) * 0.6);
  font-family: var(--font-display);
  font-size: max(1rem, var(--tv-sm));
  font-weight: 800;
  color: var(--text-strong);
}
.tv-hub {
  grid-template-columns: repeat(auto-fill, minmax(max(7rem, 12.5vmin), 1fr));
  gap: calc(var(--tv-gap) * 0.75);
}
.tv-hub__game { min-height: 0; aspect-ratio: 3 / 4; padding: 0.55em; }
.tv-hub__icon { font-size: max(2.4rem, var(--tv-lg)); }
.tv-hub__name { font-size: max(0.875rem, 1.55vmin); overflow-wrap: anywhere; }
/* "N more needed" on one line: a smaller pill, centred at the top. */
.tv-hub__need {
  inset-inline-end: 0.4em;
  inset-inline-start: 0.4em;
  top: 0.4em;
  width: fit-content;
  max-width: calc(100% - 0.8em);
  margin-inline: auto;
  padding: 0.15em 0.55em;
  font-size: max(0.66rem, 1.15vmin);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}
@media (prefers-reduced-motion: reduce) { .tv-hub-box::after { transition: none; } }

/* ==========================================================================
   42. ARCADE: ONE-PHONE GAMES - the design review of 26 Sep 2026 went through
   the games played on one phone in the arcade look and found the pieces the
   look had not reached: slate boxes, cards that still looked like forms, a
   counter reading backwards, buttons that wrapped. What each game shares is
   here; a game's own board keeps its own section.
   ========================================================================== */
/* The night stage of the full-screen games (مين يبدأ, على راسك, رد الفعل):
   the dark theme's ground in both themes, never the old slate navy. */
:root { --night: #0d0b16; --night-2: #1a1630; --night-3: #241e42; }
#view-play-reaction { background-color: var(--night); }

/* A well: a quiet box of the page's own paper for options and summaries
   (it replaces the slate boxes of من أنا؟'s options, كلمة واحدة's clues, the
   results' summaries and ربع قرد's log). */
.plate-well { padding: var(--sp-4); border-radius: var(--r-lg); background: var(--surface-3); border: 1px solid var(--border); }
.plate-well--flush { padding: 0; overflow: hidden; }
.plate-well__head { background: var(--surface-2); }
.plate-well__rows > tr + tr, .gn-history { border-top: 1px solid var(--border); }

/* A face-down role card is a poster in the game's colour: its drawn icon big,
   what to do in white over a fade. Its back is the card's paper with a band of
   the colour. The card keeps its one height for every role (.hold-card). */
.hold-card--poster .hold-card__front {
  position: relative;
  overflow: hidden;
  justify-content: flex-end;
  gap: var(--sp-1);
  padding: var(--sp-5) var(--sp-4);
  border: 0;
  border-radius: var(--r-xl);
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: #ffffff;
  box-shadow: var(--poster-shadow);
}
.hold-card--poster .hold-card__front::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), transparent 34%, transparent 46%, var(--poster-fade));
  pointer-events: none;
}
.hold-card--poster .hold-card__icon {
  position: absolute;
  inset: 0 0 34%;
  display: grid;
  place-items: center;
  font-size: 5.75rem;
  filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.38));
}
.hold-card--poster .hold-card__icon .art-icon { width: 1.2em; height: 1.2em; }
.hold-card--poster .hold-card__label,
.hold-card--poster .hold-card__hint { position: relative; z-index: 1; color: #ffffff; text-align: center; }
.hold-card--poster .hold-card__label { font-family: var(--font-display); }
.hold-card--poster .hold-card__hint { color: rgba(255, 255, 255, 0.82); }
.hold-card--poster .hold-card__back {
  align-items: center;
  padding: var(--sp-4);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: inset 0 0.625rem 0 var(--accent), var(--sh-3);
  text-align: center;
}
.hold-card--poster .hold-card__back > * { width: 100%; }
.hold-card--poster .reveal-plate { padding: var(--sp-4); border: 0; background: transparent; box-shadow: none; }
.hold-card--poster .reveal-plate.is-spy { background: var(--danger-soft); }
.hold-card__detail { padding: var(--sp-4); border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--border); }
.hold-card__word { font-family: var(--font-display); font-size: 2rem; font-weight: 900; line-height: 1.2; }
.hold-card__art, .title-art { display: inline-block; font-size: 1.25em; line-height: 1; vertical-align: -0.2em; }
.hold-card__art .art-icon, .title-art .art-icon { width: 1.2em; height: 1.2em; }

/* A pass-the-phone screen (من أنا؟, كلمة واحدة) is the same poster, with the
   name on it. */
.pass-poster {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: var(--sp-1);
  min-height: 13rem;
  margin-bottom: var(--sp-5);
  padding: var(--sp-5) var(--sp-4);
  border-radius: var(--r-xl);
  overflow: hidden;
  background: linear-gradient(150deg, var(--accent), var(--accent-hover));
  color: #ffffff;
  box-shadow: var(--poster-shadow);
  text-align: center;
}
.pass-poster::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), transparent 34%, transparent 46%, var(--poster-fade));
  pointer-events: none;
}
.pass-poster__icon {
  position: absolute;
  inset: 0 0 36%;
  display: grid;
  place-items: center;
  font-size: 5.25rem;
  filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.38));
}
.pass-poster__icon .art-icon { width: 1.2em; height: 1.2em; }
.pass-poster__label, .pass-poster__name { position: relative; z-index: 1; margin: 0; color: #ffffff; }
.pass-poster__label { font-size: var(--fs-sm); font-weight: 700; color: rgba(255, 255, 255, 0.85); }
.pass-poster__name { font-family: var(--font-display); font-size: 2rem; font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
#jo-phase-pass > .pass-poster { margin-bottom: 0; }

/* A drawn icon leading a button's words (كشف الجواسيس, اتهام الحرباء). */
.btn__art { display: inline-flex; font-size: 1.4em; line-height: 1; }
.btn__art .art-icon { width: 1em; height: 1em; }

/* The card of بدون كلام and أوصف لي: the game's colour as its frame, not a
   Tailwind palette (slate in the dark). */
.card--party {
  border: 3px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, var(--surface-solid));
  box-shadow: 0 16px 34px -14px var(--accent-glow);
}
.party-end-icon { font-size: 4.5rem; line-height: 1; margin: 0 auto var(--sp-3); filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.25)); }
.party-end-icon .art-icon { width: 1.2em; height: 1.2em; }

/* Buttons sharing a row stay one line each, however long the other's label
   (دوري المعرفة's «إظهار الإجابة», كلمة واحدة's verdict, خمس ثواني's judge). */
.btn-row--fit > .btn { flex: 1 1 0; min-width: 0; padding-inline: var(--sp-2); white-space: nowrap; }

/* The small strip over a play screen: pill chips, the number in .metric. */
.play-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.play-chip { height: 2rem; gap: var(--sp-1); padding-inline: var(--sp-3); font-size: var(--fs-xs); }
.play-chip .metric { font-size: var(--fs-sm); color: inherit; }
.play-chip--on { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

/* Words at the end of a round are words, not numbers (.metric is for numbers). */
.result-word { font-family: var(--font-display); font-size: 1.75rem; font-weight: 900; line-height: 1.2; }
.result-line { font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 800; color: var(--text-strong); }
.result-line .metric { font-size: 1.75rem; }
.result-reveal { margin-bottom: var(--sp-4); border-radius: var(--r-lg); }

/* «الترتيب» never touches what is above it. */
:is(#chameleon-result-detail, #spyfall-result-detail) > .modal-section:not(:first-child),
[id^="view-play-"] .scoreboard:not(:first-child) { margin-top: var(--sp-4); }

/* A podium's place number on its own ink: .metric's strong text on the
   winner's accent step was about 3:1. */
.podium__block .metric { color: inherit; }

/* A choice of six or more (شطرنج's seven clocks) was 35px a box at 375: it
   wraps into rows of boxes, each at least a finger tall and 3rem wide, the
   chosen one filled in place of the sliding thumb. */
@media (max-width: 559px) {
  :is([id^="view-setup-"], #view-room-lobby) .segmented:has(> .segmented__item:nth-child(6)) { display: grid; grid-template-columns: repeat(3, minmax(3rem, 1fr)); }
  :is([id^="view-setup-"], #view-room-lobby) .segmented:has(> .segmented__item:nth-child(7)) { grid-template-columns: repeat(4, minmax(3rem, 1fr)); }
