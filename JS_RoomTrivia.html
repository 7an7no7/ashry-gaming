<script>
/* ============================================================================
   تحدي المعلومات — LIVE GROUP TRIVIA
   ----------------------------------------------------------------------------
   The host picks how many questions (5 to 20); everyone answers at once. A
   right answer is 10 points and the fastest right answers get up to 5 more
   (RoomGames.js). The server shuffles each question's choices and holds the
   answer until the question closes.
   ========================================================================= */

const trivia = {
  picked: null,      // { q: question index, choice } — what this phone tapped
  clock: null,
  clockKey: null,    // the deadline the running clock belongs to
  fired: false       // that deadline has already been acted on
};

const TRIVIA_COUNTS = [5, 10, 15, 20];   // must match TRIVIA_COUNTS in RoomGames.js
const TRIVIA_COUNT_KEY = 'ashryTriviaCount';

/** The host's choice: the picker if it is on screen, else what they chose last time. */
function triviaCountChoice() {
  const select = document.getElementById('trivia-count');
  if (select) return Number(select.value);
  try {
    const saved = Number(localStorage.getItem(TRIVIA_COUNT_KEY));
    return TRIVIA_COUNTS.indexOf(saved) !== -1 ? saved : 10;
  } catch (e) {
    return 10;
  }
}

function rememberTriviaCount(value) {
  try { localStorage.setItem(TRIVIA_COUNT_KEY, String(value)); } catch (e) {}
}

ROOM_GAMES.trivia = {
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = TRANSLATIONS[appState.lang];
    const chosen = triviaCountChoice();
    return `
      <div class="card card--tight">
        <label class="field__label" for="trivia-count">${t.trivia_count || ''}</label>
        <select id="trivia-count" onchange="rememberTriviaCount(this.value)">
          ${TRIVIA_COUNTS.map(n => `<option value="${n}" ${n === chosen ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
        <p class="field__hint" style="text-align:center">${t.trivia_hint || ''}</p>
      </div>`;
  },
  startPayload: () => ({ lang: VOTE_LANG(), count: triviaCountChoice() }),

  render(state) {
    if (appState.currentView !== 'room-trivia') setView('room-trivia');
    const el = document.getElementById('view-room-trivia');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const iAnswered = (s.answered || []).indexOf(Room.me) !== -1;

    const sig = ['trivia', s.phase, s.qIndex, iAnswered, (s.answered || []).length, state.youAreHost].join('|');
    const rebuilt = renderRoomFrame(el, sig, () => triviaFrame(state, t, iAnswered));
    if (rebuilt && s.phase === 'gameover' && typeof confetti === 'function') {
      confetti({ particleCount: 160, spread: 80 });
    }
    refreshRoomPlayerStrip(el, state);

    if (s.phase === 'answering') startTriviaClock(s);
    else stopTriviaClock();
  }
};

function triviaFrame(state, t, iAnswered) {
  const s = state.shared;
  const letters = ['A', 'B', 'C', 'D'];
  const inRound = (s.roster || []).indexOf(Room.me) !== -1;

  if (s.phase === 'gameover') {
    const board = s.board || [];
    const best = board.length ? board[0].score : 0;
    const champs = board.filter(p => best > 0 && p.score === best).map(p => escapeHTML(p.name));
    return `
      <div class="card card--accent" style="text-align:center">
        <div class="eyebrow">${t.trivia_champion || ''}</div>
        <div class="metric metric--md metric--accent">🏆 ${champs.join(' · ') || '—'}</div>
      </div>
      ${renderScoreboard(board)}
      ${state.youAreHost
        ? `<div class="btn-stack">
             <button class="btn btn--primary btn--lg" onclick="roomAct('playAgain', { lang: '${VOTE_LANG()}' })">${t.play_again || ''}</button>
             <button class="btn btn--ghost" onclick="roomAct('backToHub')">${t.room_another_game || ''}</button>
           </div>`
        : `<div class="waiting-note">${t.room_wait_host || ''}</div>`}
      ${renderRoomPlayerStrip(state)}`;
  }

  const header = `
    <div class="cn-score">
      <span class="cn-score__role">🧠 ${t.trivia_q_of || ''} ${s.qIndex + 1} / ${s.totalQuestions}</span>
      ${s.phase === 'answering' ? `<span id="trivia-timer" class="badge badge--accent">${s.seconds || ''}</span>` : ''}
    </div>
    <div class="card" style="text-align:center">
      <div class="prompt-text">${escapeHTML(s.question || '')}</div>
    </div>`;

  if (s.phase === 'answering') {
    const mine = (trivia.picked && trivia.picked.q === s.qIndex) ? trivia.picked.choice : null;
    const present = state.players.map(p => p.id);
    const expected = (s.roster || []).filter(id => present.indexOf(id) !== -1).length;
    return header + `
      <div class="btn-stack">
        ${s.choices.map((c, i) => `
          <button class="ballot-option trivia-choice ${mine === i ? 'is-picked' : ''}"
                  ${iAnswered || !inRound ? 'disabled' : ''} onclick="chooseTriviaAnswer(${i})">
            <span class="trivia-letter">${letters[i]}</span>
            <span class="ballot-option__label">${escapeHTML(c)}</span>
          </button>`).join('')}
      </div>
      <div class="vote-progress">
        <span>${iAnswered ? '🔒 ' + (t.trivia_locked || '') : (inRound ? '' : (t.vote_spectating || ''))}</span>
        <span>${(s.answered || []).length}/${expected} ${t.trivia_answered || ''}</span>
      </div>
      ${state.youAreHost ? `
        <div class="btn-stack" style="margin-top: var(--sp-3)">
          <button class="btn btn--ghost btn--sm" onclick="roomAct('closeQuestion')">${t.trivia_close_early || ''}</button>
        </div>` : ''}
      ${renderRoomPlayerStrip(state)}`;
  }

  // results
  const counts = s.choiceCounts || [];
  const total = Math.max(1, counts.reduce((a, b) => a + b, 0));
  const myPick = (s.picks || {})[Room.me];
  const gained = (s.gained || {})[Room.me];
  const last = s.qIndex + 1 >= s.totalQuestions;

  let verdict = '';
  if (inRound) {
    verdict = typeof myPick !== 'number'
      ? `<span class="tx-muted">${t.trivia_no_answer || ''}</span>`
      : (myPick === s.correctAnswer
          ? `<span class="tx-success">🎉 +${gained || 0}${(s.order || []).indexOf(Room.me) !== -1 ? ' · ' + (t.trivia_rank || '#{n}').replace('{n}', (s.order || []).indexOf(Room.me) + 1) : ''}</span>`
          : `<span class="tx-danger">${t.trivia_wrong || ''}</span>`);
  }

  return header + `
    <div class="result-list">
      ${s.choices.map((c, i) => {
        const right = i === s.correctAnswer;
        const wrongPick = myPick === i && !right;
        const pct = Math.round(((counts[i] || 0) / total) * 100);
        return `
          <div class="result-row trivia-result ${right ? 'is-correct' : ''} ${wrongPick ? 'is-wrong' : ''}">
            <div class="result-row__bar" style="width:${pct}%"></div>
            <div class="result-row__body">
              <span class="result-row__label">${right ? '✅' : (wrongPick ? '❌' : letters[i])} ${escapeHTML(c)}</span>
              <span class="result-row__count">${counts[i] || 0}</span>
            </div>
          </div>`;
      }).join('')}
    </div>
    ${verdict ? `<div class="waiting-note">${verdict}</div>` : ''}
    ${renderScoreboard(s.board)}
    ${state.youAreHost
      ? `<div class="btn-stack">
           <button class="btn btn--primary btn--lg" onclick="roomAct('nextQuestion')">${last ? (t.trivia_final || '') : (t.next_q_btn || '')}</button>
         </div>`
      : `<div class="waiting-note">${t.room_wait_host || ''}</div>`}
    ${renderRoomPlayerStrip(state)}`;
}

function chooseTriviaAnswer(choice) {
  const s = Room.state && Room.state.shared;
  if (!s || s.phase !== 'answering') return;
  trivia.picked = { q: s.qIndex, choice: choice };
  // Lock the buttons now: a second tap on another choice before the answer is
  // back would otherwise look like it changed the answer.
  document.querySelectorAll('#view-room-trivia .trivia-choice').forEach((b, i) => {
    b.disabled = true;
    b.classList.toggle('is-picked', i === choice);
  });
  playSound('click');
  haptic('light');
  Room.act('answer', { choice: choice }).catch(err => {
    trivia.picked = null;
    showToast(err.message || 'تعذر الإرسال', 'error');
    const el = document.getElementById('view-room-trivia');
    if (el) delete el.dataset.sig;
    if (Room.state) ROOM_GAMES.trivia.render(Room.state);
  });
}

function paintTriviaTimer(endsAt) {
  const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
  const el = document.getElementById('trivia-timer');
  if (el) {
    el.textContent = left;
    el.classList.toggle('badge--danger', left <= 5);
    el.classList.toggle('badge--accent', left > 5);
  }
  // The same clock on a big screen (JS_RoomTv.html).
  const big = document.getElementById('tv-trivia-timer');
  if (big) {
    big.textContent = left;
    big.classList.toggle('is-low', left <= 5);
  }
}

function startTriviaClock(s) {
  // A rebuilt frame has a fresh timer badge that needs its number straight away.
  paintTriviaTimer(s.endsAt);
  if (trivia.clockKey === s.endsAt && (trivia.clock ? trivia.clock.isRunning() : trivia.fired)) return;

  stopTriviaClock();
  trivia.clockKey = s.endsAt;
  trivia.fired = false;
  const endsAt = s.endsAt;
  trivia.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)),
    onTick: () => paintTriviaTimer(endsAt),
    onEnd: () => {
      trivia.clock = null;
      trivia.fired = true;
      const close = () => {
        const st = Room.state;
        if (!st || st.shared.phase !== 'answering' || st.shared.endsAt !== endsAt) return;
        Room.act('closeQuestion').catch(() => {});
      };
      // The host closes on time; anyone else a few seconds later if the host
      // hasn't. The server closes it as well (roomTimeout), even if every
      // phone is asleep.
      if (Room.isHost) close();
      else setTimeout(close, 3000);
    }
  });
}

function stopTriviaClock() {
  if (trivia.clock) trivia.clock.stop();
  trivia.clock = null;
  trivia.clockKey = null;
  trivia.fired = false;
}
</script>
