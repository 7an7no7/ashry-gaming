<script>
/* ============================================================================
   القنبلة — ON THE TV (and every phone)
   ----------------------------------------------------------------------------
   The category is on the big screen and on every phone, and the bomb is on
   one phone at a time: the holder's phone ticks and carries the pass button,
   the others show who has it. The fuse is a server clock nobody can read:
   phones get `heat` (0-3) and tick faster with it, and the server says when
   it goes off - in whoever's hands it is. The strikes are the board. Rules:
   bombRoomAction in RoomGames.js.
   ========================================================================= */

const bombRoom = { tickTimer: null, tickingKey: '', fixing: false, passKey: '', passSeenAt: 0, sendBackTimer: null };

/*
 * The holder may send a pass back for BOMB_SEND_BACK_MS on the server (15s).
 * A phone's clock can't be compared with the server's, so the button counts
 * from the moment this phone saw the pass, less a second for the time the pass
 * took to arrive, and goes away when that runs out. The host's own send-back
 * has no clock and stays.
 */
const BOMB_SEND_BACK_SHOW_MS = 14000;

/** How long the holder's send-back button has left, starting the count on a new pass. */
function bombSendBackLeft(s) {
  if (!s || !s.fromId || s.phase !== 'ticking') return 0;
  const key = String(s.passedAt || '') + '|' + s.fromId;
  if (bombRoom.passKey !== key) {
    bombRoom.passKey = key;
    bombRoom.passSeenAt = Date.now();
  }
  return Math.max(0, bombRoom.passSeenAt + BOMB_SEND_BACK_SHOW_MS - Date.now());
}

/** Takes the holder's send-back button away the moment its time is up. */
function armBombSendBack(state) {
  clearTimeout(bombRoom.sendBackTimer);
  bombRoom.sendBackTimer = null;
  const el = document.getElementById('bomb-sendback');
  if (!el) return;
  const left = bombSendBackLeft(state.shared);
  if (left <= 0) { el.remove(); return; }
  bombRoom.sendBackTimer = setTimeout(() => {
    const still = document.getElementById('bomb-sendback');
    if (still) still.remove();
  }, left);
}

// A pass counts from when it reached this phone, even if the room screen
// wasn't showing at that moment.
Room.onChange((state) => {
  if (state && state.game === 'bomb') bombSendBackLeft(state.shared);
});

/** The ticking and the send-back timer stop with the deal (JS_Room.html, clocks). */
onRoomClocksReset(() => {
  if (bombRoom.tickTimer) clearTimeout(bombRoom.tickTimer);
  bombRoom.tickTimer = null;
  bombRoom.tickingKey = '';
  clearTimeout(bombRoom.sendBackTimer);
  bombRoom.sendBackTimer = null;
  bombRoom.fixing = false;
});
const BOMB_ROOM_OPTS_KEY = 'ashryBombRoomOpts';
const BOMB_TICK_MS = [1000, 700, 450, 250];   // by heat

function bombRoomOpts() {
  const base = { mode: 'category', fuse: 'normal' };
  try {
    const saved = JSON.parse(localStorage.getItem(BOMB_ROOM_OPTS_KEY) || 'null');
    if (saved && ['category', 'letter', 'mix'].indexOf(saved.mode) !== -1) base.mode = saved.mode;
    if (saved && ['short', 'normal', 'long'].indexOf(saved.fuse) !== -1) base.fuse = saved.fuse;
  } catch (e) {}
  return base;
}

function setBombRoomOpt(key, value) {
  const o = bombRoomOpts();
  o[key] = value;
  try { localStorage.setItem(BOMB_ROOM_OPTS_KEY, JSON.stringify(o)); } catch (e) {}
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
  haptic('light');
}

ROOM_GAMES.bomb = {
  lobbyOptions(state) {
    const t = TRANSLATIONS[appState.lang];
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(t.bomb_room_hint || '')}</p>`;
    const o = bombRoomOpts();
    const seg = (key, values, current) => `
      <div class="segmented" role="group">
        ${values.map(([v, label]) => `<button type="button" class="segmented__item ${v === current ? 'is-active' : ''}" onclick="setBombRoomOpt('${key}', '${v}')">${escapeHTML(label)}</button>`).join('')}
      </div>`;
    return `
      <div class="card card--tight">
        <div class="field">
          <label class="field__label">${escapeHTML(t.bomb_mode_label || '')}</label>
          ${seg('mode', [['category', t.bomb_mode_category], ['letter', t.bomb_mode_letter], ['mix', t.bomb_mode_mix]], o.mode)}
        </div>
        <div class="field">
          <label class="field__label">${escapeHTML(t.bomb_fuse_label || '')}</label>
          ${seg('fuse', [['short', t.bomb_fuse_short], ['normal', t.bomb_fuse_normal], ['long', t.bomb_fuse_long]], o.fuse)}
        </div>
        <p class="field__hint" style="text-align:center">${escapeHTML(t.bomb_room_hint || '')}</p>
      </div>`;
  },
  startPayload() {
    const o = bombRoomOpts();
    return { lang: VOTE_LANG(), mode: o.mode, fuse: o.fuse };
  },

  render(state) {
    if (appState.currentView !== 'room-bomb') setView('room-bomb');
    const el = document.getElementById('view-room-bomb');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const sig = ['bomb', s.phase, s.round, s.prompt, s.swaps || 0, s.holderId, s.fromId, s.passes, s.loserId, JSON.stringify(s.strikes || {}), state.youAreHost, appState.lang, bombRoom.fixing].join('|');
    // Where the bomb was on this screen, before a pass redraws it (the holder's own big bomb).
    const bigBefore = el.querySelector('.bomb-char--big');
    const fromBig = bigBefore && bombFx.holder[roomDealKey(state, s.round)] === Room.me && s.holderId !== Room.me ? bigBefore.getBoundingClientRect() : null;
    const rebuilt = renderRoomFrame(el, sig, () => bombRoomFrame(state, t));
    refreshRoomPlayerStrip(el, state);
    armBombSendBack(state);
    bombRoomCharacter(state, el, el, fromBig);
    bombRoomTicking(state, rebuilt);
  }
};

/** The card with the category, shared by the phone and the TV. */
function bombRoomCardHtml(s, t, o) {
  const opt = o || {};
  const kindLabel = s.kind === 'letter' ? (t.bomb_letter_label || '') : (t.bomb_category_label || '');
  if (s.phase === 'boom') {
    const boom = opt.boom || null;
    return `
      <div class="bomb-card bomb-card--boom ${boom ? 'is-exploding' : ''}" id="bomb-card" style="--bm-late: ${boom ? -boom.late : 0}ms">
        <div class="bomb-boom" aria-hidden="true" ${boom ? `data-reveal-ms="${Math.max(0, BOMB_BOOM_MS - boom.late)}"` : ''}>${bombBoomSvg({ size: opt.size === 'small' ? 'small' : 'big', late: boom ? boom.late : 0, settled: !boom })}</div>
        <div class="bomb-card__title">${escapeHTML(t.bomb_boom || '')}</div>
        <div class="bomb-card__sub">${escapeHTML(s.loserName ? (t.bomb_room_loser || '').replace('{name}', s.loserName) : (t.bomb_boom_hint || ''))}</div>
        <div class="bomb-card__prompt-small">${escapeHTML(kindLabel)}: <b>${escapeHTML(s.prompt || '')}</b></div>
      </div>`;
  }
  return `
    <div class="bomb-card ${s.heat >= 3 ? 'is-urgent' : ''}" id="bomb-card">
      <div class="bomb-fuse bm-holder">${bombCharSvg({ heat: s.heat, size: opt.size || 'small' })}</div>
      <div class="eyebrow">${escapeHTML(kindLabel)}</div>
      <div class="bomb-card__prompt ${s.kind === 'letter' ? 'bomb-card__prompt--letter' : ''}">${escapeHTML(s.prompt || '')}</div>
      <div class="bomb-card__sub">${escapeHTML(s.kind === 'letter' ? (t.bomb_room_letter_hint || '') : (t.bomb_room_category_hint || ''))}</div>
    </div>`;
}

/** Strikes, fewest first; whoever has most is losing. */
function bombStrikesHtml(s, t, o) {
  const board = s.board || [];
  if (!board.length) return '';
  const pop = o && o.boom && s.loserId ? s.loserId : '';
  return `
    <div class="card card--tight">
      <div class="eyebrow">💥 ${escapeHTML(t.bomb_room_strikes || '')}</div>
      ${board.map(p => `
        <div class="status-row" data-bm-pid="${escapeHTML(String(p.id || p.name))}">
          <div class="status-row__body"><div class="status-row__name">${escapeHTML(p.name)}</div></div>
          <span class="badge ${p.score ? 'badge--danger' : ''} ${pop && p.id === pop ? 'bm-strike-new' : ''}" ${pop && p.id === pop ? `style="--bm-late: ${-o.boom.late}ms"` : ''}>${p.score ? '💥'.repeat(Math.min(p.score, 5)) + (p.score > 5 ? ' ' + p.score : '') : '—'}</span>
        </div>`).join('')}
    </div>`;
}

/** Who has the bomb, as a row of the seating order with the holder lit. */
function bombOrderHtml(s, state, o) {
  const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
  const boom = s.phase === 'boom';
  const blown = o && o.boom;
  return `
    <div class="chip-set bomb-order">
      ${(s.order || []).filter(id => state.players.some(p => p.id === id)).map(id => {
        const lost = boom && id === s.loserId;
        const cls = lost ? 'bomb-order__loser' + (blown ? ' is-blown' : '') : (!boom && id === s.holderId ? 'bomb-order__holder' : 'chip--plain');
        const mark = lost ? '<span class="bomb-order__soot" aria-hidden="true">💥</span>'
          : (!boom && id === s.holderId ? `<span class="bomb-order__bomb" aria-hidden="true">${bombCharSvg({ heat: s.heat, size: 'mini', bubble: false })}</span>` : '');
        return `<span class="chip ${cls}" data-bm-pid="${escapeHTML(id)}" ${lost && blown ? `style="--bm-late: ${-blown.late}ms"` : ''}>${mark}${escapeHTML(nameOf(id))}</span>`;
      }).join('')}
    </div>`;
}

/** A player's name from the projection, for a message about them. */
function roomNameOf(state, id) {
  const p = (state.players || []).find(x => x.id === id);
  return p ? p.name : '';
}

function bombRoomFrame(state, t) {
  const s = state.shared;
  const iHold = s.holderId === Room.me;
  const head = `<div class="play-head"><span class="badge">${escapeHTML(t.round || '')} <span class="metric">${s.round}</span></span>
    ${s.phase === 'ticking' ? `<span class="badge ${iHold ? 'badge--danger' : ''}">💣 ${escapeHTML(iHold ? (t.bomb_room_yours || '') : (s.holderName || ''))}</span>` : ''}</div>`;
  if (s.phase === 'ticking') {
    const inRound = (s.roster || []).indexOf(Room.me) !== -1;
    return head + bombRoomCardHtml(s, t, { size: iHold ? 'big' : 'small' }) + `
      ${iHold
        ? `<div class="btn-stack">
             <button class="btn btn--danger btn--lg bomb-pass" onclick="passBomb(this)">${escapeHTML(t.bomb_room_pass || '')} ➡</button>
             ${s.fromId && bombSendBackLeft(s) > 0 ? `
               <div id="bomb-sendback" class="btn-stack">
                 <button class="btn btn--ghost btn--sm" onclick="roomAct('sendBack', ${bombSendBackPayload(s)})">${escapeHTML((t.bomb_send_back || '').replace('{name}', roomNameOf(state, s.fromId)))}</button>
                 <p class="field__hint" style="text-align:center">${escapeHTML(t.bomb_send_back_hint || '')}</p>
               </div>` : ''}
             <p class="field__hint" style="text-align:center">${escapeHTML(t.bomb_room_pass_hint || '')}</p>
             <p id="bomb-sound-hint" class="field__hint bomb-sound-hint hidden">🔇 ${escapeHTML(t.bomb_sound_hint || '')}</p>
           </div>`
        : (inRound ? `<div class="waiting-note">${escapeHTML((t.bomb_room_with || '').replace('{name}', s.holderName || ''))}</div>` : '')}
      ${bombOrderHtml(s, state)}
      ${state.youAreHost
        ? `<div class="btn-row" style="margin-top: var(--sp-3)">
             ${!iHold && s.fromId ? `<button class="btn btn--ghost btn--sm" onclick="roomAct('sendBack', ${bombSendBackPayload(s)})">${escapeHTML((t.bomb_send_back || '').replace('{name}', roomNameOf(state, s.fromId)))}</button>` : ''}
             <button class="btn btn--secondary btn--sm" onclick="roomAct('swap', { swaps: ${Number(s.swaps) || 0} })">${escapeHTML(t.bomb_swap || '')}</button>
             <button class="btn btn--ghost btn--sm" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button>
           </div>`
        : ''}
      ${bombStrikesHtml(s, t)}
      ${renderRoomPlayerStrip(state)}`;
  }
  // boom: the server already knows who was holding it; the host can correct.
  const boom = bombFxBoom(roomDealKey(state, s.round));
  return head + bombRoomCardHtml(s, t, { size: s.loserId === Room.me ? 'big' : 'small', boom }) + bombOrderHtml(s, state, { boom }) + `
    ${state.youAreHost
      ? `<div class="btn-stack">
           <button class="btn btn--primary btn--lg" onclick="roomAct('nextRound', { lang: '${VOTE_LANG()}' })">${escapeHTML(t.bomb_next_round || '')}</button>
           <div class="btn-row">
             <button class="btn btn--ghost btn--sm" onclick="bombRoom.fixing = !bombRoom.fixing; ROOM_GAMES.bomb.render(Room.state)">${escapeHTML(bombRoom.fixing ? (t.cancel || '') : (t.bomb_room_fix || ''))}</button>
             <button class="btn btn--ghost btn--sm" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || '')}</button>
           </div>
           ${bombRoom.fixing ? `
             <div class="card card--tight">
               <div class="eyebrow">${escapeHTML(t.bomb_room_who || '')}</div>
               <div class="btn-stack">
                 ${state.players.filter(p => (s.roster || []).indexOf(p.id) !== -1).map(p => `
                   <button class="btn btn--neutral ${p.id === s.loserId ? 'is-active' : ''}" onclick="bombRoom.fixing = false; roomAct('markLoser', { playerId: '${jsStringAttr(p.id)}' })">${escapeHTML(p.name)}</button>`).join('')}
               </div>
             </div>` : ''}
         </div>`
      // The next round only (anyone's once the host is away); the strike stays the host's to move.
      : roomMoveOnHtml(state,
          `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('nextRound', { lang: '${VOTE_LANG()}' })">${escapeHTML(t.bomb_next_round || '')}</button></div>`,
          `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`)}
    ${bombStrikesHtml(s, t, { boom })}
    ${renderRoomPlayerStrip(state)}`;
}

/**
 * The bomb's moments in a room, after every draw (a phone or the TV): the heat in place, a pass
 * flying from the last holder to the new one (from this phone's own big bomb when it passed, into
 * it when it was handed the bomb), and the explosion's screen part. A round first seen here (a
 * reload, a late join) plays nothing: bombFx.holder has no holder for it yet.
 */
function bombRoomCharacter(state, root, stage, fromBig) {
  const s = state.shared || {};
  if (!root) return;
  const key = roomDealKey(state, s.round);
  if (s.phase === 'ticking') {
    bombFxSaw(key);
    bombCharHeat(root, s.heat);
    const card = root.querySelector('#bomb-card');
    if (card) card.classList.toggle('is-urgent', (s.heat || 0) >= 3);
    const prev = bombFx.holder[key];
    bombFx.holder[key] = s.holderId;
    if (prev && prev !== s.holderId && motionFirst('bomb-pass|' + key + '|' + (s.passes || 0) + '|' + (s.sentBack || 0) + '|' + s.holderId)) {
      const chip = (id) => root.querySelector(`.bomb-order [data-bm-pid="${cssEscapeBomb(id)}"], .tv-order [data-bm-pid="${cssEscapeBomb(id)}"]`);
      const fromChip = chip(prev);
      const from = fromBig || (fromChip ? fromChip.getBoundingClientRect() : null);
      const mineNow = s.holderId === Room.me && !state.youAreScreen;
      const toChip = chip(s.holderId);
      const to = mineNow ? root.querySelector('.bomb-char--big') : (toChip && (toChip.querySelector('.bomb-order__bomb') || toChip));
      bombFlyChar(from, to);
      if (state.youAreScreen) {
        const big = root.querySelector('.bomb-char--big');
        if (big) setTimeout(() => bombCharHop(big), 300);
      } else if (fromBig || mineNow) {
        bombFxEnsure();
        if (typeof playFx === 'function') playFx('bombWhoosh');
      }
    }
    return;
  }
  if (s.phase === 'boom') {
    bombFxBoom(key);
    bombBoomFx(key, stage, { loud: !!(state.youAreScreen || s.loserId === Room.me || !roomHasScreen()) });
  }
}

/** An id as a CSS attribute value. */
function cssEscapeBomb(id) { return String(id || '').replace(/["\\]/g, (c) => '\\' + c); }

/** The press has to feel instant: the button locks before the server answers. */
function passBomb(btn) {
  if (btn) btn.disabled = true;
  haptic('medium');
  roomAct('pass');
}

/** The ticking: faster with every heat step the server sends. */
function bombRoomTicking(state, rebuilt) {
  const s = state.shared || {};
  const key = s.phase === 'ticking' ? state.code + '#' + s.round + '#' + s.heat : '';
  if (key === bombRoom.tickingKey && !rebuilt) return;
  if (bombRoom.tickTimer) clearTimeout(bombRoom.tickTimer);
  bombRoom.tickTimer = null;
  bombRoom.tickingKey = key;
  if (!key) {
    return;
  }
  const tick = () => {
    const st = Room.state;
    if (!st || st.shared.phase !== 'ticking' || state.code + '#' + st.shared.round + '#' + st.shared.heat !== bombRoom.tickingKey) return;
    const mine = st.shared.holderId === Room.me;
    if (st.youAreScreen || mine) playSound('bomb');
    // A phone that slept can't make a sound until it's touched again (iOS): say so.
    const hint = document.getElementById('bomb-sound-hint');
    if (hint) hint.classList.toggle('hidden', !(mine && audioCtx.state !== 'running'));
    const card = document.getElementById('bomb-card');
    if (card) { card.classList.remove('is-tick'); void card.offsetWidth; card.classList.add('is-tick'); bombCharTick(card); }
    bombRoom.tickTimer = setTimeout(tick, BOMB_TICK_MS[Math.min(3, st.shared.heat || 0)]);
  };
  tick();
}

/** What a send-back was pressed for (the pass it undoes): the server drops a stale one. */
function bombSendBackPayload(s) {
  return `{ passes: ${Number(s.passes) || 0}, from: '${jsStringAttr(s.fromId || '')}' }`;
}

/* --- the big screen --- */
TV_GAMES.bomb = {
  sig(state) {
    const s = state.shared || {};
    return [s.phase, s.round, s.prompt, s.swaps || 0, s.holderId, s.fromId || '', s.passes, s.loserId, JSON.stringify(s.strikes || {})].join('|');
  },
  frame(state, t) {
    const s = state.shared || {};
    const head = `<div class="tv-eyebrow tv-center-text">${t.round || ''} ${s.round}</div>`;
    const holder = s.phase === 'ticking'
      ? `<div class="tv-question">💣 ${escapeHTML((t.bomb_room_with || '').replace('{name}', s.holderName || ''))}</div>`
      : '';
    // tvBtn escapes its label, so a player's name is safe in it.
    const host = !state.youAreHost
      ? (s.phase === 'ticking' ? '' : roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.bomb_next_round, `roomAct('nextRound', { lang: '${VOTE_LANG()}' })`)}</div>`))
      : (s.phase === 'ticking'
      ? `<div class="tv-actions">${s.fromId && roomNameOf(state, s.fromId)
          ? tvBtn((t.bomb_send_back || '{name}').replace('{name}', roomNameOf(state, s.fromId)), `roomAct('sendBack', ${bombSendBackPayload(s)})`, 'ghost') : ''}${tvBtn(t.bomb_swap, `roomAct('swap', { swaps: ${Number(s.swaps) || 0} })`, 'secondary')}</div>`
      : `<div class="tv-actions">${tvBtn(t.bomb_next_round, `roomAct('nextRound', { lang: '${VOTE_LANG()}' })`)}${state.players.filter(p => (s.roster || []).indexOf(p.id) !== -1 && p.id !== s.loserId).map(p => tvBtn('↩ ' + p.name, `roomAct('markLoser', { playerId: '${jsStringAttr(p.id)}' })`, 'ghost')).join('')}</div>`);
    const boom = s.phase === 'boom' ? bombFxBoom(roomDealKey(state, s.round)) : null;
    return `<div class="tv-vote">${head}${holder}<div class="tv-bomb tv-scale">${bombRoomCardHtml(s, t, { size: 'big', boom })}</div><div class="tv-strip-inline">${bombOrderHtml(s, state, { boom }).replace('chip-set bomb-order', 'tv-order')}</div>${host}<div class="tv-scale">${bombStrikesHtml(s, t, { boom })}</div></div>`;
  },
  after(state, rebuilt) {
    const el = document.getElementById('view-room-tv');
    bombRoomCharacter(state, el, el && el.querySelector('.tv-stage'), null);
    bombRoomTicking(state, rebuilt);
    bombTvReplay(state, el);
  }
};

/*
 * 703 (7 Oct 2026): the boom's replay on the TV. Once the explosion has played, a little
 * bomb runs the round's passes again over the names (shared.trail, the last 12 hands) in
 * fast arcs, slowing on the last one into the loser's hands, as the room laughs. Once per
 * round, only on a TV that saw it go off (bombFx.live), never with motion off.
 */
const BOMB_REPLAY_HOPS = 12;
function bombTvReplay(state, root) {
  const s = state.shared || {};
  if (s.phase !== 'boom' || !root || motionOff()) return;
  const trail = (Array.isArray(s.trail) ? s.trail : []).slice(-(BOMB_REPLAY_HOPS + 1));
  if (trail.length < 2) return;
  const key = roomDealKey(state, s.round);
  if (!bombFx.live[key] || !motionFirst('bomb-replay|' + key)) return;
  const wait = Math.max(400, BOMB_BOOM_MS - (Date.now() - (bombFx.boomAt[key] || Date.now())) + 300);
  setTimeout(() => bombTvReplayRun(state, trail, key), wait);
}
function bombTvReplayRun(state, trail, key) {
  const st = Room.state;
  if (!st || st.game !== 'bomb' || !st.shared || st.shared.phase !== 'boom' || roomDealKey(st, st.shared.round) !== key) return;
  const tv = document.getElementById('view-room-tv');
  const chipOf = (id) => tv && Array.from(tv.querySelectorAll('.tv-order [data-bm-pid]')).find(c => c.getAttribute('data-bm-pid') === id);
  const spots = trail.map(chipOf);
  if (spots.some(c => !c)) return;
  const ghost = document.createElement('div');
  ghost.className = 'bomb-replay';
  ghost.setAttribute('aria-hidden', 'true');
  ghost.textContent = '💣';
  const tag = document.createElement('div');
  tag.className = 'bomb-replay__tag';
  tag.textContent = '🔁 ' + ((TRANSLATIONS[appState.lang] || {}).bomb_replay || '');
  document.body.appendChild(ghost);
  document.body.appendChild(tag);
  const centre = (c) => { const r = c.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top }; };
  let i = 0;
  const hop = () => {
    // Done, or the TV redrew its names under it (a host's correction): the replay just ends.
    if (!ghost.isConnected || i >= spots.length - 1 || !spots[i].isConnected || !spots[i + 1].isConnected) { ghost.remove(); tag.remove(); return; }
    const a = centre(spots[i]);
    const b = centre(spots[i + 1]);
    const last = i === spots.length - 2;
    const ms = last ? 900 : 190;
    const lift = Math.max(40, Math.abs(b.x - a.x) * 0.35);
    const anim = ghost.animate([
      { transform: `translate(${a.x}px, ${a.y}px) translate(-50%, -100%)`, opacity: 1 },
      { transform: `translate(${(a.x + b.x) / 2}px, ${Math.min(a.y, b.y) - lift}px) translate(-50%, -100%) rotate(${last ? 200 : 120}deg)`, offset: 0.5 },
      { transform: `translate(${b.x}px, ${b.y}px) translate(-50%, -100%) rotate(${last ? 360 : 240}deg)`, opacity: 1 }
    ], { duration: ms, easing: last ? 'cubic-bezier(0.2, 0.7, 0.3, 1)' : 'ease-in-out', fill: 'forwards' });
    const land = () => {
      if (spots[i + 1].animate) spots[i + 1].animate([{ transform: 'scale(1.18)' }, { transform: 'none' }], { duration: last ? 420 : 200, easing: 'ease-out' });
      if (last) { playSound('tick'); haptic('light'); }
      i++;
      hop();
    };
    let done = false;
    const once = () => { if (!done) { done = true; land(); } };
    anim.onfinish = once;
    setTimeout(once, ms + 120);
  };
  hop();
  // Whatever happens, the ghost goes.
  setTimeout(() => { ghost.remove(); tag.remove(); }, spots.length * 260 + 2500);
}
</script>
