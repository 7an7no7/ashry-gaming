<script>
/* ============================================================================
   سلسلة الإجابات — HOW MANY IN A ROW?
   ----------------------------------------------------------------------------
   One question at a time, four answers, 20 seconds, three lives. The score is
   the number of right answers before the third miss, and the best is kept per
   kind of question.

   The question makers are QuizStreak.js (shared with the rooms server, which
   deals a race's ten questions and judges every answer): every question comes
   from a bank the app already has - the room trivia, the team board (this
   page's), the emoji riddles and the proverbs. "trivia" asks from the first
   two, "mix" from any of the four at random. Free play deals through
   freshPick, so a question doesn't come back until its bank has gone round;
   the daily is ten seeded questions.

   The question on screen carries its deadline (endsAt), so a reload comes
   back to it with the time it really has left. appState.streak holds it all.

   In سباق ألغاز (RACE_UI.streak, JS_RoomRace.html) the same card and answers
   play the room's ten questions: no hearts and no question clock (the race's
   own clock is the backstop), each answer is sent (`move { q, i }`) and the
   server says right or wrong and hands the next question. Most right, then
   fastest, wins.
   ========================================================================= */

const STREAK_SECONDS = 20;
const STREAK_LIVES = 3;
const STREAK_DAILY = 10;
let streakClock = null;
let streakNextTimer = null;

function streakState() {
  const race = soloRaceState('streak');
  if (race) return race;
  if (!appState.streak) {
    appState.streak = { source: 'mix', daily: '', lang: 'ar', q: null, deck: [], asked: 0, score: 0, lives: STREAK_LIVES, marks: [], phase: 'setup' };
  }
  return appState.streak;
}

function streakDeal(source, lang) {
  const kind = source === 'mix' ? soloPick(STREAK_KINDS) : (source === 'trivia' ? soloPick(['trivia', 'board']) : source);
  const pool = streakPool(kind, lang);
  const pick = freshPick(`streak:${kind}:${lang}`, pool, 1, { key: x => x.key })[0];
  return pick ? pick.make(Math.random) : null;
}

function streakDailyDeck(lang) {
  const rnd = soloRng(soloDaySeed('streak:' + lang));
  const pools = {};
  STREAK_KINDS.forEach(k => { pools[k] = soloShuffle(streakPool(k, lang), rnd); });
  const deck = [];
  for (let i = 0; i < STREAK_DAILY; i++) {
    const kind = STREAK_KINDS[i % STREAK_KINDS.length];
    const item = pools[kind][i];
    if (item) deck.push(item.make(rnd));
  }
  return deck;
}

/* --- Setup and play ----------------------------------------------------------------- */

function setupStreak() {
  streakStop();
  setView('setup-streak');
}

function paintStreakSetup() {
  const s = streakState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#streak-source .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.source));
  const best = soloBest('streak', s.source);
  const el = document.getElementById('streak-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${best.score}` : '';
  const cont = document.getElementById('streak-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('streak-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('streak', 'startStreak(true)');
}

function setStreakSource(source) {
  streakState().source = source;
  saveToLocal();
  paintStreakSetup();
}

/** A run with a fixed deck: today's daily, or a past day from the archive (which clears s.daily). */
const streakDecked = (s) => !!(s.deck && s.deck.length);

// A run with a question answered: a new one asks first (soloConfirmNew).
const streakHasWork = (s) => (s.asked || 0) > 0;

function startStreak(daily, sure) {
  if (!sure && soloConfirmNew('streak', streakHasWork, () => startStreak(daily, true))) return;
  if (daily && soloDailyResume('streak')) return;
  soloDailySetAside('streak');
  soloNewGame('streak');
  const s = streakState();
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  Object.assign(s, {
    daily: daily ? soloToday() : '', lang: lang, playSource: daily ? 'mix' : s.source,
    deck: daily ? streakDailyDeck(lang) : [], asked: 0, score: 0, lives: STREAK_LIVES, marks: [], q: null, phase: 'play'
  });
  streakNext();
  setView('play-streak');
  paintStreak(true);
}

function continueStreak() {
  if (streakState().phase !== 'play') return;
  setView('play-streak');
  if (!restoreStreak()) setupStreak();
}

/** Puts the next question up, with a fresh deadline. */
function streakNext() {
  const s = streakState();
  const q = streakDecked(s) ? s.deck[s.asked] : streakDeal(s.playSource, s.lang);
  s.q = q ? Object.assign(q, { endsAt: Date.now() + STREAK_SECONDS * 1000, picked: null }) : null;
  saveToLocal();
}

function streakStop() {
  // A question stopped while a sheet had paused it (the sheet led off the board):
  // the time the sheet was open is given back to its deadline.
  const q = appState.streak && appState.streak.q;
  if (q && q.pausedAt) { q.endsAt += Math.max(0, Date.now() - q.pausedAt); q.pausedAt = 0; }
  if (streakClock) streakClock.stop();
  streakClock = null;
  clearTimeout(streakNextTimer);
  streakNextTimer = null;
}

// Leaving the board by any way (the back arrow, the nav) stops the pause before
// the next question, or a hidden game would carry on losing lives by itself.
// The question on screen keeps its deadline, which "continue" honours.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from) => { if (from === 'play-streak' || (String(from).indexOf('room-') === 0 && from.slice(5) === 'streak')) streakStop(); });
}

function streakHearts(s) {
  return Array.from({ length: STREAK_LIVES }, (_, i) => `<span class="streak-heart${i < s.lives ? '' : ' is-lost'}" data-h="${i}">❤️</span>`).join('');
}

/* The question's seconds as a ring that empties (the general timer's .gtm-dial),
   red in the last five. */
const STREAK_LOW = 5;
function streakRingPaint(v) {
  const n = document.getElementById('streak-left');
  if (n) n.textContent = v;
  const fill = document.getElementById('streak-ring');
  if (fill) fill.style.strokeDashoffset = String(1 - Math.max(0, Math.min(1, v / STREAK_SECONDS)));
  const dial = document.getElementById('streak-dial');
  if (dial) dial.classList.toggle('is-low', v <= STREAK_LOW);
}

function paintStreak(fresh) {
  const s = streakState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('streak-stage');
  const q = s.q;
  if (!el || !q) return;
  streakStop();
  const answered = q.picked !== null && q.picked !== undefined;
  const left = s.race ? 0 : Math.max(0, (q.endsAt - Date.now()) / 1000);
  const prompt = q.kind === 'proverbs'
    ? escapeHTML(q.prompt).replace('___', `<span class="streak-blank">${/[\u0600-\u06FF]/.test(q.prompt) ? '؟' : '?'}</span>`)
    : escapeHTML(q.prompt);
  // The question and its answers take their own language's direction (dir="auto"):
  // an English question under the Arabic interface had its «?» at the wrong end.
  const card = `
        <div class="streak-card${fresh ? ' is-new' : ''}">
          ${q.tag ? `<span class="eyebrow">${escapeHTML(q.tag)}</span>` : ''}
          ${q.big ? `<div class="streak-emoji" dir="ltr">${escapeHTML(q.big)}</div>` : ''}
          ${prompt ? `<p class="streak-prompt" dir="auto">${prompt}</p>` : `<p class="streak-prompt streak-prompt--sub">${escapeHTML(t.streak_emoji_q || '')}</p>`}
        </div>`;
  const options = (cls) => `
        <div class="solo-choices${cls}" id="streak-options">
          ${q.options.map((o, i) => {
            const c = answered ? (i === q.answer ? ' is-right' : (i === q.picked ? ' is-wrong' : '')) : '';
            return `<button type="button" class="solo-choice${c}" data-i="${i}" onclick="answerStreak(${i})" ${answered ? 'disabled' : ''}><span dir="auto">${escapeHTML(o)}</span></button>`;
          }).join('')}
        </div>`;
  if (s.race) {
    // سباق ألغاز: the race's own board, as it was (no hearts, no question clock).
    const bar = soloBarHtml([
      { label: t.race_unit_questions || '', value: `${Math.min(s.asked + 1, s.total || 10)}/${s.total || 10}`, id: 'streak-asked' },
      { label: t.streak_score || '', value: s.score, id: 'streak-score' }
    ]);
    el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">${card}
      </div>
      <div class="solo-layout__side">
        ${bar}${options('')}
      </div>
    </div>`;
    return;
  }
  // One card (the owner, 1 Oct 2026, from a before/after sheet): the hearts as a row
  // (a lost one dimmed) and the score as one chip, the seconds in a ring that empties
  // above the question, the answers as big bordered tiles, «خروج» small in the bar.
  const shown = Math.ceil(answered ? 0 : left);
  const label = streakDecked(s) ? `📅 ${s.asked + 1}/${s.deck.length}` : (t.streak_score || '');
  const archive = s.archive ? `<span class="badge badge--warning">📅 ${escapeHTML(t.daily_archive_badge || '')} ${escapeHTML(s.archive)}</span>` : '';
  el.innerHTML = `
    <div class="stk">
      <div class="card stk-card">
        <div class="stk-head">
          <span class="streak-hearts stk-hearts" id="streak-hearts" role="img" aria-label="${escapeHTML(t.streak_lives || '')}: ${s.lives}/${STREAK_LIVES}">${streakHearts(s)}</span>
          ${archive}
          <span class="chip chip--plain play-chip">${escapeHTML(label)} <b class="metric" id="streak-score">${s.score}</b></span>
        </div>
        <div class="stk-q">
          <div class="gtm-dial stk-dial${shown <= STREAK_LOW ? ' is-low' : ''}" id="streak-dial" role="timer" aria-label="${escapeHTML(t.streak_time || '')}">
            <svg class="gtm-ring" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="gtm-ring__track" cx="60" cy="60" r="54" pathLength="1"></circle>
              <circle class="gtm-ring__fill" id="streak-ring" cx="60" cy="60" r="54" pathLength="1" style="stroke-dashoffset:${(1 - (answered ? 0 : left) / STREAK_SECONDS).toFixed(3)}"></circle>
            </svg>
            <b class="metric" id="streak-left">${shown}</b>
          </div>
          ${card}
        </div>
        ${options(' stk-choices')}
      </div>
      <div class="view-actions talk__actions stk-actions">
        <div class="talk__pair">
          <button class="btn btn--ghost btn--sm" onclick="setupStreak()">${escapeHTML(t.exit || '')}</button>
        </div>
      </div>
    </div>`;
  if (s.race) return;
  if (answered) {
    streakNextTimer = setTimeout(streakAdvance, 1300);
    return;
  }
  const clock = createClock({
    seconds: Math.ceil(left),
    onTick: (v) => streakRingPaint(v),
    onEnd: () => answerStreak(-1)
  });
  // Help or the exit sheet pauses this clock (pauseClocksForSheet): the question's
  // deadline stands still with it, so "continue" and a reload keep the time it had.
  const pause = clock.pause;
  clock.pause = () => {
    if (!q.pausedAt) q.pausedAt = Date.now();
    // The ring stops where it is: its last second's sweep is cut short.
    const fill = document.getElementById('streak-ring');
    if (fill) { fill.style.transition = 'none'; fill.style.strokeDashoffset = getComputedStyle(fill).strokeDashoffset; }
    return pause();
  };
  clock.resume = () => {
    if (q.pausedAt) { q.endsAt += Math.max(0, Date.now() - q.pausedAt); q.pausedAt = 0; saveToLocal(); }
    if (streakClock === clock && streakState().q === q) paintStreak(false);
    return clock;
  };
  streakClock = clock;
}

/** The score pops on a right answer; a heart jumps on a wrong one. */
function streakPop(right, lives) {
  if (motionOff()) return;
  if (right) {
    const score = document.getElementById('streak-score');
    if (score && score.animate) score.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: 360, easing: 'ease-out' });
  } else {
    const heart = document.querySelector(`#streak-hearts [data-h="${lives}"]`);
    if (heart && heart.animate) heart.animate([{ transform: 'scale(1.6) rotate(-12deg)' }, { transform: 'scale(0.8) rotate(8deg)' }, { transform: 'none' }], { duration: 520, easing: 'ease-out' });
  }
}

function answerStreak(i) {
  const s = streakState();
  const q = s.q;
  if (s.phase !== 'play' || !q || (q.picked !== null && q.picked !== undefined)) return;
  streakStop();
  // A race: the answer is on the server, which judges and hands the next question (JS_RoomRace.html).
  if (s.race) {
    q.picked = i;
    // A send that didn't go through (the network, a refusal) must not leave the question locked.
    raceMove('streak', { q: s.asked, i: i }).then(ok => {
      if (ok || streakState() !== s || s.q !== q || q.answer !== undefined) return;
      q.picked = null;
      paintStreak(false);
    });
    return;
  }
  q.picked = i;
  const right = i === q.answer;
  if (right) s.score++;
  else s.lives--;
  s.marks.push(right ? '✅' : (i === -1 ? '⏰' : '❌'));
  s.asked++;
  saveToLocal();
  playSound(right ? 'success' : 'miss');
  haptic(right ? 'light' : 'medium');
  paintStreak(false);
  streakPop(right, s.lives);
}

function streakAdvance() {
  const s = streakState();
  if (s.phase !== 'play' || appState.currentView !== 'play-streak') return;
  if (s.lives <= 0 || (streakDecked(s) && s.asked >= s.deck.length)) { streakFinish(); return; }
  streakNext();
  if (!s.q) { streakFinish(); return; }
  paintStreak(true);
}

function streakFinish() {
  const s = streakState();
  const t = TRANSLATIONS[appState.lang];
  streakStop();
  if (s.phase !== 'play') return;
  s.phase = 'done';
  saveToLocal();
  const source = s.playSource || s.source;
  const rec = streakDecked(s) ? { record: false, prev: null } : soloRecord('streak', source, { score: s.score }, (a, b) => a.score > b.score);
  let share = '';
  const lines = [];
  if (s.daily) {
    soloMarkDaily('streak', { score: s.score }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🔥 ${t.setup_streak || ''} ${s.score}/${s.deck.length}\n${s.marks.join('')}`;
    lines.push(s.marks.join(''));
  }
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.score}`);
  soloResult({
    icon: '🔥', title: s.daily ? (s.lives > 0 ? (t.daily_done_today || '') : (t.streak_over || '')) : (rec.record && s.score ? (t.solo_new_best || '') : (t.streak_over || '')),
    value: s.score, valueLabel: streakDecked(s) ? `/ ${s.deck.length}` : (t.streak_in_a_row || ''), lines: lines,
    win: rec.record && s.score > 0 || (streakDecked(s) && s.score >= 7), share: share,
    again: () => startStreak(false), exit: setupStreak
  });
}

function restoreStreak() {
  const s = streakState();
  if (s.phase !== 'play' || !s.q) return false;
  if (s.q.picked === null && Date.now() >= s.q.endsAt) {
    paintStreak(false);
    answerStreak(-1);
    return true;
  }
  paintStreak(false);
  return true;
}

soloRegister('streak', {
  setup: 'setup-streak', play: 'play-streak', paintSetup: paintStreakSetup, restore: restoreStreak,
  state: streakState, resume: continueStreak, repaint: () => { if (streakState().phase === 'play') paintStreak(false); }, prefs: ['source']
});

/* --- سباق ألغاز: the same card, raced (JS_RoomRace.html) ------------------------------ */
// While the verdict of this phone's last answer is on the card (1.3 s), until when: another
// racer's move in that time must not bring the next question up early. A time, not a flag,
// so a reveal cut short (the timer cleared on leaving) can never hold the card for good.
let streakRaceRevealUntil = 0;

RACE_UI.streak = {
  stage: 'streak-stage',
  unit: 'race_unit_questions',
  fresh: (pub) => ({ source: 'mix', playSource: 'mix', daily: '', lang: 'ar', q: null, deck: [], asked: 0, score: 0, lives: STREAK_LIVES, marks: [], total: pub.n || 10, shown: -1 }),
  // The server's verdict on the last answer colours the card, then the next question comes up.
  sync(s, board, fx) {
    const b = board || {};
    const first = !!(fx && fx.first);
    const answeredNow = b.last && s.q && b.last.q === s.shown && s.q.picked !== undefined && s.q.picked !== null && s.q.answer === undefined;
    if (answeredNow && !first) {
      s.q.answer = b.last.answer;
      s.q.picked = b.last.picked;
      const right = b.last.picked === b.last.answer;
      s.score = b.right;
      s.asked = b.asked;
      s.marks = b.marks || [];
      playSound(right ? 'success' : 'miss');
      haptic(right ? 'light' : 'medium');
      paintStreak(false);
      streakPop(right, s.lives);
      const next = b.q;
      clearTimeout(streakNextTimer);
      streakRaceRevealUntil = Date.now() + 1300;
      streakNextTimer = setTimeout(() => {
        streakRaceRevealUntil = 0;
        if (soloRaceKind() !== 'streak' || s.asked !== b.asked || s.shown === b.asked) return;
        if (next) { s.q = Object.assign({}, next, { picked: null }); s.shown = b.asked; paintStreak(true); }
      }, 1300);
      return;
    }
    // A reload, or a question this phone hasn't drawn yet - never while this phone's verdict is still up.
    if (b.q && (s.shown !== b.asked || !s.q) && (first || Date.now() >= streakRaceRevealUntil)) {
      s.q = Object.assign({}, b.q, { picked: null });
      s.shown = b.asked;
      s.score = b.right; s.asked = b.asked; s.marks = b.marks || [];
      paintStreak(!first);
    } else if (!b.q && s.shown !== b.asked) {
      s.score = b.right; s.asked = b.asked; s.shown = b.asked;
      if (s.q) { paintStreak(false); }
    }
  },
  paint: () => paintStreak(false),
  finished: () => 0,
  scoreLabel: (score, t) => (t.race_score_right || '{n}').replace('{n}', score)
};
</script>
