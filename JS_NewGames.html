function setTeamCount(n) {
    appState.teams.count = [2, 3, 4].indexOf(Number(n)) !== -1 ? Number(n) : 2;
    n = appState.teams.count;
    if (typeof saveToLocal === 'function') saveToLocal();
    [2,3,4].forEach(i => {
        const btn = document.getElementById(`team-btn-${i}`);
        if (!btn) return;
        // Selection is a button tier, not a hand-written colour pair.
        btn.className = (i === n) ? 'btn btn--primary' : 'btn btn--ghost';
        btn.setAttribute('aria-pressed', String(i === n));
    });
}

/** The setup screen as it was left: the saved number of teams lit (SETUP_PAINTERS). */
function paintTeamsSetup() {
    const n = [2, 3, 4].indexOf(Number(appState.teams.count)) !== -1 ? Number(appState.teams.count) : 2;
    [2,3,4].forEach(i => {
        const btn = document.getElementById(`team-btn-${i}`);
        if (!btn) return;
        btn.className = (i === n) ? 'btn btn--primary' : 'btn btn--ghost';
        btn.setAttribute('aria-pressed', String(i === n));
    });
}

function getSelectedPlayers() {
    return appState.activePlayers ? [...appState.activePlayers] : [];
}

function generateTeams() {
    let selected = getSelectedPlayers();
    
    if (selected.length < appState.teams.count) {
        const msg = appState.lang === 'ar' ? "عدد اللاعبين غير كافٍ للفرق المختارة" : "Not enough players for selected teams";
        showToast(msg);
        return;
    }

    playSound('click');
    
    // Shuffle
    for (let i = selected.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [selected[i], selected[j]] = [selected[j], selected[i]];
    }

    // Distribute
    const teams = Array.from({ length: appState.teams.count }, () => []);
    selected.forEach((player, index) => {
        teams[index % appState.teams.count].push(player);
    });

    renderTeams(teams);
}

function openSkillBalancer() {
    const selected = getSelectedPlayers();
    if (selected.length < appState.teams.count) {
        const msg = appState.lang === 'ar' ? "عدد اللاعبين غير كافٍ!" : "Not enough players!";
        showToast(msg);
        return;
    }

    list.innerHTML = '';

    selected.forEach(p => {
        const currentSkill = appState.teams.playerSkills ? (appState.teams.playerSkills[p] || 3) : 3;

            const opacity = i <= currentSkill ? 'opacity-100' : 'opacity-20 grayscale';
            starsHtml += `<button onclick="setSkill('${jsStringAttr(p)}', ${i})" class="text-2xl transition-all ${opacity} hover:scale-125">⭐</button>`;

function setSkill(player, level) {
    if(!appState.teams.playerSkills) appState.teams.playerSkills = {};
    appState.teams.playerSkills[player] = level;
    // A rating is kept for next time as soon as it is tapped, not only when teams are made.
    if (typeof saveToLocal === 'function') saveToLocal();
    const container = document.getElementById(`stars-${player}`);
    let starsHtml = '';
    for(let i=1; i<=5; i++) {
        const opacity = i <= level ? 'opacity-100' : 'opacity-20 grayscale';
        starsHtml += `<button onclick="setSkill('${jsStringAttr(player)}', ${i})" class="text-2xl transition-all ${opacity} hover:scale-125">⭐</button>`;
    }
    container.innerHTML = starsHtml;
    playSound('click');
}

/**
 * Teams as close in skill as the stars allow, and as close in size as the
 * count allows (never more than one apart). The old greedy fill handed each
 * player to the weakest team so far, which put a star alone against five.
 * Now: a snake draft by skill (1-2-3-3-2-1…), then swaps between teams while
 * one narrows the gap between the strongest and weakest total. Sizes never
 * change in a swap.
 */
function balancedTeams(names, count, skillOf) {
    const k = Math.max(1, count);
    // A little noise so equal stars don't always land the same way.
    const players = shuffleArray(names).map(name => ({ name: name, skill: skillOf(name) + Math.random() * 0.1 }))
        .sort((a, b) => b.skill - a.skill);
    const teams = Array.from({ length: k }, () => []);
    players.forEach((p, i) => {
        const lap = Math.floor(i / k), seat = i % k;
        teams[lap % 2 === 0 ? seat : k - 1 - seat].push(p);
    });
    const total = (team) => team.reduce((sum, p) => sum + p.skill, 0);
    const spread = () => {
        const sums = teams.map(total);
        return Math.max(...sums) - Math.min(...sums);
    };
    for (let pass = 0; pass < 60; pass++) {
        let best = spread(), move = null;
        for (let a = 0; a < k; a++) for (let b = a + 1; b < k; b++) {
            for (let i = 0; i < teams[a].length; i++) for (let j = 0; j < teams[b].length; j++) {
                const x = teams[a][i], y = teams[b][j];
                teams[a][i] = y; teams[b][j] = x;
                const now = spread();
                teams[a][i] = x; teams[b][j] = y;
                if (now < best - 1e-9) { best = now; move = [a, i, b, j]; }
            }
        }
        if (!move) break;
        const [a, i, b, j] = move;
        const x = teams[a][i];
        teams[a][i] = teams[b][j];
        teams[b][j] = x;
    }
    // The first team shouldn't always be the one the best player was drafted to.
    return shuffleArray(teams).map(team => team.map(p => p.name));
}

function generateFairTeams() {
    const selected = getSelectedPlayers();
    const skills = appState.teams.playerSkills || {};
    closeModal('skill-modal');
    renderTeams(balancedTeams(selected, appState.teams.count, (name) => skills[name] || 3));
}

function renderTeams(teams) {
    // Remembered so the screen can be rebuilt after a reload without
    // re-rolling the teams - the whole point of the screen is that this is the
    // draw everyone already agreed to.
    appState.teams.result = teams;
    saveToLocal();
    paintTeams(teams);
    setView('results-teams');
    const dealing = dealTeams(document.getElementById('teams-container'));
    const cheer = () => confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    if (dealing) setTimeout(cheer, dealing); else cheer();
}

/**
 * The names are dealt into their teams one at a time, in the order they were
 * drawn, from the middle of the screen. Each name flies as a ghost above the
 * page (the team cards clip their contents) and its row shows when it lands.
 * Returns how long the deal takes, or 0 when nothing moves.
 */
function dealTeams(container) {
    if (!container || typeof motionOff !== 'function' || motionOff()) return 0;
    const rows = [...container.querySelectorAll('[data-deal]')].sort((a, b) => a.dataset.deal - b.dataset.deal);
    if (!rows.length || !document.body.animate) return 0;
    const start = 360;                       // after the screen has slid in, so the places are final
    const step = Math.min(120, Math.round(1500 / rows.length));
    const fly = 540;
    rows.forEach(row => { row.style.visibility = 'hidden'; });
    rows.forEach((row, i) => {
        setTimeout(() => {
            if (!row.isConnected) return;
            // Lands on the name itself, not the middle of its full-width row.
            const nameNode = [...row.childNodes].reverse().find(n => n.nodeType === 3 && n.textContent.trim());
            let r = row.getBoundingClientRect();
            if (nameNode) {
                const range = document.createRange();
                range.selectNodeContents(nameNode);
                const nr = range.getBoundingClientRect();
                if (nr.width) r = nr;
            }
            const ghost = document.createElement('div');
            ghost.className = 'deal-ghost';
            ghost.textContent = row.textContent.replace('●', '').trim();
            document.body.appendChild(ghost);
            const g = ghost.getBoundingClientRect();
            const toX = r.left + r.width / 2 - g.width / 2;
            const toY = r.top + r.height / 2 - g.height / 2;
            const fromX = window.innerWidth / 2 - g.width / 2;
            const fromY = window.innerHeight * 0.55 - g.height / 2;
            const land = () => { ghost.remove(); row.style.visibility = ''; };
            const anim = ghost.animate([
                { transform: 'translate(' + fromX + 'px, ' + fromY + 'px) scale(0.6)', opacity: 0 },
                { opacity: 1, offset: 0.25 },
                { transform: 'translate(' + toX + 'px, ' + toY + 'px) scale(1)', opacity: 1 }
            ], { duration: fly, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'both' });
            anim.onfinish = land;
            setTimeout(land, fly + 300);
        }, start + i * step);
    });
    return start + (rows.length - 1) * step + fly;
}

/** Draws the team cards. Split out so a reload can redraw without re-rolling. */
function paintTeams(teams) {
    const container = document.getElementById('teams-container');
    if (!container || !teams || !teams.length) return;
    container.innerHTML = '';
    
    const colors = ['blue', 'red', 'green', 'orange'];
    const names = ['أ', 'ب', 'ج', 'د'];
    const teamPrefix = TRANSLATIONS[appState.lang].team_name_prefix || "Team";
    
    teams.forEach((team, idx) => {
        const color = colors[idx];
        const teamName = appState.lang === 'ar' 
            ? `${teamPrefix} ${names[idx]}` 
            : `${teamPrefix} ${idx + 1}`;
        
        // data-deal is the order the names were drawn in, for dealTeams.
        const playersHtml = team.map((p, j) =>
            `<div class="team-text-color team-divider font-bold text-lg last:border-0 py-3 flex items-center gap-2" data-deal="${j * teams.length + idx}">
                <span class="text-xs opacity-50">●</span> ${escapeHTML(p)}
             </div>`
        ).join('');
        
        container.innerHTML += `
            <div class="team-card-bg rounded-2xl p-0 border-t-8 border-${color}-500 shadow-lg overflow-hidden mb-4">
                <div class="bg-${color}-50 dark:bg-${color}-900/20 p-4 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="text-2xl font-black text-${color}-600 dark:text-${color}-400 text-center">${teamName}</h3>
                </div>
                <div class="p-4">
                    ${playersHtml}
                </div>
            </div>
        `;
    });
}

/*
   كلمة واحدة on one phone is a set number of rounds (JO_ROUNDS, picked on
   the setup screen and saved as appState.justone.rounds), one card each,
   the guesser moving round the table. The result card is drawn here
   (joPaintResult): the word, then the table's verdict - which can be taken
   back until the next round starts - the score so far and who guesses next,
   and after the last round the final score. The "next guesser, ready?"
   popup it replaces could be cancelled into a dead screen, and its timer
   fired on whatever screen came next.
*/
const JO_ROUNDS = [5, 10, 13];
const JO_ROUNDS_DEFAULT = 10;

const joRoundsOf = () => {
    const n = Number(appState.justone.rounds);
    return JO_ROUNDS.indexOf(n) !== -1 ? n : JO_ROUNDS_DEFAULT;
};

function paintJustOneSetup() {
    const n = joRoundsOf();
    document.querySelectorAll('#justone-rounds .segmented__item').forEach(b => b.classList.toggle('is-active', Number(b.dataset.value) === n));
}

function setJustOneRounds(n) {
    appState.justone.rounds = JO_ROUNDS.indexOf(Number(n)) !== -1 ? Number(n) : JO_ROUNDS_DEFAULT;
    saveToLocal();
    paintJustOneSetup();
    haptic('light');
}

function startJustOneGame(keepPlayers) {
    const again = keepPlayers === true && (appState.justone.players || []).length >= 3;
    let selected = again ? appState.justone.players.slice() : (appState.activePlayers ? [...appState.activePlayers] : []);
    if (!again) saveActivePlayers(selected);

    if (selected.length < 3) {
        askPlayers(3, () => startJustOneGame());
        return;
    }

    appState.justone.players = selected;
    appState.justone.guesserIndex = 0;
    appState.justone.score = 0;
    appState.justone.round = 1;
    appState.justone.total = joRoundsOf();
    appState.justone.verdict = null;
    appState.justone.startedAt = Date.now();

    nextJoRound();
}

function nextJoRound() {
    appState.justone.clues = [];
    appState.justone.verdict = null;
    appState.justone.phase = 'pass';

    // Choose word based on language
    const wordList = contentLang() === 'ar' ? JO_WORDS_AR : JO_WORDS_EN;
    appState.justone.secretWord = freshPick('justone:' + contentLang(), wordList, 1)[0];

    appState.justone.writers = appState.justone.players.filter((_, i) => i !== appState.justone.guesserIndex);
    appState.justone.currentWriterIndex = 0;

    setView('play-justone');
    document.getElementById('jo-phase-pass').classList.remove('hidden');
    document.getElementById('jo-phase-write').classList.add('hidden');
    document.getElementById('jo-phase-guess').classList.add('hidden');
    document.getElementById('jo-phase-result').classList.add('hidden');

    joShowPassScreen();
}

function joShowPassScreen() {
    const writer = appState.justone.writers[appState.justone.currentWriterIndex];
    document.getElementById('jo-active-player').innerText = writer;

    const msg = appState.lang === 'ar'
        ? `يا ${writer}، خد الموبايل عشان تشوف الكلمة وتكتب تلميح!`
        : `${writer}, take the phone to see the word and write a clue!`;

    document.getElementById('jo-pass-instruction').innerText = msg;

    document.getElementById('jo-phase-pass').classList.remove('hidden');
    document.getElementById('jo-phase-write').classList.add('hidden');
}

function joRevealPhase() {
    document.getElementById('jo-phase-pass').classList.add('hidden');
    document.getElementById('jo-phase-write').classList.remove('hidden');

    document.getElementById('jo-secret-word-display').innerText = appState.justone.secretWord;
    const input = document.getElementById('jo-clue-input');
    input.value = '';
    input.focus();
}

function joSubmitClue() {
    const input = document.getElementById('jo-clue-input');
    const clue = input.value.trim();

    const t = TRANSLATIONS[appState.lang];

    if (!clue) return showToast(appState.lang === 'ar' ? "اكتب كلمة!" : "Write a word!");
    if (clue.includes(' ')) return showToast(appState.lang === 'ar' ? "كلمة واحدة بس!" : "One word only!");
    // The same fold a room uses: الأسد, أسد and اسد are the word itself.
    if (foldWord(clue) === foldWord(appState.justone.secretWord)) return showToast(t.forbidden_rule);

    const writerName = appState.justone.writers[appState.justone.currentWriterIndex];
    appState.justone.clues.push({ player: writerName, text: clue });

    playSound('click');

    appState.justone.currentWriterIndex++;
    if (appState.justone.currentWriterIndex < appState.justone.writers.length) {
        joShowPassScreen();
    } else {
        joPrepareGuessPhase();
    }
}

function joPrepareGuessPhase() {
    // Collision Detection
    const counts = {};
    appState.justone.clues.forEach(c => {
        counts[foldWord(c.text)] = (counts[foldWord(c.text)] || 0) + 1;
    });

    const validClues = appState.justone.clues.filter(c => counts[foldWord(c.text)] === 1);
    const collisionsCount = appState.justone.clues.length - validClues.length;

    const list = document.getElementById('jo-clues-list');
    list.innerHTML = '';

    if (validClues.length === 0) {
        const msg = appState.lang === 'ar' ? "يا ساتر! كل التلميحات اتحذفت!" : "Oh no! All clues removed!";
        list.innerHTML = `<div class="tx-danger font-bold">${msg}</div>`;
    } else {
        validClues.forEach(c => {
            list.innerHTML += `<div class="bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-white px-4 py-2 rounded-xl font-bold text-lg shadow-sm border border-indigo-200 dark:border-indigo-700">${escapeHTML(c.text)}</div>`;
        });
    }

    const collisionNote = document.getElementById('jo-collisions-note');
    if (collisionsCount > 0) {
        collisionNote.classList.remove('hidden');
        // This text is handled by data-i18n, but we can append count
        const baseMsg = TRANSLATIONS[appState.lang].clues_removed_msg;
        collisionNote.innerText = `${baseMsg} (${collisionsCount})`;
    } else {
        collisionNote.classList.add('hidden');
    }

    const guesserName = appState.justone.players[appState.justone.guesserIndex];
    document.getElementById('jo-guesser-name').innerText = guesserName;

    document.getElementById('jo-phase-write').classList.add('hidden');
    document.getElementById('jo-phase-guess').classList.remove('hidden');

    playSound('success');
}

function joShowResult() {
    appState.justone.phase = 'result';
    appState.justone.verdict = null;
    document.getElementById('jo-phase-guess').classList.add('hidden');
    document.getElementById('jo-phase-result').classList.remove('hidden');
    joPaintResult();
}

/** The table's verdict on this round. It can be taken back until the next round starts. */
function joFinishRound(success) {
    const jo = appState.justone;
    if (jo.phase !== 'result') return;
    jo.verdict = !!success;
    if (success) jo.score = (jo.score || 0) + 1;
    jo.phase = 'judged';
    saveToLocal();
    joPaintResult();
    if (success) {
        playSound('success');
        confetti({ particleCount: 150 });
    } else {
        playSound('alarm');
    }
}

function joUndoVerdict() {
    const jo = appState.justone;
    if (jo.phase !== 'judged') return;
    if (jo.verdict) jo.score = Math.max(0, (jo.score || 0) - 1);
    jo.verdict = null;
    jo.phase = 'result';
    saveToLocal();
    joPaintResult();
    haptic('light');
}

/** On to the next guesser, or to the final score after the last round. */
function joNext() {
    const jo = appState.justone;
    if (jo.phase !== 'judged') return;
    if ((jo.round || 1) >= (jo.total || joRoundsOf())) {
        jo.phase = 'final';
        saveToLocal();
        joPaintResult();
        playSound('success');
        const el = document.getElementById('jo-phase-result');
        if (jo.score > 0 && typeof confetti === 'function') afterReveal(el, () => confetti({ particleCount: 160, spread: 90 }));
        return;
    }
    jo.round = (jo.round || 1) + 1;
    jo.guesserIndex = (jo.guesserIndex + 1) % jo.players.length;
    nextJoRound();
}

/** The table's verdict on a whole game, like the box of the real one: by the share of cards guessed. */
function joRating(score, total, t) {
    const share = total ? score / total : 0;
    if (share >= 1) return t.jo_rate_perfect || 'مثالي! ولا كلمة فلتت منكم 🏆';
    if (share >= 0.7) return t.jo_rate_great || 'رهيب! فريق متفاهم جداً';
    if (share >= 0.4) return t.jo_rate_good || 'حلو! تقدروا تعملوا أحسن';
    return t.jo_rate_try || 'جرّبوا تاني وفكّروا مختلف عن بعض';
}

function joPaintResult() {
    const jo = appState.justone;
    const el = document.getElementById('jo-phase-result');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang] || {};
    const total = jo.total || joRoundsOf();
    const round = Math.min(jo.round || 1, total);
    const tally = `<div class="cn-score"><span class="cn-score__role">${escapeHTML(t.round || '')} ${ltrFrac(round, total)}</span><span class="badge badge--accent">✅ <span class="metric">${jo.score || 0}</span></span></div>`;

    if (jo.phase === 'final') {
        el.innerHTML = `
            <div class="eyebrow">${escapeHTML(t.jo_final || 'النتيجة النهائية')}</div>
            <div class="metric metric--lg metric--accent" dir="ltr"><span id="jo-final-score">${jo.score || 0}</span> / ${total}</div>
            <p class="sheet__subtitle">${escapeHTML(joRating(jo.score || 0, total, t))}</p>
            <div class="btn-stack" style="margin-top: var(--sp-4)">
                <button onclick="startJustOneGame(true)" class="btn btn--primary btn--lg">${escapeHTML(t.play_again || '')}</button>
                <button onclick="setView('setup-justone')" class="btn btn--ghost">${escapeHTML(t.exit || '')}</button>
            </div>`;
        const scoreEl = document.getElementById('jo-final-score');
        if (scoreEl && jo.score > 0 && typeof countUp === 'function' && motionFirst('jo-final:' + jo.startedAt)) countUp(scoreEl, 0, jo.score);
        return;
    }

    const word = `
        <div class="eyebrow">${escapeHTML(t.correct_word_was || '')}</div>
        <h2 id="jo-result-word" class="text-4xl font-black tx-success mb-8">${escapeHTML(jo.secretWord || '')}</h2>`;

    if (jo.phase === 'judged') {
        const last = round >= total;
        const next = jo.players[(jo.guesserIndex + 1) % jo.players.length];
        el.innerHTML = `${tally}${word}
            <div class="metric metric--md ${jo.verdict ? 'tx-success' : 'tx-danger'}">${escapeHTML(jo.verdict ? (t.got_it_btn || '') : (t.missed_it_btn || ''))}</div>
            ${last ? '' : `<p class="sheet__subtitle">${escapeHTML((t.jo_next_guesser || 'المخمّن اللي بعده: {name}').replace('{name}', next))}</p>`}
            <div class="btn-stack" style="margin-top: var(--sp-4)">
                <button onclick="joNext()" class="btn btn--primary btn--lg">${escapeHTML(last ? (t.jo_see_final || 'النتيجة النهائية 🏁') : (t.jo_ready_next || 'جاهزين، الجولة الجاية ➡'))}</button>
                <button onclick="joUndoVerdict()" class="btn btn--ghost btn--sm">↶ ${escapeHTML(t.draw_undo || '')}</button>
            </div>`;
        return;
    }

    el.innerHTML = `${tally}${word}
        <div class="grid grid-cols-2 gap-3">
            <button onclick="joFinishRound(true)" class="btn btn--primary">${escapeHTML(t.got_it_btn || '')}</button>
            <button onclick="joFinishRound(false)" class="btn btn--danger">${escapeHTML(t.missed_it_btn || '')}</button>
        </div>`;
}

// Guarded: tools/validate-content.js evaluates this file on its own to read the word lists.
if (typeof onLanguageChange === 'function') onLanguageChange((view) => {
    const jo = appState.justone;
    if (view === 'play-justone' && ['result', 'judged', 'final'].indexOf(jo.phase) !== -1) joPaintResult();
});

/* ================= REACTION TEST LOGIC ================= */

function startReactionRound() {
    setView('play-reaction');
    
    const p1 = document.getElementById('reaction-p1');
    const p2 = document.getElementById('reaction-p2');
    const msg1 = document.getElementById('reaction-msg1');
    const msg2 = document.getElementById('reaction-msg2');
    const exitBtn = document.getElementById('reaction-exit-btn');
    const t = TRANSLATIONS[appState.lang];

    // Gameplay counts the press, not the release: on click, the time a finger
    // stayed down was added to the reaction, and a tie was decided on letting go.
    const press = (player) => (e) => {
        if (e && e.cancelable) e.preventDefault();
        handleReactionTap(player);
    };
    p1.onclick = null;
    p2.onclick = null;
    p1.onpointerdown = press(1);
    p2.onpointerdown = press(2);

    // Reset UI to RED (Waiting phase)
    p1.className = "flex-1 flex flex-col items-center justify-center bg-red-500 cursor-pointer transition-colors duration-75 p-4";
    p2.className = "flex-1 flex flex-col items-center justify-center bg-red-500 cursor-pointer transition-colors duration-75 transform rotate-180 p-4";
    
    // Centered Wait Text
    msg1.innerHTML = `<div class="flex flex-col items-center justify-center text-center w-full"><div class="text-5xl font-black text-white drop-shadow-md">${t.reaction_wait}</div></div>`;
    msg2.innerHTML = `<div class="flex flex-col items-center justify-center text-center w-full"><div class="text-5xl font-black text-white drop-shadow-md">${t.reaction_wait}</div></div>`;
    
    exitBtn.classList.add('hidden');

    appState.reaction.status = 'waiting';
    appState.reaction.firstTapInfo = null; // 👈 Reset the tie-breaker memory
    
    const delay = Math.floor(Math.random() * 4000) + 2000;
    if (appState.reaction.timeoutId) clearTimeout(appState.reaction.timeoutId);

    appState.reaction.timeoutId = setTimeout(() => {
        if (appState.reaction.status === 'waiting') {
            appState.reaction.status = 'ready';
            appState.reaction.startTime = performance.now();
            
            // Turn GREEN!
            p1.classList.replace('bg-red-500', 'bg-green-500');
            p2.classList.replace('bg-red-500', 'bg-green-500');
            
            msg1.innerHTML = `<div class="flex flex-col items-center justify-center text-center w-full"><div class="text-6xl font-black text-white drop-shadow-md">${t.reaction_tap}</div></div>`;
            msg2.innerHTML = `<div class="flex flex-col items-center justify-center text-center w-full"><div class="text-6xl font-black text-white drop-shadow-md">${t.reaction_tap}</div></div>`;
            playSound('success'); 
        }
    }, delay);
}

function handleReactionTap(player) {
    if (appState.reaction.status === 'ended') return;

    if (appState.reaction.status === 'waiting') {
        // FALSE START (Tapped on Red)
        appState.reaction.status = 'ended';
        clearTimeout(appState.reaction.timeoutId);
        showReactionResult(player === 1 ? 2 : 1, 0, true, player, false);
        return;
    }

    if (appState.reaction.status === 'ready') {
        // THE FIRST PERSON TAPPED!
        appState.reaction.status = 'resolving';
        appState.reaction.firstTapInfo = { player: player, time: performance.now() };
        
        // Wait 60 milliseconds to see if the other player taps for a TIE!
        setTimeout(() => {
            if (appState.reaction.status === 'resolving') {
                // No one else tapped, we have a clear winner!
                appState.reaction.status = 'ended';
                const reactionTime = Math.round(appState.reaction.firstTapInfo.time - appState.reaction.startTime);
                showReactionResult(appState.reaction.firstTapInfo.player, reactionTime, false, null, false);
            }
        }, 60); 
        return;
    }

    if (appState.reaction.status === 'resolving') {
        // THE SECOND PERSON TAPPED WITHIN THE WINDOW! IT'S A TIE!
        if (player !== appState.reaction.firstTapInfo.player) {
            appState.reaction.status = 'ended';
            const reactionTime = Math.round(appState.reaction.firstTapInfo.time - appState.reaction.startTime);
            showReactionResult(null, reactionTime, false, null, true);
        }
    }
}

function showReactionResult(winner, timeMs, isFalseStart, falseStartPlayer, isTie = false) {
    playSound(isFalseStart ? 'alarm' : 'click');
    const p1 = document.getElementById('reaction-p1');
    const p2 = document.getElementById('reaction-p2');
    const msg1 = document.getElementById('reaction-msg1');
    const msg2 = document.getElementById('reaction-msg2');
    const t = TRANSLATIONS[appState.lang];

    // Reset backgrounds
    p1.className = "flex-1 flex flex-col items-center justify-center bg-gray-900 cursor-pointer transition-colors p-4";
    p2.className = "flex-1 flex flex-col items-center justify-center bg-gray-900 cursor-pointer transition-colors transform rotate-180 p-4";

    const restartText = appState.lang === 'ar' ? 'دوس عشان تلعبوا تاني 🔄' : 'Tap to play again 🔄';

    if (isTie) {
        // 🤝 TIE LOGIC: BOTH SCREENS TURN YELLOW
        playSound('success');
        const tieText = appState.lang === 'ar' ? 'تعادل! 🤝' : 'TIE! 🤝';
        const timeStr = `<span dir="ltr">${timeMs} ${t.reaction_ms}</span>`;
        const tieHTML = `<div class="flex flex-col items-center justify-center text-center w-full space-y-3">
                            <div class="text-5xl md:text-6xl font-black text-white drop-shadow-md">${tieText}</div>
                            <div class="text-3xl text-yellow-100 font-bold">${timeStr}</div>
                         </div>`;
        
        p1.classList.replace('bg-gray-900', 'bg-yellow-500');
        p2.classList.replace('bg-gray-900', 'bg-yellow-500');
        msg1.innerHTML = tieHTML;
        msg2.innerHTML = tieHTML;

    } else if (isFalseStart) {
        const badHTML = `<div class="flex flex-col items-center justify-center text-center w-full space-y-4"><div class="text-4xl md:text-5xl font-black text-white drop-shadow-md">${t.reaction_too_soon}</div></div>`;
        const goodHTML = `<div class="flex flex-col items-center justify-center text-center w-full space-y-4"><div class="text-4xl md:text-5xl font-black text-white drop-shadow-md">${t.reaction_winner}</div></div>`;
        
        if (falseStartPlayer === 1) {
            p1.classList.replace('bg-gray-900', 'bg-red-600');
            p2.classList.replace('bg-gray-900', 'bg-green-500');
            msg1.innerHTML = badHTML;
            msg2.innerHTML = goodHTML;
        } else {
            p2.classList.replace('bg-gray-900', 'bg-red-600');
            p1.classList.replace('bg-gray-900', 'bg-green-500');
            msg2.innerHTML = badHTML;
            msg1.innerHTML = goodHTML;
        }
    } else {
        const timeStr = `<span dir="ltr">${timeMs} ${t.reaction_ms}</span>`;
        const winHTML = `<div class="flex flex-col items-center justify-center text-center w-full space-y-3">
                            <div class="text-5xl md:text-6xl font-black text-white drop-shadow-md">${t.reaction_winner}</div>
                            <div class="text-3xl text-green-100 font-bold">${timeStr}</div>
                         </div>`;
        const loseHTML = `<div class="flex flex-col items-center justify-center text-center w-full"><div class="text-6xl font-black text-white opacity-30">❌</div></div>`;

        if (winner === 1) {
            p1.classList.replace('bg-gray-900', 'bg-green-500');
            msg1.innerHTML = winHTML;
            msg2.innerHTML = loseHTML;
        } else {
            p2.classList.replace('bg-gray-900', 'bg-green-500');
            msg2.innerHTML = winHTML;
            msg1.innerHTML = loseHTML;
        }
    }
    // The verdict pops on both halves (JS_Motion.html section 13).
    if (typeof motionBump === 'function') { motionBump(msg1.firstElementChild, 1.12); motionBump(msg2.firstElementChild, 1.12); }

    clearTimeout(appState.reaction.resultTimeoutId);
    appState.reaction.resultTimeoutId = setTimeout(() => {
        // Leaving during this second used to re-arm the panels behind the menu.
        if (appState.reaction.status !== 'ended') return;
        document.getElementById('reaction-exit-btn').classList.remove('hidden');

        const restartHTML = `<div class="mt-8 text-lg font-bold text-white text-opacity-80 animate-pulse drop-shadow-md">${restartText}</div>`;
        if (msg1.children[0]) msg1.children[0].innerHTML += restartHTML;
        if (msg2.children[0]) msg2.children[0].innerHTML += restartHTML;

        // Starting again is an ordinary tap.
        p1.onpointerdown = null;
        p2.onpointerdown = null;
        p1.onclick = () => startReactionRound();
        p2.onclick = () => startReactionRound();
    }, 1000);
}

// Leaving by any way but the exit button (the back button, another game):
// the wait for green would still turn it green, with its sound, on the next screen.
if (typeof onLeaveScreen === 'function') onLeaveScreen((from) => {
    if (from !== 'play-reaction') return;
    clearTimeout(appState.reaction.timeoutId);
    clearTimeout(appState.reaction.resultTimeoutId);
    appState.reaction.status = 'idle';
    ['reaction-p1', 'reaction-p2'].forEach(id => {
        const panel = document.getElementById(id);
        if (!panel) return;
        panel.onclick = null;
        panel.onpointerdown = null;
    });
});

function exitReactionGame(event) {
    // 🛡️ THE SHIELD: This stops the click from going through the button to the screen underneath!
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    
    clearTimeout(appState.reaction.timeoutId);
    clearTimeout(appState.reaction.resultTimeoutId);
    appState.reaction.status = 'idle';
    
    // Completely disable the screen taps so they don't accidentally trigger a restart
    ['reaction-p1', 'reaction-p2'].forEach(id => {
        const panel = document.getElementById(id);
        panel.onclick = null;
        panel.onpointerdown = null;
    });
    
    // Safely return to the setup menu
    setView('setup-reaction');
}

</script>
