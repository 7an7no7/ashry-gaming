  { en: "English: King's English Variation", ar: "الإنجليزي: التفريع الملكي", moves: "c4 e5" },
  { en: "English: Four Knights Variation", ar: "الإنجليزي: تفريع الأحصنة الأربعة", moves: "c4 e5 Nc3 Nf6 Nf3 Nc6" },
  { en: "English: Anglo-Indian Defense", ar: "الإنجليزي: الدفاع الأنجلو-هندي", moves: "c4 Nf6" },
  { en: "Réti Opening", ar: "افتتاح ريتي", moves: "Nf3 d5 c4" },
  { en: "King's Indian Attack", ar: "هجوم الهندي الملكي", moves: "Nf3 d5 g3 Nf6 Bg2 e6 O-O" },
  { en: "Bird's Opening", ar: "افتتاح بيرد", moves: "f4" },
  { en: "Bird: From's Gambit", ar: "افتتاح بيرد: جامبيت فروم", moves: "f4 e5" },
  { en: "Nimzowitsch-Larsen Attack", ar: "هجوم لارسون-نمزوفيتش", moves: "b3" },
  { en: "Grob Opening", ar: "افتتاح جروب", moves: "g4" }
];

let CH_OPENING_BY_POS = null;

function chInitOpenings() {
  if (CH_OPENING_BY_POS) return;
  CH_OPENING_BY_POS = new Map();
  for (let i = 0; i < CH_OPENINGS.length; i++) {
    const op = CH_OPENINGS[i];
    const g = chessNew();
    const moves = op.moves.trim().split(/\s+/);
    let legal = true;
    for (let j = 0; j < moves.length; j++) {
      const mv = chFindSan(g, moves[j]);
      if (!mv) { legal = false; break; }
      chessPlay(g, mv);
    }
    if (legal) {
      CH_OPENING_BY_POS.set(chessPlacement(g.board), {
        ar: op.ar,
        en: op.en,
        moves: op.moves,
        depth: moves.length
      });
    }
  }
}

function chFindSan(g, san) {
  const p = chessPos(g);
  const legal = chessLegalPos(p);
  const clean = san.replace(/[+#?!]/g, '').replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O');
  for (let i = 0; i < legal.length; i++) {
    const s = chessSanPos(p, legal[i], legal).replace(/[+#?!]/g, '');
    if (s === clean) {
      return {
        from: chessSqName(chessMFrom(legal[i])),
        to: chessSqName(chessMTo(legal[i])),
        promo: chessPromoLetter(chessMPromo(legal[i]))
      };
    }
  }
  return null;
}

/**
 * Match a move sequence against the opening database.
 * Returns the deepest matched opening, along with lastMatchPly and outOfTheoryPly.
 * Returns null if not standard chess (960 or setup FEN), or if no opening was matched.
 */
function chOpeningMatch(sans, opts) {
  if (!sans || !sans.length) return null;
  const o = opts || {};
  if (o.variant === '960' || (o.start && o.start !== CHESS_START_FEN)) return null;
  chInitOpenings();
  const g = chessNew();
  const limit = typeof o.limit === 'number' ? Math.min(o.limit, sans.length) : sans.length;
  let deepest = null;
  let lastPly = 0;
  for (let ply = 0; ply < limit; ply++) {
    const mv = chFindSan(g, sans[ply]);
    if (!mv) break;
    chessPlay(g, mv);
    const placement = chessPlacement(g.board);
    if (CH_OPENING_BY_POS.has(placement)) {
      deepest = CH_OPENING_BY_POS.get(placement);
      lastPly = ply + 1;
    }
  }
  if (!deepest) return null;
  const curLang = (typeof appState !== 'undefined' && appState.lang) || 'ar';
  return {
    ar: deepest.ar,
    en: deepest.en,
    name: curLang === 'en' ? deepest.en : deepest.ar,
    lastPly: lastPly,
    outOfTheoryPly: lastPly + 1,
    isTheory: limit === lastPly
  };
}
