<script>
  /* --- IMPOSTER GAME LOGIC --- */

  function renderSpyCategories() {
      const select = document.getElementById('imposter-category-select');
      if(!select) return;
      const countriesLabel = appState.lang === 'ar' ? '🌍 دول العالم (تلقائي)' : '🌍 World Countries (Auto)';
      const manualLabel = appState.lang === 'ar' ? '✍️ إدخال يدوي' : '✍️ Manual Entry';
      
      let html = `<option value="countries">${countriesLabel}</option><option value="manual">${manualLabel}</option>`;
      for(const cat in SPY_CATEGORIES) {
          html += `<option value="${cat}">${cat}</option>`;
      }
      // Rebuilt on every visit: the pick goes back to the one last chosen on
      // this phone (data-remember), not the first in the list.
      const previous = select.value;
      select.innerHTML = html;
      if (!recallField(select) && previous && [...select.options].some(o => o.value === previous)) select.value = previous;
      const container = document.getElementById('manual-word-container');
      if (container) container.classList.toggle('hidden', select.value !== 'manual');
  }

  function toggleManualWordInput() {
      const select = document.getElementById('imposter-category-select');
      const container = document.getElementById('manual-word-container');
      if (select.value === 'manual') {
          container.classList.remove('hidden');
          document.getElementById('imposter-manual-word').focus();
      } else {
          container.classList.add('hidden');
      }
  }

  function startImposterGame(playersToUse) {
      const undercoverSwitch = document.getElementById('imposter-undercover-on');
      const undercover = !!(undercoverSwitch && undercoverSwitch.checked);
      if (!undercover) {
          const catSelect = document.getElementById('imposter-category-select');
          const category = catSelect.value;
          if (category.includes('🔒')) {
              const expectedPw = SPY_CATEGORIES[category][0]; 
              if (appState.imposter.unlockedCategories && 
                  !Array.isArray(appState.imposter.unlockedCategories) && 
                  appState.imposter.unlockedCategories[category] === expectedPw) {
                   continuePrepImposter(playersToUse);
                   return;
              }
              if (expectedPw) {
                  document.getElementById('password-error').innerText = '';
                  document.getElementById('category-password-input').value = '';
                  document.getElementById('password-modal').classList.remove('hidden');
                  document.getElementById('category-password-input').focus();
                  window._pendingImposterPlayers = playersToUse;
                  return;
              }
          }
      }
      continuePrepImposter(playersToUse);
  }

  function verifyCategoryPassword() {
      const input = document.getElementById('category-password-input').value;
      const catSelect = document.getElementById('imposter-category-select');
      const category = catSelect.value;
      const expectedPw = SPY_CATEGORIES[category][0];
      if (input === expectedPw) {
          playSound('success');
          if (!appState.imposter.unlockedCategories || Array.isArray(appState.imposter.unlockedCategories)) {
              appState.imposter.unlockedCategories = {}; 
              }
          appState.imposter.unlockedCategories[category] = input;
          saveToLocal();
          closeModal('password-modal');
          continuePrepImposter(window._pendingImposterPlayers);
          delete window._pendingImposterPlayers;
      } else {
          playSound('alarm');
          const errorMsg = appState.lang === 'ar' ? 'كلمة مرور خاطئة!' : 'Incorrect password!';
          document.getElementById('password-error').innerText = errorMsg;
      }
  }

  function continuePrepImposter(playersToUse) {
      let selected = playersToUse || (appState.activePlayers ? [...appState.activePlayers] : []);
      saveActivePlayers(selected);
      const countInput = document.getElementById('imposter-count');
      // An emptied or negative field used to reach Array(count) and throw.
      let count = parseInt(countInput.value, 10);
      if (!isFinite(count) || count < 1) count = 1;
      countInput.value = count;
      
      if(selected.length < 3) {
          // «مين بيلعب؟»: the names in a sheet, then on to the game (JS_Utils.html).
          return askPlayers(3, () => continuePrepImposter());
      }
      if(count >= selected.length) {
          const msg = appState.lang === 'ar' ? 'عدد الجواسيس كبير جداً' : 'Too many imposters';
          // The count that is too high, scrolled to and shaken (JS_Utils.html).
          return blockStartAt(countInput.closest('.stepper') || countInput, msg);
      }
      
      if (!appState.imposter.config) appState.imposter.config = {};
      appState.imposter.config.impostersCount = count;
      const undercoverSwitch = document.getElementById('imposter-undercover-on');
      const undercover = !!(undercoverSwitch && undercoverSwitch.checked);
      appState.imposter.config.undercover = undercover;
      if (undercover) {
          const pairs = typeof SPY_PAIRS !== 'undefined' ? SPY_PAIRS : [];
          const picked = freshPick('imppair', pairs, 1, { key: p => p[0] + '|' + p[1] })[0];
          // Either word can be the odd one's: always the second of the pair (a list the
          // page ships) told whoever held it that they were the odd one out.
          const pair = picked && Math.random() < 0.5 ? [picked[1], picked[0]] : picked;
          appState.imposter.secretWord = pair ? pair[0] : '';
          appState.imposter.pairOther = pair ? pair[1] : '';
      } else {
          appState.imposter.pairOther = null;
      }
      lastSelectedPlayers = selected;
      playSound('click');
      // The order is the picker's; «↕ رتّب» there changes it (the owner, 26 Sep
      // 2026: the order no longer pops up before every round).
      finalizeImposterGame(selected);
  }

  function finalizeImposterGame(orderedNames) {
      lastSelectedPlayers = orderedNames;
      const undercover = !!(appState.imposter.config && appState.imposter.config.undercover);
      let secretWord = "";
      if (undercover) {
          secretWord = appState.imposter.secretWord;
      } else {
          const catSelect = document.getElementById('imposter-category-select');
          const category = catSelect.value;
          if (category === 'manual') {
              secretWord = document.getElementById('imposter-manual-word').value.trim();
              if (!secretWord) {
                  const msg = appState.lang === 'ar' ? 'يرجى إدخال الكلمة السرية' : 'Please enter the secret word';
                  if (appState.currentView !== 'setup-imposter') setView('setup-imposter');
                  // What is missing, scrolled to and shaken (JS_Utils.html).
                  blockStartAt(document.getElementById('imposter-manual-word'), msg);
                  return;
              }
          } else if (category === 'countries') {
              // The country list went to MonkeyWords.js with ربع قرد; this category
              // still read the old COUNTRIES_DB and threw, so Start did nothing.
              // The countries everyone knows (Countries.js tier 1): from the whole list
              // the spy's table was asked to talk about Fiji and Honduras.
              const known = typeof COUNTRIES !== 'undefined'
                  ? COUNTRIES.filter(c => c.tier === 1).map(c => contentLang() === 'en' ? c.en : c.ar) : [];
              const countries = known.length ? known : (MONKEY_LISTS[contentLang()] || MONKEY_LISTS.ar).countries;
              secretWord = freshPick('imposter:countries:' + contentLang(), countries, 1)[0];
          } else if (SPY_CATEGORIES[category]) {
              let list = SPY_CATEGORIES[category];
              if (category.includes('🔒')) list = list.slice(1);
              secretWord = freshPick('imposter:' + category, list, 1)[0];
          }
      }
      const count = appState.imposter.config.impostersCount;
      const total = orderedNames.length;
      let roles = Array(count).fill('Imposter').concat(Array(total - count).fill('Civilian'));
      roles = shuffleArray(roles);
      appState.imposter.players = orderedNames.map((name, idx) => ({ name: name, role: roles[idx] }));
      // Who asks whom, if the table asked for it (JS_Director.html).
      if (typeof directorStart === 'function') directorStart(appState.imposter, orderedNames, directorModeOf('imposter'));
      appState.imposter.secretWord = secretWord;
      appState.imposter.revealIndex = 0;
      appState.imposter.timer = 0;
      showRevealStep();
      setView('imposter-reveal');
  }

  /**
   * The next player's name, and their role already on the back of the card:
   * it shows only while they hold it (JS_Motion.html, section 11), so nothing
   * here may make a sound that differs between a spy and everyone else.
   */
  function showRevealStep() {
      const player = appState.imposter.players[appState.imposter.revealIndex];
      document.getElementById('reveal-player-name').innerText = player.name;
      fillRole(player);
      holdCardReset(document.getElementById('imposter-hold'));
  }

  function fillRole(player) {
      const wordDiv = document.getElementById('role-word');
      const card = document.getElementById('role-card-content');
      const undercover = !!appState.imposter.config.undercover;
      const spy = !undercover && player.role === 'Imposter';
      wordDiv.innerText = undercover
          ? (player.role === 'Imposter' ? appState.imposter.pairOther : appState.imposter.secretWord)
          : (spy ? (appState.lang === 'ar' ? "🕵️‍♂️ أنت الجاسوس!" : "🕵️‍♂️ You are the Imposter!")
                 : appState.imposter.secretWord);
      // Tokens, not palette classes: green-700 on the dark card was 2.6:1, and
      // overwriting className also dropped the card's own sizing.
      wordDiv.className = 'metric metric--lg ' + (spy ? 'tx-danger' : 'tx-success');
      if (card) card.classList.toggle('is-spy', spy);
  }

  function hideRole() {
      appState.imposter.revealIndex++;
      if (appState.imposter.revealIndex >= appState.imposter.players.length) {
          playSound('success');
          renderImposterBoard();
          setView('play-imposter');
          startImposterTimer();
      } else {
          playSound('click');
          showRevealStep();
      }
  }

  function renderImposterBoard() {
      const container = document.getElementById('imposter-game-players');
      container.innerHTML = '';
      appState.imposter.players.forEach(p => {
          container.innerHTML += `<div class="imposter-card m-1">${escapeHTML(p.name)}</div>`;
      });
      if (typeof paintDirector === 'function') paintDirector('imposter-director', appState.imposter, 'imposterDirectorNext()');
  }

  function imposterDirectorNext() {
      directorNext(appState.imposter);
      paintDirector('imposter-director', appState.imposter, 'imposterDirectorNext()');
      haptic('light');
  }

  function startImposterTimer() {
      isPaused = false;
      appState.imposter.timer = 0;
      updateImposterTimerUI();
      runImposterClock(0);
  }

  /**
   * Counts up from `from` seconds: this is the discussion timer, it has no
   * fixed length. A reload comes back paused with the time it showed and no
   * clock (restoreView), so Resume starts one from there.
   */
  function runImposterClock(from) {
      stopImposterTimer();
      const base = Math.max(0, Math.floor(Number(from) || 0));
      imposterInterval = createClock({
          countUp: true,
          onTick: (elapsed) => {
              appState.imposter.timer = base + elapsed;
              updateImposterTimerUI();
          }
      });
  }

  function stopImposterTimer() {
      if (imposterInterval) imposterInterval.stop();
      imposterInterval = null;
  }

  function toggleImposterTimer() {
      playSound('click');
      if (imposterInterval) {
          isPaused = imposterInterval.toggle();
      } else if (isPaused) {
          // Resume after a reload: Resume used to flip the label and leave the clock at 00:00.
          isPaused = false;
          runImposterClock(appState.imposter.timer);
          saveToLocal();
      } else {
          isPaused = true;
      }
      updateImposterTimerUI();
  }

  function updateImposterTimerUI() {
      const display = document.getElementById('imposter-timer-display');
      const btn = document.getElementById('imp-pause-btn');
      const t = TRANSLATIONS[appState.lang] || {};
      const mins = Math.floor(appState.imposter.timer / 60).toString().padStart(2, '0');
      const secs = (appState.imposter.timer % 60).toString().padStart(2, '0');
      if (display) display.innerText = `${mins}:${secs}`;
      if (btn) {
          // The key moves with the label, so a language change keeps the right word.
          btn.setAttribute('data-i18n', isPaused ? 'resume_btn' : 'pause_btn');
          btn.innerText = isPaused ? (t.resume_btn || '') : (t.pause_btn || '');
      }
  }

  function revealImposterResult() {
      stopImposterTimer();
      playSound('success');
      
      const undercover = !!(appState.imposter.config && appState.imposter.config.undercover);
      const wordTitle = undercover
          ? (appState.lang === 'ar' ? 'الكلمة' : 'Word')
          : (appState.lang === 'ar' ? 'الكلمة السرية' : 'Secret Word');
      const impTitle = undercover
          ? (appState.lang === 'ar' ? 'المختلف' : 'Undercover')
          : (appState.lang === 'ar' ? 'الجواسيس' : 'Imposters');
      const andText = appState.lang === 'ar' ? ' و ' : ' & ';

      const imposters = appState.imposter.players.filter(p => p.role === 'Imposter').map(p => escapeHTML(p.name)).join(andText);
      
      const pairOtherHtml = undercover && appState.imposter.pairOther ? `
        <div class="mb-4">
            <div class="eyebrow">${appState.lang === 'ar' ? 'كلمة المختلف' : 'Undercover Word'}</div>
            <div class="metric metric--md tx-danger">${escapeHTML(appState.imposter.pairOther)}</div>
        </div>
      ` : '';

      document.getElementById('winners-list').innerHTML = `
        <div class="mb-4">
            <div class="eyebrow">${wordTitle}</div>
            <div class="metric metric--md tx-success">${escapeHTML(appState.imposter.secretWord)}</div>
        </div>
        ${pairOtherHtml}
        <div>
            <div class="eyebrow">${impTitle}</div>
            <div class="metric metric--md tx-danger">${imposters}</div>
        </div>
      `;
      
      // Clear specific screw chart stuff if any
      const screwChart = document.getElementById('screw-chart-container');
      if(screwChart) screwChart.classList.add('hidden');
      
      const winnerScores = document.getElementById('winner-scores-container');
      if(winnerScores) winnerScores.classList.add('hidden');
      // Nothing to list for the spy: the button opened another game's table.
      const fullBtn = document.getElementById('toggle-results-btn');
      if (fullBtn) fullBtn.classList.add('hidden');
      
      document.getElementById('winner-modal').classList.remove('hidden');
  }
</script>
