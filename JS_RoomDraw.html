<script>
/* ============================================================================
   رسم وتخمين — DRAW & GUESS
   ----------------------------------------------------------------------------
   The drawer's own canvas is always instant: it paints locally and only then
   sends. Two things go to the room:
     - the line still under the finger, a few points every DRAW_LIVE_MS, which
       the room relays to the other phones without keeping (Room.sendLive),
     - each finished stroke, a moment after the finger lifts (addStrokes),
       which is what the room keeps.
   Viewers draw the live line as it arrives, then repaint from the room's
   stroke list once the finished stroke lands, so every phone ends up with
   exactly the same picture - and a piece that went missing repairs itself.
   The round is won by the first correct guess.

   Coordinates are quantised to a 0–255 grid before sending, which keeps a whole
   drawing small.
   ========================================================================= */

const DRAW_GRID = 255;
const DRAW_FLUSH_MS = 200;      // how soon a finished stroke is sent
const DRAW_LIVE_MS = 80;        // how often the line under the finger is shared
/* Fifteen, in two rows of eight with the custom swatch as the sixteenth: darks
   and greys, warm and cool, a skin tone for faces, and white (which is what
   the eraser paints). Anything else comes from the custom swatch's picker. */
const DRAW_COLOURS = ['#111827', '#6b7280', '#78350f', '#e11d48', '#f97316', '#facc15', '#65a30d', '#059669',
                      '#0891b2', '#2563eb', '#1e3a8a', '#7c3aed', '#db2777', '#f5cba7', '#ffffff'];
/* The canvas is white in both themes — the drawing is shared, so it cannot
   follow one person's theme. The eraser paints this colour. */
const DRAW_PAPER = '#ffffff';
const DRAW_ROUND_CHOICES = [60, 90, 120, 180];

/* p=pen  l=line  r=rectangle  o=ellipse  b=fill  e=eraser.
   The first four and the eraser all send as strokes; only the letters differ. */
const DRAW_TOOLBOX = [
  { id: 'p', icon: '✏️', key: 'draw_tool_pen' },
  { id: 'l', icon: '╱',  key: 'draw_tool_line' },
  { id: 'r', icon: '▭',  key: 'draw_tool_rect' },
  { id: 'o', icon: '◯',  key: 'draw_tool_circle' },
  { id: 'b', icon: '🪣', key: 'draw_tool_fill' },
  { id: 'e', icon: '🧽', key: 'draw_tool_erase' }
];

const draw = {
  canvas: null, ctx: null,
  drawing: false,
  current: null,        // stroke being drawn right now
  pending: [],          // finished strokes not yet sent
  redo: [],             // strokes taken back by undo, until the next new one
  onUndo: null,         // what Ctrl+Z does on this screen
  onRedo: null,
  local: false,         // ارسم واكتب: strokes stay here until the player is done
  painted: 0,           // how many server strokes we've already drawn
  colour: DRAW_COLOURS[0],
  width: 5,
  tool: 'p',
  snapshot: null,      // canvas before a shape started, for the rubber band
  flushTimer: null,
  clock: null,
  clockEndsAt: null,   // deadline the live clock belongs to
  liveSeq: 0,          // drawer: which stroke the live line belongs to
  liveSent: 0,         // drawer: how many of its numbers have been shared
  liveAt: 0,           // drawer: when the live line was last shared
  live: null,          // viewer: the drawer's line in progress { s, n, c, w, p }
  liveShown: false,    // viewer: that line is painted on the canvas
  round: null          // the round (deal) the redo list belongs to
};

/* The host's round length, remembered on their phone: the big screen's lobby
   is rebuilt whenever someone joins, and the picker used to jump back. */
const DRAW_SECONDS_KEY = 'ashryDrawRoomSeconds';
function drawRoomSeconds(state) {
  try {
    const saved = Number(localStorage.getItem(DRAW_SECONDS_KEY));
    if (DRAW_ROUND_CHOICES.indexOf(saved) !== -1) return saved;
  } catch (e) {}
  const last = state && state.shared && state.shared.roundSeconds;
  return DRAW_ROUND_CHOICES.indexOf(last) !== -1 ? last : 90;
}
function setDrawRoomSeconds(value) {
  try { localStorage.setItem(DRAW_SECONDS_KEY, String(Number(value))); } catch (e) {}
}

ROOM_GAMES.drawguess = {
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = TRANSLATIONS[appState.lang];
    // Whatever was chosen last time is the default, so changing it once sticks.
    const current = drawRoomSeconds(state);
    return `
      <div class="card card--tight">
        <label class="field__label" for="draw-seconds">${t.draw_round_length || ''}</label>
        <select id="draw-seconds" onchange="setDrawRoomSeconds(this.value)">
          ${DRAW_ROUND_CHOICES.map(sec => `
            <option value="${sec}" ${sec === current ? 'selected' : ''}>
              ${sec} ${t.seconds_short || ''}${sec === 90 ? ' · ' + (t.default_label || '') : ''}
            </option>`).join('')}
        </select>
        <p class="field__hint" style="text-align:center">${t.draw_hint || ''}</p>
      </div>`;
  },
  startPayload: () => {
    const sel = document.getElementById('draw-seconds');
    return {
      lang: contentLang(),
      seconds: sel ? Number(sel.value) : drawRoomSeconds(Room.state)
    };
  },

  render(state) {
    if (appState.currentView !== 'room-drawguess') {
      resetDrawSurface();
      setView('room-drawguess');
    }
    const el = document.getElementById('view-room-drawguess');
    if (!el) return;

    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;
    const amDrawer = s.drawerId === Room.me;
    const over = !!s.word;   // published only when the round ends

    // A new round: what undo took last round is not this drawing's to put back.
    const roundKey = roomDealKey(state, s.round);
    if (draw.round !== roundKey) { draw.round = roundKey; draw.redo = []; }

    // Rebuild the frame only when the phase changes; otherwise just repaint,
    // so an in-progress stroke isn't wiped by a poll. The host is in it (a new
    // host needs "next round"), and so is the language.
    const sig = [s.round, amDrawer, over, s.winnerId || '', state.youAreHost, appState.lang].join('|');
    if (el.dataset.sig !== sig) {
      const typed = document.getElementById('draw-guess');
      const guessText = typed ? typed.value : '';
      const guessFocused = !!typed && document.activeElement === typed;
      el.dataset.sig = sig;
      el.innerHTML = drawFrame(state, amDrawer, over, t);
      bindDrawSurface(amDrawer && !over);
      draw.painted = 0;
      // A rebuild mid-round (a new host) keeps the guess being typed.
      const box = document.getElementById('draw-guess');
      if (box && guessText) { box.value = guessText; if (guessFocused) box.focus(); }
    }

    paintStrokes(s.strokes || []);
    paintGuessList(s.guesses || []);
    refreshRoomPlayerStrip(el, state);

    // خمّن صح! stamped across the drawing the moment someone cracks it — only
    // when a guess won it, never when the host gave up (a round ends by
    // shared.word being set, with or without a winner). Once per round per phone.
    if (s.word && s.winnerId && !motionOff() &&
        typeof motionFirst === 'function' && motionFirst('draw-stamp|' + state.code + '|' + s.round)) {
      const wrap = el.querySelector('.draw-wrap');
      if (wrap && !wrap.querySelector('.draw-stamp')) {
        const stamp = document.createElement('div');
        stamp.className = 'draw-stamp';
        stamp.textContent = t.draw_stamp_right || 'خمّن صح!';
        wrap.appendChild(stamp);
      }
    }
    if (!over) startDrawClock(s.endsAt);
    else stopDrawClock();

    if (over) {
      const board = document.getElementById('draw-board');
      if (board) board.innerHTML = renderScoreboard(s.board);
    }
  }
};

function drawFrame(state, amDrawer, over, t) {
  const s = state.shared;

  const header = over
    ? `<div class="card card--accent" style="text-align:center">
         <div class="eyebrow">${s.winnerId ? (t.draw_guessed_by || 'خمّنها') : (t.draw_nobody || 'محدش عرفها')}</div>
         <div class="metric metric--md metric--accent">${escapeHTML(s.word || '')}</div>
       </div>`
    : `<div class="cn-score">
         <span class="cn-score__role">${amDrawer
            ? '✏️ ' + (t.draw_you_draw || 'أنت الرسام')
            : (t.draw_drawer || 'الرسام') + ': ' + escapeHTML(s.drawerName || '')}</span>
         <span id="draw-timer" class="badge badge--accent">--</span>
       </div>
       ${!amDrawer && s.hint ? drawHintHtml(s.hint, t) : ''}
       ${amDrawer
          ? `<div class="card card--accent" style="text-align:center; margin-bottom: var(--sp-2)">
               <div class="eyebrow">${t.draw_your_word || 'ارسم هذه الكلمة'}</div>
               <div class="metric metric--md metric--accent">${escapeHTML((state.you && state.you.word) || '')}</div>
             </div>`
          : ''}`;

  const tools = (amDrawer && !over) ? drawToolsHtml(t, { undo: 'undoDrawStroke()', redo: 'redoDrawStroke()', clear: 'clearDrawCanvas()' }) : '';

  const guessBox = (!amDrawer && !over) ? `
      <div class="input-group" style="margin-top: var(--sp-3)">
        <input type="text" id="draw-guess" autocomplete="off" maxlength="40"
               placeholder="${t.draw_guess_ph || 'اكتب تخمينك'}"
               onkeydown="if(event.key==='Enter') submitDrawGuess()">
        <button onclick="submitDrawGuess()" class="btn btn--primary">${t.send || 'إرسال'}</button>
      </div>` : '';

  const footer = over
    ? (state.youAreHost
        ? `<div class="btn-stack" style="margin-top: var(--sp-3)">
             <button onclick="roomAct('nextRound', ${roomNextArgs(state)})" class="btn btn--primary btn--lg">${t.draw_next || 'جولة جديدة'}</button>
             <button onclick="roomAct('backToHub')" class="btn btn--ghost">${t.room_another_game || 'لعبة أخرى'}</button>
           </div>`
        : `<div class="waiting-note">${t.room_wait_host}</div>`)
    : ((amDrawer || state.youAreHost)
        // The server lets the drawer reveal too, and they are the one who knows
        // it is hopeless. This used to need host AND drawer, so when the host
        // was not drawing nobody could end the round early.
        ? `<button onclick="roomAct('giveUp')" class="btn btn--ghost btn--sm" style="margin-top: var(--sp-3)">${t.draw_reveal || 'كشف الكلمة'}</button>`
        : '');

  // One column on a phone held upright. On its side (Style.html, landscape)
  // the canvas runs down one side and everything else sits beside it.
  return `<div class="draw-layout">
      <div class="draw-layout__head">${header}</div>
      <div class="draw-wrap"><canvas id="draw-canvas" width="512" height="512"></canvas></div>
      <div class="draw-layout__side">
        ${tools}
        ${guessBox}
        <div id="draw-guesses" class="draw-guesses"></div>
        <div id="draw-board"></div>
        ${footer}
      </div>
    </div>
    ${renderRoomPlayerStrip(state)}`;
}

/**
 * The toolbox, shared with ارسم واكتب: the six tools; fifteen colours and a
 * custom swatch that opens the phone's colour picker, in two rows of eight;
 * then the four thicknesses with undo, redo and clear. `h` carries the handlers as onclick
 * strings, because Draw & Guess undoes on the server and the telephone
 * undoes on the phone.
 */
function drawToolsHtml(t, h) {
  const custom = DRAW_COLOURS.indexOf(draw.colour) === -1;
  return `
      <div class="draw-tools">
        <div class="draw-tools__row" role="group" aria-label="${escapeHTML(t.draw_tools || '')}">
          ${DRAW_TOOLBOX.map(tool => `
            <button class="draw-tool ${tool.id === draw.tool ? 'is-active' : ''}"
                    aria-pressed="${tool.id === draw.tool}"
                    title="${escapeHTML(t[tool.key] || '')}" aria-label="${escapeHTML(t[tool.key] || '')}"
                    onclick="setDrawTool('${tool.id}')">${tool.icon}</button>`).join('')}
        </div>
        <div class="draw-tools__row draw-tools__row--palette" role="group" aria-label="${escapeHTML(t.draw_colours || '')}">
          ${DRAW_COLOURS.map(c => `
            <button class="draw-swatch ${c === draw.colour ? 'is-active' : ''}"
                    style="background:${c}" aria-label="${c}"
                    onclick="setDrawColour('${c}')"></button>`).join('')}
          <label class="draw-swatch draw-swatch--custom ${custom ? 'is-active' : ''}" style="${custom ? 'background:' + draw.colour : ''}"
                 title="${escapeHTML(t.draw_custom_colour || '')}" aria-label="${escapeHTML(t.draw_custom_colour || '')}">
            <input type="color" value="${custom ? draw.colour : '#ff8800'}" oninput="setDrawColour(this.value)">
          </label>
        </div>
        <div class="draw-tools__row draw-tools__row--acts">
          ${[2, 5, 10, 20].map(w => `
            <button class="draw-width ${w === draw.width ? 'is-active' : ''}"
                    aria-label="${w}" onclick="setDrawWidth(${w})">
              <span class="draw-width__dot" style="width:${Math.min(22, w + 4)}px;height:${Math.min(22, w + 4)}px"></span>
            </button>`).join('')}
          <span class="draw-tools__gap"></span>
          <button class="draw-tool draw-tool--act" onclick="${h.undo}" title="${escapeHTML(t.draw_undo || '')}" aria-label="${escapeHTML(t.draw_undo || '')}">↶</button>
          <button class="draw-tool draw-tool--act" onclick="${h.redo}" title="${escapeHTML(t.draw_redo || '')}" aria-label="${escapeHTML(t.draw_redo || '')}">↷</button>
          <button class="draw-tool draw-tool--danger" onclick="${h.clear}" title="${escapeHTML(t.draw_clear || '')}" aria-label="${escapeHTML(t.draw_clear || '')}">🗑️</button>
        </div>
      </div>`;
}

/* Ctrl+Z / Ctrl+Y (or Cmd) on a laptop, while a drawing surface is on screen. */
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || !draw.canvas || !draw.canvas.isConnected || !draw.canvas.offsetParent) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
  const k = String(e.key || '').toLowerCase();
  if (k === 'z' && !e.shiftKey) { if (draw.onUndo) { e.preventDefault(); draw.onUndo(); } }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { if (draw.onRedo) { e.preventDefault(); draw.onRedo(); } }
});

/** The word's shape for the guessers: a slot per letter, a gap between words. */
function drawHintHtml(hint, t) {
  const marks = String(hint || '').replace(/ +/g, m => m.length > 1 ? '|' : '').split('');
  const letters = marks.filter(m => m === '_').length;
  return `<div class="draw-hint">
      <span class="eyebrow">${escapeHTML(t.draw_hint_label || '')} · <span class="metric">${letters}</span></span>
      <span class="draw-hint__slots" dir="ltr">${marks.map(m => m === '_' ? '<i class="draw-hint__slot"></i>' : '<i class="draw-hint__gap"></i>').join('')}</span>
    </div>`;
}

/* --- painting ------------------------------------------------------------ */

function paintStrokes(strokes) {
  const c = draw.canvas, ctx = draw.ctx;
  if (!c || !ctx) return;

  // Never repaint under a stroke in progress. An update landing mid-drag would
  // wipe the line being drawn, and for a shape it also throws away the
  // snapshot the rubber band restores from — which made the preview stack on
  // itself and left the drawer with darker edges than everyone else saw.
  // The drawer is the only one who can add strokes, so nothing is missed:
  // the next update after the drag catches up.
  if (draw.drawing) return;

  // A shrinking list means the drawer cleared or undid: start again. Replaying
  // from the beginning also keeps fills correct, since a fill depends on
  // everything painted before it.
  if (strokes.length < draw.painted) {
    clearSurface();
    draw.painted = 0;
    draw.live = null;
    draw.liveShown = false;
  }
  if (strokes.length === draw.painted) return;

  // The finished stroke for a live line has landed. Painting it over the live
  // line would darken its soft edges, so replay from the paper up instead.
  if (draw.liveShown) {
    clearSurface();
    draw.painted = 0;
    draw.liveShown = false;
  }

  for (let i = draw.painted; i < strokes.length; i++) drawStroke(ctx, strokes[i], c.width);
  draw.painted = strokes.length;

  // A line the drawer is still drawing goes back on top.
  if (draw.live && draw.live.n >= strokes.length) {
    drawStroke(ctx, draw.live, c.width);
    draw.liveShown = true;
  } else {
    draw.live = null;
  }
  // The snapshot the shape preview restores from is now stale.
  draw.snapshot = null;
}

/** Draws one stroke. `t` picks the tool; absent means freehand. */
function drawStroke(ctx, st, size) {
  const pts = st.p || [];
  const k = size / DRAW_GRID;
  const X = (i) => pts[i] * k;

  if (st.t === 'b') {
    if (pts.length >= 2) floodFill(ctx, Math.round(X(0)), Math.round(X(1)), st.c || '#111');
    return;
  }

  if (pts.length < 2) return;
  ctx.strokeStyle = st.c || '#111';
  ctx.lineWidth = (st.w || 4) * k;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();

  if (st.t === 'l' && pts.length >= 4) {
    ctx.moveTo(X(0), X(1));
    ctx.lineTo(X(2), X(3));
  } else if (st.t === 'r' && pts.length >= 4) {
    ctx.rect(X(0), X(1), X(2) - X(0), X(3) - X(1));
  } else if (st.t === 'o' && pts.length >= 4) {
    const cx = (X(0) + X(2)) / 2, cy = (X(1) + X(3)) / 2;
    ctx.ellipse(cx, cy, Math.abs(X(2) - X(0)) / 2, Math.abs(X(3) - X(1)) / 2, 0, 0, Math.PI * 2);
  } else {
    // Freehand: one smooth path, curving through the midpoints between the
    // sampled points. The finger's live preview is painted segment by segment
    // (it has to be, point by point), and every canvas - the drawer's too -
    // is replayed from the stroke list the moment the stroke lands, so the
    // same command list draws the same pixels everywhere.
    if (pts.length < 6) {
      ctx.moveTo(X(0), X(1));
      ctx.lineTo(X(2), X(3));
      ctx.stroke();
      return;
    }
    ctx.moveTo(X(0), X(1));
    for (let i = 2; i < pts.length - 2; i += 2) {
      ctx.quadraticCurveTo(X(i), X(i + 1), (X(i) + X(i + 2)) / 2, (X(i + 1) + X(i + 3)) / 2);
    }
    ctx.lineTo(X(pts.length - 2), X(pts.length - 1));
    ctx.stroke();
    return;
  }
  ctx.stroke();
}

/**
 * Paint-bucket fill, replayed identically on every phone.
 *
 * It runs against whatever is already on the canvas, and strokes are always
 * replayed in order, so every viewer fills the same region. The tolerance is
 * what makes that hold in practice: a stroke's antialiased edge is not the same
 * pixel value everywhere, and without slack the fill would seep through the
 * soft edge on one device and not another.
 */
function floodFill(ctx, x0, y0, hex) {
  const w = ctx.canvas.width, h = ctx.canvas.height;
  if (x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;

  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const at = (x, y) => (y * w + x) * 4;

  const start = at(x0, y0);
  const sr = d[start], sg = d[start + 1], sb = d[start + 2];

  const to = hexToRgb(hex);
  if (!to) return;
  // Filling with the colour already there would spin over the whole canvas for
  // no visible change.
  if (Math.abs(sr - to.r) < 4 && Math.abs(sg - to.g) < 4 && Math.abs(sb - to.b) < 4) return;

  const TOL = 40;
  const matches = (i) =>
    Math.abs(d[i] - sr) <= TOL && Math.abs(d[i + 1] - sg) <= TOL && Math.abs(d[i + 2] - sb) <= TOL;

  // Scanline flood: fills a whole row at a time, so a 512×512 canvas is a few
  // milliseconds rather than a stack of a quarter of a million pixels.
  const stack = [[x0, y0]];
  while (stack.length) {
    const [sx, sy] = stack.pop();
    let x = sx;
    while (x > 0 && matches(at(x - 1, sy))) x--;
    let spanUp = false, spanDown = false;
    for (; x < w && matches(at(x, sy)); x++) {
      const i = at(x, sy);
      d[i] = to.r; d[i + 1] = to.g; d[i + 2] = to.b; d[i + 3] = 255;

      if (sy > 0) {
        const up = matches(at(x, sy - 1));
        if (up && !spanUp) { stack.push([x, sy - 1]); spanUp = true; }
        else if (!up) spanUp = false;
      }
      if (sy < h - 1) {
        const dn = matches(at(x, sy + 1));
        if (dn && !spanDown) { stack.push([x, sy + 1]); spanDown = true; }
        else if (!dn) spanDown = false;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex).trim());
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
}

function clearSurface() {
  if (!draw.ctx || !draw.canvas) return;
  draw.ctx.fillStyle = DRAW_PAPER;
  draw.ctx.fillRect(0, 0, draw.canvas.width, draw.canvas.height);
  draw.snapshot = null;
}

/* --- input --------------------------------------------------------------- */

/** The colour a stroke is actually made with — the eraser paints the paper. */
function activeColour() {
  return draw.tool === 'e' ? DRAW_PAPER : draw.colour;
}
/** The width to use — the eraser is deliberately fatter than the pen. */
function activeWidth() {
  return draw.tool === 'e' ? Math.max(12, draw.width * 3) : draw.width;
}
/** Freehand and eraser both record as freehand; the eraser is just white. */
function activeToolLetter() {
  return (draw.tool === 'p' || draw.tool === 'e') ? 'f' : draw.tool;
}

function bindDrawSurface(canDraw) {
  draw.canvas = document.getElementById('draw-canvas');
  if (!draw.canvas) return;
  draw.ctx = draw.canvas.getContext('2d', { willReadFrequently: true });
  clearSurface();
  draw.painted = 0;
  draw.live = null;
  draw.liveShown = false;
  if (!draw.local) { draw.onUndo = undoDrawStroke; draw.onRedo = redoDrawStroke; }
  if (!canDraw) return;

  const pos = (e) => {
    const r = draw.canvas.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * DRAW_GRID;
    const y = ((e.clientY - r.top) / r.height) * DRAW_GRID;
    return [Math.max(0, Math.min(DRAW_GRID, Math.round(x))),
            Math.max(0, Math.min(DRAW_GRID, Math.round(y)))];
  };

  draw.canvas.onpointerdown = (e) => {
    e.preventDefault();
    const [x, y] = pos(e);

    // A fill is a single tap: no drag, nothing to preview.
    if (draw.tool === 'b') {
      const stroke = { t: 'b', c: draw.colour, w: 1, p: [x, y] };
      drawStroke(draw.ctx, stroke, draw.canvas.width);
      draw.pending.push(stroke);
      draw.redo = [];
      draw.snapshot = null;
      playSound('tick');
      scheduleFlush();
      return;
    }

    draw.canvas.setPointerCapture(e.pointerId);
    draw.drawing = true;
    const letter = activeToolLetter();
    draw.current = { c: activeColour(), w: activeWidth(), p: [x, y] };
    draw.liveSeq++;
    draw.liveSent = 0;
    draw.liveAt = 0;
    if (letter !== 'f') {
      draw.current.t = letter;
      draw.current.p = [x, y, x, y];
      // Shapes rubber-band, so keep the canvas as it was to restore from.
      draw.snapshot = draw.ctx.getImageData(0, 0, draw.canvas.width, draw.canvas.height);
    }
  };

  draw.canvas.onpointermove = (e) => {
    if (!draw.drawing || !draw.current) return;
    e.preventDefault();
    const [x, y] = pos(e);
    const cur = draw.current;

    if (cur.t) {
      // Rubber-band: put back the canvas from before the shape, draw the shape
      // at its current size. Repainting every stroke instead would get slower
      // the more there is on screen.
      cur.p[2] = x; cur.p[3] = y;
      if (!draw.snapshot) {
        // Lost it somehow. Rebuild from the strokes rather than drawing on top
        // of the last preview, which would darken the shape's edges.
        const keep = draw.drawing; draw.drawing = false;
        paintStrokesFromScratch();
        draw.drawing = keep;
        draw.snapshot = draw.ctx.getImageData(0, 0, draw.canvas.width, draw.canvas.height);
      }
      draw.ctx.putImageData(draw.snapshot, 0, 0);
      drawStroke(draw.ctx, cur, draw.canvas.width);
      return;
    }

    const p = cur.p;
    // Skip points that add nothing — keeps the payload small.
    if (Math.abs(p[p.length - 2] - x) < 2 && Math.abs(p[p.length - 1] - y) < 2) return;
    p.push(x, y);
    // Paint locally at once: the drawer never waits on the network.
    drawStroke(draw.ctx, { c: cur.c, w: cur.w, p: p.slice(-4) }, draw.canvas.width);
    shareLiveStroke(false, cur);
  };

  const finish = () => {
    if (!draw.drawing) return;
    draw.drawing = false;
    const cur = draw.current;
    draw.current = null;
    draw.snapshot = null;
    if (!cur) return;

    // A shape with no drag is a stray tap, not a zero-sized rectangle.
    if (cur.t && cur.p[0] === cur.p[2] && cur.p[1] === cur.p[3]) {
      paintStrokesFromScratch();
      return;
    }
    // The last few points, so the live line ends where the stroke does.
    if (!cur.t) shareLiveStroke(true, cur);
    if (cur.p.length >= 2) { draw.pending.push(cur); draw.redo = []; }
    scheduleFlush();
  };
  draw.canvas.onpointerup = finish;
  draw.canvas.onpointercancel = finish;
  draw.canvas.onpointerleave = finish;
}

/** Repaints everything the room has, plus anything not yet sent. */
function paintStrokesFromScratch() {
  if (!draw.ctx) return;
  const shared = (Room.state && Room.state.shared) || {};
  const wasDrawing = draw.drawing;
  draw.drawing = false;              // paintStrokes defers while a drag is live
  clearSurface();
  draw.painted = 0;
  paintStrokes(shared.strokes || []);
  draw.pending.forEach(st => drawStroke(draw.ctx, st, draw.canvas.width));
  draw.drawing = wasDrawing;
}


/**
 * Shares the stroke still under the drawer's finger. Each piece starts with the
 * last point of the one before, so the pieces join into one line on the other
 * phones. `n` is the place the finished stroke will take in the room's list.
 */
function shareLiveStroke(force, cur) {
  if (!cur || cur.t || !Room.isIn) return;
  const now = Date.now();
  if (!force && now - draw.liveAt < DRAW_LIVE_MS) return;
  if (cur.p.length <= draw.liveSent) return;
  const from = Math.max(0, draw.liveSent - 2);
  const sent = Room.sendLive({
    s: draw.liveSeq,
    n: draw.painted + draw.pending.length,
    i: from,
    c: cur.c,
    w: cur.w,
    p: cur.p.slice(from)
  });
  if (sent) {
    draw.liveSent = cur.p.length;
    draw.liveAt = now;
  }
}

/** A viewer's side: draws each piece of the drawer's line as it arrives. */
function onDrawLive(d) {
  const state = Room.state;
  // The big screen (JS_RoomTv.html) watches the line being drawn too.
  const watching = appState.currentView === 'room-drawguess' || appState.currentView === 'room-tv';
  if (!d || !state || state.game !== 'drawguess' || !watching) return;
  const s = state.shared || {};
  if (!draw.ctx || !draw.canvas || s.drawerId === Room.me || s.word) return;
  if (!Array.isArray(d.p) || d.p.length < 2 || d.p.length > 6000) return;
  // That stroke is already finished and painted from the room's list.
  if ((s.strokes || []).length > d.n) return;

  let live = draw.live;
  if (!live || live.s !== d.s) {
    if (d.i !== 0) return;       // missed its start; the finished stroke will show it
    live = draw.live = { s: d.s, n: d.n, c: String(d.c || '#111'), w: Number(d.w) || 4, p: [] };
  }
  // Pieces overlap by one point; any other start arrived out of order.
  const start = Math.max(0, live.p.length - 2);
  if (d.i !== start) return;
  const pts = d.p.map(v => Math.max(0, Math.min(DRAW_GRID, Math.round(Number(v) || 0))));
  live.p = live.p.slice(0, start).concat(pts);
  drawStroke(draw.ctx, { c: live.c, w: live.w, p: live.p.slice(start) }, draw.canvas.width);
  draw.liveShown = true;
}

Room.onLive(onDrawLive);

/** Batches finished strokes: at most one message every DRAW_FLUSH_MS. */
function scheduleFlush() {
  if (draw.local || draw.flushTimer) return;
  draw.flushTimer = setTimeout(async () => {
    draw.flushTimer = null;
    if (!draw.pending.length) return;
    try {
      await flushDrawNow();
    } catch (e) {
      showToast(e.message || 'تعذر إرسال الرسمة', 'error');
    }
  }, DRAW_FLUSH_MS);
}

function setDrawColour(c) {
  draw.colour = c;
  // Picking a colour means you want to paint with it, not keep rubbing out.
  if (draw.tool === 'e') draw.tool = 'p';
  refreshDrawTools();
  playSound('click');
}

function setDrawWidth(w) {
  draw.width = w;
  refreshDrawTools();
  playSound('click');
}

function setDrawTool(id) {
  draw.tool = id;
  refreshDrawTools();
  playSound('click');
  haptic('light');
}

/** Repaints the toolbar's pressed states without rebuilding the canvas. */
function refreshDrawTools() {
  document.querySelectorAll('.draw-tool[onclick^="setDrawTool"]').forEach(b => {
    const on = b.getAttribute('onclick').indexOf("'" + draw.tool + "'") !== -1;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('.draw-swatch').forEach(b =>
    b.classList.toggle('is-active', b.getAttribute('aria-label') === draw.colour));
  document.querySelectorAll('.draw-width').forEach(b =>
    b.classList.toggle('is-active', Number(b.getAttribute('aria-label')) === draw.width));
  const custom = document.querySelector('.draw-swatch--custom');
  if (custom) {
    const on = DRAW_COLOURS.indexOf(draw.colour) === -1;
    custom.classList.toggle('is-active', on);
    custom.style.background = on ? draw.colour : '';
  }
}

/**
 * Sends anything still queued right now, rather than on the next tick.
 *
 * `painted` is advanced *before* the request, not after: Room.act emits the new
 * state to the renderer before it returns, and with the old count still in
 * place the drawer's own strokes came back and were painted a second time on
 * top of themselves. Nobody else saw that, so the drawer's canvas slowly
 * diverged from everyone else's.
 */
async function flushDrawNow() {
  clearTimeout(draw.flushTimer);
  draw.flushTimer = null;
  if (draw.local || !draw.pending.length) return;

  const batch = draw.pending.splice(0, draw.pending.length);
  draw.painted += batch.length;          // already on this canvas

  const state = await Room.act('addStrokes', { strokes: batch });
  const strokes = state && state.shared && state.shared.strokes;
  if (!strokes) return;
  draw.painted = strokes.length;

  // Then redraw from the shared list outright, rather than trusting that the
  // canvas already matches it. The drawer's canvas is built from live input and
  // the viewers' from a replay, and the two drift for small reasons — an echoed
  // batch, a stroke the point budget truncated, an update landing at the wrong
  // moment. Replaying makes the drawer see exactly what the room sees, by
  // construction. It costs well under a millisecond.
  if (!draw.drawing) paintStrokesFromScratch();
}

/**
 * Takes back the last thing drawn.
 *
 * Anything still waiting in the batch is sent first, so "the last stroke" means
 * the same thing here as it does on everyone else's screen.
 */
async function undoDrawStroke() {
  try {
    await flushDrawNow();
    const shared = (Room.state && Room.state.shared) || {};
    const last = (shared.strokes || [])[(shared.strokes || []).length - 1];
    if (last) draw.redo.push(last);
    await Room.act('undoStroke', {});
    paintStrokesFromScratch();
    playSound('tick');
    haptic('light');
  } catch (e) {
    showToast(e.message || 'تعذر التراجع', 'error');
  }
}

/** Puts back what undo took, as a new stroke at the end of the list. */
async function redoDrawStroke() {
  const st = draw.redo.pop();
  if (!st) return;
  draw.pending.push(st);
  paintStrokesFromScratch();
  try { await flushDrawNow(); } catch (e) { showToast(e.message || 'تعذر الإعادة', 'error'); }
  playSound('tick');
  haptic('light');
}

async function clearDrawCanvas() {
  clearSurface();
  draw.pending = [];
  draw.painted = 0;
  clearTimeout(draw.flushTimer);
  draw.flushTimer = null;
  await roomAct('clearCanvas');
}

async function submitDrawGuess() {
  const input = document.getElementById('draw-guess');
  const guess = (input.value || '').trim();
  if (!guess) return;
  input.value = '';
  await roomAct('guess', { guess: guess });
}

function paintGuessList(guesses) {
  const el = document.getElementById('draw-guesses');
  if (!el) return;
  const html = guesses.slice(-6).reverse().map(g => `
      <div class="draw-guess ${g.right ? 'is-right' : ''} ${g.close ? 'is-close' : ''}">
        <span class="draw-guess__who">${escapeHTML(g.name)}</span>
        <span>${escapeHTML(g.text)}</span>
        ${g.right ? '<span aria-hidden="true">✅</span>' : g.close ? `<span class="draw-guess__close">🔥 ${escapeHTML((TRANSLATIONS[appState.lang] || {}).draw_close || '')}</span>` : ''}
      </div>`).join('');
  if (el.dataset.sig !== html) { el.innerHTML = html; el.dataset.sig = html; }
}

/* --- round clock, anchored to the shared deadline ------------------------ */
function startDrawClock(endsAt) {
  if (!endsAt) return;
  // Keyed on the deadline, not on "is a clock running": a new round brings a new
  // deadline, and the old guard kept round one's expired clock on screen.
  if (draw.clockEndsAt === endsAt) return;
  stopDrawClock();
  draw.clockEndsAt = endsAt;
  const paint = () => {
    const el = document.getElementById('draw-timer');
    if (!el) return;
    const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    el.innerText = left + 's';
  };
  paint();
  draw.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)),
    onTick: paint,
    onEnd: () => {
      draw.clock = null;
      // Only for this round of this game: the room may have moved on meanwhile.
      const st = Room.state;
      if (!Room.isHost || !st || st.game !== 'drawguess' || !st.shared || st.shared.word || st.shared.endsAt !== endsAt) return;
      roomAct('giveUp');
    }
  });
}

function stopDrawClock() {
  if (draw.clock) { draw.clock.stop(); draw.clock = null; }
  draw.clockEndsAt = null;
}
onRoomClocksReset(() => {
  stopDrawClock();
  // Strokes waiting to be sent belong to the deal that just ended.
  clearTimeout(draw.flushTimer);
  draw.flushTimer = null;
  if (!draw.local) draw.pending = [];
});

function resetDrawSurface() {
  draw.tool = 'p';
  draw.local = false;
  draw.snapshot = null;
  stopDrawClock();
  clearTimeout(draw.flushTimer);
  draw.flushTimer = null;
  draw.pending = [];
  draw.redo = [];
  draw.onUndo = null;
  draw.onRedo = null;
  draw.current = null;
  draw.drawing = false;
  draw.painted = 0;
}
</script>
