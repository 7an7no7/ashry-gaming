<script>
/* ============================================================================
   بولينج — BOWLING, in real 3D
   ----------------------------------------------------------------------------
   The owner's rules (23 Sep 2026, asked one at a time): solo with the best
   score kept on the phone, and a room with the TV where everyone bowls in
   turn and everyone watches every throw; 5 or 10 frames (5 by default), real
   ten-pin scoring; swipe the ball - the direction aims, the swipe's speed is
   the ball's speed, a curve in the swipe hooks it, and where the finger
   starts is where the ball is let go along the foul line; seen from behind
   the ball in perspective; no bumpers, no computer players; the aim guide
   («مساعدة التصويب») a switch, off by default; in a room a turn clock, off
   by default, 20 or 40 seconds, and the host's "play for" a quiet phone.

   The look is the lead's prototype the owner approved (look أ «صالة»): a
   honey-wood lane with its boards, arrows and dots, the foul line, gutters,
   lanes on either side with their pins, the masking unit over the pins (no
   words on it: the owner, 23 Sep 2026), light strips, overhead screens,
   lacquered pins turned on a lathe with red neck bands, a violet marbled ball,
   reflections from an environment map, ACES tone mapping and soft shadows;
   the camera rides behind the ball, then holds on the pins.

   The physics is Bowling.js (shared with the rooms server): a throw is four
   whole numbers and every phone and the server get the same pins down. This
   file only draws: one renderer per page (bowlGfx), made when a bowling
   screen opens and thrown away when it closes; the canvas moves into
   whichever screen shows the lane (the solo board, a room phone, the TV).
   ========================================================================= */

const bowlT = (key, vars) => {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || (TRANSLATIONS.ar || {})[key] || '';
  if (vars) Object.keys(vars).forEach(k => {
    const v = vars[k] === undefined || vars[k] === null ? '' : String(vars[k]);
    // A name inside a line keeps its own direction (FSI … PDI); a plain number doesn't need it.
    s = s.split('{' + k + '}').join(v && !/^[+-]?\d+$/.test(v) ? '⁨' + v + '⁩' : v);
  });
  return s;
};

const BOWL_OPTS_KEY = 'bowling';
const BOWL_FRAME_OPTIONS = [5, 10];
const BOWL_CLOCK_OPTIONS = [0, 20, 40];

/** The choices this phone made last: frames and the aim guide (solo and the host's lobby), the clock (the lobby). */
function bowlOpts() {
  const o = recallOptions(BOWL_OPTS_KEY, { frames: 5, guide: false, clock: 0 });
  if (BOWL_FRAME_OPTIONS.indexOf(Number(o.frames)) === -1) o.frames = 5;
  if (BOWL_CLOCK_OPTIONS.indexOf(Number(o.clock)) === -1) o.clock = 0;
  o.frames = Number(o.frames); o.clock = Number(o.clock); o.guide = !!o.guide;
  return o;
}

/* ==========================================================================
   THE LANE IN 3D
   ========================================================================== */

const bowlGfx = {
  st: 'off',          // off | loading | ready | failed
  why: '',            // failed: 'no3d' | 'offline'
  T: null, renderer: null, canvas: null, scene: null, cam: null,
  host: null,         // the element the canvas sits in now
  textures: [], ro: null, raf: 0, last: 0,
  gen: 0,             // a new throw or a cancel: every older promise lets go
  mode: 'idle',       // idle (aiming, nothing moves) | roll | settle | set
  sim: null, acc: 0, onSettled: null,
  cam0: null, camT: null, camK: 0,
  set: null,          // the pinsetter's timeline while it runs
  input: { on: false, onShot: null, guide: false, trail: null, guideAt: 0, release: null },
  release: null,
  loud: true, rumble: null, heard: { knocks: 0, clacks: 0, hit: false },
  pulse: 0, ready: null, aimX: 0, gone: []
};

/* --- small helpers ------------------------------------------------------------------ */

function bowlCanvas2d(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function bowlRnd(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function bowlTex(c, rx, ry, srgb) {
  const T = bowlGfx.T;
  const tex = new T.CanvasTexture(c);
  if (srgb !== false) tex.colorSpace = T.SRGBColorSpace;
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.repeat.set(rx || 1, ry || 1);
  tex.anisotropy = Math.min(8, bowlGfx.renderer.capabilities.getMaxAnisotropy());
  bowlGfx.textures.push(tex);
  return tex;
}
const bowlEase = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const bowlSeg = (t, a, b) => bowlEase((t - a) / (b - a));

/* --- the textures, drawn once ------------------------------------------------------- */

function bowlWoodCanvas(light) {
  const [c, g] = bowlCanvas2d(512, 1024), r = bowlRnd(light ? 7 : 3);
  const boards = 20;
  for (let i = 0; i < boards; i++) {
    const x = i * 512 / boards, w = 512 / boards;
    const l = light ? 72 + r() * 7 : 60 + r() * 8;
    g.fillStyle = `hsl(${30 + r() * 5},${light ? 52 : 58}%,${l}%)`;
    g.fillRect(x, 0, w, 1024);
    for (let k = 0; k < 26; k++) {
      g.strokeStyle = `rgba(${90 + r() * 40},${50 + r() * 20},20,${0.05 + r() * 0.09})`;
      g.lineWidth = 0.6 + r() * 1.2;
      const gx = x + r() * w;
      g.beginPath(); g.moveTo(gx, 0);
      for (let y = 0; y <= 1024; y += 64) g.lineTo(gx + Math.sin(y / 90 + k) * 1.4, y);
      g.stroke();
    }
    g.fillStyle = 'rgba(60,30,10,.35)'; g.fillRect(x, 0, 1, 1024);
    const j = r() * 1024; g.fillStyle = 'rgba(60,30,10,.25)'; g.fillRect(x, j, w, 1.2);
  }
  return c;
}

function bowlBallCanvas() {
  const [c, g] = bowlCanvas2d(512, 256), r = bowlRnd(4);
  const grd = g.createLinearGradient(0, 0, 512, 256); grd.addColorStop(0, '#5b21b6'); grd.addColorStop(0.5, '#7c3aed'); grd.addColorStop(1, '#4c1d95');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
  for (let k = 0; k < 44; k++) {
    g.strokeStyle = `rgba(${r() < 0.5 ? '196,181,253' : '46,16,101'},${0.15 + r() * 0.25})`; g.lineWidth = 2 + r() * 8;
    g.beginPath(); let x = r() * 512, y = r() * 256; g.moveTo(x, y);
    for (let s = 0; s < 6; s++) { x += (r() - 0.5) * 140; y += (r() - 0.5) * 80; g.quadraticCurveTo(x + (r() - 0.5) * 80, y + (r() - 0.5) * 80, x, y); }
    g.stroke();
  }
  [[250, 70, 11], [285, 72, 11], [268, 118, 13]].forEach(([x, y, rr]) => {
    const h = g.createRadialGradient(x, y, 1, x, y, rr); h.addColorStop(0, '#07030f'); h.addColorStop(0.8, '#1a0b33'); h.addColorStop(1, 'rgba(190,170,255,.8)');
    g.fillStyle = h; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
  });
  return c;
}

/** A pin's outline, for the masking unit and the screens: no words anywhere in the hall. */
function bowlPinPath(g, cx, base, h) {
  const w = h * 0.34;
  g.beginPath();
  g.moveTo(cx - w * 0.36, base);
  g.bezierCurveTo(cx - w * 0.62, base - h * 0.22, cx - w * 0.62, base - h * 0.42, cx - w * 0.3, base - h * 0.62);
  g.bezierCurveTo(cx - w * 0.18, base - h * 0.72, cx - w * 0.36, base - h * 0.86, cx - w * 0.2, base - h * 0.96);
  g.quadraticCurveTo(cx, base - h * 1.03, cx + w * 0.2, base - h * 0.96);
  g.bezierCurveTo(cx + w * 0.36, base - h * 0.86, cx + w * 0.18, base - h * 0.72, cx + w * 0.3, base - h * 0.62);
  g.bezierCurveTo(cx + w * 0.62, base - h * 0.42, cx + w * 0.62, base - h * 0.22, cx + w * 0.36, base);
  g.closePath();
}

function bowlMaskCanvas() {
  // One lane's stretch of the masking unit: a dark panel, a warm neon line along its foot,
  // diagonal pinstripes, and three glowing pins in the middle.
  const [c, g] = bowlCanvas2d(1024, 256);
  const grd = g.createLinearGradient(0, 0, 0, 256); grd.addColorStop(0, '#22163a'); grd.addColorStop(1, '#120b1f');
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 256);
  g.strokeStyle = 'rgba(167,139,250,.10)'; g.lineWidth = 10;
  for (let x = -256; x < 1024 + 256; x += 44) { g.beginPath(); g.moveTo(x, 256); g.lineTo(x + 180, 0); g.stroke(); }
  const glow = (color, blur, fn) => { g.save(); g.shadowColor = color; g.shadowBlur = blur; fn(); g.restore(); };
  glow('#ffb347', 30, () => { g.fillStyle = '#ffd08a'; g.fillRect(40, 226, 944, 7); });
  glow('#c4b5fd', 18, () => { g.fillStyle = 'rgba(196,181,253,.9)'; g.fillRect(40, 22, 944, 3); });
  const pins = [[512, 176, 118], [440, 176, 92], [584, 176, 92]];
  pins.forEach(([x, b, h], i) => glow(i ? '#ffb347' : '#ffe2b0', 26, () => {
    bowlPinPath(g, x, b, h);
    g.fillStyle = i ? 'rgba(255,208,138,.85)' : '#fff3dc'; g.fill();
    g.fillStyle = '#e0413a'; g.fillRect(x - h * 0.08, b - h * 0.72, h * 0.16, h * 0.035); g.fillRect(x - h * 0.08, b - h * 0.66, h * 0.16, h * 0.03);
  }));
  glow('#ffb347', 22, () => {
    g.fillStyle = 'rgba(255,208,138,.55)';
    [[250, 150], [300, 150], [724, 150], [774, 150]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); });
  });
  return c;
}

/** The overhead screen: the rack as ten lit or dark dots (the main lane's shows the pins really up). */
function bowlScreenDraw(g, standing) {
  const grd = g.createLinearGradient(0, 0, 0, 256); grd.addColorStop(0, '#2d1b69'); grd.addColorStop(1, '#130a33');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 3; g.strokeRect(10, 10, 492, 236);
  const spots = [[0, 0], [-1, 1], [1, 1], [-2, 2], [0, 2], [2, 2], [-3, 3], [-1, 3], [1, 3], [3, 3]];
  spots.forEach(([sx, sy], i) => {
    const x = 256 + sx * 34, y = 196 - sy * 44;
    g.save();
    if (standing[i]) { g.shadowColor = '#ffd08a'; g.shadowBlur = 18; g.fillStyle = '#ffe9c4'; }
    else g.fillStyle = 'rgba(255,255,255,.14)';
    g.beginPath(); g.arc(x, y, 14, 0, 7); g.fill();
    g.restore();
  });
}

function bowlBlobCanvas() {
  const [c, g] = bowlCanvas2d(64, 64);
  const grd = g.createRadialGradient(32, 32, 2, 32, 32, 31);
  grd.addColorStop(0, 'rgba(0,0,0,.55)'); grd.addColorStop(0.6, 'rgba(0,0,0,.22)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return c;
}

/* --- the scene --------------------------------------------------------------------- */

function bowlGfxBuild() {
  const g = bowlGfx, T = g.T;
  const canvas = document.createElement('canvas');
  canvas.className = 'bowl-canvas';
  canvas.setAttribute('aria-hidden', 'true');
  let renderer;
  try {
    renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { return false; }
  g.canvas = canvas;
  g.renderer = renderer;
  const small = Math.min(window.screen.width || 800, window.screen.height || 800) < 700;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  // The GPU took the context back (a phone short of memory): start the lane again from nothing.
  // Only for the canvas in use - disposing one loses its context on purpose, and that must not count.
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    if (bowlGfx.canvas !== canvas) return;
    bowlGfxDispose();
    setTimeout(() => { if (bowlGfxRetryFn && bowlGfx.st === 'off') bowlGfxRetryFn(); }, 400);
  }, false);

  const scene = new T.Scene();
  g.scene = scene;
  scene.background = new T.Color(0x0e0907);
  scene.fog = new T.Fog(0x0e0907, 22, 46);

  // Reflections: a warm hall of light strips, blurred into an environment map.
  const pmrem = new T.PMREMGenerator(renderer);
  const envScene = new T.Scene();
  envScene.background = new T.Color(0x1a110c);
  const lm = new T.MeshBasicMaterial({ color: 0xfff2dc });
  for (let i = -3; i <= 3; i++) { const m = new T.Mesh(new T.BoxGeometry(0.5, 0.1, 30), lm); m.position.set(i * 2.2, 5, -10); envScene.add(m); }
  envScene.add(new T.Mesh(new T.BoxGeometry(40, 8, 60), new T.MeshBasicMaterial({ color: 0x3a2618, side: T.BackSide })));
  const env = pmrem.fromScene(envScene, 0.035).texture;
  g.textures.push(env);
  envScene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  pmrem.dispose();
  scene.environment = env;

  const cam = new T.PerspectiveCamera(40, 1, 0.05, 90);
  g.cam = cam;

  scene.add(new T.HemisphereLight(0xfff1e0, 0x2a1a10, 0.75));
  const sun = new T.DirectionalLight(0xfff0dd, 1.35);
  sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -2.4, right: 2.4, top: 4.5, bottom: -4.5, near: 1, far: 30 });
  sun.shadow.bias = -0.0005;
  scene.add(sun); scene.add(sun.target);
  g.sun = sun;
  const deckLight = new T.SpotLight(0xffe7c2, 26, 12, 0.55, 0.6, 1.4);
  deckLight.position.set(0, 3.2, -16.6); deckLight.target.position.set(0, 0, -18.8);
  scene.add(deckLight); scene.add(deckLight.target);
  g.deckLight = deckLight;

  const L = BOWL.DECK_END;
  const woodMap = bowlTex(bowlWoodCanvas(false), 1, 9);
  const deckMap = bowlTex(bowlWoodCanvas(true), 1, 1);
  const laneMat = new T.MeshStandardMaterial({ map: woodMap, roughness: 0.16, metalness: 0, envMapIntensity: 1.1 });
  const deckMat = new T.MeshStandardMaterial({ map: deckMap, roughness: 0.2, metalness: 0 });
  const approachMat = new T.MeshStandardMaterial({ map: bowlTex(bowlWoodCanvas(true), 1, 2), roughness: 0.35 });
  // The gutter is seen from inside (DoubleSide): with only its outer face drawn, the camera looked through it
  // to the dark floor and the ball in it was half gone (the owner, 23 Sep 2026: "like a black pipe").
  const gutterMat = new T.MeshStandardMaterial({ color: 0x9aa1ab, roughness: 0.32, metalness: 0.75, side: T.DoubleSide });
  const capMat = new T.MeshStandardMaterial({ color: 0x3b2417, roughness: 0.5 });
  const markMat = new T.MeshStandardMaterial({ color: 0x5a2a12, roughness: 0.3 });
  const redMat = new T.MeshStandardMaterial({ color: 0xb3261e, roughness: 0.3 });
  const pitMat = new T.MeshStandardMaterial({ color: 0x050303, roughness: 1 });

  // The pin: a turned profile, white lacquer, two red bands at the neck.
  const prof = [[0, 0], [0.026, 0], [0.034, 0.008], [0.046, 0.04], [0.057, 0.08], [0.0605, 0.114], [0.058, 0.15], [0.05, 0.19], [0.037, 0.225], [0.026, 0.25], [0.0228, 0.268], [0.025, 0.29], [0.031, 0.315], [0.032, 0.335], [0.029, 0.355], [0.021, 0.372], [0.01, 0.379], [0, 0.381]];
  const pinGeo = new T.LatheGeometry(new T.SplineCurve(prof.map(([r, h]) => new T.Vector2(r, h))).getPoints(60), small ? 24 : 36);
  const pos = pinGeo.attributes.position, col = [];
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const red = (y > 0.243 && y < 0.257) || (y > 0.272 && y < 0.286);
    if (red) col.push(0.78, 0.06, 0.08); else col.push(0.96, 0.95, 0.93);
  }
  pinGeo.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  pinGeo.computeVertexNormals();
  const pinMat = new T.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.08 });
  g.pinGeo = pinGeo; g.pinMat = pinMat;

  const arrowGeo = new T.BufferGeometry();
  arrowGeo.setAttribute('position', new T.Float32BufferAttribute([0, 0, -0.09, -0.018, 0, 0.02, 0.018, 0, 0.02], 3));
  arrowGeo.computeVertexNormals();
  const dotGeo = new T.CircleGeometry(0.01, 12);
  const neighbourPins = [];

  const lane = (ox, withPins) => {
    const grp = new T.Group();
    const lp = new T.Mesh(new T.PlaneGeometry(BOWL.LANE_HALF * 2, 17.8), laneMat);
    lp.rotation.x = -Math.PI / 2; lp.position.set(0, 0, -8.9); lp.receiveShadow = true; grp.add(lp);
    const dp = new T.Mesh(new T.PlaneGeometry(BOWL.LANE_HALF * 2, L - 17.8), deckMat);
    dp.rotation.x = -Math.PI / 2; dp.position.set(0, 0.0005, -(17.8 + L) / 2); dp.receiveShadow = true; grp.add(dp);
    const ap = new T.Mesh(new T.PlaneGeometry(BOWL.LANE_HALF * 2 + BOWL.GUTTER * 2 + 0.3, 5.6), approachMat);
    ap.rotation.x = -Math.PI / 2; ap.position.set(0, 0, 2.8); ap.receiveShadow = true; grp.add(ap);
    const fl = new T.Mesh(new T.PlaneGeometry(BOWL.LANE_HALF * 2 + BOWL.GUTTER * 2 + 0.3, 0.025), redMat);
    fl.rotation.x = -Math.PI / 2; fl.position.set(0, 0.001, 0); grp.add(fl);
    [-1, 1].forEach(s => {
      // The lower half of a pipe: a channel below the lane, open at the top (the other half was a pipe lying on it).
      const gt = new T.Mesh(new T.CylinderGeometry(BOWL.GUTTER / 2, BOWL.GUTTER / 2, L, 20, 1, true, -Math.PI / 2, Math.PI), gutterMat);
      gt.rotation.x = Math.PI / 2; gt.rotation.z = Math.PI; gt.position.set(s * (BOWL.LANE_HALF + BOWL.GUTTER / 2), 0, -L / 2);
      gt.receiveShadow = true; grp.add(gt);
      const cap = new T.Mesh(new T.BoxGeometry(0.12, 0.05, L + 5.6), capMat);
      cap.position.set(s * (BOWL.LANE_HALF + BOWL.GUTTER + 0.06), 0.02, -L / 2 + 2.8); cap.receiveShadow = true; grp.add(cap);
      const kick = new T.Mesh(new T.BoxGeometry(0.06, 0.75, 2.2), capMat);
      kick.position.set(s * (BOWL.LANE_HALF + BOWL.GUTTER + 0.03), 0.37, -18.9); grp.add(kick);
    });
    for (let k = -3; k <= 3; k++) {
      const a = new T.Mesh(arrowGeo, markMat);
      a.position.set(k * 0.135, 0.0015, -(4.57 + Math.abs(k) * 0.3)); grp.add(a);
      const d = new T.Mesh(dotGeo, markMat);
      d.rotation.x = -Math.PI / 2; d.position.set(k * 0.135, 0.0015, -2.1); grp.add(d);
      const d2 = new T.Mesh(dotGeo, markMat);
      d2.rotation.x = -Math.PI / 2; d2.position.set(k * 0.135, 0.0015, 1.6); grp.add(d2);
    }
    const pit = new T.Mesh(new T.BoxGeometry(BOWL.LANE_HALF * 2 + BOWL.GUTTER * 2, 0.8, 1.2), pitMat);
    pit.position.set(0, -0.41, -L - 0.6); grp.add(pit);
    grp.position.x = ox;
    if (withPins) bowlPinSpots().forEach(([x, y]) => neighbourPins.push([ox + x, -y]));
    scene.add(grp);
  };
  lane(0, false);
  [-2, 2, -4, 4].forEach(ox => lane(ox, true));
  // The lanes beside ours stand ready: one draw for all their pins.
  const inst = new T.InstancedMesh(pinGeo, pinMat, neighbourPins.length);
  const m4 = new T.Matrix4();
  neighbourPins.forEach(([x, z], i) => { m4.makeTranslation(x, 0, z); inst.setMatrixAt(i, m4); });
  inst.instanceMatrix.needsUpdate = true;
  inst.castShadow = true;
  scene.add(inst);

  // The masking unit over the pins, the back of the pit, the floor and the ceiling.
  const maskMap = bowlTex(bowlMaskCanvas(), 5, 1);
  maskMap.offset.x = 0;
  const maskFace = new T.MeshBasicMaterial({ map: maskMap, toneMapped: false });
  const maskSide = new T.MeshStandardMaterial({ color: 0x160e0a, roughness: 0.8 });
  const mask = new T.Mesh(new T.BoxGeometry(10, 0.9, 0.3), [maskSide, maskSide, maskSide, maskSide, maskFace, maskSide]);
  mask.position.set(0, 1.12, -17.75); scene.add(mask);
  g.maskFace = maskFace;
  const curtain = new T.Mesh(new T.PlaneGeometry(12, 2.4), new T.MeshStandardMaterial({ color: 0x07050a, roughness: 1 }));
  curtain.position.set(0, 1.0, -20.3); scene.add(curtain);
  const floor = new T.Mesh(new T.PlaneGeometry(40, 60), new T.MeshStandardMaterial({ color: 0x1d130e, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, -0.12, -12); floor.receiveShadow = true; scene.add(floor);
  const ceil = new T.Mesh(new T.PlaneGeometry(14, 42), new T.MeshStandardMaterial({ color: 0x1b120d, roughness: 0.9 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 3.1, -9); scene.add(ceil);
  const stripMat = new T.MeshBasicMaterial({ color: 0xffe2b0, toneMapped: false });
  const stripGeo = new T.PlaneGeometry(0.9, 0.12);
  for (let z = 3; z > -19; z -= 3.2) for (const x of [-3, -1, 1, 3]) {
    const l = new T.Mesh(stripGeo, stripMat); l.rotation.x = Math.PI / 2; l.position.set(x, 3.09, z); scene.add(l);
  }
  // The screens over the lanes: our lane's shows the pins really standing.
  const [sc, sg] = bowlCanvas2d(512, 256);
  bowlScreenDraw(sg, Array(10).fill(true));
  const screenStatic = bowlTex(sc, 1, 1);
  const [mc, mg] = bowlCanvas2d(512, 256);
  bowlScreenDraw(mg, Array(10).fill(true));
  const screenMine = bowlTex(mc, 1, 1);
  g.screen = { g: mg, tex: screenMine, key: '' };
  const boxMat = new T.MeshStandardMaterial({ color: 0x0c0806 });
  const scrGeo = new T.PlaneGeometry(1.2, 0.6), boxGeo = new T.BoxGeometry(1.3, 0.7, 0.12);
  [-4, -2, 0, 2, 4].forEach(x => {
    const scr = new T.Mesh(scrGeo, new T.MeshBasicMaterial({ map: x === 0 ? screenMine : screenStatic, toneMapped: false }));
    scr.position.set(x, 2.25, -5.2); scr.rotation.x = 0.12; scene.add(scr);
    const box = new T.Mesh(boxGeo, boxMat);
    box.position.set(x, 2.25, -5.27); box.rotation.x = 0.12; scene.add(box);
  });

  // The ball return between our lane and the next: a hood, two rails and two house balls waiting.
  // A low glossy dome with a dark mouth, well to the side, so it frames the approach rather than blocking it.
  const retMat = new T.MeshPhysicalMaterial({ color: 0x3b2a6b, roughness: 0.25, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.1 });
  const hood = new T.Mesh(new T.SphereGeometry(0.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), retMat);
  hood.scale.set(0.8, 0.7, 1.15);
  hood.position.set(1.02, 0, 0.35); hood.castShadow = true; scene.add(hood);
  const mouth = new T.Mesh(new T.CircleGeometry(0.11, 24, 0, Math.PI), new T.MeshBasicMaterial({ color: 0x050308 }));
  mouth.position.set(1.02, 0.002, 0.58); scene.add(mouth);
  const railMat = new T.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.25, metalness: 0.9 });
  [-0.07, 0.07].forEach(dx => {
    const rail = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 1.1, 8), railMat);
    rail.rotation.x = Math.PI / 2; rail.position.set(1.02 + dx, 0.09, 1.15); scene.add(rail);
  });
  const houseMat = (hex) => new T.MeshPhysicalMaterial({ color: hex, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.06 });
  [[0x0f766e, 1.35], [0xd97706, 1.6]].forEach(([hex, z]) => {
    const b = new T.Mesh(new T.SphereGeometry(BOWL.BALL_R, 32, 20), houseMat(hex));
    b.position.set(1.02, 0.09 + BOWL.BALL_R * 0.55, z); b.castShadow = true; scene.add(b);
  });

  // The pinsetter: a deck that comes down behind the masking unit, and the sweep bar in front of it.
  const setterMat = new T.MeshStandardMaterial({ color: 0x3a3f47, roughness: 0.45, metalness: 0.7 });
  const setter = new T.Mesh(new T.BoxGeometry(1.2, 0.05, 1.25), setterMat);
  setter.position.set(0, 1.3, -18.7); setter.castShadow = true; scene.add(setter);
  const sweep = new T.Group();
  const barMat = new T.MeshStandardMaterial({ color: 0x23262c, roughness: 0.5, metalness: 0.6 });
  const bar = new T.Mesh(new T.BoxGeometry(1.5, 0.24, 0.04), barMat);
  bar.position.y = 0.12; bar.castShadow = true; sweep.add(bar);
  const stripe = new T.Mesh(new T.BoxGeometry(1.5, 0.03, 0.045), new T.MeshBasicMaterial({ color: 0xffb347, toneMapped: false }));
  stripe.position.y = 0.2; sweep.add(stripe);
  sweep.position.set(0, 0.9, -(BOWL.HEAD_Y - 0.42));
  scene.add(sweep);
  g.setter = setter; g.sweep = sweep;

  // Blob shadows under the pins: the sun covers the lane near the camera, and a pin
  // seen from the foul line would otherwise float.
  const blobTex = bowlTex(bowlBlobCanvas(), 1, 1, false);
  const blobGeo = new T.PlaneGeometry(0.2, 0.2);

  // The ten pins in play, and the ball.
  g.pins = bowlPinSpots().map(() => {
    const grp = new T.Group();
    const m = new T.Mesh(pinGeo, pinMat); m.castShadow = true; m.receiveShadow = true;
    grp.add(m); scene.add(grp);
    const blob = new T.Mesh(blobGeo, new T.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
    blob.rotation.x = -Math.PI / 2; scene.add(blob);
    return { grp, blob };
  });
  const ballMat = new T.MeshPhysicalMaterial({ map: bowlTex(bowlBallCanvas(), 1, 1), roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.3 });
  const ball = new T.Mesh(new T.SphereGeometry(BOWL.BALL_R, 48, 32), ballMat);
  ball.castShadow = true; scene.add(ball);
  g.ball = ball;
  g.guideMat = new T.MeshBasicMaterial({ color: 0xfff4dc, transparent: true, opacity: 0.7, depthWrite: false, toneMapped: false });
  g.guide = null;
  g.v = { up: new T.Vector3(0, 1, 0), a: new T.Vector3(), b: new T.Vector3(), q: new T.Quaternion(), ray: new T.Raycaster(), ndc: new T.Vector2(), plane: new T.Plane(new T.Vector3(0, 1, 0), 0) };
  g.camNow = { x: 0, y: 1.1, z: 4.2, lx: 0, ly: 0.15, lz: -10 };
  return true;
}

/* --- the camera --------------------------------------------------------------------- */

const BOWL_CAM_AIM = { x: 0, y: 1.05, z: 4.6, lx: 0, ly: -0.85, lz: -10 };
const BOWL_CAM_PINS = { x: 0, y: 0.9, z: -13.1, lx: 0, ly: 0.14, lz: -19.0 };

function bowlCamFit() {
  const g = bowlGfx;
  if (!g.cam || !g.host) return;
  const r = g.host.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  g.renderer.setSize(w, h, false);
  g.cam.aspect = w / h;
  // Tall screens see down a long lane; a wide one sees the lanes beside it too.
  g.cam.fov = w / h < 0.8 ? 36 : w / h < 1.3 ? 33 : 28;
  g.cam.updateProjectionMatrix();
  bowlGfxKick();
}

function bowlCamApply(p) {
  const g = bowlGfx;
  Object.assign(g.camNow, p);
  g.cam.position.set(p.x, p.y, p.z);
  g.cam.lookAt(p.lx, p.ly, p.lz);
  g.sun.position.set(1.5, 9, p.z - 3);
  g.sun.target.position.set(0, 0, p.z - 6);
}

/** Where the camera wants to be: behind the ball while it rolls, on the pins once it gets there. */
function bowlCamWant() {
  const g = bowlGfx;
  if (g.mode === 'roll' && g.sim) {
    const b = g.sim.ball;
    const by = b.gone ? BOWL.PIT_Y : b.y;
    const z = Math.max(BOWL_CAM_AIM.z - by * 1.02, BOWL_CAM_PINS.z);
    return { x: 0, y: by > 11 ? BOWL_CAM_PINS.y : BOWL_CAM_AIM.y - (BOWL_CAM_AIM.y - BOWL_CAM_PINS.y) * by / 11, z: z, lx: 0, ly: 0.12, lz: Math.max(-by - 8, BOWL_CAM_PINS.lz) };
  }
  if (g.mode === 'settle' || g.mode === 'set') return BOWL_CAM_PINS;
  return BOWL_CAM_AIM;
}

/* --- mounting, the loop, disposing --------------------------------------------------- */

/** The message over the lane when it can't be drawn: no WebGL, or three.js couldn't load (offline, the first time). */
function bowlGfxMessage(stage, why) {
  const box = stage && stage.querySelector('[data-bowl-msg]');
  if (!box) return;
  if (!why) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = why === 'loading'
    ? `<div class="bowl-msg__spin" aria-hidden="true">🎳</div><p>${escapeHTML(bowlT('bowl_loading'))}</p>`
    : `<div class="bowl-msg__icon" aria-hidden="true">🎳</div><p>${escapeHTML(bowlT(why === 'offline' ? 'bowl_offline' : 'bowl_no3d'))}</p>` +
      (why === 'offline' ? `<button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="bowlGfxRetry()">${escapeHTML(bowlT('bowl_retry'))}</button>` : '');
}

let bowlGfxRetryFn = null;
function bowlGfxRetry() { bowlGfx.st = 'off'; if (bowlGfxRetryFn) bowlGfxRetryFn(); }

/**
 * Puts the lane into `stage` (its [data-bowl-canvas] box): made the first time, moved
 * afterwards. Resolves true once it can be drawn, false when it can't (a message is shown).
 */
function bowlGfxMount(stage, retry) {
  const g = bowlGfx;
  bowlGfxRetryFn = retry || null;
  const host = stage && stage.querySelector('[data-bowl-canvas]');
  if (!host) return Promise.resolve(false);
  if (g.st === 'failed') { bowlGfxMessage(stage, g.why); return Promise.resolve(false); }
  if (typeof threeCanDraw !== 'function' || !threeCanDraw()) { g.st = 'failed'; g.why = 'no3d'; bowlGfxMessage(stage, 'no3d'); return Promise.resolve(false); }
  const place = () => {
    if (g.canvas.parentNode !== host) host.appendChild(g.canvas);
    if (g.host !== host) {
      g.host = host;
      if (g.ro) g.ro.disconnect();
      g.ro = new ResizeObserver(() => bowlCamFit());
      g.ro.observe(host);
    }
    bowlGfxMessage(stage, '');
    bowlCamFit();
    return true;
  };
  if (g.st === 'ready') return Promise.resolve(place());
  if (!g.ready) {
    g.st = 'loading';
    g.ready = loadThree().then(T => {
      g.T = T;
      if (!bowlGfxBuild()) { g.st = 'failed'; g.why = 'no3d'; return false; }
      g.st = 'ready';
      bowlCamApply(BOWL_CAM_AIM);
      return true;
    }).catch(() => { g.st = 'failed'; g.why = 'offline'; return false; })
      .then(ok => { g.ready = null; return ok; });
  }
  bowlGfxMessage(stage, 'loading');
  return g.ready.then(ok => {
    if (!ok) { bowlGfxMessage(stage, g.why); return false; }
    // The screen may have closed while three.js loaded.
    if (!stage.isConnected) return false;
    return place();
  });
}

function bowlGfxKick() {
  const g = bowlGfx;
  if (g.raf || !g.renderer) return;
  g.last = performance.now();
  g.raf = requestAnimationFrame(bowlGfxFrame);
}

function bowlGfxBusy() {
  const g = bowlGfx;
  if (g.mode !== 'idle' || g.input.trail) return true;
  const c = g.camNow, w = BOWL_CAM_AIM;
  return Math.abs(c.z - w.z) + Math.abs(c.y - w.y) + Math.abs(c.lz - w.lz) > 0.002 || g.pulse > 0.01;
}

function bowlGfxFrame(now) {
  const g = bowlGfx;
  g.raf = 0;
  if (!g.renderer || !g.host) return;
  let dt = Math.min(0.1, Math.max(0, (now - g.last) / 1000));
  g.last = now;
  // A tab that was away: the ball does not wait for it (a replay catches up at once).
  if (now - g.last > 1500) dt = 0.1;
  bowlGfxUpdate(dt);
  g.renderer.render(g.scene, g.cam);
  if (bowlGfxBusy()) g.raf = requestAnimationFrame(bowlGfxFrame);
}

/** Everything goes: the GPU's memory, the canvas, the loop. A bowling screen makes it again. */
function bowlGfxDispose() {
  const g = bowlGfx;
  g.gen++;
  if (g.raf) cancelAnimationFrame(g.raf);
  g.raf = 0;
  if (g.ro) g.ro.disconnect();
  g.ro = null;
  bowlRumbleStop();
  if (g.scene) {
    g.scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      mats.forEach(m => m.dispose());
    });
  }
  g.textures.forEach(x => x.dispose());
  g.textures = [];
  const renderer = g.renderer, canvas = g.canvas;
  // Forget the canvas first, so the context loss this causes isn't taken for the GPU's.
  g.canvas = null;
  if (renderer) {
    try { renderer.dispose(); renderer.forceContextLoss(); } catch (e) {}
  }
  if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
  Object.assign(g, { renderer: null, canvas: null, scene: null, cam: null, host: null, pins: null, ball: null, guide: null, sim: null, set: null, mode: 'idle', onSettled: null });
  g.input = { on: false, onShot: null, guide: false, trail: null, guideAt: 0 };
  if (g.st === 'ready') g.st = 'off';
}

/* --- drawing the pins and the ball ---------------------------------------------------- */

function bowlPinPose(i, x, y, z, tilt, dx, dy) {
  const g = bowlGfx, T = g.T, v = g.v;
  const pin = g.pins[i];
  pin.grp.visible = true;
  pin.grp.position.set(x, y, z);
  if (tilt) {
    v.a.set(dx, 0, -dy).normalize();
    v.b.crossVectors(v.up, v.a).normalize();
    pin.grp.quaternion.setFromAxisAngle(v.b, tilt);
  } else pin.grp.quaternion.identity();
  pin.blob.visible = y < 0.25;
  pin.blob.position.set(x + (tilt ? dx * 0.12 * Math.sin(tilt) : 0), 0.002, z - (tilt ? dy * 0.12 * Math.sin(tilt) : 0));
  const sc = tilt > 0.8 ? 1.9 : 1;
  pin.blob.scale.set(sc, 1, 1);
  pin.blob.material.opacity = Math.max(0, 1 - y * 5);
}

function bowlHidePin(i) { const p = bowlGfx.pins[i]; p.grp.visible = false; p.blob.visible = false; }

/** The rack as it stands, the ball at the foul line: the lane ready for a throw. */
function bowlGfxRack(standing, opts) {
  const g = bowlGfx;
  if (g.st !== 'ready') return;
  const o = opts || {};
  g.gen++;
  g.mode = 'idle';
  g.sim = null; g.set = null; g.onSettled = null;
  bowlRumbleStop();
  bowlPlacePins(standing);
  g.aimX = 0;
  bowlPlaceBall(0);
  bowlClearGuide();
  bowlScreenPins(standing);
  if (o.snap || motionOff()) bowlCamApply(BOWL_CAM_AIM);
  bowlGfxKick();
}

function bowlPlacePins(standing) {
  bowlPinSpots().forEach(([x, y], i) => {
    if (standing[i]) bowlPinPose(i, x, 0, -y, 0, 0, 1); else bowlHidePin(i);
  });
}

function bowlPlaceBall(x) {
  const g = bowlGfx;
  g.ball.visible = true;
  g.ball.position.set(x, BOWL.BALL_R, -BOWL.START_Y);
}

function bowlScreenPins(standing) {
  const g = bowlGfx;
  const key = standing.map(b => (b ? 1 : 0)).join('');
  if (!g.screen || g.screen.key === key) return;
  g.screen.key = key;
  bowlScreenDraw(g.screen.g, standing);
  g.screen.tex.needsUpdate = true;
}

/** One frame of a throw: the ball rolling, the pins as the rules have them, a hop for a hard hit. */
function bowlDrawSim(sim, dt) {
  const g = bowlGfx, v = g.v;
  const b = sim.ball;
  g.ball.visible = !b.gone || g.ball.position.y > -0.3;
  if (b.gone) {
    g.ball.position.y -= dt * 2.2;
  } else {
    // In the gutter the ball rests on its floor (the half-pipe's lowest line), its top above the lane.
    g.ball.position.set(b.x, b.gutter ? BOWL.BALL_R - BOWL.GUTTER / 2 + 0.004 : BOWL.BALL_R, -b.y);
    // Your own ball leaves from where your hand let it go, and reaches the line in the first moment.
    const rel = g.release;
    if (rel && sim.t < BOWL_RELEASE_S) {
      const k = bowlEase(sim.t / BOWL_RELEASE_S);
      g.ball.position.x = rel.x + (b.x - rel.x) * k;
      g.ball.position.z = -(rel.y + (b.y - rel.y) * k);
    }
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > 0.01) {
      v.a.set(b.vx, 0, -b.vy).normalize().cross(v.up).negate();
      v.q.setFromAxisAngle(v.a, sp * dt / BOWL.BALL_R);
      g.ball.quaternion.premultiply(v.q);
    }
  }
  sim.pins.forEach((p, i) => {
    if (p.state === 3) { bowlHidePin(i); return; }
    if (p.gone) {
      // Into the pit: it drops out of sight rather than vanishing.
      const pin = g.pins[i];
      if (!g.gone[i]) g.gone[i] = sim.t;
      const k = sim.t - g.gone[i];
      if (k > 0.5) { bowlHidePin(i); return; }
      pin.grp.position.y -= dt * 1.6;
      pin.grp.position.z -= dt * 0.8;
      pin.blob.visible = false;
      return;
    }
    let tilt = p.tilt;
    if (p.state === 0 && p.wob > 0) tilt = p.wob * Math.sin(p.wobT * 22);
    let lift = p.state === 2 ? 0.052 : Math.sin(Math.max(0, tilt)) * 0.03;
    if (p.hopAt >= 0) {
      const k = sim.t - p.hopAt;
      const h = p.hopV * k - 4.9 * k * k;
      if (h > 0) lift += h;
    }
    bowlPinPose(i, p.x, lift, -p.y, tilt, p.dx, p.dy);
  });
}

/* --- a throw ---------------------------------------------------------------------------- */

/**
 * Plays one ball from the pins up before it: resolves with the finished sim once the pins
 * have settled, or null if the lane was taken for something else meanwhile.
 */
function bowlGfxThrow(standing, shot) {
  const g = bowlGfx;
  return new Promise(resolve => {
    if (g.st !== 'ready') { resolve(null); return; }
    g.gen++;
    const gen = g.gen;
    bowlClearGuide();
    g.input.trail = null;
    g.gone = [];
    g.sim = bowlStart(standing, shot);
    // Where the hand let go (a swing ends behind the line); a replay of someone else's ball starts on the line.
    g.release = g.input.release && g.input.release.at > performance.now() - 1500 ? g.input.release : null;
    g.input.release = null;
    g.acc = 0;
    g.mode = 'roll';
    g.heard = { knocks: 0, clacks: 0, hit: false };
    bowlPlacePins(standing);
    if (g.release) { g.ball.visible = true; g.ball.position.set(g.release.x, BOWL.BALL_R, -g.release.y); }
    else bowlPlaceBall(g.sim.ball.x);
    g.onSettled = (sim) => { if (gen === g.gen) resolve(sim); else resolve(null); };
    g.cancel = () => resolve(null);
    if (g.loud) bowlRumbleStart();
    // A page that isn't showing can't animate: the throw is played out at once.
    if (document.hidden) { while (!g.sim.done) bowlStep(g.sim); }
    bowlGfxKick();
  });
}

/** A new throw or screen: whatever was playing is let go. */
function bowlGfxCancel() {
  const g = bowlGfx;
  g.gen++;
  const c = g.cancel;
  g.cancel = null;
  if (c) c();
  g.mode = 'idle';
  g.sim = null; g.set = null; g.onSettled = null;
  bowlRumbleStop();
}

/**
 * After the pins have settled: a moment on them (`hold` ms), the pinsetter lifts what
 * stands, sweeps what fell into the pit, sets `next` down (a fresh rack or the pins that
 * were left), and the camera comes back to the foul line with the ball from the return.
 * Resolves true when the lane is ready for the next ball.
 */
function bowlGfxSet(next, opts) {
  const g = bowlGfx;
  const o = opts || {};
  return new Promise(resolve => {
    if (g.st !== 'ready' || !g.sim) { if (g.st === 'ready') bowlGfxRack(next, { snap: true }); resolve(g.st === 'ready'); return; }
    const gen = g.gen;
    const sim = g.sim;
    // What each pin is at the start: standing (lifted and set again), down (swept), or not there.
    const snap = sim.pins.map((p, i) => {
      const pin = g.pins[i];
      const kind = p.state === 3 || p.gone ? 'none' : p.state === 0 ? 'up' : 'down';
      return { kind, x: pin.grp.position.x, y: pin.grp.position.y, z: pin.grp.position.z, q: pin.grp.quaternion.clone() };
    });
    const carry = snap.some(s => s.kind === 'up') && !o.fresh;
    const quick = motionOff() || document.hidden;
    g.cancel = () => resolve(false);
    g.set = { t: -(o.hold || 0) / 1000, snap, next: next.slice(), fresh: !!o.fresh, carry, quick,
      done: () => { if (gen === g.gen) { g.cancel = null; resolve(true); } else resolve(false); } };
    g.mode = 'set';
    bowlRumbleStop();
    bowlGfxKick();
  });
}

const BOWL_SET_T = { barDown: [0, 0.3], tableDown: [0.15, 0.5], tableUp: [0.55, 0.9], sweep: [0.9, 1.6], barUp: [1.6, 1.85], lower: [1.8, 2.15], rise: [2.15, 2.4], back: [2.45, 3.4] };

function bowlSetFrame(dt) {
  const g = bowlGfx, st = g.set, T = BOWL_SET_T;
  st.t += dt;
  const t = st.t;
  if (t < 0) return;
  if (!st.sound && t >= 0) { st.sound = true; if (g.loud) bowlSound('sweep'); }
  if (st.quick) st.t = T.back[1];
  const spots = bowlPinSpots();
  // The ball went into the pit; it comes back up the return later.
  if (t < T.back[0]) g.ball.visible = false;
  const TABLE_REST = 1.3, TABLE_LOW = 0.4;
  const frontZ = -(BOWL.HEAD_Y - 0.42), backZ = -(BOWL.PIT_Y + 0.15);
  // The sweep bar: down, back to the pit, up.
  const barY = 0.9 - 0.9 * bowlSeg(t, T.barDown[0], T.barDown[1]) + 0.9 * bowlSeg(t, T.barUp[0], T.barUp[1]);
  const barZ = frontZ + (backZ - frontZ) * bowlSeg(t, T.sweep[0], T.sweep[1]);
  g.sweep.position.set(0, barY, t >= T.barUp[1] ? frontZ : barZ);
  // The setter's deck: down for the pins still standing, up with them, down with the rack.
  let tableY = TABLE_REST;
  if (st.carry && t < T.lower[0]) tableY = TABLE_REST - (TABLE_REST - TABLE_LOW) * bowlSeg(t, T.tableDown[0], T.tableDown[1]) + (TABLE_REST - TABLE_LOW) * bowlSeg(t, T.tableUp[0], T.tableUp[1]);
  if (t >= T.lower[0]) tableY = TABLE_REST - (TABLE_REST - TABLE_LOW) * bowlSeg(t, T.lower[0], T.lower[1]) + (TABLE_REST - TABLE_LOW) * bowlSeg(t, T.rise[0], T.rise[1]);
  g.setter.position.y = tableY;
  const lifted = tableY - TABLE_LOW;
  st.snap.forEach((s, i) => {
    const pin = g.pins[i];
    const [sx, sy] = spots[i];
    if (t >= T.lower[0]) {
      // The rack going down: a fresh one, or the pins that were standing, back on their spots.
      if (!st.next[i]) { bowlHidePin(i); return; }
      const y = t >= T.lower[1] ? 0 : lifted;
      bowlPinPose(i, sx, y, -sy, 0, 0, 1);
      pin.blob.material.opacity = t >= T.lower[1] ? 1 : Math.max(0, 1 - y * 4);
      return;
    }
    if (s.kind === 'up') {
      if (!st.carry) { bowlHidePin(i); return; }
      const up = t >= T.tableDown[1] ? lifted : 0;
      const k = bowlSeg(t, T.tableUp[1], T.sweep[1]);
      bowlPinPose(i, s.x + (sx - s.x) * k, up, s.z + (-sy - s.z) * k, 0, 0, 1);
      return;
    }
    if (s.kind === 'down') {
      // Swept back by the bar, and over the edge into the pit.
      const z = Math.min(s.z, barZ - 0.1);
      if (z < -(BOWL.PIT_Y + 0.05) || t > T.sweep[1]) { bowlHidePin(i); return; }
      pin.grp.visible = true;
      pin.grp.position.set(s.x, s.y, z);
      pin.grp.quaternion.copy(s.q);
      pin.blob.visible = s.y < 0.2;
      pin.blob.position.set(pin.blob.position.x, 0.002, z);
      return;
    }
    bowlHidePin(i);
  });
  if (t >= T.lower[0] && !st.screen) { st.screen = true; bowlScreenPins(st.next); }
  // The ball comes back up the return and rolls to the foul line as the camera comes home.
  if (t >= T.back[0]) {
    const k = bowlSeg(t, T.back[0], T.back[1]);
    if (!st.ret) { st.ret = true; if (g.loud) bowlSound('return'); }
    const bx = 1.02 + (0 - 1.02) * k;
    const bz = 0.55 + (-BOWL.START_Y - 0.55) * k;
    g.ball.visible = true;
    g.ball.position.set(bx, BOWL.BALL_R, bz);
    g.v.q.setFromAxisAngle(g.v.a.set(0, 0, 1), -dt * 9);
    g.ball.quaternion.premultiply(g.v.q);
    const c = BOWL_CAM_PINS, a = BOWL_CAM_AIM, e = st.quick ? 1 : k;
    bowlCamApply({ x: 0, y: c.y + (a.y - c.y) * e, z: c.z + (a.z - c.z) * e, lx: 0, ly: c.ly + (a.ly - c.ly) * e, lz: c.lz + (a.lz - c.lz) * e });
  }
  if (t >= T.back[1]) {
    g.set = null;
    g.sim = null;
    g.mode = 'idle';
    g.aimX = 0;
    bowlPlaceBall(0);
    bowlCamApply(BOWL_CAM_AIM);
    st.done();
  }
}

function bowlGfxUpdate(dt) {
  const g = bowlGfx;
  if (g.mode === 'roll' && g.sim) {
    g.acc += dt;
    let n = 0;
    while (g.acc >= BOWL.DT && !g.sim.done && n < 60) { bowlStep(g.sim); g.acc -= BOWL.DT; n++; }
    if (n >= 60) g.acc = 0;
    bowlDrawSim(g.sim, dt);
    bowlGfxHear(g.sim);
    if (g.sim.done) {
      g.mode = 'settle';
      bowlRumbleStop();
      const fn = g.onSettled;
      g.onSettled = null;
      g.cancel = null;
      if (fn) fn(g.sim);
    }
  } else if (g.mode === 'settle' && g.sim) {
    bowlDrawSim(g.sim, dt);
  } else if (g.mode === 'set' && g.set) {
    bowlSetFrame(dt);
  }
  if (g.mode !== 'set' || !g.set || g.set.t < BOWL_SET_T.back[0]) {
    // Ease toward where the camera wants to be (a cut under reduced motion).
    const want = bowlCamWant(), c = g.camNow;
    const k = reducedMotion() ? 1 : 1 - Math.exp(-dt * (g.mode === 'roll' ? 5 : 3.2));
    bowlCamApply({ x: 0, y: c.y + (want.y - c.y) * k, z: c.z + (want.z - c.z) * k, lx: 0, ly: c.ly + (want.ly - c.ly) * k, lz: c.lz + (want.lz - c.lz) * k });
  }
  if (g.pulse > 0.01) {
    g.pulse *= Math.exp(-dt * 2.2);
    g.deckLight.intensity = 26 + g.pulse * 60;
    g.maskFace.color.setScalar(1 + g.pulse * 0.8);
  } else if (g.pulse) {
    g.pulse = 0; g.deckLight.intensity = 26; g.maskFace.color.setScalar(1);
  }
}

/** A strike: the deck lights flare and the masking unit glows. */
function bowlGfxPulse() { bowlGfx.pulse = 1; bowlGfxKick(); }

/* --- the swipe ---------------------------------------------------------------------------- */

function bowlGfxInput(on, onShot, guide) {
  const g = bowlGfx;
  g.input.on = !!on;
  g.input.onShot = on ? onShot : null;
  g.input.guide = !!guide;
  if (!on) { g.input.trail = null; bowlClearGuide(); }
  if (g.canvas) {
    g.canvas.classList.toggle('is-live', !!on);
    if (!g.canvas._bowlWired) {
      g.canvas._bowlWired = true;
      g.canvas.addEventListener('pointerdown', bowlPointerDown);
      g.canvas.addEventListener('pointermove', bowlPointerMove);
      g.canvas.addEventListener('pointerup', bowlPointerUp);
      g.canvas.addEventListener('pointercancel', bowlPointerCancel);
    }
  }
}

/** Where on the foul line a finger at clientX lets go of the ball, in cm (-40..40). */
function bowlLaneXAt(clientX) {
  const g = bowlGfx, T = g.T;
  const r = g.canvas.getBoundingClientRect();
  const a = new T.Vector3(-BOWL.LANE_HALF, BOWL.BALL_R, -BOWL.START_Y).project(g.cam);
  const b = new T.Vector3(BOWL.LANE_HALF, BOWL.BALL_R, -BOWL.START_Y).project(g.cam);
  const ax = (a.x + 1) / 2 * r.width, bx = (b.x + 1) / 2 * r.width;
  const u = ((clientX - r.left) - ax) / (bx - ax);
  return Math.max(-40, Math.min(40, Math.round((u * 2 - 1) * BOWL.LANE_HALF * 100)));
}

/** A point on the screen, where it lies on the lane (or null above the horizon). */
function bowlLaneAt(clientX, clientY) {
  const g = bowlGfx, v = g.v;
  const r = g.canvas.getBoundingClientRect();
  v.ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  v.ray.setFromCamera(v.ndc, g.cam);
  const hit = v.ray.ray.intersectPlane(v.plane, v.b);
  if (!hit || hit.z > g.cam.position.z) return null;
  return { x: hit.x, y: -hit.z };
}

/*
 * The swing (the owner, 23 Sep 2026: "move it from back to front, like in Plato and in real
 * life - it affects the speed too, like I'm swinging it"). Touch the ball and it follows the
 * finger on the approach: pull it back towards you (the backswing), then push it forward and
 * let go. The forward push is the throw - its speed is the ball's speed, and a longer
 * backswing adds up to half again, the way a bigger swing does. The line is the backswing's:
 * a pendulum comes forward the way it went back, so the line is set while you pull back (read
 * on the lane itself, perspective and all, fitted through every point of the pull rather than
 * two of them) and a thumb's natural arc on the way forward doesn't swing it. A throw with no
 * backswing, a flick from the line, goes the way the flick went. A bow in the push hooks. The
 * ball leaves your hand on that line and crosses the foul line where the line does, so the
 * aim guide (the owner, 23 Sep 2026: "the line is moved when I swing") shows exactly the ball
 * you are about to throw, and stays still while your finger does.
 */
const BOWL_BACK_MAX = 1.6;        // metres behind the foul line the ball can be pulled back
const BOWL_RELEASE_S = 0.16;      // your ball reaches the line from your hand in this long
const BOWL_BALL_X_MAX = 0.40;     // how far across the approach the ball can be carried
const BOWL_PULL_MIN = 0.2;        // metres of backswing that set the line
const BOWL_HOOK_DEAD = 0.03;      // a bow smaller than this (of the push's length) is a straight ball
const BOWL_HOOK_K = 520;          // spin per bow

/** Where the finger is on the approach, as the ball's place: x across, y along (negative behind the line). */
function bowlSwingSpot(clientX, clientY) {
  const hit = bowlLaneAt(clientX, clientY);
  if (!hit) return null;
  return {
    x: Math.max(-BOWL_BALL_X_MAX, Math.min(BOWL_BALL_X_MAX, hit.x)),
    y: Math.max(-BOWL_BACK_MAX, Math.min(BOWL.START_Y, hit.y))
  };
}

/** A line through points on the lane, x as a function of y: the slope dx/dy, least squares. */
function bowlFitSlope(pts) {
  if (pts.length < 2) return null;
  let my = 0, mx = 0;
  pts.forEach(p => { my += p.ly; mx += p.lx; });
  my /= pts.length; mx /= pts.length;
  let syy = 0, sxy = 0;
  pts.forEach(p => { syy += (p.ly - my) * (p.ly - my); sxy += (p.ly - my) * (p.lx - mx); });
  if (syy < 1e-4) return null;
  return sxy / syy;
}

/**
 * The four numbers of a throw from a swing, without the page: `pts` is the finger's path, each
 * { sx, sy, t, lx, ly } (on the screen in px, the time in ms, and on the lane in metres; lx/ly
 * null above the horizon), `ball` where the ball is now, `screenH` the lane's height on the
 * screen. `final` is the release, which needs a real push forward; while swinging there is
 * always an answer, for the aim guide. Returns { shot, slope } or null.
 */
function bowlSwingShot(pts, ball, screenH, final) {
  const lane = pts.filter(p => p.ly !== null && p.ly !== undefined && p.ly < BOWL.START_Y + 3);
  if (!lane.length || !ball) return null;
  // The farthest point back on the lane: where the forward push starts.
  let kb = 0;
  for (let i = 1; i < lane.length; i++) if (lane[i].ly <= lane[kb].ly) kb = i;
  const back = lane[kb], z = lane[lane.length - 1];
  const pushLen = z.ly - back.ly;
  const push = lane.slice(kb);
  // The backswing: the steady pull back that ended there (a sideways move to line the ball up
  // first is not part of it), fitted without its top, where the finger was still turning.
  let s = kb, top = back.ly;
  while (s > 0 && lane[s - 1].ly >= top - 0.03) { s--; top = Math.max(top, lane[s].ly); }
  const range = top - back.ly;
  const pull = lane.slice(s, kb + 1).filter(q => q.ly <= back.ly + 0.85 * range);
  // The line: the backswing's when there was one (a pendulum comes forward the way it went
  // back); a throw straight from the line has only its push to go by.
  let slope = 0;
  if (range >= BOWL_PULL_MIN) slope = bowlFitSlope(pull) || 0;
  else if (push.length >= 3 && pushLen >= 0.3) slope = bowlFitSlope(push) || 0;
  slope = Math.max(-0.11, Math.min(0.11, slope));
  const aim = Math.max(-110, Math.min(110, Math.round(1000 * slope / Math.sqrt(1 + slope * slope))));

  // The speed: the push's last 120ms, in screens a second (on the screen, where a flick is a flick).
  const end = pts[pts.length - 1];
  let k = pts.length - 1;
  while (k > 0 && end.t - pts[k].t < 120 && pts[k - 1].t >= back.t) k--;
  const p = pts[k], dtm = Math.max(16, end.t - p.t);
  const rel = Math.max(0, (p.sy - end.sy) / dtm * 1000 / screenH);
  // The backswing: how far the ball was pulled back from where it was picked up, up to a sixth of the screen.
  const swing = Math.max(0, Math.min(1, (back.sy - pts[0].sy) / (screenH * 0.16)));
  if (final && (back.sy - end.sy < 30 || pushLen < 0.05)) return null;
  const base = rel > 0.05 ? 400 + (rel - 0.5) / 3 * 600 : 650;
  const speed = Math.round(Math.max(380, Math.min(1000, 380 + (base - 380) * (0.75 + 0.5 * swing))));

  // The hook: the push's bow off its own line, as a share of its length - on the screen, where
  // the thumb draws it (on the lane, perspective would flatten the far half). Middle to the left
  // hooks right.
  let spin = 0;
  const sp = pts.filter(q => q.t >= back.t);
  if (sp.length >= 4 && pushLen > 0.2) {
    const a0 = sp[0], a1 = sp[sp.length - 1];
    const cx = a1.sx - a0.sx, cy = a0.sy - a1.sy, len = Math.sqrt(cx * cx + cy * cy);
    if (len > 40) {
      let sum = 0;
      sp.forEach(q => { sum += (cx * (a0.sy - q.sy) - cy * (q.sx - a0.sx)) / len; });
      const bow = 1.5 * sum / sp.length / len;
      const over = Math.abs(bow) - BOWL_HOOK_DEAD;
      if (over > 0) spin = Math.round(Math.max(-100, Math.min(100, Math.sign(bow) * over * BOWL_HOOK_K)));
    }
  }
  // The ball goes on along the line from where it is to the foul line: that is where it is released.
  const x = Math.round((ball.x + slope * (BOWL.START_Y - ball.y)) * 100);
  return { shot: bowlCleanShot({ x, aim, speed, spin }), slope, pulled: range >= BOWL_PULL_MIN };
}

/** The throw of the swing so far (or at the release, `final`), from the page's trail. */
function bowlShotFrom(tr, final) {
  const g = bowlGfx;
  const r = g.canvas.getBoundingClientRect();
  const ball = tr.ball || { x: tr.x / 100, y: BOWL.START_Y };
  const out = bowlSwingShot(tr.pts, ball, r.height, final);
  return out ? out.shot : null;
}

/**
 * The ball under the finger while it swings. Pulling back it goes where the finger goes; on the
 * way forward after a backswing it swings along the backswing's line, as a ball on an arm does,
 * wherever the thumb wanders (the wander is the hook), so the ball crosses the foul line where
 * the aim guide said it would.
 */
function bowlSwingBall(tr, clientX, clientY) {
  const g = bowlGfx;
  const at = bowlSwingSpot(clientX, clientY);
  if (!at) return;
  const hit = bowlLaneAt(clientX, clientY);
  if (!tr.back || hit.y <= tr.back.ly) tr.back = { x: at.x, y: at.y, ly: hit.y };
  else {
    const r = g.canvas.getBoundingClientRect();
    const line = bowlSwingShot(tr.pts, tr.ball || at, r.height, false);
    if (line && line.pulled) at.x = Math.max(-BOWL_BALL_X_MAX, Math.min(BOWL_BALL_X_MAX, tr.back.x + line.slope * (at.y - tr.back.y)));
  }
  tr.ball = at;
  tr.x = Math.max(-40, Math.min(40, Math.round(at.x * 100)));
  g.ball.visible = true;
  g.ball.position.set(at.x, BOWL.BALL_R, -at.y);
}

/** One point of the finger's path: on the screen and on the lane. */
function bowlTrailPoint(e) {
  const l = bowlLaneAt(e.clientX, e.clientY);
  const t = e.timeStamp > 0 && Math.abs(e.timeStamp - performance.now()) < 5000 ? e.timeStamp : performance.now();
  return { sx: e.clientX, sy: e.clientY, t, lx: l ? l.x : null, ly: l ? l.y : null };
}

function bowlPointerDown(e) {
  const g = bowlGfx;
  if (!g.input.on || g.mode !== 'idle' || g.input.trail) return;
  e.preventDefault();
  g.input.trail = { id: e.pointerId, pts: [bowlTrailPoint(e)], x: bowlLaneXAt(e.clientX), ball: null, back: null };
  bowlSwingBall(g.input.trail, e.clientX, e.clientY);
  if (!g.input.trail.ball) bowlPlaceBall(g.input.trail.x / 100);
  try { g.canvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (typeof haptic === 'function') haptic('light');
  if (g.input.guide) bowlShowGuide(bowlShotFrom(g.input.trail, false), g.input.trail.ball);
  bowlGfxKick();
}

function bowlPointerMove(e) {
  const g = bowlGfx, tr = g.input.trail;
  if (!tr || e.pointerId !== tr.id) return;
  // Every point the finger passed, not only one a frame: the line is fitted through them.
  const evs = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [];
  (evs.length ? evs : [e]).forEach(ev => tr.pts.push(bowlTrailPoint(ev)));
  if (tr.pts.length > 400) {
    // Keep the start, the farthest point back and what came after it: the push is near the end.
    let kb = 0;
    for (let i = 1; i < tr.pts.length; i++) if (tr.pts[i].ly !== null && (tr.pts[kb].ly === null || tr.pts[i].ly <= tr.pts[kb].ly)) kb = i;
    const drop = Math.min(tr.pts.length - 400, Math.max(0, kb - 60));
    tr.pts.splice(1, drop > 0 ? drop : tr.pts.length - 400);
  }
  bowlSwingBall(tr, e.clientX, e.clientY);
  if (g.input.guide && performance.now() - g.input.guideAt > 40) {
    g.input.guideAt = performance.now();
    bowlShowGuide(bowlShotFrom(tr, false), tr.ball);
  }
  bowlGfxKick();
}

function bowlPointerUp(e) {
  const g = bowlGfx, tr = g.input.trail;
  if (!tr || e.pointerId !== tr.id) return;
  tr.pts.push(bowlTrailPoint(e));
  g.input.trail = null;
  bowlClearGuide();
  const shot = bowlShotFrom(tr, true);
  if (!shot) {
    // Not thrown: the ball goes back to the line where it was.
    bowlPlaceBall(tr.x / 100);
    bowlGfxKick();
    return;
  }
  g.input.release = tr.ball ? { x: tr.ball.x, y: tr.ball.y, at: performance.now() } : null;
  const fn = g.input.onShot;
  if (fn) fn(shot);
}

function bowlPointerCancel(e) {
  const g = bowlGfx, tr = g.input.trail;
  if (!tr || e.pointerId !== tr.id) return;
  g.input.trail = null;
  bowlClearGuide();
  bowlPlaceBall(tr.x / 100);
  bowlGfxKick();
}

function bowlClearGuide() {
  const g = bowlGfx;
  if (!g.guide) return;
  g.scene.remove(g.guide);
  g.guide.geometry.dispose();
  g.guide = null;
}

/** The aim guide: from the ball in your hand, the path this swing would send the ball down, as far as the head pin. */
function bowlShowGuide(shot, ball) {
  const g = bowlGfx, T = g.T;
  bowlClearGuide();
  if (!shot) return;
  const sim = bowlStart(Array(10).fill(false), shot);
  const pts = [];
  if (ball && ball.y < BOWL.START_Y - 0.05) pts.push(new T.Vector3(ball.x, 0.004, -ball.y));
  pts.push(new T.Vector3(sim.ball.x, 0.004, -sim.ball.y));
  let n = 0;
  while (!sim.ball.gone && sim.ball.y < BOWL.HEAD_Y && n < 4000) {
    bowlStep(sim);
    n++;
    if (n % 12 === 0) pts.push(new T.Vector3(sim.ball.x, 0.004, -sim.ball.y));
    if (sim.ball.gutter) break;
  }
  if (pts.length < 2) return;
  g.guide = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 80, 0.02, 6, false), g.guideMat);
  g.scene.add(g.guide);
}

/* --- the sounds: a rolling ball, pins crashing, the machine ----------------------------------- */

function bowlAudio() {
  try { return typeof fxCtx === 'function' ? fxCtx() : null; } catch (e) { return null; }
}

/** The ball's rumble on the wood, and a hollower one in the gutter. */
function bowlRumbleStart() {
  bowlRumbleStop();
  const ctx = bowlAudio();
  if (!ctx || typeof fxNoiseBuffer !== 'function') return;
  try {
    const src = ctx.createBufferSource();
    src.buffer = fxNoiseBuffer(ctx);
    src.loop = true;
    const low = ctx.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 170; low.Q.value = 0.8;
    const gain = ctx.createGain(); gain.gain.value = 0;
    src.connect(low); low.connect(gain); gain.connect(ctx.destination);
    src.start();
    bowlGfx.rumble = { ctx, src, low, gain };
  } catch (e) { bowlGfx.rumble = null; }
}

function bowlRumbleSet(speed, gutter) {
  const r = bowlGfx.rumble;
  if (!r) return;
  const now = r.ctx.currentTime;
  r.gain.gain.setTargetAtTime(Math.min(0.42, speed * 0.05) * (gutter ? 0.8 : 1), now, 0.08);
  r.low.frequency.setTargetAtTime(gutter ? 420 : 120 + speed * 12, now, 0.1);
}

function bowlRumbleStop() {
  const r = bowlGfx.rumble;
  if (!r) return;
  bowlGfx.rumble = null;
  try {
    const now = r.ctx.currentTime;
    r.gain.gain.setTargetAtTime(0, now, 0.06);
    r.src.stop(now + 0.35);
  } catch (e) {}
}

/** One sound: 'crash' (power 0..1), 'clack', 'sweep', 'return'. */
function bowlSound(kind, power) {
  if (typeof fxTone !== 'function' || typeof fxNoise !== 'function') return;
  const ctx = bowlAudio();
  if (!ctx) return;
  const at = ctx.currentTime + 0.01;
  try {
    if (kind === 'crash') {
      const p = Math.max(0.25, Math.min(1, power || 0.5));
      fxTone('sine', [[0, 150], [0.18, 55]], [[0, 0], [0.006, 0.34 * p], [0.25, 0.001]], at);
      fxNoise('lowpass', 900, 0.7, [[0, 0], [0.008, 0.28 * p], [0.35, 0.001]], at);
      fxNoise('bandpass', 2400, 1.1, [[0, 0], [0.004, 0.22 * p], [0.18, 0.001]], at);
      const n = Math.round(3 + p * 7);
      for (let i = 0; i < n; i++) {
        const d = 0.02 + Math.random() * (0.18 + p * 0.3);
        const f = 700 + Math.random() * 900;
        fxTone('triangle', [[0, f], [0.07, f * 0.8]], [[0, 0], [0.003, 0.09 + Math.random() * 0.08], [0.08, 0.001]], at + d);
        fxNoise('bandpass', f * 2.2, 3, [[0, 0], [0.002, 0.06], [0.05, 0.001]], at + d);
      }
    } else if (kind === 'clack') {
      const f = 800 + Math.random() * 700;
      fxTone('triangle', [[0, f], [0.06, f * 0.82]], [[0, 0], [0.003, 0.08 * (power || 1)], [0.07, 0.001]], at);
      fxNoise('bandpass', f * 2, 3, [[0, 0], [0.002, 0.05 * (power || 1)], [0.04, 0.001]], at);
    } else if (kind === 'sweep') {
      fxNoise('bandpass', 380, 2.2, [[0, 0], [0.25, 0.05], [1.6, 0.06], [2.2, 0.001]], at);
      fxTone('sawtooth', [[0, 70], [1.6, 82]], [[0, 0], [0.3, 0.018], [1.8, 0.016], [2.2, 0.001]], at);
      fxTone('sine', [[0, 180], [0.1, 120]], [[0, 0], [0.01, 0.1], [0.14, 0.001]], at + 2.1);
    } else if (kind === 'return') {
      fxTone('sine', [[0, 120], [0.2, 70]], [[0, 0], [0.01, 0.16], [0.26, 0.001]], at);
      fxNoise('lowpass', 300, 0.8, [[0, 0], [0.02, 0.08], [0.7, 0.04], [0.9, 0.001]], at + 0.05);
    }
  } catch (e) {}
}

/** Sounds for what happened on the lane since the last frame. */
function bowlGfxHear(sim) {
  const g = bowlGfx, h = g.heard;
  const b = sim.ball;
  if (g.loud) bowlRumbleSet(b.gone ? 0 : Math.sqrt(b.vx * b.vx + b.vy * b.vy), !!b.gutter);
  if (!g.loud) { h.knocks = sim.knocks; h.clacks = sim.clacks; h.hit = !!b.hitAt; return; }
  if (!h.hit && b.hitAt) {
    h.hit = true;
    const up = sim.pins.filter(p => p.up).length;
    bowlSound('crash', Math.min(1, (0.35 + Math.sqrt(b.vx * b.vx + b.vy * b.vy) / 14) * (up >= 6 ? 1 : 0.7)));
    if (typeof haptic === 'function') haptic('medium');
  } else if (sim.clacks > h.clacks && sim.t - b.hitAt > 0.12) {
    bowlSound('clack', Math.min(1, 0.4 + (sim.clacks - h.clacks) * 0.2));
  }
  h.knocks = sim.knocks;
  h.clacks = sim.clacks;
}

/* ==========================================================================
   WHAT IS DRAWN OVER THE LANE: the score sheet, the banner, the hint
   ========================================================================== */

function bowlStageHtml(o) {
  const opt = o || {};
  return `<div class="bowl-stage ${opt.tv ? 'bowl-stage--tv' : ''}" data-bowl-stage>
      <div class="bowl-canvas-box" data-bowl-canvas></div>
      <div class="bowl-hud">
        <div class="bowl-hud__sheet" data-bowl-sheet></div>
        <div class="bowl-hud__row">
          <span class="bowl-hud__who" data-bowl-who></span>
          <span class="badge badge--accent bowl-hud__clock" data-bowl-clock hidden></span>
        </div>
      </div>
      <div class="bowl-banner" data-bowl-banner aria-live="polite"></div>
      <div class="bowl-hint" data-bowl-hint></div>
      <div class="bowl-msg" data-bowl-msg hidden></div>
      <div class="bowl-over-slot" data-bowl-over></div>
    </div>`;
}

/** One card as a score sheet: a box a frame, its balls on top and the running total under them. */
function bowlSheetHtml(card, o) {
  const opt = o || {};
  const total = card.total;
  const sc = bowlScore(card.frames, total);
  const cur = card.over ? -1 : card.frames.length - 1;
  let boxes = '';
  for (let f = 0; f < total; f++) {
    const fr = card.frames[f] || [];
    const last = f === total - 1;
    const marks = bowlMarks(fr, last);
    const slots = last ? 3 : 2;
    let balls = '';
    for (let k = 0; k < slots; k++) {
      const m = marks[k] || '';
      balls += `<span class="bowl-fr__ball ${m === 'X' ? 'is-x' : m === '/' ? 'is-sp' : ''}">${escapeHTML(m)}</span>`;
    }
    boxes += `<div class="bowl-fr ${f === cur && opt.live !== false ? 'is-cur' : ''} ${last ? 'bowl-fr--last' : ''}">
        <div class="bowl-fr__n">${f + 1}</div>
        <div class="bowl-fr__balls">${balls}</div>
        <div class="bowl-fr__sum metric">${sc[f] === null ? '' : sc[f]}</div>
      </div>`;
  }
  return `<div class="bowl-sheet ${opt.compact ? 'bowl-sheet--compact' : ''}" dir="ltr" style="--bowl-n:${total}">${boxes}
      <div class="bowl-fr bowl-fr--tot"><div class="bowl-fr__n">Σ</div><div class="bowl-fr__sum bowl-fr__sum--tot metric">${bowlTotal(card)}</div></div>
    </div>`;
}

/** The big word over the lane after a ball: سترايك, سبير, the count, the gutter. */
function bowlBanner(stage, kind, down, of, sub) {
  const el = stage && stage.querySelector('[data-bowl-banner]');
  if (!el) return 0;
  let main, small = sub || '', cls = '';
  if (kind === 'strike') { main = bowlT('bowl_strike'); cls = 'is-strike'; }
  else if (kind === 'spare') { main = bowlT('bowl_spare'); cls = 'is-spare'; }
  else if (kind === 'gutter') { main = bowlT('bowl_gutter'); cls = 'is-miss'; }
  else if (kind === 'miss') { main = bowlT('bowl_miss'); cls = 'is-miss'; }
  else { main = String(down); small = (small ? small + ' · ' : '') + bowlT('bowl_of', { n: of }); }
  el.className = 'bowl-banner ' + cls;
  el.innerHTML = `<b class="bowl-banner__main">${escapeHTML(main)}</b>${small ? `<span class="bowl-banner__sub">${escapeHTML(small)}</span>` : ''}` +
    (kind === 'strike' ? '<span class="bowl-banner__pins" aria-hidden="true">' + '<i></i>'.repeat(10) + '</span>' : '');
  // Play the entrance again even when the word is the same as last time.
  void el.offsetWidth;
  el.classList.add('is-on');
  clearTimeout(el._bowlT);
  const ms = kind === 'strike' ? 2100 : 1500;
  el._bowlT = setTimeout(() => el.classList.remove('is-on'), ms);
  return ms;
}

/** The moment after a ball, with its sound (only where the table's sounds belong). */
function bowlCelebrate(stage, kind, loud) {
  if (kind === 'strike') {
    bowlGfxPulse();
    if (loud) {
      if (typeof playFx === 'function') playFx('tada');
      if (typeof confetti === 'function') setTimeout(() => confetti({ particleCount: 90, spread: 75, origin: { y: 0.45 } }), 200);
    }
    if (typeof haptic === 'function') haptic('double');
  } else if (kind === 'spare') {
    if (loud && typeof playFx === 'function') playFx('ding');
    if (typeof haptic === 'function') haptic('medium');
  } else if (kind === 'gutter' || kind === 'miss') {
    if (loud && typeof duelSound === 'function') duelSound('lose');
  }
}

function bowlHint(stage, text) {
  const el = stage && stage.querySelector('[data-bowl-hint]');
  if (!el) return;
  if (el.textContent !== text) el.textContent = text || '';
  el.classList.toggle('is-on', !!text);
}

/* ==========================================================================
   SOLO: the best score on the phone
   ========================================================================== */

const bowlSolo = { busy: false, shown: null, gen: 0 };

function bowlSoloState() {
  if (!appState.bowling || typeof appState.bowling !== 'object') appState.bowling = { phase: 'setup' };
  return appState.bowling;
}

function setupBowling() {
  setView('setup-bowling');
  paintBowlingSetup();
}

function paintBowlingSetup() {
  const o = bowlOpts();
  const view = document.getElementById('view-setup-bowling');
  if (!view) return;
  view.querySelectorAll('#bowling-frames .segmented__item').forEach(b => b.classList.toggle('is-active', Number(b.dataset.value) === o.frames));
  const guide = document.getElementById('bowling-guide');
  if (guide) guide.checked = o.guide;
  const s = bowlSoloState();
  const cont = document.getElementById('bowling-continue');
  if (cont) cont.classList.toggle('hidden', !(s.phase === 'play' && s.card));
  const best = document.getElementById('bowling-best');
  if (best) {
    const b = soloBest('bowling', String(o.frames));
    best.textContent = b ? bowlT('bowl_best_line', { n: b.score }) : '';
    best.classList.toggle('hidden', !b);
  }
}

function setBowlingOption(key, value) {
  if (key === 'frames') rememberOptions(BOWL_OPTS_KEY, { frames: Number(value) });
  if (key === 'guide') rememberOptions(BOWL_OPTS_KEY, { guide: !!value });
  if (typeof haptic === 'function') haptic('light');
  paintBowlingSetup();
}

function startBowling() {
  const o = bowlOpts();
  const s = bowlSoloState();
  Object.assign(s, { phase: 'play', card: bowlNewCard(o.frames), frames: o.frames, guide: o.guide, strikes: 0, spares: 0, balls: 0, recorded: false });
  bowlSolo.gen++;
  bowlSolo.busy = false;
  bowlSolo.shown = null;
  saveToLocal();
  setView('play-bowling');
  paintBowling({ fresh: true });
}

function bowlingContinue() {
  setView('play-bowling');
  paintBowling();
}

function bowlSoloStage() {
  const el = document.getElementById('bowling-stage');
  if (!el) return null;
  if (!el.querySelector('[data-bowl-stage]')) el.innerHTML = bowlStageHtml();
  return el.querySelector('[data-bowl-stage]');
}

function bowlSoloHud() {
  const s = bowlSoloState();
  const stage = bowlSoloStage();
  if (!stage || !s.card) return;
  const card = bowlSolo.shown || s.card;
  const sheet = stage.querySelector('[data-bowl-sheet]');
  const html = bowlSheetHtml(card);
  if (sheet && sheet._html !== html) { sheet.innerHTML = html; sheet._html = html; }
  const who = stage.querySelector('[data-bowl-who]');
  const f = Math.min(card.frames.length, card.total);
  const best = soloBest('bowling', String(card.total));
  const line = bowlT('bowl_frame', { n: f, m: card.total }) + (best ? ' · ' + bowlT('bowl_best_line', { n: best.score }) : '');
  if (who && who.textContent !== line) who.textContent = line;
  const over = stage.querySelector('[data-bowl-over]');
  if (over) {
    const html2 = s.phase === 'over' && !bowlSolo.busy ? `<div class="bowl-over card">
        <p class="eyebrow">${escapeHTML(bowlT('bowl_over_title'))}</p>
        <b class="bowl-over__score metric">${bowlTotal(s.card)}</b>
        <div class="btn-row">
          <button type="button" class="btn btn--primary" onclick="startBowling()">${escapeHTML(bowlT('play_again'))}</button>
          <button type="button" class="btn btn--ghost" onclick="setView('setup-bowling')">${escapeHTML(bowlT('bowl_options'))}</button>
        </div>
      </div>` : '';
    if (over._html !== html2) { over.innerHTML = html2; over._html = html2; }
  }
  bowlHint(stage, s.phase === 'play' && !bowlSolo.busy && bowlGfx.st === 'ready' ? bowlT('bowl_swipe') : '');
}

function paintBowling(o) {
  const s = bowlSoloState();
  if (!s.card) return false;
  const stage = bowlSoloStage();
  if (!stage) return false;
  bowlGfx.loud = true;
  bowlSoloHud();
  if (bowlSolo.busy) return true;
  bowlGfxMount(stage, () => paintBowling()).then(ok => {
    if (!ok || appState.currentView !== 'play-bowling' || bowlSolo.busy) return;
    bowlGfxRack(s.card.standing, { snap: true });
    bowlGfxInput(s.phase === 'play', bowlSoloShot, s.guide);
    bowlSoloHud();
  });
  if (o && o.fresh && typeof scrollToAction === 'function') scrollToAction();
  return true;
}

/** A swipe on the solo lane: the result is written (and saved) at once, then played. */
function bowlSoloShot(shot) {
  const s = bowlSoloState();
  if (s.phase !== 'play' || bowlSolo.busy || !s.card) return;
  const stage = bowlSoloStage();
  const before = s.card.standing.slice();
  const up = before.filter(Boolean).length;
  bowlSolo.shown = JSON.parse(JSON.stringify(s.card));
  const res = bowlThrow(before, shot);
  const out = bowlApply(s.card, res.after, res.down, res.gutter);
  s.balls = (s.balls || 0) + 1;
  if (out.kind === 'strike') s.strikes = (s.strikes || 0) + 1;
  if (out.kind === 'spare') s.spares = (s.spares || 0) + 1;
  if (out.over) s.phase = 'over';
  // Saved before the ball is seen, so a reload can't take a bad ball back.
  saveToLocal();
  bowlSolo.busy = true;
  const gen = ++bowlSolo.gen;
  bowlGfxInput(false);
  bowlSoloHud();
  bowlGfxThrow(before, shot).then(sim => {
    if (!sim || gen !== bowlSolo.gen) return;
    bowlSolo.shown = null;
    bowlSoloHud();
    const ms = bowlBanner(stage, out.kind, out.down, up);
    bowlCelebrate(stage, out.kind, true);
    if (s.phase === 'over') {
      setTimeout(() => { if (gen === bowlSolo.gen) bowlSoloOver(); }, ms);
      return null;
    }
    return bowlGfxSet(s.card.standing, { fresh: out.fresh, hold: out.kind === 'strike' ? 1100 : 700 });
  }).then(ok => {
    if (gen !== bowlSolo.gen) return;
    bowlSolo.busy = false;
    if (ok && s.phase === 'play' && appState.currentView === 'play-bowling') bowlGfxInput(true, bowlSoloShot, s.guide);
    bowlSoloHud();
  });
}

function bowlSoloOver() {
  const s = bowlSoloState();
  bowlSolo.busy = false;
  const total = bowlTotal(s.card);
  let rec = { record: false, prev: soloBest('bowling', String(s.card.total)) };
  if (!s.recorded) {
    rec = soloRecord('bowling', String(s.card.total), { score: total }, (a, b) => a.score > b.score);
    s.recorded = true;
    saveToLocal();
  }
  bowlSoloHud();
  const lines = [bowlT('bowl_counts', { x: s.strikes || 0, s: s.spares || 0 })];
  if (rec.record && rec.prev) lines.unshift('🎉 ' + escapeHTML(bowlT('bowl_new_best')));
  else if (rec.prev) lines.push(escapeHTML(bowlT('bowl_best_line', { n: rec.prev.score })));
  soloResult({
    icon: '🎳', title: bowlT('bowl_over_title'), value: total, valueLabel: bowlT('bowl_frames_of', { n: s.card.total }),
    lines: lines, win: rec.record || total >= s.card.total * 15,
    again: startBowling, exit: () => setView('setup-bowling')
  });
}

function restoreBowling() {
  const s = bowlSoloState();
  if (!s.card || (s.phase !== 'play' && s.phase !== 'over')) return false;
  bowlSolo.busy = false;
  bowlSolo.shown = null;
  return paintBowling();
}

if (typeof soloRegister === 'function') {
  soloRegister('bowling', {
    setup: 'setup-bowling', play: 'play-bowling',
    paintSetup: paintBowlingSetup, restore: restoreBowling,
    repaint: () => { const st = bowlSoloStage(); if (st) { const sh = st.querySelector('[data-bowl-sheet]'); if (sh) sh._html = ''; } bowlSoloHud(); }
  });
}

/* ==========================================================================
   IN A ROOM, AND ON THE TV
   Every phone and the TV play every ball from `shared.last`: the pins that
   were up and the four numbers. The thrower's own phone plays it as the
   finger lifts; a phone that was away, or two balls behind, just shows where
   the game is. What a screen shows lags the server by one ball: the sheet,
   the list and the overhead screen move on when the pins have fallen.
   ========================================================================== */

const bowlRoom = {
  key: '',            // code|dealId the memory below belongs to
  shownSeq: 0,        // the last ball this screen has shown (played or skipped)
  cardsAt: {},        // throwSeq -> the cards as they were after that ball
  turnAt: {},         // throwSeq -> whose turn it was after that ball
  busy: false,        // a ball playing, or the lane being set
  playing: null,      // the ball playing: { seq, pid }
  mine: null,         // my own ball, played before the server has answered: { turnSeq, at }
  root: null, tv: false,
  clock: null, clockKey: null,
  hostKey: '', turnSince: 0, hostTimer: null
};

const bowlShared = (state) => (state && state.shared) || {};
const bowlClone = (x) => JSON.parse(JSON.stringify(x || null));

function bowlRoomOptsSet(key, value) {
  if (key === 'frames') rememberOptions(BOWL_OPTS_KEY, { frames: Number(value) });
  if (key === 'clock') rememberOptions(BOWL_OPTS_KEY, { clock: Number(value) });
  if (key === 'guide') rememberOptions(BOWL_OPTS_KEY, { guide: !!value });
  if (typeof duelLobbyRedraw === 'function') duelLobbyRedraw();
}

/** Who the lane is showing: the one whose ball is playing, else the player up. */
function bowlRoomSubject(state) {
  const s = bowlShared(state);
  if (bowlRoom.playing) return bowlRoom.playing.pid;
  const turn = bowlRoom.turnAt[bowlRoom.shownSeq];
  return (turn && turn.pid) || (s.turn && s.turn.pid) || null;
}

function bowlRoomShownCards(state) {
  return bowlRoom.cardsAt[bowlRoom.shownSeq] || bowlShared(state).cards || {};
}

/** The player whose ball the screen is caught up to is up next: the rack they bowl at. */
function bowlRoomRack(state) {
  const cards = bowlRoomShownCards(state);
  const turn = bowlRoom.turnAt[bowlRoom.shownSeq] || bowlShared(state).turn;
  const c = turn && cards[turn.pid];
  return c ? c.standing : Array(10).fill(true);
}

const bowlRoomName = (state, pid) => ((state.players || []).find(p => p.id === pid) || {}).name || '';

function bowlRoomMyTurn(state) {
  const s = bowlShared(state);
  return !state.youAreScreen && s.phase === 'play' && s.turn && s.turn.pid === Room.me && !!(s.cards || {})[Room.me];
}

/** Keeps what each ball left behind, so a replay can show the sheet as it was after that ball. */
function bowlRoomRemember(state) {
  const s = bowlShared(state);
  const key = state.code + '|' + (s.dealId || '');
  if (bowlRoom.key !== key) {
    // A new game, a reload or a late join: nothing to replay, the lane as it is now.
    bowlRoom.key = key;
    bowlRoom.shownSeq = s.throwSeq || 0;
    bowlRoom.cardsAt = {};
    bowlRoom.turnAt = {};
    bowlRoom.busy = false;
    bowlRoom.playing = null;
    bowlRoom.mine = null;
    bowlGfxCancel();
  }
  const seq = s.throwSeq || 0;
  if (!bowlRoom.cardsAt[seq]) {
    bowlRoom.cardsAt[seq] = bowlClone(s.cards);
    bowlRoom.turnAt[seq] = bowlClone(s.turn) || { pid: null, over: true };
  }
  // Forget all but the last few.
  Object.keys(bowlRoom.cardsAt).forEach(k => { if (Number(k) < seq - 4) { delete bowlRoom.cardsAt[k]; delete bowlRoom.turnAt[k]; } });
}

/** The sheet, the list, who is up, the hint: what the screen shows, a ball behind the server when one is playing. */
function bowlRoomPaint(state) {
  const root = bowlRoom.root;
  if (!root) return;
  const s = bowlShared(state);
  const stage = root.querySelector('[data-bowl-stage]');
  const cards = bowlRoomShownCards(state);
  const subject = bowlRoomSubject(state);
  const card = subject && cards[subject];
  if (stage) {
    const sheet = stage.querySelector('[data-bowl-sheet]');
    const html = card ? bowlSheetHtml(card) : '';
    if (sheet && sheet._html !== html) { sheet.innerHTML = html; sheet._html = html; }
    const who = stage.querySelector('[data-bowl-who]');
    const turn = bowlRoom.turnAt[bowlRoom.shownSeq] || s.turn;
    const done = !turn || !turn.pid;
    let line = '';
    if (card && subject) {
      const f = Math.min(card.frames.length, card.total);
      line = (subject === Room.me && !state.youAreScreen ? bowlT('bowl_you') : bowlRoomName(state, subject)) + ' · ' + bowlT('bowl_frame', { n: f, m: card.total });
    }
    if (who && who.textContent !== line) who.textContent = line;
    let hint = '';
    if (!bowlRoom.busy && !done && s.phase === 'play' && bowlGfx.st === 'ready') {
      hint = bowlRoomMyTurn(state) ? bowlT('bowl_your_turn') : bowlT('bowl_turn_of', { name: bowlRoomName(state, s.turn.pid) });
    }
    bowlHint(stage, hint);
    const plain = stage.querySelector('[data-bowl-over]');
    if (plain) {
      // A phone that can't draw the lane still bowls: a plain ball down the middle.
      const html2 = bowlGfx.st === 'failed' && bowlRoomMyTurn(state) && !bowlRoom.busy
        ? `<div class="bowl-over card"><button type="button" class="btn btn--primary" onclick="bowlRoomPlain()">${escapeHTML(bowlT('bowl_throw_plain'))}</button></div>` : '';
      if (plain._html !== html2) { plain.innerHTML = html2; plain._html = html2; }
    }
  }
  const list = root.querySelector('[data-bowl-list]');
  if (list) {
    const html = bowlRoomListHtml(state, cards, subject);
    if (list._html !== html) { list.innerHTML = html; list._html = html; }
  }
}

/** Everyone's card, one line each: the name, the frames, the total. */
function bowlRoomListHtml(state, cards, subject) {
  const s = bowlShared(state);
  const rows = (s.order || []).filter(id => cards[id]).map(id => {
    const c = cards[id];
    const me = id === Room.me && !state.youAreScreen;
    const p = (state.players || []).find(x => x.id === id);
    const away = p && !p.online;
    return `<div class="bowl-row ${id === subject ? 'is-up' : ''} ${me ? 'is-me' : ''} ${away ? 'is-away' : ''} ${c.over ? 'is-done' : ''}">
        <div class="bowl-row__head">
          <span class="bowl-row__name">${escapeHTML(me ? bowlT('bowl_you') : (p ? p.name : ''))}</span>
          <b class="bowl-row__tot metric">${bowlTotal(c)}</b>
        </div>
        ${bowlSheetHtml(c, { compact: true, live: id === subject })}
      </div>`;
  }).join('');
  return rows ? `<div class="bowl-rows">${rows}</div>` : '';
}

/** The next thing the lane does: play a ball it hasn't shown, or wait at the rack. */
function bowlRoomNext() {
  const state = Room.state;
  if (!state || state.game !== 'bowling' || !bowlRoom.root || bowlRoom.busy) return;
  const s = bowlShared(state);
  const seq = s.throwSeq || 0;
  const stage = bowlRoom.root.querySelector('[data-bowl-stage]');
  if (seq > bowlRoom.shownSeq) {
    const last = s.last;
    const behind = seq - bowlRoom.shownSeq;
    if (behind > 1 || !last || last.seq !== seq || bowlGfx.st !== 'ready' || document.hidden) {
      // Too far behind to replay (or nothing to replay it on): catch up.
      bowlRoom.shownSeq = seq;
      bowlRoomIdle(state);
      return;
    }
    bowlRoomPlay(state, last, false);
    return;
  }
  bowlRoomIdle(state);
}

/** At the rack: the pins for the player up, and the swipe on if it is this phone. */
function bowlRoomIdle(state) {
  const s = bowlShared(state);
  if (s.phase === 'gameover') {
    // Caught up with the last ball: the result takes the screen.
    setTimeout(() => { const st = Room.state; if (st && st.game === 'bowling' && !bowlRoom.busy) routeRoomState(st); }, 0);
    return;
  }
  if (bowlGfx.st === 'ready') {
    if (bowlGfx.mode !== 'idle' || !bowlRoom.idleKey || bowlRoom.idleKey !== bowlRoom.key + '|' + bowlRoom.shownSeq) {
      bowlRoom.idleKey = bowlRoom.key + '|' + bowlRoom.shownSeq;
      bowlGfxRack(bowlRoomRack(state), { snap: bowlGfx.mode === 'idle' });
    }
    const mine = bowlRoomMyTurn(state) && bowlRoom.shownSeq === (s.throwSeq || 0);
    bowlGfxInput(mine, bowlRoomShot, !!(s.settings || {}).guide);
  }
  bowlRoomPaint(state);
}
