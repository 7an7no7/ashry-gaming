<script>
  /* --- DOMINO GAME LOGIC --- */
  function runStartDomino() {
      let selected = appState.activePlayers ? [...appState.activePlayers] : [];
      saveActivePlayers(selected)
      if(selected.length < 2 || selected.length > 4) {
          const msg = appState.lang === 'ar' ? 'اختر من 2 إلى 4 لاعبين' : 'Select 2 to 4 players';
          return showToast(msg);
      }
      window._tempDominoPlayers = selected;
      if (selected.length === 4) {
          document.getElementById('domino-mode-modal').classList.remove('hidden');
      } else {
          startDominoGame('single', selected);
      }
  }

  function setDominoMode(mode) {
      closeModal('domino-mode-modal');
      const players = window._tempDominoPlayers;
      if (mode === 'teams') {
          const btnText = appState.lang === 'ar' ? "اعتمد الفرق (الأول والثاني فريق 1)" : "Confirm Teams (First two are Team 1)";
          openReorderModal('domino-teams', players.map(name => ({ name: name })), btnText);
          
          const alertMsg = appState.lang === 'ar' ? "قم بترتيب اللاعبين: أول اسمين (فريق 1) وآخر اسمين (فريق 2)" : "Order players: First two (Team 1), last two (Team 2)";
          const alertTitle = appState.lang === 'ar' ? "ترتيب الفرق" : "Team Order";
          showCustomAlert(alertMsg, alertTitle);
      } else {
          startDominoGame('single', players);
      }
  }

  function finalizeDominoTeams(orderedNames) {
      const team1Names = [orderedNames[0], orderedNames[1]];
      const team2Names = [orderedNames[2], orderedNames[3]];
      
      const t1Label = appState.lang === 'ar' ? 'فريق 1' : 'Team 1';
      const t2Label = appState.lang === 'ar' ? 'فريق 2' : 'Team 2';
      const andLabel = appState.lang === 'ar' ? 'و' : '&';

      const teamPlayers = [
          { name: `${t1Label} (${team1Names[0]} ${andLabel} ${team1Names[1]})`, score: 0, isTeam: true },
          { name: `${t2Label} (${team2Names[0]} ${andLabel} ${team2Names[1]})`, score: 0, isTeam: true }
      ];
      startDominoGame('teams', null, teamPlayers);
  }

  function startDominoGame(mode, playersNames, preConfiguredPlayers) {
      const target = parseInt(document.getElementById('domino-target').value, 10);
      appState.domino.target = (isFinite(target) && target > 0) ? target : 101;
      appState.domino.declared = false;
      appState.domino.mode = mode;
      if (preConfiguredPlayers) {
          appState.domino.players = preConfiguredPlayers;
      } else {
          appState.domino.players = playersNames.map(name => ({ name, score: 0, isTeam: false }));
      }
      setView('play-domino');
      renderDominoBoard();
  }

  function renderDominoBoard() {
      const container = document.getElementById('domino-board');
      container.innerHTML = '';
      const teams = appState.domino.mode === 'teams';
      const moreLabel = appState.lang === 'ar' ? 'نقاط أخرى' : 'Other points';
      const undoLabel = appState.lang === 'ar' ? 'تراجع 5' : 'Undo 5';
      appState.domino.players.forEach((p, idx) => {
          // Accents come from the design system, so the row follows the theme;
          // the old hardcoded pairs (text-blue-600 on a dark card) were under 2:1.
          const accent = teams ? (idx === 0 ? 'blue' : 'rose') : 'green';
          const icon = teams ? (idx === 0 ? '🛡️' : '⚔️') : '👤';
          container.innerHTML += `
            <div class="status-row" data-accent="${accent}">
                <div class="status-row__body">
                    <div class="status-row__name">${icon} ${escapeHTML(p.name)}</div>
                    <div class="metric metric--md metric--accent">${p.score}</div>
                </div>
                <div class="status-row__actions">
                    <button onclick="addDominoPoints(${idx}, 10)" class="control-btn" aria-label="+10">+10</button>
                    <button onclick="promptDominoPoints(${idx})" class="control-btn" aria-label="${moreLabel}">…</button>
                    <button onclick="addDominoPoints(${idx}, -5)" class="control-btn control-btn--danger" aria-label="${undoLabel}">↺</button>
                </div>
            </div>`;
      });
  }

  function addDominoPoints(idx, pts) {
      appState.domino.players[idx].score += pts;
      if(appState.domino.players[idx].score < 0) appState.domino.players[idx].score = 0;
      playSound(pts > 0 ? 'success' : 'click');
      renderDominoBoard();
      checkDominoWin();
      saveToLocal();
  }

  function checkDominoWin() {
      const winner = appState.domino.players.find(p => p.score >= appState.domino.target);
      // Announce a target crossing once. Every later +10 on any player used to
      // re-fire the confetti and re-open the winner modal; dropping back below
      // the target arms it again, so a mis-tap can still be undone.
      if (!winner) { appState.domino.declared = false; return; }
      if (appState.domino.declared) return;
      appState.domino.declared = true;
      {
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          const pointsLabel = appState.lang === 'ar' ? 'النقاط' : 'Points';
          document.getElementById('winners-list').innerHTML = `<div class="text-3xl mb-2">🥇 ${escapeHTML(winner.name)}</div><div class="text-sm tx-muted font-bold">${pointsLabel}: ${winner.score}</div>`;
          document.getElementById('winner-scores-container').classList.add('hidden');
          document.getElementById('winner-modal').classList.remove('hidden');
          playSound('success');

          // Record win (Removed)
      }
  }

  let pendingDominoIdx = null;
  function promptDominoPoints(idx) {
      pendingDominoIdx = idx;
      document.getElementById('manual-domino-points').value = '';
      document.getElementById('domino-input-modal').classList.remove('hidden');
      document.getElementById('manual-domino-points').focus();
  }

  function submitDominoManual() {
      const val = parseInt(document.getElementById('manual-domino-points').value, 10);
      // An empty or non-numeric field parsed to NaN, and NaN poisoned the score
      // permanently - every later render showed "NaN".
      if (!isFinite(val) || pendingDominoIdx === null) {
          return showToast(appState.lang === 'ar' ? 'أدخل رقماً صحيحاً' : 'Enter a valid number', 'warn');
      }
      addDominoPoints(pendingDominoIdx, val);
      closeModal('domino-input-modal');
  }
</script>
