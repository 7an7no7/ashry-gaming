<script>
/* ============================================================================
   MOTION — the moments that carry something from one place to the next
   ----------------------------------------------------------------------------
   The intro (introExit in JS_Core.html) set the idea: the logo doesn't vanish
   and reappear, it flies to where it lives. The same idea, used where the
   player has just done something (Style.html section 14):
   - a game's icon flies from the card you tapped to the top of its screen;
   - when a room deals a game, every phone and the TV show the game big for a
     moment, and its icon flies into the header;
   - the bottom bar's highlight slides to the tab you picked;
   - a room's code drops in letter by letter, and whoever joins pops in;
   - scores count up, and players slide to their new places on the board;
   - a vote's bars grow one at a time, the winner's last;
   - a round's result card lies face down for a beat ("the spy was…"), then
     turns over;
   - the end of a game puts the top three on a podium that rises 3-2-1;
   - a letter spins in like a slot machine;
   - a pass-the-phone role shows only while a finger holds the card;
   - going back, a game's icon flies home to the card it was opened from.
   A reveal plays once per thing on this phone (motionFirst): a room redraws a
   screen for reasons the table never sees, and a redraw shows it settled.
   Nothing here moves by itself, all of it stays still under reduced motion,
   and every end state is also set by a timer - an animation event is never
   the only path (see GEMINI.md).
   ========================================================================= */

const motionOff = () => reducedMotion() || document.hidden;

/**
 * Where an element will be once the animations it rides on have finished (its
 * screen sliding in, a card rising): they are seeked to their end, measured and
 * put back in the same task, so nothing is drawn in between and no animation
 * event fires.
 */
function restingRect(el) {
  const riding = (document.getAnimations ? document.getAnimations() : []).filter((a) => {
    const t = a.effect && a.effect.target;
    return t && t.contains && t.contains(el);
  });
  const saved = riding.map((a) => [a, a.currentTime]);
  saved.forEach(([a]) => {
    const end = a.effect.getComputedTiming().endTime;
    if (isFinite(end)) a.currentTime = end;
  });
  const rect = el.getBoundingClientRect();
  saved.forEach(([a, time]) => { if (time !== null) a.currentTime = time; });
  return rect;
}

/**
 * Flies an emoji from a rect on screen onto an element, and shows the element
 * with a small pop when it lands. `arc` lifts the path in the middle, in px.
 *
 * The flight is a Web Animation of transform only, so the browser runs it off
 * the main thread and starts its clock on the first frame it actually draws:
 * a screen that is slow to draw (the home, 600 elements) no longer eats the
 * start of the path or stalls it halfway, which a per-frame script did.
 * It aims at where the element comes to rest (restingRect) rather than
 * chasing it. The ghost is drawn at the larger of the two sizes and only ever
 * scaled down, so the emoji stays sharp.
 */
function flyEmoji(emoji, fromRect, fromFontPx, target, opts) {
  const o = opts || {};
  if (!target || !fromRect || !fromFontPx || motionOff() || !document.body.animate) return false;
  const duration = o.duration || 540;
  const to = restingRect(target);
  if (!to.width) return false;
  const toFont = parseFloat(getComputedStyle(target).fontSize) || fromFontPx;
  const big = Math.max(fromFontPx, toFont);

  const ghost = document.createElement('span');
  ghost.className = 'motion-ghost';
  ghost.style.fontSize = big + 'px';
  const glyph = document.createElement('span');
  glyph.className = 'motion-ghost__glyph';
  if (isArtIcon(emoji)) glyph.innerHTML = iconHtml(emoji); else glyph.textContent = emoji;
  ghost.appendChild(glyph);
  document.body.appendChild(ghost);
  const size = ghost.getBoundingClientRect();
  const fromX = fromRect.left + fromRect.width / 2;
  const fromY = fromRect.top + fromRect.height / 2;
  ghost.style.left = (fromX - size.width / 2) + 'px';
  ghost.style.top = (fromY - size.height / 2) + 'px';
  const dx = to.left + to.width / 2 - fromX;
  const dy = to.top + to.height / 2 - fromY;
  target.classList.add('motion-waiting');

  const flight = ghost.animate([
    { transform: 'translate(0px, 0px) scale(' + (fromFontPx / big) + ')' },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + (toFont / big) + ')' }
  ], { duration: duration, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });
  if (o.arc) {
    glyph.animate([
      { transform: 'translateY(0px)', easing: 'ease-out' },
      { transform: 'translateY(' + (-o.arc) + 'px)', offset: 0.5, easing: 'ease-in' },
      { transform: 'translateY(0px)' }
    ], { duration: duration, fill: 'both' });
  }

  let landed = false;
  const land = () => {
    if (landed) return;
    landed = true;
    ghost.remove();
    target.classList.remove('motion-waiting', 'motion-landed');
    void target.offsetWidth;
    target.classList.add('motion-landed');
    setTimeout(() => target.classList.remove('motion-landed'), 520);
  };
  flight.onfinish = land;
  // Timers too, counted from the first drawn frame; and one that holds even
  // if the tab stops drawing before it starts.
  if (flight.ready) flight.ready.then(() => setTimeout(land, duration + 200)).catch(land);
  setTimeout(land, duration + 1500);
  return true;
}

/* --- 1. A card's icon to its game's screen ---------------------------------- */

/**
 * Measures the tapped card's icon before the screen changes, and returns what
 * to call once it has: the icon flies to the new screen's hero, if it has one
 * (a room-only game opens the name sheet instead, and nothing flies).
 */
function catalogIconFlight(g, fromEl) {
  if (!g || !fromEl || motionOff()) return null;
  const icon = fromEl.querySelector('.gcard__icon, .recent-tile__icon, .tool-icon, .start-card__icon');
  if (!icon) return null;
  const from = icon.getBoundingClientRect();
  const fromFont = parseFloat(getComputedStyle(icon).fontSize);
  return () => {
    const view = document.getElementById('view-' + appState.currentView);
    const target = view && view.querySelector('.game-hero .game-hero__icon');
    if (target) flyEmoji(g.icon, from, fromFont, target, { duration: 560, arc: 28 });
  };
}

/* --- 2. A room deals a game -------------------------------------------------- */

/** The game, big, on every phone at once; then its icon flies into the header. */
function playRoomGameStart(state) {
  if (!state || !state.game || motionOff()) return;
  const hub = (typeof ROOM_HUB_GAMES !== 'undefined' ? ROOM_HUB_GAMES : []).find((g) => g.id === state.game);
  if (!hub) return;
  const t = TRANSLATIONS[appState.lang] || {};
  document.querySelectorAll('.game-splash').forEach((el) => el.remove());

  const el = document.createElement('div');
  el.className = 'game-splash' + (state.youAreScreen ? ' game-splash--tv' : '');
  el.setAttribute('data-accent', hub.accent || 'violet');
  el.innerHTML =
    '<div class="game-splash__card">' +
      '<span class="game-splash__icon" aria-hidden="true">' + iconHtml(hub.icon) + '</span>' +
      '<span class="game-splash__name">' + escapeHTML(t[hub.key] || '') + '</span>' +
    '</div>';
  document.body.appendChild(el);
  const icon = el.querySelector('.game-splash__icon');

  let leaving = false;
  const leave = (fast) => {
    if (leaving) return;
    leaving = true;
    const target = document.getElementById('app-title-icon');
    const canFly = !fast && target && (target.textContent || target.firstElementChild) && !document.body.classList.contains('is-fullscreen-view')
      && target.getBoundingClientRect().width > 0;
    if (canFly) {
      const from = icon.getBoundingClientRect();
      const fromFont = parseFloat(getComputedStyle(icon).fontSize);
      icon.style.visibility = 'hidden';
      flyEmoji(hub.icon, from, fromFont, target, { duration: 560 });
    }
    el.classList.add('is-leaving');
    setTimeout(() => el.remove(), fast ? 180 : 420);
  };
  el.addEventListener('click', () => leave(true));
  setTimeout(() => leave(false), 950);
}

/* --- 2b. A list rearranges; it does not redraw ------------------------------
   Every catalog in the app filters by toggling .hidden, which is display:none:
   the most-used gesture on the busiest screen - a filter chip on the home -
   was also the only one in the app with no motion at all. Cards vanished,
   sections collapsed and everything below jumped.

   flipGrid reads where the items are, hands the mutation straight through to
   the caller (so the filtering logic is untouched and still the only thing
   that decides what is shown), reads where they ended up, and runs the
   survivors back from their old place to their new one while the newcomers
   fade up. Transform and opacity only, so it is all on the compositor.

   Positions are measured relative to the container, not the viewport: hiding
   half a grid can make the scroller clamp its own scrollTop, and viewport
   coordinates would read that clamp as every card flying hundreds of pixels.
   A card that really did move most of a screen is faded in rather than flown,
   because a ghost crossing the whole page reads as a glitch, not a move. */
const FLIP_ITEMS = '.gcard, .tool-item, .recent-tile, .daily-strip, .section__head';

function flipGrid(root, mutate, opts) {
  if (typeof mutate !== 'function') return;
  if (!root || motionOff()) { mutate(); return; }
  const items = Array.from(root.querySelectorAll((opts && opts.items) || FLIP_ITEMS));
  if (!items.length) { mutate(); return; }

  const read = () => {
    const base = root.getBoundingClientRect();
    const seen = new Map();
    items.forEach((el) => {
      if (el.classList.contains('hidden')) return;
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) return;
      // Root-relative for the delta (scroll-proof), viewport-relative to know
      // whether anyone can actually see it move.
      seen.set(el, { x: r.left - base.left, y: r.top - base.top, vy: r.top, vh: r.height });
    });
    return seen;
  };

  const was = read();
  mutate();
  const now = read();

  root.classList.add('is-flipping');
  // A catalog is several screens long: animating all fifty cards would put
  // fifty layers on the compositor to move things nobody is looking at. Only
  // what is within a screen of the fold is worth a frame.
  const vh = window.innerHeight || 800;
  const far = vh * 1.2;
  let entering = 0;
  now.forEach((to, el) => {
    if (to.vy > vh * 1.5 || to.vy + to.vh < -vh * 0.5) return;
    const from = was.get(el);
    if (from) {
      const dx = from.x - to.x, dy = from.y - to.y;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      if (Math.abs(dy) > far) return;
      el.animate(
        [{ transform: 'translate3d(' + dx + 'px, ' + dy + 'px, 0)' }, { transform: 'translate3d(0, 0, 0)' }],
        { duration: 320, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    } else {
      // Newcomers come up in sequence, capped so a jump from one chip to
      // "all" is a wave and not a queue.
      el.animate(
        [{ opacity: 0, transform: 'translate3d(0, 10px, 0) scale(0.97)' },
         { opacity: 1, transform: 'none' }],
        { duration: 260, delay: Math.min(entering++, 7) * 24,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'backwards' });
    }
  });
  setTimeout(() => root.classList.remove('is-flipping'), 420);
}

/* --- 3. The bottom bar's highlight slides ----------------------------------- */

/** Places the highlight under the active tab; CSS slides it there. */
function syncNavPill() {
  const nav = document.querySelector('.shell__nav');
  if (!nav) return;
  const active = nav.querySelector('.nav-item.is-active');
  // A class list write is a mutation even when nothing changes, and the
  // observer that calls this watches class changes: an unconditional add here
  // ran this every frame, forever. Only touch what actually differs.
  if (!active || !active.offsetWidth) {
    if (nav.classList.contains('has-pill-on')) nav.classList.remove('has-pill-on');
    return;
  }
  const set = (name, value) => { if (nav.style.getPropertyValue(name) !== value) nav.style.setProperty(name, value); };
  set('--pill-x', active.offsetLeft + 'px');
  set('--pill-y', active.offsetTop + 'px');
  set('--pill-w', active.offsetWidth + 'px');
  set('--pill-h', active.offsetHeight + 'px');
  set('--pill-r', getComputedStyle(active).borderTopLeftRadius);
  if (!nav.classList.contains('has-pill')) nav.classList.add('has-pill');
  if (!nav.classList.contains('has-pill-on')) nav.classList.add('has-pill-on');
}

/* --- 5. Scores count up; players slide to their new places ------------------ */

// What each player's score and place were the last time a board was drawn in
// this room and game, so the next board can move from there.
const scoreMemo = { key: '', scores: {}, ranks: {} };

function countUp(el, from, to) {
  if (!el) return;
  const duration = 720;
  let t0 = null;
  let done = false;
  el.textContent = from;
  const end = () => {
    if (done) return;
    done = true;
    el.textContent = to;
    el.classList.remove('motion-landed');
    void el.offsetWidth;
    el.classList.add('motion-landed');
    setTimeout(() => el.classList.remove('motion-landed'), 520);
  };
  const step = (now) => {
    if (done) return;
    // The clock starts on the first frame drawn, not when this was called: a
    // board that is slow to draw used to open with the number a third of the
    // way up already.
    if (t0 === null) { t0 = now; setTimeout(end, duration + 250); }
    const k = Math.min(1, (now - t0) / duration);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
    else end();
  };
  setTimeout(() => requestAnimationFrame(step), 180);
  setTimeout(end, duration + 1500);          // a tab that stops drawing still gets the number
}

/** Every scoreboard drawn since the last look: count up what rose, slide who moved. */
function animateScoreboards(state) {
  if (!state || !state.game) return;
  const key = state.code + '|' + state.game;
  if (scoreMemo.key !== key) {
    scoreMemo.key = key;
    scoreMemo.scores = {};
    scoreMemo.ranks = {};
  }
  const still = motionOff();
  document.querySelectorAll('.scoreboard:not([data-seen])').forEach((board) => {
    if (!board.getClientRects().length) return;        // not on screen; its turn comes when it is
    board.dataset.seen = '1';
    const rows = [...board.querySelectorAll('[data-pid]')];
    if (!rows.length) return;
    // Scores that went down mean a new game started: remember, don't animate.
    const reset = rows.some((r) => scoreMemo.scores[r.dataset.pid] > Number(r.dataset.score));
    const step = rows.length > 1 ? rows[1].offsetTop - rows[0].offsetTop : 0;
    rows.forEach((row, i) => {
      const pid = row.dataset.pid;
      const now = Number(row.dataset.score);
      const was = scoreMemo.scores[pid];
      if (still || reset || was === undefined) return;
      if (now > was) countUp(row.querySelector('[data-count]'), was, now);
      const oldRank = scoreMemo.ranks[pid];
      if (oldRank !== undefined && oldRank !== i && step > 0 && row.animate) {
        row.animate(
          [{ transform: 'translateY(' + ((oldRank - i) * step) + 'px)' }, { transform: 'none' }],
          { duration: 680, delay: 160, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' }
        );
      }
    });
    rows.forEach((row, i) => {
      scoreMemo.scores[row.dataset.pid] = Number(row.dataset.score);
      scoreMemo.ranks[row.dataset.pid] = i;
    });
  });
}

/* --- 6. Once per thing, not once per redraw -------------------------------- */

const motionSeen = new Set();

/** True the first time `key` is drawn on this phone with motion on. */
function motionFirst(key) {
  if (motionSeen.has(key)) {
    // Drawn again: it is in use, so it moves to the newest end.
    motionSeen.delete(key);
    motionSeen.add(key);
    return false;
  }
  if (motionOff()) return false;
  // Forget the oldest key only (a Set keeps insertion order): clearing them all
  // would also forget the reveal on screen, and its next redraw would replay it.
  if (motionSeen.size >= 300) motionSeen.delete(motionSeen.values().next().value);
  motionSeen.add(key);
  return true;
}

/**
 * Runs fn once the reveals just drawn into el have had their moment (the card
 * turning over, the winner reaching the top of the podium), so the confetti
 * lands with the answer rather than before it.
 */
function afterReveal(el, fn) {
  const waits = el ? [...el.querySelectorAll('[data-reveal-ms]')].map((x) => Number(x.dataset.revealMs) || 0) : [];
  const wait = Math.max(0, ...waits);
  if (wait) setTimeout(fn, wait); else fn();
}

/* --- 7. Vote results build suspense ------------------------------------------ */

/**
 * When each result row grows, in ms: from the bottom of the list up, the
 * winning row (or the highlighted one) last, after a beat. Empty when this
 * result was already shown on this phone.
 */
function voteRevealTimes(key, rows, isWin, delay) {
  if (!motionFirst(key)) return null;
  const order = rows.filter((r) => !isWin(r)).reverse().concat(rows.filter(isWin));
  const step = order.length > 1 ? Math.min(420, Math.round(1500 / (order.length - 1))) : 0;
  const beat = order.some((r) => !isWin(r)) ? 380 : 0;
  const times = new Map();
  order.forEach((r, k) => times.set(r, (delay || 0) + k * step + (isWin(r) ? beat : 0)));
  times.total = Math.max(0, ...times.values()) + 1000;
  return times;
}

/* --- 8. The spy was… --------------------------------------------------------- */

// The card lies face down for SPY_REVEAL_BEAT_MS, turns over, and is edge-on
// (the cover goes) halfway through the turn. Style.html has the same numbers.
const SPY_REVEAL_BEAT_MS = 1100;
const SPY_REVEAL_MS = 1660;

/**
 * The face-down cover for a round's result card, the first time this round's
 * result is drawn on this phone: `cls` and `attrs` go on the card, `cover`
 * first inside it. All empty afterwards.
 */
function spyRevealParts(key, label) {
  if (!motionFirst(key)) return { cls: '', attrs: '', cover: '', ms: 0 };
  // Three soft ticks while it lies face down: a drumroll the table hears together.
  [0, 380, 760].forEach((ms) => setTimeout(() => { if (!document.hidden) playSound('tick'); }, ms));
  return {
    cls: 'spy-reveal',
    attrs: 'data-reveal-ms="' + SPY_REVEAL_MS + '"',
    cover: '<div class="spy-reveal__cover" aria-hidden="true">' +
             '<span class="spy-reveal__q">?</span>' +
             '<span class="spy-reveal__label">' + escapeHTML(label || '') + '</span>' +
           '</div>',
    ms: SPY_REVEAL_MS
  };
}

/* --- 9. The podium ----------------------------------------------------------- */

/**
 * The top three of a finished game's board on a podium, second on one side of
 * the winner and third on the other. The first time it is drawn, third rises,
 * then second, then the winner. Empty with fewer than two players or nobody
 * scoring, and the caller keeps its plain champion line.
 */
function renderPodium(state, board) {
  const all = board || [];
  const top = all.slice(0, 3);
  if (top.length < 2 || !(Number(top[0].score) > 0)) return '';
  const rankOf = (p) => 1 + all.filter((x) => Number(x.score) > Number(p.score)).length;
  const rise = motionFirst(['podium', roomDealKey(state), state && state.game, JSON.stringify(top)].join('|'));
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const atOf = (i) => 150 + (top.length - 1 - i) * 520;
  const winMs = atOf(0) + 620;
  return '<div class="podium' + (rise ? ' podium--rise" data-reveal-ms="' + winMs + '"' : '"') + '>' +
    top.map((p, i) => {
      const rank = Math.min(3, rankOf(p));
      return '<div class="podium__place podium__place--' + (i + 1) + ' podium__place--rank' + rank + '" style="--at:' + atOf(i) + 'ms">' +
               '<div class="podium__who">' +
                 '<span class="podium__medal" aria-hidden="true">' + medals[rank] + '</span>' +
                 '<span class="podium__name">' + escapeHTML(p.name) + '</span>' +
                 '<span class="podium__score metric">' + (Number(p.score) || 0) + '</span>' +
               '</div>' +
               '<div class="podium__block"><span class="metric">' + rank + '</span></div>' +
             '</div>';
    }).join('') +
  '</div>';
}

/**
 * A title at the end of a game: "⚡ أسرع واحد · أحمد". `winner` is what the server
 * published ({ id, name, n }) or null, and null draws nothing at all rather
 * than an empty row - a game with one player, or with nobody scoring, has no
 * title. `delay` holds it back until the podium beside it has finished rising;
 * data-reveal-ms tells afterReveal to keep the confetti until then.
 */
const AWARD_AFTER_PODIUM_MS = 1900;

function renderAward(icon, label, winner, delay, countHtml) {
  if (!winner || !winner.name) return '';
  const at = Math.max(0, Number(delay) || 0);
  const show = motionFirst(['award', label, winner.id, winner.n].join('|'));
  return '<div class="award' + (show ? ' award--in" data-reveal-ms="' + (at + 520) + '"' : '"') +
           ' style="--at:' + at + 'ms">' +
           '<span class="award__icon" aria-hidden="true">' + icon + '</span>' +
           '<span class="award__label">' + escapeHTML(label || '') + '</span>' +
           '<span class="award__name">' + escapeHTML(winner.name) + '</span>' +
           (countHtml
             ? '<span class="award__n award__n--words">' + countHtml + '</span>'
             : '<span class="award__n metric">' + (Number(winner.n) || 0) + '</span>') +
         '</div>';
}

/* The trivia's title says what its number is (the owner, 26 Sep 2026: «أسرع
   واحد منى 3» read as a score): «أسرع إجابة: منى · في 3 أسئلة», the number
   held left to right inside the words. */
function awardFirstTimes(n) {
  const t = TRANSLATIONS[appState.lang] || {};
  const k = Number(n) || 0;
  const key = k === 1 ? 'award_first_1' : k === 2 ? 'award_first_2' : (k <= 10 ? 'award_first_few' : 'award_first_many');
  return escapeHTML(t[key] || String(k)).replace('{n}', '<bdi dir="ltr" class="metric">' + k + '</bdi>');
}

/* --- 10. A letter spins in --------------------------------------------------- */

/**
 * Letters from `pool` flick past in `el`, slowing down, and the real one pops
 * in; `onLand` runs when it does (at once, with motion off). The element keeps
 * the right letter in its markup, so a redraw mid-spin is already correct.
 */
function spinLetter(el, letter, pool, onLand) {
  if (!el) { if (onLand) onLand(); return; }
  const token = {};
  el._spin = token;
  const others = (pool || []).filter((x) => x !== letter);
  if (motionOff() || others.length < 2) { el.textContent = letter; if (onLand) onLand(); return; }
  const gaps = [55, 60, 65, 72, 80, 90, 104, 120, 140, 165, 195];
  let shown = '';
  let k = 0;
  const flick = () => {
    if (el._spin !== token) return;
    if (k >= gaps.length) {
      el.textContent = letter;
      el.classList.remove('is-spinning', 'motion-landed');
      void el.offsetWidth;
      el.classList.add('motion-landed');
      setTimeout(() => el.classList.remove('motion-landed'), 520);
      if (onLand) onLand();
      return;
    }
    let next = others[Math.floor(Math.random() * others.length)];
    if (next === shown) next = others[(others.indexOf(next) + 1) % others.length];
    shown = next;
    el.textContent = next;
    if (el.animate) {
      // In its own place: a squash and a fade, never a move, so it can't ride up over the label.
      el.animate([{ transform: 'scaleY(0.6)', opacity: 0.35 }, { transform: 'none', opacity: 0.85 }],
                 { duration: gaps[k], easing: 'ease-out' });
    }
    if (k >= gaps.length - 5) playSound('tick');
    setTimeout(flick, gaps[k++]);
  };
  el.classList.add('is-spinning');
  // The first letter goes in before the screen is drawn, so the answer never
  // shows first; the rest wait for that frame, or a screen that was slow to
  // draw (a room rebuilding its frame) swallowed the first flicks unseen.
  let rolling = false;
  const roll = () => { if (!rolling) { rolling = true; setTimeout(flick, gaps[k++]); } };
  shown = others[Math.floor(Math.random() * others.length)];
  el.textContent = shown;
  requestAnimationFrame(roll);
  setTimeout(roll, 250);
}

/* --- 11. Hold to see your role ----------------------------------------------- */

// A pass-the-phone role shows only while a finger (or Space, or the mouse) is
// on the card, so it is gone before the phone changes hands. The done button
// appears once the role has been up for HOLD_SEEN_MS. Delegated, so a card in
// any screen works with no setup: `.hold-card`, with `data-next` naming the
// button to show.
const HOLD_SEEN_MS = 450;
let holdNow = null;   // { card, id, since }

function holdCardReset(card) {
  if (!card) return;
  if (holdNow && holdNow.card === card) holdNow = null;
  card.classList.remove('is-holding', 'is-seen');
  const back = card.querySelector('.hold-card__back');
  if (back) back.setAttribute('aria-hidden', 'true');
  const next = card.dataset.next && document.getElementById(card.dataset.next);
  if (next) next.classList.add('is-waiting');
}

function holdStart(card, id) {
  if (holdNow) return;
  holdNow = { card: card, id: id, since: Date.now() };
  card.classList.add('is-holding');
  const back = card.querySelector('.hold-card__back');
  if (back) back.removeAttribute('aria-hidden');
  haptic('light');
}

function holdEnd() {
  if (!holdNow) return;
  const { card, since } = holdNow;
  holdNow = null;
  card.classList.remove('is-holding');
  const back = card.querySelector('.hold-card__back');
  if (back) back.setAttribute('aria-hidden', 'true');
  if (Date.now() - since < HOLD_SEEN_MS) return;
  card.classList.add('is-seen');
  const next = card.dataset.next && document.getElementById(card.dataset.next);
  if (next) next.classList.remove('is-waiting');
}

document.addEventListener('pointerdown', (e) => {
  const card = e.target.closest && e.target.closest('.hold-card');
  if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();                          // no text selection, no callout
  try { card.setPointerCapture(e.pointerId); } catch (err) { /* a finger that already lifted */ }
  holdStart(card, e.pointerId);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) =>
  document.addEventListener(type, (e) => { if (holdNow && holdNow.id === e.pointerId) holdEnd(); }));
document.addEventListener('contextmenu', (e) => { if (e.target.closest && e.target.closest('.hold-card')) e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && e.target.classList && e.target.classList.contains('hold-card')) {
    e.preventDefault();
    holdStart(e.target, 'key');
  }
});
document.addEventListener('keyup', (e) => { if ((e.key === ' ' || e.key === 'Enter') && holdNow && holdNow.id === 'key') holdEnd(); });
window.addEventListener('blur', holdEnd);
document.addEventListener('visibilitychange', holdEnd);

/* --- 12. Going back, the icon flies home ------------------------------------- */

// Which kind of tile opened the game last (catalogOpen), so the icon goes back
// to that one: the recent tile, or the card in its section.
const catalogReturn = { id: '', kind: '' };

/**
 * Measures the hero icon of the screen being left, before setView hides it,
 * and returns what to call once the home, مع بعض or الأدوات is drawn.
 */
function heroHomeFlight(previous, next) {
  if (motionOff() || ['menu', 'together', 'tools'].indexOf(next) === -1) return null;
  const view = document.getElementById('view-' + previous);
  const icon = view && view.querySelector('.game-hero .game-hero__icon');
  if (!icon || !icon.getClientRects().length) return null;
  const g = (typeof GAME_CATALOG !== 'undefined' ? GAME_CATALOG : []).find((x) => x.setup === previous);
  if (!g) return null;
  const from = icon.getBoundingClientRect();
  const fromFont = parseFloat(getComputedStyle(icon).fontSize);
  return () => {
    const home = document.getElementById('view-' + next);
    if (!home) return;
    const kind = catalogReturn.id === g.id ? catalogReturn.kind : '';
    const recentSel = '.recent-tile[data-game="' + g.id + '"] .recent-tile__icon';
    const cardSel = '.gcard[data-game="' + g.id + '"] .gcard__icon, .tool-item[data-game="' + g.id + '"] .tool-icon';
    // Opened from a first visit's start card: that home is gone once a game has
    // been opened (the recent row has it now), so the icon goes home to its tile.
    const sels = kind === 'recent' ? [recentSel]
      : kind === 'start' ? ['.start-card[data-start="' + g.id + '"] .start-card__icon', recentSel, cardSel]
      : [cardSel];
    const onScreen = (el) => {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.bottom > 0 && r.top < window.innerHeight;
    };
    let target = null;
    for (const sel of sels) { target = [...home.querySelectorAll(sel)].find(onScreen); if (target) break; }
    if (target) flyEmoji(g.icon, from, fromFont, target, { duration: 520, arc: 24 });
  };
}

/**
 * The points you just won, floating from where you won them onto your row of
 * the board. Only ever for this phone's own answer - a number leaving someone
 * else's tap means nothing. Transform and opacity only, and it is removed by a
 * timer as well as by the animation, which may never fire.
 */
function flyPoints(text, fromRect, target) {
  if (!fromRect || !target || motionOff() || !document.body.animate) return false;
  const to = restingRect(target);
  if (!to.width) return false;

  const ghost = document.createElement('div');
  ghost.className = 'fly-points';
  ghost.textContent = text;
  document.body.appendChild(ghost);
  const size = ghost.getBoundingClientRect();
  const fromX = fromRect.left + fromRect.width / 2;
  const fromY = fromRect.top + fromRect.height / 2;
  ghost.style.left = (fromX - size.width / 2) + 'px';
  ghost.style.top = (fromY - size.height / 2) + 'px';
  const dx = to.left + to.width / 2 - fromX;
  const dy = to.top + to.height / 2 - fromY;

  const flight = ghost.animate([
    { transform: 'translate(0px, -4px) scale(1)', opacity: 1 },
    { transform: 'translate(' + (dx * 0.5) + 'px, ' + (dy * 0.5 - 18) + 'px) scale(1.15)', opacity: 1, offset: 0.55 },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0.7)', opacity: 0 }
  ], { duration: 780, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });

  let landed = false;
  const land = () => {
    if (landed) return;
    landed = true;
    if (ghost.isConnected) ghost.remove();
    if (target.isConnected) {
      target.classList.add('motion-landed');
      setTimeout(() => target.classList.remove('motion-landed'), 500);
    }
  };
  flight.onfinish = land;
  setTimeout(land, 1100);
  return true;
}

/**
 * A word slammed over the whole screen for a beat: "✋ الأتوبيس وقف!" the
 * moment someone closes the round. Nothing under it takes a tap, and it is
 * removed by a timer rather than by an animation event - a suppressed
 * animation fires none at all. Silent by design: any cue belongs to the room
 * (playRoomFx), so a table with a TV hears it once.
 */
function slamBanner(word, sub) {
  if (motionOff()) return null;
  const el = document.createElement('div');
  el.className = 'slam';
  el.innerHTML = `<div class="slam__word">${escapeHTML(word)}</div>` +
                 (sub ? `<div class="slam__sub">${escapeHTML(sub)}</div>` : '');
  document.body.appendChild(el);
  setTimeout(() => { if (el.isConnected) el.remove(); }, 1200);
  return el;
}

/* ---------------------------------------------------------------------------
   The last three seconds. One helper for every clock that already marks itself
   urgent, so there is one convention rather than one per game.
   --------------------------------------------------------------------------- */

const COUNT_LAST_SECONDS = 3;
let countEdgeEl = null;

/**
 * `el` is the number the player is watching; `seconds` is the whole seconds
 * left. At 3, at 2 and at 1 it pops once - keyed on the second itself, so a
 * clock that repaints several times inside one second still pops once - and a
 * warning rim breathes at the edge of the screen that number is on. Anything
 * above three seconds, or zero, clears both. A clock with no element on this
 * screen (the TV's number on a phone) does nothing at all.
 */
function countdownUrgency(el, seconds) {
  if (!el) return;
  const left = Math.max(0, Math.ceil(Number(seconds) || 0));
  const at = left > 0 && left <= COUNT_LAST_SECONDS ? String(left) : '';
  if (el.dataset.countAt !== at) {
    el.dataset.countAt = at;
    el.classList.remove('is-count-pop');
    if (at && !motionOff()) {
      void el.offsetWidth;                       // the same animation restarts only after a reflow
      el.classList.add('is-count-pop');
      // Removed by a timer: a suppressed animation fires no end event.
      setTimeout(() => { if (el.dataset.countAt === at) el.classList.remove('is-count-pop'); }, 1000);
    }
  }
  countdownEdge(at ? el : null);
}

/**
 * The rim, one element at the root of the screen the counting number is on -
 * and only while that screen is the one being looked at, so a clock still
 * running in a room the player has stepped away from lights nothing.
 */
function countdownEdge(el) {
  const host = el && !motionOff() ? el.closest('[id^="view-"]') : null;
  const view = host && host.id === 'view-' + appState.currentView ? host : null;
  if (countEdgeEl && countEdgeEl.parentElement !== view) {
    const old = countEdgeEl.parentElement;
    countEdgeEl.remove();
    if (old) old.classList.remove('has-count-edge');
    countEdgeEl = null;
  }
  if (!view || countEdgeEl) return;
  countEdgeEl = document.createElement('div');
  countEdgeEl.className = 'count-edge';
  countEdgeEl.setAttribute('aria-hidden', 'true');
  view.classList.add('has-count-edge');
  view.insertBefore(countEdgeEl, view.firstChild);
}

/** A clock that has stopped: the rim goes, and no number is left mid-pop. */
function countdownClear() {
  countdownEdge(null);
  document.querySelectorAll('.is-count-pop').forEach((el) => {
    el.classList.remove('is-count-pop');
    delete el.dataset.countAt;
  });
}

onLeaveScreen(() => countdownClear());

/* --- 13. Motion everywhere ----------------------------------------------------
   The owner (26 Sep 2026): "Smooth, nice motion everywhere, on every screen and
   not only in some games." The games keep their own choreography; this is the
   small system the plain screens share (Style.html section 41):
   - a screen that is entered rises in: its first cards come up one after
     another (motionEnterView from setView, only for the screens viewRises
     allows, and only when the screen changed - never on a redraw);
   - a popup opens with a spring and its rows rise the same way (hoistModals'
     observer in JS_Core.html calls motionRiseModal);
   - chips and segmented options give under the finger and spring back;
   - a number a control changed pops (motionBump: steppers, the counter, the
     timer), a select's label flashes when its choice changes, and a Start
     that has just become possible breathes once (motionNudge);
   - a list of rows rewritten: whoever stays slides, whoever left fades
     where they stood (motionRowsSwap: the room lobby).
   All of it is Web Animations of `translate`, `scale` and `opacity` - the
   individual properties, so they add to whatever `transform` a component or a
   game already uses - with no fill after the end, so nothing is left on an
   element; every run is also finished by a timer, never only by an event.
   Nothing runs when motionOff() (the app's own setting, reduced motion, a
   hidden page), nothing moves while a screen sits still, and at most eight
   things move at once.
   ========================================================================= */

const RISE = { max: 8, step: 40, dur: 320, dist: 12, delay: 0 };
const RISE_EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';    // --ease-out

/* The screens that rise in when entered: columns of cards - every setup screen
   (the daily hub, أرقامي and the archive among them), the card score keepers'
   tables, the room's join screen and lobby, and a few tool screens.
   Left out on purpose: the home, مع بعض and الأدوات (.view-stagger: their own
   sequence, first visit only, settleStagger), every other play-* and room-*
   screen (the games' own choreography: cards flying, dice, boards, 3D, reveals
   keyed with data-reveal-ms - a rise on top would fight it), the TV and the
   full-screen tools. A screen listed here that later gets an entrance of its
   own goes in RISE_SKIP. */
const RISE_VIEW_PREFIXES = ['setup-', 'play-cs-'];
const RISE_VIEWS = ['room-lobby', 'room-join', 'timers', 'play-universal', 'play-tourney', 'results-teams', 'input-whoami'];
const RISE_SKIP = [];

function viewRises(id) {
  if (!id || RISE_SKIP.indexOf(id) !== -1) return false;
  return RISE_VIEWS.indexOf(id) !== -1 || RISE_VIEW_PREFIXES.some((p) => id.indexOf(p) === 0);
}

/** Up to `max` visible children of root that are on screen; a lone wrapper is looked through. */
function motionRiseTargets(root, max) {
  const shown = (el) => !el.classList.contains('hidden') && el.getClientRects().length > 0;
  let kids = [...root.children].filter(shown);
  for (let depth = 0; kids.length === 1 && kids[0].children.length > 1 && depth < 3; depth++) {
    kids = [...kids[0].children].filter(shown);
  }
  const bottom = window.innerHeight || document.documentElement.clientHeight;
  const onScreen = (el) => el.getBoundingClientRect().top < bottom;
  const visible = kids.filter(onScreen);
  // More on screen than `max` (the settings sheet's rows): the ones past it rise
  // with the last of them rather than showing first - a lower row standing
  // before the rows above it have come in reads as a glitch. Only what is on
  // screen, so a long list is never more than a screenful.
  if (visible.length > max) return visible.slice(0, 16);
  let picked = visible;
  // Two or three big cards (a setup screen is a hero and a panel): their first
  // rows rise inside them too, a cascade, still `max` things in all, top to bottom.
  if (picked.length && picked.length < 4) {
    const inner = [];
    picked.forEach((card) => [...card.children].filter(shown).filter(onScreen).forEach((c) => inner.push(c)));
    picked = picked.concat(inner.slice(0, max - picked.length))
      .map((el) => ({ el, top: el.getBoundingClientRect().top }))
      .sort((a, b) => a.top - b.top).map((x) => x.el);
  }
  return picked;
}

/** The first cards of root rise into place one after another. */
function motionRiseIn(root, opts) {
  if (!root || motionOff() || !root.animate) return [];
  const o = Object.assign({}, RISE, opts || {});
  const anims = motionRiseTargets(root, o.max).map((el, i) => el.animate(
    // One keyframe at the start: the element's own opacity and place are where it ends.
    [{ opacity: 0, translate: '0 ' + o.dist + 'px', offset: 0 }],
    { duration: o.dur, delay: o.delay + Math.min(i, o.max - 1) * o.step, easing: RISE_EASE, fill: 'backwards' }
  ));
  if (anims.length) {
    setTimeout(() => anims.forEach((a) => { try { a.finish(); } catch (e) {} }),
      o.delay + o.max * o.step + o.dur + 300);
  }
  return anims;
}

/** setView's hook: a screen just entered (never the same one drawn again). */
function motionEnterView(viewEl, id, previous) {
  if (!viewEl || id === previous || !viewRises(id) || viewEl.classList.contains('view-stagger')) return;
  // After whatever the caller draws into the screen in the same task.
  // A popup opened over it in the same moment has the stage (its own rows rise).
  queueMicrotask(() => {
    if (appState.currentView !== id || document.querySelector('.modal-overlay:not(.hidden)')) return;
    motionRiseIn(viewEl, { delay: 30 });
  });
}

/** A popup just opened: its rows rise under the spring (Style.html section 41). */
function motionRiseModal(overlay) {
  const content = overlay && overlay.querySelector('.modal-content');
  if (!content) return;
  const box = content.classList.contains('modal-content--simple') ? content
    : (content.querySelector('.sheet__body') || content);
  motionRiseIn(box, { delay: 70, step: 32, dist: 10, max: 7 });
}

/** A number or a label that just changed gives a small pop. */
function motionBump(el, amount) {
  if (!el || !el.animate || motionOff()) return;
  const k = String(amount || 1.14);
  el.animate([{ scale: '1' }, { scale: k, offset: 0.35 }, { scale: '1' }], { duration: 320, easing: 'ease-out' });
}

/** A button that has just become possible (the lobby's Start once enough are in) breathes once. */
function motionNudge(el) {
  if (!el || !el.animate || motionOff() || !el.getClientRects().length) return;
  el.animate([{ scale: '1' }, { scale: '1.06', offset: 0.3 }, { scale: '0.99', offset: 0.65 }, { scale: '1' }],
    { duration: 620, easing: 'ease-in-out' });
}

/* Chips and segmented options give under the finger and spring back. The
   press is the `scale` property, so it adds to whatever the chip's own look
   does with `transform`. */
const PRESS_TARGETS = '.filter-chip, .chip, .pick-chip, .opt-chip, .segmented__item';
let pressHeld = null;   // { el, anim }
function pressLetGo() {
  if (!pressHeld) return;
  const { el, anim } = pressHeld;
  pressHeld = null;
  anim.cancel();
  if (!motionOff() && el.isConnected) {
    el.animate([{ scale: '0.93' }, { scale: '1.04', offset: 0.55 }, { scale: '1' }], { duration: 280, easing: 'ease-out' });
  }
}
document.addEventListener('pointerdown', (e) => {
  pressLetGo();
  const el = e.target.closest && e.target.closest(PRESS_TARGETS);
  if (!el || el.disabled || !el.animate || motionOff()) return;
  pressHeld = { el, anim: el.animate([{ scale: '1' }, { scale: '0.93' }], { duration: 110, easing: 'ease-out', fill: 'forwards' }) };
}, { passive: true });
['pointerup', 'pointercancel'].forEach((type) => document.addEventListener(type, pressLetGo, { passive: true }));

/* A choice changed in a list: its label flashes once (a <select>'s own box can't animate). */
document.addEventListener('change', (e) => {
  const sel = e.target;
  if (!sel || sel.tagName !== 'SELECT' || motionOff()) return;
  const field = sel.closest('.field, .switch-row, label');
  const prev = sel.previousElementSibling;
  const label = (field && field.querySelector('.field__label')) || (prev && prev.tagName === 'LABEL' ? prev : null);
  if (!label || !label.animate) return;
  label.animate([{ opacity: 1, scale: '1' }, { opacity: 0.4, scale: '1.05', offset: 0.3 }, { opacity: 1, scale: '1' }],
    { duration: 420, easing: 'ease-out' });
});

/**
 * Rewrites a list of rows (mutate) so that whoever stays slides from where they
 * were and whoever left fades out where they stood. Rows are matched by the
 * text of their name (`.status-row__name`, unique in a room). The ghost of a
 * row that left is the old row itself, laid over the list with no ids, and
 * removed by a timer as well as by its animation.
 */
function motionRowsSwap(list, mutate) {
  if (!list || !list.animate || motionOff() || !list.getClientRects().length) { mutate(); return; }
  const keyOf = (r) => ((r.querySelector('.status-row__name') || r).textContent || '').trim();
  const before = new Map();
  [...list.children].forEach((r) => {
    if (!r.classList.contains('motion-row-ghost')) before.set(keyOf(r), { rect: r.getBoundingClientRect(), node: r });
  });
  mutate();
  if (!before.size) return;
  const after = new Set();
  let moved = 0;
  [...list.children].forEach((r) => {
    const k = keyOf(r);
    after.add(k);
    const b = before.get(k);
    if (!b || moved >= RISE.max) return;
    const dy = b.rect.top - r.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) {
      moved++;
      r.animate([{ translate: '0 ' + Math.round(dy) + 'px', offset: 0 }], { duration: 340, easing: RISE_EASE });
    }
  });
  let gone = 0;
  before.forEach((b, k) => {
    if (after.has(k) || gone >= 4 || !b.rect.height) return;
    gone++;
    if (getComputedStyle(list).position === 'static') list.style.position = 'relative';
    const box = list.getBoundingClientRect();
    const g = b.node;
    g.classList.add('motion-row-ghost');
    g.setAttribute('aria-hidden', 'true');
    g.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
    g.style.top = (b.rect.top - box.top - list.clientTop + list.scrollTop) + 'px';
    g.style.left = (b.rect.left - box.left - list.clientLeft + list.scrollLeft) + 'px';
    g.style.width = b.rect.width + 'px';
    g.style.height = b.rect.height + 'px';
    list.appendChild(g);
    const done = () => { if (g.parentNode) g.remove(); };
    const a = g.animate([{ opacity: 1, scale: '1' }, { opacity: 0, scale: '0.96' }], { duration: 300, easing: 'ease-in', fill: 'forwards' });
    a.onfinish = done;
    setTimeout(done, 420);
  });
}

// After the room has drawn itself for this state.
Room.onChange((state) => { if (state) setTimeout(() => animateScoreboards(state), 0); });
window.addEventListener('resize', () => requestAnimationFrame(syncNavPill));
</script>
