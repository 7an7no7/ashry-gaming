<script>
/* ============================================================================
   THE GAME CATALOG
   ----------------------------------------------------------------------------
   One registry of everything the app can play, and the home screen, the hero
   on every setup screen and the "recently played" row are all drawn from it.
   A game that is not in here is not on the menu. Its entries are GAME_LIST
   (Games.js, shared with the rooms server, where every field is described);
   the page adds what a card does when tapped.
   ========================================================================= */
const CATALOG_GROUPS = [
  { id: 'deduce', icon: '🕵️', title: 'grp_deduce' },
  { id: 'words',  icon: '🗣️', title: 'grp_words' },
  { id: 'party',  icon: '🎉', title: 'grp_party' },
  { id: 'quiz',   icon: '🧠', title: 'grp_quiz' },
  { id: 'table',  icon: '🃏', title: 'grp_table' },
  { id: 'duo',    icon: '🤝', title: 'grp_duo' },
  { id: 'sports', icon: '🏅', title: 'grp_sports' },
  { id: 'puzzle', icon: '🧩', title: 'grp_puzzle' },
  { id: 'brain',  icon: '📝', title: 'grp_brain' },
  { id: 'tools',  icon: '🛠️', title: 'grp_tools' }
];

const GAME_CATALOG = GAME_LIST.map(g => Object.assign({}, g, { open: () => catalogRunOpen(g) }));

/** What a card does: its own `open` (a function's name, or [name, argument]), else its
    setup screen, else a room for it. A name is looked up as the page's global. */
function catalogRunOpen(g) {
  const o = g.open;
  if (o) {
    const name = Array.isArray(o) ? o[0] : o;
    const fn = typeof window[name] === 'function' ? window[name] : (0, eval)(name);
    return fn.apply(null, Array.isArray(o) ? o.slice(1) : []);
  }
  if (g.setup) return setView(g.setup);
  return roomCreateFor((g.room && g.room.id) || g.id);
}

/** The chess clock (a tool with no setup screen of its own). */
function openChessClock() {
  setView('play-chess');
  updateChessUI();
}

/** A table game's score keeper, from the tools: its setup, turned to the "at the table" side. */
function openTableCalc(gameId) {
  // This visit only: from the home the game opens on the game in the app again
  // (PLAY_MODE_DEFAULT in JS_RoomGames.html), unless the table picked a side itself.
  if (typeof playModeOnce !== 'undefined') playModeOnce = { id: gameId, mode: 'device' };
  else rememberOptions('playMode', { [gameId]: 'device' });
  setView('setup-' + gameId);
}

const CATALOG_BY_ID = {};
GAME_CATALOG.forEach(g => { CATALOG_BY_ID[g.id] = g; });

/* Chess is one card on the home (the owner, 24 Sep 2026): its other ways to play
   carry `hub: 'shatranj'`, stay out of the sections and the recent row, answer a
   search by name, and are a row of chips on the chess screens (HUB_WAYS). */
const HUB_WAYS = {
  // تحدي المعلومات: the room and the board, and «اعمل مسابقتك» (the family's own questions).
  trivia: [['trivia', 'trivia_way_play'], ['quizmaker', 'trivia_way_make']],
  shatranj: [['shatranj', 'chess_way_classic'], ['chesspuzzle', 'chess_way_puzzles'], ['votechess', 'chess_way_vote'],
             ['handbrain', 'chess_way_handbrain'], ['bughouse', 'chess_way_bughouse'], ['chess4', 'chess_way_chess4']]
};
/** The card a game lives under on the home: its hub's, or its own. */
const catalogHomeId = (id) => (CATALOG_BY_ID[id] && CATALOG_BY_ID[id].hub) || id;

/** The row of a hub's ways, for the screens of the hub's games; '' for any other game. */
function hubWaysHtml(g, t) {
  const ways = HUB_WAYS[g.hub || g.id];
  if (!ways) return '';
  return `<div class="hub-ways">
      <div class="eyebrow">${escapeHTML(t.chess_ways_label || '')}</div>
      <div class="filter-row hscroll-fade" role="group">${ways.map(([id, key]) => {
        const w = CATALOG_BY_ID[id];
        if (!w) return '';
        const on = id === g.id;
        if (catalogOff(id)) return `<button type="button" class="filter-chip is-off" data-accent="${w.accent}" onclick="gameOffToast()"><span aria-hidden="true">🛠️</span>${escapeHTML(t[key] || catalogTitle(w, t))}</button>`;
        return `<button type="button" class="filter-chip ${on ? 'is-active' : ''}" aria-pressed="${on}" data-accent="${w.accent}"
                  ${on ? '' : `onclick="catalogOpen('${id}', this)"`}><span aria-hidden="true">${iconHtml(w.icon)}</span>${escapeHTML(t[key] || catalogTitle(w, t))}${(w.modes || []).indexOf('device') === -1 ? ' <span aria-hidden="true">📲</span>' : ''}</button>`;
      }).join('')}</div>
    </div>`;
}

/* The three ways of playing, as the badges on a card and the chips in the
   filter row. tv is a room shown on a big screen, so a game that plays in a
   room and has a TV layout carries both. */
const PLAY_MODES = {
  device: { icon: '📱', label: 'mode_badge_device', short: 'mode_short_device' },
  room:   { icon: '📲', label: 'mode_badge_room',   short: 'mode_short_room' },
  tv:     { icon: '📺', label: 'mode_badge_tv',     short: 'mode_short_tv' }
};

const HOME_FILTERS = [
  { id: 'all',    icon: '✨', label: 'flt_all' },
  { id: 'device', icon: '📱', label: 'flt_device' },
  { id: 'room',   icon: '📲', label: 'flt_room' },
  { id: 'tv',     icon: '📺', label: 'flt_tv' },
  { id: 'duo',    icon: '🤝', label: 'flt_duo' },
  { id: 'solo',   icon: '🧘', label: 'flt_solo' }
];

/** Does a catalog entry pass a filter chip? */
function catalogMatchesFilter(g, filter) {
  switch (filter) {
    case 'all':    return true;
    case 'tools':  return g.group === 'tools';
    case 'device': return (g.modes || []).indexOf('device') !== -1;
    case 'room':   return (g.modes || []).indexOf('room') !== -1;
    case 'tv':     return (g.modes || []).indexOf('tv') !== -1;
    case 'duo':    return !!g.players && g.players[0] <= 2 && g.players[1] <= 4;
    case 'solo':   return !!g.players && g.players[0] === 1;
  }
  return true;
}

/* --- Recently played -------------------------------------------------------
   The last few games opened on this phone, newest first. A family that plays
   the same three games most evenings should not scroll for them.
   -------------------------------------------------------------------------- */
const RECENT_KEY = 'ashryRecent_v1';
const RECENT_MAX = 6;

function readRecent() {
  try {
    const ids = (JSON.parse(localStorage.getItem(RECENT_KEY) || '[]') || []).filter(id => CATALOG_BY_ID[id]).map(catalogHomeId);
    return ids.filter((id, i) => ids.indexOf(id) === i);
  }
  catch (e) { return []; }
}

function rememberRecent(id) {
  id = catalogHomeId(id);
  // Tools have their own tab and never show in the home's recent row, so they
  // must not take a game's place in it either.
  if (CATALOG_BY_ID[id] && CATALOG_BY_ID[id].group === 'tools') return;
  const list = [id].concat(readRecent().filter(x => x !== id)).slice(0, RECENT_MAX);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
}

function forgetRecent() {
  try { localStorage.removeItem(RECENT_KEY); } catch (e) {}
}

/** Every card and every recent tile goes through here. `fromEl` is what was tapped, for the icon's flight. */
/* How often each game is played, the improvement plan's numbers (25 Sep 2026):
   a game started from a setup screen on this phone sends its id to the rooms
   server, which keeps a count per game and month - no name, nothing else.
   Rooms are counted on the server when a game is dealt. */
function countPlay(id) {
  try {
    const base = String(window.ROOMS_URL || '').replace(/\/+$/, '');
    if (!base || !navigator.sendBeacon || navigator.onLine === false) return;
    navigator.sendBeacon(base + '/count', JSON.stringify({ game: id }));
  } catch (e) { /* a count is never worth an error */ }
}
/* «في غلطة؟» (the improvement plan, Phase 3): a small button under a revealed
   answer sends the item to the rooms server's list of reports (`/report`: the
   game, the language and the item's text, nothing else), which is read with
   `npm run reports` and fixed in the bank by hand. One tap per item a visit. */
const reportedItems = new Set();
function reportBtnHtml(game, text) {
  const t = TRANSLATIONS[appState.lang] || {};
  const key = game + '|' + text;
  const done = reportedItems.has(key);
  return `<button type="button" class="report-btn" ${done ? 'disabled' : ''}
            onclick="reportItem(this, '${jsStringAttr(game)}', '${jsStringAttr(String(text).slice(0, 160))}')">${escapeHTML(done ? (t.report_thanks || '') : '⚑ ' + (t.report_btn || ''))}</button>`;
}
function reportItem(btn, game, text) {
  const t = TRANSLATIONS[appState.lang] || {};
  reportedItems.add(game + '|' + text);
  try {
    const base = String(window.ROOMS_URL || '').replace(/\/+$/, '');
    if (base && navigator.sendBeacon) navigator.sendBeacon(base + '/report', JSON.stringify({ game, text, lang: contentLang() }));
  } catch (e) { /* a report is never worth an error */ }
  if (btn) { btn.disabled = true; btn.textContent = t.report_thanks || ''; }
  showToast(t.report_toast || '', 'success');
  haptic('light');
}

if (typeof onLeaveScreen === 'function') onLeaveScreen((from, to) => {
  if (!from || from.indexOf('setup-') !== 0 || typeof exitGameOf !== 'function') return;
  const g = exitGameOf(to || '');
  if (g && g.id) { countPlay(g.id); markPlayed(g.id); }
});

/* Games this phone has started (the owner's pick D1, look B, 7 Oct 2026): the home's
   «جرّبوا دي» poster deals from the ones it hasn't, «✨ لسه ما جربتوهاش». A game
   counts once it was started - a setup's Start (the same moment countPlay
   counts it) or a room dealing it (markRoomPlayed, from routeRoomState) - not
   when its setup was only looked at. Kept by home card (a chess way is chess). A
   phone that had no list yet starts from its recent row, so the first poster after
   this shipped isn't one of the games played last night. */
const PLAYED_KEY = 'ashryPlayed_v1';
function readPlayed() {
  try {
    const raw = localStorage.getItem(PLAYED_KEY);
    if (raw === null) return readRecent();
    return (JSON.parse(raw) || []).filter(id => CATALOG_BY_ID[id]);
  } catch (e) { return []; }
}
function markPlayed(id) {
  const home = catalogHomeId(id);
  if (!CATALOG_BY_ID[home]) return;
  const list = readPlayed();
  if (list.indexOf(home) !== -1 && localStorage.getItem(PLAYED_KEY) !== null) return;
  if (list.indexOf(home) === -1) list.push(home);
  try { localStorage.setItem(PLAYED_KEY, JSON.stringify(list)); } catch (e) {}
}
/** A room game being played on this phone (a room game's id can differ from its card's: chess is shatranj). */
function markRoomPlayed(state) {
  if (!state || !state.game || state.phase === 'lobby' || state.youAreScreen) return;
  const g = GAME_CATALOG.find(x => x.room && (x.room.id || x.id) === state.game);
  if (g) markPlayed(g.id);
}

/* --- Games switched off for a fix (DisabledGames.js) ------------------------ */
const catalogOff = (id) => typeof gameIsOff === 'function' && gameIsOff(id);
/** The badge a switched-off game carries on every card. */
const gameOffBadge = (t) => `<span class="game-off-badge">🛠️ ${escapeHTML(t.game_off || '')}</span>`;
function gameOffToast() {
  const t = TRANSLATIONS[appState.lang] || {};
  showToast(t.game_off_toast || '', 'info');
  haptic('light');
}
/** The catalog game a screen belongs to, when that game is switched off (setView sends it home). */
function gameOffForView(viewId) {
  if (typeof DISABLED_GAMES === 'undefined' || !DISABLED_GAMES.length || !viewId || typeof GAME_CATALOG === 'undefined') return null;
  // exitGameOf has no game for the tools and the screens without an exit (the quiz
  // maker, the score keepers, the spinner, the chess clock): find those by the setup
  // above them or by their help entry, or a reload would open them while switched off.
  const up = ((typeof VIEW_META !== 'undefined' && VIEW_META[viewId]) || {}).up || '';
  // Never a room's screen: a room already playing a game switched off plays it to its end.
  const helpId = typeof HELP_FOR_VIEW !== 'undefined' && viewId.indexOf('room-') !== 0 ? HELP_FOR_VIEW[viewId] : null;
  const g = GAME_CATALOG.find(x => x.setup === viewId) || GAME_CATALOG.find(x => x.setup && x.setup === up)
    || (helpId && GAME_CATALOG.find(x => x.id === helpId)) || (typeof exitGameOf === 'function' ? exitGameOf(viewId) : null);
  return g && catalogOff(g.id) ? g : null;
}

function catalogOpen(id, fromEl, grow) {
  const g = CATALOG_BY_ID[id];
  if (!g) return;
  if (catalogOff(id)) { gameOffToast(); return; }
  // Its code first (JS_Lazy.html), then this again: the home stays until it has run.
  if (typeof lzWait === 'function' && lzWait(lzChunksOfGame(id), () => catalogOpen(id, fromEl, grow))) return;
  rememberRecent(id);
  if (typeof catalogReturn !== 'undefined') {
    catalogReturn.id = id;
    catalogReturn.kind = fromEl && fromEl.classList.contains('recent-tile') ? 'recent'
      : fromEl && fromEl.classList.contains('start-card') ? 'start' : 'card';
  }
  // A poster tapped (grow, from the card's own onclick) becomes the game's header
  // as the screen changes: a view transition where the browser has them (look 4A).
  // Only a tap: a view transition changes the screen a frame later, and the
  // callers that read the screen straight after (الليلة دي؟) keep the old way.
  if (grow && typeof catalogGrowOpen === 'function' && catalogGrowOpen(g, fromEl)) return;
  const fly = typeof catalogIconFlight === 'function' ? catalogIconFlight(g, fromEl) : null;
  const before = appState.currentView;
  g.open();
  if (fly && appState.currentView !== before) fly();
}

/* --- Pieces shared by the home and the heroes ----------------------------- */

const catalogTitle = (g, t) => t[g.title] || g.id;
const catalogDesc = (g, t) => t[g.desc] || '';

/** "👥 3–12 · ⏱ 10 min" plus the mode badges. */
function catalogMeta(g, t, withModeLabels, withModes) {
  const bits = [];
  if (g.players) {
    const [min, max] = g.players;
    bits.push(`<span class="meta-bit"><span class="people-glyph" aria-hidden="true">👥</span><span class="metric">${min === max ? min : min + '–' + max}</span></span>`);
  }
  if (g.mins) {
    bits.push(`<span class="meta-bit"><span aria-hidden="true">⏱</span><span class="metric">${g.mins}</span> ${escapeHTML(t.meta_min || '')}</span>`);
  }
  if (withModes !== false) (g.modes || []).forEach(m => {
    const mode = PLAY_MODES[m];
    if (!mode) return;
    bits.push(withModeLabels
      ? `<span class="meta-bit meta-bit--mode"><span aria-hidden="true">${mode.icon}</span>${escapeHTML(t[mode.label] || '')}</span>`
      : `<span class="meta-bit meta-bit--mode" title="${escapeHTML(t[mode.label] || '')}" aria-label="${escapeHTML(t[mode.label] || '')}">${mode.icon}</span>`);
  });
  return bits.join('');
}

/* Every game is a poster (section 39 of Style.html): its icon big on its own
   colour, the players as a badge, the name at the foot. The description is the
   tooltip; the ways it plays are on its setup's hero (the owner, 27 Sep 2026:
   no mode icons on the posters). */
function catalogCard(g, t) {
  const off = catalogOff(g.id);
  const players = off ? gameOffBadge(t) : g.players ? `<span class="gcard__badge"><span class="people-glyph" aria-hidden="true">👥</span><span class="metric">${g.players[0] === g.players[1] ? g.players[0] : g.players[0] + '–' + g.players[1]}</span></span>` : '';
  return `
    <button type="button" class="gcard${off ? ' is-off' : ''}" data-accent="${g.accent}" data-game="${g.id}" onclick="catalogOpen('${g.id}', this, true)"
            title="${escapeHTML(catalogDesc(g, t))}">
      <span class="gcard__icon" aria-hidden="true">${iconHtml(g.icon)}</span>
      ${players}
      ${!off && catalogIsNew(g) ? catalogNewTag(t) : ''}
      <span class="gcard__title">${escapeHTML(catalogTitle(g, t))}</span>
    </button>`;
}

/* «جديد» on a new game's poster and its recent tile (the owner's pick 1208, 7 Oct
   2026): a game whose GAME_LIST entry has `added` carries it for 14 days from that
   date, and no longer once this phone has played it (readPlayed). It simply
   expires: nothing to take off after a release. */
const CATALOG_NEW_DAYS = 14;
function catalogIsNew(g) {
  if (!g || !g.added) return false;
  const at = Date.parse(g.added + 'T00:00:00');
  if (!isFinite(at) || Date.now() - at > CATALOG_NEW_DAYS * 864e5 || Date.now() < at) return false;
  return readPlayed().indexOf(g.id) === -1;
}
function catalogNewTag(t, small) {
  return `<span class="gcard-new${small ? ' gcard-new--sm' : ''}">${escapeHTML(t.cat_new || '')}</span>`;
}

/* The home's featured game («★ الليلة دي»): one of the starter shelf, a
   different one each day, as a big poster with its own play button. It is a
   .gcard with data-game, so the filters and the icon flights treat it as a
   card (a search or a chip hides it like any other). */
let featLastId = null;   // the game the featured poster last showed, this visit
function catalogFeatured(t) {
  const shelf = (typeof STARTER_SHELF !== 'undefined' ? STARTER_SHELF : []).map(id => CATALOG_BY_ID[id]).filter(g => g && !catalogOff(g.id));
  if (!shelf.length) return '';
  // A different one each time the home opens (the owner, 26 Sep 2026), dealt
  // through freshPick so all eight come round before one comes back.
  // Someone who has played before gets a game this phone has never started (D1,
  // 7 Oct 2026): the first twelve of those in «الليلة دي؟»'s order, the party games
  // first, dealt through freshPick like the starters. Played everything: the starters.
  const played = readRecent().length ? readPlayed() : null;
  const untried = played ? TONIGHT_ORDER.filter(id => CATALOG_BY_ID[id] && !catalogOff(id) && played.indexOf(id) === -1).slice(0, 12) : [];
  const ids = untried.length ? untried : shelf.map(x => x.id);
  const picked = typeof freshPick === 'function' ? freshPick(untried.length ? 'home_feat_new' : 'home_feat', ids, 1)[0] : ids[Math.floor(Math.random() * ids.length)];
  const g = CATALOG_BY_ID[picked] || shelf[0];
  const tag = untried.length ? '✨ ' + (t.home_feat_new || '') : '★ ' + (t.home_feat_tag || t.home_pick_btn || '');
  const modes = (g.modes || []).map(m => PLAY_MODES[m]).filter(Boolean).map(m => t[m.short] || t[m.label] || '').filter(Boolean);
  // A new day's game fades and rises in when the home is drawn again - never on
  // the first paint of a visit, and not with motion off.
  const fresh = featLastId !== null && featLastId !== g.id && !motionOff();
  featLastId = g.id;
  return `
    <div class="gcard home-feat${fresh ? ' home-feat--in' : ''}" data-accent="${g.accent}" data-game="${g.id}" role="group" aria-label="${escapeHTML(catalogTitle(g, t))}" onclick="catalogOpen('${g.id}', this, true)">
      <span class="home-feat__art" aria-hidden="true"><span class="gcard__icon">${iconHtml(g.icon)}</span></span>
      <span class="home-feat__fade" aria-hidden="true"></span>
      <span class="home-feat__text">
        <span class="home-feat__tag">${escapeHTML(tag)}</span>
        <span class="home-feat__title">${escapeHTML(catalogTitle(g, t))}</span>
        <span class="home-feat__desc">${escapeHTML(catalogDesc(g, t))}</span>
        <span class="home-feat__meta">${catalogMeta(g, t, false, false)}${modes.length ? '<span class="home-feat__modes">' + escapeHTML(modes.join(' · ')) + '</span>' : ''}</span>
        <span class="home-feat__btns">
          <button type="button" class="home-feat__btn home-feat__btn--play" onclick="event.stopPropagation(); catalogOpen('${g.id}', this.closest('.home-feat'), true)">▶ ${escapeHTML(t.cat_play || '')}</button>
          <button type="button" class="home-feat__btn home-feat__btn--other" onclick="event.stopPropagation(); tonightOpen()">🎲 ${escapeHTML(t.home_feat_other || '')}</button>
        </span>
      </span>
    </div>`;
}

/* A section that holds one game shows it as a spotlight across the whole row
   rather than one card beside five empty places (on a TV) - which is what the
   ورق وطاولة section is, with سكرو, the game the owner calls the core of the
   app. It stays a .gcard with data-game and .gcard__icon, so the filters,
   flipGrid and both icon flights find it as they find any card. */
function catalogSpotlight(g, t) {
  return `
    <button type="button" class="gcard gcard--spotlight" data-accent="${g.accent}" data-game="${g.id}" onclick="catalogOpen('${g.id}', this, true)">
      <span class="gcard__icon" aria-hidden="true">${iconHtml(g.icon)}</span>
      <span class="gcard__body">
        <span class="gcard__title">${escapeHTML(catalogTitle(g, t))}</span>
        <span class="gcard__desc">${escapeHTML(catalogDesc(g, t))}</span>
        <span class="gcard__meta">${catalogMeta(g, t, false, true)}</span>
      </span>
      <span class="gcard__cta" aria-hidden="true">${escapeHTML(t.cat_play || '')}<span class="gcard__cta-arrow">›</span></span>
    </button>`;
}

function catalogToolRow(g, t) {
  // A tool switched off for a fix is greyed with «🛠️ بنصلّحها», as a game's card is.
  const off = catalogOff(g.id);
  // A score keeper with a game going (1233): «كمّل · الجولة ٤» under its name, ▶ on its icon, and a tap goes back to the sheet.
  const cs = !off && g.kind === 'score' && /^cs-/.test(g.id) ? g.id.slice(3) : '';
  const cont = !!cs && csHomeLive(cs);
  return `
    <button type="button" class="tool-item${off ? ' is-off' : ''}${cont ? ' has-cont' : ''}" data-accent="${g.accent}" data-game="${g.id}" onclick="${cont ? `homeContGo('cs-${cs}')` : `catalogOpen('${g.id}', this)`}">
      ${off ? gameOffBadge(t) : ''}
      <span class="tool-icon" aria-hidden="true">${iconHtml(g.icon)}${cont ? '<span class="tool-icon__cont">▶</span>' : ''}</span>
      <span class="tool-info">
        <span class="tool-name">${escapeHTML(catalogTitle(g, t))}</span>
        ${cont ? `<span class="tool-cont">${escapeHTML((t.daily_continue || '') + ' · ' + csHomeRoundLine(cs, t))}</span>` : `<span class="tool-desc">${escapeHTML(catalogDesc(g, t))}</span>`}
      </span>
      <span class="tool-chev" aria-hidden="true">›</span>
    </button>`;
}

/* --- Two small things every catalog screen does ------------------------------ */

/* The cards rise in sequence the first time a tab is drawn in a session; after
   that a tab comes back still, because a screen that re-animates on every
   return feels slow rather than alive. */
const staggeredViews = new Set();
function settleStagger(view, id) {
  view.classList.toggle('is-settled', staggeredViews.has(id));
  staggeredViews.add(id);
}

/* A horizontal row fades at the edge it can still scroll toward, so a chip cut
   at the screen edge reads as "there is more" rather than as a mistake. */
function watchScrollFade(el) {
  if (!el || el.dataset.fadeWatched) return;
  el.dataset.fadeWatched = '1';
  const update = () => {
    const cs = getComputedStyle(el);
    // The rows bleed into the gutter and snap their first chip to its edge,
    // so "at the start" is anywhere within that padding.
    const pad = (parseFloat(cs.paddingInlineStart) || 0) + 2;
    const max = el.scrollWidth - el.clientWidth;
    const pos = Math.abs(el.scrollLeft);
    el.classList.toggle('is-rtl', cs.direction === 'rtl');
    el.classList.toggle('fade-start', pos > pad);
    el.classList.toggle('fade-end', max > pad && max - pos > pad);
  };
  el.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
  requestAnimationFrame(update);
}

/* --- The home screen -------------------------------------------------------- */

const HOME_PLAYER_COUNTS = ['off', '2', '3', '4', '5', '6', '7', '8+'];
let homeFilter = 'all';
let homePlayers = recallOptions('homePlayers', 'off');
if (HOME_PLAYER_COUNTS.indexOf(homePlayers) === -1) homePlayers = 'off';
let homeLocation = recallOptions('homeLocation', 'together');
if (['together', 'apart'].indexOf(homeLocation) === -1) homeLocation = 'together';
let homeSearch = '';
/* The second row - together/apart and the eight player counts - is two
   horizontally scrolling rows stacked on one another, and neither announces
   that it scrolls. It folds behind one chip in the first row, which costs it
   no height at all when closed. It opens by itself when one of its filters is
   remembered from last time, so a filter is never hiding out of sight. */
let homeMoreOpen = (homeLocation !== 'together' || homePlayers !== 'off');
const homeMoreOn = () => homeLocation !== 'together' || homePlayers !== 'off';

/** The chip says what it is hiding, so a filter left on is never a mystery. */
function homeMoreLabel(t) {
  const parts = [];
  if (homeLocation !== 'together') parts.push(escapeHTML(t.flt_location_apart || ''));
  if (homePlayers !== 'off') parts.push(`<span class="metric">${escapeHTML(homePlayers)}</span>`);
  return parts.length ? parts.join(' · ') : escapeHTML(t.flt_more || '');
}

function paintHomeMoreChip() {

function toggleHomeMore() {

  } else open();

/** Does a catalog entry fit the chosen player count? */
function catalogMatchesPlayers(g, count) {
  if (!count || count === 'off') return true;
  if (!g || !g.players) return false;
  const [min, max] = g.players;
  if (count === '8+') return max >= 8;
  const n = Number(count);
  return n >= min && n <= max;
}

/** Does a catalog entry match the together / apart filter? */
function catalogMatchesLocation(g, loc) {
  if (loc !== 'apart') return true;
  if (!g) return false;
  if (g.faceToFace) return false;
  if (!g.modes || g.modes.indexOf('room') === -1) return false;
  return true;
}

/** Returns the IDs of all game cards currently visible in the home catalog. */
function homeVisibleGameIds() {
  const view = document.getElementById('view-menu');
  if (!view) return [];
  const cards = Array.from(view.querySelectorAll('section[data-group]:not([data-group="tools"]):not(.hidden) .gcard:not(.hidden)'));
  return cards.map(c => c.dataset.game).filter(Boolean);
}

/* --- «الليلة دي؟» (notes/archive/plans/IMPROVEMENT_PLAN.md, Phase 1) ----------------------
   The door for a table that doesn't know the app: two questions - how many are
   you, and how are you playing - and three games that fit, the ones a first
   evening goes best with first (TONIGHT_ORDER). The answers are remembered.
   -------------------------------------------------------------------------- */
const TONIGHT_ORDER = [
  // The ones a first evening goes best with: talk, laugh, everyone in at once.
  'imposter', 'bomb', 'charades', 'headsup', 'trivia', 'uno', 'codenames', 'drawguess', 'hum', 'chairs',
  'spyfall', 'fiveseconds', 'stop', 'whoami', 'wouldyou', 'mostlikely', 'screw', 'chameleon', 'timesup',
  'justone', 'emoji', 'proverbs', 'fibbage', 'monkey', 'herd', 'twotruths', 'hear', 'telephone',
  // Fun once the table has warmed up, or a game to sit down to.
  'exact', 'vault', 'wire', 'laser', 'domino', 'ludo', 'snakes', 'doubt', 'buzzer', 'timeline', 'mafia', 'describe',
  'fakeartist', 'bumper', 'witness', 'box', 'darkroom', 'mind', 'guesswho', 'hangman', 'skull', 'oldmaid',
  'bowling', 'minigolf',
  // Two at a time, and the long ones.
  'connect4', 'xo', 'memory', 'reaction', 'dots', 'shatranj', 'battleship', 'guessnum', 'bank', 'estimation',
  // Puzzles and the dailies: alone, or a race.
  'wordle', 'daily', 'sudoku', 'streak', 'connections', 'flags', 'wordwheel', 'pinpoint', 'strands',
  'queens', 'tango', 'nonogram', 'mines', 'g2048'];
const TONIGHT_COUNTS = ['1', '2', '3-5', '6+'];
const TONIGHT_HOWS = ['device', 'room', 'tv'];
let tonightPrefs = recallOptions('tonight', { count: '', how: '' });

/** The games that fit the answers, best first. */
function tonightCandidates(count, how) {
  const fitsCount = (g) => {
    if (!g.players) return false;
    const [min, max] = g.players;
    if (count === '1') return min === 1;
    if (count === '2') return min <= 2 && max >= 2;
    if (count === '3-5') return min <= 5 && max >= 3;
    return max >= 6;
  };
  // Alone: a game on this phone, or a room game that computer players fill
  // (its catalog minimum is 1 exactly when they can, 26 Sep 2026).
  const fitsMode = (g) => {
    const modes = g.modes || [];
    if (count === '1') return modes.indexOf('device') !== -1 || modes.indexOf('room') !== -1;
    return modes.indexOf(how) !== -1;
  };
  const rank = (id) => { const i = TONIGHT_ORDER.indexOf(id); return i === -1 ? 999 : i; };
  return GAME_CATALOG
    .filter(g => g.group !== 'tools' && !g.hub && !catalogOff(g.id) && fitsCount(g) && fitsMode(g))
    .sort((a, b) => rank(a.id) - rank(b.id));
}

/** `ids`: the three games to show again (back from a setup opened from here, 1217). */
function tonightOpen(ids) {
  tonightPaint(Array.isArray(ids) ? ids : null);
  const el = document.getElementById('tonight-modal');
  if (el) el.classList.remove('hidden');
  haptic('light');
}

function tonightSet(key, value) {
  tonightPrefs = Object.assign({}, tonightPrefs, { [key]: value });
  rememberOptions('tonight', tonightPrefs);
  tonightPaint();
  haptic('light');
}

/* A pick goes the way the table said it plays (ideas batch: shell): own phones
   or the TV opens a room with the game already chosen; one phone starts it as
   the first visit's cards do (asking «مين بيلعب؟» for missing names), or opens
   its setup on the one phone side. */
function tonightGo(id) {
  closeModal('tonight-modal');
  const g = CATALOG_BY_ID[id];
  if (!g) return;
  if (catalogOff(id)) { gameOffToast(); return; }
  if (typeof lzWait === 'function' && lzWait(lzChunksOfGame(id), () => tonightGo(id))) return;
  const view = document.getElementById('view-menu');
  const card = view ? view.querySelector(`.gcard[data-game="${id}"]`) : null;
  const { count, how } = tonightPrefs;
  const modes = g.modes || [];
  const wantRoom = count && count !== '1' && (how === 'room' || how === 'tv') && modes.indexOf('room') !== -1;
  const setupId = g.setup && g.setup.indexOf('setup-') === 0 ? g.setup.slice('setup-'.length) : '';
  if (wantRoom) {
    // A laptop or TV that asked for "on the TV" is the big screen itself; a phone
    // hosts, and the lobby's QR brings the TV in.
    if (how === 'tv' && tonightIsBigScreen()) roomCreateScreenOnce = true;
    const viewEl = setupId ? document.getElementById('view-' + g.setup) : null;
    if (viewEl && viewEl.querySelector('.mode-switch')) {
      playModeOnce = { id: setupId, mode: 'online' };
      catalogOpen(id, card);
      playModeOnce = null;
      const panel = appState.currentView === g.setup && viewEl.querySelector('.mode-online-panel:not(.hidden)');
      const open = panel && panel.querySelector('button.btn--primary');
      if (open) open.click(); else roomCreateScreenOnce = false;
      return;
    }
    catalogOpen(id, card);   // a room-only game's card opens its room
    if (appState.currentView !== 'room-lobby' && appState.currentView !== 'room-tv') roomCreateScreenOnce = false;
    return;
  }
  if (setupId && document.querySelector('#view-' + g.setup + ' .mode-switch')) playModeOnce = { id: setupId, mode: 'device' };
  const picks = tonightShown.slice();
  if (QUICK_START[id]) catalogQuickStart(id, card);
  else catalogOpen(id, card);
  if (playModeOnce && playModeOnce.id === setupId) playModeOnce = null;
  // A setup it stopped on remembers the sheet: back comes to it again (1217).
  if (g.setup && appState.currentView === g.setup) tonightBack = { view: g.setup, ids: picks };
}

/* Back to «الليلة دي؟» where it came from (the owner's pick 1217, 7 Oct 2026): a
   setup opened from the sheet remembers it, and going back from that setup - the
   header's arrow or the phone's own back, both of which land on the home - opens
   the sheet again with the same answers (tonightPrefs, kept anyway) and the same
   three games, not a new deal. Any other way off the setup (Start, a tab, a room)
   forgets it; the bottom bar's 🏠 is a tab, so it goes home and stays there. */
let tonightShown = [];     // the three games the sheet shows now
let tonightBack = null;    // { view, ids }: the setup opened from the sheet
function tonightForget() { tonightBack = null; }
if (typeof onLeaveScreen === 'function') onLeaveScreen((from, to) => {
  const back = tonightBack;
  if (!back) return;
  tonightBack = null;
  if (from !== back.view || to !== 'menu') return;
  // After setView has closed every popup, and the home is drawn.
  setTimeout(() => { if (appState.currentView === 'menu') tonightOpen(back.ids); }, 0);
});

/** A laptop or a TV rather than a phone: wide and tall, with a real pointer. */
function tonightIsBigScreen() {
  return !!(window.matchMedia && window.matchMedia('(min-width: 900px) and (min-height: 540px) and (pointer: fine)').matches);
}

function tonightPaint(keepIds) {
  const body = document.getElementById('tonight-body');
  if (!body) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const { count, how } = tonightPrefs;
  const chip = (key, value, label, icon) => {
    const on = tonightPrefs[key] === value;
    return `<button type="button" class="filter-chip ${on ? 'is-active' : ''}" aria-pressed="${on}" onclick="tonightSet('${key}', '${value}')">` +
      (icon ? `<span aria-hidden="true">${icon}</span>` : '') + (/^[0-9+-]+$/.test(label) ? `<bdi dir="ltr" class="metric">${escapeHTML(label)}</bdi>` : escapeHTML(label)) + '</button>';
  };
  const needHow = count && count !== '1';
  const ready = count && (!needHow || how);
  let picks = '';
  if (ready) {
    const all = tonightCandidates(count, how).map(g => g.id);
    const kept = keepIds && keepIds.filter(id => all.indexOf(id) !== -1);
    const ids = kept && kept.length ? kept : all.length > 3 ? freshPick(`tonight_${count}_${needHow ? how : 'device'}`, all.slice(0, 9), 3) : all;
    tonightShown = ids.slice();
    picks = ids.length
      ? `<div class="eyebrow">${escapeHTML(t.tonight_picks || '')}</div><div class="tonight-picks">${ids.map(id => {
          const g = CATALOG_BY_ID[id];
          return `<button type="button" class="tonight-pick" data-accent="${g.accent}" onclick="tonightGo('${g.id}')">
            <span class="tonight-pick__icon" aria-hidden="true">${iconHtml(g.icon)}</span>
            <span class="tonight-pick__text"><b>${escapeHTML(catalogTitle(g, t))}</b><span>${escapeHTML(catalogDesc(g, t))}</span></span>
            <span class="tool-chev" aria-hidden="true">›</span></button>`;
        }).join('')}</div>`
      : `<p class="sheet__subtitle">${escapeHTML(t.tonight_none || '')}</p>`;
  }
  body.innerHTML = `
    <div class="modal-icon" aria-hidden="true">🌙</div>
    <div class="sheet__title">${escapeHTML(t.tonight_title || '')}</div>
    <div class="eyebrow">${escapeHTML(t.tonight_count || '')}</div>
    <div class="tonight-row">${TONIGHT_COUNTS.map(v => chip('count', v, v === '1' ? (t.tonight_solo || '1') : v, v === '1' ? '🧘' : '')).join('')}</div>
    ${needHow ? `<div class="eyebrow">${escapeHTML(t.tonight_how || '')}</div>
    <div class="tonight-row">${TONIGHT_HOWS.map(v => chip('how', v, t['mode_short_' + v] || v, PLAY_MODES[v].icon)).join('')}</div>` : ''}
    ${picks}
    <div class="modal-actions">
      ${ready && picks.indexOf('tonight-pick') !== -1 ? `<button type="button" class="btn btn--secondary" onclick="tonightPaint()">🎲 ${escapeHTML(t.tonight_more || '')}</button>` : ''}
      <button type="button" class="btn btn--ghost" onclick="closeModal('tonight-modal')">${escapeHTML(t.close || '')}</button>
    </div>`;
}

/* The first visit (the owner, 26 Sep 2026: "people who open it should not have
   to do a lot of clicks to start a game; I don't want them to get lost"). A
   phone that has opened no game yet gets a simple start: «يلا نلعب!», three big

   was. STARTER_SHELF's first three are the cards. */
const STARTER_SHELF = ['imposter', 'bomb', 'charades', 'trivia', 'uno', 'headsup', 'codenames', 'screw'];
const START_CARDS = STARTER_SHELF.slice(0, 3);

// (the owner, 3 Oct 2026: the big screen's first visit was half empty).
let homeAllOpen = null;

/* A game that can start from one tap, with whatever this phone chose last time
   (the setup screen is drawn first, so its remembered options are on it). A
   game that needs names and hasn't enough gets «مين بيلعب؟» (askPlayers in
   JS_Utils.html) instead of a toast. Used by the first visit's cards and by
   «▶ العب تاني» on a recent tile. */
const QUICK_START = {
  imposter:    () => startImposterGame(),
  chameleon:   () => startChameleonGame(),
  spyfall:     () => startSpyfallGame(),
  justone:     () => startJustOneGame(),
  bomb:        () => startBombRound(),
  charades:    () => startCharades(),
  describe:    () => startDescribeGame(60),
  fiveseconds: () => startFiveGame(),

function catalogQuickStart(id, fromEl) {
  const g = CATALOG_BY_ID[id];
  const go = QUICK_START[id];
  if (!g) return;
  if (catalogOff(id)) { gameOffToast(); return; }
  if (!go) { catalogOpen(id, fromEl); return; }
  if (typeof lzWait === 'function' && lzWait(lzChunksOfGame(id), () => catalogQuickStart(id, fromEl))) return;
  // The icon flies to the setup's hero only if the game stops there (the names
  // sheet over it); a game that starts at once has no hero to land on.
  const fly = typeof catalogIconFlight === 'function' ? catalogIconFlight(g, fromEl) : null;
  catalogOpen(id, null);
  if (typeof catalogReturn !== 'undefined' && fromEl) {
    catalogReturn.kind = fromEl.classList.contains('recent-tile') ? 'recent' : fromEl.classList.contains('start-card') ? 'start' : 'card';
  }
  if (appState.currentView !== g.setup) return;
  // The setup remembers "each on their own phone": then the room is the game.
  const view = document.getElementById('view-' + g.setup);

  if (online) {

function homeContStamps() {
  try { return JSON.parse(localStorage.getItem(HOME_CONT_KEY) || '{}') || {}; } catch (e) { return {}; }
}

/** A board left: its game is the one played last (the card shows the newest). */
function homeContMark(from) {
  const hit = HOME_CONT.find(c => homeContSafe(c.view) === from);
  if (!hit) return;
  const all = homeContStamps();
  all[hit.key] = Date.now();
  try { localStorage.setItem(HOME_CONT_KEY, JSON.stringify(all)); } catch (e) {}
}
if (typeof onLeaveScreen === 'function') onLeaveScreen((from) => { if (from && from !== 'menu') homeContMark(from); });

/* Whether a board is still going is its game's own code to say, and a game's
   code loads when it opens (JS_Lazy.html). The board left last comes with the
   page (lzBootWrite); one left before it whose code isn't here yet is fetched,
   and the card is drawn again when it has come. */
const homeContAsked = {};
function homeContNeed(c) {
  if (typeof lzChunksOfGame !== 'function') return [];
  if (c.key !== 'daily') return lzChunksOfGame(c.game);
  // A daily set aside: the games whose boards wait in the day's keeping.
  if (typeof DAILY_GAMES === 'undefined' || typeof soloDailyInProgress !== 'function') return [];
  return DAILY_GAMES.reduce((all, d) => soloDailyInProgress(d.id) ? all.concat(lzChunksOfGame(d.id)) : all, []);
}
function homeContLater(key, need) {
  if (homeContAsked[key]) return;
  homeContAsked[key] = true;
  lzEnsure(need).then(() => { if (appState.currentView === 'menu') homeContRefresh(); }, () => {});
}
/** The «كمّل» card drawn again in place (the rest of the home untouched). */
function homeContRefresh() {
  const view = document.getElementById('view-menu');
  if (!view) return;
  const html = homeContHtml(TRANSLATIONS[appState.lang] || {});
  const old = document.getElementById('home-cont');
  if (old) { if (html) old.outerHTML = html; else old.remove(); return; }
  if (html && view.firstElementChild) view.insertAdjacentHTML('afterbegin', html);
}

/** The game to offer: still going, not switched off, not hidden, played last. */
function homeContPick() {
  const stamps = homeContStamps();
  let best = null;
  HOME_CONT.forEach(c => {
    if (homeContHidden[c.key] || !CATALOG_BY_ID[c.game] || catalogOff(c.game)) return;
    const need = homeContNeed(c);
    if (need.length && !lzReady(need)) {
      if (Number(stamps[c.key]) > 0) homeContLater(c.key, need);
      return;
    }
    if (!homeContSafe(c.live)) return;
    const at = Number(stamps[c.key]) || 0;
    if (!best || at > best.at) best = { c, at };
  });
  return best ? best.c : null;
}

function homeContHtml(t) {
  const c = homeContPick();
  if (!c) return '';
  const g = CATALOG_BY_ID[c.game];
  const line = c.line ? homeContSafe(() => c.line(t)) : '';
  const name = catalogTitle(g, t);
  return `
    <div class="home-cont" id="home-cont" data-accent="${g.accent}">
      <button type="button" class="home-cont__go" onclick="homeContGo('${c.key}')">
        <span class="home-cont__icon" aria-hidden="true">${iconHtml(g.icon)}</span>
        <span class="home-cont__text">
          <span class="home-cont__title">${escapeHTML((t.home_cont_label || '{name}').replace('{name}', name))}</span>
          ${line ? `<span class="home-cont__line">${escapeHTML(line)}</span>` : ''}
        </span>
        <span class="home-cont__play" aria-hidden="true">▶</span>
      </button>
      <button type="button" class="home-cont__x" onclick="homeContHide('${c.key}')"
              aria-label="${escapeHTML(t.home_cont_hide || '')}" title="${escapeHTML(t.home_cont_hide || '')}">✕</button>
    </div>`;
}

function homeContGo(key) {
  const c = HOME_CONT.find(x => x.key === key);
  if (!c) return;
  if (typeof lzWait === 'function' && lzWait(lzChunksOfGame(c.game), () => homeContGo(key))) return;
  if (!homeContSafe(c.live)) { renderHome(); return; }
  haptic('light');
  if (typeof catalogReturn !== 'undefined') { catalogReturn.id = c.game; catalogReturn.kind = 'card'; }
  try { c.go(); } catch (e) { console.error('continue', key, e); }
}

function homeContHide(key) {
  homeContHidden[key] = true;
  const el = document.getElementById('home-cont');
  if (!el) return;
  if (motionOff()) { el.remove(); return; }
  const a = el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(0.96)' }], { duration: 180, easing: 'ease-in' });
  const done = () => { if (el.isConnected) el.remove(); };
  a.onfinish = done;
  setTimeout(done, 260);
}

   section's head opens it back into a wrapping grid. A phone keeps the grid (the

const shelfOpen = {};   // group id → opened with «الكل», for this visit
function shelfButtonHtml(t, open) {

function toggleShelf(btn) {

  const open = !sec.classList.contains('is-open');
  const grid = sec.querySelector('.gcard-grid--shelf');
  const flip = () => {
    sec.classList.toggle('is-open', open);
    if (grid) grid.scrollLeft = 0;
  };
  if (typeof flipGrid === 'function') flipGrid(sec, flip); else flip();
  shelfOpen[sec.dataset.group || sec.dataset.shelf] = open;
  btn.setAttribute('aria-expanded', open);
  btn.textContent = open ? (t.home_shelf_less || '') : (t.home_shelf_all || '');
  syncShelves(sec.closest('[id^="view-"]'));

function syncShelves(root) {

  root.querySelectorAll('.gcard-grid--shelf').forEach(grid => {
    const sec = grid.closest('section');
    if (!sec) return;
    sec.classList.toggle('has-more', sec.classList.contains('is-open') || grid.scrollWidth > grid.clientWidth + 2);
  });
}

    cancelAnimationFrame(raf);

/** Hides the cards, rows and sections the chip and the search box rule out.
    The deciding is unchanged; it is handed to flipGrid (JS_Motion.html) so the
    grid rearranges itself instead of the page redrawing under the thumb.
    `{ animate: false }` is the first paint, where there is nothing to move
    from and the cards are already rising in sequence. */
function applyHomeFilter(opts) {
  const view = document.getElementById('view-menu');
  if (!view) return;
  const t = TRANSLATIONS[appState.lang];
  const other = TRANSLATIONS[appState.lang === 'ar' ? 'en' : 'ar'];
  const term = helpNormalise(homeSearch);
  const searching = !!term;
  let shown = 0;

  const decide = () => {
    view.querySelectorAll('[data-game]').forEach(el => {
      const g = CATALOG_BY_ID[el.dataset.game];
      if (!g) return;
      const isTool = g.group === 'tools';
      // Tools answer a search only; the chips are about how a game is played.
      let ok = isTool ? searching && homeFilter === 'all' : catalogMatchesFilter(g, homeFilter);
      // A hub's other ways (chess's) are inside its card, and come out for a search only.
      if (g.hub && !searching) ok = false;
      if (ok && homePlayers !== 'off') {
        ok = catalogMatchesPlayers(g, homePlayers);
      }
      if (ok && homeLocation !== 'together') {
        ok = catalogMatchesLocation(g, homeLocation);
      }
      if (ok && searching) ok = catalogSearchHit(g, term, t, other);
      el.classList.toggle('hidden', !ok);
      // Only results count: a recent tile is a shortcut, hidden while searching.
      if (ok && el.closest('section[data-group]')) shown++;
    });

    view.querySelectorAll('section[data-group]').forEach(sec => {
      const visible = sec.querySelectorAll('[data-game]:not(.hidden)').length;
      sec.classList.toggle('hidden', !visible);
      const count = sec.querySelector('.section__count');
      if (count && visible) count.textContent = String(visible);
    });
    // The recent row is a shortcut, not a search result.
    const recent = document.getElementById('home-recent');
    if (recent) recent.classList.toggle('hidden', searching || homeFilter !== 'all' || homePlayers !== 'off' || homeLocation !== 'together');
    const daily = document.getElementById('home-daily');
    if (daily) daily.classList.toggle('hidden', searching || (homeFilter !== 'all' && homeFilter !== 'solo') || homePlayers !== 'off' || homeLocation !== 'together');
    const empty = document.getElementById('home-empty');
    if (empty) empty.classList.toggle('hidden', shown > 0);
  };

  // A search lays every shelf out as a grid, so no result is scrolled out of sight.
  const shelves = () => { decide(); view.classList.toggle('is-searching', searching); };
  if ((opts && opts.animate === false) || typeof flipGrid !== 'function') shelves();
  else flipGrid(view, shelves);
  syncShelves(view);
}

/* Search that knows how people ask (the owner's pick 1206, 7 Oct 2026): a game
   answers to its name and line in both languages, as always, and to the title of
   its home section («ورق» finds what is in «ورق وطاولة»). From three letters it
   answers to its rules too (GAME_RULES, as the Help search does), so «رسم» finds
   every drawing game; one or two letters would match half the rules. The rules
   are normalised once per language (catalogSearchCache). */
const catalogSearchCache = {};
function catalogSearchText(g, lang, t) {
  const key = lang + ':' + g.id;
  if (catalogSearchCache[key]) return catalogSearchCache[key];
  const grp = CATALOG_GROUPS.find(x => x.id === g.group);
  const words = helpNormalise([catalogTitle(g, t), catalogDesc(g, t), grp ? (t[grp.title] || '') : ''].join(' '));
  const rulesOf = (typeof GAME_RULES !== 'undefined' && GAME_RULES[lang]) || {};
  const helpKey = rulesOf[g.id] ? g.id : (typeof HELP_FOR_VIEW !== 'undefined' && g.setup ? HELP_FOR_VIEW[g.setup] : '');
  const rules = helpNormalise(String((helpKey && rulesOf[helpKey]) || '').replace(/<[^>]+>/g, ' '));
  return (catalogSearchCache[key] = { words, rules });
}
function catalogSearchHit(g, term, t, other) {
  const langs = [[appState.lang, t], [appState.lang === 'ar' ? 'en' : 'ar', other]];
  return langs.some(([lang, tr]) => {
    const x = catalogSearchText(g, lang, tr || {});
    return x.words.indexOf(term) !== -1 || (term.length >= 3 && x.rules.indexOf(term) !== -1);
  });
}

/* --- The hero on a setup screen ---------------------------------------------
   Every setup screen opens with the same card: what the game is in one line,
   how many people, how long, how it can be played, and a way to the rules.
   It is drawn by setView (and again on a language change), so the screens
   themselves carry none of it.
   -------------------------------------------------------------------------- */
/* --- The first-play card on setup screens and room lobby -------------------
   The first time a phone visits a setup screen (or has a game chosen in a room
   lobby), a 3-step card introduces the game from its rules in GAME_RULES.
   Dismissing or opening full rules marks it seen in ashryFirstPlay_v1.
   -------------------------------------------------------------------------- */
function firstPlayKey(id, isRoom) {
  if (isRoom) {
    if (typeof ROOM_HELP_KEY !== 'undefined' && ROOM_HELP_KEY[id]) return ROOM_HELP_KEY[id];
    if (typeof HELP_FOR_VIEW !== 'undefined' && HELP_FOR_VIEW['room-' + id]) return HELP_FOR_VIEW['room-' + id];
    return id;
  }
  if (typeof HELP_FOR_VIEW !== 'undefined' && HELP_FOR_VIEW[id]) return HELP_FOR_VIEW[id];
  return id;
}

const FIRST_PLAY_ROOM_LIST = { imposter: 1, chameleon: 1, spyfall: 1, whoami: 1, justone: 1, emoji: 1, proverbs: 1, fiveseconds: 1, stop: 1, trivia: 1, monkey: 1 };

function firstPlaySteps(helpKey, lang, isRoom) {
  const rules = (typeof GAME_RULES !== 'undefined' && GAME_RULES[lang]) ? GAME_RULES[lang] : {};
  const content = rules[helpKey];
  if (!content) return [];
  // Rules with both ways put each under a sub-head; the one marked 📱 is the
  // room's (تحدي المعلومات: the room first, then دوري المعرفة on one screen).
  // A setup screen opens on this device, so it takes the other list.
  // A room lobby takes the 📱 list (an <ol> or a <ul>), after the game's own
  // first line when that list is short (فوازير إيموجي, كمّل المثل).
  const lists = [];
  const listRe = /(?:<p class="help-sub">([^<]*)<\/p>\s*)?<(ol|ul)[^>]*>([\s\S]*?)<\/\2>/gi;
  for (let m = listRe.exec(content); m; m = listRe.exec(content)) lists.push({ sub: m[1] || '', tag: m[2].toLowerCase(), body: m[3] });
  const ols = lists.filter(l => l.tag === 'ol');
  if (!ols.length) return [];
  const roomList = lists.find(l => /📱/.test(l.sub) && /منفصلة|من موبايله|separate|own phone/i.test(l.sub));
  // Only where the game's own list is the pass-the-phone way: elsewhere (the
  // duels, the room-only games) it holds the rules and the 📱 list only extras.
  if (isRoom && !FIRST_PLAY_ROOM_LIST[helpKey]) isRoom = false;
  const deviceList = ols.find(l => l !== roomList) || ols[0];
  const liOf = (body) => { const out = []; const re = /<li[^>]*>([\s\S]*?)<\/li>/gi; for (let m = re.exec(body); m; m = re.exec(body)) out.push(m[1]); return out; };
  let raw;
  if (isRoom && roomList) {
    raw = liOf(roomList.body);
    if (raw.length < 3 && roomList !== ols[0] && ols[0]) raw = liOf(ols[0].body).slice(0, 1).concat(raw);
  } else {
    raw = liOf(deviceList.body);
  }
  const items = [];
  for (const one of raw) {
    if (items.length >= 3) break;
    const match = [null, one];
    let text = match[1]
      // A <bdi dir="ltr"> (a "+10" or "×2" in Arabic) stays held left to right as plain text.
      .replace(/<bdi dir="ltr">([\s\S]*?)<\/bdi>/gi, '\u2066$1\u2069')
      .replace(/<[^>]+>/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (text.length > 140) {
      const boundary = text.lastIndexOf(' ', 140);
      if (boundary > 30) {
        text = text.slice(0, boundary) + '…';
      } else {
        text = text.slice(0, 140) + '…';
      }
    }
    if (text) items.push(text);
  }
  return items;
}

function firstPlayCardHtml(helpKey, isRoom) {
  if (!helpKey || (typeof firstPlaySeen === 'function' && firstPlaySeen(helpKey))) return '';
  // أرقامي is a page of numbers, not a game: "how to play" has nothing to say there.
  if (helpKey === 'stats') return '';
  const lang = (typeof appState !== 'undefined' && appState.lang) || 'ar';
  const steps = firstPlaySteps(helpKey, lang, isRoom);
  if (!steps || !steps.length) return '';
  const t = (typeof TRANSLATIONS !== 'undefined' && TRANSLATIONS[lang]) ? TRANSLATIONS[lang] : {};
  const entry = (typeof ROOM_HUB_GAMES !== 'undefined' ? ROOM_HUB_GAMES.find(g => g.id === helpKey) : null)
    || (typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[helpKey] : null)
    || (typeof helpEntry === 'function' ? helpEntry(helpKey) : null);
  const accentAttr = (entry && entry.accent) ? ` data-accent="${escapeHTML(entry.accent)}"` : '';

  // One line that opens in place (the owner, 26 Sep 2026: the card was 230-350px
  // on top of every first setup, pushing the options and Start down). Whether it
  // is open is kept here, so a lobby redrawn by someone joining keeps it open.
  const open = !!firstPlayOpen[helpKey];
  return `
    <details class="first-play-card first-play-card--line"${accentAttr} ${open ? 'open' : ''} data-r="${open ? 1 : 0}"
             ontoggle="firstPlayToggled(this, '${escapeHTML(helpKey)}')">
      <summary class="first-play-card__line">
        <span class="first-play-card__eyebrow">${escapeHTML(t.first_play_line || t.first_play_title || '')}</span>
        <span class="first-play-card__chev" aria-hidden="true">▾</span>
      </summary>
      <div class="first-play-card__body">
        <ol class="first-play-card__steps">
          ${steps.map((s, idx) => `
            <li class="first-play-card__step">
              <span class="first-play-card__n metric" aria-hidden="true">${idx + 1}</span>
              <span class="first-play-card__text">${escapeHTML(s)}</span>
            </li>`).join('')}
        </ol>
        <div class="first-play-card__actions">
          <button type="button" class="btn btn--sm btn--primary btn--auto" onclick="firstPlayDismiss(this, '${escapeHTML(helpKey)}')">${escapeHTML(t.first_play_dismiss || 'فهمت 👍')}</button>
          <button type="button" class="btn btn--sm btn--ghost btn--auto" onclick="firstPlayOpenRules(this, '${escapeHTML(helpKey)}')">${escapeHTML(t.first_play_rules || '📘 القواعد كاملة')}</button>
        </div>
      </div>
    </details>`;
}

const firstPlayOpen = {};
function firstPlayToggled(el, helpKey) {
  // A details drawn open fires its toggle too: only a tap on it counts.
  const now = el.open ? '1' : '0';
  if (el.dataset.r === now) return;
  el.dataset.r = now;
  firstPlayOpen[helpKey] = !!el.open;
  if (el.open && typeof motionOff === 'function' && !motionOff()) {
    const body = el.querySelector('.first-play-card__body');
    if (body && body.animate) body.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

function firstPlayDismiss(el, helpKey) {
  if (typeof firstPlayMarkSeen === 'function') firstPlayMarkSeen(helpKey);
  const card = el ? (el.classList && el.classList.contains('first-play-card') ? el : el.closest('.first-play-card')) : null;
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (!card) return;
  if (typeof motionOff === 'function' && motionOff()) {
    card.remove();
    return;
  }
  if (card.animate) {
    const anim = card.animate([
      { opacity: 1, transform: 'none' },
      { opacity: 0, transform: 'translateY(-4px)' }
    ], { duration: 180, easing: 'ease-out', fill: 'forwards' });
    anim.onfinish = () => card.remove();
    setTimeout(() => { if (card.parentNode) card.remove(); }, 220);
  } else {
    card.classList.add('is-dismissing');
    setTimeout(() => { if (card.parentNode) card.remove(); }, 200);
  }
}

function firstPlayOpenRules(el, helpKey) {
  firstPlayDismiss(el, helpKey);
  if (typeof openHelpModal === 'function') openHelpModal();
}

function catalogHeroHtml(g, t, switchId) {
  // On a setup with the one phone / own phones switch the mode pills ARE that
  // switch (ideas batch: shell): a tap turns it, and the side it is on is lit
  // (applyPlayMode keeps them in step). With no switch they are plain words.
  const modes = (g.modes || []).filter(m => PLAY_MODES[m]).map(m => {
    const mode = PLAY_MODES[m];
    const inner = `<span aria-hidden="true">${mode.icon}</span>${escapeHTML(t[mode.short] || t[mode.label] || '')}`;
    if (!switchId) return `<span class="meta-bit meta-bit--mode">${inner}</span>`;
    const side = m === 'device' ? 'device' : 'online';
    return `<button type="button" class="meta-bit meta-bit--mode meta-bit--pick" data-pmode="${side}" aria-pressed="false"
                    onclick="setPlayMode('${switchId}', '${side}')">${inner}</button>`;
  }).join('');
  const helpKey = firstPlayKey(g.setup || g.id, false);
  const card = firstPlayCardHtml(helpKey);
  return `
    <span class="game-hero__art" aria-hidden="true"><span class="game-hero__icon">${iconHtml(g.icon)}</span></span>
    <span class="game-hero__text">
      <span class="game-hero__title">${escapeHTML(catalogTitle(g, t))}</span>
      <span class="game-hero__desc">${escapeHTML(catalogDesc(g, t))}</span>
      <span class="game-hero__meta">${catalogMeta(g, t, true, false)}${modes}</span>
    </span>
    ${card}`;
}

/** The hero's mode pills lit for the switch's side (see catalogHeroHtml). */
function heroSyncModes(view, mode) {
  if (!view) return;
  view.querySelectorAll('.game-hero [data-pmode]').forEach(b => {
    const on = b.dataset.pmode === (mode === 'online' ? 'online' : 'device');
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

function syncGameHero(viewId) {
  const view = document.getElementById('view-' + viewId);
  if (!view) return;
  const g = GAME_CATALOG.find(x => x.setup === viewId);
  let hero = view.querySelector(':scope > .game-hero');
  if (!g) { if (hero) hero.remove(); return; }
  const t = TRANSLATIONS[appState.lang];
  if (!hero) {
    hero = document.createElement('div');
    hero.className = 'game-hero';
    view.insertBefore(hero, view.firstChild);
  }
  const sw = view.querySelector('.mode-switch');
  hero.innerHTML = catalogHeroHtml(g, t, sw && viewId.indexOf('setup-') === 0 ? viewId.slice('setup-'.length) : '');
  hero.classList.toggle('game-hero--modes', !!sw);
  if (sw) {
    const on = sw.querySelector('.segmented__item.is-active');
    heroSyncModes(view, on ? on.dataset.mode : 'device');
  }
  // A hub's games (chess) carry the row of its ways right under the hero.
  let ways = view.querySelector(':scope > .hub-ways');
  const waysHtml = hubWaysHtml(g, t);
  if (!waysHtml) { if (ways) ways.remove(); return; }
  const box = document.createElement('div');
  box.innerHTML = waysHtml;
  const fresh = box.firstElementChild;
  if (ways) ways.replaceWith(fresh); else hero.after(fresh);
  fresh.querySelectorAll('.hscroll-fade').forEach(watchScrollFade);
}

/* --- Who is playing right now ---------------------------------------------
   One small request when the مع بعض tab opens, and one a minute while it stays
   on screen and the phone is awake. The rooms server adds up the players online
   in every room (GET /live). Hidden until there are enough people to be worth
   saying, so it never announces an empty app, and hidden when the server can't
   be reached rather than showing a stale or broken number.
   -------------------------------------------------------------------------- */
const LIVE_MIN_PLAYERS = 4;
const LIVE_EVERY_MS = 60000;
let togetherLiveTimer = null;
let togetherLiveRun = 0;

async function refreshTogetherLive() {
  const run = ++togetherLiveRun;
  clearTimeout(togetherLiveTimer);
  togetherLiveTimer = null;
  if (appState.currentView !== 'together') return;
  const base = String(window.ROOMS_URL || '').replace(/\/+$/, '');
  if (base && document.visibilityState === 'visible') {
    let data = null;
    try { data = await (await fetch(base + '/live')).json(); } catch (e) {}
    if (run !== togetherLiveRun) return;          // a newer refresh took over
    paintTogetherLive(data);
  }
  togetherLiveTimer = setTimeout(refreshTogetherLive, LIVE_EVERY_MS);
}

// The last count heard, so coming back to the tab shows it at once rather than
// blank until the next answer (a minute's old count is still true enough).
let togetherLiveLast = null;

function paintTogetherLive(data) {
  if (data !== undefined) togetherLiveLast = data;
  else data = togetherLiveLast;
  const el = document.getElementById('together-live');
  if (!el) return;
  const players = data && data.ok ? Number(data.players) || 0 : 0;
  const rooms = data && data.ok ? Number(data.rooms) || 0 : 0;
  if (players < LIVE_MIN_PLAYERS || rooms < 1) { el.hidden = true; return; }
  const t = TRANSLATIONS[appState.lang] || {};
  // Arabic counts: 3-10 take the plural, 11 and up the singular; rooms also
  // have a dual.
  const playersText = (players <= 10 ? t.live_players_few : t.live_players_many || t.live_players_few || '').replace('{n}', players);
  const roomsText = (rooms === 1 ? t.live_rooms_one : rooms === 2 ? t.live_rooms_two
    : rooms <= 10 ? t.live_rooms_few : t.live_rooms_many || '').replace('{n}', rooms);
  el.innerHTML = `<span class="presence-dot is-online" aria-hidden="true"></span>` +
    `<span>${escapeHTML((t.live_line || '').replace('{players}', playersText).replace('{rooms}', roomsText))}</span>`;
  el.hidden = false;
}

// Back from the lock screen on the tab: count again rather than wait a minute.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && appState.currentView === 'together') refreshTogetherLive();
});

  if (typeof Room !== 'undefined' && Room.isIn && typeof roomReturnToActive === 'function') { roomReturnToActive(); return; }
  setView('together');

  settleStagger(view, 'tools');
}

/** Redraws whichever catalog screens are up - after a language change. */
function renderCatalogViews() {
  renderHome();
  if (appState.currentView === 'together') renderTogether();
  if (appState.currentView === 'tools') renderTools();
}

</script>
