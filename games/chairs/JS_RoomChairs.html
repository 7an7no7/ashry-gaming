<script>
/* ============================================================================
   الكراسي الموسيقية — MUSICAL CHAIRS (rooms and the TV), 27 Sep 2026
   ----------------------------------------------------------------------------
   Every phone is a player round a ring of chairs (players − 1). The music
   plays on the TV, or on the host's phone when there is none - an Egyptian
   beat made here with Web Audio, its tempo climbing - and the avatars circle
   the ring on every screen. The server stops it at a secret moment
   (RoomChairs.js): every phone buzzes and flashes, the button turns amber,
   and the taps are ranked by the phones' own stamps of the server's time
   (mchTapAt), so a slow connection loses no chair. The slowest, or whoever
   never tapped, walks off; one out a round until one is left.

   Look أ «الصالة» from the design sheet: the arcade violet ground, wooden
   chairs on a pale rug, round avatars with initials, the amber «اقعد!».
   Everything here is public (state.shared); the phone adds only motion:
     - the avatars orbit while the music plays (a Web Animation whose
       playbackRate follows the tempo, and stops dead in a fake pause),
     - at the stop each avatar that sat hops onto its chair (FLIP from where
       it was, measured before the redraw), the loser greys and walks off,
     - the button pops in, the sit window drains, the result card turns,
     - the end is the places, confetti for the winner and the wins tally.
   «الدي جي» (a lobby switch, 2 Oct 2026): from round 2 the latest one out
   gets the DJ panel in place of the out note (mchDjHtml): «وقّف», and
   «وقفة خداعية» with the fake stops on, locked for the music's first 4 s and
   counting down to the server's own stop at 25 s (painted in place by the
   paint tick). Everyone sees who the DJ is (🎧 in the head and the TV's
   list), never anything of when they will press.
   Every name here starts with mch / MCH_. Section 50 of Style.html.
   ========================================================================= */
const MCH_OPTS_KEY = 'chairs';
const MCH_OPTS_DEFAULT = { fake: false, dj: false };
const MCH_COLORS = ['#6d28d9', '#0ea5a4', '#e5383b', '#f59e0b', '#2563eb', '#db2777', '#16a34a', '#7c3aed', '#ea580c', '#0891b2', '#9333ea', '#65a30d'];
const MCH_BPM_START = 104, MCH_BPM_END = 150, MCH_BPM_RAMP_MS = 16000;
const MCH_SIT_MS = 3000;           // CHAIRS_SIT_MS on the server: the window's bar drains over it
// «الدي جي»: the server's CHAIRS_DJ_* (RoomChairs.js), mirrored only to lock the buttons; the server decides.
const MCH_DJ_FIRST_MS = 4000, MCH_DJ_MAX_MS = 25000, MCH_DJ_FAKES = 3, MCH_DJ_FAKE_GAP_MS = 1500, MCH_DJ_FAKE_MS = 600;
// «الدي جي»'s words: only this game's chunk reads them, so they live here and not in
// TRANSLATIONS (the shell's size budget, as SNK_BUBBLES); read through mchDjT().
const MCH_DJ_TEXT = {
  ar: {
    mch_dj: "دي جي من اللي خرج",
    mch_dj_hint: "من الجولة التانية، آخر واحد خرج هو اللي يوقّف الموسيقى من موبايله (ولو موقفهاش في 25 ثانية تقف لوحدها).",
    mch_dj_is: "الدي جي: {name}",
    mch_dj_short: "دي جي",
    mch_dj_you: "إنت الدي جي!",
    mch_dj_stop: "وقّف",
    mch_dj_fake: "وقفة خداعية",
    mch_dj_fakes_left: "باقي {n}",
    mch_dj_ready_in: "جاهز بعد {n}…",
    mch_dj_auto: "هتقف لوحدها بعد {n} ث",
    mch_dj_hint_play: "اسمع الموسيقى، ووقّفها في أصعب لحظة",
    mch_dj_next: "🎧 إنت الدي جي الجولة الجاية",
    mch_dj_lost: "الدي جي مشي… الموسيقى هتقف لوحدها",
    mch_dj_caught: "🎧 وقفة {name} الخداعية وقّعته",
    mch_best_dj: "أحلى دي جي",
    mch_best_dj_n: "وقّع بالوقفة الخداعية: {n}"
  },
  en: {
    mch_dj: "The one out is the DJ",
    mch_dj_hint: "From round 2, the latest one out stops the music from their phone (if they don't within 25 seconds, it stops by itself).",
    mch_dj_is: "DJ: {name}",
    mch_dj_short: "DJ",
    mch_dj_you: "You're the DJ!",
    mch_dj_stop: "Stop",
    mch_dj_fake: "Fake stop",
    mch_dj_fakes_left: "{n} left",
    mch_dj_ready_in: "Ready in {n}…",
    mch_dj_auto: "Stops by itself in {n}s",
    mch_dj_hint_play: "Listen, and stop it at the trickiest moment",
    mch_dj_next: "🎧 You're the DJ next round",
    mch_dj_lost: "The DJ is gone… the music will stop by itself",
    mch_dj_caught: "🎧 {name}'s fake stop got them",
    mch_best_dj: "Best DJ",
    mch_best_dj_n: "Caught with a fake stop: {n}"
  }
};
const mchDjT = () => MCH_DJ_TEXT[appState.lang] || MCH_DJ_TEXT.ar;

const mch = {
  gap: Infinity,        // the smallest (receivedAt − serverNow) seen: the network's share, so the phone can tell the server's time
  orbit: null,          // the ring's spin (a Web Animation) and its bars
  eq: [],
  music: null,          // the scheduler of the beat, on the one device that plays it
  timer: null,          // the tempo, the countdown and the window, painted in place
  seen: new Set(),      // play-once keys (a sound, a flash), whatever the motion setting
  pressed: ''           // the round this phone tapped in, so the button locks before the server answers
};

/* --- the server's clock on this phone ---------------------------------------- */
function mchNoteTime(state) {
  if (state && typeof state.serverNow === 'number' && typeof state.receivedAt === 'number') {
    mch.gap = Math.min(mch.gap, state.receivedAt - state.serverNow);
  }
}
const mchServerNow = () => (isFinite(mch.gap) ? Date.now() - mch.gap : Date.now());
/** The stamp a tap carries: the server's time as this phone knows it (null when it doesn't yet). */
const mchTapAt = () => (isFinite(mch.gap) ? Date.now() - mch.gap : null);

function mchOpts() { return recallOptions(MCH_OPTS_KEY, MCH_OPTS_DEFAULT); }
function mchSetOpt(patch) {
  rememberOptions(MCH_OPTS_KEY, patch);
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
}
const mchOnce = (key) => { if (!key || mch.seen.has(key)) return false; if (mch.seen.size > 300) mch.seen.clear(); mch.seen.add(key); return true; };
const mchT = () => TRANSLATIONS[appState.lang];
const mchFill = (str, vars) => String(str || '').replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
const mchIso = (s) => '⁨' + s + '⁩';

/** «7 كراسي»: the Arabic count words, the English plural. */
function mchChairsWord(n) {
  const t = mchT();
  if (n === 1) return t.mch_chair1;
  if (n === 2) return t.mch_chairs2;
  if (n >= 3 && n <= 10) return mchFill(t.mch_chairs_n, { n });
  return mchFill(t.mch_chairs_11, { n });
}

/**
 * Who plays the music: the TV where there is one, else the host's phone. With
 * two screens in the room only one is the voice - the first online by id (the
 * rule عربيات التصادم's lead screen uses) - or the beat plays twice, out of step.
 */
function mchIsVoice(state) {
  const screens = (state.screens || []).filter((x) => x.online).map((x) => x.id).sort();
  if (state.youAreScreen) return screens[0] === Room.me;
  return !!state.youAreHost && !screens.length;
}

/* --- the ring ------------------------------------------------------------------ */
const mchColorOf = (s, id) => MCH_COLORS[Math.max(0, (s.roster || []).indexOf(id)) % MCH_COLORS.length];
/**
 * A player's colour as a small initial's ground with ink that reads on it
 * (4.5:1): dark ink on the light colours (amber, teal, cyan), white on the rest
 * over the colour a shade darker (the red and the violets reach 4.2 with either).
 */
function mchChipStyle(hex) {
  const lum = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255)
    .map(v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)))
    .reduce((a, v, i) => a + v * [0.2126, 0.7152, 0.0722][i], 0);
  const L = /^#[0-9a-f]{6}$/i.test(hex || '') ? lum(hex) : 0.2;
  const onDark = (L + 0.05) / (lum('#1b1b1f') + 0.05);
  return onDark >= 4.5 ? `background:${hex};color:#1b1b1f` : `background:color-mix(in srgb, ${hex} 78%, #000);color:#ffffff`;
}
const mchNameOf = (state, id) => ((state.players || []).find((p) => p.id === id) || {}).name || '';
const mchInitial = (name) => (String(name || '').trim().replace(/^ال/, '')[0] || '?');

function mchChairSvg() {
  return '<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="7" y="11" width="26" height="24" rx="6" fill="#d89a4a"/><rect x="7" y="11" width="26" height="24" rx="6" fill="none" stroke="#8a4f17" stroke-width="1.5"/><rect x="4" y="4" width="32" height="10" rx="4" fill="#a35f22"/><rect x="11" y="16" width="18" height="14" rx="4" fill="#efc07a" opacity=".7"/></svg>';
}

/**
 * The ring: the rug, the chairs, and the avatars - orbiting while the music
 * plays, on their chairs (in tap order) or standing once it has stopped, the
 * loser greyed. Positions are percentages of the square, worked out here
 * (CSS trig would leave a 2021 phone with no layout at all).
 */
function mchRingHtml(state, s, o) {
  if (mchIsFinal(s)) return mchFinalHtml(state, s, o);      // «النهائي»: two left, the stage
  const t = mchT();
  const me = Room.me;
  const chairs = Math.max(0, s.chairs || 0);
  const order = (s.order || []).filter((id) => (state.players || []).some((p) => p.id === id));
  const alive = s.alive || [];
  const sits = s.sits || [];
  const music = s.phase === 'music';
  const at = (r, deg, w) => {
    const a = (deg - 90) * Math.PI / 180;
    return `left:${(50 + r * Math.cos(a) - w / 2).toFixed(2)}%;top:${(50 + r * Math.sin(a) - w / 2).toFixed(2)}%;width:${w}%;height:${w}%`;
  };
  const CH = 14, AV = 12;   // sizes as a share of the square; every radius keeps the avatars inside it
  let out = '<div class="mch-rug"></div>';
  for (let k = 0; k < chairs; k++) {
    const deg = k * 360 / chairs;
    out += `<div class="mch-chair" style="${at(31, deg, CH)};--rot:${deg.toFixed(0)}deg">${mchChairSvg()}</div>`;
  }
  const avHtml = (id, extra, style) => {
    const name = mchNameOf(state, id);
    return `<div class="mch-av ${id === me ? 'is-me' : ''} ${extra || ''}" data-mch-av="${escapeHTML(id)}" style="${style};--c:${mchColorOf(s, id)}" title="${escapeHTML(name)}">
      <span class="mch-av__face">${escapeHTML(mchInitial(name))}</span><span class="mch-av__name">${escapeHTML(name)}</span></div>`;
  };
  if (music) {
    // Everyone alive spins round the chairs, evenly spaced, upright.
    out += '<div class="mch-orbit" data-mch-orbit>';
    order.forEach((id, i) => {
      if (alive.indexOf(id) === -1) return;
      const deg = i * 360 / Math.max(1, order.length);
      out += `<div class="mch-orbit__seat" style="${at(43, deg, AV)}">${avHtml(id, '', '')}</div>`;
    });
    out += '</div>';
  } else {
    order.forEach((id, i) => {
      const deg = i * 360 / Math.max(1, order.length);
      const rank = sits.findIndex((x) => x.id === id);
      const sat = rank !== -1 && rank < chairs;
      const isLoser = s.loserId === id;
      if (alive.indexOf(id) === -1 && !isLoser) return;              // out earlier: not in the ring
      let style;
      if (sat) style = at(31, rank * 360 / Math.max(1, chairs), AV);  // on the chair it took
      else style = at(44, deg + 180 / Math.max(1, order.length), AV);   // standing, between the chairs' angles
      const outNow = isLoser && s.phase !== 'music';
      const walk = outNow && motionFirst(['mch-out', roomDealKey(state), s.round].join('|')) ? ' is-walking' : '';
      out += avHtml(id, (sat ? 'is-sat' : '') + (outNow ? ' is-out' + walk : ''), style);
    });
  }
  // The middle: the equalizer while the music plays, the moment otherwise.
  let mid;
  if (music) {
    mid = `<div class="mch-eq" data-mch-eq>${'<i></i>'.repeat(9)}</div><div class="mch-mid__line">${escapeHTML(s.djLost ? mchDjT().mch_dj_lost : t.mch_music_on)}</div>`;
  } else if (s.phase === 'sit') {
    mid = `<div class="mch-mid__big">${escapeHTML(t.mch_stopped)}</div><div class="mch-window"><i data-mch-window></i></div>`;
  } else if (s.phase === 'result') {
    const key = s.why === 'early' ? 'mch_out_early' : s.why === 'late' ? 'mch_out_late' : s.why === 'left' ? 'mch_out_left' : 'mch_out_last';
    const trap = s.why === 'early' && s.trapBy ? `<div class="mch-mid__line">${escapeHTML(mchFill(mchDjT().mch_dj_caught, { name: mchIso(mchNameOf(state, s.trapBy) || s.djName || '') }))}</div>` : '';
    mid = `<div class="mch-mid__big mch-mid__big--out">${escapeHTML(mchFill(t[key], { name: mchIso(s.loserName || '') }))}</div>
           ${trap}<div class="mch-mid__line" data-mch-next></div>`;
  } else {
    mid = `<div class="mch-mid__big mch-mid__big--win">🏆 ${escapeHTML(mchFill(t.mch_winner, { name: mchIso(s.winnerName || '') }))}</div>`;
  }
  out += `<div class="mch-mid ${s.phase !== 'music' && motionFirst(['mch-mid', roomDealKey(state), s.round, s.phase].join('|')) ? 'mch-mid--in' : ''}">${mid}</div>`;
  return `<div class="mch-ring ${o && o.tv ? 'mch-ring--tv' : ''}" data-mch-ring>${out}</div>`;
}

/** «مين قعد الأول؟»: the taps in order, the time each took, the one out crossed. */
function mchOrderHtml(state, s) {
  const t = mchT();
  const sits = s.sits || [];
  if (!sits.length && s.phase !== 'result') return '';
  const chairs = s.chairs || 0;
  const rows = sits.map((x, i) => {
    const out = i >= chairs || x.id === s.loserId;
    return `<div class="status-row ${out ? 'is-out' : ''}">
      <span class="mch-order__n ${i < 3 && !out ? 'is-top' : ''}">${out ? '✕' : i + 1}</span>
      <div class="status-row__body"><div class="status-row__name">${escapeHTML(x.name || mchNameOf(state, x.id))}</div></div>
      <span class="mch-order__ms metric">${x.ms === null || x.ms === undefined ? '—' : x.ms + ' ms'}</span></div>`;
  }).join('');
  const early = s.phase === 'result' && s.why === 'early'
    ? `<div class="status-row is-out"><span class="mch-order__n">✕</span><div class="status-row__body"><div class="status-row__name">${escapeHTML(s.loserName || '')}</div></div><span class="mch-order__ms">${escapeHTML(t.mch_early_short)}</span></div>` : '';
  return `<div class="card card--tight mch-order"><div class="eyebrow">${escapeHTML(t.mch_order)}</div>${mchRecordHtml(state, s)}${rows}${early}${mchBestLineHtml(s)}</div>`;
}

/**
 * «الأرقام القياسية» (854): the round that broke the room's fastest sit slams «رقم جديد
 * للأوضة!» with the name and the time (played once, mchAfter); otherwise the room's record
 * sits at the foot of the order. The server keeps it (shared.best, shared.record).
 */
function mchRecordHtml(state, s) {
  const r = s.record;
  if (!r || (s.phase !== 'result' && s.phase !== 'gameover')) return '';
  const t = mchT();
  const name = mchNameOf(state, r.id) || r.name || '';
  const slam = motionFirst(['mch-rec', roomDealKey(state), s.round].join('|')) && !motionOff();
  return `<div class="mch-rec ${slam ? 'is-slam' : ''}" data-mch-rec>
      <b class="mch-rec__t">${escapeHTML(t.mch_rec_new)}</b>
      <span class="mch-rec__line">${escapeHTML(mchFill(t.mch_rec_line, { name: mchIso(name), ms: r.ms }))}</span>
      ${typeof r.was === 'number' ? `<span class="mch-rec__was">${escapeHTML(mchFill(t.mch_rec_was, { ms: r.was }))}</span>` : ''}
    </div>`;
}
function mchBestLineHtml(s) {
  const b = s.best;
  if (!b || typeof b.ms !== 'number' || s.record) return '';
  return `<p class="mch-rec-room">${escapeHTML(mchFill(mchT().mch_rec_room, { name: mchIso(b.name || ''), ms: b.ms }))}</p>`;
}

/** The TV's side while the music plays: who is in the ring, and who is out already. */
function mchRingListHtml(state, s) {
  const t = mchT();
  const alive = s.alive || [];
  const rows = (state.players || []).filter((p) => (s.roster || []).indexOf(p.id) !== -1).map((p) => {
    const out = alive.indexOf(p.id) === -1;
    const dj = out && s.dj === p.id;
    return `<div class="status-row ${out && !dj ? 'is-out' : ''}"><span class="mch-order__n" style="${out ? 'background:var(--surface-3);color:var(--text-2)' : mchChipStyle(mchColorOf(s, p.id))}">${escapeHTML(mchInitial(p.name))}</span><div class="status-row__body"><div class="status-row__name">${escapeHTML(p.name)}</div></div>${dj ? `<span class="badge badge--accent">🎧 ${escapeHTML(mchDjT().mch_dj_short)}</span>` : out ? '<span class="mch-order__ms">✕</span>' : ''}</div>`;
  }).join('');
  return `<div class="card card--tight mch-order"><div class="eyebrow">${escapeHTML(t.mch_in_ring)}</div>${rows}</div>`;
}

/**
 * The end: the winner crowned, the places (the last out first), the wins of the evening.
 * On the TV (tv) the wins are on its strip of players already (tvStrip reads the board), so
 * the side holds the places alone, sized in the TV's units and in two columns from
 * MCH_TV_PLACES_TWO_COLS places on (a ring of eight fits 1280x720 with the buttons).
 */
const MCH_TV_PLACES_TWO_COLS = 5;
function mchOverHtml(state, s, tv) {
  const t = mchT();
  const places = s.places || [];
  const medals = ['🥇', '🥈', '🥉'];
  const rise = motionFirst(['mch-over', roomDealKey(state)].join('|'));
  const list = places.map((p, i) => `<div class="mch-place ${rise ? 'mch-place--rise' : ''}" style="--at:${i * 140}ms"><span class="mch-place__medal">${medals[i] || (i + 1)}</span><span class="mch-place__name">${escapeHTML(p.name)}</span></div>`).join('');
  // «أحلى دي جي»: whoever caught the most with a fake stop (none caught anyone: no title).
  // A line at the foot of the places card, not a card of its own: the TV's side is tall already.
  const best = s.bestDj && s.bestDj.n > 0
    ? `<div class="mch-best-dj ${rise ? 'mch-place--rise' : ''}" style="--at:${places.length * 140 + 200}ms">
        <span class="mch-best-dj__icon" aria-hidden="true">🎧</span>
        <div><div class="eyebrow">${escapeHTML(mchDjT().mch_best_dj)}</div>
        <div class="mch-best-dj__name">${escapeHTML((s.bestDj.names || []).join(' · '))}</div>
        <div class="mch-best-dj__n">${escapeHTML(mchFill(mchDjT().mch_best_dj_n, { n: s.bestDj.n }))}</div></div></div>` : '';
  const two = tv && places.length >= MCH_TV_PLACES_TWO_COLS ? ' is-two' : '';
  return `<div class="card mch-over ${tv ? 'mch-over--tv' : ''} ${rise ? 'mch-over--rise' : ''}" data-reveal-ms="${rise ? 700 + places.length * 140 : 0}">
      <div class="eyebrow">${escapeHTML(t.mch_places)}</div><div class="mch-over__places${two}">${list}</div>${best}</div>
    ${tv ? '' : renderScoreboard(s.board, t.mch_wins)}`;
}

/**
 * «الدي جي»: the panel the round's DJ gets in place of the out note. «وقّف» (and
 * «وقفة خداعية» with the fake stops on) are drawn locked; the paint tick opens
 * them once the music has played MCH_DJ_FIRST_MS and keeps the lines current.
 */
function mchDjHtml(state, s) {
  const t = mchT();
  const fake = !!(s.settings && s.settings.fake);
  const enter = motionFirst(['mch-dj', roomDealKey(state), s.round].join('|')) ? ' mch-dj--in' : '';
  return `<div class="mch-dj${enter}">
      <div class="mch-dj__head"><span class="mch-dj__disc" data-mch-disc aria-hidden="true">💿</span><span class="mch-dj__title">${escapeHTML(mchDjT().mch_dj_you)}</span></div>
      <button type="button" class="mch-btn is-go" data-mch-djstop disabled onclick="mchDj('djStop', this)">
        <span class="mch-btn__label">${escapeHTML(mchDjT().mch_dj_stop)}</span><span class="mch-btn__sub" data-mch-djline></span></button>
      ${fake ? `<button type="button" class="btn btn--secondary btn--auto" data-mch-djfake disabled onclick="mchDj('djFake', this)">🎭 ${escapeHTML(mchDjT().mch_dj_fake)} · <span data-mch-djleft></span></button>` : ''}
      <p class="mch-hint">${escapeHTML(mchDjT().mch_dj_hint_play)}</p>
    </div>`;
}

/* --- the room game ------------------------------------------------------------- */
ROOM_GAMES.chairs = {
  lateJoin: true,     // someone who joins mid-game watches the ring, and is dealt in with play again
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = mchT();
    const o = mchOpts();
    return `
      <div class="card card--tight">
        <label class="switch-row" for="mch-fake">
          <span class="field__label">${escapeHTML(t.mch_fake)}</span>
          <span class="switch">
            <input type="checkbox" id="mch-fake" role="switch" ${o.fake ? 'checked' : ''} onchange="mchSetOpt({ fake: this.checked })">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>
        <p class="field__hint" style="text-align:center">${escapeHTML(o.fake ? t.mch_fake_hint : t.mch_lobby_hint)}</p>
        <label class="switch-row" for="mch-dj">
          <span class="field__label">🎧 ${escapeHTML(mchDjT().mch_dj)}</span>
          <span class="switch">
            <input type="checkbox" id="mch-dj" role="switch" ${o.dj ? 'checked' : ''} onchange="mchSetOpt({ dj: this.checked })">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>
        ${o.dj ? `<p class="field__hint" style="text-align:center">${escapeHTML(mchDjT().mch_dj_hint)}</p>` : ''}
      </div>`;
  },
  startPayload() { const o = mchOpts(); return { fake: !!o.fake, dj: !!o.dj }; },

  render(state) {
    if (appState.currentView !== 'room-chairs') setView('room-chairs');
    const el = document.getElementById('view-room-chairs');
    if (!el) return;
    mchNoteTime(state);
    const t = mchT();
    const s = state.shared || {};
    const me = Room.me;
    const alive = s.alive || [];
    const inRing = alive.indexOf(me) !== -1;
    const sits = s.sits || [];
    const myRank = sits.findIndex((x) => x.id === me);
    const voice = mchIsVoice(state);
    const screenOn = (state.screens || []).some((x) => x.online);

    const sig = ['mch', roomDealKey(state), s.phase, s.round, s.chairs, (s.order || []).join(','), alive.join(','),
      sits.map((x) => x.id + ':' + x.ms).join(','), s.loserId, s.why, s.winnerId, JSON.stringify(s.wins || {}),
      state.youAreHost, voice, screenOn, inRing, appState.lang, mchDjSig(s), mchRecSig(s)].join('|');

    const before = mchRects(el);
    renderRoomFrame(el, sig, () => {
      const head = `
        <div class="play-head mch-head">
          <span class="badge">${escapeHTML(t.round)} <span class="metric">${s.round || 1}</span></span>
          <span class="badge badge--accent">🪑 ${escapeHTML(mchChairsWord(s.chairs || 0))}</span>
          <span class="badge">${escapeHTML(mchFill(t.mch_alive, { n: alive.length }))}</span>
          ${s.dj && s.phase === 'music' ? `<span class="badge badge--accent">🎧 ${escapeHTML(mchFill(mchDjT().mch_dj_is, { name: mchIso(mchNameOf(state, s.dj) || s.djName || '') }))}</span>` : ''}
        </div>`;
      let bar;
      if (s.phase === 'gameover') {
        bar = '';
      } else if (s.phase === 'music' && s.dj && s.dj === me) {
        bar = mchDjHtml(state, s);
      } else if (!inRing) {
        bar = `<div class="waiting-note">${escapeHTML((s.outOrder || []).indexOf(me) !== -1 ? t.mch_you_out : t.mch_watching)}</div>`;
      } else if (s.phase === 'music') {
        bar = `<button type="button" class="mch-btn is-wait" onclick="mchSit(this)">
                 <span class="mch-btn__label">${escapeHTML(t.mch_wait_btn)}</span><span class="mch-btn__sub">${escapeHTML(t.mch_music_on)}</span></button>
               <p class="mch-hint">${escapeHTML(t.mch_tap_hint)}</p>
               <p class="mch-hint mch-hint--voice">${escapeHTML(voice ? t.mch_voice_you : screenOn ? t.mch_voice_tv : t.mch_voice_host)}</p>`;
      } else if (s.phase === 'sit') {
        const pressed = mch.pressed === roomDealKey(state) + '|' + s.round;
        bar = myRank !== -1 || pressed
          ? `<div class="mch-sat ${myRank === 0 ? 'is-first' : ''}"><span class="mch-sat__n">${myRank === -1 ? '…' : escapeHTML(mchFill(t.mch_sat, { n: myRank + 1 }))}</span><span class="mch-sat__ms metric">${myRank === -1 ? '' : (sits[myRank].ms + ' ms')}</span></div>`
          : `<button type="button" class="mch-btn is-go mch-btn--pop" onpointerdown="mchSit(this)" onclick="mchSit(this)"><span class="mch-btn__label">${escapeHTML(t.mch_sit)}</span></button>`;
      } else {
        bar = s.loserId === me
          ? `<div class="mch-sat is-out"><span class="mch-sat__n">${escapeHTML(t.mch_you_out)}</span>${s.settings && s.settings.dj ? `<span class="mch-hint">${escapeHTML(mchDjT().mch_dj_next)}</span>` : ''}</div>`
          : `<div class="mch-sat"><span class="mch-sat__n">${escapeHTML(myRank === -1 ? t.mch_safe : mchFill(t.mch_sat, { n: myRank + 1 }))}</span></div>`;
      }
      const host = s.phase === 'result' ? roomMoveOnHtml(state, roomHostRow([[t.mch_next_now, "roomAct('nextRound', {})", 'secondary']]))
        : !state.youAreHost ? '' : (s.phase === 'result'
        ? ''
        : s.phase === 'gameover'
          ? `<div class="btn-row" style="margin-top:var(--sp-3)"><button class="btn btn--go" onclick="roomAct('playAgain', {})">▶ ${escapeHTML(t.mch_play_again)}</button><button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game)}</button></div>`
          : '');
      const share = s.phase === 'gameover' && typeof roomShareBtnHtml === 'function' ? roomShareBtnHtml(state, s.board) : '';
      const over = s.phase === 'gameover' ? mchOverHtml(state, s) : '';
      return `<div class="mch">${head}${mchRingHtml(state, s)}<div class="mch-bar">${bar}</div>${over}${host}${share}${mchOrderHtml(state, s)}${renderRoomPlayerStrip(state)}</div>`;
    });
    refreshRoomPlayerStrip(el, state);
    mchAfter(state, el, before);
  }
};

/**
 * The tap: locked at once, sent with the server's time as this phone knows it.
 * «اقعد!» fires on the finger going down (someone else sitting rebuilds the
 * bar, so a click could land on a button that is no longer there), and its
 * click - the keyboard's way - finds it already sent: one sit a round.
 */
function mchSit(btn) {
  const state = Room.state;
  const s = (state && state.shared) || {};
  const once = roomDealKey(state) + '|' + s.round + '|' + s.phase;
  if (mch.sent === once) return;
  mch.sent = once;
  if (btn) { btn.classList.add('is-pressed'); btn.disabled = true; }
  haptic('heavy');
  if (s.phase === 'sit') mch.pressed = roomDealKey(state) + '|' + s.round;
  roomAct('sit', { round: s.round, at: mchTapAt() });
}

/** What of «الدي جي» a frame shows (its signature): who, gone, the fakes used, who a fake caught, the title. */
function mchRecSig(s) {
  return [s.best ? s.best.ms + ':' + s.best.id : '', s.record ? s.record.ms : ''].join(':');
}

function mchDjSig(s) {
  return [s.dj || '', s.djLost ? 1 : 0, s.djFakes || 0, s.trapBy || '', s.bestDj ? JSON.stringify(s.bestDj) : '', s.settings && s.settings.fake ? 1 : 0].join(':');
}

/**
 * The DJ's two buttons. The server is the judge (the 4 s, the count, the gap,
 * its own stamp of the moment); the phone only keeps a double tap from
 * sending twice. «وقّف» goes once a round; a fake locks for a beat until the
 * pause comes back from the server.
 */
function mchDj(action, btn) {
  const state = Room.state;
  const s = (state && state.shared) || {};
  if (s.phase !== 'music' || !s.dj || s.dj !== Room.me) return;
  if (mchServerNow() < (s.startAt || 0) + MCH_DJ_FIRST_MS) return;
  const key = roomDealKey(state) + '|' + s.round;
  if (action === 'djStop') {
    if (mch.djSent === key) return;
    mch.djSent = key;
    if (btn) { btn.classList.add('is-pressed'); btn.disabled = true; }
    haptic('heavy');
  } else {
    if (Date.now() - (mch.djFakeTap || 0) < 900) return;
    mch.djFakeTap = Date.now();
    if (btn) btn.disabled = true;
    haptic('light');
  }
  roomAct(action, { round: s.round });
}

/** The DJ's panel, painted in place: the buttons open after the first seconds, the lines count down. */
function mchDjPaint(el, st, sh) {
  const stop = el.querySelector('[data-mch-djstop]');
  if (!stop || sh.dj !== Room.me) return;
  const t = mchT();
  const now = mchServerNow();
  const start = sh.startAt || now;
  const ready = now >= start + MCH_DJ_FIRST_MS;
  const sent = mch.djSent === roomDealKey(st) + '|' + sh.round;
  const lock = !ready || sent;
  if (stop.disabled !== lock) stop.disabled = lock;
  const line = el.querySelector('[data-mch-djline]');
  const txt = ready
    ? mchFill(mchDjT().mch_dj_auto, { n: Math.max(0, Math.ceil((start + MCH_DJ_MAX_MS - now) / 1000)) })
    : mchFill(mchDjT().mch_dj_ready_in, { n: Math.max(1, Math.ceil((start + MCH_DJ_FIRST_MS - now) / 1000)) });
  if (line && line.textContent !== txt) line.textContent = txt;
  const fake = el.querySelector('[data-mch-djfake]');
  if (!fake) return;
  const used = sh.djFakes || 0;
  const paused = !!sh.pause && now < sh.pause.until;
  const gap = sh.djLastFake && now < sh.djLastFake.until + MCH_DJ_FAKE_GAP_MS;
  const late = now + MCH_DJ_FAKE_MS + 500 >= start + MCH_DJ_MAX_MS;
  const off = lock || paused || gap || late || used >= MCH_DJ_FAKES || Date.now() - (mch.djFakeTap || 0) < 900;
  if (fake.disabled !== off) fake.disabled = off;
  const left = fake.querySelector('[data-mch-djleft]');
  const ltxt = mchFill(mchDjT().mch_dj_fakes_left, { n: Math.max(0, MCH_DJ_FAKES - used) });
  if (left && left.textContent !== ltxt) left.textContent = ltxt;
}

/* --- motion, sound and the clocks, after every paint (phone and TV) ------------ */
function mchRects(el) {
  const map = {};
  if (!el || motionOff()) return map;
  el.querySelectorAll('[data-mch-av]').forEach((a) => { const r = a.getBoundingClientRect(); if (r.width) map[a.dataset.mchAv] = r; });
  return map;
}

function mchAfter(state, el, before) {
  const s = state.shared || {};
  const key = roomDealKey(state) + '|' + s.round;
  mchNoteTime(state);
  // The ring's spin and the equalizer: one animation each, their speed the tempo's.
  const orbitEl = el.querySelector('[data-mch-orbit]');
  if (orbitEl && !orbitEl.dataset.spun) {
    orbitEl.dataset.spun = '1';
    mchStopOrbit();
    if (!motionOff() && orbitEl.animate) {
      const lap = 60 / MCH_BPM_START * 8 * 1000;      // eight beats a lap
      mch.orbit = orbitEl.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: lap, iterations: Infinity });
      orbitEl.querySelectorAll('.mch-av').forEach((a) => {
        mch.eq.push(a.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-360deg)' }], { duration: lap, iterations: Infinity }));
      });
      // The DJ's record turns with the beat (and stands still in a fake stop).
      el.querySelectorAll('[data-mch-disc]').forEach((disc) => {
        mch.eq.push(disc.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 60 / MCH_BPM_START * 4 * 1000, iterations: Infinity }));
      });
      el.querySelectorAll('[data-mch-eq] > i').forEach((bar, i) => {
        const beat = 60 / MCH_BPM_START * 1000;
        const hi = 0.45 + ((i * 7) % 5) * 0.12;
        mch.eq.push(bar.animate([{ transform: 'scaleY(0.25)' }, { transform: `scaleY(${hi})` }, { transform: 'scaleY(0.3)' }, { transform: 'scaleY(1)' }, { transform: 'scaleY(0.25)' }],
          { duration: beat * (i % 2 ? 2 : 1), iterations: Infinity, delay: -i * 90, easing: 'ease-in-out' }));
      });
    }
  }
  if (!orbitEl && !el.querySelector('[data-mch-bounce]')) mchStopOrbit();
  mchFinalAfter(el);
  // The avatars that moved hop from where they were (a chair, or their spot in the orbit).
  if (before && Object.keys(before).length) mchFlip(el, before, s);
  // «الدي جي»: the DJ's phone buzzes as their round starts (and the turn alert says so).
  if (s.phase === 'music' && s.dj && s.dj === Room.me && mchOnce('dj|' + key)) haptic('medium');
  // The stop: every phone buzzes and flashes once; the voice scratches the record.
  if (s.phase === 'sit' && mchOnce('stop|' + key)) {
    haptic('heavy');
    const ring = el.querySelector('[data-mch-ring]');
    if (ring && !motionOff()) { ring.classList.add('is-flash'); setTimeout(() => ring.classList.remove('is-flash'), 700); }
    if (mchIsVoice(state)) mchSound('stop');
  }
  // A sit landing: a short note on the voice, higher the earlier.
  (s.sits || []).forEach((x, i) => { if (mchOnce('sat|' + key + '|' + x.id) && mchIsVoice(state) && s.phase === 'sit') mchSound('sat', i); });
  // «رقم جديد للأوضة!»: the stamp slams once on every screen, a fanfare on the voice, a buzz for its holder.
  if (s.record && (s.phase === 'result' || s.phase === 'gameover') && mchOnce('rec|' + key)) {
    if (mchIsVoice(state)) setTimeout(() => playSound('success'), 250);
    if (s.record.id === Room.me && !state.youAreScreen) haptic('heavy');
  }
  if (s.phase === 'result' && mchOnce('out|' + key)) {
    if (mchIsVoice(state)) mchSound(s.why === 'early' ? 'early' : 'out');
    if (s.loserId === Room.me) haptic('medium');
  }
  if (s.phase === 'gameover' && mchOnce('over|' + roomDealKey(state))) {
    if (mchIsVoice(state)) { mchSound('win'); }
    if (s.winnerId && (s.winnerId === Room.me || state.youAreScreen)) {
      const card = el.querySelector('.mch-over') || el;
      afterReveal(card, () => { if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } }); });
    }
  }
  // The music, on the one voice.
  if (s.phase === 'music' && mchIsVoice(state)) mchMusicSync(state, s);
  else mchMusicStop();
  // Tempo, the sit window and the countdown, painted in place.
  if (mch.timer) clearInterval(mch.timer);
  mch.timer = null;
  const paint = () => {
    const st = Room.state;
    if (!st || st.game !== 'chairs') { mchStopAll(); return; }
    const sh = st.shared || {};
    mch.lastRects = mchRects(el);          // where every avatar is now, for the next redraw's hop
    if (sh.phase === 'music') {
      const paused = !!sh.pause && mchServerNow() < sh.pause.until;
      const rate = paused ? 0 : mchTempo(sh) / MCH_BPM_START;
      if (mch.orbit) mch.orbit.playbackRate = rate;
      mch.eq.forEach((a) => { a.playbackRate = rate; });
      if (mch.music) mch.music.paused = paused;
      mchDjPaint(el, st, sh);
    } else if (sh.phase === 'sit') {
      const bar = el.querySelector('[data-mch-window]');
      if (bar) bar.style.transform = 'scaleX(' + Math.max(0, 1 - (mchServerNow() - (sh.stopAt || 0)) / MCH_SIT_MS).toFixed(3) + ')';
    } else if (sh.phase === 'result') {
      const n = el.querySelector('[data-mch-next]');
      if (n && sh.nextAt) {
        const left = Math.max(0, Math.ceil((sh.nextAt - mchServerNow()) / 1000));
        const txt = mchFill(mchT().mch_next_in, { n: left });
        if (n.textContent !== txt) { n.textContent = txt; if (typeof motionBump === 'function') motionBump(n); }
      }
    }
  };
  paint();
  mch.lastRects = mchRects(el);
  if (s.phase === 'music' || s.phase === 'sit' || s.phase === 'result') mch.timer = setInterval(paint, s.phase === 'sit' ? 60 : 250);
}

/** The tempo now: from MCH_BPM_START up to MCH_BPM_END over the first MCH_BPM_RAMP_MS of the round. */
function mchTempo(s) {
  const elapsed = Math.max(0, mchServerNow() - (s.startAt || mchServerNow()));
  return MCH_BPM_START + (MCH_BPM_END - MCH_BPM_START) * Math.min(1, elapsed / MCH_BPM_RAMP_MS);
}

function mchFlip(el, before, s) {
  if (motionOff()) return;
  let k = 0;
  el.querySelectorAll('[data-mch-av]').forEach((a) => {
    const old = before[a.dataset.mchAv];
    if (!old || !a.animate) return;
    const now = a.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
    const hop = a.classList.contains('is-sat') ? -Math.max(18, now.height * 0.6) : -8;
    a.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(1)` },
      { transform: `translate(${dx / 2}px, ${dy / 2 + hop}px) scale(1.18)`, offset: 0.55 },
      { transform: 'translate(0, 0) scale(1)' }
    ], { duration: 520, delay: k * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    k++;
  });
}

function mchStopOrbit() {
  if (mch.orbit) { try { mch.orbit.cancel(); } catch (e) {} }
  mch.orbit = null;
  mch.eq.forEach((a) => { try { a.cancel(); } catch (e) {} });
  mch.eq = [];
}
function mchStopAll() {
  mchStopOrbit();
  mchMusicStop();
  if (mch.timer) clearInterval(mch.timer);
  mch.timer = null;
}
onLeaveScreen((from) => { if (from === 'room-chairs' || from === 'room-tv') mchStopAll(); });
onRoomClocksReset(() => mchStopAll());

/* --- the music: an Egyptian beat made here, its tempo climbing ------------------ */
// Maqsum on the darbuka, eight steps a bar: D T _ T D _ T _ (a dum on 1 and 5, taks between).
const MCH_MAQSUM = ['D', 'T', '', 'T', 'D', '', 'T', ''];
// A riff in hijaz on D, two bars of eighths: a bright, party-ish line over the beat.
const MCH_RIFF = [293.66, 0, 369.99, 392, 440, 0, 392, 369.99, 311.13, 0, 293.66, 0, 440, 392, 369.99, 0,
                  293.66, 0, 369.99, 392, 523.25, 0, 466.16, 440, 392, 0, 369.99, 0, 311.13, 293.66, 0, 0];

function mchMusicSync(state, s) {
  const key = roomDealKey(state) + '|' + s.round;
  if (mch.music && mch.music.key === key) return;
  mchMusicStop();
  const ctx0 = fxCtx();
  if (!ctx0) return;
  // «النهائي»: the zaffa in place of the maqsum and its riff.
  const m = { key, step: 0, ctx: ctx0, nextT: ctx0.currentTime + 0.08, paused: false, timer: null, s, final: mchIsFinal(s) };
  mch.music = m;
  const tick = () => {
    if (mch.music !== m) return;
    // Read the context every tick: wakeAudio replaces one iOS left stuck, and a
    // context kept from the start would stay silent for the rest of the round.
    const ctx = fxCtx();
    if (!ctx) return;
    if (ctx !== m.ctx) { m.ctx = ctx; m.nextT = ctx.currentTime + 0.05; }
    if (ctx.state !== 'running') return;
    if (m.paused) { m.nextT = ctx.currentTime + 0.06; return; }
    const sh = (Room.state && Room.state.shared) || s;
    while (m.nextT < ctx.currentTime + 0.28) {
      const bpm = mchTempo(sh);
      const stepDur = 60 / bpm / 2;
      (m.final ? mchPlayZaffa : mchPlayStep)(m.step, m.nextT, stepDur);
      m.step++;
      m.nextT += stepDur;
    }
  };
  m.timer = setInterval(tick, 80);
  tick();
}
function mchMusicStop() {
  if (mch.music && mch.music.timer) clearInterval(mch.music.timer);
  mch.music = null;
}
function mchPlayStep(step, at, dur) {
  const hit = MCH_MAQSUM[step % 8];
  if (hit === 'D') {
    fxTone('sine', [[0, 150], [0.09, 55]], [[0, 0.5], [0.02, 0.42], [0.22, 0.001]], at);
    fxNoise('lowpass', 500, 0.8, [[0, 0.35], [0.06, 0.001]], at);
  } else if (hit === 'T') {
    fxNoise('highpass', 2600, 1.2, [[0, 0.22], [0.045, 0.001]], at);
    fxTone('triangle', [[0, 900], [0.03, 700]], [[0, 0.08], [0.05, 0.001]], at);
  }
  if (step % 2 === 0) {
    // A closed hat on every beat's off-step keeps the pulse under the riff.
    fxNoise('highpass', 6000, 0.8, [[0, 0.06], [0.03, 0.001]], at + dur);
  }
  const note = MCH_RIFF[step % MCH_RIFF.length];
  if (note) {
    const len = Math.min(0.3, dur * 1.7);
    fxTone('square', [[0, note]], [[0, 0.0001], [0.012, 0.075], [len * 0.7, 0.045], [len, 0.0001]], at, 4);
    fxTone('triangle', [[0, note / 2]], [[0, 0.0001], [0.01, 0.06], [len, 0.0001]], at);
  }
  if (hit === 'D') fxTone('sine', [[0, 73.42]], [[0, 0.0001], [0.01, 0.18], [dur * 1.6, 0.0001]], at);
}

/** The moments' sounds on the voice (the TV, or the host's phone): the needle scratch, a seat taken, out, the win. */
function mchSound(kind, i) {
  try {
    const at = fxCtx().currentTime + 0.01;
    if (kind === 'stop') {
      fxNoise('bandpass', 1800, 2.5, [[0, 0.4], [0.16, 0.001]], at);
      fxTone('sawtooth', [[0, 320], [0.3, 70]], [[0, 0.18], [0.3, 0.001]], at);
    } else if (kind === 'sat') {
      const hz = 660 - Math.min(6, i || 0) * 60;
      fxTone('sine', [[0, hz], [0.07, hz * 1.5]], [[0, 0.2], [0.14, 0.001]], at);
    } else if (kind === 'out') {
      playFx('sad');
    } else if (kind === 'early') {
      playFx('fail');
    } else if (kind === 'win') {
      playFx('tada');       // no زغروطة here (the owner, 28 Sep 2026)
    }
  } catch (e) {}
}

/* --- «النهائي» (850 B, the owner's pick of 7 Oct 2026) ------------------------------
   When two are left with one chair the ring becomes a stage: red curtains, a floor, one
   spotlight on the chair in the middle, the two big on the left and the right like a
   boxing final, «VS», and the zaffa (its own beat and a mizmar line, mchPlayZaffa). At
   the stop the one who sat hops onto the chair. At the end the moment plays again slowed
   down: two lanes, a dashed finish line through the chair, each running to it at its own
   tap time (sits[].ms, ×MCH_REPLAY_SLOW, the clocks counting), the winner taking the
   chair with the crown, and the gap in seconds below. Phone and TV draw the same stage
   (positions are percentages of it, sizes in cqw). The stage is always dark: its own
   colours (curtain, floor, light) are fixed, like a TV stage. Played once (motionFirst);
   with motion off it is drawn at its end. */
const MCH_REPLAY_SLOW = 4, MCH_REPLAY_MAX_MS = 4200;
const MCH_FIN_LANE = [36, 68];       // the lanes' heights (% of the stage): the left one's, the right one's
/** The round is the final: two in the ring and one chair (a round dealt to two). */
const mchIsFinal = (s) => !!s && s.chairs === 1 && (s.order || []).length === 2 && !!s.phase;
const mchSecs = (ms) => (Math.max(0, ms) / 1000).toFixed(3);
/** The chair on the stage, from the side (the ring's is seen from above). */
const MCH_FIN_CHAIR = '<svg viewBox="0 0 100 120" aria-hidden="true" focusable="false"><path d="M20 10 h60 v50 h-60z" fill="#c98b5a" stroke="#3b2414" stroke-width="5"/><path d="M14 60 h72 v14 h-72z" fill="#e0a56e" stroke="#3b2414" stroke-width="5"/><path d="M20 74 v40 M80 74 v40" stroke="#3b2414" stroke-width="7"/></svg>';

function mchFinalHtml(state, s, o) {
  const t = mchT();
  const order = s.order;
  const music = s.phase === 'music', sit = s.phase === 'sit';
  const sits = s.sits || [];
  const msOf = (id) => { const x = sits.find((r) => r.id === id); return x && typeof x.ms === 'number' ? x.ms : null; };
  const winner = !music && !sit ? (s.winnerId || (s.loserId ? order.find((id) => id !== s.loserId) : '')) : '';
  // The replay: once, with motion on, when the winner has a time to run.
  const runs = !!winner && s.why !== 'early' && s.why !== 'left' && msOf(winner) !== null;
  const replay = runs && !motionOff() && motionFirst(['mch-replay', roomDealKey(state), s.round].join('|'));
  const face = (id, x, y, cls, attr, tag) => {
    const name = mchNameOf(state, id) || (sits.find((r) => r.id === id) || {}).name || (id === s.loserId ? s.loserName : '') || '';
    return `<div class="mch-fin__av ${id === Room.me ? 'is-me' : ''} ${cls}" ${attr} style="left:${x}%;top:${y}%">
      <span class="mch-fin__face" style="${mchChipStyle(mchColorOf(s, id))}">${escapeHTML(mchInitial(name))}${tag || ''}</span>
      <span class="mch-fin__name">${escapeHTML(name)}</span></div>`;
  };
  let h = '<div class="mch-fin__curtain is-l"></div><div class="mch-fin__curtain is-r"></div><div class="mch-fin__floor"></div><div class="mch-fin__cone"></div>'
    + `<div class="mch-fin__chair">${MCH_FIN_CHAIR}</div>`;
  if (music) {
    h += `<div class="mch-fin__title">${escapeHTML(t.mch_final)}</div><div class="mch-fin__vs">VS</div>`;
    order.forEach((id, i) => { h += face(id, i ? 80 : 20, 46, '', `data-mch-av="${escapeHTML(id)}" data-mch-bounce="${i}"`); });
    h += `<div class="mch-fin__zaffa"><span data-mch-zb>🥁</span><span data-mch-zb>🎺</span><b>${escapeHTML(s.djLost ? mchDjT().mch_dj_lost : t.mch_zaffa)}</b><span data-mch-zb>🪘</span><span data-mch-zb>💃</span></div>`;
  } else if (sit) {
    h += `<div class="mch-fin__title is-stop">${escapeHTML(t.mch_stopped)}<div class="mch-window"><i data-mch-window></i></div></div>`;
    order.forEach((id, i) => {
      const sat = !!sits.length && sits[0].id === id;
      h += face(id, sat ? 50 : (i ? 70 : 30), sat ? 50 : 46, sat ? 'is-sat' : '', `data-mch-av="${escapeHTML(id)}"`);
    });
  } else {
    h += `<div class="mch-fin__title">${escapeHTML(t.mch_final)}</div>`;
    if (runs) h += `<div class="mch-fin__lane" style="top:${MCH_FIN_LANE[0]}%"></div><div class="mch-fin__lane" style="top:${MCH_FIN_LANE[1]}%"></div><div class="mch-fin__line"></div>`;
    if (replay) h += `<div class="mch-fin__replay">⏪ ${escapeHTML(t.mch_replay)}</div>`;
    order.forEach((id, i) => {
      const win = id === winner;
      if (!win && id !== s.loserId) return;
      const ms = msOf(id);
      const x = win ? 50 : runs ? (i ? 64 : 36) : (i ? 78 : 22);
      const y = win ? 50 : runs ? MCH_FIN_LANE[i] : 46;
      h += face(id, x, y, win ? 'is-win' : 'is-out', `data-fin-side="${i}" data-fin-ms="${ms === null ? '' : ms}"`,
        win ? '<span class="mch-fin__crown" aria-hidden="true">👑</span>' : '');
      if (s.why === 'left' && !win) return;
      const txt = id === s.loserId && s.why === 'early' ? t.mch_early_short : ms === null ? '—' : mchSecs(ms);
      h += `<div class="mch-fin__time ${win ? 'is-win' : ''}" style="left:${i ? 76 : 24}%"><b>${escapeHTML(mchNameOf(state, id) || (id === s.loserId ? s.loserName : '') || '')}</b><span class="metric" dir="ltr" data-fin-time="${ms === null || (id === s.loserId && s.why === 'early') ? '' : ms}">${escapeHTML(txt)}</span></div>`;
    });
    const lo = s.loserId ? msOf(s.loserId) : null, wi = winner ? msOf(winner) : null;
    if (runs && lo !== null && wi !== null) h += `<div class="mch-fin__gap">${escapeHTML(t.mch_gap)} <b class="metric" dir="ltr">${mchSecs(lo - wi)}</b> ${escapeHTML(t.mch_secs)}</div>`;
  }
  return `<div class="mch-fin ${o && o.tv ? 'mch-fin--tv' : ''} ${replay ? 'is-replay' : ''}" data-mch-ring data-mch-final dir="ltr">${h}</div>`;
}

/** The final's motion after a paint: the bounce to the beat (on the orbit's list, so the tempo and a fake pause hold it), and the replay. */
function mchFinalAfter(el) {
  const st = el.querySelector('[data-mch-final]');
  if (!st) return;
  const bounce = st.querySelectorAll('[data-mch-bounce], [data-mch-zb]');
  if (bounce.length && !st.dataset.spun) {
    st.dataset.spun = '1';
    mchStopOrbit();
    if (!motionOff() && st.animate) {
      const beat = 60 / MCH_BPM_START * 1000;
      bounce.forEach((b, i) => {
        const lean = (b.dataset.mchBounce !== undefined ? (b.dataset.mchBounce === '1' ? 1 : -1) : (i % 2 ? 1 : -1)) * 6;
        mch.eq.push(b.animate([
          { transform: 'translateY(0) rotate(0deg)' },
          { transform: `translateY(-14%) rotate(${lean}deg)` },
          { transform: 'translateY(0) rotate(0deg)' },
          { transform: `translateY(-8%) rotate(${-lean}deg)` },
          { transform: 'translateY(0) rotate(0deg)' }
        ], { duration: beat * 2, iterations: Infinity, delay: -(i % 2) * beat * 0.5, easing: 'ease-in-out' }));
      });
    }
  }
  if (!st.classList.contains('is-replay') || st.dataset.played) return;
  st.dataset.played = '1';
  const W = st.clientWidth, H = st.clientHeight;
  const times = Array.from(st.querySelectorAll('[data-fin-time]')).filter((x) => x.dataset.finTime !== '');
  const most = Math.max(1, ...Array.from(st.querySelectorAll('[data-fin-side]')).map((a) => Number(a.dataset.finMs) || 0));
  const k = Math.max(1, Math.min(MCH_REPLAY_SLOW, MCH_REPLAY_MAX_MS / most));
  const px = (dx, dy) => `translate(${(dx / 100 * W).toFixed(1)}px, ${(dy / 100 * H).toFixed(1)}px)`;
  let total = 0;
  st.querySelectorAll('[data-fin-side]').forEach((a) => {
    if (a.dataset.finMs === '' || !a.animate) return;           // never tapped: stood still
    const i = Number(a.dataset.finSide), run = Number(a.dataset.finMs) * k;
    const x = parseFloat(a.style.left), y = parseFloat(a.style.top);
    const sx = i ? 88 : 12, lane = MCH_FIN_LANE[i];
    if (a.classList.contains('is-win')) {
      // To the line at its own time, then the hop onto the chair.
      const dur = run + 460;
      a.animate([
        { transform: px(sx - x, lane - y) },
        { transform: px(50 - x, lane - y), offset: run / dur },
        { transform: px(0, (lane - y) / 2 - 8) + ' scale(1.12)', offset: (run + 260) / dur },
        { transform: 'translate(0px, 0px) scale(1)' }
      ], { duration: dur, easing: 'linear', fill: 'backwards' });
      total = Math.max(total, dur);
    } else {
      a.animate([{ transform: px(sx - x, 0) }, { transform: 'translate(0px, 0px)' }], { duration: run, easing: 'linear', fill: 'backwards' });
      total = Math.max(total, run);
    }
  });
  // The clocks run in the slowed time, each stopping at its own.
  const t0 = performance.now();
  times.forEach((x) => { x.textContent = mchSecs(0); });
  const tick = () => {
    if (!st.isConnected) return;
    const real = (performance.now() - t0) / k;
    let going = false;
    times.forEach((x) => {
      const ms = Number(x.dataset.finTime);
      const v = mchSecs(Math.min(ms, real));
      if (x.textContent !== v) x.textContent = v;
      if (real < ms) going = true;
    });
    if (going) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  // The end: the crown, the gap, the loser greyed - by a timer, never only by an animation's end.
  setTimeout(() => {
    times.forEach((x) => { x.textContent = mchSecs(Number(x.dataset.finTime)); });
    if (!st.isConnected) return;
    st.classList.remove('is-replay');
    const rep = st.querySelector('.mch-fin__replay');
    if (rep) rep.remove();
    st.querySelectorAll('.mch-fin__crown, .mch-fin__gap').forEach((x) => {
      if (x.animate) x.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
    });
  }, total + 120);
}

/* --- the zaffa: the final's music (a zaffa on the tabl and the riq, a mizmar line in hijaz) --- */
// Two bars of eighths: D _ T T D _ T _ | D _ T T D T T _.
const MCH_ZAFFA = ['D', '', 'T', 'T', 'D', '', 'T', '', 'D', '', 'T', 'T', 'D', 'T', 'T', ''];
const MCH_ZAFFA_RIFF = [587.33, 0, 523.25, 466.16, 440, 0, 466.16, 440, 392, 0, 369.99, 392, 440, 0, 0, 0,
                        440, 466.16, 523.25, 587.33, 0, 523.25, 466.16, 440, 392, 369.99, 392, 440, 0, 392, 369.99, 293.66];
function mchPlayZaffa(step, at, dur) {
  const hit = MCH_ZAFFA[step % 16];
  if (hit === 'D') {
    fxTone('sine', [[0, 120], [0.12, 45]], [[0, 0.6], [0.03, 0.5], [0.3, 0.001]], at);
    fxNoise('lowpass', 380, 0.9, [[0, 0.4], [0.08, 0.001]], at);
  } else if (hit === 'T') {
    fxNoise('highpass', 2200, 1.4, [[0, 0.24], [0.05, 0.001]], at);
  }
  // The riq's jingles on every step, the beat's ones louder.
  fxNoise('bandpass', 7500, 3, [[0, step % 2 ? 0.05 : 0.09], [0.07, 0.001]], at);
  const note = MCH_ZAFFA_RIFF[step % MCH_ZAFFA_RIFF.length];
  if (note) {
    const len = Math.min(0.32, dur * 1.8);
    fxTone('sawtooth', [[0, note]], [[0, 0.0001], [0.015, 0.05], [len * 0.8, 0.035], [len, 0.0001]], at, 6);
    fxTone('square', [[0, note]], [[0, 0.0001], [0.015, 0.03], [len, 0.0001]], at, -5);
  }
}

/* --- the big screen ---------------------------------------------------------- */
TV_GAMES.chairs = {
  sig(state) {
    const s = state.shared || {};
    return ['chairs', roomDealKey(state), s.phase, s.round, s.chairs, (s.order || []).join(','), (s.alive || []).join(','),
      (s.sits || []).map((x) => x.id + ':' + x.ms).join(','), s.loserId, s.why, s.winnerId, JSON.stringify(s.wins || {}), state.youAreHost, appState.lang, mchDjSig(s), mchRecSig(s)].join('|');
  },
  frame(state, t) {
    const s = state.shared || {};
    const alive = s.alive || [];
    const dj = s.dj && s.phase === 'music' ? ` · 🎧 ${escapeHTML(mchFill(mchDjT().mch_dj_is, { name: mchIso(mchNameOf(state, s.dj) || s.djName || '') }))}` : '';
    const head = `<div class="tv-eyebrow tv-center-text">${escapeHTML(t.round)} ${s.round || 1} · ${escapeHTML(mchChairsWord(s.chairs || 0))} · ${escapeHTML(mchFill(t.mch_alive, { n: alive.length }))}${dj}</div>`;
    const host = s.phase === 'result' ? roomMoveOnHtml(state, `<div class="tv-actions">${tvBtn(t.mch_next_now, "roomAct('nextRound', {})", 'secondary')}</div>`)
      : !state.youAreHost ? '' : (s.phase === 'result'
      ? ''
      : s.phase === 'gameover' ? `<div class="tv-actions">${tvBtn('▶ ' + t.mch_play_again, "roomAct('playAgain', {})")}${tvBtn(t.room_another_game, "roomAct('backToHub')", 'ghost')}</div>` : '');
    const over = s.phase === 'gameover';
    const side = over ? mchOverHtml(state, s, true) : (mchOrderHtml(state, s) || mchRingListHtml(state, s));
    const hint = s.phase === 'music' ? `<div class="tv-note">${escapeHTML(t.mch_tap_hint)}</div>` : '';
    // A list of up to eight in the side's phone components, zoomed (tv-scale); the end in the TV's own sizes.
    const many = (s.roster || []).length > 6 ? ' is-many' : '';
    // «النهائي»: the stage takes the whole screen while the two play; at the end the side keeps the places.
    const final = mchIsFinal(s);
    if (final && !over) {
      return `<div class="mch-tv is-final"><div class="mch-tv__stage">${head}${mchRingHtml(state, s, { tv: true })}${hint}</div></div>`;
    }
    return `<div class="mch-tv${final ? ' is-final-over' : ''}">
      <div class="mch-tv__stage">${head}${mchRingHtml(state, s, { tv: true })}${hint}</div>
      <div class="mch-tv__side${over ? ' is-over' : ' tv-scale'}${many}">${side}${host}</div>
    </div>`;
  },
  after(state, rebuilt) {
    const el = document.getElementById('view-room-tv');
    if (!el) return;
    // The TV has no measure-before hook: the rects kept by the last paint tick stand in (mch.lastRects).
    mchAfter(state, el, mch.lastRects || null);
  }
};
