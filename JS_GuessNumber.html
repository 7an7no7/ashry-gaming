<script>
/* --- GUESS THE NUMBER LOGIC --- */

// The mode and the range open as they were last left (the range is a
// data-remember field); the secret number never is.
function setupGuessNumber() {
    setView('setup-guessnum');
}

/** SETUP_PAINTERS: the saved mode's tab and fields, from the menu, the back button or a reload. */
function paintGuessNumSetup() {
    setGuessMode(appState.guessnum.mode === 'human' ? 'human' : 'computer', true);
}

function setGuessMode(mode, painting) {
    appState.guessnum.mode = mode === 'human' ? 'human' : 'computer';
    mode = appState.guessnum.mode;
    if (painting !== true) saveToLocal();
    
    // UI Tabs Styling
    const btnComp = document.getElementById('btn-mode-comp');
    const btnHuman = document.getElementById('btn-mode-human');
    const divComp = document.getElementById('setup-comp-ui');
    const divHuman = document.getElementById('setup-human-ui');

    const isComputer = (mode === 'computer');
    btnComp.classList.toggle('is-active', isComputer);
    btnHuman.classList.toggle('is-active', !isComputer);
    divComp.classList.toggle('hidden', !isComputer);
    divHuman.classList.toggle('hidden', isComputer);
}

function startGuessNumber() {
    let min, max, target;
    
    if (appState.guessnum.mode === 'computer') {
        // --- COMPUTER MODE ---
        min = parseInt(document.getElementById('gn-min').value);
        max = parseInt(document.getElementById('gn-max').value);

        if (isNaN(min) || isNaN(max) || min >= max) {
            showToast((TRANSLATIONS[appState.lang] || {}).gn_bad_range || '');
            return;
        }
        target = Math.floor(Math.random() * (max - min + 1)) + min;
        
        // Show range to player
        document.getElementById('gn-range-display').innerText = `${min} - ${max}`;
    
    } else {
        // --- HUMAN MODE ---
        min = null; max = null;      // the range is the secret here
        const secretInput = document.getElementById('gn-secret');
        target = parseInt(secretInput.value);
        
        if (isNaN(target)) {
            showToast((TRANSLATIONS[appState.lang] || {}).gn_need_secret || '');
            return;
        }
        
        // Clear input immediately for security
        secretInput.value = ''; 
        
        // Hide range (it's a secret!)
        document.getElementById('gn-range-display').innerText = "???";
    }

    // Init Game State
    appState.guessnum.target = target;
    appState.guessnum.attempts = 0;
    appState.guessnum.history = [];
    appState.guessnum.status = 'playing';
    appState.guessnum.min = min;
    appState.guessnum.max = max;
    appState.guessnum.gid = Date.now();

    // UI Reset
    document.getElementById('gn-input').value = '';
    document.getElementById('gn-feedback').textContent = (TRANSLATIONS[appState.lang] || {}).gn_start || '';
    document.getElementById('gn-history').innerHTML = '';
    document.getElementById('gn-attempts').innerText = '0';
    gnPaintLocal(false);

    setView('play-guessnum');
}

function checkNumberGuess() {
    // The round is over; further guesses would keep inflating the attempt
    // count and re-firing the win.
    if (appState.guessnum.status === 'won') return;

    const inputEl = document.getElementById('gn-input');
    const guess = parseInt(inputEl.value);

    if (isNaN(guess)) return;
    // Outside the range on the screen: not a try, just a nudge (the friend's
    // way has no range to show, so any number goes there).
    const gn = appState.guessnum;
    if (gn.min != null && gn.max != null && (guess < gn.min || guess > gn.max)) {
        showToast(((TRANSLATIONS[appState.lang] || {}).gn_between || '').replace('{min}', gn.min).replace('{max}', gn.max));
        inputEl.value = '';
        return;
    }

    appState.guessnum.attempts++;
    document.getElementById('gn-attempts').innerText = appState.guessnum.attempts;
    
    let feedback = "";
    let colorClass = "";
    
    if (guess === appState.guessnum.target) {
        // WIN
        playSound('success');
        
        const winMsg = ((TRANSLATIONS[appState.lang] || {}).gn_win || '').replace('{n}', guess);
            
        document.getElementById('gn-feedback').innerHTML = `<span class="tx-success font-black text-2xl">${winMsg}</span>`;
        addToHistory(guess, "✅", "win");
        appState.guessnum.status = 'won';
        // The man jumps for joy first; the confetti lands with him.
        gnPaintLocal(true);
        afterReveal(document.getElementById('gn-char'), () => { if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 70 }); });
        inputEl.value = '';
        inputEl.blur();
        saveToLocal();
        return; 
    } 
    else if (guess > appState.guessnum.target) {
        // تخمينك 60 والرقم 50 -> نحتاج رقم "أقل"
        playSound('click');
        // التغيير هنا: بدلاً من "عالي جداً" نقول "أقل"
        feedback = (TRANSLATIONS[appState.lang] || {}).gn_lower || '';
        colorClass = "tx-danger";
        addToHistory(guess, "⬇️", "high");
    } 
    else {
        // تخمينك 40 والرقم 50 -> نحتاج رقم "أعلى"
        playSound('click');
        // التغيير هنا: بدلاً من "منخفض جداً" نقول "أعلى"
        feedback = (TRANSLATIONS[appState.lang] || {}).gn_higher || '';
        colorClass = "tx-accent";
        addToHistory(guess, "⬆️", "low");
    }

    // Animate Feedback
    const fbEl = document.getElementById('gn-feedback');
    fbEl.className = `text-xl font-bold mb-6 ${colorClass} animate-pop`;
    fbEl.innerText = feedback;
    setTimeout(() => fbEl.classList.remove('animate-pop'), 200);
    gnPaintLocal(true);

    inputEl.value = '';
    inputEl.focus();
}

function addToHistory(guess, icon, type) {
    // Record it as well as draw it: this list is what renderGuessNumHistory
    // rebuilds the screen from after a reload.
    if (!appState.guessnum.history) appState.guessnum.history = [];
    appState.guessnum.history.push({ n: appState.guessnum.attempts, guess: guess, icon: icon, type: type });
    drawGuessRow(guess, icon, type, appState.guessnum.attempts);
}

/** Redraws the whole guess list from saved state. */
function renderGuessNumHistory() {
    const container = document.getElementById('gn-history');
    if (container) container.innerHTML = '';
    document.getElementById('gn-attempts').innerText = appState.guessnum.attempts || 0;
    const range = document.getElementById('gn-range-display');
    if (range) {
        range.innerText = (appState.guessnum.mode === 'computer' && appState.guessnum.min != null)
            ? `${appState.guessnum.min} - ${appState.guessnum.max}`
            : '???';
    }
    (appState.guessnum.history || []).forEach(h => drawGuessRow(h.guess, h.icon, h.type, h.n));
    gnPaintLocal(false);
}

function drawGuessRow(guess, icon, type, attemptNo) {
    const container = document.getElementById('gn-history');
    const div = document.createElement('div');
    
    let styles = "";
    let textStyle = "";
    
    if (type === 'high') {
        styles = "bg-red-50 border-red-200 dark:bg-red-900 dark:border-red-700";
        textStyle = "text-red-700 dark:text-red-100";
    } else if (type === 'low') {
        styles = "bg-blue-50 border-blue-200 dark:bg-blue-900 dark:border-blue-700";
        textStyle = "text-blue-700 dark:text-blue-100";
    } else if (type === 'win') {
        styles = "bg-green-100 border-green-500 dark:bg-green-900 dark:border-green-500";
        textStyle = "text-green-800 dark:text-green-100";
    }

    div.className = `flex justify-between items-center p-3 rounded-xl border mb-2 ${styles}`;
    
    div.innerHTML = `
        <span class="font-bold tx-muted text-sm">#${attemptNo}</span>
        <span class="font-black text-2xl ${textStyle}">${guess}</span>
        <span class="text-xl">${icon}</span>
    `;
    container.prepend(div);
}

/* ============================================================================
   The hot-or-cold man (the owner, 27 Sep 2026): a flat cartoon of the same
   cast as المشنقة's man (ink outlines, skin, a shirt in the game's colour)
   standing beside the guesses, whose state follows how close the last guess
   was, in four bands and two ends:
     far  - shivering, teeth chattering, a scarf, icicles, blue («برد… برد…»)
     mid  - thinking, a hand on his chin
     warm - sweating, red cheeks, fanning himself («سخن!»)
     hot  - on fire, melting, hopping («قريييب!»)
     win  - a party hat, arms up, a jump and confetti («جبتها!»)
     out  - out of tries (a room): slumped under a rain cloud
   An arrow beside him points up or down with the higher / lower verdict.

   How close is worked out on the phone from what it knows. On one phone the
   secret is here: the real distance over the range's width. In a room the
   secret stays on the server and the phone knows only higher / lower: the
   distance from the guess to the middle of what is still possible after it,
   over the whole range (a guess that leaves a narrow gap beside it is hot).
   Never on the TV (it must not hint at anyone's number) and never on the
   setter's phone: svBoardHtml draws it only on a solver's own board.

   A change of band is a moment (keyed with motionFirst, so a redraw doesn't
   replay it; --gn-late carries a moment on when its board is rebuilt): he
   morphs with a pop and the bubble says the new line at once; between
   changes the bubble comes now and then. Style.html section 44.
   ========================================================================= */

const gnT = (key) => ((TRANSLATIONS[appState.lang] || {})[key] || key);
const GN_MOMENT_MS = 2600;
const gnMoments = new Map();

/** How close a guess is, as a share of the range: far, mid, warm or hot. */
function gnBandOf(ratio) {
  if (ratio >= 0.25) return 'far';
  if (ratio >= 0.1) return 'mid';
  if (ratio >= 0.04) return 'warm';
  return 'hot';
}

/** One phone: every guess's band, from its real distance to the secret (the friend's way has no range: a hundred, or twice the number). */
function gnLocalBands() {
  const gn = appState.guessnum || {};
  const width = gn.min != null && gn.max != null ? gn.max - gn.min + 1 : Math.max(100, Math.abs(Number(gn.target) || 0) * 2);
  return (gn.history || []).map(h => (h.type === 'win' ? 'win' : gnBandOf(Math.abs(Number(h.guess) - Number(gn.target)) / width)));
}

/** A room's board: every guess's band, from its distance to the middle of what is still possible after it. */
function gnRoomBands(g, max) {
  let lo = 1, hi = Math.max(1, Number(max) || 100);
  const w = hi;
  return (g || []).map(r => {
    if (r.v === 'right') return 'win';
    if (r.v === 'higher') lo = Math.max(lo, r.n + 1); else hi = Math.min(hi, r.n - 1);
    return gnBandOf(Math.abs(r.n - (lo + hi) / 2) / w);
  });
}

/** A moment's classes and how far into it this drawing is: the first drawing starts it, a redraw within it carries on. */
function gnMoment(key, make) {
  if (!key) return null;
  if (motionFirst(key)) {
    const m = { at: Date.now(), cls: make() };
    gnMoments.set(key, m);
    if (gnMoments.size > 40) gnMoments.delete(gnMoments.keys().next().value);
    return { cls: m.cls, late: 0, first: true };
  }
  const m = gnMoments.get(key);
  const late = m ? Date.now() - m.at : Infinity;
  return late < GN_MOMENT_MS ? { cls: m.cls, late: late, first: false } : null;
}

// A small sound for the band he has just gone into (the win and the end have the game's own).
const GN_FX = { far: 'gnBrr', mid: 'gnHmm', warm: 'gnWarm', hot: 'gnSizzle' };

/**
 * The man. o: { band ('idle' before a guess), prev (the band before the last
 * guess), dir ('up' | 'down' | ''), key (the last guess's moment, or none),
 * fresh (the last guess is new here) }.
 */
function gnCharHtml(o) {
  const band = o.band || 'idle';
  const changed = band !== (o.prev || 'idle');
  const mo = o.fresh ? gnMoment(o.key, () => [changed ? (band === 'win' ? 'is-jump is-say' : 'is-morph is-say') : '', o.dir ? 'is-new' : ''].join(' ')) : gnMoment(o.key, () => '');
  const cls = mo ? mo.cls : '';
  const late = mo ? `--gn-late: -${Math.round(mo.late)}ms;` : '';
  if (mo && mo.first && /is-(morph|jump)/.test(cls) && GN_FX[band] && typeof playFx === 'function') playFx(GN_FX[band]);
  const only = (bands) => 'gn-o ' + bands.split(' ').map(b => 'gn-o--' + b).join(' ');
  const arrow = o.dir && band !== 'win' && band !== 'out'
    ? `<g class="gn-arrow gn-arrow--${o.dir}"><g class="gn-arrow__in"><path class="gn-ink" d="${o.dir === 'up' ? 'M0 -14 L10 -2 L4 -2 L4 13 L-4 13 L-4 -2 L-10 -2z' : 'M0 14 L10 2 L4 2 L4 -13 L-4 -13 L-4 2 L-10 2z'}"/></g></g>` : '';

      <g class="gn-pop"${cls.indexOf('is-jump') !== -1 ? ' data-reveal-ms="650"' : ''}><g class="gn-fig">
        <g class="gn-body">
          <path class="gn-pants gn-ink" d="M50 94 L47 120 L56 120 L59 94z"/><path class="gn-pants gn-ink" d="M61 94 L64 120 L73 120 L70 94z"/>
          <ellipse class="gn-shoe" cx="51" cy="122" rx="7.5" ry="3.6"/><ellipse class="gn-shoe" cx="69" cy="122" rx="7.5" ry="3.6"/>
          <rect class="gn-shirt gn-ink" x="44" y="60" width="32" height="36" rx="9"/>
          <g class="${only('far')}"><path class="gn-scarf gn-ink" d="M42 58 Q60 68 78 58 L78 65 Q60 75 42 65z"/><path class="gn-scarf gn-ink" d="M67 66 L74 85 L66 86 L61 68z"/><path class="gn-scarf-line" d="M67.5 73 L72.5 71.5 M69 79 L74 77.5"/></g>
          <g class="gn-arms ${only('idle hot out')}"><g class="gn-arm gn-arm--l"><path class="gn-sleeve" d="M47 66 L38 88"/><path class="gn-sleeve gn-sleeve--in" d="M47 66 L38 88"/><circle class="gn-skin gn-ink" cx="37" cy="90" r="4"/></g>
            <g class="gn-arm gn-arm--r"><path class="gn-sleeve" d="M73 66 L82 88"/><path class="gn-sleeve gn-sleeve--in" d="M73 66 L82 88"/><circle class="gn-skin gn-ink" cx="83" cy="90" r="4"/></g></g>
          <g class="${only('far')}"><path class="gn-sleeve" d="M47 66 L66 80"/><path class="gn-sleeve gn-sleeve--in" d="M47 66 L66 80"/><circle class="gn-skin gn-ink" cx="68" cy="80" r="4"/>
            <path class="gn-sleeve" d="M73 66 L54 84"/><path class="gn-sleeve gn-sleeve--in" d="M73 66 L54 84"/><circle class="gn-skin gn-ink" cx="52" cy="84" r="4"/></g>
          <g class="${only('mid warm')}"><path class="gn-sleeve" d="M47 66 L38 88"/><path class="gn-sleeve gn-sleeve--in" d="M47 66 L38 88"/><circle class="gn-skin gn-ink" cx="37" cy="90" r="4"/></g>
          <g class="gn-arms ${only('win')}"><g class="gn-arm gn-arm--l"><path class="gn-sleeve" d="M47 66 L34 46"/><path class="gn-sleeve gn-sleeve--in" d="M47 66 L34 46"/><circle class="gn-skin gn-ink" cx="33" cy="44" r="4"/></g>
            <g class="gn-arm gn-arm--r"><path class="gn-sleeve" d="M73 66 L86 46"/><path class="gn-sleeve gn-sleeve--in" d="M73 66 L86 46"/><circle class="gn-skin gn-ink" cx="87" cy="44" r="4"/></g></g>
        </g>
        <g class="gn-head">
          <circle class="gn-skin gn-ink" cx="60" cy="40" r="19"/>
          <path class="gn-hair" d="M41 38 Q42 20 60 20 Q78 20 79 38 Q74 30 60 30 Q46 30 41 38z"/>
          <path class="gn-snow gn-ink ${only('far')}" d="M43 31 Q46 19 60 19 Q74 19 77 31 Q70 26 65 29 Q60 24 55 29 Q49 25 43 31z"/>
          <g class="gn-flame ${only('hot')}"><path class="gn-flame__out gn-ink" d="M44 31 Q41 18 50 11 Q50 19 55 20 Q54 7 62 1 Q62 13 67 15 Q70 7 77 9 Q72 18 77 31 Q60 23 44 31z"/><path class="gn-flame__in" d="M50 27 Q50 19 55 17 Q56 22 60 22 Q62 12 66 12 Q66 20 71 27 Q60 22 50 27z"/></g>
          <g class="${only('win')}"><path class="gn-hat gn-ink" d="M60 1 L49 24 Q60 27 71 24z"/><path class="gn-hat-line" d="M55 13 L66 11 M52 19 L69 17"/><circle class="gn-pom gn-ink" cx="60" cy="1" r="3"/></g>
          <g class="gn-eyes ${only('idle far mid warm hot')}"><circle class="gn-eye" cx="53" cy="40" r="2.3"/><circle class="gn-eye" cx="67" cy="40" r="2.3"/></g>
          <path class="gn-line ${only('win')}" d="M49 41 Q53 36 57 41 M63 41 Q67 36 71 41"/>
          <path class="gn-line ${only('out')}" d="M49 40 Q53 43 57 40 M63 40 Q67 43 71 40"/>
          <path class="gn-line ${only('far warm hot out')}" d="M48 35 L56 32 M72 35 L64 32"/>
          <path class="gn-line ${only('mid')}" d="M48 33 Q52 30 56 32 M64 34 L72 34"/>
          <ellipse class="gn-cheek ${only('warm hot win')}" cx="47" cy="47" rx="3.6" ry="2.2"/><ellipse class="gn-cheek ${only('warm hot win')}" cx="73" cy="47" rx="3.6" ry="2.2"/>
          <path class="gn-line ${only('idle')}" d="M54 49 Q60 54 66 49"/>
          <g class="gn-teeth ${only('far')}"><rect class="gn-tooth gn-ink" x="54" y="46" width="12" height="6" rx="1.6"/><path class="gn-line" d="M58 46 V52 M62 46 V52"/></g>
          <path class="gn-line ${only('mid')}" d="M55 51 Q58 49 61 51 T67 50"/>
          <g class="${only('warm')}"><ellipse class="gn-mouth-o gn-ink" cx="60" cy="50" rx="4" ry="3.2"/><path class="gn-tongue" d="M58 51 Q60 55.5 62 51z"/></g>
          <path class="gn-mouth-o gn-ink ${only('hot')}" d="M54 48 Q57 45 60 48 Q63 45 66 48 Q66 55 60 55 Q54 55 54 48z"/>
          <path class="gn-grin gn-ink ${only('win')}" d="M52 47 Q60 58 68 47z"/>
          <path class="gn-line ${only('out')}" d="M54 52 Q60 47 66 52"/>
          <path class="gn-ice gn-ink ${only('far')}" d="M52 57.5 l2 7 l2 -7z M58 58.8 l2 8 l2 -8z M64 57.5 l2 6 l2 -6z"/>
          <g class="${only('warm')}"><path class="gn-drop gn-drop--1" d="M40 32 q-1.8 3.4 0 4.8 q1.8 -1.4 0 -4.8z"/><path class="gn-drop gn-drop--2" d="M80 30 q1.8 3.4 0 4.8 q-1.8 -1.4 0 -4.8z"/></g>
          <g class="${only('hot')}"><path class="gn-drip gn-drip--1" d="M53 58 q-2 4 0 5.5 q2 -1.5 0 -5.5z"/><path class="gn-drip gn-drip--2" d="M66 58 q-2 4 0 5.5 q2 -1.5 0 -5.5z"/></g>
        </g>
        <g class="gn-think ${only('mid')}"><path class="gn-sleeve" d="M73 66 L84 80 L66 60"/><path class="gn-sleeve gn-sleeve--in" d="M73 66 L84 80 L66 60"/><circle class="gn-skin gn-ink" cx="64" cy="59" r="4.2"/></g>
        <g class="gn-fan ${only('warm')}"><path class="gn-sleeve" d="M73 66 L88 56"/><path class="gn-sleeve gn-sleeve--in" d="M73 66 L88 56"/>
          <g class="gn-fan__leaf"><path class="gn-fan__paper gn-ink" d="M89 54 L78 36 Q91 28 103 38z"/><path class="gn-fan__rib" d="M89 54 L84 34 M89 54 L91 31 M89 54 L98 34"/></g><circle class="gn-skin gn-ink" cx="89" cy="55" r="4"/></g>
      </g></g>
      <g class="${only('out')}"><g class="gn-cloud"><path class="gn-cloud__c gn-ink" d="M58 4 a6 6 0 0 1 10 -4 a7 7 0 0 1 12 4 a5 5 0 0 1 -1 10 h-20 a5 5 0 0 1 -1 -10z"/><path class="gn-rain gn-rain--1" d="M64 16 l-1.5 4"/><path class="gn-rain gn-rain--2" d="M71 16 l-1.5 4"/><path class="gn-rain gn-rain--3" d="M77 16 l-1.5 4"/></g></g>
      <g transform="translate(109 72)">${arrow}</g>
      <g class="gn-bub"><path class="gn-bub__box" d="M8 -16 h40 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-6 l2 8 l-9 -8 h-27 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4z"/><text class="gn-bub__t" x="28" y="-3" text-anchor="middle">${escapeHTML(gnT('gn_bub_' + band))}</text></g>
    </svg>`;
}

/** One phone: the man for the guesses so far; `moment` when a guess has just been made. */
function gnPaintLocal(moment) {
  const box = document.getElementById('gn-char');
  if (!box) return;
  const gn = appState.guessnum || {};
  const bands = gnLocalBands();
  const last = (gn.history || [])[bands.length - 1];
  box.innerHTML = gnCharHtml({
    band: bands.length ? bands[bands.length - 1] : 'idle',
    prev: bands.length > 1 ? bands[bands.length - 2] : 'idle',
    dir: !last ? '' : last.type === 'low' ? 'up' : last.type === 'high' ? 'down' : '',
    key: last ? ['gn1', gn.gid || gn.target, bands.length].join('|') : '',
    fresh: !!moment
  });
}

/** A room: the man on a solver's own board (svBoardHtml), from the verdicts it was sent. */
function gnRoomCharHtml(state, fx) {
  const s = state.shared || {};
  const you = state.you || {};
  const g = (you.board && you.board.g) || [];
  const bands = gnRoomBands(g, s.pub && s.pub.max);
  let band = bands.length ? bands[bands.length - 1] : 'idle';
  let prev = bands.length > 1 ? bands[bands.length - 2] : 'idle';
  if (you.state === 'lost') { prev = band; band = 'out'; }
  const last = g[g.length - 1];
  return gnCharHtml({
    band: band, prev: prev,
    dir: !last ? '' : last.v === 'higher' ? 'up' : last.v === 'lower' ? 'down' : '',
    key: g.length || you.state === 'lost' ? ['gnr', state.code, s.dealId, s.round, g.length, you.state].join('|') : '',
    fresh: !!(fx && (fx.fresh || fx.lost))
  });
}
</script>
