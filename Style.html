@keyframes vote-bar  { from { transform: scaleX(0); } }
@keyframes vote-fade { from { opacity: 0; transform: translateY(0.25rem); } }
@keyframes vote-win {
  0%   { transform: none; border-color: var(--border); box-shadow: 0 0 0 0 transparent; }
  45%  { transform: scale(1.035); }
  100% { transform: none; }
}

/* A round's result card lies face down for a beat, then turns over
   (spyRevealParts: 1100ms face down, a 560ms turn, edge-on at 1380ms). */
.spy-reveal {
  position: relative;
  animation: spy-turn 560ms cubic-bezier(0.45, 0, 0.55, 1) 1100ms both;
}
.spy-reveal__cover {
  position: absolute;
  inset: -1px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: var(--sp-4);
  border-radius: inherit;
  background:
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0 0.6rem, transparent 0.6rem 1.2rem),
    var(--accent);
  color: var(--accent-on);
  animation: spy-cover 1380ms linear both;
}
.spy-reveal__q { font-size: 3rem; font-weight: 900; line-height: 1; animation: spy-q 380ms ease-in-out 3 alternate both; }
.spy-reveal__label { font-size: var(--fs-h3); font-weight: 900; }
@keyframes spy-turn {
  0%   { transform: perspective(60rem) rotateY(0); }
  50%  { transform: perspective(60rem) rotateY(90deg); }
  100% { transform: perspective(60rem) rotateY(0); }
}
@keyframes spy-cover { from { visibility: visible; } to { visibility: hidden; } }
@keyframes spy-q { from { transform: scale(0.88); opacity: 0.7; } to { transform: scale(1.12); opacity: 1; } }

/* The top three on a podium at the end of a game (renderPodium): second,
   the winner, third. The first time, they rise 3-2-1. */
.podium {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: var(--sp-2);
  padding-top: var(--sp-2);
}
.podium__place {
  flex: 1 1 0;
  min-width: 0;
  max-width: 8rem;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.podium__place--1 { order: 2; }
.podium__place--2 { order: 1; }
.podium__place--3 { order: 3; }
.podium__who { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.podium__medal { font-size: 1.75rem; line-height: 1; }
.podium__place--rank1 .podium__medal { font-size: 2.25rem; }
.podium__name {
  max-width: 100%;
  font-weight: 900;
  line-height: 1.25;
  color: var(--text-strong);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.podium__score { font-weight: 900; color: var(--accent-ink); }
.podium__block {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-bottom: 0;
  border-radius: var(--r-md) var(--r-md) 0 0;
  background: var(--surface-solid);
  color: var(--text-2);
  font-size: var(--fs-h3);
  font-weight: 900;
  transform-origin: bottom;
}
.podium__place--rank1 .podium__block { height: 5.5rem; border-color: transparent; background: var(--accent); color: var(--accent-on); }
.podium__place--rank2 .podium__block { height: 4rem; }
.podium__place--rank3 .podium__block { height: 2.75rem; }
.podium--rise .podium__block {
  animation: podium-rise 560ms cubic-bezier(0.2, 1.15, 0.35, 1) both;
  animation-delay: var(--at, 0ms);
}
.podium--rise .podium__who {
  animation: podium-who 480ms cubic-bezier(0.2, 1.4, 0.35, 1) both;
  animation-delay: calc(var(--at, 0ms) + 300ms);
}
@keyframes podium-rise { from { transform: scaleY(0); } }
@keyframes podium-who  { from { opacity: 0; transform: translateY(0.75rem) scale(0.7); } }
.tv-podium--rise .tv-podium__place {
  animation: tv-podium-rise 640ms cubic-bezier(0.2, 1.15, 0.35, 1) both;
  animation-delay: var(--at, 0ms);
}
@keyframes tv-podium-rise { from { opacity: 0; transform: translateY(40%); } }

/* A letter spinning in (spinLetter). */
.stop-letter.is-spinning, .tv-stop-letter.is-spinning { color: var(--text-3); }

/* A pass-the-phone role behind a card you hold (JS_Motion.html, section 11).
   The faces swap visibility halfway through the turn, so the role is never
   left showing even where backface-visibility misbehaves. */
/* The card is the same size face down whatever is written on its back: the back
   is laid over it, out of the layout. When the back took space, a spy's short
   line made a shorter card than everyone else's, so the table could tell the
   spy before anyone held it. The height fits the longest role (الموقع السري:
   the place, the job and the hint). */
.hold-card {
  position: relative;
  display: grid;
  min-height: 16rem;
  perspective: 60rem;
  border-radius: var(--r-lg);
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.hold-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hold-card > * {
  grid-area: 1 / 1;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  transition: transform 340ms cubic-bezier(0.3, 1.15, 0.4, 1), visibility 0s linear 170ms;
}
.hold-card__front {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 10rem;
  padding: var(--sp-5) var(--sp-4);
  border: 2px dashed var(--accent-border);
  border-radius: var(--r-lg);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.hold-card.is-seen .hold-card__front { border-style: solid; }
.hold-card__icon { font-size: 2.5rem; line-height: 1; }
.hold-card__label { font-size: var(--fs-h3); font-weight: 900; }
.hold-card__hint { font-size: var(--fs-sm); font-weight: 700; color: var(--text-2); }
.hold-card__back {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--sp-3);
  transform: rotateY(180deg);
  visibility: hidden;
}
.hold-card.is-holding .hold-card__front { transform: rotateY(-180deg); visibility: hidden; }
.hold-card.is-holding .hold-card__back { transform: none; visibility: visible; }
.hold-next { transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); }
.hold-next.is-waiting { opacity: 0; transform: translateY(0.5rem); visibility: hidden; pointer-events: none; }
@media (orientation: landscape) and (max-height: 500px) {
  .hold-card { min-height: 14.5rem; }
  .hold-card__front { min-height: 7rem; padding-block: var(--sp-3); }
  .hold-card__back { gap: var(--sp-2); }
  /* A phone on its side: whose turn it is and the next button beside the card,
     so the button isn't below the fold of a 375px-tall screen. */
  .card.space-y-6:has(> .hold-card) {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    grid-template-areas: "who card" "next card";
    align-items: center;
    column-gap: var(--sp-4);
    row-gap: var(--sp-3);
    padding-block: var(--sp-4);
  }
  .card.space-y-6:has(> .hold-card) > :not([hidden]) { margin-top: 0; }
  .card.space-y-6:has(> .hold-card) > :first-child { grid-area: who; align-self: end; }
  .card.space-y-6:has(> .hold-card) > .hold-card { grid-area: card; }
  .card.space-y-6:has(> .hold-card) > .hold-next { grid-area: next; align-self: start; }
}

/* Flying pieces: a Connections tile on its way into its row, a name dealt into its team. */
.connect-ghost {
  position: fixed;
  z-index: var(--z-float);
  margin: 0;
  pointer-events: none;
  will-change: transform, opacity;
}
.deal-ghost {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-float);
  padding: var(--sp-2) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
  color: var(--text-strong);
  font-weight: 800;
  white-space: nowrap;
  pointer-events: none;
  will-change: transform;
}

/* The points you just won, floating onto your row of the board. */
.fly-points {
  position: fixed;
  z-index: var(--z-points);
  padding: 0.1em 0.5em;
  border-radius: var(--r-sm);
  background: var(--success-btn);
  color: var(--success-on);
  font-size: var(--fs-h2);
  font-weight: 900;
  white-space: nowrap;
  pointer-events: none;
  will-change: transform, opacity;
}

/* A word slammed over the whole screen for a beat, then gone: the moment
   someone shouts وقف in أتوبيس كومبليت. Near-opaque rather than blurred - the
   screen underneath is rebuilding, and a backdrop-filter over that stutters.
   Nothing here takes a tap. */
.slam {
  position: fixed;
  inset: 0;
  z-index: var(--z-slam);
  display: grid;
  place-content: center;
  gap: var(--sp-2);
  padding: var(--sp-4);
  text-align: center;
  pointer-events: none;
  background: color-mix(in srgb, var(--surface-solid) 86%, transparent);
  animation: slam-fade 1.2s var(--ease-out) both;
}
.slam__word {
  font-size: clamp(2rem, 13vw, 5rem);
  font-weight: 900;
  line-height: 1.1;
  color: var(--danger-ink);
  animation: slam-in 420ms cubic-bezier(0.2, 1.4, 0.35, 1) both;
}
.slam__sub { color: var(--text-2); font-size: var(--fs-h2); font-weight: 800; }
@keyframes slam-in { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: scale(1); } }
@keyframes slam-fade { 0%, 68% { opacity: 1; } 100% { opacity: 0; } }

/* "خمّن صح!" stamped across the drawing when someone cracks it. */
.draw-stamp {
  position: absolute;
  /* Centred with auto margins, not with inset-inline-start: 50% and a
     translate: under RTL that start edge is the right one, and the translate
     then pushes the stamp off the middle. This centres the same either way. */
  inset-inline: 0;
  top: 50%;
  z-index: 3;
  width: fit-content;
  margin-inline: auto;
  padding: var(--sp-2) var(--sp-4);
  border: 3px solid var(--success);
  border-radius: var(--r-md);
  background: color-mix(in srgb, var(--success-btn) 18%, transparent);
  color: var(--success-ink);
  font-size: var(--fs-h2);
  font-weight: 900;
  white-space: nowrap;
  pointer-events: none;
  transform: translateY(-50%) rotate(-11deg);
  animation: draw-stamp-in 460ms cubic-bezier(0.2, 1.4, 0.35, 1) both;
}
@keyframes draw-stamp-in {
  from { opacity: 0; transform: translateY(-50%) rotate(-11deg) scale(2.4); }
  to { opacity: 1; transform: translateY(-50%) rotate(-11deg) scale(1); }
}

/* مافيا: night falls and morning comes over about a second, on a layer of its
   own so nothing else repaints. */
#view-room-mafia, #view-room-tv { position: relative; }
.mafia-sky {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 900ms var(--ease-in-out);
  background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
}
.mafia-sky.is-on { opacity: 1; }
.mafia-sky--day { background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--warning) 26%, transparent), transparent 70%); }

/* The last three seconds of a round. The number pops once at 3, at 2 and at 1:
   the pop lasts the whole second, so it wins over the slow pulse those clocks
   already run rather than flickering against it. And a warning rim breathes at
   the edge of the screen the clock is on - one element at that screen's root,
   taking no taps and drawing nothing but an inset glow, so no button under it
   is covered or blocked. */
@keyframes count-pop { 0% { transform: scale(1); } 22% { transform: scale(1.25); } 55%, 100% { transform: scale(1); } }
.is-count-pop,
.tb-timer.is-urgent .tb-timer__value.is-count-pop,
.timer-display.is-urgent.is-count-pop { animation: count-pop 1s var(--ease-out) both; }

.has-count-edge { position: relative; }
.count-edge {
  position: absolute;
  inset: 0;
  z-index: 5;
  border-radius: var(--r-lg);
  pointer-events: none;
  box-shadow: inset 0 0 0 0.3rem color-mix(in srgb, var(--danger) 45%, transparent),
              inset 0 0 0.9rem 0.3rem color-mix(in srgb, var(--danger) 20%, transparent);
  animation: count-edge 1s var(--ease-in-out) infinite;
}
@keyframes count-edge { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

/* A title at the end of a game, under the podium: one row, the game's colour,
   the count as a plain number so no language has to agree with it. */
.award {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--accent-soft);
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.award__icon { font-size: 1.25rem; line-height: 1; }
.award__label { font-size: var(--fs-sm); font-weight: 800; color: var(--text-2); }
.award__name { font-weight: 900; color: var(--accent-ink); }
.award__n {
  min-width: 1.75rem;
  padding: 0 var(--sp-2);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  font-weight: 900;
}
.award--in { animation: award-in 520ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes award-in {
  from { opacity: 0; transform: scale(0.88); }
  60% { transform: scale(1.06); }
  to { opacity: 1; transform: scale(1); }
}

/* --- The first-play card on setup and room lobby ------------------------ */
.first-play-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  width: 100%;
  max-width: 100%;
  padding: var(--sp-4);
  margin-top: var(--sp-3);
  margin-bottom: var(--sp-2);
  border: 1px solid var(--accent-border, var(--border));
  border-inline-start: 4px solid var(--accent);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  box-shadow: var(--sh-1);
  box-sizing: border-box;
}
.first-play-card__eyebrow {
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--accent-ink, var(--text-2));
  text-transform: uppercase;
}
.first-play-card__steps {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin: 0;
  padding: 0;
  list-style: none;
}
.first-play-card__step {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: var(--lh-snug);
  color: var(--text);
}
.first-play-card__n {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  display: grid;
  place-items: center;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: 900;
  font-size: var(--fs-xs);
  line-height: 1;
}
.first-play-card__text {
  flex: 1;
  min-width: 0;
  word-break: break-word;
}
.first-play-card__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-1);
}
.first-play-card.is-dismissing {
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
}

@media (prefers-reduced-motion: reduce) {
  .slam, .slam__word, .draw-stamp { animation: none; }
  .award--in { animation: none; }
  .is-count-pop { animation: none; }
  .count-edge { display: none; }
  .fly-points { display: none; }
  .slam { display: none; }
  .mafia-sky { transition: none; }
  .game-splash, .game-splash__icon, .game-splash__name, .room-code span, .status-row--new, .motion-landed { animation: none; }
  .shell__nav.has-pill::before { transition: none; }
  .result-list--reveal *, .spy-reveal, .spy-reveal__q, .podium--rise *, .tv-podium--rise * { animation: none; }
  .spy-reveal__cover { display: none; }
  .hold-card > *, .hold-next { transition: none; }
  .xo-cell__gone { animation: none; }
  .first-play-card.is-dismissing { transition: none; }
}


/* ==========================================================================
   15. SOLO GAMES
   JS_Solo.html and the games built on it: the stats bar, the daily line, the
   result sheet, and each board. Boards that map to a physical grid carry
   dir="ltr" in the markup, like Wavelength's spectrum.
   ========================================================================== */
.solo-bar { display: grid; grid-template-columns: repeat(var(--solo-cols, 3), minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-3); }
.solo-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
}
.solo-stat__label { font-size: var(--fs-xs); font-weight: 700; color: var(--text-2); }
.solo-stat .metric { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.05rem; color: var(--text-strong); }
.solo-daily {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  background: var(--success-soft);
  color: var(--success-ink);
  font-weight: 800;
}
.solo-result-value { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.solo-result-value .metric:empty, .solo-result-value .eyebrow:empty { display: none; }

/* --- Sudoku --- */
.sdk-grid {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  max-width: 30rem;
  margin: 0 auto;
  overflow: hidden;
  border: 2px solid var(--text-strong);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
}
.sdk-cell {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface-solid);
  color: var(--accent-ink);
  font-family: var(--font);
  font-size: clamp(1rem, 5.2vw, 1.55rem);
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}
.sdk-cell:nth-child(9n) { border-right: 0; }
.sdk-cell:nth-child(n+73) { border-bottom: 0; }
.sdk-cell.is-box-end { border-right: 2px solid var(--text-strong); }
.sdk-cell.is-box-bottom { border-bottom: 2px solid var(--text-strong); }
.sdk-cell.is-given { color: var(--text-strong); font-weight: 900; }
.sdk-cell.is-peer { background: var(--surface-2); }
.sdk-cell.is-same { background: var(--accent-soft); }
.sdk-cell.is-sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.sdk-cell.is-wrong { color: var(--danger); }
.sdk-notes { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); color: var(--text-2); font-size: clamp(0.45rem, 2.1vw, 0.65rem); font-weight: 700; line-height: 1; }
.sdk-notes i { display: grid; place-items: center; font-style: normal; }
.sdk-pad { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 30rem; margin: var(--sp-3) auto 0; }
.sdk-key {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 3.1rem;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  color: var(--accent-ink);
  font-family: var(--font);
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out);
}
.sdk-key span { font-size: 1.3rem; font-weight: 900; line-height: 1.1; }
.sdk-key small { font-size: 0.6rem; font-weight: 700; color: var(--text-3); }
.sdk-key:active { transform: scale(0.94); }
.sdk-key:disabled { opacity: 0.35; cursor: default; }
.sdk-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin-top: var(--sp-3); }
.sdk-tools .btn { flex: 1 1 0; width: auto; min-width: 4.2rem; padding-inline: var(--sp-2); }

/* --- 2048 --- */
.g2048-board {
  --gap: 0.5rem;
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
  aspect-ratio: 1;
  max-width: 26rem;
  margin: 0 auto;
  padding: var(--gap);
  border-radius: var(--r-lg);
  background: var(--surface-3);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.g2048-cell { border-radius: var(--r-sm); background: var(--surface-2); }
.g2048-tiles { position: absolute; inset: var(--gap); pointer-events: none; }
.g2048-tile {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  width: calc((100% - 3 * var(--gap)) / 4);
  height: calc((100% - 3 * var(--gap)) / 4);
  border-radius: var(--r-sm);
  background: color-mix(in oklab, var(--accent) 14%, var(--surface-solid));
  color: var(--text-strong);
  font-size: clamp(1.4rem, 8vw, 2.3rem);
  font-weight: 900;
  transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
  transition: transform 120ms ease-out;
  will-change: transform;
}
.g2048-tile[data-v="4"] { background: color-mix(in oklab, var(--accent) 26%, var(--surface-solid)); }
.g2048-tile[data-v="8"] { background: color-mix(in oklab, var(--accent) 40%, var(--surface-solid)); }
.g2048-tile[data-v="16"] { background: color-mix(in oklab, var(--accent) 55%, var(--surface-solid)); }
.g2048-tile[data-v="32"] { background: color-mix(in oklab, var(--accent) 70%, var(--surface-solid)); color: var(--accent-on); }
.g2048-tile[data-v="64"] { background: var(--accent); color: var(--accent-on); }
.g2048-tile[data-v="128"], .g2048-tile[data-v="256"] { background: color-mix(in oklab, var(--warning-btn) 70%, var(--accent)); color: var(--warning-on); font-size: clamp(1.2rem, 7vw, 2rem); }
.g2048-tile[data-v="512"] { background: var(--warning-btn); color: var(--warning-on); font-size: clamp(1.2rem, 7vw, 2rem); }
.g2048-tile[data-v="1024"], .g2048-tile[data-v="2048"], .g2048-tile[data-v="big"] {
  background: var(--success-btn);
  color: var(--success-on);
  font-size: clamp(1rem, 5.6vw, 1.6rem);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--success-btn) 40%, transparent);
}
.g2048-tile.is-gone { z-index: 0; }
.g2048-tile.is-new { animation: g2048-new 160ms ease-out both; }
.g2048-tile.is-merged { animation: g2048-pop 200ms ease-out; }
@keyframes g2048-new { from { scale: 0; } to { scale: 1; } }
@keyframes g2048-pop { 0% { scale: 1; } 45% { scale: 1.16; } 100% { scale: 1; } }
.g2048-hint { text-align: center; margin-top: var(--sp-2); }

/* --- Minesweeper --- */
.mines-grid {
  display: grid;
  grid-template-columns: repeat(var(--mines-cols, 8), minmax(0, 1fr));
  gap: 3px;
  max-width: 26rem;
  margin: 0 auto;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.mines-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: color-mix(in oklab, var(--accent) 24%, var(--surface-2));
  box-shadow: inset 0 -2px 0 rgba(15, 23, 42, 0.12);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: clamp(0.85rem, 4.6vw, 1.2rem);
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}
.mines-cell.is-open { background: var(--surface-solid); box-shadow: inset 0 0 0 1px var(--border); cursor: default; }
.mines-cell.n1 { color: var(--accent-ink); }
.mines-cell.n2 { color: var(--success-ink); }
.mines-cell.n3 { color: var(--danger); }
.mines-cell.n4 { color: var(--warning-ink); }
.mines-cell.n5, .mines-cell.n6, .mines-cell.n7, .mines-cell.n8 { color: var(--danger-ink); }
.mines-cell.is-boom { background: var(--danger-soft); }
.mines-cell.is-flag.is-wrong { background: var(--warning-soft); }
.mines-grid.is-over .mines-cell { cursor: default; }

/* --- Queens: a fixed pastel per region (like the Connections groups), ink that reads on all of them --- */
.queens-grid {
  display: grid;
  grid-template-columns: repeat(var(--q-n, 6), minmax(0, 1fr));
  max-width: 28rem;
  margin: 0 auto;
  overflow: hidden;
  border: 2px solid #1e293b;
  border-radius: var(--r-sm);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.queens-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 1px solid rgba(30, 41, 59, 0.18);
  color: #1e293b;
  font-family: var(--font);
  font-size: clamp(1rem, 6vw, 1.7rem);
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
}
.queens-cell.bt { border-top: 2px solid #1e293b; }
.queens-cell.bb { border-bottom: 2px solid #1e293b; }
.queens-cell.bl { border-left: 2px solid #1e293b; }
.queens-cell.br { border-right: 2px solid #1e293b; }
.queens-cell.q0 { background: #fde68a; }
.queens-cell.q1 { background: #a7f3d0; }
.queens-cell.q2 { background: #bfdbfe; }
.queens-cell.q3 { background: #ddd6fe; }
.queens-cell.q4 { background: #fbcfe8; }
.queens-cell.q5 { background: #fed7aa; }
.queens-cell.q6 { background: #e5e7eb; }
.queens-cell.q7 { background: #d9f99d; }
.queens-cell.q8 { background: #fca5a5; }
.queens-cell.q9 { background: #a5f3fc; }
.queens-cell.is-bad { box-shadow: inset 0 0 0 3px #dc2626; }

/* --- Tango --- */
.tango-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 24rem; margin: 0 auto; }
.tango-cell {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  font-size: clamp(1.2rem, 7vw, 1.9rem);
  line-height: 1;
  cursor: pointer;
}
.tango-cell.is-given { background: var(--surface-3); cursor: default; }
.tango-cell.is-bad { background: var(--danger-soft); box-shadow: inset 0 0 0 2px var(--danger); }
.tango-sign {
  position: absolute;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 1.3rem;
  height: 1.3rem;
  border: 1px solid var(--text-3);
  border-radius: 50%;
  background: var(--surface-solid);
  color: var(--text-strong);
  font-size: 0.85rem;
  font-style: normal;
  font-weight: 900;
  line-height: 1;
  pointer-events: none;
}
.tango-sign--right { top: 50%; right: calc(-3px - 0.65rem); transform: translateY(-50%); }
.tango-sign--down { left: 50%; bottom: calc(-3px - 0.65rem); transform: translateX(-50%); }

/* --- Nonogram --- */
.nono-grid {
  display: grid;
  grid-template-columns: auto repeat(var(--nono-n, 5), minmax(0, 1fr));
  gap: 2px;
  max-width: 30rem;
  margin: 0 auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.nono-clue { display: flex; gap: 3px; color: var(--text-strong); font-size: clamp(0.6rem, 2.7vw, 0.85rem); font-weight: 800; line-height: 1.05; }
.nono-clue--col { flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3px; }
.nono-clue--row { align-items: center; justify-content: flex-end; padding-right: 5px; white-space: nowrap; }
.nono-clue.is-done { color: var(--text-3); }
.nono-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--text-3);
  font-size: clamp(0.6rem, 3vw, 0.9rem);
  font-weight: 900;
  cursor: pointer;
}
.nono-cell.is-fill { background: var(--accent); box-shadow: none; }
.nono-cell.is-sep-r { margin-right: 2px; }
.nono-cell.is-sep-b { margin-bottom: 2px; }
.nono-grid.is-solved .nono-cell:not(.is-fill) { background: transparent; box-shadow: none; }
.nono-mode { margin: var(--sp-2) 0; }

/* --- Answer buttons shared by the quiz-style games (إيه اللي يجمعهم؟, سلسلة الإجابات) --- */
.solo-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-3); }
.solo-choice {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 3.25rem;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  cursor: pointer;
  transition: background var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.solo-choice__icon { font-size: 1.15rem; line-height: 1; }
.solo-choice:disabled { cursor: default; }
.solo-choice.is-right { background: var(--success-btn); border-color: var(--success-btn); color: var(--success-on); }
.solo-choice.is-wrong { background: var(--danger-soft); border-color: transparent; color: var(--danger-ink); text-decoration: line-through; opacity: 0.75; }
.solo-choices:has(.is-right) .solo-choice:not(.is-right):not(.is-wrong) { opacity: 0.55; }
@media (hover: hover) and (pointer: fine) {
  .solo-choice:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
}

/* --- Strands --- */
.strands-theme { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.strands-theme > span:not(.strands-theme__icon) { display: flex; flex-direction: column; min-width: 0; }
.strands-theme b { font-size: var(--fs-h2); color: var(--text-strong); line-height: 1.2; }
.strands-theme__icon { font-size: 2rem; line-height: 1; }
/* Upright, the theme sits above the stats bar (which is order -1). */
.solo-layout__side > .strands-theme { order: -2; }
.strands-grid {
  container-type: inline-size;
  display: grid;
  grid-template-columns: repeat(var(--st-n), minmax(0, 1fr));
  gap: 4px;
  max-width: 26rem;
  margin: 0 auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.strands-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--text-strong);
  font-size: clamp(0.95rem, 5vw, 1.4rem);
  /* Sized from the cell, so a 9-wide grid on a phone on its side keeps its
     letters inside their squares; the clamp above is the fallback. */
  font-size: min(1.4rem, calc((100cqi - (var(--st-n) - 1) * 4px) / var(--st-n) * 0.6));
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.strands-cell.is-found { box-shadow: none; }
.strands-cell.f0 { background: #bfdbfe; color: #1e3a8a; }
.strands-cell.f1 { background: #bbf7d0; color: #14532d; }
.strands-cell.f2 { background: #fde68a; color: #713f12; }
.strands-cell.f3 { background: #fbcfe8; color: #831843; }
.strands-cell.f4 { background: #ddd6fe; color: #4c1d95; }
.strands-cell.f5 { background: #fed7aa; color: #7c2d12; }
.strands-cell.is-tracing { background: var(--accent); color: var(--accent-on); transform: scale(0.94); }
.strands-words { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.strands-word {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 2.25rem;
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-strong);
  font-weight: 800;
}
.strands-word i { display: inline-block; width: 0.6rem; height: 2px; border-radius: 1px; background: var(--text-3); }
.strands-word.is-found { background: var(--success-soft); color: var(--success-ink); }
.strands-word.motion-waiting { visibility: hidden; }
.strands-word.motion-landed { animation: solo-land 320ms var(--ease-out); }
.strands-ghost {
  position: fixed;
  z-index: var(--z-float-hi);
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--accent-on);
  font-weight: 800;
  pointer-events: none;
}
@keyframes solo-land { 0% { transform: scale(0.85); } 60% { transform: scale(1.08); } 100% { transform: none; } }

/* --- Word wheel --- */
/* Tracks of a fixed share of the width: a column that holds only hidden
   cells has no content and would otherwise collapse to nothing. */
.wheel-grid {
  display: grid;
  grid-template-columns: repeat(var(--ww-cols), calc((100% - (var(--ww-cols) - 1) * 3px) / var(--ww-cols)));
  gap: 3px;
  width: 100%;
  max-width: calc(var(--ww-cols) * 2.8rem);
  margin: 0 auto;
  perspective: 600px;
}
.wheel-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  min-width: 0;
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  box-shadow: inset 0 0 0 1.5px var(--border-strong);
  color: var(--accent-on);
  font-size: clamp(0.9rem, 4.6vw, 1.3rem);
  font-weight: 800;
  line-height: 1;
}
.wheel-cell.is-open { background: var(--accent); box-shadow: none; }
.wheel-typed {
  min-height: 2.5rem;
  margin: var(--sp-2) 0;
  color: var(--text-strong);
  font-size: 1.6rem;
  font-weight: 800;
  line-height: 2.5rem;
  text-align: center;
}
.wheel-ring {
  position: relative;
  width: min(15rem, 70vw);
  aspect-ratio: 1;
  margin: 0 auto var(--sp-3);
  border-radius: 50%;
  background: var(--surface-2);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.wheel-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wheel-lines polyline { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
.wheel-letter {
  position: absolute;
  display: grid;
  place-items: center;
  width: 3.4rem;
  height: 3.4rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1;
  transform: translate(-50%, -50%);
  cursor: pointer;
}
.wheel-letter.is-on { background: var(--accent); color: var(--accent-on); }

/* --- What links them? --- */
.pin-clues { display: grid; gap: var(--sp-2); max-width: 26rem; margin: 0 auto; perspective: 700px; }
.pin-clue {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 3rem;
  padding: 0 var(--sp-3);
  border: 1px dashed var(--border-strong, var(--border));
  border-radius: var(--r-md);
  color: var(--text-3);
  font-size: var(--fs-h2);
}
.pin-clue__n { display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); }
.pin-clue.is-open { border-style: solid; background: var(--surface-solid); color: var(--text-strong); }
.pin-clue.is-open .pin-clue__n { background: var(--accent); color: var(--accent-on); }
.pin-clue.is-new { animation: pin-flip 420ms var(--ease-out) both; transform-origin: center top; }
@keyframes pin-flip { from { transform: rotateX(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.pin-ask { margin-bottom: var(--sp-2); color: var(--text-strong); font-weight: 800; text-align: center; }
.pin-ghost { position: fixed; z-index: var(--z-float-hi); color: var(--success-ink); font-size: 1.6rem; font-weight: 900; pointer-events: none; }

/* --- Quiz streak --- */
.streak-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  max-width: 30rem;
  margin: 0 auto var(--sp-3);
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  text-align: center;
}
.streak-card.is-new { animation: streak-in 340ms var(--ease-out) both; }
@keyframes streak-in { from { transform: translateY(12px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.streak-emoji { font-size: clamp(2.2rem, 12vw, 3.4rem); line-height: 1.2; letter-spacing: 0.1em; }
.streak-prompt { color: var(--text-strong); font-size: var(--fs-h2); font-weight: 800; line-height: 1.45; text-wrap: balance; }
.streak-prompt--sub { color: var(--text-2); font-size: var(--fs-sm); }
.streak-blank { display: inline-block; min-width: 3rem; padding: 0 var(--sp-2); border-bottom: 3px solid var(--accent); color: var(--accent-ink); }
.streak-timer { align-self: stretch; height: 6px; overflow: hidden; border-radius: 3px; background: var(--surface-3); }
.streak-timer i { display: block; height: 100%; background: var(--accent); transform-origin: left center; animation: streak-drain linear forwards; }
[dir="rtl"] .streak-timer i { transform-origin: right center; }
.streak-timer.is-stopped i { animation-play-state: paused; }
@keyframes streak-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.streak-hearts { display: inline-flex; gap: 1px; font-size: 0.95rem; }
.streak-heart { display: inline-block; }
.streak-heart.is-lost { opacity: 0.6; }

/* --- حاسبة الورق --- */
.cs-board { display: grid; gap: var(--sp-1); margin-bottom: var(--sp-3); }
.cs-board__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-bottom: var(--sp-1); }
.cs-total {
  display: grid;
  grid-template-columns: 1.6rem minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-2);
  min-height: 2.75rem;
  padding: 0 var(--sp-3);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.cs-total__rank { color: var(--text-3); font-size: var(--fs-sm); }
.cs-total__name { min-width: 0; overflow: hidden; color: var(--text-strong); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.cs-total__score { color: var(--text-strong); font-size: var(--fs-h2); }
.cs-total.is-lead { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.cs-total.is-lead .cs-total__score { color: var(--accent-ink); }
.cs-total.is-out { opacity: 0.5; }
.cs-total.is-out .cs-total__name { text-decoration: line-through; }
.cs-entry { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.cs-entry__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); color: var(--text-strong); font-size: var(--fs-h3); }
.cs-label { color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; }
/* A name and its inputs side by side, the inputs moving under the name when
   they don't fit (إستميشن's two steppers and dash on a phone). */
.cs-seat-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-1) var(--sp-2);
  padding: var(--sp-1) 0;
  border-bottom: 1px solid var(--border);
}
.cs-seat-row > .cs-seat-row__name { flex: 1 1 6rem; }
.cs-seat-row > :not(.cs-seat-row__name) { flex: 0 0 auto; margin-inline-start: auto; }
.cs-seat-row:last-child { border-bottom: 0; }
.cs-seat-row__name { min-width: 0; overflow: hidden; color: var(--text-strong); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.cs-seat-row__cells { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--sp-2); }
/* سكرو on the table: the name with its result badges under it, the stepper beside. */
.sk-seat-row { flex-wrap: nowrap; }
.sk-seat-row > .sk-seat-row__who { display: flex; flex: 1 1 auto; flex-direction: column; align-items: flex-start; gap: 0.25rem; min-width: 0; margin: 0; }
.sk-seat-row__who > .cs-seat-row__name { max-width: 100%; }
.cs-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cs-cell > small { color: var(--text-3); font-size: var(--fs-xs); font-weight: 700; }
.cs-step { display: inline-flex; align-items: stretch; overflow: hidden; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-solid); }
.cs-step__btn { width: 2.75rem; min-height: 2.75rem; border: 0; background: var(--surface-2); color: var(--text-strong); font-size: 1.1rem; font-weight: 800; cursor: pointer; }
.cs-step__btn:disabled { cursor: default; }
/* The live preview above Save sits in the bar's fade: with four players or
   more its chips wrap to two rows and read over the card underneath, so it
   gets a plate of its own. */
#cs-preview, #sk-preview { justify-content: center; padding: var(--sp-1) var(--sp-2); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-solid); box-shadow: var(--sh-2); }
/* سكرو on the table: a player who ran out of cards has nothing to type. */
.cs-step.is-out { opacity: 0.55; }
.cs-step__val {
  width: 2.8rem;
  min-height: 2.75rem;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text-strong);
  font-size: var(--fs-h3);
  text-align: center;
  -moz-appearance: textfield;
}
.cs-step__val::-webkit-outer-spin-button, .cs-step__val::-webkit-inner-spin-button { margin: 0; -webkit-appearance: none; }
.cs-pick { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.cs-pick__item {
  min-height: 2.75rem;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
}
.cs-pick__item.is-on { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
.cs-card { display: grid; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); }
.cs-card__title { color: var(--text-strong); font-size: var(--fs-h3); }
.cs-toggles { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.cs-toggle {
  min-height: 2.75rem;
  padding: 0 var(--sp-3);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-full);
  background: transparent;
  color: var(--text-2);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
}
.cs-toggle.is-on { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.cs-check { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-strong); font-weight: 700; }
.cs-check input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
.cs-note { color: var(--text-3); font-size: var(--fs-xs); }
.cs-table { display: grid; gap: 2px; overflow-x: auto; }
.cs-layout__side > * + * { margin-top: var(--sp-3); }
/* Sideways and on wide screens: the totals and the rounds beside the round card. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .cs-layout { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: var(--sp-3); align-items: start; }
  .cs-layout__side { position: sticky; top: 0; max-height: calc(var(--app-h, 100vh) - 7rem); overflow-y: auto; }
  .cs-layout .cs-board { margin-bottom: 0; }
  .cs-layout--over { display: block; }
  .cs-layout--over .cs-layout__side { position: static; max-height: none; overflow: visible; }
}
.cs-row { display: grid; grid-template-columns: 2rem repeat(var(--cs-cols), minmax(3.2rem, 1fr)); align-items: center; gap: 2px; min-height: 2rem; text-align: center; }
.cs-row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-row--head { color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.cs-row:not(.cs-row--head):nth-child(even) { border-radius: var(--r-xs); background: var(--surface-2); }
.cs-row__n { display: flex; flex-direction: column; color: var(--text-3); font-size: var(--fs-sm); line-height: 1.1; }
.cs-row__n small { font-size: 0.6rem; }

/* --- زي الكل --- */
.herd-prompt { text-align: center; }
.herd-prompt__text { color: var(--text-strong); font-size: var(--fs-h1); font-weight: 900; line-height: 1.3; text-wrap: balance; }
.herd-groups { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.herd-group {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: 3.25rem;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  text-align: start;
}
button.herd-group { cursor: pointer; }
.herd-group__count { display: grid; flex: none; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-weight: 900; }
.herd-group__body { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.herd-group__body b { font-size: var(--fs-h3); }
.herd-group__also { color: var(--text-3); font-size: var(--fs-sm); font-weight: 600; }
.herd-group__names { color: var(--text-2); font-size: var(--fs-sm); }
.herd-group__mark { flex: none; font-weight: 900; }
.herd-group.is-top { border-color: var(--success); background: var(--success-soft); }
.herd-group.is-top .herd-group__count { background: var(--success-btn); color: var(--success-on); }
.herd-group.is-picked { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }

/* --- مافيا --- */
.mafia-news { text-align: center; }
.mafia-news.is-mafia { border-color: var(--danger); background: var(--danger-soft); }
.mafia-news__role { color: var(--text-strong); font-weight: 800; }
.mafia-sky { border-color: transparent; background: linear-gradient(160deg, #1e1b4b, #0f172a); color: #e0e7ff; }
.mafia-sky .eyebrow, .mafia-sky .field__hint { color: #c7d2fe; }
.mafia-sky .metric { color: inherit; }
.mafia-night__task { margin-bottom: var(--sp-2); color: var(--text-strong); font-size: var(--fs-h3); font-weight: 800; text-align: center; }
.mafia-targets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.mafia-target {
  min-height: 3rem;
  padding: var(--sp-1) var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 700;
  cursor: pointer;
}
.mafia-target.is-on { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
.mafia-target:disabled:not(.is-on) { opacity: 0.45; cursor: default; }
.mafia-check { margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--success-soft); color: var(--success-ink); font-weight: 800; text-align: center; }
.mafia-check.is-mafia { background: var(--danger-soft); color: var(--danger-ink); }
.mafia-hold { margin: var(--sp-3) 0; }
.mafia-hold .hold-card__back { padding: var(--sp-3); align-items: center; text-align: center; }
.mafia-role__icon { font-size: 3rem; line-height: 1; }
.mafia-role__name { font-size: var(--fs-display); font-weight: 900; line-height: 1.1; }
.mafia-role__desc { font-size: var(--fs-sm); line-height: 1.5; text-wrap: balance; }
.mafia-role__extra { margin-top: var(--sp-1); padding: 2px var(--sp-3); border-radius: var(--r-full); background: rgba(0, 0, 0, 0.12); font-size: var(--fs-sm); font-weight: 800; }
.mafia-won { border-color: var(--danger); background: var(--danger-soft); }
.mafia-final { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0; border-bottom: 1px solid var(--border); }
.mafia-final:last-child { border-bottom: 0; }
.mafia-final.is-out b { color: var(--text-3); text-decoration: line-through; }
.mafia-tv-night { color: inherit; }

/* --- على راسك (full screen) --- */
#view-play-headsup {
  position: fixed;
  inset: 0;
  z-index: var(--z-full);
  display: flex;
  flex-direction: column;
  background: var(--bg, var(--surface-2));
}
#view-play-headsup.hidden { display: none; }
.hu-stage {
  position: relative;
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  padding: var(--safe-top) 0 var(--safe-bottom);
  transition: background-color 180ms ease-out;
}
.hu-stage[data-phase="countdown"], .hu-stage[data-phase="play"] { background: #0f172a; color: #ffffff; touch-action: none; user-select: none; -webkit-user-select: none; }
/* The table sees a flash of green for right and amber for pass, in both themes. */
.hu-stage[data-flash="right"] { background: #15803d; color: #ffffff; }
.hu-stage[data-flash="pass"] { background: #b45309; color: #ffffff; }
.hu-exit {
  position: absolute;
  top: calc(var(--safe-top) + var(--sp-2));
  inset-inline-end: max(var(--sp-3), var(--safe-left), var(--safe-right));
  z-index: 3;
  width: var(--tap);
  height: var(--tap);
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-solid);
  color: var(--text-2);
  font-size: 1.1rem;
  cursor: pointer;
}
.hu-panel {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  width: 100%;
  max-width: 30rem;
  margin: 0 auto;
  padding: var(--sp-6) var(--sp-4);
  overflow-y: auto;
  text-align: center;
}
.hu-panel--list { justify-content: flex-start; padding-top: calc(var(--sp-6) + var(--tap)); }
.hu-panel__icon { font-size: 3.5rem; line-height: 1; }
.hu-panel__title { color: var(--text-strong); font-size: var(--fs-display); font-weight: 900; line-height: 1.15; text-wrap: balance; }
.hu-panel .btn, .hu-panel .btn-stack { width: 100%; }
.hu-steps { display: grid; gap: var(--sp-2); width: 100%; padding: 0; list-style: none; text-align: start; }
.hu-steps li { padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--surface-solid); color: var(--text-strong); font-weight: 700; }
.hu-card {
  position: relative;
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  padding: var(--sp-4);
  text-align: center;
}
/* The page stayed upright but the phone is on its side: the card turns with it. */
.hu-card[data-rot="90"], .hu-card[data-rot="-90"] {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 2;
  width: var(--app-h, 100vh);
  height: 100vw;
  transform: translate(-50%, -50%) rotate(90deg);
}
.hu-card[data-rot="-90"] { transform: translate(-50%, -50%) rotate(-90deg); }
.hu-card__top { position: absolute; top: var(--sp-3); right: var(--sp-4); left: var(--sp-4); display: flex; justify-content: space-between; font-size: 1.6rem; font-weight: 900; }
.hu-card__top .metric, .hu-count { color: inherit; }
.hu-card__small { font-size: var(--fs-h2); font-weight: 800; opacity: 0.9; }
.hu-word { max-width: 100%; font-size: clamp(2.4rem, 13vw, 5.5rem); font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.hu-card[data-rot="90"] .hu-word, .hu-card[data-rot="-90"] .hu-word { font-size: clamp(2.4rem, 12vh, 6rem); }
.hu-count { font-size: clamp(5rem, 30vw, 10rem); line-height: 1; }
.hu-flash { position: absolute; top: 50%; left: 50%; z-index: 4; margin: -3rem 0 0 -3rem; width: 6rem; font-size: 6rem; line-height: 1; text-align: center; opacity: 0; pointer-events: none; }
.hu-taps { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.hu-tap {
  min-height: 5rem;
  border: 0;
  background: rgba(255, 255, 255, 0.08);
  color: inherit;
  font-family: var(--font);
  font-size: var(--fs-h2);
  font-weight: 800;
  cursor: pointer;
}
.hu-tap--right { background: rgba(34, 197, 94, 0.35); }
.hu-tap--pass { background: rgba(245, 158, 11, 0.25); }
.hu-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.hu-chip {
  min-height: 2.5rem;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-3);
  font-family: var(--font);
  font-weight: 700;
  text-decoration: line-through;
  cursor: pointer;
}
.hu-chip.is-right { border-color: transparent; background: var(--success-soft); color: var(--success-ink); text-decoration: none; }
.hu-board { display: grid; gap: var(--sp-1); width: 100%; }
.hu-board .row { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; align-items: center; text-align: start; }
.hu-decks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.hu-deck {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 5.25rem;
  padding: var(--sp-2) var(--sp-1);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  cursor: pointer;
}
.hu-deck.is-active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.hu-deck__icon { font-size: 1.6rem; line-height: 1.1; }
.hu-deck__name { font-size: var(--fs-sm); font-weight: 800; line-height: 1.2; text-align: center; }
.hu-deck__count { color: var(--text-3); font-size: var(--fs-xs); }
@media (orientation: landscape) and (max-height: 500px) {
  .hu-panel { padding: var(--sp-3) var(--sp-4); gap: var(--sp-2); }
  .hu-panel__icon { font-size: 2.2rem; }
  .hu-panel__title { font-size: var(--fs-h1); }
  .hu-word { font-size: clamp(2.2rem, 11vw, 5rem); }
  .hu-tap { min-height: 3.5rem; }
  .hu-decks { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

/* --- تحدي اليوم --- */
.daily-strip {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  margin-bottom: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid color-mix(in oklab, var(--accent) 35%, var(--border));
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface-solid) 70%);
  color: var(--text-strong);
  font-family: var(--font);
  text-align: start;
  cursor: pointer;
}
.daily-strip__icon { font-size: 1.8rem; line-height: 1; }
.daily-strip__text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.daily-strip__text b { font-size: var(--fs-h3); }
.daily-strip__text span { color: var(--text-2); font-size: var(--fs-sm); }
.daily-strip__streak { padding: 2px var(--sp-2); border-radius: var(--r-full); background: var(--surface-solid); color: var(--accent-ink); font-weight: 800; }
.daily-head { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.daily-head__streak { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); }
.daily-head__streak > span:nth-child(2) { color: var(--text-strong); font-weight: 800; }
.daily-head__streak b { font-size: var(--fs-display); line-height: 1; color: var(--accent-ink); }
.daily-head__streak .field__hint { flex-basis: 100%; margin: 0; }
.daily-head__fire { font-size: 2.2rem; line-height: 1; }
.daily-head__progress { display: grid; gap: var(--sp-1); color: var(--text-strong); font-weight: 700; }
.daily-head__progress .field__hint { margin: 0; font-weight: 400; }
.daily-bar { display: block; height: 8px; overflow: hidden; border-radius: 4px; background: var(--surface-3); }
.daily-bar i { display: block; height: 100%; background: var(--accent); transform: scaleX(var(--p)); transform-origin: left center; }
[dir="rtl"] .daily-bar i { transform-origin: right center; }
.daily-bar i.is-new { animation: flags-fill 900ms var(--ease-out) 150ms both; }
.daily-list { display: grid; gap: var(--sp-2); }
.daily-row { width: 100%; }
.daily-row__status { flex: none; color: var(--text-strong); font-weight: 800; white-space: nowrap; }
.daily-row.is-done { opacity: 1; cursor: default; }
.daily-row.is-done .tool-desc { color: var(--success-ink); }
.daily-head__actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
}
.solo-archive-badge {
  display: flex;
  justify-content: center;
  margin-bottom: var(--sp-2);
  order: -2;
}
.archive-cal-wrap {
  display: grid;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}
.archive-cal {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  /* Seven across a 375px phone is the whole constraint: at a 4px gap a day
     came out 39px, under the floor. The gap gives the pixels back, and the
     min-height covers the shorter axis. */
  gap: 2px;
  text-align: center;
}
.archive-cal__head {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--text-3);
  padding: var(--sp-1) 0;
}
.archive-cal__day {
  aspect-ratio: 1;
  min-height: var(--tap);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-md);
  background: var(--surface-2);
  color: var(--text);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
  border: 2px solid transparent;
  padding: 2px;
}
.archive-cal__day.is-selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.archive-cal__day.is-future {
  opacity: 0.3;
  pointer-events: none;
}
.archive-cal__day.is-empty {
  visibility: hidden;
  pointer-events: none;
}
.archive-cal__badge {
  font-size: 0.65rem;
  line-height: 1;
  color: var(--accent-ink);
  font-weight: 800;
  margin-top: 1px;
}
.archive-cal__badge.is-all {
  color: var(--success-ink);
}

/* --- أرقامي (Stats) --- */
.stats-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  text-align: center;
}
.stats-games-list {
  display: grid;
  gap: var(--sp-3);
}
.stats-game-card {
  display: grid;
  gap: var(--sp-2);
}
.stats-game-head {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.stats-game-title {
  font-size: var(--fs-h3);
  font-weight: 800;
  color: var(--text-strong);
}
.stats-levels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
  gap: var(--sp-2);
}
.stats-level-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--sp-2);
  border-radius: var(--r-md);
  background: var(--surface-2);
  text-align: center;
  min-height: 3rem;
}
.stats-level-name {
  font-size: var(--fs-xs);
  color: var(--text-2);
  font-weight: 700;
  margin-bottom: 2px;
}
.stats-level-val {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-strong);
}

/* --- Guess the country --- */
.flag-emoji { font-family: "Twemoji Country Flags", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Android Emoji", sans-serif; }
.flags-target {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-1);
  margin-bottom: var(--sp-3);
  text-align: center;
}
.flags-target__flag { font-size: clamp(4rem, 24vw, 6.5rem); line-height: 1.05; filter: drop-shadow(0 6px 12px rgba(15, 23, 42, 0.18)); }
.flags-target__ask { color: var(--text-2); font-weight: 700; text-wrap: balance; }
.flags-target__ask b { color: var(--text-strong); font-size: var(--fs-h1); }
.flags-hints { padding: 2px var(--sp-3); border-radius: var(--r-full); background: var(--warning-soft); color: var(--warning-ink); font-size: var(--fs-sm); font-weight: 700; }
.flags-guesses { display: grid; gap: 6px; width: 100%; max-width: 30rem; margin: 0 auto; padding: 0; list-style: none; }
.flags-row {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto auto;
  align-items: center;
  gap: var(--sp-2);
  min-height: 2.6rem;
  padding: 0 var(--sp-3);
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
}
.flags-row > :not(.flags-row__fill) { position: relative; }
.flags-row.is-empty { border-style: dashed; background: transparent; }
.flags-row__fill { position: absolute; inset: 0; background: var(--accent-soft); transform: scaleX(var(--p, 0)); transform-origin: left center; }
[dir="rtl"] .flags-row__fill { transform-origin: right center; }
.flags-row__flag { font-size: 1.35rem; line-height: 1; }
.flags-row__name { min-width: 0; overflow: hidden; color: var(--text-strong); text-overflow: ellipsis; white-space: nowrap; }
.flags-row__km { color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; }
.flags-row__arrow { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--accent); color: var(--accent-on); font-size: 1rem; font-weight: 900; line-height: 1; transform: rotate(var(--deg)); }
.flags-row__p { color: var(--text-3); font-size: var(--fs-xs); }
.flags-row.is-right { border-color: transparent; background: var(--success-soft); }
.flags-row.is-right .flags-row__fill { background: transparent; }
.flags-row__win { font-size: 1.2rem; }
.flags-row.is-new { animation: streak-in 300ms var(--ease-out) both; }
.flags-row.is-new .flags-row__fill { animation: flags-fill 800ms var(--ease-out) 150ms both; }
.flags-row.is-new .flags-row__arrow { animation: flags-turn 900ms cubic-bezier(0.34, 1.56, 0.64, 1) 150ms both; }
@keyframes flags-fill { from { transform: scaleX(0); } }
@keyframes flags-turn { from { transform: rotate(0deg); } }
.flags-input { margin-bottom: var(--sp-3); }
.flags-suggest { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
.flags-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 2.6rem;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 700;
  cursor: pointer;
}
.flags-chip .flag-emoji:empty { display: none; }
@media (hover: hover) and (pointer: fine) {
  .flags-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
}
/* Upright, the field comes before the guesses so the keyboard never covers it. */
.solo-layout__board:has(.flags-target) { display: contents; }
.flags-target { order: -1; }
.solo-layout__side > .flags-input, .solo-layout__side > .flags-over { order: 0; }
.flags-guesses { order: 1; }
.solo-layout__side > .solo-bar:has(+ .flags-input), .flags-layout .solo-layout__side > .solo-bar { order: -2; }
#solo-result-icon .flag-emoji { font-size: 3.5rem; line-height: 1; }

/* A phone held sideways, and a laptop or TV: the board on one side, its keys
   and tools on the other. The board is sized off the shell's height, so it
   never needs scrolling. On a phone held upright it is one column, with the
   stats first. */
.solo-layout { display: flex; flex-direction: column; }
.solo-layout__side { display: contents; }
.solo-layout__side > .solo-bar { order: -1; }
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .solo-layout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
  .solo-layout__side { display: block; }
  .solo-layout__board { width: min(calc(var(--app-h, 100vh) - 8.5rem), 52vw); }
  /* A minefield is taller than it is wide: it keeps tappable cells and scrolls. */
  .solo-layout__board:has(.mines-grid) { width: min(52vw, 20rem); }
  .solo-layout__side .sdk-pad { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 0; }
  /* Word and quiz games: their board is a list or a card, not a square. */

/* ==========================================================================
   16. سكرو
   JS_RoomScrew.html: the table on separate phones and on the TV. Every hand
   lies face down in numbered slots, and a move flies between exact slots
   (.skr-ghost, a Web Animation of transform and opacity; .skr-hold keeps the
   end state hidden until it lands). One card component, .skr-card, sized by
   --skr-w (its height is 1.42 times that), in the owner's "colour blocks"

/* --- The card --- */
:root {

  --skr-c-good: #15803d;    /* the green screw, -1 */
  --skr-c-thief: #b45309;   /* الحرامي's three */
  /* The two below were a cyan beside 1-3's teal and a purple beside 7-10's
     violet, alike at table size once the colours showed at all (the owner, 21
     Sep 2026): an olive-lime for the partners, and a Ramadan night with a gold
     icon for المسحراتي's three. */
  --skr-c-sahib: #4d7c0f;   /* صاحب صاحبه's three */
  --skr-c-mesa: #172554;    /* المسحراتي's three */
  --skr-mesa-ink: #fcd34d;
  --skr-c-oscar: #db2777;   /* أوسكار's four */

  --skr-back-2: #4c1d95;

.skr-c--mid { --c: var(--skr-c-mid); }
.skr-c--look { --c: var(--skr-c-look); }
.skr-c--act { --c: var(--skr-c-act); }
.skr-c--bad { --c: var(--skr-c-bad); }
.skr-c--good { --c: var(--skr-c-good); }
.skr-c--thief { --c: var(--skr-c-thief); }
.skr-c--sahib { --c: var(--skr-c-sahib); }
.skr-c--mesa { --c: var(--skr-c-mesa); }

/* A face with no colour group is the middle blue. Given with no weight at all

   which sit on the same element: from 17 to 21 Sep 2026 every face was blue,
   the red screw and +20 included. */

.skr-card {

  display: inline-grid;

.skr-card--face::after { content: ''; position: absolute; inset-block-start: -30%; inset-inline-end: -40%; width: 90%; height: 70%; border-radius: 50%; background: rgba(255, 255, 255, 0.12); pointer-events: none; }

.skr-card__big {

.skr-card.is-full .skr-card__big--long { font-size: calc(var(--skr-w, 3rem) * 0.38); }

  font-family: 'Baloo Bhaijaan 2', 'Cairo', var(--font);

  direction: ltr;
}
.skr-card__mini .skr-icon { width: calc(var(--skr-w, 3rem) * 0.16); height: calc(var(--skr-w, 3rem) * 0.16); margin-top: 2px; stroke-width: 2.4; }

  padding: calc(var(--skr-w, 3rem) * 0.035) 2px calc(var(--skr-w, 3rem) * 0.05);
  overflow: hidden;
  background: rgba(0, 0, 0, 0.22);
  font-family: 'Cairo', var(--font);
  font-size: calc(var(--skr-w, 3rem) * 0.14);

@container (max-width: 55px) {

}
/* The back: violet, dotted, the Ashry mark on the big ones and "A." on the small. */
.skr-card--back {
  background: linear-gradient(160deg, var(--skr-back-1), var(--skr-back-2));
  box-shadow: 0 calc(var(--skr-w, 3rem) * 0.1) calc(var(--skr-w, 3rem) * 0.24) calc(var(--skr-w, 3rem) * -0.13) #2e1065;
  color: #fcd34d;
}
.skr-card--back::before {

}
.skr-card__mark { position: relative; z-index: 1; width: 68%; height: auto; aspect-ratio: 1; border-radius: 22%; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.5); }
.skr-card__a { position: relative; z-index: 1; color: #fff; font-family: 'Baloo Bhaijaan 2', 'Cairo', var(--font); font-size: calc(var(--skr-w, 3rem) * 0.3); font-weight: 800; line-height: 1; direction: ltr; }
.skr-card__a i { color: #f5c451; font-style: normal; }

.skr-card__known {

  z-index: 1;
  display: grid;
  place-items: center;
  min-width: 62%;
  padding: calc(var(--skr-w, 3rem) * 0.04) calc(var(--skr-w, 3rem) * 0.06);
  border-radius: calc(var(--skr-w, 3rem) * 0.1);
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  color: var(--c);
  font-family: 'Baloo Bhaijaan 2', 'Cairo', var(--font);
  font-size: calc(var(--skr-w, 3rem) * 0.32);
  font-weight: 800;
  line-height: 1;
  white-space: nowrap;
  direction: ltr;
  unicode-bidi: isolate;
}
.skr-card__known .skr-icon { width: calc(var(--skr-w, 3rem) * 0.34); height: calc(var(--skr-w, 3rem) * 0.34); stroke-width: 2.6; }
.skr-card--empty { border: 2px dashed var(--border-strong); background: transparent; box-shadow: none; }
/* A power's line icon in its card's colour, in the bars (the power, the vote, بوم). */
.skr-chip { display: inline-grid; place-items: center; flex: none; width: 1.6em; height: 1.6em; margin-inline-end: 0.35em; border-radius: 0.45em; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 78%, white), var(--c) 60%, color-mix(in srgb, var(--c) 80%, black)); color: #fff; vertical-align: middle; }
