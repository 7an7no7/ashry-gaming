<script>
/* ============================================================================
   لو خيروك · مين أكثر واحد · فيبج
   ----------------------------------------------------------------------------
   Three games over one voting engine. The shared pieces — the ballot, the
   waiting state, the results bars and the scoreboard — live at the top; each
   game below only describes what is different about it.

   While a vote is open the server tells us who has voted but not what they
   chose, so none of these renderers can leak a running tally even by accident.
   ========================================================================= */

const VOTE_LANG = () => (contentLang());

/**
 * Is this option this phone's own (its lie, itself)? An option may carry its
 * owner in the open (`ownerId`), or the server may keep owners hidden and tell
 * each phone only which option is its own (`you.voteOwn`, an id or a list).
 */
function isOwnVoteOption(state, o) {
  if (!o) return false;
  if (o.ownerId && o.ownerId === Room.me) return true;
  const own = state && state.you && state.you.voteOwn;
  if (own === undefined || own === null) return false;
  return Array.isArray(own) ? own.indexOf(o.id) !== -1 : own === o.id;
}

/**
 * The payload for a host's "next round", as a JS object literal safe inside an
 * onclick attribute. It carries the round the button was drawn for, so a tap
 * that lands after the round already moved on is ignored by the server.
 */
function roomNextArgs(state, extra) {
  const o = Object.assign({ lang: VOTE_LANG() }, extra || {});
  const round = state && state.shared && state.shared.round;
  if (typeof round === 'number') o.round = round;
  return escapeHTML(JSON.stringify(o));
}

/** The ballot: one big tappable row per option. */
function renderBallot(state, opts) {
  const v = state.shared.vote;
  const t = TRANSLATIONS[appState.lang];
  const iVoted = v.voted.indexOf(Room.me) !== -1;
  const canVote = v.eligible.indexOf(Room.me) !== -1;

  if (!canVote) {
    return `<div class="waiting-note">${t.vote_spectating || 'تتفرج على هذه الجولة'}</div>`
         + renderVoteProgress(state);
  }
  if (iVoted) {
    return `<div class="waiting-note"><span class="animate-pulse">🗳️</span> ${t.vote_waiting || 'في انتظار باقي الأصوات'}</div>`
         + renderVoteProgress(state);
  }

  // The round (and the storyteller's turn) the ballot was drawn for goes with
  // the tap: option ids repeat from round to round, so a vote that lands after
  // the host closed it and dealt the next must not count there.
  const stamp = ['round', 'turn'].map(k => {
    const x = state.shared[k];
    if (typeof x === 'number') return `, ${k}: ${x}`;
    if (typeof x === 'string' && x) return `, ${k}: '${jsStringAttr(x)}'`;
    return '';
  }).join('');
  return `<div class="btn-stack">
      ${v.options.map((o, i) => {
        const mine = isOwnVoteOption(state, o);
        // ballot-option--iN: لو خيروك paints its two options the TV's two colours.
        return `<button class="ballot-option ballot-option--i${i} ${mine ? 'is-own' : ''}" ${mine ? 'disabled' : ''}
                        onclick="roomAct('vote', { option: '${jsStringAttr(o.id)}'${stamp} })">
                  <span class="ballot-option__label">${escapeHTML(o.label)}</span>
                  ${mine ? `<span class="badge">${escapeHTML((opts && opts.ownLabel) || t.vote_your_answer || 'إجابتك')}</span>` : ''}
                </button>`;
      }).join('')}
    </div>` + renderVoteProgress(state);
}

function renderVoteProgress(state) {
  const v = state.shared.vote;
  const t = TRANSLATIONS[appState.lang];
  return `
    <div class="vote-progress">
      <span>${t.vote_count || 'صوّت'}: ${ltrFrac(v.voted.length, v.eligible.length)}</span>
      ${v.phase === 'voting'
        ? roomMoveOnHtml(state, `<button class="btn btn--ghost btn--xs btn--auto" onclick="roomAct('closeVote')">${t.vote_close || 'اقفل التصويت'}</button>`)
        : ''}
    </div>`;
}

/** Result bars, sorted highest first, with who voted for what. */
function renderVoteResults(state, opts) {
  const v = state.shared.vote;
  const total = Math.max(1, v.totalVotes || 0);
  const rows = v.results.slice().sort((a, b) => b.count - a.count);
  const highlight = (opts && opts.highlightId) || null;
  const isWin = (r) => (highlight ? r.id === highlight : r.count === rows[0].count && r.count > 0);
  // The first time this result is on this phone, the bars grow one at a time
  // and the winner's comes last (JS_Motion.html, section 7).
  const key = ['vote', state.code, state.game, state.shared.round, state.shared.turn,
               rows.map(r => r.id + ':' + r.count + ':' + r.label).join(',')].join('|');
  const times = voteRevealTimes(key, rows, isWin, opts && opts.delay);

  return `<div class="result-list ${times ? 'result-list--reveal' : ''}" ${times ? `data-reveal-ms="${times.total}"` : ''}>
      ${rows.map(r => {
        const pct = Math.round((r.count / total) * 100);
        const win = isWin(r);
        return `
          <div class="result-row ${win ? 'is-top' : ''}" ${times ? `style="--at:${times.get(r)}ms"` : ''}>
            <div class="result-row__bar" style="width:${pct}%"></div>
            <div class="result-row__body">
              <span class="result-row__label">${escapeHTML(r.label)}</span>
              <span class="result-row__count">${r.count}</span>
            </div>
            ${r.voters.length ? `<div class="result-row__voters">${r.voters.map(escapeHTML).join('، ')}</div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

/** `title` names a board that isn't points (أونو's wins); otherwise it is "the standings". */
function renderScoreboard(board, title) {
  if (!board || !board.length) return '';
  const t = TRANSLATIONS[appState.lang];
  // data-pid and data-score let animateScoreboards (JS_Motion.html) count up and slide.
  return `
    <div class="section scoreboard">
      <div class="section__head">
        <h2 class="section__title">${title ? escapeHTML(title) : (t.scoreboard || 'الترتيب')}</h2>
        <span class="section__rule"></span>
      </div>
      ${board.map((p, i) => `
        <div class="status-row ${i === 0 && p.score > 0 ? 'status-row--turn' : ''}" data-pid="${escapeHTML(String(p.id || p.name))}" data-score="${Number(p.score) || 0}">
          <div class="status-row__body">
            <div class="status-row__name">${i === 0 && p.score > 0 ? '👑 ' : ''}${escapeHTML(p.name)}</div>
          </div>
          <span class="badge badge--accent" data-count>${p.score}</span>
        </div>`).join('')}
    </div>`;
}

/** Host gets "next round" and "another game"; everyone else waits. */
function renderRoundFooter(state, nextLabel) {
  const t = TRANSLATIONS[appState.lang];
  // The next round is anyone's once the host is away (roomMoveOnHtml); another game stays the host's.
  return roomMoveOnHtml(state, `<div class="btn-stack">
      <button onclick="roomAct('nextRound', ${roomNextArgs(state)})" class="btn btn--primary btn--lg">${nextLabel}</button>
      ${state.youAreHost ? `<button onclick="tvBackToHub()" class="btn btn--ghost">${t.room_another_game || 'لعبة أخرى'}</button>` : ''}
    </div>`, `<div class="waiting-note">${t.room_wait_host}</div>`);
}

const langLobbyOptions = (state, hintKey) => {
  if (!state.youAreHost) return '';
  const t = TRANSLATIONS[appState.lang];
  return `<p class="field__hint" style="text-align:center">${t[hintKey] || ''}</p>`;
};

/* ==========================================================================
   لو خيروك — no scoring, the argument is the point
   ========================================================================== */
ROOM_GAMES.wouldyou = {
  lobbyOptions: (s) => langLobbyOptions(s, 'wyr_hint'),
  startPayload: () => ({ lang: VOTE_LANG() }),
  render(state) {
    if (appState.currentView !== 'room-wouldyou') setView('room-wouldyou');
    const el = document.getElementById('view-room-wouldyou');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const v = state.shared.vote;

    renderRoomFrame(el, ['wyr', state.shared.dealId, state.shared.round, v.phase, v.voted.length, state.youAreHost, appState.lang].join('|'), () => `
      <div class="card" style="text-align:center">
        <div class="eyebrow">${t.round || 'جولة'} ${state.shared.round}</div>
        <div class="card__title" style="margin-bottom:0">${t.setup_wouldyou || 'لو خيروك'}</div>
      </div>
      ${v.phase === 'voting' ? renderBallot(state) : renderVoteResults(state)}
      ${v.phase === 'results' ? renderRoundFooter(state, t.next_question || 'سؤال جديد') : ''}
      ${renderRoomPlayerStrip(state)}`);
    refreshRoomPlayerStrip(el, state);
  }
};

/* ==========================================================================
   مين أكثر واحد — the ballot is the room itself
   ========================================================================== */
ROOM_GAMES.mostlikely = {
  lobbyOptions: (s) => langLobbyOptions(s, 'mlt_hint'),
  startPayload: () => ({ lang: VOTE_LANG() }),
  render(state) {
    if (appState.currentView !== 'room-mostlikely') setView('room-mostlikely');
    const el = document.getElementById('view-room-mostlikely');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const v = state.shared.vote;

    renderRoomFrame(el, ['mlt', state.shared.dealId, state.shared.round, v.phase, v.voted.length, state.youAreHost, appState.lang].join('|'), () => `
      <div class="card" style="text-align:center">
        <div class="eyebrow">${t.round || 'جولة'} ${state.shared.round}</div>
        <div class="prompt-text">${escapeHTML(state.shared.prompt || '')}</div>
      </div>
      ${v.phase === 'voting' ? renderBallot(state) : renderVoteResults(state)}
      ${v.phase === 'results' ? renderScoreboard(state.shared.board) + renderRoundFooter(state, t.next_question || 'سؤال جديد') : ''}
      ${renderRoomPlayerStrip(state)}`);
    refreshRoomPlayerStrip(el, state);
  }
};

/* ==========================================================================
   فيبج — invent an answer, then find the real one
   ========================================================================== */
ROOM_GAMES.fibbage = {
  lobbyOptions: (s) => langLobbyOptions(s, 'fib_hint'),
  startPayload: () => ({ lang: VOTE_LANG() }),
  render(state) {
    if (appState.currentView !== 'room-fibbage') setView('room-fibbage');
    const el = document.getElementById('view-room-fibbage');
    if (!el) return;
    const t = TRANSLATIONS[appState.lang];
    const s = state.shared;

    const question = `
      <div class="card" style="text-align:center">
        <div class="eyebrow">${t.round || 'جولة'} ${s.round}</div>
        <div class="prompt-text">${escapeHTML(s.question || '')}</div>
      </div>`;

    if (s.phase === 'writing') {
      // Only roster members still in the room, or the counter sticks at 3/4
      // forever once a phone drops - the server stopped waiting on them.
      const here = state.players.map(p => p.id);
      const active = (s.roster || here).filter(id => here.indexOf(id) !== -1);
      const done = (s.submitted || []).filter(id => active.indexOf(id) !== -1).length;
      const need = active.length;
      const iSubmitted = (s.submitted || []).indexOf(Room.me) !== -1;
      // Same rule as Just One: while you are inventing a lie, other people
      // finishing theirs must not rebuild the box out from under you.
      const wsig = 'writing|' + s.dealId + '|' + s.round + '|' + iSubmitted + '|' + state.youAreHost + (iSubmitted ? '|' + done + '/' + need : '');
      renderRoomFrame(el, wsig, () => question + `
        <div class="card">
          ${iSubmitted
            ? `<div class="waiting-note"><span class="animate-pulse">✍️</span> ${t.waiting_others} (${done}/${need})</div>`
            : `<label class="field__label">${t.fib_your_lie || 'اخترع إجابة مقنعة'}</label>
               <input type="text" id="fib-lie" autocomplete="off" maxlength="40"
                      onkeydown="if(event.key==='Enter') submitFibbageLie()">
               <button onclick="submitFibbageLie()" class="btn btn--primary btn--lg">${t.send || 'إرسال'}</button>
               <p class="field__hint">${t.fib_lie_hint || 'الهدف إن الناس تصدقها وتختارها'}</p>`}
        </div>
        ${roomMoveOnHtml(state, roomHostRow([[fibCloseWritingLabel(t), "roomAct('closeWriting')"]]))}` + renderRoomPlayerStrip(state), 'fib-write|' + s.round);
      refreshRoomPlayerStrip(el, state);
      return;
    }

    if (s.phase === 'voting' || (s.vote && s.vote.phase === 'voting')) {
      renderRoomFrame(el, ['fibvote', s.dealId, s.round, s.vote.voted.length, state.youAreHost].join('|'),
                      () => question + renderBallot(state) + renderRoomPlayerStrip(state));
      refreshRoomPlayerStrip(el, state);
      return;
    }

    // Results: the lies turn over one at a time, least picked first, and the
    // truth last (fibRevealHtml); a redraw shows them all settled.
    const rebuilt = renderRoomFrame(el, ['fibresult', s.dealId, s.round, state.youAreHost].join('|'), () => question +
      fibRevealHtml(state, t) + `
      ${renderRoundFooter(state, t.next_question || 'سؤال جديد')}
      ${renderRoomPlayerStrip(state)}`);
    if (rebuilt) fibRevealRun(el, state);
    refreshRoomPlayerStrip(el, state);
  }
};

/* --- فيبج's reveal (ideas batch: rooms) -------------------------------------------
   The options turn over one at a time: the lies, least picked first, each saying
   whose lie it was and how many it fooled; then the truth, last, face down under
   three ticks and turning over like the spy's card; then the board, its points
   flying in from the cards on a phone. Once per round (stageReveal); a reload or
   a latecomer sees it settled. Owners are public once the vote has closed
   (results[].ownerId). */
const FIB_FOOL_PTS = 500;     // FIBBAGE_FOOL_POINTS in RoomGames.js
const FIB_TRUTH_PTS = 1000;   // FIBBAGE_TRUTH_POINTS
const FIB_STEP_MS = 900;

/** The round's options in the order they turn over, each with its moment. */
function fibRevealPlan(state) {
  const s = state.shared;
  const results = ((s.vote || {}).results || []);
  const truthId = s.truthId || 'truth';
  const lies = results.filter(r => r.id !== truthId).sort((a, b) => a.count - b.count);
  const truth = results.find(r => r.id === truthId) || { id: truthId, label: s.truth || '', count: 0, voters: [] };
  const lieAt = (i) => 300 + i * FIB_STEP_MS;
  const truthAt = lies.length ? lieAt(lies.length - 1) + 1500 : 1300;
  return { lies, truth, lieAt, truthAt, boardAt: truthAt + 1000 };
}

function fibRevealHtml(state, t, o) {
  const s = state.shared;
  const opt = o || {};
  const plan = fibRevealPlan(state);
  const st = stageReveal(['fib-rev', opt.tv ? 'tv' : 'ph', roomDealKey(state), s.round].join('|'));
  const nameOf = (id) => (state.players.find(p => p.id === id) || {}).name || '…';
  const voters = (r) => r.voters && r.voters.length ? `<div class="fib-card__voters">${r.voters.map(v => `<bdi>${escapeHTML(v)}</bdi>`).join('، ')}</div>` : '';
  const lies = plan.lies.map((r, i) => `
    <div class="fib-card ${r.count ? 'is-fooled' : ''}" data-fib-owner="${escapeHTML(String(r.ownerId || ''))}" data-fib-n="${r.count}"${st.at(plan.lieAt(i), 'pop')}>
      <div class="fib-card__label">${escapeHTML(r.label)}</div>
      <div class="fib-card__line">🤥 ${escapeHTML((t.fib_lie_of || '{name}').replace('{name}', nameOf(r.ownerId)))} —
        ${r.count ? `${escapeHTML(t.fib_fooled || '')} <b class="metric">${st.count(r.count, plan.lieAt(i) + 250)}</b>` : escapeHTML(t.fib_fooled_none || '')}</div>
      ${voters(r)}
    </div>`).join('');
  const truth = plan.truth;
  const truthCard = `
    <div class="fib-card fib-card--truth"${st.at(plan.truthAt, 'flip')} data-fib-truth>
      ${st.on ? stageCoverHtml(t.fib_truth) : ''}
      <div class="fib-card__eyebrow">✅ ${escapeHTML(t.fib_truth || '')}</div>
      <div class="fib-card__truth">${escapeHTML(s.truth || truth.label || '')}</div>
      <div class="fib-card__line">${truth.count ? `${escapeHTML(t.fib_found_by || '')}: ${truth.voters.map(v => `<bdi>${escapeHTML(v)}</bdi>`).join('، ')}` : escapeHTML(t.fib_found_none || '')}</div>
    </div>`;
  const board = st.board(renderScoreboard(s.board), plan.boardAt);
  return `<div class="fib-reveal ${opt.tv ? 'fib-reveal--tv' : ''}"${st.end(900)} data-fib-stage="${st.on ? '1' : ''}">
      <div class="fib-reveal__cards">${lies}${truthCard}</div>
      <div class="fib-reveal__board ${opt.tv ? 'tv-scale' : ''}">${board}</div>
    </div>`;
}

/** The counts, the board, the drum before the truth, the points flying home and the confetti. */
function fibRevealRun(root, state) {
  const box = root && root.querySelector('.fib-reveal');
  if (!box) return;
  stageRun(box, state);
  if (box.dataset.fibStage !== '1') return;
  const plan = fibRevealPlan(state);
  [1100, 700, 300].forEach(ms => stageSound(state, 'tick', plan.truthAt - ms));
  stageSound(state, 'success', plan.truthAt + 300);
  if (!state.youAreScreen) {
    // Each lie's points fly to its author's row, then the finders' to theirs.
    setTimeout(() => {
      if (!box.isConnected) return;
      const rowOf = (id) => box.querySelector(`.scoreboard [data-pid="${CSS.escape(String(id))}"]`);
      let k = 0;
      box.querySelectorAll('.fib-card.is-fooled').forEach(card => {
        const row = rowOf(card.dataset.fibOwner);
        const n = Number(card.dataset.fibN) || 0;
        if (row) setTimeout(() => card.isConnected && flyPoints('+' + n * FIB_FOOL_PTS, card.getBoundingClientRect(), row), 120 + (k++) * 200);
      });
      const truthCard = box.querySelector('[data-fib-truth]');
      (plan.truth.voters || []).forEach(name => {
        const p = state.players.find(x => x.name === name);
        const row = p && rowOf(p.id);
        if (row && truthCard) setTimeout(() => truthCard.isConnected && flyPoints('+' + FIB_TRUTH_PTS, truthCard.getBoundingClientRect(), row), 120 + (k++) * 200);
      });
    }, plan.boardAt + 200);
  }
  if (typeof confetti === 'function') afterReveal(box, () => { if (box.isConnected && !document.hidden) confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } }); });
}

/** The host's way past a writer whose phone went quiet. */
const fibCloseWritingLabel = (t) => t.fib_close_writing || (appState.lang === 'en' ? 'Vote on the answers so far' : 'صوّتوا على اللي اتكتب');

async function submitFibbageLie() {
  const input = document.getElementById('fib-lie');
  const lie = (input.value || '').trim();
  if (!lie) return showToast(TRANSLATIONS[appState.lang].fib_need_lie || 'اكتب إجابة', 'error');
  await roomAct('submitLie', { lie: lie });
}
</script>
