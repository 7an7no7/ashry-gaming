<script>
/* ============================================================================
   الجرس — THE BUZZER (multiplayer)
   ----------------------------------------------------------------------------
   Quiz night with the host's own questions. The host asks out loud, every
   phone is a buzzer, and the server keeps the order the presses arrived in -
   so "who was first" is never an argument. The host marks the answer right
   or wrong from their phone, or from the TV if the room is run from one.

   Nothing here is secret; the whole game is in state.shared:
     phase   armed (buzzers live) or locked (the host is reading)
     buzzes  who pressed, in the order they pressed: each with `at` (the press, on
             the server's clock: this phone sends it) and `arr` (when it arrived)
     scores  the running tally, and board the same sorted for the screen
     last    the last verdict, so everyone sees who got it and how
   ========================================================================= */

const BUZZER_PENALTY_KEY = 'ashryBuzzerPenalty';
/** The host's choice: does a wrong answer cost a point? Remembered on their phone. */
function buzzerPenalty() {
  try { return localStorage.getItem(BUZZER_PENALTY_KEY) === '1'; } catch (e) { return false; }
}
function setBuzzerPenalty(on) {
  try { localStorage.setItem(BUZZER_PENALTY_KEY, on ? '1' : '0'); } catch (e) {}
  const setup = document.getElementById('room-host-setup');
  if (setup) delete setup.dataset.sig;
  if (Room.state) routeRoomState(Room.state);
}

/* --- fair presses (the owner, 1 Oct 2026) ---------------------------------------------
   The line is by when each phone was pressed: the press sends its time on the server's
   clock (`at`), read from the middle of a timed round trip (Room.clockMid) - a phone that
   hasn't moved yet in this room times one first (`bzClock`, which changes nothing) - or,
   before that, from the smallest gap seen (roomServerNow). The server holds a claim
   between its arrival less 400 ms and its arrival, and lets a press go ahead of another
   only while that one is under BZ_SETTLE_MS old (rooms/RoomShared.js); until the first in line
   has settled, this phone says «ضغطت!» rather than a place that may still change. */
const bzLocal = { clockFor: '', settleTimer: null };

/** The server's time now, as fairly as this phone can tell it. */
function bzServerNow() {
  const mid = Room.clockMid;
  return mid === null || mid === undefined ? roomServerNow() : Date.now() - mid;
}

/** Times a round trip once per room, for a phone that hasn't made a move here yet. */
function bzTimeClock(state) {
  if (state.youAreScreen || Room.clockMid !== null || bzLocal.clockFor === state.code) return;
  bzLocal.clockFor = state.code;
  Room.act('bzClock', {}).catch(() => {});
}

/** Whether the first in line can no longer be passed; if not, a redraw when it can. */
function bzSettled(first) {
  if (!first || !first.arr) return true;
  const left = Number(first.arr) + BZ_SETTLE_MS - roomServerNow();
  if (left <= 0) return true;
  clearTimeout(bzLocal.settleTimer);
  bzLocal.settleTimer = setTimeout(() => {
    if (Room.state && Room.state.game === 'buzzer' && appState.currentView === 'room-buzzer') routeRoomState(Room.state);
  }, Math.min(1000, left + 30));
  return false;
}

ROOM_GAMES.buzzer = {
  lobbyOptions(state) {
    if (!state.youAreHost) return '';
    const t = TRANSLATIONS[appState.lang];
    return `
      <div class="card card--tight">
        <label class="switch-row" for="bz-penalty">
          <span class="field__label">${escapeHTML(t.bz_penalty || '')}</span>
          <span class="switch">
            <input type="checkbox" id="bz-penalty" role="switch" ${buzzerPenalty() ? 'checked' : ''} onchange="setBuzzerPenalty(this.checked)">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>
        <p class="field__hint" style="text-align:center">${escapeHTML(t.bz_lobby_hint || '')}</p>
        ${typeof packSourceFieldHtml === 'function' ? packSourceFieldHtml('buzzerRoom', t.qm_src_none_bz || '', '') : ''}
      </div>`;
  },

  // «اعمل مسابقتك»: a quiz the host reads out; the server deals it and keeps its answers.
  startPayload() {
    const quiz = typeof packRoomPick === 'function' ? packRoomPick('buzzerRoom') : '';
    return quiz ? { pack: quiz } : {};
  },

  render(state) {
    if (appState.currentView !== 'room-buzzer') setView('room-buzzer');
    const el = document.getElementById('view-room-buzzer');
    if (!el) return;

    const t = TRANSLATIONS[appState.lang];
    const s = state.shared || {};
    const buzzes = s.buzzes || [];
    const armed = s.phase === 'armed';
    const rank = buzzes.findIndex(b => b.id === Room.me);
    const first = buzzes[0];
    // Answered this question wrong: out until the next one (RoomGames.js, s.out).
    const out = (s.out || []).indexOf(Room.me) !== -1;
    bzTimeClock(state);
    // Pressed, but the line may still change for a moment: «ضغطت!», then the place.
    const settled = rank === -1 || bzSettled(first);

    const sig = ['bz', s.phase, s.round, buzzes.map(b => b.id).join(','), out, settled,
                 JSON.stringify(s.scores || {}), state.youAreHost, JSON.stringify(s.last || null), appState.lang,
                 JSON.stringify(s.quiz || null), JSON.stringify((state.you || {}).answer === undefined ? null : state.you.answer)].join('|');

    renderRoomFrame(el, sig, () => {
      const head = `
        <div class="play-head">
          <span class="badge">${escapeHTML(t.bz_question || '')} ${s.quiz ? ltrFrac(Math.min(s.quiz.n + 1, s.quiz.total), s.quiz.total) : `<span class="metric">${s.round || 1}</span>`}</span>
          <span class="badge ${armed ? 'badge--success' : ''}">${armed ? '🔔 ' + escapeHTML(t.bz_open || '') : '🔒 ' + escapeHTML(t.bz_locked || '')}</span>
        </div>`;

      let stage;
      if (!armed) {
        stage = `<div class="bz-stage"><div class="bz-locked"><span aria-hidden="true">🔒</span><p>${escapeHTML(t.bz_locked_hint || '')}</p></div></div>`;
      } else if (rank === -1 && out) {
        stage = `<div class="bz-stage"><div class="bz-locked"><span aria-hidden="true">❌</span><p>${escapeHTML(t.bz_out_question || '')}</p></div></div>`;
      } else if (rank === -1) {
        stage = `<div class="bz-stage">
          <button type="button" class="bz-button" id="bz-button" onclick="pressBuzzer(this, ${Number(s.round) || 1})" aria-label="${escapeHTML(t.bz_press || '')}">
            <span class="bz-button__icon" aria-hidden="true">🔔</span>
            <span class="bz-button__label">${escapeHTML(t.bz_press || '')}</span>
          </button></div>`;
      } else if (!settled) {
        stage = `<div class="bz-stage">
          <div class="bz-rank">
            <span class="bz-rank__medal" aria-hidden="true">🔔</span>
            <span class="bz-rank__n">${escapeHTML(t.bz_pressed || '')}</span>
            <p>${escapeHTML(t.bz_settling || '')}</p>
          </div></div>`;
      } else {
        const medal = ['🥇', '🥈', '🥉'][rank] || '🔔';
        stage = `<div class="bz-stage">
          <div class="bz-rank ${rank === 0 ? 'is-first' : ''}">
            <span class="bz-rank__medal" aria-hidden="true">${medal}</span>
            <span class="bz-rank__n">${escapeHTML(t.bz_you_are || '')} <b class="metric">${rank + 1}</b></span>
            <p>${escapeHTML(rank === 0 ? (t.bz_answer_now || '') : (t.bz_wait_turn || ''))}</p>
          </div></div>`;
      }

      const last = s.last
        ? `<div class="bz-last ${s.last.ok ? 'tx-success' : 'tx-danger'}">${s.last.ok ? '✅' : '❌'} ${escapeHTML(s.last.name)}</div>${bzUndoHtml(state, t)}`
        : '';

      // «ترتيب الضغط» as chips: the first to buzz lit and answering, the rest with how far behind.
      const order = `
        <div class="bz-order">
          <div class="eyebrow">${escapeHTML(t.bz_order || '')}</div>
          ${buzzes.length ? `<div class="talk-people">${buzzes.slice(0, 6).map((b, i) =>
              roomPersonChip(b.name, i === 0 ? `<span class="bz-order__tag">${escapeHTML(t.bz_answering || '')}</span>` : bzGapHtml(buzzes, i), i === 0 ? 'is-first' : '')).join('')}</div>`
          : `<div class="waiting-note">${escapeHTML(armed ? (t.bz_nobody || '') : (t.bz_locked_hint || ''))}</div>`}
        </div>`;

      // The host's bar: صح and غلط the main pair; a new question, the lock and another game
      // quiet under them. Resetting the scores sits by the scores it clears.
      const host = !state.youAreHost ? '' : `
        <div class="view-actions talk__actions bz-bar" role="group" aria-label="${escapeHTML(t.bz_host_controls || '')}">
          <div class="room-bar__pair">
            <button class="btn btn--success btn--lg" onclick="roomAct('correct', { id: '${jsStringAttr(first ? first.id : '')}' })" ${first ? '' : 'disabled'}>✓ ${escapeHTML(t.bz_correct || '')}</button>
            <button class="btn btn--danger btn--lg" onclick="roomAct('wrong', { id: '${jsStringAttr(first ? first.id : '')}', penalty: buzzerPenalty() })" ${first ? '' : 'disabled'}>✗ ${escapeHTML(t.bz_wrong || '')}${buzzerPenalty() ? ' (−1)' : ''}</button>
          </div>
          <div class="talk__pair">
            <button class="btn btn--ghost btn--sm" onclick="roomAct('reset')">🔄 ${escapeHTML(t.bz_reset || '')}</button>
            <button class="btn btn--ghost btn--sm" onclick="roomAct('${armed ? 'lock' : 'arm'}')">${armed ? '🔒 ' + escapeHTML(t.bz_lock_short || '') : '🔔 ' + escapeHTML(t.bz_arm_short || '')}</button>
            <button class="btn btn--ghost btn--sm" onclick="tvBackToHub()">${escapeHTML(t.room_another_game || '')}</button>
          </div>
        </div>`;
      const resetScores = !state.youAreHost ? '' : `<div class="bz-reset"><button class="btn btn--ghost btn--xs btn--auto" onclick="bzResetScores()">${escapeHTML(t.bz_reset_scores || '')}</button></div>`;

      return head + bzQuizHtml(state, t) + bzQuizHostHtml(state, t) + stage + last + order + bzBoardHtml(state, t) + resetScores + renderRoomPlayerStrip(state) + host;
    });
    refreshRoomPlayerStrip(el, state);
  }
};

/**
 * The standings. For the host (phone and TV) each row carries − / + (728 «عدّل النقط
 * بإيدك»: an argument an hour ago can still be put right), sent as `adjust { id, delta,
 * was }`; everyone else sees the plain board. Rows keep data-pid / data-score / data-count,
 * so animateScoreboards counts and slides them as on every board.
 */
function bzBoardHtml(state, t) {
  const s = state.shared || {};
  const board = s.board || [];
  if (!state.youAreHost || !board.length) return renderScoreboard(board);
  const btn = (p, d) => `<button type="button" class="btn btn--ghost btn--xs btn--auto bz-adj" onclick="bzAdjust('${jsStringAttr(p.id)}', ${d}, ${Number(p.score) || 0})" aria-label="${escapeHTML((d > 0 ? (t.bz_adj_plus || '') : (t.bz_adj_minus || '')).replace('{name}', p.name))}">${d > 0 ? '+' : '−'}</button>`;
  return `
    <div class="section scoreboard">
      <div class="section__head">
        <h2 class="section__title">${escapeHTML(t.scoreboard || '')}</h2>
        <span class="section__rule"></span>
      </div>
      <p class="field__hint">${escapeHTML(t.bz_adj_hint || '')}</p>
      ${board.map((p, i) => `
        <div class="status-row ${i === 0 && p.score > 0 ? 'status-row--turn' : ''}" data-pid="${escapeHTML(String(p.id || p.name))}" data-score="${Number(p.score) || 0}">
          <div class="status-row__body">
            <div class="status-row__name">${i === 0 && p.score > 0 ? '👑 ' : ''}${escapeHTML(p.name)}</div>
          </div>
          ${btn(p, -1)}
          <span class="badge badge--accent metric" data-count>${p.score}</span>
          ${btn(p, 1)}
        </div>`).join('')}
    </div>`;
}

function bzAdjust(id, delta, was) {
  haptic('light');
  roomAct('adjust', { id: id, delta: delta, was: was });
}

/** «تصفير النقاط» wipes the whole evening's tally: asked first (the phone and the TV). */
function bzResetScores() {
  const t = TRANSLATIONS[appState.lang] || {};
  showConfirmModal(t.bz_reset_confirm || '', () => roomAct('playAgain'));
}

/** «↶ رجّع» for the host: takes the last verdict back (RoomGames.js `undoVerdict`, named by its seq). */
function bzUndoHtml(state, t, tv) {
  const last = (state.shared || {}).last;
  if (!state.youAreHost || !last || !last.seq) return '';
  const call = `roomAct('undoVerdict', { seq: ${Number(last.seq) || 0} })`;
  return tv ? tvBtn('↶ ' + (t.bz_undo || ''), call, 'ghost')
    : `<div class="bz-reset"><button class="btn btn--ghost btn--xs btn--auto" onclick="${call}">↶ ${escapeHTML(t.bz_undo || '')}</button></div>`;
}

/* --- how close it was (ideas batch: rooms) -------------------------------------------
   Every press carries its time on the server's clock (buzzes[].at, the phone's claim
   held near its arrival by RoomGames.js), so the gap behind the first press is the
   gap between the presses:
   «+0.18ث» beside each press after the first, and on the TV a photo-finish strip. */
function bzGapMs(buzzes, i) {
  const a = buzzes[0] && Number(buzzes[0].at), b = buzzes[i] && Number(buzzes[i].at);
  return a && b ? Math.max(0, b - a) : null;
}

/** «+0.18 ث»: the number held left to right, the unit after it in the line's own direction. */
function bzGapText(ms) {
  const t = TRANSLATIONS[appState.lang] || {};
  const unit = t.bz_secs_short || 's';
  return `<bdi dir="ltr">+${(ms / 1000).toFixed(2)}</bdi>${appState.lang === 'ar' ? '&nbsp;' : ''}${escapeHTML(unit)}`;
}

function bzGapHtml(buzzes, i) {
  const ms = bzGapMs(buzzes, i);
  return ms === null ? '' : `<span class="badge bz-gap">${bzGapText(ms)}</span>`;
}

/** The TV's photo finish: the first press at the line, the rest behind it by their gap. */
function bzFinishHtml(buzzes) {
  if (!buzzes.length || !buzzes[0].at) return '';
  const shown = buzzes.slice(0, 6);
  const span = Math.max(400, ...shown.map((b, i) => bzGapMs(buzzes, i) || 0));
  const marks = shown.map((b, i) => {
    const ms = bzGapMs(buzzes, i) || 0;
    const x = 4 + (ms / span) * 88;
    return `<div class="bz-finish__mark ${i === 0 ? 'is-first' : ''} bz-finish__mark--${i % 2 ? 'low' : 'high'}" style="left:${x.toFixed(1)}%">
        <span class="bz-finish__dot"></span>
        <span class="bz-finish__tag" dir="${appState.lang === 'ar' ? 'rtl' : 'ltr'}"><bdi>${escapeHTML(b.name)}</bdi>${i ? ` <small>${bzGapText(ms)}</small>` : ''}</span>
      </div>`;
  }).join('');
  return `<div class="bz-finish" dir="ltr" aria-hidden="true"><div class="bz-finish__line"></div><div class="bz-finish__track"></div>${marks}</div>`;
}

/** The press has to feel instant: the button locks before the server answers. */
function pressBuzzer(btn, round) {
  // The press time first, before anything else this tap does.
  const at = Math.round(bzServerNow());
  if (btn) {
    btn.classList.add('is-pressed');
    btn.disabled = true;
    const label = btn.querySelector('.bz-button__label');
    const t = TRANSLATIONS[appState.lang] || {};
    if (label && t.bz_pressed) label.textContent = t.bz_pressed;
  }
  haptic('heavy');
  // A ring off the button, so the press reads across the table. Removed by a
  // timer, because a suppressed animation fires no animationend at all.
  if (btn && typeof motionOff === 'function' && !motionOff()) {
    const ring = document.createElement('span');
    ring.className = 'bz-ring';
    btn.appendChild(ring);
    setTimeout(() => { if (ring.isConnected) ring.remove(); }, 700);
  }
  // The question it was pressed for: a late press can't lead the next one.
  // And when it was pressed: the line is by that, not by arrival.
  roomAct('buzz', round ? { round: round, at: at } : { at: at });
}

/* --- «اعمل مسابقتك» on the buzzer (30 Sep 2026) ----------------------------------------
   The family's quiz, read out by the host: every phone and the TV see the question
   and its four answers; the right one is on the host's phone only (state.you.answer,
   from the server) until someone gets it or the host shows it (shared.quiz.answer).
   «السؤال التالي» deals the next; after the last, «خلصت الأسئلة». */
function bzQuizHtml(state, t) {
  const q = (state.shared || {}).quiz;
  if (!q) return '';
  if (q.done) return `<div class="card card--tight bz-quiz"><div class="bz-quiz__q">${escapeHTML((t.bz_quiz_done || '').replace('{t}', q.title || ''))}</div></div>`;
  const letters = String(t.qm_letters || 'ABCD').split('');
  const shown = typeof q.answer === 'number' ? q.answer : null;
  const mine = state.you && typeof state.you.answer === 'number' ? state.you.answer : null;
  const right = shown !== null ? shown : mine;
  const key = ['bzq', roomDealKey(state), q.n, shown].join('|');
  const fresh = shown !== null && typeof motionFirst === 'function' && !motionOff() && motionFirst(key);
  return `
    <div class="card card--tight bz-quiz">
      <div class="eyebrow">${escapeHTML((q.emoji || '✍️') + ' ' + (q.title || ''))}</div>
      <div class="bz-quiz__q">${escapeHTML(q.q || '')}</div>
      <div class="bz-quiz__grid">
        ${(q.choices || []).map((c, i) => `<div class="bz-quiz__ch ${i === right ? 'is-right' : (shown !== null ? 'is-dim' : '')}${i === shown && fresh ? ' is-revealed' : ''}"><b>${escapeHTML(letters[i] || '')}</b><span>${escapeHTML(c)}</span></div>`).join('')}
      </div>
      ${mine !== null && shown === null ? `<p class="bz-quiz__note">🔒 ${escapeHTML(t.bz_quiz_host_only || '')}</p>` : ''}
    </div>`;
}

/** The host's quiz buttons: show the answer, then the next question. */
function bzQuizHostHtml(state, t) {
  const q = (state.shared || {}).quiz;
  if (!q || !state.youAreHost) return '';
  if (q.done) return `<div class="btn-row" style="margin-bottom: var(--sp-2)"><button class="btn btn--primary" onclick="roomAct('playAgain')">↺ ${escapeHTML(t.bz_quiz_again || '')}</button></div>`;
  const shown = typeof q.answer === 'number';
  return `<div class="btn-row" style="margin-bottom: var(--sp-2)">
      ${shown ? '' : `<button class="btn btn--secondary" onclick="roomAct('quizReveal', { n: ${q.n} })">${escapeHTML(t.bz_quiz_reveal || '')}</button>`}
      <button class="btn ${shown ? 'btn--primary' : 'btn--ghost'}" onclick="roomAct('quizNext', { n: ${q.n} })">${escapeHTML(t.bz_quiz_next || '')}</button>
    </div>`;
}
</script>
