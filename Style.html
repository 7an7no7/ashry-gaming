/* --- Codenames ------------------------------------------------------------ */
.cn-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-inline: 4px;
}
.cn-dot--red  { background: #e11d48; }
.cn-dot--blue { background: #2563eb; }

.cn-score {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: var(--sp-2);
  background: var(--surface-solid);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.cn-score__side { display: inline-flex; align-items: center; opacity: 0.5; transition: opacity var(--dur-2) var(--ease-out); }
.cn-score__side.is-turn { opacity: 1; }
.cn-score__side--red  { color: #e11d48; }
.cn-score__side--blue { color: #2563eb; }
.cn-score__role { font-size: var(--fs-xs); font-weight: 800; color: var(--text-2); }

.cn-banner {
  padding: var(--sp-3);
  margin-bottom: var(--sp-3);
  border-radius: var(--r-md);
  text-align: center;
  border: 1px solid var(--border);
}
.cn-banner--red  { background: rgba(225, 29, 72, 0.12);  border-color: rgba(225, 29, 72, 0.35); }
.cn-banner--blue { background: rgba(37, 99, 235, 0.12);  border-color: rgba(37, 99, 235, 0.35); }
.cn-banner__title { font-size: var(--fs-h2); font-weight: 900; color: var(--text-strong); overflow-wrap: anywhere; }
.cn-banner__sub { font-size: var(--fs-xs); font-weight: 700; color: var(--text-2); margin-top: 2px; }

/* 5 columns have to fit a 320px screen, so the cards scale with the viewport
   and the words shrink rather than overflow. */
.cn-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  margin-bottom: var(--sp-4);
}
.cn-card {
  aspect-ratio: 3 / 4;
  min-width: 0;
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--border);
  border-radius: var(--r-xs);
  background: var(--surface-solid);
  font-family: var(--font);
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.cn-card:not(:disabled):active { transform: scale(0.94); }
.cn-card:disabled { cursor: default; }
.cn-card__word {
  /* 2.4vw bottomed out at 9px on a phone, which is the smallest type in the
     app by a wide margin and the one people squint at longest. */
  font-size: clamp(0.68rem, 3.1vw, 0.9rem);
  font-weight: 800;
  line-height: 1.1;
  text-align: center;
  color: var(--text-strong);
  overflow-wrap: anywhere;
  hyphens: auto;
}

/* What only the spymaster sees: a tint hinting at the key. */
.cn-card--peek { border-width: 2px; }
.cn-peek--red      { border-color: #e11d48; background: rgba(225, 29, 72, 0.10); }
.cn-peek--blue     { border-color: #2563eb; background: rgba(37, 99, 235, 0.10); }
.cn-peek--neutral  { border-color: var(--n-500); background: rgba(148, 163, 184, 0.14); }
.cn-peek--assassin { border-color: var(--n-900); background: rgba(15, 23, 42, 0.75); }
.cn-peek--assassin .cn-card__word { color: #fff; }

/* Revealed cards are the same for everyone. */
.cn-card--revealed .cn-card__word { color: #fff; }
.cn-card--red      { background: #e11d48; border-color: #e11d48; }
.cn-card--blue     { background: #2563eb; border-color: #2563eb; }
/* n-400 put white text at 2.1:1; n-500 still reads as the inert card. */
.cn-card--neutral  { background: var(--n-500); border-color: var(--n-500); }
.cn-card--assassin { background: var(--n-950); border-color: var(--n-950); }

.cn-team { padding: var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); }
.cn-team__head { display: flex; align-items: center; gap: var(--sp-1); font-weight: 900; margin-bottom: var(--sp-2); }
.cn-team--red  { box-shadow: inset 3px 0 0 #e11d48; }
.cn-team--blue { box-shadow: inset 3px 0 0 #2563eb; }
[dir="rtl"] .cn-team--red  { box-shadow: inset -3px 0 0 #e11d48; }
[dir="rtl"] .cn-team--blue { box-shadow: inset -3px 0 0 #2563eb; }

/* --- Prompts & ballots (voting games) ------------------------------------ */
.prompt-text {
  font-size: 1.35rem;
  font-weight: 900;
  line-height: 1.35;
  color: var(--text-strong);
  overflow-wrap: anywhere;
  text-wrap: balance;
}

.ballot-option {
  width: 100%;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-h3);
  font-weight: 800;
  text-align: start;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
.ballot-option:active:not(:disabled) { transform: scale(0.98); border-color: var(--accent); }
.ballot-option.is-own { opacity: 0.5; cursor: default; }
.ballot-option__label { flex: 1; overflow-wrap: anywhere; }

.vote-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-2);
}

/* --- Result bars --------------------------------------------------------- */
.result-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.result-row {
  position: relative;
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  overflow: hidden;
}
.result-row.is-top { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
/* The bar sits behind the text rather than beside it, so a long option still
   gets the full width to wrap into. */
.result-row__bar {
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  background: var(--accent-soft);
  transition: width var(--dur-3) var(--ease-out);
}
.result-row__body {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-weight: 800;
  color: var(--text-strong);
}
.result-row__label { flex: 1; overflow-wrap: anywhere; }
.result-row__count { font-variant-numeric: tabular-nums; color: var(--accent-ink); }
.result-row__voters {
  position: relative;
  margin-top: 2px;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--text-2);
}

/* --- Draw & Guess -------------------------------------------------------- */
.draw-wrap {
  width: 100%;
  aspect-ratio: 1;
  /* Square, but never so tall that the toolbar drops off the screen — the
     drawer needs the canvas and the tools at the same time, and you cannot
     scroll while you are drawing. What is subtracted is the score row, the
     word card and the three toolbar rows; the guess list below may scroll.
     Measured on a 375x667 phone, which is the one this has to fit. */
  max-height: calc(100dvh - 460px);
  max-width: calc(100dvh - 460px);
  margin-inline: auto;
  margin-bottom: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: #fff;
  box-shadow: var(--sh-2);
}
#draw-canvas {
  display: block;
  width: 100%;
  height: 100%;
  /* The canvas has to own the gesture or the page scrolls while you draw. */
  touch-action: none;
  cursor: crosshair;
}

/* Three rows: what you draw with, what colour, how thick. Every control is a
   single glyph, so they get an explicit floor rather than letting the text
   decide how tappable they are. */
.draw-tools {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}
.draw-tools__row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
/* Twelve colours will not fit a phone in one row, and wrapping them costs a
   whole row of height that the canvas needs more. They scroll instead. */
.draw-tools__row--scroll {
  flex-wrap: nowrap;
  justify-content: flex-start;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 2px;
  margin: -2px;
}
.draw-tools__row--scroll::-webkit-scrollbar { display: none; }
.draw-tools .btn { min-width: 44px; min-height: 44px; }

.draw-tool {
  flex: none;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  color: var(--text);
  font-family: var(--font);
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out),
              background-color var(--dur-2) var(--ease-out),
              border-color var(--dur-2) var(--ease-out);
}
.draw-tool:active { transform: scale(0.92); }
.draw-tool.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
}
.draw-tool--act { color: var(--accent-ink); border-color: var(--accent-border); }
.draw-tool--danger { color: var(--danger-ink); border-color: var(--danger); background: var(--danger-soft); }

/* Thickness, shown as the dot it will draw. */
.draw-width {
  flex: none;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
.draw-width:active { transform: scale(0.92); }
.draw-width.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.draw-width__dot { display: block; border-radius: 50%; background: var(--text-strong); }
/* Pushes undo and clear away from the thickness buttons they share a row with. */
.draw-tools__gap { width: var(--sp-3); }
.draw-swatch {
  width: 44px; height: 44px;
  flex: none;
  border-radius: 50%;
  border: 2px solid var(--border);
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.draw-swatch.is-active { border-color: var(--text-strong); transform: scale(1.15); }
/* White-on-white would be an invisible button. */
.draw-swatch[aria-label="#ffffff"] { border-color: var(--border-strong); }

.draw-guesses { display: flex; flex-direction: column; gap: 4px; margin-top: var(--sp-2); }
.draw-guess {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  font-size: var(--fs-sm);
  font-weight: 700;
}
.draw-guess.is-right { background: var(--success-soft); color: var(--success-ink); }
.draw-guess__who { font-weight: 900; color: var(--text-2); }

/* --- Connections --------------------------------------------------------- */
.connect-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}
.connect-tile {
  aspect-ratio: 1;
  min-width: 0;
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface-solid);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: clamp(0.55rem, 2.6vw, 0.8rem);
  font-weight: 800;
  line-height: 1.1;
  text-align: center;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.connect-tile:active { transform: scale(0.94); }
.connect-tile.is-selected {
  background: var(--accent);
  color: var(--accent-on);
  border-color: var(--accent);
}

/* Solved groups keep a fixed colour each so the board reads at a glance. */
.connect-group {
  padding: var(--sp-3);
  margin-bottom: 6px;
  border-radius: var(--r-sm);
  text-align: center;
  color: #1a1205;
}
.connect-group--0 { background: #fde68a; }
.connect-group--1 { background: #a7f3d0; }
.connect-group--2 { background: #bfdbfe; }
.connect-group--3 { background: #ddd6fe; }
.connect-group--4 { background: #fbcfe8; }
.connect-group__name { font-weight: 900; font-size: var(--fs-sm); }
.connect-group__words { font-size: var(--fs-xs); font-weight: 700; opacity: 0.8; }

.connect-lives {
  text-align: center;
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text-2);
  letter-spacing: 0.15em;
}

/* --- Pass-the-phone reveal card ----------------------------------------
   Deliberately a bright card with near-black text in both themes: it is held
   up for another player to read across a table, so it stays high-contrast
   rather than following the app theme. */
.reveal-card {
  margin: 0 var(--sp-2) var(--sp-6);
  padding: var(--sp-7) var(--sp-5);
  background: #ffffff;
  border: 3px solid var(--accent);
  border-radius: var(--r-2xl);
  box-shadow: var(--sh-3);
}
.reveal-card__word {
  font-size: 2.5rem;
  font-weight: 900;
  line-height: 1.15;
  color: #0b1220;
  overflow-wrap: anywhere;
}

/* --- Dice faces --------------------------------------------------------- */
.dice-face {
  font-size: 3.5rem;
  font-weight: 900;
  line-height: 1;
  color: #0b1220;   /* the die itself is white in both themes */
}
.dice-face--emoji { font-size: 2.75rem; }
.dice-placeholder { font-size: 3.5rem; opacity: 0.2; }

.mix-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
}
.mix-item label { font-size: var(--fs-sm); font-weight: 800; color: var(--text); cursor: pointer; }

/* Monkey countdown — was referenced in the markup but never defined. */
.timer-display {
  font-size: 3rem;
  font-weight: 900;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--accent-ink);
  cursor: pointer;
  transition: color var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.timer-display:active { transform: scale(0.94); }
.timer-display.is-urgent { color: var(--danger); animation: urgentPulse 1s var(--ease-in-out) infinite; }
@keyframes urgentPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* Player list labels inside setup screens */
[id$="-player-list"] label { color: var(--text); }
[id$="-player-list"] label span { color: var(--text-strong); }

/* ==========================================================================
   10. ACCESSIBILITY
   ========================================================================== */

/* --- Arabic typography ----------------------------------------------------
   Arabic letters join, and letter-spacing pulls those joins apart — the small
   uppercase labels in the design system would render as disconnected glyphs.
   text-transform is a no-op in Arabic anyway, so both are dropped and the
   labels lean on weight and colour instead. Kept for Latin, where the wide
   small-caps look is doing real work.
   -------------------------------------------------------------------------- */
html[lang="ar"] .section__title,
html[lang="ar"] .field__label,
html[lang="ar"] .stat__label {
  letter-spacing: normal;
  text-transform: none;
  font-size: var(--fs-sm);
}

/* Arabic numerals in a Latin-numeral context still need to run LTR. */
.metric, .stepper__value, [class*="tabular"] { direction: ltr; unicode-bidi: isolate; }

/* .metric also renders Arabic words (the Just One / Fibbage answers), and its
   tightened tracking pulls the letter joins apart. Numbers keep it. */
html[lang="ar"] .metric, html[lang="ar"] .connect-lives { letter-spacing: normal; }

/* --- Semantic text colour ------------------------------------------------
   For markup built in JS, where a fixed palette class (text-green-600,
   text-slate-400) cannot follow the theme. These resolve through the same
   tokens as the rest of the design system, so they stay legible in both.
   -------------------------------------------------------------------------- */
.tx-success { color: var(--success-ink); }
.tx-danger  { color: var(--danger-ink); }
.tx-warning { color: var(--warning-ink); }
.tx-accent  { color: var(--accent-ink); }
.tx-muted   { color: var(--text-2); }
.tx-strong  { color: var(--text-strong); }

/* Soft tinted plates that go with them. */
.plate-danger  { background: var(--danger-soft);  color: var(--danger-ink);  border: 1px solid var(--danger); }
.plate-success { background: var(--success-soft); color: var(--success-ink); border: 1px solid var(--success); }

/* Keyboard focus stays visible; pointer presses don't draw a ring. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}
:focus:not(:focus-visible) { outline: none; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: reduce) {
  body::after { animation: none; opacity: 0; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .wheel { transition-duration: 0.01ms !important; }

  /* Not 0.01ms — none. An animation that short never fires animationstart or
     animationend, so the JS that strips .view-enter afterwards never runs and
     the fill-mode leaves the view transformed: shifted 26px, scaled to 0.985,
     and acting as the containing block for its position:fixed children. With
     no animation there is no keyframe to leave behind. */
  .view-enter, .view-stagger > *, .animate-pop, .animate-fade-in {
    animation: none !important;
  }
  .active-room-banner, .arb__pulse { animation: none !important; }
}

/* --- Fake Artist ---------------------------------------------------------- */
/* No toolbar to fit, so the canvas can take more of the screen than Draw &
   Guess gives it. */
.fa-wrap {
  max-height: calc(100dvh - 360px);
  max-width: calc(100dvh - 360px);
  min-height: 220px;
  min-width: 220px;
}
#fa-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.fa-dot {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
  vertical-align: middle;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
}
.fa-legend { justify-content: center; margin-bottom: var(--sp-3); }
.fa-legend .chip { height: 32px; padding-inline: var(--sp-2); }
.fa-legend .chip.is-turn { box-shadow: 0 0 0 2px var(--accent); }

/* --- Wavelength ----------------------------------------------------------- */
.wl-spectrum { margin-top: var(--sp-3); }
.wl-labels { display: flex; justify-content: space-between; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.wl-label {
  max-width: 48%;
  padding: 4px var(--sp-2);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-strong);
  font-size: var(--fs-sm);
  font-weight: 800;
  overflow-wrap: anywhere;
}
.wl-labels .wl-label:last-child { text-align: right; }
.wl-bar {
  position: relative;
  height: 56px;
  border-radius: var(--r-md);
  overflow: hidden;
  background: linear-gradient(90deg, #38bdf8, #a78bfa 50%, #fb7185);
  box-shadow: var(--sh-inset);
}
.wl-zone { position: absolute; top: 0; bottom: 0; }
.wl-zone--2 { background: rgba(255, 255, 255, 0.35); }
.wl-zone--3 { background: rgba(255, 255, 255, 0.6); }
.wl-zone--4 { background: rgba(255, 255, 255, 0.92); }
.wl-target { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #111827; }
.wl-needle {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 4px;
  margin-left: -2px;
  border-radius: 2px;
  background: #111827;
  box-shadow: 0 0 0 2px #ffffff;
  transition: left var(--dur-2) var(--ease-out);
}
/* Its own look: the app's text-field rules otherwise turn the range into an
   empty input box with a dot in it. */
.wl-spectrum input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 44px;
  min-height: 0;
  margin: var(--sp-2) 0 0;
  padding: 0;
  background: transparent;
  border: 0;
  box-shadow: none;
  touch-action: pan-y;
}
.wl-spectrum input[type="range"]::-webkit-slider-runnable-track {
  height: 10px;
  border-radius: var(--r-full);
  background: var(--surface-3);
}
.wl-spectrum input[type="range"]::-moz-range-track {
  height: 10px;
  border-radius: var(--r-full);
  background: var(--surface-3);
}
.wl-spectrum input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 30px;
  height: 30px;
  margin-top: -10px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #ffffff;
  box-shadow: var(--sh-2);
}
.wl-spectrum input[type="range"]::-moz-range-thumb {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #ffffff;
  box-shadow: var(--sh-2);
}

/* --- Trivia ----------------------------------------------------------------- */
.trivia-choice { justify-content: flex-start; }
.trivia-letter {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-strong);
  font-weight: 900;
}
.trivia-choice.is-picked { border-color: var(--accent); background: var(--accent-soft); }
.trivia-choice.is-picked .trivia-letter { background: var(--accent); color: var(--accent-on); }
.trivia-choice:disabled:not(.is-picked) { opacity: 0.55; }
.trivia-result.is-correct { border-color: var(--success); box-shadow: 0 0 0 1px var(--success); }
.trivia-result.is-correct .result-row__bar { background: var(--success-soft); }
.trivia-result.is-wrong { border-color: var(--danger); }

/* --- دوري المعرفة (the team trivia board) ------------------------------- */
.tb-team-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.tb-input--a { border-color: var(--danger); }
.tb-input--b { border-color: #2563eb; }
.tb-scores {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: var(--sp-2);
  align-items: stretch;
  margin-bottom: var(--sp-3);
}
.tb-scores--final { margin: var(--sp-4) 0; }
.tb-team {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-1);
  min-width: 0;
  padding: var(--sp-2);
  border: 2px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
}
.tb-team--a { border-color: var(--danger); }
.tb-team--b { border-color: #2563eb; }
.tb-team__name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-xs); font-weight: 800; color: var(--text-2); }
.tb-team__score { font-size: 1.5rem; font-weight: 900; line-height: 1.1; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.tb-team__adjust { display: flex; gap: var(--sp-1); }
.tb-team__adjust .iconbtn { width: 40px; height: 40px; }
.tb-round { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-inline: var(--sp-1); }
.tb-round .eyebrow { margin: 0; }
.tb-round__value { font-size: var(--fs-h3); font-weight: 900; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.tb-board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.tb-cat {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 56px;
  padding: 4px 2px;
  border-radius: var(--r-sm);
  background: var(--accent);
  color: var(--accent-on);
  font-size: 0.68rem;
  font-weight: 900;
  line-height: 1.15;
  text-align: center;
  overflow-wrap: anywhere;
}
.tb-cat__icon { font-size: 1rem; line-height: 1; }
.tb-cell {
  min-height: 52px;
  border: 1px solid var(--accent-border);
  border-radius: var(--r-sm);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--font);
  font-size: 1rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: transform var(--dur-1) var(--ease-out);
}
.tb-cell:active { transform: scale(0.94); }
.tb-cell.is-done { background: var(--surface-3); border-color: var(--border); cursor: default; }
.tb-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
.tb-dot--a { background: var(--danger); }
.tb-dot--b { background: #2563eb; }
.tb-dot--none { background: var(--border-strong); }
.tb-actions { margin-top: var(--sp-4); }
.tb-q-meta { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); }
.tb-q-meta .eyebrow { margin: 0; }
.tb-answer { padding: var(--sp-4); border: 1px solid var(--accent-border); border-radius: var(--r-lg); background: var(--accent-soft); }
.tb-award { color: #fff; }
.tb-award--a { background: var(--danger-btn); color: var(--danger-on); }
/* A fixed blue: the theme's lighter dark-mode blue is too pale for white text. */
.tb-award--b { background: #2563eb; }

/* The question's countdown. Tapping it pauses: somebody always needs the
   question read again. */
.tb-timer {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-md);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-family: var(--font);
  font-weight: 800;
  cursor: pointer;
  transition: background-color var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out);
}
