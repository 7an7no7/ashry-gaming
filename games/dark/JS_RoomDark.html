   placed from the level's clock (shared.t0 and the server's time), so every
   screen draws it the same without being told (Dark.js, darkDynAt).

const DK_LENS = ['#ffd54a', '#7cd3ff', '#ff8fb8', '#8ef0a0', '#c9a0ff', '#ffb070', '#6ee7e7'];

function dkMapOf(state) {
  const g = (state.you && state.you.g) || (state.screen && state.screen.g);

/** Where the mover is now: the joystick's last push walked on a little, as the server will. */
function dkMoverPos(state, m) {
  const s = state.shared || {};

/** How far the moving trap wakes the sleeper: 0 asleep, 1 up. */
function dkWake(m, pos, s) {

/** A piece of furniture, drawn with its back to the top of its own frame and turned into place. */

  const resting = role !== 'screen' && Date.now() - dk.touchAt > DK_REST_AFTER && !moving;
  const gap = resting ? 166 : 33;
  if (ts - dk.lastFrame >= gap - 2) {
    dk.lastFrame = ts;
    try {
      if (role === 'screen') dkTvDraw(st);
      else {
        const cv = document.querySelector('#view-room-darkroom [data-dk-canvas]');
        if (cv && cv.isConnected) { if (role === 'mover') dkDrawMover(cv, st); else if (role === 'guide') dkDrawGuide(cv, st); }
        if (role === 'guide' && dk.mine && Date.now() - dk.beatAt > 2500) dkSendLens(true);
        if (role === 'mover' && dk.stick.on) dkStickSend(false);
        dkPaintIntro(document.getElementById('view-room-darkroom'), st);
      }
      dkDizzyPaint(document.getElementById(role === 'screen' ? 'view-room-tv' : 'view-room-darkroom'), st);
    } catch (e) { /* a frame that fails is skipped */ }
  }
  if (resting) { dk.loop = -1; dk.sleepTimer = setTimeout(() => { dk.sleepTimer = null; dk.loop = requestAnimationFrame(dkFrame); }, gap); }
  else dk.loop = requestAnimationFrame(dkFrame);
}
document.addEventListener('pointerdown', () => { if (Room.state && Room.state.game === 'darkroom') { dk.touchAt = Date.now(); if (dk.sleepTimer) dkKick(); } }, true);

ROOM_GAMES.darkroom = {
  lateJoin: true,
  lobbyOptions(state) { return dkLobbyHtml(state); },

/** The level's first seconds on the phone: who walks, and a count to go. */
function dkPaintIntro(el, state) {
  if (!el) return;
  const box = el.querySelector('[data-dk-intro]');
  if (!box) return;
  const s = state.shared || {};
  const left = (s.t0 || 0) - dkNow();
  const txt = s.phase === 'play' && left > 0 ? (left > 900 ? dkT('dk_ready_n', { n: Math.ceil(left / 1000) }) : dkT('dk_go')) : '';
  if (box.textContent !== txt) box.textContent = txt;
  box.classList.toggle('is-on', !!txt);
}

/** The hearts in place; the events (bumps, traps, the win, the near misses) played once. */
function dkAfter(state, el) {
  const s = state.shared || {};
  const role = dkRole(state);
  dkBannerPaint(el, false);
  const hearts = el.querySelectorAll('[data-dk-hearts]');
  hearts.forEach(h => {
    const was = Number(h.dataset.dkHearts);
    if (was !== s.hearts) {
      h.outerHTML = dkHeartsHtml(s.hearts || 0);
      if (s.hearts < was && !motionOff()) {
        const nh = el.querySelectorAll('.dk-hearts svg')[s.hearts];
        if (nh && nh.animate) nh.animate([{ transform: 'scale(1.9) rotate(-18deg)', color: '#ff4d6d' }, { transform: 'scale(.6)' }, { transform: 'none' }], { duration: 800, easing: 'ease-out' });
      }
    }
  });
  dkMicPaint(el, state);
  dkDizzyPaint(el, state);
  const lk = dkLevelKey(state);
  const voice = dkVoice(state);
  // The public events: first sight of a deal (a reload, joining late) plays nothing.
  const evs = s.ev || [];
  const last = evs.length ? evs[evs.length - 1].n : 0;
  const dealKey = roomDealKey(state);
  if (dk.ev[dealKey] === undefined) dk.ev[dealKey] = last;
  evs.filter(e => e.n > dk.ev[dealKey]).forEach(e => dkOnEvent(state, el, e, role, voice));
  dk.ev[dealKey] = Math.max(dk.ev[dealKey], last);
  // The near misses, for the guides (and the TV): where a trap is right beside the mover.
  const pev = (state.you && state.you.pev) || (state.screen && state.screen.pev) || [];
  const plast = pev.length ? pev[pev.length - 1].n : 0;
  if (dk.pev[lk] === undefined) dk.pev[lk] = plast;
  // «دايخ!»: told to the guides and the TV, never the mover.
  pev.filter(e => e.n > dk.pev[lk] && e.type === 'dizzy').forEach(e => {
    if (role === 'guide' || role === 'screen') dkBanner(el, dkT('dk_dizzy_now', { name: dkIso(dkName(state, s.moverId)) }), 'bad');
    if (role === 'guide') haptic('medium');
    if (voice) dkSound('dizzy');
  });
  pev.filter(e => e.n > dk.pev[lk] && e.type === 'near').forEach(e => {
    dk.nearAt = Date.now(); dk.nearN = e.n;
    if (role === 'guide') { dkToast(el, dkT(e.k === 'sleeper' ? (s.story === 'tomb' ? 'dk_near_sarco' : 'dk_near_grandpa') : 'dk_near', { trap: dkT('dk_tn_' + e.k) })); haptic('light'); }
    if (voice) dkSound(e.k === 'sleeper' ? 'stir' : 'near');
  });
  dk.pev[lk] = Math.max(dk.pev[lk], plast);
  if (s.phase === 'gameover' && dkOnce('over|' + dealKey)) {
    if (voice) dkSound('over');
    el.querySelectorAll('[data-dk-count]').forEach(b => { if (typeof countUp === 'function' && !motionOff()) countUp(b, 0, Number(b.dataset.dkCount) || 0); });
  }
}
function dkOnEvent(state, el, e, role, voice) {
  const s = state.shared || {};
  const tomb = s.story === 'tomb';
  if (e.type === 'bump') {
    // The bump names the arrow pressed (the mover's echo keeps it); while dizzy the kid walked the
    // other way, so the TV and the guides wobble toward the wall really hit (audit 7 Oct 2026, K1).
    dk.bumpAt = Date.now(); dk.bumpDir = (role !== 'mover' && s.face) || e.d || '';
    if (role === 'mover') {
      dkFeedback(el, dkT('dk_bump', { obj: dkT('dk_obj_' + e.k) }), true);
      dkSound('bump'); haptic('medium');
    } else if (voice) dkSound('bumpSoft');
  } else if (e.type === 'trap') {
    dk.trapAt = Date.now();
    const line = dkT('dk_trap_' + e.k);
    if (role === 'mover') { dkFeedback(el, line, true); haptic('heavy'); dkSound('trap_' + e.k); }
    else { dkBanner(el, line, 'bad'); if (voice) dkSound('trap_' + e.k); }
    if (voice || role !== 'mover') setTimeout(() => { if (voice) dkSound('heart'); }, 700);
  } else if (e.type === 'back') {
    if (role === 'mover') dkFeedback(el, dkT('dk_back_start'), false);
    else dkToast(el, dkT('dk_back_start_g'));
  } else if (e.type === 'won') {
    dk.wonAt = Date.now();
    const line = dkT(tomb ? 'dk_won_tomb' : 'dk_won_home');
    if (role === 'mover') { dkFeedback(el, line, false); haptic('double'); }
    else dkBanner(el, line, 'good');
    if (voice) dkSound('win');
    if (typeof confetti === 'function' && !motionOff() && (role === 'screen' || role === 'mover' || !dkHasTv(state))) setTimeout(() => confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }), 250);
  } else if (e.type === 'level') {
    const who = dkIso(dkName(state, s.moverId));
    if (!e.first) {
      if (role === 'mover') { dkFeedback(el, dkT('dk_your_turn'), false); haptic('double'); }
      else dkBanner(el, dkT('dk_next_level', { n: e.lv, name: who }), 'info');
    }
    if (voice) dkSound('level');
  } else if (e.type === 'mic') {
    if (e.to === Room.me) { dkToast(el, dkT('dk_mic_your_turn')); haptic('double'); }
    if (voice) dkSound('mic');
    const strip = el.querySelector('[data-dk-mic]');
    if (strip && !motionOff() && strip.animate) strip.animate([{ transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 320, easing: 'ease-out' });
  } else if (e.type === 'mover') {
    if (role === 'mover') { dkFeedback(el, dkT('dk_your_turn'), false); haptic('double'); }
    else dkToast(el, dkT('dk_new_mover', { name: dkIso(dkName(state, s.moverId)) }));
  }
}
function dkFeedback(el, text, shake) {
  const fb = el.querySelector('[data-dk-fb]');
  if (!fb) return;
  fb.textContent = text;
  fb.classList.remove('is-on'); void fb.offsetWidth; fb.classList.add('is-on');
  clearTimeout(dk.fbTimer);
  dk.fbTimer = setTimeout(() => fb.classList.remove('is-on'), 1500);
  if (shake && !motionOff()) {
    const sn = el.querySelector('.dk-sonar');
    if (sn && sn.animate) sn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-4px)' }, { transform: 'none' }], { duration: 340 });
  }
}
function dkToast(el, text) {
  const box = el.querySelector('[data-dk-toast]');
  if (!box) return;
  box.textContent = text;
  box.classList.add('is-on');
  clearTimeout(dk.toastTimer);
  dk.toastTimer = setTimeout(() => box.classList.remove('is-on'), 1700);
}
// The banner is remembered with its end, so a frame rebuilt while it shows (the next state of the same
// move often is one) draws it again instead of losing it.
function dkBanner(el, text, kind) {
  dk.banner = { text, kind: kind || 'info', until: Date.now() + 2200 };
  dkBannerPaint(el, true);
}
function dkBannerPaint(el, fresh) {
  const bn = dk.banner;
  if (!bn || Date.now() >= bn.until) return;
  let b = el.querySelector('[data-dk-banner]');
  if (!b) { const box = el.querySelector('[data-dk-map], [data-dk-tv-stage]'); if (!box) return; b = document.createElement('div'); b.className = 'dk-banner'; b.dataset.dkBanner = ''; box.appendChild(b); if (!fresh) b.style.transition = 'none'; }
  b.textContent = bn.text;
  b.className = 'dk-banner is-on dk-banner--' + bn.kind;
  clearTimeout(dk.bannerTimer);
  dk.bannerTimer = setTimeout(() => { b.style.transition = ''; b.classList.remove('is-on'); }, Math.max(0, bn.until - Date.now()));
}

/* --- «الميكروفون» (the ideas of 7 Oct 2026, 810): one guide talks at a time ----------------
   A lobby switch. The holder is shown big on every phone and the TV; the holder passes it to the
   next guide, the mover calls a guide by name (passMic { to }), each sent with the holder the
   phone saw (`from`). With one guide there is nothing to pass, and nothing is shown. */
function dkMicPaint(el, state) {
  const box = el && el.querySelector('[data-dk-mic]');
  if (!box) return;
  const s = state.shared || {};
  const g = s.guides || [];
  const role = dkRole(state);
  const on = !!s.mic && g.length > 1 && !!s.micId && s.phase !== 'gameover';
  const key = [on, s.micId, g.join(','), role, Room.me, appState.lang].join('|');
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.hidden = !on;
  if (!on) { box.innerHTML = ''; return; }
  const who = `<bdi>${escapeHTML(dkName(state, s.micId))}</bdi>`;
  const from = jsStringAttr(s.micId);
  const colour = DK_LENS[Math.max(0, g.indexOf(s.micId)) % DK_LENS.length];
  let html;
  if (role === 'screen') html = `<span class="dk-mic__icon" aria-hidden="true">🎤</span><span class="dk-mic__who">${who}</span>`;
  else if (role === 'mover') {
    html = `<div class="dk-mic__line"><span class="dk-mic__icon" aria-hidden="true">🎤</span><span>${dkT('dk_mic_other', { name: who })}</span></div>
      <div class="dk-mic__call"><small>${escapeHTML(dkT('dk_mic_call'))}</small>${g.filter(id => id !== s.micId).map(id => `<button type="button" class="chip" style="--dk-c:${DK_LENS[g.indexOf(id) % DK_LENS.length]}" onclick="roomAct('passMic', { to: '${jsStringAttr(id)}', from: '${from}' })"><bdi>${escapeHTML(dkName(state, id))}</bdi></button>`).join('')}</div>`;
  } else if (s.micId === Room.me) {
    html = `<div class="dk-mic__line"><span class="dk-mic__icon" aria-hidden="true">🎤</span><b>${escapeHTML(dkT('dk_mic_yours'))}</b></div>
      <button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="roomAct('passMic', { from: '${from}' })">${escapeHTML(dkT('dk_mic_pass'))}</button>`;
  } else html = `<div class="dk-mic__line"><span class="dk-mic__icon" aria-hidden="true">🎤</span><span>${dkT('dk_mic_other', { name: who })}</span></div><small>${escapeHTML(dkT('dk_mic_wait'))}</small>`;
  box.innerHTML = html;
  box.style.setProperty('--dk-c', colour);
  box.classList.toggle('is-mine', s.micId === Room.me);
}

/* --- «دايخ!» (813): the guides and the TV see the mover dizzy, with the seconds left --------- */
function dkDizzyPaint(el, state) {
  const box = el && el.querySelector('[data-dk-dizzy]');
  if (!box || !state) return;
  const s = state.shared || {};
  const dz = Number(((state.you || {}).dz) || ((state.screen || {}).dz) || 0);
  const left = dz - dkNow();
  const on = s.phase === 'play' && left > 0;
  const txt = on ? dkT('dk_dizzy', { name: dkIso(dkName(state, s.moverId)), n: Math.ceil(left / 1000) }) : '';
  if (box.textContent !== txt) box.textContent = txt;
  if (box.hidden === on) box.hidden = !on;
}

/* --- the sounds ---------------------------------------------------------------------- */
function dkSound(kind) {
  try {
    const at = fxCtx().currentTime + 0.01;
    switch (kind) {
      case 'step': fxNoise('lowpass', 500, 0.8, [[0, 0.12], [0.06, 0.001]], at); break;

    if (sz.x !== w || sz.y !== h) R.setSize(w, h, false);
    cam.aspect = w / h;
    // The nearest distance that shows the whole plan at a 54° look down.
    const tilt = 54 * Math.PI / 180, vf = cam.fov * Math.PI / 360;
    const need = Math.max((m.h / 2 + 0.9) / Math.tan(vf), (m.w / 2 + 0.7) / Math.tan(vf) / cam.aspect) * 1.02;
    cam.position.set(0, Math.sin(tilt) * need, Math.cos(tilt) * need + 0.4);
    cam.lookAt(0, -0.2, 0.5);
    cam.updateProjectionMatrix();
  };
  return {
    mode: '3d', root: canvas,
    dispose() {
      keep.forEach(o => { try { o.dispose(); } catch (e) {} });
      sc.traverse(o => { if (o.geometry && o.geometry.dispose) try { o.geometry.dispose(); } catch (e) {} });
      R.dispose();
      try { R.forceContextLoss(); } catch (e) {}
      canvas.remove();
    },
    draw(state) {
      fit();
      const nowP = performance.now();
      const dt = Math.min(0.1, (nowP - last) / 1000); last = nowP;
      const s = state.shared || {};
      const now = dkNow(), t = now / 1000, ms = now - (s.t0 || now);
      const pos = dkMoverPos(state, m);
      // The mover.
      let bx = 0, bz = 0;
      const ba = Date.now() - dk.bumpAt;
      if (ba < 300 && DARK_DIRS[dk.bumpDir]) { const k = Math.sin(ba / 300 * Math.PI) * 0.18; bx = DARK_DIRS[dk.bumpDir][0] * k; bz = DARK_DIRS[dk.bumpDir][1] * k; }
      const tx = wx(pos.x) + bx, tz = wz(pos.y) + bz;
      S.mover.position.x += (tx - S.mover.position.x) * Math.min(1, dt * 16);
      S.mover.position.z += (tz - S.mover.position.z) * Math.min(1, dt * 16);
      const f = DARK_DIRS[s.face] || [0, -1];
      const want = Math.atan2(f[0], f[1]);
      let dr = want - S.body.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); S.body.rotation.y += dr * Math.min(1, dt * 14);
      const walking = Math.hypot(tx - S.mover.position.x, tz - S.mover.position.z) > 0.02;
      S.body.position.y = walking ? Math.abs(Math.sin(t * 16)) * 0.05 : 0;
      if (s.phase === 'trap') {
        const a = (Date.now() - dk.trapAt) / 1000;
        if (s.trap === 'sand') S.body.position.y = -Math.min(1, a / 1.2) * 0.45;
        else S.body.position.y = Math.max(0, Math.sin(Math.min(1, a / 0.5) * Math.PI)) * 0.5;
      }
      S.mover.visible = s.phase !== 'gameover';
      S.flames.forEach((fl, i) => { if (fl.isPointLight) fl.intensity = 2.8 + Math.sin(t * 13 + i * 2) * 0.4; else { const k = 0.5 * (0.9 + Math.sin(t * 15 + i) * 0.1); fl.scale.set(k, k * 1.25, 1); } });
      if (!home && S.ml) S.ml.intensity = 4.6 + Math.sin(t * 11) * 0.4;
      // The moving traps, and the patrols turning their heads to a mover close by.
      const dyn = darkDynAt(m, ms);
      S.dyn.forEach((o, i) => {
        const d = dyn[i];
        if (!d) return;
        if (o.d.k === 'blade') { o.piv.rotation.z = Math.sin(d.swing * DK_TAU) * 1.2; return; }
        o.g.position.set(wx(d.x) + 0.5, 0, wz(d.y) + 0.5);
        if (d.fx || d.fy) o.g.rotation.y = Math.atan2(d.fx, d.fy);
        if (o.ball) { o.ball.rotation.x += dt * 8 * (d.fy || 0); o.ball.rotation.z -= dt * 8 * (d.fx || 0); }
        if (o.head) {
          const dist = Math.hypot(pos.x - (d.x + 0.5), pos.y - (d.y + 0.5));
          let look = 0;
          if (dist < 1.8) { const wantY = Math.atan2(pos.x - (d.x + 0.5), pos.y - (d.y + 0.5)); look = Math.atan2(Math.sin(wantY - o.g.rotation.y), Math.cos(wantY - o.g.rotation.y)); look = Math.max(-1.2, Math.min(1.2, look)); }
          o.head.rotation.y += (look - o.head.rotation.y) * Math.min(1, dt * 8);
          if (o.eyes) { const bl = (t % 4) < 0.12 ? 0.2 : 1; o.eyes.forEach(e => e.scale.set(0.13, 0.13 * bl, 1)); }
        }
        if (o.arms) { o.arms[0].rotation.x = Math.sin(t * 6) * 0.3; o.arms[1].rotation.x = -Math.sin(t * 6) * 0.3; o.g.rotation.z = Math.sin(t * 6) * 0.06; }
      });
      // The sleeper stirs when the mover comes close.
      const wake = dkWake(m, pos, s);
      S.wake = (S.wake || 0) + (wake - (S.wake || 0)) * Math.min(1, dt * (wake > (S.wake || 0) ? 7 : 2.5));
      if (S.grandpa) {
        const w = S.wake;
        S.grandpa.neck.rotation.x = 0.45 + (-0.05 - 0.45) * w;
        S.grandpa.eo.forEach(e => { e.visible = w > 0.5; });
        S.grandpa.zs.forEach((z, i) => { const p = (t * 0.45 + i / 3) % 1; z.visible = w < 0.3; z.position.set(S.grandpa.base.x + 0.15 + p * 0.3, 0.95 + p * 0.6, S.grandpa.base.z); z.material.opacity = 1 - p; });
      }
      if (S.sarcoMummy) {
        const w = S.wake;
        S.sarcoMummy.mu.rotation.z = Math.PI / 2 + (0.15 - Math.PI / 2) * w;
        if (S.lid) S.lid.position.z = S.sarcoMummy.z0 + 0.55 * w;
      }
      // The still traps: a sand pit swirls; the one that caught the mover jumps.
      const pev = (state.screen && state.screen.pev) || [];
      const hot = s.phase === 'trap' ? pev[pev.length - 1] : null;
      S.traps.forEach(o => {
        if (o.g.userData.sw) o.g.userData.sw.rotation.z = t * 1.5;
        const isHot = hot && hot.type === 'trap' && hot.x === o.q.x && hot.y === o.q.y;
        const a = (Date.now() - dk.trapAt) / 1000;
        o.g.scale.setScalar(isHot && a < 1 ? 1 + Math.sin(a * 25) * 0.15 * (1 - a) : 1);
        if (o.g.userData.plate) o.g.userData.plate.position.y = isHot && a < 2 ? -0.01 : 0.015;
      });
      if (S.goal) {
        const win = s.phase === 'won';
        const k = win ? Math.min(1, (Date.now() - dk.wonAt) / 600) : 0;
        if (S.goal.door) { S.goal.door.rotation.y = -k * 1.6; S.goal.pl.intensity = 3 + k * 9; S.goal.gw.scale.setScalar(1.6 + k * 2.6); }
        if (S.goal.mk) { S.goal.mk.rotation.y = t * 0.8; S.goal.gg.material.opacity = 0.6 + Math.sin(t * 3) * 0.15 + (win ? 0.4 : 0); S.goal.pl.intensity = 3 + k * 8; }
      }
      // The lenses: coloured light from above, a dashed ring on the floor.
      const Rl = darkLensR(m, (s.guides || []).length);
      const lenses = Rl ? dkLenses(state, m) : [];
      S.lenses.forEach((L, i) => { if (i >= lenses.length) { L.sl.visible = false; L.ring.visible = false; } });
      lenses.forEach((o, i) => {
        const L = lens(i, o.col);
        L.sl.visible = true; L.ring.visible = true;
        L.sl.position.set(wx(o.x), 5.5, wz(o.y) + 0.4);
        L.sl.target.position.set(wx(o.x), 0, wz(o.y));
        L.sl.angle = Math.atan(Rl / 5.5) * 1.08;
        L.ring.position.set(wx(o.x), 0.03, wz(o.y));
        L.ring.scale.set(Rl * 2.1, Rl * 2.1, 1);
      });
      // A lone guide sees everything: the TV then shows the house in a softer dark.
      hemi.intensity = Rl ? 0.16 : 0.75;
      const dp = dust.geometry.attributes.position;
      for (let i = 0; i < dp.count; i++) { let y = dp.getY(i) + dt * 0.05; if (y > 1.1) y = 0; dp.setY(i, y); }
      dp.needsUpdate = true;
      dust.position.set(S.mover.position.x, 0, S.mover.position.z);
      R.render(sc, cam);
    }
  };
}
onLeaveScreen((from) => { if (from === 'room-darkroom' || from === 'room-tv') { if (from === 'room-tv') dkTvDrop(); dkStopLoop(); } });
onRoomClocksReset(() => { dkTvDrop(); dkStopLoop(); dk.mine = null; dk.lens = {}; });
</script>
