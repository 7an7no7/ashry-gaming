<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
  </head>
  <body>
    <script>
      /*
       * Room bridge for the static site (docs/).
       *
       * The static site is not served by Apps Script, so it has no
       * google.script.run. It loads this page (/exec?bridge=1, see doGet) in a
       * hidden iframe and posts each room call here; this page makes the real
       * call and posts the answer back. Only the room functions are relayed -
       * the same ones the Apps Script page calls.
       */
      (function () {
        var CALLS = { createRoom: true, joinRoom: true, pollRoom: true, leaveRoom: true, roomAction: true };

        window.addEventListener('message', function (event) {
          var msg = event.data;
          if (!msg || msg.type !== 'ashry-call' || !CALLS[msg.fn] || !event.source) return;

          var target = event.origin && event.origin !== 'null' ? event.origin : '*';
          var reply = function (ok, value) {
            event.source.postMessage({ type: 'ashry-result', id: msg.id, ok: ok, value: value }, target);
          };

          var run = google.script.run
            .withSuccessHandler(function (result) { reply(true, result); })
            .withFailureHandler(function (err) { reply(false, (err && err.message) || String(err)); });
          run[msg.fn].apply(run, Array.isArray(msg.args) ? msg.args : []);
        });

        // Apps Script puts this page inside frames of its own; the static site
        // is the top window.
        window.top.postMessage({ type: 'ashry-bridge-ready' }, '*');
      })();
    </script>
  </body>
</html>
