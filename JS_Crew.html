<script>
/* ============================================================================
   «الشلة» (the crew): the page and its sheets (a chunk: tools/lazy-split.mjs,
   'crew'). The shell half is JS_CrewCore.html (which crews this phone is in,
   the room's pick, the doors). The look is ج «كارنيه النادي»
   (notes/next-level-looks.html): a membership card on top (the name, the code,
   the members' faces, the season's day), four tabs under it - الشهر (a podium
   of the cast figures, then the rest of the table), الأبطال (the wall of past
   months' champions), الألقاب (titles and records), السهرات (the nights).
   The server works every number out (Crew.js, crewView); this draws them.
   ========================================================================= */
// The cache of each crew's last page (crewCacheRead / crewCacheWrite) is in the shell, JS_CrewCore.html.
const CREW_TABS = ['month', 'champs', 'titles', 'nights'];
const CREW_TITLE_ICONS = { fast: '⚡', liar: '🤥', detective: '🕵️', oracle: '🔮', cards: '🃏', brain: '🧠', words: '💬', sport: '🎳', luck: '🍀' };
// «برنامج السهرة»'s awards on the nights tab (the same icons as the program's own finale).
const CREW_PROG_ICONS = { buzz: '⚡', trivia: '🧠', liar: '🤥', catcher: '🕵️', detective: '🔎', sly: '🦊', strike: '🎳', chair: '🪑', prophet: '🔮', streak: '🔥', climb: '🚀' };
const CREW_RECORD_ICONS = { best_bowling: '🎳', best_trivia: '🧠', night_points: '🌙', night_games: '🏅', streak: '🔥', month_nights: '📅' };
const crewPage = { code: '', tab: 'month', data: {}, at: {}, busy: {}, drawn: '' };

function crewT() { return TRANSLATIONS[appState.lang] || {}; }
function crewFmt(s, vars) { return String(s || '').replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m)); }
function crewNum(n) { return '<bdi dir="ltr" class="metric">' + (Number(n) || 0) + '</bdi>'; }
function crewInitial(name) { return escapeHTML(Array.from(String(name || '?').trim())[0] || '?'); }
function crewHue(name) { let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 6; }
function crewAvatar(name, cls) { return `<span class="crew-av crew-av--c${crewHue(name)} ${cls || ''}" aria-hidden="true">${crewInitial(name)}</span>`; }

/** A month ('2026-09') as its name, in the app's language (never the Arabic-Indic digits). */
function crewMonthName(month, withYear) {
  const [y, m] = String(month || '').split('-').map(Number);
  if (!y || !m) return '';
  const d = new Date(y, m - 1, 1);
  let name = '';
  try { name = d.toLocaleDateString(appState.lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB', { month: 'long' }); } catch (e) { name = String(m); }
  return withYear ? name + ' ' + y : name;
}
function crewDayName(date) {
  const [y, m, dd] = String(date || '').split('-').map(Number);
  if (!y) return '';
  const d = new Date(y, m - 1, dd);
  try { return d.toLocaleDateString(appState.lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return date; }
}
/** «اليوم 24 من 30» of this month, on this phone's calendar. */
function crewSeasonLine(t, month) {
  const now = new Date();
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  return crewFmt(t.crew_season || '', { month: crewMonthName(month || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0'))), day: now.getDate(), of: days });
}
/** A game's icon for the nights tab: the room list's (a room game) or the home's. */
function crewGameIcon(id) {
  const hub = (typeof ROOM_HUB_GAMES !== 'undefined') && ROOM_HUB_GAMES.find(g => g.id === id);
  const cat = (typeof CATALOG_BY_ID !== 'undefined') && CATALOG_BY_ID[id];
  const icon = (hub && hub.icon) || (cat && cat.icon) || '🎲';
  return iconHtml(icon);
}
function crewGameName(id, t) {
  const hub = (typeof ROOM_HUB_GAMES !== 'undefined') && ROOM_HUB_GAMES.find(g => g.id === id);
  return (hub && t[hub.key]) || id;
}

/* --- the page -------------------------------------------------------------- */

function renderCrew() {
  const view = document.getElementById('view-crew');
  if (!view) return;
  const t = crewT();
  const list = crewList();
  if (!list.length) {
    crewPage.drawn = '';
    view.innerHTML = `
      <div class="crew-empty">
        <div class="crew-card crew-card--ghost" aria-hidden="true">
          <div class="crew-card__top"><div><div class="crew-card__brand">${escapeHTML(t.crew_brand || '')}</div><div class="crew-card__name">${escapeHTML(t.crew_title || '')}</div></div><div class="crew-card__chip"></div></div>
          <div class="crew-card__mid"><div class="crew-card__faces">${['م', 'ك', 'ت', 'س'].map((x, i) => `<span class="crew-av crew-av--c${i + 1}">${x}</span>`).join('')}</div></div>
        </div>
        <h2 class="crew-empty__title">${escapeHTML(t.crew_empty_title || '')}</h2>
        <p class="crew-empty__text">${escapeHTML(t.crew_empty_text || '')}</p>
        <div class="btn-stack">
          <button type="button" class="btn btn--primary btn--lg" onclick="crewOpenCreate()">${escapeHTML(t.crew_create || '')}</button>
          <button type="button" class="btn btn--secondary" onclick="crewOpenJoin('')">${escapeHTML(t.crew_join || '')}</button>
        </div>
      </div>`;
    return;
  }
  if (!list.some(c => c.code === crewPage.code)) crewPage.code = list[0].code;
  const code = crewPage.code;
  // The copy kept on the phone is drawn while the page asks again, without the manager's buttons:
  // a hand-over since it was kept would show them to someone who no longer runs the crew.
  const kept = crewPage.data[code] ? null : crewCacheRead()[code];
  const data = crewPage.data[code] || (kept ? Object.assign({}, kept, { mgr: false }) : null);
  crewDraw(view, list, code, data);
  // Asked again when the page opens, and at most every 20 s while it stays.
  if (!crewPage.busy[code] && (!crewPage.at[code] || Date.now() - crewPage.at[code] > 20000)) crewFetch(code);
}

async function crewFetch(code) {
  crewPage.busy[code] = true;
  const res = await crewAct(code, 'get');
  crewPage.busy[code] = false;
  crewPage.at[code] = Date.now();
  const t = crewT();
  if (res && res.ok && res.crew) {
    crewPage.data[code] = res.crew;
    crewCacheWrite(code, res.crew);
    crewWordsSync();   // a words pack another member added: on this phone's word games now
  } else if (res && (res.out || res.gone)) {
    crewCacheWrite(code, null);
    delete crewPage.data[code];
    showToast(res.gone ? (t.crew_err_gone || '') : (t.crew_err_out || ''), 'info');
  } else if (res && res.net) {
    // Offline: the page keeps what it last saw (the cache), and says so once.
    if (!crewPage.data[code]) showToast(t.crew_err_net || '', 'info');
  }
  if (appState.currentView === 'crew') renderCrew();
}

function crewDraw(view, list, code, data) {
  const t = crewT();
  const entry = list.find(c => c.code === code) || {};
  const name = (data && data.name) || entry.name || '';
  const members = (data && data.members) || [];
  const faces = members.slice(0, 4).map(m => crewAvatar(m.name)).join('') +
    (members.length > 4 ? `<span class="crew-av crew-av--more">+${members.length - 4}</span>` : '');
  const switcher = list.length > 1 ? `
    <div class="filter-row hscroll-fade crew-switch" role="group">
      ${list.map(c => `<button type="button" class="filter-chip filter-chip--sm ${c.code === code ? 'is-active' : ''}" onclick="crewSwitch('${jsStringAttr(c.code)}')">${escapeHTML(c.name)}</button>`).join('')}
      <button type="button" class="filter-chip filter-chip--sm" onclick="crewOpenAdd()" aria-label="${escapeHTML(t.crew_add || '')}">＋</button>
    </div>` : '';
  const first = crewPage.drawn !== code;
  crewPage.drawn = code;
  view.innerHTML = `
    <div class="crew-page">
      ${switcher}
      <div class="crew-side">
      <button type="button" class="crew-card ${first && !motionOff() ? 'crew-card--in' : ''}" onclick="crewOpenMembers()" aria-label="${escapeHTML(t.crew_members || '')}">
        <div class="crew-card__top">
          <div>
            <div class="crew-card__brand">${escapeHTML(t.crew_brand || '')}</div>
            <div class="crew-card__name">${escapeHTML(name)}</div>
            <div class="crew-card__season">${escapeHTML(crewSeasonLine(t, data && data.month))}</div>
          </div>
          <div class="crew-card__chip" aria-hidden="true"></div>
        </div>
        <div class="crew-card__mid">
          <div class="crew-card__code"><small>${escapeHTML(t.crew_code || '')}</small><span class="crew-card__codev" dir="ltr">${escapeHTML(code)}</span></div>
          <div class="crew-card__faces">${faces}</div>
        </div>
      </button>
      <div class="crew-actions">
        <button type="button" class="btn btn--secondary btn--sm" onclick="crewOpenInvite()"><span aria-hidden="true">📨</span> ${escapeHTML(t.crew_invite || '')}</button>
        <button type="button" class="btn btn--secondary btn--sm" onclick="crewOpenMembers()"><span aria-hidden="true">👥</span> ${escapeHTML(t.crew_members || '')}</button>
        <button type="button" class="btn btn--primary btn--sm" onclick="crewOpenRoom()"><span aria-hidden="true">🎮</span> ${escapeHTML(t.crew_open_room || '')}</button>
      </div>
      ${data ? crewPacksHtml(data, t) : ''}
      </div>
      <div class="crew-main">
      <div class="segmented crew-tabs" role="tablist">
        ${CREW_TABS.map(k => `<button type="button" role="tab" class="segmented__item ${crewPage.tab === k ? 'is-active' : ''}" aria-selected="${crewPage.tab === k}" onclick="crewTab('${k}')">${escapeHTML(t['crew_tab_' + k] || k)}</button>`).join('')}
      </div>
      <div id="crew-pane" class="crew-pane">${data ? crewPaneHtml(crewPage.tab, data, t) : '<div class="skel skel--hub"></div>'}</div>
      </div>
    </div>`;
  if (typeof watchScrollFade === 'function') view.querySelectorAll('.hscroll-fade').forEach(watchScrollFade);
  if (data) crewAfterPane(crewPage.tab, data);
  if (data) crewAfterPacks(data);
}

/** Does this phone run the crew? Its key's power (`mgr`, the review of 1 Oct 2026), not the name:
    a phone that tapped the manager's name is a member until it pairs. A page cached from before
    `mgr` was sent falls back to the name (the server decides either way). */
const crewIsMgr = (d) => !!d && (typeof d.mgr === 'boolean' ? d.mgr : d.managerId === d.you);

/* --- the crew's packs: its quizzes and words, under the card (the links, 30 Sep 2026) ----
   Every member sees them without a code; a tap opens one (openPackByCode, or the words'
   sheet); «＋» adds a quiz or words from this phone; ✕ for whoever added it and the manager. */
function crewPacksHtml(d, t) {
  const packs = d.packs || [];
  const mgr = crewIsMgr(d);
  const chips = packs.map(p => {
    const canOff = mgr || (p.byId && p.byId === d.you);
    const kindLabel = p.kind === 'words' ? (t.crew_pack_words || '') : (t.crew_pack_quiz || '');
    return `<span class="crew-pack" data-pack="${escapeHTML(p.code)}">
        <button type="button" class="crew-pack__open" onclick="crewOpenPack('${jsStringAttr(p.code)}', '${jsStringAttr(p.kind)}')">
          <span class="crew-pack__e" aria-hidden="true">${p.kind === 'words' ? '✍️' : '🧠'}</span>
          <span class="crew-pack__t"><b dir="auto">${escapeHTML(p.title || p.code)}</b><small>${escapeHTML(kindLabel)}${p.by ? ' · ' + escapeHTML(crewFmt(t.crew_pack_by, { name: p.by })) : ''}</small></span>
        </button>
        ${canOff ? `<button type="button" class="iconbtn crew-pack__x" onclick="crewPackRemove('${jsStringAttr(p.code)}')" aria-label="${escapeHTML(crewFmt(t.crew_pack_remove, { t: p.title || p.code }))}" title="${escapeHTML(crewFmt(t.crew_pack_remove, { t: p.title || p.code }))}">✕</button>` : ''}
      </span>`;
  }).join('');
  return `
    <section class="crew-packs" aria-labelledby="crew-packs-h">
      <div class="crew-packs__head">
        <h3 class="crew-packs__title" id="crew-packs-h">${escapeHTML(t.crew_packs_title || '')}${packs.length ? ` <span class="crew-packs__n metric">${packs.length}</span>` : ''}</h3>
        <button type="button" class="btn btn--ghost btn--xs btn--auto crew-packs__add" onclick="crewOpenPacksAdd()"><span aria-hidden="true">＋</span> ${escapeHTML(t.crew_packs_add || '')}</button>
      </div>
      ${packs.length ? `<div class="crew-packs__list hscroll-fade">${chips}</div>`
        : `<p class="crew-packs__empty">${escapeHTML(t.crew_packs_empty || '')}</p>`}
    </section>`;
}

/** The packs pop in once per list (and a pack just added pops alone). */
function crewAfterPacks(d) {
  const box = document.querySelector('#view-crew .crew-packs__list');
  if (!box || motionOff()) return;
  const fresh = crewPacksChanged.justAdded;
  crewPacksChanged.justAdded = '';
  const els = [...box.querySelectorAll('.crew-pack')];
  const key = 'crewpacks|' + d.code + '|' + (d.packs || []).map(p => p.code).join(',');
  if (!motionFirst(key)) return;
  els.forEach((el, i) => {
    if (fresh && el.dataset.pack !== fresh) return;
    if (el.animate) el.animate([{ opacity: 0, transform: 'translateY(8px) scale(0.96)' }, { opacity: 1, transform: 'none' }],
      { duration: 300, delay: fresh ? 0 : 50 * Math.min(i, 8), easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' });
  });
}

/** «＋»: the quizzes and words on this phone that have a code and aren't on the crew yet. */
function crewOpenPacksAdd() {
  const t = crewT();
  const code = crewPage.code;
  const on = new Set(crewPacksOf(code).map(p => p.code));
  const mine = (typeof packsKnownCodes === 'function' ? packsKnownCodes() : []).filter(p => !on.has(p.code));
  const rows = mine.map(p => `
      <button type="button" class="crew-pick" onclick="crewPackAddTo('${jsStringAttr(code)}', '${jsStringAttr(p.code)}', '${jsStringAttr(p.kind)}', '${jsStringAttr(p.title || '')}')">
        <span class="crew-pick__icon" aria-hidden="true">${p.kind === 'words' ? '✍️' : '🧠'}</span>
        <span class="crew-pick__name">${escapeHTML(p.title || p.code)}</span>
        <span class="crew-pick__code" dir="ltr">${escapeHTML(p.code)}</span>
      </button>`).join('');
  crewModal(`
    <div class="modal-icon" aria-hidden="true">📦</div>
    <div class="sheet__title">${escapeHTML(t.crew_packs_add_title || '')}</div>
    <p class="sheet__subtitle">${escapeHTML(mine.length ? (t.crew_packs_add_sub || '') : (t.crew_packs_none_here || ''))}</p>
    ${mine.length ? `<div class="modal-list crew-picks">${rows}</div>` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn--secondary" onclick="closeModal('crew-modal'); catalogOpen('quizmaker')"><span aria-hidden="true">🧠</span> ${escapeHTML(t.crew_packs_make || '')}</button>
      <button type="button" class="btn btn--ghost" onclick="closeModal('crew-modal')">${escapeHTML(t.cancel || '')}</button>
    </div>`);
}

function crewPackRemove(packCode) {
  const t = crewT();
  const code = crewPage.code;
  const p = crewPacksOf(code).find(x => x.code === packCode) || {};
  showConfirmModal(crewFmt(t.crew_pack_remove_q, { t: crewIso(p.title || packCode) }), async () => {
    const res = await crewRemovePack(code, packCode);
    if (!res || !res.ok) { showToast(roomErrLocal((res && res.error) || '') || t.crew_err_net, 'error'); return; }
    if (res.crew) { crewPage.data[code] = res.crew; crewCacheWrite(code, res.crew); }
    showToast(t.crew_pack_removed || '', 'info');
    crewPacksChanged();
  });
}

function crewSwitch(code) {
  if (code === crewPage.code) return;
  crewPage.code = code;
  crewTouch(code);
  haptic('light');
  renderCrew();
}

/** A tab: the pane slides in from the side it lies on; the segmented thumb slides by itself. */
function crewTab(k) {
  if (CREW_TABS.indexOf(k) === -1 || k === crewPage.tab) return;
  const from = CREW_TABS.indexOf(crewPage.tab);
  crewPage.tab = k;
  haptic('light');
  const view = document.getElementById('view-crew');
  if (!view) return;
  view.querySelectorAll('.crew-tabs .segmented__item').forEach((b, i) => {
    const on = CREW_TABS[i] === k;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  const pane = document.getElementById('crew-pane');
  const data = crewPage.data[crewPage.code] || crewCacheRead()[crewPage.code];
  if (!pane || !data) return;
  pane.innerHTML = crewPaneHtml(k, data, crewT());
  crewAfterPane(k, data);
  if (!motionOff() && pane.animate) {
    const rtl = document.documentElement.dir === 'rtl';
    const ahead = CREW_TABS.indexOf(k) > from;
    const dx = (ahead ? 1 : -1) * (rtl ? -1 : 1) * 28;
    pane.animate([{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

function crewPaneHtml(k, d, t) {
  if (k === 'champs') return crewChampsHtml(d, t);
  if (k === 'titles') return crewTitlesHtml(d, t);
  if (k === 'nights') return crewNightsHtml(d, t);
  return crewMonthHtml(d, t);
}

/** After a pane is in the page: the numbers count up, the cards pop in one after another (once each). */
function crewAfterPane(k, d) {
  const pane = document.getElementById('crew-pane');
  if (!pane) return;
  const key = ['crewpane', d.code, k, d.nightCount, JSON.stringify(d.table.map(r => r.won + '/' + r.points))].join('|');
  if (!motionFirst(key)) return;
  pane.querySelectorAll('[data-count-to]').forEach(el => {
    const to = Number(el.dataset.countTo) || 0;
    if (to > 0 && typeof countUp === 'function') countUp(el, 0, to);
  });
  pane.querySelectorAll('.crew-pop').forEach((el, i) => {
    if (el.animate) el.animate([{ opacity: 0, transform: 'translateY(10px) scale(0.97)' }, { opacity: 1, transform: 'none' }],
      { duration: 320, delay: 60 * Math.min(i, 10), easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'backwards' });
  });
}

/* --- الشهر: the podium of the cast, then the rest of the table ------------- */
function crewMonthHtml(d, t) {
  const table = d.table || [];
  const won = table.filter(r => r.won > 0);
  const nights = (d.nights || []).filter(n => String(n.date || '').slice(0, 7) === d.month).length;
  let podium = '';
  if (won.length) {
    const top = won.slice(0, 3);
    const rankOf = (r) => 1 + won.filter(x => x.won > r.won || (x.won === r.won && x.points > r.points)).length;
    const rise = motionFirst(['crewpod', d.code, d.month, JSON.stringify(top.map(r => r.id + r.won + r.points))].join('|'));
    const atOf = (i) => 150 + (top.length - 1 - i) * 520;
    podium = `<div class="podium crew-podium${rise ? ' podium--rise' : ''}" ${rise ? `data-reveal-ms="${atOf(0) + 620}"` : ''}>` +
      top.map((r, i) => {
        const rank = Math.min(3, rankOf(r));
        return `<div class="podium__place podium__place--${i + 1} podium__place--rank${rank}" style="--at:${atOf(i)}ms">
            <div class="podium__who">
              <span class="podium__medal" aria-hidden="true">${['🥇', '🥈', '🥉'][rank - 1]}</span>
              <span class="podium__name">${escapeHTML(r.name)}</span>
              <span class="podium__score">${crewFmt(escapeHTML(r.won === 1 ? t.crew_nights_1 : t.crew_nights_n), { n: crewNum(r.won) })}</span>
              <span class="crew-podium__pts">${crewFmt(escapeHTML(t.crew_points_n || ''), { n: crewNum(r.points) })}</span>
            </div>
            <div class="podium__block"><span class="metric">${rank}</span></div>
          </div>`;
      }).join('') + '</div>';
  }
  const rest = won.length ? table.slice(Math.min(3, won.length)) : table;
  const rows = rest.map((r, i) => {
    const pos = (won.length ? Math.min(3, won.length) : 0) + i + 1;
    const you = r.id === d.you;
    return `<div class="crew-row crew-pop ${you ? 'is-you' : ''}">
        <span class="crew-row__n metric">${pos}</span>
        ${crewAvatar(r.name, 'crew-av--s')}
        <span class="crew-row__who">${escapeHTML(r.name)}${you ? ` <span class="badge badge--accent">${escapeHTML(t.crew_you || '')}</span>` : ''}</span>
        <span class="crew-row__stat"><b data-count-to="${r.won}">${r.won}</b> <small>${escapeHTML(t.crew_col_nights || '')}</small></span>
        <span class="crew-row__stat"><b data-count-to="${r.points}">${r.points}</b> <small>${escapeHTML(t.crew_col_points || '')}</small></span>
      </div>`;
  }).join('');
  const champ = (d.champions || [])[0];
  const title = (d.titles || [])[0];
  const lastNight = (d.nights || [])[0];
  const peek = `
    <div class="crew-peek">
      <button type="button" class="crew-peek__c crew-pop" onclick="crewTab('champs')"><span class="crew-peek__e" aria-hidden="true">🏆</span><b>${escapeHTML(t.crew_tab_champs || '')}</b><span>${champ ? escapeHTML(champ.names.join('، ')) : escapeHTML(t.crew_peek_none || '')}</span></button>
      <button type="button" class="crew-peek__c crew-pop" onclick="crewTab('titles')"><span class="crew-peek__e" aria-hidden="true">🏷️</span><b>${escapeHTML(t.crew_tab_titles || '')}</b><span>${title ? escapeHTML((t['crew_t_' + title.key] || '') + ': ' + title.name) : escapeHTML(t.crew_peek_none || '')}</span></button>
      <button type="button" class="crew-peek__c crew-pop" onclick="crewTab('nights')"><span class="crew-peek__e" aria-hidden="true">🗓️</span><b>${escapeHTML(t.crew_tab_nights || '')}</b><span>${lastNight ? escapeHTML(crewFmt(t.crew_peek_last, { day: crewDayName(lastNight.date).split(/[،,]/)[0] })) : escapeHTML(t.crew_peek_none || '')}</span></button>
    </div>`;
  const empty = !won.length ? `
    <div class="crew-note crew-pop">

function crewFieldError(msg, fieldId) {
  const err = document.getElementById('crew-f-err');
  if (err) { err.textContent = msg || ''; err.classList.toggle('hidden', !msg); }
  const f = fieldId && document.getElementById(fieldId);
  if (f && msg) { f.focus(); if (typeof blockStartAt === 'function') blockStartAt(f); }
}
function crewBusy(on) { const b = document.getElementById('crew-f-go'); if (b) b.disabled = !!on; }

async function crewCreateGo() {
  const t = crewT();
  const name = String((document.getElementById('crew-f-name') || {}).value || '').trim();
  const me = String((document.getElementById('crew-f-me') || {}).value || '').trim();
  if (!name) return crewFieldError(t.crew_err_name, 'crew-f-name');
  if (!me) return crewFieldError(t.crew_err_me, 'crew-f-me');
  crewBusy(true);
  const res = await crewApi('create', { name, me });
  crewBusy(false);
  if (!res || !res.ok) return crewFieldError(roomErrLocal((res && res.error) || '') || t.crew_err_net);
  crewJoined(res, me);
  showToast(crewFmt(t.crew_made, { name: res.crew.name }), 'success');
  if (typeof confetti === 'function' && !motionOff()) confetti({ particleCount: 70, spread: 70, origin: { y: 0.4 } });
}

/** After a create or a join: kept on this phone, its names in the saved names, the page on it. */
function crewJoined(res, me) {
  crewRemember({ code: res.code, name: res.crew.name, memberId: res.memberId, key: res.key, me: me }, true);
  crewPage.code = res.code;
  crewPage.tab = 'month';
  crewPage.data[res.code] = res.crew;
  crewPage.at[res.code] = Date.now();
  crewCacheWrite(res.code, res.crew);
  // The one-phone games know the crew too (the owner): every member's name in the saved names.
  (res.crew.members || []).forEach(m => { if (typeof addToPlayerLibrary === 'function') addToPlayerLibrary(m.name); });
  if (typeof roomName !== 'undefined' && !String(roomName.get() || '').trim() && me) roomName.set(me);
  closeModal('crew-modal');
  if (appState.currentView !== 'crew') setView('crew'); else renderCrew();
  // A phone in a room for this crew says who it is now.
  if (typeof Room !== 'undefined' && Room.state && Room.state.crew && Room.state.crew.code === res.code && !Room.state.youAreScreen) {
    Room.act('crewMe', { code: res.code, key: res.key }).catch(() => {});
    if (typeof routeRoomState === 'function' && onRoomView()) routeRoomState(Room.state);
  }
}

function crewCodeOf(text) {
  const s = String(text || '').trim();
  const m = /(?:[?&]crew=|\/s\/)([A-Za-z]{6})/.exec(s);
  const c = (m ? m[1] : s).toUpperCase().replace(/[^A-Z]/g, '');
  return /^[A-Z]{6}$/.test(c) ? c : '';
}

async function crewPeekGo() {
  const t = crewT();
  const code = crewCodeOf((document.getElementById('crew-f-code') || {}).value);
  if (!code) return crewFieldError(t.crew_err_code, 'crew-f-code');
  if (crewEntry(code)) {
    closeModal('crew-modal');
    crewPage.code = code;
    crewTouch(code);
    if (appState.currentView !== 'crew') setView('crew'); else renderCrew();
    return;
  }
  crewBusy(true);
  const res = await crewApi('peek', { code });
  crewBusy(false);
  if (!res || !res.ok) return crewFieldError(res && res.error === 'CREW_NOT_FOUND' ? t.crew_err_notfound : (roomErrLocal((res && res.error) || '') || t.crew_err_net), 'crew-f-code');
  crewJoinPeek = res.crew;
  crewWhoSheet();
}

async function crewMove(action, payload, reopen) {
  const code = crewPage.code;
  crewBusy(true);
  const res = await crewAct(code, action, payload);
  crewBusy(false);
  if (!res || !res.ok) { crewFieldError(roomErrLocal((res && res.error) || '') || crewT().crew_err_net); showToast(roomErrLocal((res && res.error) || '') || crewT().crew_err_net, 'error'); return null; }

}
function crewRenameCrew() {
  const d = crewPage.data[crewPage.code] || {};
  crewAskName(crewT().crew_rename || '', d.name, (v) => crewMove('rename', { name: v }, true));
}
function crewRenameMember(id) {
  const d = crewPage.data[crewPage.code] || {};
  const m = (d.members || []).find(x => x.id === id) || {};
  crewAskName(crewT().crew_rename_member || '', m.name, (v) => crewMove('renameMember', { id, name: v }, true));
}
function crewHandOver(id) {
  const t = crewT();
  const d = crewPage.data[crewPage.code] || {};
  const m = (d.members || []).find(x => x.id === id) || {};
  closeModal('crew-modal');
  showConfirmModal(crewFmt(t.crew_hand_over_q, { name: m.name || '' }), () => crewMove('handOver', { id }, true));
}
function crewRemove(id) {
  const t = crewT();
  const d = crewPage.data[crewPage.code] || {};
  const m = (d.members || []).find(x => x.id === id) || {};
  closeModal('crew-modal');
  showConfirmModal(crewFmt(t.crew_remove_q, { name: m.name || '' }), () => crewMove('removeMember', { id }, true));
}
/* «ضيف موبايلك التاني» (the review of 1 Oct 2026): the manager's power is a key's, so the
   manager's other phone - in by tapping their name - pairs with a 6-digit code this phone makes
   (Crew.js, crewPairMake / crewPairUse; ten minutes, five tries). */
async function crewPairCode() {
  const t = crewT();
  const code = crewPage.code;
  const res = await crewAct(code, 'pairCode');
  if (!res || !res.ok || !res.pair) { showToast(roomErrLocal((res && res.error) || '') || t.crew_err_net, 'error'); return; }
  crewModal(`
    <div class="modal-icon" aria-hidden="true">📱</div>
    <div class="sheet__title">${escapeHTML(t.crew_pair_title || '')}</div>
    <p class="sheet__subtitle">${escapeHTML(t.crew_pair_sub || '')}</p>
    <div class="crew-invite__code" dir="ltr">${escapeHTML(res.pair.code)}</div>
    <div class="modal-actions">
      <button type="button" class="btn btn--ghost" onclick="crewOpenMembers()">${escapeHTML(t.close || t.cancel || '')}</button>
    </div>`);
}
async function crewPairGo() {
  const t = crewT();
  const typed = String((document.getElementById('crew-f-pair') || {}).value || '').replace(/[^0-9٠-٩]/g, '')
    .replace(/[٠-٩]/g, (d) => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  if (typed.length !== 6) return crewFieldError(t.crew_pair_ph || '', 'crew-f-pair');
  const res = await crewMove('pair', { code: typed }, true);
  if (res && res.crew && crewIsMgr(res.crew)) showToast(t.crew_pair_ok || '', 'success');
}

function crewLeave() {
  const t = crewT();
  const code = crewPage.code;
  const e = crewEntry(code) || {};
  closeModal('crew-modal');
  showConfirmModal(crewFmt(t.crew_leave_q, { name: e.name || '' }), async () => {
    const res = await crewAct(code, 'leave');
    if (res && (res.ok || res.out || res.gone)) {
      crewForget(code);
      crewCacheWrite(code, null);
      delete crewPage.data[code];
      crewPage.code = '';
      // A phone in by tapping a name leaves alone; the member stays in the crew (crew.js 'leave').
      showToast((res.phoneOnly ? t.crew_left_phone : t.crew_left) || '', 'info');
      renderCrew();
    } else showToast(roomErrLocal((res && res.error) || '') || t.crew_err_net, 'error');
  });
}

// A language changed on the page: the page again, in the new words.
if (typeof onLanguageChange === 'function') onLanguageChange((view) => { if (view === 'crew') renderCrew(); });
</script>
