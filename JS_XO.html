<script>
/* ============================================================================
   إكس أو — TIC TAC TOE
   ----------------------------------------------------------------------------
   Two on one phone, or one against the phone. The phone plays a full minimax
   on hard (it cannot be beaten, only drawn), choosing at random among its
   best moves so games differ, and throws in a random move a third of the
   time on easy, which is what lets a child win now and then.
   The board is in appState.xo, so a reload keeps the game and the tally.

   3 marks only (the owner, 22 Sep 2026: good players always draw): a switch
   on the setup, off by default. Each side keeps three marks on the board; a
   fourth takes the place of that side's oldest, which is shown faded on its
   owner's turn only - on the other side's turn it looks like any mark, so
   remembering the other side's oldest is part of the game (the owner) - and
   can't be played on (it is still there while you choose). Six marks
   never fill nine squares, so there is no draw and no limit: the game goes on
   until someone makes three in a row. A round keeps the rule it was dealt
   with (x.rule3), and x.order is each side's marks, oldest first.
   ========================================================================= */

// XO_LINES, XO_KEEP, xoWinner and xoMark are TicTacToe.js, shared with the rooms server.
let xoPhoneTimer = null;
let xoGone = null;          // the mark a move just took off, for its fade: { cell, mark }

function xoState() {
  if (!appState.xo) {
    appState.xo = { vs: 'phone', level: 'hard', board: Array(9).fill(''), turn: 'X', first: 'X', human: 'X',
                    phase: 'setup', winner: '', line: null, scores: { X: 0, O: 0, D: 0 }, three: false };
  }
  const x = appState.xo;
  if (!x.order) x.order = { X: [], O: [] };      // a game saved before the rule existed
  return x;
}

function setupXO() {
  const x = xoState();
  if (xoPhoneTimer) clearTimeout(xoPhoneTimer);
  x.phase = 'setup';
  saveToLocal();
  setView('setup-xo');
  paintXOSetup();
}

function paintXOSetup() {
  const x = xoState();
  document.querySelectorAll('#xo-vs .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === x.vs));
  document.querySelectorAll('#xo-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === x.level));
  document.querySelectorAll('#xo-side .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === x.human));
  const levelField = document.getElementById('xo-level-field');
  if (levelField) levelField.classList.toggle('hidden', x.vs !== 'phone');
  const sideField = document.getElementById('xo-side-field');
  if (sideField) sideField.classList.toggle('hidden', x.vs !== 'phone');
  const three = document.getElementById('xo-three');
  if (three) three.checked = !!x.three;
}

function setXOOption(key, value) {
  xoState()[key] = value;
  saveToLocal();
  paintXOSetup();
}

/** A new match: the tally starts over. */
function startXO() {
  const x = xoState();
  x.scores = { X: 0, O: 0, D: 0 };
  x.first = 'X';
  xoNewRound();
}

/** The next round of the same match; the other side opens. */
function xoNewRound() {
  const x = xoState();
  if (xoPhoneTimer) clearTimeout(xoPhoneTimer);
  x.board = Array(9).fill('');
  x.order = { X: [], O: [] };
  x.rule3 = !!x.three;
  xoGone = null;
  x.turn = x.first;
  x.winner = '';
  x.line = null;
  x.phase = 'play';
  saveToLocal();
  if (appState.currentView !== 'play-xo') setView('play-xo');
  paintXO();
  xoMaybePhone();
}

const xoOther = (m) => (m === 'X' ? 'O' : 'X');

function xoPlay(i) {
  const x = xoState();
  if (x.phase !== 'play' || x.board[i]) return;
  if (x.vs === 'phone' && x.turn !== x.human) return;
  xoPlace(i);
}

function xoPlace(i) {
  const x = xoState();
  // The fourth mark takes the place of this side's oldest (3 marks only).
  const placed = xoMark(x.board, x.order, x.rule3, i, x.turn);
  if (!placed) return;
  if (placed.gone >= 0) xoGone = { cell: placed.gone, mark: x.turn };
  playSound('click');
  const result = xoWinner(x.board);
  if (result) {
    x.phase = 'done';
    x.winner = result.mark;
    x.line = result.line;
    x.scores[result.mark] = (x.scores[result.mark] || 0) + 1;
    x.first = xoOther(x.first);
    saveToLocal();
    paintXO();
    if (result.mark !== 'D' && (x.vs === 'friend' || result.mark === x.human)) {
      playSound('success');
      if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 60, origin: { y: 0.7 } });
    } else {
      playSound('tick');
    }
    return;
  }
  x.turn = xoOther(x.turn);
  saveToLocal();
  paintXO();
  xoMaybePhone();
}

function xoMaybePhone() {
  const x = xoState();
  if (x.vs !== 'phone' || x.phase !== 'play' || x.turn === x.human) return;
  if (xoPhoneTimer) clearTimeout(xoPhoneTimer);
  xoPhoneTimer = setTimeout(() => {
    xoPhoneTimer = null;
    // Not while its board is off screen (it plays when the board comes back),
    // nor on a game that has been replaced meanwhile.
    if (appState.currentView !== 'play-xo' || xoState() !== x) return;
    if (x.phase !== 'play' || x.turn === x.human) return;
    xoPlace(xoPhoneMove(x));
  }, 420);
}

// Leaving the board by the back arrow or a tab: the phone's move waits, as in
// كونكت ٤ and نقط ومربعات, and comes when the board is back.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    if (from === 'play-xo' && xoPhoneTimer) { clearTimeout(xoPhoneTimer); xoPhoneTimer = null; }
    if (to === 'play-xo') setTimeout(() => { if (appState.currentView === 'play-xo') xoMaybePhone(); }, 0);
  });
}

/*
 * On an empty board every move is a draw with perfect play, so the phone opens
 * without searching: the centre or a corner, at random (they leave a human the
 * most ways to go wrong). After that it searches, and picks at random among
 * the moves that score best, so the same game doesn't repeat move for move.
 */
const XO_OPENINGS = [4, 0, 2, 6, 8];

function xoPhoneMove(x) {
  const empty = x.board.map((v, i) => (v ? -1 : i)).filter(i => i !== -1);
  if (x.level === 'easy' && Math.random() < 0.35) return empty[Math.floor(Math.random() * empty.length)];
  if (empty.length === 9) return XO_OPENINGS[Math.floor(Math.random() * XO_OPENINGS.length)];
  if (x.rule3) return xo3BestMove(x);
  const me = x.turn;
  let best = -Infinity, choices = [];
  for (const i of empty) {
    x.board[i] = me;
    const score = xoMinimax(x.board, xoOther(me), me, 0);
    x.board[i] = '';
    if (score > best) { best = score; choices = [i]; }
    else if (score === best) choices.push(i);
  }
  return choices[Math.floor(Math.random() * choices.length)];
}

/* Positions already scored, so the second move (eight empty cells) is quick too. */
const XO_MEMO = new Map();

function xoMinimax(board, turn, me, depth) {
  const key = board.map(v => v || '-').join('') + turn + me + depth;
  if (XO_MEMO.has(key)) return XO_MEMO.get(key);
  const r = xoWinner(board);
  let result;
  if (r) {
    result = r.mark === 'D' ? 0 : (r.mark === me ? 10 - depth : depth - 10);
  } else {
    const scores = [];
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = turn;
      scores.push(xoMinimax(board, xoOther(turn), me, depth + 1));
      board[i] = '';
    }
    result = turn === me ? Math.max(...scores) : Math.min(...scores);
  }
  XO_MEMO.set(key, result);
  return result;
}

/* --- The phone with 3 marks only -------------------------------------------
   The game has no end but a line, and the positions repeat, so there is no
   full minimax to run: a search a few moves deep (alpha-beta, deepened while
   the time lasts), and a judgement at the bottom that counts the lines each
   side could still finish - leaving out a side's oldest mark when it has three,
   since that one leaves on its owner's next move. Easy looks two moves ahead. */
const XO3_BUDGET_MS = 180;
const XO3_MAX_NODES = 120000;
const XO3_WIN = 1000;

function xo3Apply(s, i) {
  const me = s.turn;
  s.board[i] = me;
  s.order[me].push(i);
  let gone = -1;
  if (s.order[me].length > XO_KEEP) { gone = s.order[me].shift(); s.board[gone] = ''; }
  s.turn = xoOther(me);
  return gone;
}

function xo3Undo(s, i, gone) {
  s.turn = xoOther(s.turn);
  const me = s.turn;
  s.order[me].pop();
  s.board[i] = '';
  if (gone >= 0) { s.order[me].unshift(gone); s.board[gone] = me; }
}

const xo3Lined = (board, m) => XO_LINES.some(([a, b, c]) => board[a] === m && board[b] === m && board[c] === m);

/** How good the board is for the side to move. */
function xo3Judge(s) {
  const score = (m) => {
    const leaving = s.order[m].length >= XO_KEEP ? s.order[m][0] : -1;
    let v = 0;
    for (const line of XO_LINES) {
      let own = 0, other = false;
      for (const c of line) {
        if (s.board[c] === m && c !== leaving) own++;
        else if (s.board[c] && s.board[c] !== m) other = true;
      }
      if (!other) v += own === 2 ? 10 : own;
    }
    return v;
  };
  return score(s.turn) - score(xoOther(s.turn));
}

function xo3Search(s, depth, alpha, beta, ply, ctx) {
  ctx.nodes++;
  let best = -Infinity;
  for (let i = 0; i < 9; i++) {
    if (s.board[i]) continue;
    const me = s.turn;
    const gone = xo3Apply(s, i);
    let v;
    if (xo3Lined(s.board, me)) v = XO3_WIN - ply;
    else if (depth <= 1 || ctx.nodes > XO3_MAX_NODES || Date.now() > ctx.until) v = -xo3Judge(s);
    else v = -xo3Search(s, depth - 1, -beta, -alpha, ply + 1, ctx);
    xo3Undo(s, i, gone);
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best === -Infinity ? 0 : best;
}

function xo3BestMove(x) {
  const s = { board: x.board.slice(), order: { X: x.order.X.slice(), O: x.order.O.slice() }, turn: x.turn };
  const empty = s.board.map((v, i) => (v ? -1 : i)).filter(i => i !== -1);
  const ctx = { nodes: 0, until: Date.now() + XO3_BUDGET_MS };
  const maxDepth = x.level === 'easy' ? 2 : 12;
  let choices = empty.slice();
  for (let depth = 1; depth <= maxDepth; depth++) {
    let best = -Infinity, pick = [];
    for (const i of empty) {
      const me = s.turn;
      const gone = xo3Apply(s, i);
      const v = xo3Lined(s.board, me) ? XO3_WIN : (depth === 1 ? -xo3Judge(s) : -xo3Search(s, depth - 1, -Infinity, Infinity, 1, ctx));
      xo3Undo(s, i, gone);
      if (v > best) { best = v; pick = [i]; }
      else if (v === best) pick.push(i);
    }
    // A depth cut short by the clock is not trusted over the last whole one.
    if (depth > 1 && (ctx.nodes > XO3_MAX_NODES || Date.now() > ctx.until)) break;
    choices = pick;
    if (best >= XO3_WIN - 20) break;       // a win found: take the quickest
  }
  return choices[Math.floor(Math.random() * choices.length)];
}

function paintXO() {
  const x = xoState();
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('xo-stage');
  if (!el) return;
  const nameOf = (m) => x.vs === 'phone' ? (m === x.human ? (t.xo_you || '') : (t.xo_phone || '')) : `${t.xo_player || ''} ${m}`;
  let status;
  if (x.phase === 'done') {
    status = x.winner === 'D' ? (t.xo_draw || '') : `🏆 ${nameOf(x.winner)}`;
  } else {
    status = x.vs === 'phone' && x.turn !== x.human ? (t.xo_thinking || '') : `${t.xo_turn || ''} ${nameOf(x.turn)}`;
  }
  // With 3 marks only: the mark this move will take off, faded for the side
  // about to move - never the other side's, which is theirs to remember.
  const leaving = {};
  if (x.rule3 && x.phase === 'play') { const o = x.order[x.turn] || []; if (o.length >= XO_KEEP) leaving[o[0]] = true; }
  const gone = xoGone;
  xoGone = null;
  el.innerHTML = `
    <div class="xo-tally">
      <div class="xo-tally__item xo-tally__item--x ${x.turn === 'X' && x.phase === 'play' ? 'is-turn' : ''}">
        <span>${escapeHTML(nameOf('X'))}</span><b class="metric">${x.scores.X}</b><small>X</small>
      </div>
      <div class="xo-tally__item"><span>${escapeHTML(t.xo_draws || '')}</span><b class="metric">${x.scores.D}</b><small>=</small></div>
      <div class="xo-tally__item xo-tally__item--o ${x.turn === 'O' && x.phase === 'play' ? 'is-turn' : ''}">
        <span>${escapeHTML(nameOf('O'))}</span><b class="metric">${x.scores.O}</b><small>O</small>
      </div>
    </div>
    <div class="xo-status ${x.phase === 'done' ? 'is-done' : ''}">${escapeHTML(status)}</div>
    ${x.rule3 && x.phase === 'play' ? `<p class="xo-rule">${escapeHTML(t.xo_three_play || '')}</p>` : ''}
    <div class="xo-board ${x.phase === 'done' ? 'is-done' : ''}">
      ${x.board.map((v, i) => `
        <button type="button" class="xo-cell ${v ? 'is-' + v.toLowerCase() : ''} ${x.line && x.line.indexOf(i) !== -1 ? 'is-win' : ''} ${leaving[i] ? 'is-leaving' : ''}"
                onclick="xoPlay(${i})" ${v || x.phase !== 'play' ? 'disabled' : ''} aria-label="${i + 1}">${v}${gone && gone.cell === i && !v
                  ? `<span class="xo-cell__gone is-${gone.mark.toLowerCase()}" aria-hidden="true">${gone.mark}</span>` : ''}</button>`).join('')}
    </div>
    <div class="view-actions">
      ${x.phase === 'done'
        ? `<button class="btn btn--primary btn--lg" onclick="xoNewRound()">${escapeHTML(t.xo_next_round || '')}</button>`
        : ''}
      <button class="btn btn--ghost btn--sm" onclick="setupXO()">${escapeHTML(t.exit || '')}</button>
    </div>`;
}

/** After a reload: the board as it was; the phone moves if it was its turn. */
function restoreXO() {
  const x = xoState();
  if (x.phase !== 'play' && x.phase !== 'done') return false;
  paintXO();
  xoMaybePhone();
  return true;
}

if (typeof onLanguageChange === 'function') {
  onLanguageChange(view => { if (view === 'play-xo') paintXO(); });
}
</script>
