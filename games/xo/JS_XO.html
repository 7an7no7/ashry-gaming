<script>
/* ============================================================================
   إكس أو — TIC TAC TOE
   ----------------------------------------------------------------------------
   Two on one phone, or one against the phone. The phone plays a full minimax
   on hard (it cannot be beaten, only drawn), choosing at random among its
   best moves so games differ, and throws in a random move a third of the
   time on easy, which is what lets a child win now and then.
   The board is in appState.xo, so a reload keeps the game and the tally.

   3 marks only (the owner, 22 Sep 2026: good players always draw): a switch
   on the setup, off by default. Each side keeps three marks on the board; a
   fourth takes the place of that side's oldest, which is shown faded on its
   owner's turn only - on the other side's turn it looks like any mark, so
   remembering the other side's oldest is part of the game (the owner) - and
   can't be played on (it is still there while you choose). Six marks
   never fill nine squares, so there is no draw and no limit: the game goes on
   until someone makes three in a row. A round keeps the rule it was dealt
   with (x.rule3), and x.order is each side's marks, oldest first.
   ========================================================================= */

// XO_LINES, XO_KEEP, xoWinner and xoMark are TicTacToe.js, shared with the rooms server.
let xoPhoneTimer = null;
let xoGone = null;          // the mark a move just took off, for its fade: { cell, mark }

function xoState() {
  if (!appState.xo) {
    appState.xo = { vs: 'phone', level: 'hard', board: Array(9).fill(''), turn: 'X', first: 'X', human: 'X',
                    phase: 'setup', winner: '', line: null, scores: { X: 0, O: 0, D: 0 }, three: false, size: 'normal' };
  }
  const x = appState.xo;
  if (!x.order) x.order = { X: [], O: [] };      // a game saved before the rule existed
  return x;
}

function setupXO() {
  const x = xoState();
  if (xoPhoneTimer) clearTimeout(xoPhoneTimer);
  x.phase = 'setup';
  saveToLocal();
  setView('setup-xo');
  paintXOSetup();
}

function paintXOSetup() {
  const x = xoState();
  document.querySelectorAll('#xo-vs .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === x.vs));
  document.querySelectorAll('#xo-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === x.level));
  document.querySelectorAll('#xo-side .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === x.human));
  const levelField = document.getElementById('xo-level-field');
  if (levelField) levelField.classList.toggle('hidden', x.vs !== 'phone');
  const sideField = document.getElementById('xo-side-field');
  if (sideField) sideField.classList.toggle('hidden', x.vs !== 'phone');
  const three = document.getElementById('xo-three');
  if (three) three.checked = !!x.three;
  // «المقاس: عادي / كبير» (2 Oct 2026): the 3-marks switch is the normal size's only.
  const big = x.size === 'big';
  document.querySelectorAll('#xo-size .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === (big ? 'big' : 'normal')));
  const threeField = document.getElementById('xo-three-field');
  if (threeField) threeField.classList.toggle('hidden', big);
  const tx = xoBigText();
  const setText = (id, v) => { const el = document.getElementById(id); if (el && el.textContent !== v) el.textContent = v; };
  setText('xo-size-label', tx.size_label);
  setText('xo-size-normal', tx.size_normal);
  setText('xo-size-big', tx.size_big);
  setText('xo-size-hint', tx.size_hint);
  const hint = document.getElementById('xo-size-hint');
  if (hint) hint.classList.toggle('hidden', !big);
}

function setXOOption(key, value) {
  xoState()[key] = value;
  saveToLocal();
  paintXOSetup();
}

/** A new match: the tally starts over. */
function startXO() {
  const x = xoState();
  x.scores = { X: 0, O: 0, D: 0 };
  x.first = 'X';
  xoNewRound();
}

/** The next round of the same match; the other side opens. */
function xoNewRound() {
  const x = xoState();
  if (xoPhoneTimer) clearTimeout(xoPhoneTimer);
  // A round keeps the size it was dealt (x.big): the setup changes the next one.
  x.big = x.size === 'big';
  if (x.big) {
    const g = xoBigNew();
    x.board = g.cells; x.minis = g.minis; x.send = g.send;
  } else {
    x.board = Array(9).fill('');
    delete x.minis; delete x.send;
  }
  x.took = null;
  x.roundId = Date.now().toString(36);
  x.order = { X: [], O: [] };
  x.hist = [];
  x.last = -1;
  x.seq = (x.seq || 0) + 1;
  x.rule3 = !!x.three && !x.big;
  xoGone = null;
  x.turn = x.first;
  x.winner = '';
  x.line = null;
  x.phase = 'play';
  saveToLocal();
  if (appState.currentView !== 'play-xo') setView('play-xo');
  paintXO();
  xoMaybePhone();
}

const xoOther = (m) => (m === 'X' ? 'O' : 'X');

function xoPlay(i) {
  const x = xoState();
  if (x.phase !== 'play' || x.board[i]) return;
  if (x.vs === 'phone' && x.turn !== x.human) return;
  xoPlace(i);
}

function xoPlace(i) {
  const x = xoState();
  if (x.phase !== 'play' || x.board[i]) return;
  if (x.big) { xoBigPlace(x, i); return; }
  xoSnapshot(x);
  // The fourth mark takes the place of this side's oldest (3 marks only).
  const placed = xoMark(x.board, x.order, x.rule3, i, x.turn);
  if (!placed) { x.hist.pop(); return; }
  x.last = i;
  x.seq = (x.seq || 0) + 1;
  if (placed.gone >= 0) xoGone = { cell: placed.gone, mark: x.turn };
  playSound('click');
  const result = xoWinner(x.board);
  if (result) {
    x.phase = 'done';
    x.winner = result.mark;
    x.line = result.line;
    x.scores[result.mark] = (x.scores[result.mark] || 0) + 1;
    x.first = xoOther(x.first);
    saveToLocal();
    paintXO();
    if (result.mark !== 'D' && (x.vs === 'friend' || result.mark === x.human)) {
      playSound('success');
      if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 60, origin: { y: 0.7 } });
    } else {
      playSound('tick');
    }
    return;
  }
  x.turn = xoOther(x.turn);
  saveToLocal();
  paintXO();
  xoMaybePhone();
}

function xoMaybePhone() {
  const x = xoState();
  if (x.vs !== 'phone' || x.phase !== 'play' || x.turn === x.human) return;
  if (xoPhoneTimer) clearTimeout(xoPhoneTimer);
  xoPhoneTimer = setTimeout(() => {
    xoPhoneTimer = null;
    // Not while its board is off screen (it plays when the board comes back),
    // nor on a game that has been replaced meanwhile.
    if (appState.currentView !== 'play-xo' || xoState() !== x) return;
    if (x.phase !== 'play' || x.turn === x.human) return;
    xoPlace(xoPhoneMove(x));
  }, 420);
}

// Leaving the board by the back arrow or a tab: the phone's move waits, as in
// كونكت ٤ and نقط ومربعات, and comes when the board is back.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    if (from === 'play-xo' && xoPhoneTimer) { clearTimeout(xoPhoneTimer); xoPhoneTimer = null; }
    if (to === 'play-xo') setTimeout(() => { if (appState.currentView === 'play-xo') xoMaybePhone(); }, 0);
  });
}

/*
 * On an empty board every move is a draw with perfect play, so the phone opens
 * without searching: the centre or a corner, at random (they leave a human the
 * most ways to go wrong). After that it searches, and picks at random among
 * the moves that score best, so the same game doesn't repeat move for move.
 */
const XO_OPENINGS = [4, 0, 2, 6, 8];

function xoPhoneMove(x) {
  if (x.big) return xoBigBestMove({ cells: x.board, minis: x.minis, send: x.send }, x.turn, x.level);
  const empty = x.board.map((v, i) => (v ? -1 : i)).filter(i => i !== -1);
  if (x.level === 'easy' && Math.random() < 0.35) return empty[Math.floor(Math.random() * empty.length)];
  if (empty.length === 9) return XO_OPENINGS[Math.floor(Math.random() * XO_OPENINGS.length)];
  if (x.rule3) return xo3BestMove(x);
  const me = x.turn;
  let best = -Infinity, choices = [];
  for (const i of empty) {
    x.board[i] = me;
    const score = xoMinimax(x.board, xoOther(me), me, 0);
    x.board[i] = '';
    if (score > best) { best = score; choices = [i]; }
    else if (score === best) choices.push(i);
  }
  return choices[Math.floor(Math.random() * choices.length)];
}

/* Positions already scored, so the second move (eight empty cells) is quick too. */
const XO_MEMO = new Map();

function xoMinimax(board, turn, me, depth) {
  const key = board.map(v => v || '-').join('') + turn + me + depth;
  if (XO_MEMO.has(key)) return XO_MEMO.get(key);
  const r = xoWinner(board);
  let result;
  if (r) {
    result = r.mark === 'D' ? 0 : (r.mark === me ? 10 - depth : depth - 10);
  } else {
    const scores = [];
    for (let i = 0; i < 9; i++) {
      if (board[i]) continue;
      board[i] = turn;
      scores.push(xoMinimax(board, xoOther(turn), me, depth + 1));
      board[i] = '';
    }
    result = turn === me ? Math.max(...scores) : Math.min(...scores);
  }
  XO_MEMO.set(key, result);
  return result;
}

/* --- The phone with 3 marks only -------------------------------------------
   The game has no end but a line, and the positions repeat, so there is no
   full minimax to run: a search a few moves deep (alpha-beta, deepened while
   the time lasts), and a judgement at the bottom that counts the lines each
   side could still finish - leaving out a side's oldest mark when it has three,
   since that one leaves on its owner's next move. Easy looks two moves ahead. */
const XO3_BUDGET_MS = 180;
const XO3_MAX_NODES = 120000;
const XO3_WIN = 1000;

function xo3Apply(s, i) {
  const me = s.turn;
  s.board[i] = me;
  s.order[me].push(i);
  let gone = -1;
  if (s.order[me].length > XO_KEEP) { gone = s.order[me].shift(); s.board[gone] = ''; }
  s.turn = xoOther(me);
  return gone;
}

function xo3Undo(s, i, gone) {
  s.turn = xoOther(s.turn);
  const me = s.turn;
  s.order[me].pop();
  s.board[i] = '';
  if (gone >= 0) { s.order[me].unshift(gone); s.board[gone] = me; }
}

const xo3Lined = (board, m) => XO_LINES.some(([a, b, c]) => board[a] === m && board[b] === m && board[c] === m);

/** How good the board is for the side to move. */
function xo3Judge(s) {
  const score = (m) => {
    const leaving = s.order[m].length >= XO_KEEP ? s.order[m][0] : -1;
    let v = 0;
    for (const line of XO_LINES) {
      let own = 0, other = false;
      for (const c of line) {
        if (s.board[c] === m && c !== leaving) own++;
        else if (s.board[c] && s.board[c] !== m) other = true;
      }
      if (!other) v += own === 2 ? 10 : own;
    }
    return v;
  };
  return score(s.turn) - score(xoOther(s.turn));
}

function xo3Search(s, depth, alpha, beta, ply, ctx) {
  ctx.nodes++;
  let best = -Infinity;
  for (let i = 0; i < 9; i++) {
    if (s.board[i]) continue;
    const me = s.turn;
    const gone = xo3Apply(s, i);
    let v;
    if (xo3Lined(s.board, me)) v = XO3_WIN - ply;
    else if (depth <= 1 || ctx.nodes > XO3_MAX_NODES || Date.now() > ctx.until) v = -xo3Judge(s);
    else v = -xo3Search(s, depth - 1, -beta, -alpha, ply + 1, ctx);
    xo3Undo(s, i, gone);
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best === -Infinity ? 0 : best;
}

function xo3BestMove(x) {
  const s = { board: x.board.slice(), order: { X: x.order.X.slice(), O: x.order.O.slice() }, turn: x.turn };
  const empty = s.board.map((v, i) => (v ? -1 : i)).filter(i => i !== -1);
  const ctx = { nodes: 0, until: Date.now() + XO3_BUDGET_MS };
  const maxDepth = x.level === 'easy' ? 2 : 12;
  let choices = empty.slice();
  for (let depth = 1; depth <= maxDepth; depth++) {
    let best = -Infinity, pick = [];
    for (const i of empty) {
      const me = s.turn;
      const gone = xo3Apply(s, i);
      const v = xo3Lined(s.board, me) ? XO3_WIN : (depth === 1 ? -xo3Judge(s) : -xo3Search(s, depth - 1, -Infinity, Infinity, 1, ctx));
      xo3Undo(s, i, gone);
      if (v > best) { best = v; pick = [i]; }
      else if (v === best) pick.push(i);
    }
    // A depth cut short by the clock is not trusted over the last whole one.
    if (depth > 1 && (ctx.nodes > XO3_MAX_NODES || Date.now() > ctx.until)) break;
    choices = pick;
    if (best >= XO3_WIN - 20) break;       // a win found: take the quickest
  }
  return choices[Math.floor(Math.random() * choices.length)];
}

/* The marks as drawn on this phone: ✕ in the blue team colour, ◯ in the red. */
const XO_GLYPH = { X: '✕', O: '◯' };
const xoGlyph = (m) => `<span class="xo-glyph is-${m.toLowerCase()}" aria-hidden="true">${XO_GLYPH[m] || ''}</span>`;

/**
 * The board as one card (the owner, 1 Oct 2026, from a before/after sheet):
 * the duel pills on top (duelPillsHtml, JS_Connect4.html: ✕ and ◯, the draws
 * in the middle), a 3×3 grid of thin lines, whose turn under it, and «رجّع» /
 * «خروج» as a quiet pair in the bar at the foot. On a phone on its side and a
 * big screen the card opens up: the board beside the pills and the turn.
 */
function paintXO() {
  const x = xoState();
  if (x.big) { paintXOBig(x); return; }
  const t = xoTr();
  const el = document.getElementById('xo-stage');
  if (!el) return;
  const nameOf = (m) => x.vs === 'phone' ? (m === x.human ? (t.xo_you || '') : (t.xo_phone || '')) : `${t.xo_player || ''} ${m === 'X' ? 1 : 2}`;
  const phoneTurn = x.vs === 'phone' && x.phase === 'play' && x.turn !== x.human;
  let status;
  if (x.phase === 'done') {
    status = escapeHTML(x.winner === 'D' ? (t.xo_draw || '') : `🏆 ${nameOf(x.winner)}`);
  } else if (phoneTurn) {
    status = escapeHTML(t.xo_thinking || '');
  } else {
    const line = x.vs === 'phone' ? (t.xo_turn_you || '{mark}') : (t.xo_turn_of || '{name}: {mark}').replace('{name}', duelIso(nameOf(x.turn)));
    status = escapeHTML(line).replace('{mark}', xoGlyph(x.turn));
  }
  // With 3 marks only: the mark this move will take off, faded for the side
  // about to move - never the other side's, which is theirs to remember.
  const leaving = {};
  if (x.rule3 && x.phase === 'play') { const o = x.order[x.turn] || []; if (o.length >= XO_KEEP) leaving[o[0]] = true; }
  const gone = xoGone;
  xoGone = null;
  // The mark just played lands, and a winning line lights, once each (a redraw
  // for the language or a reload doesn't play them again).
  const seq = x.seq || 0;
  const fresh = typeof x.last === 'number' && x.last >= 0 && x.board[x.last] && typeof motionFirst === 'function' && motionFirst('xo1|' + seq) ? x.last : -1;
  const lighting = x.phase === 'done' && !!x.line && typeof motionFirst === 'function' && motionFirst('xo1|' + seq + '|win');
  const canUndo = xoUndoAt(x) !== -1;
  const turnSeat = x.phase === 'play' ? (x.turn === 'X' ? 0 : 1) : -1;
  el.innerHTML = `
    <div class="xo-solo">
      <div class="card xo-solo__card">
        <div class="xo-solo__side">
          ${duelPillsHtml({
            players: [{ name: nameOf('X'), score: x.scores.X, mark: xoGlyph('X') }, { name: nameOf('O'), score: x.scores.O, mark: xoGlyph('O') }],
            turn: turnSeat,
            draws: x.scores.D || 0
          })}
          <p class="xo-solo__status ${x.phase === 'done' ? 'is-done' : ''} ${phoneTurn ? 'is-thinking' : ''}" aria-live="polite">${status}</p>
          ${x.rule3 && x.phase === 'play' ? `<p class="xo-rule">${escapeHTML(t.xo_three_play || '')}</p>` : ''}
        </div>
        <div class="xo-solo__board">
          <div class="xo-board xo-board--lines ${x.phase === 'done' ? 'is-done' : ''} ${lighting ? 'is-lighting' : ''}" dir="ltr">
            ${x.board.map((v, i) => {
              const k = x.line ? x.line.indexOf(i) : -1;
              const cls = [v ? 'is-' + v.toLowerCase() : '', k !== -1 ? 'is-win' : '', leaving[i] ? 'is-leaving' : '', fresh === i ? 'is-new' : ''].join(' ');
              return `<button type="button" class="xo-cell ${cls}" style="--k:${Math.max(0, k)}"
                      onclick="xoPlay(${i})" ${v || x.phase !== 'play' ? 'disabled' : ''} aria-label="${i + 1}${v ? ' ' + v : ''}">${v ? `<span class="xo-cell__mark">${XO_GLYPH[v]}</span>` : ''}${gone && gone.cell === i && !v
                        ? `<span class="xo-cell__gone is-${gone.mark.toLowerCase()}" aria-hidden="true">${XO_GLYPH[gone.mark]}</span>` : ''}</button>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="view-actions talk__actions xo-solo__actions">
        ${x.phase === 'done'
          ? `<button class="btn btn--primary btn--go btn--lg" onclick="xoNewRound()">${escapeHTML(t.xo_next_round || '')}</button>`
          : ''}
        <div class="talk__pair">
          ${x.phase === 'play' ? `<button class="btn btn--ghost btn--sm" onclick="xoUndo()" ${canUndo ? '' : 'disabled'}>↶ ${escapeHTML(t.xo_undo || '')}</button>` : ''}
          <button class="btn btn--ghost btn--sm" onclick="${x.phase === 'done' ? 'setupXO()' : 'playExit(setupXO)'}">${escapeHTML(t.exit || '')}</button>
        </div>
      </div>
    </div>`;
  duelPillsAfter(el, 'xo-local', { turn: turnSeat, scores: [x.scores.X || 0, x.scores.O || 0] });
}

/* --- رجّع: takes back the last move; against the phone, your move and its answer --- */
const XO_HIST_MAX = 60;

function xoSnapshot(x) {
  if (!Array.isArray(x.hist)) x.hist = [];
  x.hist.push({ board: x.board.slice(), order: { X: x.order.X.slice(), O: x.order.O.slice() }, turn: x.turn, last: typeof x.last === 'number' ? x.last : -1,
                minis: x.big ? x.minis.slice() : undefined, send: x.big ? x.send : undefined });
  if (x.hist.length > XO_HIST_MAX) x.hist.splice(0, x.hist.length - XO_HIST_MAX);
}

/** Where an undo goes back to in x.hist, or -1 (nothing to take back, or the round is over). */
function xoUndoAt(x) {
  if (x.phase !== 'play' || !Array.isArray(x.hist) || !x.hist.length) return -1;
  if (x.vs !== 'phone') return x.hist.length - 1;
  for (let i = x.hist.length - 1; i >= 0; i--) if (x.hist[i].turn === x.human) return i;
  return -1;
}

function xoUndo() {
  const x = xoState();
  const at = xoUndoAt(x);
  if (at === -1) return;
  if (xoPhoneTimer) { clearTimeout(xoPhoneTimer); xoPhoneTimer = null; }
  const snap = x.hist[at];
  x.hist.length = at;
  x.board = snap.board.slice();
  x.order = { X: snap.order.X.slice(), O: snap.order.O.slice() };
  x.turn = snap.turn;
  if (x.big && Array.isArray(snap.minis)) { x.minis = snap.minis.slice(); x.send = snap.send; }
  x.took = null;
  x.last = -1;
  x.seq = (x.seq || 0) + 1;
  xoGone = null;
  saveToLocal();
  paintXO();
  xoMaybePhone();
}

/** After a reload: the board as it was; the phone moves if it was its turn. */
function restoreXO() {
  const x = xoState();
  if (x.phase !== 'play' && x.phase !== 'done') return false;
  paintXO();
  xoMaybePhone();
  return true;
}

/* ============================================================================
   «إكس أو الكبير» - nine boards in one (the owner, 2 Oct 2026)
   ----------------------------------------------------------------------------
   The rules are TicTacToe.js (xoBigMark, xoBigWinner, xoBigBestMove), the
   same the room judges with. The look is «تسع كروت» (look أ of the owner's
   sheet): nine small boards as cards; the board the side to move was sent to
   grows a little and lights in the screen's accent while the rest fade;
   sent to a won or full board («play anywhere») every open board gets a
   dashed, pulsing outline; a won board gets a big stamped ✕ / ◯; a mark is
   drawn with a pen stroke; and a line under the turn says where you were
   sent by the place's name («فوق يمين»). This file's text is XOB_TEXT, kept
   in the game's own chunk (the shell's budget is full). The room's phones and
   the TV draw the same board (JS_RoomXO.html).
   ========================================================================= */
const XOB_TEXT = {
  ar: {
    size_label: 'المقاس', size_normal: 'عادي', size_big: 'كبير',
    size_hint: 'تسع لوحات في لوحة: المربع اللي بتلعبه بيبعت اللي قصادك للوحة اللي في مكانه. اللي يكسب ٣ لوحات على خط يكسب.',
    places: ['فوق شمال', 'فوق في النص', 'فوق يمين', 'النص شمال', 'النص', 'النص يمين', 'تحت شمال', 'تحت في النص', 'تحت يمين'],
    sent: 'اتبعت للوحة {place}', any: 'العب في أي لوحة منورة',
    took: '{mark} كسب لوحة {place}!', drawn: 'لوحة {place} اتملت تعادل',
    boards: 'لوحات', rule_line: '٣ لوحات على خط تكسب',
    end_boards: 'مفيش خط ممكن تاني: الأكتر لوحات كسب', end_boards_draw: 'مفيش خط ممكن تاني، واللوحات متعادلة',
    more_boards: 'لوحات أكتر',
    teach: 'المربع اللي بتلعبه بيبعت اللي قصادك للوحة اللي في نفس مكانه، والسهم بيوريك فين.'
  },
  en: {
    size_label: 'Size', size_normal: 'Normal', size_big: 'Big',
    size_hint: 'Nine boards in one: the square you play sends your opponent to the board in that place. Win three boards in a row.',
    places: ['top-left', 'top', 'top-right', 'left', 'middle', 'right', 'bottom-left', 'bottom', 'bottom-right'],
    sent: 'Sent to the {place} board', any: 'Play in any lit board',
    took: '{mark} took the {place} board!', drawn: 'The {place} board filled up: a draw',
    boards: 'Boards', rule_line: 'Three boards in a row win',
    end_boards: 'No line left: most boards wins', end_boards_draw: 'No line left, and the boards are even',
    more_boards: 'more boards',
    teach: 'The square you play sends your opponent to the board in the same place: the arrow shows where.'
  }
};
const xoBigText = () => XOB_TEXT[appState.lang] || XOB_TEXT.ar;

/* The game's own lines, read only by this chunk (JS_XO, JS_RoomXO): kept here, out of
   TRANSLATIONS, since the shell's budget is full (notes/lazy-load.md). xoTr() is
   TRANSLATIONS with these on top, so the code still reads t.xo_*. */
const XO_TR = {
  ar: { xo_three_play: "3 علامات بس: العلامة الباهتة هتختفي مع حركتك", xo_player: "لاعب", xo_draw: "تعادل", xo_turn_you: "الدور عليك: {mark}", xo_turn_of: "الدور على {name}: {mark}", xo_undo: "رجّع", xo_next_round: "جولة جديدة", xo_rule_label: "القواعد", xo_rule_classic: "عادي", xo_rule_three: "3 علامات بس" },
  en: { xo_three_play: "3 marks only: the faded mark goes with this move", xo_player: "Player", xo_draw: "Draw", xo_turn_you: "Your turn: {mark}", xo_turn_of: "{name}'s turn: {mark}", xo_undo: "Undo", xo_next_round: "Next round", xo_rule_label: "Rules", xo_rule_classic: "Classic", xo_rule_three: "3 marks only" }
};
const xoTrCache = {};
function xoTr() {
  const l = appState.lang;
  return xoTrCache[l] || (xoTrCache[l] = Object.assign(Object.create(TRANSLATIONS[l] || {}), XO_TR[l] || XO_TR.ar));
}

/* A mark drawn with a pen: two strokes for ✕, one round for ◯ (stroke-dashoffset on .is-new). */
const XOB_PEN = {
  X: '<svg class="xob-g is-x" viewBox="0 0 100 100" aria-hidden="true"><path pathLength="100" d="M26 26L74 74"/><path pathLength="100" d="M74 26L26 74"/></svg>',
  O: '<svg class="xob-g is-o" viewBox="0 0 100 100" aria-hidden="true"><circle pathLength="100" cx="50" cy="50" r="27" transform="rotate(-90 50 50)"/></svg>'
};
const xoPen = (m) => XOB_PEN[m] || '';

/**
 * The nine boards. g: { cells, minis, send, phase, win }.
 * o: { playable, tap (the handler's name), last, fresh (the square to draw
 * with the pen), stamp (the board whose stamp lands now), lighting }.
 */
function xoBigBoardHtml(g, o) {
  o = o || {};
  const over = g.phase === 'over' || g.phase === 'done';
  const any = !over && !(g.send >= 0);
  const legal = o.playable && !over ? new Set(xoBigLegal({ cells: g.cells, minis: g.minis, send: g.send })) : null;
  const win = g.win || [];
  const tx = xoBigText();
  const boards = (g.minis || []).map((r, b) => {
    const k = win.indexOf(b);
    const won = r === 'X' || r === 'O';
    const cls = ['xob-b', !over && g.send === b ? 'is-target' : '', !over && !r ? 'is-open' : '',
      won ? 'is-won is-' + r.toLowerCase() : '', r === 'D' ? 'is-drawn' : '', k !== -1 ? 'is-win' : ''].join(' ');
    let cells = '';
    for (let i = 0; i < 9; i++) {
      const at = b * 9 + i;
      const v = g.cells[at];
      const can = !!legal && legal.has(at);
      cells += `<button type="button" class="xob-cell ${at === o.last ? 'is-last' : ''} ${at === o.fresh ? 'is-new' : ''}" ${can && o.tap ? `onclick="${o.tap}(${at})"` : ''} ${can ? '' : 'disabled'} aria-label="${escapeHTML(tx.places[b])} ${i + 1}${v ? ' ' + v : ''}">${v ? xoPen(v) : ''}</button>`;
    }
    const stamp = won ? `<span class="xob-stamp ${o.stamp === b ? 'is-new' : ''}" aria-hidden="true">${xoPen(r)}</span>` : '';
    return `<div class="${cls}" style="--k:${Math.max(0, k)}">${cells}${stamp}</div>`;
  }).join('');
  return `<div class="xob ${over ? 'is-done' : (any ? 'is-any' : 'has-target')} ${o.lighting ? 'is-lighting' : ''}" dir="ltr">${boards}</div>`;
}

/**
 * The line under the turn: a board just taken, then where the side to move
 * was sent («اتبعت للوحة فوق يمين») or «العب في أي لوحة منورة». `took` is
 * { board, mark } for the move just made, or null; `markHtml(m)` draws a mark.
 */
function xoBigWhereHtml(send, took, markHtml) {
  const tx = xoBigText();
  const parts = [];
  if (took && (took.mark === 'X' || took.mark === 'O')) {
    parts.push(escapeHTML(tx.took.replace('{place}', tx.places[took.board] || '')).replace('{mark}', markHtml(took.mark)));
  } else if (took && took.mark === 'D') {
    parts.push(escapeHTML(tx.drawn.replace('{place}', tx.places[took.board] || '')));
  }
  parts.push(escapeHTML(send >= 0 ? tx.sent.replace('{place}', tx.places[send] || '') : tx.any));
  return `<p class="xob-where ${send >= 0 ? '' : 'is-any'} ${took ? 'is-took' : ''}" aria-live="polite">${parts.join(' · ')}</p>`;
}

/* --- The send arrow (the owner's pick of 7 Oct 2026) ---------------------------------------
   After a move on the big board a short arrow travels from the square just played to the
   board it sends the other side to (transform and opacity only, over the page so a board
   redrawn under it doesn't cut it short); the line under the turn names the place. The first
   few big games on a phone also say the rule in a line (xoBigTeachHtml). */
const XOB_TEACH_GAMES = 3;

/** The arrow from square `at` to board `send`, once per `key`; nothing with the motion off or no board to send to. */
function xoBigSendArrow(root, at, send, key) {
  if (!root || !(send >= 0) || !(at >= 0) || typeof motionFirst !== 'function' || !motionFirst('xobarrow|' + key)) return;
  if (motionOff() || !document.body || !document.body.animate) return;
  const view = (root.closest && root.closest('[id^="view-"]')) || root;
  requestAnimationFrame(() => {
    const xob = view.querySelector('.xob');
    const boards = xob ? xob.querySelectorAll('.xob-b') : [];
    const fromBoard = boards[Math.floor(at / 9)];
    const cell = fromBoard && fromBoard.querySelectorAll('.xob-cell')[at % 9];
    const to = boards[send];
    if (!cell || !to) return;
    const a = cell.getBoundingClientRect(), b = to.getBoundingClientRect();
    if (!a.width || !b.width) return;
    const x1 = a.left + a.width / 2, y1 = a.top + a.height / 2;
    const x2 = b.left + b.width / 2, y2 = b.top + b.height / 2;
    const el = document.createElement('div');
    el.setAttribute('aria-hidden', 'true');
    el.style.setProperty('--xob-c', getComputedStyle(to).getPropertyValue('--accent') || 'currentColor');
    const len = Math.hypot(x2 - x1, y2 - y1) - b.width * 0.18;
    let anim;
    if (len < a.width * 1.5) {
      // Sent to the board it was played in: that board rings instead.
      el.className = 'xob-ring';
      el.style.left = b.left + 'px'; el.style.top = b.top + 'px';
      el.style.width = b.width + 'px'; el.style.height = b.height + 'px';
      document.body.appendChild(el);
      anim = el.animate([
        { transform: 'scale(0.85)', opacity: 0 }, { transform: 'scale(1.04)', opacity: 1, offset: 0.4 },
        { transform: 'scale(1.04)', opacity: 1, offset: 0.7 }, { transform: 'scale(1.1)', opacity: 0 }
      ], { duration: 1000, easing: 'ease-out', fill: 'both' });
    } else {
      const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
      el.className = 'xob-arrow';
      el.style.left = x1 + 'px'; el.style.top = y1 + 'px'; el.style.width = len + 'px';
      document.body.appendChild(el);
      anim = el.animate([
        { transform: `rotate(${ang}deg) scaleX(0)`, opacity: 0 },
        { transform: `rotate(${ang}deg) scaleX(1)`, opacity: 1, offset: 0.45 },
        { transform: `rotate(${ang}deg) scaleX(1)`, opacity: 1, offset: 0.75 },
        { transform: `rotate(${ang}deg) scaleX(1)`, opacity: 0 }
      ], { duration: 1050, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'both' });
    }
    if (anim) anim.onfinish = () => el.remove();
    setTimeout(() => el.remove(), 1400);
  });
}

/**
 * The rule in one line under the place, for this phone's first XOB_TEACH_GAMES big
 * games (counted once per game, `dealKey`, kept with the game's other choices).
 */
function xoBigTeachHtml(dealKey) {
  const x = xoState();
  if (dealKey && x.bigTaughtKey !== dealKey) {
    x.bigTaughtKey = dealKey;
    x.bigTaught = (Number(x.bigTaught) || 0) + 1;
    saveToLocal();
  }
  return (Number(x.bigTaught) || 0) <= XOB_TEACH_GAMES ? `<p class="field__hint xob-teach">💡 ${escapeHTML(xoBigText().teach)}</p>` : '';
}

/** A mark on the big board, on one phone (xoPlace hands it here). */
function xoBigPlace(x, at) {
  xoSnapshot(x);
  const g = { cells: x.board, minis: x.minis, send: x.send };
  const r = xoBigMark(g, at, x.turn);
  if (!r) { x.hist.pop(); return; }
  x.send = g.send;
  x.last = at;
  x.seq = (x.seq || 0) + 1;
  x.took = r.took ? { board: r.board, mark: r.took, seq: x.seq } : null;
  playSound('click');
  const result = r.took ? xoBigWinner(x.minis) : null;
  if (result) {
    x.phase = 'done';
    x.winner = result.mark;
    x.line = result.line;
    x.byBoards = !!result.boards;
    x.scores[result.mark] = (x.scores[result.mark] || 0) + 1;
    x.first = xoOther(x.first);
    saveToLocal();
    paintXO();
    if (result.mark !== 'D' && (x.vs === 'friend' || result.mark === x.human)) {
      playSound('success');
      if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 60, origin: { y: 0.7 } });
    } else {
      playSound('tick');
    }
    return;
  }
  x.byBoards = false;
  x.turn = xoOther(x.turn);
  saveToLocal();
  paintXO();
  xoMaybePhone();
}

/** The big board on one phone: the same card as the normal size (paintXO), the nine boards in it. */
function paintXOBig(x) {
  const t = xoTr();
  const tx = xoBigText();
  const el = document.getElementById('xo-stage');
  if (!el) return;
  const nameOf = (m) => x.vs === 'phone' ? (m === x.human ? (t.xo_you || '') : (t.xo_phone || '')) : `${t.xo_player || ''} ${m === 'X' ? 1 : 2}`;
  const phoneTurn = x.vs === 'phone' && x.phase === 'play' && x.turn !== x.human;
  let status;
  if (x.phase === 'done') {
    status = escapeHTML(x.winner === 'D' ? (t.xo_draw || '') : `🏆 ${nameOf(x.winner)}`);
  } else if (phoneTurn) {
    status = escapeHTML(t.xo_thinking || '');
  } else {
    const line = x.vs === 'phone' ? (t.xo_turn_you || '{mark}') : (t.xo_turn_of || '{name}: {mark}').replace('{name}', duelIso(nameOf(x.turn)));
    status = escapeHTML(line).replace('{mark}', xoGlyph(x.turn));
  }
  const seq = x.seq || 0;
  const took = x.took && x.took.seq === seq ? x.took : null;
  const fresh = typeof x.last === 'number' && x.last >= 0 && x.board[x.last] && typeof motionFirst === 'function' && motionFirst('xob1|' + seq) ? x.last : -1;
  const stamp = took && (took.mark === 'X' || took.mark === 'O') && typeof motionFirst === 'function' && motionFirst('xob1|' + seq + '|stamp') ? took.board : -1;
  const lighting = x.phase === 'done' && !!x.line && typeof motionFirst === 'function' && motionFirst('xob1|' + seq + '|win');
  const where = x.phase === 'play' ? xoBigWhereHtml(x.send, took, xoGlyph) + xoBigTeachHtml('p|' + (x.roundId || ''))
    : (x.byBoards ? `<p class="xob-where">${escapeHTML(x.winner === 'D' ? tx.end_boards_draw : tx.end_boards)}</p>` : '');
  const count = xoBigCount(x.minis);
  const canUndo = xoUndoAt(x) !== -1;
  const turnSeat = x.phase === 'play' ? (x.turn === 'X' ? 0 : 1) : -1;
  const myTurn = x.phase === 'play' && !phoneTurn;
  el.innerHTML = `
    <div class="xo-solo xo-solo--big">
      <div class="card xo-solo__card">
        <div class="xo-solo__side">
          ${duelPillsHtml({
            players: [
              { name: nameOf('X'), score: x.scores.X, mark: xoGlyph('X'), sub: escapeHTML(tx.boards + ' ' + count.X) },
              { name: nameOf('O'), score: x.scores.O, mark: xoGlyph('O'), sub: escapeHTML(tx.boards + ' ' + count.O) }
            ],
            turn: turnSeat,
            draws: x.scores.D || 0
          })}
          <p class="xo-solo__status ${x.phase === 'done' ? 'is-done' : ''} ${phoneTurn ? 'is-thinking' : ''}" aria-live="polite">${status}</p>
          ${where}
        </div>
        <div class="xo-solo__board">
          ${xoBigBoardHtml({ cells: x.board, minis: x.minis, send: x.send, phase: x.phase, win: x.line || [] },
            { playable: myTurn, tap: 'xoPlay', last: x.last, fresh: fresh, stamp: stamp, lighting: lighting })}
        </div>
      </div>
      <div class="view-actions talk__actions xo-solo__actions">
        ${x.phase === 'done'
          ? `<button class="btn btn--primary btn--go btn--lg" onclick="xoNewRound()">${escapeHTML(t.xo_next_round || '')}</button>`
          : ''}
        <div class="talk__pair">
          ${x.phase === 'play' ? `<button class="btn btn--ghost btn--sm" onclick="xoUndo()" ${canUndo ? '' : 'disabled'}>↶ ${escapeHTML(t.xo_undo || '')}</button>` : ''}
          <button class="btn btn--ghost btn--sm" onclick="${x.phase === 'done' ? 'setupXO()' : 'playExit(setupXO)'}">${escapeHTML(t.exit || '')}</button>
        </div>
      </div>
    </div>`;
  duelPillsAfter(el, 'xo-local', { turn: turnSeat, scores: [x.scores.X || 0, x.scores.O || 0] });
  if (x.phase === 'play' && typeof x.last === 'number' && x.last >= 0 && x.send >= 0) xoBigSendArrow(el, x.last, x.send, 'p|' + (x.roundId || '') + '|' + seq);
}

if (typeof onLanguageChange === 'function') {
  onLanguageChange(view => { if (view === 'play-xo') paintXO(); });
}
</script>
