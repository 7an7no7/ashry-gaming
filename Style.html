/* --- The frame --- */
.skr-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1); margin-bottom: var(--sp-3); }
.skr-layout { display: flex; flex-direction: column; }
.skr-layout__table, .skr-layout__side { min-width: 0; }

/* --- Slots: a numbered place for one card --- */
.skr-slots { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 3px; min-width: 0; }
.skr-slot {
  position: relative;
  flex: none;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
  margin: 0;
  padding: 3px 2px 2px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: inherit;
  font-family: var(--font);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: opacity var(--dur-2) var(--ease-out);
}
.skr-slot__card { position: relative; display: block; transition: transform var(--dur-2) var(--ease-out); }
/* Seat layout أ: the slot's number printed under its card, centred. */
.skr-slot__n {
  display: block;
  margin-top: 2px;
  color: var(--text-2);
  font-size: 0.625rem;
  line-height: 1.1;
  letter-spacing: 0;
}
.skr-slot__badge {
  position: absolute;
  inset-block-start: -2px;
  inset-inline-end: -3px;
  padding: 0 3px;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  font-size: 0.625rem;
  line-height: 1.35;
  white-space: nowrap;
}
.skr-slot.is-target .skr-card { box-shadow: 0 0 0 2px var(--accent), var(--sh-2); }
.skr-slot.is-picked .skr-slot__card { transform: translateY(-4px); }
.skr-slot.is-picked .skr-card { box-shadow: 0 0 0 3px var(--accent), 0 8px 16px -6px var(--accent-glow); }
.skr-slot.is-dim { opacity: 0.45; }
.skr-slot.is-memo .skr-card { box-shadow: 0 0 0 2px var(--warning), var(--sh-2); }
.skr-slot.is-looking .skr-card { box-shadow: 0 0 0 3px var(--warning), 0 8px 16px -6px var(--accent-glow); }
.skr-slot__eye { position: absolute; inset-block-start: -0.55rem; inset-inline: 0; width: max-content; margin-inline: auto; font-size: 0.9rem; line-height: 1; }

/* --- The other players: compact seats, a grid of two from three of them --- */
.skr-opps { display: grid; grid-template-columns: repeat(var(--skr-cols, 1), minmax(0, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-3); }
.skr-opps--grid { --skr-cols: 2; }
/* Two seats a row leave each seat just enough for four cards: the slots give
   up their side padding, or rounding pushed the fourth card onto a line of
   its own. */
.skr-opps--grid .skr-slots { gap: 2px; }
.skr-opps--grid .skr-slot { padding-inline: 1px; }
/* A hand that doesn't fit one row (skrStackHands): even rows, 2 over 2 or 3
   over 3, and an odd card beside them, centred. */
.skr-slots.is-stacked { display: grid; grid-template-columns: repeat(var(--skr-stack-cols, 2), auto); justify-content: center; align-items: start; }
.skr-slots.is-stacked.is-odd { grid-template-columns: repeat(var(--skr-stack-cols, 2), auto) auto; }
.skr-slots.is-stacked.is-odd > .skr-slot:last-child { grid-column: -2 / -1; grid-row: 1 / span 2; align-self: center; }
.skr-seat {
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--sp-1) var(--sp-2) var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.skr-seat__who {
  min-width: 0;
  min-height: 1.5rem;
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 0;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-strong);
  font-family: var(--font);
  text-align: start;
  cursor: default;
}
.skr-seat__name { flex: 1 1 auto; min-width: 0; overflow: hidden; font-size: var(--fs-sm); font-weight: 800; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.skr-seat__tags { flex: none; font-size: var(--fs-xs); line-height: 1.2; white-space: nowrap; }
.skr-seat__empty { padding: var(--sp-2); color: var(--text-3); }
.skr-seat__head { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
/* The last move under a name, with the memory helper: one line, cut short rather than wrapped. */
.skr-seat__last { display: block; min-width: 0; overflow: hidden; color: var(--text-2); font-size: 0.6875rem; font-weight: 700; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.skr-seat .skr-slots { justify-content: center; }
.skr-seat__tags { margin-inline-start: auto; }
.skr-avatar {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #f5c451;
  color: #3b2a05;
  font-size: 0.75rem;
  font-weight: 900;
  line-height: 1;
}
.skr-avatar--0 { background: var(--team-blue); color: #fff; }
.skr-avatar--1 { background: var(--team-red); color: #fff; }
.skr-seat.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px -10px var(--accent-glow); }
.skr-seat.is-away { opacity: 0.6; }
.skr-seat.is-target, .skr-seat.is-picked { border-color: var(--accent); }
.skr-seat.is-picked { box-shadow: 0 0 0 2px var(--accent); }
.skr-seat.is-target .skr-seat__who, .skr-seat.is-picked .skr-seat__who {
  min-height: var(--tap);
  padding-inline: var(--sp-2);
  background: var(--accent-soft);
  color: var(--accent-ink);
  cursor: pointer;
}
.skr-seat.skr-team--0, .skr-mine.skr-team--0, .skr-rrow.skr-team--0 { border-inline-start: 4px solid var(--team-blue); }
.skr-seat.skr-team--1, .skr-mine.skr-team--1, .skr-rrow.skr-team--1 { border-inline-start: 4px solid var(--team-red); }
.skr-dot { display: inline-block; flex: none; width: 0.55rem; height: 0.55rem; margin-inline-end: 0.3rem; border-radius: 50%; vertical-align: 0.05em; }
.skr-dot--0 { background: var(--team-blue); }
.skr-dot--1 { background: var(--team-red); }

/* --- The middle: the deck, the pile, the card in the turn's hand --- */
.skr-center {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: var(--sp-5);
  margin-bottom: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-xl);
  background: var(--accent-soft);
}
.skr-zone { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.skr-zone__card { position: relative; display: block; }
.skr-zone__label { max-width: 6.5rem; overflow: hidden; color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
.skr-count {
  position: absolute;
  inset-inline: 0;
  inset-block-end: -0.4rem;
  width: max-content;
  min-width: 1.5rem;
  margin-inline: auto;
  padding: 0.1rem 0.35rem;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  color: var(--text-strong);
  font-size: var(--fs-xs);
  text-align: center;
}
.skr-pile { position: relative; display: block; }
.skr-pile__under { position: absolute; inset: 0; opacity: 0.85; transform: rotate(-9deg) translateX(-12%); }
.skr-pile__top { position: relative; display: block; }
.skr-zone--held.is-mine .skr-card { box-shadow: 0 0 0 3px var(--accent), 0 10px 24px -8px var(--accent-glow); }

/* --- Your hand --- */
.skr-mine {
  position: relative;
  margin-bottom: var(--sp-3);
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
}
.skr-mine.is-turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 28px -14px var(--accent-glow); }
.skr-mine__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-2); margin-bottom: var(--sp-2); }
.skr-mine__title { color: var(--text-strong); font-size: var(--fs-sm); font-weight: 900; }
.skr-slots--mine {
  --skr-mine-w: clamp(2.75rem, calc((min(100vw, var(--shell-max)) - 4.5rem) / var(--count, 4) - 0.5rem), 4.5rem);
  justify-content: center;
  gap: 6px;
}
.skr-slots--mine .skr-card { --skr-w: var(--skr-mine-w); }
/* A slot is as wide as its card: a mark under it ("🔄 اتبدّل مع …") wraps to
   two lines rather than widening the slot, which pushed the fourth card of a
   375px phone onto a row of its own. */
.skr-slots--mine .skr-slot { min-width: var(--tap); width: calc(var(--skr-mine-w) + 0.25rem); padding-top: var(--sp-1); }
.skr-slots--mine .skr-slot__n { margin-top: 4px; font-size: var(--fs-xs); font-weight: 800; }
.skr-slot__mark {
  display: -webkit-box;
  max-width: 100%;
  margin-top: 2px;
  overflow: hidden;
  color: var(--text-2);
  font-size: 0.625rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

/* --- What to do now: a bar that stays at the foot of the screen on your move --- */
.skr-actbar {
  position: sticky;
  bottom: var(--sp-2);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-4);
  /* Twelve names and a hand to pick from can outgrow a phone: the bar scrolls inside itself. */
  max-height: calc(var(--app-h, 100dvh) - 10rem);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.skr-note { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-2) var(--sp-3); text-align: center; }
.skr-note .btn { width: auto; }
.skr-prompt { margin: 0; color: var(--text-strong); font-size: var(--fs-h3); font-weight: 900; line-height: 1.35; text-align: center; }
.skr-prompt.is-mine { color: var(--accent-ink); }
.skr-power { display: flex; align-items: center; justify-content: center; margin-bottom: 2px; color: var(--text-strong); font-size: var(--fs-h2); }
.skr-prompt > .skr-power { display: inline-flex; margin: 0; vertical-align: middle; font-size: 1em; }
.skr-hint--power { display: flex; align-items: center; justify-content: center; }
.skr-choices .btn .skr-chip { font-size: 1rem; }
.skr-hint { margin: 0; color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; line-height: 1.4; text-align: center; }
.skr-summary { margin: 0; padding: var(--sp-2); border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; text-align: center; overflow-wrap: anywhere; }
.skr-rule { width: 100%; height: 1px; margin: 0; border: 0; background: var(--hairline); }
.skr-actgrid, .skr-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.skr-actgrid .btn, .skr-choices .btn { padding-inline: var(--sp-2); line-height: 1.2; }
.skr-pong { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2); border-radius: var(--r-md); background: var(--warning-soft); }
.skr-seen { display: flex; flex-direction: column; gap: var(--sp-2); }
.skr-seen__cards { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-3); }
.skr-seen__item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; text-align: center; }
.skr-khoshaf { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.skr-pickcard {
  min-width: var(--tap);
  padding: 3px;
  border: 2px solid transparent;
  border-radius: var(--r-md);
  background: transparent;
  cursor: pointer;
  transition: transform var(--dur-2) var(--ease-out);
}
.skr-pickcard.is-picked { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }

/* --- The log --- */
.skr-logbox { margin-bottom: var(--sp-3); }
.skr-log { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.skr-log li { padding: 0.4rem 0.7rem; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); font-size: var(--fs-sm); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }

/* --- Flights, signs, landings --- */
.skr-ghost { position: fixed; left: 0; top: 0; z-index: var(--z-fx-ghost); pointer-events: none; transform-origin: center; will-change: transform; }
.skr-ghost__flip { position: relative; width: 100%; height: 100%; will-change: transform; }
.skr-ghost__face { position: absolute; inset: 0; }
.skr-ghost__face--b { opacity: 0; }
.skr-ghost__shake { position: relative; width: 100%; height: 100%; }
.skr-ghost .skr-card { box-shadow: var(--sh-3); }
.skr-hold { visibility: hidden; }
.skr-landed { animation: skr-land 380ms cubic-bezier(0.2, 1.4, 0.35, 1); }
@keyframes skr-land { 0% { transform: scale(0.9); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.skr-pop {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-pop);
  padding: 0.1em 0.45em;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-3);
  color: var(--text-strong);
  font-size: 1.25rem;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}
.skr-pop--big { background: transparent; box-shadow: none; font-size: 2.25rem; }
body.is-tv-view .skr-pop { font-size: 5vmin; }
body.is-tv-view .skr-pop--big { font-size: 9vmin; }

/* --- The lobby --- */
.skr-editions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.skr-edition {
  min-width: 0;
  min-height: 4.25rem;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
  color: var(--text);
  font-family: var(--font);
  text-align: start;
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease-out), background-color var(--dur-2) var(--ease-out);
}
.skr-edition.is-active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.skr-edition__head { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-strong); font-size: var(--fs-sm); font-weight: 900; }
.skr-edition__icon { font-size: 1.35rem; line-height: 1; }
.skr-edition__line { color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; line-height: 1.35; }
.skr-addons .field__label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.skr-addon__cards { color: var(--text-3); font-size: var(--fs-xs); font-weight: 600; }

/* --- The reveal --- */
.skr-reveal { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.skr-rrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "who total" "cards cards";
  align-items: center;
  gap: 4px var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
}
.skr-rrow.is-lowest { border-color: var(--success); box-shadow: 0 0 0 1px var(--success); }
.skr-rrow__who { grid-area: who; min-width: 0; display: flex; align-items: center; gap: var(--sp-1); }
.skr-rrow__name { min-width: 0; overflow: hidden; color: var(--text-strong); font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
.skr-rrow__tags { flex: none; }
.skr-rrow__total { grid-area: total; display: flex; align-items: center; gap: var(--sp-1); }
.skr-rrow__total .metric { font-size: 1.35rem; }
.skr-rrow__cards { grid-area: cards; display: flex; flex-wrap: wrap; gap: 4px; }
.skr-lines { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--sp-3); }
.skr-lines p { margin: 0; padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); color: var(--text); font-size: var(--fs-sm); font-weight: 700; text-align: center; }
.skr-flip { position: relative; display: inline-block; }
.skr-flip__face { display: block; }
.skr-flip__back { position: absolute; inset: 0; }
.is-revealing .skr-flip__back { animation: skr-flip-back 420ms linear both; animation-delay: var(--at, 0ms); }
.is-revealing .skr-flip__face { animation: skr-flip-face 420ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
.is-revealing .skr-late, .skr-lines.skr-late { animation: skr-late 320ms var(--ease-out) both; animation-delay: var(--late, 0ms); }
@keyframes skr-flip-back { 0% { transform: scaleX(1); } 45% { transform: scaleX(0); } 100% { transform: scaleX(0); visibility: hidden; } }
@keyframes skr-flip-face { 0%, 45% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@keyframes skr-late { from { opacity: 0; transform: scale(0.6); } }
.skr-over .podium { margin-top: var(--sp-2); }
.skr--result > .skr-prompt { margin-bottom: var(--sp-3); }
.skr-lastround { margin-bottom: var(--sp-3); }
.skr-lastround > summary { min-height: var(--tap); display: flex; align-items: center; justify-content: center; color: var(--text-2); font-weight: 800; cursor: pointer; }

/* --- The thief vote: every seated phone points at a player or at "no thief" --- */
.skr-vote__choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); gap: var(--sp-2); }
.skr-vote__choices .btn { min-width: 0; padding: var(--sp-1) var(--sp-2); line-height: 1.2; overflow-wrap: anywhere; }
.skr-vote.is-sent > .btn { width: auto; align-self: center; }
.skr-vote__who { overflow-wrap: anywhere; }

/* --- The reveal starts with the thief: the votes as bars, then a card that
   lies face down (.spy-reveal) until the accused's bar has risen:
   --skr-cover-at holds the whole turn back by that long --- */
.skr-thief { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.skr-thief__card { min-height: 6.5rem; display: flex; flex-direction: column; justify-content: center; gap: 4px; text-align: center; }
.skr-thief__card.spy-reveal { animation-delay: calc(var(--skr-cover-at, 0ms) + 1100ms); }
.skr-thief__card .spy-reveal__cover, .skr-thief__card .spy-reveal__q { animation-delay: var(--skr-cover-at, 0ms); }
.skr-thief__head { margin: 0; font-size: var(--fs-h3); font-weight: 900; line-height: 1.35; overflow-wrap: anywhere; }
/* A life jacket shows what it counted as under it; an emptied hand says so. */
.skr-rcard { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.skr-rcard__val { color: var(--accent-ink); font-size: var(--fs-xs); font-weight: 900; line-height: 1; white-space: nowrap; }
.skr-rrow__none { padding-block: var(--sp-1); color: var(--text-2); font-size: var(--fs-sm); font-weight: 800; }

/* --- What just happened: the latest move at the top of the table --- */
.skr-latest {
  margin: 0 0 var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-sm);
  font-weight: 800;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
}
.skr-latest.is-new { animation: skr-latest-in 380ms var(--ease-out) both; }
@keyframes skr-latest-in { from { opacity: 0; transform: translateY(-0.4rem) scale(0.98); } }

/* --- A move's glow: the slots, seats and pile it touched, for a few seconds,
   with a sign (🔄, ⬆️ 2, 👁️ and the looker). The animation carries on where it
   was when a redraw draws it again (--skr-flash-at, a negative delay). --- */
.skr-slot.is-flash .skr-slot__card::after,
.skr-seat.is-flash::after,
.skr-mine.is-flash::after,
.skr-zone--pile.is-flash .skr-pile__top::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: var(--r-sm);
  box-shadow: 0 0 0 2px var(--warning), 0 0 14px 2px color-mix(in srgb, var(--warning) 55%, transparent);
  pointer-events: none;
  opacity: 0;
  animation: skr-flash-glow 3000ms ease-out both;
  animation-delay: var(--skr-flash-at, 0ms);
}
.skr-seat.is-flash::after, .skr-mine.is-flash::after { border-radius: inherit; box-shadow: 0 0 0 2px var(--warning); }
@keyframes skr-flash-glow { 0% { opacity: 0; } 8% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
.skr-flash {
  position: absolute;
  z-index: 3;
  inset-block-start: -0.55rem;
  inset-inline: 0;
  width: max-content;
  max-width: 8rem;
  margin-inline: auto;
  padding: 0.05rem 0.4rem;
  overflow: hidden;
  border: 1px solid var(--warning);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-2);
  color: var(--text-strong);
  font-size: 0.625rem;
  font-weight: 900;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
  animation: skr-flash-sign 3000ms ease-out both;
  animation-delay: var(--skr-flash-at, 0ms);
}
@keyframes skr-flash-sign { 0% { opacity: 0; transform: translateY(0.3rem) scale(0.7); } 8% { opacity: 1; transform: none; } 75% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
.skr-slots--mine .skr-flash { max-width: 100%; }

/* --- The vote: a soft spotlight sweeps over the seats while the votes come in --- */
.skr-opps, .skr-tv__side { position: relative; }
.skr.is-voting .skr-opps::after, .skr-tv.is-voting .skr-tv__side::after {
  content: '';
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  width: 45%;
  border-radius: var(--r-xl);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--warning) 24%, transparent), transparent);
  pointer-events: none;
  animation: skr-spotlight 3.4s ease-in-out infinite alternate;
}
[dir="rtl"] .skr.is-voting .skr-opps::after, [dir="rtl"] .skr-tv.is-voting .skr-tv__side::after { animation-name: skr-spotlight-rtl; }
@keyframes skr-spotlight { from { transform: translateX(0); } to { transform: translateX(122%); } }
@keyframes skr-spotlight-rtl { from { transform: translateX(0); } to { transform: translateX(-122%); } }
.skr-voted { color: var(--success-ink); font-weight: 900; }
/* بوم: the phones picking a card of their own get the bar in the danger colour. */
.skr-actbar.skr-boom { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger), var(--sh-4); }

/* --- Picking someone else's card, in the bar: the names, then that player's cards big --- */
.skr-pickrow { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.skr-pickrow__label { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); color: var(--text-2); font-size: var(--fs-xs); font-weight: 800; }
.skr-targets { display: flex; gap: var(--sp-2); padding: 2px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scrollbar-width: none; }
.skr-targets::-webkit-scrollbar { display: none; }
.skr-target {
  flex: none;
  max-width: 10rem;
  min-height: var(--tap);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
  scroll-snap-align: start;
}
.skr-target__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skr-target__sign { flex: none; color: var(--text-2); font-size: var(--fs-xs); }
.skr-target.is-focus { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); box-shadow: 0 0 0 1px var(--accent); }
.skr-target.is-done .skr-target__sign { color: var(--success-ink); font-weight: 900; }
.skr-target:disabled { opacity: 0.45; cursor: default; }
.skr-pickslots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.skr-pickslots .skr-slot { min-width: var(--tap); min-height: var(--tap); padding: 0.45rem 3px 2px; }
.skr-pickslots .skr-slot__n { margin-top: 3px; }

/* --- The countdown over your two cards, when the look is timed --- */
.skr-memo-timer { position: absolute; z-index: 2; inset-block-start: -0.9rem; inset-inline-end: 0.5rem; width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: 50%; background: var(--surface-solid); box-shadow: var(--sh-2); pointer-events: none; }
.skr-memo-timer__ring { position: absolute; inset: 2px; border: 3px solid var(--warning); border-inline-end-color: transparent; border-radius: 50%; animation: skr-spin 1s linear infinite; }
.skr-memo-timer .metric { color: var(--warning-ink); font-size: 1.05rem; }
.skr-memo-bar { display: block; height: 4px; margin-top: var(--sp-2); border-radius: 2px; background: var(--warning); transform-origin: left center; animation-name: skr-memo-bar; animation-timing-function: linear; animation-fill-mode: both; }
[dir="rtl"] .skr-memo-bar { transform-origin: right center; }
@keyframes skr-memo-bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes skr-spin { to { transform: rotate(1turn); } }

/* --- The layers the moves draw over the page (JS_RoomScrew.html, the flights) --- */
.skr-sign { position: fixed; left: 0; top: 0; z-index: var(--z-fx-pop); font-size: 1.6rem; line-height: 1; pointer-events: none; will-change: transform; }
.skr-sign--big { font-size: 2.4rem; }
.skr-ring { position: fixed; z-index: var(--z-fx-ghost); border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.skr-ring--danger { border-color: var(--danger); }
.skr-ring--success { border-color: var(--success); }
.skr-spark { position: fixed; left: 0; top: 0; z-index: var(--z-fx-pop); color: var(--warning); font-size: 0.9rem; line-height: 1; pointer-events: none; }
.skr-spark--danger { color: var(--danger); }
.skr-stamp {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-stamp);
  padding: 0 0.3em;
  border: 3px solid currentColor;
  border-radius: 0.3em;
  background: var(--surface-solid);
  color: var(--accent-ink);
  font-size: 1.8rem;
  font-weight: 900;
  line-height: 1.15;
  white-space: nowrap;
  pointer-events: none;
  direction: ltr;
  unicode-bidi: isolate;
}
.skr-stamp--danger { color: var(--danger-ink); }
.skr-band {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-stamp);
  padding: 0.5rem 1.2rem;
  overflow: hidden;
  border-radius: var(--r-full);
  background: var(--accent);
  box-shadow: var(--sh-4);
  color: var(--accent-on);
  font-size: var(--fs-h3);
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
}
.skr-band--danger { background: var(--danger-btn); color: var(--danger-on); }
.skr-band--success { background: var(--success-btn); color: var(--success-on); }
.skr-sweep {
  position: fixed;
  z-index: var(--z-fx-ghost);
  border-radius: var(--r-md);
  background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--warning) 45%, transparent) 50%, transparent 80%);
  pointer-events: none;
}
.skr-sweep--lock { background: linear-gradient(100deg, transparent 25%, color-mix(in srgb, var(--accent) 40%, transparent) 50%, transparent 75%); }
.skr-link { position: fixed; z-index: var(--z-fx-pop); border-radius: 2px; background: var(--success); transform-origin: left center; pointer-events: none; }
.skr-sign.is-tv { font-size: 5vmin; }
.skr-sign--big.is-tv { font-size: 8vmin; }
.skr-spark.is-tv { font-size: 2.6vmin; }
.skr-ring.is-tv { border-width: 0.6vmin; }
.skr-stamp.is-tv { font-size: 7vmin; }
.skr-band.is-tv { padding: 1.2vmin 3vmin; font-size: var(--tv-md); }

/* --- The reveal's moments: a life jacket's value, the 0 of the round's winner --- */
.skr-rcard.is-copy .skr-rcard__val { display: inline-flex; align-items: baseline; gap: 3px; }
.skr-rcard__was { color: var(--text-3); text-decoration: line-through; }
.is-revealing .skr-rcard__was { animation: skr-was 360ms ease-out both; animation-delay: calc(var(--late, 0ms) + 450ms); }
.is-revealing .skr-rcard__now { display: inline-block; animation: skr-now 380ms cubic-bezier(0.2, 1.4, 0.35, 1) both; animation-delay: calc(var(--late, 0ms) + 450ms); }
@keyframes skr-was { to { opacity: 0.35; } }
@keyframes skr-now { from { opacity: 0; transform: scale(1.8); } }
.is-revealing .skr-rrow__total .badge--success.skr-late { animation: skr-stamp-in 460ms cubic-bezier(0.2, 1.4, 0.35, 1) both; animation-delay: var(--late, 0ms); }
@keyframes skr-stamp-in { from { opacity: 0; transform: scale(2.4) rotate(-10deg); } }

/* --- A phone held upright: the middle and the bar tighter, so the table, your
   hand and the bar fit a 375×812 screen with nothing under the bar --- */
@media (orientation: portrait) and (max-width: 599px) {
  .skr-center { gap: var(--sp-4); margin-bottom: var(--sp-2); padding-block: var(--sp-1); }
  /* 58px: just over the size where a card keeps its corners and name band, so the pile says what it is. */
  .skr-center .skr-card--lg { --skr-w: 3.625rem; }
  .skr-mine { margin-bottom: var(--sp-2); }
  .skr-actbar { gap: var(--sp-1); padding: var(--sp-2) var(--sp-3); }
  .skr-actbar .skr-prompt { font-size: var(--fs-body); }
}

/* --- A phone on its side, and every wide screen: the table beside your hand --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .skr-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
  .skr-slots--mine { --skr-mine-w: clamp(2.75rem, calc((42vw - 4rem) / var(--count, 4) - 0.5rem), 4.5rem); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .skr-head { margin-bottom: var(--sp-2); }
  .skr-opps { gap: 6px; margin-bottom: var(--sp-2); }
  .skr-center { gap: var(--sp-3); margin-bottom: var(--sp-2); padding-block: var(--sp-1); }
  .skr-center .skr-card--lg { --skr-w: 2.75rem; }
  .skr-center .skr-card--md { --skr-w: 2.125rem; }
  .skr-mine { margin-bottom: var(--sp-2); padding: var(--sp-1) var(--sp-2) var(--sp-2); }
  .skr-mine__head { margin-bottom: 2px; }
  .skr-slots--mine { --skr-mine-w: clamp(2.75rem, min(calc((42vw - 4rem) / var(--count, 4) - 0.5rem), calc((var(--app-h, 100vh) - 17rem) / 1.4)), 4rem); }
  .skr-actbar { gap: var(--sp-1); padding: var(--sp-2); }
  .skr-seen .skr-card--lg, .skr-khoshaf .skr-card--lg { --skr-w: 2.75rem; }
  .skr-vote .skr-vote__rule { display: none; }
  .skr-latest { margin-bottom: var(--sp-1); padding-block: var(--sp-1); }
  .skr-actbar { max-height: calc(var(--app-h, 100dvh) - 4rem); }
  .skr-thief__card { min-height: 5.5rem; }
  /* The table's column is narrow on its side: up to four opponents take a row
     each, so a hand of four stays on one line; five or more keep two columns
     with the smallest cards. */
  .skr-opps--grid:not(:has(> .skr-seat:nth-child(5))) { --skr-cols: 1; }
  .skr-opps--grid:has(> .skr-seat:nth-child(5)) .skr-card--sm { --skr-w: 1.5rem; }
  /* The bar over a hand only 331px tall: one line of prompt, smaller buttons,
     no hint, so the hand stays in sight above it. */
  .skr-actbar .skr-prompt { font-size: var(--fs-sm); line-height: 1.3; }
  .skr-actbar .skr-hint { display: none; }
  .skr-actbar .btn { min-height: 2.5rem; font-size: var(--fs-sm); }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-screw { max-width: 72rem; }
  .skr-layout { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--sp-5); }
  .skr-opps .skr-card--sm { --skr-w: 2.375rem; }
  .skr-opps .skr-card--md { --skr-w: 3rem; }
  .skr-slots--mine { --skr-mine-w: clamp(3rem, calc((min(100vw, 72rem) * 0.4 - 4rem) / var(--count, 4) - 0.6rem), 5rem); }
  .skr--result .skr-reveal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* --- The TV: seats down both sides, the middle of the table between them --- */
.skr-tv {
  /* A seat's height: the name line and the number line (about 10vmin with padding) plus a card 1.42 wide. */
  --skr-tv-w: min(8.5vmin, calc(((var(--app-h, 100vh) - 20vmin) / var(--rows, 3) - 10vmin) / 1.45), 5.2vw);
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1fr);
  gap: var(--tv-gap);
}
.skr-tv__side { min-height: 0; display: grid; grid-template-rows: repeat(var(--rows, 3), minmax(0, 1fr)); gap: var(--tv-gap); }
.skr-tv .skr-seat { justify-content: center; gap: 0.6vmin; padding: 0.8vmin 1.2vmin; border-radius: var(--tv-r); }
.skr-tv .skr-seat--pad { visibility: hidden; }
.skr-tv .skr-seat__who { min-height: 0; }
.skr-tv .skr-seat__name { font-size: var(--tv-sm); }
.skr-tv .skr-seat__tags { font-size: var(--tv-xs); }
.skr-tv .skr-slots { flex-wrap: nowrap; gap: 0.8vmin; }
.skr-tv .skr-slot { padding: 0.3vmin 0.2vmin 0; cursor: default; }
.skr-tv .skr-seat .skr-card { --skr-w: var(--skr-tv-w); }
.skr-tv .skr-seat--many .skr-card { --skr-w: calc(var(--skr-tv-w) * 0.78); }
.skr-tv .skr-slot__n { margin-top: 0.2vmin; font-size: 1.5vmin; }
.skr-tv .skr-avatar { width: 2.8vmin; height: 2.8vmin; font-size: 1.5vmin; }
.skr-tv .skr-slot__badge { font-size: 1.6vmin; }
.skr-tv__mid { min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: var(--tv-gap); overflow: hidden; text-align: center; }
.skr-tv .skr-head { margin: 0; }
.skr-tv .badge, .skr-tvres .badge { height: auto; padding: 0.25em 0.7em; font-size: var(--tv-xs); }
.skr-tv__turn { color: var(--text-strong); font-size: var(--tv-md); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
.skr-tv .skr-center { margin: 0; gap: 2.4vmin; padding: 1.6vmin; border-radius: var(--tv-r); }
.skr-tv .skr-center .skr-card--md { --skr-w: 8vmin; }
.skr-tv .skr-center .skr-card--lg { --skr-w: 10.5vmin; }
.skr-tv .skr-zone__label { max-width: 16vmin; font-size: var(--tv-xs); }
.skr-tv .skr-count { font-size: var(--tv-xs); }
.skr-tv__host:empty { display: none; }
.skr-tv .tv-actions:not(:has(.btn)) { display: none; }
.skr-tv .skr-logbox { min-height: 0; margin: 0; overflow: hidden; text-align: start; }
.skr-tv .skr-logbox .eyebrow { font-size: var(--tv-xs); }
.skr-tv .skr-log li { padding: 0.5vmin 1vmin; font-size: var(--tv-xs); }
.skr-tvres { min-height: 100%; display: flex; flex-direction: column; justify-content: safe center; gap: var(--tv-gap); }
.skr-reveal--tv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tv-gap); margin: 0; }
.skr-reveal--tv:has(> :nth-child(7)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.skr-reveal--tv .skr-rrow { padding: 1vmin 1.6vmin; border-radius: var(--tv-r); }
.skr-reveal--tv .skr-rrow__name { font-size: var(--tv-sm); }
.skr-reveal--tv .skr-rrow__total .metric { font-size: var(--tv-md); }
.skr-reveal--tv .skr-card { --skr-w: 6vmin; }
.skr-reveal--tv:has(> :nth-child(7)) .skr-card { --skr-w: 4.6vmin; }
.skr-tvres .skr-lines { margin: 0; }
.skr-tvres .skr-lines p { padding: 0.6vmin 1.2vmin; font-size: var(--tv-xs); }
.skr-tvover { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: calc(var(--tv-gap) * 2); }
.skr-tvover__cards { min-width: 0; }
.skr-tvover__side { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: var(--tv-gap); }
.skr-tvover__side > .tv-scale { width: 100%; }
.skr-tvover .skr-lines { margin-top: var(--tv-gap); }
.skr-tvover .skr-lines p { padding: 0.6vmin 1.2vmin; font-size: var(--tv-xs); }
.skr-board__teams { margin-bottom: var(--sp-2); }
.skr-thief--tv { gap: var(--tv-gap); margin: 0; }
.skr-thief--tv .skr-thief__card { min-height: 13vmin; gap: 0.6vmin; padding: 1vmin 1.6vmin; border-radius: var(--tv-r); }
.skr-thief--tv .skr-thief__head { font-size: var(--tv-sm); }
.skr-thief--tv .skr-hint { font-size: var(--tv-xs); }
.skr-thief--tv .spy-reveal__q { font-size: 6vmin; }
.skr-thief--tv .spy-reveal__label { font-size: var(--tv-sm); }
.skr-thief__pairs { margin: 0.4vmin 0 0; }
.skr-reveal--tv .skr-rcard__val { font-size: var(--tv-xs); }
.skr-reveal--tv .skr-rrow__none { font-size: var(--tv-xs); }
.skr-tv .skr-latest { margin: 0; padding: 0.8vmin 1.6vmin; border-radius: var(--tv-r); font-size: var(--tv-sm); }
.skr-tv .skr-seat__who { gap: 0.8vmin; }
.skr-tv .skr-seat__last { flex: 0 1 auto; max-width: 55%; font-size: var(--tv-xs); }
.skr-tv .skr-flash { max-width: 18vmin; font-size: 1.6vmin; border-width: 0.2vmin; }
.skr-tv__count { color: var(--warning-ink); font-size: 12vmin; line-height: 1; }
/* Twelve seats down two sides of 1280×720: smaller cards and tighter seats, the signs still readable. */
.skr-tv--many { --skr-tv-w: min(8.5vmin, calc(((var(--app-h, 100vh) - 20vmin) / var(--rows, 3) - 8vmin) / 1.45), 4.4vw); }
.skr-tv--many .skr-seat { gap: 0.3vmin; padding: 0.4vmin 1vmin; }
.skr-tv--many .skr-slot__n { font-size: 1.3vmin; }
.skr-tv--many .skr-avatar { width: 2.4vmin; height: 2.4vmin; font-size: 1.3vmin; }
.skr-tv--many .skr-tv__mid { gap: calc(var(--tv-gap) * 0.6); }
.skr-tv--many .tv-strip-inline .tv-chip { padding: 0.15em 0.6em; }
/* A phone mirrored upright: one column, and the stage scrolls. */
@media (orientation: portrait) {
  .skr-tv { height: auto; grid-template-columns: minmax(0, 1fr); }
  .skr-tv__side { grid-template-rows: none; }
  .skr-tv .skr-seat--pad { display: none; }
  .skr-reveal--tv, .skr-reveal--tv:has(> :nth-child(7)) { grid-template-columns: minmax(0, 1fr); }
  .skr-tvover { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .skr-landed, .is-revealing .skr-flip__face, .is-revealing .skr-late, .skr-lines.skr-late { animation: none; }
  .is-revealing .skr-flip__back { display: none; }
  .skr-slot, .skr-slot__card, .skr-seat, .skr-edition, .skr-pickcard { transition: none; }
  .skr-latest.is-new, .skr-flash, .is-revealing .skr-rcard__was, .is-revealing .skr-rcard__now, .is-revealing .skr-rrow__total .badge--success.skr-late { animation: none; }
  .skr-slot.is-flash .skr-slot__card::after, .skr-seat.is-flash::after, .skr-mine.is-flash::after, .skr-zone--pile.is-flash .skr-pile__top::after { animation: none; opacity: 1; }
  .skr.is-voting .skr-opps::after, .skr-tv.is-voting .skr-tv__side::after, .skr-memo-timer__ring { animation: none; }
  .skr-memo-bar { display: none; }
}

/* ==========================================================================
   17. ONE VOICE (20 Sep 2026)
   --------------------------------------------------------------------------
   A pass over the pieces every screen is built from, so lifting one screen
   lifts all of them. Four things were true everywhere and none of them was
   a bug, which is why they survived: the app had no type weight under 600,
   so nothing could read as emphatic; the only colour on a card was its
   emoji, so nine sections of white boxes looked like one long list; the
   selected state was near-black in light and pure white in dark, a third
   colour system answering to nothing; and every surface pressed with the
   same scale whether it was a 44px chip or a 150px card.

   Everything here is a refinement of a component defined earlier in this
   file - no new markup, no new class on any element that did not already
   carry it. Sizes, spacing and tap targets are untouched.
   ========================================================================== */

/* --- The display face --------------------------------------------------------
   Baloo Bhaijaan 2 carries the things that name a screen. It was already
   loaded for سكرو's card numerals, it sets Arabic and Latin from one file,
   and its rounded warmth is what a party app should sound like next to
   Cairo's neutral reading voice. Deliberately NOT on .metric: clocks and
   scores need Cairo's tabular figures, or a counting timer jitters. */
.shell__title,
.section__title,
.sheet__title,
.home-hero__title,
.tab-hero__title,
.game-hero__title,
.gcard__title,
.tool-name,
.podium__name,
.modal-content .sheet__title {
  font-family: var(--font-display);
  /* Baloo's 800 has the colour Cairo's 900 had; 900 in a rounded face fills
     its own counters at title sizes. */
  font-weight: var(--fw-bold);
}
/* Arabic in a rounded display face sits a little tight by default. */
html[lang="ar"] .gcard__title,
html[lang="ar"] .section__title,
html[lang="ar"] .tool-name { line-height: 1.35; }

/* --- A floor as well as a ceiling ---------------------------------------------
   Secondary text steps down to 400/500 so the titles above it can be read as
   titles. Colours are left exactly as they were - each one was measured
   against its background - so nothing here moves a contrast ratio. */
.gcard__desc,
.tool-desc,
.game-hero__desc,
.tab-hero__sub,
.home-hero__sub { font-weight: var(--fw-body); }
.gcard__meta,
.game-hero__meta,
.setting-row__hint { font-weight: var(--fw-med); }
.empty { font-weight: var(--fw-body); }

/* --- A card carries its game's colour, in one corner ---------------------------
   The note on .gcard is right that thirty tinted cards made the home a
   rainbow. The answer is not "no colour at all" but the corner wash the
   setup heroes have used all along: a low-percentage bloom behind the icon
   and nowhere else, so a section reads as a family at a glance and a card
   still reads as white paper. color-mix keeps one strength across all eight
   palettes and both themes; where it is missing the card is simply plain. */
:root      { --wash-x: 0%; }
[dir="rtl"] { --wash-x: 100%; }
.gcard, .tool-item {
  background-image: radial-gradient(10rem 6.5rem at var(--wash-x) 0%,
                    color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%);
}
body.dark .gcard, body.dark .tool-item {
  background-image: radial-gradient(10rem 6.5rem at var(--wash-x) 0%,
                    color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
}
/* The halo behind an icon was --accent-soft, which in light is within two
   values of white and read as nothing at all. */
.gcard__icon, .tool-icon, .game-hero__icon, .tab-hero__icon,
.help-game-card__icon, .help-hero__icon {
  background: radial-gradient(circle at 50% 55%,
              color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 68%);
}

/* --- One selected colour ------------------------------------------------------
   The active chip was --text-strong: a black pill in light, a white pill in
   dark - the brightest thing on a night screen, brighter than the brand, and
   answering to no other colour in the app. Selection is the screen's accent
   now, which is the violet of the home, the teal of مع بعض and the indigo of
   الأدوات - the same system every other component already obeys. */
.filter-chip.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-on);
  box-shadow: 0 6px 14px -8px var(--accent-glow);
}

/* --- The game's own icon owns the card ----------------------------------------
   The three mode glyphs are the same on nearly every card, so they carry
   almost no information per card - and in full colour at the opposite corner
   they were the loudest thing on it after the icon, with 📱 and 📲
   indistinguishable at 0.8rem anyway. Quiet ink; the meaning is unchanged and
   the tooltip and aria-label were always the real answer. */
.gcard__modes { filter: grayscale(1); opacity: 0.4; }
body.dark .gcard__modes { opacity: 0.5; }

/* --- A press is proportional to what is pressed -------------------------------
   Every surface shrank by the same 4-5%, which on a 150px card is a lurch and
   on a 44px chip is barely there. Big surfaces move less. */
.gcard:active, .game-card:active, .tool-item:active, .setting-row:active,
.daily-strip:active { transform: scale(0.98); }
.together__tile:active { transform: scale(0.955); }
.filter-chip:active, .recent-tile:active, .home-hero__pick:active { transform: scale(0.93); }

/* --- Section heads read as headings, not as table rows ------------------------
   A flat hairline running to the edge of the screen is the most templated
   mark in the file. It fades away from the title instead, which reads as air
   rather than as a border. */
.section__rule { background: linear-gradient(to right, var(--hairline), transparent); }
[dir="rtl"] .section__rule { background: linear-gradient(to left, var(--hairline), transparent); }
.section__emoji { font-size: 1.1rem; }

/* --- Nothing found -------------------------------------------------------------
   One grey line was all a search with no results got. */
.empty__icon { font-size: 2rem; opacity: 0.5; }

/* --- Filtering rearranges; it does not redraw ----------------------------------
   flipGrid in JS_Motion.html measures, lets the filter hide and show what it
   likes, then runs the survivors from where they were to where they are and
   fades the newcomers in - transform and opacity, on the compositor. The only
   thing it needs from the stylesheet is that a card is not mid-transition
   while it is being animated. */
.is-flipping .gcard, .is-flipping .tool-item, .is-flipping .recent-tile,
.is-flipping .section__head { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  .gcard:active, .game-card:active, .tool-item:active, .setting-row:active,
  .daily-strip:active, .together__tile:active, .filter-chip:active,
  .recent-tile:active, .home-hero__pick:active { transform: none; }
}

/* --- The first screen is for the games ----------------------------------------
   Measured before this: the first game card began 570px into a 690px scroll
   area, so 83% of what you saw on opening the app was chrome. Two things gave
   way, neither of them a control and neither of them a tap target.

   1. A phone that has played before has been told what the app is, and the
      mark and the name are in the header on this screen anyway - so its hero
      is the ways in and nothing else, with اختارلنا as the fourth, since a
      returner is exactly who wants it. A first visit still gets the whole
      hero. */
.home-hero--compact { padding: var(--sp-3); }
.home-hero--compact .together { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
.home-hero--compact .together__tile {
  flex-direction: column;
  justify-content: center;
  min-height: var(--tap);
  gap: 1px;
  padding: var(--sp-1) 2px;
}
.home-hero--compact .together__icon { font-size: 1.05rem; margin: 0; }
.home-hero--compact .together__name { font-size: 0.68rem; line-height: 1.15; text-wrap: balance; }
.home-hero--compact .together__desc { display: none; }

/* 2. together/apart and the eight player counts were a second scrolling row
      stacked straight on the first, and neither row announces that it
      scrolls. They fold behind one chip at the end of the first row, which
      costs no height at all when closed. The chip says what it is hiding, so
      a filter left on from last time is never a mystery.
      .filter-row sets display:flex, which beats [hidden] - so say it. */
.filter-row[hidden] { display: none; }
/* The chip has to stay put: at the end of a row that scrolls it was simply
   off the screen, which is worse than the row it replaced. The modes keep
   scrolling and bleeding to the start edge; the chip is pinned at the end. */
.filter-bar { display: flex; align-items: center; gap: var(--sp-2); }
.filter-bar .filter-row { flex: 1; min-width: 0; margin-inline-end: 0; }
.filter-bar .filter-chip--more { flex: none; }
.filter-chip--more::after {
  content: '▾';
  font-size: 0.85em;
  line-height: 1;
  opacity: 0.75;
  transition: transform var(--dur-2) var(--ease-out);
}
.filter-chip--more[aria-expanded="true"]::after { transform: rotate(180deg); }
.filter-chip--more .metric { font-size: inherit; color: inherit; letter-spacing: 0; }

@media (prefers-reduced-motion: reduce) {
  .filter-chip--more::after { transition: none; }
}

/* --- Every size, not just the phone ---------------------------------------------
   The returning hero was built and checked on a phone, where it is right, and
   broke everywhere wider. The wide layout makes .home-hero a two-column grid
   (head | ways in); with the head gone for a returner the ways in fell into
   the first column and the second - 1.25fr, most of the bar on a laptop - sat
   empty. A survey of all 133 views at six sizes found it, along with the other
   phone shapes stretched onto big screens below. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .home-hero--compact { display: block; }
}
/* How much the four ways in can say depends on the hero's own width, not the
   screen's - a tablet upright and a laptop both pass a 700px media query, and
   only one of them has room for a line under each name (the first try used
   the screen and wrapped every tile to three lines at 768px). So the hero is
   a container and the tiles read its width:
     - a phone upright: the icon over the name, as the owner has it;
     - from 34rem (a phone on its side, a tablet upright): the icon beside the
       name, one line, the same height;
     - from 52rem (a laptop, a TV): the icon beside the name and its line.
   Where container queries are missing the phone's tiles fill the width,
   which is where this started and still reads fine. */
.home-hero--compact .together { container-type: inline-size; }
@container (min-width: 34rem) {
  .home-hero--compact .together__tile {
    flex-direction: row;
    justify-content: center;
    gap: var(--sp-2);
    padding: var(--sp-1) var(--sp-3);
  }
  .home-hero--compact .together__icon { font-size: 1.25rem; }
  .home-hero--compact .together__name { font-size: var(--fs-sm); }
}
@container (min-width: 52rem) {
  .home-hero--compact .together__tile {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas: "icon name" "icon desc";
    align-items: center;
    justify-items: start;
    column-gap: var(--sp-3);
    row-gap: 1px;
    min-height: 4.25rem;
    padding: var(--sp-2) var(--sp-4);
    text-align: start;
  }
  .home-hero--compact .together__icon { grid-area: icon; font-size: 1.75rem; }
  .home-hero--compact .together__name { grid-area: name; align-self: end; font-size: var(--fs-body); line-height: 1.2; }
  .home-hero--compact .together__desc { grid-area: desc; align-self: start; display: block; font-size: var(--fs-xs); line-height: 1.3; }
}

/* The ▾ chip belongs to the row it opens. Pinned to the far end it was
   right on a phone, where the modes scroll and the end is a thumb away, and a
   600px hole on a laptop, where they all fit. Taking its content's width and
   only shrinking when it has to, the row is the same on a phone and the chip
   sits beside the last mode everywhere else. */
.filter-bar .filter-row { flex: 0 1 auto; }

/* The share link was a fourth button in a three-column grid, so on anything
   wide it sat alone under the first. It is the quiet action; it gets its own
   centred line. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .together-actions > .btn--ghost { grid-column: 1 / -1; justify-self: center; width: auto; padding-inline: var(--sp-5); }
}

/* --- A section of one game is a spotlight --------------------------------------
   ورق وطاولة holds سكرو alone since the card scorers became tools: one card
   and, on a TV, five empty places beside it. The owner calls سكرو the core of
   the app, so the lone card becomes the widest thing on the home - the icon
   big, its line, players and minutes and the ways it plays, and a play pill.
   Any section left with one game gets the same (catalogSpotlight). */
.gcard-grid > .gcard--spotlight { grid-column: 1 / -1; }
.gcard--spotlight {
  flex-direction: row;
  align-items: center;
  gap: var(--sp-4);
  min-height: 0;
  padding: var(--sp-4);
  background-image: radial-gradient(26rem 10rem at var(--wash-x) 0%,
                    color-mix(in srgb, var(--accent) 13%, transparent), transparent 72%);
}
body.dark .gcard--spotlight {
  background-image: radial-gradient(26rem 10rem at var(--wash-x) 0%,
                    color-mix(in srgb, var(--accent) 22%, transparent), transparent 72%);
}
.gcard--spotlight .gcard__icon { flex: none; width: 4.25rem; height: 4.25rem; font-size: 2.75rem; }
.gcard--spotlight .gcard__body { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.gcard--spotlight .gcard__title { font-size: var(--fs-h2); }
.gcard--spotlight .gcard__desc { min-height: 0; }
.gcard--spotlight .gcard__meta { padding-top: var(--sp-1); flex-wrap: wrap; }
.gcard--spotlight .meta-bit--mode { filter: grayscale(1); opacity: 0.5; }
.gcard__cta {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  height: var(--tap);
  padding-inline: var(--sp-5);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-on);
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  box-shadow: 0 8px 18px -10px var(--accent-glow);
}
.gcard__cta-arrow { font-size: 1.25em; line-height: 1; }
[dir="rtl"] .gcard__cta-arrow { transform: scaleX(-1); }
/* On a phone upright the pill would squeeze the line to three: it keeps its
   arrow and gives the words back to the description. */
@media (max-width: 699px) {
  .gcard--spotlight { gap: var(--sp-3); padding: var(--sp-3); }
  .gcard--spotlight .gcard__icon { width: 3.25rem; height: 3.25rem; font-size: 2.1rem; }
  .gcard--spotlight .gcard__cta { width: var(--tap); padding: 0; justify-content: center; font-size: 0; }
  .gcard--spotlight .gcard__cta-arrow { font-size: 1.35rem; }
}

/* --- A setup screen is a form, and a form has a width --------------------------
   On a laptop or TV every setup screen was the phone's form stretched to
   47.5rem: a switch 660px from its label, the player counter a long bar
   around one digit. They take a form's width there now (the owner's choice,
   21 Sep 2026), centred; the three tabs keep their wide grids. */
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > [id^="view-setup-"]:not(.fixed) { max-width: 40rem; }
}

/* ==========================================================================
   18. كونكت ٤, AND WHAT THE DUELS SHARE
   JS_Connect4.html (one phone) and JS_RoomConnect4.html (rooms, the TV). The
   board is the owner's "كلاسيك أزرق" (21 Sep 2026, option أ of a design
   sheet): a blue board whose round holes show the page ground (so they go
   dark with the theme and the board stays the same blue), red and yellow
   discs with an inner ring, the winning line ringed white with a glow, a
   faint ghost disc over the column under the finger. The board is a
   physical axis, so it carries dir="ltr" and its pieces are placed in its
   own left-to-right terms.

   The duel pieces (.duel-*) are shared with section 19: the layout that puts
   the board beside its pills and buttons on a phone held sideways and on a
   laptop or TV (the board sized off --app-h and the board's own
   --duel-aspect, width over height, so it never needs scrolling), the two
   player pills with the one ring that slides to whoever is to move, the
   status line, the result card and the line of who plays next. A game sets
   --duel-c1 / --duel-c2, its two players' colours, on its .duel.
   ========================================================================== */
:root {
  --c4-red: radial-gradient(circle at 40% 35%, #ff6b6b, #e5383b 55%, #b0282b);
  --c4-yellow: radial-gradient(circle at 40% 35%, #ffe066, #f5b400 55%, #c48e00);
  --c4-board: linear-gradient(180deg, #2f6fe0, #1a4fb5);
}

/* --- The duels: board and side --- */
.duel { --duel-c1: #e5383b; --duel-c2: #e0a800; }
.duel-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.duel-layout__side { display: contents; }
/* Upright, the pills and a result come above the board; the rest follows it. */
.duel-layout__side > .duel-head { order: -2; }
.duel-layout__side > .duel-result { order: -1; }
/* Centred with auto margins in a flex column, so it needs its width too (Traps). */
.duel-layout__board { width: 100%; max-width: 32rem; margin-inline: auto; }
.duel-actions { display: flex; flex-direction: column; gap: var(--sp-2); }

.duel-pills {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "p0 p1";
  gap: var(--sp-2);
}
.duel-pills.has-mid { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "p0 mid p1"; }
.duel-pill {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
  min-height: 3.25rem;
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-1);
  transition: background-color var(--dur-2) var(--ease-out);
}
.duel-pill[data-duel-pill="0"] { grid-area: p0; }
.duel-pill[data-duel-pill="1"] { grid-area: p1; }
.duel-pill.is-turn { background: var(--surface-2); }
.duel-pill__mark { flex: none; display: inline-grid; place-items: center; }
.duel-pill__who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.duel-pill__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-body); font-weight: var(--fw-bold); color: var(--text-strong); }
.duel-pill__sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-xs); font-weight: var(--fw-med); color: var(--text-3); }
.duel-pill__score { flex: none; min-width: 1.5ch; font-size: 1.35rem; font-weight: var(--fw-black); color: var(--text-strong); text-align: center; }
.duel-pills__mid {
  grid-area: mid;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-inline: var(--sp-1);
  font-size: var(--fs-xs);
  font-weight: var(--fw-med);
  color: var(--text-3);
}
.duel-pills__mid .metric { font-size: var(--fs-h3); color: var(--text-2); }
/* The turn: one ring, drawn over whichever pill it belongs to, that slides between them (duelPillsAfter). */
.duel-pills__turn {
  position: relative;
  z-index: 2;
  pointer-events: none;
  border: 2px solid var(--duel-turn, var(--accent));
  border-radius: var(--r-full);
  box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.06);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--duel-turn, var(--accent)) 24%, transparent);
}
.duel-pills[data-turn="0"] .duel-pills__turn { grid-area: p0; --duel-turn: var(--duel-c1); }
.duel-pills[data-turn="1"] .duel-pills__turn { grid-area: p1; --duel-turn: var(--duel-c2); }
.duel-pills[data-turn="-1"] .duel-pills__turn { display: none; }

.duel-status { margin: var(--sp-3) 0 0; min-height: 1.5em; text-align: center; font-weight: var(--fw-bold); color: var(--text-2); }
.duel-status.is-done { font-family: var(--font-display); font-size: var(--fs-h2); color: var(--accent-ink); }
.duel-status.is-mine, .duel-status.is-again { color: var(--accent-ink); }
.duel-status.is-thinking { animation: duelThinking 1.3s var(--ease-in-out) infinite; }
@keyframes duelThinking { 50% { opacity: 0.45; } }
.duel-next { margin: var(--sp-1) 0 0; text-align: center; font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--text-3); }
.duel-hint { margin: 0; text-align: center; }
.duel-continue { margin-bottom: var(--sp-3); }

.duel-result { margin: 0; text-align: center; }
.duel-result__streak { margin: 0 0 var(--sp-2); font-weight: var(--fw-bold); color: var(--warning-ink); }
.duel-result__next { margin: 0 0 var(--sp-3); font-weight: var(--fw-semi); color: var(--text-strong); }

.duel-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--sp-1) var(--sp-2); }
.duel-line__label { font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--text-3); }
.duel-line__who {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  min-height: 2rem;
  padding-block: 0.125rem;
  padding-inline: 0.25rem var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-solid);
  font-size: var(--fs-sm);
  font-weight: var(--fw-semi);
  color: var(--text);
}
.duel-line__who .metric { display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--surface-3); font-size: var(--fs-xs); color: var(--text-2); }
.duel-line__who.is-me { border-color: var(--accent); color: var(--accent-ink); }

/* --- The Connect 4 board --- */
.c4-game { --duel-c1: #e5383b; --duel-c2: #e0a800; }
.c4-disc--1 { --c4-disc-bg: var(--c4-red); }
.c4-disc--2 { --c4-disc-bg: var(--c4-yellow); }
.c4 {
  --c4-pad: 2.2%;
  position: relative;
  width: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
/* A vertical swipe still scrolls the page (and cancels the drop); across, the ghost follows. */
.c4.is-playable { touch-action: pan-y; cursor: pointer; }
.c4-ghostrow { padding-inline: var(--c4-pad); }
.c4-ghostrow__track { position: relative; aspect-ratio: var(--c4-cols) / 1; }
.c4-ghost {
  position: absolute;
  inset-block: 0;
  inset-inline-start: 0;
  width: calc(100% / var(--c4-cols));
  opacity: 0;
  transform: translateX(calc(var(--c4-aim, 3) * 100%));
  transition: transform 140ms var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.c4.is-aiming .c4-ghost { opacity: 0.45; }
.c4-ghost__disc, .c4-disc {
  position: absolute;
  inset: 9%;
  border-radius: 50%;
  background: var(--c4-disc-bg);
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.28);
}
.c4-board {
  position: relative;
  padding: var(--c4-pad);
  border-radius: var(--r-xl);
  background: var(--c4-board);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), 0 10px 26px -12px rgba(26, 79, 181, 0.6), 0 2px 6px rgba(26, 79, 181, 0.22);
}
.c4-grid { position: relative; display: grid; grid-template-columns: repeat(var(--c4-cols), minmax(0, 1fr)); }
.c4-cell { position: relative; aspect-ratio: 1; }
.c4-hole { position: absolute; inset: 9%; border-radius: 50%; background: var(--bg); box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.35); }
.c4-disc { z-index: 1; }
/* The columns as buttons laid over the grid: a keyboard reaches them, a finger is read from where it is. */
.c4-cols { position: absolute; inset: 0; z-index: 3; display: grid; grid-template-columns: repeat(var(--c4-cols), minmax(0, 1fr)); }
.c4-col { padding: 0; border: 0; border-radius: var(--r-md); background: transparent; font: inherit; cursor: pointer; }
.c4-col:disabled { cursor: default; }
.c4-col:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.c4:not(.is-playable) .c4-cols { pointer-events: none; }
@media (hover: hover) and (pointer: fine) {
  .c4.is-playable .c4-col:not(:disabled):hover { background: rgba(255, 255, 255, 0.08); }
}
/* The winning line: ringed white and glowing, lit one disc at a time the first time it is shown. */
.c4-disc.is-win::after {
  content: '';
  position: absolute;
  inset: -9%;
  border-radius: 50%;
  box-shadow: 0 0 0 3px #fff, 0 0 16px 5px rgba(255, 255, 255, 0.75);
}
.c4.is-lighting .c4-disc.is-win { animation: c4WinPop 520ms var(--ease-spring) both; animation-delay: calc(var(--c4-win-at, 0ms) + var(--k, 0) * 160ms); }
.c4.is-lighting .c4-disc.is-win::after { animation: c4WinRing 520ms var(--ease-out) both; animation-delay: calc(var(--c4-win-at, 0ms) + var(--k, 0) * 160ms); }
@keyframes c4WinPop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes c4WinRing { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: scale(1); } }
/* A pill's piece. */
.c4-chip { display: block; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--c4-disc-bg); box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.12); }

/* --- A phone on its side, and every wide screen: the board beside its pills and buttons --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  /* The board is what everyone is looking at (the owner, 21 Sep 2026): it
     takes the height, and the names and scores are a compact column beside
     it, not half the screen. */
  .duel-layout { display: grid; grid-template-columns: auto minmax(12rem, 20rem); justify-content: center; gap: var(--sp-4); align-items: start; }
  .duel-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  /* Sticky, so a long side (a room's line and board of wins) scrolls past a board that stays in view. */
  .duel-layout__board {
    position: sticky;
    top: 0;
    width: min(calc((var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem) * var(--duel-aspect, 1)), 56vw);
    max-width: none;
    margin: 0;
  }
  .duel-pills, .duel-pills.has-mid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "p0" "p1" "mid"; }
  .duel-pills__mid { flex-direction: row; gap: var(--sp-2); }
  .duel-layout__side > .view-actions { position: static; margin: 0; padding: 0; background: none; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .duel-pill { min-height: 2.75rem; padding-block: var(--sp-1); }
  .duel-status { margin-top: var(--sp-2); }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-connect4, .shell__main > #view-room-connect4,
  .shell__main > #view-play-dots, .shell__main > #view-room-dots { max-width: 72rem; }
  .duel-layout { gap: var(--sp-6); grid-template-columns: auto minmax(14rem, 22rem); }
  .duel-layout__board { width: min(calc((var(--app-h, 100vh) - var(--header-h) - 2.5rem) * var(--duel-aspect, 1)), 62vw); }
}

/* --- The TV: the board big on one side, the players and the line on the other --- */
.duel-tv {
  min-height: 0;
  display: grid;
  /* The board takes the stage's whole height (the bar and the strip are
     about 17vmin), the players a column beside it. */
  grid-template-columns: auto minmax(0, 30rem);
  justify-content: center;
  align-items: center;
  gap: calc(var(--tv-gap) * 2.5);
}
.duel-tv__board { width: min(calc((var(--app-h, 100vh) - 17vmin) * var(--duel-aspect, 1)), 64vw); justify-self: center; }
.duel-tv__side { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--tv-gap); }
.duel-tv__side > .tv-scale { width: 100%; }
.duel-tv__status { font-size: var(--tv-md); }
.duel-tv__status.is-again { color: var(--accent-ink); }
.duel-tv .duel-status { margin: 0; }
.duel-tv .c4-board { border-radius: var(--tv-r); }
/* A phone mirrored upright: one column, and the stage scrolls. */
@media (orientation: portrait) {
  .duel-tv { grid-template-columns: minmax(0, 1fr); }
  .duel-tv__board { width: min(100%, 62vh); }
}

/* ==========================================================================
   20. أونو

   the look the owner picked (21 Sep 2026, "بلوكات", the family of سكرو's
   cards): the whole card in its colour (the --uno-* tokens, the same in both
   themes) with a soft shine, a big Baloo numeral or a line icon, the value
   small at the inline-start top and turned at the inline-end bottom (so a
   card overlapped in a hand still shows it); the wilds near black with a

/* The value in two corners: inline-start at the top, turned at the inline-end bottom. */
.uno-card__mini {

.uno-seat {

.uno-seat__n {

  z-index: 2;

.uno-center {
