  }
  return `<div class="snk-bar ${canRoll ? 'is-mine' : ''}" data-snk-bar>
      <span class="snk-bar__dot" style="background:${col}" aria-hidden="true"></span>
      <div class="snk-bar__txt">
        <div class="snk-bar__t1">${escapeHTML(lines[0])}</div>
        <div class="snk-bar__t2">${escapeHTML(lines[1] || '')}</div>
      </div>
      ${k.clock ? `<span class="badge badge--accent metric snk-bar__clock" data-snk-clock></span>` : ''}
      ${canRoll ? `<button type="button" class="btn btn--primary btn--auto btn--lg snk-bar__roll${rollFor ? ' snk-bar__roll--for' : ''}" data-snk-roll onclick="${k.rollJs}" disabled>${label}</button>` : ''}
    </div>`;
}

/** The places at the end: a podium of the first three. */
function snkPodiumHtml(k) {
  const g = k.g;
  const places = g.places || [];
  if (!places.length) return '';
  // In teams the podium is the teams' (the owner, 2 Oct 2026): each step a team, its members' colours.
  const teams = Array.isArray(g.teams) && Array.isArray(g.teamPlaces) && g.teamPlaces.length ? g.teamPlaces.map(ti => (g.teams[ti] || []).filter(id => (g.seats || []).indexOf(id) !== -1)).filter(tm => tm.length) : null;
  const entries = teams ? teams.map(tm => ({ name: tm.map(id => k.names[id] || '…').join(' + '), cols: tm.map(id => SNK_HEX[g.colors[id]] || '#888'), key: tm.join('+') }))
    : places.map(pid => ({ name: k.names[pid] || '…', cols: [SNK_HEX[g.colors[pid]] || '#888'], key: pid }));
  const rise = motionFirst(['snk-podium', k.key, entries.map(x => x.key).join(',')].join('|'));
  const top = entries.slice(0, 3);
  const medals = ['🥇', '🥈', '🥉'];
  const atOf = (i) => 150 + (top.length - 1 - i) * 520;
  const winMs = atOf(0) + 620;
  return `<div class="podium${rise ? ' podium--rise" data-reveal-ms="' + winMs : ''}">` + top.map((x, i) =>
    `<div class="podium__place podium__place--${i + 1} podium__place--rank${i + 1}" style="--at:${atOf(i)}ms">
      <div class="podium__who">
        <span class="podium__medal" aria-hidden="true">${medals[i]}</span>
        <span class="podium__name">${escapeHTML(x.name)}</span>
        <span class="snk-podium__cols" aria-hidden="true">${x.cols.map(cl => `<span class="snk-podium__color" style="background:${cl}"></span>`).join('')}</span>
      </div>
      <div class="podium__block"><span class="metric">${i + 1}</span></div>
    </div>`).join('') + '</div>' +
    (entries.length > 3 ? `<p class="snk-over__rest">${entries.slice(3).map((x, i) => escapeHTML(snkPlaceWord(i + 4) + ': ' + x.name)).join(' · ')}</p>` : '');
}

/**
 * A whole frame: the board's place, the strip, the bar and the log; at the end, the podium
 * and what comes next. k: { g, me, names, bots, away, key, tv, rollJs, over, host, clock, showOver }.
 */
function snkFrameHtml(k) {
  const g = k.g;
  const over = g.phase === 'gameover' && k.showOver;
  return `<div class="snk ${k.tv ? 'snk--tv' : ''} ${over ? 'is-over' : ''}">
      <div class="snk-layout">
        <div class="snk-layout__board"><div class="snk-host" data-snk-host></div></div>
        <div class="snk-layout__side">
          ${over ? `<div class="card card--accent snk-over">
              <p class="snk-over__title">🏁 ${escapeHTML(snkT('snk_over'))}</p>
              ${snkPodiumHtml(k)}
              ${(g.awards || []).length ? `<button type="button" class="btn btn--secondary btn--sm snk-over__aw" onclick="snkAwardsReplay()">🎬 ${escapeHTML(snkT('snk_aw_again'))}</button>` : ''}
              ${k.over || ''}
            </div>` : ''}
          ${snkStripHtml(k)}
          ${g.phase === 'play' ? snkBarHtml(k) : ''}
          ${g.phase === 'play' && !k.tv ? `<p class="snk-reach-key hidden" data-snk-reach><span class="snk-reach-key__sw snk-reach-key__sw--plain" aria-hidden="true"></span><span class="snk-reach-key__sw snk-reach-key__sw--ladder" aria-hidden="true"></span><span class="snk-reach-key__sw snk-reach-key__sw--snake" aria-hidden="true"></span>${escapeHTML(snkT('snk_reach_key'))}</p>` : ''}
          ${g.phase === 'play' && k.tv ? '<div class="snk-lastroll hidden" data-snk-lastroll></div>' : ''}
          <div class="snk-log" data-snk-log>${snkLogHtml(k)}</div>
          ${!k.tv && g.map && g.map.seed ? `<button type="button" class="btn btn--ghost btn--xs btn--auto snk-mapsave" onclick="snkMapSaveOpen()">${escapeHTML(snkT('snk_map_save'))}</button>` : ''}
          ${k.host || ''}
          ${k.strip || ''}
        </div>
      </div>
    </div>`;
}

/**
 * A redraw that leaves the board where it is: only the side column of `html` (a whole snkFrameHtml)
 * replaces the one in `el`. Taking the board out and putting it back restarts the maps' CSS loops
 * (the metro's train, the camel, the tuk-tuk), so a roll must not. False when it can't (no frame
 * yet, the board not in its place, the frame's own classes changed: the end, the TV): the caller
 * then rebuilds the whole frame.
 */
function snkSideSwap(el, html) {
  const host = el && el.querySelector('[data-snk-host]'), frame = el && el.querySelector('.snk');
  if (!host || !frame || !snkView.root || snkView.root.parentNode !== host) return false;
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  const neu = t.content.firstElementChild;
  const side = frame.querySelector('.snk-layout__side'), nside = neu && neu.classList.contains('snk') ? neu.querySelector('.snk-layout__side') : null;
  if (!side || !nside || neu.className !== frame.className) return false;
  side.replaceWith(nside);
  return true;
}

/* --- against the phone ------------------------------------------------------------------------- */

let snkBotTimer = null;

function snkState() {
  if (!appState.snakes) appState.snakes = { opp: 1, color: 'r', g: null, names: {}, bots: {}, gameId: '' };
  const s = appState.snakes;
  if ([1, 2, 3, 4, 5].indexOf(Number(s.opp)) === -1) s.opp = 1;
  if (SNAKES_COLORS.indexOf(s.color) === -1) s.color = 'r';
  // The third round (2 Oct 2026): the map's theme (or 🎲) and the two switches, off by default.
  if (!snkMapChoiceOk(s.theme)) s.theme = 'classic';
  s.surprises = !!s.surprises;
  s.moving = !!s.moving;
  return s;
}

/** The themes as tiles to pick from (the setup and the room's lobby): the classic, the four maps and 🎲. */
const SNK_THEME_ICON = { classic: '🐍', nile: '🐊', metro: '🚇', desert: '🏜️', hara: '🏙️', random: '🎲' };
function snkThemePickerHtml(sel, fn) {
  const maps = snkMapsSaved();
  const saved = maps.length ? `<span class="snk-saved__label">${escapeHTML(snkT('snk_maps_label'))}</span>` + maps.map(m => {
    const v = 'map:' + m.id;
    return `<button type="button" class="snk-theme snk-theme--saved ${sel === v ? 'is-active' : ''}" data-value="${escapeHTML(v)}" data-sum-pick aria-pressed="${sel === v}" onclick="${fn}('${jsStringAttr(v)}')">
      ${snkThemeMiniSvg(m.theme) || `<span class="snk-theme__ic" aria-hidden="true">${SNK_THEME_ICON[m.theme] || '🗺️'}</span>`}<span class="snk-theme__name">📌 ${escapeHTML(m.name)}</span>
    </button>`;
  }).join('') + (snkMapOf(sel) ? `<button type="button" class="btn btn--ghost btn--xs btn--auto snk-saved__del" onclick="snkMapForget('${jsStringAttr(snkMapOf(sel).id)}', '${fn}')">${escapeHTML(snkT('snk_map_forget'))}</button>` : '') : '';
  return SNAKES_THEMES.concat(['random']).map(id => `<button type="button" class="snk-theme ${sel === id ? 'is-active' : ''}" data-value="${id}" data-sum-pick aria-pressed="${sel === id}" onclick="${fn}('${id}')">
      ${snkThemeMiniSvg(id) || `<span class="snk-theme__ic" aria-hidden="true">${SNK_THEME_ICON[id]}</span>`}<span class="snk-theme__name">${escapeHTML(snkT('snk_theme_' + id))}</span>
    </button>`).join('') + saved;
}

/* --- «خرايطنا» (the owner's pick 959, 7 Oct 2026) ------------------------------------------------
   A board the family liked is kept by name on this phone: its seed (the server already stores
   it, g.map.seed, and the same seed draws the same snakes and ladders everywhere) and its look
   (g.theme). The map pickers (one phone's setup, the room's lobby) list them after 🎲 as
   'map:<id>'; a start sends the seed with the look (snkMapResolve), the server checks it. Twelve
   at most, the newest first; one map is kept once (the same seed and look). */
const SNK_MAPS_KEY = 'ashrySnakesMaps_v1';
const SNK_MAPS_MAX = 12;
const snkSeedOk = (n) => Number.isInteger(n) && n >= 1 && n <= 2147483646;

function snkMapsSaved() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(SNK_MAPS_KEY) || '[]'); } catch (e) { list = []; }
  return (Array.isArray(list) ? list : []).filter(m => m && typeof m.id === 'string' && snkSeedOk(Number(m.seed)) && typeof m.name === 'string')
    .map(m => ({ id: m.id, name: m.name.slice(0, 24), seed: Number(m.seed), theme: SNAKES_THEMES.indexOf(m.theme) !== -1 ? m.theme : 'classic' }));
}
function snkMapsWrite(list) {
  try { localStorage.setItem(SNK_MAPS_KEY, JSON.stringify(list.slice(0, SNK_MAPS_MAX))); } catch (e) { /* private window: kept for nothing */ }
}
/** The saved map an option names ('map:<id>'), or null. */
const snkMapOf = (opt) => (typeof opt === 'string' && opt.indexOf('map:') === 0 ? snkMapsSaved().find(m => m.id === opt.slice(4)) || null : null);
/** Is `opt` a map choice a picker may hold: a look, 🎲, or a saved map still here. */
const snkMapChoiceOk = (opt) => SNAKES_THEMES.indexOf(opt) !== -1 || opt === 'random' || !!snkMapOf(opt);
/** What a start deals from an option: { theme, seed } (seed 0: a new map). */
function snkMapResolve(opt) {
  const m = snkMapOf(opt);
  return m ? { theme: m.theme, seed: m.seed } : { theme: snkPickTheme(opt), seed: 0 };
}

/** The game on screen: against the phone, or the room's. */
function snkMapGameNow() {
  if (appState.currentView === 'play-snakes') return (snkState().g) || null;
  return typeof Room !== 'undefined' && Room.state && Room.state.game === 'snakes' ? Room.state.shared : null;
}

function snkMapModalEl() {
  let el = document.getElementById('snk-save-modal');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'snk-save-modal';
  el.className = 'modal-overlay hidden';
  el.setAttribute('data-accent', 'teal');
  el.innerHTML = '<div class="modal-content modal-content--simple" id="snk-save-body"></div>';
  el.addEventListener('click', (e) => { if (e.target === el) closeModal('snk-save-modal'); });
  document.body.appendChild(el);
  if (typeof adoptModal === 'function') adoptModal(el);
  return el;
}

/** «💾 احفظ الخريطة دي»: the name sheet, the field filled with the look's name and a number. */
function snkMapSaveOpen() {
  const g = snkMapGameNow();
  const seed = Number(g && g.map && g.map.seed);
  if (!snkSeedOk(seed)) return;
  const theme = g.theme && SNAKES_THEMES.indexOf(g.theme) !== -1 ? g.theme : 'classic';
  const have = snkMapsSaved().find(m => m.seed === seed && m.theme === theme);
  if (have) { showToast(snkT('snk_map_already', { name: have.name })); return; }
  const el = snkMapModalEl();
  el.dataset.seed = String(seed);
  el.dataset.theme = theme;
  const def = snkT('snk_theme_' + theme) + ' ' + (snkMapsSaved().length + 1);
  document.getElementById('snk-save-body').innerHTML = `
      <div class="modal-icon" aria-hidden="true">${SNK_THEME_ICON[theme] || '🗺️'}</div>
      <div class="sheet__title">${escapeHTML(snkT('snk_map_save_title'))}</div>
      <p class="sheet__subtitle">${escapeHTML(snkT('snk_map_save_sub'))}</p>
      <div class="field">
        <label class="field__label" for="snk-save-name">${escapeHTML(snkT('snk_map_name_label'))}</label>
        <input type="text" id="snk-save-name" maxlength="24" autocomplete="off" value="${escapeHTML(def)}" onkeydown="if(event.key==='Enter'){event.preventDefault();snkMapSaveOk();}">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn--primary btn--lg" onclick="snkMapSaveOk()">${escapeHTML(snkT('snk_map_save_ok'))}</button>
        <button type="button" class="btn btn--ghost" onclick="closeModal('snk-save-modal')">${escapeHTML(snkT('cancel'))}</button>
      </div>`;
  el.classList.remove('hidden');
  haptic('light');
}

function snkMapSaveOk() {
  const el = document.getElementById('snk-save-modal');
  const input = document.getElementById('snk-save-name');
  if (!el || !input) return;
  const seed = Number(el.dataset.seed);
  const theme = el.dataset.theme || 'classic';
  if (!snkSeedOk(seed)) { closeModal('snk-save-modal'); return; }
  const name = (input.value || '').replace(/\s+/g, ' ').trim().slice(0, 24) || (snkT('snk_theme_' + theme) + ' ' + (snkMapsSaved().length + 1));
  const list = snkMapsSaved().filter(m => !(m.seed === seed && m.theme === theme));
  list.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: name, seed: seed, theme: theme });
  snkMapsWrite(list);
  closeModal('snk-save-modal');
  playSound('success');
  showToast(snkT('snk_map_saved', { name: name }), 'success');
  snkMapPickersRepaint();
}

/** 🗑️ on the picked saved map: forgotten, and the picker goes back to the classic. */
function snkMapForget(id, fn) {
  snkMapsWrite(snkMapsSaved().filter(m => m.id !== id));
  haptic('light');
  showToast(snkT('snk_map_forgot'));
  if (typeof window[fn] === 'function') window[fn]('classic');
  else snkMapPickersRepaint();
}

/** The pickers on show drawn again (a map kept or forgotten). */
function snkMapPickersRepaint() {
  if (appState.currentView === 'setup-snakes') paintSnakesSetup();
  if (typeof Room !== 'undefined' && Room.state && Room.state.game === 'snakes' && Room.state.phase === 'lobby' && typeof setSnakesRoomOpt === 'function') {
    const setup = document.getElementById('room-host-setup');
    if (setup) delete setup.dataset.sig;
    routeRoomState(Room.state);
  }
}
/**
 * A map's tile shows a corner of its own board (the owner's sheet, 3 Oct 2026): six by three of its
 * real squares in its frame, with its icon on a badge. Drawn once a map and kept.
 */
const snkThemeMiniCache = {};
function snkThemeMiniSvg(id) {
  if (id === 'random') return '';
  if (snkThemeMiniCache[id]) return snkThemeMiniCache[id];
  const th = id === 'classic' ? null : (typeof SNK_THEMES !== 'undefined' && SNK_THEMES[id]);
  if (id !== 'classic' && !th) return '';
  const lk = SNK_LOOK;
  let sq = '';
  for (let r = 0; r < 3; r++) for (let col = 0; col < 6; col++) {
    const x = col * SNK_C, y = r * SNK_C, alt = (r + col) % 2;
    let tl = null;
    try { tl = th ? th.tile(91 + col - r * 10, x, y, alt) : null; } catch (e) { tl = null; }
    sq += tl && tl.svg ? tl.svg : `<rect x="${x}" y="${y}" width="${SNK_C}" height="${SNK_C}" fill="${tl ? tl.fill : (alt ? lk.tileB : lk.tileA)}"/>`;
  }
  const frame = th ? th.frame : lk.frame;
  const w = 6 * SNK_C, h = 3 * SNK_C;
  return (snkThemeMiniCache[id] = `<span class="snk-theme__mini" aria-hidden="true"><svg viewBox="-14 -14 ${w + 28} ${h + 28}" preserveAspectRatio="xMidYMid slice"><rect x="-14" y="-14" width="${w + 28}" height="${h + 28}" rx="16" fill="${frame}"/><g>${sq}</g></svg><span class="snk-theme__badge">${SNK_THEME_ICON[id]}</span></span>`);
}
/** 🎲: one of the maps, drawn at the start of each game. */
const snkPickTheme = (t) => (t === 'random' ? SNAKES_THEMES[Math.floor(Math.random() * SNAKES_THEMES.length)] : (SNAKES_THEMES.indexOf(t) !== -1 ? t : 'classic'));

function setupSnakes() {
  snkStopBot();
  setView('setup-snakes');
  paintSnakesSetup();
}

function paintSnakesSetup() {
  const s = snkState();
  document.querySelectorAll('#snakes-opp .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === String(s.opp)));
  document.querySelectorAll('#snakes-color .snk-swatch').forEach(el => {
    const on = el.dataset.value === s.color;
    el.classList.toggle('is-active', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const cont = document.getElementById('snakes-continue');
  const live = !!(s.g && s.g.phase === 'play');
  if (cont) cont.classList.toggle('hidden', !live);
  const card = document.getElementById('snakes-continue-card');
  if (card) {
    card.classList.toggle('hidden', !live);
    const line = document.getElementById('snakes-continue-line');
    if (live && line) {
      const names = Object.assign({}, s.names || {}, { me: snkT('xo_you') });
      const up = s.g.turn && s.g.turn.pid;
      const txt = snkT('snk_cont_line', { n: (s.g.pos || {}).me || 0, name: up === 'me' ? snkT('xo_you') : (names[up] || '') });
      if (line.textContent !== txt) line.textContent = txt;
    }
  }
  const th = document.getElementById('snakes-theme');
  if (th) { const html = snkThemePickerHtml(s.theme, 'setSnakesTheme'); if (th._snk !== html) { th.innerHTML = html; th._snk = html; } }
  const sw = (id, on) => { const el = document.getElementById(id); if (el) el.checked = !!on; };
  sw('snakes-surprises', s.surprises);
  sw('snakes-moving', s.moving);
}

function setSnakesTheme(id) { setSnakesOption('theme', id); }

function setSnakesOption(key, value) {
  const s = snkState();
  if (key === 'opp') s.opp = Number(value);
  else if (key === 'color' && SNAKES_COLORS.indexOf(value) !== -1) s.color = value;
  else if (key === 'theme' && snkMapChoiceOk(value)) s.theme = value;
  else if (key === 'surprises' || key === 'moving') s[key] = !!value;
  haptic('light');
  saveToLocal();
  paintSnakesSetup();
}

/** A new game: you in your colour, the phone's players in the others, a new map built. */
function startSnakes() {
  const s = snkState();
  snkStopBot();
  const again = !!(s.g && appState.currentView === 'play-snakes');
  const ids = ['me'];
  for (let k = 1; k <= s.opp; k++) ids.push('b' + k);
  const pool = shuffleArray(ROOM_BOT_NAMES[appState.lang] || ROOM_BOT_NAMES.ar);
  const names = { me: snkT('xo_you') };
  const bots = {};
  ids.slice(1).forEach((id, k) => { names[id] = pool[k]; bots[id] = 'easy'; });
  const colors = snakesFillColors(ids, { me: s.color });
  const order = shuffleArray(ids);   // Fisher-Yates: a random comparator in sort() favours the first seats
  const pick = snkMapResolve(s.theme);   // «خرايطنا» (959): a kept map deals its own seed
  const g = snakesNewGame(order, colors, pick.seed || snakesNewSeed(Math.random), Date.now(), { teardown: again, theme: pick.theme, surprises: s.surprises, moving: s.moving });
  s.g = g;
  s.names = names;
  s.bots = bots;
  s.gameId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  saveToLocal();
  if (appState.currentView !== 'play-snakes') setView('play-snakes');
  paintSnakes({ fresh: true });
  if (typeof scrollToAction === 'function') scrollToAction();
}

function snakesContinue() {
  setView('play-snakes');
  paintSnakes({ still: true });
}

function snkLocalRoll() {
  const s = snkState();
  const g = s.g;
  if (!g || g.phase !== 'play' || !g.turn || g.turn.pid !== 'me' || snkBusy()) return;
  haptic('medium');
  snkHintSync(null, false);
  snakesRoll(g, 'me', snakesDie(), Math.random, Date.now());
  saveToLocal();
  paintSnakes();
}

/** A computer player rolls, a beat after the board has shown the last roll. */
function snkLocalNext() {
  snkStopBot();
  const s = snkState();
  const g = s.g;
  if (!g || g.phase !== 'play' || appState.currentView !== 'play-snakes') return;
  const pid = g.turn && g.turn.pid;
  if (!pid || !s.bots[pid] || snkBusy()) return;
  snkBotTimer = setTimeout(() => {
    snkBotTimer = null;
    const gg = snkState().g;
    if (!gg || gg !== g || gg.phase !== 'play' || gg.turn.pid !== pid || appState.currentView !== 'play-snakes' || snkBusy()) return;
    snakesRoll(gg, pid, snakesDie(), Math.random, Date.now());
    saveToLocal();
    paintSnakes();
  }, SNK_BOT_MS[0] + Math.floor(Math.random() * (SNK_BOT_MS[1] - SNK_BOT_MS[0])));
}

function snkStopBot() {
  if (snkBotTimer) clearTimeout(snkBotTimer);
  snkBotTimer = null;
}

function snkLocalCtx() {
  const s = snkState();
  const over = `<div class="btn-stack">
      <button class="btn btn--primary btn--lg" onclick="startSnakes()">${escapeHTML(snkT('snk_again'))}</button>
      <button class="btn btn--ghost btn--sm" onclick="setupSnakes()">${escapeHTML(snkT('exit'))}</button>
    </div>`;
  return {
    g: s.g, me: 'me', names: Object.assign({}, s.names || {}, { me: snkT('xo_you') }), bots: s.bots || {},
    key: 'local|' + s.gameId, tv: false, rollJs: 'snkLocalRoll()', over: over, loud: true
  };
}

/** The roll button, the bar's words and the log follow the board: set when it goes quiet. */
function snkSyncIdle(root, k) {
  if (!root) return;
  const busy = snkBusy();
  const btn = root.querySelector('[data-snk-roll]');
  const ready = !busy && (!k.readyLocal || Date.now() >= k.readyLocal);
  if (btn) btn.disabled = !ready;
  const bar = root.querySelector('[data-snk-bar]');
  if (bar) bar.classList.toggle('is-ready', !!btn && ready);
  const log = root.querySelector('[data-snk-log]');
  if (log) {
    const html = snkLogHtml(k);
    if (log._snk !== html) { log.innerHTML = html; log._snk = html; }
  }
  root.querySelectorAll('[data-snk-chip]').forEach(el => {
    const pid = el.getAttribute('data-snk-chip');
    const p = snkView.c && snkView.c.players[pid];
    const sq = busy && p ? p.n : (k.g.pos || {})[pid] || 0;
    const sqEl = el.querySelector('.snk-chip__sq');
    const txt = sq >= 100 && k.g.teams ? snkT('snk_home') : sq ? snkT('snk_on_sq', { n: sq }) : snkT('snk_on_mat');
    if (sqEl && sqEl.textContent !== txt) sqEl.textContent = txt;
  });
  const over = root.querySelector('.snk-over');
  if (over) over.classList.toggle('is-waiting', busy);
  const c = snkView.c;
  const playing = busy && c && c.currentPid;
  const up = playing ? c.currentPid : (k.g.phase === 'play' && k.g.turn ? k.g.turn.pid : null);
  root.querySelectorAll('[data-snk-chip]').forEach(el => el.classList.toggle('is-turn', el.getAttribute('data-snk-chip') === up));
  // The piece that pulses is the one the coming roll moves: in teams, a member home rolls for the
  // teammate furthest behind, so theirs pulses (on every phone and the TV), not a surprise.
  const upPiece = !playing && up && k.g.phase === 'play' ? (snakesPieceOf(k.g, up) || up) : up;
  if (c) Object.keys(c.players).forEach(id => c.players[id].e.classList.toggle('is-up', id === upPiece && !c.players[id].hidden));
  snkMatSync(c, k, busy);
  if (k.tv) snkLastRollSync(root, k);
  if (bar) {
    const lines = playing ? [up === k.me ? snkT('snk_your_turn') : snkT('snk_turn_of', { name: k.names[up] || '' }), ''] : snkBarLines(k);
    const t1 = bar.querySelector('.snk-bar__t1'), t2 = bar.querySelector('.snk-bar__t2'), dot = bar.querySelector('.snk-bar__dot');
    if (t1 && t1.textContent !== lines[0]) t1.textContent = lines[0];
    if (t2 && t2.textContent !== (lines[1] || '')) t2.textContent = lines[1] || '';
    if (dot) dot.style.background = SNK_HEX[k.g.colors[up]] || 'transparent';
    // Your roll button stays in its place, greyed (disabled above), while someone else's roll is still
    // being shown: it used to be hidden and pop into the bar (the owner, 8 Oct 2026: felt slow).
  }
  const reach = !k.tv && !!btn && ready && !playing && k.g.phase === 'play' && !!k.g.turn && k.g.turn.pid === k.me;
  snkHintSync(k, reach);
  const key = root.querySelector('[data-snk-reach]');
  if (key) key.classList.toggle('hidden', !reach);
}

/**
 * The mat under the board folds away once every piece is on the board (the owner's sheet, 3 Oct 2026),
 * and the space goes to the bar. On the maps whose strip under the frame is only the mat (the classic,
 * النيل, المترو) the drawing loses that strip; الصحرا and الحارة keep theirs (camels, the road) and only
 * the mat fades. A new game puts it back (its pieces start on it).
 */
const SNK_MAT_STRIP = 40;
const SNK_MAT_CROP = { classic: 1, nile: 1, metro: 1 };
function snkMatSync(c, k, busy) {
  if (!c || !c.svg || busy) return;
  const ids = (k.g.seats || []);
  const off = ids.length > 0 && ids.every(id => ((k.g.pos || {})[id] || 0) > 0) && k.g.phase === 'play';
  const was = c.svg.classList.contains('is-matless');
  if (was === off) return;
  c.svg.classList.toggle('is-matless', off);
  const crop = off && SNK_MAT_CROP[(c.th && c.th.id) || 'classic'];
  c.svg.setAttribute('viewBox', [SNK_VB[0], SNK_VB[1], SNK_VB[2], SNK_VB[3] - (crop ? SNK_MAT_STRIP : 0)].join(' '));
  c.svg.classList.toggle('is-short', !!crop);
  if (typeof snkFit === 'function') snkFit();
}

/** The TV shows the last roll it has played big, with whose it was (the owner's sheet, 3 Oct 2026). */
function snkLastRollSync(root, k) {
  const box = root.querySelector('[data-snk-lastroll]');
  if (!box) return;
  const c = snkView.c;
  const seen = c && snkBusy() && typeof c.shownSeq === 'number' ? c.shownSeq : Infinity;
  const e = (k.g.events || []).filter(x => x.type === 'roll' && (Number(x.seq) || 0) <= seen).pop();
  const key = e ? e.seq + '|' + appState.lang : '';
  if (box._snk === key) return;
  box._snk = key;
  if (!e) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const name = k.names[e.by || e.pid] || '';
  box.innerHTML = `<svg class="snk-lastroll__die" viewBox="-17 -17 34 34" aria-hidden="true"><rect x="-15" y="-15" width="30" height="30" rx="7" fill="#fff" stroke="${SNK_INK}" stroke-width="2"/>${snkPipsSvg(e.n)}</svg>
      <span class="snk-lastroll__txt">${escapeHTML(snkT('snk_rolled', { name: name, n: e.n }))}</span>`;
  if (motionFirst(['snk-lastroll', k.key, e.seq].join('|')) && !snkStill()) box.animate([{ transform: 'scale(0.7) rotate(-12deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 360, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1.3)' });
}

/*
 * Before your roll (ideas batch): a ring pulses round your piece and the six squares a roll could
 * reach are tinted - red where a snake's head is, green where a ladder's foot is, plain otherwise.
 * Looks only; drawn under the ladders, the snakes and the numbers (nothing covers a number), gone
 * the moment the roll starts. The map is on the phone (g.map).
 */
function snkReachOf(g, pid) {
  const from = (g.pos || {})[pid] || 0;
  const out = [];
  for (let d = 1; d <= 6; d++) {
    let t = from + d;
    if (t > 100) t = 200 - t;
    if (t >= 1 && out.indexOf(t) === -1) out.push(t);
  }
  return out;
}

function snkHintSync(k, on) {
  const c = snkView.c;
  if (!c || !c.svg) return;
  const layer = c.svg.querySelector('.snk-hints');
  // In teams, a member home rolls for the teammate furthest behind: the hints are for that piece.
  const piece = k && k.me ? snakesPieceOf(k.g, k.me) : null;
  const key = on && k ? [k.key, k.g.turnSeq, piece, (k.g.pos || {})[piece] || 0].join('|') : '';
  if (c.hintKey === key && (!c.hintRing || c.hintRing.isConnected)) return;
  c.hintKey = key;
  if (layer) layer.textContent = '';
  if (c.hintRing) { c.hintRing.remove(); c.hintRing = null; }
  if (!key || !layer) return;
  const m = k.g.map || {};
  const heads = (m.snakes || []).map(x => x.h), feet = (m.ladders || []).map(x => x.f);
  snkReachOf(k.g, piece).forEach(n => {
    const q = snakesCellXY(n);
    const kind = heads.indexOf(n) !== -1 ? 'snake' : feet.indexOf(n) !== -1 ? 'ladder' : 'plain';
    snkEl('rect', { class: 'snk-hint snk-hint--' + kind, x: q.x - SNK_C / 2 + 2.5, y: q.y - SNK_C / 2 + 2.5, width: SNK_C - 5, height: SNK_C - 5, rx: 7 }, layer);
  });
  const p = c.players[piece];
  if (p && !p.hidden) {
    const kk = p.k || 1;
    c.hintRing = snkEl('ellipse', { class: 'snk-myring', cx: p.x.toFixed(1), cy: (p.y + 17 * kk).toFixed(1), rx: (19 * kk).toFixed(1), ry: (7 * kk).toFixed(1), stroke: p.col || '#fff' }, c.under);
  }
}

function paintSnakes(opts) {
  const o = opts || {};
  const s = snkState();
  const el = document.getElementById('snakes-stage');
  if (!el || !s.g) return;
  const k = snkLocalCtx();
  k.showOver = s.g.phase === 'gameover';
  const html = snkFrameHtml(k);
  if (!snkSideSwap(el, html)) el.innerHTML = html;
  const c = snkShowIn(el.querySelector('[data-snk-host]'), snakesTheme(s.g));
  k.onStep = () => snkSyncIdle(el, k);
  k.onIdle = () => {
    snkSyncIdle(el, k);
    const g = snkState().g;
    if (g && g.phase === 'gameover') snkAwardsAuto(Object.assign({}, k, { g: g }));
    if (g && g.phase === 'gameover' && typeof duelOnce === 'function' && duelOnce(['snk-end', s.gameId].join('|'))) {
      const won = g.places[0] === 'me';
      afterReveal(el, () => {
        if (won) { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } }); }
        else if (typeof duelSound === 'function') duelSound('lose');
      });
    }
    if (g && g.phase === 'play' && g.turn && g.turn.pid === 'me' && typeof duelOnce === 'function' && duelOnce(['snk-turn', s.gameId, g.turnSeq].join('|'))) haptic('medium');
    snkLocalNext();
  };
  if (o.still && c.key === k.key) c.key = '';
  snkFeed(s.g, Object.assign({}, k, { fresh: !!o.fresh }));
  if (!snkBusy()) k.onIdle(); else snkSyncIdle(el, k);
}

/** After a reload: the board as it was, and the phone plays on if it was its turn. */
function restoreSnakes() {
  const s = snkState();
  if (!s.g || !Array.isArray(s.g.seats) || !s.g.pos || !s.g.map) return false;
  paintSnakes({ still: true });
  return true;
}

if (typeof soloRegister === 'function') {
  soloRegister('snakes', {
    setup: 'setup-snakes', play: 'play-snakes',
    paintSetup: paintSnakesSetup, restore: restoreSnakes,
    repaint: () => paintSnakes({ still: true })
  });
}

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    const boardViews = ['play-snakes', 'room-snakes', 'room-tv'];
    if (from === 'play-snakes') snkStopBot();
    if (boardViews.indexOf(from) !== -1 && boardViews.indexOf(to) === -1) snkDrop();
    if (to === 'play-snakes') setTimeout(() => { if (snkState().g && !snkBusy()) snkLocalNext(); }, 0);
  });
}
