<script>
/* ============================================================================
   لعبة الذاكرة — MEMORY
   ----------------------------------------------------------------------------
   Pairs of cards face down. Turn two over: a match stays up (and, with two
   players, the finder goes again); a miss turns back. Solo plays against the
   clock and the move counter, and the phone remembers its best; two players
   take turns on one phone.

   The board lives in appState.memory, so a reload comes back to the same
   cards, the same pairs found and the same clock. The clock stops while the
   board is away (another screen, the phone locked), like the other solo
   clocks (soloPause / soloResume in JS_Solo.html), and a finished board
   comes back as it was left, without its result played again.
   ========================================================================= */

const MEMORY_THEMES = {
  animals: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🦆', '🦉', '🐺', '🐴', '🦄', '🐝', '🐢'],
  food:    ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🥭', '🍍', '🥝', '🍅', '🥑', '🍆', '🥕', '🌽', '🍞', '🧀', '🍕', '🍔', '🍟', '🌭', '🍿', '🍩', '🍪', '🎂'],
  things:  ['⚽', '🏀', '🎾', '🎲', '🎸', '🎺', '🎧', '📷', '☎️', '💡', '🔑', '✂️', '📚', '✏️', '🧸', '🎈', '🎁', '⏰', '🚗', '✈️', '🚀', '⛵', '🏠', '🌂']
};
const MEMORY_SIZES = {
  s: { cols: 4, pairs: 6 },     // 12 cards
  m: { cols: 4, pairs: 8 },     // 16
  l: { cols: 5, pairs: 15, wide: 6 }  // 30: 5 × 6 upright, 6 × 5 on a phone on its side and wide screens (1079)
};
const MEMORY_BEST_KEY = 'ashryMemoryBest_v1';

let memoryClock = null;
let memoryFlipTimer = null;

function memoryState() {
  if (!appState.memory) {
    appState.memory = { mode: 'solo', size: 'm', theme: 'animals', cards: [], flipped: [], moves: 0,
                        turn: 0, scores: [0, 0], startedAt: 0, elapsed: 0, phase: 'setup' };
  }
  return appState.memory;
}

function setupMemory() {
  const m = memoryState();
  memoryStopClock();
  m.phase = 'setup';
  saveToLocal();
  setView('setup-memory');
  paintMemorySetup();
}

function paintMemorySetup() {
  const m = memoryState();
  ['mode', 'size', 'theme'].forEach(key => {
    document.querySelectorAll(`#memory-${key} .segmented__item`).forEach(el => el.classList.toggle('is-active', el.dataset.value === m[key]));
  });
  const best = memoryBest()[m.size];
  const el = document.getElementById('memory-best');
  const t = TRANSLATIONS[appState.lang];
  if (el) el.textContent = best ? `${t.mem_best || ''}: ${best.moves} ${t.mem_moves || ''} · ${memoryClockText(best.seconds)}` : '';
}

function setMemoryOption(key, value) {
  memoryState()[key] = value;
  saveToLocal();
  paintMemorySetup();
}

function memoryBest() {
  try { return JSON.parse(localStorage.getItem(MEMORY_BEST_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function startMemory() {
  const m = memoryState();
  const size = MEMORY_SIZES[m.size] || MEMORY_SIZES.m;
  const pool = MEMORY_THEMES[m.theme] || MEMORY_THEMES.animals;
  const faces = shuffleArray(pool.slice()).slice(0, size.pairs);
  m.cards = shuffleArray(faces.concat(faces)).map(e => ({ e: e, m: false }));
  m.flipped = [];
  m.moves = 0;
  m.turn = 0;
  m.scores = [0, 0];
  m.startedAt = Date.now();
  m.pausedAt = 0;
  m.elapsed = 0;
  m.phase = 'play';
  m.weighed = false;
  m.recorded = false;
  m.prevBest = null;
  if (typeof soloNewGame === 'function') soloNewGame('memory');
  saveToLocal();
  setView('play-memory');
  paintMemory();
  memoryArmClock();
}

function memoryClockText(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function memoryArmClock() {
  memoryStopClock();
  const m = memoryState();
  memoryClock = createClock({
    countUp: true,
    onTick: () => {
      const el = document.getElementById('mem-time');
      if (el) el.textContent = memoryClockText((Date.now() - m.startedAt) / 1000);
    }
  });
}

function memoryStopClock() {
  if (memoryClock) memoryClock.stop();
  memoryClock = null;
  if (memoryFlipTimer) clearTimeout(memoryFlipTimer);
  memoryFlipTimer = null;
  // The last pair's own turn-over belongs to the board it was set for: a new
  // board dealt within its beat must not have a card turned by it.
  if (typeof memoryLastTimer !== 'undefined' && memoryLastTimer) { clearTimeout(memoryLastTimer); memoryLastTimer = null; }
}

function paintMemory() {
  const m = memoryState();
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('memory-stage');
  if (!el) return;
  const size = MEMORY_SIZES[m.size] || MEMORY_SIZES.m;
  const two = m.mode === 'duo';
  const wide = size.wide || size.cols;
  el.innerHTML = `
    <div class="mem-bar" ${two ? `data-turn="${m.turn}"` : ''}>
      ${two ? `
        <span class="mem-turn" aria-hidden="true"></span>
        <div class="mem-player ${m.turn === 0 ? 'is-turn' : ''}" id="mem-p0">
          <span class="mem-player__name"><i class="mem-player__dot" aria-hidden="true"></i>${escapeHTML(t.mem_player1 || '')}</span>
          <b class="metric" id="mem-s0">${m.scores[0]}</b>
        </div>
        <div class="mem-player ${m.turn === 1 ? 'is-turn' : ''}" id="mem-p1">
          <span class="mem-player__name"><i class="mem-player__dot" aria-hidden="true"></i>${escapeHTML(t.mem_player2 || '')}</span>
          <b class="metric" id="mem-s1">${m.scores[1]}</b>
        </div>` : `
        <div class="mem-player"><span class="mem-player__name">${escapeHTML(t.mem_moves || '')}</span><b class="metric" id="mem-moves">${m.moves}</b></div>
        <div class="mem-player"><span class="mem-player__name">${escapeHTML(t.mem_time || '')}</span><b class="metric" id="mem-time">${memoryClockText(m.phase === 'play' ? (Date.now() - m.startedAt) / 1000 : m.elapsed)}</b></div>`}
    </div>
    <div class="mem-grid ${two ? 'mem-grid--duo' : ''}" ${two ? `data-turn="${m.turn}"` : ''} style="--mem-cols: ${size.cols}; --mem-rows: ${Math.ceil(size.pairs * 2 / size.cols)}; --mem-wcols: ${wide}; --mem-wrows: ${Math.ceil(size.pairs * 2 / wide)}">
      ${m.cards.map((c, i) => `
        <button type="button" class="mem-card ${c.m ? 'is-matched' : ''} ${m.flipped.indexOf(i) !== -1 ? 'is-flipped' : ''}"
                id="mem-card-${i}" onclick="flipMemory(${i})" aria-label="${escapeHTML(t.mem_card || '')} ${i + 1}${c.m || m.flipped.indexOf(i) !== -1 ? ' ' + c.e : ''}">
          <span class="mem-card__inner">
            <span class="mem-card__face mem-card__face--back" aria-hidden="true">?</span>
            <span class="mem-card__face mem-card__face--front" aria-hidden="true">${c.e}</span>
          </span>
        </button>`).join('')}
    </div>
    <div class="view-actions play-foot">
      <button class="btn btn--ghost btn--sm btn--auto play-exit" onclick="${m.phase === 'play' ? 'playExit(setupMemory)' : 'setupMemory()'}">${escapeHTML(t.exit || '')}</button>
    </div>`;
}

/** A card's name for a screen reader: its number, and its face while it is turned up. */
function memoryCardLabel(el, i, face) {
  const t = TRANSLATIONS[appState.lang] || {};
  el.setAttribute('aria-label', (t.mem_card || '') + ' ' + (i + 1) + (face ? ' ' + face : ''));
}

function flipMemory(i) {
  const m = memoryState();
  if (m.phase !== 'play') return;
  const card = m.cards[i];
  // ideas batch: solo - a tap during the pause after a miss doesn't wait for it:
  // the missed pair turns back at once and, if it was another card, it turns up.
  if (memoryFlipTimer && m.flipped.length >= 2 && card && !card.m) {
    const hitOpen = m.flipped.indexOf(i) !== -1;
    memoryCloseMiss();
    if (hitOpen) return;
  }
  if (!card || card.m || m.flipped.indexOf(i) !== -1 || m.flipped.length >= 2) return;
  m.flipped.push(i);
  const el = document.getElementById('mem-card-' + i);
  if (el) { el.classList.add('is-flipped'); memoryCardLabel(el, i, card.e); }
  playSound('click');

  if (m.flipped.length < 2) { saveToLocal(); memoryLastPair(); return; }

  m.moves += 1;
  const [a, b] = m.flipped;
  const hit = m.cards[a].e === m.cards[b].e;
  if (hit) {
    m.cards[a].m = m.cards[b].m = true;
    m.flipped = [];
    m.scores[m.turn] += 1;
    [a, b].forEach(k => { const c = document.getElementById('mem-card-' + k); if (c) c.classList.add('is-matched'); });
    playSound('success');
    haptic('light');
    memoryPaintBar();
    saveToLocal();
    if (m.cards.every(c => c.m)) memoryFinish();
    else memoryLastPair();
    return;
  }
  // A miss: leave both up long enough to see them, then turn them back and,
  // with two players, hand the turn over.
  saveToLocal();
  memoryFlipTimer = setTimeout(memoryCloseMiss, 750);
  memoryPaintBar();
}

/** The missed pair turns back and, with two players, the turn passes (after the pause, or at once on the next tap). */
function memoryCloseMiss() {
  const m = memoryState();
  if (memoryFlipTimer) clearTimeout(memoryFlipTimer);
  memoryFlipTimer = null;
  const pair = m.flipped.slice();
  m.flipped = [];
  pair.forEach(k => { const c = document.getElementById('mem-card-' + k); if (c) { c.classList.remove('is-flipped'); memoryCardLabel(c, k, ''); } });
  if (m.mode === 'duo') m.turn = 1 - m.turn;
  memoryPaintBar();
  saveToLocal();
}

/**
 * Two cards left: they can only be each other, so they turn over by themselves
 * (the owner, 21 Sep 2026: one thing to do is done for you) - the second a beat
 * after the first, as a hand would.
 */
let memoryLastTimer = null;
function memoryLastPair() {
  const m = memoryState();
  if (m.phase !== 'play' || memoryLastTimer) return;
  const left = m.cards.map((c, i) => (c.m ? -1 : i)).filter(i => i !== -1);
  if (left.length !== 2) return;
  const next = left.find(i => m.flipped.indexOf(i) === -1);
  if (next === undefined) return;
  memoryLastTimer = setTimeout(() => {
    memoryLastTimer = null;
    if (appState.currentView !== 'play-memory') return;
    flipMemory(next);
  }, m.flipped.length ? 380 : 650);
}

function memoryPaintBar() {
  const m = memoryState();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('mem-moves', m.moves);
  set('mem-s0', m.scores[0]);
  set('mem-s1', m.scores[1]);
  const p0 = document.getElementById('mem-p0'), p1 = document.getElementById('mem-p1');
  if (p0) p0.classList.toggle('is-turn', m.turn === 0);
  if (p1) p1.classList.toggle('is-turn', m.turn === 1);
  memoryTurnSlide(m);
}

/**
 * 1080 (the owner's picks, 7 Oct 2026): with two players the turn is a ring in
 * the player's colour that slides from one chip to the other (as duelPillsAfter's
 * does), and the board's edge takes the same colour.
 */
function memoryTurnSlide(m) {
  const bar = document.querySelector('#memory-stage .mem-bar');
  const grid = document.querySelector('#memory-stage .mem-grid');
  if (!bar || m.mode !== 'duo') return;
  const turn = String(m.turn);
  if (bar.dataset.turn === turn) return;
  const ring = bar.querySelector('.mem-turn');
  const from = ring && ring.getBoundingClientRect();
  bar.dataset.turn = turn;
  if (grid) grid.dataset.turn = turn;
  if (!ring || !from || !ring.animate || (typeof motionOff === 'function' && motionOff())) return;
  const to = ring.getBoundingClientRect();
  if (!to.width) return;
  ring.animate([
    { transform: 'translate(' + (from.left - to.left) + 'px, ' + (from.top - to.top) + 'px)' },
    { transform: 'translate(0px, 0px)' }
  ], { duration: 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
}

function memoryFinish() {
  const m = memoryState();
  memoryStopClock();
  m.elapsed = Math.round((Date.now() - m.startedAt) / 1000);
  m.phase = 'done';
  saveToLocal();
  memoryShowResult(false);
}

/**
 * 1078 (the owner's picks, 7 Oct 2026): the result is the solo games' sheet
 * (soloResult) - the moves count up, «شوف اللوحة», again and exit - like every
 * other game on its own. The best per size is kept as it always was
 * (ashryMemoryBest_v1), weighed once per board (m.weighed).
 */
function memoryShowResult(quiet) {
  const m = memoryState();
  const t = TRANSLATIONS[appState.lang] || {};
  const o = { icon: '🎴', win: true, quiet: !!quiet, again: startMemory, againLabel: '🔄 ' + (t.play_again || ''), exit: setupMemory };
  if (m.mode === 'duo') {
    const [x, y] = m.scores;
    // Each score beside its player: a bare "6 – 0" reads either way round in an Arabic line.
    const side = (name, n) => `<span class="flex items-center gap-2"><bdi>${escapeHTML(name || '')}</bdi><b class="metric metric--md">${n}</b></span>`;
    o.title = x === y ? (t.mem_tie || '') : `🏆 ${x > y ? (t.mem_player1 || '') : (t.mem_player2 || '')}`;
    o.valueText = '';
    o.lines = [`<span class="flex justify-center gap-4">${side(t.mem_player1, x)}${side(t.mem_player2, y)}</span>`];
  } else {
    const best = memoryBest();
    if (!m.weighed) {
      const prev = best[m.size] || null;
      const record = !prev || m.moves < prev.moves || (m.moves === prev.moves && m.elapsed < prev.seconds);
      if (record) {
        best[m.size] = { moves: m.moves, seconds: m.elapsed };
        try { localStorage.setItem(MEMORY_BEST_KEY, JSON.stringify(best)); } catch (e) {}
      }
      m.weighed = true;
      m.recorded = record;
      m.prevBest = prev;
      saveToLocal();
    }
    const was = m.prevBest;
    o.title = m.recorded ? (t.mem_new_best || '') : (t.mem_done || '');
    o.record = !!m.recorded;
    o.value = m.moves;
    o.valueLabel = t.mem_moves || '';
    o.lines = [`${escapeHTML(t.mem_time || '')}: <span class="metric">${memoryClockText(m.elapsed)}</span>`]
      .concat(was && !m.recorded ? [`${escapeHTML(t.mem_best || '')}: ${was.moves} ${escapeHTML(t.mem_moves || '')} · ${memoryClockText(was.seconds)}`] : []);
  }
  soloResult(o);
}

/** After a reload: the same board. A pair left face up is turned back. */
function restoreMemory() {
  const m = memoryState();
  if (!m.cards || !m.cards.length) return false;
  if (m.phase === 'play') {
    if (typeof soloResume === 'function') soloResume(m);
    // Two up is a miss whose pause the reload cut short: the turn passes as memoryCloseMiss would.
    if (m.flipped.length >= 2) {
      m.flipped = [];
      if (m.mode === 'duo') m.turn = 1 - m.turn;
      saveToLocal();
    }
    paintMemory();
    memoryArmClock();
    return true;
  }
  // A finished board is drawn as it was; its result was already shown and saved.
  if (m.phase === 'done') { paintMemory(); return true; }
  return false;
}

/* The clock stops while the board is away: leaving it, or the phone locked or
   the app closed while it is on screen. */
function memoryPauseAway(hidden) {
  const m = memoryState();
  if (typeof soloPause !== 'function' || m.phase !== 'play') return;
  if (hidden) { soloPause(m); saveToLocal(); return; }
  soloResume(m);
  const el = document.getElementById('mem-time');
  if (el && m.mode !== 'duo') el.textContent = memoryClockText((Date.now() - m.startedAt) / 1000);
}

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    const m = memoryState();
    if (from === 'play-memory' && typeof soloPause === 'function') soloPause(m);
    if (to === 'play-memory' && typeof soloResume === 'function') soloResume(m);
    if (to === 'play-memory') setTimeout(memoryLastPair, 0);
  });
}
// A registered solo game (1078): its result is soloResult's sheet, whose «شوف اللوحة»
// needs the board known; a language change repaints it through `repaint`. `timed`:
// the solo pieces stop its clock away from the board (its own hooks below do too).
(window.SOLO_LATE = window.SOLO_LATE || []).push(() => soloRegister('memory', {
  setup: 'setup-memory', play: 'play-memory', state: memoryState, restore: restoreMemory,
  paintSetup: paintMemorySetup, repaint: paintMemory, timed: true,
  resume: () => { setView('play-memory'); if (!restoreMemory()) setupMemory(); }
}));
if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', () => {
    if (appState.currentView === 'play-memory') memoryPauseAway(document.visibilityState === 'hidden');
  });
}
</script>
