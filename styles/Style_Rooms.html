<style>
/* Style_Rooms.html - sections 50-59: الكراسي الموسيقية, عربيات التصادم, a game switched off, جمجمة, السلم والتعبان, الشاهد, الحقوا!, المزاد, الأوضة المضلمة, حط إيدك!.
   Part of the stylesheet that starts in Style.html: the parts are included in
   Controller.html in this order, and the cascade depends on it. */

/* ==========================================================================
   50. الكراسي الموسيقية (MUSICAL CHAIRS in rooms, JS_RoomChairs.html, 27 Sep 2026)
   Look أ «الصالة» from the design sheet: a pale violet rug, wooden chairs in
   a ring, round avatars with initials circling it while the music plays and
   hopping onto their chairs when it stops, the amber «اقعد!». The ring is a
   square placed in percentages (the page's own trig, no CSS trig: a 2021
   phone must still lay it out). Upright: the ring, the button, the order;
   a phone on its side and a laptop: the ring beside a column; the TV: the
   ring as tall as the stage beside the order.
   ========================================================================== */
.mch { display: flex; flex-direction: column; gap: var(--sp-3); }
.mch-head { flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.mch-ring {
  position: relative;
  width: min(100%, 24rem, calc(var(--app-h, 100vh) - 24rem));
  min-width: 14rem;
  aspect-ratio: 1;
  margin: 0 auto;
  align-self: center;
}
.mch-rug {
  position: absolute; inset: 6%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--surface-solid) 0%, var(--accent-soft) 62%, color-mix(in srgb, var(--accent) 16%, var(--surface-solid)) 100%);
  box-shadow: inset 0 0 0 2px var(--accent-border), var(--sh-1);
}
.mch-ring.is-flash .mch-rug { animation: mchFlash 0.7s var(--ease-out); }
@keyframes mchFlash { 0% { box-shadow: inset 0 0 0 2px var(--accent-border), 0 0 0 0 var(--pop-glow); } 40% { box-shadow: inset 0 0 0 6px var(--pop), 0 0 0 18px transparent; } 100% { box-shadow: inset 0 0 0 2px var(--accent-border), 0 0 0 0 transparent; } }
.mch-chair { position: absolute; transform: rotate(var(--rot, 0deg)); filter: drop-shadow(0 2px 2px rgba(43, 35, 82, 0.25)); }
.mch-chair svg { display: block; width: 100%; height: 100%; }
.mch-orbit { position: absolute; inset: 0; }
.mch-orbit__seat { position: absolute; }
.mch-av { position: absolute; display: flex; align-items: center; justify-content: center; z-index: 2; }
.mch-orbit__seat > .mch-av { inset: 0; }
.mch-av__face {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 78%, #000));
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(0.8rem, 2.6vmin, 1.4rem);
  box-shadow: 0 6px 14px rgba(43, 35, 82, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}
.mch-av.is-me .mch-av__face { outline: 3px solid var(--pop); outline-offset: 2px; }
.mch-av__name {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  margin-top: 2px;
  font-size: 0.62rem; font-weight: 700; color: var(--text-2);
  white-space: nowrap; max-width: 5.5rem; overflow: hidden; text-overflow: ellipsis;
  background: var(--surface); padding: 0 0.3rem; border-radius: 999px;
}
.mch-av.is-out { z-index: 1; }
.mch-av.is-out .mch-av__face { filter: grayscale(1); opacity: 0.55; }
.mch-av.is-walking { animation: mchWalk 0.9s var(--ease-out) both; }
@keyframes mchWalk { 0% { transform: translateY(0); } 30% { transform: translateY(-10%) rotate(-8deg); } 100% { transform: translateY(18%) rotate(6deg); } }
.mch-mid {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 46%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1);
  text-align: center; pointer-events: none;
}
.mch-mid--in { animation: mchMidIn 0.45s var(--ease-out) both; }
@keyframes mchMidIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.mch-mid__line { font-size: var(--fs-sm); font-weight: 700; color: var(--accent-ink); }
.mch-mid__big { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.1rem, 5vmin, 2rem); line-height: 1.15; color: var(--text-strong); }
.mch-mid__big--out { font-size: clamp(0.95rem, 4vmin, 1.5rem); }
.mch-mid__big--win { color: var(--accent-ink); }
.mch-eq { display: flex; align-items: flex-end; gap: 4px; height: 2.75rem; }
.mch-eq > i { display: block; width: 6px; height: 100%; border-radius: 6px; background: var(--accent); transform-origin: bottom; transform: scaleY(0.4); }
.mch-window { width: 70%; height: 6px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.mch-window > i { display: block; height: 100%; background: var(--pop); transform-origin: left; transform: scaleX(1); }
html[dir="rtl"] .mch-window > i { transform-origin: right; }

.mch-bar { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); min-height: 6.5rem; }
.mch-bar:empty { display: none; }
.mch-btn {
  width: 100%; max-width: 24rem; min-height: 5.5rem;
  border: 0; border-radius: var(--r-xl);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1.1;
  cursor: pointer;
  transition: transform 80ms var(--ease-out), box-shadow 80ms var(--ease-out);
}
.mch-btn__sub { font-family: var(--font); font-size: var(--fs-sm); font-weight: 600; opacity: 0.8; }
.mch-btn.is-wait { background: var(--surface-3); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--hairline); font-size: 1.4rem; }
.mch-btn.is-go {
  background: linear-gradient(180deg, color-mix(in srgb, var(--pop) 80%, #fff), var(--pop));
  color: var(--pop-on);
  box-shadow: 0 12px 30px var(--pop-glow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.mch-btn.is-go:active, .mch-btn.is-pressed { transform: translateY(4px) scale(0.98); box-shadow: 0 4px 12px var(--pop-glow); }
.mch-btn--pop { animation: mchPop 0.42s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes mchPop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
.mch-hint { margin: 0; text-align: center; font-size: var(--fs-sm); color: var(--text-3); }
.mch-hint--voice { font-size: var(--fs-xs); }
.mch-sat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-3); min-height: 5.5rem; justify-content: center; }
.mch-sat__n { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; color: var(--text-strong); }
.mch-sat.is-first .mch-sat__n { color: var(--success-ink); }
.mch-sat.is-out .mch-sat__n { color: var(--danger-ink); }
.mch-sat__ms { color: var(--text-3); font-size: var(--fs-sm); }
.mch-order .status-row { gap: var(--sp-2); }
.mch-order .status-row.is-out { opacity: 0.6; }
.mch-order__n {
  flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: var(--fs-sm);
}
.mch-order__n.is-top { background: var(--pop); color: var(--pop-on); }
.mch-order__ms { color: var(--text-3); font-size: var(--fs-sm); }
.mch-over { text-align: center; }
.mch-place { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); padding: var(--sp-1) 0; font-weight: 700; }
.mch-place:first-child .mch-place__name { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--accent-ink); }
.mch-place__medal { font-size: 1.4rem; }
.mch-place--rise { animation: mchRise 0.5s var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes mchRise { from { opacity: 0; transform: translateY(0.75rem); } to { opacity: 1; transform: none; } }

/* A phone on its side, and a laptop: the ring beside a column of the rest. */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  .mch { display: grid; grid-template-columns: minmax(0, auto) minmax(14rem, 1fr); grid-template-areas: "head head" "ring bar" "ring over" "ring order" "ring strip"; column-gap: var(--sp-4); align-items: start; }
  .mch-head { grid-area: head; }
  .mch-ring { grid-area: ring; width: min(calc(var(--app-h, 100vh) - 9rem), 30rem); align-self: start; }
  .mch-bar { grid-area: bar; }
  .mch-over, .mch-order { grid-area: auto; }
  .mch > .chip-set[data-room-strip] { grid-column: 2; }
  .mch > .btn-row, .mch > .room-host-row { grid-column: 2; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .mch-ring { width: min(calc(var(--app-h, 100vh) - 6rem), 20rem); min-width: 12rem; }
  .mch-btn { min-height: 4rem; font-size: 1.5rem; }
  .mch-av__name { display: none; }
}

/* The TV: the ring as tall as the stage, the order beside it. One row the stage's height: the
   side never stretches it (a tall side used to push the ring and its hint off the bottom), and the
   orbit's turning corners (empty) never give the TV a scrollbar. */
.mch-tv { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(24vmin, 1fr); grid-template-rows: minmax(0, 1fr); gap: 3vmin; align-items: center; height: 100%; min-height: 0; overflow: clip; }
.mch-tv__stage { display: flex; flex-direction: column; align-items: center; gap: 1.5vmin; min-height: 0; }
.mch-ring--tv { width: min(64vmin, 100%); max-width: none; }
.mch-ring--tv .mch-av__face { font-size: 3vmin; }
.mch-ring--tv .mch-av__name { font-size: 1.6vmin; max-width: 12vmin; }
.mch-ring--tv .mch-eq { height: 8vmin; gap: 0.8vmin; }
.mch-ring--tv .mch-eq > i { width: 1.1vmin; }
.mch-ring--tv .mch-mid__big { font-size: 5vmin; }
.mch-ring--tv .mch-mid__big--out { font-size: 3.6vmin; }
.mch-ring--tv .mch-mid__line { font-size: 2.2vmin; }
.mch-tv__side { display: flex; flex-direction: column; gap: 1.5vmin; min-height: 0; max-height: 100%; overflow-y: auto; }
/* Who is in the ring, and who sat first: compact rows, and two columns past six people (2 Oct 2026). */
.mch-tv__side .mch-order .status-row { min-height: 2.75rem; padding-block: var(--sp-1); margin-bottom: var(--sp-1); }
.mch-tv__side.is-many .mch-order { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--sp-2); align-items: start; }
.mch-tv__side.is-many .mch-order > .eyebrow { grid-column: 1 / -1; }
.mch-tv__side.is-many .mch-order .status-row { gap: var(--sp-2); padding-inline: var(--sp-2); }
/* The end on the TV (2 Oct 2026): the places in the TV's sizes, two columns for five or more. */
.mch-over--tv { padding: var(--tv-gap) calc(var(--tv-gap) * 1.5); }
.mch-over--tv .eyebrow { font-size: var(--tv-xs); }
.mch-over__places.is-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--tv-gap); }
.mch-over__places.is-two > .mch-place:first-child { grid-column: 1 / -1; }
.mch-over--tv .mch-place { gap: calc(var(--tv-gap) * 0.6); padding: 0.5vmin 0; font-size: var(--tv-md); min-width: 0; }
.mch-over--tv .mch-place__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mch-over--tv .mch-place__medal { font-size: var(--tv-md); }
.mch-over--tv .mch-place:first-child .mch-place__name { font-size: var(--tv-lg); }
.mch-over--tv .mch-best-dj { gap: var(--tv-gap); margin-top: var(--tv-gap); padding-top: var(--tv-gap); }
.mch-over--tv .mch-best-dj__icon { font-size: var(--tv-lg); }
.mch-over--tv .mch-best-dj__name { font-size: var(--tv-md); }
.mch-over--tv .mch-best-dj__n { font-size: var(--tv-xs); }

/* «الدي جي» (2 Oct 2026): the one out runs the music - their panel, the badge, the title at the end. */
.mch-dj { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); width: 100%; }
.mch-dj--in { animation: mchPop 0.42s cubic-bezier(.2, .9, .3, 1.3) both; }
.mch-dj__head { display: flex; align-items: center; gap: var(--sp-2); }
.mch-dj__disc { display: inline-block; font-size: 1.6rem; line-height: 1; }
.mch-dj__title { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; color: var(--accent-ink); }
.mch-btn.is-go:disabled:not(.is-pressed) { filter: grayscale(0.7); opacity: 0.6; cursor: default; box-shadow: none; }
.mch-best-dj { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); margin-top: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--hairline); }
.mch-best-dj__icon { font-size: 2rem; line-height: 1; }
.mch-best-dj__name { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--accent-ink); }
.mch-best-dj__n { font-size: var(--fs-sm); color: var(--text-3); }

@media (prefers-reduced-motion: reduce) {
  .mch-ring.is-flash .mch-rug, .mch-av.is-walking, .mch-mid--in, .mch-btn--pop, .mch-place--rise, .mch-dj--in { animation: none; }
}

/* ============================================================================
   51. عربيات التصادم (BUMPER CARS in rooms, JS_RoomBumper.html, 28 Sep 2026):
   the TV-and-controllers test. The phone is a controller (a stick, or a wheel
   and Gas), the TV the rink (a canvas) beside the drivers and the traffic.
   ========================================================================= */
.bmp { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); position: relative; }
.bmp-head { justify-content: center; flex-wrap: wrap; }
.bmp-me__dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--car); box-shadow: 0 0 0 2px var(--surface-solid), 0 0 0 3px var(--car); }
[data-bmp-ping][data-level="good"] .metric, .bmp-row__ping[data-level="good"] { color: var(--success-ink); }
[data-bmp-ping][data-level="ok"] .metric, .bmp-row__ping[data-level="ok"] { color: var(--warning-ink); }
[data-bmp-ping][data-level="bad"] .metric, .bmp-row__ping[data-level="bad"] { color: var(--danger-ink); }
.bmp-need { text-align: center; }
.bmp-pad {
  position: relative; width: min(82vw, calc(var(--app-h, 100vh) * 0.46), 22rem); aspect-ratio: 1;
  border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle, var(--surface-solid) 0 55%, color-mix(in srgb, var(--car) 14%, var(--surface-2)) 56% 100%);
  border: 3px solid color-mix(in srgb, var(--car) 45%, transparent);
  box-shadow: inset 0 0.4rem 1.2rem rgba(0,0,0,0.12), var(--sh-3);
}
.bmp-pad__ring { position: absolute; inset: 22%; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--car) 35%, transparent); pointer-events: none; }
.bmp-pad__knob {
  position: absolute; left: 50%; top: 50%; width: 34%; height: 34%; margin: -17% 0 0 -17%; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--car) 55%, #fff), var(--car) 60%);
  border: 3px solid #1b1b1f; box-shadow: 0 0.35rem 0.8rem rgba(0,0,0,0.3); pointer-events: none;
  transition: transform 160ms var(--ease-out, ease-out);
}
.bmp-pad.is-held .bmp-pad__knob { transition: none; }
.bmp-tilt { display: flex; align-items: center; justify-content: center; gap: var(--sp-5); width: 100%; }
.bmp-wheel {
  width: min(42vw, 11rem); aspect-ratio: 1; border-radius: 50%; border: 0.9rem solid #2b2b36;
  background: color-mix(in srgb, var(--car) 20%, var(--surface-2)); position: relative; box-shadow: 0 0 0 3px var(--car);
}
.bmp-wheel__spoke { position: absolute; left: 50%; top: 50%; width: 100%; height: 0.8rem; margin: -0.4rem 0 0 -50%; background: #2b2b36; border-radius: 0.4rem; }
.bmp-wheel__spoke::after { content: ''; position: absolute; left: 50%; top: -1.6rem; width: 0.8rem; height: 1.6rem; margin-left: -0.4rem; background: #2b2b36; }
.bmp-gas {
  width: min(34vw, 8.5rem); aspect-ratio: 1; border-radius: 1.4rem; border: 3px solid #1b1b1f; touch-action: none;
  background: var(--pop, #f59e0b); color: var(--pop-on, #1b1b1f); font: 900 var(--fs-h1) var(--font-display, inherit);
  box-shadow: 0 0.45rem 0 #1b1b1f; user-select: none; -webkit-user-select: none;
}
.bmp-gas.is-held { transform: translateY(0.35rem); box-shadow: 0 0.1rem 0 #1b1b1f; }
.bmp-modes { width: min(100%, 20rem); }
.bmp-hint, .bmp-look { text-align: center; color: var(--text-2); font-size: var(--fs-sm); margin: 0; max-width: 24rem; }
.bmp-look { color: var(--text-3); }
.bmp.is-hit::after { content: ''; position: fixed; inset: 0; background: rgba(229,56,59,0.28); pointer-events: none; z-index: var(--z-float, 30); }
.bmp-pop {
  position: absolute; top: 40%; left: 50%; transform: translateX(-50%); pointer-events: none;
  font: 900 2rem var(--font-display, inherit); color: var(--success); text-shadow: 0 2px 0 rgba(0,0,0,0.2);
  animation: bmp-pop 900ms var(--ease-out, ease-out) forwards;
}
@keyframes bmp-pop { from { opacity: 0; translate: 0 1rem; scale: 0.7; } 20% { opacity: 1; scale: 1.1; } to { opacity: 0; translate: 0 -3rem; scale: 1; } }

.bmp-row { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 0.6rem; padding: 0.35rem 0; }
.bmp-rows .bmp-row { grid-template-columns: auto 1fr auto auto; }
.bmp-row + .bmp-row { border-top: 1px solid var(--border, rgba(0,0,0,0.08)); }
.bmp-row.is-idle { opacity: 0.55; }
.bmp-row__dot { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: var(--car); border: 2px solid #1b1b1f; }
.bmp-row__name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bmp-over { display: flex; flex-direction: column; gap: var(--sp-3); width: min(100%, 30rem); margin-inline: auto; }
.bmp-over__win { text-align: center; font: 800 var(--fs-h2) var(--font-display, inherit); }

.bmp-tv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 22vw); gap: 2vmin; height: 100%; min-height: 0; }
.bmp-tv--over { display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
/* A second screen while the lead one runs the rink (bmpIsLead): one line, centred. */
.bmp-tv--other { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2vmin; }
/* On the TV the podium and the list sit side by side, so the whole result is on the screen. */
.bmp-tv--over .bmp-over { display: grid; grid-template-columns: 1fr 1fr; align-items: center; column-gap: 4vmin; width: min(100%, 72rem); }
.bmp-tv--over .bmp-over > :not(.bmp-over__podium):not(.bmp-rows) { grid-column: 1 / -1; }
.bmp-tv__stage { min-width: 0; min-height: 0; display: grid; place-items: center; }
.bmp-canvas { border-radius: 1.2vmin; box-shadow: 0 1vmin 3vmin rgba(0,0,0,0.35); }
.bmp-tv__side { display: flex; flex-direction: column; gap: 1.5vmin; min-width: 0; font-size: 2.2vmin; }
.bmp-tv__clock { font-size: 7vmin; font-weight: 800; text-align: center; }
.bmp-table { background: var(--surface-solid); border-radius: 1.2vmin; padding: 0.6vmin 1.4vmin; }
.bmp-stats { display: grid; gap: 0.5vmin; font-size: 1.9vmin; }
/* The tilt controller: always sideways, laid over the page and turned a quarter
   by JS (bmpLandLayout) while the page is upright, so rotation lock can't stop it. */
.bmp-land {
  position: fixed; left: 50%; top: 50%; z-index: var(--z-float-hi, 90);
  display: flex; flex-direction: column; gap: 0.5rem; padding: 0.6rem 1rem;
  background: var(--bg, #f5f3ee); transform-origin: 50% 50%; touch-action: none;
  user-select: none; -webkit-user-select: none; box-sizing: border-box;
}
body.dark .bmp-land { background: var(--bg, #0d0b16); }
.bmp-land__top { display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
.bmp-land__back { margin-inline-start: auto; }
.bmp-land__main { direction: ltr; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 1rem; }
html[dir="rtl"] .bmp-land__side { direction: rtl; }
.bmp-land__side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; min-height: 0; }
.bmp-land__row { display: flex; gap: 0.5rem; }
.bmp-land .bmp-wheel { width: min(38vmin, 13rem); }
.bmp-land .bmp-gas { width: min(40vmin, 11rem); aspect-ratio: 1.25; font-size: 1.6rem; }
.bmp-land__hint { margin: 0; text-align: center; color: var(--text-3); font-size: 0.75rem; }
.bmp-gas.is-brake { background: var(--danger-btn, #e5383b); color: var(--danger-on, #fff); }
.bmp-auto {
  padding: 0.5rem 1rem; border-radius: 999px; border: 2px solid var(--car); font-weight: 800;
  background: var(--surface-solid); color: var(--text); min-height: 2.75rem;
}
.bmp-auto.is-on { background: var(--car); color: var(--car-ink, #fff); box-shadow: 0 0 0 4px color-mix(in srgb, var(--car) 30%, transparent); }
.bmp.is-tilt .bmp-modes, .bmp.is-tilt .bmp-look, .bmp.is-tilt [data-room-strip], .bmp.is-tilt .room-host-row { visibility: hidden; }
.bmp-sound { align-self: center; }

/* The phone's own car, big: balloons, score, place (the owner's list, 28 Sep 2026). */
.bmp-status {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "car main place" "chips chips chips";
  align-items: center; gap: 0.5rem 0.75rem; width: min(100%, 24rem); padding: 0.75rem 1rem;
  border-radius: 1.25rem; background: color-mix(in srgb, var(--car) 12%, var(--surface-solid));
  border: 2px solid color-mix(in srgb, var(--car) 45%, transparent);
}
.bmp-status.is-compact { grid-template-columns: auto auto auto 1fr; grid-template-areas: "car main place chips"; width: auto; padding: 0.35rem 0.75rem; gap: 0.6rem; }
.bmp-status__car { grid-area: car; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--car); border: 3px solid #1b1b1f; }
.bmp-status__main { grid-area: main; display: flex; align-items: baseline; gap: 0.35rem; min-height: 2.2rem; }
.bmp-status__main.is-bump { animation: bmp-bump 420ms var(--ease-out, ease-out); }
@keyframes bmp-bump { 30% { scale: 1.18; } }
.bmp-status__n { font: 900 2rem var(--font-display, inherit); line-height: 1; }
.bmp-status__unit, .bmp-status__wait { color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; }
.bmp-status__ghost { font-weight: 800; color: var(--text-2); }
.bmp-status__place { grid-area: place; font: 900 1.4rem var(--font-display, inherit); color: var(--text-2); }
.bmp-status__place.is-first { color: var(--text-strong); text-decoration: underline 0.18em var(--car); text-underline-offset: 0.2em; }
.bmp-status__chips { grid-area: chips; display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }
.bmp-status.is-compact .bmp-status__chips { justify-content: flex-start; }
.bmp-balloon {
  display: inline-block; width: 1.35rem; height: 1.6rem; border-radius: 50% 50% 48% 48%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--car) 45%, #fff), var(--car) 65%);
  border: 2px solid #1b1b1f; position: relative; margin-inline-end: 0.1rem;
}
.bmp-balloon::after { content: ''; position: absolute; left: 50%; bottom: -0.35rem; width: 0.3rem; height: 0.3rem; margin-left: -0.15rem; background: #1b1b1f; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.bmp-balloon.is-popped { background: transparent; border-style: dashed; opacity: 0.35; }
.bmp-balloon.is-popped::after { display: none; }
.bmp-acts { display: flex; gap: 0.75rem; width: min(100%, 22rem); }
.bmp-land .bmp-acts { width: 100%; max-width: 16rem; }
.bmp-act {
  flex: 1; min-height: 3.25rem; border-radius: 1rem; border: 3px solid #1b1b1f; font: 900 1.05rem var(--font-display, inherit);
  box-shadow: 0 0.3rem 0 #1b1b1f; position: relative; overflow: hidden; touch-action: manipulation;
}
.bmp-act:active { transform: translateY(0.2rem); box-shadow: 0 0.1rem 0 #1b1b1f; }
.bmp-act--boost { background: var(--car); color: var(--car-ink, #fff); }
/* The red and the violet reach 4.5:1 with neither ink: the word on a darker pill. */
.bmp-act--boost.is-plate .bmp-act__label { padding: 0.1rem 0.55rem; border-radius: var(--r-full); background: rgba(0, 0, 0, 0.3); }
.bmp-act--horn { background: var(--surface-solid); color: var(--text); }
.bmp-act__ring { position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,0.45) calc(var(--cd, 0) * 360deg), transparent 0); pointer-events: none; }
.bmp-act__label { position: relative; }
.bmp-act--boost.is-cool { filter: saturate(0.6); }
.bmp-row__place { font-weight: 900; min-width: 1.4rem; text-align: center; }
.bmp-row__stat { display: flex; align-items: center; gap: 0.3rem; justify-self: end; }
.bmp-row__stat .bmp-balloon { width: 0.95rem; height: 1.15rem; }
.bmp-row.is-ghost { opacity: 0.55; }
.bmp-table .bmp-row, .bmp-rows .bmp-row { grid-template-columns: auto auto 1fr auto auto auto; }
.bmp-tv__mode { text-align: center; font: 800 2.4vmin var(--font-display, inherit); color: var(--text-2); }
.bmp-stats-btn { align-self: center; opacity: 0.7; }
.bmp-how { text-align: center; }
.bmp-tv__stage { position: relative; }
.bmp-3d { position: absolute; inset: 0; }
.bmp-canvas3d, .bmp-overlay { position: absolute; left: 0; top: 0; border-radius: 1.2vmin; }
.bmp-overlay { pointer-events: none; }
/* A phone on its side, the stick: the stick on the left (a left thumb), the car,
   Turbo, Horn and the switch beside it - all on the first screen. */
@media (orientation: landscape) and (max-height: 500px) {
  .bmp:has(> .bmp-pad) {
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; justify-items: center;
    align-content: start; column-gap: var(--sp-5); row-gap: var(--sp-2); direction: ltr;
  }
  .bmp:has(> .bmp-pad) > * { grid-column: 2; }
  html[dir="rtl"] .bmp:has(> .bmp-pad) > * { direction: rtl; }
  .bmp:has(> .bmp-pad) > .bmp-pad { grid-column: 1; grid-row: 1 / span 5; direction: ltr; width: min(calc(var(--app-h, 100vh) - var(--header-h) - 2.5rem), 44vw, 22rem); }
  .bmp:has(> .bmp-pad) > .bmp-status { padding: 0.5rem 0.75rem; gap: 0.35rem 0.6rem; }
  .bmp:has(> .bmp-pad) .bmp-status__n { font-size: 1.6rem; }
  .bmp:has(> .bmp-pad) > [data-room-strip], .bmp:has(> .bmp-pad) > .room-host-row { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  .bmp-pop { animation: none; opacity: 0; }
  .bmp-status__main.is-bump { animation: none; }
  .bmp-pad__knob { transition: none; }
}


/* ============================================================================
   52. A game switched off for a fix (DisabledGames.js, 28 Sep 2026): its card
   greyed wherever it shows, with «🛠️ بنصلّحها»; a tap only says so.
   ========================================================================= */
.is-off { filter: grayscale(1); opacity: 0.62; }
.is-off:hover { transform: none; }
.gcard.is-off { cursor: not-allowed; }
.game-off-badge {
  position: absolute; top: 0.5rem; inset-inline-start: 0.5rem; z-index: 2;
  display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.15rem 0.55rem;
  border-radius: 999px; background: #1b1b1f; color: #fff; font-size: 0.72rem; font-weight: 800; white-space: nowrap;
}
.recent-tile.is-off, .room-poster.is-off, .tv-hub__game.is-off { position: relative; }
.recent-tile .game-off-badge { font-size: 0.7rem; top: -0.35rem; inset-inline-start: -0.2rem; padding: 0.1rem 0.3rem; }
.gcard > .game-off-badge { position: absolute; }

/* =====================================================================
   54. جمجمة (SKULL in rooms, JS_RoomSkull.html, 28 Sep 2026): every seat a card
   in the player's own colour with its pile of discs face down, the discs drawn
   our way (a rose, jasmine or a lotus, and a friendly skull), the bet in the
   middle, your discs, the bar; the TV the table big beside the bet.
   ========================================================================= */
:root {
  /* A seat's colour, the same in both themes (the discs are objects on the table). */
  --skl-c0: #d6453d; --skl-c1: #3f73d6; --skl-c2: #2f9e5b; --skl-c3: #7c3aed;
  --skl-c4: #e39a12; --skl-c5: #0e9aa7; --skl-c6: #db2777; --skl-c7: #ea6a1f;
  --skl-face: #fff7ea;
  --skl-face-skull: #f3e8ff;
  --skl-ink: #2b2438;
}
.skl { display: grid; gap: var(--sp-3); }
.skl-head { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: center; }
.skl-latest {
  margin: 0 auto; max-width: 34rem; padding: 0.4rem 0.9rem; border-radius: var(--r-full);
  background: var(--surface-2); color: var(--text-2); font-size: var(--fs-sm); font-weight: 600; text-align: center;
}
.skl-latest.is-good { background: color-mix(in srgb, var(--success) 16%, var(--surface-2)); color: var(--text); }
.skl-latest.is-bad { background: color-mix(in srgb, var(--danger) 14%, var(--surface-2)); color: var(--text); }
.skl-latest.is-new { animation: skl-pop-in 420ms cubic-bezier(0.2, 1.3, 0.4, 1) both; }
.skl-layout { display: grid; gap: var(--sp-3); }
.skl-layout__table, .skl-layout__side { display: grid; gap: var(--sp-3); align-content: start; min-width: 0; }

/* The discs */
.skl-disc { --skl-d: 3rem; display: inline-block; width: var(--skl-d); height: var(--skl-d); flex: none; line-height: 0; filter: drop-shadow(0 2px 2px rgba(20, 12, 40, 0.28)); }
.skl-disc__svg { width: 100%; height: 100%; display: block; }
.skl-disc__rim { fill: var(--skl-c, var(--skl-c0)); }
.skl-disc__face { fill: var(--skl-face); stroke: var(--skl-ink); stroke-width: 1.4; }
.skl-disc__face.is-skull { fill: var(--skl-face-skull); }
.skl-disc.is-small { --skl-d: 1.9rem; }
.skl-disc.is-gone { opacity: 0.6; filter: grayscale(0.4); }

/* A seat */
.skl-table { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.skl-seat {
  position: relative; display: grid; gap: 0.35rem; padding: 0.55rem 0.6rem 0.5rem; min-width: 0;
  border-radius: var(--r-lg); background: var(--surface-solid);
  border: 2px solid color-mix(in srgb, var(--skl-c) 45%, transparent);
  box-shadow: var(--sh-1);
  transition: box-shadow var(--dur-2, 200ms) ease, transform var(--dur-2, 200ms) ease;
}
.skl-seat.is-me { border-color: var(--skl-c); }
.skl-seat.is-turn { box-shadow: 0 0 0 3px var(--accent), var(--sh-2); animation: skl-turn 1.6s ease-in-out infinite; }
.skl-seat.is-bidder { box-shadow: 0 0 0 3px var(--pop, #f59e0b), var(--sh-2); }
.skl-seat.is-out { filter: grayscale(0.9); opacity: 0.55; }
.skl-seat.is-away .skl-avatar { opacity: 0.55; }
.skl-seat__head { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
.skl-avatar {
  flex: none; display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 50%;
  background: var(--skl-c); color: #fff; font-weight: 800; font-size: 0.85rem; border: 2px solid var(--skl-ink);
}
.skl-seat__name { flex: 1; min-width: 0; font-weight: 700; font-size: var(--fs-sm); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skl-tag { flex: none; padding: 0.05rem 0.45rem; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
.skl-tag--bet { background: color-mix(in srgb, var(--pop, #f59e0b) 26%, var(--surface-2)); color: var(--text); }
.skl-tag--out { background: color-mix(in srgb, var(--danger) 16%, var(--surface-2)); }
.skl-tag--wait { opacity: 0.7; }
.skl-seat__body { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
.skl-pilewrap { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 4.3rem; flex-wrap: wrap; }
.skl-pile.is-spent { width: 0.25rem; }
.skl-pile {
  position: relative; width: 3.4rem; height: 4.2rem; flex: none; padding: 0; margin: 0;
  background: none; border: 0; border-radius: var(--r-md); color: inherit; font: inherit;
}
button.skl-pile { cursor: pointer; }
.skl-pile.is-flippable { box-shadow: 0 0 0 3px var(--accent); animation: skl-flippable 1.2s ease-in-out infinite; }
.skl-pile__stack { position: absolute; inset: 0; }
.skl-pile__disc { position: absolute; left: 50%; bottom: 0.2rem; transform: translate(-50%, calc(var(--k) * -0.36rem)); }
.skl-pile__empty { position: absolute; left: 50%; bottom: 0.3rem; width: 2.8rem; height: 2.8rem; transform: translateX(-50%); border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--skl-c) 50%, transparent); }
.skl-pile__n { position: absolute; top: -0.2rem; inset-inline-end: -0.3rem; min-width: 1.35rem; padding: 0 0.3rem; border-radius: var(--r-full); background: var(--skl-ink); color: #fff; font-size: 0.72rem; line-height: 1.35rem; text-align: center; }
.skl-pile__flips { display: flex; gap: 0.15rem; flex-wrap: wrap; justify-content: center; max-width: 7rem; }
.skl-pile__up .skl-disc { --skl-d: 2rem; }
.skl-seat__foot { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.35rem; font-size: 0.75rem; color: var(--text-2); }
.skl-mat { display: inline-flex; align-items: center; gap: 0.15rem; padding: 0.05rem 0.4rem; border-radius: var(--r-sm, 6px); background: var(--surface-2); font-weight: 700; }
.skl-mat.is-won { background: color-mix(in srgb, #e03a52 18%, var(--surface-2)); color: var(--text); }
.skl-left { display: inline-flex; gap: 0.18rem; }
.skl-left i { width: 0.55rem; height: 0.55rem; border-radius: 50%; border: 1.5px solid var(--skl-c); }
.skl-left i.is-on { background: var(--skl-c); }
.skl-inhand { font-weight: 700; }

/* The bet */
.skl-mid { display: grid; justify-items: center; gap: 0.4rem; padding: var(--sp-2) var(--sp-3); text-align: center; }
.skl-bubble { padding: 0.5rem 1rem; border-radius: var(--r-lg); background: var(--accent-soft); color: var(--text); font-weight: 700; }
.skl-bubble b { color: var(--accent-ink); }
.skl-bubble.is-quiet { background: var(--surface-2); color: var(--text-2); font-weight: 600; }
.skl-bubble.is-new { animation: skl-pop-in 480ms cubic-bezier(0.2, 1.4, 0.4, 1) both; }
.skl-prog { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; max-width: 18rem; }
.skl-prog i { width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid #e03a52; }
.skl-prog i.is-on { background: #e03a52; }
.skl-total { margin: 0; font-size: var(--fs-sm); color: var(--text-2); }

/* Your discs */
.skl-mine { display: grid; gap: 0.5rem; padding: var(--sp-3); border-radius: var(--r-lg); background: var(--surface-solid); box-shadow: var(--sh-1); }
.skl-mine__head { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
.skl-mine__title { flex: 1; }
.skl-hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; min-height: 3.8rem; }
.skl-hdisc { padding: 0; margin: 0; border: 0; background: none; border-radius: 50%; line-height: 0; transition: transform 200ms cubic-bezier(0.2, 1.3, 0.4, 1); }
.skl-hdisc .skl-disc { --skl-d: 3.6rem; }
button.skl-hdisc { cursor: pointer; min-width: 44px; min-height: 44px; }
.skl-hdisc.is-sel { transform: translateY(-0.5rem) scale(1.06); box-shadow: 0 0 0 3px var(--accent); }
.skl-hand__empty { color: var(--text-3); font-size: var(--fs-sm); align-self: center; }
.skl-mine__row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--text-2); }
.skl-mine__label { font-weight: 700; font-size: var(--fs-sm); color: var(--text-2); }
.skl-mine__discs { display: inline-flex; gap: 0.25rem; }

/* The bar */
.skl-actbar, .skl-note { display: grid; gap: 0.55rem; padding: var(--sp-3); border-radius: var(--r-lg); background: var(--surface-solid); box-shadow: var(--sh-2); text-align: center; }
.skl-actbar { border: 2px solid var(--accent); }
.skl-prompt { margin: 0; font-weight: 800; color: var(--text); }
.skl-prompt.is-mine { color: var(--accent-ink); }
.skl-hint { margin: 0; font-size: var(--fs-sm); color: var(--text-2); }
.skl-actrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--sp-2); }
.skl-nums { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center; }
.skl-num {
  min-width: 2.75rem; height: 2.75rem; padding: 0 0.4rem; border-radius: var(--r-md);
  border: 2px solid var(--border, rgba(0,0,0,.12)); background: var(--surface-2); color: var(--text);
  font-weight: 800; font-size: 1rem; cursor: pointer; transition: transform 150ms ease;
}
.skl-num.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-on); transform: scale(1.08); }

/* «هيعملها؟» */
.skl-guess { position: relative; display: grid; gap: 0.45rem; justify-items: center; }
.skl-guess__q { margin: 0; font-weight: 700; }
.skl-guess__bar { width: 100%; max-width: 20rem; height: 0.45rem; border-radius: var(--r-full); background: var(--surface-2); overflow: hidden; }
.skl-guess__bar i { display: block; height: 100%; background: var(--accent); transform-origin: left center; animation: skl-drain var(--skl-guess-ms, 8000ms) linear both; }
.skl-guess__left { position: absolute; top: 0; inset-inline-end: 0; font-weight: 800; color: var(--text-2); }
.skl-gchips { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
.skl-gchip { padding: 0.1rem 0.55rem; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); font-size: 0.78rem; font-weight: 700; }
.skl-gchip.is-done { background: color-mix(in srgb, var(--success) 20%, var(--surface-2)); color: var(--text); }

/* A round's result */
.skl-res { display: grid; justify-items: center; gap: 0.5rem; text-align: center; }
.skl-res.is-won { border: 2px solid var(--success); }
.skl-res.is-lost { border: 2px solid var(--danger); }
.skl-res.is-new { animation: skl-rise 520ms cubic-bezier(0.2, 1.2, 0.4, 1) var(--skl-wait, 0ms) both; }
.skl-res__icon .skl-disc { --skl-d: 4rem; }
.skl-res.is-new .skl-res__icon { animation: skl-bloom 700ms cubic-bezier(0.2, 1.4, 0.4, 1) calc(var(--skl-wait, 0ms) + 200ms) both; }
.skl-res__title { font-weight: 800; font-size: 1.1rem; color: var(--text); }
.skl-res__lost { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.7rem; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); font-weight: 600; }
.skl-res__out { margin: 0; font-weight: 700; color: var(--danger-ink, var(--danger)); }
.skl-res__guesses { display: grid; gap: 0.3rem; justify-items: center; }
.skl-gress { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center; }
.skl-gres { padding: 0.12rem 0.55rem; border-radius: var(--r-full); font-size: 0.8rem; font-weight: 700; background: var(--surface-2); color: var(--text); }
.skl-gres.is-right { background: color-mix(in srgb, var(--success) 22%, var(--surface-2)); }
.skl-gres.is-wrong { opacity: 0.7; }
.skl-res.is-new .skl-gres { animation: skl-pop-in 360ms cubic-bezier(0.2, 1.3, 0.4, 1) calc(var(--skl-wait, 0ms) + 500ms + var(--at, 0ms)) both; }
.skl-log { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.15rem; font-size: 0.78rem; color: var(--text-3); text-align: center; }
.skl-over { display: grid; gap: var(--sp-3); }
.skl-won { display: grid; justify-items: center; gap: 0.4rem; text-align: center; }
.skl-won__icon .skl-disc { --skl-d: 4.5rem; }
.skl.is-over .skl-layout__table .skl-seat { opacity: 0.9; }

/* The lobby */
.skl-lobby { display: grid; gap: var(--sp-2); }
.skl-lobby__discs { display: flex; justify-content: center; gap: 0.3rem; }
.skl-lobby__discs .skl-disc { --skl-d: 2.6rem; }
.skl-lobby__discs .skl-disc:nth-child(odd) { transform: translateY(0.2rem) rotate(-8deg); }

/* In flight, over the page */
.skl-fly { position: fixed; z-index: var(--z-fx-ghost); pointer-events: none; will-change: transform, opacity; }
.skl-fly > .skl-disc { width: 100%; height: 100%; --skl-d: 100%; }
.skl-turn > span { position: absolute; inset: 0; }
.skl-turn > span > .skl-disc { width: 100%; height: 100%; }

/* A phone on its side, a laptop: the table beside the side column */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) {
  .skl-layout { grid-template-columns: minmax(0, 1.5fr) minmax(16rem, 1fr); align-items: start; }
  .skl-table { grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .skl-layout { grid-template-columns: minmax(0, 1.3fr) minmax(15rem, 1fr); }
  .skl-table { grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.4rem; }
  .skl-seat { padding: 0.4rem 0.45rem; gap: 0.2rem; }
  .skl-pilewrap { min-height: 3.2rem; }
  .skl-pile { width: 2.8rem; height: 3.3rem; }
  .skl-pile__disc .skl-disc { --skl-d: 2.4rem; }
  .skl-pile__up .skl-disc { --skl-d: 1.6rem; }
  .skl-hdisc .skl-disc { --skl-d: 3rem; }
}
@media (min-width: 900px) {
  .skl-table { grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
}

/* The TV */
.skl-tv { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 2vmin; height: 100%; align-items: start; padding: 1vmin 2vmin; }
.skl-tv__table .skl-table { grid-template-columns: repeat(auto-fill, minmax(22vmin, 1fr)); gap: 1.6vmin; }
.skl-tv .skl-seat { padding: 1.2vmin; gap: 0.8vmin; }
.skl-tv .skl-seat__name { font-size: 2.4vmin; }
.skl-tv .skl-avatar { width: 4vmin; height: 4vmin; font-size: 2vmin; }
.skl-tv .skl-tag { font-size: 1.7vmin; }
.skl-tv .skl-pilewrap { min-height: 10vmin; }
.skl-tv .skl-pile { width: 8vmin; height: 10vmin; }
.skl-tv .skl-pile__disc .skl-disc { --skl-d: 7vmin; }
.skl-tv .skl-pile__up .skl-disc { --skl-d: 4.6vmin; }
.skl-tv .skl-seat__foot { font-size: 1.8vmin; }
.skl-tv__side { display: grid; gap: 1.6vmin; align-content: start; }
.skl-tv__turn { font-size: 3vmin; font-weight: 800; text-align: center; color: var(--text); }
.skl-tv .skl-bubble { font-size: 2.8vmin; }
.skl-tv .skl-total, .skl-tv .skl-latest { font-size: 2vmin; }
.skl-tv .skl-guess__q { font-size: 2.6vmin; }
.skl-tv .skl-res__title { font-size: 3vmin; }
.skl-tv__side.tv-scale { max-height: 100%; overflow: hidden auto; }
.skl-tv__side .skl-won { padding-block: 0.8rem; }
.skl-tv__side .skl-won__icon .skl-disc { --skl-d: 3.2rem; }
/* The TV round a table (1 Oct 2026, sklTvFrame): the seats down one side and back up the other,
   one above and one below the table from 5 and 6 players; the table an oval in the middle with
   the phase's line, the bet, «هيعملها؟» and the result; the latest move at the foot. */
.skl-tv.skl-ring { display: flex; flex-direction: column; align-items: stretch; gap: 1.4vmin; padding: 0.6vmin 1vmin; }
.skl-ring__top { flex: none; }
.skl-ring__top .skl-head { gap: 1.2vmin; }
.skl-ring__top .badge:not([data-skl-clock]) { font-size: 2.2vmin; padding: 0.5vmin 1.6vmin; background: var(--surface-solid); border: 1px solid var(--border); }
.skl-ring__top [data-skl-clock] { font-size: 3.4vmin; padding: 0.4vmin 2vmin; }
.skl-ring__board {
  flex: 1 1 auto; min-height: 0; display: grid; gap: 2vmin;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr);
}
.skl-ring__side { display: flex; flex-direction: column; justify-content: space-around; align-items: center; gap: 1.6vmin; min-width: 0; min-height: 0; }
.skl-ring__side > .skl-seat { width: min(100%, 50vmin); }
.skl-ring__mid { display: flex; flex-direction: column; gap: 1.6vmin; min-width: 0; min-height: 0; }
.skl-ring__cap { flex: none; display: flex; justify-content: center; }
.skl-ring__cap > .skl-seat { width: min(100%, 44vmin); }
.skl-ring__table {
  flex: 1 1 auto; min-height: 24vmin; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vmin;
  padding: 3vmin 6vmin; border-radius: 50%; text-align: center; overflow: hidden;
  background: color-mix(in srgb, var(--accent) 9%, var(--surface-solid));
  border: 0.5vmin solid color-mix(in srgb, var(--accent) 45%, var(--surface-solid));
  box-shadow: var(--sh-2);
}
/* «هيعملها؟» and the result hold more than a line: the table's corners open out. */
.skl-ring__table.is-wide { border-radius: 8vmin; padding: 2vmin 3vmin; }
.skl-ring__big { font-size: 11vmin; font-weight: 900; line-height: 1; color: var(--accent-ink); }
.skl-ring__sub { font-size: 3vmin; font-weight: 800; color: var(--text); }
.skl-ring__turn { font-size: 3.6vmin; font-weight: 900; line-height: 1.25; color: var(--text-strong); text-wrap: balance; }
.skl-ring .skl-mid { padding: 0; gap: 1vmin; }
.skl-ring .skl-bubble { font-size: 3.2vmin; padding: 1vmin 2.4vmin; }
.skl-ring .skl-prog i { width: 2.4vmin; height: 2.4vmin; border-width: 0.35vmin; }
.skl-ring .skl-prog { max-width: none; gap: 0.8vmin; }
.skl-ring .skl-total { font-size: 2.2vmin; }
.skl-ring .skl-guess { width: 100%; }
.skl-ring .skl-guess__q { font-size: 3vmin; }
.skl-ring .skl-guess__bar { height: 1vmin; max-width: 60vmin; }
.skl-ring .skl-gchip, .skl-ring .skl-gres { font-size: 2.2vmin; padding: 0.4vmin 1.4vmin; }
.skl-ring .skl-guess__left { font-size: 3vmin; }
.skl-ring .skl-res { padding: 0; margin: 0; gap: 1vmin; background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
.skl-ring .skl-res__icon .skl-disc { --skl-d: 9vmin; }
.skl-ring .skl-res__title { font-size: 3.4vmin; }
.skl-ring .skl-res__out, .skl-ring .skl-hint, .skl-ring .skl-mine__label { font-size: 2.2vmin; }
/* The seats: the name big, the pile big, the discs left and the bets won under it. */
.skl-ring .skl-seat { padding: 1.2vmin 1.6vmin; gap: 0.8vmin; border-width: 0.35vmin; }
.skl-ring .skl-seat.is-turn { box-shadow: 0 0 0 0.6vmin var(--accent), 0 0 4vmin color-mix(in srgb, var(--accent) 45%, transparent); }
.skl-ring .skl-seat__head { gap: 1.2vmin; }
.skl-ring .skl-avatar { width: 5.4vmin; height: 5.4vmin; font-size: 2.8vmin; border-width: 0.3vmin; }
.skl-ring .skl-seat__name { font-size: 3.6vmin; font-weight: 900; }
.skl-ring .skl-tag { font-size: 2.2vmin; padding: 0.2vmin 1.2vmin; }
.skl-ring .skl-seat__body { gap: 1.4vmin; }
.skl-ring .skl-pilewrap { min-height: 11vmin; gap: 1vmin; }
.skl-ring .skl-pile { width: 9vmin; height: 11vmin; }
.skl-ring .skl-pile__disc { transform: translate(-50%, calc(var(--k) * -0.8vmin)); }
.skl-ring .skl-pile__disc .skl-disc { --skl-d: 8vmin; }
.skl-ring .skl-pile__empty { width: 7.4vmin; height: 7.4vmin; border-width: 0.35vmin; }
.skl-ring .skl-pile__n { min-width: 3.4vmin; line-height: 3.4vmin; font-size: 2.2vmin; padding: 0 0.8vmin; }
.skl-ring .skl-pile__flips { max-width: 16vmin; gap: 0.4vmin; }
.skl-ring .skl-pile__up .skl-disc { --skl-d: 5vmin; }
.skl-ring .skl-seat__foot { font-size: 2.4vmin; gap: 0.8vmin; }
.skl-ring .skl-left { gap: 0.5vmin; }
.skl-ring .skl-left i { width: 1.6vmin; height: 1.6vmin; border-width: 0.3vmin; }
/* Three a side (7 and 8 at the table): the seats lower. */
.skl-ring--n7 .skl-ring__side .skl-pilewrap, .skl-ring--n8 .skl-ring__side .skl-pilewrap { min-height: 7vmin; }
.skl-ring--n7 .skl-ring__side .skl-pile, .skl-ring--n8 .skl-ring__side .skl-pile { width: 6.4vmin; height: 7.4vmin; }
.skl-ring--n7 .skl-ring__side .skl-pile__disc .skl-disc, .skl-ring--n8 .skl-ring__side .skl-pile__disc .skl-disc { --skl-d: 5.6vmin; }
.skl-ring--n7 .skl-ring__side .skl-seat__name, .skl-ring--n8 .skl-ring__side .skl-seat__name { font-size: 3vmin; }
.skl-ring--n7 .skl-ring__side .skl-seat, .skl-ring--n8 .skl-ring__side .skl-seat { padding-block: 0.8vmin; }
.skl-ring__foot { flex: none; display: grid; justify-items: center; gap: 0.6vmin; }
.skl-ring__foot .skl-latest { font-size: 2.6vmin; padding: 0.6vmin 2.4vmin; }
.skl-ring__foot .skl-log { font-size: 1.9vmin; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4vmin 2.4vmin; }
.skl-ring__foot .tv-actions:not(:has(.btn)) { display: none; }
@media (min-width: 1280px) and (min-height: 700px)  { .skl-tv__side.tv-scale { zoom: 1.1; } }
@media (min-width: 1700px) and (min-height: 950px)  { .skl-tv__side.tv-scale { zoom: 1.35; } }
@media (min-width: 2500px) and (min-height: 1400px) { .skl-tv__side.tv-scale { zoom: 1.9; } }

@keyframes skl-pop-in { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes skl-rise { 0% { opacity: 0; transform: translateY(14px) scale(0.96); } 100% { opacity: 1; transform: none; } }
@keyframes skl-bloom { 0% { transform: scale(0.3) rotate(-30deg); } 70% { transform: scale(1.15) rotate(8deg); } 100% { transform: none; } }
@keyframes skl-turn { 0%, 100% { transform: none; } 50% { transform: translateY(-2px); } }
@keyframes skl-flippable { 0%, 100% { box-shadow: 0 0 0 3px var(--accent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 40%, transparent); } }
@keyframes skl-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

@media (prefers-reduced-motion: reduce) {
  .skl-seat.is-turn, .skl-pile.is-flippable, .skl-latest.is-new, .skl-bubble.is-new, .skl-res.is-new,
  .skl-res.is-new .skl-res__icon, .skl-res.is-new .skl-gres { animation: none; }
  .skl-guess__bar i { animation: none; }
}

/* ============================================================================
   53. السلم والتعبان (SNAKES & LADDERS, JS_Snakes.html and JS_RoomSnakes.html,
   28 Sep 2026): the board is one <svg> the page moves into whichever screen
   shows it; its own colours are look أ «كلاسيك بلمستنا» (mint #d5f5dc, teal
   #4a9aa2, the frame #17454a), set in the drawing, not here. This section is
   the frame around it (the players, the bar, the log, the end), the setup's
   swatches and the lobby's colours, and the board's small living loops
   (tongues, blinks, Zzz, butterflies, the cup), all still under reduced motion.
   ========================================================================= */
.snk-board { width: 100%; }
.snk-svg { display: block; width: 100%; height: auto; aspect-ratio: 646 / 700; border-radius: 18px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.snk-host { width: 100%; }

.snk-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.snk-layout__side { display: contents; }
.snk-layout__board { width: 100%; max-width: 34rem; margin-inline: auto; }
.snk-layout__side > .snk-over { order: -3; }
.snk-layout__side > .snk-strip { order: -2; }

.snk-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.snk-chip {
  min-width: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 6px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: box-shadow var(--dur-2, 200ms) ease, opacity var(--dur-2, 200ms) ease;
}
.snk-chip.is-turn { border-color: transparent; box-shadow: 0 0 0 2px var(--pc), 0 4px 12px rgba(0, 0, 0, 0.08); }
.snk-chip.is-away { opacity: 0.55; }
.snk-chip__av {
  width: 1.5rem; height: 1.5rem; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--pc);
  color: #ffffff; font-weight: 800; font-size: 0.75rem; line-height: 1;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
}
.snk-chip.is-done .snk-chip__av { background: var(--surface-2); font-size: 1rem; }
.snk-chip__who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.snk-chip__name { font-size: 0.78rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snk-chip__name small { font-weight: 600; color: var(--text-2); }
.snk-chip__sq { font-size: 0.72rem; font-weight: 600; color: var(--text-2); white-space: nowrap; }

.snk-bar {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: 20px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  box-shadow: 0 -2px 14px rgba(40, 30, 20, 0.06);
}
.snk-bar.is-mine.is-ready { box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgba(40, 30, 20, 0.1); border-color: transparent; }
.snk-bar__dot { width: 0.8rem; height: 0.8rem; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--surface-solid), 0 0 0 3px var(--border); }
.snk-bar__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.snk-bar__t1 { font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.15rem; line-height: 1.2; }
.snk-bar__t2 { font-size: 0.82rem; font-weight: 500; color: var(--text-2); }
.snk-bar__t2:empty { display: none; }
.snk-bar__clock { flex: none; }
.snk-bar__roll { flex: none; min-width: 6.5rem; }
.snk-bar.is-ready .snk-bar__roll { animation: snkNudge 1.8s ease-in-out infinite; }
@keyframes snkNudge { 0%, 72%, 100% { transform: none; } 80% { transform: rotate(-4deg) scale(1.04); } 90% { transform: rotate(4deg) scale(1.04); } }

.snk-log { display: flex; flex-direction: column; gap: 4px; min-height: 1.2rem; }
.snk-log__line { font-size: 0.8rem; font-weight: 500; color: var(--text-2); line-height: 1.4; }
.snk-log__line.is-latest { color: var(--text); font-weight: 600; }

.snk-over { display: flex; flex-direction: column; gap: var(--sp-3); }
.snk-over.is-waiting { display: none; }
.snk-over__title { margin: 0; text-align: center; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.2rem; }
.snk-over .podium { margin: 0; }
.snk-over__rest { margin: 0; text-align: center; font-size: 0.82rem; color: var(--text-2); }
.snk-podium__color { width: 0.75rem; height: 0.75rem; border-radius: 50%; }

/* --- the setup screen and the room's lobby --------------------------------------- */
.snk-swatches { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.snk-swatch {
  width: 2.75rem; height: 2.75rem;
  border-radius: 50%;
  border: 0;
  background: var(--pc);
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.4), 0 2px 5px rgba(0, 0, 0, 0.15);
  cursor: pointer;
  transition: transform var(--dur-2, 200ms) var(--ease-out, ease-out), box-shadow var(--dur-2, 200ms) ease;
}
.snk-swatch.is-active { transform: scale(1.08); box-shadow: 0 0 0 3px var(--surface-solid), 0 0 0 6px var(--text); }
.snk-picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.snk-pick {
  min-width: 0; min-height: 2.9rem;
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2);
  border-radius: 14px;
  border: 0;
  background: var(--pc);
  color: #ffffff;
  text-align: start;
  cursor: pointer;
}
.snk-pick:disabled { cursor: default; }
.snk-pick.is-taken:not(.is-mine) { opacity: 0.55; }
.snk-pick.is-mine { box-shadow: 0 0 0 3px var(--surface-solid), 0 0 0 5.5px var(--text); }
.snk-pick__dot { width: 1.2rem; height: 1.2rem; flex: none; border-radius: 50%; background: rgba(255, 255, 255, 0.9); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
.snk-pick__who { min-width: 0; font-size: 0.78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }

/* --- the board's own life (the owner: "the map alive by itself") ------------------ */
.snk-tongue { transform-box: fill-box; transform-origin: 50% 0%; animation: snkFlick 3.6s infinite; }
@keyframes snkFlick { 0%, 80%, 100% { transform: scaleY(0); } 84%, 93% { transform: scaleY(1); } 88% { transform: scaleY(0.65); } }
.snk-lid { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); animation: snkBlink 5s infinite; }
@keyframes snkBlink { 0%, 93%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
.m-sleep .snk-lid, .m-sneeze .snk-lid { animation: none; transform: scaleY(1); }
.m-sleep .snk-tongue { animation: none; transform: scaleY(0); }
.snk-zz { opacity: 0; }
.m-sleep .snk-zz { opacity: 1; animation: snkZz 2s ease-in-out infinite; }
@keyframes snkZz { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(8px, -14px); opacity: 0; } }
.snk-spi { opacity: 0; }
.m-spiral .snk-spi { opacity: 1; }
.m-spiral .snk-pup { opacity: 0; }
.snk-spin { transform-box: fill-box; transform-origin: 50% 50%; animation: snkSpin 1.1s linear infinite; }
@keyframes snkSpin { to { transform: rotate(360deg); } }
.snk-brow { opacity: 0; }
.m-wow .snk-brow { opacity: 1; }
.m-wow .snk-pup { transform: scale(0.7); }
.snk-fly { animation: snkFlyA 16s linear infinite; }
.snk-fly.b { animation: snkFlyB 21s linear infinite; }
@keyframes snkFlyA { 0% { transform: translate(-20px, 200px); } 25% { transform: translate(210px, 70px); } 50% { transform: translate(470px, 260px); } 75% { transform: translate(260px, 480px); } 100% { transform: translate(-20px, 200px); } }
@keyframes snkFlyB { 0% { transform: translate(620px, 520px); } 33% { transform: translate(380px, 360px); } 66% { transform: translate(120px, 540px); } 100% { transform: translate(620px, 520px); } }
.snk-wing { transform-box: fill-box; transform-origin: 100% 50%; animation: snkFlap 0.22s ease-in-out infinite alternate; }
.snk-wing.r { transform-origin: 0% 50%; }
@keyframes snkFlap { to { transform: scaleX(0.2); } }
.snk-cup { transform-box: fill-box; transform-origin: 50% 100%; animation: snkCup 3s ease-in-out infinite; }
@keyframes snkCup { 50% { transform: rotate(-5deg) translateY(-2px); } }
.snk-shine { animation: snkShine 4.5s ease-in-out infinite; }
@keyframes snkShine { 0%, 100% { stroke-opacity: 0.2; } 50% { stroke-opacity: 0.55; } }
.snk-piece.is-mine .snk-pb > rect { stroke-width: 2.4; }

/* --- a phone on its side, and every wide screen: the board takes the height --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .snk-layout { display: grid; grid-template-columns: auto minmax(13rem, 21rem); justify-content: center; align-items: start; gap: var(--sp-4); }
  /* The side column is as tall as the board's play area and scrolls inside itself (snkFit sets both). */
  .snk-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 13rem; max-height: var(--snk-fh, none); overflow-y: auto; overscroll-behavior: contain; }
  .snk-layout__board {
    position: sticky; top: 0;
    width: var(--snk-bw, min(calc((var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem) * 646 / 700), 58vw));
    max-width: none; margin: 0;
  }
  .snk-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .snk-bar { position: static; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .snk-chip { padding-block: 4px; }
  .snk-strip { gap: 6px; }
  .snk-bar { padding: var(--sp-2); }
  .snk-bar__t1 { font-size: 1rem; }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-snakes, .shell__main > #view-room-snakes { max-width: 72rem; }
  .snk-layout { gap: var(--sp-6); grid-template-columns: auto minmax(15rem, 23rem); }
  .snk-layout__side { min-width: 15rem; }
  .snk-layout__board { width: var(--snk-bw, min(calc((var(--app-h, 100vh) - var(--header-h) - 2.5rem) * 646 / 700), 62vw)); }
  .snk-chip__name { font-size: 0.9rem; }
}

/* --- the TV: the board as tall as the stage, the players beside it --- */
.snk--tv { height: 100%; min-height: 0; display: flex; }
.snk--tv .snk-layout {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 30rem);
  justify-content: center; align-items: center;
  gap: calc(var(--tv-gap) * 2.5);
}
.snk--tv .snk-layout__side { display: flex; flex-direction: column; justify-content: center; gap: var(--tv-gap); min-width: 18rem; max-height: var(--snk-fh, none); overflow-y: auto; }
.snk--tv .snk-layout__board { position: static; width: var(--snk-bw, min(calc((var(--app-h, 100vh) - 17vmin) * 646 / 700), 60vw)); max-width: none; margin: 0; }
.snk--tv .snk-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tv-gap); }
.snk--tv .snk-chip { padding: 1vmin 1.4vmin; border-radius: var(--tv-r); gap: 1.2vmin; }
.snk--tv .snk-chip__av { width: 4.6vmin; height: 4.6vmin; font-size: var(--tv-sm); }
.snk--tv .snk-chip__name { font-size: var(--tv-md); }
.snk--tv .snk-chip__sq { font-size: var(--tv-sm); }
.snk--tv .snk-bar { position: static; padding: 1.4vmin 1.8vmin; border-radius: var(--tv-r); gap: 1.8vmin; }
.snk--tv .snk-bar__t1 { font-size: var(--tv-md); }
.snk--tv .snk-bar__t2 { font-size: var(--tv-sm); }
.snk--tv .snk-log__line { font-size: var(--tv-sm); }
.snk--tv .snk-over__title { font-size: var(--tv-md); }
@media (orientation: portrait) {
  .snk--tv { height: auto; }
  .snk--tv .snk-layout { grid-template-columns: minmax(0, 1fr); }
  .snk--tv .snk-layout__board { width: min(100%, 60vh); justify-self: center; }
  .snk--tv .snk-layout__side { min-width: 0; max-height: none; }
}

/* --- the second round (the owner, 29 Sep 2026): the pieces' moods, idle moments, reactions,
   sitting and cheering on the frame; the snake licking its lips; the cup shining; the TV's night.
   A class on the piece (JS_Snakes.html) shows a part; the moves' own faces (snkFace) are attributes,
   and a mood or an idle class is only on a piece while nothing of its own is being played. --- */
.snk-piece .snk-pb { transform-box: fill-box; transform-origin: 50% 100%; }
.snk-piece.mood-happy .snk-smile, .snk-piece.mood-scared .snk-smile, .snk-piece.mood-bored .snk-smile { opacity: 0; }
.snk-piece.mood-happy .snk-grin { opacity: 1; }
.snk-piece.mood-scared .snk-wob, .snk-piece.mood-scared .snk-sweat, .snk-piece.mood-scared .snk-eW { opacity: 1; }
.snk-piece.mood-scared .snk-eN { opacity: 0; }
.snk-piece.mood-scared .snk-pb { animation: snkShiver 0.35s linear infinite; }
@keyframes snkShiver { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-0.7px); } 75% { transform: translateX(0.7px); } }
.snk-piece.mood-bored .snk-flat, .snk-piece.mood-bored .snk-lids { opacity: 1; }
.snk-piece.mood-bored .snk-eN { translate: 0 0.8px; }

/* Waiting: a foot tapping, a yawn, eyes on the snakes. */
.snk-piece.idle-tap .snk-legR { transform-box: fill-box; transform-origin: 50% 0%; animation: snkTap 0.26s ease-in-out 7 alternate; }
@keyframes snkTap { to { transform: rotate(-38deg); } }
.snk-piece.idle-yawn .snk-smile { opacity: 0; }
.snk-piece.idle-yawn .snk-yawnM { transform-box: fill-box; transform-origin: 50% 50%; animation: snkYawnM 2.1s ease-in-out both; }
@keyframes snkYawnM { 0%, 100% { opacity: 0; transform: scale(0.4); } 25%, 70% { opacity: 1; transform: scale(1, 1.3); } }
.snk-piece.idle-yawn .snk-armsUp { animation: snkBlinkOn 2.1s ease-in-out both; }
@keyframes snkBlinkOn { 0%, 100% { opacity: 0; } 25%, 70% { opacity: 1; } }
.snk-piece.idle-yawn .snk-eN { transform-box: fill-box; transform-origin: 50% 50%; animation: snkShut 2.1s ease-in-out both; }
@keyframes snkShut { 0%, 100% { transform: none; } 25%, 70% { transform: scaleY(0.2); } }
.snk-piece.idle-watch .snk-eN, .snk-piece.idle-watch .snk-eW { animation: snkLook 2.2s ease-in-out both; }
@keyframes snkLook { 0%, 100% { translate: 0 0; } 20%, 80% { translate: var(--snk-lx, 1.6px) var(--snk-ly, 0px); } }

/* Sitting down after a long wait, and home on the frame by the cup, cheering the rest on. */
.snk-piece.is-sat .snk-pb, .snk-piece.is-home .snk-pb { translate: 0 5px; }
.snk-piece.is-sat .snk-legs, .snk-piece.is-home .snk-legs { opacity: 0; }
.snk-piece.is-sat .snk-legsSit, .snk-piece.is-home .snk-legsSit { opacity: 1; }
.snk-piece.is-home .snk-smile { opacity: 0; }
.snk-piece.is-home .snk-grin { opacity: 1; }
.snk-piece.is-home .snk-armsUp { animation: snkCheerArms 2.8s ease-in-out infinite; animation-delay: var(--snk-d, 0s); }
@keyframes snkCheerArms { 0%, 52%, 100% { opacity: 0; } 58%, 92% { opacity: 1; } }
.snk-piece.is-home .snk-pb { animation: snkCheerHop 2.8s ease-in-out infinite; animation-delay: var(--snk-d, 0s); }
@keyframes snkCheerHop { 0%, 55%, 100% { transform: none; } 65% { transform: translateY(-5px); } 75% { transform: none; } 84% { transform: translateY(-3px); } }

/* The others react to a snake or a ladder: a gasp, a laugh, a clap. */
.snk-piece.react-gasp .snk-smile, .snk-piece.react-laugh .snk-smile, .snk-piece.react-clap .snk-smile { opacity: 0; }
.snk-piece.react-gasp .snk-gasp, .snk-piece.react-gasp .snk-eW { opacity: 1; }
.snk-piece.react-gasp .snk-eN { opacity: 0; }
.snk-piece.react-gasp .snk-pb { animation: snkRGasp 0.9s ease-out both; }
@keyframes snkRGasp { 0%, 100% { transform: none; } 18% { transform: translateY(-6px) scale(1.06); } 40% { transform: translateY(0) scale(1); } }
.snk-piece.react-laugh .snk-grin, .snk-piece.react-clap .snk-grin { opacity: 1; }
.snk-piece.react-laugh .snk-pb { animation: snkRLaugh 1.2s ease-in-out both; }
@keyframes snkRLaugh { 0%, 100% { transform: none; } 15%, 45%, 75% { transform: rotate(-8deg) translateY(-2px); } 30%, 60%, 90% { transform: rotate(8deg); } }
.snk-piece.react-clap .snk-armsFwd { opacity: 1; transform-box: fill-box; transform-origin: 50% 50%; animation: snkRClap 0.2s ease-in-out 7 alternate both; }
@keyframes snkRClap { to { transform: scaleX(0.5); } }

/* The snake nearest 100 licks its lips from 95; the cup shines while anyone is that close. */
.m-lick .snk-tongue { animation: snkLick 0.4s ease-in-out infinite alternate; }
@keyframes snkLick { from { transform: scaleY(0.7) rotate(-14deg); } to { transform: scaleY(1.25) rotate(14deg); } }
.snk-cupglow { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
.is-near100 .snk-cupglow { animation: snkCupGlow 1.6s ease-in-out infinite; }
.is-drum .snk-cupglow { animation: snkCupGlow 0.45s ease-in-out infinite; }
@keyframes snkCupGlow { 0%, 100% { opacity: 0.12; transform: scale(0.85); } 50% { opacity: 0.6; transform: scale(1.15); } }

/* The TV's night comes slowly; its stars twinkle on the frame. */
.snk-dusk, .snk-stars { transition: opacity 8s linear; }
.snk-star { animation: snkTwinkle 2.4s ease-in-out infinite; }
@keyframes snkTwinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

/* --- the third round (the owner, 2 Oct 2026): the map's theme, the switches, teams, the surprise
   squares' objects (look ج «حاجة واقفة»), the awards' replay (look ج «لقطة»), and each themed map's
   own small loops (JS_Snakes<Theme>.html). --- */
.snk-themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.snk-theme {
  min-width: 0; min-height: 3.25rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: var(--sp-2);
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: transform var(--dur-2, 200ms) var(--ease-out, ease-out), box-shadow var(--dur-2, 200ms) ease;
}
.snk-theme__ic { font-size: 1.35rem; line-height: 1; }
.snk-theme__name { font-size: 0.78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.snk-theme.is-active { border-color: transparent; box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

.snk-lteams { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: var(--sp-2); }
.snk-lteam { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: var(--sp-2); border-radius: 14px; background: var(--surface-2); }
.snk-lteam__label { width: 100%; font-size: 0.78rem; font-weight: 800; color: var(--text-2); }
.snk-lteams__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-block-start: var(--sp-2); }
.snk-lteams__row .field__hint { margin: 0; flex: 1; min-width: 10rem; }

.snk-strip--teams { grid-template-columns: minmax(0, 1fr); }
.snk-team { min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: 6px; padding: 6px; border-radius: 16px; background: var(--surface-2); }
.snk-team__label { grid-column: 1 / -1; padding-inline: 4px; font-size: 0.74rem; font-weight: 800; color: var(--text-2); }
.snk-team.is-done .snk-team__label { color: var(--text); }
.snk-podium__cols { display: inline-flex; gap: 3px; }

/* The surprise squares' objects stand and move a little by themselves. */
.snk-sp-bob { transform-box: fill-box; transform-origin: 50% 100%; animation: snkSpBob 2.2s ease-in-out infinite; }
@keyframes snkSpBob { 50% { transform: translateY(-2.5px) rotate(-6deg); } }
.snk-sp-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: snkSpSway 2.8s ease-in-out infinite; }
@keyframes snkSpSway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
.snk-sp-glint { animation: snkSpGlint 2.6s ease-in-out infinite; }
@keyframes snkSpGlint { 50% { opacity: 0.25; } }
.snk-sp-zzz text, .snk-zzz text { opacity: 0; transform-box: fill-box; animation: snkSpZz 2.4s linear infinite; }
.snk-sp-zzz text:nth-child(2), .snk-zzz text:nth-child(2) { animation-delay: 0.8s; }
.snk-sp-zzz text:nth-child(3), .snk-zzz text:nth-child(3) { animation-delay: 1.6s; }
@keyframes snkSpZz { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(12px, -24px) scale(1.25); } }
.snk-zzz { font-family: system-ui, sans-serif; font-weight: 800; fill: #1d1830; stroke: #ffffff; stroke-width: 2.5px; paint-order: stroke; }
.snk-slow { animation-duration: 7s; }
.m-charm .snk-lid { animation: none; transform: scaleY(0.55); }

/* The awards' replay: over the board, in the board's own root (a redrawn frame doesn't cut it). */
.snk-board { position: relative; }
.snk-aw { position: absolute; inset: 0; z-index: 2; border-radius: 18px; overflow: hidden; animation: snkAwIn 0.32s var(--ease-out, ease-out) both; }
.snk-aw svg { display: block; width: 100%; height: 100%; }
@keyframes snkAwIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
.snk-aw__dot { animation: snkSpGlint 1.2s ease-in-out infinite; }
.snk-aw__x {
  position: absolute; inset-block-start: 0.5rem; inset-inline-start: 0.5rem;
  width: 2.75rem; height: 2.75rem; border-radius: 50%;
  border: 0; background: rgba(255, 255, 255, 0.16); color: #ffffff; font-size: 1.1rem; font-weight: 800; cursor: pointer;
}
.snk-over__aw { align-self: center; }

/* SNK_THEME_CSS:nile */
/* The Nile (JS_SnakesNile.html): papyrus and reeds sway, the sakia turns, the pools ripple, egrets fly over, crocodile tears. */
.snn-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: snnSway 4s ease-in-out infinite; }
@keyframes snnSway { 50% { transform: rotate(4deg); } }
.snn-slowspin { transform-box: fill-box; transform-origin: 50% 50%; animation: snkSpin 7s linear infinite; }
.snn-ripple { transform-box: fill-box; transform-origin: 50% 50%; animation: snnRipple 2.6s ease-out infinite; }
@keyframes snnRipple { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
.snn-fly { animation: snnFlyA 18s linear infinite; }
.snn-fly.b { animation: snnFlyB 24s linear infinite; }
@keyframes snnFlyA { 0% { transform: translate(-40px, 180px); } 25% { transform: translate(210px, 60px); } 50% { transform: translate(470px, 250px); } 75% { transform: translate(260px, 470px); } 100% { transform: translate(-40px, 180px); } }
@keyframes snnFlyB { 0% { transform: translate(660px, 520px); } 33% { transform: translate(380px, 350px); } 66% { transform: translate(120px, 530px); } 100% { transform: translate(660px, 520px); } }
.snn-wing { transform-box: fill-box; transform-origin: 50% 100%; animation: snnFlap 0.32s ease-in-out infinite alternate; }
@keyframes snnFlap { to { transform: scaleY(-0.6); } }
.snn-tears { opacity: 0; }
.m-cry .snn-tears { opacity: 1; }
.m-cry .snn-drop { animation: snnDrop 0.7s ease-in infinite; }
.m-cry .snn-drop.b { animation-delay: 0.35s; }
@keyframes snnDrop { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-2px, 14px); opacity: 0; } }
.m-cry .snk-pup { transform: translate(0, 1.2px); }
/* SNK_THEME_CSS:metro */
/* The Metro (JS_SnakesMetro.html): a train passes along the bottom of the frame, the escalators' steps move up (stopped when one breaks), the slides' flags flutter. */
.snm-train { animation: snmTrain 13s linear infinite; }
@keyframes snmTrain { 0% { transform: translateX(-240px); } 62%, 100% { transform: translateX(880px); } }
.snm-run { animation: snmSteps 0.55s linear infinite; }
@keyframes snmSteps { from { transform: translateX(0); } to { transform: translateX(6px); } }
.snm-stopped .snm-run { animation-play-state: paused; }
.snm-flag { transform-box: fill-box; transform-origin: 0% 50%; animation: snmFlag 1.4s ease-in-out infinite; }
@keyframes snmFlag { 50% { transform: scaleX(0.7) skewY(8deg); } }
.m-wow .snm-flag, .m-charm .snm-flag { animation-duration: 0.45s; }
.m-sleep .snm-flag { animation: none; transform: scaleX(0.6) skewY(40deg); }
.snm-wow { opacity: 0; }
.m-wow .snm-wow { opacity: 1; }
/* SNK_THEME_CSS:desert */
/* The Desert (JS_SnakesDesert.html): a camel walks the top of the frame and turns, a scarab scuttles up and down its side, the palms and fronds sway, the sun turns. */
.snd-walk { transform: translate(420px, -3px) scale(0.46, 0.46); animation: sndWalk 44s linear infinite; }
@keyframes sndWalk { 0% { transform: translate(586px, -3px) scale(0.46, 0.46); } 46% { transform: translate(198px, -3px) scale(0.46, 0.46); } 50% { transform: translate(198px, -3px) scale(-0.46, 0.46); } 96% { transform: translate(586px, -3px) scale(-0.46, 0.46); } 100% { transform: translate(586px, -3px) scale(0.46, 0.46); } }
.snd-bob { animation: sndBob 0.7s ease-in-out infinite alternate; }
@keyframes sndBob { to { transform: translateY(-1.2px); } }
.snd-lg { transform-box: fill-box; transform-origin: 50% 0%; animation: sndLeg 0.7s ease-in-out infinite alternate; }
.snd-lg.b { animation-delay: -0.35s; }
@keyframes sndLeg { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
.snd-scarab { transform: translate(-11px, 300px); animation: sndScarab 52s linear infinite; }
@keyframes sndScarab { 0% { transform: translate(-11px, 596px) rotate(0deg); } 47% { transform: translate(-11px, 24px) rotate(0deg); } 50% { transform: translate(-11px, 24px) rotate(180deg); } 97% { transform: translate(-11px, 596px) rotate(180deg); } 100% { transform: translate(-11px, 596px) rotate(360deg); } }
.snd-scuttle { animation: sndScut 0.25s steps(2) infinite; }
@keyframes sndScut { to { transform: translateY(0.6px); } }
.snd-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sndSway 4s ease-in-out infinite; }
.snd-sway.b { animation-delay: -1.6s; }
@keyframes sndSway { 50% { transform: rotate(3deg); } }
.snd-leafs { transform-box: fill-box; transform-origin: 50% 50%; animation: sndLeafs 3.4s ease-in-out infinite; }
@keyframes sndLeafs { 50% { transform: rotate(-3deg) scale(1.02); } }
.snd-rays { transform-box: fill-box; transform-origin: 50% 50%; animation: snkSpin 40s linear infinite; }
/* SNK_THEME_CSS:hara */
/* The Hara (JS_SnakesHara.html): the cats' tails and moods, laundry swaying, pigeons pecking and flying, the ful pot steaming, drips, the tuk-tuk going by. */
.snh-ctail { transform-box: fill-box; transform-origin: 5% 95%; animation: snhSwish 2.6s ease-in-out infinite; }
.m-hiss .snh-ctail { animation-duration: 0.5s; }
@keyframes snhSwish { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(12deg); } }
.snh-fur { opacity: 0; }
.m-hiss .snh-fur { opacity: 1; }
.snh-pup { transform-box: fill-box; transform-origin: 50% 50%; }
.m-wow .snh-pup { transform: scale(2.2, 1.15); }
.m-hiss .snh-pup { transform: scale(0.6, 1); }
.snh-tongue { opacity: 0; transform-box: fill-box; transform-origin: 50% 0%; }
.m-lick .snh-tongue { opacity: 1; animation: snhLick 0.4s ease-in-out infinite alternate; }
@keyframes snhLick { to { transform: scaleY(0.4); } }
.snh-cl { transform-box: fill-box; transform-origin: 50% 0%; animation: snhSway 2.8s ease-in-out infinite; }
@keyframes snhSway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
.snh-peck { transform-box: fill-box; transform-origin: 20% 100%; animation: snhPeck 3.2s ease-in-out infinite; }
@keyframes snhPeck { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(26deg); } 92% { transform: rotate(0); } }
.snh-pwing { transform-box: fill-box; transform-origin: 50% 100%; animation: snhFlap 0.17s ease-in-out infinite alternate; }
@keyframes snhFlap { to { transform: scaleY(-0.7); } }
.snh-fly { animation: snhFlyA 17s linear infinite; }
.snh-fly.b { animation: snhFlyB 23s linear infinite; animation-delay: -5s; }
@keyframes snhFlyA { 0% { transform: translate(-40px, 160px); } 25% { transform: translate(220px, 60px); } 50% { transform: translate(480px, 250px); } 75% { transform: translate(260px, 470px); } 100% { transform: translate(-40px, 160px); } }
@keyframes snhFlyB { 0% { transform: translate(660px, 520px); } 33% { transform: translate(380px, 330px); } 66% { transform: translate(120px, 520px); } 100% { transform: translate(660px, 520px); } }
.snh-steam { opacity: 0; animation: snhSteam 2.4s ease-in infinite; }
@keyframes snhSteam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 0.85; } 100% { transform: translateY(-14px); opacity: 0; } }
.snh-drip { opacity: 0; animation: snhDrip 2s ease-in infinite; }
@keyframes snhDrip { 0%, 45% { transform: translateY(0); opacity: 0; } 55% { opacity: 1; } 100% { transform: translateY(11px); opacity: 0; } }
.snh-tuk { animation: snhTuk 15s linear infinite; }
@keyframes snhTuk { 0% { transform: translateX(590px); opacity: 1; } 52% { transform: translateX(-150px); opacity: 1; } 55% { transform: translateX(-170px); opacity: 0; } 100% { transform: translateX(-170px); opacity: 0; } }
.snh-tukb { animation: snhTukB 0.18s ease-in-out infinite alternate; }
@keyframes snhTukB { to { transform: translateY(-1.2px); } }

@media (prefers-reduced-motion: reduce) {
  .snk-piece .snk-pb, .snk-piece .snk-legR, .snk-piece .snk-yawnM, .snk-piece .snk-armsUp, .snk-piece .snk-armsFwd, .snk-piece .snk-eN, .snk-piece .snk-eW,
  .m-lick .snk-tongue, .snk-cupglow, .snk-star { animation: none; }
  .snk-dusk, .snk-stars { transition: none; }
  .snk-tongue, .snk-lid, .m-sleep .snk-zz, .snk-spin, .snk-fly, .snk-fly.b, .snk-wing, .snk-cup, .snk-shine, .snk-bar.is-ready .snk-bar__roll { animation: none; }
  .snk-chip, .snk-swatch, .snk-theme { transition: none; }
  .snk-sp-bob, .snk-sp-sway, .snk-sp-glint, .snk-sp-zzz text, .snk-zzz text, .snk-aw, .snk-aw__dot { animation: none; }
  .snk-sp-zzz text, .snk-zzz text { opacity: 1; }
  /* SNK_THEME_RM:nile */
  .snn-sway, .snn-slowspin, .snn-ripple, .snn-fly, .snn-fly.b, .snn-wing, .m-cry .snn-drop { animation: none; }
  .snn-fly { display: none; }
  /* SNK_THEME_RM:metro */
  .snm-train, .snm-run, .snm-flag { animation: none; }
  /* SNK_THEME_RM:desert */
  .snd-walk, .snd-bob, .snd-lg, .snd-scarab, .snd-scuttle, .snd-sway, .snd-leafs, .snd-rays { animation: none; }
  /* SNK_THEME_RM:hara */
  .snh-ctail, .m-hiss .snh-ctail, .m-lick .snh-tongue, .snh-cl, .snh-peck, .snh-pwing, .snh-fly, .snh-fly.b, .snh-steam, .snh-drip, .snh-tuk, .snh-tukb { animation: none; }
  .snh-fly { display: none; }
}

/* =========================================================================
   56. الشاهد (THE WITNESS in rooms, JS_RoomWitness.html, 29 Sep 2026)
   Look أ «القسم»: the police station - a navy bar, the mugshot's height
   lines, the manila case file and its Polaroid with a countdown ring, the
   builder's tabs and big option buttons, the lineup against the height wall,
   votes as initialled coins, a spotlight and «هو ده!». The scene keeps its
   own colours in both themes (like a board); the words round it are the
   page's tokens.
   ========================================================================= */
:root {
  --wit-navy: #1e2a44;
  --wit-navy-2: #2e3b5c;
  --wit-navy-3: #3a4664;
  --wit-wall: #dfe5ee;
  --wit-wall-2: #eef1f6;
  --wit-line: rgba(30, 42, 68, 0.28);
  --wit-manila: #e8cf96;
  --wit-manila-2: #c79a55;
  --wit-manila-ink: #4a2e08;
  --wit-plate: #f4f1e8;
  --wit-gold: #ffd23f;
  --wit-stamp-ink: #b3261e;
}
.wit { display: flex; flex-direction: column; gap: var(--sp-3); }
.wit-body { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }

/* The bar */
.wit-top {
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  padding: 0.55rem 0.9rem; border-radius: var(--r-lg);
  background: var(--wit-navy); color: #ffffff; box-shadow: var(--sh-1);
}
.wit-top__title { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-h3); flex: 1; min-width: 0; }
.wit-pill {
  display: inline-flex; align-items: center; gap: 0.3rem; border-radius: var(--r-full);
