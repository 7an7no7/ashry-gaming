<script>
/* ============================================================================
   المشنقة — HANGMAN: two on one phone, rooms, and the TV
   ----------------------------------------------------------------------------
   The letters and the judging are Hangman.js (shared with the rooms server,
   which keeps a room's word in room._hm and every board's letters on its own
   phone). This file draws a board, the same for one phone and a room.

   The look the owner picked (22 Sep 2026, option ج "نضيف" of a design sheet
   of three): the app's own card, the gallows in quiet ink and the man in the
   game's colour, the word in tiles like خمن الكلمة's, the keyboard of the
   app's keys. The classic stick man, as the owner chose: a piece a miss,
   the sixth finishes him.

   Two on one phone (appState.hangman): one types a word with the letters
   hidden while the other looks away, the other guesses, then they swap; a
   running tally, as many words as they like. In a room (hangmanAction in
   RoomHangman.js) one writes and everyone else guesses on their own board,
   or the app deals one word to everyone for a race.

   Motion: a new piece of the man draws itself stroke by stroke (hmDrawLast),
   a tile that opens turns over, a wrong letter shakes the stage, a solve
   brings confetti, and the game ends on the podium.
   ========================================================================= */

const hmT = (key, vars) => {
  const t = TRANSLATIONS[appState.lang] || {};
  let s = t[key] || key;
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
};

/* The man, look أ «كرتون مسطّح» (the owner, 27 Sep 2026): a flat cartoon in the same six pieces, each
   a group the animations move (Style.html section 25) - the head with its hair and a face that changes
   with every piece (blink, worry, a gasp, sweat, the tongue and crossed eyes at the end), the shirt,
   two arms with hands, two trouser legs with shoes. A piece just added pops in from its joint
   (.hm-pop.is-new); the pieces not yet earned are drawn hidden (.hm-ghost) so the escape can give him
   the rest of himself before he runs. The colours are tokens (--hm-*), the outlines the page's ink. */
const HM_PARTS = [
  '<g class="hm-part hm-head"><g class="hm-pop">' +
    '<circle class="hm-skin hm-ink" cx="80" cy="34" r="11"/>' +
    '<path class="hm-hair" d="M69.5 31 Q72 21 80 22 Q88 21 90.5 31 Q86 27 80 28 Q74 27 69.5 31z"/>' +
    '<g class="hm-face">' +
      '<g class="hm-eyes"><circle class="hm-eye" cx="76" cy="33" r="1.7"/><circle class="hm-eye" cx="84" cy="33" r="1.7"/></g>' +
      '<path class="hm-eyes-x hm-ink" d="M74 31 L78 35 M78 31 L74 35 M82 31 L86 35 M86 31 L82 35"/>' +
      '<path class="hm-eyes-happy hm-ink" d="M73.5 33.5 Q76 30.5 78.5 33.5 M81.5 33.5 Q84 30.5 86.5 33.5"/>' +
      '<path class="hm-brows hm-ink" d="M73 29 L78 30.5 M87 29 L82 30.5"/>' +
      '<path class="hm-mouth hm-mouth--smile hm-ink" d="M76 38.5 Q80 42 84 38.5"/>' +
      '<path class="hm-mouth hm-mouth--flat hm-ink" d="M76.5 39.5 H83.5"/>' +
      '<path class="hm-mouth hm-mouth--worry hm-ink" d="M76 40.5 Q80 37.5 84 40.5"/>' +
      '<ellipse class="hm-mouth hm-mouth--o hm-ink" cx="80" cy="40" rx="2.4" ry="3"/>' +
      '<path class="hm-mouth hm-mouth--grin hm-ink" d="M75 38 Q80 45 85 38z"/>' +
      '<path class="hm-tongue" d="M78.5 40 Q80 45 81.5 40z"/>' +
      '<g class="hm-sweat"><path class="hm-drop hm-drop--1" d="M67 27 q-1.6 3 0 4.2 q1.6 -1.2 0 -4.2z"/><path class="hm-drop hm-drop--2" d="M94 25 q1.6 3 0 4.2 q-1.6 -1.2 0 -4.2z"/></g>' +
    '</g></g></g>',
  '<g class="hm-part hm-body"><g class="hm-pop"><rect class="hm-shirt hm-ink" x="72" y="45" width="16" height="30" rx="6"/></g></g>',
  '<g class="hm-part hm-arm hm-arm--l"><g class="hm-pop"><path class="hm-sleeve" d="M74 52 L62 66"/><path class="hm-sleeve hm-sleeve--in" d="M74 52 L62 66"/><circle class="hm-skin hm-ink" cx="61" cy="67.5" r="3.6"/></g></g>',
  '<g class="hm-part hm-arm hm-arm--r"><g class="hm-pop"><path class="hm-sleeve" d="M86 52 L98 66"/><path class="hm-sleeve hm-sleeve--in" d="M86 52 L98 66"/><circle class="hm-skin hm-ink" cx="99" cy="67.5" r="3.6"/></g></g>',
  '<g class="hm-part hm-leg hm-leg--l"><g class="hm-pop"><path class="hm-pants hm-ink" d="M74 74 L70 100 L78 100 L81 74z"/><ellipse class="hm-shoe" cx="72" cy="102" rx="6" ry="3"/></g></g>',
  '<g class="hm-part hm-leg hm-leg--r"><g class="hm-pop"><path class="hm-pants hm-ink" d="M80 74 L83 100 L91 100 L87 74z"/><ellipse class="hm-shoe hm-shoe--r" cx="88" cy="102" rx="6" ry="3"/></g></g>'
];
// What the man says now and then, a line a stage (hm_bub_1 … hm_bub_5), off the TV's small figures.
const HM_BUBBLE_STAGES = 5;

/**
 * The gallows and as much of the man as `misses` has drawn. With `drawLast`
 * the newest piece is left undrawn, for hmDrawLast to draw on screen.
 */
function hmGallowsSvg(misses, drawLast, cls) {
  const n = Math.max(0, Math.min(HM_MISSES, Number(misses) || 0));
  const parts = HM_PARTS.map((p, k) => p.replace('class="hm-pop"', 'class="hm-pop ' + (k < n ? (drawLast && k === n - 1 ? 'is-new' : 'is-on') : 'hm-ghost') + '"')).join('');
  const mini = /hm-gallows--mini/.test(cls || '');
  // The bubble: a line for this stage, popping now and then (the delay staggers boards on one screen).
  const bub = !mini && n >= 1 && n <= HM_BUBBLE_STAGES
    ? `<g class="hm-bub" style="--hm-bub-delay: ${(n * 1.7) % 4}s"><path class="hm-bub__box" d="M40 4 h36 a4 4 0 0 1 4 4 v11 a4 4 0 0 1 -4 4 h-9 l-4 5 l-1 -5 h-22 a4 4 0 0 1 -4 -4 v-11 a4 4 0 0 1 4 -4z"/><text class="hm-bub__t" x="58" y="16.5" text-anchor="middle">${escapeHTML(hmT('hm_bub_' + n))}</text></g>`
    : '';
  // hm-s<n> is the man's state (the face, the sway, the arms, the legs); is-hanged the end, still.
  return `<svg class="hm-gallows ${cls || ''} hm-s${n} ${n >= HM_MISSES ? 'is-hanged' : ''}" viewBox="0 0 110 128" aria-hidden="true" focusable="false">
      <path class="hm-gal" d="M12 122 H70"/><path class="hm-gal" d="M26 122 V10 H80"/><path class="hm-gal" d="M26 32 L48 10"/><path class="hm-gal hm-rope" d="M80 10 V24"/>
      <g class="hm-fig"><g class="hm-lean">${parts}<g class="hm-dust"><circle class="hm-dust__p hm-dust__p--1" cx="70" cy="101" r="3"/><circle class="hm-dust__p hm-dust__p--2" cx="66" cy="99" r="2.4"/><circle class="hm-dust__p hm-dust__p--3" cx="74" cy="100" r="2"/></g></g></g>
      <text class="hm-clock" x="80" y="19" text-anchor="middle" font-size="13">⏰</text>
      ${bub}
    </svg>`;
}

/** The newest piece of the man draws itself, once it is on screen. */
function hmDrawLast(root) {
  const el = root && root.querySelector('.hm-pop.is-new');
  if (!el) return;
  setTimeout(() => { el.classList.remove('is-new'); el.classList.add('is-on'); }, 700);
}

/**
 * The word as tiles: `pattern` is a letter or '' for each place. `word` (at
 * the end) fills the blanks, marked lost when the man was hanged. `open` are
 * the letters just found, which turn over.
 */
function hmTilesHtml(pattern, alpha, o) {
  const opt = o || {};
  const full = opt.word ? Array.from(hmClean(opt.word)) : null;
  const open = opt.open || '';
  // Each word is kept together; a name of two or three words may wrap between them, never inside one.
  const words = [[]];
  pattern.forEach((c, i) => {
    if (c === ' ') { words.push([]); return; }
    const raw = c || (full ? full[i] : '');
    const shown = alpha === 'en' ? raw.toUpperCase() : raw;
    const cls = ['hm-tile', c ? 'is-open' : '', !c && full ? (opt.lost ? 'is-lost' : 'is-open') : '',
      c && open && hmFold(c) === open ? 'is-new' : ''].join(' ');
    words[words.length - 1].push(`<span class="${cls}">${escapeHTML(shown)}</span>`);
  });
  const letters = pattern.filter(c => c !== ' ').length;
  return `<div class="hm-tiles ${letters > 9 ? 'is-long' : ''}" dir="${alpha === 'en' ? 'ltr' : 'rtl'}">${words.map(w => `<span class="hm-tiles__word">${w.join('')}</span>`).join('')}</div>`;
}

/** The blanks of a word nobody here can see: a box a letter, a gap between words (shared.shape). */
function hmBlankPattern(s) {
  const shape = Array.isArray(s.shape) && s.shape.length ? s.shape : [s.len || 0];
  const out = [];
  shape.forEach((n, k) => { if (k) out.push(' '); for (let i = 0; i < n; i++) out.push(''); });
  return out;
}

/** The keyboard of the word's alphabet: a letter tried is green when it was in, faded when it wasn't. */
function hmKeysHtml(alpha, g, miss, on, press) {
  const letters = HM_LETTERS[alpha === 'en' ? 'en' : 'ar'];
  return `<div class="hm-keys" dir="${alpha === 'en' ? 'ltr' : 'rtl'}">${letters.map(l => {
    const hit = (g || []).indexOf(l) !== -1;
    const bad = (miss || []).indexOf(l) !== -1;
    const cls = hit ? 'key key--correct' : (bad ? 'key key--absent is-miss' : 'key');
    return `<button type="button" class="${cls}" ${hit || bad || !on ? 'disabled' : `onclick="${press}('${l}')"`}>${escapeHTML(alpha === 'en' ? l.toUpperCase() : l)}</button>`;
  }).join('')}</div>`;
}

/**
 * One board to guess on, the same on one phone and in a room. o: { pattern,
 * alpha, g, miss, state, word (to show at the end), on (can guess now),
 * press (the letter handler's name), whole (the word handler's name),
 * newMiss, open, head (the line above), hint (the writer's, or none) }.
 */
function hmBoardHtml(o) {
  const misses = (o.miss || []).length;
  const wrong = (o.miss || []).map(m => (m.length > 1 ? '✗' + m : m)).map(m => (o.alpha === 'en' ? m.toUpperCase() : m)).join(' ');
  const done = o.state === 'won' || o.state === 'lost';
  return `<div class="hm-board ${done ? 'is-' + o.state : ''}">
      <div class="hm-board__head">
        <span class="hm-board__who">${o.head || ''}${hmHintHtml(o.hint)}</span>
        <span class="hm-lives" aria-label="${escapeHTML(hmT('hm_misses', { n: misses }))}">${escapeHTML(hmT('hm_misses', { n: misses }))}</span>
      </div>
      <div class="hm-stage">
        ${hmGallowsSvg(misses, !!o.newMiss)}
        ${hmTilesHtml(o.pattern, o.alpha, { word: done ? o.word : '', lost: o.state === 'lost', open: o.open })}
        <p class="hm-wrong" dir="${o.alpha === 'en' ? 'ltr' : 'rtl'}">${wrong ? escapeHTML(wrong) : '&nbsp;'}</p>
      </div>
      ${done ? '' : hmKeysHtml(o.alpha, o.g, o.miss, !!o.on, o.press)}
      ${done || !o.on ? '' : `<form class="hm-whole" onsubmit="event.preventDefault(); ${o.whole}(this)">
          <input type="text" name="w" maxlength="28" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${escapeHTML(hmT('hm_whole_ph'))}" aria-label="${escapeHTML(hmT('hm_whole_ph'))}">
          <button type="submit" class="btn btn--secondary btn--auto">${escapeHTML(hmT('hm_whole_btn'))}</button>
        </form>`}
    </div>`;
}

/** After a board was drawn: a new piece draws itself, the stage shakes on a miss, a solve cheers. */
function hmAfterBoard(root, o) {
  if (!root) return;
  hmDrawLast(root);
  const svg = root.querySelector('.hm-gallows');
  if (o.newMiss) {
    const stage = root.querySelector('.hm-stage');
    if (stage && !motionOff()) { stage.classList.add('animate-shake'); setTimeout(() => stage.classList.remove('animate-shake'), 700); }
    if (svg && !motionOff() && o.state === 'lost') svg.classList.add('is-dropping');
    if (typeof playFx === 'function') playFx(o.state === 'lost' ? 'fail' : 'hmBoing'); else playSound(o.state === 'lost' ? 'wrong' : 'click');
    haptic(o.state === 'lost' ? 'heavy' : 'light');
  } else if (o.timeUp) {
    const stage = root.querySelector('.hm-stage');
    if (stage && !motionOff()) { stage.classList.add('animate-shake'); setTimeout(() => stage.classList.remove('animate-shake'), 700); }
    if (svg && !motionOff()) svg.classList.add('is-timeup');
    if (typeof playFx === 'function') playFx('buzzer'); else playSound('wrong');
    haptic('heavy');
  } else if (o.open && svg && !motionOff()) {
    svg.classList.add('is-hop');
    setTimeout(() => svg.classList.remove('is-hop'), 700);
  }
  if (o.cheer) {
    // Set free: the rope snaps and he leaves the way his pieces allow (a rolling head, a log, a crawl, a hop, a run).
    if (svg && !motionOff()) svg.classList.add('is-free');
    afterReveal(root, () => {
      playSound('success');
      if (typeof confetti === 'function') confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
    });
    haptic('double');
  }
}

/**
 * The moments of the table's little men (hmProgressHtml): what changed on each board since this
 * phone last drew the rows - a solve (the escape), the sixth piece (the shoe), the clock ending a
 * board (⏰), a letter found (a hop) - each remembered with when it began, so a row rebuilt while
 * it plays carries on from there (--hm-late). Keyed on the deal and the round; the first sight of
 * a round plays nothing (a reload, a late join, the TV coming on).
 */
const HM_MOMENT_MS = 4800;
function hmRowMoments(state, prog) {
  const s = state.shared || {};
  const key = [state.code, s.dealId, s.round].join('|');
  const mem = hmRoom.rows && hmRoom.rows.key === key ? hmRoom.rows : (hmRoom.rows = { key, seen: null, moments: {} });
  const now = Date.now();
  const cur = {};
  Object.keys(prog).forEach(id => { const p = prog[id]; cur[id] = { state: p.state, miss: p.miss, n: p.n }; });
  if (mem.seen && !motionOff()) {
    Object.keys(cur).forEach(id => {
      const was = mem.seen[id], is = cur[id];
      if (!was) return;
      let cls = '';
      if (is.state === 'won' && was.state !== 'won') cls = 'is-free';
      else if (is.miss >= HM_MISSES && was.miss < HM_MISSES) cls = 'is-dropping';
      else if (is.state === 'lost' && was.state === 'play' && is.miss === was.miss) cls = 'is-timeup';
      else if (is.n > was.n && is.state === 'play') cls = 'is-hop';
      if (cls) mem.moments[id] = { cls, at: now };
    });
  }
  mem.seen = cur;
  const out = {};
  Object.keys(mem.moments).forEach(id => {
    const m = mem.moments[id];
    if (now - m.at > HM_MOMENT_MS) { delete mem.moments[id]; return; }
    out[id] = { cls: m.cls, late: now - m.at };
  });
  return out;
}

/** The word a player writes, as it will be refused: '' when it can be played. */
function hmWriteError(text) {
  const p = hmWordProblem(text);
  if (!p) return '';
  return p === 'sentence' ? hmT('hm_write_sentence') : hmT('hm_write_bad');
}

/**
 * The field a word is written in: the letters hidden until the eye is pressed.
 * A plain text field whose letters are invisible, with dots drawn over it
 * (.secret-field, secretDotsPaint): never type="password" (an iPhone gives a
 * password field only its English keyboard, and the word could not be written
 * in Arabic), and never -webkit-text-security either (Safari takes a dotted
 * field for a password and offers to save the word when the game is left -
 * the owner, 24 Sep 2026).
 */
function hmWriteFormHtml(submit, placeholderName) {
  return `<form class="hm-write" onsubmit="event.preventDefault(); ${submit}(this)">
      <div class="hm-write__row">
        <span class="secret-field"><input type="text" class="is-hidden" name="w" id="hm-write-input" maxlength="28" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="${escapeHTML(hmT('hm_write_ph'))}" aria-label="${escapeHTML(hmT('hm_write_ph'))}"><span class="secret-field__dots" aria-hidden="true"></span></span>
        <button type="button" class="btn btn--ghost btn--auto hm-write__eye" onclick="hmToggleEye(this)" aria-label="${escapeHTML(hmT('hm_show_word'))}" title="${escapeHTML(hmT('hm_show_word'))}">👁️</button>
      </div>
      <p class="field__hint">${escapeHTML(hmT('hm_write_hint'))}</p>
      <input type="text" name="h" class="hm-write__hint" maxlength="${HM_HINT_MAX}" autocomplete="off" autocorrect="off" spellcheck="false"
        placeholder="${escapeHTML(hmT('hm_hint_ph'))}" aria-label="${escapeHTML(hmT('hm_hint_ph'))}">
      <p class="field__hint tx-danger hm-write__err" role="alert"></p>
      <button type="submit" class="btn btn--primary btn--lg">${escapeHTML(placeholderName)}</button>
    </form>`;
}

/**
 * What is being typed in a room's fields (the whole word, the writer's word and
 * hint), so a redraw for someone else's letter or a join doesn't wipe it: the
 * frame is rebuilt with innerHTML whenever anyone's progress changes.
 */
function hmKeepTyping(el) {
  const kept = [];
  el.querySelectorAll('form.hm-whole input, form.hm-write input').forEach(inp => {
    const key = inp.form.className + '|' + inp.name;
    const focused = document.activeElement === inp;
    if (!inp.value && !focused) return;
    let sel = null;
    try { sel = [inp.selectionStart, inp.selectionEnd]; } catch (e) {}
    kept.push({ key: key, value: inp.value, focused: focused, sel: sel, shown: !inp.classList.contains('is-hidden') });
  });
  return kept;
}

function hmRestoreTyping(el, kept) {
  kept.forEach(k => {
    const inp = [...el.querySelectorAll('form.hm-whole input, form.hm-write input')].find(i => i.form.className + '|' + i.name === k.key);
    if (!inp) return;
    inp.value = k.value;
    if (k.shown && inp.name === 'w' && inp.form.classList.contains('hm-write')) inp.classList.remove('is-hidden');
    if (k.focused) {
      inp.focus({ preventScroll: true });
      if (k.sel) { try { inp.setSelectionRange(k.sel[0], k.sel[1]); } catch (e) {} }
    }
  });
  secretDotsPaint(el);
}

/** The dots over every secret field in root: one a letter typed, drawn over the invisible text. */
function secretDotsPaint(root) {
  (root || document).querySelectorAll('.secret-field').forEach(box => {
    const inp = box.querySelector('input');
    const dots = box.querySelector('.secret-field__dots');
    if (inp && dots) dots.textContent = '•'.repeat(Array.from(inp.value || '').length);
  });
}
document.addEventListener('input', (e) => {
  const box = e.target && e.target.closest && e.target.closest('.secret-field');
  if (box) secretDotsPaint(box.parentNode);
});

function hmToggleEye(btn) {
  const input = btn.closest('form').querySelector('input[name="w"]');
  if (!input) return;
  input.classList.toggle('is-hidden');
  input.focus();
}

/** The written word from a form, or '' after showing why it can't be played. */
function hmReadWrite(form) {
  const input = form.querySelector('input[name="w"]');
  const text = hmClean(input ? input.value : '');
  const hintEl = form.querySelector('input[name="h"]');
  const hint = hmCleanHint(hintEl ? hintEl.value : '');
  const err = hmWriteError(text) || (hmHintProblem(hint, text) ? hmT('hm_hint_bad') : '');
  const box = form.querySelector('.hm-write__err');
  if (box) box.textContent = err;
  if (err) {
    if (!motionOff()) { form.classList.add('animate-shake'); setTimeout(() => form.classList.remove('animate-shake'), 600); }
    haptic('heavy');
    return null;
  }
  return { word: text, hint: hint };
}

/** The writer's hint above the boxes, when there is one. */
const hmHintHtml = (hint) => (hint ? `<span class="hm-hint">💡 ${escapeHTML(hint)}</span>` : '');

/* ==========================================================================
   Two on one phone
   ========================================================================== */

function hmLocalState() {
  if (!appState.hangman) appState.hangman = { names: ['', ''], tally: [0, 0], setter: 0, step: 'setup', word: '', board: null, words: 0 };
  const s = appState.hangman;
  if (!Array.isArray(s.tally)) s.tally = [0, 0];
  return s;
}

function hmLocalNames(s) {
  const n = s.names || [];
  return [n[0] || hmT('hm_p1'), n[1] || hmT('hm_p2')];
}

function setupHangman() {
  setView('setup-hangman');
  paintHangmanSetup();
}

function paintHangmanSetup() {
  const s = hmLocalState();
  const cont = document.getElementById('hangman-continue');
  if (cont) cont.classList.toggle('hidden', !(s.step === 'write' || s.step === 'guess' || s.step === 'done'));
}

/** Start: a new tally, the first name writes the first word. */
function startHangman() {
  const s = hmLocalState();
  const read = (id) => ((document.getElementById(id) || {}).value || '').trim().slice(0, 16);
  s.names = [read('hangman-name1'), read('hangman-name2')];
  s.tally = [0, 0];
  s.setter = 0;
  s.words = 0;
  s.step = 'write';
  s.word = '';
  s.board = null;
  saveToLocal();
  setView('play-hangman');
  paintHangman();
  if (typeof scrollToAction === 'function') scrollToAction();
}

function hmContinue() {
  setView('play-hangman');
  paintHangman();
}

function hmLocalWrite(form) {
  const got = hmReadWrite(form);
  if (!got) return;
  const s = hmLocalState();
  s.word = got.word;
  s.hint = got.hint;
  s.board = hmNewBoard();
  s.step = 'guess';
  saveToLocal();
  haptic('medium');
  paintHangman({ fresh: true });
  if (typeof scrollToAction === 'function') scrollToAction();
}

function hmLocalGuess(letter) {
  const s = hmLocalState();
  if (s.step !== 'guess' || !s.board) return;
  const out = hmApply(s.board, s.word, letter, false);
  hmLocalAfter(out, hmFold(letter));
}

function hmLocalWhole(form) {
  const s = hmLocalState();
  const input = form.querySelector('input[name="w"]');
  const text = input ? input.value : '';
  if (s.step !== 'guess' || !s.board || !hmClean(text)) return;
  hmLocalAfter(hmApply(s.board, s.word, text, true), '');
}

function hmLocalAfter(out, letter) {
  const s = hmLocalState();
  if (!out) return;
  if (out === 'won') s.tally[1 - s.setter]++;
  if (out === 'lost') s.tally[s.setter]++;
  if (out === 'won' || out === 'lost') { s.step = 'done'; s.words++; }
  saveToLocal();
  paintHangman({ newMiss: out === 'miss' || out === 'lost', open: out === 'hit' ? letter : '', cheer: out === 'won' });
}

/** The next word: the one who guessed writes. */
function hmLocalNext() {
  const s = hmLocalState();
  s.setter = 1 - s.setter;
  s.step = 'write';
  s.word = '';
  s.hint = '';
  s.board = null;
  saveToLocal();
  paintHangman();
  if (typeof scrollToAction === 'function') scrollToAction();
}

function hmTallyHtml(names, tally, setter) {
  return `<div class="hm-tally">${[0, 1].map(i => `<span class="hm-tally__one ${i === setter ? 'is-writer' : ''}"><span>${escapeHTML(names[i])}</span><b class="metric">${tally[i] || 0}</b></span>`).join('')}</div>`;
}

function paintHangman(fx) {
  const o = fx || {};
  const s = hmLocalState();
  const el = document.getElementById('hangman-stage');
  if (!el) return;
  const names = hmLocalNames(s);
  const writer = names[s.setter];
  const guesser = names[1 - s.setter];
  const tally = hmTallyHtml(names, s.tally, s.setter);
  if (s.step === 'write' || !s.board) {
    el.innerHTML = `${tally}
      <div class="card hm-write-card">
        <p class="sheet__title">✍️ ${escapeHTML(hmT('hm_write_title', { name: writer }))}</p>
        <p class="sheet__subtitle">${escapeHTML(hmT('hm_write_hide', { name: guesser }))}</p>
        ${hmWriteFormHtml('hmLocalWrite', hmT('hm_write_go_to', { name: guesser }))}
      </div>`;
    return;
  }
  const b = s.board;
  const done = s.step === 'done';
  el.innerHTML = `${tally}
    ${hmBoardHtml({
      pattern: hmPattern(s.word, b.g), alpha: hmAlphaOf(s.word), g: b.g, miss: b.miss, state: b.state, word: s.word,
      on: !done, press: 'hmLocalGuess', whole: 'hmLocalWhole', newMiss: o.newMiss, open: o.open,
      head: `<span class="hm-cat">${escapeHTML(hmT('hm_guess_title', { name: guesser, setter: writer }))}</span>`, hint: s.hint
    })}
    ${done ? `<div class="card card--accent hm-end">
        <p class="sheet__title">${escapeHTML(b.state === 'won' ? hmT('hm_won') : hmT('hm_lost_was'))}</p>
        ${b.state === 'won' ? '' : `<p class="hm-end__word">${escapeHTML(s.word)}</p>`}
        <button type="button" class="btn btn--primary btn--lg" onclick="hmLocalNext()">${escapeHTML(hmT('hm_next_swap', { name: guesser }))}</button>
      </div>` : ''}`;
  hmAfterBoard(el, o);
}

function restoreHangman() {
  const s = hmLocalState();
  if (s.step !== 'write' && s.step !== 'guess' && s.step !== 'done') return false;
  paintHangman();
  return true;
}

if (typeof soloRegister === 'function') {
  soloRegister('hangman', {
    setup: 'setup-hangman', play: 'play-hangman',
    paintSetup: paintHangmanSetup, restore: restoreHangman,
    repaint: () => paintHangman()
  });
}

/* ==========================================================================
   In a room
   ========================================================================== */

// sent: the last letter sent for a word, so a double tap isn't two; seen: what this phone last showed.
const hmRoom = { seen: {}, clock: null, clockKey: null, sinceKey: '', since: 0 };

const hmRoomOpts = () => recallOptions('hangmanRoom', { mode: 'setter', rounds: 5, clock: 0 });

function setHmRoomOpt(key, value) {
  rememberOptions('hangmanRoom', { [key]: value });
  duelLobbyRedraw();
}

function hmRoomGuess(letter) {
  const s = ((Room.state || {}).shared) || {};
  hmRoom.lastGuess = letter;
  haptic('light');
  roomAct('guess', { letter: letter, round: s.round });
}

function hmRoomWhole(form) {
  const s = ((Room.state || {}).shared) || {};
  const input = form.querySelector('input[name="w"]');
  const text = hmClean(input ? input.value : '');
  if (!text) return;
  haptic('light');
  roomAct('whole', { text: text, round: s.round });
}

function hmRoomWrite(form) {
  const s = ((Room.state || {}).shared) || {};
  const got = hmReadWrite(form);
  if (!got) return;
  haptic('medium');
  roomAct('setWord', { word: got.word, hint: got.hint, round: s.round });
}

/** Everyone's man, how far they are and how it ended: what the table may see of each board. */
function hmProgressHtml(state, tv) {
  const s = state.shared;
  const prog = s.progress || {};
  const ids = Object.keys(prog);
  if (!ids.length) return '';
  const nameOf = (id) => ((state.players || []).find(p => p.id === id) || {}).name || '';
  const moments = hmRowMoments(state, prog);
  const rows = ids.map(id => {
    const p = prog[id];
    const st = p.state === 'won' ? ('✅ ' + (typeof p.at === 'number' ? hmT('hm_place', { n: p.at + 1 }) : hmT('hm_state_won')))
      : (p.state === 'lost' ? (p.miss >= HM_MISSES ? hmT('hm_state_lost') : '⏰ ' + hmT('hm_state_lost')) : hmT('hm_state_play'));
    const m = moments[id];
    return `<div class="hm-row is-${p.state} ${id === Room.me ? 'is-me' : ''}" data-pid="${escapeHTML(id)}">
        <span class="hm-row__who">${escapeHTML(nameOf(id))}</span>
        ${hmGallowsSvg(p.miss, false, 'hm-gallows--mini' + (m ? ' ' + m.cls : '')).replace('<svg ', m ? `<svg style="--hm-late: -${m.late}ms" ` : '<svg ')}
        <span class="hm-row__prog">${escapeHTML(hmT('hm_found', { n: p.n, m: s.len }))}</span>
        <span class="hm-row__st">${escapeHTML(st)}</span>
      </div>`;
  }).join('');
  return `<div class="hm-rows ${tv ? 'hm-rows--tv' : ''}">${rows}</div>`;
}

/** The result of a word: the word, and who took what. */
function hmResultHtml(state, tv) {
  const s = state.shared;
  const r = s.result || {};
  const alpha = hmAlphaOf(r.word) || 'ar';
  // Each row shows its player's man as the word ended: escaped (the gallows empty, the rope cut),
  // hanged, or frozen by the clock with fewer than six pieces. The rows rise in once (motionFirst).
  const rise = motionFirst('hmres|' + [state.code, s.dealId, s.round].join('|'));
  const rows = (r.rows || []).map((x, i) => `<li class="hm-res is-${x.state} ${rise ? 'is-rise' : ''}" style="--at: ${i * 90}ms">
      ${hmGallowsSvg(x.miss, false, 'hm-gallows--mini hm-gallows--res')}
      <span class="hm-res__who">${x.state === 'won' ? '✅' : (x.miss >= HM_MISSES ? '💀' : '⏰')} ${escapeHTML(x.name)}</span><b class="metric">${x.pts ? '+' + x.pts : '0'}</b></li>`).join('');
  const setter = r.setter && r.setterName ? `<li class="hm-res is-setter"><span>✍️ ${escapeHTML(hmT('hm_setter_pts', { name: r.setterName }))}</span><b class="metric">${r.setterPts ? '+' + r.setterPts : '0'}</b></li>` : '';
  return `<div class="card card--accent hm-result ${tv ? 'hm-result--tv' : ''}">
      <p class="eyebrow">${escapeHTML(r.cat || hmT('hm_the_word'))}</p>
      ${hmTilesHtml(Array.from(hmClean(r.word || '')), alpha, {})}
      <ul class="hm-results">${rows}${setter}</ul>
    </div>`;
}

function hmStopClock() {
  if (hmRoom.clock) hmRoom.clock.stop();
  hmRoom.clock = null;
  hmRoom.clockKey = null;
}

function hmTickClock(state) {
  const s = state.shared || {};
  const endsAt = s.phase === 'guessing' ? s.endsAt : null;
  const paint = () => {
    const left = endsAt ? Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)) : 0;
    document.querySelectorAll('[data-hm-clock]').forEach(el => {
      el.textContent = '⏱️ ' + left;
      el.classList.toggle('badge--danger', left <= 10);
    });
    return left;
  };
  if (!endsAt) { hmStopClock(); return; }
  paint();
  if (hmRoom.clockKey === endsAt && hmRoom.clock) return;
  hmStopClock();
  hmRoom.clockKey = endsAt;
  hmRoom.clock = createClock({
    seconds: Math.max(0, Math.ceil((endsAt - Date.now()) / 1000)),
    onTick: () => {
      const left = paint();
      const st = Room.state;
      if (left > 0 && left <= 5 && st && st.game === 'hangman' && (st.youAreScreen || !roomHasScreen())) playSound('tick');
    },
    onEnd: () => { hmRoom.clock = null; paint(); }
  });
}

/**
 * The host's "move on" button waits 40 seconds for a phone that is there but
 * quiet, and with no clock nothing is pushed meanwhile: so when a wait starts
 * (`local.since`), a redraw is set for when it ends. The TV's frame is rebuilt
 * only on a new signature, so its signature is dropped first. Shared by
 * المشنقة, the solve rooms and خمّن مين; cleared with the room's clocks.
 */
function roomQuietRedraw(local, game) {
  clearTimeout(local.quietTimer);
  local.quietTimer = setTimeout(() => {
    const st = typeof Room !== 'undefined' ? Room.state : null;
    if (!st || st.game !== game || !st.youAreHost) return;
    if (st.youAreScreen) {
      if (appState.currentView !== 'room-tv') return;
      const tv = document.getElementById('view-room-tv');
      if (tv) delete tv.dataset.sig;
    } else if (!onRoomView()) return;
    routeRoomState(st);
  }, 40500);
}
function roomQuietStop(local) { clearTimeout(local.quietTimer); local.quietTimer = null; }

/** The host's buttons: close the word early; move on from a writer whose phone went quiet. */
function hmHostButtons(state) {
  const s = state.shared || {};
  if (!state.youAreHost) return [];
  const key = [state.code, s.round, s.phase].join('|');
  if (hmRoom.sinceKey !== key) {
    hmRoom.sinceKey = key; hmRoom.since = Date.now();
    if (s.phase === 'writing') roomQuietRedraw(hmRoom, 'hangman'); else roomQuietStop(hmRoom);
  }
  if (s.phase === 'guessing') return [['⏹️ ' + hmT('hm_close_word'), `roomAct('closeWord', { round: ${Number(s.round) || 0} })`]];
  if (s.phase === 'writing' && s.setter !== Room.me) {
    const p = (state.players || []).find(x => x.id === s.setter);
    if (!p || !p.online || Date.now() - hmRoom.since > 40000) return [['⏭️ ' + hmT('hm_skip_writer'), `roomAct('skipTurn', { round: ${Number(s.round) || 0} })`]];
  }
  return [];
}

/** What changed on this phone's own board since it was last drawn: a miss, a letter found, a solve. */
function hmRoomFx(state, you) {
  const s = state.shared;
  const key = [state.code, s.dealId, s.round].join('|');
  const was = hmRoom.seen[key];
  const now = { g: (you.g || []).slice(), miss: (you.miss || []).slice(), state: you.state, pattern: (you.pattern || []).slice() };
  hmRoom.seen = { [key]: now };
  if (!was) return {};
  const found = now.g.filter(l => was.g.indexOf(l) === -1);
  return {
    newMiss: now.miss.length > was.miss.length,
    open: found.length === 1 ? found[0] : '',
    cheer: now.state === 'won' && was.state !== 'won',
    // The clock ran out, or the host closed the word, on a board still guessing: no new piece, yet lost.
    timeUp: now.state === 'lost' && was.state === 'play' && now.miss.length === was.miss.length
  };
}

/**
 * A word that ends with this phone's own last move (two at the table, or the last board done)
 * used to jump straight to the result card, so the escape, the shoe or the clock was never
 * seen. When the result arrives and this phone's board was still guessing a frame ago, or the
 * table's rows have a moment just begun, the guessing frame is held HM_HOLD_MS with the moment
 * on it, then the result is drawn. The board is rebuilt from the last one seen and the word.
 */
const HM_HOLD_MS = 4600;
function hmRoomHold(state, tv) {
  const s = state.shared || {};
  if (s.phase !== 'result' || motionOff()) return null;
  const key = [state.code, s.dealId, s.round].join('|');
  const now = Date.now();
  const cur = hmRoom.hold;
  if (cur && cur.key === key) return now < cur.until ? cur : null;
  if (cur && cur.key !== key) hmRoom.hold = null;
  const prog = s.progress || {};
  let hold = null;
  const was = !tv && hmRoom.seen[key];
  const p = !tv && prog[Room.me];
  if (was && was.state === 'play' && p && p.state !== 'play' && s.result && s.result.word) {
    const g = was.g.slice();
    const miss = was.miss.slice();
    const newMiss = p.miss > miss.length;
    if (newMiss) miss.push(hmRoom.lastGuess && miss.indexOf(hmRoom.lastGuess) === -1 && g.indexOf(hmRoom.lastGuess) === -1 ? hmRoom.lastGuess : '?');
    const pattern = p.state === 'won' ? Array.from(hmClean(s.result.word)) : hmPattern(s.result.word, g);
    hold = { board: { pattern, g, miss, state: p.state }, fx: { newMiss, cheer: p.state === 'won', timeUp: p.state === 'lost' && !newMiss } };
    hmRoom.seen[key].state = p.state;
  }
  // The table's rows: a moment that has just begun on any board (the TV, the writer's phone, a race).
  const rows = hmRowMoments(state, prog);
  const fresh = Object.keys(rows).some(id => rows[id].late < 400);
  if (!hold && !fresh) return null;
  hold = hold || { board: null, fx: {} };
  hold.key = key;
  hold.until = now + HM_HOLD_MS;
  hmRoom.hold = hold;
  setTimeout(() => { if (hmRoom.hold === hold) { hmRoom.hold = null; if (Room.state) routeRoomState(Room.state); } }, HM_HOLD_MS + 50);
  return hold;
}

function hmRoomSig(state) {
  const s = state.shared || {};
  return [s.dealId || '', s.round, s.phase, s.setter || '', JSON.stringify(s.progress || {}), JSON.stringify(s.result || null),
    s.endsAt || '', JSON.stringify(s.board || []), JSON.stringify(state.you || null),
    (state.players || []).map(p => p.id + ':' + p.name).join(','), state.youAreHost, appState.lang, hmRoom.hold && Date.now() < hmRoom.hold.until ? 'hold' : ''].join('|');
}

ROOM_GAMES.hangman = {
  lobbyOptions(state) {
    const o = hmRoomOpts();
    if (!state.youAreHost) return `<p class="field__hint" style="text-align:center">${escapeHTML(hmT('hm_lobby_hint'))}</p>`;
    const seg = (label, key, values, current, hint) => `<div class="field">
        <label class="field__label">${escapeHTML(label)}</label>
        <div class="segmented" role="group">${values.map(v => `<button type="button" class="segmented__item ${String(v[0]) === String(current) ? 'is-active' : ''}" onclick="setHmRoomOpt('${key}', ${typeof v[0] === 'string' ? `'${v[0]}'` : v[0]})">${escapeHTML(v[1])}</button>`).join('')}</div>
        ${hint ? `<p class="field__hint">${escapeHTML(hint)}</p>` : ''}
      </div>`;
    return `<div class="card card--tight">
        ${seg(hmT('hm_lobby_mode'), 'mode', [['setter', hmT('hm_mode_setter')], ['race', hmT('hm_mode_race')]], o.mode, o.mode === 'race' ? hmT('hm_mode_race_hint') : hmT('hm_mode_setter_hint'))}
        ${seg(hmT('hm_lobby_rounds'), 'rounds', HM_ROUNDS_ROOM.map(n => [n, String(n)]), o.rounds)}
        ${seg('⏱️ ' + hmT('hm_lobby_clock'), 'clock', HM_CLOCKS_ROOM.map(v => [v, v ? v + '″' : hmT('gw_clock_off')]), o.clock, o.clock ? hmT('hm_clock_hint') : '')}
      </div>`;
  },
  startPayload() {
    const o = hmRoomOpts();
    return { mode: o.mode, rounds: o.rounds, clock: o.clock, lang: contentLang() };
  },

  render(state) {
    if (appState.currentView !== 'room-hangman') setView('room-hangman');
    const el = document.getElementById('view-room-hangman');
    if (!el) return;
    const s = state.shared;
    if (!s || !s.settings) return;
    const you = state.you || {};
    let fx = {};
    const hold = hmRoomHold(state, false);
    const typing = hmKeepTyping(el);
    const rebuilt = renderRoomFrame(el, hmRoomSig(state), () => {
      const round = `<div class="cn-score"><span class="cn-score__role">🪢 ${escapeHTML(hmT('hm_round', { n: s.round, m: s.rounds }))}</span>
          ${s.endsAt && s.phase === 'guessing' ? '<span class="badge badge--accent" data-hm-clock></span>' : ''}</div>`;
      if (s.phase === 'gameover') {
        const podium = renderPodium(state, s.board);
        return `<div class="hm-room">
            ${s.result && s.result.word ? hmResultHtml(state) : ''}
            ${podium || renderScoreboard(s.board)}
            ${state.youAreHost
              ? `<div class="btn-stack"><button class="btn btn--primary btn--lg" onclick="roomAct('playAgain')">${escapeHTML(hmT('play_again'))}</button>
                 <button class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(hmT('room_another_game'))}</button></div>`
              : `<div class="waiting-note">${escapeHTML(hmT('room_wait_host'))}</div>`}
            ${roomShareBtnHtml(state, s.board)}
            ${renderRoomPlayerStrip(state)}
          </div>`;
      }
      if (s.phase === 'result' && !hold) {
        return `<div class="hm-room">${round}
            ${hmResultHtml(state)}
            ${renderScoreboard(s.board)}
            ${state.youAreHost
              ? `<button class="btn btn--primary btn--lg" onclick="roomAct('nextRound', { round: ${Number(s.round) || 0} })">${escapeHTML(hmT('hm_next_word'))}</button>`
              : `<div class="waiting-note">${escapeHTML(hmT('room_wait_host'))}</div>`}
            ${renderRoomPlayerStrip(state)}
          </div>`;
      }
      if (s.phase === 'writing') {
        const mine = s.setter === Room.me && !state.youAreScreen;
        return `<div class="hm-room">${round}
            ${mine
              ? `<div class="card hm-write-card"><p class="sheet__title">✍️ ${escapeHTML(hmT('hm_room_you_write'))}</p>
                   ${hmWriteFormHtml('hmRoomWrite', hmT('hm_send_word'))}</div>`
              : `<div class="card hm-wait"><div class="hm-wait__icon" aria-hidden="true">✍️</div>
                   <p class="sheet__title">${escapeHTML(hmT('hm_room_writing', { name: s.setterName || '' }))}</p></div>`}
            <div data-hm-host></div>
            ${(s.board || []).some(p => p.score) ? renderScoreboard(s.board) : ''}
            ${renderRoomPlayerStrip(state)}
          </div>`;
      }
      // Guessing.
      // The race's hint is the kind of word; a writer's word says whose it is, and their hint if they gave one.
      const head = !s.setter ? `<span class="hm-cat">${escapeHTML(s.cat)}</span>`
        : `<span class="hm-cat">${escapeHTML(hmT('hm_word_from', { name: s.setterName || '' }))}</span>`;
      const hint = s.setter ? s.cat : '';
      let mine = '';
      if (you.word) {
        mine = `<div class="card hm-mine-word"><p class="eyebrow">${escapeHTML(hmT('hm_your_word'))}</p>
            ${hmTilesHtml(Array.from(hmClean(you.word)), hmAlphaOf(you.word), {})}
            <p class="field__hint">${escapeHTML(hmT('hm_you_watch'))}</p></div>`;
      } else if (Array.isArray(you.pattern) || (hold && hold.board)) {
        const b = Array.isArray(you.pattern) ? you : hold.board;
        fx = Array.isArray(you.pattern) ? hmRoomFx(state, you) : hold.fx;
        mine = hmBoardHtml({
          pattern: b.pattern, alpha: s.alpha, g: b.g, miss: b.miss, state: b.state, word: b.state === 'won' && s.result ? s.result.word : '',
          on: b.state === 'play', press: 'hmRoomGuess', whole: 'hmRoomWhole', newMiss: fx.newMiss, open: fx.open, head: head, hint: hint
        });
        if (b.state !== 'play') mine += `<div class="card card--accent hm-end"><p class="sheet__title">${escapeHTML(b.state === 'won' ? hmT('hm_won') : hmT('hm_lost_room'))}</p>
            <p class="field__hint">${escapeHTML(hmT('hm_done_wait'))}</p></div>`;
      } else {
        mine = `<div class="card hm-wait"><p class="sheet__title">${escapeHTML(hmT('hm_watching'))}</p>
            ${hmTilesHtml(hmBlankPattern(s), s.alpha, {})}${s.cat ? `<p class="field__hint">${escapeHTML(s.cat)}</p>` : ''}</div>`;
      }
      return `<div class="hm-room">${round}
          <div class="hm-layout">
            <div class="hm-layout__board">${mine}</div>
            <div class="hm-layout__side">
              ${hmProgressHtml(state)}
              <div data-hm-host></div>
              ${renderRoomPlayerStrip(state)}
            </div>
          </div>
        </div>`;
    });
    if (rebuilt && typing.length) hmRestoreTyping(el, typing);
    refreshRoomPlayerStrip(el, state);
    const host = el.querySelector('[data-hm-host]');
    if (host) { const html = roomHostRow(hmHostButtons(state)); if (host._html !== html) { host.innerHTML = html; host._html = html; } }
    hmTickClock(state);
    if (!rebuilt) return;
    hmAfterBoard(el, fx);
    if (s.phase === 'gameover' && duelOnce(['hm-over', state.code, s.dealId].join('|')) && (s.board || [])[0] && s.board[0].id === Room.me) {
      afterReveal(el, () => { playSound('success'); if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 85 }); });
    }
  },
  // A letter is not a new step; a new word, its result and the end are.
  actionKey: (state) => [state.code, (state.shared || {}).round, (state.shared || {}).phase].join('|')
};

// The server's numbers: a lobby choice the phone offers.
const HM_ROUNDS_ROOM = [3, 5, 10];
const HM_CLOCKS_ROOM = [0, 60, 90];

onRoomClocksReset(() => { hmStopClock(); roomQuietStop(hmRoom); hmRoom.sinceKey = ''; hmRoom.hold = null; });

/* --- the TV: everyone's man, the word and the points ------------------------------ */

TV_GAMES.hangman = {
  sig: (state) => hmRoomSig(state),
  frame(state, t) {
    const s = state.shared || {};
    if (!s.settings) return tvLookAtPhones(t);
    const host = (buttons) => (state.youAreHost && buttons.length ? `<div class="tv-actions">${buttons.map(b => tvBtn(b[0], b[1], b[2] || '')).join('')}</div>` : '');

          ${host([[t.play_again, "roomAct('playAgain')"], [t.room_another_game, "roomAct('backToHub')", 'ghost']])}

          <div class="tv-center">

            <div class="tv-title">${escapeHTML(hmT('hm_room_writing', { name: s.setterName || '' }))}</div>
          </div>
          ${host(hmHostButtons(state).map(b => [b[0], b[1], 'ghost']))}
        </div>`;
    }
    // The TV's frame is the room's colour; the man and the tiles keep the game's orange.
    return `<div class="tv-trivia hm-tv" data-accent="orange">${top}
        <div class="hm-tv__head">
          <div class="tv-title">${escapeHTML(!s.setter ? s.cat : hmT('hm_word_from', { name: s.setterName || '' }))}</div>
          ${s.setter && s.cat ? `<div class="tv-note">💡 ${escapeHTML(s.cat)}</div>` : ''}
          ${hmTilesHtml(hmBlankPattern(s), s.alpha, {})}
        </div>
        ${hmProgressHtml(state, true)}
        ${host(hmHostButtons(state).map(b => [b[0], b[1], 'ghost']))}
      </div>`;
  },
  after(state) { hmTickClock(state); }
};
</script>
