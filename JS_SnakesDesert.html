<script>
/* ============================================================================
   السلم والتعبان — the Desert map (الصحرا), look أ «على الكلاسيك» (the owner, 2 Oct 2026,
   from the sheet notes/archive/shots/snakes-themes/desert.html)
   ----------------------------------------------------------------------------
   Today's 10 × 10 board in its frame, dressed in the desert: light sand and terracotta squares (a little
   dune line on some), a carved-stone frame (pyramids, waves and suns) with a camel walking along its top
   and a scarab scuttling up and down its side, cobras for the snakes (the classic's long body with spots
   or bands, the friendly face in front of a hood that flares, one in a Saidi turban and a moustache, each
   coming out of a hole in the sand), notched date-palm trunks with fronds and dates for the ladders, a
   small pyramid with the cup on it at 100, palms, an acacia and two pyramids round the edge. The cobra's
   four moves (gulp, board, storm, mizmar) and the palm's four (climb, camel, balloon, dates) are the
   sheet's, each shortened to fit its time in SNAKES_THEME_MOVES (Snakes.js). Everything else on the
   board is JS_Snakes.html's.
   ========================================================================= */
(function () {
  const I = SNK_INK;
  const DS = {
    tileA: '#fbe9c2', tileB: '#e3a457', num: '#4a2608', frame: '#7a4a1e', band: '#e2b062', carve: '#8a5424', bg: '#f5deac',
    camel: '#c98f55', sand: '#f0cf8a', amp: 2.2,
    cobras: ['#e0a32e', '#3a2f28', '#b9542a', '#7c8f2e', '#d0803a', '#8a5a2b', '#d9b45a', '#5b6f8a']
  };
  const lum = (hex) => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 0.3 + (n >> 8 & 255) * 0.59 + (n & 255) * 0.11) / 255; };
  const hash = (n) => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };

  /* --- the desert's props --------------------------------------------------------------------- */
  function camelBody(blanket) {
    const C = DS.camel;
    return `<ellipse cx="0" cy="1" rx="19" ry="3" fill="rgba(60,30,0,.25)"/>
    ${[[-11, 'a'], [-6, 'b'], [8, 'b'], [13, 'a']].map(([x, k]) => `<g class="snd-lg ${k}"><path d="M${x} -13 V0" stroke="${I}" stroke-width="4.4" stroke-linecap="round"/><path d="M${x} -13 V-.5" stroke="${snkTint(C, k === 'a' ? -0.12 : 0)}" stroke-width="2.4" stroke-linecap="round"/></g>`).join('')}
    <path d="M15 -16 q6 1 5 8" stroke="${I}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-15 -12 Q-18 -22 -7 -23 Q1 -37 12 -23 Q19 -20 16 -11 Q0 -7 -15 -12Z" fill="${C}" stroke="${I}" stroke-width="1.6"/>
    ${blanket ? `<path d="M-5 -24 Q2 -33 10 -23 L9 -17 Q2 -21 -4 -17Z" fill="#c0392b" stroke="${I}" stroke-width="1"/><path d="M-4.5 -19 Q2 -23 9 -19" stroke="#ffd23f" stroke-width="1.4" fill="none"/>` : ''}`;
  }
  function camelHead() {
    return `<ellipse cx="0" cy="0" rx="7" ry="4.2" fill="${DS.camel}" stroke="${I}" stroke-width="1.5" transform="rotate(-8)"/><path d="M3 -3 l2 -3" stroke="${I}" stroke-width="1.6" stroke-linecap="round"/><circle cx="1" cy="-1.4" r="1" fill="${I}"/><path d="M-6.5 1 q1.5 1.5 3 0" stroke="${I}" stroke-width="1" fill="none"/>`;
  }
  /** A camel walking, looking to -x. */
  function camelSvg(blanket) {
    return `<g class="snd-bob">${camelBody(blanket)}<path d="M-12 -18 Q-21 -21 -21 -31" stroke="${I}" stroke-width="8.6" fill="none" stroke-linecap="round"/><path d="M-12 -18 Q-21 -21 -21 -31" stroke="${DS.camel}" stroke-width="6" fill="none" stroke-linecap="round"/><g transform="translate(-25 -32)">${camelHead()}</g></g>`;
  }
  /** A palm's crown of fronds at (x, y), with two bunches of dates. */
  function crownSvg(x, y, r, dates) {
    const A = [-172, -140, -108, -76, -44, -10, 22, 158];
    let s = '', d = '';
    A.forEach((deg, i) => {
      const a = deg * Math.PI / 180, rr = r * (i % 2 ? 0.92 : 1.05), dr = r * 0.42 * Math.abs(Math.cos(a)) + r * 0.12;
      const tx = x + Math.cos(a) * rr, ty = y + Math.sin(a) * rr * 0.85 + dr, cx = x + Math.cos(a) * rr * 0.5, cy = y + Math.sin(a) * rr * 0.5 - r * 0.28;
      s += `M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)}`;
    });
    if (dates) [[-5, 5], [5, 5]].forEach(([dx, dy]) => { for (let k = 0; k < 4; k++) d += `<circle cx="${(x + dx + (k % 2 ? 2.4 : -2.4)).toFixed(1)}" cy="${(y + dy + Math.floor(k / 2) * 3.6).toFixed(1)}" r="2.3" fill="#b4531c" stroke="${I}" stroke-width=".6"/>`; });
    return `<g class="snd-leafs"><path d="${s}" stroke="${I}" stroke-width="${(r * 0.36).toFixed(1)}" stroke-linecap="round" fill="none"/><path d="${s}" stroke="#4d9a39" stroke-width="${(r * 0.24).toFixed(1)}" stroke-linecap="round" fill="none"/><path d="${s}" stroke="#8fd16a" stroke-width="${(r * 0.06).toFixed(1)}" stroke-linecap="round" fill="none"/></g>${d}`;
  }
  function palmSvg(h, r, cls) {
    const tx = h * 0.12;
    return `<g class="snd-sway${cls ? ' ' + cls : ''}"><path d="M0 0 Q${tx * 0.2} ${-h * 0.55} ${tx} ${-h}" stroke="${I}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M0 0 Q${tx * 0.2} ${-h * 0.55} ${tx} ${-h}" stroke="#9a6a35" stroke-width="5.4" fill="none" stroke-linecap="round" stroke-dasharray="3 2"/>${crownSvg(tx, -h, r, true)}</g>`;
  }
  function acaciaSvg(s) {
    return `<g transform="scale(${s})"><path d="M0 0 L0 -18 M0 -14 L-10 -26 M0 -16 L9 -27 M-5 -20 L-14 -27" stroke="${I}" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M0 0 L0 -18 M0 -14 L-10 -26 M0 -16 L9 -27 M-5 -20 L-14 -27" stroke="#7a4f2a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-30 -27 Q-28 -38 -12 -37 Q-4 -44 8 -38 Q26 -40 30 -29 Q28 -24 0 -25 Q-24 -23 -30 -27Z" fill="#8aa83e" stroke="${I}" stroke-width="1.8"/><path d="M-22 -31 Q-8 -35 4 -32 M8 -34 Q18 -35 24 -31" stroke="#b5cf62" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
  }
  function pyramidSvg(w, h) {
    let lines = '';
    for (let k = 1; k < 5; k++) { const y = -h + h * k / 5, hw = w / 2 * k / 5; lines += `M${-hw} ${y} L${hw} ${y}`; }
    return `<path d="M${-w / 2} 0 L0 ${-h} L${w * 0.14} 0Z" fill="#f0c97c"/><path d="M${w * 0.14} 0 L0 ${-h} L${w / 2} 0Z" fill="#d9a35c"/><path d="${lines}" stroke="rgba(90,50,10,.28)" stroke-width="1"/><path d="M${-w / 2} 0 L0 ${-h} L${w / 2} 0Z M0 ${-h} L${w * 0.14} 0" fill="none" stroke="${I}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  function sunSvg(r) {
    let rays = '';
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; rays += `M${(Math.cos(a) * (r + 3)).toFixed(1)} ${(Math.sin(a) * (r + 3)).toFixed(1)} L${(Math.cos(a) * (r + 8)).toFixed(1)} ${(Math.sin(a) * (r + 8)).toFixed(1)}`; }
    return `<g class="snd-rays"><path d="${rays}" stroke="#ffb72b" stroke-width="2.6" stroke-linecap="round"/></g><circle r="${r}" fill="#ffd23f" stroke="${I}" stroke-width="1.5"/><circle cx="${-r * 0.32}" cy="${-r * 0.1}" r="1.1" fill="${I}"/><circle cx="${r * 0.32}" cy="${-r * 0.1}" r="1.1" fill="${I}"/><path d="M${-r * 0.3} ${r * 0.25} Q0 ${r * 0.5} ${r * 0.3} ${r * 0.25}" stroke="${I}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  }
  /** A scarab, looking up (-y). */
  function scarabSvg() {
    return `<g class="snd-scuttle"><path d="M-5 -3 l-4 -2 M-5 0 l-5 0 M-5 3 l-4 2 M5 -3 l4 -2 M5 0 l5 0 M5 3 l4 2" stroke="${I}" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="0" cy="1" rx="5.5" ry="7" fill="#1f6f7a" stroke="${I}" stroke-width="1.2"/><path d="M0 -5 V8" stroke="${I}" stroke-width=".8"/><ellipse cx="-2" cy="-1" rx="1.2" ry="2.6" fill="#7fe0d8" opacity=".7"/><ellipse cx="0" cy="-7.5" rx="3.4" ry="2.2" fill="#174a52" stroke="${I}" stroke-width="1"/></g>`;
  }
  function balloonSvg() {
    return `<path d="M-7 -12 L-12 -38 M7 -12 L12 -38 M0 -12 V-36" stroke="${I}" stroke-width=".9"/>
    <path d="M-15 -42 Q-22 -62 0 -70 Q22 -62 15 -42 Q8 -34 0 -34 Q-8 -34 -15 -42Z" fill="#ffd23f" stroke="${I}" stroke-width="1.8"/>
    <path d="M-8 -36 Q-15 -55 -6 -69 M8 -36 Q15 -55 6 -69" stroke="#e5383b" stroke-width="4.5" fill="none"/><path d="M0 -34 V-70" stroke="#1e6fd9" stroke-width="4"/>
    <path d="M-15 -42 Q-22 -62 0 -70 Q22 -62 15 -42 Q8 -34 0 -34 Q-8 -34 -15 -42Z" fill="none" stroke="${I}" stroke-width="1.8"/>
    <rect x="-8" y="-13" width="16" height="11" rx="2" fill="#a8743a" stroke="${I}" stroke-width="1.5"/><path d="M-8 -9 H8 M-8 -5.5 H8" stroke="#6b4423" stroke-width=".9"/>`;
  }
  function mizmarSvg() {
    return `<path d="M0 0 L18 -7" stroke="${I}" stroke-width="4.8" stroke-linecap="round"/><path d="M0 0 L18 -7" stroke="#c08a3e" stroke-width="3" stroke-linecap="round"/><path d="M17 -7 l6 -6 l3 6Z" fill="#c08a3e" stroke="${I}" stroke-width="1.3" stroke-linejoin="round"/><circle cx="6" cy="-2.4" r=".9" fill="${I}"/><circle cx="10" cy="-4" r=".9" fill="${I}"/>`;
  }

  /** The cobra's head: the app's friendly snake face in front of a hood (one in a Saidi turban and a moustache). */
  function cobraHead(col, fez) {
    const belly = snkTint(col, 0.5), light = lum(col) < 0.35, mark = light ? snkTint(col, 0.6) : snkTint(col, -0.4);
    const eye = (x) => `<g transform="translate(${x} -4.5)"><circle r="5" fill="#fff" stroke="${I}" stroke-width="1.7"/><circle class="snk-pup" r="2.6" fill="#161022"/><circle class="snk-pup" cx="-.9" cy="-1" r=".9" fill="#fff"/>
      <g class="snk-spi"><path class="snk-spin" d="M0 0 a1.2 1.2 0 1 1 1.6 .4 a2.6 2.6 0 1 1 -3.6 -.8 a3.8 3.8 0 1 1 5.6 1" stroke="#161022" stroke-width="1.1" fill="none"/></g>
      <circle class="snk-lid" cx="0" cy="0" r="5.3" fill="${col}" stroke="${I}" stroke-width="1.2"/></g>`;
    return `<g class="snk-hdi">
    <g class="snd-hood">
     <path d="M0 -29 C21 -29 35 -13 33 4 C31 17 17 24 0 24 C-17 24 -31 17 -33 4 C-35 -13 -21 -29 0 -29Z" fill="${snkTint(col, light ? 0.18 : -0.16)}" stroke="${I}" stroke-width="2.4"/>
     <path d="M0 -23 C14 -23 26 -11 24 3 C22 13 12 18 0 18 C-12 18 -22 13 -24 3 C-26 -11 -14 -23 0 -23Z" fill="${belly}" opacity=".75"/>
     <path d="M-27 -6 q4 -6 9 -1 M27 -6 q-4 -6 -9 -1 M-27 6 q4 -5 9 0 M27 6 q-4 -5 -9 0" stroke="${mark}" stroke-width="2.8" fill="none" stroke-linecap="round"/>
     <path d="M-6 21 Q0 17 6 21" stroke="${mark}" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(0 10)"><path class="snk-tongue" d="M0 0 V10 l-3.5 4.5 M0 10 l3.5 4.5" stroke="#e0263b" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
    <ellipse rx="13.5" ry="13" fill="${col}" stroke="${I}" stroke-width="2.2"/>
    <ellipse cy="6" rx="8.5" ry="5.5" fill="${belly}" opacity=".7"/>
    <circle cx="-9.5" cy="4" r="2.6" fill="#ff6f96" opacity=".45"/><circle cx="9.5" cy="4" r="2.6" fill="#ff6f96" opacity=".4"/>
    <circle cx="-3" cy="3" r="1.2" fill="${I}"/><circle cx="3" cy="3" r="1.2" fill="${I}"/>
    <path class="snd-smile" d="M-6 8.5 Q0 12.5 6 8.5" stroke="${I}" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <g class="snd-maw" transform="translate(0 9) scale(1 0.01)"><ellipse rx="8" ry="6.5" fill="#5a0f1c" stroke="${I}" stroke-width="1.6"/><ellipse cy="3" rx="4.2" ry="2.4" fill="#e0263b"/></g>
    ${fez ? `<path d="M-9 6 Q-5 1.5 0 4.6 Q5 1.5 9 6 Q5 5 0 7 Q-5 5 -9 6Z" fill="#231510"/>` : ''}
    ${eye(-5.6)}${eye(5.6)}
    <path class="snk-brow" d="M-10 -13 Q-6 -16 -2 -13 M2 -13 Q6 -16 10 -13" stroke="${I}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    ${fez ? `<g transform="translate(0 -12)"><ellipse rx="14" ry="6.5" fill="#fffaf0" stroke="${I}" stroke-width="1.5"/><path d="M-13 0 Q0 -7 13 1 M-12 3 Q0 -3 12 4" stroke="#d9cfc0" stroke-width="1.2" fill="none"/><ellipse cy="-5" rx="9.5" ry="5.5" fill="#fffaf0" stroke="${I}" stroke-width="1.4"/><path d="M-8 -5 Q0 -9 8 -4" stroke="#d9cfc0" stroke-width="1.2" fill="none"/></g>` : ''}
    <text class="snk-zz" x="14" y="-18" font-size="11" font-weight="800" fill="${I}" font-family="system-ui,sans-serif">z</text>
   </g>`;
  }

  /** A cobra's own parts back at rest after one of its moves (the engine resets the rest). */
  const rest = (sn) => { sn.hoodK = 1; sn.sway = 0; };

  /* --- the cobra's four moves (each inside its time in SNAKES_THEME_MOVES.desert, less 150 ms) ------ */
  async function dGulp(c, g, p, sn) {
    try {
      snkFace(p, 'gasp'); snkBubble(c, p.x, p.y - 20, snkT('snk_b_no'), 900);
      const x0 = p.x, y0 = p.y;
      await snkTween(c, g, 280, t => { sn.jaw = t; sn.hoodK = 1 + 0.3 * t; sn.lunge = { x: (x0 - sn.hx) * 0.3 * t, y: (y0 - sn.hy) * 0.3 * t, s: 1 + 0.2 * t }; });
      if (!snkAlive(c, g)) return;
      await snkTween(c, g, 260, t => snkSetP(p, snkLerp(x0, sn.hx + sn.lunge.x, t), snkLerp(y0, sn.hy + sn.lunge.y + 8, t), 1 - t * 0.9, t * 140), snkEaseIn);
      p.e.setAttribute('opacity', 0); p.hidden = true;
      snkSound(c, 'snkGulp', p.mine);
      await snkTween(c, g, 240, t => { sn.jaw = 1 - t; sn.hoodK = 1.3 - 0.3 * t; sn.lunge = { x: sn.lunge.x * (1 - t), y: sn.lunge.y * (1 - t), s: 1 + 0.2 * (1 - t) + Math.sin(t * Math.PI) * 0.18 }; });
      if (!snkAlive(c, g)) return;
      snkBubble(c, sn.hx, sn.hy - 10, snkT('snk_b_ham'), 800); sn.amp = 4.5;
      await snkTween(c, g, 980, t => { sn.bulge = snkLerp(sn.s + 14, sn.L - 12, t); }, snkEase);
      sn.bulge = null; sn.amp = DS.amp;
      if (!snkAlive(c, g)) return;
      const tp = snkSpineAt(sn, sn.L - 4, c.time || 0);
      p.n = sn.t; p.hidden = false; p.e.setAttribute('opacity', 1);
      snkBubble(c, tp.x, tp.y - 10, snkT('snk_b_tuf'), 800); snkPuff(c, tp.x, tp.y, 8, DS.sand, 26);
      const s = snkSpot(c, p);
      p.k = s.k;
      await snkTween(c, g, 450, t => snkSetP(p, snkLerp(tp.x, s.x, t), snkLerp(tp.y, s.y, t) - Math.sin(t * Math.PI) * 34, 0.3 + 0.7 * snkBackOut(Math.min(1, t * 1.3)), (1 - t) * -300), snkLin);
      snkSettleAll(c);
      snkPuff(c, p.x, p.y + 10, 5, DS.sand, 16);
      await snkDizzy(c, g, p, 300);
    } finally { rest(sn); }
  }

  /** تزحلق رملي: down the cobra's back on a sandboard, like on the dunes. */
  async function dBoard(c, g, p, sn) {
    const bd = snkEl('g', {}, c.fx);
    try {
      snkFace(p, 'gasp up'); snkBubble(c, p.x, p.y - 20, snkT('snk_b_desert_board'), 1200);
      snkEl('rect', { x: -14, y: -3, width: 28, height: 6, rx: 3, fill: '#e5383b', stroke: I, 'stroke-width': 1.4 }, bd);
      snkEl('path', { d: 'M-9 0 H9', stroke: '#ffd23f', 'stroke-width': 1.6 }, bd);
      snkSound(c, 'snkSlide', p.mine);
      let last = 0;
      await snkTween(c, g, 1500, (t, r) => {
        const a = snkLerp(sn.s + 8, sn.L - 8, t), q = snkSpineAt(sn, a, c.time || 0), q2 = snkSpineAt(sn, a + 8, c.time || 0);
        let ang = Math.atan2(q2.y - q.y, q2.x - q.x) * 180 / Math.PI;
        if (ang > 90) ang -= 180;
        if (ang < -90) ang += 180;
        snkSetP(p, q.x, q.y - 13, 1, snkClamp(ang * 0.4, -30, 30));
        snkTR(bd, q.x, q.y - 1, 1, snkClamp(ang, -50, 50));
        if (r - last > 0.08) { last = r; snkPuff(c, q.x - (q2.x - q.x) * 1.2, q.y + 2, 2, DS.sand, 10); }
      }, snkEaseIn);
      bd.remove();
      if (!snkAlive(c, g)) return;
      p.n = sn.t;
      const s = snkSpot(c, p), x0 = p.x, y0 = p.y;
      p.k = s.k;
      snkPuff(c, x0, y0 + 10, 7, DS.sand, 22);
      await snkTween(c, g, 360, t => snkSetP(p, snkLerp(x0, s.x, t), snkLerp(y0, s.y, t) - Math.abs(Math.sin(t * Math.PI * 2)) * (1 - t) * 20, 1, (1 - t) * 40), snkLin);
      snkSettleAll(c);
      await snkDizzy(c, g, p, 380);
    } finally { bd.remove(); rest(sn); }
  }

  /** خماسين: the cobra spreads its hood, and a sandstorm whirls him down to its tail. */
  async function dStorm(c, g, p, sn) {
    const grains = [];
    try {
      sn.mood = 'wow';
      const x0 = p.x, y0 = p.y;
      snkFace(p, 'sweat');
      snkSound(c, 'snkHiss', p.mine);
      await snkTween(c, g, 480, t => { sn.hoodK = 1 + 0.6 * t; sn.lunge = { x: 0, y: -4 * t, s: 1 + 0.12 * t }; }, snkEaseOut);
      if (!snkAlive(c, g)) return;
      snkBubble(c, sn.hx, sn.hy - 16, snkT('snk_b_desert_storm'), 1300);
      snkFace(p, 'gasp up');
      if (!c.fast && !snkStill()) for (let i = 0; i < 26; i++) grains.push({ e: snkEl('circle', { r: 1.4 + Math.random() * 2, fill: i % 3 ? '#e7c07a' : '#c98f55', opacity: 0.85 }, c.fx), a: Math.random() * 6.3, r: 10 + Math.random() * 22, v: 5 + Math.random() * 5 });
      p.n = sn.t;
      const s = snkSpot(c, p);
      p.k = s.k;
      await snkTween(c, g, 1320, (t, r) => {
        const a = snkLerp(sn.s + 8, sn.L - 6, t), q = snkSpineAt(sn, a, c.time || 0), lift = Math.sin(Math.min(1, r * 1.1) * Math.PI) * 46;
        const px = snkLerp(x0, q.x, Math.min(1, r * 4)), py = snkLerp(y0, q.y, Math.min(1, r * 4)) - lift;
        snkSetP(p, px, py, 1, r * 900);
        grains.forEach(o => { o.a += o.v * 0.016; o.e.setAttribute('cx', (px + Math.cos(o.a) * o.r).toFixed(1)); o.e.setAttribute('cy', (py - 6 + Math.sin(o.a) * o.r * 0.55).toFixed(1)); o.e.setAttribute('opacity', (0.85 * (1 - r * r)).toFixed(2)); });
        sn.hoodK = 1.6 - 0.6 * r; sn.lunge = { x: 0, y: -4 * (1 - r), s: 1 + 0.12 * (1 - r) };
      }, snkEase);
      grains.forEach(o => o.e.remove());
      sn.mood = ''; sn.lunge = { x: 0, y: 0, s: 1 };
      if (!snkAlive(c, g)) return;
      const x1 = p.x, y1 = p.y;
      await snkTween(c, g, 300, t => snkSetP(p, snkLerp(x1, s.x, t), snkLerp(y1, s.y, t), 1 + Math.sin(t * Math.PI) * 0.2, 0), snkLin);
      snkPuff(c, s.x, s.y + 10, 5, DS.sand, 16);
      snkSettleAll(c);
      await snkDizzy(c, g, p, 420);
    } finally { grains.forEach(o => o.e.remove()); rest(sn); }
  }

  /** المزمار: the cobra plays the mizmar, and he dances بلدي down its back to its tail. */
  async function dMizmar(c, g, p, sn) {
    const fl = snkEl('g', {}, c.fx);
    try {
      fl.innerHTML = mizmarSvg();
      const sd = sn.hx < p.x ? 1 : -1;
      const place = () => snkTR(fl, sn.hx + sn.lunge.x + sd * 3, sn.hy + sn.lunge.y + 5, 0.9, sd > 0 ? 0 : 180);
      snkBubble(c, sn.hx, sn.hy - 18, snkT('snk_b_desert_tune'), 750);
      snkSound(c, 'snkFlute', p.mine);
      let lastN = 0;
      await snkTween(c, g, 700, (t, r) => {
        sn.sway = Math.sin(r * Math.PI * 4) * 12; sn.hoodK = 1 + 0.25 * t; place();

  /* --- the palm's four moves (each inside its time, less the hop at the top) ------------------ */
  function stepUp(c, g, p, l, u0, u1, ms, steps, onF) {
    snkFace(p, 'up');
    return snkTween(c, g, ms, (t, r) => {
      const k = Math.floor(r * steps), f = snkEase(snkClamp(r * steps - k, 0, 1)), u = snkLerp(u0, u1, Math.min(1, (k + f) / steps)), q = snkLadPt(l, u);
      snkSetP(p, q.x, q.y - Math.sin(f * Math.PI) * 4, 1, Math.sin(r * steps * Math.PI) * 9);
      if (onF) onF(q);
    }, snkLin);
  }

      // The sand mound at the foot stays when the palm is carried away.
      const base = snkEl('g', {}, c.laddersL);
      snkEl('ellipse', { cx: A.x, cy: A.y + 3, rx: 12, ry: 5, fill: '#d9a35c', stroke: I, 'stroke-width': 1.2 }, base);
      const g = snkEl('g', {}, c.laddersL), inner = snkEl('g', {}, g);
      const left = [], right = [];
      for (let k = 0; k <= 12; k++) {
        const t = k / 12, cx = snkLerp(A.x, B.x, t), cy = snkLerp(A.y, B.y, t), w = snkLerp(W0, W1, t) / 2;
        left.push(`${(cx + vx * w).toFixed(1)} ${(cy + vy * w).toFixed(1)}`); right.push(`${(cx - vx * w).toFixed(1)} ${(cy - vy * w).toFixed(1)}`);
      }
      const trunk = 'M' + left.join('L') + 'L' + right.reverse().join('L') + 'Z';
      let notch = '';
      for (let d = 7; d < L - 2; d += 9.5) {
        const t = d / L, w = snkLerp(W0, W1, t) / 2 * 0.92, cx = A.x + ux * d, cy = A.y + uy * d;
        notch += `M${(cx + vx * w).toFixed(1)} ${(cy + vy * w).toFixed(1)}L${(cx + ux * 3.4).toFixed(1)} ${(cy + uy * 3.4).toFixed(1)}L${(cx - vx * w).toFixed(1)} ${(cy - vy * w).toFixed(1)}`;
      }
      snkEl('path', { d: trunk, fill: 'rgba(80,40,0,.18)', transform: 'translate(4 5)' }, inner);
      snkEl('path', { d: trunk, fill: '#9a6a35', stroke: I, 'stroke-width': 2, 'stroke-linejoin': 'round' }, inner);
      snkEl('path', { d: notch, stroke: '#5b3613', 'stroke-width': 1.6, fill: 'none', 'stroke-linejoin': 'round' }, inner);
      // The crown, just past its top square's middle: fronds and two bunches of dates.
      const crown = snkEl('g', {}, inner);
      crown.innerHTML = crownSvg(B.x, B.y, 20, true);
      const glowL = snkEl('path', { d: trunk, fill: 'none', stroke: '#ffe27a', 'stroke-width': 6, opacity: 0 }, inner);
      return {
        g: g, inner: inner, glowL: glowL, base: base, A: A, B: B, ux: ux, uy: uy, L: L,
        pt: (u) => ({ x: snkLerp(a.x, b.x, u), y: snkLerp(a.y + 4, b.y + 4, u) })
      };
    },
    downMoves: { gulp: dGulp, board: dBoard, storm: dStorm, mizmar: dMizmar },
    upMoves: { climb: uClimb, camel: uCamel, balloon: uBalloon, dates: uDates }
  };
})();
