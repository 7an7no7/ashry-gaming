/* --- The board: the tray, the trace ----------------------------------------------- */

/** The tray of dice. `on`: the squares of the word being traced. */
function bglBoardHtml(grid, n, lang, on, off) {
  const lit = on || [];
  return `<div class="bgl-tray"><div class="bgl-grid${off ? ' is-off' : ''}" data-n="${n}" dir="${lang === 'en' ? 'ltr' : 'rtl'}" style="--bgl-n:${n}" data-bgl-grid>${(grid || []).map((ch, i) =>
    `<div class="bgl-tile${lit.indexOf(i) !== -1 ? ' is-on' : ''}" data-i="${i}"><span>${escapeHTML(ch)}</span></div>`).join('')}<svg class="bgl-line" aria-hidden="true"><polyline points=""/></svg></div></div>`;
}

/** The traced line over the tray, through the middle of each square on the path. */
function bglDrawLine(gridEl, path) {
  const line = gridEl && gridEl.querySelector('.bgl-line');
  if (!line) return;
  const gr = gridEl.getBoundingClientRect();
  line.setAttribute('viewBox', `0 0 ${Math.max(1, gr.width)} ${Math.max(1, gr.height)}`);
  const pts = (path || []).map(i => {
    const tile = gridEl.querySelector(`[data-i="${i}"]`);
    if (!tile) return '';
    const r = tile.getBoundingClientRect();
    return (r.left - gr.left + r.width / 2).toFixed(1) + ',' + (r.top - gr.top + r.height / 2).toFixed(1);
  }).filter(Boolean);
  const poly = line.querySelector('polyline');
  if (poly) poly.setAttribute('points', pts.length > 1 ? pts.join(' ') : '');
  gridEl.querySelectorAll('.bgl-tile').forEach(t => t.classList.toggle('is-on', (path || []).indexOf(Number(t.dataset.i)) !== -1));
}

/** The square whose middle is near a point (a diagonal drag doesn't catch the squares beside it). */
function bglTileAt(gridEl, x, y) {
  let best = null;
  gridEl.querySelectorAll('.bgl-tile').forEach(t => {
    const r = t.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    if (Math.abs(dx) <= r.width * 0.42 && Math.abs(dy) <= r.height * 0.42) best = t;
  });
  return best;
}

const bglTouching = (a, b, n) => a !== b && Math.abs(Math.floor(a / n) - Math.floor(b / n)) <= 1 && Math.abs((a % n) - (b % n)) <= 1;

/**
 * Binds tracing on a tray. o: { n, can() -> bool, change(path, tapped), send(path) }.
 * A drag sends when the finger lifts; taps build a word that the word box's ✓ sends.
 * The path lives in o.path (kept by the caller across redraws of the word box only).
 */
function bglTrace(gridEl, o) {
  if (!gridEl || gridEl.dataset.bound) return;
  gridEl.dataset.bound = '1';
  o.path = o.path || [];
  let drag = null;
  const set = (path, tapped) => { o.path = path; bglDrawLine(gridEl, path); o.change(path, tapped); };
  gridEl.addEventListener('pointerdown', (e) => {
    if (!o.can() || (drag && !e.isPrimary)) return;
    const tile = bglTileAt(gridEl, e.clientX, e.clientY) || (e.target.closest && e.target.closest('.bgl-tile'));
    if (!tile) return;
    e.preventDefault();
    const i = Number(tile.dataset.i);
    const pid = e.pointerId;
    const p = o.path;
    // A tap that carries on the tapped word, or a new start.
    let start;
    if (p.length && o.tapped && p[p.length - 1] === i) start = p.slice();
    else if (p.length && o.tapped && p.indexOf(i) === -1 && bglTouching(p[p.length - 1], i, o.n)) start = p.concat([i]);
    else start = [i];
    drag = { pid, moved: false, base: start };
    haptic('light');
    set(start, true);
    const move = (ev) => {
      if (ev.pointerId !== pid || !drag) return;
      const over = bglTileAt(gridEl, ev.clientX, ev.clientY);
      if (!over) return;
      const k = Number(over.dataset.i);
      const cur = o.path;
      const last = cur[cur.length - 1];
      if (k === last) return;
      if (!drag.moved) {
        // A drag is a word of its own: letters tapped before it don't stay in front.
        drag.moved = true;
        o.tapped = false;
        if (cur.length > 1 && cur[cur.length - 2] !== k) { set([last], false); }
      }
      const now = o.path;
      if (now.length > 1 && now[now.length - 2] === k) { set(now.slice(0, -1), false); return; }
      if (now.indexOf(k) === -1 && bglTouching(now[now.length - 1], k, o.n)) { haptic('light'); set(now.concat([k]), false); }
    };
    const up = (ev) => {
      if (ev && ev.pointerId !== pid) return;
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      const d = drag;
      drag = null;
      if (!d) return;
      if (d.moved) {
        const path = o.path;
        o.tapped = false;
        set([], false);
        if (path.length >= 2) o.send(path);
      } else {
        o.tapped = true;
        o.change(o.path, true);
      }
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}

/** The word box: the letters traced, the word's points, and ✓ / ✕ for a word built by taps. */
function bglWordHtml(text, pts, tapped, kind) {
  const t = bglT();
  if (!text) return `<div class="bgl-word is-empty" data-bgl-word>${escapeHTML(t.boggle_drag)}</div>`;
  return `<div class="bgl-word is-on${kind === 'wrong' ? ' is-wrong' : ''}" data-bgl-word>
    ${tapped ? `<button type="button" class="bgl-word__btn bgl-word__btn--x" data-bgl-clear aria-label="${escapeHTML(t.boggle_clear)}" title="${escapeHTML(t.boggle_clear)}">✕</button>` : ''}
    <span class="bgl-word__text" dir="auto">${escapeHTML(text)}</span>${pts ? `<span class="bgl-pts">${bglPtsText(pts)}</span>` : ''}
    ${tapped ? `<button type="button" class="bgl-word__btn bgl-word__btn--ok" data-bgl-ok aria-label="${escapeHTML(t.boggle_send)}" title="${escapeHTML(t.boggle_send)}">✓</button>` : ''}</div>`;
}

/** A refused word stays up a moment, red, and shakes. */
function bglRefuse(box, text) {
  if (!box) return;
  box.outerHTML = bglWordHtml(text, 0, false, 'wrong');
  const el = document.querySelector('[data-bgl-word].is-wrong');
  if (el && el.animate && !motionOff()) el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 260 });
  return el;
}

/** A word that counts flies from the word box into its chip (held hidden until it lands). */
function bglFly(fromRect, chip, text) {
  if (!chip) return;
  if (!fromRect || motionOff() || !document.body.animate) { chip.classList.remove('is-hold'); return; }
  const to = chip.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'bgl-fly';
  ghost.dir = 'auto';
  ghost.textContent = text;
  const host = chip.closest('[data-accent]');
  if (host) ghost.setAttribute('data-accent', host.getAttribute('data-accent'));
  document.body.appendChild(ghost);
  const g = ghost.getBoundingClientRect();
  const ax = fromRect.left + fromRect.width / 2 - g.width / 2, ay = fromRect.top + fromRect.height / 2 - g.height / 2;
  const bx = to.left + to.width / 2 - g.width / 2, by = to.top + to.height / 2 - g.height / 2;
  ghost.style.left = '0px';
  ghost.style.top = '0px';
  const ms = 460;
  const a = ghost.animate([
    { transform: `translate(${ax}px, ${ay}px) scale(1.3) rotate(-4deg)`, opacity: 1 },
    { transform: `translate(${(ax + bx) / 2}px, ${Math.min(ay, by) - 50}px) scale(1.1) rotate(-2deg)`, opacity: 1, offset: 0.5 },
    { transform: `translate(${bx}px, ${by}px) scale(${Math.max(0.5, to.width / Math.max(1, g.width))})`, opacity: 0.9 }
  ], { duration: ms, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' });
  let landed = false;
  const land = () => { if (landed) return; landed = true; if (ghost.isConnected) ghost.remove(); chip.classList.remove('is-hold'); if (typeof soloPop === 'function') soloPop(chip, 1.15); };
  a.onfinish = land;
  setTimeout(land, ms + 400);
}

/** A chip of a found word. */
function bglChipHtml(w, pts, cls, attrs) {
  return `<span class="bgl-chip${cls ? ' ' + cls : ''}"${attrs || ''}><bdi>${escapeHTML(w)}</bdi>${pts === null || pts === undefined ? '' : `<small>${pts === '?' ? '?' : bglPtsText(pts)}</small>`}</span>`;
}

/** The clock's text: m:ss. */
const bglClockText = (secs) => { const s = Math.max(0, Math.ceil(secs)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* --- The game alone ---------------------------------------------------------------- */

let bglSoloClock = null;
const bglSolo = { path: [], tapped: false, last: -1 };
const BOGGLE_SOLO_MISSED = 6;

function boggleSoloState() {
  if (!appState.boggle || typeof appState.boggle !== 'object' || !appState.boggle.v) {
    appState.boggle = { v: 1, size: 4, phase: 'setup', daily: '', lang: 'ar', n: 4, grid: [], words: [], show: {}, found: [], secs: 120, startedAt: 0, pausedAt: 0, score: 0, seconds: 0 };
  }
  return appState.boggle;
}

/** Its card on the home, and its setup screen. */
function setupBoggle() {
  bglSoloStop();
  setView('setup-boggle');
}

function paintBoggleSetup() {
  const s = boggleSoloState();
  const t = bglT();
  document.querySelectorAll('#boggle-size .segmented__item').forEach(el => el.classList.toggle('is-active', Number(el.dataset.value) === s.size));
  const best = soloBest('boggle', String(s.size));
  const el = document.getElementById('boggle-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${best.score} ${t.boggle_pts || ''}` : '';
  const cont = document.getElementById('boggle-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('boggle-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('boggle', 'startBoggleSolo(true)');
}

function setBoggleSize(n) {
  boggleSoloState().size = Number(n) === 5 ? 5 : 4;
  saveToLocal();
  paintBoggleSetup();
}

const bglHasWork = (s) => (s.found || []).length > 0;

function startBoggleSolo(daily, sure) {
  if (!sure && soloConfirmNew('boggle', bglHasWork, () => startBoggleSolo(daily, true))) return;
  if (daily && soloDailyResume('boggle')) return;
  const s = boggleSoloState();
  const n = daily ? 4 : s.size;
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  let made = boggleMake(n, lang, soloRandom(daily ? soloDaySeed('boggle:' + lang) : null));
  if (!made && !daily) made = boggleMake(n, lang, soloRandom(null));
  if (!made) { showToast(bglT().solo_make_failed || '', 'error'); return; }
  soloDailySetAside('boggle');
  soloNewGame('boggle');
  const show = {};
  made.words.forEach(f => { show[f] = boggleShow(f, lang); });
  Object.assign(s, {
    daily: daily ? soloToday() : '', lang, n, grid: made.grid, words: made.words, show, found: [],
    secs: BOGGLE_SIZES[n], startedAt: Date.now(), pausedAt: 0, score: 0, seconds: 0, phase: 'play'
  });
  bglSolo.path = []; bglSolo.tapped = false;
  saveToLocal();
  setView('play-boggle');
  paintBoggleSolo();
  bglSoloArm();
}

function continueBoggleSolo() {
  if (boggleSoloState().phase !== 'play') return;
  setView('play-boggle');
  paintBoggleSolo();
  bglSoloArm();
}

const bglSoloLeft = (s) => s.secs - (Date.now() - s.startedAt) / 1000;

function bglSoloArm() {
  bglSoloStop();
  bglSolo.last = -1;
  bglSoloClock = createClock({ countUp: true, onTick: bglSoloTick });
  bglSoloTick();
}

function bglSoloStop() {
  if (bglSoloClock) bglSoloClock.stop();
  bglSoloClock = null;
}

function bglSoloTick() {
  const s = boggleSoloState();
  if (s.phase !== 'play') { bglSoloStop(); return; }
  if (appState.currentView !== 'play-boggle' || s.pausedAt) return;
  const left = bglSoloLeft(s);
  const el = document.getElementById('bgl-solo-time');
  const sec = Math.max(0, Math.ceil(left));
  if (el) {
    el.textContent = bglClockText(left);
    const stat = el.closest('.solo-stat');
    if (stat) stat.classList.toggle('is-low', left <= 10);
  }
  if (sec <= 5 && sec > 0 && sec !== bglSolo.last) { bglSolo.last = sec; playSound('tick'); }
  if (left <= 0) bglSoloFinish();
}

const bglSoloScore = (s) => (s.found || []).reduce((sum, f) => sum + boggleWordPts(f), 0);

function paintBoggleSolo() {
  const s = boggleSoloState();
  const el = document.getElementById('boggle-stage');
  if (!el || !s.grid.length) return;
  const t = bglT();
  const playing = s.phase === 'play';
  const bar = soloBarHtml([
    { label: t.solo_time || '', value: bglClockText(playing ? bglSoloLeft(s) : 0), id: 'bgl-solo-time' },
    { label: t.boggle_words || '', value: s.daily ? ltrFrac(s.found.length, s.words.length) : s.found.length, id: 'bgl-solo-count' },
    { label: t.boggle_points || '', value: bglSoloScore(s), id: 'bgl-solo-pts' }
  ]);
  const chips = s.found.map((f, k) => bglChipHtml(s.show[f] || f, boggleWordPts(f), k === 0 && bglSolo.fresh === f ? 'is-new is-hold' : '', ` data-f="${escapeHTML(f)}"`)).join('');
  el.innerHTML = `
    <div class="bgl bgl--play">
      ${bglBoardHtml(s.grid, s.n, s.lang, [], !playing)}
      <div class="bgl-side">
        ${bar}
        ${bglWordHtml('', 0, false)}
        <div class="bgl-found">
          <div class="bgl-found__head"><span>${escapeHTML((t.boggle_found_n || '{n}').replace('{n}', bglWordsN(s.found.length)))}</span>${s.daily ? `<small>📅 ${escapeHTML(t.daily_title || '')}</small>` : ''}</div>
          <div class="bgl-chips" data-bgl-chips>${chips}</div>
        </div>
        <div class="bgl-foot">
          ${playing ? `<button type="button" class="btn btn--neutral btn--sm btn--auto" onclick="bglSoloFinish()">🏁 ${escapeHTML(t.boggle_done)}</button>` : ''}
          <button type="button" class="btn btn--ghost btn--sm btn--auto play-exit" onclick="${playing ? 'playExit(setupBoggle)' : 'setupBoggle()'}">${escapeHTML(t.exit || '')}</button>
        </div>
      </div>
    </div>`;
  const grid = el.querySelector('[data-bgl-grid]');
  bglTrace(grid, {
    n: s.n,
    get path() { return bglSolo.path; }, set path(v) { bglSolo.path = v; },
    get tapped() { return bglSolo.tapped; }, set tapped(v) { bglSolo.tapped = v; },
    can: () => boggleSoloState().phase === 'play',
    change: (path, tapped) => bglSoloWordBox(path, tapped),
    send: (path) => bglSoloSend(path)
  });
  bglDrawLine(grid, bglSolo.path);
  bglSoloWordBox(bglSolo.path, bglSolo.tapped);
  if (bglSolo.fresh) {
    const chip = el.querySelector('[data-bgl-chips] .is-hold');
    bglFly(bglSolo.from, chip, chip ? chip.textContent : '');
    bglSolo.fresh = null;
  }
}

/** The word box while tracing: the letters, and the list's spelling once it is a word. */
function bglSoloWordBox(path, tapped) {
  const s = boggleSoloState();
  const box = document.querySelector('#boggle-stage [data-bgl-word]');
  if (!box) return;
  const raw = path.map(i => s.grid[i]).join('');
  const f = path.length >= 2 ? boggleResolve(raw, s.lang, (x) => s.words.indexOf(x) !== -1) : '';
  const known = f && s.words.indexOf(f) !== -1;
  box.outerHTML = bglWordHtml(known ? (s.show[f] || raw) : raw, known || f.length >= BOGGLE_MIN_LEN ? boggleWordPts(f) : 0, tapped && path.length >= 1);
  const now = document.querySelector('#boggle-stage [data-bgl-word]');
  if (!now) return;
  const ok = now.querySelector('[data-bgl-ok]');
  const clear = now.querySelector('[data-bgl-clear]');
  if (ok) ok.onclick = () => { const p = bglSolo.path; bglSolo.path = []; bglSolo.tapped = false; bglDrawLine(document.querySelector('#boggle-stage [data-bgl-grid]'), []); if (p.length >= 2) bglSoloSend(p); else bglSoloWordBox([], false); };
  if (clear) clear.onclick = () => { bglSolo.path = []; bglSolo.tapped = false; bglDrawLine(document.querySelector('#boggle-stage [data-bgl-grid]'), []); bglSoloWordBox([], false); };
}

function bglSoloSend(path) {
  const s = boggleSoloState();
  const t = bglT();
  if (s.phase !== 'play') return;
  const box = document.querySelector('#boggle-stage [data-bgl-word]');
  const raw = path.map(i => s.grid[i]).join('');
  const letters = boggleTraceWord(s.grid, s.n, path, s.lang);
  const f = letters ? boggleResolve(letters, s.lang, (x) => s.words.indexOf(x) !== -1) : '';
  bglSolo.path = [];
  bglSolo.tapped = false;
  if (f && s.found.indexOf(f) !== -1) {
    bglRefuse(box, s.show[f] || raw);
    showToast(t.boggle_again || '', 'info');
    bglSoloLater();
    return;
  }
  if (!f || s.words.indexOf(f) === -1) {
    bglRefuse(box, raw);
    if (f) showToast(t.boggle_not_listed || '', 'info');
    bglSoloLater();
    return;
  }
  s.found.unshift(f);
  saveToLocal();
  playSound('success');
  haptic(boggleWordPts(f) >= 3 ? 'double' : 'light');
  bglSolo.from = box ? box.getBoundingClientRect() : null;
  bglSolo.fresh = f;
  paintBoggleSolo();
  const pts = document.getElementById('bgl-solo-pts');
  if (pts && !motionOff()) countUp(pts, bglSoloScore(s) - boggleWordPts(f), bglSoloScore(s));
  if (s.found.length === s.words.length) bglSoloFinish();
}

/** After a refusal the empty box comes back. */
function bglSoloLater() {
  soloLater('boggle', motionOff() ? 500 : 700, () => { if (!bglSolo.path.length) bglSoloWordBox([], false); });
}

function bglSoloFinish() {
  const s = boggleSoloState();
  const t = bglT();
  if (s.phase !== 'play') return;
  s.phase = 'done';
  bglSoloStop();
  s.score = bglSoloScore(s);
  s.seconds = Math.min(s.secs, Math.round((Date.now() - s.startedAt) / 1000));
  saveToLocal();
  paintBoggleSolo();
  const level = String(s.n);
  const rec = s.archive ? { record: false, prev: soloBest('boggle', level) }
    : soloRecord('boggle', level, { score: s.score, found: s.found.length }, (a, b) => a.score > b.score);
  let share = '';
  const foundOf = (t.boggle_found_of || '{n}/{m}').replace('{n}', s.found.length).replace('{m}', s.words.length);
  if (s.daily) {
    soloMarkDaily('boggle', { found: s.found.length, total: s.words.length, score: s.score }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🔠 ${t.setup_boggle || ''}: ${foundOf} · ⭐ ${s.score}`;
  }
  const lines = [escapeHTML(foundOf)];
  const longest = s.found.slice().sort((a, b) => b.length - a.length)[0];
  if (longest) lines.push(`${escapeHTML(t.boggle_longest || '')}: <bdi>${escapeHTML(s.show[longest] || longest)}</bdi>`);
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.score}`);
  const shareLines = lines.slice(0, 1);
  const missed = s.words.filter(f => s.found.indexOf(f) === -1).slice(0, BOGGLE_SOLO_MISSED);
  if (missed.length) lines.push(`<span class="bgl-chips" style="justify-content:center">${escapeHTML(t.boggle_missed || '')}: ${missed.map(f => bglChipHtml(s.show[f] || f, null, 'is-miss')).join('')}</span>`);
  soloLater('boggle', motionOff() ? 0 : 700, () => soloResult({
    icon: iconHtml('art:boggle'), shareIcon: '🔠', title: rec.record ? (t.solo_new_best || '') : (t.boggle_time_up || ''),
    value: s.score, valueLabel: t.boggle_points || '', lines, shareLines, win: s.score > 0, share,
    again: () => startBoggleSolo(false), exit: setupBoggle
  }));
}

function restoreBoggleSolo() {
  const s = boggleSoloState();
  if (s.phase !== 'play' || !s.grid.length) return false;
  bglSolo.path = []; bglSolo.tapped = false;
  paintBoggleSolo();
  bglSoloArm();
  return true;
}

onLeaveScreen((from) => { if (from === 'play-boggle') { bglSoloStop(); bglSolo.path = []; bglSolo.tapped = false; } });
onLeaveScreen((from, to) => { if (to === 'play-boggle' && boggleSoloState().phase === 'play' && !bglSoloClock) setTimeout(() => { if (appState.currentView === 'play-boggle' && !bglSoloClock) bglSoloArm(); }, 0); });

soloRegister('boggle', {
  setup: 'setup-boggle', play: 'play-boggle', paintSetup: paintBoggleSetup, restore: restoreBoggleSolo,
  state: boggleSoloState, resume: continueBoggleSolo, repaint: paintBoggleSolo, timed: true, prefs: ['size']
});
</script>
