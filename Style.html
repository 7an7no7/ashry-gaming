.uno-hcard.is-dim .uno-card { filter: saturate(0.35) brightness(0.9); }
.uno-hcard.is-jump { transform: translateY(-0.6rem); }
.uno-hcard.is-jump .uno-card { box-shadow: 0 0 0 3px var(--warning), 0 8px 18px -6px color-mix(in srgb, var(--warning) 70%, transparent); }
.uno-hcard.is-drawn { transform: translateY(-0.85rem); }
.uno-hcard.is-drawn .uno-card { box-shadow: 0 0 0 3px var(--accent), 0 10px 22px -8px var(--accent-glow); filter: none; }
.uno-hcard.is-picked { transform: translateY(-1rem); }
.uno-hcard.is-picked .uno-card { box-shadow: 0 0 0 3px var(--accent), 0 10px 22px -8px var(--accent-glow); }
/* Tapped, on its way to the server: it rises a little further at once (on top of
   whatever lift this screen gives a playable card) and flies from there. */
.uno-hand .uno-hcard.is-sent { translate: 0 -0.4rem; transition: transform var(--dur-2) var(--ease-out), translate 120ms var(--ease-out); }
.uno-hand .uno-hcard.is-sent .uno-card { box-shadow: 0 12px 22px -8px rgba(0, 0, 0, 0.5); filter: brightness(1.06); }
.uno-hcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* --- What to do now: a bar that stays at the foot of the screen --- */
.uno-actbar {
  position: sticky;
  bottom: var(--sp-2);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-4);
  max-height: calc(var(--app-h, 100dvh) - 10rem);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.uno-actbar--catch, .uno-actbar--facing { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger), var(--sh-4); }
.uno-note { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-2) var(--sp-3); text-align: center; }
.uno-prompt { margin: 0; color: var(--text-strong); font-size: var(--fs-h3); font-weight: 900; line-height: 1.35; text-align: center; }
.uno-prompt.is-mine { color: var(--accent-ink); }
.uno-hint { margin: 0; color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; line-height: 1.4; text-align: center; }
.uno-hint--auto { color: var(--accent-ink); }
.uno-hint--jump { color: var(--warning-ink); font-weight: 800; }
.uno-actrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.uno-actrow .btn { padding-inline: var(--sp-2); }
.uno-colors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.uno-colorbtn {
  min-height: 3.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0 var(--sp-2);
  border: 0;
  border-radius: var(--r-md);
  background: var(--c);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, white), var(--c) 70%);
  box-shadow: 0 6px 14px -8px var(--c);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
}
.uno-colorbtn__dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: currentColor; opacity: 0.85; }
.uno-targets { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); }
.uno-target {
  max-width: 11rem;
  min-height: var(--tap);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface-2);
  color: var(--text-strong);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 800;
  cursor: pointer;
}
.uno-target__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uno-target .metric { color: var(--accent-ink); }
.uno-say { display: flex; flex-direction: column; gap: 4px; }
.uno-saybtn { background: var(--uno-tag); color: #fff; font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; box-shadow: 0 8px 18px -10px var(--uno-tag); }
.uno-say.is-urgent .uno-saybtn { animation: uno-say-pulse 0.8s ease-in-out infinite alternate; }
@keyframes uno-say-pulse { from { transform: scale(1); } to { transform: scale(1.045); } }
.uno-catch { display: flex; flex-direction: column; gap: 4px; }

/* --- The end of a round, and of the game --- */
.uno-won { margin-bottom: var(--sp-3); text-align: center; }
.uno-won .card__title { overflow-wrap: anywhere; }
.uno-sub { margin: 0 0 var(--sp-2); color: var(--text-2); font-size: var(--fs-sm); font-weight: 800; text-align: center; }
.uno-rule { margin: 0 0 var(--sp-3); color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; line-height: 1.5; text-align: center; }
.uno-over { margin-bottom: var(--sp-3); text-align: center; }
.uno-over .podium { margin-top: var(--sp-2); }
.uno-reveal { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.uno-rrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "who pts" "cards cards";
  align-content: start;
  align-items: center;
  gap: 4px var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-solid);
}
.uno-rrow.is-winner { border-color: var(--success); box-shadow: 0 0 0 1px var(--success); }
.uno-rrow__who { grid-area: who; min-width: 0; }
.uno-rrow__name { display: block; overflow: hidden; color: var(--text-strong); font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
.uno-rrow__pts { grid-area: pts; display: flex; align-items: baseline; gap: 1px; color: var(--text-strong); font-size: 1.3rem; direction: ltr; }
.uno-rrow.is-winner .uno-rrow__pts { color: var(--success-ink); }
.uno-rrow__plus { font-weight: 900; }
.uno-rrow__cards { grid-area: cards; display: flex; flex-wrap: wrap; gap: 3px; }
.uno-rrow__done { color: var(--success-ink); font-size: var(--fs-sm); font-weight: 900; }
.uno-flip { position: relative; display: inline-block; }
.uno-flip__face { display: block; }
.uno-flip__back { position: absolute; inset: 0; }
.is-revealing .uno-flip__back { animation: uno-flip-back 420ms linear both; animation-delay: var(--at, 0ms); }
.is-revealing .uno-flip__face { animation: uno-flip-face 420ms var(--ease-out) both; animation-delay: var(--at, 0ms); }
@keyframes uno-flip-back { 0% { transform: scaleX(1); } 45% { transform: scaleX(0); } 100% { transform: scaleX(0); visibility: hidden; } }
@keyframes uno-flip-face { 0%, 45% { transform: scaleX(0); } 100% { transform: scaleX(1); } }

/* --- The lobby: a fan of five cards over the options --- */
.uno-lobby__cards { display: flex; justify-content: center; gap: 4px; margin: var(--sp-1) 0 var(--sp-2); }
.uno-lobby__cards .uno-card:nth-child(1) { transform: rotate(-12deg) translateY(4px); }
.uno-lobby__cards .uno-card:nth-child(2) { transform: rotate(-6deg); }
.uno-lobby__cards .uno-card:nth-child(4) { transform: rotate(6deg); }
.uno-lobby__cards .uno-card:nth-child(5) { transform: rotate(12deg) translateY(4px); }
.uno-lobby__sub { margin-top: calc(var(--sp-2) * -1); }

/* --- Flights, signs, landings --- */
.uno-ghost { position: fixed; left: 0; top: 0; z-index: var(--z-fx-ghost); pointer-events: none; transform-origin: center; will-change: transform; }
.uno-ghost__flip { position: relative; width: 100%; height: 100%; will-change: transform; }
.uno-ghost__face { position: absolute; inset: 0; }
.uno-ghost__face--b { opacity: 0; }
.uno-ghost .uno-card { box-shadow: var(--sh-3); }
.uno-hold { visibility: hidden; }
.uno-landed > .uno-card { animation: uno-land 380ms cubic-bezier(0.2, 1.4, 0.35, 1); }
@keyframes uno-land { 0% { transform: scale(0.9); } 60% { transform: scale(1.06); } 100% { transform: none; } }
.uno-pop {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-pop);
  padding: 0.1em 0.45em;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-3);
  color: var(--text-strong);
  font-size: 1.25rem;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}
.uno-pop--big { background: transparent; box-shadow: none; font-size: 2.2rem; }
.uno-ring { position: fixed; z-index: var(--z-fx-ghost); border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.uno-ring--r { border-color: var(--uno-r); border-width: 5px; }
.uno-ring--y { border-color: var(--uno-y); border-width: 5px; }
.uno-ring--g { border-color: var(--uno-g); border-width: 5px; }
.uno-ring--b { border-color: var(--uno-b); border-width: 5px; }
.uno-ring--shout, .uno-ring--danger { border-color: var(--uno-tag); }
.uno-stamp {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-stamp);
  display: grid;
  place-items: center;
  padding: 0.1em 0.35em;
  border: 3px solid currentColor;
  border-radius: 0.4em;
  background: var(--surface-solid);
  color: var(--accent-ink);
  font-size: 1.6rem;
  font-weight: 900;
  line-height: 1.1;
  white-space: nowrap;
  pointer-events: none;
}
.uno-stamp .uno-icon { width: 2.2rem; height: 2.2rem; stroke-width: 2.8; }
.uno-stamp--danger { color: var(--danger-ink); }
.uno-spark { position: fixed; left: 0; top: 0; z-index: var(--z-fx-pop); color: var(--warning); font-size: 0.9rem; line-height: 1; pointer-events: none; }
.uno-spark--shout { color: var(--uno-tag); }
.uno-shout {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-top);
  padding: 0.15em 0.55em;
  border-radius: var(--r-full);
  background: var(--uno-tag);
  box-shadow: 0 10px 26px -8px rgba(198, 40, 40, 0.7);
  color: #fff;
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 800;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}
.uno-pop.is-tv { font-size: 5vmin; }
.uno-pop--big.is-tv { font-size: 8vmin; }
.uno-ring.is-tv { border-width: 0.7vmin; }
.uno-stamp.is-tv { font-size: 6vmin; }
.uno-stamp.is-tv .uno-icon { width: 8vmin; height: 8vmin; }
.uno-spark.is-tv { font-size: 2.6vmin; }
.uno-shout.is-tv { font-size: 7vmin; }

/* --- A phone on its side: the pile beside your hand and the bar, the seats a strip above --- */
@media (orientation: landscape) and (max-height: 500px) {
  .uno-layout { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); grid-template-areas: "center mine" "center act" "log act"; column-gap: var(--sp-3); align-items: start; }
  .uno-head { margin-bottom: var(--sp-1); }
  .uno-latest { margin-bottom: var(--sp-1); padding-block: var(--sp-1); }
  .uno-opps { margin-bottom: var(--sp-1); padding-block: 2px 4px; }
  .uno-seat { min-height: 2.3rem; padding-block: 2px; }
  .uno-center { gap: var(--sp-4); margin-bottom: var(--sp-2); padding: var(--sp-2) var(--sp-2) var(--sp-1); }
  .uno-center .uno-card--lg { --uno-w: 3.6rem; }
  .uno-center .uno-card--md { --uno-w: 2.5rem; }
  .uno-mine { margin-bottom: var(--sp-2); padding: var(--sp-1) var(--sp-2) var(--sp-2); }
  .uno-hand { gap: var(--sp-2); padding-top: 0.7rem; }
  .uno-hand .uno-card { --uno-w: 2.8rem; }
  .uno-hcard.is-play, .uno-hcard.is-jump { transform: translateY(-0.45rem); }
  .uno-actbar { gap: var(--sp-1); padding: var(--sp-2); max-height: calc(var(--app-h, 100dvh) - 4rem); }
  .uno-actbar .uno-prompt { font-size: var(--fs-sm); line-height: 1.3; }
  .uno-actbar .btn { min-height: 2.5rem; font-size: var(--fs-sm); }
  .uno-colorbtn { min-height: 2.5rem; font-size: 1.05rem; }
  .uno-colors { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .uno-log { display: none; }
}
/* --- A laptop, a big screen as a player's own: the pile across the width, your hand
   under it beside the bar, the cards sized by the screen's height --- */
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-uno { max-width: 78rem; }
  .uno-opps { flex-wrap: wrap; justify-content: center; overflow: visible; }
  .uno-opps > :first-child, .uno-opps > :last-child { margin-inline: 0; }
  .uno-seat { max-width: 14rem; }
  .uno-seat__name { max-width: 8rem; }
  .uno-layout { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); grid-template-areas: "center center" "mine act" "log act"; column-gap: var(--sp-5); align-items: start; }
  .uno-center { gap: clamp(2rem, 6vw, 5rem); padding: var(--sp-5) var(--sp-5) var(--sp-4); }
  .uno-center .uno-card--lg { --uno-w: clamp(8rem, 17.5vh, 15rem); }
  .uno-center .uno-card--md { --uno-w: clamp(5.25rem, 11.5vh, 10rem); }
  .uno-dot { width: 2.5rem; height: 2.5rem; }
  .uno-dir svg { width: 2.25rem; height: 2.25rem; }
  .uno-state__color { font-size: var(--fs-h3); }
  .uno-pending { font-size: 1.4rem; }
  .uno-mine { margin-bottom: 0; }
  .uno-hand .uno-card { --uno-w: clamp(4.4rem, 11vh, 8rem); }
  .uno-hcard.is-play, .uno-hcard.is-jump { transform: translateY(-0.8rem); }
  .uno-hand { padding-top: 1.1rem; }
  .uno-actbar { position: static; margin-bottom: 0; }
  .uno--result .uno-reveal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* --- The TV: the seats a ring of compact chips (along the top, back along the bottom),
   the pile in the middle taking the screen, the turn and the moves beside it --- */
.uno-tv { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--tv-gap); --uno-fan-w: 3.6vmin; }
.uno-tv__ring { min-width: 0; display: flex; justify-content: center; gap: var(--tv-gap); }
.uno-tv .uno-seat { flex: 0 1 auto; max-width: 30vw; min-height: 0; gap: 1.2vmin; padding: 0.8vmin 2vmin 0.8vmin 0.8vmin; border-width: 0.2vmin; }
.uno-tv .uno-avatar { width: 5vmin; height: 5vmin; font-size: 2.4vmin; }
.uno-tv .uno-seat__name { max-width: 18vw; font-size: var(--tv-sm); }
.uno-tv .uno-seat__hand { display: flex; align-items: center; gap: 1.4vmin; margin: 0; padding: 0; }
.uno-tv .uno-seat__n { position: static; min-width: 3.6vmin; padding: 0; background: none; box-shadow: none; font-size: var(--tv-md); line-height: 1; }
.uno-tv .uno-tag { padding: 0.2vmin 1vmin; font-size: var(--tv-xs); }
.uno-tv .uno-seat__stage { font-size: var(--tv-xs); }
.uno-tv .uno-fan { width: max(var(--uno-fan-w), calc(var(--uno-fan-w) + (var(--of, 1) - 1) * var(--uno-fan-w) * 0.42)); height: calc(var(--uno-fan-w) * 1.5); }
.uno-tv .uno-fan__card { inset-inline-start: calc(var(--k) * var(--uno-fan-w) * 0.42); }
.uno-tv .uno-fan .uno-card { --uno-w: var(--uno-fan-w); }
.uno-tv__mid { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: calc(var(--tv-gap) * 1.5); align-items: stretch; }
.uno-tv__info { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: var(--tv-gap); overflow: hidden; text-align: center; }
.uno-tv__table { min-width: 0; min-height: 0; display: flex; }
.uno-tv .uno-head { margin: 0; }
.uno-tv .badge, .uno-tvres .badge { height: auto; padding: 0.25em 0.7em; font-size: var(--tv-xs); }
.uno-tv__turn { color: var(--text-strong); font-size: var(--tv-lg); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
.uno-tv__catch { color: var(--danger-ink); font-size: var(--tv-sm); font-weight: 900; }
.uno-tv .uno-latest { margin: 0; padding: 0.8vmin 1.6vmin; border-radius: var(--tv-r); font-size: var(--tv-sm); }
.uno-tv .uno-center { flex: 1; min-height: 0; margin: 0; gap: 6vmin; padding: 3vmin; border-radius: var(--tv-r); }
.uno-tv .uno-center .uno-card--lg { --uno-w: min(25vmin, 16vw); }
.uno-tv .uno-center .uno-card--md { --uno-w: min(16vmin, 10vw); }
.uno-tv .uno-zone__label { max-width: 24vmin; font-size: var(--tv-sm); }
.uno-tv .uno-count { font-size: var(--tv-sm); }
.uno-tv .uno-pending { inset-block-start: -1.5vmin; inset-inline-end: -3vmin; padding: 0.4vmin 1.6vmin; font-size: var(--tv-lg); }
.uno-tv .uno-dot { width: 8vmin; height: 8vmin; box-shadow: 0 0 0 1.2vmin color-mix(in srgb, var(--c) 28%, transparent); }
.uno-tv .uno-dir svg { width: 7vmin; height: 7vmin; }
.uno-tv .uno-state__color { font-size: var(--tv-md); }
.uno-tv .uno-zone--state { gap: 1.4vmin; }
.uno-tv .uno-log { margin: 0; }
.uno-tv .uno-log li { padding: 0.5vmin 1vmin; font-size: var(--tv-xs); }
.uno-tv .tv-actions { margin: 0; }
.uno-tv .tv-actions:not(:has(.btn)) { display: none; }
.uno-tv__host:empty { display: none; }
/* Five or six a row: smaller chips, the names shorter. */
.uno-tv--many { --uno-fan-w: 3vmin; }
.uno-tv--many .uno-seat { gap: 0.8vmin; padding: 0.6vmin 1.4vmin 0.6vmin 0.6vmin; }
.uno-tv--many .uno-avatar { width: 4vmin; height: 4vmin; font-size: 2vmin; }
.uno-tv--many .uno-seat__name { max-width: 11vw; }
.uno-tv--many .uno-seat__n { min-width: 3vmin; font-size: var(--tv-sm); }
.uno-tvres { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: center; gap: calc(var(--tv-gap) * 2); }
.uno-tvres__cards, .uno-tvres__side { min-width: 0; display: flex; flex-direction: column; gap: var(--tv-gap); }
.uno-tvres__side { align-items: center; }
.uno-tvres__side > .tv-scale { width: 100%; }
.uno-reveal--tv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--tv-gap); margin: 0; }
.uno-reveal--tv:has(> :nth-child(7)) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.uno-reveal--tv .uno-rrow { padding: 1vmin 1.6vmin; border-radius: var(--tv-r); }
.uno-reveal--tv .uno-rrow__name { font-size: var(--tv-sm); }
.uno-reveal--tv .uno-rrow__pts { font-size: var(--tv-md); }
.uno-reveal--tv .uno-card { --uno-w: 4.4vmin; }
.uno-reveal--tv:has(> :nth-child(7)) .uno-card { --uno-w: 3.4vmin; }
.uno-reveal--tv .uno-rrow__done { font-size: var(--tv-xs); }
/* A phone mirrored upright: one column, and the stage scrolls. */
@media (orientation: portrait) {
  .uno-tv { height: auto; }
  .uno-tv__ring { flex-wrap: wrap; }
  .uno-tv__mid { grid-template-columns: minmax(0, 1fr); }
  .uno-tvres, .uno-reveal--tv, .uno-reveal--tv:has(> :nth-child(7)) { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .uno-landed > .uno-card, .uno-latest.is-new, .is-revealing .uno-flip__face, .uno-say.is-urgent .uno-saybtn, .uno-seat.is-catch::after { animation: none; }
  .is-revealing .uno-flip__back { display: none; }
  .uno-hcard, .uno-hcard .uno-card, .uno-seat { transition: none; }
}

/* ==========================================================================
   21. الدومينو
   JS_RoomDomino.html: the table on separate phones and on the TV. One tile,
   .dt, sized by --u (its short side; standing it is --u × 2--u, lying 2--u ×
   --u), in the look the owner picked (أ, "عاجي"): ivory with black pips on a
   3 × 3 grid per half, a thin dark bar and a brass pin, the same in both
   themes. The table (.dom-table) is a box the layout is scaled into; every
   tile on it is placed absolutely by the script, left to right in every
   language. A move flies as a ghost over the page (.dom-ghost), and the tile
   it lands as stays hidden until then (.dom-hold).
   ========================================================================== */
:root {
  --dom-ivory-1: #fffdf7;
  --dom-ivory-2: #f3ead6;
  --dom-edge: #d8ccb2;
  --dom-pip: #1b1b1f;
  --dom-pin-1: #fbe7a0;
  --dom-pin-2: #b8892a;
  --dom-back-1: #fbf3df;
  --dom-back-2: #e7d9b8;
  --dom-frame: rgba(120, 90, 40, 0.28);
  --dom-shade: rgba(15, 23, 42, 0.4);
}

/* --- The tile. The default size is on :where(), so any context that sizes a tile wins. --- */
:where(.dt) { --u: 1.5rem; }
.dt {
  position: relative;
  flex: none;
  display: inline-grid;
  box-sizing: border-box;
  border-radius: calc(var(--u) * 0.22);
  background: linear-gradient(160deg, var(--dom-ivory-1), var(--dom-ivory-2));
  box-shadow: inset 0 -2px 0 rgba(120, 90, 40, 0.18), 0 calc(var(--u) * 0.1) 0 var(--dom-edge),
              0 calc(var(--u) * 0.2) calc(var(--u) * 0.4) calc(var(--u) * -0.2) var(--dom-shade);
  direction: ltr;
  vertical-align: top;
  -webkit-user-select: none;
  user-select: none;
}
.dt--v { width: var(--u); height: calc(var(--u) * 2); grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); }
.dt--h { width: calc(var(--u) * 2); height: var(--u); grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
.dt__half { display: grid; grid-template: repeat(3, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr)); min-width: 0; min-height: 0; padding: calc(var(--u) * 0.16); }
.dt__half i {
  display: block;
  width: calc(var(--u) * 0.17);
  height: calc(var(--u) * 0.17);
  border-radius: 50%;
  place-self: center;
  background: var(--dom-pip);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25);
}
.dt--v .dt__bar { height: max(1px, calc(var(--u) * 0.06)); margin: 0 calc(var(--u) * 0.14); background: var(--dom-pip); opacity: 0.75; }
.dt--h .dt__bar { width: max(1px, calc(var(--u) * 0.06)); margin: calc(var(--u) * 0.14) 0; background: var(--dom-pip); opacity: 0.75; }
.dt__pin {
  position: absolute;
  inset: 0;
  margin: auto;
  width: calc(var(--u) * 0.14);
  height: calc(var(--u) * 0.14);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--dom-pin-1), var(--dom-pin-2));
}
/* Face down: ivory with an engraved frame. */
.dt--back { background: linear-gradient(160deg, var(--dom-back-1), var(--dom-back-2)); }
.dt--back::after {
  content: '';
  position: absolute;
  inset: 22%;
  border: max(1px, calc(var(--u) * 0.07)) solid var(--dom-frame);
  border-radius: calc(var(--u) * 0.1);
}

/* --- The screen: who is at the table (a compact strip), the table, your hand.
   While a round is played the table gets most of the screen at every size
   (the owner, 21 Sep 2026); upright the three stack, on a phone's side the
   table takes one column, on a laptop it takes the width. --- */
.dom-layout { display: flex; flex-direction: column; gap: 0.4rem; }
.dom-top { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.dom-layout__table { min-width: 0; }
.dom-play { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.dom-host:empty { display: none; }
.dom-head, .dom-strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.25rem; }
.dom-strip .badge { height: auto; padding: 0.15em 0.6em; line-height: 1.4; }
.dom-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  padding: 0.15em 0.65em;
  border: 1px solid var(--border);
  border-radius: var(--r-full);
  background: var(--surface);
  color: var(--text);
  font-size: var(--fs-xs);
  font-weight: var(--fw-bold);
  white-space: nowrap;
}
.dom-chip b { color: var(--accent-ink); }
.dom-chip.is-me { border-color: var(--accent-border); }
.dom-chip--team0 { border-inline-start: 3px solid var(--team-blue); }
.dom-chip--team1 { border-inline-start: 3px solid var(--team-red); }
.dom-chip--target { background: var(--surface-2); }
.dom-team-dot { display: inline-block; flex: none; width: 0.6em; height: 0.6em; margin-inline-end: 0.3em; border-radius: 50%; vertical-align: middle; }
.dom-team-dot--0 { background: var(--team-blue); }
.dom-team-dot--1 { background: var(--team-red); }

/* --- The felt and the table --- */
.dom-felt {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
  padding: 0.4rem;
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: radial-gradient(120% 90% at 50% 40%, color-mix(in srgb, var(--accent) 14%, var(--surface-2)), color-mix(in srgb, var(--accent) 6%, var(--surface-2)));
  box-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.1);
}
body.dark .dom-felt { background: radial-gradient(120% 90% at 50% 40%, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), color-mix(in srgb, var(--accent) 9%, var(--surface-2))); }
.dom-felt__top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); min-height: 1.6rem; }
.dom-table {
  position: relative;
  display: grid;
  place-items: center;
  /* Upright, the head, the seats, your hand and the bar fit a 375 × 812 screen under it. */
  height: clamp(10rem, calc(var(--app-h, 100dvh) - 31.5rem), 28rem);
  overflow: hidden;
}
.dom-felt--small .dom-table { height: clamp(8rem, calc(var(--app-h, 100dvh) * 0.26), 14rem); }
.dom-table__empty { color: var(--text-2); font-size: var(--fs-sm); font-weight: var(--fw-bold); text-align: center; }
.dom-line { position: relative; }
.dom-ttile { position: absolute; }
.dom-ttile.is-spinner { box-shadow: inset 0 -2px 0 rgba(120, 90, 40, 0.18), 0 calc(var(--u) * 0.1) 0 var(--dom-edge), 0 0 0 2px var(--accent), 0 0 calc(var(--u) * 0.5) var(--accent-glow); }
.dom-ttile.is-new-spinner { animation: dom-spin-in 700ms cubic-bezier(0.2, 1.4, 0.35, 1); }
@keyframes dom-spin-in { 0% { transform: rotate(-25deg) scale(1.25); } 100% { transform: none; } }
.dom-end {
  position: absolute;
  width: var(--u);
  height: var(--u);
  padding: 0;
  border: 2px dashed transparent;
  border-radius: 50%;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
}
/* A bigger place to tap than the ring it draws. */
.dom-end::before { content: ''; position: absolute; inset: -0.6rem; border-radius: 50%; }
.dom-end.is-live {
  opacity: 1;
  pointer-events: auto;
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 28%, transparent);
  animation: dom-glow 1.1s ease-in-out infinite;
}
@keyframes dom-glow { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); } 50% { box-shadow: 0 0 0 0.35rem transparent; transform: scale(1.12); } }
.dom-end__pts {
  position: absolute;
  inset-block-start: -1.1rem;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  padding: 0 0.35em;
  border-radius: var(--r-full);
  background: var(--success-btn);
  color: var(--success-on);
  font-size: 0.75rem;
  font-weight: 900;
  white-space: nowrap;
}
.dom-latest { margin: 0; min-height: 1.3em; color: var(--text-2); font-size: var(--fs-xs); font-weight: var(--fw-bold); line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
.dom-bone { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-2); font-size: var(--fs-xs); font-weight: var(--fw-bold); }
.dom-bone__stack { position: relative; display: inline-grid; }
.dom-bone__stack .dt { --u: 0.55rem; grid-area: 1 / 1; }
.dom-bone__stack .dt + .dt { transform: translate(2px, -3px); }
.dom-bone__n { color: var(--text-strong); font-size: var(--fs-sm); }
.dom-sum {
  display: inline-flex;
  align-items: baseline;
  gap: 0.35em;
  margin-inline-start: auto;
  padding: 0.15em 0.7em;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  color: var(--text-2);
  font-size: var(--fs-xs);
  font-weight: var(--fw-bold);
  white-space: nowrap;
}
.dom-sum b { color: var(--text-strong); font-size: var(--fs-sm); }
.dom-sum.is-scoring { background: var(--success-btn); color: var(--success-on); }
.dom-sum.is-scoring b { color: inherit; }

/* --- The others round the table: one short row each --- */
.dom-seats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.3rem; }
.dom-seat {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.3rem;
  min-width: 0;
  padding: 0.3rem 0.45rem;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), opacity var(--dur-2) var(--ease-out);
}
.dom-seat.is-turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), 0 6px 16px -10px var(--accent-glow); }
.dom-seat.is-away { opacity: 0.55; }
.dom-seat--team0 { border-inline-start: 3px solid var(--team-blue); }
.dom-seat--team1 { border-inline-start: 3px solid var(--team-red); }
.dom-seat__who { flex: 1; display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
.dom-avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.4rem;
  height: 1.4rem;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 0.8rem;
  font-weight: 900;
  line-height: 1;
}
.dom-seat.is-turn .dom-avatar { background: var(--accent); color: var(--accent-on); }
.dom-seat__name { flex: 1; min-width: 0; overflow: hidden; color: var(--text-strong); font-size: var(--fs-sm); font-weight: var(--fw-bold); text-overflow: ellipsis; white-space: nowrap; }
.dom-seat__score { flex: none; padding: 0 0.45em; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-ink); font-size: var(--fs-xs); font-weight: 900; }
.dom-seat__tiles { flex: none; display: flex; align-items: center; gap: 0.25rem; direction: ltr; }
.dom-seat__tiles .dt { --u: 0.55rem; }
.dom-seat__tiles .dt + .dt { margin-inline-start: -0.4rem; }
.dom-seat__more { color: var(--text-3); font-size: 0.7rem; font-weight: var(--fw-bold); }
.dom-seat__count { min-width: 1.2rem; padding: 0 0.3em; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-strong); font-size: var(--fs-xs); font-weight: 900; text-align: center; }
/* Three across an upright phone: the name and the count, the backs left out. */
.dom-seats--3 .dom-seat__tiles .dt, .dom-seats--3 .dom-seat__more { display: none; }
.dom-seats--3 .dom-seat { gap: 0.2rem; padding-inline: 0.3rem; }
.dom-seats--3 .dom-seat__name { font-size: var(--fs-xs); }
.dom-seats--3 .dom-avatar { width: 1.2rem; height: 1.2rem; font-size: 0.65rem; }

/* --- Your hand --- */
.dom-mine {
  padding: 0.4rem var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background: var(--surface);
  transition: border-color var(--dur-2) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.dom-mine.is-turn { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dom-mine--team0 { border-inline-start: 3px solid var(--team-blue); }
.dom-mine--team1 { border-inline-start: 3px solid var(--team-red); }
.dom-mine__head { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-strong); font-size: var(--fs-sm); font-weight: var(--fw-bold); line-height: 1.3; }
.dom-mine__name { flex: 1; min-width: 0; }
.dom-mine__count { color: var(--text-2); font-size: var(--fs-xs); font-weight: 900; }
.dom-hand { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 0.3rem; min-height: 4.25rem; padding-top: 0.45rem; direction: ltr; }
.dom-hand .dt { --u: 2.125rem; }
.dom-hand--many .dt { --u: 1.75rem; }
.dom-hand__none { align-self: center; color: var(--text-3); font-size: var(--fs-sm); }
.dom-htile {
  position: relative;
  padding: 3px;
  border: 0;
  border-radius: var(--r-md);
  background: transparent;
  cursor: pointer;
  transition: transform var(--dur-2) var(--ease-out), opacity var(--dur-2) var(--ease-out), filter var(--dur-2) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.dom-htile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dom-htile.is-fit { transform: translateY(-0.4rem); }
.dom-htile.is-fit .dt { box-shadow: inset 0 -2px 0 rgba(120, 90, 40, 0.18), 0 calc(var(--u) * 0.1) 0 var(--dom-edge), 0 0 0 2px var(--accent), 0 0.6rem 1rem -0.5rem var(--accent-glow); }
.dom-htile.is-dim { opacity: 0.45; filter: saturate(0.6); }
.dom-htile.is-picked { transform: translateY(-0.65rem); }
.dom-htile.is-picked .dt { box-shadow: inset 0 -2px 0 rgba(120, 90, 40, 0.18), 0 calc(var(--u) * 0.1) 0 var(--dom-edge), 0 0 0 3px var(--accent), 0 0.8rem 1.2rem -0.5rem var(--accent-glow); }
.dom-htile__pts {
  position: absolute;
  inset-block-start: -0.55rem;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  padding: 0 0.35em;
  border-radius: var(--r-full);
  background: var(--success-btn);
  color: var(--success-on);
  font-size: 0.7rem;
  font-weight: 900;
  line-height: 1.4;
  white-space: nowrap;
}

/* --- What to do now: the bar under your hand on your move (the page keeps it in sight: domHandInView) --- */
.dom-bar {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: 0.4rem var(--sp-3);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-xl);
  background: var(--surface-solid);
  box-shadow: var(--sh-4);
}
.dom-bar--note { padding-block: var(--sp-1); border-color: var(--border); background: var(--surface-2); box-shadow: none; }
.dom-bar--inline { flex-direction: row; align-items: center; }
.dom-bar--inline .dom-prompt { flex: 1; min-width: 0; text-align: start; }
.dom-bar--inline .btn { flex: none; }
.dom-prompt { margin: 0; color: var(--text-strong); font-size: var(--fs-body); font-weight: 900; line-height: 1.35; text-align: center; }
.dom-prompt.is-mine { color: var(--accent-ink); }
.dom-bar--note .dom-prompt { color: var(--text-2); font-size: var(--fs-sm); }
/* A move the server makes for you in a moment: said, not a button. */
.dom-bar--inline .dom-prompt--auto { flex: 1.3; color: var(--text-2); font-size: var(--fs-sm); font-weight: 700; }
.dom-bar__row, .dom-bar__ends { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: var(--sp-2); }
.dom-bar__row .btn, .dom-bar__ends .btn { padding-inline: var(--sp-2); }
.dom-bar__v { opacity: 0.8; }
.dom-bar__pts { padding: 0 0.35em; border-radius: var(--r-full); background: var(--success-btn); color: var(--success-on); font-size: 0.8em; }
.dom-bar > .btn--sm { align-self: center; width: auto; }

/* --- The lobby: the seats of a game of teams --- */
.dom-seating__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.dom-seating__head .field__label { margin: 0; }
.dom-seating__chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); margin-block: var(--sp-2); }
.dom-seatchip {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  min-width: 0;
  min-height: var(--tap);
  padding: 0 var(--sp-3);
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--text-strong);
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  text-align: start;
  white-space: nowrap;
  text-overflow: ellipsis;
}
button.dom-seatchip { cursor: pointer; transition: transform var(--dur-2) var(--ease-out), border-color var(--dur-2) var(--ease-out); }
.dom-seatchip--team0 { border-inline-start: 3px solid var(--team-blue); }
.dom-seatchip--team1 { border-inline-start: 3px solid var(--team-red); }
.dom-seatchip.is-picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); transform: translateY(-2px); }
.dom-seatchip__n { color: var(--text-3); font-size: var(--fs-xs); }

/* --- Flights, signs, landings --- */
.dom-ghost { position: fixed; z-index: var(--z-fx-ghost); pointer-events: none; transform-origin: center; will-change: transform; }
.dom-ghost > .dt { box-shadow: inset 0 -2px 0 rgba(120, 90, 40, 0.18), 0 calc(var(--u, 1.5rem) * 0.1) 0 var(--dom-edge), 0 0.6rem 1.2rem -0.4rem var(--dom-shade); }
.dom-hold { visibility: hidden; }
.dom-pop {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-pop);
  padding: 0.1em 0.55em;
  border-radius: var(--r-full);
  background: var(--surface-solid);
  box-shadow: var(--sh-3);
  color: var(--text-strong);
  font-size: 1rem;
  font-weight: 900;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
}
.dom-pop--pts { background: var(--success-btn); color: var(--success-on); font-size: 1.35rem; }
.dom-pop--spinner { background: var(--accent); color: var(--accent-on); }
.dom-pop--knock { background: var(--warning-btn); color: var(--warning-on); }
.dom-pop--big { background: transparent; box-shadow: none; font-size: 2rem; }
.dom-ring { position: fixed; z-index: var(--z-fx-ghost); border: 3px solid var(--accent); border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.dom-band {
  position: fixed;
  left: 0;
  top: 0;
  z-index: var(--z-fx-pop);
  padding: 0.45rem 1.3rem;
  border-radius: var(--r-full);
  box-shadow: var(--sh-4);
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 900;
  white-space: nowrap;
  pointer-events: none;
}
.dom-band--accent { background: var(--accent); color: var(--accent-on); }
.dom-band--success { background: var(--success-btn); color: var(--success-on); }
.dom-band--danger { background: var(--danger-btn); color: var(--danger-on); }
.dom-pop.is-tv { font-size: 3.2vmin; }
.dom-pop--pts.is-tv { font-size: 5vmin; }
.dom-pop--big.is-tv { font-size: 7vmin; }
.dom-band.is-tv { padding: 1.2vmin 3.5vmin; font-size: var(--tv-lg, 3rem); }
.dom-ring.is-tv { border-width: 0.6vmin; }

/* --- The end of a round: the hands turn over, the pips count, who took what --- */
.dom--result { display: flex; flex-direction: column; gap: var(--sp-3); }
.dom-reveal { display: flex; flex-direction: column; gap: var(--sp-2); }
.dom-reveal__title { margin: 0; color: var(--text-strong); font-family: var(--font-display); font-size: var(--fs-h3); font-weight: 900; text-align: center; }
.dom-reveal__rows { display: flex; flex-direction: column; gap: var(--sp-1); }
.dom-rrow {
  display: grid;
  grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.dom-rrow.is-won { border-color: var(--success); background: color-mix(in srgb, var(--success) 8%, var(--surface)); }
.dom-rrow__who { min-width: 0; overflow: hidden; color: var(--text-strong); font-size: var(--fs-sm); font-weight: var(--fw-bold); text-overflow: ellipsis; white-space: nowrap; }
.dom-rrow__tiles { display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; direction: ltr; }
.dom-rrow__none { color: var(--text-3); font-size: var(--fs-xs); }
.dom-rtile { position: relative; display: inline-grid; }
.dom-rtile .dt { --u: 0.85rem; }
.dom-rtile__back { position: absolute; inset: 0; }
.dom-rrow.is-down .dom-rtile__face { visibility: hidden; }
.dom-rrow.is-shown .dom-rtile__back { display: none; }
.dom-rrow.is-turning .dom-rtile { animation: dom-turn 380ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
@keyframes dom-turn { 0% { transform: scaleX(0.05); } 100% { transform: none; } }
.dom-rrow__pips { color: var(--text-2); font-size: var(--fs-xs); text-align: end; white-space: nowrap; }
.dom-rrow__pips b { color: var(--text-strong); font-size: var(--fs-h3); }
.dom-reveal__line {
  margin: 0;
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-weight: var(--fw-bold);
  text-align: center;
  overflow-wrap: anywhere;
}
.dom-reveal__line:empty { display: none; }
.dom-reveal__line.is-down { opacity: 0; transform: translateY(0.4rem); }
.dom-reveal__line.is-shown { opacity: 1; transform: none; transition: opacity 400ms var(--ease-out), transform 400ms var(--ease-out); }
.dom-totals .status-row.is-me { border-color: var(--accent-border); }
.dom-totals__gain { font-variant-numeric: tabular-nums; }
.dom-over { text-align: center; }
.dom-sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); margin-top: var(--sp-3); }
.dom-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  padding: var(--sp-3) var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  animation: dom-side-in 600ms cubic-bezier(0.2, 1.2, 0.3, 1) both;
}
.dom-side--0 { border-top: 4px solid var(--team-blue); }
.dom-side--1 { border-top: 4px solid var(--team-red); animation-delay: 150ms; }
.dom-side.is-won { box-shadow: 0 0 0 3px var(--success), var(--sh-3); animation-delay: 350ms; }
.dom-side__crown { min-height: 1.5rem; font-size: 1.5rem; line-height: 1; }
.dom-side__names { color: var(--text-strong); font-size: var(--fs-sm); font-weight: var(--fw-bold); overflow-wrap: anywhere; }
.dom-side__score { color: var(--accent-ink); font-size: var(--fs-h2); }
@keyframes dom-side-in { 0% { opacity: 0; transform: translateY(1rem) scale(0.9); } 100% { opacity: 1; transform: none; } }

/* --- A phone on its side: the table beside everything else --- */
@media (orientation: landscape) and (max-height: 500px) {
  .shell__main > #view-room-domino { max-width: none; }
  .dom-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "table top" "table play";
    align-items: start;
    column-gap: var(--sp-3);
    row-gap: 0.35rem;
  }
  .dom-top { grid-area: top; gap: 0.25rem; }
  .dom-layout__table { grid-area: table; }
  .dom-play { grid-area: play; gap: 0.35rem; }
  .dom-table { height: max(10rem, calc(var(--app-h, 100dvh) - 7.5rem)); }
  /* The others beside the table, one short line each: a name and how many they
     hold, two to a row so three seats don't push what to do off the screen. */
  .dom-seats { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: 0.2rem; }
  .dom-seat { padding: 0.15rem 0.35rem; }
  .dom-strip { gap: 0.2rem; }
  .dom-strip .badge, .dom-strip .dom-chip { padding: 0.05em 0.5em; font-size: 0.7rem; }
  .dom-avatar { width: 1.2rem; height: 1.2rem; font-size: 0.65rem; }
  .dom-seat__name { font-size: var(--fs-xs); }
  .dom-seat__tiles .dt, .dom-seat__more { display: none; }
  .dom-hand { min-height: 3.6rem; padding-top: 0.35rem; }
  /* Six to a row in the column beside the table. */
  .dom-hand .dt { --u: 1.45rem; }
  .dom-hand--many .dt { --u: 1.25rem; }
  .dom-mine { padding: 0.35rem var(--sp-2); }
  /* What to do stays in reach at the foot of the screen, over a hand of two rows. */
  .dom-bar { position: sticky; bottom: 0; z-index: 2; padding: 0.35rem var(--sp-2); }
  .dom-felt--small .dom-table { height: max(8rem, calc(var(--app-h, 100dvh) - 14rem)); }
}

/* --- Laptops and big screens showing the phone view: the table across the
   whole width and most of the height, the strip of names above it, your hand
   and what to do in one row under it --- */
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-room-domino { max-width: none; }
  .dom-top { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.4rem 0.75rem; }
  .dom-seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; }
  .dom-seat { flex: none; min-width: 9rem; }
  .dom-seats--3 .dom-seat__tiles .dt, .dom-seats--3 .dom-seat__more { display: inline-grid; }
  .dom-seats--3 .dom-seat__more { display: inline; }
  .dom-seat__tiles .dt { --u: 0.7rem; }
  .dom-table { height: max(16rem, calc(var(--app-h, 100dvh) - 19rem)); }
  .dom-play { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, auto); align-items: stretch; gap: var(--sp-3); }
  .dom-play .dom-host { grid-column: 1 / -1; }
  .dom-play .dom-bar { justify-content: center; }
  .dom-hand .dt { --u: 2.25rem; }
  .dom-hand--many .dt { --u: 1.9rem; }
  .dom--result { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
  .dom--result > .dom-head, .dom--result > .dom-over, .dom--result > [data-room-strip] { grid-column: 1 / -1; }
  .dom-rtile .dt { --u: 1rem; }
}

/* --- The TV: the table takes the screen; who sits where is one strip above it --- */
.dom-tv { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--tv-gap) * 0.7); }
.dom-tv__top { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1vmin 1.6vmin; }
.dom-tv__seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 1vmin; }
.dom-tv .dom-head { gap: 0.8vmin; }
.dom-tv .badge { height: auto; padding: 0.25em 0.7em; font-size: var(--tv-xs); }
.dom-tv .dom-felt { flex: 1 1 auto; min-height: 0; padding: 1.2vmin; border-radius: var(--tv-r); }
.dom-tv .dom-felt__top { min-height: 0; }
.dom-tv .dom-table { flex: 1 1 auto; height: auto; min-height: 0; }
.dom-tv .dom-latest, .dom-tvres .dom-latest { font-size: var(--tv-sm); }
.dom-tv .dom-sum, .dom-tv .dom-bone, .dom-tvres .dom-sum, .dom-tvres .dom-bone { font-size: var(--tv-xs); }
.dom-tv .dom-sum b, .dom-tv .dom-bone__n, .dom-tvres .dom-sum b, .dom-tvres .dom-bone__n { font-size: var(--tv-sm); }
.dom-tv .dom-bone__stack .dt, .dom-tvres .dom-bone__stack .dt { --u: 1.2vmin; }
.dom-tv__turn { padding: 0.2em 0.8em; border-radius: var(--r-full); background: var(--accent); color: var(--accent-on); font-size: var(--tv-sm); font-weight: 900; line-height: 1.3; white-space: nowrap; }
.dom-tv__host { display: inline-flex; gap: 1vmin; }
.dom-tv__host:empty { display: none; }
.dom-tv .dom-seat { flex: none; min-width: 15vmin; gap: 0.8vmin; padding: 0.6vmin 1.2vmin; border-radius: var(--tv-r); }
.dom-tv .dom-seat__name { font-size: var(--tv-sm); }
.dom-tv .dom-seat__count { font-size: var(--tv-xs); }
.dom-tv .dom-avatar { width: 3.6vmin; height: 3.6vmin; font-size: 1.8vmin; }
.dom-tv .dom-seat__tiles .dt { --u: 1.5vmin; }
.dom-tv .dom-seat__tiles .dt + .dt { margin-inline-start: -0.9vmin; }
.dom-tvres { height: 100%; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: calc(var(--tv-gap) * 1.5); }
.dom-tvres__table { min-height: 0; display: flex; }
.dom-tvres__table .dom-felt { flex: 1; min-height: 0; border-radius: var(--tv-r); }
.dom-tvres__table .dom-table { flex: 1 1 auto; height: auto; min-height: 0; }
.dom-tvres__side { min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: var(--tv-gap); overflow: hidden; }
.dom-tvres .dom-reveal__title { font-size: var(--tv-md); }
.dom-tvres .dom-rrow { padding: 0.8vmin 1.2vmin; border-radius: var(--tv-r); grid-template-columns: minmax(0, 14vmin) minmax(0, 1fr) auto; }
.dom-tvres .dom-rrow__who { font-size: var(--tv-sm); }
.dom-tvres .dom-rrow__pips { font-size: var(--tv-xs); }
.dom-tvres .dom-rrow__pips b { font-size: var(--tv-md); }
.dom-tvres .dom-rtile .dt { --u: 2.4vmin; }
.dom-tvres .dom-reveal__line { padding: 0.8vmin 1.4vmin; font-size: var(--tv-sm); border-radius: var(--tv-r); }
.dom-over--tv { padding: 1.2vmin 2vmin; border-radius: var(--tv-r); }
.dom-over--tv .card__title { font-size: var(--tv-md); }
.dom-tvres .dom-totals .section__head { margin-bottom: 0.6vmin; }
.dom-tvres .dom-totals .section__title { font-size: var(--tv-sm); }
.dom-tvres .dom-totals .status-row { min-height: 0; margin-bottom: 0.6vmin; padding: 0.7vmin 1.4vmin; border-radius: var(--tv-r); }
.dom-tvres .dom-totals .status-row__name { font-size: var(--tv-sm); }
.dom-tvres .dom-totals .badge { height: auto; padding: 0.2em 0.7em; font-size: var(--tv-sm); }
.dom-tvres .dom-sides { gap: 1.2vmin; margin-top: 1vmin; }
.dom-tvres .dom-side { padding: 1.2vmin; border-radius: var(--tv-r); }
.dom-tvres .dom-side__names { font-size: var(--tv-sm); }
.dom-tvres .dom-side__score { font-size: var(--tv-lg); }
/* A phone mirrored upright: one column, and the stage scrolls. */
@media (orientation: portrait) {
  .dom-tv { height: auto; }
  .dom-tv .dom-table { height: 60vw; flex: none; }
  .dom-tvres { height: auto; grid-template-columns: minmax(0, 1fr); }
  .dom-tvres__table .dom-table { height: 50vw; flex: none; }
}

@media (prefers-reduced-motion: reduce) {
  .dom-end.is-live, .dom-ttile.is-new-spinner, .dom-rrow.is-turning .dom-rtile, .dom-side { animation: none; }
  .dom-reveal__line.is-shown, .dom-htile, .dom-seat, .dom-mine, button.dom-seatchip { transition: none; }
}

/* ==========================================================================
   22. لودو
   The owner's option أ "كلاسيك" (21 Sep 2026): the classic cross on white,
   the four yards in full red, green, yellow and blue - أونو's four - a star
   on the safe squares and an arrow on each start, glossy pieces with a white
   rim, and the app's white 3D die. The board is the same in both themes, like
   a real one; the page around it follows the theme. Everything on the board
   is placed in percent of its width (JS_Ludo.html), so one markup fits a
   phone, a laptop and a TV.
   ========================================================================== */
.ludo-av--R { background: #e5383b; } .ludo-av--G { background: #1f9d55; }
.ludo-av--Y { background: #f5b400; } .ludo-av--B { background: #1e6fd9; }

/* --- the board ------------------------------------------------------------ */
.ludo-board { position: relative; width: 100%; aspect-ratio: 1; margin-inline: auto; }
.ludo-rot {
  position: absolute;
  inset: 0;
  border-radius: 2.2%;
  background: #2b2733;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 8px 22px rgba(20, 15, 30, 0.16);
}
.ludo-cell {
  position: absolute;
  width: calc(100% / 15 - 1px);
  height: calc(100% / 15 - 1px);
  margin: 0.5px;
  display: grid;
  place-items: center;
  background: #ffffff;
}
.ludo-cell--R { background: #e5383b; } .ludo-cell--G { background: #1f9d55; }
.ludo-cell--Y { background: #f5b400; } .ludo-cell--B { background: #1e6fd9; }
.ludo-star { width: 64%; height: 64%; fill: #77737f; }
.ludo-arrow { width: 62%; height: 62%; fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ludo-yard { position: absolute; width: 40%; height: 40%; }
.ludo-yard--G { background: #1f9d55; border-top-left-radius: 5.5%; }
.ludo-yard--Y { background: #f5b400; border-top-right-radius: 5.5%; }
.ludo-yard--B { background: #1e6fd9; border-bottom-right-radius: 5.5%; }
.ludo-yard--R { background: #e5383b; border-bottom-left-radius: 5.5%; }
.ludo-yard__in { position: absolute; inset: 16.667%; background: #ffffff; border-radius: 14%; }
.ludo-spot { position: absolute; width: 8.4%; aspect-ratio: 1; margin: -4.2% 0 0 -4.2%; border-radius: 50%; }
.ludo-spot--R { background: #fbd3d4; } .ludo-spot--G { background: #cdebd9; }
.ludo-spot--Y { background: #fdecb8; } .ludo-spot--B { background: #cfe0f8; }
.ludo-mid { position: absolute; left: 40%; top: 40%; width: 20%; height: 20%; }
.ludo-fx { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

/* A piece: placed by left/top (its centre, by negative margins), so its
   transform is free for the motion. */
.ludo-pc {
  position: absolute;
  z-index: 2;
  width: 5.4%;
  aspect-ratio: 1;
  margin: -2.7% 0 0 -2.7%;
  padding: 0;
  border: 0;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #ffffff, 0 2px 3px rgba(0, 0, 0, 0.38);
  cursor: default;
  -webkit-tap-highlight-color: transparent;
}
.ludo-pc--R { background: radial-gradient(circle at 35% 30%, #ff8a8b, #e5383b 55%, #a82427); }
.ludo-pc--G { background: radial-gradient(circle at 35% 30%, #5fd08f, #1f9d55 55%, #136b39); }
.ludo-pc--Y { background: radial-gradient(circle at 35% 30%, #ffe27a, #f5b400 55%, #b98600); }
.ludo-pc--B { background: radial-gradient(circle at 35% 30%, #6ea7f5, #1e6fd9 55%, #154c98); }
.ludo-pc.is-stacked { width: 4.4%; margin: -2.2% 0 0 -2.2%; }
.ludo-pc.is-home { width: 4.2%; margin: -2.1% 0 0 -2.1%; }
/* The pieces this phone may move: on top, a turning dashed ring, and a bigger place to tap. */
.ludo-pc.is-movable { z-index: 4; cursor: pointer; }
.ludo-pc.is-movable::before { content: ""; position: absolute; inset: -70%; border-radius: 50%; }
.ludo-pc.is-movable::after {
  content: "";
  position: absolute;
  inset: -38%;
  border-radius: 50%;
  border: 2px dashed #1d1b26;
  animation: ludoRing 2.4s linear infinite;
}
.ludo-pc.is-movable:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.ludo-pc.is-sent { transform: scale(1.18); transition: transform 0.12s ease-out; }
.ludo-board.is-choosing .ludo-pc:not(.is-movable) { filter: saturate(0.85); }
@keyframes ludoRing { to { transform: rotate(360deg); } }

/* The squares a piece would pass, and where it would land (a mouse or a keyboard). */
.ludo-path { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
.ludo-path--dot { width: 1.9%; aspect-ratio: 1; background: var(--pc); opacity: 0.7; box-shadow: 0 0 0 1.5px #ffffff; }
.ludo-path--end { width: 5.8%; aspect-ratio: 1; border: 2.5px solid var(--pc); background: rgba(255, 255, 255, 0.35); }
.ludo-path--end.is-capture { border-color: #e5383b; }
.ludo-path--end b {
  position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
  padding: 2px 6px; border-radius: 8px; background: #e5383b; color: #ffffff;
  font-size: 10px; font-weight: 800; line-height: 1.2; white-space: nowrap;
}

/* A piece taken, a piece home: a ring bursting out in its colour. */
.ludo-burst {
  position: absolute;
  width: 6.6%;
  aspect-ratio: 1;
  margin: -3.3% 0 0 -3.3%;
  border-radius: 50%;
  border: 3px solid var(--pc);
  animation: ludoBurst 0.8s var(--ease-out, ease-out) forwards;
}
.ludo-burst--big { border-width: 4px; animation-duration: 0.9s; }
@keyframes ludoBurst { from { transform: scale(0.4); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }

/* The roll-off before the first turn. */
.ludo-off { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; animation: ludoFadeIn 0.25s ease-out both; }
.ludo-off.is-leaving { animation: ludoFadeOut 0.35s ease-in forwards; }
.ludo-off__card {
  min-width: 58%;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg, 20px);
  background: var(--surface-solid);
  color: var(--text);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  direction: inherit;
}
.ludo-board[dir] .ludo-off__card { direction: rtl; }
html[lang="en"] .ludo-board[dir] .ludo-off__card { direction: ltr; }
.ludo-off__title { margin: 0 0 var(--sp-2); text-align: center; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.05rem; }
.ludo-off__again { margin: var(--sp-2) 0 var(--sp-1); text-align: center; font-size: 0.8rem; font-weight: 700; color: var(--text-2); }
.ludo-off__row { display: flex; align-items: center; gap: var(--sp-2); padding: 3px 0; animation: ludoRowIn 0.3s ease-out both; animation-delay: var(--at); }
.ludo-off__round { animation: ludoFadeIn 0.2s ease-out both; animation-delay: var(--at); }
.ludo-off__dot { width: 0.9rem; height: 0.9rem; border-radius: 50%; flex: none; }
.ludo-off__name { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 700; }
.ludo-off__n { font-size: 1.2rem; font-weight: 800; animation: ludoNumIn 0.5s var(--ease-out, ease-out) both; animation-delay: calc(var(--at) + 0.35s); }
.ludo-off__first { margin: var(--sp-2) 0 0; text-align: center; font-weight: 800; color: var(--accent-ink); animation: ludoFadeIn 0.3s ease-out both; animation-delay: var(--at); }
@keyframes ludoFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes ludoFadeOut { to { opacity: 0; } }
@keyframes ludoRowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes ludoNumIn { 0% { opacity: 0; transform: scale(0.4) rotate(-40deg); } 70% { opacity: 1; transform: scale(1.25); } 100% { transform: scale(1); } }

/* --- the frame: players, board, bar, log ------------------------------------- */
.ludo-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.ludo-layout__side { display: contents; }
.ludo-layout__board { width: 100%; max-width: 34rem; margin-inline: auto; }
.ludo-layout__side > .ludo-over { order: -3; }
.ludo-layout__side > .ludo-strip { order: -2; }

.ludo-strip { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: var(--sp-2); }
.ludo-strip--n2 { --n: 2; } .ludo-strip--n3 { --n: 3; } .ludo-strip--n4 { --n: 4; }
.ludo-chip {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 6px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: box-shadow var(--dur-2, 200ms) ease, opacity var(--dur-2, 200ms) ease;
}
.ludo-chip.is-turn { border-color: transparent; box-shadow: 0 0 0 2px var(--pc), 0 4px 12px rgba(0, 0, 0, 0.08); }
.ludo-chip.is-away { opacity: 0.55; }
.ludo-chip__av {
  width: 1.5rem; height: 1.5rem; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  color: #ffffff; font-weight: 800; font-size: 0.75rem; line-height: 1;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
}
.ludo-chip__av.ludo-av--Y { color: #1d1b26; }
.ludo-chip.is-done .ludo-chip__av { background: var(--surface-2); font-size: 1rem; }
.ludo-chip__who { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ludo-chip__name { font-size: 0.78rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ludo-chip__name small { font-weight: 600; color: var(--text-2); }
.ludo-chip__dots { display: flex; gap: 3px; }
.ludo-chip__dot { width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--text-3); opacity: 0.6; }
.ludo-chip__dot.is-home { background: var(--pc); box-shadow: none; opacity: 1; }

.ludo-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: 20px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  box-shadow: 0 -2px 14px rgba(40, 30, 20, 0.06);
}
.ludo-bar.is-mine { box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgba(40, 30, 20, 0.1); border-color: transparent; }
.ludo-bar__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ludo-bar__t1 { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.15rem; line-height: 1.2; }
.ludo-bar__dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; flex: none; }
.ludo-bar__t2 { font-size: 0.82rem; font-weight: 500; color: var(--text-2); }
.ludo-bar__clock { flex: none; }
.ludo-bar__roll { flex: none; min-width: 6rem; }

.ludo-die {
  --die-ring: var(--pc, transparent);
  flex: none;
  width: 3.4rem; height: 3.4rem;
  display: grid; place-items: center;
  padding: 0; border: 0; background: none;
  perspective: 500px;
  border-radius: 14px;
}
.ludo-die .die { --die: 2.6rem; transition: transform 0.72s cubic-bezier(0.18, 0.72, 0.24, 1); }
.ludo-die .die__face { border-radius: 0.5rem; box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.12), inset 0 -0.3rem 0.6rem rgba(15, 23, 42, 0.07), 0 0 0 2px var(--die-ring); }
.ludo-die.is-rollable { cursor: pointer; animation: ludoNudge 1.6s ease-in-out infinite; }
.ludo-die.is-rolling .die { animation: ludoTumble 0.5s linear infinite; }
@keyframes ludoNudge { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } }
@keyframes ludoTumble { from { transform: rotateX(0deg) rotateY(0deg); } to { transform: rotateX(360deg) rotateY(720deg); } }

.ludo-log { display: flex; flex-direction: column; gap: 4px; min-height: 1.2rem; }
.ludo-log__line { font-size: 0.8rem; font-weight: 500; color: var(--text-2); line-height: 1.4; }
.ludo-log__line.is-latest { color: var(--text); font-weight: 600; }

.ludo-over { display: flex; flex-direction: column; gap: var(--sp-3); }
.ludo-over__title { margin: 0; text-align: center; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.2rem; }
.ludo-over .podium { margin: 0; }
.ludo-podium__color { width: 0.75rem; height: 0.75rem; border-radius: 50%; }

/* --- the setup screen and the room's lobby --------------------------------------- */
.ludo-swatches { display: flex; gap: var(--sp-3); }
.ludo-swatch {
  width: 3rem; height: 3rem;
  border-radius: 50%;
  border: 0;
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.4), 0 2px 5px rgba(0, 0, 0, 0.15);
  cursor: pointer;
  transition: transform var(--dur-2, 200ms) var(--ease-out, ease-out), box-shadow var(--dur-2, 200ms) ease;
}
.ludo-swatch.is-active { transform: scale(1.08); box-shadow: 0 0 0 3px var(--surface-solid), 0 0 0 6px var(--text); }
.ludo-picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.ludo-pick {
  min-width: 0;
  min-height: 3.25rem;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: "piece name" "piece who";
  align-items: center;
  column-gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: 14px;
  border: 0;
  color: #ffffff;
  text-align: start;
  cursor: pointer;
}
.ludo-pick.ludo-av--Y { color: #1d1b26; }
.ludo-pick:disabled { cursor: default; }
.ludo-pick.is-taken:not(.is-mine) { opacity: 0.55; }
.ludo-pick.is-mine { box-shadow: 0 0 0 3px var(--surface-solid), 0 0 0 5.5px var(--text); }
.ludo-pick__piece { grid-area: piece; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: rgba(255, 255, 255, 0.9); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
.ludo-pick__name { grid-area: name; font-weight: 800; font-size: 0.9rem; line-height: 1.2; }
.ludo-pick__who { grid-area: who; font-size: 0.78rem; font-weight: 600; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --- a phone on its side, and every wide screen: the board takes the height --- */
@media (orientation: landscape) and (max-height: 500px), (min-width: 900px) and (min-height: 501px) {
  .ludo-layout { display: grid; grid-template-columns: auto minmax(13rem, 21rem); justify-content: center; align-items: start; gap: var(--sp-4); }
  .ludo-layout__side { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  .ludo-layout__board {
    position: sticky;
    top: 0;
    width: min(calc(var(--app-h, 100vh) - var(--header-h) - var(--safe-top) - var(--safe-bottom) - 2.5rem), 58vw);
    max-width: none;
    margin: 0;
  }
  .ludo-strip { grid-template-columns: minmax(0, 1fr); }
  .ludo-bar { position: static; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .ludo-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ludo-chip { padding-block: 4px; }
  .ludo-strip { gap: 6px; }
  .ludo-bar { padding: var(--sp-2); }
}
@media (min-width: 900px) and (min-height: 501px) {
  .shell__main > #view-play-ludo, .shell__main > #view-room-ludo { max-width: 72rem; }
  .ludo-layout { gap: var(--sp-6); grid-template-columns: auto minmax(15rem, 23rem); }
  .ludo-layout__board { width: min(calc(var(--app-h, 100vh) - var(--header-h) - 2.5rem), 62vw); }
  .ludo-chip__name { font-size: 0.9rem; }
}

/* --- the TV: the board as tall as the stage, the players and the die beside it --- */
.ludo--tv { height: 100%; min-height: 0; display: flex; }
.ludo--tv .ludo-layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 30rem);
  justify-content: center;
  align-items: center;
  gap: calc(var(--tv-gap) * 2.5);
}
.ludo--tv .ludo-layout__side { display: flex; flex-direction: column; justify-content: center; gap: var(--tv-gap); min-width: 0; }
.ludo--tv .ludo-layout__board { position: static; width: min(calc(var(--app-h, 100vh) - 17vmin), 60vw); max-width: none; margin: 0; }
.ludo--tv .ludo-strip { grid-template-columns: minmax(0, 1fr); gap: var(--tv-gap); }
.ludo--tv .ludo-chip { padding: 1vmin 1.4vmin; border-radius: var(--tv-r); gap: 1.2vmin; }
.ludo--tv .ludo-chip__av { width: 4.6vmin; height: 4.6vmin; font-size: var(--tv-sm); }
.ludo--tv .ludo-chip__name { font-size: var(--tv-md); }
.ludo--tv .ludo-chip__dot { width: 1.2vmin; height: 1.2vmin; }
.ludo--tv .ludo-chip__dots { gap: 0.6vmin; }
.ludo--tv .ludo-bar { position: static; padding: 1.4vmin 1.8vmin; border-radius: var(--tv-r); gap: 1.8vmin; }
.ludo--tv .ludo-bar__t1 { font-size: var(--tv-md); }
.ludo--tv .ludo-bar__t2 { font-size: var(--tv-sm); }
.ludo--tv .ludo-die { width: 9vmin; height: 9vmin; }
.ludo--tv .ludo-die .die { --die: 7vmin; }
.ludo--tv .ludo-log__line { font-size: var(--tv-sm); }
.ludo--tv .ludo-over__title { font-size: var(--tv-md); }
.ludo--tv .ludo-pc { box-shadow: 0 0 0 3px #ffffff, 0 3px 5px rgba(0, 0, 0, 0.4); }
.ludo--tv .ludo-off__card { padding: 2vmin 3vmin; }
.ludo--tv .ludo-off__name, .ludo--tv .ludo-off__title { font-size: var(--tv-md); }
.ludo--tv .ludo-off__n { font-size: var(--tv-lg); }
/* A phone mirrored upright: one column, and the stage scrolls. */
@media (orientation: portrait) {
  .ludo--tv { height: auto; }
  .ludo--tv .ludo-layout { grid-template-columns: minmax(0, 1fr); }
  .ludo--tv .ludo-layout__board { width: min(100%, 62vh); justify-self: center; }
}

@media (prefers-reduced-motion: reduce) {
  .ludo-pc.is-movable::after, .ludo-die.is-rollable, .ludo-die.is-rolling .die, .ludo-burst,
  .ludo-off, .ludo-off__row, .ludo-off__round, .ludo-off__n, .ludo-off__first { animation: none; }
  .ludo-die .die, .ludo-chip, .ludo-swatch, .ludo-pc.is-sent { transition: none; }
}

/* ==========================================================================
   23. بنك الحظ
   The owner's option أ "كلاسيك" (21 Sep 2026): a warm paper board with a
   colour band on each place, line icons on the other squares, the corners
   labelled, and the middle holding the dice and the card in play. Every
   square is placed in percent of the board (JS_Bank.html) and sized off the
   board's own width (a container), so one markup is a map on a phone and a
   board with every name on a laptop or the TV.
   ========================================================================== */
.bank-board {
  --bank-cell: #fffdf8;
  --bank-line: #d8cfbd;
  --bank-ink: #5a5466;
  --bank-mid: #f6f0e3;
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  margin-inline: auto;
  container-type: inline-size;
  container-name: bankboard;
}
body.dark .bank-board { --bank-cell: #262234; --bank-line: #3a3548; --bank-ink: #d6d0e4; --bank-mid: #1d1a29; }
.bank-ring {
  position: absolute;
  inset: 0;
  border-radius: 1.8%;
  overflow: hidden;
  background: var(--bank-line);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 22px rgba(60, 40, 20, 0.12);
}
.bank-sq {
  position: absolute;
  padding: 0;
  margin: 0;
  border: 0;
  background: var(--bank-cell);
  box-shadow: inset 0 0 0 0.5px var(--bank-line);
  color: var(--bank-ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  overflow: hidden;
  cursor: pointer;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}
/* What a square shows, clear of its colour band (inset in % of the square itself). */
.bank-sq__in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.bank-sq--bottom .bank-sq__in { top: 22%; }
.bank-sq--top .bank-sq__in { bottom: 22%; }
.bank-sq--left .bank-sq__in { right: 22%; }
.bank-sq--right .bank-sq__in { left: 22%; }
.bank-band { position: absolute; display: flex; align-items: center; justify-content: center; gap: 8%; }
.bank-sq--bottom .bank-band { top: 0; left: 0; right: 0; height: 22%; }
.bank-sq--top .bank-band { bottom: 0; left: 0; right: 0; height: 22%; }
.bank-sq--left .bank-band { top: 0; bottom: 0; right: 0; width: 22%; flex-direction: column; }
.bank-sq--right .bank-band { top: 0; bottom: 0; left: 0; width: 22%; flex-direction: column; }
.bank-pip { width: 1.1cqw; height: 1.1cqw; min-width: 3px; min-height: 3px; border-radius: 1px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.35); }
.bank-pip--souq { width: 2.4cqw; min-width: 7px; background: #e5383b; box-shadow: 0 0 0 1px #ffffff; }
.bank-own { position: absolute; width: 1.9cqw; height: 1.9cqw; min-width: 6px; min-height: 6px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--bank-cell); }
.bank-sq--bottom .bank-own { bottom: 7%; left: 50%; transform: translateX(-50%); }
.bank-sq--top .bank-own { top: 7%; left: 50%; transform: translateX(-50%); }
.bank-sq--left .bank-own { left: 7%; top: 50%; transform: translateY(-50%); }
.bank-sq--right .bank-own { right: 7%; top: 50%; transform: translateY(-50%); }
.bank-sq.is-mort { background-image: repeating-linear-gradient(45deg, rgba(90, 84, 102, 0.14) 0 2px, transparent 2px 5px); }
.bank-sq.is-mort .bank-band { opacity: 0.45; }
.bank-sq.is-landed { box-shadow: inset 0 0 0 2px var(--accent); z-index: 1; }
.bank-sq.is-sel { box-shadow: inset 0 0 0 2.5px var(--text); z-index: 1; }
.bank-sq:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.bank-ic { width: min(60%, 4.2cqw); aspect-ratio: 1; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bank-ic--corner { width: 5cqw; }
.bank-ic--big { width: 2.2rem; }
.bank-sq--luck { color: #b07800; }
.bank-sq--court { color: #2a6f9e; }
.bank-corner { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 0.3cqw; padding: 5%; text-align: center; }
/* The label sits toward the board's edge; the pieces stand toward the middle. */
.bank-sq--go .bank-corner { right: 0; bottom: 0; }
.bank-sq--jail .bank-corner { left: 0; bottom: 0; }
.bank-sq--bus .bank-corner { left: 0; top: 0; }
.bank-sq--tojail .bank-corner { right: 0; top: 0; }
.bank-corner__t { font-size: clamp(7.5px, 2.2cqw, 17px); font-weight: 800; line-height: 1.05; direction: rtl; }
html[lang="en"] .bank-corner__t { direction: ltr; }
.bank-corner__m { font-size: clamp(7px, 1.9cqw, 15px); font-weight: 800; color: #1f9d55; }
.bank-sq--go { color: var(--bank-ink); }
.bank-sq--jail .bank-corner { color: #7a4e2d; }
.bank-sq--bus .bank-corner { color: #6d28d9; }
.bank-sq--tojail .bank-corner { color: #a33a30; }
/* A place's name and price: only once the board is wide enough to read them (a laptop, the TV). */
.bank-sq__name, .bank-sq__price { display: none; }
@container bankboard (min-width: 520px) {
  .bank-sq__name { display: block; max-width: 96%; font-size: clamp(7px, 1.32cqw, 14px); font-weight: 800; line-height: 1.1; text-align: center; overflow-wrap: anywhere; direction: rtl; }
  html[lang="en"] .bank-sq__name { direction: ltr; }
  .bank-sq__price { display: block; font-size: clamp(6.5px, 1.2cqw, 12.5px); font-weight: 700; opacity: 0.75; }
  .bank-sq--luck .bank-ic, .bank-sq--court .bank-ic, .bank-sq--tax .bank-ic, .bank-sq--st .bank-ic, .bank-sq--co .bank-ic { width: min(42%, 3.2cqw); }
}
.bank-fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }

.bank-tok {
  position: absolute;
  z-index: 5;
  width: 5.2%;
  aspect-ratio: 1;
  margin: -2.6% 0 0 -2.6%;
  border-radius: 50%;
  background: var(--pc);
  box-shadow: 0 0 0 2px #ffffff, 0 2px 4px rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
  font-size: 3cqw;
  line-height: 1;
  pointer-events: none;
}
.bank-tok.is-small { width: 4.2%; margin: -2.1% 0 0 -2.1%; font-size: 2.4cqw; }
.bank-tok.is-up { box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--pc), 0 2px 6px rgba(0, 0, 0, 0.35); }

/* --- the middle ------------------------------------------------------------------ */
.bank-mid {
  position: absolute;
  left: 13%;
  top: 13%;
  width: 74%;
  height: 74%;
  background: var(--bank-mid);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5cqw;
  padding: 3%;
  box-sizing: border-box;
}
.bank-dice { display: flex; gap: 2.5cqw; }
.bank-die { perspective: 500px; }
.bank-die .die { --die: 7.5cqw; transition: transform 0.7s cubic-bezier(0.18, 0.72, 0.24, 1); }
.bank-die .die__face { border-radius: 0.9cqw; }
.bank-die.is-rolling .die { animation: ludoTumble 0.45s linear infinite; }
.bank-pot { font-size: clamp(10px, 2.6cqw, 20px); font-weight: 800; color: #1f6b50; background: rgba(31, 107, 80, 0.12); padding: 0.4cqw 1.6cqw; border-radius: 99px; }
.bank-mid__panel { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1cqw; perspective: 800px; }
.bank-mid__close {
  position: absolute; top: -1.4cqw; inset-inline-end: 2cqw;
  width: 2.25rem; height: 2.25rem; border-radius: 50%; border: 0;
  background: var(--surface-solid); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); font-size: 0.9rem;
}
.bank-mid__brand { font-family: var(--font-display); font-weight: var(--fw-black, 900); font-size: clamp(16px, 5.4cqw, 44px); color: var(--text-3); opacity: 0.6; }
.bank-mid__hint { margin: 0; font-size: clamp(10px, 2.6cqw, 18px); color: var(--text-2); text-align: center; }
.bank-mid__note { display: flex; flex-direction: column; align-items: center; gap: 1cqw; text-align: center; color: var(--text); }
.bank-mid__note b { font-size: clamp(13px, 3.8cqw, 28px); font-family: var(--font-display); }
.bank-mid__note span { font-size: clamp(10px, 2.8cqw, 20px); color: var(--text-2); }

.bank-deed {
  width: min(100%, 74cqw);
  border-radius: 2.4cqw;
  overflow: hidden;
  background: var(--surface-solid);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--border), 0 3px 10px rgba(60, 40, 20, 0.12);
  font-size: clamp(10px, 2.9cqw, 19px);
}
.bank-deed__head { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; padding: 1.6cqw 2.4cqw; }
.bank-deed__name { font-family: var(--font-display); font-weight: 800; font-size: 1.3em; line-height: 1.1; }
.bank-deed__price { font-weight: 800; background: rgba(255, 255, 255, 0.4); border-radius: 99px; padding: 0.2em 0.6em; }
.bank-deed__body { padding: 1.4cqw 2.4cqw 1.8cqw; display: flex; flex-direction: column; gap: 0.4cqw; }
.bank-deed__row { display: flex; justify-content: space-between; color: var(--text-2); font-weight: 600; padding: 0.15em 0.4em; border-radius: 6px; }
.bank-deed__row b { color: var(--text); }
.bank-deed__row.is-on { background: var(--accent-soft); color: var(--accent-ink); }
.bank-deed__row.is-on b { color: var(--accent-ink); }
.bank-deed__note, .bank-deed__owner { margin: 0.4em 0 0; font-size: 0.85em; color: var(--text-2); display: flex; align-items: center; gap: 0.4em; }
.bank-dot { width: 0.75em; height: 0.75em; border-radius: 50%; flex: none; }
.bank-card {
  width: min(100%, 70cqw);
  border-radius: 2.4cqw;
  overflow: hidden;
  background: var(--surface-solid);
  box-shadow: 0 0 0 1px var(--border), 0 3px 10px rgba(60, 40, 20, 0.12);
  font-size: clamp(11px, 3.1cqw, 21px);
}
.bank-card__head { display: flex; align-items: center; gap: 0.5em; padding: 1.4cqw 2.4cqw; font-family: var(--font-display); font-weight: 800; color: #ffffff; }
.bank-card--luck .bank-card__head { background: #d99a00; color: #1d1b26; }
.bank-card--court .bank-card__head { background: #2a6f9e; }
.bank-card__head .bank-ic { width: 1.3em; }
.bank-card__text { margin: 0; padding: 2.2cqw 2.6cqw 2.6cqw; font-weight: 700; line-height: 1.45; color: var(--text); }

/* --- the side: the players, the time, the bar, the panels -------------------------- */
.bank-layout { display: flex; flex-direction: column; gap: var(--sp-3); }
.bank-layout__side { display: contents; }
.bank-layout__board { width: 100%; max-width: 36rem; margin-inline: auto; }
.bank-layout__side > .bank-over { order: -3; }
.bank-layout__side > .bank-top { order: -2; }
.bank-top { display: flex; flex-direction: column; gap: var(--sp-2); }
.bank-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.bank-strip--n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bank-strip--n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bank-chip { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.bank-chip.is-turn { border-color: transparent; box-shadow: 0 0 0 2px var(--pc); }
.bank-chip.is-out { opacity: 0.45; }
.bank-chip.is-away { opacity: 0.6; }
.bank-chip__tok { width: 1.7rem; height: 1.7rem; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--pc); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45); font-size: 0.95rem; }
.bank-chip__who { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.bank-chip__name { font-size: 0.78rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bank-chip__name small { font-size: 0.7rem; }
.bank-chip__cash { font-size: 0.78rem; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.bank-chip__cash b { color: var(--text); font-weight: 800; }
.bank-time { display: flex; justify-content: center; gap: var(--sp-2); }

.bank-bar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-2) var(--sp-3);
  padding: var(--sp-3);
  border-radius: 20px;
  background: var(--surface-solid);
  border: 1px solid var(--border);
  box-shadow: 0 -2px 14px rgba(40, 30, 20, 0.06);
}
.bank-bar.is-mine { border-color: transparent; box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgba(40, 30, 20, 0.1); }
.bank-bar__txt { flex: 1 1 10rem; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.bank-bar__t1 { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: var(--fw-bold, 700); font-size: 1.1rem; line-height: 1.25; }
.bank-bar__tok { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--pc); font-size: 0.9rem; flex: none; }
.bank-bar__t2 { font-size: 0.8rem; font-weight: 500; color: var(--text-2); }
.bank-bar__btns { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.bank-bar__tools { flex-basis: 100%; display: flex; gap: var(--sp-2); }
.bank-bar__tools .is-on { background: var(--accent-soft); color: var(--accent-ink); }

.bank-offer { font-size: 0.85rem; font-weight: 600; color: var(--text-2); text-align: center; }
.bank-offer.card { display: flex; flex-direction: column; gap: var(--sp-2); text-align: start; color: var(--text); }
.bank-offer__title { margin: 0; font-weight: 800; }
.bank-offer__sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.bank-offer__sides div { display: flex; flex-direction: column; gap: 2px; padding: var(--sp-2); border-radius: 12px; background: var(--surface-2); }
.bank-offer__sides span { font-size: 0.75rem; color: var(--text-2); }
.bank-offer__sides b { font-size: 0.85rem; }
.bank-offer--mine { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); }

.bank-panel { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); border-radius: 18px; background: var(--surface); border: 1px solid var(--border); }
.bank-panel__title { margin: 0; font-weight: 800; }
.bank-mrow { display: flex; align-items: center; gap: var(--sp-2); padding: 6px 0; border-top: 1px solid var(--hairline); }
.bank-mrow__band { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
.bank-mrow__name { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 0; border: 0; background: none; color: var(--text); font: 700 0.88rem/1.25 var(--font); text-align: start; }
.bank-mrow__name small { font-weight: 500; font-size: 0.72rem; color: var(--text-2); }
.bank-mrow.is-mort .bank-mrow__name { opacity: 0.7; }
