<script>
/* ============================================================================
   سلسلة الإجابات — HOW MANY IN A ROW?
   ----------------------------------------------------------------------------
   One question at a time, four answers, 20 seconds, three lives. The score is
   the number of right answers before the third miss, and the best is kept per
   kind of question.

   Every question comes from a bank the app already has, never a new list:
   - trivia: TRIVIA_QUESTIONS (the room trivia's four-choice questions);
   - board: TRIVIA_BOARD_BANK (دوري المعرفة), whose answers are free text, so
     the three wrong ones are other answers from the same category;
   - emoji: EMOJI_RIDDLES, wrong answers from the same kind (films with films);
   - proverbs: PROVERBS, the missing word against other proverbs' words.
   "trivia" asks from the first two, "mix" from any of the four at random. Free
   play deals through freshPick, so a question doesn't come back until its
   bank has gone round; the daily is ten seeded questions.

   The question on screen carries its deadline (endsAt), so a reload comes
   back to it with the time it really has left. appState.streak holds it all.
   ========================================================================= */

const STREAK_SECONDS = 20;
const STREAK_LIVES = 3;
const STREAK_DAILY = 10;
const STREAK_KINDS = ['trivia', 'board', 'emoji', 'proverbs'];
let streakClock = null;
let streakNextTimer = null;

function streakState() {
  if (!appState.streak) {
    appState.streak = { source: 'mix', daily: '', lang: 'ar', q: null, deck: [], asked: 0, score: 0, lives: STREAK_LIVES, marks: [], phase: 'setup' };
  }
  return appState.streak;
}

/* --- The banks, as questions ----------------------------------------------------- */

function streakDistinct(answer, pool, count, rnd) {
  const seen = new Set([foldWord(answer)]);
  const out = [];
  soloShuffle(pool, rnd).forEach(x => {
    const f = foldWord(x);
    if (out.length >= count || !f || seen.has(f)) return;
    seen.add(f);
    out.push(x);
  });
  return out;
}

/**
 * The number inside an answer written as a number ("1977", "45 دقيقة",
 * "كل 4 سنوات", "42.195 كم"), or null for a word answer. A name with digits
 * stuck to letters (R2-D2) is a word.
 */
function streakNumberOf(answer) {
  const m = String(answer).match(/(^|\s)(-?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)(?=\s|$)/);
  if (!m) return null;
  return { text: m[2], value: Number(m[2].replace(/,/g, '')), decimals: (m[2].split('.')[1] || '').length, commas: m[2].indexOf(',') !== -1 };
}

/**
 * Three wrong answers of the same kind as the right one. A number gets
 * numbers near it, written the same way (a year other years, "45 دقيقة"
 * other minutes), so the one number among three words never gives the
 * answer away; a word gets other word answers from its category, the ones
 * about as long first, then from the whole bank.
 */
function streakBoardDecoys(answer, categoryTexts, everyText, rnd) {
  const num = streakNumberOf(answer);
  if (num) {
    const v = num.value;
    let candidates;
    if (num.decimals) {
      candidates = [0.8, 0.9, 0.95, 1.05, 1.1, 1.25].map(f => (v * f).toFixed(num.decimals));
    } else if (v >= 1000 && v <= 2100) {
      candidates = [-30, -20, -12, -8, -5, -3, -2, 2, 3, 4, 6, 9, 13, 21].map(d => v + d).filter(y => y <= 2025);
    } else if (v <= 20) {
      candidates = [-4, -3, -2, -1, 1, 2, 3, 4, 5].map(d => v + d).filter(x => x > 0);
    } else {
      candidates = [0.5, 0.7, 0.8, 0.9, 1.1, 1.2, 1.3, 1.5, 2].map(f => Math.round(v * f));
    }
    if (num.commas) candidates = candidates.map(x => Number(x).toLocaleString('en-US'));
    const seen = new Set([num.text]);
    const picks = [];
    soloShuffle(candidates.map(String), rnd).forEach(c => {
      if (picks.length < 3 && !seen.has(c)) { seen.add(c); picks.push(c); }
    });
    return picks.map(c => String(answer).replace(num.text, c));
  }
  const words = String(answer).trim().split(/\s+/).length;
  const near = categoryTexts.filter(a => a !== answer && Math.abs(a.trim().split(/\s+/).length - words) <= 1);
  const picks = streakDistinct(answer, near, 3, rnd);
  if (picks.length < 3) picks.push(...streakDistinct(answer, categoryTexts.filter(a => picks.indexOf(a) === -1), 3 - picks.length, rnd));
  if (picks.length < 3) picks.push(...streakDistinct(answer, everyText.filter(a => picks.indexOf(a) === -1), 3 - picks.length, rnd));
  return picks.slice(0, 3);
}

/** Four shuffled options with the right one's index. */
function streakOptions(answer, decoys, rnd) {
  const options = soloShuffle([answer].concat(decoys), rnd);
  return { options: options, answer: options.indexOf(answer) };
}

/** The raw items of one kind: { key, make(rnd) -> question } */
function streakPool(kind, lang) {
  if (kind === 'trivia') {
    const list = (typeof TRIVIA_QUESTIONS !== 'undefined' && (TRIVIA_QUESTIONS[lang] || TRIVIA_QUESTIONS.ar)) || [];
    return list.map(x => ({
      key: x.q,
      make: (rnd) => Object.assign({ kind: kind, prompt: x.q, tag: '' }, streakOptions(x.choices[x.answer], x.choices.filter((_, i) => i !== x.answer), rnd))
    }));
  }
  if (kind === 'board') {
    const out = [];
    const bank = typeof TRIVIA_BOARD_BANK !== 'undefined' ? TRIVIA_BOARD_BANK : [];
    // A note in brackets ("1024 (أو 1000 بالنظام العشري)") is for the host
    // reading the board; as an option it would be copied into every wrong one.
    const clean = (a) => String(a).replace(/\s*[(（][^)）]*[)）]/g, '').trim();
    const everyText = [];
    bank.forEach(cat => Object.values(cat.levels).forEach(list => list.forEach(row => {
      const a = clean(lang === 'en' ? row[3] : row[1]);
      if (!streakNumberOf(a)) everyText.push(a);
    })));
    bank.forEach(cat => {
      const items = [];
      Object.values(cat.levels).forEach(list => list.forEach(row => items.push(lang === 'en' ? { q: row[2], a: clean(row[3]) } : { q: row[0], a: clean(row[1]) })));
      const texts = items.map(x => x.a).filter(a => !streakNumberOf(a));
      items.forEach(x => out.push({
        key: x.q,
        make: (rnd) => Object.assign({ kind: kind, prompt: x.q, tag: `${cat.icon} ${lang === 'en' ? cat.en : cat.ar}` },
          streakOptions(x.a, streakBoardDecoys(x.a, texts, everyText, rnd), rnd))
      }));
    });
    return out;
  }
  if (kind === 'emoji') {
    const list = (typeof EMOJI_RIDDLES !== 'undefined' && (EMOJI_RIDDLES[lang] || EMOJI_RIDDLES.ar)) || [];
    return list.map(x => ({
      key: x.e,
      make: (rnd) => {
        const same = list.filter(y => y.c === x.c && y !== x).map(y => y.a);
        const decoys = streakDistinct(x.a, same, 3, rnd);
        if (decoys.length < 3) decoys.push(...streakDistinct(x.a, list.map(y => y.a).filter(a => decoys.indexOf(a) === -1), 3 - decoys.length, rnd));
        return Object.assign({ kind: kind, prompt: '', big: x.e, tag: x.c }, streakOptions(x.a, decoys, rnd));
      }
    }));
  }
  const list = (typeof PROVERBS !== 'undefined' && (PROVERBS[lang] || PROVERBS.ar)) || [];
  return list.map(x => ({
    key: x.p,
    make: (rnd) => Object.assign({ kind: 'proverbs', prompt: x.p, tag: '' }, streakOptions(x.a, streakDistinct(x.a, list.map(y => y.a), 3, rnd), rnd))
  }));
}

function streakDeal(source, lang) {
  const kind = source === 'mix' ? soloPick(STREAK_KINDS) : (source === 'trivia' ? soloPick(['trivia', 'board']) : source);
  const pool = streakPool(kind, lang);
  const pick = freshPick(`streak:${kind}:${lang}`, pool, 1, { key: x => x.key })[0];
  return pick ? pick.make(Math.random) : null;
}

function streakDailyDeck(lang) {
  const rnd = soloRng(soloDaySeed('streak:' + lang));
  const pools = {};
  STREAK_KINDS.forEach(k => { pools[k] = soloShuffle(streakPool(k, lang), rnd); });
  const deck = [];
  for (let i = 0; i < STREAK_DAILY; i++) {
    const kind = STREAK_KINDS[i % STREAK_KINDS.length];
    const item = pools[kind][i];
    if (item) deck.push(item.make(rnd));
  }
  return deck;
}

/* --- Setup and play ----------------------------------------------------------------- */

function setupStreak() {
  streakStop();
  setView('setup-streak');
}

function paintStreakSetup() {
  const s = streakState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#streak-source .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.source));
  const best = soloBest('streak', s.source);
  const el = document.getElementById('streak-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${best.score}` : '';
  const cont = document.getElementById('streak-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('streak-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('streak', 'startStreak(true)');
}

function setStreakSource(source) {
  streakState().source = source;
  saveToLocal();
  paintStreakSetup();
}

/** A run with a fixed deck: today's daily, or a past day from the archive (which clears s.daily). */
const streakDecked = (s) => !!(s.deck && s.deck.length);

function startStreak(daily) {
  if (daily && soloDailyResume('streak')) return;
  soloDailySetAside('streak');
  soloNewGame('streak');
  const s = streakState();
  const lang = contentLang() === 'en' ? 'en' : 'ar';
  Object.assign(s, {
    daily: daily ? soloToday() : '', lang: lang, playSource: daily ? 'mix' : s.source,
    deck: daily ? streakDailyDeck(lang) : [], asked: 0, score: 0, lives: STREAK_LIVES, marks: [], q: null, phase: 'play'
  });
  streakNext();
  setView('play-streak');
  paintStreak(true);
}

function continueStreak() {
  if (streakState().phase !== 'play') return;
  setView('play-streak');
  if (!restoreStreak()) setupStreak();
}

/** Puts the next question up, with a fresh deadline. */
function streakNext() {
  const s = streakState();
  const q = streakDecked(s) ? s.deck[s.asked] : streakDeal(s.playSource, s.lang);
  s.q = q ? Object.assign(q, { endsAt: Date.now() + STREAK_SECONDS * 1000, picked: null }) : null;
  saveToLocal();
}

function streakStop() {
  if (streakClock) streakClock.stop();
  streakClock = null;
  clearTimeout(streakNextTimer);
  streakNextTimer = null;
}

// Leaving the board by any way (the back arrow, the nav) stops the pause before
// the next question, or a hidden game would carry on losing lives by itself.
// The question on screen keeps its deadline, which "continue" honours.
if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from) => { if (from === 'play-streak') streakStop(); });
}

function streakHearts(s) {
  return Array.from({ length: STREAK_LIVES }, (_, i) => `<span class="streak-heart${i < s.lives ? '' : ' is-lost'}" data-h="${i}">${i < s.lives ? '❤️' : '🤍'}</span>`).join('');
}

function paintStreak(fresh) {
  const s = streakState();
  const t = TRANSLATIONS[appState.lang];
  const el = document.getElementById('streak-stage');
  const q = s.q;
  if (!el || !q) return;
  streakStop();
  const answered = q.picked !== null;
  const left = Math.max(0, (q.endsAt - Date.now()) / 1000);
  const prompt = q.kind === 'proverbs'
    ? escapeHTML(q.prompt).replace('___', '<span class="streak-blank">؟</span>')
    : escapeHTML(q.prompt);
  const bar = soloBarHtml([
    { label: t.streak_lives || '', value: `<span class="streak-hearts" id="streak-hearts">${streakHearts(s)}</span>` },
    { label: streakDecked(s) ? `📅 ${s.asked + 1}/${s.deck.length}` : (t.streak_score || ''), value: s.score, id: 'streak-score' },
    { label: t.streak_time || '', value: Math.ceil(answered ? 0 : left), id: 'streak-left' }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="streak-card${fresh ? ' is-new' : ''}">
          ${q.tag ? `<span class="eyebrow">${escapeHTML(q.tag)}</span>` : ''}
          ${q.big ? `<div class="streak-emoji" dir="ltr">${escapeHTML(q.big)}</div>` : ''}
          ${prompt ? `<p class="streak-prompt">${prompt}</p>` : `<p class="streak-prompt streak-prompt--sub">${escapeHTML(t.streak_emoji_q || '')}</p>`}
          <div class="streak-timer${answered ? ' is-stopped' : ''}" aria-hidden="true"><i style="animation-duration:${STREAK_SECONDS}s; animation-delay:-${(STREAK_SECONDS - left).toFixed(2)}s"></i></div>
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}
        <div class="solo-choices" id="streak-options">
          ${q.options.map((o, i) => {
            const cls = answered ? (i === q.answer ? ' is-right' : (i === q.picked ? ' is-wrong' : '')) : '';
            return `<button type="button" class="solo-choice${cls}" data-i="${i}" onclick="answerStreak(${i})" ${answered ? 'disabled' : ''}><span>${escapeHTML(o)}</span></button>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="view-actions">
      <button class="btn btn--ghost btn--sm" onclick="setupStreak()">${escapeHTML(t.exit || '')}</button>
    </div>`;
  if (answered) {
    streakNextTimer = setTimeout(streakAdvance, 1300);
    return;
  }
  streakClock = createClock({
    seconds: Math.ceil(left),
    onTick: (v) => { const n = document.getElementById('streak-left'); if (n) n.textContent = v; },
    onEnd: () => answerStreak(-1)
  });
}

function answerStreak(i) {
  const s = streakState();
  const q = s.q;
  if (s.phase !== 'play' || !q || q.picked !== null) return;
  streakStop();
  q.picked = i;
  const right = i === q.answer;
  if (right) s.score++;
  else s.lives--;
  s.marks.push(right ? '✅' : (i === -1 ? '⏰' : '❌'));
  s.asked++;
  saveToLocal();
  playSound(right ? 'success' : 'alarm');
  haptic(right ? 'light' : 'medium');
  paintStreak(false);
  if (motionOff()) return;
  if (right) {
    const score = document.getElementById('streak-score');
    if (score && score.animate) score.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: 360, easing: 'ease-out' });
  } else {
    const heart = document.querySelector(`#streak-hearts [data-h="${s.lives}"]`);
    if (heart && heart.animate) heart.animate([{ transform: 'scale(1.6) rotate(-12deg)' }, { transform: 'scale(0.8) rotate(8deg)' }, { transform: 'none' }], { duration: 520, easing: 'ease-out' });
  }
}

function streakAdvance() {
  const s = streakState();
  if (s.phase !== 'play' || appState.currentView !== 'play-streak') return;
  if (s.lives <= 0 || (streakDecked(s) && s.asked >= s.deck.length)) { streakFinish(); return; }
  streakNext();
  if (!s.q) { streakFinish(); return; }
  paintStreak(true);
}

function streakFinish() {
  const s = streakState();
  const t = TRANSLATIONS[appState.lang];
  streakStop();
  if (s.phase !== 'play') return;
  s.phase = 'done';
  saveToLocal();
  const source = s.playSource || s.source;
  const rec = streakDecked(s) ? { record: false, prev: null } : soloRecord('streak', source, { score: s.score }, (a, b) => a.score > b.score);
  let share = '';
  const lines = [];
  if (s.daily) {
    soloMarkDaily('streak', { score: s.score }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n🔥 ${t.setup_streak || ''} ${s.score}/${s.deck.length}\n${s.marks.join('')}`;
    lines.push(s.marks.join(''));
  }
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${rec.prev.score}`);
  soloResult({
    icon: '🔥', title: s.daily ? (s.lives > 0 ? (t.daily_done_today || '') : (t.streak_over || '')) : (rec.record && s.score ? (t.solo_new_best || '') : (t.streak_over || '')),
    value: s.score, valueLabel: streakDecked(s) ? `/ ${s.deck.length}` : (t.streak_in_a_row || ''), lines: lines,
    win: rec.record && s.score > 0 || (streakDecked(s) && s.score >= 7), share: share,
    again: () => startStreak(false), exit: setupStreak
  });
}

function restoreStreak() {
  const s = streakState();
  if (s.phase !== 'play' || !s.q) return false;
  if (s.q.picked === null && Date.now() >= s.q.endsAt) {
    paintStreak(false);
    answerStreak(-1);
    return true;
  }
  paintStreak(false);
  return true;
}

soloRegister('streak', {
  setup: 'setup-streak', play: 'play-streak', paintSetup: paintStreakSetup, restore: restoreStreak,
  state: streakState, resume: continueStreak, repaint: () => { if (streakState().phase === 'play') paintStreak(false); }, prefs: ['source']
});
</script>
