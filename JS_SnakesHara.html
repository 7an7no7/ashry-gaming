   <path d="M-8.6 -6 L-8 -12.8 L-4.4 -8.8Z M8.6 -6 L8 -12.8 L4.4 -8.8Z" fill="#ff9db0"/>

   ${eyeG(-4.6)}${eyeG(4.6)}
   <path d="M-1.8 2.6 L1.8 2.6 L0 4.6Z" fill="#ff8fa3" stroke="${I}" stroke-width=".7"/>
   <path class="snh-smile" d="M-3.4 5.4 Q-1.7 7.4 0 5.4 Q1.7 7.4 3.4 5.4" stroke="${I}" stroke-width="1.1" fill="none" stroke-linecap="round"/>
   <g class="snh-maw" transform="translate(0 7) scale(1 .01)"><ellipse rx="3.8" ry="3.4" fill="#5a0f1c" stroke="${I}" stroke-width="1"/><path d="M-2.6 -2 l.9 2.2 l.9 -2.2 M.8 -2 l.9 2.2 l.9 -2.2" fill="#fff"/></g>
   <path class="snh-tongue" d="M-1.6 6 Q0 10.5 1.6 6Z" fill="#ff6f8a" stroke="${I}" stroke-width=".6"/>
   <path d="M-6 3.6 L-15 1.6 M-6 5.2 L-15 6.4 M6 3.6 L15 1.6 M6 5.2 L15 6.4" stroke="${I}" stroke-width=".8"/>
   ${fez ? `<g transform="translate(4 -9) rotate(14)"><path d="M-6 0 L-4.6 -10 L4.6 -10 L6 0Z" fill="#c62828" stroke="${I}" stroke-width="1.3"/><path d="M0 -10 Q4 -9 4.6 -3" stroke="${I}" stroke-width="1" fill="none"/><circle cx="4.6" cy="-2.4" r="1.5" fill="${I}"/></g>` : ''}
   <g transform="translate(${side > 0 ? 11 : -11} -12) scale(${side} 1)"><text class="snk-zz" font-size="10" font-weight="800" fill="${I}" font-family="system-ui,sans-serif">z</text></g>
  </g></g></g>`;
  }
  function pigeonSvg(fly) {
    return `<g><path d="M-8 -1 L-15 -4 L-15 3Z" fill="#69768a" stroke="${I}" stroke-width="1"/>
  ${fly ? '' : `<path d="M-2 5 V9 M2 5 V9" stroke="#d9534f" stroke-width="1.4"/>`}
  <ellipse rx="8.5" ry="5.6" fill="#9ba8bb" stroke="${I}" stroke-width="1.2"/>
  <g class="${fly ? '' : 'snh-peck'}"><path d="M4 -2 Q6 -8 10 -7.5" stroke="#5f8f7a" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="10.5" cy="-7.5" r="3.6" fill="#8c98ac" stroke="${I}" stroke-width="1.1"/><path d="M13.6 -8.2 L17 -7 L13.6 -6Z" fill="#e3a35a" stroke="${I}" stroke-width=".5"/><circle cx="11.4" cy="-8.4" r=".9" fill="${I}"/></g>
  <path class="${fly ? 'snh-pwing' : ''}" d="M-4 -2 Q-2 -13 7 -9 Q4 -3 -4 -2Z" fill="#c3ccd8" stroke="${I}" stroke-width="1"/></g>`;
  }
  function cloth(k, col) {
    const pin = `<rect x="-1.2" y="-2.6" width="2.4" height="4.4" rx=".6" fill="#c58b4a" stroke="${I}" stroke-width=".5"/>`;
    if (k === 0) return `<path d="M-8 0 L-3 0 Q0 3 3 0 L8 0 L11.5 6 L7.5 8 L7.5 18 L-7.5 18 L-7.5 8 L-11.5 6Z" fill="${col}" stroke="${I}" stroke-width="1.1" stroke-linejoin="round"/>${pin}`;
    if (k === 1) return `<path d="M-5 0 L5 0 L9 6 L6 7.5 L7.5 24 L-7.5 24 L-6 7.5 L-9 6Z" fill="${col}" stroke="${I}" stroke-width="1.1" stroke-linejoin="round"/><path d="M0 1 V9" stroke="${I}" stroke-width=".8"/>${pin}`;
    if (k === 2) return `<path d="M-6 0 V9 Q-6 12 -2 12 L-1 12 L-1 9 L-3 9 V0Z M3 0 V9 Q3 12 7 12 L8 12 L8 9 L6 9 V0Z" fill="${col}" stroke="${I}" stroke-width="1" stroke-linejoin="round"/>${pin}`;
    return `<rect x="-7" y="0" width="14" height="16" rx="1" fill="${col}" stroke="${I}" stroke-width="1.1"/><path d="M-7 11 H7" stroke="#fff" stroke-width="2" opacity=".8"/>${pin}`;
  }
  /** A washing line between two poles standing on the frame, clothes swaying on it. */
  function laundry(x1, x2, y, sag, seed, sc) {
    const r = mulberry(seed), cx = (x1 + x2) / 2, cy = y + sag * 2;
    let s = `<path d="M${x1} ${y - 2} V-21 M${x2} ${y - 2} V-21" stroke="#5a4030" stroke-width="2.4" stroke-linecap="round"/><path d="M${x1} ${y} Q${cx} ${cy} ${x2} ${y}" stroke="#3b2b20" stroke-width="1.2" fill="none"/>`;
    const cols = ['#e63946', '#f1c40f', '#3a86ff', '#ffffff', '#2a9d8f', '#ff8fab', '#8e5bd6', '#f4a261'], n = Math.max(2, Math.floor((x2 - x1) / 30));
    for (let i = 0; i < n; i++) {
      const t = (i + 0.6) / (n + 0.2), u = 1 - t, x = u * u * x1 + 2 * u * t * cx + t * t * x2, yy = u * u * y + 2 * u * t * cy + t * t * y;
      const k = Math.floor(r() * 4), col = cols[Math.floor(r() * cols.length)], dl = (r() * 2.4).toFixed(2);
      s += `<g transform="translate(${F(x)} ${F(yy)}) scale(${sc})"><g class="snh-cl" style="animation-delay:${dl}s">${cloth(k, col)}</g></g>`;
    }
    return s;
  }
  function fulCart() {
    return `<g><ellipse cy="2" rx="36" ry="4" fill="rgba(0,0,0,.2)"/>
  <path d="M30 -14 L46 -24" stroke="#6b3d1c" stroke-width="3" stroke-linecap="round"/>
  <rect x="-30" y="-27" width="60" height="17" rx="2" fill="#2f7d9b" stroke="${I}" stroke-width="1.6"/>
  <path d="M-30 -21 H30" stroke="#f2c14e" stroke-width="2"/><path d="M-26 -15 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3" stroke="#f2c14e" stroke-width="1.2" fill="none"/>
  <circle cx="-17" cy="-6" r="7" fill="#5a3a1e" stroke="${I}" stroke-width="1.5"/><circle cx="17" cy="-6" r="7" fill="#5a3a1e" stroke="${I}" stroke-width="1.5"/>
  <path d="M-17 -12 V0 M-23 -6 H-11 M17 -12 V0 M11 -6 H23" stroke="#c49a6c" stroke-width="1"/>
  <path d="M-14 -27 L-16 -45 Q0 -53 16 -45 L14 -27Z" fill="#c8702f" stroke="${I}" stroke-width="1.6"/><path d="M-12 -38 Q0 -42 12 -38" stroke="#f0a060" stroke-width="2" fill="none"/>
  <ellipse cx="0" cy="-46" rx="15" ry="4" fill="#e08a45" stroke="${I}" stroke-width="1.4"/><circle cx="0" cy="-51" r="2.2" fill="#e08a45" stroke="${I}" stroke-width="1"/>
  <path class="snh-steam" d="M-5 -53 q-3 -5 0 -9 q3 -4 0 -8" stroke="#fff" stroke-width="2" fill="none"/><path class="snh-steam" style="animation-delay:1.1s" d="M5 -53 q-3 -5 0 -9 q3 -4 0 -8" stroke="#fff" stroke-width="2" fill="none"/>
  <rect x="-44" y="-44" width="26" height="14" rx="2" fill="#fff4d6" stroke="${I}" stroke-width="1"/><text x="-31" y="-33.6" font-size="9.5" text-anchor="middle" font-weight="800" fill="#b3202e" font-family="Noto Kufi Arabic,system-ui,sans-serif">${escapeHTML(snkT('snk_b_hara_ful'))}</text></g>`;
  }
  function tukSide() {
    return `<g><ellipse cy="12" rx="32" ry="4" fill="rgba(0,0,0,.22)"/><g class="snh-tukb">
  <path d="M-30 6 L-30 -12 Q-28 -24 -14 -26 L24 -26 Q30 -26 30 -20 L30 6Z" fill="#b3202e" stroke="${I}" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M-33 -16 Q-31 -33 -10 -33 L27 -33 Q34 -33 33 -25 L33 -18Z" fill="#26232b" stroke="${I}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M-32 -17 H32" stroke="#ffd23f" stroke-width="2" stroke-dasharray="1.6 2.4"/>
  <path d="M-28 -1 L-28 -13 L-15 -15 L-15 -1Z" fill="#bfe6f2" stroke="${I}" stroke-width="1.2"/>
  <rect x="-11" y="-16" width="20" height="15" fill="#3a2a26"/><circle cx="-2" cy="-9" r="5" fill="#e8b98c" stroke="${I}" stroke-width="1"/><path d="M-7 -11 Q-2 -17 3 -11" fill="#2b1a10"/>
  <path d="M-30 0 H30" stroke="#ffd23f" stroke-width="2.4"/><circle cx="-31" cy="-5" r="2.2" fill="#fff6a0" stroke="${I}" stroke-width=".8"/></g>
  <circle cx="-19" cy="7" r="6" fill="#2b2b2b" stroke="${I}" stroke-width="1.2"/><circle cx="19" cy="7" r="6" fill="#2b2b2b" stroke="${I}" stroke-width="1.2"/><circle cx="-19" cy="7" r="2" fill="#aaa"/><circle cx="19" cy="7" r="2" fill="#aaa"/></g>`;
  }
  function basketSvg() {
    return `<g><path d="M-9 -12 Q0 -25 9 -12" stroke="#7a4a1e" stroke-width="2.2" fill="none"/>
  <path d="M-12 -12 L12 -12 L9 5 L-9 5Z" fill="#c9954e" stroke="${I}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M-11 -7 H11 M-10 -1.5 H10 M-6 -12 L-5 5 M0 -12 V5 M6 -12 L5 5" stroke="#8a5a26" stroke-width="1"/>
  <ellipse cy="-12" rx="12" ry="2.6" fill="#a8743a" stroke="${I}" stroke-width="1.2"/></g>`;
  }
  function grannySvg() {
    return `<g><path d="M-13 9 Q-13 -15 0 -16 Q13 -15 13 9Z" fill="#2d3a6b" stroke="${I}" stroke-width="1.4"/>
  <circle cy="-2" r="7.6" fill="#f0c49a" stroke="${I}" stroke-width="1.2"/><circle cx="-3" cy="-3" r="2.5" fill="#fff" fill-opacity=".5" stroke="${I}" stroke-width=".9"/><circle cx="3" cy="-3" r="2.5" fill="#fff" fill-opacity=".5" stroke="${I}" stroke-width=".9"/>
  <circle cx="-3" cy="-3" r=".9" fill="${I}"/><circle cx="3" cy="-3" r=".9" fill="${I}"/><path d="M-3 2 Q0 4.5 3 2" stroke="${I}" stroke-width="1.1" fill="none"/>
  <path d="M10 5 L19 -7" stroke="#f0c49a" stroke-width="3.6" stroke-linecap="round"/><path d="M10 5 L19 -7" stroke="${I}" stroke-width=".8" opacity=".5"/></g>`;
  }
  const basinSvg = () => `<g><path d="M-17 -4 L17 -4 L12 7 L-12 7Z" fill="#b8c4cc" stroke="${I}" stroke-width="1.5"/><ellipse cy="-4" rx="17" ry="4" fill="#dfe7ec" stroke="${I}" stroke-width="1.3"/><ellipse cy="-4" rx="13" ry="2.6" fill="#7cc6e8"/></g>`;

  /* --- the drainpipe's way: down, a 45° offset, down, its corners rounded --------------------------- */
  function roundPoly(P, r) {
    if (P.length < 3) return P.slice();
    const out = [P[0]];
    for (let i = 1; i < P.length - 1; i++) {
      const a = P[i - 1], b = P[i], c = P[i + 1], l1 = Math.hypot(b.x - a.x, b.y - a.y) || 1, l2 = Math.hypot(c.x - b.x, c.y - b.y) || 1, rr = Math.min(r, l1 / 2, l2 / 2);
      const p1 = { x: b.x - (b.x - a.x) / l1 * rr, y: b.y - (b.y - a.y) / l1 * rr }, p2 = { x: b.x + (c.x - b.x) / l2 * rr, y: b.y + (c.y - b.y) / l2 * rr };
      out.push(p1);
      for (let k = 1; k < 8; k++) { const t = k / 8, u = 1 - t; out.push({ x: u * u * p1.x + 2 * u * t * b.x + t * t * p2.x, y: u * u * p1.y + 2 * u * t * b.y + t * t * p2.y }); }
      out.push(p2);
    }
    out.push(P[P.length - 1]);
    return out;
  }
  /** Points every few units along the polyline, so the engine's spline through them stays straight where the pipe is. */
  function dense(P) {
    const out = [P[0]];
    for (let i = 1; i < P.length; i++) {
      const a = P[i - 1], b = P[i], n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 8));
      for (let k = 1; k <= n; k++) out.push({ x: snkLerp(a.x, b.x, k / n), y: snkLerp(a.y, b.y, k / n) });
    }
    return out;
  }

  /* --- small effects ------------------------------------------------------------------------------- */
  function pop(c, x, y, txt) {
    if (c.fast || snkStill()) return;
    const e = snkEl('text', { 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 800, fill: '#b3202e', 'font-family': 'Noto Kufi Arabic,system-ui,sans-serif', stroke: '#fff', 'stroke-width': 3, style: 'paint-order:stroke' }, c.fx);
    e.textContent = txt;
    const t0 = performance.now();
    (function f(now) { const k = snkClamp((now - t0) / 600, 0, 1); snkTR(e, x, y - 18 * k, 1 + 0.25 * k, 0); e.setAttribute('opacity', (1 - k * k).toFixed(2)); if (k < 1 && e.isConnected) requestAnimationFrame(f); else e.remove(); })(t0);
  }
  function splash(c, x, y) { snkPuff(c, x, y, 8, '#8fd3f4', 28); snkPuff(c, x, y - 4, 3, '#ffffff', 14); }
  /** He jumps onto the funnel at the pipe's top. */
  function toTop(c, g, p, sn, ms) {
    const x0 = p.x, y0 = p.y, H = sn.pts[0];
    return snkTween(c, g, ms, t => snkSetP(p, snkLerp(x0, H.x, t), snkLerp(y0, H.y - 8, t) - Math.sin(t * Math.PI) * 22, 1, 0), snkLin);
  }
  /** Out of the spout into the puddle, and onto the tail's square. */
  async function fromSpout(c, g, p, sn, ms, spin) {
    const T = sn.pts[sn.pts.length - 1];
    p.n = sn.t; p.hidden = false; p.e.setAttribute('opacity', 1);
    splash(c, T.x, T.y + 6);
    const s = snkSpot(c, p);
    p.k = s.k;
    await snkTween(c, g, ms, t => snkSetP(p, snkLerp(T.x, s.x, t), snkLerp(T.y, s.y, t) - Math.sin(t * Math.PI) * 26, spin ? 0.4 + 0.6 * snkBackOut(Math.min(1, t * 1.3)) : 1, spin ? (1 - t) * -260 : 0), snkLin);
    snkSettleAll(c);
  }
  /** The cat back on its funnel, with a somersault. */
  async function catHome(c, g, sn, ms) {
    if (!sn.catXY) return;
    const f = Object.assign({}, sn.catXY), H = sn.pts[0], hx = H.x, hy = H.y - 13;
    await snkTween(c, g, ms, t => { sn.catXY = { x: snkLerp(f.x, hx, t), y: snkLerp(f.y, hy, t) - Math.sin(t * Math.PI) * 44, r: t * 360 * sn.side }; }, snkLin);
    sn.catXY = null;
  }

  /* --- the drainpipe's four moves (each inside its time in SNAKES_THEME_MOVES.hara) ----------------- */
  /** «القطة بتجري وراه»: into the funnel, the cat runs along the pipe after the knocking, out at the puddle. */
  async function hChase(c, g, p, sn) {
    sn.mood = 'hiss'; snkBubble(c, sn.hx, sn.hy - 18, snkT('snk_b_hara_hiss'), 900);
    snkFace(p, 'gasp'); snkSound(c, 'snkHiss', p.mine);
    const x0 = p.x, y0 = p.y;
    await snkTween(c, g, 260, (t, r) => { const k = Math.sin(r * Math.PI); sn.jaw = k; sn.lunge = { x: (x0 - sn.hx) * 0.22 * k, y: (y0 - sn.hy) * 0.15 * k, s: 1 + 0.15 * k }; }, snkLin);
    sn.jaw = 0; sn.lunge = { x: 0, y: 0, s: 1 };
    if (!snkAlive(c, g)) return;
    snkFace(p, 'gasp up'); snkBubble(c, p.x, p.y - 24, snkT('snk_b_run'), 900);
    const H = sn.pts[0];
    await snkTween(c, g, 320, t => snkSetP(p, snkLerp(x0, H.x, t), snkLerp(y0, H.y - 6, t) - Math.sin(t * Math.PI) * 30, 1 - t * 0.6, t * 200), snkLin);
    if (!snkAlive(c, g)) return;
    p.e.setAttribute('opacity', 0); p.hidden = true;
    snkSound(c, 'snkGulp', p.mine);
    sn.mood = 'wow';
    let lk = 0;
    await snkTween(c, g, 1060, (t, r) => {
      sn.bulge = snkLerp(4, sn.L - 4, t);
      const q = snkSpineAt(sn, Math.max(0, sn.bulge - 26), c.time || 0);
      sn.catXY = { x: q.x, y: q.y - 13 - Math.abs(Math.sin(r * Math.PI * 12)) * 4, r: 0 };
      if (r - lk > 0.2) { lk = r; const b = snkSpineAt(sn, sn.bulge, c.time || 0); pop(c, b.x + 14, b.y, snkT('snk_b_hara_tak')); }
    }, snkEase);
    sn.bulge = null;
    if (!snkAlive(c, g)) return;
    const T = sn.pts[sn.pts.length - 1];
    snkBubble(c, T.x, T.y - 12, snkT('snk_b_hara_plop'), 800);
    await fromSpout(c, g, p, sn, 360, true);
    if (!snkAlive(c, g)) return;
    sn.mood = '';
    snkFace(p, 'sweat');
    await Promise.all([catHome(c, g, sn, 420), snkDizzy(c, g, p, 400)]);
  }

  /** «زحليقة»: up on the funnel and down the pipe like a fireman's pole, sparks flying. */

    renderDown(c, sn, t) {

      if (!P) return;

    mountUp(c, l) {
      const kind = KINDS[((c.snhLad || 0) + (c.snhOff || 0)) % 3];
      c.snhLad = (c.snhLad || 0) + 1;
      const a = l.a, b = l.b, dx = b.x - a.x, dy = b.y - a.y, Ln = Math.hypot(dx, dy), ux = dx / Ln, uy = dy / Ln, vx = -uy * 8, vy = ux * 8, side = l.side || 1;

        const top = { x: b.x, y: b.y - 20 }, bx = a.x - side * 22, by = a.y + 22;

        snkEl('path', { d: beam, stroke: '#8a5a2b', 'stroke-width': 3.6, 'stroke-linecap': 'round', fill: 'none' }, inner);

        const wh = snkEl('g', { transform: `translate(${top.x} ${top.y})` }, inner);
        wh.innerHTML = `<circle r="6.6" fill="#d9b27a" stroke="${I}" stroke-width="1.6"/><circle r="3.8" fill="none" stroke="#8a5a2b" stroke-width="1.4"/><circle r="1.6" fill="${I}"/>`;

        o.glowL = snkEl('path', { d: `M${top.x} ${top.y} L${bx} ${by - 18}` + beam, stroke: '#ffe27a', 'stroke-width': 8, 'stroke-linecap': 'round', fill: 'none', opacity: 0 }, inner);

      for (let d = 11; d < Ln + 4; d += 12) { const u = d / (Ln + 12), sag = iron ? 0 : 5 * side * 4 * u * (1 - u) * 0.5, cx = A.x + ux * d + (-uy) * sag, cy = A.y + uy * d + ux * sag; rungs += `M${F(cx - vx)} ${F(cy - vy)} L${F(cx + vx)} ${F(cy + vy)}`; }

      snkEl('path', { d: rungs, stroke: lInk, 'stroke-width': 4.6, 'stroke-linecap': 'round', fill: 'none' }, inner);
      snkEl('path', { d: rungs, stroke: rung, 'stroke-width': 2.5, 'stroke-linecap': 'round', fill: 'none' }, inner);
      snkEl('path', { d: rails, stroke: lInk, 'stroke-width': iron ? 6 : 5.4, 'stroke-linecap': 'round', fill: 'none' }, inner);
      snkEl('path', { d: rails, stroke: rail, 'stroke-width': iron ? 3.6 : 3.2, 'stroke-linecap': 'round', fill: 'none' }, inner);
      if (!iron) snkEl('path', { d: rails, stroke: '#9a7a3e', 'stroke-width': 1.3, 'stroke-dasharray': '2 3', fill: 'none' }, inner);

        // The balcony it hangs from, at the top of its top square.
        const rx = b.x, ry = b.y - 21;

        snkEl('path', { d: `${bal}M${rx - 14} ${ry} H${rx + 14}`, stroke: I, 'stroke-width': 3.2, 'stroke-linecap': 'round', fill: 'none' }, inner);

    downMoves: { chase: hChase, pole: hPole, water: hWater, ride: hRide },
