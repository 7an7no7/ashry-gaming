<script>
/* ============================================================================
   ألغاز شطرنج — CHESS PUZZLES
   ----------------------------------------------------------------------------
   The owner's plan (24 Sep 2026): puzzles made by the app's own engine at
   build time (ChessPuzzles.js, CHESS_PUZZLES - tools/make-chess-puzzles.mjs),
   easy / medium / hard, a puzzle of the day in تحدي اليوم, a streak of puzzles
   with three hearts, and puzzles from your own mistakes (from the review).

   The board is the chess game's own (chView in JS_Chess.html): 2D by default,
   3D a tap away with the same switch, the pieces picked and dragged through
   chTapLogic / chDropLogic. The player's colour is at the bottom and the side
   to move is said on top.

   A puzzle is { fen, moves: [player, reply, player …] in UCI }. A move is
   right when it leads to the same position as the line's (so castling by the
   rook, or the king's two steps, are one move), or when it mates at once (a
   mate in 2 found another way is still a mate). A right move flashes green and
   the reply is played by itself half a second later; a wrong one goes back
   with a shake and a red flash, and counts once (the board takes no move while
   the shake plays). What has been played is `hist`, so a reload comes back to
   the same puzzle at the same move - the reply played then if it was due.
   appState.chesspuzzle holds it all.
   ========================================================================= */

const CHPZ_REPLY_MS = 500;     // the reply after a right move
const CHPZ_SHOW_MS = 750;      // a move of the solution when it is shown
const CHPZ_LOCK_MS = 650;      // no move while a wrong one shakes back (a double tap counts once)

// sel: the piece picked up; lockUntil: the board takes no move before this; flash: a square lit
// for a moment ({ sq, kind: 'good' | 'bad' }); timer: the reply or the solution's next move.
const chPzLocal = { sel: '', lockUntil: 0, flash: null, flashTimer: null, timer: null, unlockTimer: null };

function chPzState() {
  if (!appState.chesspuzzle) {
    appState.chesspuzzle = { level: 1, mode: 'free', phase: 'setup', p: null, hist: [], wrong: 0, hint: -1, shown: false, result: '', nonce: 0, daily: '', done: { 1: 0, 2: 0, 3: 0 } };
  }
  const s = appState.chesspuzzle;
  if (!Array.isArray(s.hist)) s.hist = [];
  if (!s.done) s.done = { 1: 0, 2: 0, 3: 0 };
  return s;
}

/* --- the bank ------------------------------------------------------------------ */

let chPzByLevel = null;

/** The puzzles of one level (1, 2, 3), from the bank the build inlined. */
function chPzBank(level) {
  if (!chPzByLevel) {
    chPzByLevel = { 1: [], 2: [], 3: [] };
    (typeof CHESS_PUZZLES !== 'undefined' ? CHESS_PUZZLES : []).forEach(p => { if (chPzByLevel[p.level]) chPzByLevel[p.level].push(p); });
  }
  return chPzByLevel[level] || [];
}

/** A puzzle as the state keeps it (the bank's own fields, and where it came from). */
const chPzCopy = (p, extra) => Object.assign({ id: p.id, fen: p.fen, moves: p.moves.slice(), theme: p.theme, mateIn: p.mateIn || 0, level: p.level, rating: p.rating }, extra || {});

/* --- the position ---------------------------------------------------------------- */

/** The puzzle's position now: the game, what each side lost, the last move and the moves as SAN. */
function chPzGame(s) {
  const g = chessFromFen(s.p.fen);
  const lost = [[], []];
  const sans = [];
  let last = null;
  s.hist.forEach((uci, k) => {
    const mover = g.turn;
    const info = chessPlay(g, chessFromUci(uci));
    if (!info) return;
    if (info.capture) lost[1 - mover].push(info.capture);
    sans.push(info.san);
    last = { from: info.from, to: info.to, capture: info.capture, captureSq: info.captureSq, castle: info.castle, promo: info.promo, check: info.check, n: k + 1 };
  });
  return { g: g, lost: lost, sans: sans, last: last };
}

/** The side the player plays (the side to move in the puzzle's position). */
const chPzSide = (s) => (String(s.p.fen).split(' ')[1] === 'b' ? 1 : 0);

/** The position part of a FEN (no move counters): two moves are the same when they lead to the same one. */
const chPzPlace = (g) => chessFen(g).split(' ').slice(0, 4).join(' ');

/** Does `mv` solve this step? The line's move (by the position it leads to), or a mate at once. */
function chPzJudge(s, g, mv) {
  const exp = s.p.moves[s.hist.length];
  const mine = chessCloneGame(g);
  const info = chessPlay(mine, mv);
  if (!info) return { ok: false, legal: false };
  if (exp) {
    const want = chessCloneGame(g);
    if (chessPlay(want, chessFromUci(exp)) && chPzPlace(want) === chPzPlace(mine)) return { ok: true, legal: true, line: true, uci: exp };
  }
  const uci = info.from + info.to + (info.promo || '');
  if (info.status && info.status.reason === 'mate') return { ok: true, legal: true, mate: true, uci: uci };
  if (typeof chPzAltOk === 'function' && s.p.alt && chPzAltOk(s, g, info, mine)) return { ok: true, legal: true, alt: true, uci: uci };
  return { ok: false, legal: true, uci: uci };
}

/** Can the player move now? */
const chPzCanMove = (s) => s.phase === 'play' && !s.result && !s.showing && s.p && s.hist.length % 2 === 0 && s.hist.length < s.p.moves.length && Date.now() >= chPzLocal.lockUntil;

/* --- starting a puzzle ------------------------------------------------------------ */

function setupChessPuzzles() {
  chPzStop();
  setView('setup-chesspuzzles');
}

/** A board with work on it isn't replaced without asking (today's daily is set aside, never lost). */
function chPzAsk(go) {
  return soloConfirmNew('chesspuzzle', (s) => !!s.p && !s.result && (s.hist.length > 0 || s.wrong > 0 || s.hint >= 0) && s.mode !== 'streak', go);
}

/** «ابدأ»: a free puzzle of the chosen level, one not seen lately. */
function chPzStartFree() {
  if (chPzAsk(() => chPzDealFree(true))) return;
  chPzDealFree(true);
}

function chPzDealFree() {
  const s = chPzState();
  const level = [1, 2, 3].indexOf(Number(s.level)) === -1 ? 1 : Number(s.level);
  const p = freshPick('chesspuzzle_' + level, chPzBank(level), 1, { key: x => String(x.id) })[0];
  if (!p) return;
  chPzBegin({ mode: 'free', p: chPzCopy(p) });
}

/** Puts a puzzle on the board: `o` { mode, p, daily?, from? }. */
function chPzBegin(o) {
  soloDailySetAside('chesspuzzle');
  soloNewGame('chesspuzzle');
  chPzStop();
  const s = chPzState();
  if (s.mode === 'streak' && o.mode !== 'streak' && s.streak && !s.streak.over && s.p && !s.result && s.phase === 'play') {
    s.streak.saved = { p: s.p, hist: s.hist.slice(), uid: s.uid };
  }
  s.nonce = (s.nonce || 0) + 1;
  Object.assign(s, {
    mode: o.mode || 'free', p: o.p, hist: [], wrong: 0, hint: -1, shown: false, showing: false, result: '',
    phase: 'play', daily: o.daily || '', from: o.from || null, uid: o.p.id + '|' + s.nonce, triedAt: 0
  });
  chPzLocal.sel = '';
  chPzLocal.lockUntil = 0;
  chPzLocal.flash = null;
  saveToLocal();
  if (appState.currentView !== 'play-chesspuzzle') setView('play-chesspuzzle');
  chPzPaint();
}

/** «كمّل»: back to the puzzle left on the board. */
function chPzContinue() {
  const s = chPzState();
  if (s.phase !== 'play' || !s.p) return;
  setView('play-chesspuzzle');
  chPzPaint({ still: true });
  chPzAfter();
}

function chPzStop() {
  clearTimeout(chPzLocal.timer);
  chPzLocal.timer = null;
  clearTimeout(chPzLocal.unlockTimer);
  chPzLocal.unlockTimer = null;
}

/* --- a move ------------------------------------------------------------------------ */

/** The player's move, from a tap or a drop. Returns true when it was right (and played). */
function chPzPlay(mv, byDrop) {
  const s = chPzState();
  if (!chPzCanMove(s)) return false;
  const pos = chPzGame(s);
  const j = chPzJudge(s, pos.g, mv);
  if (!j.legal) return false;
  if (!j.ok) { chPzWrong(s, mv, byDrop); return false; }
  s.hist.push(j.uci);
  chPzLocal.sel = '';
  chPzFlash(mv.to, 'good');
  haptic('light');
  const done = j.mate || j.alt || s.hist.length >= s.p.moves.length;
  if (done) chPzSolved(s);
  saveToLocal();
  chPzPaint();
  if (done && typeof chPzStreakPop === 'function') chPzStreakPop(s, false);
  if (!done) chPzAfter();
  return true;
}

/** A wrong move: it goes back with a shake and a red flash, and counts once. */
function chPzWrong(s, mv, byDrop) {
  chPzLocal.lockUntil = Date.now() + CHPZ_LOCK_MS;
  chPzLocal.sel = '';
  s.wrong = (s.wrong || 0) + 1;
  s.triedAt = s.hist.length;
  if (typeof chPzWrongMode === 'function') chPzWrongMode(s);
  chPzFlash(mv.to, 'bad');
  // A drop is shaken back by the board itself; a tap's piece never left its square, so it shakes there.
  if (!byDrop && chView.r && chView.r.nudge && !motionOff()) chView.r.nudge(mv.from);
  chSound('refuse');
  haptic('medium');
  chPzStageFlash('bad');
  saveToLocal();
  chPzPaint();
  if (typeof chPzStreakPop === 'function') chPzStreakPop(s, true);
  clearTimeout(chPzLocal.unlockTimer);
  chPzLocal.unlockTimer = setTimeout(() => { if (appState.currentView === 'play-chesspuzzle') { chPzPaint(); chPzAfter(); } }, CHPZ_LOCK_MS + 20);
}

/** A square lit for a moment on the board: green for a right move, red for a wrong one. */
function chPzFlash(sq, kind) {
  chPzLocal.flash = { sq: sq, kind: kind };
  clearTimeout(chPzLocal.flashTimer);
  chPzLocal.flashTimer = setTimeout(() => { chPzLocal.flash = null; if (appState.currentView === 'play-chesspuzzle') chPzPaint(); }, 700);
}

/** The board's frame glows green or red for a moment. */
function chPzStageFlash(kind) {
  const el = document.querySelector('#chesspuzzle-stage .ch-stage');
  if (!el || motionOff()) return;
  el.classList.remove('is-pz-good', 'is-pz-bad');
  void el.offsetWidth;
  el.classList.add(kind === 'good' ? 'is-pz-good' : 'is-pz-bad');
  setTimeout(() => el.classList.remove('is-pz-good', 'is-pz-bad'), 800);
}

/** Whatever comes by itself next: the reply after a right move, the next move of a solution being shown. */
function chPzAfter() {
  const s = chPzState();
  clearTimeout(chPzLocal.timer);
  chPzLocal.timer = null;
  if (appState.currentView !== 'play-chesspuzzle' || s.phase !== 'play' || !s.p) return;
  if (s.showing) {
    if (s.hist.length >= s.p.moves.length) { s.showing = false; saveToLocal(); chPzPaint(); chPzShowDone(s); return; }
    chPzLocal.timer = soloLater('chesspuzzle', CHPZ_SHOW_MS + chViewBusyLeft(), () => chPzAutoMove(true));
    return;
  }
  if (s.result || s.hist.length % 2 === 0 || s.hist.length >= s.p.moves.length) return;
  chPzLocal.timer = soloLater('chesspuzzle', CHPZ_REPLY_MS + chViewBusyLeft(), () => chPzAutoMove(false));
}

/** The line's next move, played by itself (the reply, or the solution being shown). */
function chPzAutoMove(showing) {
  const s = chPzState();
  if (s.phase !== 'play' || !s.p || s.hist.length >= s.p.moves.length) return;
  if (showing ? !s.showing : (s.result || s.hist.length % 2 === 0)) return;
  s.hist.push(s.p.moves[s.hist.length]);
  saveToLocal();
  chPzPaint();
  chPzAfter();
}

/** Solved: the mark kept, the cheer after the move has landed. */
function chPzSolved(s) {
  s.result = 'solved';
  if (s.mode === 'free' && s.p.level) s.done[s.p.level] = (s.done[s.p.level] || 0) + 1;
  chPzMarkDaily(s, true);
  chPzMistakeMark(s);
  if (typeof chPzSolvedMode === 'function') chPzSolvedMode(s);
  chPzStageFlash('good');
  const uid = s.uid;
  setTimeout(() => {
    if (appState.currentView !== 'play-chesspuzzle' || chPzState().uid !== uid) return;
    const stage = document.getElementById('chesspuzzle-stage');
    afterReveal(stage, () => {
      duelSound('win');
      if (typeof confetti === 'function' && !motionOff()) confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
    });
    if (s.mode === 'daily') setTimeout(() => { if (appState.currentView === 'play-chesspuzzle' && chPzState().uid === uid) chPzDailySheet(chPzState()); }, 1100);
    if (typeof chPzSolvedAfter === 'function') chPzSolvedAfter(s);
  }, chViewBusyLeft() + 450);
}

/* --- the hint and the solution ----------------------------------------------------- */

/** 💡: the piece to move, circled (the puzzle is no longer clean). */
function chPzHint() {
  const s = chPzState();
  if (!chPzCanMove(s) || !chPzHintOn(s)) return;
  s.hint = s.hist.length;
  haptic('light');
  saveToLocal();
  chPzPaint();
}

const chPzHintOn = (s) => s.mode !== 'streak';

/** The piece the line moves next, for the hint. */
const chPzHintSq = (s) => { const m = s.p.moves[s.hist.length]; return m ? m.slice(0, 2) : ''; };

/** «شوف الحل»: the rest of the line played on the board, a move at a time. */
function chPzShow() {
  const s = chPzState();
  if (s.phase !== 'play' || !s.p || s.result || s.showing || s.mode === 'streak') return;
  chPzGiveUp(s);
}

function chPzGiveUp(s) {
  chPzStop();
  s.result = 'failed';
  s.shown = true;
  s.showing = true;
  chPzLocal.sel = '';
  chPzMarkDaily(s, false);
  if (typeof chPzFailedMode === 'function') chPzFailedMode(s);
  saveToLocal();
  chPzPaint();
  chPzAfter();
}

/** The solution has been shown to its end. */
function chPzShowDone(s) {
  if (s.mode === 'daily') { const uid = s.uid; soloLater('chesspuzzle', 900, () => { if (chPzState().uid === uid) chPzDailySheet(chPzState()); }); }
  if (typeof chPzShowDoneMode === 'function') chPzShowDoneMode(s);
}

/** «لغز تاني»: the next puzzle of the same kind. */
function chPzNext() {
  const s = chPzState();
  if (typeof chPzNextMode === 'function' && chPzNextMode(s)) return;
  chPzDealFree();
}

/* --- drawing ----------------------------------------------------------------------- */

const chPzSideName = (side) => chT(side ? 'ch_color_b' : 'ch_color_w');

/** The line on top: whose move and what to find, then how it is going. */
function chPzStatus(s, pos) {
  const side = chPzSideName(chPzSide(s));
  if (s.result === 'solved') return chT(s.wrong || s.hint >= 0 ? 'chpz_solved' : 'chpz_solved_clean');
  if (s.mode === 'streak' && s.result === 'failed') return chT('chpz_failed');
  if (s.showing) return chT('chpz_showing');
  if (s.shown) return chT('chpz_shown');
  if (s.result === 'failed') return chT('chpz_failed');
  if (Date.now() < chPzLocal.lockUntil) return chT('chpz_wrong');
  if (s.hist.length % 2 === 1) return chT('chpz_right');
  if (s.hist.length > 0) return chT('chpz_again');
  if (s.p.theme === 'mate' && s.p.mateIn) return chT(s.p.mateIn === 1 ? 'chpz_turn_mate1' : 'chpz_turn_mate', { side: side, n: s.p.mateIn });
  if (s.mode === 'mistake') return chT('chpz_turn_better', { side: side });
  return chT('chpz_turn_win', { side: side });
}

/** The chips over the board: which kind of puzzle, its level and rating. */
function chPzTagsHtml(s) {
  const tags = [];
  if (s.mode === 'mistake') tags.push(`<span class="chpz-tag chpz-tag--mode">📝 ${escapeHTML(chT('chpz_mistakes_title'))}</span>`);
  if (s.mode === 'streak') tags.push(`<span class="chpz-tag chpz-tag--mode">🔥 ${escapeHTML(chT('chpz_streak_title'))}</span>`);
  if (s.mode === 'daily') tags.push(`<span class="chpz-tag chpz-tag--mode">📅 ${escapeHTML(s.archive ? s.archive : chT('chpz_daily_title'))}</span>`);
  if (typeof chPzModeTag === 'function') { const x = chPzModeTag(s); if (x) tags.push(x); }
  if (s.p.level) tags.push(`<span class="chpz-tag">${escapeHTML(chT(['', 'solo_lvl_easy', 'solo_lvl_medium', 'solo_lvl_hard'][s.p.level]))}</span>`);
  if (s.p.rating) tags.push(`<span class="chpz-tag chpz-tag--rating"><span aria-hidden="true">⭐</span> <b class="metric" dir="ltr">${s.p.rating}</b></span>`);
  return `<div class="chpz-tags">${tags.join('')}</div>`;
}

/** The moves played so far in the puzzle, numbered from its position ("21… ♞g4 22. ♕xg4"). */
function chPzLineHtml(s, pos) {
  if (!pos.sans.length) return '';
  const parts = String(s.p.fen).split(' ');
  let num = Number(parts[5]) || 1;
  let turn = parts[1] === 'b' ? 1 : 0;
  const out = [];
  pos.sans.forEach((san, k) => {
    if (turn === 0) out.push(`<span class="chpz-line__n">${num}.</span>`);
    else if (k === 0) out.push(`<span class="chpz-line__n">${num}…</span>`);
    out.push(`<b class="chpz-line__mv${k % 2 ? ' is-reply' : ''}">${escapeHTML(chFigurine(san))}</b>`);
    if (turn === 1) num++;
    turn = 1 - turn;
  });
  return `<p class="chpz-line" dir="ltr">${out.join(' ')}</p>`;
}

function chPzBarHtml(s) {
  const btns = [];
  if (!s.result && !s.showing) {
    if (chPzHintOn(s)) btns.push(`<button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="chPzHint()" ${chPzCanMove(s) && s.hint !== s.hist.length ? '' : 'disabled'}>💡 ${escapeHTML(chT('chpz_hint'))}</button>`);
    if (s.mode !== 'streak') btns.push(`<button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="chPzShow()">👀 ${escapeHTML(chT('chpz_show'))}</button>`);
  }
  const done = (s.result && !s.showing) ? (typeof chPzDoneBarHtml === 'function' ? chPzDoneBarHtml(s) : '') ||
    `<button type="button" class="btn btn--primary btn--lg" onclick="chPzNext()">🧩 ${escapeHTML(chT('chpz_next'))}</button>` : '';
  const hint = s.hint === s.hist.length && !s.result && chPzHintSq(s)
    ? `<p class="ch-hintline">💡 ${escapeHTML(chT('chpz_hint_line', { piece: chPieceName('pnbrqk'[((chPzGame(s).g.board[chSqIndex(chPzHintSq(s))] & 7) || 1) - 1]) }))}</p>` : '';
  return `${hint}${done ? `<div class="btn-stack">${done}</div>` : ''}${btns.length ? `<div class="ch-bar__row">${btns.join('')}</div>` : ''}`;
}

function chPzPaint(opts) {
  const o = opts || {};
  const s = chPzState();
  const el = document.getElementById('chesspuzzle-stage');
  if (!el || !s.p) return;
  if (!el.querySelector('.ch-game') || el._chLang !== appState.lang) { el.innerHTML = chLayoutHtml(); el._chLang = appState.lang; el.querySelector('.ch-game').classList.add('chpz'); }
  const pos = chPzGame(s);
  const side = chPzSide(s);
  const can = chPzCanMove(s);
  const ctx = {
    g: pos.g, side: side, sel: chPzLocal.sel,
    setSel: (sq) => { chPzLocal.sel = sq; chPzPaint(); },
    play: (from, to, promo) => chPzPlay({ from: from, to: to, promo: promo || '' }, false),
    redraw: () => chPzPaint()
  };
  const marks = [];
  if (chPzLocal.flash) marks.push({ sq: chPzLocal.flash.sq, kind: chPzLocal.flash.kind === 'bad' ? 'mine' : 'theirs' });
  if (s.hint === s.hist.length && !s.result && chPzHintSq(s)) marks.push({ sq: chPzHintSq(s), kind: 'user' });
  const status = chessStatus(pos.g);
  const model = {
    key: 'puz|' + s.uid,
    board: pos.g.board, orient: side, loud: true,
    last: pos.last ? { from: pos.last.from, to: pos.last.to } : null,
    anim: pos.last ? Object.assign({ key: s.uid + '|' + pos.last.n, still: !!o.still }, pos.last) : null,
    check: chessCheckSq(pos.g),
    mate: status.over && status.reason === 'mate' ? chMateKing(pos.g) : '',
    sel: can ? chPzLocal.sel : '',
    targets: can ? chTargets(pos.g, chPzLocal.sel) : [],
    marks: marks, arrows: [], lost: pos.lost,
    input: can ? {
      canMove: true, side: side,
      onPick: (sq, fromDrag) => chTapLogic(ctx, sq, fromDrag),
      onDrop: (from, to) => {
        // A promotion (or a move that isn't legal) goes the usual way; any other drop is judged here, so a
        // wrong one is refused and slides back with its shake.
        const legal = chessLegalMoves(pos.g).filter(mv => mv.from === from && mv.to === to);
        if (!legal.length || legal.some(mv => mv.promo)) return chDropLogic(ctx, from, to);
        chPzLocal.sel = '';
        return chPzPlay({ from: from, to: to, promo: '' }, true);
      }
    } : null
  };
  chViewShow(el.querySelector('[data-ch-host]'), model);
  const wrongNow = Date.now() < chPzLocal.lockUntil;
  const cls = s.result === 'solved' ? 'is-good' : (wrongNow || s.result === 'failed') ? 'is-bad' : '';
  chSetHtml(el, '[data-ch-head]', (typeof chPzHeadExtraHtml === 'function' ? chPzHeadExtraHtml(s) : '') + chPzTagsHtml(s) +
    `<p class="duel-status chpz-status ${cls}">${escapeHTML(chPzStatus(s, pos))}</p>`);
  chSetHtml(el, '[data-ch-bar]', chPzBarHtml(s));
  chSetHtml(el, '[data-ch-side]', chPzLineHtml(s, pos) + (typeof chPzSideExtraHtml === 'function' ? chPzSideExtraHtml(s) : '') +
    `<div class="duel-actions"><button type="button" class="btn btn--ghost btn--sm" onclick="setupChessPuzzles()">${escapeHTML(chT('exit'))}</button></div>`);
}

/* --- the setup screen ---------------------------------------------------------------- */

function chPzSetLevel(level) {
  const s = chPzState();
  s.level = [1, 2, 3].indexOf(Number(level)) === -1 ? 1 : Number(level);
  saveToLocal();
  paintChessPuzzlesSetup();
}

function paintChessPuzzlesSetup() {
  const s = chPzState();
  document.querySelectorAll('#chpz-level .segmented__item').forEach(el => el.classList.toggle('is-active', Number(el.dataset.value) === Number(s.level || 1)));
  const hint = document.getElementById('chpz-level-hint');
  if (hint) {
    const n = (s.done || {})[s.level || 1] || 0;
    hint.textContent = chT('chpz_level_hint_' + (s.level || 1)) + (n ? ' · ' + chT('chpz_solved_n', { n: n }) : '');
  }
  const ways = document.getElementById('chpz-ways');
  if (ways) ways.innerHTML = typeof chPzWaysHtml === 'function' ? chPzWaysHtml(s) : '';
  const cont = document.getElementById('chpz-continue');
  if (cont) cont.classList.toggle('hidden', !(s.phase === 'play' && s.p && !s.result && s.mode !== 'streak'));
}

/* --- a reload -------------------------------------------------------------------- */

/** After a reload: the same puzzle at the same move, the reply (or the solution) carrying on. */
function restoreChessPuzzle() {
  const s = chPzState();
  if (s.phase !== 'play' || !s.p || !s.p.fen) return false;
  chPzLocal.sel = '';
  chPzLocal.lockUntil = 0;
  chPzPaint({ still: true });
  setTimeout(chPzAfter, 0);
  return true;
}

/* ============================================================================
   لغز اليوم - the puzzle of the day (تحدي اليوم)
   ----------------------------------------------------------------------------
   One puzzle a day, the same on every phone: medium on most days, easy on
   Saturday and hard on Friday, picked with the day's seed from its level. It
   is played once, as every daily (JS_Solo.html): started again it comes back
   to where it was left, and a free puzzle dealt over it sets it aside. Its
   result is { solved, tries, hint }: tries is 1 + the wrong moves, and a
   solution shown is a puzzle given up.
   ========================================================================= */

/** Today's level: 1 on Saturday, 3 on Friday, 2 otherwise (the day of the archive when one is played). */
function chPzDailyLevel(day) {
  const p = String(day || soloToday()).split('-').map(Number);
  const wd = new Date(p[0], p[1] - 1, p[2]).getDay();
  return wd === 6 ? 1 : wd === 5 ? 3 : 2;
}

/** Today's puzzle from the bank (the seed and the level from the day). */
function chPzDailyPuzzle(day) {
  const bank = chPzBank(chPzDailyLevel(day));
  const rnd = soloRng(soloDaySeed('chesspuzzle', day));
  return bank[Math.floor(rnd() * bank.length)] || null;
}

/** «لغز اليوم»: carries on with it if it was begun, else puts it on the board. */
function chPzStartDaily() {
  // Resuming a daily that was set aside puts its board back without going through
  // chPzBegin, so a streak puzzle on the board is put aside here first (as chPzBegin would).
  const s0 = chPzState();
  if (s0.mode === 'streak' && s0.streak && !s0.streak.over && s0.p && !s0.result && s0.phase === 'play') {
    s0.streak.saved = { p: s0.p, hist: s0.hist.slice(), uid: s0.uid };
  }
  if (soloDailyResume('chesspuzzle')) return;
  // Played once: today's is done (a past day from the archive is played there, soloArchiveDay set).
  if (!soloArchiveDay && soloDailyResult('chesspuzzle')) { showToast(chT('daily_done_today'), 'info'); return; }
  const go = () => {
    const p = chPzDailyPuzzle();
    if (p) chPzBegin({ mode: 'daily', p: chPzCopy(p), daily: soloToday() });
  };
  if (chPzAsk(go)) return;
  go();
}

/** The day's result as the hub and the share say it. */
function chPzDailyLine(r) {
  if (!r || !r.solved) return '♟️ ❌';
  if (r.hint) return '♟️ 💡';
  return r.tries > 1 ? '♟️ ✅ ' + r.tries : '♟️ ✅';
}

/** The result kept (the first one only), under the day the daily was started. */
function chPzMarkDaily(s, solved) {
  if (s.mode !== 'daily' || !s.daily) return;
  soloMarkDaily('chesspuzzle', { solved: !!solved, tries: (s.wrong || 0) + 1, hint: s.hint >= 0 }, s.daily);
}

/** The result sheet of the daily (and of a past day from the archive), once the board has had its moment. */
function chPzDailySheet(s) {
  const t = TRANSLATIONS[appState.lang] || {};
  const day = s.daily || s.archive || '';
  const r = { solved: s.result === 'solved', tries: (s.wrong || 0) + 1, hint: s.hint >= 0 };
  const line = chPzDailyLine(r);
  const lines = [escapeHTML(r.solved ? (r.hint ? chT('chpz_daily_hint') : r.tries > 1 ? chT('chpz_daily_tries', { n: r.tries }) : chT('chpz_daily_first')) : chT('chpz_daily_gaveup'))];
  soloResult({
    icon: '♟️', title: chT('chpz_daily_title'), valueText: line, lines: lines, win: r.solved,
    share: s.daily ? `${soloShareHeader(t, s.daily)}\n♟️ ${chT('chpz_daily_title')}: ${line}` : '',
    again: () => chPzDealFree(), againLabel: '🧩 ' + chT('chpz_next'), exit: setupChessPuzzles
  });
}

/** The ways in at the top of the setup screen: the puzzle of the day (and the others as they come). */
function chPzWaysHtml(s) {
  const rows = [];
  const done = soloDailyResult('chesspuzzle');
  const going = !done && soloDailyInProgress('chesspuzzle');
  rows.push(chPzWayHtml('📅', chT('chpz_daily_title'), done ? chT('daily_done_today') : chT('chpz_daily_desc_' + chPzDailyLevel()),
    done ? `<b class="metric">${escapeHTML(chPzDailyLine(done))}</b>` : `<span class="badge">${escapeHTML(chT(going ? 'daily_continue' : 'daily_play'))}</span>`,
    done ? '' : 'chPzStartDaily()', !!done));
  if (typeof chPzMoreWaysHtml === 'function') rows.push(chPzMoreWaysHtml(s));
  return rows.join('');
}

/** One way in, as a row of the tools' kind. */
function chPzWayHtml(icon, name, desc, status, onclick, disabled) {
  return `<button type="button" class="tool-item chpz-way${disabled ? ' is-done' : ''}" ${onclick ? `onclick="${onclick}"` : ''} ${disabled ? 'disabled' : ''}>
      <span class="tool-icon" aria-hidden="true">${icon}</span>
      <span class="tool-info"><span class="tool-name">${escapeHTML(name)}</span><span class="tool-desc">${escapeHTML(desc)}</span></span>
      <span class="chpz-way__status">${status}</span>
    </button>`;
}

/* ============================================================================
   سلسلة الألغاز - the puzzle streak
   ----------------------------------------------------------------------------
   Three hearts and no clock. The first puzzle is rated about 500, and each
   one solved moves the target up by 60 to 80: the next is the unseen puzzle
   nearest to it (one of the five nearest, so two runs aren't the same). A
   wrong move costs a heart and ends that puzzle - its solution is played, and
   the next one comes on a tap; no hint and no "show the solution" here. The
   third wrong move ends the run: the score is the puzzles solved, the best kept
   with soloRecord('chesspuzzle', 'streak'). The run lives in s.streak, so a
   reload keeps it; a free puzzle or the daily dealt in the middle puts the
   streak's puzzle aside (s.streak.saved) and "continue" brings it back.
   ========================================================================= */

const CHPZ_STREAK_LIVES = 3;
const CHPZ_STREAK_START = 500;
const CHPZ_RECENT = 300;          // puzzles the streak has dealt lately, not dealt again before the rest

/** Is a run going on (not over)? */
const chPzStreakLive = (s) => !!(s.streak && !s.streak.over);

/** «سلسلة الألغاز»: carries on with a run, or starts one. */
function chPzStartStreak(fresh) {
  const s = chPzState();
  if (!fresh && chPzStreakLive(s)) { chPzStreakContinue(s); return; }
  s.streak = { lives: CHPZ_STREAK_LIVES, score: 0, target: CHPZ_STREAK_START, seen: [], marks: [], over: false, saved: null };
  chPzStreakDeal(s);
}

function chPzStreakContinue(s) {
  const st = s.streak;
  if (s.mode === 'streak' && s.p && s.phase === 'play') { setView('play-chesspuzzle'); chPzPaint({ still: true }); chPzAfter(); return; }
  if (st.saved && st.saved.p) {
    // Back to the streak's own puzzle, where it was left.
    soloDailySetAside('chesspuzzle');
    soloNewGame('chesspuzzle');
    chPzStop();
    Object.assign(s, { mode: 'streak', p: st.saved.p, hist: st.saved.hist || [], uid: st.saved.uid, wrong: 0, hint: -1, shown: false, showing: false, result: '', phase: 'play', daily: '', from: null });
    st.saved = null;
    chPzLocal.sel = '';
    chPzLocal.lockUntil = 0;
    saveToLocal();
    setView('play-chesspuzzle');
    chPzPaint({ still: true });
    chPzAfter();
    return;
  }
  chPzStreakDeal(s);
}

/** The next puzzle of the run: the unseen one nearest to the target rating. */
function chPzStreakDeal(s) {
  const st = s.streak;
  const all = typeof CHESS_PUZZLES !== 'undefined' ? CHESS_PUZZLES : [];
  const inRun = new Set(st.seen);
  const recent = new Set(s.streakRecent || []);
  let pool = all.filter(p => !inRun.has(p.id) && !recent.has(p.id));
  if (pool.length < 20) pool = all.filter(p => !inRun.has(p.id));
  const near = pool.slice().sort((a, b) => Math.abs(a.rating - st.target) - Math.abs(b.rating - st.target)).slice(0, 5);
  const p = near[Math.floor(Math.random() * near.length)];
  if (!p) { chPzStreakFinish(s); return; }
  st.seen.push(p.id);
  s.streakRecent = (s.streakRecent || []).concat(p.id).slice(-CHPZ_RECENT);
  chPzBegin({ mode: 'streak', p: chPzCopy(p) });
}

/** A wrong move in the streak: a heart, and the puzzle is over (its solution is played next). */
function chPzWrongMode(s) {
  if (s.mode !== 'streak' || !s.streak) return;
  s.streak.lives = Math.max(0, s.streak.lives - 1);
  s.streak.marks.push('❌');
  s.result = 'failed';
  s.shown = true;
  s.showing = true;
}

/** A solved one: the score, and the next target 60-80 higher. */
function chPzSolvedMode(s) {
  if (s.mode !== 'streak' || !s.streak) return;
  s.streak.score++;
  s.streak.marks.push('✅');
  s.streak.target += 60 + Math.floor(Math.random() * 21);
}

/** The solution of a missed puzzle has been played: the end of the run after the third heart. */
function chPzShowDoneMode(s) {
  if (s.mode !== 'streak' || !s.streak || s.streak.lives > 0 || s.streak.over) return;
  const uid = s.uid;
  soloLater('chesspuzzle', 900, () => { if (chPzState().uid === uid) chPzStreakFinish(chPzState()); });
}

/** «اللغز اللي بعده» in the streak. */
function chPzNextMode(s) {
  if (s.mode === 'mistake') { chPzMistakeNext(s); return true; }
  if (s.mode !== 'streak' || !s.streak) return false;
  if (s.streak.lives <= 0 || s.streak.over) chPzStreakFinish(s);
  else chPzStreakDeal(s);
  return true;
}

/** The end of the run: the score, the best, the sheet to share. */
function chPzStreakFinish(s) {
  const st = s.streak;
  if (!st) return;
  const first = !st.over;
  st.over = true;
  const rec = first ? soloRecord('chesspuzzle', 'streak', { score: st.score }, (a, b) => a.score > b.score) : { record: false, prev: soloBest('chesspuzzle', 'streak') };
  st.record = first ? rec.record : !!st.record;
  saveToLocal();
  const lines = [];
  if (st.marks.length) lines.push(`<span dir="ltr">${st.marks.join('')}</span>`);
  if (rec.prev && !st.record) lines.push(escapeHTML(chT('chpz_streak_best', { n: rec.prev.score })));
  soloResult({
    icon: '♟️', title: st.record && st.score ? chT('solo_new_best') : chT('chpz_streak_over'),
    value: st.score, valueLabel: chT('chpz_streak_solved'), lines: lines, win: !!(st.record && st.score), quiet: !first,
    share: `♟️ ${chT('chpz_streak_title')}: ${st.score}`,
    again: () => chPzStartStreak(true), againLabel: '🔥 ' + chT('chpz_streak_again'), exit: setupChessPuzzles
  });
  if (appState.currentView === 'play-chesspuzzle') chPzPaint({ still: true });
}

/** The hearts and the score over the board. */
function chPzHeadExtraHtml(s) {
  if (s.mode !== 'streak' || !s.streak) return '';
  const st = s.streak;
  const hearts = Array.from({ length: CHPZ_STREAK_LIVES }, (_, i) => `<span class="streak-heart${i < st.lives ? '' : ' is-lost'}" data-h="${i}">${i < st.lives ? '❤️' : '🤍'}</span>`).join('');
  return soloBarHtml([
    { label: chT('streak_lives'), value: `<span class="streak-hearts" id="chpz-hearts">${hearts}</span>` },
    { label: chT('chpz_streak_solved'), value: st.score, id: 'chpz-score' }
  ]);
}

/** A heart lost jumps; a puzzle solved makes the score jump. */
function chPzStreakPop(s, lost) {
  if (s.mode !== 'streak' || !s.streak || motionOff()) return;
  const el = lost ? document.querySelector(`#chpz-hearts [data-h="${s.streak.lives}"]`) : document.getElementById('chpz-score');
  if (el && el.animate) el.animate(lost ? [{ transform: 'scale(1.6) rotate(-12deg)' }, { transform: 'scale(0.8) rotate(8deg)' }, { transform: 'none' }] : [{ transform: 'scale(1)' }, { transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: lost ? 520 : 360, easing: 'ease-out' });
}

function chPzDoneBarHtml(s) {
  if (s.mode === 'mistake') {
    return `<button type="button" class="btn btn--primary btn--lg" onclick="chPzNext()">📝 ${escapeHTML(chT('chpz_mistakes_next'))}</button>` +
      (s.from ? `<button type="button" class="btn btn--secondary" onclick="chPzBackToReview()">📊 ${escapeHTML(chT('chpz_back_review'))}</button>` : '');
  }
  if (s.mode !== 'streak' || !s.streak) return '';
  if (s.streak.lives <= 0 || s.streak.over) return `<button type="button" class="btn btn--primary btn--lg" onclick="chPzStreakFinish(chPzState())">🏁 ${escapeHTML(chT('solo_look_result'))}</button>`;
  return `<button type="button" class="btn btn--primary btn--lg" onclick="chPzNext()">➡️ ${escapeHTML(chT('chpz_streak_next'))}</button>`;
}

/** The streak's way in: the best so far, or "continue" for a run going on. */
function chPzMoreWaysHtml(s) {
  const best = soloBest('chesspuzzle', 'streak');
  const live = chPzStreakLive(s);
  const status = live ? `<span class="badge">${escapeHTML(chT('daily_continue'))}</span>`
    : best ? `<span class="badge badge--success">🏆 <b class="metric">${best.score}</b></span>` : `<span class="badge">${escapeHTML(chT('daily_play'))}</span>`;
  let out = chPzWayHtml('🔥', chT('chpz_streak_title'), chT('chpz_streak_desc'), status, 'chPzStartStreak()', false);
  if (typeof chPzMistakeWayHtml === 'function') out += chPzMistakeWayHtml(s);
  return out;
}

/* ============================================================================
   ألغاز من أخطائك - puzzles from your own mistakes
   ----------------------------------------------------------------------------
   Every kept game with its review (ashryChessGames_v1, JS_ChessReview.html):
   each move the review called a mistake or a blunder, when it was yours - your
   side against the computer or in a room, either side two on one phone - is a
   one-move puzzle: the position before it, your side to move, the engine's
   best move the answer. Any other move is right too when it is within 50
   centipawns of the best: the position after it and the position after the
   best are analysed alike (CH_REVIEW_NODES each) and compared - a second line
   of one analysis can't say it (chessAnalyse gives moves outside its lines a
   bound, not a score). The move played in the game is always wrong. The newest
   game first; one solved is marked (s.mSolved) and goes to the end.
   The review's «جرّبها كلغز» opens one move of any reviewed game this way.
   ========================================================================= */

const CHPZ_ALT_CP = 50;
let chPzMistakeCache = { raw: null, list: [] };

/** One reviewed move of a kept game as a puzzle (null when it isn't one). */
function chPzFromRecord(rec, i, positions) {
  const m = rec.review && rec.review.moves && rec.review.moves[i];
  const pos = positions && positions[i];
  if (!m || !m.best || !pos || !rec.moves[i]) return null;
  const g = chessCloneGame(pos);
  if (chessStatus(g).over) return null;
  const best = m.best.from + m.best.to + (m.best.promo || '');
  const after = chessCloneGame(g);
  const info = chessPlay(after, chessFromUci(best));
  if (!info) return null;
  const mate = info.status && info.status.reason === 'mate';
  return {
    id: 'm:' + rec.id + ':' + i, fen: chessFen(g), moves: [best], theme: mate ? 'mate' : 'material', mateIn: mate ? 1 : 0,
    level: 0, rating: 0, alt: true, played: rec.moves[i], cls: m.cls, game: rec.id, ply: i + 1
  };
}

/** Every puzzle from this phone's own mistakes, newest game first (worked out again only when the kept games change). */
function chPzMistakeList() {
  let raw = '';
  try { raw = localStorage.getItem(typeof CH_GAMES_KEY !== 'undefined' ? CH_GAMES_KEY : 'ashryChessGames_v1') || ''; } catch (e) { raw = ''; }
  if (raw === chPzMistakeCache.raw) return chPzMistakeCache.list;
  const out = [];
  const fens = new Set();
  (typeof chLoadGames === 'function' ? chLoadGames() : []).forEach(rec => {
    const moves = rec.review && rec.review.moves;
    if (!moves || !rec.moves) return;
    const mine = (c) => (rec.mode === 'friend' ? true : (rec.me === 0 || rec.me === 1) && c === rec.me);
    const idx = [];
    // The first two moves each from the usual start are left out: there nearly every move is as good
    // as the best, and "find a better first move" is no puzzle (the review's own button still offers them).
    const opening = !rec.start || rec.start === CHESS_START_FEN ? 4 : 0;
    moves.forEach((m, i) => { if (i >= opening && (m.cls === 'mistake' || m.cls === 'blunder') && m.best && mine(m.color)) idx.push(i); });
    if (!idx.length) return;
    let positions = null;
    try { positions = chessReviewBegin(rec).positions; } catch (e) { return; }
    idx.forEach(i => {
      const p = chPzFromRecord(rec, i, positions);
      if (!p) return;
      const key = p.fen.split(' ').slice(0, 4).join(' ');
      if (fens.has(key)) return;
      fens.add(key);
      out.push(p);
    });
  });
  chPzMistakeCache = { raw: raw, list: out };
  return out;
}

/** The list in the order it is played: the ones not solved yet first. */
function chPzMistakeOrder(s) {
  const solved = s.mSolved || {};
  const list = chPzMistakeList();
  return list.filter(p => !solved[p.id]).concat(list.filter(p => solved[p.id]));
}

const chPzMistakeLeft = (s) => chPzMistakeList().filter(p => !(s.mSolved || {})[p.id]).length;

/** «ألغاز من أخطائك»: the first one not solved yet (or the first of all, to go round again). */
function chPzStartMistakes() {
  const s = chPzState();
  const order = chPzMistakeOrder(s);
  if (!order.length) { showToast(chT('chpz_mistakes_none'), 'info'); return; }
  const go = () => chPzBegin({ mode: 'mistake', p: Object.assign({}, order[0]) });
  if (chPzAsk(go)) return;
  go();
}

/** The next mistake after the one on the board. */
function chPzMistakeNext(s) {
  const order = chPzMistakeOrder(s);
  const cur = s.p ? s.p.id : '';
  const next = order.find(p => p.id !== cur && !(s.mSolved || {})[p.id]);
  if (!next) { showToast(chT('chpz_mistakes_done'), 'success'); setupChessPuzzles(); return; }
  chPzBegin({ mode: 'mistake', p: Object.assign({}, next) });
}

/** A mistake solved: marked, so it goes to the end of the list. */
function chPzMistakeMark(s) {
  if (s.mode !== 'mistake' || !s.p) return;
  s.mSolved = s.mSolved || {};
  s.mSolved[s.p.id] = Date.now();
}

/** The score after a move for the side that made it, from one analysis of the position after it. */
function chPzScoreAfter(gAfter) {
  const a = chessAnalyse(gAfter, { nodes: typeof CH_REVIEW_NODES !== 'undefined' ? CH_REVIEW_NODES : 20000 });
  return a.over ? (a.mated ? CHESS_MATE - 1 : 0) : -a.score;
}

/** Another move as good as the best (within 50 cp), never the move played in the game. */
function chPzAltOk(s, g, info, mine) {
  const uci = info.from + info.to + (info.promo || '');
  if (uci === s.p.played) return false;
  if (typeof s.p.bestRef !== 'number') {
    const b = chessCloneGame(g);
    if (!chessPlay(b, chessFromUci(s.p.moves[0]))) return false;
    s.p.bestRef = chPzScoreAfter(b);
  }
  return chessClampCp(chPzScoreAfter(mine)) >= chessClampCp(s.p.bestRef) - CHPZ_ALT_CP;
}

/** «جرّبها كلغز» on a mistake in the review: that one position as a puzzle, with a way back. */
function chPzFromReview(k) {
  if (typeof chRv === 'undefined' || !chRv.rec || !chRv.rv) return;
  const rec = Object.assign({}, chRv.rec, { review: chRv.res || chRv.rec.review });
  const p = chPzFromRecord(rec, k, chRv.rv.positions);
  if (!p) return;
  const go = () => chPzBegin({ mode: 'mistake', p: p, from: { id: rec.id, ply: chRv.ply } });
  if (chPzAsk(go)) return;
  go();
}

/** Back to the review this puzzle came from, at the same move. */
function chPzBackToReview() {
  const s = chPzState();
  if (!s.from || typeof chOpenReview !== 'function') return;
  const f = s.from;
  chOpenReview(f.id);
  if (typeof chReviewGo === 'function') chReviewGo(f.ply);
}

/** Under the board: what was played in the game here. */
function chPzSideExtraHtml(s) {
  if (s.mode !== 'mistake' || !s.p || !s.p.played) return '';
  const g = chessFromFen(s.p.fen);
  const info = chessPlay(g, chessFromUci(s.p.played));
  if (!info) return '';
  return `<p class="chpz-played">${s.p.cls ? chClassDot(s.p.cls) : ''} ${escapeHTML(chT('chpz_you_played', { san: '⁦' + chFigurine(info.san) + '⁩', cls: chT('ch_cls_' + (s.p.cls || 'mistake')) }))}</p>`;
}

/** The way in on the setup screen, with how many are left. */
function chPzMistakeWayHtml(s) {
  const list = chPzMistakeList();
  const left = chPzMistakeLeft(s);
  const name = chT('chpz_mistakes_title') + (list.length ? ` (${left || list.length})` : '');
  const desc = !list.length ? chT('chpz_mistakes_none') : left ? chT('chpz_mistakes_desc') : chT('chpz_mistakes_all');
  const status = list.length ? `<span class="badge">${escapeHTML(chT('daily_play'))}</span>` : '';
  return chPzWayHtml('📝', name, desc, status, list.length ? 'chPzStartMistakes()' : '', !list.length);
}

soloRegister('chesspuzzle', {
  setup: 'setup-chesspuzzles', play: 'play-chesspuzzle',
  paintSetup: paintChessPuzzlesSetup, restore: restoreChessPuzzle,
  state: chPzState, resume: chPzContinue, prefs: ['level', 'done', 'nonce', 'streak', 'streakRecent', 'mSolved'],
  // (the streak run, its recent puzzles and the solved mistakes are kept too: a daily
  // brought back must not roll back what was played while it was set aside)
  repaint: () => chPzPaint({ still: true })
});

if (typeof onLeaveScreen === 'function') {
  onLeaveScreen((from, to) => {
    if (from === 'play-chesspuzzle') chPzStop();
    if (to === 'play-chesspuzzle') setTimeout(chPzAfter, 0);
  });
}
</script>
