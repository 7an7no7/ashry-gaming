<script>
/* ============================================================================
   شمس وقمر — TANGO
   ----------------------------------------------------------------------------
   A 6×6 grid of ☀️ and 🌙. Every row and column holds three of each, never
   three of the same side by side, and the signs between cells hold: = means
   the two are the same, × means they differ. A tap cycles ☀️ → 🌙 → empty.
   One step can be taken back (↶); clearing the board and dealing a new one
   over a game in progress both ask first.

   The grid is made in Tango.js (shared with the rooms server, which deals a
   race's grid): a full valid grid, then the fewest clues that leave one
   solution. The daily comes from the seed. The board is in appState.tango.

   In سباق ألغاز (RACE_UI.tango, JS_RoomRace.html) the same grid and taps play
   the room's puzzle: the state is the race's (soloRaceState), the stage the
   race screen's (soloStage), every change is sent as `move { cells }` and
   the server says when the grid is the solution. No hint in a race.
   ========================================================================= */

let tangoTimer = null;

function tangoState() {
  const race = soloRaceState('tango');
  if (race) return race;
  if (!appState.tango) {
    appState.tango = { level: 'easy', daily: '', solution: [], givens: [], signs: [], cells: [], undo: null, hints: 0, startedAt: 0, pausedAt: 0, phase: 'setup' };
  }
  return appState.tango;
}

/* --- Setup and play --------------------------------------------------------------- */

function setupTango() {
  tangoStopTimer();
  setView('setup-tango');
}

function paintTangoSetup() {
  const s = tangoState();
  const t = TRANSLATIONS[appState.lang];
  document.querySelectorAll('#tango-level .segmented__item').forEach(el => el.classList.toggle('is-active', el.dataset.value === s.level));
  const best = soloBest('tango', s.level);
  const el = document.getElementById('tango-best');
  if (el) el.textContent = best ? `${t.solo_best || ''}: ${soloTime(best.seconds)}` : '';
  const cont = document.getElementById('tango-continue');
  if (cont) cont.classList.toggle('hidden', s.phase !== 'play');
  const daily = document.getElementById('tango-daily');
  if (daily) daily.innerHTML = soloDailyButtonHtml('tango', 'startTango(true)');
}

function setTangoLevel(level) {
  tangoState().level = level;
  saveToLocal();
  paintTangoSetup();
}

const tangoHasWork = (s) => (s.cells || []).some((v, i) => v !== (s.givens || [])[i]);

function startTango(daily, sure) {
  if (!sure && soloConfirmNew('tango', tangoHasWork, () => startTango(daily, true))) return;
  if (daily && soloDailyResume('tango')) return;
  soloDailySetAside('tango');
  soloNewGame('tango');
  const s = tangoState();
  const level = daily ? 'medium' : s.level;
  const made = tangoMake(level, soloRandom(daily ? soloDaySeed('tango') : null));
  s.daily = daily ? soloToday() : '';
  s.playLevel = level;
  s.solution = made.solution;
  s.givens = made.givens;
  s.signs = made.signs;
  s.cells = made.givens.slice();
  s.undo = null;
  s.hints = 0;
  s.startedAt = Date.now();
  s.pausedAt = 0;
  s.seconds = 0;
  s.phase = 'play';
  saveToLocal();
  setView('play-tango');
  paintTango();
  tangoArmTimer();
}

function continueTango() {
  if (tangoState().phase !== 'play') return;
  setView('play-tango');
  paintTango();
  tangoArmTimer();
}

function tangoArmTimer() {
  tangoStopTimer();
  tangoTimer = soloClock('tango-time', () => tangoState().startedAt);
}

function tangoStopTimer() {
  if (tangoTimer) tangoTimer.stop();
  tangoTimer = null;
}

function paintTango() {
  const s = tangoState();
  const t = TRANSLATIONS[appState.lang];
  const el = soloStage('tango-stage');
  if (!el || !s.givens.length) return;
  const N = TANGO_N;
  const bad = tangoProblems(s.cells, s.signs);
  const signAt = {};
  s.signs.forEach(x => { signAt[x.a + '-' + x.b] = x.same ? '=' : '×'; });
  const bar = soloBarHtml([
    s.daily ? { label: t.daily_title || '', value: '📅' } : { label: t.solo_level || '', value: escapeHTML(t['solo_lvl_' + (s.playLevel || s.level)] || '') },
    { label: t.solo_time || '', value: soloTime(s.phase === 'play' ? (Date.now() - s.startedAt) / 1000 : s.seconds), id: 'tango-time' }
  ]);
  el.innerHTML = `
    <div class="solo-layout">
      <div class="solo-layout__board">
        <div class="tango-grid" id="tango-grid" dir="ltr">
          ${s.cells.map((v, i) => {
            const right = i % N < N - 1 ? signAt[i + '-' + (i + 1)] : '';
            const down = i + N < N * N ? signAt[i + '-' + (i + N)] : '';
            const cls = ['tango-cell', s.givens[i] ? 'is-given' : '', bad.has(i) ? 'is-bad' : ''].filter(Boolean).join(' ');
            return `<button type="button" class="${cls}" data-i="${i}" onclick="tapTango(${i})">
                      <span class="tango-mark">${v === 1 ? '☀️' : v === 2 ? '🌙' : ''}</span>
                      ${right ? `<i class="tango-sign tango-sign--right">${right}</i>` : ''}
                      ${down ? `<i class="tango-sign tango-sign--down">${down}</i>` : ''}
                    </button>`;
          }).join('')}
        </div>
      </div>
      <div class="solo-layout__side">
        ${bar}
        <p class="field__hint" style="text-align:center">${escapeHTML(t.tango_hint || '')}</p>
        <div class="sdk-tools">
          <button type="button" class="btn btn--neutral btn--sm" onclick="undoTango()" ${s.undo && s.phase === 'play' ? '' : 'disabled'}>↶ ${escapeHTML(t.solo_undo || '')}</button>
          <button type="button" class="btn btn--neutral btn--sm" onclick="clearTango()">🧹 ${escapeHTML(t.queens_clear || '')}</button>
          ${s.race ? '' : `<button type="button" class="btn btn--neutral btn--sm" onclick="hintTango()">💡 ${escapeHTML(t.solo_hint || '')}</button>`}
        </div>
      </div>
    </div>
    ${s.race ? '' : `<div class="view-actions">
      <button class="btn btn--ghost btn--sm" onclick="setupTango()">${escapeHTML(t.exit || '')}</button>
    </div>`}`;
}

function tapTango(i) {
  const s = tangoState();
  if (s.phase !== 'play' || s.givens[i]) return;
  s.undo = s.cells.slice();
  s.cells[i] = (s.cells[i] + 1) % 3;
  saveToLocal();
  paintTango();
  tangoCheck();
}

/** Back to the givens, after asking: it is every mark at once. */
function clearTango(sure) {
  const s = tangoState();
  if (s.phase !== 'play' || !tangoHasWork(s)) return;
  if (!sure) {
    const t = TRANSLATIONS[appState.lang] || {};
    showConfirmModal(t.solo_clear_confirm || 'تمسح كل اللي على اللوحة؟', () => clearTango(true));
    return;
  }
  s.undo = s.cells.slice();
  s.cells = s.givens.slice();
  saveToLocal();
  paintTango();
  tangoCheck();
}

/** Takes back the last change: a tap, a clear or a hint. */
function undoTango() {
  const s = tangoState();
  if (s.phase !== 'play' || !s.undo) return;
  s.cells = s.undo;
  s.undo = null;
  saveToLocal();
  paintTango();
  tangoCheck();
}

function hintTango() {
  const s = tangoState();
  if (s.phase !== 'play' || s.race) return;
  let i = s.cells.findIndex((v, k) => v && v !== s.solution[k]);
  if (i === -1) i = s.cells.findIndex(v => !v);
  if (i === -1) return;
  s.undo = s.cells.slice();
  s.cells[i] = s.solution[i];
  s.hints = (s.hints || 0) + 1;
  saveToLocal();
  paintTango();
  tangoCheck();
}

/** A solved grid: every cell turns over, corner to corner. */
function tangoCelebrate() {
  if (motionOff()) return 0;
  document.querySelectorAll('#tango-grid .tango-cell').forEach(cell => {
    const i = Number(cell.dataset.i);
    if (cell.animate) cell.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(180deg)' }, { transform: 'rotateY(360deg)' }],
      { duration: 520, delay: (Math.floor(i / TANGO_N) + i % TANGO_N) * 45, easing: 'ease-in-out' });
  });
  return 1000;
}

function tangoCheck() {
  const s = tangoState();
  if (s.phase !== 'play') return;
  // A race: the server holds the solution and judges the grid (JS_RoomRace.html).
  if (s.race) { raceMove('tango', { cells: s.cells.slice() }); return; }
  if (s.cells.some((v, i) => v !== s.solution[i])) return;
  tangoStopTimer();
  s.phase = 'done';
  const seconds = Math.round((Date.now() - s.startedAt) / 1000);
  s.seconds = seconds;
  s.undo = null;
  saveToLocal();
  paintTango();
  const t = TRANSLATIONS[appState.lang];
  tangoCelebrate();
  const level = s.playLevel || s.level;
  const rec = s.hints || s.archive ? { record: false, prev: soloBest('tango', level) }
    : soloRecord('tango', level, { seconds: seconds }, (a, b) => a.seconds < b.seconds);
  let share = '';
  if (s.daily) {
    soloMarkDaily('tango', { seconds: seconds, hints: s.hints || 0 }, s.daily);
    share = `${soloShareHeader(t, s.daily)}\n☀️ ${t.setup_tango || ''} ✅ ${soloTime(seconds)}${s.hints ? ' · 💡 ' + s.hints : ''}`;
  }
  const lines = [];
  if (s.hints) lines.push(`💡 ${escapeHTML(t.solo_hint || '')}: ${s.hints}`);
  if (rec.prev && !rec.record) lines.push(`${escapeHTML(t.solo_best || '')}: ${soloTime(rec.prev.seconds)}`);
  soloLater('tango', motionOff() ? 0 : 1000, () => soloResult({
    icon: '☀️', title: rec.record ? (t.solo_new_best || '') : (t.solo_solved || ''),
    valueText: soloTime(seconds), valueLabel: t.solo_time || '', lines: lines, win: true, share: share,
    again: () => startTango(false), exit: setupTango
  }));
}

function restoreTango() {
  const s = tangoState();
  if (s.phase !== 'play' || !s.solution.length) return false;
  paintTango();
  tangoArmTimer();
  return true;
}

soloRegister('tango', {
  setup: 'setup-tango', play: 'play-tango', paintSetup: paintTangoSetup, restore: restoreTango,
  state: tangoState, resume: continueTango, repaint: paintTango, timed: true, prefs: ['level']
});

/* --- سباق ألغاز: the same grid, raced (JS_RoomRace.html) ------------------------------ */
RACE_UI.tango = {
  stage: 'tango-stage',
  unit: 'race_unit_cells',
  fresh: (pub) => ({ level: 'medium', playLevel: 'medium', daily: '', solution: [], givens: pub.givens.slice(), signs: pub.signs.slice(),
    cells: pub.givens.slice(), undo: null, hints: 0, seconds: 0 }),
  // A reload: the cells the server last took from this phone are the grid.
  sync(s, board) {
    if (board && Array.isArray(board.cells) && board.cells.length === s.cells.length && !tangoHasWork(s)) s.cells = board.cells.slice();
  },
  paint: () => paintTango(),
  finished: (s, won) => (won ? tangoCelebrate() : 0)
};
</script>
