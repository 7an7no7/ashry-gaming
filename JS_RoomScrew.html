  const cards = (state.you || {}).khoshaf || [];
  return `<p class="skr-prompt is-mine">🥣 ${escapeHTML(skrT('skr_khoshaf_pick', 'اختار كارت من الأربعة، والباقي يروح تحت الورق', 'Take one of the four; the rest go under the deck'))}</p>
    <div class="skr-khoshaf">${cards.map((c, i) => `<button type="button" class="skr-pickcard ${pick && pick.index === i ? 'is-picked' : ''}" onclick="skrPickIndex(${i})">${skrCardHtml(c, { size: 'lg' })}</button>`).join('')}</div>
    <button type="button" class="btn btn--primary" onclick="skrConfirm()" ${skrPickReady(state, pick) ? '' : 'disabled'}>✓ ${escapeHTML(t.confirm || 'تأكيد')}</button>`;
}

/* --- بوم: every other player throws one of their own cards ---------------------------- */

/** A phone that still has to pick its card for بوم. */
function skrBoomWaits(state, pid) {
  const s = state.shared || {};
  const boom = s.boom;
  if (!boom || s.phase !== 'play' || !s.turn || s.turn.stage !== 'boom' || state.youAreScreen) return false;
  return (boom.waiting || []).indexOf(pid) !== -1 && (boom.picked || []).indexOf(pid) === -1;
}

/** Who has picked, by name, never which card: "💣 اختاروا 2/5: …". */
function skrBoomLine(state) {
  const boom = (state.shared || {}).boom || {};
  // `waiting` is who still has to pick, `picked` who has: together, everyone in it.
  const picked = boom.picked || [];
  const sep = appState.lang === 'en' ? ', ' : '، ';
  const head = skrT('skr_boom_picked', 'اختاروا {n}/{m}', 'Picked {n}/{m}', { n: picked.length, m: picked.length + (boom.waiting || []).length });
  return '💣 ' + head + (picked.length ? ': ' + picked.map(pid => '⁨' + skrName(state, pid, true) + '⁩').join(sep) : '');
}

/**
 * The same player's turn again straight after their بوم or their scream:
 * 'boom', 'scream' or null, read from the moves since (the throws don't count).
 */
function skrTurnAgain(state) {
  const s = state.shared || {};
  if (s.phase !== 'play' || !s.turn || s.turn.stage === 'boom') return null;
  const events = skrDealEvents(s.events);
  for (let i = events.length - 1; i >= 0; i--) {
    const e = events[i];
    if (!e || ['boomThrow', 'boomPick', 'ready', 'thiefVote'].indexOf(e.type) !== -1) continue;
    if (e.type === 'boom' || e.type === 'scream') return e.pid === s.turn.pid ? e.type : null;
    return null;
  }
  return null;
}

/**
 * The بوم stage on a phone: a waiting phone picks one of its own face-down
 * cards (and confirms); once in, "اتسجّل - مستنيين الباقي"; the player of
 * بوم and anyone not in it watch who has picked. The host can go on without
 * a phone that went quiet.
 */
function skrBoomHtml(state, ctx) {
  const s = state.shared || {};
  const boom = s.boom || {};
  const me = Room.me;
  const line = `<p class="skr-hint skr-vote__who">${escapeHTML(skrBoomLine(state))}</p>`;
  const host = state.youAreHost
    ? `<button type="button" class="btn btn--ghost btn--sm" onclick="skrAct(this, '${SKR_BOOM_CLOSE}')">⏭️ ${escapeHTML(skrT('skr_boom_close', 'كمّل من غير الباقي', 'Go on without the rest'))}</button>` : '';
  if (skrInGame(state) && skrBoomWaits(state, me)) {
    const pick = skrLocal.pick && skrLocal.pick.kind === 'boomPick' ? skrLocal.pick : skrNewPick('boomPick');
    return `<div class="skr-actbar skr-boom">${skrPickBarHtml(state, pick, ctx)}${line}${host}</div>`;
  }
  const done = skrInGame(state) && (boom.picked || []).indexOf(me) !== -1;
  const head = done
    ? `<p class="skr-prompt is-mine">✓ ${escapeHTML(skrT('skr_boom_done', 'اتسجّل - مستنيين الباقي', 'Picked - waiting for the others'))}</p>`
    : `<p class="skr-prompt"><span class="skr-power">${skrPowerChip('boom')}</span>${escapeHTML(skrT('skr_boom_from', '💣 بوم من {name}: كل واحد بيرمي كارت', '💣 Boom from {name}: everyone throws a card', { name: skrName(state, s.turn.pid, true) }))}</p>`;
  return `<div class="skr-note skr-boom">${head}${line}${host}</div>`;
}

/* --- the thief vote -------------------------------------------------------------- */

const skrVoted = (state) => (((state.shared || {}).thiefVote || {}).voted || []);

/**
 * This phone's vote: `choice` is what is tapped now, `sent` what the room
 * has (a player id, '' for "no thief", undefined when not known - a reload
 * that the server doesn't remind). Kept for the round in sessionStorage.
 */
function skrVoteLocal(state) {
  const s = state.shared || {};
  const key = [state.code, s.dealId || '', s.round || ''].join('|');
  if (skrLocal.vote.key !== key) {
    let sent;
    try {
      const saved = JSON.parse(sessionStorage.getItem(SKR_VOTE_KEY) || 'null');
      if (saved && saved.key === key && typeof saved.sent === 'string') sent = saved.sent;
    } catch (e) {}
    skrLocal.vote = { key: key, choice: undefined, sent: sent, open: false };
  }
  const v = skrLocal.vote;
  const you = state.you || {};
  // A server that tells a phone its own vote back is believed over this phone's memory.
  if (skrVoted(state).indexOf(Room.me) !== -1 && Object.prototype.hasOwnProperty.call(you, 'thiefVote') && you.thiefVote !== undefined) {
    v.sent = you.thiefVote ? String(you.thiefVote) : '';
  }
  return v;
}

function skrVoteSave(v) {
  try { sessionStorage.setItem(SKR_VOTE_KEY, JSON.stringify({ key: v.key, sent: v.sent })); } catch (e) {}
}

/** A choice tapped: picked; tapped again, sent. */
function skrVoteChoose(value) {
  const st = Room.state;
  if (!st || st.game !== 'screw' || (st.shared || {}).phase !== 'thiefGuess') return;
  const v = skrVoteLocal(st);
  if (v.choice === value && v.choice !== v.sent) { skrVoteSend(null); return; }
  v.choice = value;
  haptic('light');
  skrRedraw();
}

function skrVoteOpen(open) {
  const st = Room.state;
  if (!st) return;
  const v = skrVoteLocal(st);
  v.open = !!open;
  v.choice = open ? v.sent : undefined;
  skrRedraw();
}

async function skrVoteSend(btn) {
  const st = Room.state;
  if (!st || st.game !== 'screw' || (st.shared || {}).phase !== 'thiefGuess') return;
  const v = skrVoteLocal(st);
  if (v.choice === undefined) return;
  const was = v.sent;
  const choice = v.choice;
  if (btn && 'disabled' in btn) btn.disabled = true;
  // Said as sent before the room answers, so the frame it pushes back already shows it.
  v.sent = choice;
  v.open = false;
  skrVoteSave(v);
  haptic('medium');
  try {
    await Room.act('thiefVote', { pid: choice || null, seq: (st.shared || {}).turnSeq });
  } catch (err) {
    v.sent = was;
    skrVoteSave(v);
    showToast(err.message || 'تعذر تنفيذ الإجراء', 'error');
  }
  skrRedraw();
}

/** Why the round is over, in one line: the finisher, the سكرو, the last lap. */
function skrRoundEndWords(state) {
  const s = state.shared || {};
  const r = s.results || {};
  const finisher = s.finisher || r.finisher;
  const caller = s.caller || r.caller;
  if (finisher) return skrT('skr_why_finish', '🏁 كروت {name} خلصت', '🏁 {name} is out of cards', { name: skrName(state, finisher, true) });
  if (caller) return skrT('skr_why_screw', '📣 سكرو {name}', '📣 {name} called Screw', { name: skrName(state, caller, true) });
  if (s.lastLap) return skrT('skr_why_last_lap', '💀 آخر لفة خلصت', '💀 The last lap is over');
  return '';
}

/** Who has voted, by name, never what for. */
function skrVotedLine(state) {
  const order = skrOrder(state);
  const voted = skrVoted(state).filter(pid => order.indexOf(pid) !== -1);
  const sep = appState.lang === 'en' ? ', ' : '، ';
  const head = skrT('skr_voted_count', 'صوّتوا {n}/{m}', 'Voted {n}/{m}', { n: voted.length, m: order.length });
  return '🗳️ ' + head + (voted.length ? ': ' + voted.map(pid => '⁨' + skrName(state, pid, true) + '⁩').join(sep) : '');
}

/**
 * The vote on a seated phone: every player, this phone's own name too (or not
 * voting would give its holder away), and "no thief"; then "your vote is in",
 * with a way to change it until the vote closes. The host closes it.
 */
function skrVoteHtml(state) {
  const s = state.shared || {};
  const t = TRANSLATIONS[appState.lang] || {};
  const me = Room.me;
  const seated = skrInGame(state);
  const why = skrRoundEndWords(state);
  const whoLine = `<p class="skr-hint skr-vote__who">${escapeHTML(skrVotedLine(state))}</p>`;
  const close = state.youAreHost
    ? `<button type="button" class="btn btn--ghost btn--sm" onclick="skrAct(this, 'closeThiefVote')">🔒 ${escapeHTML(t.vote_close || skrT('skr_vote_close', 'اقفل التصويت', 'Close the vote'))}</button>` : '';
  const question = escapeHTML(skrT('skr_thief_q', 'مين معاه الحرامي؟', 'Who holds the thief?'));
  if (!seated) {
    return `<div class="skr-note">${why ? `<p class="skr-hint">${escapeHTML(why)}</p>` : ''}<p class="skr-prompt"><span class="skr-power">${skrPowerChip(null, 'mask')}</span>${question}</p>${whoLine}${close}</div>`;
  }
  const v = skrVoteLocal(state);
  const iVoted = skrVoted(state).indexOf(me) !== -1;
  const nameOf = (value) => (value ? skrName(state, value, true) : skrT('skr_no_thief', 'مفيش حرامي', 'No thief'));
  if (iVoted && !v.open) {
    const mine = v.sent !== undefined ? `<p class="skr-summary">${escapeHTML(skrT('skr_vote_yours', 'صوتك: {name}', 'Your vote: {name}', { name: nameOf(v.sent) }))}</p>` : '';
    return `<div class="skr-actbar skr-vote is-sent">
        <p class="skr-prompt is-mine">✓ ${escapeHTML(skrT('skr_vote_done', 'صوتك اتسجّل', 'Your vote is in'))}</p>
        ${mine}
        <button type="button" class="btn btn--secondary btn--sm" onclick="skrVoteOpen(true)">✏️ ${escapeHTML(skrT('skr_vote_change', 'غيّر صوتك', 'Change your vote'))}</button>
        ${whoLine}${close}
      </div>`;
  }
  const btn = (value, label) => {
    const on = v.choice === value;
    const was = v.sent === value;
    return `<button type="button" class="btn ${on ? 'btn--primary' : 'btn--neutral'} btn--sm" aria-pressed="${on}" onclick="skrVoteChoose('${jsStringAttr(value)}')">${was ? '✓ ' : ''}${escapeHTML(label)}</button>`;
  };
  const you = t.vote_you || (appState.lang === 'en' ? 'You' : 'أنت');
  const choices = skrOrder(state).map(pid => btn(pid, skrName(state, pid, true) + (pid === me ? ' (' + you + ')' : '')))
    .concat([btn('', '🙅 ' + skrT('skr_no_thief', 'مفيش حرامي', 'No thief'))]).join('');
  const ready = v.choice !== undefined && !(iVoted && v.choice === v.sent);
  const tie = s.caller ? ' ' + skrT('skr_vote_tie', 'التعادل: صوت اللي قال سكرو يحسم.', "A tie: the caller's vote decides.") : '';
  return `<div class="skr-actbar skr-vote">
      ${why ? `<p class="skr-hint">${escapeHTML(why)}</p>` : ''}
      <p class="skr-prompt is-mine"><span class="skr-power">${skrPowerChip(null, 'mask')}</span>${question}</p>
      <p class="skr-hint skr-vote__rule">${escapeHTML(skrT('skr_vote_hint', 'لو الأغلبية اختارت اللي معاه الحرامي: عليه +25. لو لأ: الحرامي ياخد أقل نتيجة، واللي كانت ليه ياخد +25.', 'If most point at the holder: +25 for the thief. If not, the thief takes the lowest score and whoever had it takes +25.') + tie)}</p>
      <div class="skr-vote__choices">${choices}</div>
      <div class="btn-row">
        <button type="button" class="btn btn--primary" onclick="skrVoteSend(this)" ${ready ? '' : 'disabled'}>✓ ${escapeHTML(iVoted ? skrT('skr_vote_resend', 'غيّر صوتي', 'Change my vote') : skrT('skr_vote_send', 'صوّت', 'Vote'))}</button>
        ${iVoted ? `<button type="button" class="btn btn--ghost btn--auto" onclick="skrVoteOpen(false)">${escapeHTML(t.cancel || 'إلغاء')}</button>` : ''}
      </div>
      ${iVoted ? `<p class="skr-hint">${escapeHTML(skrT('skr_vote_change_hint', 'تقدر تغيّره لحد ما التصويت يتقفل', 'You can change it until the vote closes'))}</p>` : ''}
      ${whoLine}${close}
    </div>`;
}

/**
 * The foot of the phone's table: what to do now. When the move is this
 * phone's, it is a bar that stays at the bottom of the screen while the
 * table scrolls; otherwise a quiet line about whose turn it is.
 */
function skrActionsHtml(state) {
  const s = state.shared || {};
  const you = state.you || {};
  const me = Room.me;
  const inGame = skrInGame(state);
  const pick = skrLocal.pick;
  const bar = (inner) => `<div class="skr-actbar">${inner}</div>`;
  const note = (inner) => `<div class="skr-note">${inner}</div>`;
  const hostBegin = state.youAreHost
    ? `<button type="button" class="btn btn--ghost btn--sm" onclick="skrAct(this, 'beginRound')">▶️ ${escapeHTML(skrT('skr_begin_round', 'ابدأ الجولة', 'Start the round'))}</button>` : '';

  if (s.phase === 'memorize') {
    const ready = s.ready || [];
    const count = escapeHTML(skrT('skr_ready_count', 'جاهزين {n}/{m}', 'Ready {n}/{m}', { n: ready.length, m: skrOrder(state).length }));
    if (inGame && ready.indexOf(me) === -1) {
      return bar(`<p class="skr-prompt is-mine">🧠 ${escapeHTML(skrT('skr_memorize', 'احفظ الكارتين اللي تحت (التالت والرابع)، وبعدها هيتقلبوا', 'Memorise your bottom two cards (the third and fourth); then they turn over'))}</p>
        <button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'ready')">✓ ${escapeHTML(skrT('skr_memorized', 'حفظتهم', 'Got them'))}</button>
        <p class="skr-hint">${count}</p>${hostBegin}`);
    }
    return note(`<p class="skr-prompt">⏳ ${escapeHTML(skrT('skr_waiting_ready', 'مستنيين الباقي يحفظوا', 'Waiting for the others to memorise'))}</p><p class="skr-hint">${count}</p>${hostBegin}`);
  }

  if (s.phase === 'thiefGuess') return skrVoteHtml(state);
  const ctx = { marks: skrHelp(state) ? skrMarks(state) : {}, pick: pick, faces: skrMyFaces(state), help: skrHelp(state) };

  if (s.phase !== 'play' || !s.turn) return '';
  const turn = s.turn;
  if (turn.stage === 'boom') return skrBoomHtml(state, ctx);
  const seenPanel = skrSeenHtml(state, false);

  if (turn.pid !== me || !inGame) {
    const w = skrTurnWords(state);
    const line = `<p class="skr-prompt">${escapeHTML(w.title)}</p>${w.hint ? `<p class="skr-hint">${escapeHTML(w.hint)}</p>` : ''}`;
    return seenPanel && inGame ? bar(seenPanel) + note(line) : note(line);
  }

  const again = skrTurnAgain(state);
  const mineHead = `<p class="skr-prompt is-mine">⭐ ${escapeHTML(again ? (again === 'boom' ? '💣 ' : '😱 ') + skrT('skr_your_turn_again', 'دورك تاني!', 'Your turn again!') : skrT('skr_your_turn', 'دورك!', 'Your turn!'))}</p>`;

  if (turn.stage === 'seeSwap') {
    if (pick && pick.kind === 'seeSwapDo') return bar(skrPickBarHtml(state, pick, ctx));
    return bar(skrSeenHtml(state, true));
  }
  if (turn.stage === 'khoshaf') return bar(skrKhoshafHtml(state, pick));
  if (turn.stage === 'power' && pick) return bar(seenPanel + skrPickBarHtml(state, pick, ctx));
  if (pick && pick.kind !== 'power') return bar(skrPickBarHtml(state, pick, ctx));

  if (turn.stage === 'drawn') {
    const info = skrCardInfo(you.drawn);
    const rule = info && info.drawn;
    // A card taken from الخشاف counts as drawn from the deck: thrown, its power works too.
    const power = info && info.power && info.card.kind === 'command' ? skrPowerInfo(info.power) : null;
    const empty = !((s.hands || {})[me] || []).length;
    const keepBtn = (cls) => empty
      ? `<button type="button" class="btn ${cls}" onclick="skrAct(this, 'keep')">🔁 ${escapeHTML(skrT('skr_keep_new', 'خليه معاك', 'Keep it'))}</button>`
      : `<button type="button" class="btn ${cls}" onclick="skrStartPick('keep')">🔁 ${escapeHTML(skrT('skr_keep', 'بدّله مع كارت', 'Swap it into your hand'))}</button>`;
    const discardBtn = (cls, label) => `<button type="button" class="btn ${cls}" onclick="skrAct(this, 'discard')">${label}</button>`;
    let inner;
    if (rule === 'discard') {
      inner = `<p class="skr-hint tx-warning">⚠️ ${escapeHTML(skrT('skr_must_discard', 'الكارت ده لازم يترمي', 'This card must be thrown'))}</p>${discardBtn('btn--primary btn--lg', '⬇️ ' + escapeHTML(skrT('skr_discard', 'ارميه', 'Throw it')))}`;
    } else if (rule === 'keep') {
      inner = `<p class="skr-hint tx-warning">⚠️ ${escapeHTML(skrT('skr_must_keep', 'الكارت ده لازم يفضل معاك', 'This card must be kept'))}</p>${keepBtn('btn--primary btn--lg')}`;
    } else if (rule === 'play') {
      inner = discardBtn('btn--primary btn--lg', '▶️ ' + escapeHTML(skrT('skr_play_it', 'العبه', 'Play it')));
    } else {
      inner = `<div class="btn-row">${keepBtn('btn--primary')}${discardBtn('btn--secondary', '⬇️ ' + escapeHTML(power ? skrT('skr_discard_power', 'ارميه واستعمل قوته', 'Throw it, use its power') : skrT('skr_discard', 'ارميه', 'Throw it')))}</div>
        ${power ? `<p class="skr-hint skr-hint--power">${skrPowerChip(info.power)}${escapeHTML(power.name)}</p>` : ''}`;
    }
    return bar(mineHead + inner);
  }

  if (turn.stage === 'power') return bar(mineHead);

  // choose
  const settings = s.settings || {};
  const pile = s.pile || [];
  const top = pile[pile.length - 1];
  const holding = ((s.hands || {})[me] || []).length > 0;
  // An empty deck takes the pile back, all but its top card - except under sudden
  // death, where it is never refilled. Nothing to draw: the turn can be passed.
  const canDraw = skrCanDraw(s);
  const fromLap = Number(settings.screwFromLap) || 2;
  const lapOk = (Number(s.lap) || 0) >= fromLap;
  const canScrew = !s.caller && !s.lastLap && lapOk;
  const reason = s.caller ? skrT('skr_screw_called', 'سكرو اتقالت خلاص', 'Screw has been called')
    : s.lastLap ? skrT('skr_screw_last_lap', 'مفيش سكرو في آخر لفة', 'No Screw in the last lap')
    : !lapOk ? skrT('skr_screw_from_lap', 'سكرو مسموح من اللفة {n}', 'Screw is allowed from lap {n}', { n: fromLap }) : '';
  const pong = turn.pongOpen
    ? `<div class="skr-pong"><p class="skr-hint">🏓 ${escapeHTML(skrT('skr_pong_open', 'بينج! لو معاك بونج ارميه دلوقتي', 'Ping! If you hold Pong, throw it now'))}</p>
         <button type="button" class="btn btn--secondary" onclick="skrStartPick('pong')">🎾 ${escapeHTML(skrT('skr_pong_btn', 'بونج!', 'Pong!'))}</button></div>` : '';
  const pass = canDraw ? '' : `<p class="skr-hint tx-warning">💀 ${escapeHTML(skrT('skr_deck_empty_hint', 'الورق خلص: خد من الأرض، ارمي كارت زيّه، أو عدّي', 'The deck is empty: take from the pile, throw a match, or pass'))}</p>
    <button type="button" class="btn btn--neutral" onclick="skrAct(this, 'pass')">⏭️ ${escapeHTML(skrT('skr_pass', 'عدّي', 'Pass'))}</button>`;
  return bar(`${seenPanel ? seenPanel + '<hr class="skr-rule">' : ''}${mineHead}${pong}
    <div class="skr-actgrid">
      <button type="button" class="btn btn--primary" onclick="skrAct(this, 'draw')" ${canDraw ? '' : 'disabled'}>🂠 ${escapeHTML(skrT('skr_draw', 'اسحب من الورق', 'Draw from the deck'))}</button>
      <button type="button" class="btn btn--secondary" onclick="skrStartPick('takePile')" ${top && holding ? '' : 'disabled'}>⬆️ ${escapeHTML(skrT('skr_take_pile', 'خد اللي على الأرض', 'Take from the pile'))}</button>
      <button type="button" class="btn btn--secondary" onclick="skrStartPick('match')" ${top && holding ? '' : 'disabled'}>🎯 ${escapeHTML(skrT('skr_match', 'ارمي كارت زيّه', 'Throw a matching card'))}</button>
      <button type="button" class="btn btn--danger-soft" onclick="skrCallScrew()" ${canScrew ? '' : 'disabled'}>📣 ${escapeHTML(skrT('skr_screw', 'سكرو!', 'Screw!'))}</button>
    </div>
    ${pass}
    ${reason ? `<p class="skr-hint">${escapeHTML(reason)}</p>` : ''}`);
}

/* --- the host's way past a phone that went quiet -------------------------------------- */

function skrHostButtons(state) {
  const s = state.shared || {};
  if (!state.youAreHost) return [];
  const gone = (pid) => { const p = (state.players || []).find(x => x.id === pid); return !p || !p.online; };
  const out = [];
  if (s.phase === 'play' && s.turn && gone(s.turn.pid)) {
    out.push(['⏭️ ' + skrT('skr_skip_turn', 'تخطي دور {name}', "Skip {name}'s turn", { name: skrName(state, s.turn.pid, true) }), "skrAct(this, 'skipTurn')"]);
  }
  // The thief vote carries its own close button for the host, on the phone and the TV.
  return out;
}

/** Presence changes redraw nothing: the dots, the away seats and the host's buttons are updated in place. */
function skrRefreshInPlace(root, state, tv) {
  if (!root) return;
  if (!tv) refreshRoomPlayerStrip(root, state);
  root.querySelectorAll('.skr-seat[data-skr-seat]').forEach(el => {
    const p = (state.players || []).find(x => x.id === el.getAttribute('data-skr-seat'));
    el.classList.toggle('is-away', !(p && p.online));
  });
  const box = root.querySelector('[data-skr-host]');
  if (box) {
    const buttons = skrHostButtons(state);
    const html = tv ? buttons.map(b => tvBtn(b[0], b[1], 'ghost')).join('') : roomHostRow(buttons);
    if (box._skrHtml !== html) { box.innerHTML = html; box._skrHtml = html; }
  }
}

/* --- the reveal and the scores ------------------------------------------------------- */

const SKR_TEAM_KEYS = ['A', 'B'];   // shared.teams[0] and [1], as results.totals and teamScores name them

function skrTeamLabel(i) {
  const L = (typeof CN_TEAM_LABEL !== 'undefined' && (CN_TEAM_LABEL[appState.lang] || CN_TEAM_LABEL.ar)) || null;
  return L ? (i === 0 ? L.blue : L.red) : SKR_TEAM_KEYS[i];
}

/** A score with its sign: +12, 0, -2. */
const skrSigned = (n) => (Number(n) > 0 ? '+' + Number(n) : String(Number(n) || 0));

/** Each card's counted value in a revealed hand (a life jacket copies the lowest other card). */
function skrHandValues(results, pid) {
  const cards = ((results && results.hands) || {})[pid] || [];
  const vals = ((results && results.values) || {})[pid];
  if (Array.isArray(vals) && vals.length === cards.length) return vals.map(v => Number(v) || 0);
  if (typeof skrewHandValues === 'function') return skrewHandValues(cards);
  return cards.map(id => (typeof skrewValue === 'function' ? skrewValue(id) : 0));
}

/** A player's hand in the reveal: the sum of its cards as they count (before the thief). */
function skrHandSum(results, pid) {
  const vals = ((results && results.values) || {})[pid];
  if (Array.isArray(vals)) return vals.reduce((sum, v) => sum + (Number(v) || 0), 0);
  const sums = (results && results.sums) || {};
  if (typeof sums[pid] === 'number') return sums[pid];
  return skrHandValues(results, pid).reduce((sum, v) => sum + v, 0);
}

/** The unit a player scores in: their own id, or their side's key in teams. */
function skrUnitOf(s, pid) {
  const k = skrTeamOf(s, pid);
  return k === -1 ? pid : SKR_TEAM_KEYS[k];
}

/** A unit in words: a player's name, or a side's colour. */
function skrUnitName(state, key) {
  const s = state.shared || {};
  const k = SKR_TEAM_KEYS.indexOf(key);
  if (k !== -1 && Array.isArray(s.teams)) return skrTeamLabel(k);
  return skrName(state, key, true);
}

/** The running totals, lowest first (lowest wins). */
function skrStandings(state) {
  const s = state.shared || {};
  const scores = s.scores || {};
  const rows = (s.board || []).map(r => ({ id: r.id, name: r.name, team: r.team || null, score: typeof scores[r.id] === 'number' ? scores[r.id] : Number(r.score) || 0 }));
  Object.keys(scores).forEach(id => { if (!rows.some(r => r.id === id)) rows.push({ id: id, name: skrName(state, id, true), team: null, score: Number(scores[id]) || 0 }); });
  return rows.sort((a, b) => a.score - b.score);
}

/** What the podium ranks: the two sides in teams (their names and players), else every player. */
function skrPodiumRows(state) {
  const s = state.shared || {};
  if (Array.isArray(s.teams) && s.teams.length && s.teamScores) {
    const sep = appState.lang === 'en' ? ', ' : '، ';
    return s.teams.map((team, i) => ({
      id: SKR_TEAM_KEYS[i],
      name: skrTeamLabel(i) + ': ' + (team || []).map(pid => skrName(state, pid, true)).join(sep),
      score: Number(s.teamScores[SKR_TEAM_KEYS[i]]) || 0
    })).sort((a, b) => a.score - b.score);
  }
  return skrStandings(state);
}

function skrTeamScoresLine(state) {
  const s = state.shared || {};
  if (!Array.isArray(s.teams) || !s.teams.length || !s.teamScores) return '';
  return '🤝 ' + s.teams.map((team, i) => skrTeamLabel(i) + ' ' + (Number(s.teamScores[SKR_TEAM_KEYS[i]]) || 0)).join(' · ');
}

function skrStandingsHtml(state) {
  const s = state.shared || {};
  const rows = skrStandings(state);
  if (!rows.length) return '';
  const winners = s.phase === 'gameover' && Array.isArray(s.winners) ? s.winners : null;
  const best = rows[0].score;
  const top = (p) => (winners ? winners.indexOf(p.id) !== -1 : p.score === best);
  const round = (s.results && s.results.round) || {};
  const teams = skrTeamScoresLine(state);
  return `<div class="section scoreboard skr-board">
      <div class="section__head"><h2 class="section__title">${escapeHTML(skrT('skr_standings', 'المجموع (الأقل يكسب)', 'Totals (lowest wins)'))}</h2><span class="section__rule"></span></div>
      ${teams ? `<p class="skr-hint skr-board__teams">${escapeHTML(teams)}</p>` : ''}
      ${rows.map(p => `
        <div class="status-row ${top(p) ? 'status-row--turn' : ''}" data-pid="${escapeHTML(String(p.id))}" data-score="${Number(p.score) || 0}">
          <div class="status-row__body"><div class="status-row__name">${top(p) ? '👑 ' : ''}${skrTeamDot(s, p.id)}${escapeHTML(p.name || '')}${p.id === Room.me ? ` <span class="badge">${escapeHTML((TRANSLATIONS[appState.lang] || {}).vote_you || '')}</span>` : ''}</div></div>
          ${typeof round[p.id] === 'number' ? `<span class="badge"><bdi dir="ltr">${skrSigned(round[p.id])}</bdi></span>` : ''}
          <span class="badge badge--accent" data-count>${Number(p.score) || 0}</span>
        </div>`).join('')}
    </div>`;
}

/**
 * The podium, lowest first. renderPodium (JS_Motion.html) ranks the highest
 * first, so it is given a mirrored board (best = biggest) and the real totals
 * are written back over the numbers it prints, in the same order - the same
 * classes, the same rise.
 */
function skrPodiumHtml(state) {
  const rows = skrPodiumRows(state);
  if (rows.length < 2 || typeof renderPodium !== 'function') return '';
  const worst = Math.max.apply(null, rows.map(r => r.score));
  const html = renderPodium(state, rows.map(r => ({ id: r.id, name: r.name, score: worst - r.score + 1 })));
  if (!html) return '';
  const real = rows.slice(0, 3).map(r => r.score);
  let i = 0;
  return html.replace(/(<span class="podium__score metric">)(-?\d+)(<\/span>)/g, (m, a, n, b) => a + (i < real.length ? real[i++] : n) + b);
}

/** Who won, in words: the lowest total, or the side with it. */
function skrWinnersLine(state) {
  const s = state.shared || {};
  const sep = appState.lang === 'en' ? ', ' : '، ';
  if (Array.isArray(s.winnerTeams) && s.winnerTeams.length && Array.isArray(s.teams)) {
    return s.winnerTeams.map(key => skrTeamLabel(SKR_TEAM_KEYS.indexOf(key))).join(sep);
  }
  const ids = Array.isArray(s.winners) && s.winners.length ? s.winners : (() => {
    const rows = skrStandings(state);
    return rows.filter(r => r.score === (rows[0] || {}).score).map(r => r.id);
  })();
  return ids.map(pid => skrName(state, pid, true)).join(sep);
}

/**
 * الحرامي at the end of the round, before the hands turn: the table's votes as
 * vote bars (the accused last), then a card lying face down that turns over on
 * what came of it - caught, a stolen score, nobody holding it. `animate` is the
 * reveal's own first time on this phone. Returns the markup and when the hands
 * may start turning (ms).
 */
function skrThiefResultHtml(state, animate, tv) {
  const s = state.shared || {};
  const r = s.results || {};
  const th = r.thief;
  if (!th) return { html: '', flipAt: 0 };
  const sep = appState.lang === 'en' ? ', ' : '، ';
  const name = (pid) => skrName(state, pid, true);
  const noThief = skrT('skr_no_thief', 'مفيش حرامي', 'No thief');
  const votes = th.votes && typeof th.votes === 'object' ? th.votes : {};
  const voters = Object.keys(votes);
  const skipped = !!th.skipped || !voters.length;
  const round = r.round || {};
  const holderUnit = th.holder ? skrUnitOf(s, th.holder) : null;

  let head;
  if (!th.holder) {
    head = skrT('skr_thief_nobody', '🦹 مفيش حرامي: الكارت مكانش في إيد حد', '🦹 No thief: nobody held the card');
  } else if (th.caught) {
    head = skrT('skr_thief_caught_by', '🦹 الترابيزة مسكت الحرامي: {name} +25', '🦹 The table caught the thief: {name} +25', { name: name(th.holder) });
  } else if (th.stole) {
    const stolen = typeof th.score === 'number' ? th.score
      : typeof round[th.holder] === 'number' ? round[th.holder] : Number(round[holderUnit]) || 0;
    const victims = (Array.isArray(th.victims) ? th.victims : []).map(key => skrUnitName(state, key)).join(sep);
    head = skrT('skr_thief_stole', '🦹 الحرامي {name} سرق أقل نتيجة ({score})، و{victims} +25', '🦹 The thief, {name}, stole the lowest score ({score}); {victims} +25',
      { name: name(th.holder), score: stolen, victims: victims });
  } else {
    head = skrT('skr_thief_unnoticed', '🦹 الحرامي {name} محدش مسكه، بس نتيجته كانت الأقل أصلًا', '🦹 Nobody caught the thief, {name}, who already had the lowest score', { name: name(th.holder) });
  }
  const accused = skipped
    ? skrT('skr_votes_none', '🗳️ محدش صوّت، يعني محدش اتّهم حد', '🗳️ No votes: nobody was accused')
    : skrT('skr_accused', '👉 اتهام الترابيزة: {name}', '👉 The table accused: {name}', { name: th.accused ? name(th.accused) : noThief });

  // The votes: one bar per choice somebody made, "no thief" among them.
  const groups = {};
  voters.forEach(voter => { const k = votes[voter] ? String(votes[voter]) : SKR_NONE; (groups[k] = groups[k] || []).push(voter); });
  const order = skrOrder(state);
  const ids = order.filter(pid => groups[pid]).concat(Object.keys(groups).filter(k => k !== SKR_NONE && order.indexOf(k) === -1));
  if (groups[SKR_NONE]) ids.push(SKR_NONE);
  const rows = ids.map(id => ({
    id: id,
    label: id === SKR_NONE ? '🙅 ' + noThief : name(id),
    count: groups[id].length,
    voters: groups[id].map(name)
  }));
  const where = tv ? 'tv' : 'phone';
  let bars = '';
  let barsMs = 0;
  if (!skipped && !tv && typeof renderVoteResults === 'function') {
    // renderVoteResults reads a room's vote: this one is handed a vote of that shape.
    // Its suspense is keyed on the room, the round and `turn`; a redraw shows the bars settled.
    const voteState = { code: state.code, game: 'screw', shared: { round: [s.dealId || '', s.round].join('#'), turn: 'thief-' + where,
      vote: { results: rows, totalVotes: voters.length } } };
    // The accused rises last; with nobody accused and nobody on "no thief", no bar is crowned.
    bars = renderVoteResults(voteState, { highlightId: th.accused || SKR_NONE });
    const m = /data-reveal-ms="(\d+)"/.exec(bars);
    if (animate && m) barsMs = Number(m[1]);
    // A redraw of a reveal already shown (a language change renames a bar) stays settled.
    else bars = bars.replace(' result-list--reveal', '').replace(/ data-reveal-ms="\d+"/, '');
  } else if (!skipped) {
    const pairs = rows.map(row => row.voters.map(v => skrT('skr_vote_pair', '{a} ← {b}', '{a} → {b}', { a: v, b: row.label }))).reduce((a, b) => a.concat(b), []);
    bars = tv
      ? `<div class="tv-strip-inline skr-thief__pairs">${pairs.map(p => `<span class="tv-chip">${escapeHTML(p)}</span>`).join('')}</div>`
      : `<p class="skr-hint">${escapeHTML(pairs.join(sep))}</p>`;
  }
  // The card lies face down until the accused's bar has risen, then turns (edge-on 1380ms in).
  const coverAt = barsMs ? Math.max(0, barsMs - 1000) : 0;
  const cover = animate && typeof spyRevealParts === 'function'
    ? spyRevealParts(['skr-thief', state.code, s.dealId || '', s.round, where].join('|'), skrT('skr_thief_was', 'الحرامي كان…', 'The thief was…'))
    : { cls: '', attrs: '', cover: '', ms: 0 };
  const flipAt = cover.cls ? coverAt + 1380 : barsMs;
  const tone = th.holder && !th.caught ? 'plate-danger' : th.holder ? 'plate-success' : '';
  const html = `<div class="skr-thief ${tv ? 'skr-thief--tv' : ''}">
      ${bars && !tv ? `<div class="eyebrow">🗳️ ${escapeHTML(skrT('skr_votes_title', 'الأصوات', 'The votes'))}</div>${bars}` : ''}
      <div class="card card--tight skr-thief__card ${tone} ${cover.cls}" ${cover.attrs} style="--skr-cover-at:${coverAt}ms">${cover.cover}
        <p class="skr-thief__head">${escapeHTML(head)}</p>
        <p class="skr-hint">${escapeHTML(accused)}</p>
        ${tv ? bars : ''}
      </div>
    </div>`;
  return { html: html, flipAt: flipAt };
}

/**
 * A revealed card (the i-th of its hand), turning over at `at` ms (null:
 * already face up). Under a life jacket, the value it counted as: its own 10
 * changes into the copied card's, and data-skr-copy names that card so a line
 * can link them (skrRevealMoments).
 */
function skrRevealCardHtml(id, values, cards, i, size, at) {
  const info = skrCardInfo(id);
  const isCopy = (c) => { const x = skrCardInfo(c); return !!(x && (x.card.copy || c === 'lifeJacket')); };
  const value = values[i];
  const faceOpts = { size: size, value: isCopy(id) && typeof value === 'number' ? value : null };
  const card = at === null
    ? skrCardHtml(id, faceOpts)
    : `<span class="skr-flip" style="--at:${at}ms"><span class="skr-flip__back">${skrCardHtml(null, { size: size })}</span><span class="skr-flip__face">${skrCardHtml(id, faceOpts)}</span></span>`;
  if (!isCopy(id) || typeof value !== 'number') return `<span class="skr-rcard" data-skr-card="${i}">${card}</span>`;
  const copied = cards.findIndex((c, j) => j !== i && !isCopy(c) && values[j] === value);
  const own = info && typeof info.value === 'number' ? info.value : value;
  return `<span class="skr-rcard is-copy" data-skr-card="${i}" ${copied !== -1 ? `data-skr-copy="${copied}"` : ''}>${card}<span class="skr-rcard__val skr-late">${own !== value ? `<s class="skr-rcard__was"><bdi dir="ltr">${own}</bdi></s>` : ''}<span class="skr-rcard__now">= <bdi dir="ltr">${value}</bdi></span></span></span>`;
}

/** Every hand face up, the totals counting up once the cards have turned. */
function skrRevealHtml(state, opts) {
  const o = opts || {};
  const s = state.shared || {};
  const r = s.results || {};
  const hands = r.hands || {};
  const order = skrOrder(state).filter(pid => hands[pid]).concat(Object.keys(hands).filter(pid => skrOrder(state).indexOf(pid) === -1));
  if (!order.length) return '';
  const animate = !o.still && motionFirst(['skr-reveal', state.code, s.dealId || '', s.round, o.tv ? 'tv' : 'phone'].join('|'));
  const size = o.tv ? 'md' : 'sm';
  const lowest = r.lowest || [];
  const caller = r.caller || s.caller || null;
  const finisher = r.finisher || s.finisher || null;
  const teams = Array.isArray(s.teams) && s.teams.length;
  const th = r.thief || null;
  const victims = th && Array.isArray(th.victims) ? th.victims : [];
  const thief = skrThiefResultHtml(state, animate, !!o.tv);
  const flipAt = animate ? thief.flipAt : 0;
  let k = 0;
  const rows = order.map(pid => {
    const cards = hands[pid] || [];
    const values = skrHandValues(r, pid);
    const sum = skrHandSum(r, pid);
    // In teams each hand shows its own cards; the side's total is on its line below.
    const total = !teams && typeof (r.totals || {})[pid] === 'number' ? r.totals[pid] : sum;
    const low = lowest.indexOf(pid) !== -1;
    const score = r.round ? r.round[pid] : undefined;
    const team = skrTeamOf(s, pid);
    const unit = skrUnitOf(s, pid);
    const tags = [];
    if (finisher === pid) tags.push('🏁');
    if (caller === pid) tags.push('📣');
    if (r.callerDouble && caller === pid) tags.push('<span class="badge badge--danger" data-skr-double>×2</span>');
    if (th && th.holder === pid) tags.push(th.caught ? '<span class="badge badge--danger">🦹 <bdi dir="ltr">+25</bdi></span>' : '🦹');
    if (victims.indexOf(unit) !== -1) tags.push('<span class="badge badge--danger">🎯 <bdi dir="ltr">+25</bdi></span>');
    const cardsHtml = cards.length
      ? cards.map((c, i) => skrRevealCardHtml(c, values, cards, i, size, animate ? flipAt + (k++) * 70 : null)).join('')
      : `<span class="skr-rrow__none">${escapeHTML(skrT('skr_no_cards', 'مفيش كروت', 'No cards'))}</span>`;
    return `<div class="skr-rrow ${low ? 'is-lowest' : ''} ${team !== -1 ? 'skr-team--' + team : ''}">
        <div class="skr-rrow__who"><span class="skr-rrow__name">${low ? '<span class="skr-late">👑</span> ' : ''}${escapeHTML(skrName(state, pid, true))}</span><span class="skr-late skr-rrow__tags">${tags.join(' ')}</span></div>
        <div class="skr-rrow__total"><b class="metric" data-skr-total="${total}">${animate ? '0' : total}</b>${typeof score === 'number'
          ? `<span class="badge skr-late ${score === 0 ? 'badge--success' : ''}">${score === 0 ? '0 ✓' : `<bdi dir="ltr">${skrSigned(score)}</bdi>`}</span>` : ''}</div>
        <div class="skr-rrow__cards">${cardsHtml}</div>
      </div>`;
  });
  const flipsEnd = animate ? flipAt + k * 70 + 420 : 0;
  const lines = [];
  if (finisher) {
    const vars = { name: skrName(state, finisher, true) };
    lines.push(teams
      ? skrT('skr_finish_line_team', '🏁 كروت {name} خلصت: الجولة انتهت ونتيجة فريق {name} 0', "🏁 {name} ran out of cards: the round is over and {name}'s team scores 0", vars)
      : skrT('skr_finish_line', '🏁 كروت {name} خلصت: الجولة انتهت ونتيجة {name} 0', '🏁 {name} ran out of cards: the round is over and {name} scores 0', vars));
  }
  if (r.callerDouble && caller) {
    // The caller's own hand, doubled whatever its sign (in teams, then added to the partner's; the thief comes after).
    const was = skrHandSum(r, caller);
    lines.push(skrT('skr_double_calc', '📣 سكرو {name} منفعش: {calc}', "📣 {name}'s Screw failed: {calc}", { name: skrName(state, caller, true), calc: was + ' × 2 = ' + was * 2 }));
  }
  if (teams) {
    const totals = r.totals || {};
    const round = r.round || {};
    lines.push('🤝 ' + s.teams.map((team, i) => {
      const key = SKR_TEAM_KEYS[i];
      const sum = typeof totals[key] === 'number' ? totals[key] : (team || []).reduce((acc, pid) => acc + skrHandSum(r, pid), 0);
      return skrTeamLabel(i) + ': ' + sum + (typeof round[key] === 'number' ? ' (⁦' + skrSigned(round[key]) + '⁩)' : '');
    }).join(' · '));
  }
  return `${thief.html}<div class="skr-reveal ${o.tv ? 'skr-reveal--tv' : ''} ${animate ? 'is-revealing' : ''}" style="--late:${animate ? flipsEnd : 0}ms" ${animate ? `data-reveal-ms="${flipsEnd + 900}" data-skr-count-at="${flipsEnd}"` : ''}>${rows.join('')}</div>
    ${lines.length ? `<div class="skr-lines ${animate ? 'skr-late' : ''}" style="--late:${animate ? flipsEnd : 0}ms">${lines.map(l => `<p>${escapeHTML(l)}</p>`).join('')}</div>` : ''}`;
}

/** Totals count up once the flips are over. */
function skrRevealCount(root) {
  const box = root && root.querySelector('[data-skr-count-at]');
  if (!box) return;
  const at = Number(box.getAttribute('data-skr-count-at')) || 0;
  skrFx.timers.push(setTimeout(() => {
    box.querySelectorAll('[data-skr-total]').forEach(el => {
      const to = Number(el.getAttribute('data-skr-total')) || 0;
      if (typeof countUp === 'function' && to !== 0) countUp(el, 0, to); else el.textContent = to;
    });
  }, at));
}

/**
 * The end of a round, and of the game. The last round's reveal and the game's
 * end arrive together (phase gameover with results), so the cards turn over
 * first and the podium comes after them.
 */
function skrResultFrame(state) {
  const s = state.shared || {};
  const t = TRANSLATIONS[appState.lang] || {};
  const over = s.phase === 'gameover';
  const reveal = s.results ? skrRevealHtml(state, {}) : '';
  const hostNext = over
    ? `<div class="btn-stack">
         <button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'playAgain')">${escapeHTML(t.play_again || 'لعبة جديدة')}</button>
         <button type="button" class="btn btn--ghost" onclick="roomAct('backToHub')">${escapeHTML(t.room_another_game || 'لعبة أخرى')}</button>
       </div>`
    : `<div class="btn-stack">
         <button type="button" class="btn btn--primary btn--lg" onclick="skrAct(this, 'nextRound', { round: ${Number(s.round) || 0} })">${escapeHTML(t.next_round || 'الجولة التالية')}</button>
       </div>`;
  return `<div class="skr skr--result">
      ${skrHeadHtml(state)}
      ${reveal ? `<p class="skr-prompt">🃏 ${escapeHTML(skrT('skr_reveal_title', 'كشف الكروت', 'The reveal'))}</p>${reveal}` : ''}
      ${over ? `<div class="card card--accent skr-over">
          <div class="card__title">🏆 ${escapeHTML(skrWinnersLine(state))}</div>
          <p class="skr-hint">${escapeHTML(skrT('skr_lowest_wins', 'الأقل نقط يكسب', 'Lowest score wins'))}</p>
          ${skrPodiumHtml(state)}
        </div>` : ''}
      ${skrStandingsHtml(state)}
      ${state.youAreHost ? hostNext : `<div class="waiting-note">${escapeHTML(t.room_wait_host || '')}</div>`}
      ${renderRoomPlayerStrip(state)}
    </div>`;
}

/* --- the phone's frame ------------------------------------------------------------------ */

/** Everything the server said that the table shows. Presence is not in it (refreshed in place). */
function skrServerSig(state) {
  const s = state.shared || {};
  const events = s.events || [];
  const done = s.phase === 'reveal' || s.phase === 'gameover' || s.phase === 'thiefGuess';
  return [s.dealId || '', s.phase, s.round, s.rounds, s.lap, s.turnSeq, JSON.stringify(s.turn || null), s.deckCount,
    (s.pile || []).join(','), JSON.stringify(s.hands || {}), s.caller || '', (s.finalLeft || []).join(','),
    (s.exposed || []).join(','), (s.ready || []).join(','), events.length ? events[events.length - 1].seq : 0, s.endsAt || '',
    skrVoted(state).join(','), JSON.stringify(s.lastLap || null), s.finisher || '', JSON.stringify(s.boom || null),
    done ? JSON.stringify(s.results || null) + JSON.stringify(s.scores || {}) + JSON.stringify(s.teamScores || null) + JSON.stringify(s.winners || null) : '', JSON.stringify(state.you || null),
    (s.order || []).join(','), JSON.stringify(s.teams || null), JSON.stringify(s.settings || {}),
    (state.players || []).map(p => p.id + ':' + p.name).join(',')].join('|');
}

/** Resets the move being chosen when the turn moves on, and opens the ones a stage requires. */
function skrSyncPick(state) {
  const s = state.shared || {};
  const key = [state.code, s.dealId || '', s.phase, s.turnSeq].join('|');
  if (skrLocal.pickKey !== key) { skrLocal.pickKey = key; skrLocal.pick = null; }
  if (skrLocal.pick || !skrInGame(state)) return;
  const turn = s.turn;
  const mine = s.phase === 'play' && turn && turn.pid === Room.me;
  if (mine && turn.stage === 'power' && turn.power) skrLocal.pick = skrNewPick('power', { power: skrPowerOf(turn.power) });
  else if (mine && turn.stage === 'khoshaf') skrLocal.pick = skrNewPick('khoshaf');
  else if (skrBoomWaits(state, Room.me)) skrLocal.pick = skrNewPick('boomPick');
}

function skrPhoneFrame(state) {
  const s = state.shared || {};
  if (s.phase === 'reveal' || s.phase === 'gameover') { skrLocal.memoFaces = null; return skrResultFrame(state); }
  const me = Room.me;
  const inGame = skrInGame(state);
  const pick = skrLocal.pick;
  const help = skrHelp(state);
  const ctx = { marks: help ? skrMarks(state) : {}, pick: pick, faces: skrMyFaces(state), help: help };
  skrLocal.memoFaces = { key: state.code + '|' + (s.dealId || '') + '|' + s.round, faces: ctx.faces };

  // From three others the seats sit two a row with small cards, and stay that way while
  // picking (the bar draws the chosen player's cards big), so twelve players stay a short page.
  const opps = at === -1 ? order.slice() : order.slice(at + 1).concat(order.slice(0, at));
  const compact = opps.length >= 3;
  const seatCtx = Object.assign({}, ctx, { size: compact ? 'sm' : 'md' });
  return `<div class="skr ${pick ? 'is-picking' : ''} ${s.phase === 'thiefGuess' ? 'is-voting' : ''} ${compact ? 'skr--many' : ''}">

        </div>
        <div class="skr-layout__side">
          ${skrCenterHtml(state, false)}
          ${inGame ? skrMineHtml(state, ctx) : `<div class="waiting-note">${escapeHTML((TRANSLATIONS[appState.lang] || {}).vote_spectating || '')}</div>`}
          ${skrActionsHtml(state)}

      ${renderRoomPlayerStrip(state)}

}
