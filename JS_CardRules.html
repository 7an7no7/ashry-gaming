<script>
/* ============================================================================
   حاسبة الورق — THE RULE SETS (see JS_CardScore.html for the engine)
   ----------------------------------------------------------------------------
   Each game says who sits (seats), what one round asks for (entryHtml, read,
   check), what it is worth (score) and when the game is over (ended). The
   numbers follow the common rules as written by Jawaker and pagat.com and
   Egyptian tables (researched 16 Sep 2026); where tables disagree, the
   difference is an option on the setup screen, with the most common first.
   ========================================================================= */

const csSeatItems = (s) => s.seats.map((seat, i) => ({ v: i, label: seat.name }));

/* --- تريكس ------------------------------------------------------------------------------
   Four kingdoms, one per player in seat order. In the classic game the owner
   of a kingdom plays each of the five contracts once (20 deals); in Complex
   the four negative contracts are one deal, then the Trix (8 deals).
   King of hearts −75, each queen −25, each diamond −10, each trick −15, the
   Trix +200/+150/+100/+50 by finishing order: every kingdom adds up to 0.
   A king or queen shown before the first lead is doubled: whoever else takes
   it pays double and the one who doubled it gets the single value; if the
   one who doubled takes it themselves, they pay double and whoever led that
   trick gets the single value - unless they led it themselves, when it is
   just the single value. Partners (1 & 3 against 2 & 4) add their points. */
const TRIX_CONTRACTS = { classic: ['king', 'queens', 'diamonds', 'tricks', 'trix'], complex: ['complex', 'trix'] };
const TRIX_QUEENS = ['♠', '♥', '♦', '♣'];

CS_GAMES.trix = {
  icon: '♥️',
  options: {
    game: { label: 'cs_trix_game', values: ['classic', 'complex'], def: 'classic', labelOf: (v, t) => t['cs_trix_game_' + v] || v },
    teams: { label: 'cs_trix_teams', values: ['solo', 'pairs'], def: 'solo', labelOf: (v, t) => t['cs_mode_' + v] || v },
    doubling: { label: 'cs_trix_doubling', values: ['on', 'off'], def: 'on', labelOf: (v, t) => t['cs_onoff_' + v] || v }
  },
  seatCount: () => [4, 4],
  seatsHint: (opts) => (opts.teams === 'pairs' ? 'cs_pairs_seats' : 'cs_trix_seats'),
  teamMode: (opts) => opts.teams === 'pairs',
  seats: (names, opts) => names.map((n, i) => ({ name: n, team: i % 2 })),
  board: (s, totals) => {
    if (s.opts.teams !== 'pairs') return s.seats.map((seat, i) => ({ i: i, name: seat.name, score: totals[i] }));
    return [0, 1].map(team => ({
      i: team, name: s.seats.filter(x => x.team === team).map(x => x.name).join(' & '),
      short: (csT().cs_team_short || 'فريق {n}').replace('{n}', team + 1),
      score: csSum(totals.filter((_, i) => s.seats[i].team === team))
    }));
  },
  per: (s) => TRIX_CONTRACTS[s.opts.game].length,
  owner: (s) => Math.floor(s.rounds.length / CS_GAMES.trix.per(s)) % 4,
  roundLabel: (s) => `👑 ${s.seats[CS_GAMES.trix.owner(s)].name}`,
  goalText: (s, t) => (t.cs_trix_goal || '').replace('{n}', s.rounds.length).replace('{m}', CS_GAMES.trix.per(s) * 4),
  /** The taker, the doubler and, when they are one person, who led the trick. */
  cardHtml(s, t, key, title) {
    const seats = csSeatItems(s);
    const taker = csDraft(s, 'pick-' + key, '');
    const doubler = csDraft(s, 'pick-' + key + 'd', '');
    let html = `<div class="cs-card"><b class="cs-card__title"><bdi dir="ltr">${title}</bdi></b>
      <span class="cs-label">${escapeHTML(t.cs_trix_taken_by || '')}</span>${csPickHtml(key, seats, taker)}`;
    if (s.opts.doubling === 'on') {
      html += `<span class="cs-label">${escapeHTML(t.cs_trix_doubled_by || '')}</span>${csPickHtml(key + 'd', [{ v: '', label: t.cs_trix_not_doubled || '' }].concat(seats), doubler)}`;
      if (taker !== '' && doubler !== '' && String(taker) === String(doubler)) {
        html += `<span class="cs-label">${escapeHTML(t.cs_trix_led_by || '')}</span>${csPickHtml(key + 'l', seats, csDraft(s, 'pick-' + key + 'l', ''))}`;
      }
    }
    return html + '</div>';
  },
  countsHtml(s, t, key, label) {
    return `<div class="cs-card"><b class="cs-card__title">${escapeHTML(label)}</b>` +
      s.seats.map((seat, i) => `<div class="cs-seat-row"><span class="cs-seat-row__name">${escapeHTML(seat.name)}</span>${csStepperHtml(key + i, csDraft(s, key + i, 0), 0, 13)}</div>`).join('') + '</div>';
  },
  entryHtml(s, t) {
    const g = CS_GAMES.trix;
    const per = g.per(s);
    const owner = g.owner(s);
    const kingdom = Math.floor(s.rounds.length / per);
    const played = s.rounds.filter((r, n) => Math.floor(n / per) === kingdom).map(r => r.input.contract);
    const left = TRIX_CONTRACTS[s.opts.game].filter(c => played.indexOf(c) === -1);
    const contract = csDraft(s, 'pick-contract', left[0]);
    const king = () => g.cardHtml(s, t, 'k', t.cs_trix_card_king || 'K♥');
    const queens = () => TRIX_QUEENS.map((q, k) => g.cardHtml(s, t, 'q' + k, t['cs_trix_card_q' + 'shdc'.charAt(k)] || 'Q' + q)).join('');
    let body = '';
    if (contract === 'king' || contract === 'complex') body += king();
    if (contract === 'queens' || contract === 'complex') body += queens();
    if (contract === 'diamonds' || contract === 'complex') body += g.countsHtml(s, t, 'd', t.cs_trix_diamonds_count || '');
    if (contract === 'tricks' || contract === 'complex') body += g.countsHtml(s, t, 'l', t.cs_trix_tricks_count || '');
    if (['diamonds', 'tricks', 'complex'].indexOf(contract) !== -1) body += csQuickSlot();
    if (contract === 'trix') {
      body = `<div class="cs-card"><b class="cs-card__title">${escapeHTML(t.cs_trix_order || '')}</b>` +
        s.seats.map((seat, i) => `<div class="cs-seat-row"><span class="cs-seat-row__name">${escapeHTML(seat.name)}</span>${csPickHtml('place' + i, [1, 2, 3, 4].map(p => ({ v: p, label: String(p) })), csDraft(s, 'pick-place' + i, ''))}</div>`).join('') + '</div>';
    }
    return `
      <span class="cs-label">${escapeHTML((t.cs_trix_contract || '').replace('{name}', s.seats[owner].name))}</span>
      ${csPickHtml('contract', left.map(c => ({ v: c, label: t['cs_trix_c_' + c] || c })), contract)}
      ${body}`;
  },
  onPick(key, s) {
    if (key === 'contract') Object.keys(s.draft).forEach(k => { if (k !== 'pick-contract') delete s.draft[k]; });
    paintCardScore('trix');
  },
  /** The diamonds and the tricks each add up to 13: the rest to whoever took it. */
  quick(s, t) {
    const contract = csPicked('contract');
    const keys = (p) => s.seats.map((_, i) => p + i);
    const out = [];
    if (contract === 'diamonds' || contract === 'complex') out.push({ kind: 'rest', keys: keys('d'), total: 13, max: 13, label: t.cs_trix_c_diamonds || '' });
    if (contract === 'tricks' || contract === 'complex') out.push({ kind: 'rest', keys: keys('l'), total: 13, max: 13, label: t.cs_trix_c_tricks || '' });
    return out;
  },
  readCard: (key) => ({ taker: csPicked(key), doubler: csPicked(key + 'd') || '', led: csPicked(key + 'l') }),
  read(s) {
    const g = CS_GAMES.trix;
    const contract = csPicked('contract');
    const input = { contract: contract };
    if (contract === 'king' || contract === 'complex') input.king = g.readCard('k');
    if (contract === 'queens' || contract === 'complex') input.queens = [0, 1, 2, 3].map(k => g.readCard('q' + k));
    if (contract === 'diamonds' || contract === 'complex') input.diamonds = s.seats.map((_, i) => csVal('d' + i) || 0);
    if (contract === 'tricks' || contract === 'complex') input.tricks = s.seats.map((_, i) => csVal('l' + i) || 0);
    if (contract === 'trix') input.place = s.seats.map((_, i) => Number(csPicked('place' + i)) || 0);
    return input;
  },
  check(input, s, t) {
    const bad = (card) => card.taker === null || (card.doubler !== '' && String(card.doubler) === String(card.taker) && card.led === null);
    if (!input.contract) return t.cs_trix_pick_contract;
    if (input.king && bad(input.king)) return t.cs_trix_need_king;
    if (input.queens && input.queens.some(bad)) return t.cs_trix_need_queens;
    if (input.diamonds && csSum(input.diamonds) !== 13) return (t.cs_need_13 || '').replace('{n}', csSum(input.diamonds));
    if (input.tricks && csSum(input.tricks) !== 13) return (t.cs_need_13 || '').replace('{n}', csSum(input.tricks));
    if (input.contract === 'trix' && [1, 2, 3, 4].some(p => input.place.filter(x => x === p).length !== 1)) return t.cs_trix_need_order;
    return '';
  },
  score(input, s) {
    const pts = s.seats.map(() => 0);
    const t = csT();
    const card = (c, value) => {
      const taker = Number(c.taker);
      if (c.doubler === '' || c.doubler === null || s.opts.doubling !== 'on') { pts[taker] -= value; return; }
      const doubler = Number(c.doubler);
      if (doubler !== taker) { pts[taker] -= value * 2; pts[doubler] += value; return; }
      const led = Number(c.led);
      if (led === taker) { pts[taker] -= value; return; }
      pts[taker] -= value * 2;
      pts[led] += value;
    };
    if (input.king) card(input.king, 75);
    if (input.queens) input.queens.forEach(q => card(q, 25));
    if (input.diamonds) input.diamonds.forEach((n, i) => { pts[i] -= n * 10; });
    if (input.tricks) input.tricks.forEach((n, i) => { pts[i] -= n * 15; });
    if (input.contract === 'trix') input.place.forEach((p, i) => { pts[i] += [0, 200, 150, 100, 50][p]; });
    return { points: pts, tag: ({ king: '♥K', queens: 'Q', diamonds: '♦', tricks: '✋', trix: '🏁', complex: '★' })[input.contract], label: t['cs_trix_c_' + input.contract] || '' };
  },
  ended: (s) => s.rounds.length >= CS_GAMES.trix.per(s) * 4
};

/* --- طرنيب ------------------------------------------------------------------------------
   Three ways tables play it:
   - شامي (Levantine, the default): a team bids 7-13. Made: it scores the
     tricks it took (not the bid); failed: −bid and the other team scores its
     tricks. All 13 without bidding 13 (كبوت) is 16; bidding 13 and making it
     26; bidding 13 and failing −16 with the other team scoring double.
   - مصري: the same, but the bid can be doubled (×2) or redoubled (×4), which
     multiplies what the bidding team wins or loses.
   - ٤١: every player bids alone (at least 2, the four bids at least 11) and
     scores the value of their bid if they make it, minus it if not (5 and up
     are worth more); a team wins when one partner reaches 41 with the other
     above 0, and bidding 13 and making it wins outright. */
const TARNEEB_41_VALUES = { 2: 2, 3: 3, 4: 4, 5: 10, 6: 12, 7: 14, 8: 16, 9: 27, 10: 30, 11: 33, 12: 36, 13: 0 };

CS_GAMES.tarneeb = {
  icon: '♠️',
  options: {
    mode: { label: 'cs_tarneeb_mode', values: ['levant', 'egypt', 'fortyone'], def: 'levant', labelOf: (v, t) => t['cs_tarneeb_mode_' + v] || v, hint: (o) => 'cs_tarneeb_hint_' + o.mode },
    target: { label: 'cs_target', values: [31, 41, 51, 61], def: 31, when: (o) => o.mode !== 'fortyone' }
  },
  seatCount: () => [4, 4],
  seatsHint: () => 'cs_pairs_seats',
  teamMode: () => true,
  dealer: true,
  seats: (names, opts, t) => (opts.mode === 'fortyone' ? names.map((n, i) => ({ name: n, team: i % 2 })) : csTeams(names, t)),
  board: (s, totals) => {
    if (s.opts.mode !== 'fortyone') return s.seats.map((seat, i) => ({ i: i, name: seat.name, short: csShort(seat, csT()), score: totals[i] }));
    return s.seats.map((seat, i) => ({ i: i, name: seat.name, score: totals[i], note: (csT().cs_team_short || '').replace('{n}', seat.team + 1) }));
  },
  goalText: (s, t) => (s.opts.mode === 'fortyone' ? (t.cs_tarneeb_goal41 || '') : (t.cs_to_target || '').replace('{n}', s.opts.target)),
  entryHtml(s, t) {
    if (s.opts.mode === 'fortyone') {
      return `<span class="cs-label">${escapeHTML(t.cs_tarneeb_41_entry || '')}</span>` + s.seats.map((seat, i) => `
        <div class="cs-seat-row">
          <span class="cs-seat-row__name">${escapeHTML(seat.name)}</span>
          <span class="cs-seat-row__cells">
            <span class="cs-cell"><small>${escapeHTML(t.cs_tarneeb_bid || '')}</small>${csStepperHtml('b' + i, csDraft(s, 'b' + i, 2), 2, 13)}</span>
            ${csToggleHtml('m' + i, t.cs_made_it || '', csDraft(s, 'tog-m' + i, '') === '1')}
          </span>
        </div>`).join('');
    }
    return `
      <span class="cs-label">${escapeHTML(t.cs_tarneeb_bidder || '')}</span>
      ${csPickHtml('team', csSeatItems(s), csDraft(s, 'pick-team', ''))}
      <div class="cs-seat-row"><span class="cs-seat-row__name">${escapeHTML(t.cs_tarneeb_bid || '')}</span>${csStepperHtml('bid', csDraft(s, 'bid', 7), 7, 13)}</div>
      <div class="cs-seat-row"><span class="cs-seat-row__name">${escapeHTML(t.cs_tarneeb_took || '')}</span>${csStepperHtml('took', csDraft(s, 'took', ''), 0, 13)}</div>
      ${s.opts.mode === 'egypt' ? `<span class="cs-label">${escapeHTML(t.cs_tarneeb_double || '')}</span>${csPickHtml('mult', [1, 2, 4].map(m => ({ v: m, label: m === 1 ? (t.cs_tarneeb_no_double || '') : '\u2066×' + m + '\u2069' })), csDraft(s, 'pick-mult', 1))}` : ''}`;
  },
  read(s) {
    if (s.opts.mode === 'fortyone') return { bids: s.seats.map((_, i) => csVal('b' + i)), made: s.seats.map((_, i) => csToggled('m' + i)) };
    return { team: csPicked('team'), bid: csVal('bid'), took: csVal('took'), mult: Number(csPicked('mult') || 1) };
  },
  check(input, s, t) {
    if (s.opts.mode === 'fortyone') {
      if (input.bids.some(b => b === null || b < 2 || b > 13)) return t.cs_tarneeb_need_bids;
      if (csSum(input.bids) < 11) return t.cs_tarneeb_under_11;
      // There are 13 tricks: everyone marked as made took at least their bid,
      // and everyone who failed took at most one less than theirs.
      if (csSum(input.bids.filter((b, i) => input.made[i])) > 13) return t.cs_tarneeb_41_made_over || 'اللي جابوا طلبهم طالبين أكتر من 13 لمّة: راجع مين جاب';
      if (!input.made.some(Boolean) && csSum(input.bids.map(b => b - 1)) < 13) return t.cs_tarneeb_41_none_made || 'مستحيل محدش يجيب طلبه بالطلبات دي: علّم اللي جابوا';
      return '';
    }
    if (input.team === null) return t.cs_tarneeb_need_team;
    if (input.bid === null || input.bid < 7 || input.bid > 13) return t.cs_tarneeb_need_bid;
    if (input.took === null || input.took < 0 || input.took > 13) return t.cs_tarneeb_need_took;
    return '';
  },
  score(input, s) {
    if (s.opts.mode === 'fortyone') {
      const pts = input.bids.map((b, i) => (b === 13 ? 0 : (input.made[i] ? 1 : -1) * TARNEEB_41_VALUES[b]));
      const thirteen = input.bids.findIndex((b, i) => b === 13 && input.made[i]);
      return { points: pts, tag: thirteen !== -1 ? '13!' : '', win: thirteen !== -1 ? s.seats[thirteen].team : null };
    }
    const bidder = Number(input.team), other = 1 - bidder;
    const pts = [0, 0];
    const mult = s.opts.mode === 'egypt' ? input.mult : 1;
    if (input.took >= input.bid) {
      pts[bidder] = (input.bid === 13 ? 26 : (input.took === 13 ? 16 : input.took)) * mult;
    } else {
      pts[bidder] = -(input.bid === 13 ? 16 : input.bid) * mult;
      pts[other] = (13 - input.took) * (input.bid === 13 ? 2 : 1);
    }
    return { points: pts, tag: `${input.bid}${input.took >= input.bid ? '✓' : '✗'}${mult > 1 ? '×' + mult : ''}` };
  },
  ended(s, totals) {
    if (s.opts.mode === 'fortyone') {
      const last = s.rounds[s.rounds.length - 1];
      if (last && last.win !== undefined && last.win !== null) { s.winTeam = last.win; return true; }
      const team = [0, 1].find(tm => s.seats.some((seat, i) => seat.team === tm && totals[i] >= 41 && s.seats.some((p, j) => j !== i && p.team === tm && totals[j] > 0)));
      if (team !== undefined) { s.winTeam = team; return true; }
      return false;
    }
    return totals.some(x => x >= s.opts.target) && totals[0] !== totals[1];
  },
  /** In ٤١ the winner is a team, whatever the individual totals. */
  winners: (s, order) => (s.opts.mode === 'fortyone' && s.winTeam !== undefined && s.winTeam !== null ? order.filter(r => s.seats[r.i].team === s.winTeam).sort((a, b) => a.i - b.i) : null)
};

/* --- كونكان -------------------------------------------------------------------------------
   Whoever goes out takes −30; everyone who put cards down adds what is left
   in their hand (2-10 as marked, pictures 10, ace 11, joker 15), and anyone
   who never put anything down takes 100. A هاند (everything down in one
   turn), or a Konkan hand, doubles all of it; finishing on a joker or in one
   colour doubles it again, and in one suit four times. In teams the winner's
   partner scores nothing. Lowest after the rounds wins; knocking players out
   over a limit is a house rule some tables play. */
CS_GAMES.konkan = {
  icon: '♦️',
  low: true,
  options: {
    // Knocking out over 101 is a game of players, not of teams: with partners it could never end.
    end: { label: 'cs_konkan_end', values: ['r5', 'r7', 'l101'], valuesOf: (o) => (o.teams === 'pairs' ? ['r5', 'r7'] : ['r5', 'r7', 'l101']), def: 'r5', labelOf: (v, t) => t['cs_konkan_end_' + v] || v },
    teams: { label: 'cs_konkan_teams', values: ['solo', 'pairs'], def: 'solo', labelOf: (v, t) => t['cs_mode_' + v] || v }
  },
  seatCount: (opts) => (opts.teams === 'pairs' ? [4, 4] : [2, 6]),
  seatsHint: (opts) => (opts.teams === 'pairs' ? 'cs_pairs_seats' : 'cs_konkan_seats'),
  teamMode: (opts) => opts.teams === 'pairs',
  seats: (names) => names.map((n, i) => ({ name: n, team: i % 2 })),
  limit: (s) => (s.opts.end === 'l101' ? 101 : null),
  /** The deal goes round the players still in. */
  dealer(s) {
    const players = CS_GAMES.konkan.inGame(s);
    return players.length ? s.seats[players[s.rounds.length % players.length]].name : '';
  },
  board: (s, totals) => {
    const limit = CS_GAMES.konkan.limit(s);
    if (s.opts.teams === 'pairs') {
      // A team is out when both partners are (only a game saved before 101 left the team options).
      return [0, 1].map(team => ({
        i: team, name: s.seats.filter(x => x.team === team).map(x => x.name).join(' & '),
        short: (csT().cs_team_short || 'فريق {n}').replace('{n}', team + 1),
        score: csSum(totals.filter((_, i) => s.seats[i].team === team)),
        out: limit !== null && s.seats.every((x, i) => x.team !== team || totals[i] > limit)
      }));
    }
    return s.seats.map((seat, i) => ({ i: i, name: seat.name, score: totals[i], out: limit !== null && totals[i] > limit }));
  },
  goalText: (s, t) => (s.opts.end === 'l101' ? (t.cs_konkan_goal_limit || '') : (t.cs_rounds_of || '').replace('{n}', s.rounds.length).replace('{m}', s.opts.end === 'r7' ? 7 : 5)),
  inGame(s) {
    const limit = CS_GAMES.konkan.limit(s);
    // From the rounds handed in, not the live game: a fixed earlier round asks who was in *then*.
    const totals = s.seats.map((_, i) => csSum(s.rounds.map(r => r.points[i])));
    return s.seats.map((_, i) => i).filter(i => limit === null || totals[i] <= limit);
  },
  entryHtml(s, t) {
    const g = CS_GAMES.konkan;
    const players = g.inGame(s);
    const winner = csDraft(s, 'pick-winner', '');
    const partner = s.opts.teams === 'pairs' && winner !== '' ? players.find(i => i !== Number(winner) && s.seats[i].team === s.seats[Number(winner)].team) : -1;
    return `
      <span class="cs-label">${escapeHTML(t.cs_konkan_winner || '')}</span>
      ${csPickHtml('winner', players.map(i => ({ v: i, label: s.seats[i].name })), winner)}
      <span class="cs-label">${escapeHTML(t.cs_konkan_finish || '')}</span>
      ${csPickHtml('finish', [{ v: 'normal', label: t.cs_konkan_normal || '' }, { v: 'hand', label: t.cs_konkan_hand || '' }], csDraft(s, 'pick-finish', 'normal'))}
      <div class="cs-toggles">
        ${csToggleHtml('joker', t.cs_konkan_joker || '', csDraft(s, 'tog-joker', '') === '1')}
        ${csToggleHtml('colour', t.cs_konkan_colour || '', csDraft(s, 'tog-colour', '') === '1')}
        ${csToggleHtml('suit', t.cs_konkan_suit || '', csDraft(s, 'tog-suit', '') === '1')}
      </div>
      <span class="cs-label">${escapeHTML(t.cs_konkan_left || '')}</span>
      ${players.filter(i => String(i) !== String(winner) && i !== partner).map(i => `
        <div class="cs-seat-row">
          <span class="cs-seat-row__name">${escapeHTML(s.seats[i].name)}</span>
          <span class="cs-seat-row__cells">
            ${csStepperHtml('p' + i, csDraft(s, 'p' + i, ''), 0, 400)}
            ${csToggleHtml('n' + i, t.cs_konkan_never || '', csDraft(s, 'tog-n' + i, '') === '1')}
          </span>
        </div>`).join('')}`;
  },
  onPick(key, s) { if (key === 'winner') paintCardScore('konkan'); },
  /** One suit is one colour too, and pays ×4 instead of ×2: the two pills are never both on. */
  onToggle(key, on) {
    const other = { colour: 'suit', suit: 'colour' }[key];
    if (on && other) csSetToggle(other, false);
  },
  read(s) {
    const players = CS_GAMES.konkan.inGame(s);
    return {
      winner: csPicked('winner'), finish: csPicked('finish') || 'normal',
      joker: csToggled('joker'), colour: csToggled('colour'), suit: csToggled('suit'),
      pts: s.seats.map((_, i) => (players.indexOf(i) === -1 ? null : csVal('p' + i))),
      never: s.seats.map((_, i) => csToggled('n' + i))
    };
  },
  check(input, s, t) {
    if (input.winner === null) return t.cs_konkan_need_winner;
    const w = Number(input.winner);
    const partner = s.opts.teams === 'pairs' ? s.seats.findIndex((seat, i) => i !== w && seat.team === s.seats[w].team) : -1;
    const missing = CS_GAMES.konkan.inGame(s).some(i => i !== w && i !== partner && input.pts[i] === null && !input.never[i]);
    return missing ? t.cs_konkan_need_points : '';
  },
  score(input, s) {
    const w = Number(input.winner);
    const partner = s.opts.teams === 'pairs' ? s.seats.findIndex((seat, i) => i !== w && seat.team === s.seats[w].team) : -1;
    let mult = input.finish === 'hand' ? 2 : 1;
    if (input.joker) mult *= 2;
    if (input.suit) mult *= 4;
    else if (input.colour) mult *= 2;
    const players = CS_GAMES.konkan.inGame(s);
    const pts = s.seats.map((_, i) => {
      if (players.indexOf(i) === -1 || i === partner) return 0;
      if (i === w) return -30 * mult;
      return (input.never[i] ? 100 : (input.pts[i] || 0)) * mult;
    });
    return { points: pts, tag: mult > 1 ? '×' + mult : '' };
  },
  ended(s, totals) {
    if (s.opts.end === 'l101') {
      if (s.opts.teams === 'pairs') return [0, 1].some(team => s.seats.every((seat, i) => seat.team !== team || totals[i] > 101));
      return totals.filter(x => x <= 101).length <= 1;
    }
    return s.rounds.length >= (s.opts.end === 'r7' ? 7 : 5);
  }
};

/* --- باصرة --------------------------------------------------------------------------------
   Counted when the deck is played out. 30 for the most cards (27 or more),
   1 for each ace and each jack, 2 for the two of clubs, 3 for the ten of
   diamonds - 43 in every deck - and 10 for every basra. When the cards split
   26-26 the 30 carries over to the next deck. A jack's sweep is never a basra.
   Two to four players, or two teams of two; first past the target at the end
   of a deck wins. */
CS_GAMES.basra = {
  icon: '🎣',
  options: {
    target: { label: 'cs_target', values: [101, 121, 150], def: 121 },
    teams: { label: 'cs_basra_teams', values: ['solo', 'pairs'], def: 'solo', labelOf: (v, t) => t['cs_mode_' + v] || v }
  },
  seatCount: (opts) => (opts.teams === 'pairs' ? [4, 4] : [2, 4]),
  seatsHint: (opts) => (opts.teams === 'pairs' ? 'cs_pairs_seats' : 'cs_basra_seats'),
  teamMode: (opts) => opts.teams === 'pairs',
  dealer: true,
  seats: (names, opts, t) => (opts.teams === 'pairs' ? csTeams(names, t) : names.map(n => ({ name: n }))),
  goalText: (s, t) => (t.cs_to_target || '').replace('{n}', s.opts.target),
  /** The majority's worth this deck: 30, plus 30 for every tie just before it. */
  majority(s) {
    let worth = 30;
    for (let n = s.rounds.length - 1; n >= 0 && s.rounds[n].input.most === 'tie'; n--) worth += 30;
    return worth;
  },
  roundLabel: (s, t) => (t.cs_basra_worth || '').replace('{n}', CS_GAMES.basra.majority(s)),
  entryHtml(s, t) {
    const seats = csSeatItems(s);
    return `
      <span class="cs-label">${escapeHTML(t.cs_basra_count || '')}</span>
      ${s.seats.map((seat, i) => `<div class="cs-seat-row"><span class="cs-seat-row__name">${escapeHTML(seat.name)}</span>
        <span class="cs-seat-row__cells">
          <span class="cs-cell"><small>${escapeHTML(t.cs_basra_basras || '')}</small>${csStepperHtml('b' + i, csDraft(s, 'b' + i, 0), 0, 20)}</span>
          <span class="cs-cell"><small>${escapeHTML(t.cs_basra_aj || '')}</small>${csStepperHtml('a' + i, csDraft(s, 'a' + i, 0), 0, 8)}</span>
        </span></div>`).join('')}
      ${csQuickSlot()}
      <span class="cs-label">${escapeHTML(t.cs_basra_most || '')}</span>
      ${csPickHtml('most', seats.concat([{ v: 'tie', label: t.cs_basra_tie || '' }]), csDraft(s, 'pick-most', ''))}
      <span class="cs-label">${escapeHTML(t.cs_basra_card_two || '2♣')}</span>${csPickHtml('two', seats, csDraft(s, 'pick-two', ''))}
      <span class="cs-label">${escapeHTML(t.cs_basra_card_ten || '10♦')}</span>${csPickHtml('ten', seats, csDraft(s, 'pick-ten', ''))}`;
  },
  /** Four aces and four jacks in every deck. */
  quick: (s, t) => [{ kind: 'rest', keys: s.seats.map((_, i) => 'a' + i), total: 8, max: 8, label: t.cs_basra_aj || '' }],
  read: (s) => ({ b: s.seats.map((_, i) => csVal('b' + i) || 0), a: s.seats.map((_, i) => csVal('a' + i) || 0), most: csPicked('most'), two: csPicked('two'), ten: csPicked('ten') }),
  check(input, s, t) {
    if (input.most === null) return t.cs_basra_need_most;
    if (input.two === null || input.ten === null) return t.cs_basra_need_cards;
    if (csSum(input.a) !== 8) return (t.cs_basra_need_aj || '').replace('{n}', csSum(input.a));
    return '';
  },
  score(input, s) {
    const pts = input.b.map((n, i) => n * 10 + input.a[i]);
    if (input.most !== 'tie') pts[Number(input.most)] += CS_GAMES.basra.majority(s);
    pts[Number(input.two)] += 2;
    pts[Number(input.ten)] += 3;
    return { points: pts, tag: input.most === 'tie' ? '26' : '' };
  },
  ended(s, totals) {
    const top = Math.max.apply(null, totals);
    return top >= s.opts.target && totals.filter(x => x === top).length === 1;
  }
};

/* --- إستميشن ------------------------------------------------------------------------------
   Four players each call how many tricks they will take; the calls never add
   up to 13 (over or under). The highest bidder (the caller) names trumps, and
   whoever calls the same number as the caller is "with" (مع) them.
   - Made exactly: 10 + the call; +10 for the caller or مع; +10 per risk
     level for the risk player (the last to call: 2-3 off 13 is one level,
     4-5 two...); +10 for the only one who made it.
   - Missed: minus the tricks off; −10 for the caller or مع; −10 per risk
     level for the risk player; −10 for the only one who missed.
   - A dash call (0 announced before the bidding, two at most): ±33 in an
     under round and ±25 in an over round, or the Egyptian +33 / −23. A plain
     zero made in an under round is worth 10 more.
   - Everyone missed (صعايدة): nobody scores, and the next round counts
     double (four times after two).
   - 13 rounds, then 5 speed rounds with no bidding (18); or a short game. */
CS_GAMES.estimation = {
  icon: '🎯',
  options: {
    rounds: { label: 'cs_est_rounds', values: [18, 13], def: 18 },
    dash: { label: 'cs_est_dash', values: ['jawaker', 'egypt'], def: 'jawaker', labelOf: (v, t) => t['cs_est_dash_' + v] || v },
    base: { label: 'cs_est_base', values: [10, 13], def: 10 }
  },
  seatCount: () => [4, 4],
  seatsHint: () => 'cs_est_seats',
  dealer: true,
  seats: (names) => names.map(n => ({ name: n })),
  goalText: (s, t) => (t.cs_rounds_of || '').replace('{n}', s.rounds.length).replace('{m}', s.opts.rounds),
  speed: (s) => s.rounds.length >= 13,
  mult(s) {
    let m = 1;
    for (let n = s.rounds.length - 1; n >= 0 && s.rounds[n].allMissed; n--) m *= 2;
    return m;
  },
  roundLabel(s, t) {
    const g = CS_GAMES.estimation;
    const bits = [];
    if (g.speed(s)) bits.push(t.cs_est_speed || '');
    if (g.mult(s) > 1) bits.push('×' + g.mult(s));
    return bits.join(' · ');
  },
  entryHtml(s, t) {
    const g = CS_GAMES.estimation;
    const seats = csSeatItems(s);
    return `
      ${s.seats.map((seat, i) => `
        <div class="cs-seat-row">
          <span class="cs-seat-row__name">${escapeHTML(seat.name)}</span>
          <span class="cs-seat-row__cells">
            <span class="cs-cell"><small>${escapeHTML(t.cs_est_call || '')}</small>${csStepperHtml('c' + i, csDraft(s, 'c' + i, ''), 0, 13)}</span>
            <span class="cs-cell"><small>${escapeHTML(t.cs_est_took || '')}</small>${csStepperHtml('t' + i, csDraft(s, 't' + i, ''), 0, 13)}</span>
            <span class="cs-cell"><small>&nbsp;</small>${csToggleHtml('dash' + i, t.cs_est_dash_call || '', csDraft(s, 'tog-dash' + i, '') === '1')}</span>
          </span>
        </div>`).join('')}
      ${csQuickSlot()}
      ${g.speed(s) ? '' : `<span class="cs-label">${escapeHTML(t.cs_est_caller || '')}</span>${csPickHtml('caller', seats, csDraft(s, 'pick-caller', ''))}`}
      <span class="cs-label">${escapeHTML(t.cs_est_risk || '')}</span>
      ${csPickHtml('risk', [{ v: '', label: t.cs_nobody || '' }].concat(seats), csDraft(s, 'pick-risk', ''))}`;
  },
  /** Most players make their call; and the tricks add up to 13, so the last count is known. */
  quick: (s, t) => [
    { kind: 'same', from: s.seats.map((_, i) => 'c' + i), to: s.seats.map((_, i) => 't' + i), label: t.cs_quick_same || 'جاب طلبه بالظبط' },
    { kind: 'rest', keys: s.seats.map((_, i) => 't' + i), total: 13, max: 13, label: t.cs_est_took || '' }
  ],
  read(s) {
    return {
      calls: s.seats.map((_, i) => csVal('c' + i)),
      tricks: s.seats.map((_, i) => csVal('t' + i)),
      dash: s.seats.map((_, i) => csToggled('dash' + i)),
      caller: csPicked('caller'),
      risk: csPicked('risk') || ''
    };
  },
  check(input, s, t) {
    if (input.calls.some(c => c === null) || input.tricks.some(c => c === null)) return t.cs_est_need_all;
    if (csSum(input.tricks) !== 13) return (t.cs_need_13 || '').replace('{n}', csSum(input.tricks));
    if (csSum(input.calls) === 13) return t.cs_est_not_13;
    if (!CS_GAMES.estimation.speed(s) && input.caller === null) return t.cs_est_need_caller;
    if (input.dash.some((d, i) => d && input.calls[i] !== 0)) return t.cs_est_dash_zero;
    if (input.dash.filter(Boolean).length > 2) return t.cs_est_dash_two;
    if (Math.abs(csSum(input.calls) - 13) >= 2 && input.risk === '') return t.cs_est_need_risk;
    return '';
  },
  score(input, s) {
    const g = CS_GAMES.estimation;
    const over = csSum(input.calls) > 13;
    const levels = Math.floor(Math.abs(csSum(input.calls) - 13) / 2);
    const made = input.calls.map((c, i) => c === input.tricks[i]);
    const makers = made.filter(Boolean).length;
    const caller = input.caller === null ? -1 : Number(input.caller);
    const risk = input.risk === '' ? -1 : Number(input.risk);
    const mult = g.mult(s);
    if (makers === 0) return { points: s.seats.map(() => 0), tag: '0', allMissed: true };
    const pts = input.calls.map((call, i) => {
      if (input.dash[i]) {
        if (s.opts.dash === 'egypt') return made[i] ? 33 : -23;
        return (made[i] ? 1 : -1) * (over ? 25 : 33);
      }
      const withCaller = caller !== -1 && (i === caller || call === input.calls[caller]);
      if (made[i]) {
        let p = s.opts.base + call;
        if (withCaller) p += 10;
        if (i === risk) p += 10 * levels;
        if (makers === 1) p += 10;
        if (call === 0 && !over) p += 10;
        return p;
      }
      let p = -Math.abs(input.tricks[i] - call);
      if (withCaller) p -= 10;
      if (i === risk) p -= 10 * levels;
      if (makers === 3) p -= 10;
      return p;
    }).map(p => p * mult);
    return { points: pts, tag: (over ? '↑' : '↓') + (levels ? 'R' + levels : '') + (mult > 1 ? '×' + mult : '') };
  },
  ended: (s) => s.rounds.length >= s.opts.rounds
};
</script>
