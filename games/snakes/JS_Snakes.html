function snkT(key, vars) {
  const t = TRANSLATIONS[appState.lang] || {};
  const b = SNK_BUBBLES[appState.lang] || SNK_BUBBLES.ar;
  let s = t[key] || b[key] || (TRANSLATIONS.ar || {})[key] || SNK_BUBBLES.ar[key] || '';
  if (vars) Object.keys(vars).forEach(k => {
    const v = vars[k] === undefined || vars[k] === null ? '' : String(vars[k]);
    s = s.split('{' + k + '}').join(v && !/^[+-]?\d+$/.test(v) ? '⁨' + v + '⁩' : v);
  });
  return s;
}
const snkColorName = (c) => snkT('snk_color_' + c);
const snkPlaceWord = (n) => snkT('snk_place_' + Math.min(6, Math.max(1, n)));

/* --- small maths ------------------------------------------------------------------- */

const snkClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snkLerp = (a, b, t) => a + (b - a) * t;
const snkEase = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const snkEaseIn = t => t * t;
const snkEaseOut = t => 1 - (1 - t) * (1 - t);
const snkLin = t => t;
const snkBackOut = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function snkCr(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return { x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) };
}

/** A spline through the points, sampled every SNK_STEP along its length, with a normal at each sample. */
function snkSample(P) {
  const Q = [P[0]].concat(P, [P[P.length - 1]]);
  const dense = [];
  for (let i = 1; i < Q.length - 2; i++) for (let k = 0; k < 28; k++) dense.push(snkCr(Q[i - 1], Q[i], Q[i + 1], Q[i + 2], k / 28));
  dense.push(P[P.length - 1]);
  const acc = [0];
  for (let i = 1; i < dense.length; i++) acc.push(acc[i - 1] + Math.hypot(dense[i].x - dense[i - 1].x, dense[i].y - dense[i - 1].y));
  const L = acc[acc.length - 1];
  const out = [];
  let j = 0;
  for (let a = 0; a <= L; a += SNK_STEP) {
    while (j < acc.length - 2 && acc[j + 1] < a) j++;
    const f = (a - acc[j]) / ((acc[j + 1] - acc[j]) || 1);
    out.push({ x: snkLerp(dense[j].x, dense[j + 1].x, f), y: snkLerp(dense[j].y, dense[j + 1].y, f), a: a });
  }
  out.forEach((p, i) => {
    const q = out[Math.min(out.length - 1, i + 1)], r = out[Math.max(0, i - 1)];
    const dx = q.x - r.x, dy = q.y - r.y, l = Math.hypot(dx, dy) || 1;
    p.nx = -dy / l; p.ny = dx / l;
  });
  return { pts: out, L: out[out.length - 1].a };
}

/** A snake's way from its head (at the top corner of its square, on the side its body goes) to its tail. Seeded. */
function snkWay(s, rnd) {
  const H0 = snakesCellXY(s.h), T = snakesCellXY(s.t);
  const H = { x: H0.x + (T.x >= H0.x ? 19 : -19), y: H0.y - 19 };
  const dx = T.x - H.x, dy = T.y - H.y, L = Math.hypot(dx, dy), px = -dy / L, py = dx / L;
  const m = snkClamp(Math.round(L / 95), 1, 4), sign = rnd() < 0.5 ? 1 : -1;
  const P = [{ x: H.x, y: H.y }, { x: H.x + dx * 0.08, y: H.y + dy * 0.08 + 10 }];
  for (let j = 1; j <= m; j++) {
    const f = j / (m + 1), amp = (18 + rnd() * 20) * (j % 2 ? 1 : -1) * sign;
    P.push({ x: snkClamp(H.x + dx * f + px * amp, 16, 584), y: snkClamp(H.y + dy * f + py * amp, 16, 584) });
  }
  P.push({ x: T.x, y: T.y });
  return P;
}

const snkTint = (hex, k) => {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
};

  ${fez ? `<g transform="translate(2 -12) rotate(10)"><path d="M-8 0 L-6 -13 L6 -13 L8 0 Z" fill="#c62828" stroke="${I}" stroke-width="1.5"/><path d="M0 -13 Q5 -12 6 -4" stroke="${I}" stroke-width="1.2" fill="none"/><circle cx="6" cy="-3" r="1.8" fill="${I}"/></g>` : ''}

function snkPipsSvg(v) {

/** The board's fixed parts: the frame, the squares, the numbers, the cup, the mat and the layers the game fills. */
function snkBoardSvg(th) {
  const lk = SNK_LOOK;
  let s = `<svg class="snk-svg${th ? ' snk-th snk-th--' + th.id : ''}" viewBox="${SNK_VB.join(' ')}" dir="ltr" role="img" aria-label="${escapeHTML(snkT('setup_snakes'))}">`;
  s += `<rect x="${SNK_VB[0]}" y="${SNK_VB[1]}" width="${SNK_VB[2]}" height="${SNK_VB[3]}" fill="${th ? th.bg : lk.bg}"/>`;
  s += th ? `<g class="snk-back">${th.back()}</g>` : `<rect x="-22" y="-22" width="644" height="644" rx="18" fill="${lk.frame}"/><rect x="-8" y="-8" width="616" height="616" rx="8" fill="${lk.frame2}"/>`;

  let nums = '';
  s += '<g class="snk-tiles">';
  for (let n = 1; n <= 100; n++) {
    const p = snakesCellXY(n), x = p.x - SNK_C / 2, y = p.y - SNK_C / 2, col = Math.round(x / SNK_C), alt = (snakesRowOf(n) + col) % 2;
    const tl = th ? th.tile(n, x, y, alt) : null;
    const fill = tl ? tl.fill : (alt ? lk.tileB : lk.tileA);
    const ink = (tl && tl.num) || lk.num;
    s += `<g class="snk-tile" data-n="${n}">${tl ? tl.svg : `<rect x="${x}" y="${y}" width="${SNK_C}" height="${SNK_C}" fill="${fill}"/>`}</g>`;
    const st = ` stroke="${fill}" stroke-width="4" stroke-linejoin="round" style="paint-order:stroke"`;
    nums += `<g class="snk-num" data-n="${n}">`;
    if (n === 1) nums += `<text x="${p.x}" y="${p.y + 21}" text-anchor="middle" font-size="11" font-weight="800" fill="${ink}" font-family="Noto Kufi Arabic,sans-serif"${st}>${escapeHTML(snkT('snk_start_sq'))}</text>`;
    if (n !== 100) nums += `<text x="${p.x}" y="${p.y + (n === 1 ? 3 : 8)}" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="${n === 1 ? 19 : 21}" fill="${ink}"${st}>${n}</text>`;
    else nums += `<text x="${p.x}" y="${p.y + 24}" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="15" fill="${ink}"${st}>100</text>`;

  s += `</g><g class="snk-hints" style="pointer-events:none"></g><g class="snk-holes"></g><g class="snk-ladders"></g><g class="snk-snakes"></g><g class="snk-nums" style="pointer-events:none">${nums}</g><g class="snk-surp"></g><g class="snk-heads"></g>`;
  // The TV's night (the light turns slowly over a long game), over the board and under the cup and the pieces.
  s += `<g class="snk-night" style="pointer-events:none"><rect class="snk-dusk" x="-22" y="-22" width="644" height="644" rx="18" fill="#0b1a44" opacity="0"/><g class="snk-stars" opacity="0">${[[210, -15], [300, -12], [390, -16], [480, -13], [565, -15], [615, 60], [615, 300], [-15, 420], [-15, 180], [615, 520]].map(([x, y], i) => `<path class="snk-star" style="animation-delay:${(i * 0.37).toFixed(2)}s" d="M${x} ${y - 4} L${x + 1.2} ${y - 1.2} L${x + 4} ${y} L${x + 1.2} ${y + 1.2} L${x} ${y + 4} L${x - 1.2} ${y + 1.2} L${x - 4} ${y} L${x - 1.2} ${y - 1.2}Z" fill="#fff6c4"/>`).join('')}</g></g>`;
  const cupAt = snakesCellXY(100);
  const cup = `<g class="snk-cup"><path d="M-12 -16 H12 V-8 Q12 4 0 6 Q-12 4 -12 -8Z" fill="#ffc930" stroke="${SNK_INK}" stroke-width="1.8"/><path d="M-12 -12 Q-20 -12 -18 -4 Q-16 1 -10 0 M12 -12 Q20 -12 18 -4 Q16 1 10 0" stroke="${SNK_INK}" stroke-width="1.8" fill="none"/><rect x="-3" y="5" width="6" height="5" fill="#e0a810" stroke="${SNK_INK}" stroke-width="1.2"/><rect x="-9" y="10" width="18" height="5" rx="2" fill="#8a5a2b" stroke="${SNK_INK}" stroke-width="1.4"/><path d="M-6 -13 Q-6 -3 -1 1" stroke="#fff" stroke-width="2.2" opacity=".6" fill="none" stroke-linecap="round"/></g>`;
  s += `<g transform="translate(${cupAt.x} ${cupAt.y - 3})"><g class="snk-cupw"><circle class="snk-cupglow" cy="-4" r="24" fill="#ffe27a"/>${th && th.cup ? th.cup(cup) : cup}</g></g>`;
  // A theme's props round the edge (never over a square), under the pieces walking off and the bubbles.
  if (th && th.outer) s += `<g class="snk-outer" style="pointer-events:none">${th.outer()}</g>`;
  s += `<g class="snk-under"></g><g class="snk-pieces"></g><g class="snk-zzL" style="pointer-events:none"></g>`;
  s += `<g class="snk-die" opacity="0"><rect x="-15" y="-15" width="30" height="30" rx="7" fill="#fff" stroke="${SNK_INK}" stroke-width="2"/><g class="snk-pips"></g></g><g class="snk-fx"></g>`;
  if (!th || !th.noFlies) s += ['#ff9ec7', '#9fd3ff'].map((c, i) => `<g class="snk-fly${i ? ' b' : ''}"><path class="snk-wing" d="M0 0 C-12 -14 -16 2 0 2 Z" fill="${c}" stroke="${SNK_INK}" stroke-width=".7"/><path class="snk-wing r" d="M0 0 C12 -14 16 2 0 2 Z" fill="${c}" stroke="${SNK_INK}" stroke-width=".7"/><path d="M0 -5 V5" stroke="${SNK_INK}" stroke-width="1.8"/></g>`).join('');
  return s + '</svg>';

const snkEl = (tag, attrs, parent) => {
  const e = document.createElementNS(SNK_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const snkTR = (e, x, y, s, r) => e.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(r || 0).toFixed(1)}) scale(${(s == null ? 1 : s).toFixed(3)})`);

/* --- the one board on the page ------------------------------------------------------ */

/**
 * The board: its svg and layers, the map mounted on it, the pieces, what is
 * playing and the loop that draws the snakes. `feed(g, ctx)` gives it a game.
 */
const snkView = { root: null, c: null, raf: 0, lastFrame: 0, lastT: 0 };

function snkEnsure(themeId) {
  const want = snkThemeOf(themeId) ? themeId : 'classic';
  if (snkView.root && snkView.c) {
    // The board's own words (ابدأ, أنت, the signs) are drawn once: another language is a new board too.
    const sameLang = snkView.c.lang === appState.lang;
    if (sameLang && (themeId === undefined || snkView.c.themeId === want)) return snkView.c;
    // Another map's dress: a new board in its place (the frame keeps the place: snkShowIn puts it back).
    const host = snkView.root.parentNode;
    const keepTheme = themeId === undefined ? snkView.c.themeId : want;
    snkDrop();
    const c2 = snkEnsure(keepTheme);
    if (host) host.appendChild(snkView.root);
    return c2;
  }
  const th = snkThemeOf(want);
  const root = document.createElement('div');
  root.className = 'snk-board';
  root.innerHTML = snkBoardSvg(th);
  const svg = root.querySelector('svg');
  const q = (sel) => svg.querySelector(sel);
  const c = {
    svg: svg, gen: 0, fast: false, map: null, built: false, key: '', lastSeq: 0, queue: [], playing: false, busyUntil: 0,
    th: th, themeId: want, lang: appState.lang,
    tiles: [...svg.querySelectorAll('.snk-tile')].map(g => { const n = Number(g.dataset.n); const p = snakesCellXY(n); return { g: g, num: svg.querySelector(`.snk-num[data-n="${n}"]`), cx: p.x, cy: p.y }; }),
    holesL: q('.snk-holes'), headsL: q('.snk-heads'), laddersL: q('.snk-ladders'), snakesL: q('.snk-snakes'), under: q('.snk-under'), fx: q('.snk-fx'),
    piecesL: q('.snk-pieces'), trophy: q('.snk-cupw'), die: q('.snk-die'), surpL: q('.snk-surp'), zzL: q('.snk-zzL'),
    snakes: [], ladders: [], players: {}, surp: {}, time: 0, animating: 0, ctx: null,
    dusk: q('.snk-dusk'), stars: q('.snk-stars'), night: 0
  };
  // A tap during the building skips it on this device.
  svg.addEventListener('pointerdown', () => { if (c.building) c.fast = true; });
  // A tap on a piece says whose it is.
  svg.addEventListener('click', (ev) => {
    if (c.building || !svg.getScreenCTM()) return;
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const at = pt.matrixTransform(svg.getScreenCTM().inverse());
    let best = null, bd = 24;
    Object.keys(c.players).forEach(id => { const p = c.players[id]; if (p.hidden || p.leaving) return; const d = Math.hypot(p.x - at.x, p.y - 4 * (p.k || 1) - at.y); if (d < bd) { bd = d; best = p; } });
    if (best) snkNameBubble(c, best);
  });
  snkView.root = root;
  snkView.c = c;
  return c;
}

/** Throws the board away (no screen shows it any more). */
function snkDrop() {
  snkAwClose();   // the awards replay lives on this board: its sounds and confetti stop with it
  const c = snkView.c;
  if (c) { c.gen++; c.queue = []; c.playing = false; c.building = false; }
  if (snkView.raf) cancelAnimationFrame(snkView.raf);
  snkView.raf = 0;
  if (snkView.root && snkView.root.parentNode) snkView.root.parentNode.removeChild(snkView.root);
  snkView.root = null;
  snkView.c = null;
}

/** Puts the board into `host` (the frame's place for it), dressed in `themeId` (a game's g.theme; the classic when none). */
function snkShowIn(host, themeId) {
  const c = snkEnsure(themeId || 'classic');
  if (host && snkView.root.parentNode !== host) host.appendChild(snkView.root);
  snkKick();
  snkFit();
  return c;
}

/**
 * The board as big as it can be (the owner, 29 Sep 2026). Upright the board is the column's width
 * (CSS). Wherever the frame is two columns (a phone on its side, a laptop, the TV) the board's
 * height is what is left of the play area under the frame's top - measured, not guessed - and
 * never so wide the column beside it drops under its least width; the side column is held to the
 * same height and scrolls inside itself, so the page never does.
 */
function snkFit() {
  const root = snkView.root;
  const lay = root && root.isConnected ? root.closest('.snk-layout') : null;
  if (!lay) return;
  const cs = getComputedStyle(lay);
  if (cs.display !== 'grid') { lay.style.removeProperty('--snk-bw'); lay.style.removeProperty('--snk-fh'); return; }
  // A reload paints the board while its screen is still hidden (0 wide): measuring then
  // set a 166px board that stayed until the next roll. Look again once it shows, for a while.
  if (!lay.getClientRects().length) {
    if (snkFitTries++ < 120) { cancelAnimationFrame(snkFitT); snkFitT = requestAnimationFrame(snkFit); }
    return;
  }
  snkFitTries = 0;
  const side = lay.querySelector('.snk-layout__side');
  let availH;
  if (lay.closest('.snk--tv')) availH = lay.clientHeight;
  else {
    const main = document.getElementById('shell-main');
    if (!main) return;
    const ms = getComputedStyle(main);
    const pt = parseFloat(ms.paddingTop) || 0, pb = parseFloat(ms.paddingBottom) || 0;
    const top = lay.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop - pt;
    availH = main.clientHeight - pt - pb - Math.max(0, top) - 2;
  }
  const gap = parseFloat(cs.columnGap) || 0;
  const sideMin = side ? parseFloat(getComputedStyle(side).minWidth) || 0 : 0;
  const availW = lay.clientWidth - gap - sideMin;
  const vb = root.querySelector('.snk-svg') && root.querySelector('.snk-svg').viewBox.baseVal;
  const ratio = vb && vb.height ? vb.width / vb.height : SNK_RATIO;
  const h = Math.max(180, Math.floor(Math.min(availH, availW / ratio)));
  const bw = Math.floor(h * ratio) + 'px', fh = Math.floor(Math.max(availH, h)) + 'px';
  if (lay.style.getPropertyValue('--snk-bw') !== bw) lay.style.setProperty('--snk-bw', bw);
  if (lay.style.getPropertyValue('--snk-fh') !== fh) lay.style.setProperty('--snk-fh', fh);
}
let snkFitT = 0, snkFitTries = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(snkFitT); snkFitT = requestAnimationFrame(snkFit); });

/* --- the map on the board ------------------------------------------------------------ */

/** A map's key on the board: its seed, and how many times a snake has moved on it («الخريطة بتتحرك»). */
// A kept map (959) can come back with or without its surprise squares, so they are part of the key.
const snkMapKey = (m) => (m ? (m.seed || 0) + ':' + (m.v || 0) + (m.surp ? ':s' + Object.keys(m.surp).join('.') : '') : '');

/**
 * One snake (or a theme's down piece) on the board: `d` its dress (colour, the طربوش, its curve and the
 * numbers that make it breathe its own way), drawn by the theme's mountDown or the classic below.
 */
function snkMountSnake(c, s, i, d) {
  const th = c.th;
  const { pts, L } = snkSample(d.P);
  const base = {
    col: d.col, fez: d.fez, dress: d, pts: pts, L: L, W: d.W, holeK: 1, s: 0, dir: 1, amp: snkAmpOf(c), ph: d.ph, bulge: null, jaw: 0,
    lunge: { x: 0, y: 0, s: 1 }, mood: '', tilt: 0, pox: 0, poy: 0, spotStyle: i % 3, tailFlick: 0, sleepAt: d.sleepAt, sleepFor: 0, hx: 0, hy: 0
  };
  if (th) return Object.assign({}, s, base, th.mountDown(c, s, i, Object.assign({}, d, { pts: pts, L: L })));
  const col = d.col;
  const hole = snkEl('g', {}, c.holesL);
  const tp = pts[pts.length - 1];
  snkEl('ellipse', { cx: tp.x, cy: tp.y + 3, rx: 13, ry: 7, fill: '#1a1208', stroke: snkTint(SNK_LOOK.tileA, -0.4), 'stroke-width': 2.5 }, hole);
  const g = snkEl('g', { class: 'snk-snake' }, c.snakesL);
  const body = snkEl('path', { fill: col, stroke: SNK_INK, 'stroke-width': 2.3, 'stroke-linejoin': 'round' }, g);
  const spots = snkEl('path', { fill: snkTint(col, i % 2 ? 0.55 : -0.3), opacity: 0.95 }, g);
  const shine = snkEl('path', { fill: 'none', stroke: '#fff', 'stroke-opacity': 0.38, 'stroke-width': 3.2, 'stroke-linecap': 'round' }, g);
  const hd = snkEl('g', {}, c.headsL);
  hd.innerHTML = snkHeadSvg(col, d.fez);
  hd.querySelector('.snk-tongue').style.animationDelay = d.tongue.toFixed(2) + 's';
  hd.querySelectorAll('.snk-lid').forEach((l, k) => { l.style.animationDelay = d.lids[k].toFixed(2) + 's'; });
  return Object.assign({}, s, base, {
    g: g, body: body, spots: spots, shine: shine, hd: hd, hole: hole,
    hdi: hd.querySelector('.snk-hdi'), maw: hd.querySelector('.snk-maw'), smile: hd.querySelector('.snk-smile'), pups: [...hd.querySelectorAll('.snk-pup')]
  });
}

/** Takes one snake's drawing off the board. */
function snkUnmountSnake(sn) {
  [sn.g, sn.hd, sn.hole].concat(sn.extra || []).forEach(e => { if (e && e.parentNode) e.parentNode.removeChild(e); });
}

/** A snake's curve: the theme's, or the classic's. */
const snkWayOf = (c) => (c.th && c.th.way ? c.th.way : snkWay);

function snkMountMap(c, m) {
  // The board's own copy: a snake that moves («الخريطة بتتحرك») is moved on it as the move is shown.
  c.map = JSON.parse(JSON.stringify(m));
  c.mapKey = snkMapKey(m);
  c.snakesL.innerHTML = ''; c.headsL.innerHTML = ''; c.holesL.innerHTML = ''; c.laddersL.innerHTML = '';
  const th = c.th;
  // Everything about the look comes from the map's seed, so every phone and the TV draw the same. A seeded
  // Fisher-Yates (2 Oct 2026): the random comparator it replaced drew the colours, the طربوش and every curve
  // differently in Safari and in Chrome.
  const rnd = snakesRng((m.seed || 1) ^ 0x5bd1e995);
  const cols = snakesShuffle(th ? th.cols : SNK_LOOK.snakes, rnd);
  const fezAt = Math.floor(rnd() * m.snakes.length);
  const wayOf = snkWayOf(c);
  c.snakes = m.snakes.map((s, i) => {
    // A snake that moved («الخريطة بتتحرك») has its own curve (`w`); the draws its first one took are
    // still taken (`was`), so every other snake keeps its own curve.
    let P;
    if (s.was && s.w) { wayOf(s.was, rnd); P = wayOf(s, snakesRng(s.w)); }
    else P = wayOf(s, rnd);
    const d = { col: cols[i % cols.length], fez: i === fezAt, P: P, tongue: rnd() * 3, lids: [rnd() * 4, rnd() * 4] };
    d.W = th && th.width ? th.width(rnd) : 15.5 + rnd() * 2;
    d.ph = rnd() * 6;
    d.sleepAt = 6 + rnd() * 14;
    return snkMountSnake(c, s, i, d);
  });
  c.ladders = m.ladders.map(l => {
    const a = snakesCellXY(l.f), b = snakesCellXY(l.t);
    if (th) return Object.assign({}, l, { a: a, b: b, side: (a.x + b.x) / 2 < 300 ? -1 : 1 }, th.mountUp(c, Object.assign({}, l, { a: a, b: b, side: (a.x + b.x) / 2 < 300 ? -1 : 1 }), {}));
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, vx = -uy * 8, vy = ux * 8;
    const A = { x: a.x - ux * 6, y: a.y - uy * 6 }, B = { x: b.x + ux * 6, y: b.y + uy * 6 };
    const g = snkEl('g', {}, c.laddersL), inner = snkEl('g', {}, g);
    const rails = `M${A.x - vx} ${A.y - vy} L${B.x - vx} ${B.y - vy} M${A.x + vx} ${A.y + vy} L${B.x + vx} ${B.y + vy}`;
    let rungs = '';
    for (let d = 11; d < L + 4; d += 12) { const cx = A.x + ux * d, cy = A.y + uy * d; rungs += `M${cx - vx} ${cy - vy} L${cx + vx} ${cy + vy}`; }
    snkEl('path', { d: rails + rungs, stroke: 'rgba(0,0,0,.18)', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', transform: 'translate(4 5)' }, inner);
    snkEl('path', { d: rungs, stroke: SNK_LOOK.lInk, 'stroke-width': 4.4, 'stroke-linecap': 'round', fill: 'none' }, inner);
    snkEl('path', { d: rungs, stroke: SNK_LOOK.rung, 'stroke-width': 2.4, 'stroke-linecap': 'round', fill: 'none' }, inner);
    snkEl('path', { d: rails, stroke: SNK_LOOK.lInk, 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, inner);
    snkEl('path', { d: rails, stroke: SNK_LOOK.rail, 'stroke-width': 3.6, 'stroke-linecap': 'round', fill: 'none' }, inner);
    snkEl('path', { d: rails, stroke: '#fff', 'stroke-opacity': 0.35, 'stroke-width': 1.1, 'stroke-linecap': 'round', fill: 'none', transform: 'translate(-.7 -.7)', class: 'snk-shine' }, inner);
    const glowL = snkEl('path', { d: rails + rungs, stroke: '#ffe27a', 'stroke-width': 9, 'stroke-linecap': 'round', fill: 'none', opacity: 0 }, inner);
    return Object.assign({}, l, { g: g, inner: inner, a: a, b: b, glowL: glowL, side: (a.x + b.x) / 2 < 300 ? -1 : 1 });
  });
  snkMountSurprises(c, m);
}

/** The surprise squares' objects, each standing at the top of its square (none on a map without them). */
function snkMountSurprises(c, m) {
  c.surpL.innerHTML = '';
  c.surp = {};
  Object.keys((m && m.surp) || {}).forEach(key => {
    const n = Number(key), k = m.surp[key], q = snakesCellXY(n);
    const wrap = snkEl('g', { class: 'snk-sp snk-sp--' + k, transform: `translate(${q.x} ${q.y - 12})` }, c.surpL);
    const mk = snkEl('g', { class: 'snk-mk' }, wrap);
    mk.innerHTML = `<g transform="scale(1.22)">${snkStandSvg(k)}</g>`;
    c.surp[n] = { n: n, k: k, cx: q.x, cy: q.y, mk: mk, wrap: wrap, top: { x: q.x, y: q.y - 30 } };
  });
}

/* --- the snakes, drawn every frame ------------------------------------------------------- */

// The board plays its moves even when the device asks for less motion (Windows' animation effects
// off, an iPhone's Reduce Motion): the owner's spec, 'still under motion off'. Only the app's own
// setting (الحركة → مقفولة) and a page that isn't showing still it - as المشنقة's endings (hmEndsStill).
const snkStill = () => (typeof motionPref === 'function' && motionPref() === 'off') || document.hidden;
/** The motion setting, read once a frame (not once a point: 1,000 points a frame). */
let snkStillNow = false;
/** A number with one decimal, for the paths drawn every frame (faster than toFixed). */
const snkR = (v) => Math.round(v * 10) / 10;

function snkWave(sn, b, t) { return snkStillNow ? 0 : sn.amp * Math.sin(b.a * 0.05 - t * 2.3 + sn.ph) * Math.min(1, (b.a - sn.s) / 30); }
function snkSpineAt(sn, a, t) {
  const i = snkClamp(Math.round(a / SNK_STEP), 0, sn.pts.length - 1), b = sn.pts[i], o = snkWave(sn, b, t);
  return { x: b.x + b.nx * o, y: b.y + b.ny * o, nx: b.nx, ny: b.ny };
}

/**
 * The body's points this frame, for the classic and every theme: from `sn.s` (the part out of its
 * hole) to the tail, waving, a flick of the tail, a bulge going down, or crawling along its way
 * (snkCrawlAt). `wFn(b, d, dt)` is the width at a point (d from the visible head, dt to the tail);
 * each point has x, y, w, its normal nx, ny, its tangent tx, ty and a (its place along the body).
 * Shows or hides the body, the head and the hole; null when the snake is all in its hole.
 */
function snkBodyPts(c, sn, t, wFn) {
  const n = sn.pts.length, i0 = snkClamp(Math.round(sn.s / SNK_STEP), 0, n - 1);
  const hide = i0 >= n - 2;
  if (sn.g) sn.g.setAttribute('opacity', hide ? 0 : 1);
  if (sn.hd) sn.hd.setAttribute('opacity', hide ? 0 : 1);
  const tp = sn.pts[n - 1];
  if (sn.hole) sn.hole.setAttribute('transform', `translate(${tp.x} ${tp.y}) scale(${sn.holeK.toFixed(3)}) translate(${-tp.x} ${-tp.y})`);
  if (hide) return null;
  // The sneak (the owner's review): the whole snake crawls along its way out to him and back, the body
  // following the head (snkCrawlAt), the tail leaving its hole; at d = 0 it is exactly its own shape.
  const cr = sn.crawl && sn.crawl.d > 0 ? sn.crawl : null;
  const P = [];
  for (let i = i0; i < n; i++) {
    const b = sn.pts[i], d = b.a - sn.s, dt = sn.L - b.a;
    let w = wFn(b, d, dt);
    if (sn.bulge != null) w += 13 * Math.exp(-Math.pow((b.a - sn.bulge) / 12, 2));
    if (cr) { const q = snkCrawlAt(sn, cr.d - b.a * (cr.k || 1)); P.push({ x: q.x, y: q.y, w: w, nx: 0, ny: 0, a: b.a }); continue; }
    let o = snkWave(sn, b, t);
    if (sn.tailFlick && dt < 70) o += sn.tailFlick * (1 - dt / 70) * 18;
    P.push({ x: b.x + b.nx * o, y: b.y + b.ny * o, w: w, nx: b.nx, ny: b.ny, a: b.a });
  }
  if (cr) {
    // Crawling: the sides from the way's own direction at each point.
    for (let k = 0; k < P.length; k++) {
      const q1 = P[Math.max(0, k - 1)], q2 = P[Math.min(P.length - 1, k + 1)], dx = q2.x - q1.x, dy = q2.y - q1.y, l = Math.hypot(dx, dy) || 1;
      P[k].nx = -dy / l; P[k].ny = dx / l;
    }
  }
  P.forEach(q => { q.tx = q.ny; q.ty = -q.nx; });
  return P;
}

/** The outline of a body of points P (each with its width): a closed path. */
function snkOutline(P) {
  const Lf = [], Rf = [];
  P.forEach(q => {
    Lf.push(snkR(q.x + q.nx * q.w / 2) + ' ' + snkR(q.y + q.ny * q.w / 2));
    Rf.push(snkR(q.x - q.nx * q.w / 2) + ' ' + snkR(q.y - q.ny * q.w / 2));
  });
  return 'M' + Lf.join('L') + 'L' + Rf.reverse().join('L') + 'Z';
}

/**
 * The head's life, for the classic and every theme: who is near it (it watches a piece within about
 * three squares), a doze with nobody near and a yawn awake (sn.jaw, unless a move is playing on it).
 * Returns { near, nd, still }.
 */
function snkHeadLife(c, sn, t, hx, hy) {
  sn.hx = hx; sn.hy = hy;
  let near = null, nd = 1e9;
  Object.keys(c.players).forEach(id => { const p = c.players[id]; if (p.hidden) return; const dd = Math.hypot(p.x - hx, p.y - hy); if (dd < nd) { nd = dd; near = p; } });
  const still = snkStillNow;
  // Now and then a snake with nobody near dozes off, and yawns awake.
  if (!still && !sn.mood && !c.building && sn.s < 1) {
    if (near && nd < SNK_C * 3) sn.sleepAt = Math.max(sn.sleepAt, t + 4);
    else if (t > sn.sleepAt) { sn.mood = 'sleep'; sn.sleepFor = t + (4 + (sn.ph % 3)) * (1 + (c.night || 0)); }
  }
  if (sn.mood === 'sleep' && (t > sn.sleepFor || (near && nd < SNK_C * 2))) {
    sn.mood = '';
    sn.yawnAt = t;
    // At night on the TV the snakes doze more: shorter awake, longer asleep.
    sn.sleepAt = t + (10 + ((sn.ph * 7) % 12)) * (1 - 0.6 * (c.night || 0));
  }
  if (sn.yawnAt && !still) {
    const k = (t - sn.yawnAt) / 1.1;
    if (k >= 1) { sn.yawnAt = 0; if (!c.animatingSnake || c.animatingSnake !== sn) sn.jaw = 0; }
    else if (!c.animatingSnake || c.animatingSnake !== sn) sn.jaw = Math.sin(k * Math.PI) * 0.7;
  }
  return { near: near, nd: nd, still: still };
}

/** The head's mood as a class on its inner group (m-sleep, m-wow, m-lick…), written only when it changes. */
function snkHeadMood(sn, base) {
  const cls = base + (sn.mood ? ' m-' + sn.mood : '');
  if (sn.hdi && sn.hdi.getAttribute('class') !== cls) sn.hdi.setAttribute('class', cls);
}

function snkRenderSnake(c, sn, t) {
  const P = snkBodyPts(c, sn, t, (b, d, dt) => {
    let w = sn.W;
    if (d < 16) w *= 0.72 + 0.28 * d / 16;
    return w * Math.min(1, 0.1 + dt / (0.42 * sn.L));
  });
  if (!P) return;
  sn.body.setAttribute('d', snkOutline(P));
  let sp = '', sh = '';
  for (let k = 5; k < P.length - 4; k += 5) {
    const q = P[k], side = (Math.round(q.a / 20) % 2) ? 1 : -1, r = q.w * 0.24;
    if (sn.spotStyle === 1) {
      const q2 = P[Math.min(P.length - 1, k + 1)];
      const a = q.w * 0.44, a2 = q2.w * 0.44;
      sp += 'M' + snkR(q.x + q.nx * a) + ' ' + snkR(q.y + q.ny * a) + 'L' + snkR(q.x - q.nx * a) + ' ' + snkR(q.y - q.ny * a) +
        'L' + snkR(q2.x - q2.nx * a2) + ' ' + snkR(q2.y - q2.ny * a2) + 'L' + snkR(q2.x + q2.nx * a2) + ' ' + snkR(q2.y + q2.ny * a2) + 'Z';
    } else if (r > 1.2) {
      const cx = q.x + q.nx * q.w * 0.17 * side, cy = q.y + q.ny * q.w * 0.17 * side;
      const rr = snkR(r);
      sp += 'M' + snkR(cx - r) + ' ' + snkR(cy) + 'a' + rr + ' ' + rr + ' 0 1 0 ' + snkR(2 * r) + ' 0a' + rr + ' ' + rr + ' 0 1 0 ' + snkR(-2 * r) + ' 0';
    }
  }
  for (let k = 4; k < P.length - 6; k += 2) { const q = P[k]; sh += (sh ? 'L' : 'M') + snkR(q.x + q.nx * q.w * 0.3) + ' ' + snkR(q.y + q.ny * q.w * 0.3); }
  sn.spots.setAttribute('d', sp);
  sn.shine.setAttribute('d', sh);
  // The head: upright, looking about, or at a piece that has come within about three squares.
  const h = P[0], h2 = P[Math.min(P.length - 1, 4)];
  let fx = h.x - h2.x;
  const fl = Math.hypot(fx, h.y - h2.y) || 1;
  fx /= fl;
  const hx = h.x, hy = h.y - 1;
  const { near, nd, still } = snkHeadLife(c, sn, t, hx, hy);
  let tt = sn.dir < 0 ? -fx * 25 : fx * 18, px = still ? 0 : Math.sin(t * 0.7 + sn.ph) * 1.2, py = still ? 0 : Math.cos(t * 0.5 + sn.ph) * 0.8;
  if (near && nd < SNK_C * 3 && sn.mood !== 'sleep') { tt = snkClamp((near.x - hx) / nd * 24, -24, 24); px = (near.x - hx) / nd * 2.4; py = (near.y - hy) / nd * 2.2; }
  // A win: the snakes sway together like a crowd.
  if (c.crowd && !still) { tt = Math.sin(t * 5) * 22; py -= Math.abs(Math.sin(t * 5)) * 1.5; }
  sn.tilt = snkLerp(sn.tilt, tt, 0.12); sn.pox = snkLerp(sn.pox, px, 0.25); sn.poy = snkLerp(sn.poy, py, 0.25);
  const br = still ? 1 : 1 + 0.025 * Math.sin(t * 2 + sn.ph);
  snkTR(sn.hd, hx + sn.lunge.x, hy + sn.lunge.y, sn.lunge.s * br * 0.62, sn.tilt + (sn.lunge.r || 0));
  sn.pups.forEach(p => p.setAttribute('transform', `translate(${sn.pox.toFixed(2)} ${sn.poy.toFixed(2)})`));
  sn.maw.setAttribute('transform', `translate(0 9) scale(1 ${Math.max(0.01, sn.jaw).toFixed(3)})`);
  sn.smile.setAttribute('opacity', sn.jaw > 0.1 ? 0 : 1);
  snkHeadMood(sn, 'snk-hdi');
}

/**
 * A point of a crawling snake (the sneak): `s` >= 0 is along its way out (from its head's own place
 * toward him), `s` < 0 back down its own resting body (tail-wards). A body point at `a` from the head
 * is at s = d - a, so the body follows the head along one path: at d = 0 it lies exactly in its own
 * shape, and the further it crawls the more of the tail has left its hole.
 */
function snkCrawlAt(sn, s) { return snkCrawlPoint(sn.pts, sn.crawl.way, s); }
function snkCrawlPoint(pts, way, s) {
  const arr = s >= 0 ? way : pts, u = Math.abs(s) / SNK_STEP;
  const i = Math.min(arr.length - 1, Math.floor(u)), j = Math.min(arr.length - 1, i + 1), f = Math.min(1, u - i);
  return { x: snkLerp(arr[i].x, arr[j].x, f), y: snkLerp(arr[i].y, arr[j].y, f) };
}

/**
 * One way out for a crawl: from the head's own place a little on where it points, then (`turn` ±1) a
 * wide arc of radius `R` until it faces `to`, then on to `to` in gentle bends of `amp` either side.
 */
function snkCrawlWayOf(pts, to, turn, R, amp) {
  const H = pts[0], B = pts[Math.min(pts.length - 1, 5)];
  let fx = H.x - B.x, fy = H.y - B.y;
  const fl = Math.hypot(fx, fy) || 1;
  fx /= fl; fy /= fl;
  const P = [{ x: H.x, y: H.y }];
  const inB = (u, v) => u >= 14 && u <= 586 && v >= 14 && v <= 586;
  let x = H.x, y = H.y, hx = fx, hy = fy;
  // On a little where the head points - unless that is off the board (a head in the top row points up).
  if (inB(x + fx * 14, y + fy * 14)) { x += fx * 14; y += fy * 14; P.push({ x: x, y: y }); }
  if (turn) {
    const st = 8, da = st / R;
    const rotBy = (a) => { const c0 = Math.cos(a * turn), s0 = Math.sin(a * turn), nx = hx * c0 - hy * s0, ny = hx * s0 + hy * c0; hx = nx; hy = ny; };
    for (let k = 0, rot = 0; k < 90 && rot < Math.PI * 1.25; k++) {
      const tx = to.x - x, ty = to.y - y, tl = Math.hypot(tx, ty) || 1;
      if (hx * tx / tl + hy * ty / tl > 0.94 || tl < 20) break;
      rotBy(da); rot += da;
      // At the board's edge it turns along it (tighter there), never off the board.
      for (let e = 0; e < 12 && !inB(x + hx * st, y + hy * st); e++) { rotBy(da); rot += da; }
      x = snkClamp(x + hx * st, 14, 586); y = snkClamp(y + hy * st, 14, 586);
      P.push({ x: x, y: y });
    }
  }
  const dx = to.x - x, dy = to.y - y, D = Math.hypot(dx, dy) || 1, px = -dy / D, py = dx / D;
  const m = D > 70 && amp ? snkClamp(Math.round(D / 90), 1, 3) : 0;
  for (let j = 1; j <= m; j++) {
    const f = j / (m + 1), a = amp * (j % 2 ? 1 : -1);
    P.push({ x: snkClamp(x + dx * f + px * a, 14, 586), y: snkClamp(y + dy * f + py * a, 14, 586) });
  }
  if (D > 6) P.push({ x: to.x, y: to.y });
  return snkSample(P);
}

/**
 * How badly a crawl tangles: the body sampled at 14 moments of the way out (the way home is the same
 * moments backwards), counting the places where two parts of it that are far apart along the body come
 * closer than its width (a crossing or an overlap), and every point off the board's squares. 0 is clean.
 */
function snkCrawlKnots(pts, way, W) {
  const L = pts[pts.length - 1].a, D = way[way.length - 1].a, gap = Math.max(3 * W, 48) / SNK_STEP, lim = W * W;
  let bad = 0;
  for (let k = 0; k <= 13; k++) {
    const d = D * k / 13, Q = [];
    for (let a = 0; a <= L; a += SNK_STEP * 2) Q.push(snkCrawlPoint(pts, way, d - a));
    for (let i = 0; i < Q.length; i++) {
      if (Q[i].x < 6 || Q[i].x > 594 || Q[i].y < 6 || Q[i].y > 594) bad++;
      for (let j = i + Math.ceil(gap / 2); j < Q.length; j++) {
        const ex = Q[i].x - Q[j].x, ey = Q[i].y - Q[j].y;
        if (ex * ex + ey * ey < lim) bad++;
      }
    }
  }
  return bad;
}

/**
 * The crawl for the sneak: the snake (its resting spine `pts`, width `W`) comes to beside him at `at`
 * (on the ladder). It tries each side of him and each way of getting there - straight on, or a wide
 * arc (0.8-1.3 squares) turning either way when he is behind its head - and keeps the shortest way
 * whose body never crosses or overlaps itself at any moment and stays on the board; failing that, the
 * least tangled. The same on every screen (nothing random). Returns { way, D, target, knots }.
 */
function snkCrawlPlan(pts, at, W) {
  const H = pts[0];
  const near = H.x >= at.x ? 1 : -1;               // his side the snake is on first
  const targets = [
    { x: snkClamp(at.x + near * 24, 14, 586), y: at.y - 6 },
    { x: snkClamp(at.x - near * 24, 14, 586), y: at.y - 6 },
    { x: snkClamp(at.x, 14, 586), y: snkClamp(at.y - 30, 14, 586) }
  ];
  const B = pts[Math.min(pts.length - 1, 5)], fx = H.x - B.x, fy = H.y - B.y, fl = Math.hypot(fx, fy) || 1;
  let best = null;
  targets.forEach((to, ti) => {
    // Straight on only when he is ahead of its head; otherwise a wide arc (never a hairpin at the head).
    const tx = to.x - H.x, ty = to.y - H.y, ahead = (fx * tx + fy * ty) / fl / (Math.hypot(tx, ty) || 1) > 0.35;
    [[0, 0, 15], [0, 0, -15], [0, 0, 0], [1, 55, 12], [-1, 55, 12], [1, 75, 0], [-1, 75, 0], [1, 48, 0], [-1, 48, 0]].forEach(([turn, R, amp]) => {
      if (!turn && !ahead) return;
      const w = snkCrawlWayOf(pts, to, turn, R || 55, amp);
      const knots = snkCrawlKnots(pts, w.pts, W);
      const score = knots * 1000 + w.L + ti * 40 + (turn ? 10 : 0);
      if (!best || score < best.score) best = { way: w.pts, D: w.L, target: to, knots: knots, score: score };
    });
  });
  return best;
}

/** One loop for the page: every frame while something moves, about 20 a second at rest, nothing when hidden. */
function snkFrame(now) {
  snkView.raf = 0;
  const c = snkView.c;
  if (!c || !snkView.root || !snkView.root.isConnected || document.hidden) return;
  const t = now / 1000;
  c.time = t;
  snkStillNow = snkStill();
  const resting = !c.animating && !c.building;
  // At rest: 78 -> 45 ms on a phone, 33 on the TV (the owner, 8 Oct 2026: the sway looked choppy).
  const restMs = document.body.classList.contains('is-tv-view') ? 33 : 45;
  if (!resting || now - snkView.lastFrame > restMs) {
    snkView.lastFrame = now;
    const draw = c.th ? c.th.renderDown : snkRenderSnake;
    c.snakes.forEach(sn => draw(c, sn, t));
    if (!snkStillNow) snkAmbient(c, t);
  }
  if (snkStillNow && resting) return;          // nothing lives with the motion off: drawn once, then still
  snkView.raf = requestAnimationFrame(snkFrame);
}

function snkKick() {
  if (!snkView.raf && snkView.c) snkView.raf = requestAnimationFrame(snkFrame);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) snkKick(); });

/* --- helpers for the motion --------------------------------------------------------------- */

/** A tween on `c` that stops when the board moves on (a new game, dropped) and finishes at once when fast. */
function snkTween(c, g, ms, fn, ez) {
  const e = ez || snkEase;
  if (c.gen !== g) return Promise.resolve(false);
  if (c.fast || snkStill() || !ms) { fn(1, 1); return Promise.resolve(c.gen === g); }
  c.animating++;
  snkKick();
  return new Promise(res => {
    const t0 = performance.now();
    const step = (now) => {
      if (c.gen !== g) { c.animating = Math.max(0, c.animating - 1); res(false); return; }
      const r = c.fast ? 1 : Math.min(1, (now - t0) / ms);
      fn(e(r), r);
      if (r < 1 && !document.hidden) requestAnimationFrame(step);
      else { if (r < 1) fn(1, 1); c.animating = Math.max(0, c.animating - 1); res(true); }
    };
    requestAnimationFrame(step);
  });
}
const snkWait = (c, g, ms) => snkTween(c, g, ms, () => {}, snkLin);
const snkAlive = (c, g) => c.gen === g;

function snkFace(p, m) {
  // A piece napping on its pillow (a surprise square) keeps its eyes shut when nothing else shows.
  if (!m && p.nap) m = 'closed';
  const set = (s, v) => { const el = p.e.querySelector(s); if (el) el.setAttribute('opacity', v); };
  set('.snk-eC', /closed/.test(m) ? 1 : 0);
  set('.snk-smile', /gasp|zombie|sad|grin/.test(m) ? 0 : 1);
  set('.snk-sad', /sad/.test(m) ? 1 : 0);
  set('.snk-gasp', /gasp/.test(m) ? 1 : 0);
  set('.snk-armsUp', /up/.test(m) ? 1 : 0);
  set('.snk-armsFwd', /fwd/.test(m) ? 1 : 0);
  set('.snk-dizzy', /dizzy/.test(m) ? 1 : 0);
  set('.snk-sweat', /sweat/.test(m) ? 1 : 0);
  set('.snk-eN', /zombie|wide|closed/.test(m) ? 0 : 1);
  set('.snk-eS', /zombie/.test(m) ? 1 : 0);
  set('.snk-eW', /wide/.test(m) ? 1 : 0);
  set('.snk-grin', /grin/.test(m) ? 1 : 0);
  if (/grin/.test(m)) set('.snk-smile', 0);
  set('.snk-case', /case/.test(m) ? 1 : 0);
  set('.snk-legs', /sit/.test(m) ? 0 : 1);
  set('.snk-legsSit', /sit/.test(m) ? 1 : 0);
}

function snkSetP(p, x, y, s, r) {
  p.x = x; p.y = y;
  snkTR(p.e, x, y, (s == null ? 1 : s) * (p.k || 1), r);
  if (p.nap && p.zz) p.zz.setAttribute('transform', `translate(${(x + 4).toFixed(1)} ${(y - 14).toFixed(1)})`);
}

/** Where a piece stands: in the lower half of its square, set apart from others on it; on the mat before its first roll. */
function snkSpot(c, p, n) {
  const at = n == null ? p.n : n;
  const others = Object.keys(c.players).map(id => c.players[id]).filter(o => !o.hidden && o.n === at).sort((a, b) => a.order - b.order);
  const k = Math.max(0, others.indexOf(p));
  if (at <= 0) {
    return { x: 14 + p.order * 36, y: 637, k: 0.82 };
  }
  // Home: on the top of the frame over 100, in the order they got there, so nothing covers 100 or its cup.
  if (at >= 100) {
    const place = c.lastG && c.lastG.places ? c.lastG.places.indexOf(p.id) : -1;
    const i = place >= 0 ? place : k;
    return { x: 16 + i * 24, y: -13, k: 0.62 };
  }
  const q = snakesCellXY(at);
  const count = Math.max(1, others.length + (others.indexOf(p) === -1 ? 1 : 0));
  if (count <= 1) return { x: q.x, y: q.y + 12, k: 1 };
  if (count === 2) return { x: q.x + (k ? 12 : -12), y: q.y + 12, k: 0.85 };
  const col = k % 3, row = Math.floor(k / 3);
  return { x: q.x + (col - 1) * 15, y: q.y + 8 + row * 11, k: 0.66 };
}

function snkSettleAll(c) {
  Object.keys(c.players).forEach(id => {
    const p = c.players[id];
    if (p.hidden) return;
    const s = snkSpot(c, p);
    p.k = s.k;
    // Napping on a surprise square's pillow: lying down until his turn passes him by.
    snkSetP(p, s.x, s.y + (p.nap ? 3 : 0), 1, p.nap ? -84 : 0);
    // Home: sitting on the frame by the cup, cheering the rest on (each at their own moment).
    const home = p.n >= 100 && !p.dancing;
    if (p.e.classList.contains('is-home') !== home) {
      p.e.classList.toggle('is-home', home);
      if (home) { snkCalm(p); p.e.style.setProperty('--snk-d', (-(p.order || 0) * 0.7).toFixed(1) + 's'); }
    }
  });
  if (!c.playing && !c.building && c.svg) snkMoods(c);
}

function snkBubble(c, x, y, txt, ms, force) {
  if (!txt || (!force && (c.fast || snkStill()))) return;
  const g = snkEl('g', { class: 'snk-bub' }, c.fx);
  const w = Math.max(40, Array.from(txt).length * 9 + 20);
  snkEl('rect', { x: -w / 2, y: -15, width: w, height: 26, rx: 13, fill: '#fff', stroke: SNK_INK, 'stroke-width': 1.6 }, g);
  snkEl('path', { d: 'M-5 10 L0 18 L5 10', fill: '#fff', stroke: SNK_INK, 'stroke-width': 1.6 }, g);
  snkEl('rect', { x: -6, y: 7, width: 12, height: 4, fill: '#fff' }, g);
  const tx = snkEl('text', { y: 4, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: SNK_INK, 'font-family': 'Noto Kufi Arabic,system-ui,sans-serif', direction: appState.lang === 'en' ? 'ltr' : 'rtl' }, g);
  tx.textContent = txt;
  const bx = snkClamp(x, w / 2 - 20, 620 - w / 2), by = Math.max(-8, y - 44);
  const t0 = performance.now();
  if (snkStill()) snkTR(g, bx, by, 1);
  else (function f(now) { const k = snkClamp((now - t0) / 220, 0, 1); snkTR(g, bx, by, snkBackOut(k)); if (k < 1 && g.isConnected) requestAnimationFrame(f); })(t0);
  setTimeout(() => g.remove(), ms || 1300);
}

function snkPuff(c, x, y, n, col, spread) {
  if (c.fast || snkStill()) return;
  for (let i = 0; i < (n || 6); i++) {
    const e = snkEl('circle', { cx: x, cy: y, r: 3, fill: col || '#fff', stroke: SNK_INK, 'stroke-width': 0.8, opacity: 0.9 }, c.fx);
    const a = Math.random() * Math.PI * 2, d = (spread || 22) * (0.6 + Math.random() * 0.6), t0 = performance.now();
    (function f(now) {
      const k = snkClamp((now - t0) / 650, 0, 1);
      e.setAttribute('cx', x + Math.cos(a) * d * snkEaseOut(k)); e.setAttribute('cy', y + Math.sin(a) * d * snkEaseOut(k) - k * 8);
      e.setAttribute('r', 3 + k * 6); e.setAttribute('opacity', 0.9 * (1 - k));
      if (k < 1 && e.isConnected) requestAnimationFrame(f); else e.remove();
    })(t0);
  }
}

function snkSparkle(c, x, y) {
  if (c.fast || snkStill()) return;
  const e = snkEl('path', { d: 'M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5Z', fill: '#ffe27a', stroke: SNK_INK, 'stroke-width': 0.6 }, c.fx);
  const t0 = performance.now(), dx = (Math.random() - 0.5) * 30;
  (function f(now) { const k = snkClamp((now - t0) / 700, 0, 1); snkTR(e, x + dx * k, y - 20 * k, 1 - k * 0.6, k * 180); e.setAttribute('opacity', 1 - k); if (k < 1 && e.isConnected) requestAnimationFrame(f); else e.remove(); })(t0);
}

/** A sound of the table: heard on the device that plays the table's sounds, or for your own move. */
function snkSound(c, name, mine) {
  if (!c.ctx || !(c.ctx.loud || mine)) return;
  const own = c.th && SNK_THEME_SOUNDS[c.th.id];
  if (own && own[name]) name = own[name];
  try { if (typeof FX !== 'undefined' && FX[name] && typeof playFx === 'function') playFx(name); } catch (e) {}
}

/** Each map's own voice for the engine's sounds: a crocodile snaps and splashes, a cat meows, a pipe clangs,
 *  a slide whooshes, an escalator hums. A sound a map doesn't name stays the classic's. */
const SNK_THEME_SOUNDS = {
  nile: { snkHiss: 'snkCrocSnap', snkGulp: 'snkCrocGulp', snkSlide: 'snkSplash', snkUp: 'snkPalm' },
  desert: { snkHiss: 'snkCobra', snkSlide: 'snkSand', snkUp: 'snkPalm' },
  metro: { snkSlide: 'snkWhee', snkUp: 'snkEscal', snkHiss: 'snkChime' },
  hara: { snkHiss: 'snkMeow', snkGulp: 'snkClang', snkSlide: 'snkPipe' }
};

/* --- moving ------------------------------------------------------------------------------ */

/** Walks a piece square by square to `to`; a square in `passQ` (the roll's heads walked past, in order) is a duck or a jump. */
async function snkHopTo(c, g, p, to, passQ) {
  const dir = to > p.n ? 1 : -1;
  while (p.n !== to) {
    const from = { x: p.x, y: p.y };
    p.n += dir;
    const s = snkSpot(c, p);
    p.k = s.k;
    snkSound(c, 'snkStep', p.mine);
    if (passQ && passQ.length && passQ[0].h === p.n) {
      const pq = passQ.shift(), sn = c.snakes.find(x => x.h === pq.h);
      if (sn) { if (!await snkPassHead(c, g, p, sn, pq.v, from, s)) return false; continue; }
    }
    const ok = await snkTween(c, g, SNAKES_HOP_MS - 10, t => snkSetP(p, snkLerp(from.x, s.x, t), snkLerp(from.y, s.y, t) - Math.sin(t * Math.PI) * 18, 1 + Math.sin(t * Math.PI) * 0.06), snkLin);
    if (!ok) return false;
  }
  snkSettleAll(c);
  return true;
}

/** In a room the die starts tumbling over your piece on the tap, before the server's answer (the owner,
 *  8 Oct 2026: a tap that showed nothing felt slow); snkRollDie takes it over with the real value, and
 *  a tap the server dropped puts it away (snkTumbleStop(true)). */
let snkTumbleRun = null;
function snkTumbleStart(pid) {
  snkTumbleStop(false);
  const c = snkView.c, p = c && c.players[pid];
  if (!c || !c.die || !p || motionOff()) return;
  const d = c.die, pips = d.querySelector('.snk-pips');
  const x = snkClamp(p.x, 30, 570), y = Math.max(20, p.y - 62), t0 = performance.now();
  const run = { raf: 0, c: c, d: d, last: 0, until: t0 + 4000 };
  d.setAttribute('opacity', 1);
  const step = now => {
    if (snkTumbleRun !== run) return;
    if (snkView.c !== c || now > run.until) { snkTumbleStop(true); return; }
    const r = (now - t0) / 1000;
    if (now - run.last > 70) { run.last = now; pips.innerHTML = snkPipsSvg(1 + Math.floor(Math.random() * 6)); }
    snkTR(d, x, y - Math.abs(Math.sin(r * Math.PI * 2.5)) * 12, 1.1, r * 540);
    run.raf = requestAnimationFrame(step);
  };
  snkTumbleRun = run;
  run.raf = requestAnimationFrame(step);
}
function snkTumbleStop(hide) {
  const run = snkTumbleRun;
  if (!run) return;
  snkTumbleRun = null;
  cancelAnimationFrame(run.raf);
  if (hide) run.d.setAttribute('opacity', 0);
}

async function snkRollDie(c, g, p, v) {
  const d = c.die, pips = d.querySelector('.snk-pips');
  snkTumbleStop(false);
  d.setAttribute('opacity', 1);
  const x = snkClamp(p.x, 30, 570), y = Math.max(20, p.y - 62);
  snkSound(c, 'ludoRoll', p.mine);
  let last = 0;
  const ok = await snkTween(c, g, 650, (t, r) => {
    if (r < 0.82 && r - last > 0.07) { last = r; pips.innerHTML = snkPipsSvg(1 + Math.floor(Math.random() * 6)); }
    if (r >= 0.82) pips.innerHTML = snkPipsSvg(v);
    snkTR(d, x, y - Math.sin(r * Math.PI) * 16, snkBackOut(Math.min(1, r * 2.2)) * 1.15, (1 - t) * 540);
  }, snkLin);
  pips.innerHTML = snkPipsSvg(v);
  if (!ok) return false;
  await snkWait(c, g, 320);
  d.setAttribute('opacity', 0);
  return snkAlive(c, g);
}

async function snkDizzy(c, g, p, ms) {
  snkFace(p, 'dizzy');
  const x = p.x, y = p.y;
  await snkTween(c, g, ms || 900, t => snkSetP(p, x, y, 1, Math.sin(t * Math.PI * 6) * 9 * (1 - t)), snkLin);
  snkFace(p, '');
}

/** Lands a piece on its square from where it is, in an arc. */
async function snkLand(c, g, p, n, ms, height, spin) {
  const from = { x: p.x, y: p.y };
  p.n = n;
  const s = snkSpot(c, p);
  p.k = s.k;
  const ok = await snkTween(c, g, ms, t => snkSetP(p, snkLerp(from.x, s.x, t), snkLerp(from.y, s.y, t) - Math.sin(t * Math.PI) * (height || 0), 1, (spin || 0) * t), snkLin);
  snkSettleAll(c);
  return ok;
}

/* --- the snake's seven moves (each about as long as SNAKES_MOVE_MS says) ------------------- */

async function snkGulp(c, g, p, sn) {
  snkFace(p, 'gasp'); snkBubble(c, p.x, p.y - 20, snkT('snk_b_no'), 900);
  const x0 = p.x, y0 = p.y;
  await snkTween(c, g, 300, t => { sn.jaw = t; sn.lunge = { x: (x0 - sn.hx) * 0.3 * t, y: (y0 - sn.hy) * 0.3 * t, s: 1 + 0.2 * t }; });
  if (!snkAlive(c, g)) return;
  await snkTween(c, g, 280, t => snkSetP(p, snkLerp(x0, sn.hx + sn.lunge.x, t), snkLerp(y0, sn.hy + sn.lunge.y + 8, t), 1 - t * 0.9, t * 140), snkEaseIn);
  p.e.setAttribute('opacity', 0); p.hidden = true;
  snkSound(c, 'snkGulp', p.mine);
  await snkTween(c, g, 260, t => { sn.jaw = 1 - t; sn.lunge = { x: sn.lunge.x * (1 - t), y: sn.lunge.y * (1 - t), s: 1 + 0.2 * (1 - t) + Math.sin(t * Math.PI) * 0.18 }; });
  if (!snkAlive(c, g)) return;
  snkBubble(c, sn.hx, sn.hy - 10, snkT('snk_b_ham'), 800); sn.amp = 4.5;
  await snkTween(c, g, 1200, t => { sn.bulge = snkLerp(sn.s + 14, sn.L - 12, t); }, snkEase);
  sn.bulge = null; sn.amp = 2.2;
  if (!snkAlive(c, g)) return;
  const tp = snkSpineAt(sn, sn.L - 4, c.time || 0);
  p.n = sn.t; p.hidden = false; p.e.setAttribute('opacity', 1);
  snkBubble(c, tp.x, tp.y - 10, snkT('snk_b_tuf'), 800); snkPuff(c, tp.x, tp.y, 5);
  const s = snkSpot(c, p);
  await snkTween(c, g, 480, t => snkSetP(p, snkLerp(tp.x, s.x, t), snkLerp(tp.y, s.y, t) - Math.sin(t * Math.PI) * 34, 0.3 + 0.7 * snkBackOut(Math.min(1, t * 1.3)), (1 - t) * -300), snkLin);
  snkSettleAll(c);
  await snkDizzy(c, g, p, 400);
}

async function snkSlide(c, g, p, sn) {
  snkFace(p, 'gasp up'); snkBubble(c, p.x, p.y - 20, snkT('snk_b_wee'), 1200);
  snkSound(c, 'snkSlide', p.mine);
  await snkTween(c, g, 1400, t => {
    const a = snkLerp(sn.s + 8, sn.L - 8, t), q = snkSpineAt(sn, a, c.time || 0), q2 = snkSpineAt(sn, a + 8, c.time || 0);
    const ang = Math.atan2(q2.y - q.y, q2.x - q.x) * 180 / Math.PI;
    snkSetP(p, q.x, q.y - 11, 1, snkClamp((ang - 90) * 0.35, -35, 35));
  }, snkEaseIn);
  if (!snkAlive(c, g)) return;
  p.n = sn.t;
  const s = snkSpot(c, p), x0 = p.x, y0 = p.y;
  p.k = s.k;
  snkPuff(c, x0, y0 + 10, 4, '#e8d8b0');
  await snkTween(c, g, 380, t => snkSetP(p, snkLerp(x0, s.x, t), snkLerp(y0, s.y, t) - Math.abs(Math.sin(t * Math.PI * 2)) * (1 - t) * 20, 1, (1 - t) * 40), snkLin);
  snkSettleAll(c);
  await snkDizzy(c, g, p, 400);
}

async function snkChase(c, g, p, sn) {
  // He runs down the snake's back toward its tail, the head snapping after him; at the tail it catches him.
  snkFace(p, 'gasp sweat up'); snkBubble(c, p.x, p.y - 22, snkT('snk_b_run'), 1000);
  sn.mood = 'wow';
  const x0 = p.x, y0 = p.y;
  await snkTween(c, g, 250, t => { sn.jaw = t * 0.8; });
  if (!snkAlive(c, g)) return;
  snkSound(c, 'snkHiss', p.mine);
  await snkTween(c, g, 1400, (t, r) => {
    const a = snkLerp(sn.s + 10, sn.L - 14, t), q = snkSpineAt(sn, a, c.time || 0);
    const run = Math.abs(Math.sin(r * Math.PI * 14)) * 5;
    snkSetP(p, q.x, q.y - 12 - run, 1, Math.sin(r * Math.PI * 14) * 8);
    const k = Math.min(1, r * 3) * (1 - Math.max(0, r - 0.85) / 0.15);
    sn.lunge = { x: (q.x - sn.hx) * 0.22 * k, y: (q.y - sn.hy) * 0.22 * k, s: 1 + 0.15 * k };
    sn.jaw = 0.5 + 0.4 * Math.abs(Math.sin(r * Math.PI * 6));
  }, snkEaseIn);
  sn.lunge = { x: 0, y: 0, s: 1 }; sn.jaw = 0; sn.mood = '';
  if (!snkAlive(c, g)) return;
  const tp = snkSpineAt(sn, sn.L - 4, c.time || 0);
  sn.tailFlick = 1;
  snkBubble(c, tp.x, tp.y - 18, snkT('snk_b_got'), 900);
  snkPuff(c, tp.x, tp.y, 5);
  await snkLand(c, g, p, sn.t, 450, 26, 0);
  sn.tailFlick = 0;
  await snkDizzy(c, g, p, 500);
  void x0; void y0;
}

async function snkSneeze(c, g, p, sn) {
  sn.mood = 'wow'; snkBubble(c, sn.hx, sn.hy - 14, snkT('snk_b_sniff'), 900);
  const x0 = p.x, y0 = p.y;
  snkFace(p, 'sweat');
  await snkTween(c, g, 900, (t, r) => { sn.lunge = { x: 0, y: 0, s: 1 + Math.abs(Math.sin(r * Math.PI * 3)) * 0.12 }; snkSetP(p, x0 + Math.sin(r * 50) * 1.4, y0); }, snkLin);
  if (!snkAlive(c, g)) return;
  sn.mood = 'sneeze'; snkBubble(c, sn.hx, sn.hy - 14, snkT('snk_b_achoo'), 1000);
  snkSound(c, 'snkAchoo', p.mine);
  snkPuff(c, sn.hx, sn.hy + 10, 9, '#ffffff', 38);
  snkFace(p, 'gasp up');
  p.n = sn.t;
  const s = snkSpot(c, p);
  p.k = s.k;
  await snkTween(c, g, 1100, (t, r) => { sn.lunge = { x: 0, y: -Math.sin(Math.min(1, r * 3) * Math.PI) * 6, s: 1.1 - Math.min(1, r * 3) * 0.1 }; snkSetP(p, snkLerp(x0, s.x, t), snkLerp(y0, s.y, t) - Math.sin(t * Math.PI) * 170, 1, t * 720); }, snkLin);
  sn.mood = ''; sn.lunge = { x: 0, y: 0, s: 1 };
  if (!snkAlive(c, g)) return;
  await snkTween(c, g, 240, t => snkSetP(p, s.x, s.y, 1 + Math.sin(t * Math.PI) * 0.25, 0), snkLin);
  snkSettleAll(c);
  await snkDizzy(c, g, p, 450);
}

async function snkFlick(c, g, p, sn) {
  // The tail comes round like a catapult and flings him to the tail's square; a bounce on landing.
  snkFace(p, 'gasp'); snkBubble(c, p.x, p.y - 22, snkT('snk_b_no'), 700);
  const x0 = p.x, y0 = p.y;
  await snkTween(c, g, 500, (t, r) => { sn.tailFlick = -Math.sin(r * Math.PI) * 1.2; sn.lunge = { x: 0, y: 0, s: 1 + 0.1 * Math.sin(r * Math.PI) }; });
  if (!snkAlive(c, g)) return;
  snkSound(c, 'snkBoing', p.mine);
  snkFace(p, 'gasp up'); snkBubble(c, p.x, p.y - 24, snkT('snk_b_toss'), 900);
  p.n = sn.t;
  const s = snkSpot(c, p);
  p.k = s.k;
  await snkTween(c, g, 1000, (t, r) => { sn.tailFlick = Math.sin(Math.min(1, r * 2) * Math.PI) * 1.4; snkSetP(p, snkLerp(x0, s.x, t), snkLerp(y0, s.y, t) - Math.sin(t * Math.PI) * 140, 1, -t * 540); }, snkLin);
  sn.tailFlick = 0;
  if (!snkAlive(c, g)) return;
  // Two bounces, smaller each time.
  await snkTween(c, g, 520, (t, r) => { const b = r < 0.55 ? Math.sin(r / 0.55 * Math.PI) * 26 : Math.sin((r - 0.55) / 0.45 * Math.PI) * 10; snkSetP(p, s.x, s.y - b, 1 + (b < 2 ? 0.15 : 0)); }, snkLin);
  snkSettleAll(c);
  await snkDizzy(c, g, p, 400);
}

async function snkSqueeze(c, g, p, sn) {
  // The snake wraps round him and squeezes, then carries him down its back, dizzy.
  snkFace(p, 'gasp sweat'); snkBubble(c, p.x, p.y - 20, snkT('snk_b_squeeze'), 1000);
  const x0 = p.x, y0 = p.y;
  sn.jaw = 0.4;
  snkSound(c, 'snkHiss', p.mine);
  await snkTween(c, g, 700, (t, r) => { const sq = Math.sin(r * Math.PI * 4) * 0.5 + 0.5; snkTR(p.e, x0, y0 + sq * 3, p.k || 1, 0); p.e.setAttribute('transform', `translate(${x0} ${(y0 + sq * 3).toFixed(1)}) scale(${((p.k || 1) * (1 - 0.3 * sq)).toFixed(3)} ${((p.k || 1) * (1 + 0.15 * sq)).toFixed(3)})`); }, snkLin);
  sn.jaw = 0;
  if (!snkAlive(c, g)) return;
  snkFace(p, 'dizzy');
  await snkTween(c, g, 1500, (t, r) => {
    const a = snkLerp(sn.s + 8, sn.L - 8, t), q = snkSpineAt(sn, a, c.time || 0);
    p.x = q.x; p.y = q.y - 8;
    p.e.setAttribute('transform', `translate(${q.x.toFixed(1)} ${(q.y - 8).toFixed(1)}) rotate(${(Math.sin(r * Math.PI * 8) * 10).toFixed(1)}) scale(${((p.k || 1) * 0.8).toFixed(3)} ${((p.k || 1) * 1.05).toFixed(3)})`);
  }, snkEase);
  if (!snkAlive(c, g)) return;
  await snkLand(c, g, p, sn.t, 300, 10, 0);
  await snkDizzy(c, g, p, 300);
}

async function snkHypno(c, g, p, sn) {
  sn.mood = 'spiral'; snkBubble(c, sn.hx, sn.hy - 14, snkT('snk_b_look'), 1300);
  await snkWait(c, g, 700);
  if (!snkAlive(c, g)) return;
  snkFace(p, 'zombie fwd'); snkBubble(c, p.x, p.y - 24, snkT('snk_b_yes'), 1000);
  let lastZ = 0;
  await snkTween(c, g, 1700, (t, r) => {
    const a = snkLerp(sn.s + 8, sn.L - 8, t), q = snkSpineAt(sn, a, c.time || 0);
    snkSetP(p, q.x, q.y - 10 - Math.abs(Math.sin(r * Math.PI * 9)) * 3, 1, Math.sin(r * Math.PI * 9) * 4);
    if (r - lastZ > 0.3) { lastZ = r; snkPuff(c, q.x + 10, q.y - 30, 1, '#cfe3ff', 10); }
  }, snkLin);
  if (!snkAlive(c, g)) return;
  sn.mood = '';
  p.n = sn.t;
  const s = snkSpot(c, p);
  p.k = s.k;
  snkSetP(p, s.x, s.y);
  snkFace(p, 'gasp');
  await snkTween(c, g, 400, t => snkSetP(p, s.x, s.y, 1, Math.sin(t * Math.PI * 6) * 12), snkLin);
  snkBubble(c, p.x, p.y - 24, snkT('snk_b_what'), 1100);
  snkFace(p, '');
  snkSettleAll(c);
}

const SNK_SNAKE_ANIM = { gulp: snkGulp, slide: snkSlide, chase: snkChase, sneeze: snkSneeze, flick: snkFlick, squeeze: snkSqueeze, hypno: snkHypno };

/* --- the ladder's five moves --------------------------------------------------------------- */

/** Where a climber stands at `u` (0 its foot, 1 its top) of a ladder, or of a theme's up piece (its own `pt`). */
function snkLadPt(l, u) { return l.pt ? l.pt(u) : { x: snkLerp(l.a.x, l.b.x, u), y: snkLerp(l.a.y + 2, l.b.y + 2, u) }; }

/** A worker in his hard hat (a theme may dress him: the Nile's in a galabiya). */
const snkWorkerOf = (c) => (c && c.th && c.th.worker ? c.th.worker() : snkWorkerSvg());

function snkStepUp(c, g, p, l, u0, u1, ms, steps) {
  snkFace(p, 'up');
  return snkTween(c, g, ms, (t, r) => {
    const k = Math.floor(r * steps), f = snkEase(snkClamp(r * steps - k, 0, 1)), u = snkLerp(u0, u1, (k + f) / steps), q = snkLadPt(l, u);
    snkSetP(p, q.x, q.y - Math.sin(f * Math.PI) * 4, 1, Math.sin(r * steps * Math.PI) * 9);
  }, snkLin);
}

async function snkClimb(c, g, p, l) {
  snkBubble(c, p.x, p.y - 20, snkT('snk_b_ladder'), 900);
  snkSound(c, 'snkUp', p.mine);
  await snkStepUp(c, g, p, l, 0, 1, 1700, 10);
}

async function snkSprint(c, g, p, l) {
  snkBubble(c, p.x, p.y - 20, snkT('snk_b_fly'), 900);
  snkPuff(c, p.x, p.y + 12, 6, '#e8d8b0');
  snkFace(p, 'up');
  snkSound(c, 'snkUp', p.mine);
  let last = 0;
  await snkTween(c, g, 850, (t, r) => {
    const q = snkLadPt(l, t);
    snkSetP(p, q.x, q.y, 1, 0);
    if (r - last > 0.1 && !c.fast) { last = r; const e = snkEl('path', { d: `M${q.x - 8} ${q.y + 22} l-6 14 M${q.x + 8} ${q.y + 22} l6 14`, stroke: SNK_INK, 'stroke-width': 1.6, 'stroke-linecap': 'round', opacity: 0.6 }, c.fx); setTimeout(() => e.remove(), 240); }
  }, snkEase);
}

async function snkSlip(c, g, p, l) {

async function snkBoost(c, g, p, l) {

  snkTween(c, g, 400, t => snkTR(w, snkLerp(wx, wx + far, t), y0 + 4, 1, 0), snkEaseIn).then(() => w.remove());
}

const SNK_LADDER_ANIM = { climb: snkClimb, sprint: snkSprint, slip: snkSlip, lift: snkLift, boost: snkBoost };
