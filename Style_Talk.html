.vt-wire__x { position: absolute; left: 50%; top: 50%; width: 1.6em; height: 1.6em; margin: -0.8em 0 0 -0.8em; display: none; place-items: center; font-style: normal; font-size: 0.9em; border-radius: 50%; background: #e5383b; color: #fff; border: 0.12em solid var(--ink); z-index: 2; }
.vt-wire.is-armed { background: rgba(229, 56, 59, 0.14); box-shadow: 0 0 0 0.12em #e5383b inset; }
.vt-wire.is-armed .vt-wire__x { display: grid; animation: vtPop 0.35s; }
.vt-wire.is-cut { cursor: default; opacity: 0.85; }
.vt-wire.is-cut .vt-wire__c::before { transform: rotate(14deg) scaleX(0.86); }
.vt-wire.is-cut .vt-wire__c::after { transform: rotate(-14deg) scaleX(0.86); }
.vt-syms { grid-template-columns: repeat(2, auto); gap: 0.55em; width: auto; }
.vt-syms--5 { grid-template-columns: repeat(3, auto); font-size: calc(var(--wf) * 0.86); }

.vt-lamp.is-on { background-color: var(--lc); box-shadow: 0 0 1.2em 0.35em var(--lc); }

.vt-man {
  position: relative; color: var(--ink); font-size: 0.86rem; line-height: 1.55;
  padding: 1rem 0.9rem 2.1rem; padding-inline-start: 2.6rem;

  border: 3px solid var(--ink); border-radius: 4px 16px 16px 4px; box-shadow: -6px 0 0 #7a4b2a, -9px 0 0 var(--ink); rotate: -0.6deg;
}

.vt-doodle { position: absolute; bottom: 0.4rem; inset-inline-end: 0.6rem; width: 3.6rem; opacity: 0.8; pointer-events: none; }
.vt-gnote { position: absolute; bottom: 0.55rem; inset-inline-start: 2.6rem; max-width: 62%; font-size: 0.72rem; color: #2f6fd6; font-weight: 700; rotate: -3deg; }
.vt-mi { margin: 0 0 0.35rem; font-weight: 600; }
.vt-rb { margin-top: 0.35rem; }
.vt-rb > b { display: inline-block; background: var(--ink); color: #fff; border-radius: 6px; padding: 0 0.45rem; font-size: 0.75rem; }
.vt-rb ol { margin: 0.1rem 0 0; padding: 0; list-style: none; }
.vt-rb li { margin: 0.1rem 0; display: flex; gap: 0.35rem; align-items: baseline; }
.vt-rn { flex: none; min-width: 1.2rem; text-align: center; font-size: 0.75rem; color: #7a3b14; }
.vt-cw { display: inline-flex; align-items: center; gap: 0.2rem; font-weight: 800; white-space: nowrap; }
.vt-cw::before { content: ""; width: 0.62rem; height: 0.62rem; border-radius: 50%; background: var(--wc); border: 2px solid var(--ink); }
.vt-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin-top: 0.45rem; }
.vt-col { border: 2.5px solid var(--ink); border-radius: 0.75rem; display: grid; justify-items: center; gap: 0.1rem; padding: 0.35rem 0.2rem; background: rgba(255, 253, 244, 0.85); }
.vt-col b { font-size: 0.72rem; }
.vt-col svg { width: 1.9rem; height: 1.9rem; fill: none; stroke: var(--ink); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.vt-dtab, .vt-ltab { width: 100%; border-collapse: collapse; margin-top: 0.35rem; }
.vt-dtab td { border-bottom: 2px dashed rgba(34, 31, 54, 0.3); padding: 0.2rem 0.25rem; font-weight: 700; }
.vt-dtab svg { width: 1.6rem; height: 1.6rem; vertical-align: middle; margin-inline-end: 0.3rem; }

/* «الكل»: the lock and the notebook, a switch on a phone, side by side when there is room. */
.vt-seg { margin: 0.2rem 0.9rem 0; background: #e8d9b8; border: 2px solid var(--ink); }
.vt-seg .segmented__item { color: #6b4a2a; font-weight: 800; }

.vt-seg.segmented::before { background: #fffdf4; }
.vt-seg .segmented__item.is-active { background: #fffdf4; }
.vt-both { display: grid; }
.vt--both:not(.is-tab-page) .vt-both__page, .vt--both.is-tab-page .vt-both__lock { display: none; }

/* The foot: chalk ✗ marks on the wood, a line, the chest's number. */
.vt-foot { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.35rem 1rem 0.2rem; font-size: 0.76rem; font-weight: 700; }
.vt-x { display: flex; gap: 0.35rem; align-items: center; min-width: 3.4rem; }

/* The safe's card (before the candle) and its result. */

@keyframes vtCardIn { from { opacity: 0; transform: translateY(12px) scale(0.95); } }

/* A moment on this phone: the stamp, the red edge. */
.vt-stamp { position: absolute; inset-inline: 0.5rem; top: 38%; z-index: 7; text-align: center; white-space: pre-line; font-family: var(--font-display); font-weight: 900; font-size: 2rem; line-height: 1.25; pointer-events: none; opacity: 0; text-shadow: 0 3px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink); }
.vt.is-ok .vt-stamp { color: #7dffb0; animation: vtStamp 1s both; }

@keyframes vtStamp { 0% { opacity: 0; transform: scale(0.5) rotate(-8deg); } 20% { opacity: 1; transform: scale(1.1) rotate(-6deg); } 80% { opacity: 1; transform: scale(1) rotate(-6deg); } 100% { opacity: 0; transform: scale(1) rotate(-6deg); } }
.vt.is-bad { animation: vtBuzz 0.4s; }
@keyframes vtBuzz { 0%, 100% { translate: 0; } 20% { translate: -8px; } 40% { translate: 7px; } 60% { translate: -5px; } 80% { translate: 3px; } }

@keyframes vtRedIn { 30% { box-shadow: inset 0 0 60px 14px rgba(229, 56, 59, 0.7); } }

/* The end. */
.vt-over { text-align: center; display: grid; gap: 0.35rem; margin-bottom: var(--sp-3); }
.vt-over__why { font-weight: 800; color: var(--text); }
.vt-over__big { font-family: var(--font-display); font-size: 3.4rem; font-weight: 900; line-height: 1.1; color: var(--accent-ink); }
.vt-over__line { font-weight: 700; color: var(--text-2); }
.vt-over__best { font-weight: 700; }
.vt-over__chest { justify-self: center; }
.vt-over__chest svg { width: 7rem; }

  #view-room-vault .vt { display: grid; grid-template-columns: minmax(10rem, 0.8fr) minmax(0, 2fr); grid-template-areas: "top body" "foot body"; grid-template-rows: auto 1fr; align-items: start; column-gap: 0.2rem; }

/* --- the TV: the attic ------------------------------------------------------------ */
.vt-tv { --ink: #221f36; --tf: 1; position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; border-radius: var(--tv-r, 18px); border: 0.6vmin solid #1d120a; background: #5a3b26; container-type: size; font-family: var(--font); color: #fff3dc; }

.vt-pg { flex: 0 1 15cqw; min-width: 0; background: repeating-linear-gradient(#fffdf4 0 2.6cqh, #bcd3f2 2.6cqh 2.8cqh); color: var(--ink); border: 0.45cqh solid var(--ink); padding: 1.6cqh 1cqw 1.4cqh; font-size: 2.1cqh; font-weight: 700; line-height: 1.35; transform: rotate(var(--r)); transform-origin: top center; animation: vtSway 3s ease-in-out infinite alternate; animation-delay: var(--d, 0s); position: relative; text-align: center; overflow-wrap: anywhere; }

.vt-line--7 .vt-pg b, .vt-line--8 .vt-pg b, .vt-line--9 .vt-pg b, .vt-line--10 .vt-pg b { font-size: 2.2cqh; }
@keyframes vtSway { to { transform: rotate(calc(var(--r) * -1)); } }
.vt-ttl { position: absolute; top: 42cqh; inset-inline-start: 4cqw; z-index: 3; max-width: 24cqw; font-family: var(--font-display); font-weight: 900; font-size: 3.6cqh; color: #ffd166; text-shadow: 0 0.5cqh 0 var(--ink); line-height: 1.25; }

/* The chest. */
.vt-tch { position: absolute; bottom: 5cqh; left: 50%; width: 46cqw; margin-left: -23cqw; perspective: 90cqh; z-index: 3; }
.vt-tch__lid { height: 15cqh; border: 0.8cqh solid var(--ink); border-radius: 10cqh 10cqh 1cqh 1cqh; background: repeating-linear-gradient(90deg, #a3602f 0 6cqh, #8a4f27 6cqh 6.6cqh); position: relative; transform-origin: 50% 100%; z-index: 2; box-sizing: border-box; }

.vt-tch__box { position: relative; height: 26cqh; border: 0.8cqh solid var(--ink); border-top: 0; border-radius: 0 0 2cqh 2cqh; background: repeating-linear-gradient(#ae6a3c 0 4.4cqh, #94572f 4.4cqh 5cqh); display: grid; place-items: center; box-sizing: border-box; }

.vt-tch__no { position: absolute; bottom: 1.3cqh; left: 50%; translate: -50%; z-index: 1; background: #fffdf4; color: var(--ink); border: 0.4cqh solid var(--ink); border-radius: 0.6cqh; padding: 0 1.2cqh; font-weight: 800; font-size: 1.9cqh; white-space: nowrap; rotate: -2deg; }
.vt-tch__glow { position: absolute; left: 50%; bottom: 25cqh; width: 90cqh; height: 50cqh; margin-left: -45cqh; z-index: 1; opacity: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 100%, rgba(255, 214, 102, 0.75), transparent 45%), conic-gradient(from 300deg at 50% 100%, rgba(255, 220, 120, 0.55) 0 10deg, transparent 10deg 25deg, rgba(255, 220, 120, 0.55) 25deg 35deg, transparent 35deg 50deg, rgba(255, 220, 120, 0.55) 50deg 70deg, transparent 70deg 85deg, rgba(255, 220, 120, 0.55) 85deg 95deg, transparent 95deg 110deg, rgba(255, 220, 120, 0.55) 110deg 120deg, transparent 120deg); }

.vt-tch--s { width: 34cqw; margin-left: -17cqw; bottom: 6cqh; }
.vt-tch--s .vt-tch__lid { height: 11cqh; }

.vt-tteam { position: absolute; inset-block: 0; width: 50%; }
.vt-tteam--a { inset-inline-start: 0; } .vt-tteam--b { inset-inline-end: 0; }
.vt-trib { position: absolute; bottom: 44cqh; left: 50%; translate: -50%; z-index: 4; font-family: var(--font-display); font-weight: 900; font-size: 3cqh; color: var(--ink); background: #ff8a7a; border: 0.6cqh solid var(--ink); border-radius: 1cqh; padding: 0 2cqh; white-space: nowrap; }
.vt-trib--b { background: #7fb4ff; }
/* The candle and the chalk board beside it. */
.vt-tcnd { position: absolute; bottom: 6cqh; inset-inline-end: 6cqw; z-index: 3; display: grid; justify-items: center; gap: 0.6cqh; }
.vt-cnd--tv .vt-cnd__h { width: 5cqh; height: 26cqh; margin-top: 7cqh; }
.vt-cnd--tv .vt-cnd__f { width: 3.4cqh; height: 5cqh; margin-left: -1.7cqh; top: -6.3cqh; }
.vt-cnd--tv .vt-cnd__s { width: 10cqh; height: 2cqh; }
.vt-tcnd > b { font-size: 3.6cqh; color: #ffd166; background: var(--ink); border-radius: 1cqh; padding: 0 1.4cqh; }
.vt-tcnd.is-hurry > b { color: #ff8a7a; }
.vt-tx { display: flex; align-items: center; gap: 0.6cqh; background: #24352b; border: 0.9cqh solid #8a5a33; border-radius: 0.8cqh; padding: 0.4cqh 1.4cqh; font-family: var(--font-display); color: #f3efe6; font-size: 2cqh; }
.vt-tx i { font-style: normal; font-size: 3.2cqh; color: rgba(243, 239, 230, 0.4); }
.vt-tx i.is-on { color: #ff8a7a; }
.vt-tx b { font-size: 3cqh; color: #ff8a7a; }
.vt-tcnd--a { inset-inline-end: auto; inset-inline-start: 2cqw; bottom: 8cqh; }
.vt-tcnd--b { inset-inline-end: 2cqw; bottom: 8cqh; }
.vt-tv--teams .vt-cnd--tv .vt-cnd__h { height: 18cqh; }
/* The TV that opens the safe: the stage drawn big in the middle. */
.vt-tvop { position: absolute; bottom: 3cqh; left: 50%; width: 56cqw; margin-left: -28cqw; top: 31cqh; z-index: 3; }
.vt--tv { --wf: 2.9cqh; height: 100%; padding: 0; gap: 0.5cqh; border-width: 0.5cqh; }
.vt--tv .vt-top--tv { padding: 1cqh 1.5cqw 0; }
.vt--tv .vt-top--tv .vt-cndw, .vt--tv .vt-lvl { display: none; }
.vt--tv .vt-pad svg { width: 4.6cqh; height: 5.6cqh; }
.vt--tv .vt-pad span { font-size: 1.7cqh; }
.vt--tv .vt-stage { min-height: 0; flex: 1; margin: 0.5cqh 1cqw 1.4cqh; }
.vt-tv--op .vt-ttl { top: 20cqh; inset-inline-start: 50%; translate: 50% 0; max-width: 60cqw; text-align: center; }
html[dir="ltr"] .vt-tv--op .vt-ttl { translate: -50% 0; }
.vt--tv .vt-tag { font-size: 2.3cqh; }
.vt--tv [data-vt-stagebox] { flex: 1; min-height: 0; display: flex; }
.vt--tv .vt-stage { flex: 1; }
/* The card over the attic, a toast, the alarm's flash. */
.vt-tvcard { position: absolute; inset: 0; z-index: 6; display: grid; place-content: start center; justify-items: center; gap: 1.6cqh; padding: 27cqh 4cqh 4cqh; text-align: center; pointer-events: none; }
.vt-tvcard > * { pointer-events: auto; }
.vt-tvcard.is-board { place-content: center; padding-top: 4cqh; background: rgba(29, 18, 10, 0.6); }
.vt-tvcard .vt-res__chest { display: none; }
.vt-tvcard.is-board .vt-res__chest { display: block; }
.vt-tvcard[hidden] { display: none; }
.vt-tvcard.is-in { animation: vtCardIn 0.5s var(--ease-out, ease) both; }
.vt-tvcard.is-late.is-in { animation-delay: 1.4s; }
.vt-tvcard .vt-res__card { width: auto; min-width: 40cqw; font-size: 3cqh; padding: 3cqh 5cqw; border-width: 0.7cqh; box-shadow: 0 1cqh 0 var(--ink); }
.vt-tvcard .vt-res__card b { font-size: 6cqh; }
.vt-tvcard .vt-res__card--ready { background: #ffd166; }
.vt-tvcard .vt-res__chest svg { width: 18cqh; }
.vt-tvcard .vt-res__bell { font-size: 7cqh; }
.vt-tvcard__board { width: min(40cqw, 26rem); }
.vt-tvcard__board.tv-scale { zoom: 1; }
.vt-tvcard.is-board { grid-auto-flow: column; align-items: center; column-gap: 3cqw; }
.vt-toast { position: absolute; top: 36cqh; left: 50%; translate: -50%; z-index: 5; max-width: 60cqw; text-align: center; background: var(--ink); color: #fff; border: 0.5cqh solid #fff3dc; border-radius: 2.6cqh; padding: 1.2cqh 3cqh; font-weight: 800; font-size: 3.2cqh; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.vt-toast.is-on { opacity: 1; }
.vt-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 4; background: radial-gradient(circle, transparent 35%, rgba(229, 56, 59, 0.7)); }
.vt-tv.is-alarm .vt-flash { animation: vtAlarm 0.35s 4 alternate; }
.vt-tv.is-alarm { animation: vtBuzz 0.35s 2; }
@keyframes vtAlarm { to { opacity: 1; } }
.vt-tv--over { display: grid; place-items: center; overflow-y: auto; }
.vt-tv__over { position: relative; z-index: 2; width: min(92cqw, 46rem); padding: 3cqh 0; }
/* A set's end on the TV: the podium beside the board. */
.vt-tv__over--board { width: min(94cqw, 84rem); }
.vt-tv__over--board .vt-over { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 3cqw; align-items: center; }
.vt-tv__over--board .vt-over > * { grid-column: 1; }
.vt-tv__over--board .vt-over > .tv-scale { grid-column: 2; grid-row: 1 / span 6; align-self: center; }
.vt-tv__over .vt-over { background: #fffdf4; color: var(--ink); border: 0.6cqh solid var(--ink); }
.vt-tv__over .vt-over__line, .vt-tv__over .vt-over__why { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .vt, .vt *, .vt-tv, .vt-tv * { animation: none !important; transition: none !important; }
}

/* =========================================================================
   64. دندنها (HUM IT in rooms, JS_RoomHum.html, 1 Oct 2026)
   Look ج «الفرح: المسرح والجمهور»: the phone is a wedding hall - the crowd
   at the top raising signs, fifteen bulbs over the stage going out as the
   clock, the stage between red curtains (the singer, or the hummer's mic and
   the DJ's envelope), the front row of the fastest three on a wooden bench,
   and the sign in your hand at the bottom. The TV is one stage with its
   curtains and valance, the crowd along the bottom, a banner unrolling for the
   answer and a 1-2-3 podium. The scene keeps its own colours in both themes
   (like a board); the words round it are the page's tokens. Everything that
   moves moves with transform and opacity.
   ========================================================================= */
:root {
  --dnd-ink: #15121f;
  --dnd-hall: #1c0f33;
  --dnd-hall-2: #5b2a86;
  --dnd-stage: #3b1f5e;
  --dnd-wood: #7a4a26;
  --dnd-bench: #5b3a24;
  --dnd-seat: #8a5a3a;
  --dnd-curtain: #c0174a;
  --dnd-curtain-2: #8a0e2e;
  --dnd-gold: #ffd166;
  --dnd-gold-2: #f59e0b;
  --dnd-hot: #ff5f57;
  --dnd-pink: #e5387b;
  --dnd-paper: #fff8e7;
  --dnd-on-gold: #221f36;
}
.dnd { display: flex; flex-direction: column; gap: var(--sp-3); }
.dnd-hall {
  position: relative; overflow: hidden; border-radius: 24px; color: #fff;
  background: radial-gradient(ellipse at 50% 32%, var(--dnd-hall-2), var(--dnd-hall) 75%);
  border: 3px solid var(--dnd-ink);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 0;
}
.dnd-hall__main, .dnd-hall__side { display: flex; flex-direction: column; min-width: 0; }
.dnd-top {
  display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2);
  padding: 10px 14px 2px; font-size: 0.8125rem; font-weight: 700; color: #f3e8ff;
}
.dnd-top__mode { font-family: var(--font-display); color: var(--dnd-gold); font-size: 0.9375rem; }

/* The crowd: a head and a name each, a sign that rises when they answer */
.dnd-crowd {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(3.25rem, 1fr)); justify-items: center; align-items: end;
  gap: 2px 4px; padding: 30px 10px 2px; min-height: 5.5rem;
}
.dnd-head { position: relative; width: 100%; max-width: 4.25rem; text-align: center; font-size: 0.6875rem; font-weight: 700; line-height: 1.3; }
.dnd-head svg { width: 2.6rem; height: 2.75rem; display: block; margin: 0 auto; }
.dnd-head b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dnd-sign {
  position: absolute; bottom: calc(2.75rem + 1.35em); inset-inline-start: 50%; translate: -50% 0;
  background: #fff; color: var(--dnd-on-gold); border: 3px solid var(--dnd-ink); border-radius: 6px;
  padding: 0 7px; font-weight: 900; font-size: 0.8125rem; white-space: nowrap; line-height: 1.5;
  opacity: 0; transform: translateY(22px); transition: transform 0.35s cubic-bezier(.3,1.6,.5,1), opacity 0.2s;
  pointer-events: none; z-index: 2;
}
html[dir="rtl"] .dnd-sign { translate: 50% 0; }
.dnd-sign::after { content: ""; position: absolute; top: 100%; inset-inline-start: 50%; width: 4px; height: 9px; margin-inline-start: -2px; background: #c98b5a; }
.dnd-sign:empty { display: none; }
.dnd-head.on .dnd-sign { opacity: 1; transform: none; }
.dnd-head.is-hop svg { animation: dnd-hop 0.5s; }
@keyframes dnd-hop { 40% { transform: translateY(-8px); } }

/* The bulbs over the stage: the clock */
.dnd-bulbs { position: relative; display: flex; justify-content: space-between; padding: 6px 18px 4px; }
.dnd-bulbs::before { content: ""; position: absolute; inset-inline: 14px; top: 12px; height: 3px; background: var(--dnd-ink); }
.dnd-bulbs i { position: relative; width: 13px; height: 13px; border-radius: 50%; background: #4b4270; border: 2px solid var(--dnd-ink); }
.dnd-bulbs i::after {
  content: ""; position: absolute; inset: -2px; border-radius: 50%; background: var(--dnd-gold);
  box-shadow: 0 0 9px var(--dnd-gold); opacity: 0; transform: scale(0.6); transition: opacity 0.3s, transform 0.3s;
}
.dnd-bulbs i.on::after { opacity: 1; transform: none; }
.is-hurry .dnd-bulbs i::after { background: var(--dnd-hot); box-shadow: 0 0 9px var(--dnd-hot); }

/* The stage between its curtains */
.dnd-stg {
  position: relative; flex: 1; min-height: 13.5rem; margin: 2px 10px 0; overflow: hidden;
  border: 4px solid #000; border-bottom: 0; border-radius: 18px 18px 0 0;
  background: radial-gradient(ellipse 60% 70% at 50% 0, rgba(255, 236, 170, 0.5), transparent 70%), linear-gradient(var(--dnd-stage) 0 82%, var(--dnd-wood) 82%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 32px 38px 16px; text-align: center;
}
.dnd-stg::before, .dnd-stg::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 30px; z-index: 1;
  background: repeating-linear-gradient(90deg, var(--dnd-curtain) 0 7px, var(--dnd-curtain-2) 7px 14px);
}
.dnd-stg::before { inset-inline-start: 0; border-end-end-radius: 30px; }
.dnd-stg::after { inset-inline-end: 0; border-end-start-radius: 30px; }
.dnd-stg > * { position: relative; z-index: 2; }
.dnd-stg__clk {
  position: absolute; top: 6px; inset-inline-end: 38px; background: var(--dnd-ink); border-radius: 99px;
  padding: 0 10px; font-size: 1rem; font-weight: 800; color: var(--dnd-gold); min-width: 2.2em; z-index: 3;
}
.is-hurry .dnd-stg__clk, .is-hurry .dnd-tv__clk { color: var(--dnd-hot); }
.dnd-status { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 0.9375rem; line-height: 1.45; text-shadow: 0 2px 0 #000; }
.dnd-big { font-size: 3.25rem; line-height: 1; }
.dnd-cnt { font-size: 4rem; font-weight: 800; line-height: 1.05; color: #fff; }
.dnd-last { font-size: 0.75rem; font-weight: 700; background: rgba(0, 0, 0, 0.45); border-radius: 99px; padding: 0 10px; min-height: 1.4em; }
.dnd-last:empty { visibility: hidden; }

/* The singer, the mic, the envelope */
.dnd-singer { position: relative; width: 6.9rem; height: 7.75rem; }
.dnd-singer svg { width: 100%; height: 100%; }
.dnd-singer__t {
  position: absolute; bottom: -4px; inset-inline-start: 50%; translate: -50% 0; white-space: nowrap;
  background: var(--dnd-gold); color: var(--dnd-on-gold); border: 3px solid var(--dnd-ink); border-radius: 99px; padding: 0 10px; font-size: 0.75rem; font-weight: 900;
}
html[dir="rtl"] .dnd-singer__t { translate: 50% 0; }
.dnd-note {
  position: absolute; top: 18px; inset-inline-start: 0; font-size: 1.6rem; font-weight: 900; color: var(--dnd-gold);
  text-shadow: 0 2px 0 var(--dnd-ink); opacity: 0; pointer-events: none; animation: dnd-note 2.4s ease-out infinite;
}
.dnd-note:nth-of-type(2) { animation-delay: 0.8s; }
.dnd-note:nth-of-type(3) { animation-delay: 1.6s; }
@keyframes dnd-note { 0% { opacity: 0; transform: translate(0, 10px) rotate(-10deg) scale(0.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-24px, -70px) rotate(14deg) scale(1.1); } }
.dnd--listen .dnd-singer .dnd-note, .dnd-tv--listen .dnd-note, .dnd-tv--arm .dnd-note { animation-play-state: paused; opacity: 0; }
.dnd-mic {
  background: none; border: 0; padding: 0; width: 5rem; height: 6.3rem; flex: none; cursor: pointer;
  filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.4)); transition: transform 0.1s; -webkit-tap-highlight-color: transparent;
}
.dnd-mic:active { transform: scale(0.94); }
.dnd-mic svg { width: 100%; height: 100%; }
.dnd.is-playing .dnd-mic { animation: dnd-glow 1s ease-in-out infinite alternate; }
@keyframes dnd-glow { to { transform: scale(1.04); } }
.dnd-mic__l { font-size: 0.78rem; font-weight: 700; opacity: 0.9; }
.dnd-env {
  position: relative; width: 100%; max-width: 15rem; background: var(--dnd-paper); color: var(--dnd-on-gold);
  border: 3px solid var(--dnd-ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.dnd-env small { display: block; font-size: 0.6875rem; font-weight: 700; color: #8a5a2a; }
.dnd-env b { display: block; font-family: var(--font-display); font-size: 1.0625rem; line-height: 1.3; }
.dnd-env span { font-size: 0.78rem; font-weight: 700; color: #5d5875; }
.dnd-env__cv {
  position: absolute; inset: 0; border-radius: 5px; background: linear-gradient(160deg, #ffe3a3 0 49%, #f7cf78 50%);
  display: grid; place-items: center; align-content: center; font-family: var(--font-display); font-weight: 900; font-size: 0.9375rem;
  color: #6b4a2a; line-height: 1.4; transition: opacity 0.25s, transform 0.25s;
}
.dnd-env__cv small { color: #6b4a2a; font-family: inherit; font-weight: 700; }
.dnd-env.is-peek .dnd-env__cv { opacity: 0; transform: scale(0.9) rotate(-4deg); }
.dnd-wave { display: none; align-items: center; justify-content: center; gap: 4px; height: 2.4rem; color: var(--dnd-gold); }
.dnd.is-playing .dnd-wave { display: flex; }
.dnd-wave i { width: 6px; height: 2.2rem; border-radius: 4px; background: currentColor; transform: scaleY(0.25); animation: dnd-wv 0.7s ease-in-out infinite alternate; }
.dnd-wave i:nth-child(2n) { animation-delay: -0.2s; }
.dnd-wave i:nth-child(3n) { animation-delay: -0.45s; animation-duration: 0.55s; }
.dnd-wave i:nth-child(5n) { animation-delay: -0.1s; animation-duration: 0.9s; }
@keyframes dnd-wv { to { transform: scaleY(1); } }
.dnd-speaker { font-size: 3rem; line-height: 1; display: flex; flex-direction: column; align-items: center; }
.dnd-grow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dnd-grow span { background: #3a3450; color: #cfc8e8; border: 2px solid var(--dnd-ink); border-radius: 99px; padding: 0 10px; font-size: 0.78rem; font-weight: 800; }
.dnd-grow span.on { background: var(--dnd-gold); color: var(--dnd-on-gold); }
.dnd-again, .dnd-tap {
  background: rgba(0, 0, 0, 0.45); color: #fff; border: 3px solid var(--dnd-gold); border-radius: 999px;
  min-height: 44px; padding: 0 16px; font-weight: 800; font-size: 0.9375rem; cursor: pointer;
}
.dnd-tap { display: none; background: var(--dnd-gold); color: var(--dnd-on-gold); border-color: var(--dnd-ink); }
.needs-tap .dnd-tap { display: inline-flex; align-items: center; }

/* The banner: the song, unrolling */
.dnd-ban {
  background: var(--dnd-gold); color: var(--dnd-on-gold); border: 4px solid var(--dnd-ink); border-radius: 8px;
  padding: 6px 14px; text-align: center; transform-origin: top; max-width: 100%;
}
.dnd-ban small { display: block; font-size: 0.72rem; font-weight: 700; }
.dnd-ban b { display: block; font-family: var(--font-display); font-size: 1.375rem; line-height: 1.3; }
.dnd-ban span { font-size: 0.8125rem; font-weight: 700; }
.dnd-ban em, .dnd-latin { display: block; font-style: normal; font-size: 0.72rem; font-weight: 700; opacity: 0.75; direction: ltr; unicode-bidi: isolate; }
.dnd-ban--in { animation: dnd-unroll 0.7s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes dnd-unroll { from { transform: scaleY(0); } }

/* The front row */
.dnd-front {
  margin: 0 10px; background: var(--dnd-bench); border: 4px solid #000; border-top-width: 3px; padding: 4px 8px 8px;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
}
.dnd-front__l { grid-column: 1 / -1; font-size: 0.6875rem; font-weight: 700; color: #f6e7c9; text-align: center; }
.dnd-slot {
  min-height: 2.5rem; border-radius: 14px 14px 4px 4px; border: 3px solid #000; background: var(--dnd-seat);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 5px; font-size: 0.8125rem; font-weight: 700; color: #f6e7c9; min-width: 0; padding: 1px 4px; line-height: 1.25;
}
.dnd-slot b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 100%; }
.dnd-slot i { font-style: normal; background: var(--dnd-pink); color: #fff; border-radius: 99px; padding: 0 6px; font-size: 0.75rem; direction: ltr; unicode-bidi: isolate; }
.dnd-slot.on { background: var(--dnd-gold); color: var(--dnd-on-gold); }
.dnd-slot.is-in { animation: dnd-slot 0.5s cubic-bezier(.3,1.6,.5,1); }
@keyframes dnd-slot { from { transform: translateY(-16px) scale(0.8); opacity: 0; } }

/* The bottom: the sign in your hand, the four signs */
.dnd-btm { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.dnd-sgn {
  position: relative; display: block; background: #fff; color: var(--dnd-on-gold); border: 4px solid var(--dnd-ink); border-radius: 10px;
  padding: 2px 12px 4px; transform: rotate(-1.5deg); box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
}
.dnd-sgn small { display: block; font-size: 0.6875rem; font-weight: 700; color: #7a6f8f; }
.dnd-sgn input {
  width: 100%; box-sizing: border-box; border: 0; outline: none; background: transparent; color: var(--dnd-on-gold);
  font-size: 1.25rem; font-family: var(--font-display); height: 2.6rem; padding: 0;
}
.dnd-sgn input::placeholder { color: #9b93ad; }
.dnd-raise {
  background: var(--dnd-gold); color: var(--dnd-on-gold); border: 4px solid var(--dnd-ink); border-radius: 14px;
  min-height: 50px; font-weight: 900; font-size: 1rem; box-shadow: 0 5px 0 #000; cursor: pointer; padding: 0 14px;
}
.dnd-raise:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.dnd-raise--big { min-height: 58px; font-size: 1.125rem; }
.dnd-err { margin: 0; min-height: 1.3em; text-align: center; font-weight: 800; font-size: 0.8125rem; color: #ffb4ab; }
.dnd-err.is-close { color: var(--dnd-gold); }
.dnd-hint { margin: 0; text-align: center; font-size: 0.78rem; color: #e9dcf5; }
.dnd-chs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; }
.dnd-ch {
  background: #fff; color: var(--dnd-on-gold); border: 4px solid var(--dnd-ink); border-radius: 8px; min-height: 58px; padding: 4px 6px;
  box-shadow: 0 5px 0 #000; display: grid; align-content: center; text-align: center; cursor: pointer; font: inherit; min-width: 0;
}
.dnd-ch b { font-family: var(--font-display); font-size: 0.9375rem; line-height: 1.3; }
.dnd-ch small { font-size: 0.6875rem; font-weight: 700; color: #5d5875; }
.dnd-ch:nth-child(odd) { transform: rotate(-2deg); }
.dnd-ch:nth-child(even) { transform: rotate(1.5deg); }
.dnd-ch:active { box-shadow: 0 1px 0 #000; }
.dnd-ch.is-picked { background: var(--dnd-gold); }
.dnd-ch.is-right { background: #b8f0cb; }
.dnd-ch.is-wrong { background: #ffc2bd; }

/* 65. رد الفعل (the reaction test, one phone and rooms): its styles come with its code, RX_CSS in
   JS_RoomReaction.html, injected when the game opens (rxStyleOn) - nothing else restyles them. */

/* =====================================================================
   66. السلم والتعبان AND المشنقة, THE POLISH (3 Oct 2026, from the owner's
   before/after sheet). المشنقة: the misses as dots in the stage's corner and
   the wrong letters under them; upright the man is smaller while the word is
   guessed (the endings keep their full size), the hints one sideways line;
   on a phone on its side the tally joins the title and the result takes the
   keys' column; the letter «اكشف حرف» bought is marked; "look away" is a
   banner. السلم والتعبان: below.
   ===================================================================== */
.hm-stage { position: relative; }
.hm-stage__miss {
  position: absolute; inset-block-start: var(--sp-3); inset-inline-start: var(--sp-3); z-index: 1;
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; max-width: 32%; pointer-events: none;
}
.hm-pips { display: flex; flex-wrap: wrap; gap: 0.3125rem; }
.hm-pips i { width: 0.75rem; height: 0.75rem; border-radius: 50%; border: 2px solid var(--danger); }
.hm-pips i.is-on { background: var(--danger); }
.hm-pips i.is-new { animation: hm-pip 420ms var(--ease-out) both; }
@keyframes hm-pip { 0% { transform: scale(0.4); } 60% { transform: scale(1.35); } 100% { transform: none; } }
.hm-stage__miss .hm-wrong { min-height: 0; font-size: 0.875rem; text-align: start; word-spacing: 0.25em; }
/* Once the word is over the ending takes the stage's width: the dots and letters go under the word. */
.hm-board.is-won .hm-stage__miss, .hm-board.is-lost .hm-stage__miss { position: static; order: 3; flex-direction: row; align-items: center; gap: var(--sp-2); max-width: none; }
.hm-hint--locked { background: transparent; border: 1px dashed currentColor; }
.hm-keys .key.hm-key--bought { position: relative; background: var(--warning-btn); border-color: var(--warning-btn); color: var(--warning-on); }
.hm-keys .key.hm-key--bought::after, .hm-tile.is-bought::after { content: "🔍"; position: absolute; inset-block-start: -0.45rem; inset-inline-end: -0.35rem; font-size: 0.75rem; line-height: 1; }
.hm-tile.is-bought { position: relative; border-style: dashed; border-color: var(--warning); }
.hm-score-line { display: none; }
.hm-write-card--local .hm-write__away { padding: var(--sp-2) var(--sp-3); border-radius: var(--r-lg); background: var(--accent-soft); color: var(--accent-ink); font-size: 1.0625rem; font-weight: 800; }
@media (max-width: 600px) and (orientation: portrait) {
  .hm-board { gap: var(--sp-2); }
  .hm-board__who { flex: 1 1 100%; }

  .hm-hints::-webkit-scrollbar { display: none; }

  .hm-stage { padding: var(--sp-3) var(--sp-3) var(--sp-2); gap: var(--sp-2); }

}
@media (orientation: landscape) and (max-height: 500px) {
  #hangman-stage > .hm-tally { display: none; }
  .hm-board__who { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: var(--sp-3); row-gap: 0.25rem; }
  .hm-board__who > .hm-hints { flex: 1 1 100%; }
  .hm-board { row-gap: 0.375rem; }
  .hm-score-line { display: inline-flex; flex-wrap: wrap; gap: 0.375rem; font-size: 0.8125rem; font-weight: 700; color: var(--text-2); }
  .hm-score-line b { color: var(--accent-ink); }
  .hm-hints { flex-wrap: nowrap; max-width: 100%; overflow-x: auto; scrollbar-width: none; }

/* السلم والتعبان: «أنت» on a plate under your piece and a disc under whoever's turn it is (under the
   feet, never over a number); the players in one row on a phone, the room's second row of names gone
   unless someone is away (it holds the host's ✕); a bigger roll; the tinted squares explained; the
