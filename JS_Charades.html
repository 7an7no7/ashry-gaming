let charadesState = {
    score: 0,
    timer: 60,
    interval: null,
    currentCategory: [],
    history: []
};

// --- 1. RENDER FUNCTION (Safe to call anytime) ---
function renderCharadesDropdown() {
    const catSelect = document.getElementById('charades-cat-select');
    if(!catSelect) return;
    
    catSelect.innerHTML = ''; 
    const db = CHARADES_DB[appState.lang];
    if (db) {
        Object.keys(db).forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.innerText = key;
            catSelect.appendChild(option);
        });
    }
}

// --- 2. SETUP FUNCTION (Triggered by Button) ---
function setupCharades() {
    renderCharadesDropdown(); // Fill data
    setView('setup-charades'); // Change screen
}

function startCharades(time) {
    const catSelect = document.getElementById('charades-cat-select');
    const catKey = catSelect ? catSelect.value : null;
    
    if (charadesState.currentCategory.length > 0 && time) {
         // Replay mode
    } else if (catKey && CHARADES_DB[appState.lang][catKey]) {
        charadesState.currentCategory = [...CHARADES_DB[appState.lang][catKey]];
    } else {
        charadesState.currentCategory = ["Error: No Category"];
    }

    charadesState.score = 0;
    charadesState.history = []; 
    
    if(time) charadesState.timer = time;
    else charadesState.timer = parseInt(document.getElementById('charades-timer-input').value);

    document.getElementById('charades-ui-playing').classList.remove('hidden');
    document.getElementById('charades-ui-result').classList.add('hidden');
    
    setView('play-charades');
    nextCharadesCard();
    
    document.getElementById('charades-timer').innerText = charadesState.timer;
    if (charadesState.interval) clearInterval(charadesState.interval);
    
    let timeLeft = charadesState.timer;
    charadesState.interval = setInterval(() => {
        timeLeft--;
        const timerEl = document.getElementById('charades-timer');
        if(timerEl) timerEl.innerText = timeLeft;
        if (timeLeft <= 0) {
            finishCharadesGame();
        }
    }, 1000);
}

function startCharadesGame(time) {
    startCharades(time);
}

function nextCharadesCard(action) {
    if (action === 'correct') {
        charadesState.score++;
        playSound('success');
    } else if (action === 'pass') {
        playSound('click');
    }

    const words = charadesState.currentCategory;
    const available = words.filter(w => !charadesState.history.includes(w));

    if (available.length === 0) {
        finishCharadesGame();
        return;
    }

    const randIndex = Math.floor(Math.random() * available.length);
    const word = available[randIndex];
    
    charadesState.history.push(word);
    
    const cardTitle = document.getElementById('charades-word');
    if(cardTitle) {
        cardTitle.parentElement.classList.add('animate-flip');
        setTimeout(() => cardTitle.parentElement.classList.remove('animate-flip'), 500);
        setTimeout(() => { cardTitle.innerText = word; }, 250);
    }
}

function finishCharadesGame() {
    if (charadesState.interval) clearInterval(charadesState.interval);
    
    playSound('alarm');
    confetti({ particleCount: 200, spread: 100 });

    document.getElementById('charades-final-score').innerText = charadesState.score;
    
    document.getElementById('charades-ui-playing').classList.add('hidden');
    document.getElementById('charades-ui-result').classList.remove('hidden');
}
