<script>
/* --- WORDLE GAME LOGIC --- */

// Word Databases (Grouped by strict length)
const WORDLE_DB = {
    ar: {
        5: [
            "بناية", "بنفسج", "تفاحة", "جامعة", "جزيرة", "حافلة", "حديقة", "حقيبة", "حيوان", "خريطة",
            "خزانة", "رسامة", "زجاجة", "ستارة", "سجادة", "سحابة", "سروال", "سفينة", "سيارة", "شاحنة",
            "صيدلي", "طائرة", "طاولة", "طبيعة", "طيارة", "عصفور", "عيادة", "فاكهة", "فستان", "قلادة",
            "كاتبة", "كنيسة", "لاعبة", "ليمون", "محفظة", "مدربة", "مدرسة", "مدينة", "مسبحة", "مطرقة",
            "مكتبة", "ملحمة", "ملعقة", "منارة", "منديل", "منشار", "مهندس", "ميزان", "نافذة", "نظارة"
        ],
        6: [
            "أناناس", "اقليمي", "برتقال", "بروتين", "بسكويت", "بقدونس", "بندقية", "تليفون", "سلطانة", "صابونة",
            "صيدلية", "فراولة", "كاميرا", "كهرباء", "ليموني", "محاسبة", "مستشار", "مستشفى", "مكتبات", "مكرونة",
            "ملوخية", "نافورة"
        ],
        7: [
            "أوكسجين", "اتصالات", "استخدام", "استخراج", "استراحة", "استعلام", "استقبال", "استيراد", "اكسسوار", "المنيوم",
            "بطاريات", "بلاستيك", "تلفزيون", "سندويتش", "فاصوليا", "فيتامين", "قرطاسية", "كمبيوتر", "مجوهرات", "معكرونة",
            "مكياجات", "ميدالية", "ميزانية", "ميكانيك", "هامبرغر"
        ],
        8: [
            "ابتكارات", "احتفالات", "اختراعات", "اشتراكية", "الكتروني", "اماراتية", "امبراطور", "انتخابات", "انجليزية", "بريطانيا",
            "ديكتاتور", "رأسمالية", "شوكولاتة", "فلسطينية", "ليبرالية", "مستحضرات", "مستشفيات", "مهرجانات", "نيتروجين"
        ]
    },
    en: {
        5: [
            "APPLE", "BEACH", "BLACK", "BREAD", "CHAIR", "EARTH", "HOUSE", "LIGHT", "MONEY", "MOUSE",
            "MUSIC", "NIGHT", "PHONE", "PLANT", "RIVER", "SOUND", "TABLE", "WATER", "WHITE", "WORLD"
        ],
        6: [
            "ANIMAL", "BANANA", "CARROT", "COUSIN", "FAMILY", "FATHER", "FLOWER", "FRIEND", "GARDEN", "GARLIC",
            "MOTHER", "NATURE", "ORANGE", "PENCIL", "PEPPER", "PLANET", "POTATO", "SCHOOL", "SISTER", "TOMATO"
        ],
        7: [
            "ACCOUNT", "ADDRESS", "BEDROOM", "CLOTHES", "CONTACT", "DRESSES", "EVENING", "FASHION", "GLASSES", "HOLIDAY",
            "JANUARY", "KITCHEN", "MORNING", "OCTOBER", "QUALITY", "SERVICE", "STUDENT", "SUPPORT", "TEACHER", "TUESDAY"
        ],
        8: [
            "COMPUTER", "DATABASE", "DECEMBER", "FEBRUARY", "HARDWARE", "HOSPITAL", "INTERNET", "KEYBOARD", "LANGUAGE", "MEDICINE",
            "NOVEMBER", "PASSWORD", "PHARMACY", "QUESTION", "SATURDAY", "SECURITY", "SOFTWARE", "SOLUTION", "THURSDAY", "USERNAME"
        ]
    }
};

function setupWordle() {
    setView('setup-wordle');
}

function startWordleGame(length) {
    const lang = appState.lang;
    const db = WORDLE_DB[lang][length];
    
    if(!db || db.length === 0) {
        showToast("No words found for this length!", "Error");
        return;
    }

    appState.wordle.wordLength = length;
    // Rule: Increase tries to 7 if length > 6
    appState.wordle.maxTries = length > 6 ? 7 : 6;
    
    appState.wordle.targetWord = db[Math.floor(Math.random() * db.length)].toUpperCase();
    appState.wordle.currentGuess = "";
    appState.wordle.guesses = [];
    appState.wordle.status = "playing";

    renderWordleBoard();
    renderKeyboard();
    setView('play-wordle');
}

function renderWordleBoard() {
    const container = document.getElementById('wordle-grid');
    const len = appState.wordle.wordLength;
    const cell = (cls, char) => `<div class="wordle-cell ${cls}">${char || ''}</div>`;
    const rows = [];

    // Completed guesses
    appState.wordle.guesses.forEach(guess => {
        const result = checkGuess(guess);
        let cells = '';
        for (let i = 0; i < len; i++) {
            cells += cell('wordle-cell--' + result[i] + ' animate-flip', guess[i]);
        }
        rows.push(cells);
    });

    // The row being typed
    if (appState.wordle.status === 'playing') {
        let cells = '';
        for (let i = 0; i < len; i++) {
            const char = appState.wordle.currentGuess[i];
            cells += char
                ? cell('wordle-cell--filled animate-pop', char)
                : cell('wordle-cell--empty');
        }
        rows.push(cells);
    }

    // Rows still to come
    const rowsLeft = appState.wordle.maxTries - appState.wordle.guesses.length -
                     (appState.wordle.status === 'playing' ? 1 : 0);
    for (let r = 0; r < rowsLeft; r++) {
        rows.push(cell('wordle-cell--empty').repeat(len));
    }

    // Real rows rather than one long grid, so each row can size independently
    // and the board stays square at any word length.
    container.style.gridTemplateColumns = '';
    // The stylesheet caps the board by height as well as width, and needs the
    // shape to do it — an 8-letter board gets a seventh row.
    container.style.setProperty('--wordle-cols', len);
    container.style.setProperty('--wordle-rows', appState.wordle.maxTries);
    container.innerHTML = rows.map(cells =>
        `<div class="wordle-row" style="grid-template-columns: repeat(${len}, 1fr)">${cells}</div>`
    ).join('');
}

function renderKeyboard() {
    const kbContainer = document.getElementById('wordle-keyboard');

    const layoutEn = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
    const layoutAr = ['ضصثقفغعهخحجد', 'شسيبلاتنمكط', 'ئءؤرذىةوزظ'];
    const layout = appState.lang === 'ar' ? layoutAr : layoutEn;
    const keyState = getKeyboardState();

    const keyClass = (char) => {
        const status = keyState[char];
        return status ? ' key--' + status : '';
    };

    // Enter and Backspace get their own row: on the widest Arabic row (12 keys)
    // squeezing them in alongside dropped every key well under a 44px target.
    const rows = layout.map(row =>
        `<div class="keypad__row">` +
        row.split('').map(char =>
            `<button class="key${keyClass(char)}" onclick="handleWordleKey('${char}')">${char}</button>`
        ).join('') +
        `</div>`
    );

    const enterLabel = appState.lang === 'ar' ? 'تحقق' : 'Enter';
    rows.push(
        `<div class="keypad__row">` +
        `<button class="key key--wide" onclick="handleWordleKey('BACK')" aria-label="Backspace">⌫</button>` +
        `<button class="key key--wide" onclick="handleWordleKey('ENTER')">${enterLabel}</button>` +
        `</div>`
    );

    kbContainer.className = 'keypad';
    kbContainer.innerHTML = rows.join('');
}

function handleWordleKey(key) {
    if(appState.wordle.status !== 'playing') return;

    if(key === 'ENTER') {
        submitWordleGuess();
    } else if(key === 'BACK') {
        if(appState.wordle.currentGuess.length > 0) {
            appState.wordle.currentGuess = appState.wordle.currentGuess.slice(0, -1);
            renderWordleBoard();
        }
    } else {
        if(appState.wordle.currentGuess.length < appState.wordle.wordLength) {
            appState.wordle.currentGuess += key;
            renderWordleBoard();
        }
    }
}

function submitWordleGuess() {
    if(appState.wordle.currentGuess.length !== appState.wordle.wordLength) {
        playSound('alarm');
        const msg = appState.lang === 'ar' ? "الكلمة قصيرة جداً!" : "Word too short!";
        showToast(msg);
        return;
    }

    appState.wordle.guesses.push(appState.wordle.currentGuess);
    
    // Check Win/Loss
    if(appState.wordle.currentGuess === appState.wordle.targetWord) {
        appState.wordle.status = "won";
        appState.wordle.currentGuess = "";   // don't leave a half-row in state
        playSound('success');
        confetti({ particleCount: 200, spread: 100 });
        setTimeout(() => showWordleResult(true), 1000);
    } else if(appState.wordle.guesses.length >= appState.wordle.maxTries) {
        appState.wordle.status = "lost";
        appState.wordle.currentGuess = "";
        playSound('alarm');
        setTimeout(() => showWordleResult(false), 1000);
    } else {
        playSound('click');
        appState.wordle.currentGuess = "";
    }

    renderWordleBoard();
    renderKeyboard();
    saveToLocal();
}

function checkGuess(guess) {
    let result = Array(appState.wordle.wordLength).fill('absent');
    let targetArr = appState.wordle.targetWord.split('');
    let guessArr = guess.split('');

    // 1. Check Greens (Correct position)
    for(let i=0; i<appState.wordle.wordLength; i++) {
        if(guessArr[i] === targetArr[i]) {
            result[i] = 'correct';
            targetArr[i] = null; // Mark as used
            guessArr[i] = null;
        }
    }

    // 2. Check Yellows (Wrong position)
    for(let i=0; i<appState.wordle.wordLength; i++) {
        if(guessArr[i] !== null) { // Skip already matched
            const idx = targetArr.indexOf(guessArr[i]);
            if(idx !== -1) {
                result[i] = 'present';
                targetArr[idx] = null; // Mark used
            }
        }
    }
    return result;
}

function getKeyboardState() {
    let state = {};
    appState.wordle.guesses.forEach(guess => {
        const result = checkGuess(guess);
        for(let i=0; i<guess.length; i++) {
            const char = guess[i];
            const status = result[i];
            
            // Priority: correct > present > absent > unused
            if(state[char] === 'correct') continue;
            if(status === 'correct') state[char] = 'correct';
            else if(status === 'present' && state[char] !== 'correct') state[char] = 'present';
            else if(status === 'absent' && !state[char]) state[char] = 'absent';
        }
    });
    return state;
}

function showWordleResult(win) {
    const title = win 
        ? (appState.lang === 'ar' ? "🎉 مبروك!" : "🎉 You Won!") 
        : (appState.lang === 'ar' ? "حظ أوفر!" : "Game Over!");
    
    const msg = appState.lang === 'ar' 
        ? `الكلمة كانت: <br><b class="text-3xl tx-accent">${appState.wordle.targetWord}</b>` 
        : `The word was: <br><b class="text-3xl tx-accent">${appState.wordle.targetWord}</b>`;

    document.getElementById('alert-title').innerText = title;
    document.getElementById('alert-msg').innerHTML = msg;
    document.getElementById('alert-modal').classList.remove('hidden');
}
</script>
