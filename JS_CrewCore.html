<script>
/* ============================================================================
   «الشلة» (the crew): what every screen needs, in the shell. The crew's page,
   its sheets and its motion are JS_Crew.html (a chunk, loaded when the page or a
   sheet opens: lzRun('crew', …)). The rooms server keeps a crew (Crew.js,
   rooms-worker/src/crew.js); this phone keeps only which crews it is in and the
   key each one gave it (ashryCrews_v1) - its proof of membership, never shown
   and never sent to a room (a room is told only that the phone proved it).

   For other features (the API, documented in notes/games/crew.md):
     crewList()            -> [{ code, name, me, memberId, at }] newest used first
     crewCurrent()         -> the one used last, or null
     crewApi(path, body)   -> POST ROOMS_URL/crew/<path>, resolves { ok, ... }
     crewAct(code, action, payload) -> a member's move with this phone's key
     crewAddPack(code, { code, kind, title }) / crewRemovePack(code, packCode)
     crewPacksOf(code)     -> the packs a crew keeps, from this phone's copy of its page
     crewPackAddBtnHtml(code, kind, title) -> «ضيفها للشلة» for a pack's sheet
   ========================================================================= */
const CREW_STORE = 'ashryCrews_v1';
const CREW_CACHE = 'ashryCrewCache_v1';   // a copy of each crew's last page (a reload, no network)

function crewCacheRead() { try { return JSON.parse(localStorage.getItem(CREW_CACHE) || '{}') || {}; } catch (e) { return {}; } }
function crewCacheWrite(code, view) {
  const all = crewCacheRead();
  if (view) all[code] = view; else delete all[code];
  try { localStorage.setItem(CREW_CACHE, JSON.stringify(all)); } catch (e) {}
}

function crewStoreRead() {
  try {
    const raw = JSON.parse(localStorage.getItem(CREW_STORE) || 'null');
    if (raw && Array.isArray(raw.list)) return raw;
  } catch (e) {}
  return { list: [] };
}
function crewStoreWrite(s) {
  try { localStorage.setItem(CREW_STORE, JSON.stringify(s)); } catch (e) {}
}
/** The crews this phone is in, the one used last first (no keys). */
function crewList() {
  return crewStoreRead().list.slice().sort((a, b) => (b.at || 0) - (a.at || 0))
    .map(c => ({ code: c.code, name: c.name, me: c.me, memberId: c.memberId, at: c.at }));
}
function crewCurrent() { return crewList()[0] || null; }
function crewEntry(code) { return crewStoreRead().list.find(c => c.code === code) || null; }
/** Kept after a create or a join; `touch` makes it the one used last. */
function crewRemember(entry, touch) {
  const s = crewStoreRead();
  const old = s.list.find(c => c.code === entry.code);
  const next = Object.assign({}, old || {}, entry);
  if (touch !== false) next.at = Date.now();
  s.list = s.list.filter(c => c.code !== entry.code).concat([next]);
  crewStoreWrite(s);
  return next;
}
function crewForget(code) {
  const s = crewStoreRead();
  s.list = s.list.filter(c => c.code !== code);
  crewStoreWrite(s);
}
function crewTouch(code) { const e = crewEntry(code); if (e) crewRemember({ code: code }, true); }

async function crewApi(path, body) {
  const base = String(window.ROOMS_URL || '').replace(/\/+$/, '');
  const t = TRANSLATIONS[appState.lang] || {};
  if (!base) return { ok: false, error: t.crew_err_net || '' };
  try {
    const res = await fetch(base + '/crew/' + path, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body || {})
    });
    return (await res.json()) || { ok: false, error: t.crew_err_net || '' };
  } catch (e) {
    return { ok: false, net: true, error: t.crew_err_net || '' };
  }
}
/** A member's move with this phone's key. A key no longer good forgets the crew on this phone. */
async function crewAct(code, action, payload) {
  const e = crewEntry(code);
  if (!e) return { ok: false, error: 'NOT_IN_CREW' };
  const res = action === 'get' ? await crewApi('get', { code, key: e.key })
    : await crewApi('act', { code, key: e.key, action, payload: payload || {} });
  if (res && (res.out || res.gone)) crewForget(code);
  else if (res && res.ok && res.crew) crewRemember({ code, name: res.crew.name }, false);
  return res;
}
function crewAddPack(code, pack) { return crewAct(code, 'addPack', pack); }
function crewRemovePack(code, packCode) { return crewAct(code, 'removePack', { code: packCode }); }

/* --- the crew's packs (the links, 30 Sep 2026) -----------------------------------------
   A crew keeps the codes of its quizzes and word packs (Crew.js, crewAddPackTo), so every
   member has them without typing a code: on the crew's page (JS_Crew.html), in «اعمل
   مسابقتك»'s list («من الشلة», JS_QuizMaker.html), and a word pack as a category in the word
   games (JS_PackStore.html, packWordPacks). The list comes with the crew's page; this phone
   keeps its last copy (CREW_CACHE). */

/** The packs a crew keeps, from this phone's last copy of its page: [{ code, kind, title, by, byId, at }]. */
/** A name or a title inside a translated line, held apart (an Arabic title in an English line). */
const crewIso = (x) => String.fromCharCode(0x2068) + String(x || '') + String.fromCharCode(0x2069);

function crewPacksOf(code) {
  const v = crewCacheRead()[code];
  return v && Array.isArray(v.packs) ? v.packs : [];
}
/** Asks the crew for its page again (its packs among it); resolves true when it came. */
async function crewRefresh(code) {
  const res = await crewAct(code, 'get');
  if (res && res.ok && res.crew) { crewCacheWrite(code, res.crew); crewWordsSync(); return true; }
  if (res && (res.out || res.gone)) crewCacheWrite(code, null);
  return false;
}

/** «ضيفها للشلة» under a saved pack (a quiz's or the words' sheet), for a phone in a crew. */
function crewPackAddBtnHtml(code, kind, title) {
  const t = TRANSLATIONS[appState.lang] || {};
  const list = crewList();
  if (!code || !list.length) return '';
  const inAll = list.every(c => crewPacksOf(c.code).some(p => p.code === code));
  const label = inAll ? (list.length === 1 ? (t.crew_pack_in || '') : (t.crew_pack_in_all || '')) : (t.crew_pack_add_btn || '');
  return `<button type="button" class="btn btn--secondary crew-pack-add${inAll ? ' is-in' : ''}" data-crew-pack="${escapeHTML(code)}" ${inAll ? 'disabled' : ''}
      onclick="crewPackAdd('${jsStringAttr(code)}', '${jsStringAttr(kind)}', '${jsStringAttr(title || '')}')"><span aria-hidden="true">🎉</span> ${escapeHTML(label)}</button>`;
}

/** Adds a pack to the crew: at once with one crew, a pick of which with several. */
function crewPackAdd(code, kind, title) {
  const t = TRANSLATIONS[appState.lang] || {};
  const list = crewList();
  if (!list.length || !code) return;
  if (list.length === 1) { crewPackAddTo(list[0].code, code, kind, title); return; }
  crewPackAdd.pending = { code, kind, title };
  ['qm-save-modal'].forEach(id => { if (typeof closeModal === 'function') closeModal(id); });
  const rows = list.map(c => {
    const has = crewPacksOf(c.code).some(p => p.code === code);
    return `
      <button type="button" class="crew-pick ${has ? 'is-on' : ''}" ${has ? 'disabled' : ''} onclick="crewPackAddTo('${jsStringAttr(c.code)}')">
        <span class="crew-pick__icon" aria-hidden="true">🎉</span>
        <span class="crew-pick__name">${escapeHTML(c.name)}</span>
        ${has ? '<span class="crew-pick__on" aria-hidden="true">✓</span>' : ''}
      </button>`;
  }).join('');
  crewModal(`
    <div class="modal-icon" aria-hidden="true">${kind === 'words' ? '✍️' : '🧠'}</div>
    <div class="sheet__title">${escapeHTML(t.crew_pack_pick || '')}</div>
    <p class="sheet__subtitle">${escapeHTML(title || code)}</p>
    <div class="modal-list crew-picks">${rows}</div>
    <div class="modal-actions">
      <button type="button" class="btn btn--ghost" onclick="closeModal('crew-modal')">${escapeHTML(t.cancel || '')}</button>
    </div>`);
}

/** One crew: its answer is the crew's new page, kept, and every screen showing the packs follows. */
async function crewPackAddTo(crewCode, code, kind, title) {
  const t = TRANSLATIONS[appState.lang] || {};
  const p = code ? { code, kind, title } : (crewPackAdd.pending || {});
  if (!p.code) return;
  const res = await crewAddPack(crewCode, { code: p.code, kind: p.kind === 'words' ? 'words' : 'quiz', title: p.title || '' });
  if (!res || !res.ok) { showToast(roomErrLocal((res && res.error) || '') || t.crew_err_net || '', 'error'); return; }
  if (res.crew) crewCacheWrite(crewCode, res.crew);
  crewPackAdd.pending = null;
  const e = crewEntry(crewCode) || {};
  if (typeof closeModal === 'function') closeModal('crew-modal');
  showToast(String(t.crew_pack_added || '').replace('{name}', crewIso(e.name)), 'success');
  haptic('success');
  crewPacksChanged(p.code);
}

/** After a pack went on or off a crew: the buttons, the crew's page and the quiz list follow. */
function crewPacksChanged(justAdded) {
  document.querySelectorAll('[data-crew-pack]').forEach(b => {
    const html = crewPackAddBtnHtml(b.dataset.crewPack, '', '');
    if (!html) return;
    const box = document.createElement('div');
    box.innerHTML = html;
    const fresh = box.firstElementChild;
    if (!fresh) return;
    // Keep the button's own onclick (its kind and title), take the new label and state.
    b.innerHTML = fresh.innerHTML;
    b.disabled = fresh.disabled;
    b.classList.toggle('is-in', fresh.classList.contains('is-in'));
    if (fresh.disabled && typeof motionBump === 'function') motionBump(b);
  });
  if (justAdded) crewPacksChanged.justAdded = justAdded;
  crewWordsSync();
  if (appState.currentView === 'crew' && typeof renderCrew === 'function') renderCrew();
  if (appState.currentView === 'setup-quizmaker' && typeof qmPaintHub === 'function') qmPaintHub();
}

/**
 * A pack from the crew, opened: a quiz is openPackByCode's (its sheet, kept on the phone); the
 * words too when the phone has no word pack of its own (or has this one) - otherwise they are
 * shown on a sheet here, never over the family's own words, since they are dealt as a category
 * of their own anyway.
 */
async function crewOpenPack(code, kind) {
  const own = typeof packWordsLocal === 'function' ? packWordsLocal() : null;
  if (kind !== 'words' || !own || own.code === code) { await openPackByCode(code); return; }
  const t = TRANSLATIONS[appState.lang] || {};
  let w = (typeof packCrewWordsAll === 'function' ? packCrewWordsAll() : []).find(x => x.code === code);
  if (!w) {
    try { const got = await packFetch(code); w = { code, title: got.pack.title, words: got.pack.words }; }
    catch (e) { showToast(packErrorText(e.message), 'error'); return; }
  }
  const title = w.title || t.wp_title_default || '';
  crewModal(`
    <div class="modal-icon" aria-hidden="true">✍️</div>
    <div class="sheet__title">${escapeHTML(title)}</div>
    <p class="sheet__subtitle">${escapeHTML(String(t.crew_words_where || '').replace('{t}', crewIso(title)))}</p>
    <div class="wp-chips crew-words-chips">${(w.words || []).map(x => `<span class="wp-chip">${escapeHTML(x)}</span>`).join('')}</div>
    <div class="modal-actions">
      <button type="button" class="btn btn--ghost" onclick="closeModal('crew-modal')">${escapeHTML(t.close || t.cancel || '')}</button>
    </div>`);
}

/**
 * The crews' word packs, kept on this phone (JS_PackStore.html, crewWords): fetched once each
 * (again when the crew says it changed), dropped when no crew on the phone lists it. Reads the
 * crews' last pages only; asks the network just for a pack it doesn't have yet.
 */
let crewWordsBusy = false;
async function crewWordsSync() {
  if (crewWordsBusy || typeof packCrewWordsAll !== 'function') return;
  crewWordsBusy = true;
  try {
    const want = {};   // code -> { crews: [...], at, title }
    crewList().forEach(c => crewPacksOf(c.code).filter(p => p.kind === 'words').forEach(p => {
      const w = want[p.code] = want[p.code] || { crews: [], at: 0, title: p.title };
      w.crews.push(c.code);
      w.at = Math.max(w.at, Number(p.at) || 0);
    }));
    const had = packCrewWordsAll();
    const keep = had.filter(w => want[w.code]).map(w => Object.assign({}, w, { crews: want[w.code].crews }));
    for (const code of Object.keys(want)) {
      if (keep.some(w => w.code === code)) continue;
      if (typeof navigator !== 'undefined' && navigator.onLine === false) continue;
      try {
        const got = await packFetch(code);
        if (got.kind === 'words') keep.push({ code, title: got.pack.title, words: got.pack.words, crews: want[code].crews, at: Date.now() });
      } catch (e) { /* not there any more, or no network: tried again next time */ }
    }
    const same = JSON.stringify(had.map(w => [w.code, w.crews])) === JSON.stringify(keep.map(w => [w.code, w.crews]));
    if (!same) packCrewWordsSet(keep);
  } finally { crewWordsBusy = false; }
}

// A phone in a crew asks for its page now and then (at most every 6 hours, after start-up),
// so a pack another member added reaches this phone's lists without opening the crew's page.
const CREW_REFRESH_EVERY_MS = 6 * 3600 * 1000;
function crewRefreshSoon() {
  const c = crewCurrent();
  if (!c) return;
  let at = 0;
  try { at = Number(localStorage.getItem('ashryCrewPacksAt') || 0); } catch (e) {}
  if (Date.now() - at < CREW_REFRESH_EVERY_MS) { crewWordsSync(); return; }
  try { localStorage.setItem('ashryCrewPacksAt', String(Date.now())); } catch (e) {}
  crewRefresh(c.code);
}
if (typeof document !== 'undefined') setTimeout(() => { try { crewRefreshSoon(); } catch (e) {} }, 5000);

/** A crew's link: the preview page (/s/CODE, site-worker/) where links point at Cloudflare, else ?crew=. */
function crewInviteUrl(code, name) {
  const data = window.SERVER_DATA || {};
  const base = data.webAppUrl;
  if (!base || !code) return '';
  if (!data.roomLinks) return base + '?crew=' + code;
  const q = [];
  if (name) q.push('n=' + encodeURIComponent(String(name).slice(0, 30)));
  if (appState.lang === 'en') q.push('l=en');
  return base.replace(/\/?$/, '/') + 's/' + code + (q.length ? '?' + q.join('&') : '');
}

/** The doors: the مع بعض tab's card, Settings, a link. The page is JS_Crew.html's. */
function openCrews(then) {
  if (typeof closeModal === 'function') closeModal('settings-modal');
  // One door for both: two lzRun calls share one key, and the second would drop the first.
  lzRun('crew', () => { setView('crew'); if (typeof then === 'function') then(); });
}
function crewOpenJoinDoor(code) { openCrews(() => crewOpenJoin(code || '')); }
function crewOpenCreateDoor() { openCrews(() => crewOpenCreate()); }

/** A ?crew=CODE (or /s/CODE) link: the crew page and its join sheet. */
function initCrews() {
  const code = String((window.SERVER_DATA && window.SERVER_DATA.crew) || '').toUpperCase();
  if (!/^[A-Z]{6}$/.test(code)) return;
  const e = crewEntry(code);
  if (e) { crewRemember({ code }, true); openCrews(); return; }
  crewOpenJoinDoor(code);
}

function crewPaintSettings() {
  const el = document.getElementById('settings-crew-value');
  if (!el) return;
  const c = crewCurrent();
  el.textContent = c ? c.name : '';
}

/* --- the مع بعض tab's card ------------------------------------------------- */
function crewTogetherHtml(t) {
  const list = crewList();
  const c = list[0];
  if (!c) {
    return `
    <section class="crew-door card card--tight" data-accent="violet">
      <span class="crew-door__icon" aria-hidden="true">🎉</span>
      <div class="crew-door__text">
        <div class="crew-door__title">${escapeHTML(t.crew_title || '')}</div>
        <div class="crew-door__sub">${escapeHTML(t.crew_door_sub || '')}</div>
      </div>
      <div class="crew-door__btns">
        <button type="button" class="btn btn--primary btn--sm btn--auto" onclick="crewOpenCreateDoor()">${escapeHTML(t.crew_create || '')}</button>
        <button type="button" class="btn btn--ghost btn--sm btn--auto" onclick="crewOpenJoinDoor('')">${escapeHTML(t.crew_join || '')}</button>
      </div>
    </section>`;
  }
  const more = list.length > 1 ? ` <span class="crew-door__more">+${list.length - 1}</span>` : '';
  return `
    <button type="button" class="crew-door crew-door--have card card--tight" data-accent="violet" onclick="openCrews()">
      <span class="crew-door__icon" aria-hidden="true">🎉</span>
      <span class="crew-door__text">
        <span class="crew-door__eyebrow">${escapeHTML(t.crew_title || '')}${more}</span>
        <span class="crew-door__title">${escapeHTML(c.name)}</span>
        <span class="crew-door__sub">${escapeHTML(t.crew_door_have || '')}</span>
      </span>
      <span class="crew-door__chev" aria-hidden="true">‹</span>
    </button>`;
}

/* --- a room «للشلة» ----------------------------------------------------------
   Opening a room on a phone that is in a crew asks every time «للشلة؟» (the
   owner, 30 Sep 2026: "ask every time", so a night with other friends never
   counts by mistake): the crews on this phone, the one used last first, and
   «مش للشلة». The host can still change it in the lobby. Every phone that is a
   member says so to the room once (crewMe), so the night maps it to its member
   even when its room name differs; the rest are guests. */
async function crewAutoForRoom() {
  if (!crewList().length || typeof Room === 'undefined' || !Room.state || !Room.state.youAreHost || Room.state.crew) return;
  crewPickForRoom();
}

async function crewSetForRoom(code) {
  if (typeof Room === 'undefined' || !Room.state) return;
  const e = code ? crewEntry(code) : null;
  try {
    await Room.act('setCrew', e ? { code: e.code, key: e.key } : { code: '' });
    if (e) crewTouch(e.code);
    if (typeof closeModal === 'function') closeModal('crew-modal');
  } catch (err) {
    showToast(roomErrLocal((err && err.message) || ''), 'error');
  }
}

/** The host's pick: the crews on this phone, or none. A centred sheet (#crew-modal). */
function crewPickForRoom() {
  const t = TRANSLATIONS[appState.lang] || {};
  const state = Room.state || {};
  const cur = state.crew && state.crew.code;
  const rows = crewList().map(c => `
      <button type="button" class="crew-pick ${c.code === cur ? 'is-on' : ''}" onclick="crewSetForRoom('${jsStringAttr(c.code)}')">
        <span class="crew-pick__icon" aria-hidden="true">🎉</span>
        <span class="crew-pick__name">${escapeHTML(c.name)}</span>
        ${c.code === cur ? '<span class="crew-pick__on" aria-hidden="true">✓</span>' : ''}
      </button>`).join('');
  crewModal(`
    <div class="modal-icon" aria-hidden="true">🎉</div>
    <div class="sheet__title">${escapeHTML(t.crew_room_pick || '')}</div>
    <p class="sheet__subtitle">${escapeHTML(t.crew_room_pick_sub || '')}</p>
    <div class="modal-list crew-picks">${rows}
      <button type="button" class="crew-pick ${!cur ? 'is-on' : ''}" onclick="crewSetForRoom('')">
        <span class="crew-pick__icon" aria-hidden="true">🚫</span>
        <span class="crew-pick__name">${escapeHTML(t.crew_room_none || '')}</span>
        ${!cur ? '<span class="crew-pick__on" aria-hidden="true">✓</span>' : ''}
      </button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn--ghost" onclick="closeModal('crew-modal')">${escapeHTML(t.cancel || '')}</button>
    </div>`);
}

/** Fills and opens the one centred sheet the crew uses (#crew-modal). */
function crewModal(html) {
  const el = document.getElementById('crew-modal');
  const box = document.getElementById('crew-modal-box');
  if (!el || !box) return;
  box.innerHTML = html;
  el.classList.remove('hidden');
}

/** The lobby's line: which crew the night is for (the host changes it), and «انضم» for a guest. */
function crewLobbyHtml(state) {
  const t = TRANSLATIONS[appState.lang] || {};
  if (!state || state.youAreScreen) return '';
  const crew = state.crew;
  const mine = crew && crewEntry(crew.code);
  if (state.youAreHost) {
    const have = crewList().length;
    if (!crew && !have) return '';
    return `
      <button type="button" class="crew-lobby ${crew ? 'is-on' : ''}" onclick="crewPickForRoom()">
        <span class="crew-lobby__icon" aria-hidden="true">🎉</span>
        <span class="crew-lobby__text">${crew
          ? escapeHTML((t.crew_room_for || '').replace('{name}', crew.name))
          : escapeHTML(t.crew_room_ask || '')}</span>
        <span class="crew-lobby__edit" aria-hidden="true">✏️</span>
      </button>`;
  }
  if (!crew) return '';
  return `
    <div class="crew-lobby is-on crew-lobby--guest">
      <span class="crew-lobby__icon" aria-hidden="true">🎉</span>
      <span class="crew-lobby__text">${escapeHTML((t.crew_room_for || '').replace('{name}', crew.name))}</span>
      ${mine ? '' : `<button type="button" class="btn btn--secondary btn--xs btn--auto" onclick="crewOpenJoinDoor('${jsStringAttr(crew.code)}')">${escapeHTML(t.crew_join_this || '')}</button>`}
    </div>`;
}

/** Under the night's board in the hub: a guest is asked to join the crew. */
function crewGuestOfferHtml(state, t) {
  if (!state || !state.crew || state.youAreScreen || crewEntry(state.crew.code)) return '';
  return `
    <div class="crew-offer" data-accent="violet">
      <span class="crew-offer__icon" aria-hidden="true">🎉</span>
      <span class="crew-offer__text">${escapeHTML((t.crew_offer || '').replace('{name}', state.crew.name))}</span>
      <button type="button" class="btn btn--primary btn--sm btn--auto" onclick="crewOpenJoinDoor('${jsStringAttr(state.crew.code)}')">${escapeHTML(t.crew_join_this || '')}</button>
    </div>`;
}

// Every member phone in a room for its crew says which member it is, once per room.
const crewMeSent = {};
if (typeof Room !== 'undefined') Room.onChange((state) => {
  if (!state || !state.crew || state.youAreScreen || !Room.me) return;
  const e = crewEntry(state.crew.code);
  if (!e) return;
  const k = state.code + '|' + state.crew.code + '|' + Room.me;
  if (crewMeSent[k]) return;
  crewMeSent[k] = true;
  Room.act('crewMe', { code: e.code, key: e.key }).catch((err) => {
    // Refused by the crew (taken out, or the crew is gone), not a network hiccup: don't ask again
    // for this room - every state used to resend it - and ask the crew once, which forgets it if so.
    if (err && /الشلة/.test(String(err.raw || err.message || ''))) { crewRefresh(e.code).catch(() => {}); return; }
    setTimeout(() => { delete crewMeSent[k]; }, 30000);
  });
});
</script>
