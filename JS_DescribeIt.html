function setupDescribe() {
    setView('setup-describe');
}

function startDescribeGame(time) {
    appState.describe.score = 0;
    // `timer` is the live countdown - onTick drives it to 0 - so the round
    // length is remembered separately. "Play again" passed the ticked-out timer
    // back in, which was 0, and the new round ended the instant it started.
    const seconds = Number(time) || appState.describe.duration || 60;
    appState.describe.duration = seconds;
    appState.describe.timer = seconds;
        
    appState.describe.history = []; // Reset used words
    
    // UI RESET: Show Game, Hide Result
    document.getElementById('desc-ui-playing').classList.remove('hidden');
    document.getElementById('desc-ui-result').classList.add('hidden');
    
    setView('play-describe');
    nextDescribeCard();
    startDescribeTimer();
}

function startDescribeTimer() {
    if(appState.describe.interval) appState.describe.interval.stop();
    document.getElementById('desc-timer').innerText = appState.describe.timer;

    appState.describe.interval = createClock({
        seconds: appState.describe.timer,
        onTick: (left) => {
            appState.describe.timer = left;
            const el = document.getElementById('desc-timer');
            if (el) el.innerText = left;
        },
        onEnd: () => {
            appState.describe.interval = null;
            finishDescribeGame();
        }
    });
}

function nextDescribeCard() {
    const lang = appState.lang === 'en' ? 'en' : 'ar';
    const db = DESCRIBE_DB[lang] || [];
    if (!db.length) return;

    if (!appState.describe.history) appState.describe.history = [];
    let available = db.filter(c => !appState.describe.history.includes(c.word));
    if (available.length === 0) {
        appState.describe.history = [];
        available = db;
    }

    const card = available[Math.floor(Math.random() * available.length)];
    appState.describe.history.push(card.word);
    appState.describe.currentCard = card;
    
    renderDescribeCard();
}

function renderDescribeCard() {
    const card = appState.describe.currentCard;
    document.getElementById('desc-main-word').innerText = card.word;
    
    const forbiddenList = document.getElementById('desc-forbidden-list');
    forbiddenList.innerHTML = '';
    
    card.forbidden.forEach(word => {
        forbiddenList.innerHTML += `
            <div class="plate-danger font-bold py-2 rounded-lg">
                ${word}
            </div>
        `;
    });
}

function descAction(action) {
    if(appState.describe.timer <= 0) return;

    if(action === 'correct') {
        appState.describe.score++;
        playSound('success');
    } else {
        // Skip or Taboo (Optional: minus points? For now just skip)
        playSound('click');
    }
    
    // Update Score UI if you want to show it live
    // document.getElementById('desc-score-live').innerText = appState.describe.score;
    
    nextDescribeCard();
}

function finishDescribeGame() {
    // 1. Stop Timer
    if (appState.describe.interval) appState.describe.interval.stop();
    appState.describe.interval = null;
    
    playSound('alarm');
    confetti({ particleCount: 200, spread: 100 });

    // 2. Update Score in Result Screen
    document.getElementById('desc-final-score').innerText = appState.describe.score;

    // 3. Switch Views: Hide Game, Show Result
    document.getElementById('desc-ui-playing').classList.add('hidden');
    document.getElementById('desc-ui-result').classList.remove('hidden');
}

/* --- DICE & COIN LOGIC --- */

function setDiceCount(n) {
    appState.dice.count = n;
    [1, 2].forEach(i => {
        const btn = document.getElementById('btn-d' + i);
        if (btn) {
            btn.classList.toggle('is-active', i === n);
            btn.setAttribute('aria-pressed', String(i === n));
        }
    });

    // Changing the dice count invalidates whatever was last rolled.
    const container = document.getElementById('dice-container');
    if (container) container.innerHTML = '<div class="dice-placeholder" aria-hidden="true">🎲</div>';
    const result = document.getElementById('dice-result');
    if (result) result.innerText = '---';
}

/** Dice / coin tab switch, previously inline DOM juggling in the markup. */
function setDiceTab(which) {
    const isDice = (which === 'dice');
    const pane = (id, on) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !on);
    };
    pane('tab-dice', isDice);
    pane('tab-coin', !isDice);
    const bd = document.getElementById('tab-btn-dice');
    const bc = document.getElementById('tab-btn-coin');
    if (bd) bd.classList.toggle('is-active', isDice);
    if (bc) bc.classList.toggle('is-active', !isDice);
}

function rollDice() {
    const container = document.getElementById('dice-container');
    const resultEl = document.getElementById('dice-result');
    const btn = document.querySelector('[onclick="rollDice()"]');
    
    // Disable button to prevent spam-clicking while rolling
    if (btn) btn.disabled = true;

    // 1. Clear & Start "Roll" Animation
    container.innerHTML = '';
    playSound('tick'); 
    
    for(let i=0; i<appState.dice.count; i++) {
        // Changed animate-shake to animate-roll, and put a dice emoji while it spins!
        container.innerHTML += `
            <div class="w-24 h-24 bg-white border-4 border-slate-800 rounded-2xl flex items-center justify-center shadow-xl animate-roll">
                <span class="dice-face dice-face--emoji">🎲</span>
            </div>`;
    }

    // 2. Reveal Result after 600ms (matches the new CSS animation perfectly)
    setTimeout(() => {
        container.innerHTML = '';
        let total = 0;
        
        for(let i=0; i<appState.dice.count; i++) {
            const num = Math.floor(Math.random() * 6) + 1;
            total += num;
            
            // Render final dice with "Pop" animation
            container.innerHTML += `
                <div class="w-24 h-24 bg-white border-4 border-slate-800 rounded-2xl flex items-center justify-center shadow-xl animate-pop">
                    <span class="dice-face">${num}</span>
                </div>`;
        }
        
        resultEl.innerText = total;
        playSound('success');
        if (btn) btn.disabled = false; // Re-enable the button!
    }, 600);
}

function flipCoin() {
    const coinEl = document.getElementById('coin-circle');
    const resultEl = document.getElementById('coin-result');
    
    coinEl.classList.add('animate-flip-fast');
    playSound('click');
    
    setTimeout(() => {
        const isHeads = Math.random() > 0.5;
        const text = isHeads 
            ? (appState.lang === 'ar' ? "ملك" : "Heads") 
            : (appState.lang === 'ar' ? "كتابة" : "Tails");
            
        coinEl.classList.remove('animate-flip-fast');
        coinEl.innerText = isHeads ? "👑" : "📝";
        resultEl.innerText = text;
        playSound('success');
    }, 800);
}
