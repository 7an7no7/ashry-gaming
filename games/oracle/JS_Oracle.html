<script>
/* ============================================================================
   العرّاف — The Oracle on one phone (made by tools/new-game.mjs, 2026-10-09)
   ----------------------------------------------------------------------------
   The phone goes round: each player sees their secret number, taps «+1»
   until they think they have reached it, and passes it on; then the nearest
   wins. The whole game is in appState.oracle, so a reload comes back to it
   (VIEW_RESTORE, JS_Core.html). Replace it with the real game.
   ========================================================================= */

const oracleOneT = () => TRANSLATIONS[appState.lang] || TRANSLATIONS.ar;

function oracleState() {
  if (!appState.oracle) appState.oracle = null;
  return appState.oracle;
}

/** Its card on the home, and its setup screen. */
function setupOracle() { setView('setup-oracle'); }

function startOracle() {
  // Who plays: the players picked on this phone, or «مين بيلعب؟» asks for them first.
  const names = (appState.activePlayers || []).slice(0, 8);
  if (names.length < 1) { askPlayers(1, () => startOracle(), { max: 8 }); return; }
  const players = names.map(name => ({ name, target: 3 + Math.floor(Math.random() * 7), count: 0 }));
  appState.oracle = { players, at: 0, shown: false, phase: 'play' };
  saveToLocal();
  setView('play-oracle');
  renderOracle();
}

function oracleShow() { appState.oracle.shown = true; saveToLocal(); renderOracle(); }
function oracleOneTap() { haptic('light'); appState.oracle.players[appState.oracle.at].count++; saveToLocal(); renderOracle(); }
function oracleNext() {
  const g = appState.oracle;
  g.at++;
  g.shown = false;
  if (g.at >= g.players.length) g.phase = 'over';
  saveToLocal();
  renderOracle();
  scrollToAction();
}

function renderOracle() {
  const el = document.getElementById('oracle-stage');
  const g = oracleState();
  if (!el || !g) return;
  const t = oracleOneT();
  if (g.phase === 'over') {
    const board = g.players.map(p => ({ name: p.name, score: Math.max(0, 10 - Math.abs(p.target - p.count)), count: p.count, target: p.target }))
      .sort((a, b) => b.score - a.score);
    el.innerHTML = `
      <div class="card" style="text-align:center">
        <div class="card__title">${escapeHTML(t.oracle_result)}</div>
        ${board.map(r => `<div class="row"><span>${escapeHTML(r.name)}</span><span class="metric">${ltrFrac(r.count, r.target)}</span></div>`).join('')}
        <button class="btn btn--primary btn--lg" onclick="startOracle()">${escapeHTML(t.play_again || '')}</button>
      </div>
      <div class="play-exit-row"><button type="button" class="btn btn--ghost btn--sm btn--auto play-exit" onclick="playExit(() => setView('setup-oracle'))">${escapeHTML(t.exit || '')}</button></div>`;
    return;
  }
  const p = g.players[g.at];
  el.innerHTML = `
    <div class="card" style="text-align:center">
      <p class="sheet__subtitle">${escapeHTML(t.oracle_turn_of)} <bdi>${escapeHTML(p.name)}</bdi></p>
      ${g.shown ? `
        <div class="metric metric--lg">${p.target}</div>
        <div class="metric metric--md">${p.count}</div>
        <div class="btn-stack">
          <button class="btn btn--primary btn--lg" onclick="oracleOneTap()">${escapeHTML(t.oracle_tap)}</button>
          <button class="btn btn--secondary" onclick="oracleNext()">${escapeHTML(t.oracle_done)}</button>
        </div>` : `<button class="btn btn--primary btn--lg" onclick="oracleShow()">${escapeHTML(t.oracle_show)}</button>`}
    </div>
    <div class="play-exit-row"><button type="button" class="btn btn--ghost btn--sm btn--auto play-exit" onclick="playExit(() => setView('setup-oracle'))">${escapeHTML(t.exit || '')}</button></div>`;
}

// A reload: the setup as it was, or the game where it was.
VIEW_RESTORE['setup-oracle'] = () => {};
VIEW_RESTORE['play-oracle'] = () => { if (oracleState()) renderOracle(); else setTimeout(() => setView('setup-oracle'), 50); };
</script>
