<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عشرى جيمينج</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!--
  This page exists for one reason: the home-screen icon.

  An Apps Script web app is served inside an iframe. Open the /exec URL and the
  top-level document belongs to script.google.com; your HTML is one document
  further down. "Add to Home Screen" only ever reads the top-level document, so
  the <link rel="apple-touch-icon"> tags inside the app are invisible to Safari,
  and iOS falls back to a screenshot of whatever was on screen — which is why
  the icon appeared sometimes and not others.

  Apps Script gives no way to put a <link> on its wrapper page (addMetaTag
  accepts a short whitelist of meta tags and nothing else), so the icon has to
  come from a page you control. This is that page: it holds the icons and the
  manifest, and shows the app in a full-window iframe so the top-level origin
  stays here — which keeps standalone mode, the name and the icon working.

  Setup lives in README.md next to this file.
-->

<!-- iOS. 180 is the size it actually wants; it rounds the corners itself. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عشرى جيمينج">
<meta name="application-name" content="عشرى جيمينج">
<meta name="theme-color" content="#6d28d9">

<!-- A real file, not a data: URL — Safari ignores data: manifests. -->
<link rel="manifest" href="manifest.webmanifest">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #6d28d9;      /* shows for the moment before the frame paints */
    overflow: hidden;
  }
  iframe {
    display: block; border: 0;
    width: 100%; height: 100%;
    /* dvh so the iOS toolbars appearing don't leave a strip of background */
    height: 100dvh;
  }
  /* Sits behind the iframe, so the wait is the app's colour and not white. */
  #boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: linear-gradient(155deg, #6d28d9, #8b5cf6);
    color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 800; font-size: 1rem;
    transition: opacity .4s ease;
  }
  #boot img { width: 84px; height: 84px; border-radius: 22px; display: block; margin: 0 auto 14px; }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="boot">
  <div style="text-align:center">
    <img src="icon-180.png" alt="">
    <div>جارٍ التحميل…</div>
  </div>
</div>

<iframe id="app" title="عشرى جيمينج" allow="fullscreen"></iframe>

<script>
  /*
   * The deployed /exec URL. Replace it with yours — see README.md.
   * Keep the /exec on the end; /dev only works while you are signed in.
   */
  // The versioned deployment this project is actually deployed to (clasp
  // deployments -> the one on @165). The other two are the @HEAD test
  // deployment and an older @159; if you share one of those instead, swap
  // the id below for it.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwmOEPloksDkrGoegi7k3kaQcM6PlMg3JGybKfyVv0qhlcUfxA0tvwkSdl8YrsYvcqY/exec';

  /*
   * A scanned join link looks like .../?room=ABCD. Carry any query string
   * through to the app, or scanning a room QR would open an empty lobby.
   */
  var query = window.location.search || '';
  var frame = document.getElementById('app');
  frame.src = APP_URL + query;

  frame.addEventListener('load', function () {
    document.getElementById('boot').classList.add('gone');
  });

  /* If the frame never loads, say so rather than sitting on a spinner. */
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (!boot.classList.contains('gone')) {
      boot.querySelector('div > div:last-child').textContent =
        'تعذر فتح التطبيق — تأكد من الرابط في index.html';
    }
  }, 12000);
</script>
</body>
</html>
