function setupDescribe() {
    setView('setup-describe');
}

function startDescribeGame(time) {
    // `timer` is the live countdown - onTick drives it to 0 - so the round
    // length is remembered separately. "Play again" passed the ticked-out timer
    // back in, which was 0, and the new round ended the instant it started.
    const seconds = Number(time) || appState.describe.duration || 60;
    appState.describe.duration = seconds;

    // Team mode (JS_TeamRelay.html): a fresh relay with the names and turns
    // the setup shows now, and the handover card before the first turn. A
    // match left unfinished used to carry on silently, ignoring edited names;
    // now Start asks first, and "continue" is its own button on the setup.
    const o = relayOptsOf(appState.describe);
    if (o.mode === 'teams') {
        relayBegin(appState.describe, TRANSLATIONS[appState.lang], () => {
            relayStart(appState.describe, relayNames(appState.describe, TRANSLATIONS[appState.lang]), o.turns);
            setView('play-describe');
            describeShowRelay();
        });
        return;
    }
    describeRunTurn();
}

/** The setup screen's "continue": the unfinished match, as it was. */
function describeResumeMatch() {
    if (!relayInProgress(appState.describe)) return;
    setView('play-describe');
    describeShowRelay();
}

/** One timed round, for one player or for the team whose turn it is. */
function describeRunTurn() {
    appState.describe.score = 0;
    appState.describe.timer = appState.describe.duration || 60;
    appState.describe.history = []; // Reset used words
    // A turn's take-backs are its own: the last team's cards stay theirs.
    appState.describe.judged = [];

    // UI RESET: Show Game, Hide Result
    document.getElementById('desc-ui-playing').classList.remove('hidden');
    document.getElementById('desc-ui-result').classList.add('hidden');
    document.getElementById('desc-ui-relay').classList.add('hidden');

    if (appState.currentView !== 'play-describe') setView('play-describe');
    nextDescribeCard();
    startDescribeTimer();
}

/** The card between team turns: whose turn, hand the phone over. */
function describeShowRelay() {
    const t = TRANSLATIONS[appState.lang];
    document.getElementById('desc-ui-playing').classList.add('hidden');
    document.getElementById('desc-ui-result').classList.add('hidden');
    const box = document.getElementById('desc-ui-relay');
    box.classList.remove('hidden');
    box.innerHTML = relayHandoverHtml(appState.describe, t, 'describeRunTurn()');
}

function paintDescribeSetup() {
    paintRelaySetup('desc', appState.describe, 'describeResumeMatch()');
}

function startDescribeTimer() {
    if(appState.describe.interval) appState.describe.interval.stop();
    document.getElementById('desc-timer').innerText = appState.describe.timer;

    appState.describe.interval = createClock({
        seconds: appState.describe.timer,
        onTick: (left) => {
            appState.describe.timer = left;
            const el = document.getElementById('desc-timer');
            if (el) el.innerText = left;
        },
        onEnd: () => {
            appState.describe.interval = null;
            finishDescribeGame();
        }
    });
}

function nextDescribeCard() {
    const lang = contentLang();
    const db = DESCRIBE_DB[lang] || [];
    if (!db.length) return;

    if (!appState.describe.history) appState.describe.history = [];
    if (appState.describe.history.length >= db.length) appState.describe.history = [];

    // Remembered across games on this phone, not just within this round.
    const card = freshPick('describe:' + lang, db, 1, { key: c => c.word, avoid: appState.describe.history })[0];
    appState.describe.history.push(card.word);
    appState.describe.currentCard = card;
    
    renderDescribeCard();
}

function renderDescribeCard() {
    const card = appState.describe.currentCard;
    document.getElementById('desc-main-word').innerText = card.word;
    
    const forbiddenList = document.getElementById('desc-forbidden-list');
    forbiddenList.innerHTML = '';
    
    card.forbidden.forEach(word => {
        forbiddenList.innerHTML += `
            <div class="plate-danger font-bold py-2 rounded-lg">
                ${word}
            </div>
        `;
    });
}

function descAction(action) {
    if(appState.describe.timer <= 0) return;

    // Kept so a mis-tap under the clock can be taken back (undoDescribeCard).
    if (appState.describe.currentCard) {
        appState.describe.judged = appState.describe.judged || [];
        appState.describe.judged.push({ card: appState.describe.currentCard, action: action });
    }

    if(action === 'correct') {
        appState.describe.score++;
        playSound('success');
    } else {
        // Skip or Taboo (Optional: minus points? For now just skip)
        playSound('click');
    }
    
    // Update Score UI if you want to show it live
    // document.getElementById('desc-score-live').innerText = appState.describe.score;
    
    nextDescribeCard();
}

/** Puts the last card back: its point, its word and its forbidden words. */
function undoDescribeCard() {
    const judged = appState.describe.judged || [];
    const last = judged.pop();
    const t = TRANSLATIONS[appState.lang] || {};
    if (!last) { showToast(t.undo_nothing || '', 'info'); return; }
    if (last.action === 'correct') appState.describe.score = Math.max(0, appState.describe.score - 1);
    const hist = appState.describe.history || [];
    const shown = appState.describe.currentCard;
    if (hist.length && shown && hist[hist.length - 1] === shown.word) hist.pop();
    appState.describe.currentCard = last.card;
    renderDescribeCard();
    playSound('tick');
    haptic('light');
    showToast(t.undo_done || '', 'success');
}

function finishDescribeGame() {
    // 1. Stop Timer
    if (appState.describe.interval) appState.describe.interval.stop();
    appState.describe.interval = null;
    
    playSound('alarm');
    confetti({ particleCount: 200, spread: 100 });

    document.getElementById('desc-ui-playing').classList.add('hidden');

    appState.describe.judged = [];

    // Team mode: bank the turn, then the next handover or the final board.
    if (relayPlaying(appState.describe)) {
        const t = TRANSLATIONS[appState.lang];
        const phase = relayTurnDone(appState.describe, appState.describe.score);
        const box = document.getElementById('desc-ui-relay');
        box.classList.remove('hidden');
        box.innerHTML = relaySummaryHtml(appState.describe, t,
            phase === 'done' ? 'startDescribeGame()' : 'describeRunTurn()', "setView('setup-describe')");
        return;
    }

    document.getElementById('desc-final-score').innerText = appState.describe.score;
    document.getElementById('desc-ui-result').classList.remove('hidden');
}

/* --- DICE & COIN LOGIC --- */

/* --- 🎲 The dice -------------------------------------------------------------
   A cube of six faces in 3D, not a picture of one: the pips are drawn with
   CSS, the tumble is one transform the browser interpolates, and the landing
   angle is whichever face the roll actually came up with. Opposite faces add
   to seven, so the die reads right from any side while it turns.
   -------------------------------------------------------------------------- */

/* Pip positions in the face's 3x3 grid, as [row, column]. */
const DIE_PIPS = {
  1: [[2, 2]],
  2: [[1, 1], [3, 3]],
  3: [[1, 1], [2, 2], [3, 3]],
  4: [[1, 1], [1, 3], [3, 1], [3, 3]],
  5: [[1, 1], [1, 3], [2, 2], [3, 1], [3, 3]],
  6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
};

/* What to rotate the cube to so a given value faces the player. */
const DIE_LANDING = {
  1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0]
};

const dieFaceHtml = (n) => `<div class="die__face die__face--${n}">` +
  DIE_PIPS[n].map(([r, c]) => `<span class="die__pip" style="grid-area:${r}/${c}"></span>`).join('') + '</div>';

/** The tray, built to the chosen number of dice and left showing its last roll. */
function paintDiceTray(values) {
  const tray = document.getElementById('dice-tray');
  if (!tray) return;
  const count = appState.dice.count;
  if (tray.children.length !== count) {
    tray.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const slot = document.createElement('div');
      slot.className = 'die-slot';
      slot.innerHTML = `<div class="die">${[1, 2, 3, 4, 5, 6].map(dieFaceHtml).join('')}</div>`;
      tray.appendChild(slot);
    }
    diceTurns = [];
  }
  if (values) [...tray.querySelectorAll('.die')].forEach((die, i) => settleDie(die, values[i], i));
}

let diceTurns = [];

/** Turns the cube to a value, a few whole turns further round than last time. */
function settleDie(die, value, index) {
  const [baseX, baseY] = DIE_LANDING[value] || [0, 0];
  const turns = (diceTurns[index] || 0) + 2 + Math.floor(Math.random() * 2);
  diceTurns[index] = turns;
  // A little off-axis, so it lands looking thrown rather than placed.
  const tiltX = -14 + Math.random() * 6;
  const tiltY = 12 + Math.random() * 8;
  die.style.transform = `rotateX(${turns * 360 + baseX + tiltX}deg) rotateY(${turns * 360 + baseY + tiltY}deg)`;
}

function setDiceCount(n) {
  appState.dice.count = Number(n) === 2 ? 2 : 1;
  saveToLocal();
  paintDiceCount();
  paintDiceTray();
  const result = document.getElementById('dice-result');
  if (result) result.innerText = '---';
}

function paintDiceCount() {
  const n = appState.dice.count;
  const b1 = document.getElementById('btn-d1');
  const b2 = document.getElementById('btn-d2');
  if (b1) b1.classList.toggle('is-active', n !== 2);
  if (b2) b2.classList.toggle('is-active', n === 2);
}

/** The tool as it was last left on this phone: one die or two, the dice or the coin. */
function paintDiceTool() {
  if (appState.dice.count !== 2) appState.dice.count = 1;
  paintDiceCount();
  setDiceTab(appState.dice.tab === 'coin' ? 'coin' : 'dice', true);
  paintDiceTray();
}

function rollDice() {
  const tray = document.getElementById('dice-tray');
  const resultEl = document.getElementById('dice-result');
  const btn = document.querySelector('[onclick="rollDice()"]');
  if (!tray) return;
  paintDiceTray();

  const values = [];
  for (let i = 0; i < appState.dice.count; i++) values.push(1 + Math.floor(Math.random() * 6));

  if (btn) btn.disabled = true;
  playSound('tick');
  haptic('medium');

  [...tray.children].forEach((slot, i) => {
    slot.classList.remove('die-slot');
    void slot.offsetWidth;                 // restart the hop
    slot.classList.add('die-slot');
    settleDie(slot.querySelector('.die'), values[i], i);
  });

  const still = reducedMotion();
  setTimeout(() => {
    resultEl.innerText = values.reduce((a, b) => a + b, 0);
    playSound('success');
    if (btn) btn.disabled = false;
  }, still ? 0 : 1050);
}

/* --- 🪙 The coin -------------------------------------------------------------
   Tossed rather than spun in place: the wrapper throws it up and catches it
   while the coin itself turns on its edge, and it stops on the side it landed
   on - heads at a whole turn, tails half a turn past it.
   -------------------------------------------------------------------------- */
let coinTurns = 0;

function flipCoin() {
  const coin = document.getElementById('coin');
  const toss = document.getElementById('coin-toss');
  const shadow = document.getElementById('coin-shadow');
  const resultEl = document.getElementById('coin-result');
  const btn = document.querySelector('[onclick="flipCoin()"]');
  if (!coin || !toss) return;

  const isHeads = Math.random() < 0.5;
  const t = TRANSLATIONS[appState.lang] || {};
  const still = reducedMotion();

  if (btn) btn.disabled = true;
  playSound('tick');
  haptic('medium');
  if (resultEl) resultEl.innerText = '···';

  coinTurns += 3 + Math.floor(Math.random() * 3);
  coin.style.transform = `rotateX(${coinTurns * 360 + (isHeads ? 0 : 180)}deg)`;
  toss.classList.remove('is-tossing');
  void toss.offsetWidth;
  if (!still) {
    toss.classList.add('is-tossing');
    if (shadow) {
      shadow.classList.add('is-up');
      setTimeout(() => shadow.classList.remove('is-up'), 900);
    }
  }

  setTimeout(() => {
    if (resultEl) resultEl.innerText = isHeads ? (t.coin_heads || '') : (t.coin_tails || '');
    playSound('success');
    if (btn) btn.disabled = false;
  }, still ? 0 : 1150);
}
/** Dice / coin tab switch, previously inline DOM juggling in the markup. */
function setDiceTab(which, painting) {
    const isDice = (which !== 'coin');
    appState.dice.tab = isDice ? 'dice' : 'coin';
    if (painting !== true) saveToLocal();
    const pane = (id, on) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !on);
    };
    pane('tab-dice', isDice);
    pane('tab-coin', !isDice);
    const bd = document.getElementById('tab-btn-dice');
    const bc = document.getElementById('tab-btn-coin');
    if (bd) bd.classList.toggle('is-active', isDice);
    if (bc) bc.classList.toggle('is-active', !isDice);
}
