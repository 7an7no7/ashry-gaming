}

function roomNameHtml(state, p, inner) {
  const text = inner === undefined ? escapeHTML(p.name) : inner;
  if (!roomCanMenu(state, p)) return text;
  return `<button type="button" class="room-name-btn" onclick="event.stopPropagation(); roomPlayerMenu('${jsStringAttr(p.id)}')">${text}</button>`;
}

let roomMenuFor = '';
function roomPlayerMenu(playerId) {
  const state = Room.state;
  const p = state && (state.players || []).find(x => x.id === playerId);
  if (!p || !roomCanMenu(state, p)) return;
  const t = TRANSLATIONS[appState.lang] || {};
  roomMenuFor = playerId;
  const fill = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  fill('room-menu-name', p.name);
  fill('room-menu-host', '👑 ' + (t.room_make_host || '').replace('{name}', p.name));
  fill('room-menu-away', p.online ? '' : (t.room_menu_away || ''));
  const host = document.getElementById('room-menu-host');
  if (host) host.disabled = !p.online;
  const kick = document.getElementById('room-menu-kick');
  if (kick) kick.classList.toggle('hidden', !!p.online);
  document.getElementById('room-player-menu').classList.remove('hidden');
  haptic('light');
}

function roomMenuMakeHost() {
  const id = roomMenuFor;
  closeModal('room-player-menu');
  if (id) roomAct('makeHost', { playerId: id });
}

function roomMenuKick() {
  const id = roomMenuFor;
  closeModal('room-player-menu');
  if (id) roomKick(id);
}

/** The ✕ beside an offline player, for the host. `cls` picks the look for where it sits. */
function roomKickButton(state, p, cls) {
  if (!state || !state.youAreHost || !p || p.online || p.id === Room.me) return '';
  const t = TRANSLATIONS[appState.lang] || {};
  const label = escapeHTML(t.room_kick || (appState.lang === 'en' ? 'Remove from the room' : 'شيله من الغرفة'));
  return `<button type="button" class="${cls || 'chip__remove'}" onclick="event.stopPropagation(); roomKick('${jsStringAttr(p.id)}')" title="${label}" aria-label="${label}">✕</button>`;
}

/* --- computer players ----------------------------------------------------------
   A game that can seat bots says so on its ROOM_GAMES entry (`bots: { max }`),
   and the host gets two buttons in its lobby: a bot that plays the first thing
   that fits, and one that plays to win. The server does the rest (ROOM_BOT_GAMES
   in RoomGames.js): a bot is a player with `bot` set to its level, always
   present, dealt like anyone, and it moves on the server's clock. Its name is
   offered by the host's phone, in the host's language. */
const ROOM_BOT_NAMES = {
  ar: ['زيزو', 'بندق', 'سمسم', 'فلفل', 'كوكي', 'توتا', 'شوشو', 'لولي', 'ميمي', 'بسبوسة', 'كراميلا'],
  en: ['Robo', 'Chip', 'Pixel', 'Byte', 'Echo', 'Nova', 'Bolt', 'Zippy', 'Sparky', 'Widget', 'Dot']
};

/** The game's bot settings, or null when it has none. */
function roomBotsOf(state) {
  const game = state && state.game && ROOM_GAMES[state.game];
  return game && game.bots ? game.bots : null;
}

/** A name nobody in the room has, from the list in the host's language. */
function roomNextBotName(state) {
  const names = ROOM_BOT_NAMES[appState.lang] || ROOM_BOT_NAMES.ar;
  const taken = (state.players || []).map(p => p.name);
  const free = names.filter(n => !taken.some(x => samePlayer(x, n)));
  return free.length ? free[Math.floor(Math.random() * free.length)] : names[0];
}

function roomAddBot(level) {
  const state = Room.state;
  if (!state || !state.youAreHost || !roomBotsOf(state)) return;
  haptic('light');
  roomAct('addBot', { level: level === 'hard' ? 'hard' : 'easy', name: roomNextBotName(state) });
}

const roomBotLevelLabel = (level, t) => (level === 'hard' ? (t.bot_hard || '') : (t.bot_easy || ''));

/** The host's two buttons; a TV draws them its own way. Nothing for anyone else. */
function roomBotControlsHtml(state, tv) {
  const bots = roomBotsOf(state);
  if (!bots || !state.youAreHost) return '';
  const t = TRANSLATIONS[appState.lang] || {};
  const count = (state.players || []).filter(p => p.bot).length;
  const full = (state.players || []).length >= (bots.max || 12);
  const add = (level) => '+ 🤖 ' + roomBotLevelLabel(level, t);
  // A game with no skill in it (السلم والتعبان) has one kind of computer player: one button, no level.
  if (bots.one) {
    const one = '+ 🤖 ' + (t.bot_add_one || '');
    if (tv) return full ? '' : `<div class="tv-actions tv-actions--bots">${tvBtn(one, "roomAddBot('easy')", 'secondary')}</div>`;
    return `
    <div class="card card--tight room-bots">
      <div class="room-bots__head">
        <span class="field__label">🤖 ${escapeHTML(t.bot_title || '')}${count ? ` <span class="badge">${count}</span>` : ''}</span>
        <div class="room-bots__add">
          <button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="roomAddBot('easy')" ${full ? 'disabled' : ''}>${escapeHTML(one)}</button>
        </div>
      </div>
      <p class="field__hint">${escapeHTML(full ? (t.bot_full || '') : (t.bot_hint || ''))}</p>
    </div>`;
  }
  if (tv) {
    return full ? '' : `<div class="tv-actions tv-actions--bots">${tvBtn(add('easy'), "roomAddBot('easy')", 'secondary')}${tvBtn(add('hard'), "roomAddBot('hard')", 'secondary')}</div>`;
  }
  return `
    <div class="card card--tight room-bots">
      <div class="room-bots__head">
        <span class="field__label">🤖 ${escapeHTML(t.bot_title || '')}${count ? ` <span class="badge">${count}</span>` : ''}</span>
        <div class="room-bots__add">
          <button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="roomAddBot('easy')" ${full ? 'disabled' : ''}>${escapeHTML(add('easy'))}</button>
          <button type="button" class="btn btn--secondary btn--sm btn--auto" onclick="roomAddBot('hard')" ${full ? 'disabled' : ''}>${escapeHTML(add('hard'))}</button>
        </div>
      </div>
      <p class="field__hint">${escapeHTML(full ? (t.bot_full || '') : (t.bot_hint || ''))}</p>
    </div>`;
}

/**
 * A lobby row's avatar: the name's first letter on the screen's accent (or an
 * emoji for a computer player or a screen), with the presence dot on its corner.
 */
function lobbyAvatarHtml(name, online, emoji) {
  const letter = emoji || escapeHTML(Array.from(String(name || '?').trim())[0] || '?');
  return `<span class="lobby-avatar${emoji ? ' lobby-avatar--emoji' : ''}" aria-hidden="true">${letter}<span class="presence-dot ${online ? 'is-online' : ''}"></span></span>`;
}

/** A computer player's row in the lobby: always here; the host can change its level or take it out. */
function roomBotRowHtml(state, p, isNew) {
  const t = TRANSLATIONS[appState.lang] || {};
  const level = roomBotLevelLabel(p.bot, t);
  const oneLevel = !!(roomBotsOf(state) || {}).one;
  const levelEl = oneLevel ? '' : state.youAreHost
    ? `<button type="button" class="btn btn--ghost btn--xs btn--auto" onclick="roomAct('setBotLevel', { playerId: '${jsStringAttr(p.id)}' })" title="${escapeHTML(t.bot_level_change || '')}" aria-label="${escapeHTML((t.bot_level_change || '') + ': ' + level)}">${escapeHTML(level)}</button>`
    : `<span class="badge">${escapeHTML(level)}</span>`;
  const remove = state.youAreHost
    ? `<button type="button" class="btn btn--ghost btn--xs btn--auto" onclick="roomAct('removeBot', { playerId: '${jsStringAttr(p.id)}' })" title="${escapeHTML(t.bot_remove || '')}" aria-label="${escapeHTML(t.bot_remove || '')}">✕</button>`
    : '';
  return `
      <div class="status-row status-row--bot lobby-row ${isNew ? 'status-row--new' : ''}">
        ${lobbyAvatarHtml('', true, '🤖')}
        <div class="status-row__body">
          <div class="status-row__name">${escapeHTML(p.name)}</div>
        </div>
        <div class="status-row__actions">${levelEl}${remove}</div>
      </div>`;
}

/** Remembering the name means a returning player types it once, ever. */
const roomName = {
  get() { try { return localStorage.getItem('ashryName') || ''; } catch (e) { return ''; } },
  set(v) { try { localStorage.setItem('ashryName', v); } catch (e) {} }
};

let pendingRoomGame = null;   // game id chosen before the room exists

/**
 * The games a room can play. The room itself is just the group — the host picks
 * from these, they play, and it comes back here for the next one.
 */
const ROOM_HUB_GAMES = ROOM_GAME_LIST.map(r => ({ id: r.id, icon: r.game.icon, key: r.game.title, accent: r.game.accent, min: r.min }));

/** Create an empty room from the menu — no game chosen yet. */
async function roomCreateEmpty() { return roomCreateFor(null); }

/**
 * The lobby while the room is being made or joined: the shape of what is
 * coming (a code, a QR, a player row) shimmering where it will land, instead
 * of a second on the old screen with a spinner in the corner.
 */
function lobbySkeleton(on) {
  const view = document.getElementById('view-room-lobby');
  if (!view) return;
  const code = document.getElementById('room-code-display');
  const qr = document.getElementById('room-qr');
  const list = document.getElementById('room-player-list');
  const setup = document.getElementById('room-host-setup');
  view.classList.toggle('is-loading', !!on);
  if (on) {
    if (code) { code.textContent = ''; code.classList.add('skel', 'skel--code'); }
    if (qr) { qr.innerHTML = ''; qr.classList.remove('hidden'); qr.classList.add('skel', 'skel--qr'); }
    if (list) list.innerHTML = '<div class="skel skel--row"></div>';
    if (setup) setup.innerHTML = '<div class="skel skel--hub"></div>';
  } else {
    if (code) code.classList.remove('skel', 'skel--code');
    if (qr) { qr.classList.remove('skel', 'skel--qr'); if (!qr.innerHTML) qr.classList.add('hidden'); }
    if (list && list.querySelector('.skel')) list.innerHTML = '';
    if (setup && setup.querySelector('.skel')) setup.innerHTML = '';
  }
}

/* «الليلة دي؟» answered "on the TV" on a laptop or TV: the next room is opened
   by this device as its big screen, with the game chosen (ideas batch: shell). */
let roomCreateScreenOnce = false;

/** Entry point from a game's setup screen: "play on separate phones". */
async function roomCreateFor(gameId) {
  if (roomCreateScreenOnce) {
    roomCreateScreenOnce = false;
    try {
      setSyncing(true);
      await Room.create('', gameId, true);
      setSyncing(false);
      setView('room-tv');
      if (Room.state) routeRoomState(Room.state);
    } catch (err) {
      setSyncing(false);
      showToast(err.message || roomErrText('create'), 'error');
    }
    return;
  }
  // The name this phone used last time goes straight in (the owner, 26 Sep
  // 2026: it used to be asked every time, one more tap for every room); the
  // lobby shows «أنت: منى ✏️» to change it. A phone with no name is asked.
  const name = await roomNameOrAsk();
  if (!name) return;
  roomName.set(name);
  pendingRoomGame = gameId;
  const from = appState.currentView;
  setView('room-lobby');
  lobbySkeleton(true);
  try {
    setSyncing(true);
    await Room.create(name, gameId);
    setSyncing(false);
    lobbySkeleton(false);
    // «الشلة»: a phone in a crew is asked «للشلة؟» every time (the lobby changes it).
    if (typeof crewAutoForRoom === 'function') crewAutoForRoom();
    // The room arrived while the skeleton was showing, so nothing has drawn it yet.
    if (Room.state) routeRoomState(Room.state);
  } catch (err) {
    setSyncing(false);
    lobbySkeleton(false);
    setView(from);
    showToast(err.message || roomErrText('create'), 'error');
  }
}

/** The name this phone plays under, or the name sheet when it has none yet. */
async function roomNameOrAsk() {
  const saved = String(roomName.get() || '').trim();
  if (saved) return saved;
  return promptForName();
}

/**
 * Opens the join screen, pre-filled if we arrived from a scanned link. With a
 * name saved on this phone the name field folds into «أنت: منى ✏️», and a link
 * that carries its code goes straight into the room (the owner, 26 Sep 2026).
 */
function roomOpenJoin(prefillCode) {
  const codeEl = document.getElementById('room-join-code');
  const nameEl = document.getElementById('room-join-name');
  const saved = String(roomName.get() || '').trim();
  if (codeEl) codeEl.value = extractRoomCode(prefillCode);
  if (nameEl) nameEl.value = saved;
  roomJoinPaintName(!saved);
  setView('room-join');
  if (saved && codeEl && codeEl.value.length === 4) {
    roomJoinFromForm();
    return;
  }
  // Send focus to whichever field is still empty.
  setTimeout(() => {
    const target = (codeEl && !codeEl.value) || saved ? codeEl : nameEl;
    if (target) target.focus();
  }, 300);
}

/** The join screen's name: the field, or «أنت: منى ✏️» when the phone knows it. */
function roomJoinPaintName(showField) {
  const wrap = document.getElementById('room-join-name-wrap');
  const me = document.getElementById('room-join-me');
  const nameEl = document.getElementById('room-join-name');
  if (wrap) wrap.classList.toggle('hidden', !showField);
  if (me) {
    me.classList.toggle('hidden', !!showField);
    const t = TRANSLATIONS[appState.lang] || {};
    me.innerHTML = roomMeHtml(t, (nameEl && nameEl.value) || roomName.get());
  }
}

/* The join screen reached some other way (a reload onto it, a tab): a saved name
   is folded into «أنت: منى ✏️» there too, as roomOpenJoin does. */
if (typeof onLeaveScreen === 'function') onLeaveScreen((from, to) => {
  if (to !== 'room-join') return;
  const nameEl = document.getElementById('room-join-name');
  const saved = String(roomName.get() || '').trim();
  if (nameEl && !nameEl.value && saved) { nameEl.value = saved; roomJoinPaintName(false); }
});

/** Enter in the code field: on to the name, or straight in when the name is folded away. */
function roomJoinCodeEnter() {
  const wrap = document.getElementById('room-join-name-wrap');
  const nameEl = document.getElementById('room-join-name');
  if (wrap && wrap.classList.contains('hidden') && nameEl && nameEl.value) roomJoinFromForm();
  else if (nameEl) nameEl.focus();
}

function roomJoinEditName() {
  roomJoinPaintName(true);
  const nameEl = document.getElementById('room-join-name');
  if (nameEl) { nameEl.focus(); nameEl.select(); }
}

/** «أنت: منى ✏️», the name a phone plays under, a tap from being changed. */
function roomMeHtml(t, name) {
  return `<span class="lobby-me__label">${escapeHTML(t.room_you_are || '')}</span>` +
    ` <bdi class="lobby-me__name">${escapeHTML(name || '')}</bdi> <span class="lobby-me__edit" aria-hidden="true">✏️</span>`;
}

/** The lobby's «أنت: منى ✏️»: the name sheet, and the room hears the new name. */
async function roomRenameMe() {
  const name = await promptForName();
  if (!name) return;
  const state = Room.state;
  const me = state && (state.players || []).find(p => p.id === Room.me);
  if (!me) { roomName.set(name); return; }
  if (me.name === name) { roomName.set(name); return; }
  try {
    await Room.act('rename', { name: name });
    roomName.set(name);
    haptic('light');
  } catch (err) {
    showToast(err.message || '', 'error');
  }
}

/**
 * The room code in whatever was typed or pasted: a code, or a whole join link
 * someone sent ("…/?room=ABCD" or "…/r/ABCD"), in any case and with stray spaces.
 */
function extractRoomCode(text) {
  const raw = String(text || '');
  const fromLink = /[?&]room=([A-Za-z0-9]{4,8})/.exec(raw) || /\/r\/([A-Za-z0-9]{4,8})/.exec(raw);
  return (fromLink ? fromLink[1] : raw.replace(/[^A-Za-z0-9]/g, '')).toUpperCase().slice(0, 4);
}

/** Keeps the code field down to a clean code while typing or pasting. */
function tidyRoomCodeInput(el) {
  const code = extractRoomCode(el.value);
  if (el.value !== code) el.value = code;
  // Code complete and no name yet: carry on to the name.
  const nameEl = document.getElementById('room-join-name');
  if (code.length === 4 && nameEl && !nameEl.value && document.activeElement === el) nameEl.focus();
}

/**
 * A room's join link. On the published site it is <app>/r/CODE: site-worker/ answers it
 * with a small page carrying the room's preview (its title and picture for WhatsApp and
 * the rest), which sends a browser straight on to <app>?room=CODE. `game` (the room
 * game chosen) names the game in the preview, and an English phone asks for an English
 * one; a QR leaves both out (shorter, easier to scan). The preview and a copy with no
 * worker keep the plain ?room= link.
 */
function roomInviteUrl(code, opts) {
  const data = window.SERVER_DATA || {};
  const base = data.webAppUrl;
  if (!base || !code) return '';
  if (!data.roomLinks) return base + '?room=' + code;
  const o = opts || {};
  const q = [];
  if (o.game && /^[a-z0-9]{1,24}$/.test(o.game)) q.push('g=' + o.game);
  if (o.lang === 'en') q.push('l=en');
  return base.replace(/\/?$/, '/') + 'r/' + code + (q.length ? '?' + q.join('&') : '');
}

/**
 * Sends the join link through the phone's share sheet (WhatsApp and the rest),
 * or copies it where there is none - for friends who can't scan the QR code
 * because they aren't in the same place.
 */
async function roomShareLink() {
  const state = Room.state;
  const base = window.SERVER_DATA && window.SERVER_DATA.webAppUrl;
  if (!state || !base) return;
  const t = TRANSLATIONS[appState.lang] || {};
  const url = roomInviteUrl(state.code, { game: state.game, lang: appState.lang });
  const text = (t.room_share_text || '') + ' ' + state.code;
  return shareOrCopy(url, text, t.room_link_copied || '');
}

/**
 * The phone's share sheet where there is one, the clipboard where there isn't,
 * and the link in a toast where neither works. Used for a room's join link and
 * for the app's own link (Settings and the مع بعض tab).
 */
async function shareOrCopy(url, text, copiedMsg) {
  const t = TRANSLATIONS[appState.lang] || {};
  if (navigator.share) {
    try {
      await navigator.share({ title: t.title || 'عشرى جيمينج', text: text, url: url });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // closed the share sheet
    }
  }
  const message = text + '\n' + url;
  let copied = false;
  try {
    await navigator.clipboard.writeText(message);
    copied = true;
  } catch (err) {
    // No clipboard API here (an older browser, or an embedded one): the old way.
    const area = document.createElement('textarea');
    area.value = message;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(area);
    area.select();
    try { copied = document.execCommand('copy'); } catch (e) {}
    area.remove();
  }
  if (copied) showToast(copiedMsg || t.link_copied || '', 'success');
  else showToast(url, 'info');
}

/** Settings and the مع بعض tab: the app's own link, for friends who aren't here. */
function shareAppLink() {
  const base = (window.SERVER_DATA && window.SERVER_DATA.webAppUrl) || location.origin + location.pathname;
  const t = TRANSLATIONS[appState.lang] || {};
  return shareOrCopy(base, t.share_app_text || '', t.link_copied || '');
}

/**
 * A join mistake is said under the field it is about (the code, or the name), and the
 * field is focused, rather than in a toast that goes: the player sees what to fix.
 * Typing in the field takes the line away.
 */
function roomJoinFieldError(id, msg) {
  const el = document.getElementById(id);
  if (!el) return showToast(msg, 'error');
  const field = el.closest('.field') || el.parentElement;
  let line = field.querySelector('.field__error');
  if (!line) {
    line = document.createElement('p');
    line.className = 'field__error';
    line.id = id + '-err';
    line.setAttribute('role', 'alert');
    field.appendChild(line);
  }
  line.textContent = msg;
  el.setAttribute('aria-invalid', 'true');
  el.setAttribute('aria-describedby', line.id);
  el.addEventListener('input', () => roomJoinClearErrors(), { once: true });
  playSound('alarm');
  try { el.focus(); } catch (e) {}
}
function roomJoinClearErrors() {
  ['room-join-code', 'room-join-name'].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.removeAttribute('aria-invalid');
    el.removeAttribute('aria-describedby');
    const line = (el.closest('.field') || el.parentElement).querySelector('.field__error');
    if (line) line.remove();
  });
}

async function roomJoinFromForm() {
  const code = extractRoomCode(document.getElementById('room-join-code').value);
  const name = (document.getElementById('room-join-name').value || '').trim();
  roomJoinClearErrors();
  if (code.length < 4) return roomJoinFieldError('room-join-code', roomErrText('code'));
  if (!name) { roomJoinEditName(); return roomJoinFieldError('room-join-name', roomErrText('name')); }

  roomName.set(name);
  setView('room-lobby');
  lobbySkeleton(true);
  try {
    setSyncing(true);
    await Room.join(code, name);
    setSyncing(false);
    lobbySkeleton(false);
    playSound('success');
    if (Room.state) routeRoomState(Room.state);
  } catch (err) {
    setSyncing(false);
    lobbySkeleton(false);
    setView('room-join');
    const msg = String(err.message || '');
    // Someone in the room has this phone's name: the field comes back to change it.
    if (String(err.raw || msg).indexOf('الاسم') !== -1) { roomJoinEditName(); roomJoinFieldError('room-join-name', msg); }
    else if (msg.indexOf('ROOM_NOT_FOUND') !== -1) roomJoinFieldError('room-join-code', roomErrText('notfound'));
    else showToast(msg, 'error');
  }
}

async function roomLeave() {
  const msg = appState.lang === 'ar' ? 'هتخرج من الغرفة؟' : 'Leave this room?';
  showConfirmModal(msg, async () => {
    await Room.leave();
    setView('menu');
  });
}

async function roomStartGame() {
  const game = ROOM_GAMES[Room.state && Room.state.game];
  if (!game) return showToast(roomErrText('game'), 'error');
  // Its options have been set once on this phone: folded from the next lobby on.
  rememberOptions('lobbyOptsSeen', { [Room.state.game]: 1 });
  try {
    await Room.act('start', game.startPayload ? game.startPayload() : {});
  } catch (err) {
    // Too few people in: the line under Start already says how many more, so point at
    // it (a blocked Start's way) rather than a toast. The server still decides: trivia,
    // the emoji riddles and the proverbs start with one.
    const needEl = document.getElementById('room-start-need');
    if (needEl && Number(needEl.dataset.short || 0) > 0 && typeof blockStartAt === 'function') blockStartAt(needEl);
    else showToast(err.message || roomErrText('start'), 'error');
  }
}

/* --- rendering ----------------------------------------------------------- */

// Who was already in the lobby, so only someone who joins after that pops in.
const lobbySeen = { code: '', ids: null };

function renderRoomLobby(state, opts) {
  lobbySkeleton(false);
  const codeEl = document.getElementById('room-code-display');
  // A new code drops in letter by letter; the same code is left alone.
  if (codeEl && (codeEl.dataset.code !== state.code || codeEl.textContent !== state.code)) {
    codeEl.dataset.code = state.code;
    const chars = String(state.code).split('');
    // --n: how many letters, so each letter's slice of the code's gradient (section 40) lines up.
    codeEl.innerHTML = chars.map((ch, i) => '<span style="--i:' + i + ';--n:' + chars.length + '">' + escapeHTML(ch) + '</span>').join('');
  }
  if (lobbySeen.code !== state.code) { lobbySeen.code = state.code; lobbySeen.ids = null; }
  const joined = lobbySeen.ids ? state.players.filter(p => !lobbySeen.ids.has(p.id)).map(p => p.id) : [];
  lobbySeen.ids = new Set(state.players.map(p => p.id));

  const url = roomInviteUrl(state.code);
  // Encoded once per code, not on every presence tick. The skeleton empties it
  // while a room loads, hence the innerHTML check.
  const qrEl = document.getElementById('room-qr');
  if (!qrEl || qrEl.dataset.url !== url || !qrEl.innerHTML) {
    renderJoinQR('room-qr', url);
    if (qrEl) qrEl.dataset.url = url;
  }

  const list = document.getElementById('room-player-list');
  const count = document.getElementById('room-player-count');
  if (count) count.innerText = state.players.length;
  // Whoever stays slides, whoever left fades where they stood (JS_Motion.html section 13).
  const paintLobbyRows = () => {
  if (list) {
    const hostLabel = appState.lang === 'ar' ? 'المضيف' : 'Host';
    const youLabel = appState.lang === 'ar' ? 'أنت' : 'You';
    list.innerHTML = state.players.map(p => p.bot ? roomBotRowHtml(state, p, joined.indexOf(p.id) !== -1) : `
      <div class="status-row lobby-row ${p.online ? '' : 'status-row--out'} ${joined.indexOf(p.id) !== -1 ? 'status-row--new' : ''} ${p.id === state.hostId ? 'is-host' : ''}">
        ${lobbyAvatarHtml(p.name, p.online)}
        <div class="status-row__body">
          <div class="status-row__name">${roomNameHtml(state, p)}</div>
        </div>
        <div class="status-row__actions">
          ${p.id === Room.me ? `<span class="badge badge--accent">${youLabel}</span>` : ''}
          ${p.id === state.hostId ? `<span class="badge lobby-row__host"><span aria-hidden="true">👑</span> ${hostLabel}</span>` : ''}
          ${p.online ? '' : `<span class="badge">${escapeHTML((TRANSLATIONS[appState.lang] || {}).room_away || '')}</span>`}
          ${roomKickButton(state, p, 'btn btn--ghost btn--xs btn--auto')}
        </div>
      </div>`).join('');
  }

  // Big screens in the room, listed under the players: they hold no seat.
  if (list && (state.screens || []).length) {
    const tt = TRANSLATIONS[appState.lang] || {};
    list.insertAdjacentHTML('beforeend', state.screens.map(sc => `
      <div class="status-row lobby-row lobby-row--screen ${sc.online ? '' : 'status-row--out'} ${sc.id === state.hostId ? 'is-host' : ''}">
        ${lobbyAvatarHtml('', sc.online, '📺')}
        <div class="status-row__body">
          <div class="status-row__name">${tt.tv_screen_badge || ''}</div>
        </div>
        <div class="status-row__actions">
          ${sc.id === state.hostId ? `<span class="badge lobby-row__host"><span aria-hidden="true">👑</span> ${appState.lang === 'ar' ? 'المضيف' : 'Host'}</span>` : ''}
        </div>
      </div>`).join(''));
  }
  };
  if (list && typeof motionRowsSwap === 'function') motionRowsSwap(list, paintLobbyRows); else paintLobbyRows();

  const startBtn = document.getElementById('room-start-btn');
  const waitNote = document.getElementById('room-wait-note');
  const setup = document.getElementById('room-host-setup');
  const game = ROOM_GAMES[state.game];

  // No game picked yet: the lobby shows the hub instead of a start button.
  const inHub = !state.game;
  if (startBtn) startBtn.classList.toggle('hidden', inHub || !state.youAreHost);
  // One line for a player waiting: «المضيف يختار اللعبة…» (the hub's) until a
  // game is chosen, then «مستنيين المضيف يبدأ اللعبة…» - never both.
  if (waitNote) waitNote.classList.toggle('hidden', !!state.youAreHost || inHub);
  // The QR folds behind «ادعي حد كمان ▾» once two or more people are in, so the
  // game chosen comes first; folded once per room, a tap opens it again.
  const invite = document.getElementById('room-invite');
  if (invite) {
    const many = state.players.filter(p => !p.bot).length >= 2;
    invite.classList.toggle('is-solo', !many);
    if (!many) { invite.open = true; delete invite.dataset.folded; }
    else if (invite.dataset.folded !== state.code) { invite.open = false; invite.dataset.folded = state.code; }
  }
  // Under the host's Start: how many more the chosen game needs, if any.
  const needEl = document.getElementById('room-start-need');
  if (needEl) {
    const wasShort = Number(needEl.dataset.short || 0);
    const hub = !inHub && ROOM_HUB_GAMES.find(g => g.id === state.game);
    // The hub's minimum counts people (computer players make up a table later).
    const people = state.players.filter(p => !p.bot).length;
    const short = hub && state.youAreHost ? Math.max(0, (hub.min || 0) - people) : 0;
    const tt = TRANSLATIONS[appState.lang] || {};
    // A game that can't start yet for another reason says why there (startBlock: عربيات التصادم
    // with no big screen online), and its Start is greyed until then; the server refuses it too.
    const block = !short && game && state.youAreHost && typeof game.startBlock === 'function' ? (game.startBlock(state) || '') : '';
    if (startBtn) startBtn.disabled = !!block;
    needEl.classList.toggle('hidden', !short && !block);
    if (short) needEl.textContent = (tt.room_need_more || '').replace('{n}', String(short));
    else if (block) needEl.textContent = block;
    // Enough are in now: the Start that can go breathes once (JS_Motion.html section 13).
    needEl.dataset.short = String(short);
    if (wasShort > 0 && !short && startBtn && typeof motionNudge === 'function') motionNudge(startBtn);
  }
  // «الشلة»: which crew tonight counts for (JS_CrewCore.html).
  const crewEl = document.getElementById('room-crew');
  if (crewEl && typeof crewLobbyHtml === 'function') {
    const html = crewLobbyHtml(state);
    if (crewEl.dataset.sig !== html) { crewEl.innerHTML = html; crewEl.dataset.sig = html; }
  }
  // 🕵️ المهمة السرية: the host's switch, or the evening's file (JS_RoomMission.html).
  const msnEl = document.getElementById('room-mission');
  if (msnEl) {
    const html = roomMissionSlotHtml(state);
    if (msnEl.dataset.sig !== html) { msnEl.innerHTML = html; msnEl.dataset.sig = html; }
  }
  // «أنت: منى ✏️» on a phone that plays (a screen has no name).
  const meBtn = document.getElementById('room-me');
  const mine = state.players.find(p => p.id === Room.me);
  if (meBtn) {
    meBtn.classList.toggle('hidden', !mine);
    if (mine) {
      const html = roomMeHtml(TRANSLATIONS[appState.lang] || {}, mine.name);
      if (meBtn.dataset.sig !== html) { meBtn.innerHTML = html; meBtn.dataset.sig = html; }
    }
  }

  // A mid-round joiner's panel is the spectator note (renderRoomSpectator): the hub written here
  // first and the note straight after was two rewrites on every state, the hub flashing between.
  if (setup && !(opts && opts.spectator)) {
    const html = inHub
      ? renderRoomHub(state)
      : renderChosenGame(state, game);
    // Only rewrite when it changed, so an open <select> isn't reset by every update.
    // And never under the host's fingers: someone picking a team rewrites the
    // options, which took the Codenames word box (focus, keyboard) with it.
    if (setup.dataset.sig !== html) {
      if (roomFieldInUse(setup)) {
        setup.dataset.stale = '1';
        watchRoomFieldDone(setup, () => { if (Room.state && appState.currentView === 'room-lobby') routeRoomState(Room.state); });
      } else {
        setup.innerHTML = html;
        setup.dataset.sig = html;
        delete setup.dataset.stale;
        lobbyOptsSummarise(setup);
      }
    }
    // An option changed in place (a switch, a list) says so in the folded line too.
    if (!setup.dataset.sumWatched) {
      setup.dataset.sumWatched = '1';
      const later = () => setTimeout(() => lobbyOptsSummarise(setup), 0);
      setup.addEventListener('change', later);
      setup.addEventListener('click', later);
    }
  }
}

/** A text box, a word list or an open picker inside `root` has the focus. */
function roomFieldInUse(root) {
  const el = document.activeElement;
  if (!root || !el || !root.contains(el)) return false;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
  return el.tagName === 'INPUT' && !/^(checkbox|radio|range|button|submit|color)$/i.test(el.type || '');
}

/**
 * Redraws once the field held back above is let go. A short wait, so a tap
 * on a button next to it (which takes the focus first) lands on the button
 * before it is redrawn.
 */
function watchRoomFieldDone(root, redraw) {
  if (root.dataset.watchDone) return;
  root.dataset.watchDone = '1';
  root.addEventListener('focusout', () => {
    setTimeout(() => {
      if (!root.dataset.stale || roomFieldInUse(root)) return;
      delete root.dataset.stale;
      delete root.dataset.sig;
      redraw();
    }, 350);
  });
}

let roomHubLocation = recallOptions('roomHubLocation', 'together');

/* Chess is one tile in the room's list (the owner, 24 Sep 2026): a tap opens its
   room ways, the first of which is the tile itself (1 vs 1). */
const ROOM_HUB_GROUPS = {
  chess: ['chess', 'votechess', 'handbrain', 'bughouse', 'chess4'],
  // سباق ألغاز (the owner, 26 Sep 2026): one tile «سباق ألغاز» opens the ten puzzles, so the list keeps its size.
  race: ["strands","wordwheel","connections","pinpoint","queens","tango","nonogram","mines","streak","sudoku"]
};
/* A family whose tile is not its first game: its own name, icon and colour (chess's tile is chess itself). */
const ROOM_HUB_FAMILIES = { race: { id: 'race', icon: 'art:race', key: 'race_title', accent: 'violet', group: 'brain' } };
let roomHubGroup = '';
const roomHubGroupOf = (id) => Object.keys(ROOM_HUB_GROUPS).find(k => ROOM_HUB_GROUPS[k].indexOf(id) !== -1) || '';

/**
 * The tiles the list shows, each { g, min, open }: with a group open, its games;
 * otherwise every game, a group as its first game with open set (a tap opens the
 * group) and the fewest players any of its games needs.
 */
function roomHubTiles() {
  const byId = (id) => ROOM_HUB_GAMES.find(g => g.id === id);
  if (roomHubGroup && ROOM_HUB_GROUPS[roomHubGroup]) {
    return ROOM_HUB_GROUPS[roomHubGroup].map(byId).filter(Boolean).map(g => ({ g: g, min: g.min, open: '' }));
  }
  return ROOM_HUB_GAMES.filter(g => {
    const k = roomHubGroupOf(g.id);
    return !k || ROOM_HUB_GROUPS[k][0] === g.id;
  }).map(g => {
    const k = roomHubGroupOf(g.id);
    if (!k) return { g: g, min: g.min, open: '' };
    const min = Math.min.apply(null, ROOM_HUB_GROUPS[k].map(id => (byId(id) || { min: 99 }).min));
    return { g: ROOM_HUB_FAMILIES[k] || g, min: min, open: k };
  });
}

/** A tile's name: inside the chess group its first game is '1 vs 1'. */
function roomHubTileName(tile, t) {
  if (!tile.open && roomHubGroup === 'chess' && tile.g.id === 'chess') return t.room_chess_duel || '1 vs 1';
  return t[tile.g.key] || tile.g.id;
}

/** Opens a group of the list (or '' back to every game), on the phone or the TV. */
function roomHubOpen(group) {
  roomHubGroup = group || '';
  haptic('light');
  if (!Room.state) return;
  if (Room.state.youAreScreen && typeof renderRoomTv === 'function') renderRoomTv(Room.state);
  else if (appState.currentView === 'room-lobby') renderRoomLobby(Room.state);
}

/** The head of the list with a group open: the way back to every game. */
function roomHubBackHtml(t, tv) {
  if (!roomHubGroup) return '';
  return `<button type="button" class="btn btn--ghost ${tv ? '' : 'btn--sm'} btn--auto room-hub-back" onclick="roomHubOpen('')">
      <span aria-hidden="true">↩</span> ${escapeHTML(t.room_hub_all || '')}</button>`;
}
if (['together', 'apart'].indexOf(roomHubLocation) === -1) roomHubLocation = 'together';

function setRoomHubLocation(loc) {
  roomHubLocation = loc;
  rememberOptions('roomHubLocation', loc);
  if (Room.state && appState.currentView === 'room-lobby') {
    renderRoomLobby(Room.state);
  }
}

/**
 * The leaderboard of the night: 3/2/1 banked by the server at the end of every
 * game that kept a score (bankNightPoints in RoomGames.js). Everyone sees it,
 * host or not, and it is nothing at all until a game has been played.
 */
function roomNightBoardHtml(state, t) {
  const night = state.night || {};
  if (!Object.keys(night).length) return '';
  const board = state.players
    .map(p => ({ id: p.id, name: p.name, score: night[p.id] || 0 }))
    .sort((a, b) => b.score - a.score);
  if (!board.some(r => r.score > 0)) return '';
  return `
    <div class="section">
      <div class="section__head">
        <h2 class="section__title">🌙 ${escapeHTML(t.room_night_title || 'ليلتنا')}</h2>
        <span class="section__rule"></span>
      </div>
      ${renderScoreboard(board)}
      <p class="field__hint" style="text-align:center">${escapeHTML(t.room_night_hint || '')}</p>
      ${!state.youAreScreen && typeof shareCardBtnHtml === 'function'
        ? `<div class="btn-row" style="justify-content:center">${shareCardBtnHtml('shareRoomNight()', t.night_share || t.share_card || '')}</div>` : ''}
      ${typeof crewGuestOfferHtml === 'function' ? crewGuestOfferHtml(state, t) : ''}
    </div>`;
}

/* «ليالينا» (the improvement plan, Phase 6 - Plato's groups, with no accounts):
   every phone in a room keeps that evening's leaderboard of the night, one
   entry per room and day, updated as the night goes on. أرقامي adds them up by
   name (JS_Daily.html). Kept on the phone only, the last NIGHTS_KEEP nights. */
const NIGHTS_KEY = 'ashryNights_v1';
const NIGHTS_KEEP = 60;

function readNights() {
  try { return JSON.parse(localStorage.getItem(NIGHTS_KEY) || '[]') || []; } catch (e) { return []; }
}

function rememberNight(state) {
  if (!state || state.youAreScreen || !state.night) return;
  const board = state.players
    .filter(p => !p.bot)
    .map(p => ({ name: p.name, score: Number(state.night[p.id]) || 0 }))
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score);
  if (!board.length) return;
  const d = new Date();
  const day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const list = readNights();
  const same = list.findIndex(n => n.code === state.code && n.day === day);
  const sig = JSON.stringify(board);
  if (same !== -1 && JSON.stringify(list[same].board) === sig) return;
  const entry = { code: state.code, day: day, board: board };
  if (same !== -1) list[same] = entry; else list.push(entry);
  try { localStorage.setItem(NIGHTS_KEY, JSON.stringify(list.slice(-NIGHTS_KEEP))); } catch (e) {}
}
if (typeof Room !== 'undefined') Room.onChange(rememberNight);

/* A group opened in one room's list (chess's ways, the puzzle race) is that room's:
   leaving, opening or joining another starts the list from every game. Registered
   before the router below, so the lobby is drawn with it already cleared. */
let roomHubCode = '';
if (typeof Room !== 'undefined') Room.onChange((state) => {
  const code = (state && state.code) || '';
  if (code !== roomHubCode) { roomHubCode = code; roomHubGroup = ''; roomHubSearch = ''; }
});

/* Finding a game by name (the owner, 30 Sep 2026: "a search bar to reach games
   faster instead of scrolling a lot"), in the room's list and in برنامج السهرة's
   picker. Every room game answers to its name in either language and its line,
   a family's games too (chess's ways, the ten puzzles) and to the family's name,
   as the home's search does; a match on the name comes before one on the line. */
let roomHubSearch = '';
function roomGameHits(term) {
  const q = helpNormalise(term).trim();
  if (!q) return [];
  const langs = [TRANSLATIONS.ar, TRANSLATIONS.en];
  const hits = [];
  ROOM_HUB_GAMES.forEach(g => {
    const cat = typeof CATALOG_BY_ID !== 'undefined' ? CATALOG_BY_ID[g.id === 'chess' ? 'shatranj' : g.id] : null;
    // The family's name: its own (the race), or its first game's (chess finds all its ways).
    const k = roomHubGroupOf(g.id);
    const fam = k ? (ROOM_HUB_FAMILIES[k] || ROOM_HUB_GAMES.find(x => x.id === ROOM_HUB_GROUPS[k][0])) : null;
    const names = [], lines = [];
    langs.forEach(t => {
      names.push(t[g.key] || '');
      if (cat) { names.push(t[cat.title] || ''); lines.push(t[cat.desc] || ''); }
      if (fam) names.push(t[fam.key] || '');
    });
    if (helpNormalise(names.join(' ')).indexOf(q) !== -1) hits.push({ g, rank: 0 });
    else if (helpNormalise(lines.join(' ')).indexOf(q) !== -1) hits.push({ g, rank: 1 });
  });
  return hits.sort((a, b) => a.rank - b.rank).map(x => x.g);
}
function roomGameSearchHtml(id, value, handler, t) {
  return `
    <label class="home-search room-search">
      <span class="home-search__icon" aria-hidden="true">🔍</span>
      <input type="search" id="${id}" autocomplete="off" enterkeyhint="search" aria-label="${escapeHTML(t.home_search_ph || '')}"
             placeholder="${escapeHTML(t.home_search_ph || '')}" value="${escapeHTML(value || '')}" oninput="${handler}(this.value)">
    </label>`;
}
/** Tiles under the home's section heads (tvHubGroupOf), in the catalog's order. */
function roomGameSectionsHtml(tiles, grid, t) {
  if (typeof CATALOG_GROUPS === 'undefined' || typeof tvHubGroupOf !== 'function') return grid(tiles);
  const groups = CATALOG_GROUPS.map(gr => ({ gr: gr, tiles: [] }));
  const other = { gr: null, tiles: [] };
  tiles.forEach(x => { (groups.find(y => y.gr.id === tvHubGroupOf(x.g.id)) || other).tiles.push(x); });
  return groups.concat([other]).filter(y => y.tiles.length).map(y => `
    <div class="room-hub-sec">
      ${y.gr ? `<h3 class="room-hub-sec__head"><span aria-hidden="true">${y.gr.icon}</span> ${escapeHTML(t[y.gr.title] || y.gr.id)}</h3>` : ''}
      ${grid(y.tiles)}
    </div>`).join('');
}
function setRoomHubSearch(value) {
  roomHubSearch = String(value || '');
  const el = document.getElementById('room-hub-list');
  if (el && Room.state) el.innerHTML = roomHubListHtml(Room.state, TRANSLATIONS[appState.lang]);
}

/* The host's list (ideas batch: shell): the games this room can start now
   first, «تنفع دلوقتي (N)», and the rest folded under «محتاجين ناس أكتر (N) ▾»,
   under the home's section heads (tvHubGroupOf) once opened. Nothing is taken
   away; a family opened (chess's ways) is one list as before. */
let roomHubMoreOpen = false;

function roomHubPosterHtml(tile, state, t) {
  const count = state.players.length;
  const g = tile.g;
  const off = !tile.open && typeof roomGameIsOff === 'function' && roomGameIsOff(g.id);
  const enough = count >= tile.min && !off;
  const cat = (typeof CATALOG_BY_ID !== 'undefined' && CATALOG_BY_ID[g.id]) || null;
  const isF2F = !!(cat && cat.faceToFace);
  const showHint = roomHubLocation === 'apart' && isF2F;
  const hint = showHint ? (t.room_hub_facetoface || 'أحسن وانتوا مع بعض') : '';
  // A tile the room can't start yet says how many more it needs, in words.
  const need = !enough ? (t.room_need_more ? t.room_need_more.replace('{n}', String(tile.min - count)) : `${tile.min}+`) : '';
  const badge = off ? gameOffBadge(t) : need ? `<div class="game-card__need">${escapeHTML(need)}</div>` : '';
  const hintEl = hint ? `<div class="game-card__hint">${escapeHTML(hint)}</div>` : '';
  return `
            <button type="button" class="game-card room-poster ${enough ? '' : 'is-disabled'} ${off ? 'is-off' : ''} ${tile.open ? 'room-poster--family' : ''}" data-accent="${g.accent}"
                 ${off ? 'onclick="gameOffToast()" aria-disabled="true"' : enough ? (tile.open ? `onclick="roomHubOpen('${tile.open}')"` : `onclick="roomAct('chooseGame', { game: '${g.id}' })"`) : 'aria-disabled="true"'}>
              <span class="game-icon" aria-hidden="true">${iconHtml(g.icon)}</span>
              <span class="game-title">${escapeHTML(roomHubTileName(tile, t))}</span>
              ${hintEl}
              ${badge}
            </button>`;
}

function roomHubListHtml(state, t) {
  const grid = (list) => `<div class="game-grid room-posters">${list.map(x => roomHubPosterHtml(x, state, t)).join('')}</div>`;
  if (roomHubSearch.trim() && !roomHubGroup) {
    const hits = roomGameHits(roomHubSearch).map(g => ({ g: g, min: g.min, open: '' }));
    return hits.length ? grid(hits) : `<div class="empty room-search__none">${escapeHTML(t.home_empty || '')}</div>`;
  }
  const tiles = roomHubTiles();
  if (roomHubGroup) return grid(tiles);
  const count = state.players.length;
  const ready = tiles.filter(x => count >= x.min && !(!x.open && typeof roomGameIsOff === 'function' && roomGameIsOff(x.g.id)));
  const rest = tiles.filter(x => ready.indexOf(x) === -1);
  let more = '';
  if (rest.length) {
    // Nothing playable yet (one person, every game needs two): the rest is the list, open.
    const open = roomHubMoreOpen || !ready.length;
    more = `
      <details class="room-hub-more" ${open ? 'open' : ''} data-r="${open ? 1 : 0}" ontoggle="roomHubMoreToggled(this)">
        <summary class="room-hub-more__head">
          <span>${escapeHTML(t.room_hub_more || '')} <span class="room-hub-count metric">(${rest.length})</span></span>
          <span class="room-hub-more__chev" aria-hidden="true">▾</span>
        </summary>
        <div class="room-hub-more__body">${roomGameSectionsHtml(rest, grid, t)}</div>
      </details>`;
  }
  // What can start now, under the same section heads, so a long list reads by kind.
  const now = ready.length ? `
      <h3 class="room-hub-now"><span aria-hidden="true">✅</span> ${escapeHTML(t.room_hub_now || '')} <span class="room-hub-count metric">(${ready.length})</span></h3>
      ${roomGameSectionsHtml(ready, grid, t)}` : '';
  return now + more;
}

function roomHubMoreToggled(el) {
  // A details drawn open fires its toggle too: only a tap on it is a choice.
  const now = el.open ? '1' : '0';
  if (el.dataset.r === now) return;
  el.dataset.r = now;
  roomHubMoreOpen = !!el.open;
  haptic('light');
  if (el.open && typeof motionOff === 'function' && !motionOff()) {
    const body = el.querySelector('.room-hub-more__body');
    if (body && body.animate) body.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 240, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

/** The game picker. Everyone sees it; only the host can act on it. */
function renderRoomHub(state) {
  const t = TRANSLATIONS[appState.lang];
  const count = state.players.length;
  const night = roomNightBoardHtml(state, t);

  if (!state.youAreHost) {
    return `<div class="waiting-note">${t.room_hub_wait || 'المضيف يختار اللعبة…'}</div>${night}`;
  }

  const chips = `
    <div class="filter-row hscroll-fade" role="group">
      <button type="button" class="filter-chip filter-chip--sm ${roomHubLocation === 'together' ? 'is-active' : ''}"
              onclick="setRoomHubLocation('together')">
        <span aria-hidden="true">🛋️</span>${escapeHTML(t.flt_location_together || 'مع بعض')}
      </button>
      <button type="button" class="filter-chip filter-chip--sm ${roomHubLocation === 'apart' ? 'is-active' : ''}"
              onclick="setRoomHubLocation('apart')">
        <span aria-hidden="true">🌍</span>${escapeHTML(t.flt_location_apart || 'كل واحد في مكان')}
      </button>
    </div>`;

  return `
    ${roomProgramDoorHtml(state, t)}
    <div class="section">
      <div class="section__head">
        <h2 class="section__title">${t.room_pick_game || 'اختر لعبة'}</h2>
        <span class="section__rule"></span>
      </div>
      ${roomHubGroup ? roomHubBackHtml(t, false) : roomGameSearchHtml('room-hub-search', roomHubSearch, 'setRoomHubSearch', t) + chips}
      <div id="room-hub-list">${roomHubListHtml(state, t)}</div>
    </div>
    ${night}`;
}

/* برنامج السهرة's door: the host's card at the top of the room's list. The builder
   itself is the program's chunk (JS_RoomProgram.html), fetched on the tap. */
function roomProgramDoorHtml(state, t) {
  if (!state.youAreHost || roomHubGroup) return '';
  let n = 0;
  try { n = (JSON.parse(localStorage.getItem('ashryProgramDraft_v1') || '[]') || []).length; } catch (e) { n = 0; }
  const sub = n ? String(t.prog_door_last || '').replace('{n}', String(n)) : (t.prog_door_hint || '');
  return `
    <button type="button" class="prog-door" onclick="roomOpenProgram()">
      <span class="prog-door__icon" aria-hidden="true">🌙</span>
      <span class="prog-door__text">
        <span class="prog-door__title">${escapeHTML(t.prog_title || '')}</span>
        <span class="prog-door__sub">${escapeHTML(sub)}</span>
      </span>
      <span class="prog-door__chev" aria-hidden="true">›</span>
    </button>`;
}
/* 🕵️ المهمة السرية: not a game from the list but a switch on the room, running beside every
   game (RoomMission.js). Its page is the chunk 'mission' (JS_RoomMission.html, with Missions.js),
   loaded as soon as a state carries it; before that, the host's door is drawn from here. */
function roomMissionSlotHtml(state, tv) {
  if (!state || (state.youAreScreen && !(tv && state.youAreHost))) return '';
  if (typeof missionLobbyHtml === 'function') return missionLobbyHtml(state, tv);
  const m = state.mission;
  if (m && (m.on || m.phase === 'reveal')) return '';       // the chunk is on its way; drawn when it lands
  return roomMissionDoorHtml(state, TRANSLATIONS[appState.lang] || {});
}
function roomMissionDoorHtml(state, t) {
  if (!state.youAreHost) return '';
  return `
    <button type="button" class="msn-door" onclick="roomOpenMission()" aria-pressed="false">
      <span class="msn-door__icon" aria-hidden="true">🕵️</span>
      <span class="msn-door__text">
        <b>${escapeHTML(t.mission_title || '')}</b>
        <small>${escapeHTML(t.mission_door_off || '')}</small>
      </span>
      <span class="msn-door__toggle" aria-hidden="true"><i></i></span>
    </button>`;
}
function roomOpenMission() {
  if (typeof lzRun === 'function') lzRun('mission', () => missionOpenSetup());
  else if (typeof missionOpenSetup === 'function') missionOpenSetup();
}
/* Every state (on any screen of the app, during any game): the chunk when the room has a mission, then its sync. */
Room.onChange((state) => {
  const m = state && state.mission;
  const wanted = !!(m && (m.on || m.phase === 'reveal'));
  if (wanted && typeof lzWait === 'function' && lzWait(['mission'], () => {
    const st = Room.state;
    if (!st) return;
    if (typeof missionSync === 'function') missionSync(st);
    if (appState.currentView === 'room-lobby' && st.phase === 'lobby' && !st.youAreScreen) renderRoomLobby(st);
    if (st.youAreScreen && typeof renderRoomTv === 'function' && onRoomView()) renderRoomTv(st);
  }, 'mission')) return;
  if (typeof missionSync === 'function') missionSync(state);
});

function roomOpenProgram() {
  if (typeof lzRun === 'function') lzRun('program', () => progOpenBuilder());
  else if (typeof progOpenBuilder === 'function') progOpenBuilder();
}

/** Once a game is chosen: its own options, plus a way back to the hub. A game's `lobbyTop(state)`
    is drawn above the folded options for everyone: what the whole table does there (أونو's teams). */
function renderChosenGame(state, game) {
  const t = TRANSLATIONS[appState.lang];
  const entry = ROOM_HUB_GAMES.find(g => g.id === state.game);
  const name = entry ? (t[entry.key] || state.game) : state.game;
  const options = (game && game.lobbyOptions) ? game.lobbyOptions(state) : '';
  const bots = roomBotControlsHtml(state);

  let firstPlay = '';
  if (!state.youAreScreen) {
    const helpKey = (typeof firstPlayKey === 'function')
      ? firstPlayKey(state.game, true)
      : (((typeof ROOM_HELP_KEY !== 'undefined' && ROOM_HELP_KEY[state.game])
          || (typeof HELP_FOR_VIEW !== 'undefined' && HELP_FOR_VIEW['room-' + state.game])
          || state.game));
    if (typeof firstPlayCardHtml === 'function') {
      firstPlay = firstPlayCardHtml(helpKey, true);
    }
  }

  return `
    <div class="chosen-game" data-accent="${entry && entry.accent ? entry.accent : 'violet'}">
      <span class="chosen-game__icon" aria-hidden="true">${entry ? iconHtml(entry.icon) : '🎮'}</span>
      <span class="chosen-game__name">${name}</span>
      ${state.youAreHost
        ? `<button class="btn btn--ghost btn--xs btn--auto" onclick="roomAct('backToHub')">${t.room_change_game || 'تغيير'}</button>`
        : ''}
    </div>
    ${firstPlay}
    ${game && game.lobbyTop ? game.lobbyTop(state, false) : ''}
    ${bots}
    ${game && game.lobbyTop ? game.lobbyTop(state) : ''}
    ${lobbyOptionsFold(state, options, t)}
    ${(game && game.lobbySeats) ? game.lobbySeats(state) : ''}`;
}

/* The host's options for the chosen game, folded under «⚙️ إعدادات اللعبة
   (محفوظة) ▾» with a line of what is chosen (the owner, 26 Sep 2026): they are
   remembered on the host's phone anyway, and every option above the Start was
   scrolled past before every game. Open by default only the first time this
   phone hosts the game; the games whose options are where the table is seated
   (sides, seats, colours) are never folded. Nothing is removed: a tap opens it. */
const LOBBY_OPTS_UNFOLDED = { codenames: 1, domino: 1, ludo: 1, snakes: 1, chess4: 1, handbrain: 1, votechess: 1, bank: 1 };
const lobbyOptsOpen = {};

function lobbyOptionsFold(state, options, t) {
  const g = ROOM_GAMES[state.game];
  if (!options || !state.youAreHost || LOBBY_OPTS_UNFOLDED[state.game] || (g && g.lobbyUnfolded && g.lobbyUnfolded(state))) return options;
  const seen = recallOptions('lobbyOptsSeen', {});
  const open = lobbyOptsOpen[state.game] !== undefined ? lobbyOptsOpen[state.game] : !seen[state.game];
  return `
    <details class="lobby-opts" ${open ? 'open' : ''} data-r="${open ? 1 : 0}" ontoggle="lobbyOptsToggled(this, '${jsStringAttr(state.game)}')">
      <summary class="lobby-opts__head">
        <span class="lobby-opts__title">⚙️ ${escapeHTML(t.room_opts_title || '')}</span>
        <span class="lobby-opts__sum"></span>
        <span class="lobby-opts__chev" aria-hidden="true">▾</span>
      </summary>
      <div class="lobby-opts__body">${options}</div>
    </details>`;
}

function lobbyOptsToggled(el, game) {
  // A details drawn open fires its toggle too: only a tap on it is a choice.
  const now = el.open ? '1' : '0';
  if (el.dataset.r === now) return;
  el.dataset.r = now;
  lobbyOptsOpen[game] = !!el.open;
  if (el.open && typeof motionOff === 'function' && !motionOff()) {
    const body = el.querySelector('.lobby-opts__body');
    if (body && body.animate) body.animate([{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }
}

/** The folded options' one line: what is picked in them, read off the controls themselves. */
function lobbyOptsSummarise(root) {
  (root || document).querySelectorAll('.lobby-opts').forEach(box => {
    const body = box.querySelector('.lobby-opts__body');
    const out = box.querySelector('.lobby-opts__sum');
    if (!body || !out) return;
    const bits = [];
    body.querySelectorAll('.segmented').forEach(seg => {
      const on = seg.querySelector('.segmented__item.is-active');
      if (on) bits.push(on.textContent.trim().replace(/\s+/g, ' '));
    });
    body.querySelectorAll('select').forEach(sel => {
      const o = sel.options[sel.selectedIndex];
      if (o) bits.push(o.textContent.trim().replace(/\s+/g, ' '));
    });
    body.querySelectorAll('.filter-chip.is-active, .chip.is-active').forEach(c => bits.push(c.textContent.trim().replace(/\s+/g, ' ')));
    body.querySelectorAll('label.switch-row').forEach(row => {
      const input = row.querySelector('input[type=checkbox]');
      const label = row.querySelector('.switch-row__label, span');
      if (input && input.checked && label) bits.push(label.textContent.trim().replace(/\s+/g, ' '));
    });
    const text = bits.filter(Boolean).slice(0, 4).join(' · ');
    if (out.textContent !== text) out.textContent = text;
  });
}

/** The chunks a room needs: its game's, and every puzzle of a race's line-up (سباق ألغاز, «خماسي السهرة»). */
function roomChunksOf(state) {
  const ids = lzChunksOfRoom(state.game).slice();
  const s = state.shared || {};
  ((s.settings && s.settings.lineup) || s.lineup || []).forEach(g => lzChunksOfRoom(g).forEach(c => { if (ids.indexOf(c) === -1) ids.push(c); }));
  return ids;
}

/** Draws whatever the room is doing now: its lobby, a spectator note, or the game. */
function routeRoomState(state) {
  if (state && state.game && typeof lzWait === 'function' &&
      lzWait(roomChunksOf(state), () => { if (Room.state) routeRoomState(Room.state); }, 'route')) return;
  // برنامج السهرة (JS_RoomProgram.html, a chunk of its own): its code before anything of it is drawn.
  if (state && state.program && typeof lzWait === 'function' &&
      lzWait(['program'], () => { if (Room.state) routeRoomState(Room.state); }, 'route-prog')) return;
  if (state && state.program && typeof progPaintPill === 'function') progPaintPill(state);
  // A big screen draws every phase itself (JS_RoomTv.html).
  if (state.youAreScreen) {
    renderRoomTv(state);
    return;
  }
  // This device was the big screen a moment ago. Its frame uses the same
  // element ids as the phone screens, so it goes before they are drawn.
  if (typeof clearRoomTvView === 'function') clearRoomTvView();
  // Between two games of the night's program, and its finale: the program's own screen.
  if (typeof progInterlude === 'function' && progInterlude(state)) {
    progRender(state);
    return;
  }
  if (state.phase === 'lobby') {
    if (appState.currentView !== 'room-lobby') setView('room-lobby');
    renderRoomLobby(state);
    return;
  }
  // Joined after this round was dealt: watch, don't break the game. A game
  // whose latecomers simply join the line (the duels: winner stays on) draws
  // them itself.
  if (state.inGame === false && !(ROOM_GAMES[state.game] && ROOM_GAMES[state.game].lateJoin)) {
    renderRoomSpectator(state);
    return;
  }
  const game = ROOM_GAMES[state.game];
  if (game && game.render) {
    game.render(state);
    roomScrollToAction(state, game);
  }
}

let roomActionSeen = null;

/**
 * Each new step of a room game is drawn from the top of the screen. A phone
 * is scrolled down to the answer box, its hand or the last button it pressed
 * when the round closes, and the podium, the reveal and the next card are all
 * drawn at the top; nobody should have to swipe up to find out what happened
 * (the owner, 17 Sep 2026). The key is the phase and whatever names the step
 * inside it (the round, the player up, the deal); a presence tick or an
 * answer count changing is not a step. A game whose own screen manages its
 * scrolling (سكرو keeps your hand above the action bar) gives its own
 * `actionKey(state)` on its ROOM_GAMES entry: '' means leave it alone.
 */
function roomActionKey(state) {
  const s = state.shared || {};
  const plain = (v) => (v == null || typeof v === 'object') ? '' : String(v);
  // The voting games keep their phase on the room (state.phase) and the vote's own
  // (shared.vote.phase: open, closed - the results are drawn when it closes); most others in shared.phase.
  return [state.code, state.game, state.phase, s.dealId, s.phase, s.vote && s.vote.phase, s.results ? 'results' : '',
    s.round, s.step, s.turnId, s.subjectId, s.holderId, s.drawerId, s.turn, s.current, s.index].map(plain).join('|');
}

function roomScrollToAction(state, game) {
  const key = game && game.actionKey ? game.actionKey(state) : roomActionKey(state);
  if (key === roomActionSeen) return;
  const fresh = roomActionSeen === null;      // the screen was just opened: setView starts it at the top
  roomActionSeen = key;
  if (fresh || !key || typeof scrollToAction !== 'function') return;
  scrollToAction();
}

/**
 * A room with a big screen has one voice: the TV's. A cue every phone would
 * play at the same moment (a tick, a fanfare, the letter landing) is the TV's
 * job — eight phones playing it 200ms apart is an echo, and the table mutes
 * them. Anything personal (your turn, your answer, your buzz) still sounds on
 * the phone that it belongs to.
 */
function roomHasScreen() {
  const s = Room.state;
  return !!(s && !s.youAreScreen && (s.screens || []).some(x => x.online));
}

function playRoomFx(name) {
  if (roomHasScreen()) return;
  playSound(name);
}

const onRoomView = () => (appState.currentView || '').indexOf('room-') === 0;

let roomStageSeen = '';
let roomClockStageSeen = '';

/**
 * The single place the room state reaches the UI.
 *
 * Someone who has stepped out of the room screens - to the menu, a timer, the
 * rules - is left where they are. Drawing the room would call setView and drag
 * them straight back, which is what every poll used to do. The banner keeps
 * them in touch; only a game actually starting is worth a nudge.
 */
Room.onChange((state) => {
  // First, before anything is drawn: the clocks of a deal the room has left.
  const clockStage = roomClockStage(state);
  if (clockStage !== roomClockStageSeen) {
    roomClockStageSeen = clockStage;
    stopRoomClocks();
  }
  updateRoomBanner();
  paintRoomHostAway(state);
  if (!state) { roomStageSeen = ''; roomActionSeen = null; return; }

  const stage = state.phase + '|' + (state.game || '');
  const moved = roomStageSeen !== '' && roomStageSeen !== stage;
  const wasInGame = roomStageSeen !== '' && roomStageSeen.indexOf('lobby|') !== 0;
  const prevGame = roomStageSeen.split('|')[1] || '';
  roomStageSeen = stage;

  if (!onRoomView()) {
    // Only a game dealt from the lobby: many games change phase inside a round
    // (night and day, reveal and vote), which used to buzz with this every time.
    if (moved && state.phase !== 'lobby' && !wasInGame) {
      const t = TRANSLATIONS[appState.lang] || {};
      showToast(t.room_started_away || 'اللعبة بدأت في الغرفة');
      haptic('light');
    }
    return;
  }
  // A game was just dealt from the lobby: the same moment on every phone.
  if (moved && state.phase !== 'lobby' && !wasInGame && typeof playRoomGameStart === 'function') playRoomGameStart(state);
  // The host took the room back to the hub (or on to another game) while this
  // phone was mid-round: say so, or the screen changing under them looks like a
  // fault. Not for "play again", which several games do through the lobby.
  if (moved && state.phase === 'lobby' && wasInGame && (!state.game || state.game !== prevGame) && !state.youAreHost && !state.program) {
    const t = TRANSLATIONS[appState.lang] || {};
    showToast(t.room_game_ended || '');
  }
  routeRoomState(state);
});

/** The banner's "return": back to whatever the room is doing now. */
function roomReturnToActive() {
  const state = Room.state;
  if (!Room.isIn || !state) return;
  // The hidden view still holds the frame from when they left. Drop its
  // signature so it is rebuilt from the current state rather than trusted.
  if (state.phase !== 'lobby' && state.game) {
    const view = document.getElementById('view-room-' + state.game);
    if (view) delete view.dataset.sig;
  }
  routeRoomState(state);
  updateRoomBanner();
}

/** The strip under the header while you are in a room but looking at something else. */
function updateRoomBanner() {
  const banner = document.getElementById('active-room-banner');
  if (!banner) return;
  const session = Room.session;
  if (!session || onRoomView()) {
    banner.classList.add('hidden');
    return;
  }

  const t = TRANSLATIONS[appState.lang] || {};
  const s = Room.state;
  banner.classList.remove('hidden');
  banner.setAttribute('aria-label', t.active_room_label || '');

  const codeEl = document.getElementById('arb-code');
  if (codeEl) codeEl.textContent = session.code || '';

  let desc;
  if (!s || s.phase === 'lobby' || !s.game) {
    desc = (t.room_in_lobby || '') + ' \u2022 \ud83d\udc65 ' + ((s && s.players) ? s.players.length : 1);
  } else {
    const entry = ROOM_HUB_GAMES.find(g => g.id === s.game);
    desc = (t.room_playing_status || '') + ': ' + (entry ? (iconText(entry.icon) ? iconText(entry.icon) + ' ' : '') + (t[entry.key] || entry.id) : s.game);
  }
  const descEl = document.getElementById('arb-desc');
  if (descEl) descEl.textContent = desc;

  const back = banner.querySelector('.arb__btn--return');
  if (back) back.title = t.room_return || '';
  const leave = banner.querySelector('.arb__btn--leave');
  if (leave) {
    leave.title = t.room_leave || '';
    leave.setAttribute('aria-label', leave.title);
  }
}

/**
 * Shown to someone who joined mid-round. They're already in the room and will
 * be dealt into the next game — this just keeps them from seeing a half-built
 * screen for a game they aren't holding cards in.
 */
function renderRoomSpectator(state) {
  if (appState.currentView !== 'room-lobby') setView('room-lobby');
  const t = TRANSLATIONS[appState.lang];
  const setup = document.getElementById('room-host-setup');
  const startBtn = document.getElementById('room-start-btn');
  const waitNote = document.getElementById('room-wait-note');

  // Lobby first: it rewrites the same nodes, so writing the spectator note
  // before it meant the note was replaced by the game picker straight away and
  // a mid-round joiner never saw why they were waiting. It leaves the setup
  // panel to the note below.
  renderRoomLobby(state, { spectator: true });

  if (startBtn) startBtn.classList.add('hidden');
  if (waitNote) waitNote.classList.add('hidden');
  if (setup) {
    const html = `<div class="waiting-note">
        <span class="animate-pulse">⏳</span> ${t.room_spectating || 'جولة جارية — ستنضم في الجولة القادمة'}
      </div>`;
    if (setup.dataset.sig !== html) { setup.innerHTML = html; setup.dataset.sig = html; }
  }
}

/**
 * Asks for the player's name in a sheet rather than window.prompt(), which is
 * blocked in some embedded contexts — including the one this app is served in.
 */
let nameModalResolve = null;

function promptForName() {
  return new Promise(resolve => {
    nameModalResolve = resolve;
    const input = document.getElementById('name-modal-input');
    const modal = document.getElementById('name-modal');
    if (!input || !modal) { resolve(''); return; }

    input.value = roomName.get();
    modal.classList.remove('hidden');
    setTimeout(() => { input.focus(); input.select(); }, 320);
  });
}

function submitNameModal() {
  const input = document.getElementById('name-modal-input');
  const value = (input.value || '').trim().slice(0, 24);
  if (!value) { showToast(TRANSLATIONS[appState.lang].name_needed || 'اكتب اسمك', 'error'); return; }
  closeModal('name-modal');
  const done = nameModalResolve;
  nameModalResolve = null;
  if (done) done(value);
}

/** Settings → your name: change the name rooms use without joining one. */
async function changeSavedName() {
  closeModal('settings-modal');
  const name = await promptForName();
  if (!name) return;
  roomName.set(name);
  showToast((TRANSLATIONS[appState.lang] || {}).name_saved || 'تم حفظ الاسم', 'success');
}

function cancelNameModal() {
  closeModal('name-modal');
  const done = nameModalResolve;
  nameModalResolve = null;
  if (done) done('');
}

/* --- boot ---------------------------------------------------------------- */

/**
 * On load: honour a scanned ?room= link first, otherwise silently rejoin
 * whatever room this device was last in.
 */
async function initRooms() {
  const injected = (window.SERVER_DATA && window.SERVER_DATA.room) || '';
  if (injected) {
    // Nothing is resumed yet on load, so Room.isIn is still false here: read
    // the saved session itself.
    const code = extractRoomCode(injected);
    const saved = Room.saved;
    if (saved && saved.code === code) {
      // The link to the room this phone is already in: straight back into it.
      const resumed = await Room.resume();
      if (resumed && Room.state) { routeRoomState(Room.state); updateRoomBanner(); return; }
      // Kept but not reached yet (no network): the banner is the way back.
      if (Room.isIn) { updateRoomBanner(); return; }
    } else if (saved) {
      // A different room: leave the old one properly, so it doesn't keep a
      // seat (and a host) for a phone that has moved on. The saved session is
      // forgotten at once; the request itself needn't hold up the join screen.
      Room.leaveSaved();
    }
    roomOpenJoin(injected);
    return;
  }
  const resumed = await Room.resume();
  // Reloaded on a room screen: draw it. Anywhere else, stay put - the banner
  // is the way back.
  if (resumed && Room.state && onRoomView()) routeRoomState(Room.state);
  updateRoomBanner();
}

/**
 * The host's "move on" button waits 40 seconds for a phone that is there but
 * quiet, and with no clock nothing is pushed meanwhile: so when a wait starts
 * (`local.since`), a redraw is set for when it ends. The TV's frame is rebuilt
 * only on a new signature, so its signature is dropped first. Shared by
 * المشنقة, the solve rooms and خمّن مين; cleared with the room's clocks.
 */
function roomQuietRedraw(local, game) {
  clearTimeout(local.quietTimer);
  local.quietTimer = setTimeout(() => {
    const st = typeof Room !== 'undefined' ? Room.state : null;
    if (!st || st.game !== game || !roomCanMoveOn(st)) return;
    if (st.youAreScreen) {
      if (appState.currentView !== 'room-tv') return;
      const tv = document.getElementById('view-room-tv');
      if (tv) delete tv.dataset.sig;
    } else if (!onRoomView()) return;
    routeRoomState(st);
  }, 40500);
}
function roomQuietStop(local) { clearTimeout(local.quietTimer); local.quietTimer = null; }
</script>
